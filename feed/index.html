<style>
:root{--ink:#101b2d;--mute:#566375;--line:#dde4ec;--soft:#f4f7fa;--accent:#9b2c12;--star:#b7791f;--sans:"Schibsted Grotesk",Helvetica,Arial,sans-serif;--serif:Literata,Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 var(--sans)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:48px}
header.top{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line);padding-bottom:18px}
h1{font:700 28px/1.1 var(--sans);margin:0;letter-spacing:-.01em}
.sub{color:var(--mute);margin:6px 0 0;font-size:14px}
.back{font-size:14px;color:var(--mute);text-decoration:none}
.back:hover{color:var(--ink)}
aside{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow:auto;padding-right:4px}
aside h2{font:600 13px/1 var(--sans);color:var(--mute);margin:26px 0 10px}
aside h2:first-child{margin-top:0}
.brief{background:var(--soft);border-radius:6px;padding:14px 16px}
.brief b{display:block;font:700 30px/1 var(--sans);letter-spacing:-.02em}
.brief span{color:var(--mute);font-size:13px}
.nav button{display:flex;justify-content:space-between;width:100%;padding:6px 10px;border-radius:4px;text-align:left}
.nav button:hover{background:var(--soft)}
.nav button[aria-pressed=true]{background:var(--ink);color:#fff}
.nav small{opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}
.chip[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff}
.people button{display:flex;justify-content:space-between;align-items:baseline;width:100%;padding:5px 0;text-align:left;border-bottom:1px solid var(--line);gap:8px}
.people button:hover .pn{text-decoration:underline}
.people button[aria-pressed=true] .pn{color:var(--accent);font-weight:600}
.pw{color:var(--mute);font-size:12px}
.pc{font-size:12px;color:var(--mute);min-width:1.5em;text-align:right}
.pc.on{color:var(--accent);font-weight:700}
.tools button,.tools a{display:block;font-size:13px;color:var(--mute);padding:3px 0;text-decoration:none}
.tools button:hover,.tools a:hover{color:var(--ink);text-decoration:underline}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.bar input[type=search]{flex:1 1 260px;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{padding:7px 11px;font-size:13px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
select{font:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
.count{color:var(--mute);font-size:13px;margin:10px 0 0}
.day{font:600 13px/1 var(--sans);color:var(--mute);margin:30px 0 4px;padding-bottom:8px;border-bottom:1px solid var(--ink)}
ol{list-style:none;margin:0;padding:0}
li.p{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
li.p.cur{box-shadow:inset 3px 0 0 var(--accent);background:linear-gradient(90deg,var(--soft),transparent 60%)}
li.p.done{opacity:.45}
.rel{display:flex;flex-direction:column-reverse;gap:2px;align-self:start;width:18px;margin-top:7px}
.rel i{display:block;height:4px;border-radius:1px;background:var(--line)}
.rel i.on{background:var(--ink)}
.t{font:600 17px/1.35 var(--sans);text-decoration:none}
.t:hover{text-decoration:underline}
.m{font-size:13px;color:var(--mute);margin-top:5px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.tag{border:1px solid var(--line);border-radius:3px;padding:0 6px;font-size:12px;color:var(--ink)}
.w{background:#fbeee8;color:var(--accent);border-radius:3px;padding:0 6px;font-size:12px;font-weight:600}
.au{font-size:13px;color:var(--mute);margin-top:4px}
.au mark{background:none;color:var(--accent);font-weight:600}
.ab{font:15px/1.65 var(--serif);margin:10px 0 0;max-width:72ch;display:none}
li.open .ab{display:block}
.act{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:13px}
.act button,.act a{color:var(--mute);text-decoration:none}
.act button:hover,.act a:hover{color:var(--ink);text-decoration:underline}
.act .st[aria-pressed=true]{color:var(--star);font-weight:600}
.empty{padding:50px 0;color:var(--mute);font:16px/1.6 var(--serif)}
.keys{margin-top:36px;color:var(--mute);font-size:12px}
kbd{font:12px var(--sans);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:860px){.wrap{grid-template-columns:1fr;gap:20px}aside{position:static;max-height:none}.keys{display:none}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

  <header class="top">
    <div>
      <h1>Reading desk</h1>

    <a class="back" href="../">Back to site</a>

    <h2>People to watch</h2>
    <div class="people" id="people"></div>

    <h2>Starred papers</h2>
    <div class="tools">
      <button id="bib">Download BibTeX for Zotero</button>
      <button id="md">Copy as reading notes</button>
      <button id="backup">Back up stars and reads</button>
      <button id="restore">Restore from backup</button>

      <div class="seg" id="sort" role="group" aria-label="Sort order"></div>

    <div id="list"></div>
    <p class="keys"><kbd>j</kbd> <kbd>k</kbd> move, <kbd>a</kbd> abstract, <kbd>s</kbd> star, <kbd>x</kbd> mark read, <kbd>o</kbd> open, <kbd>/</kbd> search. Stars and reads are saved in this browser only; use backup to move them.</p>
  </main>
</div>

<script id="data" type="application/json">{"updated": "2026-11-23T21:25+00:00", "topics": ["Downscaling", "Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "people": [{"name": "Niklas Boers", "where": "TUM / PIK"}, {"name": "Tom Beucler", "where": "UNIL"}, {"name": "Pierre Gentine", "where": "Columbia"}, {"name": "Laure Zanna", "where": "NYU"}, {"name": "Veronika Eyring", "where": "DLR / Bremen"}, {"name": "Stephan Rasp", "where": "Google Research"}, {"name": "Sebastian Lerch", "where": "KIT / Marburg"}, {"name": "Jakob Runge", "where": "TU Dresden / DLR"}, {"name": "Henry Addison", "where": "Bristol"}, {"name": "Markus Reichstein", "where": "MPI Jena"}], "items": [{"key": "arxiv:2611.27641", "title": "Beyond Resolution: Inference-Time Parameterized Temporal Consistency in Generative Regional Climate Downscaling", "summary": "GCM-to-RCM downscaling emulation is dominated by generative diffusion models, but most existing work evaluates skill only per timestep, treating each field as an independent snapshot. This leaves open whether generated sequences are temporally coherent or merely independently plausible, a gap that matters increasingly for sub-daily resolutions since downstream impacts depend on accumulation and persistence, not just on isolated states. This study asks whether autoregressive conditioning can deliver coherent rollouts without error accumulation and ensemble-spread collapse, and whether a single model can expose the resulting coherence-diversity trade-off as a controllable inference choice rather than a fixed design commitment. We introduce a noise-conditioned teacher-forcing training scheme conditioning a diffusion U-Net downscaling model on a noised previous high-resolution state, so the trained model interpolates continuously between autoregressive (AR) and per-timestep independent (PTI) sampling via one noise parameter. We apply the scheme to an hourly, European-domain historical simulation downscaling AWI-CM1 (1$^\\circ$) with ICON (0.11$^\\circ$, regridded to 0.25$^\\circ$) for precipitation and 2-meter temperature. The noise parameter traces a smooth interpolation between ICON's autocorrelation and PTI generation. AR rollouts of up to six months show no progressive degradation, with ensemble spread contracting only slightly within the first 24 hours. In contrast, the same architecture trained on noise-free previous states diverges. For precipitation PTI underestimates maxi", "link": "https://arxiv.org/abs/2611.27641", "authors": "Luca Glawion, Julius Polz, Harald Kunstmann, Benjamin Fersch, Patrick Ludwig, Antonio Sánchez-Benítez", "source": "arXiv", "published": "2026-11-20T14:05:14Z", "first_seen": "2026-11-23T14:47:49+00:00", "score": 14, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "diffusion model*"]}, {"key": "doi:10.1017/eds.2025.10016", "title": "A physics-informed machine learning parameterization for cloud microphysics in ICON", "summary": "We developed a cloud microphysics parameterization for the icosahedral nonhydrostatic modeling framework (ICON) model based on physics-informed machine learning (ML). By training our ML model on high-resolution simulation data, we enhance the representation of cloud microphysics in Earth system models (ESMs) compared to traditional parameterization schemes, in particular by considering the influence of high-resolution dynamics that are not resolved in coarse ESMs. We run a global, kilometer-scale ICON simulation with a one-moment cloud microphysics scheme, the complex graupel scheme, to generate 12 days of training data. Our ML approach combines a microphysics trigger classifier and a regression model. The microphysics trigger classifier identifies the grid cells where changes due to the cloud microphysical parameterization are expected. In those, the workflow continues by calling the regression model and additionally includes physical constraints for mass positivity and water mass conservation to ensure physical consistency. The microphysics trigger classifier achieves an F1 score of 0.93 on classifying unseen grid cells. The regression model reaches an $ {R}^2 $ score of 0.72 averaged over all seven microphysical tendencies on simulated days used for validation only. This results in a combined offline performance of 0.78. Using explainability techniques, we explored the correlations between input and output features, finding a strong alignment with the graupel scheme and, hence, physical understanding of cloud microphysical processes. This parameterization provides the fo", "link": "https://doi.org/10.1017/eds.2025.10016", "authors": "Ellen Sarauer, Mierk Schwabe, Philipp Weiss, Axel Lauer, Philip Stier, Veronika Eyring", "source": "Environmental Data Science", "published": "2025", "first_seen": "2026-11-23T14:47:49+00:00", "score": 14, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": ["Veronika Eyring"], "boosts": []}, {"key": "doi:10.1029/2024jd041010", "title": "Climatology of Orographic Precipitation Gradients Over High Mountain Asia Derived From Dynamical Downscaling", "summary": "Within High Mountain Asia (HMA), the annual melting of glaciers and snowpack provides vital freshwater to populations living downstream. Precipitation over HMA can directly affect the freshwater availability in this region by altering the mass balance of glaciers and snowpack. However, available reanalyses and downscaling simulations lack the resolution required to understand important glacier‐scale variations in precipitation. This study aimed to determine the current characteristics of orographic precipitation gradients (OPG) by curve‐fitting daily precipitation as a function of elevation from a 15‐year, 4‐km grid spaced Weather Research and Forecasting (WRF) model simulation focused on the Himalayan, Karakoram, and Hindu‐Kush mountain ranges. To facilitate precipitation curve‐fitting, the WRF model grid points were separated into regions of similar orientation, referred to as facets. Akaike Information Criterion‐corrected values and an F ‐test p ‐value identified the need for a curvature term to account for a varying OPG with elevation. Regions with similar seasonal variability were found using ‐means clustering of the monthly mean OPG coefficients. The central Himalayan slope's intra‐seasonal variability of OPG depended on synoptic scale conditions, in which cyclonically‐forced heavy‐precipitation events produced strong sublinear increases in precipitation with elevation. Initial testing of precipitation estimates using monthly coefficients showed promising results in downscaling daily WRF precipitation; the daily mean absolute error at each grid point had a lower magni", "link": "https://doi.org/10.1029/2024jd041010", "authors": "S. Wolvin, C. Strong, S. Rupper, W. J. Steenburgh", "source": "JGR: Atmospheres", "published": "2024-10-26", "first_seen": "2026-11-23T14:47:49+00:00", "score": 12, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["himalaya*", "precipitation"]}, {"key": "doi:10.5194/gmd-19-11149-2026", "title": "Enhancing data-driven weather forecasting via gated relative position encoding and spatial-aware feed-forward network", "summary": "Transformer-based weather forecasting models often use static positional encodings, limiting their representation of flow-dependency and geographical heterogeneity. We introduce Gated Relative Position Encoding (GRPE) to address these limitations. Gating mechanism has recently been applied in data-driven weather forecasting, but its specific contribution remains insufficiently understood. We propose Spatial-Aware Feed-Forward Network (SAFN) to explore this question. GRPE constructs dynamic positional biases through a gated linear combination of learnable prototypes, allowing spatial relationships to vary with location and atmospheric state. SAFN combines depth-wise convolutions, multiplicative gating, and a learnable global positional bias to represent spatial feature interactions and persistent geographical influences. We integrate both components into the Neighborhood Attention Transformer for Atmospheric prediction (AtmoNAT), a global forecasting model with 43.4 million parameters trained on ERA5 reanalysis at 1.5° spatial resolution and 12 h temporal intervals. Evaluations using WeatherBench 2 metrics show that AtmoNAT's deterministic forecasts outperform the ensemble-mean forecasts of several other coarse-resolution models across most key variables at lead times up to 72 h. Over global land areas, AtmoNAT also outperforms several models trained at 0.25° resolution, including FuXi and GraphCast, for 10 m winds and 700 hPa specific humidity at lead times up to 120 h. Ablation experiments show that GRPE and SAFN each reduce root mean square errors by approximately 5 %–10 ", "link": "https://doi.org/10.5194/gmd-19-11149-2026", "authors": "Leyi Wang, Duo Zhang, Jerry Zhijian Yang, Baoxiang Pan, Dazhi Xi, Xiaoyu Huang", "source": "Geoscientific Model Development", "published": "2026-11-23", "first_seen": "2026-11-23T14:47:49+00:00", "score": 10, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": []}, {"key": "doi:10.1029/2022ms003426", "title": "Systematic Bias Correction in Ocean Mesoscale Forecasting Using Machine Learning", "summary": "The ocean circulation is modulated by meandering currents and eddies. Forecasting their evolution is a key target of operational models, but their forecast skill remains limited. We propose a machine learning approach that improves the output of an ocean circulation model by learning and predicting its systematic biases. This method can be applied a priori to any region, and is tested in the Gulf of Mexico, where the Loop Current (LC) and the large anticyclonic eddies that detach from it are major forecasting targets. The LC dynamics are recurrent and lie on a low‐dimensional dynamical attractor. Building upon the information gained analyzing this low dimensional attractor, we improve the representation of sea surface anomalies in model outputs through information from satellite altimeter data using a Sequence‐to‐Sequence model, which is a special class of Recurrent Neural Network. Building upon the HYCOM‐NCODA analysis system, we deliver a correction to the forecast at the observation resolution. For at least 15 days the proposed method learns to forecast the systematic bias in the HYCOM‐NCODA, outperforming persistence, and improving the forecast. This data‐driven approach is fast and can be implemented as an added step to any dynamical hindcasting or forecasting model. It offers an interesting avenue for further developing hybrid modeling tools. In these tools, fundamental physical conservations are preserved through the integration of partial differential equations which obey them. In addition, the method highlights specific deficiencies of the hindcast system that dese", "link": "https://doi.org/10.1029/2022ms003426", "authors": "Guangpeng Liu, Annalisa Bracco, Julien Brajard", "source": "Journal of Advances in Modeling Earth Systems", "published": "2023-11", "first_seen": "2026-11-23T14:47:49+00:00", "score": 10, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": []}, {"key": "doi:10.1029/2018ea000426", "title": "High‐Resolution Climate Projections for the Northeastern United States Using Dynamical Downscaling at Convection‐Permitting Scales", "summary": "To paraphrase former Speaker of the House Tip O'Neill, “All climate change is local”—that is, society reacts most immediately to changes in local weather such as regional heat waves and heavy rainstorms. Such phenomena are not well resolved by the current generation of coupled climate models. Here it is shown that dynamical downscaling of climate reanalyses using a high‐resolution regional model can reproduce both the means and extremes of temperature and precipitation as observed in the well‐measured northeastern United States. Given this result, the downscaling is applied to climate projections for the middle and end of the 21st century under Representative Concentration Pathway (RCP) 8.5 as well as for the historical time period to help assess regional climate impacts in the northeastern United States. The resulting high‐resolution projections are intended to support regional sustainability studies for the northeastern United States and are made publicly available.", "link": "https://doi.org/10.1029/2018ea000426", "authors": "M. Komurcu, K. A. Emanuel, M. Huber, R. P. Acosta", "source": "Earth and Space Science", "published": "2018-11", "first_seen": "2026-11-23T14:47:49+00:00", "score": 10, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1038/s41612-023-00486-0", "title": "Downscaling and bias-correction contribute considerable uncertainty to local climate projections in CMIP6", "summary": "Efforts to diagnose the risks of a changing climate often rely on downscaled and bias-corrected climate information, making it important to understand the uncertainties and potential biases of this approach. Here, we perform a variance decomposition to partition uncertainty in global climate projections and quantify the relative importance of downscaling and bias-correction. We analyze simple climate metrics such as annual temperature and precipitation averages, as well as several indices of climate extremes. We find that downscaling and bias-correction often contribute substantial uncertainty to local decision-relevant climate outcomes, though our results are strongly heterogeneous across space, time, and climate metrics. Our results can provide guidance to impact modelers and decision-makers regarding the uncertainties associated with downscaling and bias-correction when performing local-scale analyses, as neglecting to account for these uncertainties may risk overconfidence relative to the full range of possible climate futures.", "link": "https://doi.org/10.1038/s41612-023-00486-0", "authors": "David C. Lafferty, Ryan L. Sriver", "source": "npj Climate and Atmospheric Science", "published": "2023-9-30", "first_seen": "2026-11-23T14:47:49+00:00", "score": 10, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "extreme*", "uncertainty"]}, {"key": "doi:10.5194/gmd-17-7285-2024", "title": "Selecting CMIP6 global climate models (GCMs) for Coordinated Regional Climate Downscaling Experiment (CORDEX) dynamical downscaling over Southeast Asia using a standardised benchmarking framework", "summary": "Downscaling global climate models (GCMs) provides crucial high-resolution data needed for informed decision-making at regional scales. However, there is no uniform approach to select the most suitable GCMs. Over Southeast Asia (SEA), observations are sparse and have large uncertainties, complicating GCM selection especially for rainfall. To guide this selection, we apply a standardised benchmarking framework to select CMIP6 GCMs for dynamical downscaling over SEA, addressing current observational limitations. This framework identifies fit-for-purpose models through a two-step process: (a) selecting models that meet minimum performance requirements in simulating the fundamental characteristics of rainfall (e.g. bias, spatial pattern, annual cycle and trend) and (b) selecting models from (a) to further assess whether key precipitation drivers (monsoon) and teleconnections from modes of variability are captured, i.e. the El Niño–Southern Oscillation (ENSO) and Indian Ocean Dipole (IOD). GCMs generally exhibit wet biases, particularly over the complex terrain of the Maritime Continent. Evaluations from the first step identify 19 out of 32 GCMs that meet our minimum performance expectations in simulating rainfall. These models also consistently capture atmospheric circulations and teleconnections with modes of variability over the region but overestimate their strength. Ultimately, we identify eight GCMs meeting our performance expectations. There are obvious, high-performing GCMs from allied modelling groups, highlighting the dependency of the subset of models identified from t", "link": "https://doi.org/10.5194/gmd-17-7285-2024", "authors": "Phuong Loan Nguyen, Lisa V. Alexander, Marcus J. Thatcher, Son C. H. Truong, Rachael N. Isphording, John L. McGregor", "source": "Geoscientific Model Development", "published": "2024-10-14", "first_seen": "2026-11-23T21:25:47+00:00", "score": 10, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["india*", "monsoon", "cmip6", "precipitation"]}, {"key": "doi:10.1029/2022ms002995", "title": "Deep Learning Provides Substantial Improvements to County‐Level Fire Weather Forecasting Over the Western United States", "summary": "The recent wildfires in the western United States during 2018 and 2020 caused record‐breaking fire damage and casualties. Despite remarkable advances in fire modeling and weather forecasting, it remains challenging to anticipate catastrophic wildfire events and associated damage. One key missing component is a fire weather prediction system with sufficiently long lead time capable of providing useful regional details. Here, we develop a hybrid prediction model of wildfire danger called CFS with super resolution (CFS‐SR) as a proof of concept to fill that void. The CFS‐SR model is constructed by integrating the Climate Forecast System version 2 with a deep learning (DL) technique from Single Image Super Resolution, a method widely used in enhancing image resolution. We show that for the 2018–2019 fire season, the CFS‐SR model significantly improves accuracy in forecasting fire weather at lead times of up to 7 days with an enhanced spatial resolution up to 4 km. This level of high resolution provides county‐level fire weather forecast, making it more practical for allocating resources to mitigate wildfire danger. Our study demonstrates that a proper combination of ensemble climate predictions with DL techniques can boost predictability at finer spatial scales, increasing the utility of fire weather forecasts for practical applications.", "link": "https://doi.org/10.1029/2022ms002995", "authors": "Rackhun Son, Po‐Lun Ma, Hailong Wang, Philp J. Rasch, Shih‐Yu (Simon) Wang, Hyungjun Kim", "source": "Journal of Advances in Modeling Earth Systems", "published": "2022-10", "first_seen": "2026-11-23T21:25:47+00:00", "score": 10, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": []}, {"key": "doi:10.1029/2024jd041822", "title": "Enhancing Short‐Term Wind Speed Prediction Capability of Numerical Weather Prediction Through Machine Learning Methods", "summary": "Accurate forecasting of wind speed is essential for daily life and social production. While numerical weather prediction products are widely used, they rely on global data and mathematical models to solve atmospheric dynamics' equations, often failing to capture localized micrometeorological phenomena accurately. Factors such as surface conditions, land‐sea differences, and topography, particularly in coastal areas, further impact the accuracy of wind speed forecasts. This study presents a new method to enhance short‐term wind speed forecasting along China's coast by incorporating local and neighborhood spatiotemporal information. The approach integrates meteorological data from adjacent grid points as new inputs in the LightGBM, CatBoost, and XGBoost algorithms. Stacking ensemble technique is then employed to effectively combine with the aforementioned foundational models. Two sets of experiments are conducted: Experiments 1 exclude surrounding information, while Experiments 2 include it. Each set consists of five experiment groups: annual, spring, summer, autumn, and winter. Within each group, four models are tested: XGBoost, LightGBM, CatBoost, and stacking. Results show that incorporating surrounding site information improves forecast accuracy. In all five groups with added surrounding site information, the stacking model performs best. Compared to ECMWF forecast data, the stacking model improves wind speed forecast accuracy from 53.3%, 50.9%, 55.2%, 53.0%, and 54.0% to 77.2%, 73.1%, 76.7%, 78.2%, and 77.1%, respectively. These findings demonstrate the potential effecti", "link": "https://doi.org/10.1029/2024jd041822", "authors": "Zhaoliang Zeng, Honglei Wu, Zhaohua Liu, Linna Zhao, Zhaoming Liang, Zhehao Liang", "source": "JGR: Atmospheres", "published": "2024-12-23", "first_seen": "2026-11-23T14:47:49+00:00", "score": 9, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": []}, {"key": "doi:10.1038/s41612-024-00654-w", "title": "Escalating tropical cyclone precipitation extremes and landslide hazards in South China under global warming", "summary": "Tropical cyclones (TCs) are expected to produce more intense precipitation under global warming. However, substantial uncertainties exist in the projection of coarse-resolution global climate models. Here, we use deep learning to aid targeted cloud-resolving simulations of extreme TCs. Contrary to the Clausius-Clapeyron (CC) scaling, which indicates a 7% moisture increase per K warming, our simulations reveal more complex responses of TC rainfall. TCs will not intensify via strengthened updrafts but through the expansion of deep convective cores with suppression of shallow cumulus and congestus. Consequently, while localized hourly rainfall may adhere to the CC scaling, precipitation accumulation over city-sized areas could surge by 18%K -1 . This super-CC intensification due to changing TC structure has profound implications for floods and landslides. Estimations using Hong Kong’s slope data confirm this concern and suggest an up to 215% increase in landslide risks with 4-K warming, highlighting amplified threats from compound disasters under climate change.", "link": "https://doi.org/10.1038/s41612-024-00654-w", "authors": "Xiaoming Shi, Yang Liu, Jianan Chen, Haoming Chen, Yueya Wang, Zhongming Lu", "source": "npj Climate and Atmospheric Science", "published": "2024-5-21", "first_seen": "2026-11-23T14:47:49+00:00", "score": 9, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "arxiv:2611.13941", "title": "PARDIG: Global Precipitation Estimates Learned from Sparse Satellite Observations", "summary": "Estimating precipitation at the global scale is vital for Earth system science and disaster response, yet observational coverage and measurement precision remain constrained. Existing solutions provide options that trade off desirable traits such as skill, latency, geographical coverage, temporal coverage, and spatial and temporal resolution. We present PARDIG, an artificial intelligence framework based on a spherical graph-mesh transformer architecture that produces near-real-time global precipitation estimates. PARDIG is trained on dense multi-modal inputs, including atmospheric state analyses and multi-spectral geostationary satellite imagery, to predict sparse, high-precision precipitation measurements from spaceborne radar. At inference, the trained model is applied densely across the globe at $0.1^\\circ$ spatial and 15-minute temporal resolution, producing complete near-real-time precipitation fields from 2016 to the present, alongside a historical variant extending the record back to 1999. Evaluation against three independent radar networks (over the US, Europe, and Japan) and against over 36,000 surface stations worldwide shows that PARDIG consistently outperforms IMERG V07 (Final and Early), MSWEP V3, ERA5, and HRES across precipitation thresholds and regions, with the largest improvements at extreme intensities. Case studies of extreme precipitation events demonstrate that PARDIG successfully captures their spatial structure and timing. The improvements also extend to forecasting: WeatherNext 3, a global weather model, produces more skillful precipitation forecast", "link": "https://arxiv.org/abs/2611.13941", "authors": "Guy Shalev, Stephan Rasp, Boris Babenko, Andrew El-Kadi, Mohammed Alewi Hassen, Samier Merchant", "source": "arXiv", "published": "2026-11-10T11:28:50Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 9, "topics": ["Deep Learning"], "watch": ["Stephan Rasp"], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1175/aies-d-24-0114.1", "title": "Evaluating the Robustness of PCMCI+ for Causal Discovery of Flood Drivers", "summary": "Estimating causal drivers of high-impact extreme events such as floods from data is an aspiring pursuit. Time series causal discovery methods, such as the conditional-independence-based PC Momentary Conditional Independence (PCMCI) framework, are designed to identify causal relationships from complex multivariate observational time series. However, the application to extreme event data remains a challenge due to, by the nature of extremes, data length limitations, conditional independence testing for nonlinear relationships, and potential violations of the methods’ assumptions. So far, these challenges have mostly been explored on synthetic data with limited transferability to real-world applications. In this study, we evaluate causal discovery on real and pseudoreal data generated with a hydrological model across 45 catchments with varying flood-generating processes. Because no detailed causal ground truth exists, we focus on the robustness of output graphs. To this end, we simulate a large sample, identify discharge peaks, and investigate the robustness of the causal discovery algorithm PCMCI+ when applied to different realizations of the same setting for various sample sizes. We find that the robustness generally increases with sample size, yet a significant proportion of inferred causal edges remain inconsistent even for large datasets. Notably, while some flood drivers are reliably identified, other key hydrological mechanisms are systematically missed even for very large sample sizes, highlighting methodological limitations. Our study provides a blueprint for investig", "link": "https://doi.org/10.1175/aies-d-24-0114.1", "authors": "Peter Miersch, Wiebke Günther, Jakob Runge, Jakob Zscheischler", "source": "Artificial Intelligence for the Earth Systems", "published": "2025-10", "first_seen": "2026-11-23T21:25:47+00:00", "score": 9, "topics": ["Deep Learning"], "watch": ["Jakob Runge"], "boosts": ["extreme*", "uncertainty"]}, {"key": "doi:10.1029/2023jd038906", "title": "Detecting Extreme Temperature Events Using Gaussian Mixture Models", "summary": "Extreme temperature events have traditionally been detected assuming a unimodal distribution of temperature data. We found that surface temperature data can be described more accurately with a multimodal rather than a unimodal distribution. Here, we applied Gaussian Mixture Models (GMM) to daily near‐surface maximum air temperature data from the historical and future Coupled Model Intercomparison Project Phase 6 (CMIP6) simulations for 46 land regions defined by the Intergovernmental Panel on Climate Change. Using the multimodal distribution, we found that temperature extremes, defined based on daily data in the warmest mode of the GMM distributions, are getting more frequent in all regions. Globally, a 10‐year extreme temperature event relative to 1985–2014 conditions will occur 13.6 times more frequently in the future under 3.0°C of global warming levels (GWL). The frequency increase can be even higher in tropical regions, such that 10‐year extreme temperature events will occur almost twice a week. Additionally, we analyzed the change in future temperature distributions under different GWL and found that the hot temperatures are increasing faster than cold temperatures in low latitudes, while the cold temperatures are increasing faster than the hot temperatures in high latitudes. The smallest changes in temperature distribution can be found in tropical regions, where the annual temperature range is small. Our method captures the differences in geographical regions and shows that the frequency of extreme events will be even higher than reported in previous studies.", "link": "https://doi.org/10.1029/2023jd038906", "authors": "Aytaç Paçal, Birgit Hassler, Katja Weigel, M. Levent Kurnaz, Michael F. Wehner, Veronika Eyring", "source": "JGR: Atmospheres", "published": "2023-9-22", "first_seen": "2026-11-23T21:25:47+00:00", "score": 9, "topics": ["Climate Modelling"], "watch": ["Veronika Eyring"], "boosts": ["cmip6", "extreme*"]}, {"key": "doi:10.1029/2022gl100916", "title": "A Deep Learning‐Based Bias Correction Method for Predicting Ocean Surface Waves in the Northwest Pacific Ocean", "summary": "Ocean waves, especially extreme waves, are vital for air‐sea interaction and shipping. However, current wave models still have significant biases. Based on a numerical wave model and a deep learning model, a BU‐Net by adding batch normalization layers to a U‐Net, we accurately predict the significant wave height (SWH) of the Northwest Pacific Ocean. For each day in 2017–2021, we conducted a 3‐day hindcast experiment using WAVEWATCH3 (WW3) to obtain the SWH forecasts at lead times of 24, 48, and 72 hr, forced by GFS real‐time forecast surface winds. After using BU‐Net, the mean Root Mean Squared Errors (RMSEs) of the SWH forecast from WW3 at lead times of 24, 48, and 72 hr are reduced by 40%, 38%, and 30%, respectively. During typhoon passages, the drop percentages of RMSEs all exceed 20% for three lead times. Therefore, combining numerical models and deep learning is very promising in wave forecasting.", "link": "https://doi.org/10.1029/2022gl100916", "authors": "Danyi Sun, Wenyu Huang, Yong Luo, Jingjia Luo, Jonathon S. Wright, Haohuan Fu", "source": "Geophysical Research Letters", "published": "2022-12-8", "first_seen": "2026-11-23T14:47:49+00:00", "score": 8, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": ["extreme*"]}, {"key": "doi:10.1029/2022ef002734", "title": "How May the Choice of Downscaling Techniques and Meteorological Reference Observations Affect Future Hydroclimate Projections?", "summary": "We present an intercomparison of a suite of high‐resolution downscaled climate projections based on a six‐member General Circulation Model (GCM) ensemble from Coupled Models Intercomparison Project (CMIP6). The CMIP6 GCMs have been downscaled using dynamical and statistical downscaling techniques based on two meteorological reference observations over the conterminous United States. We use the regional climate model, RegCM4, for dynamical downscaling, double bias correction constructed analogs method for statistical downscaling, and Daymet and Livneh datasets as the reference observations for statistical training and bias‐correction. We evaluate the performances of downscaled data in both historical and future periods under the SSP585 scenario. While dynamical downscaling improves the simulation of some performance evaluation indices, it adds an extra bias in others, highlighting the need for statistical correction before its use in impact assessments. Downscaled datasets after bias‐correction compare exceptionally well with observations. However, the choice of downscaling techniques and the underlying reference observations influence the hydroclimate characteristics of downscaled data. For instance, the statistical downscaling generally preserves the GCMs climate change signal but overestimates the frequency of hot extremes. Similarly, simulated future changes are sensitive to the choice of reference observations, particularly for precipitation extremes that exhibit a higher projected increase in the ensembles trained and/or corrected by Daymet than Livneh. Overall, these ", "link": "https://doi.org/10.1029/2022ef002734", "authors": "Deeksha Rastogi, Shih‐Chieh Kao, Moetasim Ashfaq", "source": "Earth's Future", "published": "2022-8", "first_seen": "2026-11-23T14:47:49+00:00", "score": 8, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "extreme*"]}, {"key": "doi:10.1029/2022jd036659", "title": "Evaluation of CMIP6 GCMs Over the CONUS for Downscaling Studies", "summary": "Despite the necessity of Global Climate Models (GCMs) sub‐selection in downscaling studies, an objective approach for their selection is currently lacking. Building on the previously established concepts in GCMs evaluation frameworks, we develop a weighted averaging technique to remove the redundancy in the evaluation criteria and rank 37 GCMs from the sixth phase of the Coupled Models Intercomparison Project over the contiguous United States. GCMs are rated based on their average performance across 66 evaluation measures in the historical period (1981–2014) after each metric is weighted between zero and one, depending on its uniqueness. The robustness of the outcome is tested by repeating the process with the empirical orthogonal function analysis in which each GCM is ranked based on its sum of distances from the reference in the principal component space. The two methodologies work in contrasting ways to remove the metrics redundancy but eventually develop similar GCMs rankings. A disparity in GCMs' behavior related to their sensitivity to the size of the evaluation suite is observed, highlighting the need for comprehensive multi‐variable GCMs evaluation at varying timescales for determining their skillfulness over a region. The sub‐selection goal is to use a representative set of skillful models over the region of interest without substantial overlap in their future climate responses and modeling errors in representing historical climate. Additional analyses of GCMs' independence and spread in their future projections provide the necessary information to objectively sele", "link": "https://doi.org/10.1029/2022jd036659", "authors": "Moetasim Ashfaq, Deeksha Rastogi, Joy Kitson, Muhammad Adnan Abid, Shih‐Chieh Kao", "source": "JGR: Atmospheres", "published": "2022-11-5", "first_seen": "2026-11-23T14:47:49+00:00", "score": 8, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["cmip6"]}, {"key": "doi:10.1007/s00382-023-06778-8", "title": "Evaluation of bias correction techniques for generating high-resolution daily temperature projections from CMIP6 models", "summary": "", "link": "https://doi.org/10.1007/s00382-023-06778-8", "authors": "Xinyi Li, Zhong Li", "source": "Climate Dynamics", "published": "2023-4-13", "first_seen": "2026-11-23T21:25:47+00:00", "score": 8, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["cmip6"]}, {"key": "arxiv:2611.27605", "title": "Adapting AI Weather Foundation Models to a Changing Climate", "summary": "AI weather foundation models learn from historical archives, while the climate distribution encountered during deployment continues to evolve. This growing model--climate mismatch motivates continual adaptation without repeated full-model retraining, but the structure of weather forecast errors determines how such adaptation should be performed. We develop an online adaptation framework that exploits two complementary error structures: geographically persistent biases and flow-dependent errors that vary with the atmospheric state. Analysis of Aurora-1.3B reveals strongly concentrated forecast-loss sensitivity in its decoder, motivating flow-dependent corrections within fixed low-dimensional sensitivity subspaces. A residual memory tracks persistent errors remaining after this correction, while a variable-wise online gate controls the contribution of the persistent component. We evaluate Aurora-1.3B using ERA5 from 1959--1968 for offline initialization and a strictly chronological 1969--2022 stream for online evaluation, with updates restricted to previously available verification targets. For 2-metre temperature, distributional departure from the historical reference, measured directly from ERA5, is associated with larger frozen-model errors and greater adaptation gains, while the adapted model maintains more stable skill across evaluation periods. Across 69 output fields and five lead times from 6 to 72 hours, our method reduces MSE and MAE by 6.90\\% and 6.45\\%, respectively, relative to $δ$-Adapter, the strongest of six online adaptation baselines.", "link": "https://arxiv.org/abs/2611.27605", "authors": "Xinlei Xiong, Wenbo Hu, Shuxun Zhou, Lingxi Xie, Richang Hong, Qi Tian", "source": "arXiv", "published": "2026-11-20T13:36:07Z", "first_seen": "2026-11-23T14:47:49+00:00", "score": 7, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": []}, {"key": "doi:10.5194/gmd-13-2945-2020", "title": "Observations for Model Intercomparison Project (Obs4MIPs): status for CMIP6", "summary": "The Observations for Model Intercomparison Project (Obs4MIPs) was initiated in 2010 to facilitate the use of observations in climate model evaluation and research, with a particular target being the Coupled Model Intercomparison Project (CMIP), a major initiative of the World Climate Research Programme (WCRP). To this end, Obs4MIPs (1) targets observed variables that can be compared to CMIP model variables; (2) utilizes dataset formatting specifications and metadata requirements closely aligned with CMIP model output; (3) provides brief technical documentation for each dataset, designed for nonexperts and tailored towards relevance for model evaluation, including information on uncertainty, dataset merits, and limitations; and (4) disseminates the data through the Earth System Grid Federation (ESGF) platforms, making the observations searchable and accessible via the same portals as the model output. Taken together, these characteristics of the organization and structure of obs4MIPs should entice a more diverse community of researchers to engage in the comparison of model output with observations and to contribute to a more comprehensive evaluation of the climate models. At present, the number of obs4MIPs datasets has grown to about 80; many are undergoing updates, with another 20 or so in preparation, and more than 100 are proposed and under consideration. A partial list of current global satellite-based datasets includes humidity and temperature profiles; a wide range of cloud and aerosol observations; ocean surface wind, temperature, height, and sea ice fraction; surface", "link": "https://doi.org/10.5194/gmd-13-2945-2020", "authors": "Duane Waliser, Peter J. Gleckler, Robert Ferraro, Karl E. Taylor, Sasha Ames, James Biard", "source": "Geoscientific Model Development", "published": "2020-7-7", "first_seen": "2026-11-23T14:47:49+00:00", "score": 7, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "uncertainty"]}, {"key": "doi:10.1029/2020gl088662", "title": "Projected Future Changes in Tropical Cyclones Using the CMIP6 HighResMIP Multimodel Ensemble", "summary": "Future changes in tropical cyclone properties are an important component of climate change impacts and risk for many tropical and midlatitude countries. In this study we assess the performance of a multimodel ensemble of climate models, at resolutions ranging from 250 to 25 km. We use a common experimental design including both atmosphere‐only and coupled simulations run over the period 1950–2050, with two tracking algorithms applied uniformly across the models. There are overall improvements in tropical cyclone frequency, spatial distribution, and intensity in models at 25 km resolution, with several of them able to represent very intense storms. Projected tropical cyclone activity by 2050 generally declines in the South Indian Ocean, while changes in other ocean basins are more uncertain and sensitive to both tracking algorithm and imposed forcings. Coupled models with smaller biases suggest a slight increase in average TC 10 m wind speeds by 2050.", "link": "https://doi.org/10.1029/2020gl088662", "authors": "Malcolm John Roberts, Joanne Camp, Jon Seddon, Pier Luigi Vidale, Kevin Hodges, Benoît Vannière", "source": "Geophysical Research Letters", "published": "2020-7-16", "first_seen": "2026-11-23T14:47:49+00:00", "score": 7, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india*", "cmip6"]}, {"key": "doi:10.1029/2021gl095311", "title": "Clays Are Not Created Equal: How Clay Mineral Type Affects Soil Parameterization", "summary": "Clay minerals dominate the soil colloidal fraction and its specific surface area. Differences among clay mineral types significantly influence their effects on soil hydrological and mechanical behavior. Presently, the soil clay content is used to parameterize soil hydraulic and mechanical properties (SHMP) for land surface models while disregarding the type of clay mineral. This undifferentiated use of clay leads to inconsistent parameterization, particularly between tropical and temperate soils, as shown herein. We capitalize on recent global maps of clay minerals that exhibit strong climatic and spatial segregation of active and inactive clays to consider spatially resolved clay mineral types in SHMP estimation. Clay mineral‐informed pedotransfer functions and machine learning algorithms trained with datasets including different clay types and soil structure formation processes improve SHMP representation regionally with broad implications for hydrological and geomechanical Earth surface processes.", "link": "https://doi.org/10.1029/2021gl095311", "authors": "P. Lehmann, B. Leshchinsky, S. Gupta, B. B. Mirus, S. Bickel, N. Lu", "source": "Geophysical Research Letters", "published": "2021-10-20", "first_seen": "2026-11-23T14:47:49+00:00", "score": 7, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": []}, {"key": "doi:10.1029/2023ef004222", "title": "Hydrological Projections in the Third Pole Using Artificial Intelligence and an Observation‐Constrained Cryosphere‐Hydrology Model", "summary": "The water resources of the Third Pole (TP), highly sensitive to climate change and glacier melting, significantly impact the water and food security of millions in Asia. However, projecting future spatial‐temporal runoff changes for TP's mountainous basins remains a formidable challenge. Here, we've leveraged the long short‐term memory model (LSTM) to craft a grid‐scale artificial intelligence (AI) model named LSTM‐grid. This model has enabled the production of hydrological projections for the seven major river basins of TP. The LSTM‐grid model integrates monthly precipitation, air temperature, and total glacier mass changes (total_GMC) data at a 0.25‐degree model grid. Training the LSTM‐grid model employed gridded historical monthly runoff and evapotranspiration data sets generated by an observation‐constrained cryosphere‐hydrology model at the headwaters of seven TP river basins during 2000–2017. Our results demonstrate the LSTM grid's effectiveness and usefulness, exhibiting a Nash‐Sutcliffe Efficiency coefficient exceeding 0.92 during the verification periods (2013–2017). Moreover, river basins in the monsoon region exhibited a higher rate of runoff increase compared to those in the westerlies region. Intra‐annual projections indicated notable increases in spring runoff, especially in basins where glacier meltwater significantly contributes to runoff. Additionally, the LSTM‐grid model aptly captures the runoff changes before and after the turning points of glacier melting, highlighting the growing influence of precipitation on runoff after reaching the maximum total_GMC", "link": "https://doi.org/10.1029/2023ef004222", "authors": "Junshui Long, Lei Wang, Deliang Chen, Ning Li, Jing Zhou, Xiuping Li", "source": "Earth's Future", "published": "2024-4", "first_seen": "2026-11-23T14:47:49+00:00", "score": 7, "topics": ["Deep Learning"], "watch": [], "boosts": ["monsoon", "precipitation"]}, {"key": "doi:10.1175/waf-d-26-0007.1", "title": "Real-Time Probabilistic Nowcasting of Lightning Density via a Sequential Monte Carlo Framework", "summary": "This study presents a particle filter–based framework for short-term lightning nowcasting using only lightning detection network observations. The method employs DBSCAN clustering to identify lightning-active structures and propagates them probabilistically, yielding useful skill at 1–3-h lead times, with declining but nonzero skill at 4–6 h. The results show that recall is more robust than precision across increasing lead times and that performance is sensitive to the ground-truth density threshold selection. Despite these limitations, the suggested approach achieves skill scores comparable to those of more data-intensive machine learning and NWP-based methods, while requiring minimal input data. Importantly, the algorithm can be implemented as a real-time Python application, demonstrating both its scientific value and practical applicability in data-constrained environments. Significance Statement Lightning represents a severe threat to human life and critical infrastructure, yet high-fidelity nowcasting often depends on data-intensive inputs like satellite or radar imagery, which are frequently unavailable in isolated regions. This study presents a robust, probabilistic framework for real-time lightning prediction using exclusively ground-based lightning strike data. By integrating clustering techniques with a particle filter, our method achieves its strongest predictive skill at 1–3-h lead times, with diminishing but still informative skill at longer horizons. Successfully operationalized for power grid management, this infrastructure-independent solution provides a cos", "link": "https://doi.org/10.1175/waf-d-26-0007.1", "authors": "Vlad Landa, Yuval Reuveni, Yoav Yair, Chaim Lerman, Colin Price", "source": "Weather and Forecasting", "published": "2026-11", "first_seen": "2026-11-23T14:47:49+00:00", "score": 7, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": []}, {"key": "doi:10.5194/gmd-10-359-2017", "title": "The Cloud Feedback Model Intercomparison Project (CFMIP) contribution to CMIP6", "summary": "The primary objective of CFMIP is to inform future assessments of cloud feedbacks through improved understanding of cloud–climate feedback mechanisms and better evaluation of cloud processes and cloud feedbacks in climate models. However, the CFMIP approach is also increasingly being used to understand other aspects of climate change, and so a second objective has now been introduced, to improve understanding of circulation, regional-scale precipitation, and non-linear changes. CFMIP is supporting ongoing model inter-comparison activities by coordinating a hierarchy of targeted experiments for CMIP6, along with a set of cloud-related output diagnostics. CFMIP contributes primarily to addressing the CMIP6 questions How does the Earth system respond to forcing? and What are the origins and consequences of systematic model biases? and supports the activities of the WCRP Grand Challenge on Clouds, Circulation and Climate Sensitivity.A compact set of Tier 1 experiments is proposed for CMIP6 to address this question: (1) what are the physical mechanisms underlying the range of cloud feedbacks and cloud adjustments predicted by climate models, and which models have the most credible cloud feedbacks? Additional Tier 2 experiments are proposed to address the following questions. (2) Are cloud feedbacks consistent for climate cooling and warming, and if not, why? (3) How do cloud-radiative effects impact the structure, the strength and the variability of the general atmospheric circulation in present and future climates? (4) How do responses in the climate system due to changes in so", "link": "https://doi.org/10.5194/gmd-10-359-2017", "authors": "Mark J. Webb, Timothy Andrews, Alejandro Bodas-Salcedo, Sandrine Bony, Christopher S. Bretherton, Robin Chadwick", "source": "Geoscientific Model Development", "published": "2017-1-25", "first_seen": "2026-11-23T21:25:47+00:00", "score": 7, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation"]}, {"key": "doi:10.1175/aies-d-26-0093.1", "title": "Data-Driven Solutions to the Wave Action Balance Equation: A Physics-Centric Taxonomy and Review of AI Wave Modelling", "summary": "Wind-generated surface gravity waves are a dominant feature of the ocean dynamic environment, critical for maritime safety, offshore engineering, and global climate systems. While third-generation Numerical Wave Models (NWMs) constitute the current operational backbone, they remain constrained by high computational costs and parameterization approximations. The rapid development of Artificial Intelligence (AI) has opened a new data-driven pathway for wave modelling. Despite the growing number of AI-based wave modelling studies, the field lacks a physically consistent organizing framework. AI models are powerful nonlinear function approximators, but they cannot override the causal constraints imposed by wave physics. Yet many existing studies remain architecture-driven rather than physics-driven, leading to physically under-constrained and potentially misleading model formulations. Here we present a physics-centric taxonomy of data-driven phase-averaged wave modelling derived from the wave action balance equation. Rather than classifying studies by network architecture, we organize existing approaches into four functional paradigms according to their treatment of propagation and source-term physics: (1) time-series autoregressive, (2) initial/boundary conditions-and-forcing, (3) historical forcing-driven, and (4) hybrid numerical-statistical frameworks. We show that purely time-series autoregressive models are physically under-constrained when neglecting external forcing or propagation, whereas the other three frameworks provide parallel pathways toward physically reasonable", "link": "https://doi.org/10.1175/aies-d-26-0093.1", "authors": "Haoyu Jiang, Sitian Li", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-11-23", "first_seen": "2026-11-23T21:25:47+00:00", "score": 7, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": []}, {"key": "doi:10.1038/s41612-023-00353-y", "title": "Physics informed deep neural network embedded in a chemical transport model for the Amazon rainforest", "summary": "Secondary organic aerosols (SOA) are fine particles in the atmosphere, which interact with clouds, radiation and affect the Earth’s energy budget. SOA formation involves chemistry in gas phase, aqueous aerosols, and clouds. Simulating these chemical processes involve solving a stiff set of differential equations, which are computationally expensive steps for three-dimensional chemical transport models. Deep neural networks (DNNs) are universal function approximators that could be used to represent the complex nonlinear changes in aerosol physical and chemical processes; however, key challenges such as generalizability to extended time periods, preservation of mass balance, simulating sparse model outputs, and maintaining physical constraints have limited their use in atmospheric chemistry. Here, we develop an approach of using a physics-informed DNN that overcomes previous such challenges and demonstrates its applicability for the chemical formation processes of isoprene epoxydiol SOA (IEPOX-SOA) over the Amazon rainforest. The DNN is trained with data generated by simulating IEPOX-SOA over the entire atmospheric column, using the Weather Research and Forecasting Model coupled with Chemistry (WRF-Chem). The trained DNN is then embedded within WRF-Chem to replace the computationally expensive default solver of IEPOX-SOA formation. The trained DNN predictions generalizes well with the default model simulation of the IEPOX-SOA mass concentrations and its size distribution (20 size bins) over several days of simulations in both dry and wet seasons. The embedded DNN reduces the ", "link": "https://doi.org/10.1038/s41612-023-00353-y", "authors": "Himanshu Sharma, Manish Shrivastava, Balwinder Singh", "source": "npj Climate and Atmospheric Science", "published": "2023-3-31", "first_seen": "2026-11-23T21:25:47+00:00", "score": 7, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": []}, {"key": "doi:10.1007/s00382-018-4449-z", "title": "Skill of Indian summer monsoon rainfall prediction in multiple seasonal prediction systems", "summary": "", "link": "https://doi.org/10.1007/s00382-018-4449-z", "authors": "Shipra Jain, Adam A. Scaife, Ashis K. Mitra", "source": "Climate Dynamics", "published": "2018-9-19", "first_seen": "2026-11-23T21:25:47+00:00", "score": 7, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["india*", "monsoon"]}, {"key": "doi:10.1175/waf-d-26-0150.1", "title": "Tropical Cyclone Representation and Forecast Skill in GEOS-S2S-3", "summary": "This study evaluates tropical cyclone (TC) climatology, structure, and subseasonal prediction skill in the latest NASA Goddard Earth Observing System Subseasonal-to-Seasonal forecast system, Version 3 (GEOS-S2S-3), comparing its performance with its predecessor GEOS-S2S-2. The two systems show contrasting genesis biases: GEOS-S2S-3 overproduces annual TC count by roughly 1.5 times observed values across most basins, while GEOS-S2S-2 slightly underestimates it. Both systems capture the observed seasonal cycle but underestimate TC intensity, the latter being expected at 0.5° atmospheric resolution. GEOS-S2S-3 simulates longer TC lifespans, which, combined with its higher genesis rate, produce higher modified accumulated cyclone energy than GEOS-S2S-2. To investigate the excessive genesis rate in GEOS-S2S-3, we examined the large-scale environment, convective precipitation, and vertical velocity. Neither large-scale environmental favorability nor mean convective precipitation differences provides a satisfying explanation; the analysis points to differences in the vertical structure of convection — particularly stronger lower-tropospheric ascent in GEOS-S2S-3—as a potentially relevant contributor, possibly related to changes in the tuning of parameterizations for moist processes. In terms of TC structure, GEOS-S2S-3 shows a more realistic vortex than its predecessor, with stronger inner-core ascent, higher mid-level relative humidity, and stronger tangential winds than GEOS-S2S-2, though neither system simulates a distinct eyewall at 0.5° resolution. Finally, GEOS-S2S-3’s overp", "link": "https://doi.org/10.1175/waf-d-26-0150.1", "authors": "K. S. S. Sai Srujan, Chia-Ying Lee, Jorge L. García-Franco, Suzana J. Camargo, Michael K. Tippett, Young-Kwon Lim", "source": "Weather and Forecasting", "published": "2026-11-23", "first_seen": "2026-11-23T21:25:47+00:00", "score": 7, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"]}, {"key": "doi:10.1017/eds.2023.10", "title": "Exploring the nonstationarity of coastal sea level probability distributions", "summary": "Studies agree on a significant global mean sea level rise in the 20th century and its recent 21st century acceleration in the satellite record. At regional scale, the evolution of sea level probability distributions is often assumed to be dominated by changes in the mean. However, a quantification of changes in distributional shapes in a changing climate is currently missing. To this end, we propose a novel framework quantifying significant changes in probability distributions from time series data. The framework first quantifies linear trends in quantiles through quantile regression. Quantile slopes are then projected onto a set of four orthogonal polynomials quantifying how such changes can be explained by independent shifts in the first four statistical moments. The framework proposed is theoretically founded, general, and can be applied to any climate observable with close-to-linear changes in distributions. We focus on observations and a coupled climate model (GFDL-CM4). In the historical period, trends in coastal daily sea level have been driven mainly by changes in the mean and can therefore be explained by a shift of the distribution with no change in shape. In the modeled world, robust changes in higher order moments emerge with increasing $ {\\mathrm{CO}}_2 $ concentration. Such changes are driven in part by ocean circulation alone and get amplified by sea level pressure fluctuations, with possible consequences for sea level extremes attribution studies.", "link": "https://doi.org/10.1017/eds.2023.10", "authors": "Fabrizio Falasca, Andrew Brettin, Laure Zanna, Stephen M. Griffies, Jianjun Yin, Ming Zhao", "source": "Environmental Data Science", "published": "2023", "first_seen": "2026-11-23T21:25:47+00:00", "score": 7, "topics": ["Climate Modelling"], "watch": ["Laure Zanna"], "boosts": ["extreme*"]}, {"key": "arxiv:2205.00743", "title": "Machine-learned cloud classes from satellite data for process-oriented climate model evaluation", "summary": "Clouds play a key role in regulating climate change but are difficult to simulate within Earth system models (ESMs). Improving the representation of clouds is one of the key tasks towards more robust climate change projections. This study introduces a new machine-learning based framework relying on satellite observations to improve understanding of the representation of clouds and their relevant processes in climate models. The proposed method is capable of assigning distributions of established cloud types to coarse data. It facilitates a more objective evaluation of clouds in ESMs and improves the consistency of cloud process analysis. The method is built on satellite data from the MODIS instrument labelled by deep neural networks with cloud types defined by the World Meteorological Organization (WMO), using cloud type labels from CloudSat as ground truth. The method is applicable to datasets with information about physical cloud variables comparable to MODIS satellite data and at sufficiently high temporal resolution. We apply the method to alternative satellite data from the Cloud\\_cci project (ESA Climate Change Initiative), coarse-grained to typical resolutions of climate models. The resulting cloud type distributions are physically consistent and the horizontal resolutions typical of ESMs are sufficient to apply our method. We recommend outputting crucial variables required by our method for future ESM data evaluation. This will enable the use of labelled satellite data for a more systematic evaluation of clouds in climate models.", "link": "https://arxiv.org/abs/2205.00743", "authors": "A. Kaps, A. Lauer, G. Camps-Valls, P. Gentine, L. Gómez-Chova, V. Eyring", "source": "arXiv", "published": "2022-05-02T08:49:49Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 7, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": []}, {"key": "doi:10.1029/2022ef003303", "title": "Multivariate Drought Monitoring, Propagation, and Projection Using Bias‐Corrected General Circulation Models", "summary": "Understanding how droughts are characterized, propagated, and projected, particularly multivariate droughts, is necessary to explain the variability and changes in drought characteristics. This study aims to understand multimodel global drought monitoring, propagation, and projection by utilizing a multivariate standardized drought index (MSDI) during the historical (1959–2014) and future (2045–2100) periods under two socioeconomic pathways SSPs (370 and 585), derived from the bias‐corrected Coupled Model Intercomparison Project Phase 6 (CMIP6). Based on the energy metrics, the multivariate bias correction method outperformed other techniques in correcting the biases in the CMIP6 drought representation. The drought indicators demonstrate distinct categories for meteorological, hydrological, and multivariate droughts. There were significant high cross correlations between Heatwave Total Length (HWTL) and MSDI in Africa and South America for all lagged times. Europe and North America generally saw the maximum MSDI drought duration (228 months) during the historical period. For future projections, Africa recorded the maximum drought duration (197 months), while Europe witnessed the minimum drought duration for SSP 370 (171 months), and North America (149 months) for SSP 585. Furthermore, during the historical period in tropical Africa, the propagation of meteorological to hydrological drought was slower during the wet months than during the dry months. Under the SSP 370 future projection, there was a shift in the long period of meteorological‐hydrological propagation from the ", "link": "https://doi.org/10.1029/2022ef003303", "authors": "Oluwafemi E. Adeyeri, Wen Zhou, Patrick Laux, Christopher E. Ndehedehe, Xuan Wang, Muhammad Usman", "source": "Earth's Future", "published": "2023-4", "first_seen": "2026-11-23T14:47:49+00:00", "score": 6, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["cmip6"]}, {"key": "doi:10.5194/gmd-14-5373-2021", "title": "Calibrating a global atmospheric chemistry transport model using Gaussian process emulation and ground-level concentrations of ozone and carbon monoxide", "summary": "Atmospheric chemistry transport models are important tools to investigate the local, regional and global controls on atmospheric composition and air quality. To ensure that these models represent the atmosphere adequately, it is important to compare their outputs with measurements. However, ground based measurements of atmospheric composition are typically sparsely distributed and representative of much smaller spatial scales than those resolved in models; thus, direct comparison incurs uncertainty. In this study, we investigate the feasibility of using observations of one or more atmospheric constituents to estimate parameters in chemistry transport models and to explore how these estimates and their uncertainties depend upon representation errors and the level of spatial coverage of the measurements. We apply Gaussian process emulation to explore the model parameter space and use monthly averaged ground-level concentrations of ozone (O 3 ) and carbon monoxide (CO) from across Europe and the US. Using synthetic observations, we find that the estimates of parameters with greatest influence on O 3 and CO are unbiased, and the associated parameter uncertainties are low even at low spatial coverage or with high representation error. Using reanalysis data, we find that estimates of the most influential parameter – corresponding to the dry deposition process – are closer to its expected value using both O 3 and CO data than using O 3 alone. This is remarkable because it shows that while CO is largely unaffected by dry deposition, the additional constraints it provides are valuab", "link": "https://doi.org/10.5194/gmd-14-5373-2021", "authors": "Edmund Ryan, Oliver Wild", "source": "Geoscientific Model Development", "published": "2021-9-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["uncertainty"]}, {"key": "doi:10.5194/gmd-19-10933-2026", "title": "Evaluation of precipitation variability over complex terrain based on observations and high resolution WRF v4.2.2 modelling", "summary": "Heterogeneity in the occurrence, amount and distribution of precipitation in mountainous areas is relevant for water resources and stresses the need for high-altitude observations and high-resolution modeling over complex terrain. This work focuses on the analysis of precipitation in the Sierra de Guadarrama, a mountain range at the center of the Iberian Plateau that provides water resources for several million citizens living within it and in nearby cities, mostly Madrid. The precipitation climatology is assessed from available observations and high resolution climate model simulations during the period 1991–2020. For this purpose, data from 37 stations located in the Sierra de Guadarrama and surrounding lowlands, with altitudes ranging from 600 to 2200 ma.s.l. have been analyzed and compared to model simulations. A regional simulation with the WRF model (version 4.2.2), driven with boundary conditions provided by the ERA5 reanalysis, was performed. The simulation has three nested domains with increasing resolutions of 9, 3, and 1 km, with the smallest domain covering the target region, including the Sierra de Guadarrama and surroundings. The comparison of the different data sources aims at characterizing the precipitation distribution over the area, assessing the performance of ERA5 and the potential added value of the increasing resolution of the WRF simulation in reproducing the observations. Results show that the increase in WRF resolution from 9 to 3 km produces a better representation of the overall climatology of precipitation and the altitudinal gradients. The 1 km", "link": "https://doi.org/10.5194/gmd-19-10933-2026", "authors": "Emilio Greciano-Zamorano, J. Fidel González-Rouco, Jorge Navarro-Montesinos, Cristina Vegas-Cañas, Félix García-Pereira, Elena García-Bustamante", "source": "Geoscientific Model Development", "published": "2026-11-17", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1029/2019ms001689", "title": "Confronting the Challenge of Modeling Cloud and Precipitation Microphysics", "summary": "In the atmosphere, microphysics refers to the microscale processes that affect cloud and precipitation particles and is a key linkage among the various components of Earth's atmospheric water and energy cycles. The representation of microphysical processes in models continues to pose a major challenge leading to uncertainty in numerical weather forecasts and climate simulations. In this paper, the problem of treating microphysics in models is divided into two parts: (i) how to represent the population of cloud and precipitation particles, given the impossibility of simulating all particles individually within a cloud, and (ii) uncertainties in the microphysical process rates owing to fundamental gaps in knowledge of cloud physics. The recently developed Lagrangian particle‐based method is advocated as a way to address several conceptual and practical challenges of representing particle populations using traditional bulk and bin microphysics parameterization schemes. For addressing critical gaps in cloud physics knowledge, sustained investment for observational advances from laboratory experiments, new probe development, and next‐generation instruments in space is needed. Greater emphasis on laboratory work, which has apparently declined over the past several decades relative to other areas of cloud physics research, is argued to be an essential ingredient for improving process‐level understanding. More systematic use of natural cloud and precipitation observations to constrain microphysics schemes is also advocated. Because it is generally difficult to quantify individual m", "link": "https://doi.org/10.1029/2019ms001689", "authors": "Hugh Morrison, Marcus van Lier‐Walqui, Ann M. Fridlind, Wojciech W. Grabowski, Jerry Y. Harrington, Corinna Hoose", "source": "Journal of Advances in Modeling Earth Systems", "published": "2020-7-31", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "uncertainty"]}, {"key": "doi:10.1029/2022ef003011", "title": "Future Changes in Climate and Hydroclimate Extremes in East Africa", "summary": "Climate change is affecting the agriculture, water, and energy sectors in East Africa and the impact is projected to increase in the future. To allow adaptation and mitigation of the impacts, we assessed the changes in climate and their impacts on hydrology and hydrological extremes in East Africa. We used outputs from seven CMIP‐6 Global Climate Models (GCMs) and 1981–2010 is used as a reference period. The output from GCMs are statistically downscaled using the Bias Correction‐Constructed Analogs with Quantile mapping reordering method to drive a high‐resolution hydrological model. The Variable Infiltration Capacity and vector‐based routing models are used to simulate runoff and streamflow across 68,300 river reaches in East Africa. The results show an increase in annual precipitation (up to 35%) in Ethiopia, Uganda, and Kenya and a decrease (up to 4.5%) in Southern Tanzania in the 2050s (2041–2070) and 2080s (2071–2100). During the long rainy season (March–May), precipitation is projected to be higher (up to 43%) than the reference period in Southern Ethiopia, Kenya, and Uganda but lower (up to −20%) in Tanzania. Large parts of Kenya, Uganda, Tanzania, and Southern Ethiopia show an increase in precipitation (up to 38%) during the short rainy season (October–December). Temperature and evapotranspiration will continue to increase in the future. Further, annual and seasonal streamflow and hydrological extremes (droughts and floods) are projected to increase in large parts of the region throughout the 21st century calling for site‐specific adaptation.", "link": "https://doi.org/10.1029/2022ef003011", "authors": "S. H. Gebrechorkos, M. T. Taye, B. Birhanu, D. Solomon, T. Demissie", "source": "Earth's Future", "published": "2023-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1002/2015ef000336", "title": "Uncertainty partition challenges the predictability of vital details of climate change", "summary": "Decision makers and consultants are particularly interested in “detailed” information on future climate to prepare adaptation strategies and adjust design criteria. Projections of future climate at local spatial scales and fine temporal resolutions are subject to the same uncertainties as those at the global scale but the partition among uncertainty sources (emission scenarios, climate models, and internal climate variability) remains largely unquantified. At the local scale, the uncertainty of the mean and extremes of precipitation is shown to be irreducible for mid and end‐of‐century projections because it is almost entirely caused by internal climate variability (stochasticity). Conversely, projected changes in mean air temperature and other meteorological variables can be largely constrained, even at local scales, if more accurate emission scenarios can be developed. The results were obtained by applying a comprehensive stochastic downscaling technique to climate model outputs for three exemplary locations. In contrast with earlier studies, the three sources of uncertainty are considered as dependent and, therefore, non‐additive. The evidence of the predominant role of internal climate variability leaves little room for uncertainty reduction in precipitation projections; however, the inference is not necessarily negative, because the uncertainty of historic observations is almost as large as that for future projections with direct implications for climate change adaptation measures.", "link": "https://doi.org/10.1002/2015ef000336", "authors": "Simone Fatichi, Valeriy Y. Ivanov, Athanasios Paschalis, Nadav Peleg, Peter Molnar, Stefan Rimkus", "source": "Earth's Future", "published": "2016-5", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*", "uncertainty"]}, {"key": "doi:10.1029/2018jd030082", "title": "Unraveling the Mystery of Indian Summer Monsoon Prediction: Improved Estimate of Predictability Limit", "summa
