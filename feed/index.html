d storm intensities, which in turn, increases the rainfall variability. These results suggest that accurate prediction of heavy precipitation at a specific location and at high temporal resolution for an event such as Typhoon Morakot over Taiwan is extremely challenging. The forecasting of such an event would benefit from probabilistic pred", "link": "https://doi.org/10.1175/waf-d-10-05020.1", "authors": "Xingqin Fang, Ying-Hwa Kuo, Anyu Wang", "source": "Weather and Forecasting", "published": "2011-10-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1175/waf-d-24-0045.1", "title": "Evaluation of Seasonal Precipitation in South Asian Monsoon Using FGOALS-f2 Seamless Prediction System", "summary": "Timely and effective seasonal climate prediction is crucial to reduce the losses from hydrometeorological disasters by providing early warning. Evaluating the model’s performance is essential for its accurate interpretation and implementation. Here, we examined the precipitation forecast of the South Asian monsoon using the second-generation finite-volume version of the Flexible Global Ocean–Atmosphere–Land System Model (FGOALS-f2), a seamless prediction system. The hindcast skill was assessed using multiple metrics for lead times of 0–2 months. The result demonstrates that the prediction skill is positive across the majority of regions up to a 1-month lead. However, the skill varies on lead times and geographical areas, with notably better skills up to a 1-month lead in central (particularly surrounding Nepal) and western (southern Pakistan and Afghanistan) regions. Furthermore, we proposed a physical mechanism to explain the seasonal prediction skill of precipitation and the tropical sea surface temperature (SST) signal, along with the Indian Ocean dipole (IOD) relationship. Typically, the model shows better forecasting accuracy in regions where it accurately represents the strong connection with SST indices. Additionally, for a 0-month lead forecast, the model performs well in predicting El Niño–Southern Oscillation (ENSO) and IOD indices, with correlation values of 0.71 and 0.52, respectively. We also explored how tropical cyclones could affect predicting precipitation in South Asia. Finally, we presented and compared real-time forecasts from 2020 to 2023. The predictio", "link": "https://doi.org/10.1175/waf-d-24-0045.1", "authors": "Dipendra Lamichhane, Qing Bao, Bian He, Ke Wei, Jing Yang, Guoxiong Wu", "source": "Weather and Forecasting", "published": "2025-5", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["india*", "monsoon", "precipitation"]}, {"key": "doi:10.1002/qj.3790", "title": "Evaluating the GECCO3 1948–2018 ocean synthesis – a configuration for initializing the MPI‐ESM climate model", "summary": "The paper describes an update of the GECCO (German contribution to the Estimating the Circulation and Climate of the Ocean project) ocean synthesis, now in its version 3, and provides an evaluation of the results with assimilated and independent data. GECCO3 covers the 71‐year period 1948–2018 and differs from its predecessor by returning to a single assimilation window instead of partitioning the period in 5‐year‐long overlapping windows which was previously necessary to yield convergence. A solution to the convergence problem is presented. GECCO3 is intended to be used for the initialization of coupled climate models and is configured for the higher‐resolution version of the earth system model (MPI‐ESM) developed at the Max Planck Institute for Meteorology. It uses the bathymetry and grid of the MPI‐ESM with quasi‐uniform resolution of 0.4°, thereby providing the first global eddy‐permitting synthesis based on the adjoint method. The synthesis additionally features the estimation of various mixing parameters and can regionally choose between explicit or parametrized eddy fluxes. Except for the altimeter data in tropical regions, GECCO3 is in better agreement with the assimilated data than GECCO2. The improvements relative to the in situ data partly result from the much larger amount of Argo data, which show lower model–data differences. Global heat content changes are in good agreement with recent estimates, but show uptake almost exclusively in the top 700 m. An alternative version of GECCO3, created by starting from different first‐guess control parameters, was used to ", "link": "https://doi.org/10.1002/qj.3790", "authors": "Armin Köhl", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2020-4-20", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["uncertainty"]}, {"key": "doi:10.1002/qj.3200", "title": "The evolution, seasonality and impacts of western disturbances", "summary": "Western disturbances (WDs) are upper‐level synoptic‐scale systems embedded in the subtropical westerly jet stream (STWJ), often associated with extreme rainfall events in north India and Pakistan during boreal winter. Here, a tracking algorithm is applied to the upper‐tropospheric vorticity field for 37 years of ERA‐Interim reanalysis data, giving a catalogue of over 3000 events. These events are analysed in a composite framework: the vertical structure is explored across a large number of dynamic and thermodynamic fields, revealing a significant northwestward tilt with height, strong ascent ahead of the centre, which sits above the maximum surface precipitation, and a warm‐over‐cold, dry‐over‐moist structure, among other signatures of strong baroclinicity. Evolution of the structures of cloud cover and vertical wind speed are investigated as the composite WD passes across northern India. Cloud cover in particular is found to be particularly sensitive to the presence of the Himalayan foothills, with a significant maximum at 300 hPa approximately 1 day after the WD reaches peak intensity. k ‐means clustering is used to classify WDs according to both dynamical structure and precipitation footprint and the relationship between the two sets of WDs is explored. Finally, the statistical relationship between the STWJ position and WDs on interannual time‐scales is explored, showing that WD frequency in north India is highly sensitive to the jet location over Eurasia. Years with a greater number of WDs feature a STWJ shifted to the south, a pattern that is substantially more coheren", "link": "https://doi.org/10.1002/qj.3200", "authors": "Kieran M. R. Hunt, Andrew G. Turner, Len C. Shaffrey", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2018-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india*", "himalaya*", "precipitation", "extreme*"]}, {"key": "doi:10.1002/qj.406", "title": "A Gill–Matsuno‐type mechanism explains the tropical Atlantic influence on African and Indian monsoon rainfall", "summary": "Recent studies using coupled atmosphere–ocean models have shown that the tropical Atlantic has a significant impact on the Indian monsoon. In this article, the observational basis for this teleconnection is examined and the physical mechanism responsible for bridging sea‐surface temperatures (SSTs) in the Atlantic and precipitation over India is investigated with idealized atmospheric general circulation model (AGCM) experiments in which constant SST anomalies are prescribed and ‘switched on’ in the tropical Atlantic region. A simple Gill–Matsuno‐type quadrupole response is proposed to explain the teleconnection between the tropical Atlantic and the Indian basin, with an enforcement of the eastward response likely due to nonlinear interactions with the mean monsoon circulation. The simplicity of this mechanism suggests the reproducibility of this result with a broad range of AGCMs. Copyright © 2009 Royal Meteorological Society", "link": "https://doi.org/10.1002/qj.406", "authors": "F. Kucharski, A. Bracco, J. H. Yoo, A. M. Tompkins, L. Feudale, P. Ruti", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2009-4", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india*", "monsoon", "precipitation"]}, {"key": "doi:10.1002/qj.4506", "title": "Extreme precipitation at Padang, Sumatra triggered by convectively coupled Kelvin waves", "summary": "Convectively coupled Kelvin waves (CCKWs) are tropical weather systems that travel eastward along the equatorial waveguide and have previously been linked to 90% of flooding events in Sumatra, Indonesia. Here, the processes through which CCKWs influence convection to produce extreme precipitation are investigated, with a focus on Padang, a city on the west coast of Sumatra. Extreme precipitation days at Padang, defined as days when the daily total precipitation exceeds the percentile, are found to be 59% more likely to occur given the presence of a CCKW. We find that CCKWs modulate the diurnal cycle to produce extreme precipitation. This is achieved firstly through providing low‐level moisture and convergence that acts to couple the Kelvin wave to the convection. Secondly, the CCKW acts to displace the convergence zone towards Padang, such that it experiences rainfall that persists throughout the night and peaks the following day in the early evening. We examine the case study of a CCKW that passed over Padang on August 21, 2017, bringing extreme precipitation that led to flooding in the West Sumatra region, recording a maximum daily accumulated rainfall of 137 mm. This case study showed remarkably similar characteristics in its propagation, structure, and precipitation patterns to composite studies of CCKWs. The performance of a suite of convection‐permitting configurations of the UK Met Office Unified Model (MetUM), embedded within a parameterised convection global model, in forecasting this CCKW is evaluated. In general, all configurations of the model capture this event", "link": "https://doi.org/10.1002/qj.4506", "authors": "Natasha V. Senior, Adrian J. Matthews, Benjamin G. M. Webber, Stuart Webster, Richard W. Jones, Donaldi S. Permana", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2023-7", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india*", "precipitation", "extreme*"]}, {"key": "doi:10.1002/qj.3914", "title": "The influence of air–sea coupling on forecasts of the 2016 Indian summer monsoon and its intraseasonal variability", "summary": "Daily initialized coupled and uncoupled numerical weather prediction (NWP) forecasts from the global Met Office Unified Model (MetUM) are compared for the 2016 Indian summer monsoon. Three MetUM configurations are used: atmosphere only (ATM), coupled to a mixed‐layer ocean model (KPP), and coupled to a dynamical ocean model (NEMO). The analysis focuses on the impact of air–sea coupling, particularly in the Bay of Bengal (BoB), on NWP for monsoon rainfall. Seasonal‐mean biases in all three configurations are highly consistent and driven by errors in atmospheric processes. Rainfall is initially overestimated over India, but underestimated over the BoB, the latter associated with too much short‐wave radiation and too little cloud cover in MetUM. The excess short‐wave radiation ( >40 W · m −2 over the northwest BoB) is partially compensated by additional latent cooling, primarily due to overestimated surface wind speeds. In NEMO and KPP, coupling improves the timing of intraseasonal active and break phases over India, primarily the end of these phases, which are systematically too late in ATM. NEMO and KPP show a more realistic intraseasonal local phase relationship between sea surface temperature (SST) and rainfall throughout the BoB, but no configuration reproduces the observed significant lagged relationship between BoB SST and Indian rainfall. The lack of this relationship may be partly attributed to weak heat flux feedbacks to northern BoB SST, with the forecast short‐wave feedback having systematically the wrong sign (positive) compared to satellite radiation, and thus co", "link": "https://doi.org/10.1002/qj.3914", "authors": "Maria Valdivieso, Simon C. Peatman, Nicholas P. Klingaman", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2020-10-30", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["india*", "monsoon"]}, {"key": "doi:10.1002/qj.3313", "title": "The Global Precipitation Measurement (GPM) mission's scientific achievements and societal contributions: reviewing four years of advanced rain and snow observations", "summary": "Precipitation represents a life‐critical energy and hydrologic exchange between the Earth's atmosphere and its surface. As such, knowledge of where, when and how much rain and snow falls is essential for scientific research and societal applications. Building on the 17‐year success of the Tropical Rainfall Measurement Mission (TRMM), the Global Precipitation Measurement (GPM) Core Observatory (GPM‐CO) is the first US National Aeronautical and Space Administration (NASA) satellite mission specifically designed with sensors to observe the structure and intensities of both rain and falling snow. The GPM‐CO has proved to be a worthy successor to TRMM, extending and improving high‐quality active and passive microwave observations across all times of day. The GPM‐CO launched in early 2014, is a joint mission between NASA and the Japanese Aerospace Exploration Agency (JAXA), with sensors that include the NASA‐provided GPM Microwave Imager and the JAXA‐provided Dual‐frequency Precipitation Radar. These sensors were devised with high accuracy standards enabling them to be used as a reference for inter‐calibrating a constellation of partner satellite data. These inter‐calibrated partner satellite retrievals are used with infrared data to produce merged precipitation estimates at temporal scales of 30 min and spatial scales of 0.1° × 0.1°. Precipitation estimates from the GPM‐CO and partner constellation satellites, provided in near real time and later reprocessed with all ancillary data, are an indispensable source of precipitation data for operational and scientific users. Advances ", "link": "https://doi.org/10.1002/qj.3313", "authors": "Gail Skofronick‐Jackson, Dalia Kirschbaum, Walter Petersen, George Huffman, Chris Kidd, Erich Stocker", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2018-11", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1038/s41558-021-01173-9", "title": "Next-generation ensemble projections reveal higher climate risks for marine ecosystems", "summary": "Projections of climate change impacts on marine ecosystems have revealed long-term declines in global marine animal biomass and unevenly distributed impacts on fisheries. Here we apply an enhanced suite of global marine ecosystem models from the Fisheries and Marine Ecosystem Model Intercomparison Project (Fish-MIP), forced by new-generation Earth system model outputs from Phase 6 of the Coupled Model Intercomparison Project (CMIP6), to provide insights into how projected climate change will affect future ocean ecosystems. Compared with the previous generation CMIP5-forced Fish-MIP ensemble, the new ensemble ecosystem simulations show a greater decline in mean global ocean animal biomass under both strong-mitigation and high-emissions scenarios due to elevated warming, despite greater uncertainty in net primary production in the high-emissions scenario. Regional shifts in the direction of biomass changes highlight the continued and urgent need to reduce uncertainty in the projected responses of marine ecosystems to climate change to help support adaptation planning.", "link": "https://doi.org/10.1038/s41558-021-01173-9", "authors": "Derek P. Tittensor, Camilla Novaglio, Cheryl S. Harrison, Ryan F. Heneghan, Nicolas Barrier, Daniele Bianchi", "source": "Nature Climate Change", "published": "2021-10-21", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "uncertainty"]}, {"key": "doi:10.1038/s41558-020-0764-6", "title": "High climate sensitivity in CMIP6 model not supported by paleoclimate", "summary": "", "link": "https://doi.org/10.1038/s41558-020-0764-6", "authors": "Jiang Zhu, Christopher J. Poulsen, Bette L. Otto-Bliesner", "source": "Nature Climate Change", "published": "2020-4-30", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6"]}, {"key": "doi:10.1038/s41558-024-01990-8", "title": "Climate damage projections beyond annual temperature", "summary": "Estimates of global economic damage from climate change assess the effect of annual temperature changes. However, the roles of precipitation, temperature variability and extreme events are not yet known. Here, by combining projections of climate models with empirical dose–response functions translating shifts in temperature means and variability, rainfall patterns and extreme precipitation into economic damage, we show that at +3 ° C global average losses reach 10% of gross domestic product, with worst effects (up to 17%) in poorer, low-latitude countries. Relative to annual temperature damage, the additional impacts of projecting variability and extremes are smaller and dominated by interannual variability, especially at lower latitudes. However, accounting for variability and extremes when estimating the temperature dose–response function raises global economic losses by nearly two percentage points and exacerbates economic tail risks. These results call for region-specific risk assessments and the integration of other climate variables for a better understanding of climate change impacts.", "link": "https://doi.org/10.1038/s41558-024-01990-8", "authors": "Paul Waidelich, Fulden Batibeniz, James Rising, Jarmo S. Kikstra, Sonia I. Seneviratne", "source": "Nature Climate Change", "published": "2024-4-17", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1038/s41558-022-01309-5", "title": "Precipitation trends determine future occurrences of compound hot–dry events", "summary": "Compound hot–dry events—co-occurring hot and dry extremes—frequently cause damages to human and natural systems, often exceeding separate impacts from heatwaves and droughts. Strong increases in the occurrence of these events are projected with warming, but associated uncertainties remain large and poorly understood. Here, using climate model large ensembles, we show that mean precipitation trends exclusively modulate the future occurrence of compound hot–dry events over land. This occurs because local warming will be large enough that future droughts will always coincide with at least moderately hot extremes, even in a 2 °C warmer world. By contrast, precipitation trends are often weak and equivocal in sign, depending on the model, region and internal climate variability. Therefore, constraining regional precipitation trends will also constrain future compound hot–dry events. These results help to assess future frequencies of other compound extremes characterized by strongly different trends in the drivers.", "link": "https://doi.org/10.1038/s41558-022-01309-5", "authors": "Emanuele Bevacqua, Giuseppe Zappa, Flavio Lehner, Jakob Zscheischler", "source": "Nature Climate Change", "published": "2022-3-14", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1017/eds.2026.10068", "title": "Evaluating bias-adjusted climate data for extreme heat metrics in agricultural applications", "summary": "Bias adjustment is standard preprocessing for climate model output used in crop-impact and damage-assessment work. Most validation studies still emphasize mean temperature, even though agricultural applications often depend on nonlinear heat metrics built from daily extremes. We evaluate how bias adjustment propagates into Extreme Degree Day (EDD) metrics, which crop-yield and damage functions use to summarize heat stress above specified temperature cutoffs. Using ERA5 reanalysis as reference, we compare EDD from raw and bias-adjusted CMIP6 models (GFDL-ESM4, MPI-ESM1-2-HR, and EC-Earth3) across European ADM1 regions for 1994–2014. We compute EDD at seven thresholds (0, 4, 8, 12, 28, 30, and 32 °C), aggregate it with harvested-area weights for seven crops under rainfed and irrigated management, and sum it over crop-specific phenological windows. Bias adjustment reduces mean absolute error at low and moderate thresholds (EDD ≤ $ \\le $ less than or equals 12 °C) by 37–86 °C ⋅ $ \\cdot $ dot days at EDD-0 and 29–64 °C ⋅ $ \\cdot $ dot days at EDD-8. At extreme thresholds (EDD ≥ $ \\ge $ greater than or equals 28 °C), Δ $ \\Delta $ upper Delta Skill is small on average (1–4 °C ⋅ $ \\cdot $ dot days at EDD-28), and bias adjustment increases error in about 40% of evaluated combinations. The split between helpful and unhelpful bias adjustment follows the EDD threshold more closely than model identity, which has implications for impact studies that treat bias-adjusted data as uniformly preferable.", "link": "https://doi.org/10.1017/eds.2026.10068", "authors": "Muhammad Taky Tahmid", "source": "Environmental Data Science", "published": "2026", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "extreme*"]}, {"key": "doi:10.1002/qj.2063", "title": "Evaluation of the ECMWF ocean reanalysis system ORAS4", "summary": "A new operational ocean reanalysis system (ORAS4) has been implemented at ECMWF. It spans the period 1958 to the present. This article describes its main components and evaluates its quality. The adequacy of ORAS4 for the initialization of seasonal forecasts is discussed, along with the robustness of some prominent climate signals. ORAS4 has been evaluated using different metrics, including comparison with observed ocean currents, RAPID‐derived transports, sea‐level gauges, and GRACE‐derived bottom pressure. Compared to a control ocean model simulation, ORAS4 improves the fit to observations, the interannual variability, and seasonal forecast skill. Some problems have been identified, such as the underestimation of meridional overturning at 26°N, the magnitude of which is shown to be sensitive to the treatment of the coastal observations. ORAS4 shows a clear and robust shallowing trend of the Pacific Equatorial thermocline. It also shows a clear and robust nonlinear trend in the 0–700 m ocean heat content, consistent with other observational estimates. Some aspects of these climate signals are sensitive to the choice of sea‐surface temperature product and the specification of the observation‐error variances. The global sea‐level trend is consistent with the altimeter estimate, but the partition into volume and mass variations is more debatable, as inferred by discrepancies in the trend between ORAS4‐ and GRACE‐derived bottom pressure.", "link": "https://doi.org/10.1002/qj.2063", "authors": "Magdalena Alonso Balmaseda, Kristian Mogensen, Anthony T. Weaver", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2012-12-31", "first_seen": "2026-11-23T14:47:49+00:00", "score": 4, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": []}, {"key": "arxiv:2611.16941", "title": "Upscale energy transfer from mesoscale convective systems to African easterly waves", "summary": "African easterly waves (AEWs) drive the synoptic variability of West African monsoon rainfall via intricate two-way interactions with mesoscale convective systems (MCSs). The composite MCS-AEW system is a canonical example of multiscale interactions in the tropical atmosphere, with upscale feedbacks from deep convection driving the evolution of a larger-scale circulation. Here we support this perspective through application of techniques from turbulence theory, calculating for the first time patterns of interscale kinetic energy transfer, $\\mathcal{D}_L$, across different spatial scales $L$ around MCSs and AEW lifecycle phases. We study AEW and MCS dynamics in two pan-tropical 40 day Met Office Unified Model simulations with $\\sim$5km grid spacings, for which $\\mathcal{D}_L$ is calculated with the LoSSETT software package. We find explicitly-simulated MCSs show a distinctive vertical dipole structure of $\\mathcal{D}_L$ at scales below 1000km, with strong upscale energy transfer located in the upper troposphere within storm anvils. Regionally, upscale energy transfer occurs most strongly where organised convection is active. We find 200hPa upscale transfer consistently leads AEW troughs, and that growing continental AEWs in the explicit simulation are characterised by strengthened upscale transfer of energy from MCS to AEW scales. Case-study analysis shows this transfer can contribute to the eddy kinetic energy growth of strengthening AEW troughs. These signals are weak in a simulation with parameterised convection: here, zonal mean energetics show enhanced barotropic conver", "link": "https://arxiv.org/abs/2611.16941", "authors": "Ben Maybee, Elliot McKinnon-Gray, Dan Shipley, John Methven", "source": "arXiv", "published": "2026-11-12T15:23:00Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["monsoon"]}, {"key": "arxiv:2611.08700", "title": "TitanMPAS - a new global and regional Titan atmospheric circulation model. Part I: Global model results", "summary": "We developed TitanMPAS, a new Titan global and regional climate model, to simulate atmospheric dynamics and methane cycles. It integrates the non-hydrostatic MPAS dynamical core and TitanWRF physics parameterizations, with corrections to relax the thin-atmosphere assumptions on the gravity and curvature terms. TitanMPAS improves upon TitanWRF by incorporating a better moist convection parameterization and the observed surface properties. Long-term simulations ($>$100 Titan years) with a high resolution of $1^\\circ$ and the realistic topography show that TitanMPAS is able to produce the stratospheric superrotation with typical equatorial wind speed over $\\rm 120\\,ms^{-1}$ and the maximum zonal wind speed exceeding $\\rm 170\\,ms^{-1}$ . Besides the good match of temperature profiles to the Cassini CIRS observations, the simulated wind, temperature and methane abundance in the troposphere match well with Huygens probe in-situ measurements. TitanMPAS also captures the major features of seasonal methane precipitation distribution patterns inferred from the observed cloud activities, as well as the vertical and latitudinal variations of methane abundance in the reanalysis of Cassini VIMS data. Resolution sensitivity studies show that higher resolution produces faster stratospheric superrotation, as well as stronger near-surface wind due to better resolved terrain variations. We further demonstrate that, despite the weak solar insolation, the near-surface temperature, pressure, wind magnitude and methane abundance all exhibit diurnal variations. Lastly, we show potential impacts of", "link": "https://arxiv.org/abs/2611.08700", "authors": "Yuan Lian, Mark I. Richardson, Claire E. Newman, Martin A. Cordiner", "source": "arXiv", "published": "2026-11-05T21:00:00Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation"]}, {"key": "doi:10.5194/gmd-16-4233-2023", "title": "Simplified Kalman smoother and ensemble Kalman smoother for improving reanalyses", "summary": "The paper presents a simplification of the Kalman smoother that can be run as a post-processing step using only minimal stored information from a Kalman filter analysis, which is intended for use with large model products such as the reanalyses of the Earth system. A simple decay assumption is applied to cross-time error covariances, and we show how the resulting equations relate formally to the fixed-lag Kalman smoother and how they can be solved to give a smoother analysis along with an uncertainty estimate. The method is demonstrated in the Lorenz (1963) idealised system which is applied to both an extended and ensemble Kalman filter and smoother. In each case, the root mean square errors (RMSEs) against the truth, for both assimilated and unassimilated (independent) data, of the new smoother analyses are substantially smaller than for the original filter analyses, while being larger than for the full smoother solution. Up to 70 % (40 %) of the full smoother error reduction, with respect to the extended (ensemble) filters, respectively, is achieved. The uncertainties derived for the new smoother also agree remarkably well with the actual RMSE values throughout the assimilation period. The ability to run this smoother very efficiently as a post-processor should allow it to be useful for really large model reanalysis products and especially for ensemble products that are already being developed by various operational centres.", "link": "https://doi.org/10.5194/gmd-16-4233-2023", "authors": "Bo Dong, Ross Bannister, Yumeng Chen, Alison Fowler, Keith Haines", "source": "Geoscientific Model Development", "published": "2023-7-27", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"]}, {"key": "doi:10.1002/2017ms001115", "title": "The Met Office Global Coupled Model 3.0 and 3.1 (GC3.0 and GC3.1) Configurations", "summary": "The Global Coupled 3 (GC3) configuration of the Met Office Unified Model is presented. Among other applications, GC3 is the basis of the United Kingdom's submission to the Coupled Model Intercomparison Project 6 (CMIP6). This paper documents the model components that make up the configuration (although the scientific descriptions of these components are in companion papers) and details the coupling between them. The performance of GC3 is assessed in terms of mean biases and variability in long climate simulations using present‐day forcing. The suitability of the configuration for predictability on shorter time scales (weather and seasonal forecasting) is also briefly discussed. The performance of GC3 is compared against GC2, the previous Met Office coupled model configuration, and against an older configuration (HadGEM2‐AO) which was the submission to CMIP5. In many respects, the performance of GC3 is comparable with GC2, however, there is a notable improvement in the Southern Ocean warm sea surface temperature bias which has been reduced by 75%, and there are improvements in cloud amount and some aspects of tropical variability. Relative to HadGEM2‐AO, many aspects of the present‐day climate are improved in GC3 including tropospheric and stratospheric temperature structure, most aspects of tropical and extratropical variability and top‐of‐atmosphere and surface fluxes. A number of outstanding errors are identified including a residual asymmetric sea surface temperature bias (cool northern hemisphere, warm Southern Ocean), an overly strong global hydrological cycle and insu", "link": "https://doi.org/10.1002/2017ms001115", "authors": "K. D. Williams, D. Copsey, E. W. Blockley, A. Bodas‐Salcedo, D. Calvert, R. Comer", "source": "Journal of Advances in Modeling Earth Systems", "published": "2018-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["cmip6"]}, {"key": "doi:10.1029/2019ms002035", "title": "Seasonal to Decadal Predictions With MIROC6: Description and Basic Evaluation", "summary": "The present paper presents results of seasonal‐to‐decadal climate predictions based on a coupled climate model called the Model for Interdisciplinary Research on Climate version 6 (MIROC6) contributing to the Coupled Model Intercomparison Project Phase 6 (CMIP6). MIROC6 is initialized every year for 1960–2018 by assimilating observed ocean temperature and salinity anomalies and full fields of sea ice concentration and by prescribing atmospheric initial states from reanalysis data. The impacts of updating the system on prediction skill are then evaluated by comparing hindcast experiments between the MIROC6 prediction system and a previous system based on MIROC version 5 (MIROC5). Skill of seasonal prediction is overall improved in association with representation and initialization of El Niño/Southern Oscillation (ENSO), the Quasi‐Biennial Oscillation (QBO), and the Northern Hemisphere sea ice concentration in MIROC6. In particular, the QBO is skillfully predicted up to 3 years ahead with a maximum anomaly correlation exceeding r = 0.8. The prediction skill for the North Atlantic Oscillation in winter is also enhanced, but the prediction still suffers from model's inherent errors. On decadal timescales, MIROC6 has a larger fraction of areas of the globe with better surface temperature skill at all lead times than MIROC5, and it has predictive skill in the annual‐mean sea surface temperature (SST) in the North Atlantic and the Pacific. In particular, MIROC6 hindcasts at 2–5 years lead time are able to capture the spatial structure of SST changes in the North Pacific and the ea", "link": "https://doi.org/10.1029/2019ms002035", "authors": "Takahito Kataoka, Hiroaki Tatebe, Hiroshi Koyama, Takashi Mochizuki, Koji Ogochi, Hiroaki Naoe", "source": "Journal of Advances in Modeling Earth Systems", "published": "2020-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["cmip6"]}, {"key": "doi:10.1029/2003gl018857", "title": "The 2003 heat wave in Europe: A shape of things to come? An analysis based on Swiss climatological data and model simulations", "summary": "The 2003 heat wave that affected much of Europe from June to September bears a close resemblance to what many regional climate models are projecting for summers in the latter part of the 21st century. Model results suggest that under enhanced atmospheric greenhouse‐gas concentrations, summer temperatures are likely to increase by over 4°C on average, with a corresponding increase in the frequency of severe heat waves. Statistical features of the 2003 heat wave for the Swiss site of Basel are investigated and compared to both past, 20th century events and possible future extreme temperatures based on model simulations of climatic change. For many purposes, the 2003 event can be used as an analog of future summers in coming decades in climate impacts and policy studies.", "link": "https://doi.org/10.1029/2003gl018857", "authors": "Martin Beniston", "source": "Geophysical Research Letters", "published": "2004-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["extreme*"]}, {"key": "doi:10.1029/2021ef002600", "title": "Coral Reef Exposure to Damaging Tropical Cyclone Waves in a Warming Climate", "summary": "Tropical cyclones generate large waves that physically damage coral communities and are commonly cited as a worsening threat to coral reefs under climate change. However, beyond projections of ocean basin‐scale changes in cyclone intensity, the other determinants of future coral reef damage such as cyclone size and duration remain uncertain. Here, we determine the extent to which downscaled cyclones represent observed cyclone characteristics that influence wave damage to Australian coral reef regions. We then investigate mid‐century (2040–2060) and end of century (2080–2100) downscaled tracks to assess whether cyclone characteristics will change with future warming under a high‐emissions scenario. We find that spatial uncertainties in downscaled cyclogenesis and track positions limit estimates of reef damage for individual coral reefs and regions. Further, the models are unable to reproduce the most reef damaging cyclones for any of the regions. The downscaled tracks capture observed cyclone characteristics, such as size, impacting the Great Barrier Reef well, but perform poorly for the Northern Territory, with mixed performance for the Coral Sea and Western Australia. We find no clear evidence that cyclones will cause more damage to Australian coral reef regions in the future, at least based on the climate models and downscaling approach examined here. There is increasing interest in using tropical cyclone projections to assess future coral reef exposure to damaging waves. We recommend caution when interpreting such projections due to large uncertainty in the mechanisms th", "link": "https://doi.org/10.1029/2021ef002600", "authors": "Adele M. Dixon, Marji Puotinen, Hamish A. Ramsay, Maria Beger", "source": "Earth's Future", "published": "2022-8", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["uncertainty"]}, {"key": "doi:10.1029/2019ef001473", "title": "Analysis of Compound Climate Extremes and Exposed Population in Africa Under Two Different Emission Scenarios", "summary": "It is well established that Africa is particularly exposed to climate extremes including heat waves, droughts, and intense rainfall events. How exposed Africa is to the co‐occurrence of these events is however virtually unknown. This study provides the first analysis of projected changes in the co‐occurrence of five such compound climate extremes in Africa, under a low (RCP2.6) and high (RCP8.5) emissions scenario. These changes are combined with population projections for a low (SSP1) and high (SSP3) population growth scenario, in order to provide estimates of the number of people that may be exposed to such events at the end of the 21st century. We make use of an ensemble of regional climate projections from the Coordinated Output for Regional Evaluations (CORE) project embedded in the Coordinated Regional Climate Downscaling Experiment (CORDEX) framework. This ensemble comprises five different Earth System Model/Regional Climate Model (ESM/RCM) combinations with three different ESMs and two RCMs. We show that all five compound climate extremes will increase in frequency, with changes being greater under RCP8.5 than RCP2.6. Moreover, populations exposed to these changes are greater under RCP8.5/SSP3, than RCP2.6/SSP1, increasing by 47‐ and 12‐fold, respectively, compared to the present‐day. Regions of Africa that are particularly exposed are West Africa, Central‐East Africa, and Northeast and Southeast Africa. Increased exposure is mainly driven by the interaction between climate and population growth, and the effect of population alone. This has important policy implicat", "link": "https://doi.org/10.1029/2019ef001473", "authors": "T. Weber, P. Bowyer, D. Rechid, S. Pfeifer, F. Raffaele, A. R. Remedio", "source": "Earth's Future", "published": "2020-9", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["extreme*"]}, {"key": "doi:10.1029/2020jd033223", "title": "Atmospheric and Land Surface Contributions to Heatwaves: An Australian Perspective", "summary": "Heatwaves are associated with prolonged hot conditions that accompany a quasi‐stationary anticyclone. This is a consequence of different heat mechanisms including subsidence, horizontal heat advection, and sensible heating from the land surface. Understanding the relative contribution of each of these heat mechanisms is important for improving the predictability of heatwaves. However, the evolution of heatwaves can vary depending upon antecedent conditions, and therefore, it is necessary to examine the role of both atmospheric processes and land surface conditions together. Using a regional climate model, we simulate five heatwaves that occurred over different parts of Australia. Using Lagrangian back‐trajectories to inform the atmospheric flow preceding each of the heatwave events, we perturb the evaporative fraction where and when the flow enters the boundary layer. We aim to understand the role of land surface energy partitioning on two of the heat mechanisms and identify under what circumstances it has limited influence on a heatwave. We find that the sensitivity to changes in land surface energy partitioning varied considerably between the events. Advection was critical by either enhancing the accumulation of heat into the affected location or for dissipating the event by ventilating the region with cooler air. Convective precipitation was triggered when increasing the evaporative fraction due to a warm atmosphere and more moisture supplied by the land surface. Finally, the contribution of each of the heat mechanisms varied between the events due to atmospheric and lan", "link": "https://doi.org/10.1029/2020jd033223", "authors": "Annette L. Hirsch, Malcolm J. King", "source": "JGR: Atmospheres", "published": "2020-9-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation"]}, {"key": "doi:10.1029/2020jd032874", "title": "Historical Evaluation and Future Projections of 100‐m Wind Energy Potentials Over CORDEX‐East Asia", "summary": "Countries in East Asia have set ambitious goals for the development of wind energy to meet the increasing energy demand and to mitigate anthropogenic climate change. However, few studies have investigated changes in wind energy over East Asia under future climatic conditions. In this study, we investigate future changes of 100‐m wind speed and wind energy potential over the CORDEX‐East Asia region under the Representative Concentration Pathway (RCP) 8.5 scenario, by using ensemble simulations from the regional climate model Consortium for small‐scale modeling in CLimate Mode (CCLM). A multivariate bias adjustment method based on the N ‐dimensional probability density function transform is used to correct raw simulated horizontal wind components. The comparison between future climate (2021–2050 and 2070–2099) and the present climate (1971–2000) shows decreases in wind speed, wind power density, and wind energy output over most of the CORDEX‐East Asia region, especially in the tropics. Projected increases are pronounced over the Himalayan regions, the Indo‐China Peninsula, the South China Sea, and the western Pacific Ocean in summer and over northeastern China, parts of Western China and the Indo‐China Peninsula in winter. Interannual and intra‐annual variability of wind power density are projected to intensify significantly for most of the CORDEX‐East Asia region. The occurrence of weak wind speeds (<3 m/s) is projected to increase, while strong wind speeds (>11 m/s) are projected to decrease over most of the ocean.", "link": "https://doi.org/10.1029/2020jd032874", "authors": "Delei Li, Jianlong Feng, Alessandro Dosio, Jifeng Qi, Zhenhua Xu, Baoshu Yin", "source": "JGR: Atmospheres", "published": "2020-7-29", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["himalaya*"]}, {"key": "doi:10.1002/2014jd022232", "title": "Influence of irrigation on land hydrological processes over California", "summary": "In this study, a regional climate model (RCM) is employed to investigate the effect of irrigation on hydrology over California through implementing a “realistic irrigation” scheme. Our results indicate that the RCM with a realistic irrigation scheme commonly practiced in California can capture the soil moisture and evapotranspiration (ET) variation very well in comparison with the available in situ and remote sensing data. The RCM results show significant improvement in comparison with those outputs from the default run and the commonly used runs with fixed soil moisture at field capacity. Furthermore, the model reproduces the observed decreasing trends of the reference ET (i.e., ET0) from the California Irrigation Management Information System (CIMIS). The observed decreasing trend is most likely due to the decreasing trend of downward solar radiation shown by models and CIMIS observations. This issue is fundamental in projecting future irrigation water demand. The deep soil percolation rate changes depending on the irrigation method and irrigation duration. Finally, the model results show that precipitation change due to irrigation in California is relatively small in amount and mainly occurs along the midlatitudes in the western United States.", "link": "https://doi.org/10.1002/2014jd022232", "authors": "Soroosh Sorooshian, Amir AghaKouchak, Jialun Li", "source": "JGR: Atmospheres", "published": "2014-12-5", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation"]}, {"key": "doi:10.1038/s41612-021-00178-7", "title": "Business-as-usual will lead to super and ultra-extreme heatwaves in the Middle East and North Africa", "summary": "Global climate projections suggest a significant intensification of summer heat extremes in the Middle East and North Africa (MENA). To assess regional impacts, and underpin mitigation and adaptation measures, robust information is required from climate downscaling studies, which has been lacking for the region. Here, we project future hot spells by using the Heat Wave Magnitude Index and a comprehensive ensemble of regional climate projections for MENA. Our results, for a business-as-usual pathway, indicate that in the second half of this century unprecedented super- and ultra-extreme heatwave conditions will emerge. These events involve excessively high temperatures (up to 56 °C and higher) and will be of extended duration (several weeks), being potentially life-threatening for humans. By the end of the century, about half of the MENA population (approximately 600 million) could be exposed to annually recurring super- and ultra-extreme heatwaves. It is expected that the vast majority of the exposed population (>90%) will live in urban centers, who would need to cope with these societally disruptive weather conditions.", "link": "https://doi.org/10.1038/s41612-021-00178-7", "authors": "George Zittis, Panos Hadjinicolaou, Mansour Almazroui, Edoardo Bucchignani, Fatima Driouech, Khalid El Rhaz", "source": "npj Climate and Atmospheric Science", "published": "2021-3-23", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["extreme*"]}, {"key": "doi:10.1038/s41612-023-00358-7", "title": "The uneven impact of climate change on drought with elevation in the Canary Islands", "summary": "Climate models project an increase in drought and aridity in many regions in response to greenhouse gas concentrations in the atmosphere. In areas with complex topography, such as the Canary Islands, elevation gradients may play an important role in future changes. Convection-permitting climate simulations driven by data from three global climate models included in the Coupled Model Intercomparison Project (CMIP5) have been performed for the Canary Islands. A significant increase in the duration and severity of drought is projected by the end of the twenty-first century (2070–2099), relative to the recent past (1980–2009), under intermediate and high emissions scenarios. In addition, the percentage of land affected by droughts, on average, would increase considerably, covering up to 96% in the higher elevations, in the business-as-usual scenario. These changes and the increase in aridity are more pronounced at higher altitudes due to a clear dependence of temperature rise as a function of elevation and a substantial decrease in precipitation.", "link": "https://doi.org/10.1038/s41612-023-00358-7", "authors": "Judit Carrillo, Sara Hernández-Barrera, Francisco J. Expósito, Juan P. Díaz, Albano González, Juan C. Pérez", "source": "npj Climate and Atmospheric Science", "published": "2023-4-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation"]}, {"key": "doi:10.1038/s41612-023-00330-5", "title": "Inter-seasonal connection of typical European heatwave patterns to soil moisture", "summary": "Although prolonged heat periods have become a recurring feature of European climate, little knowledge is available on dominant spatial patterns of heatwaves and their influence on moisture-related processes. Increased knowledge will help to improve heatwave and drought prediction and mitigation. This study uses hierarchical agglomerative clustering to derive nine dominating spatial heatwave patterns from a 50-member regional climate model (Canadian Regional Climate Model version 5, CRCM5-LE). The heatwave patterns correspond well with clusters derived from an observational data set (E-OBS) and with extreme historical heatwave events. Moreover, we analyse the occurrence of heatwaves in the identified spatial patterns regarding a soil moisture deficit present before and after the event. We show that negative soil moisture anomalies in the preceding winter/spring (JFMA) can serve as a predictor for heatwaves in South Europe. For North Europe, we find a negative correlation between the number of heatwave days in summer and autumn (OND) soil moisture content.", "link": "https://doi.org/10.1038/s41612-023-00330-5", "authors": "Elizaveta Felsche, Andrea Böhnisch, Ralf Ludwig", "source": "npj Climate and Atmospheric Science", "published": "2023-1-21", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["extreme*"]}, {"key": "doi:10.1038/s41612-023-00474-4", "title": "Midwinter breakdown of ENSO climate impacts in East Asia", "summary": "The El Niño-Southern Oscillation (ENSO) influence on the East Asian winter monsoon (EAWM) exhibits remarkable non-stationarity on subseasonal timescales, severely limiting climate predictability. Here, based on observational and reanalysis datasets, we identify a robust subseasonal variability in the EAWM response to ENSO, with a notable synchronous break in mid-January lasting about 10 days. We suggest that this breakdown is largely caused by interference from the abrupt phase reversal of the ENSO-driven North Atlantic Oscillation (NAO), which occurs about a week earlier in early January. During El Niño years, the NAO phase transition from positive to negative triggers a rapid change in the mid-latitude atmospheric circulation via the quasi-stationary Rossby wave adjustment. This results in the strengthening of the Siberian high, which produces strong northerly wind anomalies over East Asia, while the anomalous western North Pacific anticyclone weakens and shrinks to the south, eventually leading to the collapse of the teleconnection.", "link": "https://doi.org/10.1038/s41612-023-00474-4", "authors": "Xin Geng, Kyung-Min Noh, Kyungna Kim, Jong-Seong Kug", "source": "npj Climate and Atmospheric Science", "published": "2023-9-29", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["monsoon"]}, {"key": "doi:10.5194/wcd-7-223-2026", "title": "Linking European droughts to year-round weather regimes", "summary": "European droughts have far-reaching socio-economic and ecological impacts, yet their prediction remains challenging due to the complex interplay between large-scale atmospheric circulation patterns and local thermodynamic processes. This study investigates how persistent North Atlantic weather regimes influence the occurrence and spatial distribution of seasonal meteorological droughts across Europe throughout the year. Using reanalysis datasets and a tailored regionalization based on drought synchronicity, we identify six coherent European sub-regions and relate drought events, defined by the standardized precipitation index (SPI3), to year-round weather regimes derived from 500 hPa geopotential height anomalies. Our analysis shows that while each weather regime exhibits distinctive and relatively stable precipitation patterns throughout the year, only a fraction of droughts – primarily in western Europe and during winter – can be directly attributed to anomalies in regime frequency. The findings underline the partial but regionally significant role of North Atlantic circulation patterns in shaping European drought risk, highlighting opportunities and limitations for improving drought forecasts on sub-seasonal to seasonal timescales. This study emphasizes the added value of using year-round weather regimes as a unifying framework for understanding drought drivers, overcoming the constraints of purely seasonal classifications. Improved understanding of these links could help refine climate models and support more robust early-warning systems for drought management across di", "link": "https://doi.org/10.5194/wcd-7-223-2026", "authors": "Onaïa Savary, Constantin Ardilouze, Julien Cattiaux", "source": "Weather and Climate Dynamics", "published": "2026-1-28", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"]}, {"key": "doi:10.5194/wcd-4-1071-2023", "title": "How do different pathways connect the stratospheric polar vortex to its tropospheric precursors?", "summary": "Processes involving troposphere–stratosphere coupling have been identified as important contributors to an improved subseasonal to seasonal prediction in the mid-latitudes. However, atmosphere models still struggle to accurately predict stratospheric extreme events. Based on a novel approach in this study, we use ERA5 reanalysis data and ensemble simulations with the ICOsahedral Non-hydrostatic atmospheric model (ICON) to investigate tropospheric precursor patterns, localised troposphere–stratosphere coupling mechanisms, and the involved timescales of these processes in the Northern Hemisphere extended winter. We identify two precursor regions: mean sea level pressure in the Ural region is negatively correlated with the strength of the stratospheric polar vortex for the following 5–55 d with a maximum at 25–45 d, and the pressure in the extended Aleutian region is positively correlated with the strength of the stratospheric polar vortex the following 10–50 d with a maximum at 20–30 d. A simple precursor index based on the mean pressure difference of these two regions is very strongly linked to the strength of the stratospheric polar vortex in the following month. The pathways connecting these two regions to the strength of the stratospheric polar vortex, however, differ from one another. Whereas a vortex weakening can be connected to prior increased vertical planetary wave forcing due to high-pressure anomalies in the Ural region, the pathway for the extended Aleutian region is less straightforward. A low-pressure anomaly in this region can trigger a Pacific–North American-", "link": "https://doi.org/10.5194/wcd-4-1071-2023", "authors": "Raphael Harry Köhler, Ralf Jaiser, Dörthe Handorf", "source": "Weather and Climate Dynamics", "published": "2023-12-6", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme*"]}, {"key": "doi:10.5194/wcd-2-1-2021", "title": "Lagrangian detection of precipitation moisture sources for an arid region in northeast Greenland: relations to the North Atlantic Oscillation, sea ice cover, and temporal trends from 1979 to 2017", "summary": "Temperature in northeast Greenland is expected to rise at a faster rate than the global average as a consequence of anthropogenic climate change. Associated with this temperature rise, precipitation is also expected to increase as a result of increased evaporation from a warmer and ice-free Arctic Ocean. In recent years, numerous palaeoclimate projects have begun working in the region with the aim of improving our understanding of how this highly sensitive region responds to a warmer world. However, a lack of meteorological stations within the area makes it difficult to place the palaeoclimate records in the context of present-day climate. This study aims to improve our understanding of precipitation and moisture source dynamics over a small arid region located at 80 ∘ N in northeast Greenland. The origin of water vapour for precipitation over the study region is detected by a Lagrangian moisture source diagnostic, which is applied to reanalysis data from the European Centre for Medium-Range Weather Forecasts (ERA-Interim) from 1979 to 2017. While precipitation amounts are relatively constant during the year, the regional moisture sources display a strong seasonality. The most dominant winter moisture sources are the North Atlantic above 45 ∘ N and the ice-free Atlantic sector of the Arctic Ocean, while in summer the patterns shift towards local and north Eurasian continental sources. During the positive phases of the North Atlantic Oscillation (NAO), evaporation and moisture transport from the Norwegian Sea are stronger, resulting in larger and more variable precipitation ", "link": "https://doi.org/10.5194/wcd-2-1-2021", "authors": "Lilian Schuster, Fabien Maussion, Lukas Langhamer, Gina E. Moseley", "source": "Weather and Climate Dynamics", "published": "2021-1-14", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"]}, {"key": "doi:10.1007/s00382-022-06257-6", "title": "Effects of grid spacing on high-frequency precipitation variance in coupled high-resolution global ocean–atmosphere models", "summary": "High-frequency precipitation variance is calculated in 12 different free-running (non-data-assimilative) coupled high resolution atmosphere–ocean model simulations, an assimilative coupled atmosphere–ocean weather forecast model, and an assimilative reanalysis. The results are compared with results from satellite estimates of precipitation and rain gauge observations. An analysis of irregular sub-daily fluctuations, which was applied by Covey et al. (Geophys Res Lett 45:12514–12522, 2018. https://doi.org/10.1029/2018GL078926 ) to satellite products and low-resolution climate models, is applied here to rain gauges and higher-resolution models. In contrast to lower-resolution climate simulations, which Covey et al. (2018) found to be lacking with respect to variance in irregular sub-daily fluctuations, the highest-resolution simulations examined here display an irregular sub-daily fluctuation variance that lies closer to that found in satellite products. Most of the simulations used here cannot be analyzed via the Covey et al. (2018) technique, because they do not output precipitation at sub-daily intervals. Thus the remainder of the paper focuses on frequency power spectral density of precipitation and on cumulative distribution functions over time scales (2–100 days) that are still relatively “high-frequency” in the context of climate modeling. Refined atmospheric or oceanic model grid spacing is generally found to increase high-frequency precipitation variance in simulations, approaching the values derived from observations. Mesoscale-eddy-rich ocean simulations significan", "link": "https://doi.org/10.1007/s00382-022-06257-6", "authors": "Charles X. Light, Brian K. Arbic, Paige E. Martin, Laurent Brodeau, J. Thomas Farrar, Stephen M. Griffies", "source": "Climate Dynamics", "published": "2022-3-29", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"]}, {"key": "doi:10.1175/mwr3120.1", "title": "The Operational JMA Nonhydrostatic Mesoscale Model", "summary": "An operational nonhydrostatic mesoscale model has been developed by the Numerical Prediction Division (NPD) of the Japan Meteorological Agency (JMA) in partnership with the Meteorological Research Institute (MRI). The model is based on the MRI/NPD unified nonhydrostatic model (MRI/NPD-NHM), while several modifications have been made for operational numerical weather prediction with a horizontal resolution of 10 km. A fourth-order advection scheme considering staggered grid configuration is implemented. The buoyancy term is directly evaluated from density perturbation. A time-splitting scheme for advection has been developed, where the low-order (second order) part of advection is modified in the latter half of the leapfrog time integration. Physical processes have also been revised, especially in the convective parameterization and PBL schemes. A turbulent kinetic energy (TKE) diagnostic scheme has been developed to overcome problems that arise to predict TKE. The model performance for mesoscale NWP has been verified by comparison with a former operational hydrostatic mesoscale model of JMA. It is found that the new nonhydrostatic mesoscale model outperforms the hydrostatic model in the prediction of synoptic fields and quantitative precipitation forecasts.", "link": "https://doi.org/10.1175/mwr3120.1", "authors": "Kazuo Saito, Tsukasa Fujita, Yoshinori Yamada, Jun-ichi Ishida, Yukihiro Kumagai, Kohei Aranami", "source": "Monthly Weather Review", "published": "2006-4-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"]}, {"key": "doi:10.1175/mwr3145.1", "title": "Object-Based Verification of Precipitation Forecasts. Part I: Methodology and Application to Mesoscale Rain Areas", "summary": "A recently developed method of defining rain areas for the purpose of verifying precipitation produced by numerical weather prediction models is described. Precipitation objects are defined in both forecasts and observations based on a convolution (smoothing) and thresholding procedure. In an application of the new verification approach, the forecasts produced by the Weather Research and Forecasting (WRF) model are evaluated on a 22-km grid covering the continental United States during July–August 2001. Observed rainfall is derived from the stage-IV product from NCEP on a 4-km grid (averaged to a 22-km grid). It is found that the WRF produces too many large rain areas, and the spatial and temporal distribution of the rain areas reveals regional underestimates of the diurnal cycle in rain-area occurrence frequency. Objects in the two datasets are then matched according to the separation distance of their centroids. Overall, WRF rain errors exhibit no large biases in location, but do suffer from a positive size bias that maximizes during the later afternoon. This coincides with an excessive narrowing of the rainfall intensity range, consistent with the dominance of parameterized convection. Finally, matching ability has a strong dependence on object size and is interpreted as the influence of relatively predictable synoptic-scale systems on the larger areas.", "link": "https://doi.org/10.1175/mwr3145.1", "authors": "Christopher Davis, Barbara Brown, Randy Bullock", "source": "Monthly Weather Review", "published": "2006-7-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"]}, {"key": "doi:10.1175/waf-d-13-00136.1", "title": "Reproducing the September 2013 Record-Breaking Rainfall over the Colorado Front Range with High-Resolution WRF Forecasts", "summary": "Four convection-permitting Weather Research and Forecasting Model (WRF) forecasts were produced in an attempt to replicate the record-breaking rainfall across the Colorado Front Range between 1200 UTC 11 September and 1200 UTC 13 September 2013. A nested WRF domain with 4- and 1-km horizontal grid spacings was employed, and sensitivity to initial conditions (ICs) and microphysics (MP) parameterizations was examined. Rainfall forecasts were compared to gridded observations produced by National Weather Service River Forecast Centers and gauge measurements from the Community Collaborative Rain, Hail and Snow Network (CoCoRaHS). All 1-km forecasts produced 48-h rainfall exceeding 250 mm over portions of the Colorado Front Range and were more consistent with observations than the 4-km forecasts. While localized sensitivities to both ICs and MP were noted, systematic differences were not attributable to the varied ICs or MP schemes. At times, the 1-km forecasts produced precipitation structures similar to those observed, but none of the forecasts successfully captured the observed mesoscale evolution of the entire rainfall event. Nonetheless, as all 1-km forecasts produced torrential rainfall over the Colorado Front Range, these forecasts could have been useful guidance for this event.", "link": "https://doi.org/10.1175/waf-d-13-00136.1", "authors": "Craig S. Schwartz", "source": "Weather and Forecasting", "published": "2014-4-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation"]}, {"key": "doi:10.1175/waf-d-21-0151.1", "title": "The High-Resolution Rapid Refresh (HRRR): An Hourly Updating Convection-Allowing Forecast Model. Part I: Motivation and System Description", "summary": "The High-Resolution Rapid Refresh (HRRR) is a convection-allowing implementation of the Advanced Research version of the Weather Research and Forecasting (WRF-ARW) Model with hourly data assimilation that covers the conterminous United States and Alaska and runs in real time at the NOAA/National Centers for Environmental Prediction (NCEP). Implemented operationally at NOAA/NCEP in 2014, the HRRR features 3-km horizontal grid spacing and frequent forecasts (hourly for CONUS and 3-hourly for Alaska). HRRR initialization is designed for optimal short-range forecast skill with a particular focus on the evolution of precipitating systems. Key components of the initialization are radar-reflectivity data assimilation, hybrid ensemble-variational assimilation of conventional weather observations, and a cloud analysis to initialize stratiform cloud layers. From this initial state, HRRR forecasts are produced out to 18 h every hour, and out to 48 h every 6 h, with boundary conditions provided by the Rapid Refresh system. Between 2014 and 2020, HRRR development was focused on reducing model bias errors and improving forecast realism and accuracy. Improved representation of the planetary boundary layer, subgrid-scale clouds, and land surface contributed extensively to overall HRRR improvements. The final version of the HRRR (HRRRv4), implemented in late 2020, also features hybrid data assimilation using flow-dependent covariances from a 3-km, 36-member ensemble (“HRRRDAS”) with explicit convective storms. HRRRv4 also includes prediction of wildfire smoke plumes. The HRRR provides a bas", "link": "https://doi.org/10.1175/waf-d-21-0151.1", "authors": "David C. Dowell, Curtis R. Alexander, Eric P. James, Stephen S. Weygandt, Stanley G. Benjamin, Geoffrey S. Manikin", "source": "Weather and Forecasting", "published": "2022-8", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"]}, {"key": "doi:10.1175/waf-d-21-0130.1", "title": "The High-Resolution Rapid Refresh (HRRR): An Hourly Updating Convection-Allowing Forecast Model. Part II: Forecast Performance", "summary": "The High-Resolution Rapid Refresh (HRRR) is a convection-allowing implementation of the Advanced Research version of the Weather Research and Forecast (WRF-ARW) Model that covers the conterminous United States and Alaska and runs hourly (for CONUS; every 3 h for Alaska) in real time at the National Centers for Environmental Prediction. The high-resolution forecasts support a variety of user applications including aviation, renewable energy, and prediction of many forms of severe weather. In this second of two articles, forecast performance is documented for a wide variety of forecast variables and across HRRR versions. HRRR performance varies across geographical domain, season, and time of day depending on both prevalence of particular meteorological phenomena and the availability of both conventional and nonconventional observations. Station-based verification of surface weather forecasts (2-m temperature and dewpoint temperature, 10-m winds, visibility, and cloud ceiling) highlights the ability of the HRRR to represent daily planetary boundary layer evolution and the development of convective and stratiform cloud systems, while gridded verification of simulated composite radar reflectivity and quantitative precipitation forecasts reveals HRRR predictive skill for summer and winter precipitation systems. Significant improvements in performance for specific forecast problems are documented for the upgrade versions of the HRRR (HRRRv2, v3, and v4) implemented in 2016, 2018, and 2020, respectively. Development of the HRRR model data assimilation and physics paves the way for ", "link": "https://doi.org/10.1175/waf-d-21-0130.1", "authors": "Eric P. James, Curtis R. Alexander, David C. Dowell, Stephen S. Weygandt, Stanley G. Benjamin, Geoffrey S. Manikin", "source": "Weather and Forecasting", "published": "2022-8", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"]}, {"key": "doi:10.1175/waf-d-11-00062.1", "title": "Assimilation of F-16 Special Sensor Microwave Imager/Sounder Data in the NCEP Global Forecast System", "summary": "The Special Sensor Microwave Imager/Sounder (SSMIS) on board the Defense Meteorological Satellite Program (DMSP) F-16 satellite is the first conically scanning sounding instrument that provides information on atmospheric temperature and water vapor profiles. The SSMIS data were preprocessed by the Naval Research Laboratory (NRL) using its Unified Preprocessor Package (UPP) and then distributed to the numerical weather prediction centers by the Fleet Numerical Meteorology and Oceanography Center (FNMOC). This dataset was assimilated into the Global Forecast System (GFS) using gridpoint statistical interpolation (GSI). The initial assimilation of the SSMIS data into the GFS did not improve the medium-range (5–7 days) forecast skill. The SSMIS bias (O-B) still changes with location and time after the GSI bias-correction scheme is implemented. This bias characteristic is related to residual calibration errors in the correction of the SSMIS antenna emission and warm target contamination. The large O-B standard deviation is probably due to the large instrument noise in the SSMIS UPP data. The large O-B and its standard deviation for several surface sensitive channels are also caused by uncertainty in surface emissivity. In this study, a new scheme is developed to remove regionally dependent bias using a weekly composite O-B. The SSMIS noise is reduced through a Gaussian function filter. A new emissivity database for snow and sea ice is developed for the SSMIS surface sensitive channels. After applying these algorithms, the quality of the SSMIS low-atmospheric sounding (LAS) data ", "link": "https://doi.org/10.1175/waf-d-11-00062.1", "authors": "Banghua Yan, Fuzhong Weng", "source": "Weather and Forecasting", "published": "2012-6-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Downscaling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"]}, {"key": "doi:10.1175/2008waf2007101.1", "title": "On the Impact of WRF Model Vertical Grid Resolution on Midwest Summer Rainfall Forecasts", "summary": "Weather Research and Forecast (WRF) model exploratory sensitivity simulations were performed to determine the impact of vertical grid resolution (VGR) on the forecast skill of Midwest summer rainfall. Varying the VGR indicated that a refined VGR, while adopting the widely used North America Regional Reanalysis (NARR) for initial and lateral boundary conditions, does not necessarily result in a consistent improvement in quantitative precipitation forecasts (QPFs). When averaged over a variety of microphysical schemes in an illustrative case, equitable threat score (ETS) and bias values actually worsened with a greater overpredicted rainfall for half of the rainfall thresholds when the VGR was refined. Averaged over strongly forced cases, ETS values worsened for all rainfall thresholds while biases mostly increased, indicating a further overprediction of rainfall when the number of levels was increased. Skill improved, however, for all rainfall thresholds when the resolution above the melting level was increased. Skill also improved for most rainfall thresholds when the resolution in the surface layer was increased, which is attributed to better-resolved surface turbulent momentum and thermal fluxes. Likewise, a refined VGR resulted in improvements in weakly forced cases, which are governed mostly by thermodynamic forcing and are sensitive to vertical profiles of temperature and moisture. Application of the factor separation method suggested that the refined VGR more frequently had a negative impact on skill through the interaction between lower-atmospheric processes and micr", "link": "https://doi.org/10.1175/2008waf2007101.1", "authors": "Eric A. Aligo, William A. Gallus, Moti Segal", "source": "Weather and Forecasting", "published": "2009-4-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"]}, {"key": "doi:10.1175/waf-d-12-00062.1", "title": "Calibrated Short-Range Ensemble Precipitation Forecasts Using Extended Logistic Regression with Interaction Terms", "summary": "Extended logistic regression has been shown to be a method well suited to calibrating precipitation forecasts from medium-range ensemble prediction systems. The extension of the logistic regression unifies the separate predictive equations for each threshold, introducing the predictive threshold as part of the predictors. Mutually consistent probabilities and a reduction in the total number of regression parameters to be evaluated are part of the benefits of the extended approach. However, considering the predictive threshold as the only “unification” predictor constrains the regression parameters associated with the primary predictors to be constant with the threshold. To alleviate the rigidity of the extended scheme, interaction terms are introduced in the unified predictive equation. Within the framework of the convection-permitting German-focused Consortium for Small-Scale Modeling ensemble prediction system (COSMO-DE-EPS), it is shown that extended logistic regression, applied to short-range precipitation forecasts with the ensemble mean as the primary predictor, improves the performance of the system. Interaction effects are first illustrated through the analysis of regression parameters and then the positive impact on the calibrated forecasts of the new extended logistic regression scheme, including interaction terms, is shown using quantitative and qualitative measures of reliability and sharpness.", "link": "https://doi.org/10.1175/waf-d-12-00062.1", "authors": "Zied Ben Bouallègue", "source": "Weather and Forecasting", "published": "2013-4-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Downscaling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"]}, {"key": "doi:10.1002/qj.70176", "title": "Intensity dependence of El Niño and La Niña evolution and mixed‐layer heat‐budget processes", "summary": "El Niño and La Niña events exhibit distinct spatial, temporal, and dynamical behaviors that vary with their intensity, yet these variations remain underexplored. Using European Centre for Medium‐Range Weather Forecasts (ECMWF) Reanalysis 5th Generation (ERA5) data (1940–2024), we examine the onset, peak, decay, duration, and spatial evolution of sea‐surface temperature (SST) and precipitation anomalies for weak, moderate, strong, and very strong El Niño and La Niña events. Composite analyses reveal pronounced intensity‐dependent behavior. La Niña events maintain consistent locations of peak SST and rainfall anomalies regardless of intensity, whereas El Niño events exhibit a clear east‐to‐west shift in the location of maximum SST with decreasing intensity. Event duration increases with intensity: stronger events start earlier and persist longer. Strong El Niños last up to two months longer than strong La Niñas, whereas weak La Niñas outlast weak El Niños by about one month. To diagnose the mechanisms behind these intensity‐dependent behaviors, a mixed‐layer heat budget is applied using the Ocean Reanalysis System 5 (ORAS5; 1979–2018). Thermocline and zonal advective terms strengthen, expand eastward, and emerge earlier with increasing intensity for both El Niño and La Niña. In contrast, the Ekman contribution shows opposite intensity dependence for El Niño: it is pronounced in the eastern equatorial Pacific during weak events but weaker and more spatially diffuse during stronger El Niño events, whereas stronger La Niña events exhibit more coherent Ekman cooling. The residual", "link": "https://doi.org/10.1002/qj.70176", "authors": "Parya Adibi, Reza Rezaian, Omid Alizadeh, Tobias Sauter", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2026-3-13", "first_seen": "2026-11-23T21:25:47+00:00", "score": 4, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"]}, {"key": "doi:10.5194/gmd-16-3083-2023", "title": "Updated isoprene and terpene emission factors for the Interactive BVOC (iBVOC) emission scheme in the United Kingdom Earth System Model (UKESM1.0)", "summary": "Biogenic volatile organic compounds (BVOCs) influence atmospheric composition and climate, and their emissions are affected by changes in land use and land cover (LULC). Current Earth system models calculate BVOC emissions using parameterisations involving surface temperature, photosynthetic activity, CO 2 and vegetation type and use emission factors (EFs) to represent the influence of vegetation on BVOC emissions. We present new EFs for the Interactive BVOC Emission Scheme (iBVOC) used in the United Kingdom Earth System Model (UKESM), based on those used by the Model of Emissions of Gases and Aerosols from Nature (MEGAN) v2.1 scheme. Our new EFs provide an alternative to the current EFs used in iBVOC, which are derived from older versions of MEGAN and the Organizing Carbon and Hydrology in Dynamic Ecosystem (ORCHIDEE) emission scheme. We show that current EFs used by iBVOC result in an overestimation of isoprene emissions from grasses, particularly C 4 grasses, due to an oversimplification that incorporates the EF of shrubs (high isoprene emitters) into the EF for C 3 and C 4 grasses (low isoprene emitters). The current approach in iBVOCs assumes that C 4 grasses are responsible for 40 % of total simulated isoprene emissions in the
