re 0.013 and 0.016, while the root mean square error values are higher by 0.22 and 0.338, respectively. Additionally, the structural similarity index metric is higher by 0.033 and lower by 0.015. Furthermore, regions with significant errors are primarily distributed in complex terrain areas such as the Taihang Mountains, where UNR‐Net exhibits noticeable improvements. In addition, the 12 components‐based error decomposition method is proposed to analyze the error source of different models. Generally, the smallest errors are observed during the summer season and the sequence error component is proven to be the main source error of 2‐m temperature forecasts. Furthermore, UNR‐Net consistently demonstrates the lowest errors among all 12 error components. Therefore, combining the numerical weather prediction model and deep learning method is very promising in downscaling temperature forecas", "link": "https://doi.org/10.1029/2023ea003227", "authors": "Shuyan Ding, Xiefei Zhi, Yang Lyu, Yan Ji, Weijun Guo", "source": "Earth and Space Science", "published": "2024-2", "first_seen": "2026-11-26T13:59:01+00:00", "score": 73, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2022.4", "title": "Modeling and simulating spatial extremes by combining extreme value theory with generative adversarial networks", "summary": "Modeling dependencies between climate extremes is important for climate risk assessment, for instance when allocating emergency management funds. In statistics, multivariate extreme value theory is often used to model spatial extremes. However, most commonly used approaches require strong assumptions and are either too simplistic or over-parameterized. From a machine learning perspective, generative adversarial networks (GANs) are a powerful tool to model dependencies in high-dimensional spaces. Yet in the standard setting, GANs do not well represent dependencies in the extremes. Here we combine GANs with extreme value theory (evtGAN) to model spatial dependencies in summer maxima of temperature and winter maxima in precipitation over a large part of western Europe. We use data from a stationary 2000-year climate model simulation to validate the approach and explore its sensitivity to small sample sizes. Our results show that evtGAN outperforms classical GANs and standard statistical approaches to model spatial extremes. Already with about 50 years of data, which corresponds to commonly available climate records, we obtain reasonably good performance. In general, dependencies between temperature extremes are better captured than dependencies between precipitation extremes due to the high spatial coherence in temperature fields. Our approach can be applied to other climate variables and can be used to emulate climate models when running very long simulations to determine dependencies in the extremes is deemed infeasible.", "link": "https://doi.org/10.1017/eds.2022.4", "authors": "Younes Boulaguiem, Jakob Zscheischler, Edoardo Vignotto, Karin van der Wiel, Sebastian Engelke", "source": "Environmental Data Science", "published": "2022", "first_seen": "2026-11-26T13:59:01+00:00", "score": 73, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-23-0098.1", "title": "Physically Explainable Deep Learning for Convective Initiation Nowcasting Using GOES-16 Satellite Observations", "summary": "Convective initiation (CI) nowcasting remains a challenging problem for both numerical weather prediction models and existing nowcasting algorithms. In this study, an object-based probabilistic deep learning model is developed to predict CI based on multichannel infrared GOES-16 satellite observations. The data come from patches surrounding potential CI events identified in Multi-Radar Multi-Sensor Doppler weather radar products over the Great Plains region from June and July 2020 and June 2021. An objective radar-based approach is used to identify these events. The deep learning model significantly outperforms the classical logistic model at lead times up to 1 h, especially on the false alarm ratio. Through case studies, the deep learning model exhibits dependence on the characteristics of clouds and moisture at multiple altitudes. Model explanation further reveals that the contribution of features to model predictions is significantly dependent on the baseline, a reference point against which the prediction is compared. Under a moist baseline, moisture gradients in the lower and middle troposphere contribute most to correct CI forecasts. In contrast, under a clear-sky baseline, correct CI forecasts are dominated by cloud-top features, including cloud-top glaciation, height, and cloud coverage. Our study demonstrates the advantage of using different baselines in further understanding model behavior and gaining scientific insights.", "link": "https://doi.org/10.1175/aies-d-23-0098.1", "authors": "Da Fan, Steven J. Greybush, Eugene E. Clothiaux, David John Gagne", "source": "Artificial Intelligence for the Earth Systems", "published": "2024-7", "first_seen": "2026-11-26T13:59:01+00:00", "score": 72, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2025ms005568", "title": "MAUSAM: An Observations‐Focused Assessment of Global AI Weather Prediction Models During the South Asian Monsoon", "summary": "Past evaluation of artificial intelligence (AI) weather prediction has primarily relied on reanalyses, which can obscure important deficiencies due to prevailing biases in reanalyses themselves. Here, we present MAUSAM (Measuring AI Uncertainty during South Asian Monsoon), an evaluation of seven leading AI‐based prediction systems—FourCastNet, FourCastNet‐SFNO, Pangu‐Weather, GraphCast, Aurora, AIFS, and GenCast—during the South Asian Monsoon, using ground‐based weather stations, rain gauge networks, and geostationary satellite imagery. The AI models demonstrate considerable forecast skill during the monsoon across a broad range of variables, ranging from large‐scale surface temperature and winds to precipitation and cloud cover. In addition, the models generate realistic zonal means and eddy statistics on subseasonal to seasonal timescales, even capturing key aspects of the abrupt Monsoon pause of 2025. However, the models still exhibit systematic errors in finer‐scale features, including the underprediction of extreme precipitation (“tail” events), divergent cyclone tracks, and disagreements in the mesoscale kinetic energy spectra, highlighting avenues for future improvement. A comparison against a combination of in situ and remote sensing observations reveals forecast errors 15%–45% larger than those relative to reanalysis and traditional HRES forecasts, indicating that reanalysis‐centric benchmarks can overstate forecast skill. Of the models assessed, AIFS exhibits the most consistent representation of atmospheric variables, with GraphCast and GenCast also showing stron", "link": "https://doi.org/10.1029/2025ms005568", "authors": "Aman Gupta, Aditi Sheshadri, Dhruv Suri", "source": "Journal of Advances in Modeling Earth Systems", "published": "2026-7-30", "first_seen": "2026-11-26T13:59:01+00:00", "score": 72, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["monsoon", "precipitation", "extreme", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/2014gl062588", "title": "Heavy precipitation in a changing climate: Does short‐term summer precipitation increase faster?", "summary": "Climate models project that heavy precipitation events intensify with climate change. It is generally accepted that extreme day‐long events will increase at a rate of about 6–7% per degree warming, consistent with the Clausius‐Clapeyron relation. However, recent studies suggest that subdaily (e.g., hourly) precipitation extremes may increase at about twice this rate. Conventional climate models are not suited to assess such events, due to the limited spatial resolution and the need to parametrize convective precipitation (i.e., thunderstorms and rain showers). Here we employ a convection‐resolving model using a horizontal grid spacing of 2.2 km across an extended region covering the Alps and its larger‐scale surrounding from northern Italy to northern Germany. Consistent with previous results, projections using a Representative Concentration Pathways version 8.5 greenhouse gas scenario reveal a significant decrease of mean summer precipitation. However, unlike previous studies, we find that both extreme day‐long and hour‐long precipitation events asymptotically intensify with the Clausius‐Clapeyron relation. Differences to previous studies might be due to the model or region considered, but we also show that it is inconsistent to extrapolate from present‐day precipitation scaling into the future.", "link": "https://doi.org/10.1002/2014gl062588", "authors": "Nikolina Ban, Juerg Schmidli, Christoph Schär", "source": "Geophysical Research Letters", "published": "2015-2-18", "first_seen": "2026-11-26T13:59:01+00:00", "score": 72, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-023-00502-3", "title": "Historical and future trends in South Asian monsoon low pressure systems in a high-resolution model ensemble", "summary": "Historical trends in monsoon low pressure systems (LPS), the dominant rain-bearing weather system of South Asia, have been difficult to assess due to changes in the observing network. Future projections have also remained uncertain because prior studies concluded that many coarse-resolution climate models do not accurately simulate LPS. Here, we examine changes in South Asian monsoon LPS simulated by an ensemble of global models, including some with high spatial resolution, that we show skillfully represent LPS. In the ensemble mean, the number of strong LPS (monsoon depressions) decreased over the last 65 years (1950–2014) by about 15% while no trend was detected for weaker LPS (monsoon lows). The reduction in depression counts then moderated, yielding no trend in the periods 1980–2050 or 2015–2050. The ensemble mean projects a shift in genesis from ocean to land and an increase in LPS precipitation of at least 7% K −1 , which together contribute to a projected increase in seasonal mean and extreme precipitation over central India.", "link": "https://doi.org/10.1038/s41612-023-00502-3", "authors": "S. Vishnu, William R. Boos, William D. Collins", "source": "npj Climate and Atmospheric Science", "published": "2023-11-8", "first_seen": "2026-11-26T13:59:01+00:00", "score": 72, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "monsoon", "precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-022-06622-5", "title": "Understanding CMIP6 biases in the representation of the Greater Horn of Africa long and short rains", "summary": "The societies of the Greater Horn of Africa (GHA) are vulnerable to variability in two distinct rainy seasons, the March–May ‘long’ rains and the October–December ‘short’ rains. Recent trends in both rainy seasons, possibly related to patterns of low-frequency variability, have increased interest in future climate projections from General Circulation Models (GCMs). However, previous generations of GCMs historically have poorly simulated the regional hydroclimate. This study conducts a process-based evaluation of simulations of the long and short rains in CMIP6, the latest generation of GCMs. Key biases in CMIP5 remain or are worsened, including long rains that are too short and weak and short rains that are too long and strong. Model biases are driven by a complex set of related oceanic and atmospheric factors, including simulations of the Walker Circulation. Biased wet short rains in models are connected with Indian Ocean zonal sea surface temperature (SST) gradients that are too warm in the west and convection that is too deep. Models connect equatorial African winds with the strength of the short rains, though in observations a robust connection is primarily found in the long rains. Model mean state biases in the timing of the western Indian Ocean SST seasonal cycle are associated with certain rainfall timing biases, though both biases may be due to a common source. Simulations driven by historical SSTs (AMIP runs) often have larger biases than fully coupled runs. A path towards using biases to better understand uncertainty in projections of GHA rainfall is suggested.", "link": "https://doi.org/10.1007/s00382-022-06622-5", "authors": "Kevin Schwarzwald, Lisa Goddard, Richard Seager, Mingfang Ting, Kate Marvel", "source": "Climate Dynamics", "published": "2022-12-27", "first_seen": "2026-11-26T13:59:01+00:00", "score": 72, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "cmip6", "uncertainty"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.09663", "title": "RainFlow: Flow Matching for Infrared-Only Quantitative Precipitation Estimation", "summary": "Geostationary infrared imagers observe precipitating systems every 10 to 15 minutes over large areas, but they sense cloud tops rather than the rain beneath. Their brightness temperatures constrain surface rain only weakly, so retrievals trained by regression return a smooth estimate that misses heavy rain and carries no measure of uncertainty. We treat infrared-only retrieval as conditional generation and introduce RainFlow, a flow-matching model that generates ensembles of rain fields from MSG/SEVIRI infrared observations, in a direct and a residual variant. Evaluated against radar over metropolitan France for a full year, the generated members are realistic rain fields, with the observed dry areas, heavy rain and spatial structure, and the ensemble mean is as accurate as a deterministic baseline. Used as probabilities, the ensembles locate heavy rain at scales where the baseline has no skill, and their spread captures most of the retrieval error, with only slight underdispersion. Trained with a time-sampling density that favours the noise end of the generative trajectory, the two variants reach similar skill. The direct variant depends strongly on this choice of density, whereas the residual variant is nearly insensitive to it. Evaluating the generated rain as a function of brightness temperature shows that the ensembles reproduce how rain depends on it over most of the range. It also isolates the remaining gap, an underestimate of both the amount and the variability of rain under the coldest cloud tops, which scores computed over all pixels do not reveal.", "link": "https://arxiv.org/abs/2611.09663", "authors": "Matthieu Meignin, Cécile Mallet, Nicolas Viltard", "source": "arXiv", "published": "2026-11-06", "first_seen": "2026-11-26T13:59:01+00:00", "score": 71, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation", "flow matching", "uncertainty"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0022.1", "title": "Enhancing Operational Wind Downscaling Capabilities over Canada: Application of a Conditional Wasserstein GAN Methodology", "summary": "Downscaling based on artificial intelligence (AI) has been demonstrated to be a powerful tool for improving the spatial resolution of weather forecasts. This study advances wind downscaling by extending the DownGAN framework introduced by Annau et al. to operational Canadian numerical weather predictions (NWPs), namely, from the Global Deterministic Prediction System (GDPS) to the domain of the High-Resolution Deterministic Prediction System (HRDPS). We enhance the AI model by incorporating high-resolution static covariates, such as topography on the HRDPS grid, into a conditional Wasserstein generative adversarial network with gradient penalty, implemented using a U-Net-based generator. Following the DownGAN framework, our methodology integrates low-resolution GDPS forecasts (15 km, 10-day horizon) and high-resolution HRDPS forecasts (2.5 km, 48-h horizon) with frequency separation techniques adapted from computer vision. Through robust training and inference over the whole Canadian region, we demonstrate the operational scalability of our approach while achieving significant improvements in wind downscaling accuracy. Statistical validation highlights a reduction in root-mean-square error (RMSE) and log spectral distance (LSD) metrics compared to the original DownGAN. High-resolution conditioning covariates and frequency separation strategies prove instrumental in enhancing model performance. This work underscores the potential for extending high-resolution wind forecasts beyond the 48-h horizon, bridging the gap to the 10-day low-resolution global forecast window. Signifi", "link": "https://doi.org/10.1175/aies-d-25-0022.1", "authors": "Jorge Guevara, Victor Nascimento, Johannes Schmude, Daniel Salles Civitarese, Simon Corbeil-Létourneau, Madalina Surcel, Dominique Brunet", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 71, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021ef002500", "title": "Evaluation of the CMIP6 Precipitation Simulations Over Global Land", "summary": "Precipitation's temporal and spatial patterns under climate change significantly impact global terrestrial ecology and human social activities. Climate models are essential tools for assessing the impacts of climate change and formulating policies to address climate change. The evaluation results of historical climate model simulations can represent the reliability of their future simulations. This study evaluated the simulation capabilities of 41 historical All‐Forcing monthly precipitation simulations and three integrated models over global land in the Coupled Model Comparison Project Phase 6 (CMIP6). The results show that the simulation capability of global climate models (GCMs) in CMIP6 is highly variable overland around the world. This variability is manifested in two aspects: the spatial variability of the comprehensive simulation ability of each model in different geographical regions and climatic zones of the world and the significant difference in the simulation ability of different models in each region. These GCMs generally overestimate global monthly precipitation over land, with the exception of southeast Asia and tropical rainforest climate (Af), where all models underestimate monthly precipitation. Some GCMS can perform well regionally but poorly on the global scale. One example shows that EC‐Earth3's best capability at Cwc climatic zone, surpassing the integrated model, but failed to rank in the top 10 in 22 of the 29 climate zones. Our results highlight the need to select appropriate models for integration when conducting climate change studies at global an", "link": "https://doi.org/10.1029/2021ef002500", "authors": "Zhengyang Li, Tie Liu, Yue Huang, Jiabin Peng, Yunan Ling", "source": "Earth's Future", "published": "2022-8", "first_seen": "2026-11-26T13:59:01+00:00", "score": 71, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2019jd032166", "title": "Methodology of the Constraint Condition in Dynamical Downscaling for Regional Climate Evaluation: A Review", "summary": "The dynamical downscaling method with a regional climate model (RCM) is widely used to assess the spatially detailed information about regional climate. However, the RCM result is considerably influenced by the systematic errors inherent to a general circulation model (GCM), which provides the initial and boundary conditions to the RCM. Such systematic errors sometimes lead to meaningless downscaled results. Many modified boundary dynamical downscaling (MBDDS) methods have been proposed to reduce the influences of the systematic errors of a GCM and extract meaningful signals for regional climate change. This study comprehensively reviews the MBDDS methods. The MBDDS methods partially modify the climate information projected by a GCM and use them as the boundary conditions of an RCM. The objectives of the methods are organized into two main objectives, that is, to obtain more reliable projections by correcting the biases in boundary conditions and to better understand the regional climate change mechanisms. To ensure comprehensive understanding of the MBDDS methods, this study attempts to interpret the errors included in the downscaled results using mathematical expressions, separating the GCM‐originated bias and RCM's own bias. Using this analysis, the MBDDS methods are classified based on the following questions: What effect is expected from the bias correction? Which of the climate change components projected by a GCM is considered when assessing the future climate change? The direction and issues that need to be addressed in the future for better understanding the region", "link": "https://doi.org/10.1029/2019jd032166", "authors": "S. A. Adachi, H. Tomita", "source": "JGR: Atmospheres", "published": "2020-5-31", "first_seen": "2026-11-26T13:59:01+00:00", "score": 71, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021jd035699", "title": "Evaluation of a Reanalysis‐Driven Configuration of WRF4 Over the Western United States From 1980 to 2020", "summary": "Dynamical downscaling remains a powerful tool for studying regional climate processes, and the genesis of high‐resolution historical and future climate data. This technique is particularly important over areas of complex terrain, such as the western United States (WUS), where global models are especially limited in representing regional climate. After identifying a suite of WRF options that best simulate snow and precipitation for an average water year (2010) over the WUS, we evaluate the performance of the dynamically downscaled European Centre for Medium‐range Weather Forecasting's fifth Reanalysis (ERA5) from 1980 to 2020 on 45‐km, 9‐km, and two 3‐km grids. We find that by decreasing the horizontal grid spacing within WRF, improvements to Sierra Nevada and Northern Rocky Mountain snow, Santa Ana and Diablo winds, and coastal meteorology occur. For landfalling atmospheric rivers (ARs), the downscaled reanalysis simulates greater upstream integrated vapor transport (IVT) than ERA5. However, WRF skillfully simulates the positioning of the IVT and the timing and magnitude of AR precipitation. This potential IVT bias, in conjunction with increasing resolution, leads to a wet precipitation bias across the Sierra Nevada in the 3‐km experiment. This conclusion is supported by streamflow analysis, although we note that the bias in the 3‐km experiment can also be explained by in situ undercatch issues. Meanwhile, the 9‐km experiment is more biased than the 3‐km experiment across the Northern Rocky Mountains compared to in situ measured SWE and precipitation, indicating a geographi", "link": "https://doi.org/10.1029/2021jd035699", "authors": "Stefan Rahimi, Will Krantz, Yen‐Heng Lin, Benjamin Bass, Naomi Goldenson, Alex Hall, Zachary J. Lebo, Jesse Norris", "source": "JGR: Atmospheres", "published": "2022-2-9", "first_seen": "2026-11-26T13:59:01+00:00", "score": 71, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-021-05941-3", "title": "Evaluation of a new 12 km regional perturbed parameter ensemble over Europe", "summary": "We evaluate a 12-member perturbed parameter ensemble of regional climate simulations over Europe at 12 km resolution, carried out as part of the UK Climate Projections (UKCP) project. This ensemble is formed by varying uncertain parameters within the model physics, allowing uncertainty in future projections due to climate modelling uncertainty to be explored in a systematic way. We focus on present day performance both compared to observations, and consistency with the driving global ensemble. Daily and seasonal temperature and precipitation are evaluated as two variables commonly used in impacts assessments. For precipitation we find that downscaling, even whilst within the convection-parameterised regime, generally improves daily precipitation, but not everywhere. In summer, the underestimation of dry day frequency is worse in the regional ensemble than in the driving simulations. For temperature we find that the regional ensemble inherits a large wintertime cold bias from the global model, however downscaling reduces this bias. The largest bias reduction is in daily winter cold temperature extremes. In summer the regional ensemble is cooler and wetter than the driving global models, and we examine cloud and radiation diagnostics to understand the causes of the differences. We also use a low-resolution regional simulation to determine whether the differences are a consequence of resolution, or due to other configuration differences, with the predominant configuration difference being the treatment of aerosols. We find that use of the EasyAerosol scheme in the regional mod", "link": "https://doi.org/10.1007/s00382-021-05941-3", "authors": "Simon O. Tucker, Elizabeth J. Kendon, Nicolas Bellouin, Erasmo Buonomo, Ben Johnson, James M. Murphy", "source": "Climate Dynamics", "published": "2021-8-30", "first_seen": "2026-11-26T13:59:01+00:00", "score": 71, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/2009mwr2750.1", "title": "Cloud and Precipitation Parameterization in a Meso-Gamma-Scale Operational Weather Prediction Model", "summary": "The paper assesses the difficulties of running an operational NWP model in the resolution range of 3–8 km. In this case, deep convection cells are neither much smaller than the grid box as assumed by most parameterization schemes, nor completely resolved as would be required for them to be treated explicitly. A specific approach is proposed, with an integrated sequential treatment of resolved condensation, deep convection, and microphysics together with the use of prognostic variables. It currently allows for the production of consistent and realistic results at resolutions ranging from a few tens of kilometers down to less than 4 km. Model skill scores and an example of an operational forecast at different resolutions are presented.", "link": "https://doi.org/10.1175/2009mwr2750.1", "authors": "Luc Gerard, Jean-Marcel Piriou, Radmila Brožková, Jean-François Geleyn, Doina Banciu", "source": "Monthly Weather Review", "published": "2009-11-1", "first_seen": "2026-11-26T13:59:01+00:00", "score": 71, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0047.1", "title": "Medium-Range River Stage Forecasting with a Long Short-Term Memory Network", "summary": "Accurately forecasting rainfall–runoff and the subsequent rise and fall within rivers remains a challenge in hydrological modeling. While physical modeling system capabilities have improved, they can be computationally demanding and/or require extensive calibration when deploying at a new forecast point. Data-driven machine learning models can largely avoid these challenges while maintaining high accuracy. In this study, a long short-term memory (LSTM) network is used to produce river stage height forecasts based on lagged inputs of basin-averaged precipitation, modeled relative soil moisture, and gauge height. A basin-specific LSTM was developed and tested on 42 precipitation-dominated river basins. The results show that the LSTM statistically outperforms the corresponding ensemble of the medium-range National Water Model when driven by the same Global Forecast System precipitation. With a 0.14 higher average Nash–Sutcliffe efficiency and 13.1% lower peak bias over the 7-day forecast, the LSTM demonstrates high viability for operational use. Significance Statement Accurately forecasting river flooding is of high importance for protecting life and property. Traditional physics-based hydrological models that have been used by operational centers to provide forecasts to the public are computationally expensive and still have high uncertainties. In this study, we examined the use of machine learning for forecasting river flooding out to 7 days and determined that the developed machine learning framework provides better forecasts than a physics-based modeling approach and shows", "link": "https://doi.org/10.1175/aies-d-25-0047.1", "authors": "Andrew T. White, Christopher R. Hain, Kristopher D. White, Jonathan L. Case, Kevin Fuell", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-1", "first_seen": "2026-11-26T13:59:01+00:00", "score": 70, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ms003890", "title": "Parameterizing Vertical Mixing Coefficients in the Ocean Surface Boundary Layer Using Neural Networks", "summary": "Vertical mixing parameterizations in ocean models are formulated on the basis of the physical principles that govern turbulent mixing. However, many parameterizations include ad hoc components that are not well constrained by theory or data. One such component is the eddy diffusivity model, where vertical turbulent fluxes of a quantity are parameterized from a variable eddy diffusion coefficient and the mean vertical gradient of the quantity. In this work, we improve a parameterization of vertical mixing in the ocean surface boundary layer by enhancing its eddy diffusivity model using data‐driven methods, specifically neural networks. The neural networks are designed to take extrinsic and intrinsic forcing parameters as input to predict the eddy diffusivity profile and are trained using output data from a second moment closure turbulent mixing scheme. The modified vertical mixing scheme predicts the eddy diffusivity profile through online inference of neural networks and maintains the conservation principles of the standard ocean model equations, which is particularly important for its targeted use in climate simulations. We describe the development and stable implementation of neural networks in an ocean general circulation model and demonstrate that the enhanced scheme outperforms its predecessor by reducing biases in the mixed‐layer depth and upper ocean stratification. Our results demonstrate the potential for data‐driven physics‐aware parameterizations to improve global climate models.", "link": "https://doi.org/10.1029/2023ms003890", "authors": "Aakash Sane, Brandon G. Reichl, Alistair Adcroft, Laure Zanna", "source": "Journal of Advances in Modeling Earth Systems", "published": "2023-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 70, "topics": ["Deep Learning", "Climate Modelling"], "watch": ["Laure Zanna"], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1029/2021gl096541", "title": "On the All‐India Rainfall Index and Sub‐India Rainfall Heterogeneity", "summary": "We revisit longstanding controversies regarding summer‐mean relationships among the all‐India rainfall index (AIRI), sub‐India rainfall, El Niño‐Southern Oscillation (ENSO), and the Indian Ocean dipole (IOD) using 120‐year sea surface temperature and high‐resolution rainfall datasets. AIRI closely tracks with the spatial extent of wet anomalies and with the average across grid points in rainy day count. The leading rainfall variability mode is a monopole associated primarily with rainy day count and ENSO. The second mode is a tripole with same‐signed loadings in the high‐rainfall Western Ghats and Central Monsoon Zone regions and opposite‐signed loadings in Southeastern India between. The IOD projects onto this tripole and, as such, is weakly correlated with AIRI. However, when the linear influence of ENSO is removed, the IOD rainfall regressions become quasi‐homogeneously more positive, making the ENSO‐residual IOD and AIRI time series significantly correlated.", "link": "https://doi.org/10.1029/2021gl096541", "authors": "Spencer A. Hill, Adam H. Sobel, Michela Biasutti, Mark A. Cane", "source": "Geophysical Research Letters", "published": "2022-1-20", "first_seen": "2026-11-26T13:59:01+00:00", "score": 70, "topics": ["Close to your work"], "watch": [], "boosts": ["india", "monsoon"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr-d-18-0316.1", "title": "Interpretable Deep Learning for Spatial Analysis of Severe Hailstorms", "summary": "Deep learning models, such as convolutional neural networks, utilize multiple specialized layers to encode spatial patterns at different scales. In this study, deep learning models are compared with standard machine learning approaches on the task of predicting the probability of severe hail based on upper-air dynamic and thermodynamic fields from a convection-allowing numerical weather prediction model. The data for this study come from patches surrounding storms identified in NCAR convection-allowing ensemble runs from 3 May to 3 June 2016. The machine learning models are trained to predict whether the simulated surface hail size from the Thompson hail size diagnostic exceeds 25 mm over the hour following storm detection. A convolutional neural network is compared with logistic regressions using input variables derived from either the spatial means of each field or principal component analysis. The convolutional neural network statistically significantly outperforms all other methods in terms of Brier skill score and area under the receiver operator characteristic curve. Interpretation of the convolutional neural network through feature importance and feature optimization reveals that the network synthesized information about the environment and storm morphology that is consistent with our understanding of hail growth, including large lapse rates and a wind shear profile that favors wide updrafts. Different neurons in the network also record different storm modes, and the magnitude of the output of those neurons is used to analyze the spatiotemporal distributions of diffe", "link": "https://doi.org/10.1175/mwr-d-18-0316.1", "authors": "David John Gagne II, Sue Ellen Haupt, Douglas W. Nychka, Gregory Thompson", "source": "Monthly Weather Review", "published": "2019-7-17", "first_seen": "2026-11-26T13:59:01+00:00", "score": 70, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-24-0081.1", "title": "A Comparison of AI Weather Prediction and Numerical Weather Prediction Models for 1–7-Day Precipitation Forecasts", "summary": "Pure artificial intelligence (AI)-based weather prediction (AIWP) models have made waves within the scientific community and the media, claiming superior performance to numerical weather prediction (NWP) models. However, these models often lack impactful output variables such as precipitation. One exception is Google DeepMind’s GraphCast model, which became the first mainstream AIWP model to predict precipitation, but performed only limited verification. We present an analysis of the ECMWF’s Integrated Forecasting System (IFS)-initialized (GRAP IFS ) and the NCEP’s Global Forecast System (GFS)-initialized (GRAP GFS ) GraphCast precipitation forecasts over the contiguous United States and compare to results from the GFS and IFS models using 1) grid-based, 2) neighborhood, and 3) object-oriented metrics verified against the fifth major global reanalysis produced by ECMWF (ERA5) and the NCEP/Environmental Modeling Center (EMC) stage IV precipitation analysis datasets. We affirmed that GRAP GFS and GRAP IFS perform better than the GFS and IFS in terms of root-mean-square error and stable equitable errors in probability space, but the GFS and IFS precipitation distributions more closely align with the ERA5 and stage IV distributions. Equitable threat score also generally favored GraphCast, particularly for lower accumulation thresholds. Fractions skill score for increasing neighborhood sizes shows greater gains for the GFS and IFS than GraphCast, suggesting the NWP models may have a better handle on intensity but struggle with the location. Object-based verification for GraphCas", "link": "https://doi.org/10.1175/waf-d-24-0081.1", "authors": "Jacob T. Radford, Imme Ebert-Uphoff, Jebb Q. Stewart", "source": "Weather and Forecasting", "published": "2025-4", "first_seen": "2026-11-26T13:59:01+00:00", "score": 70, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2022.2", "title": "Evolution of machine learning in environmental science—A perspective", "summary": "The growth of machine learning (ML) in environmental science can be divided into a slow phase lasting till the mid-2010s and a fast phase thereafter. The rapid transition was brought about by the emergence of powerful new ML methods, allowing ML to successfully tackle many problems where numerical models and statistical models have been hampered. Deep convolutional neural network models greatly advanced the use of ML on 2D or 3D data. Transfer learning has allowed ML to progress in climate science, where data records are generally short for ML. ML and physics are also merging in new areas, for example: (a) using ML for general circulation model parametrization, (b) adding physics constraints in ML models, and (c) using ML in data assimilation.", "link": "https://doi.org/10.1017/eds.2022.2", "authors": "William W. Hsieh", "source": "Environmental Data Science", "published": "2022", "first_seen": "2026-11-26T13:59:01+00:00", "score": 70, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0114.1", "title": "Extratropical Atmospheric Circulation Response to ENSO in Deep Learning Pacific Pacemaker Experiments", "summary": "Coupled atmosphere–ocean deep learning (DL) climate emulators are a new frontier but are known to exhibit weak ENSO variability, raising questions about their ability to simulate its teleconnections. Here, we present the first Pacific pacemaker (PACE) experiments using a coupled DL Earth system model (DLESyM) to bypass this weak variability and isolate the atmospheric response to observed ENSO forcing. We find that while the emulator realistically captures internal atmospheric variability, it produces a significantly amplified forced teleconnection response to ENSO. This amplified response leads to biases in simulating extremes, notably an overestimation of atmospheric blocking frequency and duration and an underestimation of peak intensity. Our findings underscore that coupled DL climate models require in-depth, process-based evaluation, analogous to traditional numerical models, to build confidence in their use for climate simulation and analysis. Significance Statement Deep learning (DL) ocean–atmosphere coupled climate models offer computational efficiency for climate science but exhibit weak El Niño and La Niña variability, raising questions about whether they realistically simulate remote weather impacts. We bypassed this limitation by constraining tropical Pacific Ocean temperatures to match historical observations, directly testing the atmospheric response in a DL coupled climate model. The model captures realistic spatial patterns but produces responses approximately 50% stronger than conventional-physics-based models. These amplified responses cause biases in simu", "link": "https://doi.org/10.1175/aies-d-25-0114.1", "authors": "Zhanxiang Hua, Christina Karamperidou, Zilu Meng", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 69, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme", "emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0122.1", "title": "Future Changes in Early Season Severe Weather: A Comparison of Machine Learning and Convection-Permitting Dynamical Downscaling", "summary": "Hazardous convective weather (HCW; i.e., tornadoes, large hail, and severe wind) is a damaging phenomenon caused by thunderstorms. However, future spatiotemporal changes in HCW are unknown, in part associated with the high computational cost of convection-permitting (≤4 km) global climate model simulations. We used the Weather Research and Forecasting (WRF) Model to conduct convection-permitting simulations to project future changes in early season (January–April) HCW over the central-to-eastern United States. Simulations were performed for a historical period (1991–2000) and a future period (2091–2100) forced by representative concentration pathway 8.5. HCW occurrence, defined as updraft vertical velocity (UVV) exceeding 18 m s −1 in a favorable environment, is projected to increase by 173% in the future based on convection-permitting simulations, with a 62% increase in the frequency of days with HCW. Future increases in HCW are supported by increases in UVV, HCW environmental favorability driven by CAPE, and the conditional probability of HCW occurrence. Finally, we trained a machine learning model (a U-Net) on historical convection-permitting data, with a test set withheld in both the historical and future climates to generate predictions of climate changes in HCW. The U-Net produces physically plausible estimates of HCW frequency in both climate states but underpredicts the magnitude of the climate change shift (59% increase, compared to the 173% increase in the dynamical model). If machine learning models can be further fine-tuned to predict storm-scale variables from ", "link": "https://doi.org/10.1175/aies-d-25-0122.1", "authors": "Nathan E. Erickson, Christina M. Patricola-DiRosario", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 69, "topics": ["Downscaling", "Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ms003763", "title": "Data‐Driven Equation Discovery of a Cloud Cover Parameterization", "summary": "A promising method for improving the representation of clouds in climate models, and hence climate projections, is to develop machine learning‐based parameterizations using output from global storm‐resolving models. While neural networks (NNs) can achieve state‐of‐the‐art performance within their training distribution, they can make unreliable predictions outside of it. Additionally, they often require post‐hoc tools for interpretation. To avoid these limitations, we combine symbolic regression, sequential feature selection, and physical constraints in a hierarchical modeling framework. This framework allows us to discover new equations diagnosing cloud cover from coarse‐grained variables of global storm‐resolving model simulations. These analytical equations are interpretable by construction and easily transferable to other grids or climate models. Our best equation balances performance and complexity, achieving a performance comparable to that of NNs ( R 2 = 0.94) while remaining simple (with only 11 trainable parameters). It reproduces cloud cover distributions more accurately than the Xu‐Randall scheme across all cloud regimes (Hellinger distances < 0.09), and matches NNs in condensate‐rich regimes. When applied and fine‐tuned to the ERA5 reanalysis, the equation exhibits superior transferability to new data compared to all other optimal cloud cover schemes. Our findings demonstrate the effectiveness of symbolic regression in discovering interpretable, physically‐consistent, and nonlinear equations to parameterize cloud cover.", "link": "https://doi.org/10.1029/2023ms003763", "authors": "Arthur Grundner, Tom Beucler, Pierre Gentine, Veronika Eyring", "source": "Journal of Advances in Modeling Earth Systems", "published": "2024-2-29", "first_seen": "2026-11-26T13:59:01+00:00", "score": 69, "topics": ["Deep Learning", "Climate Modelling"], "watch": ["Tom Beucler", "Pierre Gentine", "Veronika Eyring"], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1038/s41612-024-00600-w", "title": "Convection-permitting climate models offer more certain extreme rainfall projections", "summary": "Extreme precipitation events lead to dramatic impacts on society and the situation will worsen under climate change. Decision-makers need reliable estimates of future changes as a basis for effective adaptation strategies, but projections at local scale from regional climate models (RCMs) are highly uncertain. Here we exploit the km-scale convection-permitting multi-model (CPM) ensemble, generated within the FPS Convection project, to provide new understanding of the changes in local precipitation extremes and related uncertainties over the greater Alpine region. The CPM ensemble shows a stronger increase in the fractional contribution from extreme events than the driving RCM ensemble during the summer, when convection dominates. We find that the CPM ensemble substantially reduces the model uncertainties and their contribution to the total uncertainties by more than 50%. We conclude that the more realistic representation of local dynamical processes in the CPMs provides more reliable local estimates of change, which are essential for policymakers to plan adaptation measures.", "link": "https://doi.org/10.1038/s41612-024-00600-w", "authors": "Giorgia Fosser, Marco Gaetani, Elizabeth J. Kendon, Marianna Adinolfi, Nikolina Ban, Danijel Belušić, Cécile Caillaud, João A. M. Careto", "source": "npj Climate and Atmospheric Science", "published": "2024-2-28", "first_seen": "2026-11-26T13:59:01+00:00", "score": 69, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.28315", "title": "Stochastic climate emulation at reduced cost with ACE2.5-ERA5", "summary": "We introduce ACE2.5-ERA5 (Ai2 Climate Emulator of ERA5, version 2.5), a stochastic autoregressive weather-climate AI model that produces calibrated weather ensembles with realistic small-scale structure on timescales from days to centuries. Its deterministic predecessor, ACE2-ERA5, retains 36% of its ERA5 target's precipitation spectral power at total wavenumbers 100--179; ACE2.5-ERA5 retains 86%. In weather forecasts its ensemble spread matches its error to within 4% from day 3. Time-mean climate is on par with or better than ACE2-ERA5, the precipitation response to ENSO is improved, and the model is stable over 1000 years. Interannual variability of global mean surface temperature is shown not to be calibrated in either ACE2.5-ERA5 or its predecessor. ACE2.5-ERA5 differs from ACE2-ERA5 in three ways. Noise-conditioned layer normalization, trained with a combined CRPS and spectral energy score loss in place of mean squared error, makes it stochastic. Spectral bottlenecking with grouped convolutions cuts the Spherical Fourier Neural Operator's spectral filter parameters by more than two orders of magnitude and leaves a model a tenth the size of ACE2-ERA5. Its time step is daily rather than 6-hourly. ACE2.5-ERA5 has 3.2 times the inference throughput of ACE2-ERA5. A 6-hourly variant has weather prediction skill similar to ACE2-ERA5. A 4-degree variant reaches comparable climate skill at an order of magnitude lower training cost, enabling rapid iteration during development. We release 1-degree daily, 4-degree daily and 1-degree 6-hourly checkpoints.", "link": "https://arxiv.org/abs/2611.28315", "authors": "Jeremy McGibbon, Troy Arcomano, Spencer K. Clark, James P. C. Duncan, Brian Henn, Oliver Watt-Meyer", "source": "arXiv", "published": "2026-11-20", "first_seen": "2026-11-26T13:59:01+00:00", "score": 68, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.10882", "title": "Guiding future global temperature distributions with simulations and observations", "summary": "Assessing climate risks requires projections of daily temperature distributions, including rare and spatially widespread extremes. Climate simulations are costly and biased, while correcting them toward observations risks suppressing inter-model differences. We train a single machine-learning emulator, a conditional diffusion model, on seventeen CMIP6 models and ERA5 reanalysis to generate spatially coherent daily temperature fields conditioned on model identity, date, and CO2-equivalent concentration. At sampling time, diffusion guidance reduces model biases by steering each emulated climate-model distribution toward observations, with its strength selected through perfect-model experiments using withheld simulated futures. Observational influence decreases with projection horizon and forcing. Across seventeen synthetic targets, guidance more than halves median biases in the 1st and 99th percentiles of daily temperature, improves probabilistic scores and reliability, and reduces median annual global-mean temperature RMSE by 32-57% across three emission scenarios. In a detailed benchmark, guidance also outperforms established bias corrections on daily-field probabilistic scores. Efficient sampling generates large ensembles without further climate simulations. For example, our framework corrects CMIP6's roughly threefold historical overestimate of extreme-heat coverage, yet projects that concurrent extremes will affect nearly half of global land on a typical day in the 2080s under SSP3-7.0.", "link": "https://arxiv.org/abs/2611.10882", "authors": "Francesco Immorlano, Elijah Tavares, Felix Draxler, Juan Nathaniel, Violette Launeau, Duncan Watson-Parris, Padhraic Smyth, Pierre Gentine", "source": "arXiv", "published": "2026-11-07", "first_seen": "2026-11-26T13:59:01+00:00", "score": 68, "topics": ["Deep Learning", "Climate Modelling"], "watch": ["Pierre Gentine"], "boosts": ["cmip6", "extreme", "diffusion model", "emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "arxiv:2611.03925", "title": "Tropical Cyclone-Following Dataset for Limited-Area Machine Learning Applications", "summary": "This work presents a lightweight dataset of tropical cyclone (TC)-following meteorological variables to facilitate the development and application of machine learning (ML) methods in TC research. Using outputs from our previous climate downscaling and idealized simulations, the dataset is constructed as multichannel video sequences that track TC centers throughout their lifetimes. To demonstrate the dataset utility, we present an application in which a regional ML model is trained to predict TC intensity with explicit incorporation of lateral boundary conditions. Our results highlight the importance of lateral boundary information for predicting TC intensity with ML models inside a limited-area domain, underscoring the need to properly account for lateral boundaries when developing regional ML models for TC intensity forecast.", "link": "https://arxiv.org/abs/2611.03925", "authors": "Minh-Khanh Luong, Chanh Kieu", "source": "arXiv", "published": "2026-11-02", "first_seen": "2026-11-26T13:59:01+00:00", "score": 68, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.27793", "title": "TerraNostra-Bench: Benchmarking Spatial Downscaling and Temporal Rollout for Global 1-km Land-Use Reconstruction", "summary": "Uncertainty in the terrestrial carbon cycle remains a major constraint in climate projections, partly due to imperfect land surface representations in Earth system models. We propose a data-driven framework for high-resolution land-use reconstruction, treated as a semantic-segmentation task, that combines coarse-resolution scenario data and climate classification with static geophysical features to produce annual land-use maps at 1 km resolution. We introduce TerraNostra-Bench, a change-aware evaluation protocol that separates spatial downscaling from autoregressive temporal rollout and scores models on the rare land-use-change pixels rather than the dominant static background. Using it, we compare convolutional (U-Net) and transformer (Swin) backbones in autoregressive and non-autoregressive schemes against persistence, linear, and shallow convolutional baselines. The autoregressive prior is the most informative input yet accumulates error over long rollouts: autoregressive models lose 5.7-7.2 accuracy points over 13 years, against 2.2-2.8 for non-autoregressive models. This trade-off is governed by the autoregressive choice rather than the backbone. It can be tuned by an inference-time prior-trust threshold that requires no retraining and by the training-time weighting of reconstruction and change objectives; the two levers trace complementary frontiers, with calibration recovering up to 10 accuracy points while keeping change sensitivity above the persistence floor. Extrapolating beyond the training window, backward to 1955-1959 and forward to 2015-2019 under scenario fo", "link": "https://arxiv.org/abs/2610.27793", "authors": "Amirpasha Mozaffari, Marina Castaño, Stefano Materia, Joan Vedrí, Jordi Varela-Agrelo, Dario Garcia-Gasulla, Etienne Tourigny, Mario Acosta", "source": "arXiv", "published": "2026-10-20", "first_seen": "2026-11-26T13:59:01+00:00", "score": 68, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024ea003750", "title": "Land and Atmospheric Drivers of the 2023 Flood in India", "summary": "Floods in India are recurring natural disasters resulting from extreme precipitation during the summer monsoon season (June–September). The recent flood in North India in July 2023 caused substantial damage to lives, agriculture, and infrastructure. However, what led to the 2023 North India flood and the role of atmospheric and land drivers still need to be examined. Using in situ observations, satellite data, and ERA5 reanalysis combined with hydrological and hydrodynamical modeling, we examine the role of land and atmospheric drivers in flood occurrence and its impacts. Extreme precipitation in a large region during 7–10 July 2023 created favorable conditions for the flood in the hilly terrains and plains of north India. More than 300 mm of precipitation fell in just 4 days, which was eight times higher than the long‐term average (2001–2022). Anomalously high moisture transport over northern India was recorded on 7 July 2023, making atmospheric conditions favorable for intense landfall. Increased column water vapor and specific humidity at different pressure levels confirmed the continuous moisture presence before the extreme rainfall that caused floods in northern India from 7 to 12 July 2023. Atmospheric and land (high antecedent soil moisture) conditions contributed to a more than 200% rise in streamflow at several gauge stations. Satellite‐based flood extent shows a considerable flood inundation that caused damage in the Sutlej and Yamuna River basins. Our findings highlight the crucial role of the favorable land and atmospheric conditions that caused floods and flash", "link": "https://doi.org/10.1029/2024ea003750", "authors": "Anuj Prakash Kushwaha, Hiren Solanki, Urmin Vegad, Shanti Shwarup Mahto, Vimal Mishra", "source": "Earth and Space Science", "published": "2024-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 68, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "monsoon", "precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-026-01366-z", "title": "Bias-targeted deep learning enhances short-range heavy rainfall forecasts", "summary": "", "link": "https://doi.org/10.1038/s41612-026-01366-z", "authors": "Tao Tang, Wenqiang Shen, Jiaolan Fu, Ping He, Hao Qian, Ling Luo", "source": "npj Climate and Atmospheric Science", "published": "2026-3-6", "first_seen": "2026-11-26T13:59:01+00:00", "score": 68, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-020-05494-x", "title": "Assessing mean climate change signals in the global CORDEX-CORE ensemble", "summary": "The new Coordinated Output for Regional Evaluations (CORDEX-CORE) ensemble provides high-resolution, consistent regional climate change projections for the major inhabited areas of the world. It serves as a solid scientific basis for further research related to vulnerability, impact, adaptation and climate services in addition to existing CORDEX simulations. The aim of this study is to investigate and document the climate change information provided by the CORDEX-CORE simulation ensemble, as a part of the World Climate Research Programme (WCRP) CORDEX community. An overview of the annual and monthly mean climate change information in selected regions in different CORDEX domains is presented for temperature and precipitation, providing the foundation for detailed follow-up studies and applications. Initially, two regional climate models (RCMs), REMO and RegCM were used to downscale global climate model output. The driving simulations by AR5 global climate models (AR5-GCMs) were selected to cover the spread of high, medium, and low equilibrium climate sensitivity at a global scale. The CORDEX-CORE ensemble has doubled the spatial resolution compared to the previously existing CORDEX simulations in most of the regions (25 $$\\,\\mathrm {km}$$ km (0.22 $$^{\\circ }$$ ∘ ) versus 50 $$\\,\\mathrm {km}$$ km (0.44 $$^{\\circ }$$ ∘ )) leading to a potentially improved representation of, e.g., physical processes in the RCMs. The analysis focuses on changes in the IPCC physical climate reference regions. The results show a general reasonable representation of the spread of the temperature a", "link": "https://doi.org/10.1007/s00382-020-05494-x", "authors": "Claas Teichmann, Daniela Jacob, Armelle Reca Remedio, Thomas Remke, Lars Buntemeyer, Peter Hoffmann, Arne Kriegsmann, Ludwig Lierhammer", "source": "Climate Dynamics", "published": "2020-11-9", "first_seen": "2026-11-26T13:59:01+00:00", "score": 68, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-24-0192.1", "title": "Machine Learning Models for Daily Rainfall Forecasting in Northern Tropical Africa Using Tropical Wave Predictors", "summary": "Numerical weather prediction models often struggle to outperform simple climatology-based precipitation forecasts in northern tropical Africa, even after statistical postprocessing. Artificial intelligence (AI)-based methods show promise, but accurately incorporating precipitation remains challenging. This study explores, for the first time, the predictive value of synoptic–planetary-scale forcing associated with African easterly waves (AEWs) and other tropical waves using machine learning (ML). We apply a gamma regression and convolutional neural network (CNN), trained on wave predictors derived from satellite-based rainfall estimates (GPM IMERG), to predict daily rainfall during the July–September monsoon season. Predictor variables capture local amplitude and phase information from seven wave types at the target 1° × 1° degree grid box and adjacent upstream and downstream neighbors, with important predictors selected via gradient-boosting regression. We find downstream predictors contributing most significantly to model skill, highlighting robust predictability of rainfall suppression during dry wave phases. Tropical depression (AEWs) emerges as the most influential predictor, while mixed Rossby–gravity, Kelvin, and inertio-gravity waves show importance in specific subregions. We transform deterministic ML predictions into probabilistic forecasts using the novel Easy Uncertainty Quantification (EasyUQ) and compare them against three benchmarks: extended probabilistic climatology with a 15-day window (EPC15) derived from GPM IMERG, European Centre for Medium-Range Weather", "link": "https://doi.org/10.1175/waf-d-24-0192.1", "authors": "Athul Rasheeda Satheesh, Peter Knippertz, Andreas H. Fink", "source": "Weather and Forecasting", "published": "2025-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 68, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["monsoon", "precipitation", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-16-0099.1", "title": "AROME-MetCoOp: A Nordic Convective-Scale Operational Weather Prediction Model", "summary": "Since October 2013 a convective-scale weather prediction model has been used operationally to provide short-term forecasts covering large parts of the Nordic region. The model is now operated by a bilateral cooperative effort [Meteorological Cooperation on Operational Numerical Weather Prediction (MetCoOp)] between the Norwegian Meteorological Institute and the Swedish Meteorological and Hydrological Institute. The core of the model is based on the convection-permitting Applications of Research to Operations at Mesoscale (AROME) model developed by Météo-France. In this paper the specific modifications and updates that have been made to suit advanced high-resolution weather forecasts over the Nordic regions are described. This includes modifications in the surface drag description, microphysics, snow assimilation, as well as an update of the ecosystem and surface parameter description. Novel observation types are introduced in the operational runs, including ground-based Global Navigation Satellite System (GNSS) observations and radar reflectivity data from the Norwegian and Swedish radar networks. After almost two years’ worth of experience with the AROME-MetCoOp model, the model’s sensitivities to the use of specific parameterization settings are characterized and the forecast skills demonstrating the benefit as compared with the global European Centre for Medium-Range Weather Forecasts’ Integrated Forecasting System (ECMWF-IFS) are evaluated. Furthermore, case studies are provided to demonstrate the ability of the model to capture extreme precipitation and wind events.", "link": "https://doi.org/10.1175/waf-d-16-0099.1", "authors": "Malte Müller, Mariken Homleid, Karl-Ivar Ivarsson, Morten A. Ø. Køltzow, Magnus Lindskog, Knut Helge Midtbø, Ulf Andrae, Trygve Aspelien", "source": "Weather and Forecasting", "published": "2017-3-15", "first_seen": "2026-11-26T13:59:01+00:00", "score": 68, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2025.10", "title": "WindDragon: automated deep learning for regional wind power forecasting", "summary": "Achieving net-zero carbon emissions by 2050 necessitates the integration of substantial wind power capacity into national power grids. However, the inherent variability and uncertainty of wind energy present significant challenges for grid operators, particularly in maintaining system stability and balance. Accurate short-term forecasting of wind power is therefore essential. This article introduces an innovative framework for regional wind power forecasting over short-term horizons (1–6 h), employing a novel Automated Deep Learning regression framework called WindDragon. Specifically designed to process wind speed maps, WindDragon automatically creates Deep Learning models leveraging Numerical Weather Prediction (NWP) data to deliver state-of-the-art wind power forecasts. We conduct extensive evaluations on data from France for the year 2020, benchmarking WindDragon against a diverse set of baselines, including both deep learning and traditional methods. The results demonstrate that WindDragon achieves substantial improvements in forecast accuracy over the considered baselines, highlighting its potential for enhancing grid reliability in the face of increased wind power integration.", "link": "https://doi.org/10.1017/eds.2025.10", "authors": "Julie Keisler, Etienne Le Naour", "source": "Environmental Data Science", "published": "2025", "first_seen": "2026-11-26T13:59:01+00:00", "score": 68, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.23863", "title": "Comparing Data-Driven and Numerical Weather Prediction Forecasts of Extreme Weather: A Review", "summary": "Data-driven weather forecasting models, chiefly trained on reanalysis data, now match or beat physics-based numerical weather prediction (NWP) models on most headline scores, but whether this advantage extends to extreme weather is contested. We review peer-reviewed studies that directly compare data-driven forecasts with NWP for extremes, from nowcasting to subseasonal lead times. We discuss grey literature in the outlook but do not include it in the formal review. There is good agreement on the fact that data-driven models mostly outperform NWP on temperature extremes, tropical cyclone tracks and the location of synoptic features across time scales. The evidence is mixed for extreme precipitation and feature-based extreme event detection such as extremes related to atmospheric rivers, while it leans toward better NWP performance for estimating event intensity. For record-breaking events that lie outside the training distribution, the evidence is narrower. Nonetheless, both a systematic global evaluation and several case studies find that physics-based models retain the advantage, with data-driven models underestimating both the frequency and the magnitude of records. Hybrid systems that post-process NWP with machine-learning (ML), or couple data-driven forecasts with physics-based models, deliver some of the largest and most consistent gains. We argue that headline scores, verification choices and case selection explain much of the apparent disagreement in the literature, and provide recommendations for a more trustworthy and interpretable evaluation of data-driven models", "link": "https://arxiv.org/abs/2611.23863", "authors": "Gabriele Messori, Hiu-Wang Lau, Chenyu Dong, Gianmarco Mengaldo, Leonardo Olivetti", "source": "arXiv", "published": "2026-11-18", "first_seen": "2026-11-26T13:59:01+00:00", "score": 67, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2602.11313", "title": "Hierarchical Testing of a Hybrid Machine Learning-Physics Global Atmosphere Model", "summary": "Machine learning (ML)-based models have demonstrated high skill and computational efficiency, often outperforming conventional physics-based models in weather and subseasonal predictions. While prior studies have assessed their fidelity in capturing synoptic-scale atmospheric dynamics, their performance across timescales and under out-of-distribution forcing, such as +3K or +4K uniform-warming forcings, and the sources of biases remain elusive, to establish the model reliability for Earth science. Here, we design three sets of experiments targeting synoptic-scale phenomena, interannual variability, and out-of-distribution uniform-warming forcings. We evaluate the Neural General Circulation Model (NeuralGCM), a hybrid model integrating a dynamical core with ML-based component, against observations and physics-based Earth system models (ESMs). At the synoptic scale, NeuralGCM captures the evolution and propagation of extratropical cyclones with performance comparable to ESMs. At the interannual scale, when forced by El Niño-Southern Oscillation sea surface temperature (SST) anomalies, NeuralGCM successfully reproduces associated teleconnection patterns but exhibits deficiencies in capturing nonlinear response. Under out-of-distribution uniform-warming forcings, NeuralGCM simulates similar responses in global-average temperature and precipitation and reproduces large-scale tropospheric circulation features similar to those in ESMs. Notable weaknesses include overestimating the tracks and spatial extent of extratropical cyclones, biases in the teleconnected wave train triggered", "link": "https://arxiv.org/abs/2602.11313", "authors": "Ziming Chen, L. Ruby Leung, Wenyu Zhou, Jian Lu, Sandro W. Lubis, Ye Liu, Chuan-Chieh Chang, Bryce E. Harrop", "source": "arXiv", "published": "2026-02-11", "first_seen": "2026-11-26T13:59:01+00:00", "score": 66, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-26-0033.1", "title": "A Language-Inspired Superresolution Architecture (LISA) for U.S. West Coast Low-Level Winds", "summary": "High-fidelity, high-resolution wind fields in the lower boundary layer are vital for energy planning, shipping, and coastal infrastructure, yet they remain computationally costly to obtain with conventional numerical models at a kilometer scale. We introduce the Language-Inspired Superresolution Architecture (LISA), a transformer encoder–decoder that maps hourly 0.25° fifth generation European Centre for Medium-Range Weather Forecasts (ECMWF) atmospheric reanalysis (ERA5) fields to hourly 3-km vector winds at 80 m over the U.S. West Coast. LISA offers two innovations. First, a wide-field encoder is pretrained with self-supervised masked autoencoding on two decades of unpaired ERA5 data, harvesting abundant coarse data without high-resolution labels. Second, a localization stage fine-tunes the system on 4.3 years of High-Resolution Rapid Refresh (HRRR) analyses using a progressive-mask curriculum that forces the decoder to infer an increasingly large portion of the 3-km field from large-scale context provided by ERA5. In out-of-sample testing for a whole year, the 4-h model (LISA-4h) reduces annual bias by 25% relative to the U-Net baseline (−0.29 vs +0.39 m s −1 ), while retaining comparable correlation (0.88 vs 0.91). LISA’s gains are most pronounced during downslope winds and coastal low-level jets, where root-mean-square error decreases up to 15%. Attention diagnostics reveal physically consistent focus on upper-level winds and geopotential height during atmospheric rivers and on 700-hPa winds and surface pressure during mechanically forced events, providing interpretabl", "link": "https://doi.org/10.1175/aies-d-26-0033.1", "authors": "Jack Dermigny, Sha Feng, Ye Liu, Larry K. Berg", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 66, "topics": ["Downscaling", "Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022ms003211", "title": "SwinVRNN: A Data‐Driven Ensemble Forecasting Model via Learned Distribution Perturbation", "summary": "The data‐driven approaches for medium‐range weather forecasting are recently shown to be extraordinarily promising for ensemble forecasting due to their fast inference speed compared to the traditional numerical weather prediction models. However, their forecast accuracy can hardly match the state‐of‐the‐art operational ECMWF Integrated Forecasting System (IFS) model. Previous data‐driven approaches perform ensemble forecasting using some simple perturbation methods, like the initial condition perturbation and the Monte Carlo dropout. However, their ensemble performance is often limited arguably by the sub‐optimal ways of applying perturbation. We propose a Swin Transformer‐based Variational Recurrent Neural Network (SwinVRNN), which is a stochastic weather forecasting model combining a SwinRNN predictor with a perturbation module. SwinRNN is designed as a Swin Transformer‐based recurrent neural network, which predicts the future states deterministically. Furthermore, to model the stochasticity in the prediction, we design a perturbation module following the Variational Auto‐Encoder paradigm to learn the multivariate Gaussian distributions of a time‐variant stochastic latent variable from the data. Ensemble forecasting can be easily performed by perturbing the model features leveraging the noise sampled from the learned distribution. We also compare four categories of perturbation methods for ensemble forecasting, that is, fixed distribution perturbation, learned distribution perturbation, MC dropout, and multi model ensemble. Comparisons on the WeatherBench data set show t", "link": "https://doi.org/10.1029/2022ms003211", "authors": "Yuan Hu, Lei Chen, Zhibin Wang, Hao Li", "source": "Journal of Advances in Modeling Earth Systems", "published": "2023-2", "first_seen": "2026-11-26T13:59:01+00:00", "score": 66, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ms003792", "title": "Temporal Subsampling Diminishes Small Spatial Scales in Recurrent Neural Network Emulators of Geophys
