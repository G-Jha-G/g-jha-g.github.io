hange, and area-averaged total precipitation amounts were less by up to a factor of 2. Over the western high plains (105°–100°W longitude), where deep convection is locally generated, simulations using a formulation for surface exchange that varied with the vegetation category (height) produced area-averaged diurnal cycles of forecasted precipitation amounts in better agreement with observations than simulations that used the current Advanced Research Weather Research and Forecasting Model (ARW-WRF) formulation. Parcel theory is used to diagnose mechanisms by which differences in surface exchange influence convection initiation in individual case studies. The more rapid initiation in simulations with strong surface exchange results from a more rapid remov", "link": "https://doi.org/10.1175/2010waf2222426.1", "authors": "S. B. Trier, M. A. LeMone, F. Chen, K. W. Manning", "source": "Weather and Forecasting", "published": "2011-2-1", "first_seen": "2026-11-24T14:57:46+00:00", "score": 50, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.24020", "title": "Enabling joint chemical and meteorological data assimilation with an atmospheric foundation model", "summary": "The hydroxyl radical (OH) is the main oxidant in the troposphere and accounts for 88% of the methane sink, yet its abundance and trends remain poorly constrained. Satellites observe many of the chemical and meteorological drivers of OH, but assimilating both requires a model that represents chemistry and meteorology together. Existing chemistry-climate models are too expensive for joint data assimilation. Here, we present AuroraChem, a fine-tuned version of the Aurora atmospheric foundation model that jointly simulates meteorology and the GEOS-Chem chemical fields needed to constrain OH. A one-year AuroraChem rollout takes 12 minutes on one GPU. Free rollouts remain stable for one year but do not fully capture seasonal cycles. Using idealized data assimilation, we find that chemical observations can constrain the meteorological state and meteorological observations can constrain the chemical state. Inserting only the chemical fields raises the annual mean spatial correlation of 500 hPa temperature from 0.89 to 0.92 and recovers the moisture and circulation pattern of the Indian summer monsoon. Inserting only the meteorological fields raises the 500 hPa OH correlation from 0.89 to 0.93, close to the 0.94 from inserting the chemical fields themselves, and recovers the OH seasonal cycle. Inserting only NO2 columns sampled at TROPOMI pixels gives an OH correlation of 0.93. These relationships likely reflect learned covariances rather than physical coupling, and covariances are what data assimilation uses to let an observation of one variable update the others. AuroraChem theref", "link": "https://arxiv.org/abs/2611.24020", "authors": "Eliot J. Kim, Eric J. Mei, Peter D. Ivatt, Lee T. Murray, Alexander J. Turner", "source": "arXiv", "published": "2026-11-18", "first_seen": "2026-11-24T14:57:46+00:00", "score": 49, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["india", "monsoon"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.19966", "title": "Towards GPROF V08: A Machine-Learning Framework for Simulating Passive Microwave Observations of Precipitation", "summary": "Spatially resolved precipitation retrievals based on convolutional neural networks (CNNs) can improve precipitation estimates from passive microwave (PMW) observations and will be used to implement the next operational PMW retrieval algorithm for the Global Precipitation Measurement (GPM) mission. However, the conventional radiative transfer simulations used to extend the retrieval algorithm to the various sensors of the GPM constellation do not provide the spatial coverage required to train CNN-based retrievals. To address this, we introduce a machine-learning-based simulation framework that enables the training of the CNN-based GPROF-NN 3D retrieval algorithm for the full GPM constellation. At the core of this framework is Satformer, a new neural-network architecture that can translate PMW observations between any pair of GPM sensors. The resulting synthetic observations exhibit lower errors than conventional radiative transfer simulations and lead to more accurate precipitation retrievals when used to train GPROF-NN precipitation retrievals. We further demonstrate the applicability of the framework to new instruments by developing GPROF-NN retrievals for the Microwave Imager aboard the Weather System Follow-on Microwave satellite. While GPROF-NN retrievals based on the new simulation framework achieve lower instantaneous retrieval errors and higher correlations compared to independent reference data than conventional retrievals, residual simulation errors can introduce systematic biases in the resulting retrievals. The proposed simulation framework provides a key compone", "link": "https://arxiv.org/abs/2611.19966", "authors": "Simon Pfreundschuh, Christian D. Kummerow, Paula J. Brown", "source": "arXiv", "published": "2026-11-15", "first_seen": "2026-11-24T14:57:46+00:00", "score": 49, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.03738", "title": "RATSIFT: Resolution-Adaptive Transformer for Solar Irradiance Forecasting and Temporal Downscaling", "summary": "Accurate forecasting and temporal downscaling of solar irradiance is critical for reliable renewable energy integration and grid management. Traditional methods often struggle to capture rapid irradiance variability. In this work, we develop a Transformer-based architecture for simultaneous forecasting and temporal downscaling. The model takes input data at arbitrary resolutions and generates outputs at any resolutions represented within the training data, leveraging both global and local contextual information. To improve training efficiency, a genetic algorithm-based optimization framework is implemented to identify suitable model hyperparameters, while reducing the computational cost of exhaustive grid search. The effectiveness of the proposed model is shown by analyzing real data in Dallas, Texas. The proposed model achieved root mean square error (RMSE) values of 28.785, 29.544, 30.157, 32.132~W/m\\(^2\\) for 15-, 30-, 60-minute, and irregularly spaced global input and producing forecast at 5-minutes resolution, respectively. Furthermore, this model produced reliable uncertainty estimates, exhibiting wider prediction intervals for high-resolution inputs during volatile solar conditions, whereas coarser-resolution inputs result in narrower intervals and significantly lower training time and computational cost. Our approach provides a scalable and efficient framework for multi-resolution solar irradiance forecasting and temporal downscaling, suitable for practical energy forecasting and grid management applications.", "link": "https://arxiv.org/abs/2611.03738", "authors": "Jesto Peter, Timothy M. Hansen, Hossein Moradi Rekabdarkolaee", "source": "arXiv", "published": "2026-11-01", "first_seen": "2026-11-24T14:57:46+00:00", "score": 49, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.36751", "title": "Generative Refinement Learning for Temporal Interpolation in Scientific Machine Learning", "summary": "Computationally expensive simulations and real-world observations often provide data at a lower temporal resolution than downstream tasks require. Averaging observations at fixed grid points can introduce errors, and motion estimates alone do not determine how the physical field values change. In this work, we study whether learning to correct a simple numerical interpolation improves the reconstruction of intermediate scientific fields. Our model, interpolative FLow EXpert (iFLEX), first estimates the missing field by taking a weighted average of the two observations at each grid point, giving more weight to the observation closer to the requested time. During training, subtracting this estimate from an observed intermediate field gives the residual that a conditional diffusion model learns to generate. Both observations condition the model, together with the target time, the interval between observations, and available physical parameters. To reconstruct an unobserved intermediate field, the generated residual is added to the weighted average. We evaluate iFLEX on Navier-Stokes Kraichnan turbulence, Shanghai radar precipitation, and sea surface temperature. Across these datasets, iFLEX achieves lower reconstruction error than the evaluated baselines, including optical-flow and diffusion models developed for video frame interpolation in computer vision. In a controlled turbulence comparison at a Reynolds number of 36,000, learning the residual reduces relative Frobenius norm error from about 13.7 for direct field generation to 10.5, with the diffusion backbone and training", "link": "https://arxiv.org/abs/2610.36751", "authors": "Pu Ren, Michael W. Mahoney, N. Benjamin Erichson", "source": "arXiv", "published": "2026-10-27", "first_seen": "2026-11-24T14:57:46+00:00", "score": 49, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation", "diffusion model"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.15540", "title": "Sensitivity Fidelity Reveals Physical Dependencies Beyond Forecast Accuracy in Deep-Learning Earth-System Models", "summary": "Deep-learning models increasingly rival numerical simulation in Earth-system forecasting, yet forecast error alone cannot determine whether their learned input-output dependencies are physically consistent. Here we introduce sensitivity fidelity as an additional criterion: alongside prediction error, model responses to input perturbations should be examined against a trusted reference or established physical knowledge. In an idealized Rayleigh-Bénard convection benchmark, four surrogate architectures achieved low forecast errors yet encoded markedly different sensitivities. Quantitative comparison with a matched adjoint distinguished the models far more sharply than forecast accuracy and showed that predictive skill and sensitivity fidelity need not coincide, while finite-perturbation experiments further linked these differences to the propagation of initial-condition uncertainty. We then applied this strategy to El Niño-Southern Oscillation prediction, where no adjoint reference exists and learned sensitivities showed event-wise robustness, validity under finite perturbations, and consistency with established precursors. These results identify gradient-based evaluation as a discriminating complement to forecast-error metrics, providing a practical test of whether data-driven Earth-system models learn physically credible dependencies.", "link": "https://arxiv.org/abs/2610.15540", "authors": "Qi Chen, Peng Zhan, Hongxing Cui, Wenqing Cui, Ibrahim Hoteit", "source": "arXiv", "published": "2026-10-11", "first_seen": "2026-11-24T14:57:46+00:00", "score": 49, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2605.00652", "title": "D-SHIFT: Transferring High Spatial Information from GRACE Monthly TWSA Mascon to Daily Products Using Generative Adversarial Networks", "summary": "The Gravity Recovery and Climate Experiment (GRACE) and GRACE Follow-On missions provide monthly terrestrial water storage anomaly (TWSA) estimates for monitoring large-scale water storage change. The monthly temporal resolution of official products limits the analysis of high-frequency hydrological events, while existing daily GRACE products often have reduced spatial resolution due to sparse groundtrack coverage and required smoothing and regularization. This study introduces D-SHIFT (Daily Spatial High-Resolution Inference via Feature Transformation), a deep learning-based framework for generating daily, high-resolution TWSA fields from daily spherical harmonic coefficient (SHC) solutions. The model is trained in the monthly domain by using low-resolution daily solutions and other auxiliary features as inputs, while targeting on monthly mascon products. The model is then applied to daily SHC inputs to generate products with similar spatial resolution of monthly products. Monthly validation against mascon products gives a global mean root mean square error of about 2.3cm, with good correlation and explained variance agreement. Daily analyses show that D-SHIFT produces spatially coherent day-to-day fields and improves basin-scale trend and seasonality estimates compared with low-resolution SHC. The basin-area double-difference analysis indicates that these gains are most relevant for spatially localized signals affected by smoothing and leakage. In Greenland, D-SHIFT better reproduces coastal mass-loss patterns and gives a basin-mean trend of -10.5cm/yr, close to the CSR M", "link": "https://arxiv.org/abs/2605.00652", "authors": "Andreas Dombos, Junyang Gou, Benedikt Soja", "source": "arXiv", "published": "2026-05-01", "first_seen": "2026-11-24T14:57:46+00:00", "score": 49, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2604.21233", "title": "Assessing Emulator Design and Training for Modal Aerosol Microphysics Parameterizations in E3SMv2", "summary": "Toward the goal of using Scientific Machine Learning (SciML) emulators to improve the numerical representation of aerosol processes in global atmospheric models, we explore the emulation of aerosol microphysics processes under cloud-free conditions in the 4-mode Modal Aerosol Module (MAM4) within the Energy Exascale Earth System Model version 2 (E3SMv2). To develop an in-depth understanding of the challenges and opportunities in applying SciML to aerosol processes, we begin with a simple feedforward neural network architecture that has been used in earlier studies, but we systematically examine key emulator design choices, including architecture complexity and variable normalization, while closely monitoring training convergence behavior. Our results show that optimization convergence, scaling strategy, and network complexity strongly influence emulation accuracy. When effective scaling is applied and convergence is achieved, the relatively simple architecture, used together with a moderate network size, can reproduce key features of the microphysics-induced aerosol concentration changes with promising accuracy. These findings provide practical clues for the next stages of emulator development; they also provide general insights that are likely applicable to the emulation of other aerosol processes, as well as other atmospheric physics involving multi-scale variability.", "link": "https://arxiv.org/abs/2604.21233", "authors": "Shady E. Ahmed, Hui Wan, Saad Qadeer, Panos Stinis, Kezhen Chong, Mohammad Taufiq Hassan Mozumder, Kai Zhang, Ann S. Almgren", "source": "arXiv", "published": "2026-04-23", "first_seen": "2026-11-24T14:57:46+00:00", "score": 49, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022gl102327", "title": "Using High‐Resolution Satellite Imagery and Deep Learning to Track Dynamic Seasonality in Small Water Bodies", "summary": "Small water bodies (i.e., ponds; <0.01 km 2 ) play an important role in Earth System processes, including carbon cycling and emissions of methane. Detection and monitoring of ponds using satellite imagery has been extremely difficult and many water maps are biased toward lakes (>0.01 km 2 ). We leverage high‐resolution (3 m) optical satellite imagery from Planet Labs and deep learning methods to map seasonal changes in pond and lake areal extent across four regions in Alaska. Our water maps indicate that changes in open water extent over the snow‐free season are especially pronounced in ponds. To investigate potential impacts of seasonal changes in pond area on carbon emissions, we provide a case study of open water methane emission budgets using the new water maps. Our approach has widespread applications for water resources, habitat and land cover change assessments, wildlife management, risk assessments, and other biogeochemical modeling efforts.", "link": "https://doi.org/10.1029/2022gl102327", "authors": "Andrew L. Mullen, Jennifer D. Watts, Brendan M. Rogers, Mark L. Carroll, Clayton D. Elder, Jonas Noomah, Zachary Williams, Jordan A. Caraballo‐Vega", "source": "Geophysical Research Letters", "published": "2023-4-3", "first_seen": "2026-11-24T14:57:46+00:00", "score": 49, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2020jd032701", "title": "The Response of the Northern Hemisphere Storm Tracks and Jet Streams to Climate Change in the CMIP3, CMIP5, and CMIP6 Climate Models", "summary": "The representation of the Northern Hemisphere (NH) storm tracks and jet streams and their response to climate change have been evaluated in climate model simulations from Phases 3, 5, and 6 of the Coupled Model Intercomparison Project (CMIP3, CMIP5, and CMIP6, respectively). The spatial patterns of the multimodel biases in CMIP3, CMIP5, and CMIP6 are similar; however, the magnitudes of the biases in the CMIP6 models are substantially lower. For instance, the multimodel mean RMSE of the North Atlantic storm track for the CMIP6 models (as measured by time‐filtered sea‐level pressure variance) is over 50% smaller than that of the CMIP3 models in both winter and summer, and over 40% smaller for the North Pacific. The magnitude of the jet stream biases is also reduced in CMIP6, but by a lesser extent. Despite this improved representation of the current climate, the spatial patterns of the climate change response of the NH storm tracks and jet streams remain similar in the CMIP3, CMIP5, and CMIP6 models. The SSP2‐4.5 scenario responses in the CMIP6 models are substantially larger than in the RCP4.5 CMIP5 models, which is consistent with the larger climate sensitivities of the CMIP6 models compared to CMIP5.", "link": "https://doi.org/10.1029/2020jd032701", "authors": "B. J. Harvey, P. Cook, L. C. Shaffrey, R. Schiemann", "source": "JGR: Atmospheres", "published": "2020-12-11", "first_seen": "2026-11-24T14:57:46+00:00", "score": 49, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-020-05407-y", "title": "Four-dimensional structure and sub-seasonal regulation of the Indian summer monsoon multi-decadal mode", "summary": "", "link": "https://doi.org/10.1007/s00382-020-05407-y", "authors": "P. V. Rajesh, B. N. Goswami", "source": "Climate Dynamics", "published": "2020-8-5", "first_seen": "2026-11-24T14:57:46+00:00", "score": 49, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["india", "monsoon"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2026.10069", "title": "Remote sensing-driven machine learning models for SMI-based drought assessment and forecasting", "summary": "The complex and interconnected nature of climate systems makes drought forecasting highly challenging. This study integrates remote sensing and machine learning for Soil Moisture Index (SMI)-based drought prediction. In the first stage, Landsat 8 imagery and SRTM DEM data are used to estimate SMI in drought-prone regions of southern and western Turkey. A comparative analysis of four machine learning algorithms—Random Forests (RF), Gradient Boosting Machines (GBM), eXtreme Gradient Boosting (XGBoost), and LightGBM—is conducted to evaluate their ability to represent SMI from remotely sensed land surface factors. Results show that RF provides the best accuracy, with feature importance analysis highlighting Landsat 8 thermal bands as the most influential predictors. In the second stage, a multistep Convolutional Long Short-Term Memory (ConvLSTM) network is applied to a time series of Landsat 8 images to forecast SMI ~1 month (32 days) ahead. The forecasting framework is evaluated using both the original image sequence and a cloud-gap-filled sequence to assess the impact of cloud contamination on prediction performance. This dual-stage framework demonstrates the value of combining machine learning with remote sensing for both SMI-based drought modeling and forecasting. By capturing key spatial and temporal patterns, the proposed approach offers a robust tool for monitoring drought risk and supporting agricultural management in climate-sensitive regions.", "link": "https://doi.org/10.1017/eds.2026.10069", "authors": "Gokce Gok, Burcu Hudaverdi", "source": "Environmental Data Science", "published": "2026", "first_seen": "2026-11-24T14:57:46+00:00", "score": 49, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2019gl085782", "title": "Causes of Higher Climate Sensitivity in CMIP6 Models", "summary": "Equilibrium climate sensitivity, the global surface temperature response to CO doubling, has been persistently uncertain. Recent consensus places it likely within 1.5–4.5 K. Global climate models (GCMs), which attempt to represent all relevant physical processes, provide the most direct means of estimating climate sensitivity via CO quadrupling experiments. Here we show that the closely related effective climate sensitivity has increased substantially in Coupled Model Intercomparison Project phase 6 (CMIP6), with values spanning 1.8–5.6 K across 27 GCMs and exceeding 4.5 K in 10 of them. This (statistically insignificant) increase is primarily due to stronger positive cloud feedbacks from decreasing extratropical low cloud coverage and albedo. Both of these are tied to the physical representation of clouds which in CMIP6 models lead to weaker responses of extratropical low cloud cover and water content to unforced variations in surface temperature. Establishing the plausibility of these higher sensitivity models is imperative given their implied societal ramifications.", "link": "https://doi.org/10.1029/2019gl085782", "authors": "Mark D. Zelinka, Timothy A. Myers, Daniel T. McCoy, Stephen Po‐Chedley, Peter M. Caldwell, Paulo Ceppi, Stephen A. Klein, Karl E. Taylor", "source": "Geophysical Research Letters", "published": "2020-1-16", "first_seen": "2026-11-24T14:57:46+00:00", "score": 48, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2026ea005326", "title": "Spatiotemporal Mapping of Sea Surface Height and Temperature Fields From Satellite Observations Using Score‐Based Data Assimilation", "summary": "Submesoscale flows at the ocean surface play a crucial role in the Earth system but are difficult to observe on a global scale. Modern satellite observation systems allow us to partially bridge this gap by capturing fields that are dynamically linked to the surface flow such as sea surface height anomaly (SSHA) and sea surface temperature (SST) at submesoscale resolution. However, these high‐resolution observations contain frequent temporal and spatial gaps, which create challenges for traditional reconstruction methods that depend on SSHA and SST data on a uniform grid. To address this, we apply diffusion models guided using the score‐based data assimilation (SDA) algorithm to generate plausible time series of SSHA and SST evolution over small regions of the ocean surface at submesoscale resolution based on spatially and temporally sparse satellite observations. Our procedure is based on training unconditional generative diffusion models to predict the time series evolution of satellite‐observable surface fields using MITgcm llc4320, a high resolution numerical ocean model, as a “prior” field, and steering the generative process via posterior sampling. Next, we use the SDA algorithm to extend our generative models’ receptive field to encompass observations spaced over arbitrarily long time series. We test our models” performance over a wide range of dynamical regimes and observational conditions in an idealized setting and apply our models to real Surface Water and Ocean Topography SSHA data and Advanced Clear‐Sky Processor for Ocean SST fields as proof of concept and moti", "link": "https://doi.org/10.1029/2026ea005326", "authors": "Tatsu Monkman, Dhruv Balwada, Spencer Jones, Scott Martin, K. Shafer Smith", "source": "Earth and Space Science", "published": "2026-11", "first_seen": "2026-11-24T14:57:46+00:00", "score": 48, "topics": ["Deep Learning"], "watch": [], "boosts": ["diffusion model"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr-d-10-05013.1", "title": "Operational Convective-Scale Numerical Weather Prediction with the COSMO Model: Description and Sensitivities", "summary": "Since April 2007, the numerical weather prediction model, COSMO (Consortium for Small Scale Modelling), has been used operationally in a convection-permitting configuration, named COSMO-DE, at the Deutscher Wetterdienst (DWD; German weather service). Here the authors discuss the model changes that were necessary for the convective scale, and report on the experience from the first years of operational application of the model. For COSMO-DE the ability of the numerical solver to treat small-scale structures has been improved by using a Runge–Kutta method, which allows for the use of higher-order upwind advection schemes. The one-moment cloud microphysics parameterization has been extended by a graupel class, and adaptations for describing evaporation of rain and stratiform precipitation processes were made. Comparisons with a much more sophisticated two-moment scheme showed only minor differences in most cases with the exception of strong squall-line situations. Whereas the deep convection parameterization was switched off completely, small-scale shallow convection was still parameterized by the appropriate part of the Tiedtke scheme. During the first year of operational use, convective events in synoptically driven situations were satisfactorily simulated. Also the daily cycles of summertime 10-m wind and 1-h precipitation sums were well captured. However, it became evident that the boundary layer description had to be adapted to enhance convection initiation in airmass convection situations. Here the asymptotic Blackadar length scale l∞ had proven to be a sensitive paramet", "link": "https://doi.org/10.1175/mwr-d-10-05013.1", "authors": "Michael Baldauf, Axel Seifert, Jochen Förstner, Detlev Majewski, Matthias Raschendorfer, Thorsten Reinhardt", "source": "Monthly Weather Review", "published": "2011-12-1", "first_seen": "2026-11-24T14:57:46+00:00", "score": 48, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.4777", "title": "A machine‐learning approach to thunderstorm forecasting through post‐processing of simulation data", "summary": "Thunderstorms pose a major hazard to society and the economy, which calls for reliable thunderstorm forecasts. In this work, we introduce SALAMA, a feedforward neural network model for identifying thunderstorm occurrence in numerical weather prediction (NWP) data. The model is trained on convection‐resolving ensemble forecasts over central Europe and lightning observations. Given only a set of pixel‐wise input parameters that are extracted from NWP data and related to thunderstorm development, SALAMA infers the probability of thunderstorm occurrence in a reliably calibrated manner. For lead times up to 11 h, we find a forecast skill superior to classification based only on NWP reflectivity. Varying the spatiotemporal criteria by which we associate lightning observations with NWP data, we show that the time‐scale for skillful thunderstorm predictions increases linearly with the spatial scale of the forecast.", "link": "https://doi.org/10.1002/qj.4777", "authors": "Kianusch Vahid Yousefnia, Tobias Bölle, Isabella Zöbisch, Thomas Gerz", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2024-6-22", "first_seen": "2026-11-24T14:57:46+00:00", "score": 48, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2024.14", "title": "Time series predictions in unmonitored sites: a survey of machine learning techniques in water resources", "summary": "Prediction of dynamic environmental variables in unmonitored sites remains a long-standing challenge for water resources science. The majority of the world’s freshwater resources have inadequate monitoring of critical environmental variables needed for management. Yet, the need to have widespread predictions of hydrological variables such as river flow and water quality has become increasingly urgent due to climate and land use change over the past decades, and their associated impacts on water resources. Modern machine learning methods increasingly outperform their process-based and empirical model counterparts for hydrologic time series prediction with their ability to extract information from large, diverse data sets. We review relevant state-of-the art applications of machine learning for streamflow, water quality, and other water resources prediction and discuss opportunities to improve the use of machine learning with emerging methods for incorporating watershed characteristics and process knowledge into classical, deep learning, and transfer learning methodologies. The analysis here suggests most prior efforts have been focused on deep learning frameworks built on many sites for predictions at daily time scales in the United States, but that comparisons between different classes of machine learning methods are few and inadequate. We identify several open questions for time series predictions in unmonitored sites that include incorporating dynamic inputs and site characteristics, mechanistic understanding and spatial context, and explainable AI techniques in modern ma", "link": "https://doi.org/10.1017/eds.2024.14", "authors": "Jared D. Willard, Charuleka Varadharajan, Xiaowei Jia, Vipin Kumar", "source": "Environmental Data Science", "published": "2025", "first_seen": "2026-11-24T14:57:46+00:00", "score": 48, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.04536", "title": "Machine learning emulators of dynamic global vegetation models for fast gridded carbon budget predictions", "summary": "The land carbon sink explains most of the variability of the atmospheric CO2 growth rate, but the Global Carbon Budget estimates it with dynamic global vegetation models (DGVMs) run once a year. Emulators could provide it sooner if they reproduce each model outside its training period. Here we show that convolutional neural network emulators of 19 of these models, driven by ERA5 climate and their own past predictions, reproduce the global land sink of these models and its spread over two years not used in training. Global monthly net biome production (NBP) anomalies were reproduced with a median R^2 of 0.81. The error of the multi-model mean annual NBP was at most 0.23 GtC yr^-1. At the grid-cell level, the median R^2 of monthly anomalies was 0.30, partly because of errors that accumulate in the emulated NBP history.", "link": "https://arxiv.org/abs/2611.04536", "authors": "Piyu Ke, Xiaofan Gui, Stephen Sitch, Zhu Liu, Xun Li, Jiang Bian, Pierre Friedlingstein, Philippe Ciais", "source": "arXiv", "published": "2026-11-03", "first_seen": "2026-11-24T14:57:46+00:00", "score": 47, "topics": ["Deep Learning"], "watch": [], "boosts": ["emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.22077", "title": "Can AI Forecast the Extremes? Evaluating Probabilistic Weather Models on Tropical Cyclones", "summary": "Weather prediction is undergoing an important shift, with data-driven AI models outperforming leading numerical weather prediction systems on average at a fraction of the computational cost. Yet, whether this success extends to extreme events remains contested. Earlier evaluations have exposed important shortcomings, but have largely focused on deterministic models and metrics, leaving the capabilities of the latest probabilistic models less understood. We conduct an extensive benchmark of tropical cyclone forecasting, comparing GenCast, FourCastNet 3, and FGN with ECMWF's operational physics-based ensemble, IFS-ENS. We develop a suite of probabilistic metrics and diagnostic analyses to assess cyclone tracking, intensity biases, uncertainty, and the wind-pressure relationship that characterizes storm structure. We find that, despite remaining limitations in intensity and ensemble spread, leading AI models substantially outperform IFS-ENS in cyclone tracking: FGN achieves better probabilistic location scores for 90% of evaluated storms in 2025. Further analyses reveal model-specific failure modes and suggest a lingering influence of pretraining data, pointing to opportunities for targeted improvement. Nonetheless, these results suggest that AI models are capable of capturing physical relationships that remain predictive well beyond typical weather conditions, motivating further investigation into how these capabilities emerge and how to strengthen them.", "link": "https://arxiv.org/abs/2610.22077", "authors": "Nathan Chalumeau, Xavier Renard, Remi Meynadier, Hugo Rakotoarimanga, Marcin Detyniecki, Emmanuel de Bezenac", "source": "arXiv", "published": "2026-10-15", "first_seen": "2026-11-24T14:57:46+00:00", "score": 47, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.24329", "title": "Distribution-Free Uncertainty Quantification for Weather Forecasting: Conformal Prediction Under Spatiotemporal Dependence", "summary": "Conformal prediction gives finite-sample, distribution-free marginal coverage and has begun to be applied to gridded weather forecasts. Marginal coverage concerns the long-run fraction of covered points at a location, not how coverage behaves jointly across space and time on a given day. I benchmark eight interval-construction procedures (Gaussian, pooled and per-cell split conformal, per-season, adaptive conformal inference and rolling windows) for gridded 2 m temperature forecasts at eight lead times from 6 hours to 10 days, using ERA5 at 5.625 degree resolution, a deliberately modest convolutional forecaster and ECMWF's operational HRES, with calibration in 2017-2018 and testing in 2019-2021. Alongside coverage, width and interval score, I report dependence diagnostics: a spatial overdispersion index, quantiles of daily spatial coverage and miss persistence relative to a shuffled-days null. Per-cell methods reach near-nominal marginal coverage, yet the day-to-day variance of the fraction of cells covered is roughly 3 to 10 times what independent cells would give, and misses cluster in time; both effects grow with lead time for the CNN, also appear for HRES, and are shared by all methods. An oracle that divides each day's normalised errors by that day's mean removes 81 to 92 percent of the excess dispersion for the CNN and 93 to 98 percent for HRES, so days of large errors across much of the grid account for most of it. A day-scale predicted from seasonal terms and already-verified errors lowers the overdispersion index without widening intervals but improves interval sco", "link": "https://arxiv.org/abs/2611.24329", "authors": "Mariya", "source": "arXiv", "published": "2026-11-18", "first_seen": "2026-11-24T14:57:46+00:00", "score": 47, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.06130", "title": "Short-Term Forecasting of Heterogeneous Wind Power Fleets: Global Temporal Fusion Transformer Leveraging Static Covariates", "summary": "Accurate short-term wind power forecasting is critical for grid stability and electricity trading. While transformer-based deep learning is state of the art, industry practice relies mostly on local models trained for individual assets. This study investigates whether a global temporal fusion transformer (TFT), trained jointly on a heterogeneous portfolio of wind farms across Germany, outperforms site-specific local models in 48-hour-ahead forecasting. Using numerical weather prediction (NWP) data from the regional ICON-D2 and the global ECMWF HRES models, we compare the global TFT against local models and a linear regression baseline. The global model leverages static covariates, such as farm age, altitude above sea level, hub height, rotor diameter and power curve parameters, to learn shared representations across sites. We evaluate on 100 synthetic wind farm profiles and a real portfolio of 11 German wind farms, across two seasonal test periods with intermediate retraining. The global TFT outperforms the local models for 87% of the synthetic and 77% of the real wind farms and clearly surpasses the linear baseline. Wilcoxon signed-rank tests confirm that these gains are significant across both seasons and datasets. Crucially, this superiority depends on static covariates: without asset-specific context, the global model fails to generalize. The TFT's variable selection network (VSN) reveals the learned feature selection. Altitude emerges as a relevant static discriminator on both datasets, while hub height is decisive on the real portfolio. For dynamic inputs, the encoder", "link": "https://arxiv.org/abs/2611.06130", "authors": "Viktor Walter, Andreas Wagner", "source": "arXiv", "published": "2026-11-04", "first_seen": "2026-11-24T14:57:46+00:00", "score": 47, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2602.22293", "title": "Learning global river system hydrodynamics with a topology-informed foundation model", "summary": "Accurate river prediction is essential for water, food, and energy security, yet extending it reliably from sparse in-situ gauges to the full river network remains an open challenge. Although machine learning has transformed Earth-system modelling, the same sparse and uneven observations have largely confined its advances for rivers to discrete basins rather than connected river systems. Here we introduce GraphRiverCast (GRC), a topology-informed river foundation model for reach-level prediction across the global river network. Exploiting the connectivity and energetics of rivers, it is trained on sparse gauges and predicts daily multivariate hydrodynamics with no prior river conditions. GRC outperforms strong physics-based and machine-learning models. Attribution experiments show that, compared with standard autoregressive models that rely more on temporal recurrence, GRC reconstructs river states from topology and forcing, learning the dynamics themselves and inheriting the self-correcting character of river systems. Its skill therefore barely decays with lead time, even far beyond its training horizon. It also generalises to ungauged reaches and finer-resolution networks, bringing reliable hydrodynamic prediction to poorly monitored regions. More broadly, harnessing the structure and energetics of a system offers a strategy for machine learning in other observation-limited Earth systems.", "link": "https://arxiv.org/abs/2602.22293", "authors": "Hancheng Ren, Gang Zhao, Shuo Wang, Louise Slater, Dai Yamazaki, Shu Liu, Jingfang Fan, Xueying Li", "source": "arXiv", "published": "2026-02-25", "first_seen": "2026-11-24T14:57:46+00:00", "score": 47, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-12-5137-2019", "title": "PALEO-PGEM v1.0: a statistical emulator of Pliocene–Pleistocene climate", "summary": "We describe the development of the “Paleoclimate PLASIM-GENIE (Planet Simulator–Grid-Enabled Integrated Earth system model) emulator” PALEO-PGEM and its application to derive a downscaled high-resolution spatio-temporal description of the climate of the last 5×10 6 years. The 5×10 6 -year time frame is interesting for a range of paleo-environmental questions, not least because it encompasses the evolution of humans. However, the choice of time frame was primarily pragmatic; tectonic changes can be neglected to first order, so that it is reasonable to consider climate forcing restricted to the Earth's orbital configuration, ice-sheet state, and the concentration of atmosphere CO 2 . The approach uses the Gaussian process emulation of the singular value decomposition of ensembles of the intermediate-complexity atmosphere–ocean GCM (general circulation model) PLASIM-GENIE. Spatial fields of bioclimatic variables of surface air temperature (warmest and coolest seasons) and precipitation (wettest and driest seasons) are emulated at 1000-year intervals, driven by time series of scalar boundary-condition forcing (CO 2 , orbit, and ice volume) and assuming the climate is in quasi-equilibrium. Paleoclimate anomalies at climate model resolution are interpolated onto the observed modern climatology to produce a high-resolution spatio-temporal paleoclimate reconstruction of the Pliocene–Pleistocene.", "link": "https://doi.org/10.5194/gmd-12-5137-2019", "authors": "Philip B. Holden, Neil R. Edwards, Thiago F. Rangel, Elisa B. Pereira, Giang T. Tran, Richard D. Wilkinson", "source": "Geoscientific Model Development", "published": "2019-12-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 47, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "emulator"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2025ms005591", "title": "Weather Sensitivity to Sea Surface Temperatures Over the Contiguous United States in a Medium Ensemble of High‐Resolution Regionally Refined Simulations Using E3SM", "summary": "Climate model simulations have long been invaluable tools for synoptic meteorology. However, they are generally too coarse in resolution to resolve fine‐scale extreme weather, which require stronger spatial gradients and sharper representations of topography. Here we perform an ensemble of sea surface temperature (SST)‐forced experiments with the Energy Exascale Earth System Model, applying its regionally‐refined model capability over the contiguous United States. The prescribed SSTs are historically‐derived and designed to represent recurrent patterns of Pacific Ocean variability. Our ensemble allows for understanding of how leading modes of ocean variability affect global hydroclimate but with the added capacity to resolve extreme weather at regional scale over the US. We focus our study on how ocean modes of variability specifically affect extreme heat and extreme precipitation events, snowpack, tropical cyclones, and atmospheric rivers. We find that extreme weather is realistically simulated at regional scale but shown to have a persistent wet precipitation bias and warm temperature bias, which impacts the utility of the ensemble. Nonetheless, our simulations provide a large sample of highly impactful extremes, including extremes possible over the historical period but without a historical analog, and their response to ocean variability.", "link": "https://doi.org/10.1029/2025ms005591", "authors": "S. H. Baek, C. M. Zarzycki, P. A. Ullrich, C. Randall, A. Srivastava, W.‐Y. Wu, R. McCrary, A. M. Rhoades", "source": "Journal of Advances in Modeling Earth Systems", "published": "2026-11", "first_seen": "2026-11-24T14:57:46+00:00", "score": 47, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024ms004713", "title": "Using Machine Learning to Generate a GISS ModelE Calibrated Physics Ensemble (CPE)", "summary": "A neural network (NN) surrogate of the NASA GISS ModelE atmosphere (version E3) is trained on a perturbed parameter ensemble (PPE) spanning 45 physics parameters and 36 outputs. The NN is leveraged in a Markov Chain Monte Carlo (MCMC) Bayesian parameter inference framework to generate a second posterior constrained ensemble coined a “calibrated physics ensemble,” or CPE. The CPE members are characterized by diverse parameter combinations and are, by definition, close to top‐of‐atmosphere radiative balance, and must broadly agree with numerous hydrologic, energy cycle and radiative forcing metrics simultaneously. Global observations of numerous cloud, environment, and radiation properties (provided by global satellite products) are crucial for CPE generation. The inference framework explicitly accounts for discrepancies (or biases) in satellite products during CPE generation. We demonstrate that product discrepancies strongly impact calibration of important model parameter settings (e.g., convective plume entrainment rates; fall speed for cloud ice). Structural improvements new to E3 are retained across CPE members (e.g., stratocumulus simulation). Notably, the framework improved the simulation of shallow cumulus and Amazon rainfall while not degrading radiation fields, an upgrade that neither default parameters nor Latin Hypercube parameter searching achieved. Analyses of the initial PPE suggested several parameters were unimportant for output variation. However, many “unimportant” parameters were needed for CPE generation, a result that brings to the forefront how paramete", "link": "https://doi.org/10.1029/2024ms004713", "authors": "Gregory S. Elsaesser, Marcus van Lier‐Walqui, Qingyuan Yang, Maxwell Kelley, Andrew S. Ackerman, Ann M. Fridlind, Gregory V. Cesana, Gavin A. Schmidt", "source": "Journal of Advances in Modeling Earth Systems", "published": "2025-4", "first_seen": "2026-11-24T14:57:46+00:00", "score": 47, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2026ef008820", "title": "Large Projected Increase in Cloud‐to‐Ground Lightning Under Future Climate", "summary": "Cloud‐to‐ground (CG) lightning poses significant risks to infrastructure, people, and ecosystems. However, while many studies have projected changes in total lightning under warming, future trends in CG lightning remain poorly constrained. Here, we combine ground‐based CG lightning observations with six daily surface meteorological variables (mean temperature, total precipitation, short‐wave radiation, relative humidity, pressure, wind speed) to predict CG lightning density over land at 0.5° resolution using an XGBoost machine learning model. The model accurately captures contemporary spatial and temporal lightning patterns and outperforms an alternative multiple linear regression model as well as three existing parameterizations based on convective precipitation or convective available potential energy times precipitation. Applying the XGBoost model to historical climate shows a 11% increase in global CG lightning frequency over the 20th century. Future projections using outputs from two climate models (MPI‐ESM1‐2‐HR and UKESM1‐0‐LL) reveal large increases of 76%–140% under a high‐emission scenario (SSP3‐7.0), equivalent to roughly 30% more CG lightning per degree of global warming. These increases are substantially higher than those projected by the linear model and previous studies. Absolute increases are largest in the tropics, while relative increases are largest at high latitudes, where lightning density often more than doubles. The largest uncertainties emerge in the tropics for UKESM1‐0‐LL climate, particularly in the Amazon and New Guinea, where future climate diff", "link": "https://doi.org/10.1029/2026ef008820", "authors": "Andreas Krause, Konstantin Gregor, Yuquan Qu, Sander Veraverbeke, Anja Rammig", "source": "Earth's Future", "published": "2026-11", "first_seen": "2026-11-24T14:57:46+00:00", "score": 47, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/2014jd021677", "title": "Land‐atmosphere coupling over North America in CRCM5", "summary": "Land‐atmosphere coupling and its impact on extreme precipitation and temperature events over North America are studied using the fifth generation of the Canadian Regional Climate Model (CRCM5). To this effect, two 30 year long simulations, spanning the 1981–2010 period, with and without land‐atmosphere coupling, have been performed with CRCM5, driven by the European Centre for Medium‐Range Weather Forecasts reanalysis at the boundaries. In the coupled simulation, the soil moisture interacts freely with the atmosphere at each time step, while in the uncoupled simulation, soil moisture is replaced with its climatological value computed from the coupled simulation, thus suppressing the soil moisture‐atmosphere interactions. Analyses of the coupled and uncoupled simulations, for the summer period, show strong soil moisture‐temperature coupling over the Great Plains, consistent with previous studies. The maxima of soil moisture‐precipitation coupling is more spread out and covers the semiarid regions of the western U.S. and parts of the Great Plains. However, the strength of soil moisture‐precipitation coupling is found to be generally weaker than that of soil moisture‐temperature coupling. The study clearly indicates that land‐atmosphere coupling increases the interannual variability of the seasonal mean daily maximum temperature in the Great Plains. Land‐atmosphere coupling is found to significantly modulate selected temperature extremes such as the number of hot days, frequency, and maximum duration of hot spells over the Great Plains. Results also suggest additional hot spot", "link": "https://doi.org/10.1002/2014jd021677", "authors": "G. T. Diro, L. Sushama, A. Martynov, D. I. Jeong, D. Verseghy, K. Winger", "source": "JGR: Atmospheres", "published": "2014-11-8", "first_seen": "2026-11-24T14:57:46+00:00", "score": 47, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-4-809-2023", "title": "Atmospheric response to cold wintertime Tibetan Plateau conditions over eastern Asia in climate models", "summary": "Central Asian orography (namely the Tibetan and Mongolian plateaux) sets important features of the winter climate over eastern Asia and the Pacific. By deflecting the mid-latitude jet polewards it contributes to the formation of the Siberian high and, on the lee side, to the advection of dry cold continental air over the eastern Asian coast and the Pacific Ocean, where atmospheric instability and cyclogenesis thrive. While the mechanic forcing by the orography is assessed in a number of modelling studies, it is still not clear how near-surface temperature over the two most prominent orographic barriers of the central Asian continent – the Tibetan and Mongolian plateaux – influences the winter climate. The problem is particularly relevant in view of a well-known cold bias in state-of-the-art climate models in proximity to the Tibetan Plateau, likely related to the modelling of land processes and land–atmosphere interaction over complex orography. Here we take advantage of the large spread in near-surface temperature over the central Asian plateaux within the Coupled Model Intercomparison Project Phase 6 (CMIP6) to study how colder-than-average Asian plateau temperatures impact the atmospheric circulation. Based on composites of the CMIP6 models' climatologies showing the coldest Tibetan Plateau conditions, we find that such negative temperature anomalies appear to amplify the atmospheric response to orography, with an intensification of the eastern Asian winter monsoon and of the equatorward flank of the Pacific jet. The results of the CMIP6 composite analysis are supported ", "link": "https://doi.org/10.5194/wcd-4-809-2023", "authors": "Alice Portal, Fabio D'Andrea, Paolo Davini, Mostafa E. Hamouda, Claudia Pasquero", "source": "Weather and Climate Dynamics", "published": "2023-9-15", "first_seen": "2026-11-24T14:57:46+00:00", "score": 47, "topics": ["Climate Modelling"], "watch": [], "boosts": ["monsoon", "cmip6"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr2927.1", "title": "A Grid- and Subgrid-Scale Radiation Parameterization of Topographic Effects for Mesoscale Weather Forecast Models", "summary": "Complex topography significantly modifies radiation fluxes at the earth’s surface. As spatial resolutions of mesoscale weather forecast models increase, terrain effects on radiation fluxes induced by slope aspect, slope angle, sky view factor, and shadowing also gain importance. A radiation parameterization scheme is hence designed to better represent these topographic influences to improve weather forecasts. The grid- and subgrid-scale radiation parameterization scheme allows computation of radiation fluxes for each weather forecast model grid cell by considering arbitrarily fine resolved topography without degrading the model’s computational performance. The proposed scheme directly computes mean fluxes for each model grid cell based on flux computations at full spatial resolution of a digital elevation model covering the model domain. Thus the scheme does not require a problematic computation of averaged topographic properties such as aspect angles. Furthermore, the scheme has a nonlocal computation of sky view restriction and shadowing effects. Case studies with the Nonhydrostatic Mesoscale Model (NMM) at resolutions of 4 and 2 km, respectively, and the parameterization based on a 1-km resolved elevation model, showed that effects of this parameterization are significant and result in better temperature forecasts in complex terrain. Rms and mean error of 2-m temperature forecasts are generally improved by 0.5 to 1 K. At night, the consideration of restricted sky view leads to a temperature increase between 0.5 and 1.5 K along valleys. During clear-sky daytime, this warm", "link": "https://doi.org/10.1175/mwr2927.1", "authors": "Mathias D. Müller, Dieter Scherer", "source": "Monthly Weather Review", "published": "2005-6-1", "first_seen": "2026-11-24T14:57:46+00:00", "score": 47, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2024.19", "title": "FloodGNN-GRU: a spatio-temporal graph neural network for flood prediction", "summary": "Classical approaches for flood prediction apply numerical methods for the solution of partial differential equations that capture the physics of inundation processes (e.g., the 2D Shallow Water equations). However, traditional inundation models are still unable to satisfy the requirements of many relevant applications, including early-warning systems, high-resolution (or large spatial domain) simulations, and robust inference over distributions of inputs (e.g., rainfall events). Machine learning (ML) approaches are a promising alternative to physics-based models due to their ability to efficiently capture correlations between relevant inputs and outputs in a data-driven fashion. In particular, once trained, ML models can be tested/deployed much more efficiently than classical approaches. Yet, few ML-based solutions for spatio-temporal flood prediction have been developed, and their reliability/accuracy is poorly understood. In this paper, we propose FloodGNN-GRU, a spatio-temporal flood prediction model that combines a graph neural network (GNN) and a gated recurrent unit (GRU) architecture. Compared to existing approaches, FloodGNN-GRU (i) employs a graph-based model (GNN); (ii) operates on both spatial and temporal dimensions; and (iii) processes the water flow velocities as vector features, instead of scalar features. We evaluate FloodGNN-GRU using a LISFLOOD-FP simulation of Hurricane Harvey (2017) in Houston, Texas. Our results, based on several metrics, show that FloodGNN-GRU outperforms several data-driven alternatives in terms of accuracy. Moreover, our approach can", "link": "https://doi.org/10.1017/eds.2024.19", "authors": "Arnold Kazadi, James Doss-Gollin, Antonia Sebastian, Arlei Silva", "source": "Environmental Data Science", "published": "2024", "first_seen": "2026-11-24T14:57:46+00:00", "score": 47, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.22555", "title": "Atmospheric Chemistry-Climate Modeling with an AI Foundation Model", "summary": "Atmospheric composition and chemistry-climate interactions are central to predicting future climate change. Yet simulating chemical and aerosol processes is typically the most expensive component of an atmospheric model and is often highly simplified or prescribed entirely. AI weather forecasting foundation models have shown skill rivalling process-based models and are increasingly fine-tuned for new atmospheric tasks. Here, we present the first foundation model to capture interactions between emissions, atmospheric composition, and radiation. We fine-tune the Aurora Earth system foundation model on simulations from the chemistry-climate model UKCA. Our model reproduces daily meteorology, composition, aerosol, and radiation fields of the coupled system with 23 of 27 predicted fields achieving $R^2$ above 0.85 in both the troposphere and stratosphere. It reproduces ozone, CO, and temperature with annual mean biases below 4% and the downwelling shortwave and longwave fluxes to within 6%. Our model remains stable in autoregressive simulation over 50 years while running ~$100\\times$ faster than UKCA. By training on paired emissions scenarios, our model learns responses to perturbations by capturing tropospheric ozone's response to changes in NO and CO emissions and surface radiation's response to aerosol. We further show that incorporating MLS satellite ozone retrievals into training corrects biases in the underlying UKCA fields, reducing zonal mean ozone error against collocated observations by 23% between 250 and 20 hPa. Our approach does not suggest process-based modeling ca", "link": "https://arxiv.org/abs/2610.22555", "authors": "James Weber, Makoto Kelp", "source": "arXiv", "published": "2026-10-15", "first_seen": "2026-11-24T14:57:46+00:00", "score": 46, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-22-0077.1", "title": "A Review of Machine Learning for Convective Weather", "summary": "We present an overview of recent work on using artificial intelligence (AI)/machine learning (ML) techniques for forecasting convective weather and its associated hazards, including tornadoes, hail, wind, and lightning. These high-impact phenomena globally cause both massive property damage and loss of life, yet they are very challenging to forecast. Given the recent explosion in developing ML techniques across the weather spectrum and the fact that the skillful prediction of convective weather has immediate societal benefits, we present a thorough review of the current state of the art in AI and ML techniques for convective hazards. Our review includes both traditional approaches, including support vector machines and decision trees, as well as deep learning approaches. We highlight the challenges in developing ML approaches to forecast these phenomena across a variety of spatial and temporal scales. We end with a discussion of promising areas of future work for ML for convective weather, including a discussion of the need to create trustworthy AI forecasts that can be used for forecasters in real time and the need for active cross-sector collaboration on testbeds to validate ML methods in operational situations. Significance Statement We provide an overview of recent machine learning research in predicting hazards from thunderstorms, specifically looking at lightning, wind, hail, and tornadoes. These hazards kill people worldwide and also destroy property and livestock. Improving the prediction of these events in both the local space as well as globally can save lives and", "link": "https://doi.org/10.1175/aies-d-22-0077.1", "authors": "Amy McGovern, Randy J. Chase, Montgomery Flora, David J. Gagne, Ryan Lagerquist, Corey K. Potvin, Nathan Snook, Eric Loken", "source": "Artificial Intelligence for the Earth Systems", "published": "2023-7", "first_seen": "2026-11-24T14:57:46+00:00", "score": 46, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2025ms005608", "title": "Downscaling HRRR Radiation for Distributed Snow Modeling: Part 1—Incoming Shortwave Partitioning and Topographic Correction", "summary": "Recent work has demonstrated the operational potential of iSnobal, a process‐based spatially distributed snow model, in representing snow mass and energy balance when forced with meteorological inputs from the High‐Resolution Rapid Refresh (HRRR) numerical weather prediction model. Incoming shortwave radiation from HRRR has previously been assessed as a forcing field in iSnobal, but did not capture the interactions in complex terrain. In a two‐paper series, we implement new workflows to downscale and terrain‐correct radiation outputs from HRRR and unify the source of model forcing. This paper focuses on downscaling incoming shortwave radiation using Toposplit, a new workflow that involves decomposing the global downward flux into direct and diffuse components for terrain correction. We evaluate the method in the East River Watershed (ERW), CO during water years 2022–2023, comparing different incoming solar radiation schemes: a theoretical approach, unmodified HRRR, and Toposplit. Assessments against in situ instrumentation at four sites showed (a) a systematic positive bias in all modeled shortwave radiation with lower error in HRRR and Toposplit, (b) a greater overestimation of shortwave radiation during cloudy conditions, and (c) inconsistent improvements in modeled snow depth with Toposplit. Spatially, HRRR reduced modeled shortwave and increased snow depth, while Toposplit modulated values across aspect and elevation. This workflow improved upon the bias and physical representation of incoming shortwave radiation over the theoretical implementation but led to minimal im", "link": "https://doi.org/10.1029/2025ms005608", "authors": "Matthew Olson, Alvaro Robledano, Joachim Meyer, J. Michelle Hu, Mathis Leemann, S. McKenzie Skiles", "source": "Journal of Advances in Modeling Earth Systems", "published": "2026-11", "first_seen": "2026-11-24T14:57:46+00:00", "score": 46, "topics": ["Downscaling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2020gl088415", "title": "The Sources of Uncertainty in the Projection of Global Land Monsoon Precipitation", "summary": "Policy makers need reliable future climate projection for adaptation purposes. A clear separation of sources of uncertainty also helps narrow the projection uncertainty. However, it remains unclear for monsoon precipitation projections. Here we quantified the contributions of internal variability, model uncertainty, and scenario uncertainty to the ensemble spread of global land monsoon precipitation projections using Coupled Model Intercomparison Project Phase 5 (CMIP5) models and single‐model initial‐condition large ensembles (SMILEs). For mean precipitation, model uncertainty (contributing ~90%) dominates the projection uncertainty, while the contribution of internal variability (scenario uncertainty) decreases (increases) with time. The source of uncertainty for extreme precipitation differs from that of mean precipitation mainly in long‐term projection, with the contribution of scenario uncertainty comparable to model uncertainty. Reducing model uncertainty can effectively narrow the monsoon precipitation projection. The internal variability estimates differ slightly among models and methods, the uncertainty partitioning is robust in middle‐long term.", "link": "https://doi.org/10.1029/2020gl088415", "authors": "Tianjun Zhou, Jingwen Lu, Wenxia Zhang, Ziming Chen", "source": "Geophysical Research Letters", "published": "2020-8-7", "first_seen": "2026-11-24T14:57:46+00:00", "score": 46, "topics": ["Climate Modelling"], "watch": [], "boosts": ["m
