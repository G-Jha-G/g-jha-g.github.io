tworks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-10-2379-2017", "title": "Skill and independence weighting for multi-model assessments", "summary": "We present a weighting strategy for use with the CMIP5 multi-model archive in the fourth National Climate Assessment, which considers both skill in the climatological performance of models over North America as well as the inter-dependency of models arising from common parameterizations or tuning practices. The method exploits information relating to the climatological mean state of a number of projection-relevant variables as well as metrics representing long-term statistics of weather extremes. The weights, once computed can be used to simply compute weighted means and significance information from an ensemble containing multiple initial condition members from potentially co-dependent models of varying skill. Two parameters in the algorithm determine the degree to which model climatological skill and model uniqueness are rewarded; these parameters are explored and final values are defended for the assessment. The influence of model weighting on projected temperature and precipitation changes is found to be moderate, partly due to a compensating effect between model skill and uniqueness. However, more aggressive skill weighting and weighting by targeted metrics is found to have a more significant effect on inferred ensemble confidence in future patterns of change for a given projection.", "link": "https://doi.org/10.5194/gmd-10-2379-2017", "authors": "Benjamin M. Sanderson, Michael Wehner, Reto Knutti", "source": "Geoscientific Model Development", "published": "2017-6-28", "first_seen": "2026-11-26T13:59:01+00:00", "score": 47, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-22-0077.1", "title": "A Review of Machine Learning for Convective Weather", "summary": "We present an overview of recent work on using artificial intelligence (AI)/machine learning (ML) techniques for forecasting convective weather and its associated hazards, including tornadoes, hail, wind, and lightning. These high-impact phenomena globally cause both massive property damage and loss of life, yet they are very challenging to forecast. Given the recent explosion in developing ML techniques across the weather spectrum and the fact that the skillful prediction of convective weather has immediate societal benefits, we present a thorough review of the current state of the art in AI and ML techniques for convective hazards. Our review includes both traditional approaches, including support vector machines and decision trees, as well as deep learning approaches. We highlight the challenges in developing ML approaches to forecast these phenomena across a variety of spatial and temporal scales. We end with a discussion of promising areas of future work for ML for convective weather, including a discussion of the need to create trustworthy AI forecasts that can be used for forecasters in real time and the need for active cross-sector collaboration on testbeds to validate ML methods in operational situations. Significance Statement We provide an overview of recent machine learning research in predicting hazards from thunderstorms, specifically looking at lightning, wind, hail, and tornadoes. These hazards kill people worldwide and also destroy property and livestock. Improving the prediction of these events in both the local space as well as globally can save lives and", "link": "https://doi.org/10.1175/aies-d-22-0077.1", "authors": "Amy McGovern, Randy J. Chase, Montgomery Flora, David J. Gagne, Ryan Lagerquist, Corey K. Potvin, Nathan Snook, Eric Loken", "source": "Artificial Intelligence for the Earth Systems", "published": "2023-7", "first_seen": "2026-11-26T13:59:01+00:00", "score": 47, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2026ef008820", "title": "Large Projected Increase in Cloud‐to‐Ground Lightning Under Future Climate", "summary": "Cloud‐to‐ground (CG) lightning poses significant risks to infrastructure, people, and ecosystems. However, while many studies have projected changes in total lightning under warming, future trends in CG lightning remain poorly constrained. Here, we combine ground‐based CG lightning observations with six daily surface meteorological variables (mean temperature, total precipitation, short‐wave radiation, relative humidity, pressure, wind speed) to predict CG lightning density over land at 0.5° resolution using an XGBoost machine learning model. The model accurately captures contemporary spatial and temporal lightning patterns and outperforms an alternative multiple linear regression model as well as three existing parameterizations based on convective precipitation or convective available potential energy times precipitation. Applying the XGBoost model to historical climate shows a 11% increase in global CG lightning frequency over the 20th century. Future projections using outputs from two climate models (MPI‐ESM1‐2‐HR and UKESM1‐0‐LL) reveal large increases of 76%–140% under a high‐emission scenario (SSP3‐7.0), equivalent to roughly 30% more CG lightning per degree of global warming. These increases are substantially higher than those projected by the linear model and previous studies. Absolute increases are largest in the tropics, while relative increases are largest at high latitudes, where lightning density often more than doubles. The largest uncertainties emerge in the tropics for UKESM1‐0‐LL climate, particularly in the Amazon and New Guinea, where future climate diff", "link": "https://doi.org/10.1029/2026ef008820", "authors": "Andreas Krause, Konstantin Gregor, Yuquan Qu, Sander Veraverbeke, Anja Rammig", "source": "Earth's Future", "published": "2026-11", "first_seen": "2026-11-26T13:59:01+00:00", "score": 47, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023jd039920", "title": "Changes in Mesoscale Convective System Precipitation Structures in Response to a Warming Climate", "summary": "Mesoscale convective systems (MCSs) are crucial components of the hydrological cycle and often produce flash floods. Given their impact, it is important to understand how they will change under a warming climate. This study uses a satellite‐ and radar‐based MCS tracking algorithm on convection‐permitting climate model simulations and examines changes in MCS properties and precipitation structures between historical and future simulations. An underestimation in MCS total precipitation is evident in historical simulation compared to observations, due to model's depiction of MCS precipitation area and summertime occurrence frequency. Under pseudo‐global warming, increases in MCS frequency and total warm season precipitation are observed, most notably in the southern U.S. The precipitation intensity and precipitating area generated by future MCSs also rises and results in an increase in precipitation volume. MCS precipitation structures are further classified into convective core and stratiform regions to understand how change in these structures contributes to future rainfall changes. In a warmer climate, the stratiform region demonstrates minimal change in size, but increases in mean precipitation rate and mean maximum precipitation rate by 15% and 29% are noted, respectively. A more robust future response is observed in the convective core region, with its size, mean precipitation rate and mean maximum precipitation rate increasing significantly by 24%, 37% and 42%, respectively. Finally, by examining the environmental properties of MCS initial condition, future intensificat", "link": "https://doi.org/10.1029/2023jd039920", "authors": "Wenjun Cui, Thomas J. Galarneau, Kimberly A. Hoogewind", "source": "JGR: Atmospheres", "published": "2024-5-4", "first_seen": "2026-11-26T13:59:01+00:00", "score": 47, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2017jd027468", "title": "Statistical Downscaling of GRACE‐Derived Groundwater Storage Using ET Data in the North China Plain", "summary": "Due to coarse spatial resolution, the application of Gravity Recovery and Climate Experiment (GRACE) data in local groundwater resource management has been limited. To overcome this issue, a downscaling approach is presented to improve the spatial resolution of GRACE‐derived groundwater storage anomalies using evapotranspiration (ET) data. The statistical downscaling method is only applied in areas where there is a strong relationship between GRACE‐derived groundwater storage (GWS) and ET, and the relationship can be established under different spatial resolutions. In this study, GWS anomalies are downscaled from 110 km to 2 km in the North China Plain, capturing subgrid heterogeneity in groundwater storage changes. The downscaled results are further validated using data from 111 observation wells from 2003 to 2014 in the Beijing Plain. The results show that the in situ groundwater levels agree with the Gravity Recovery and Climate Experiment (GRACE) downscaled results for the Beijing Plain in both interannual and monthly scales, with the correlation coefficient of 0.94 and 0.80, respectively. The correlation coefficients vary from 0.63 to 0.78, in 10 of the 13 Beijing Plain administrative regions. The regional downscaling approach employed in this study may be readily integrated into local water resources planning activities.", "link": "https://doi.org/10.1029/2017jd027468", "authors": "Wenjie Yin, Litang Hu, Menglin Zhang, Jingrui Wang, Shin‐Chan Han", "source": "JGR: Atmospheres", "published": "2018-6-12", "first_seen": "2026-11-26T13:59:01+00:00", "score": 47, "topics": ["Downscaling"], "watch": [], "boosts": [], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41558-022-01452-z", "title": "Widespread irreversible changes in surface temperature and precipitation in response to CO2 forcing", "summary": "Some climate variables do not show the same response to declining atmospheric CO 2 concentrations as before the preceding increase. A comprehensive understanding of this hysteresis effect and its regional patterns is, however, lacking. Here we use an Earth system model with an idealized CO 2 removal scenario to show that surface temperature and precipitation exhibit globally widespread irreversible changes over a timespan of centuries. To explore the climate hysteresis and reversibility on a regional scale, we develop a quantification method that visualizes their spatial patterns. Our experiments project that 89% and 58% of the global area experiences irreversible changes in surface temperature and precipitation, respectively. Strong irreversible response of surface temperature is found in the Southern Ocean, Arctic and North Atlantic Ocean and of precipitation in the tropical Pacific, global monsoon regions and the Himalayas. These global hotspots of irreversible changes can indicate elevated risks of negative impacts on developing countries.", "link": "https://doi.org/10.1038/s41558-022-01452-z", "authors": "Soong-Ki Kim, Jongsoo Shin, Soon-Il An, Hyo-Jeong Kim, Nari Im, Shang-Ping Xie, Jong-Seong Kug, Sang-Wook Yeh", "source": "Nature Climate Change", "published": "2022-9", "first_seen": "2026-11-26T13:59:01+00:00", "score": 47, "topics": ["Climate Modelling"], "watch": [], "boosts": ["himalaya", "monsoon", "precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.42111", "title": "SATFRONT: Detecting Atmospheric Fronts with Satellite Data using Machine Learning", "summary": "Atmospheric fronts are associated with much of the high-impact weather in the mid-latitudes, yet their identification and classification remain largely manual and subjective. Existing deep learning approaches rely primarily on gridded reanalysis or forecast data, limiting their applicability to satellite observations available for time-critical applications. We introduce SATFRONT, a machine learning framework for detecting cold, warm, and occluded fronts over Europe from geostationary satellite observations, with reanalysis data as an optional additional input. The model is trained on frontal analyses from five European national meteorological services and evaluated against UK Met Office analyses for 2024. Using satellite observations alone, SATFRONT achieves a Critical Success Index (CSI) of 0.428 at a 150 km tolerance, within the range of agreement between analyses from different meteorological services (0.277-0.501) and higher than that of an operational rule-based front detector that uses satellite data (0.133). Adding ERA5 reanalysis increases the CSI to 0.591. ERA5 substantially improves the placement of individual fronts, although its effect on their annual spatial distribution varies by front type. These results demonstrate that cold, warm, and occluded fronts can be detected directly from geostationary satellite observations, providing a basis for automated frontal analyses at the high temporal frequency required for time-critical applications.", "link": "https://arxiv.org/abs/2610.42111", "authors": "Ioannis Dravilas, Miruna Stoicescu, Roope Tervo, Carlos Horn, Oriol Hinojo Comellas, Sina Montazeri, Andrea Meraner, Ana Lucic", "source": "arXiv", "published": "2026-10-30", "first_seen": "2026-11-26T13:59:01+00:00", "score": 46, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.22555", "title": "Atmospheric Chemistry-Climate Modeling with an AI Foundation Model", "summary": "Atmospheric composition and chemistry-climate interactions are central to predicting future climate change. Yet simulating chemical and aerosol processes is typically the most expensive component of an atmospheric model and is often highly simplified or prescribed entirely. AI weather forecasting foundation models have shown skill rivalling process-based models and are increasingly fine-tuned for new atmospheric tasks. Here, we present the first foundation model to capture interactions between emissions, atmospheric composition, and radiation. We fine-tune the Aurora Earth system foundation model on simulations from the chemistry-climate model UKCA. Our model reproduces daily meteorology, composition, aerosol, and radiation fields of the coupled system with 23 of 27 predicted fields achieving $R^2$ above 0.85 in both the troposphere and stratosphere. It reproduces ozone, CO, and temperature with annual mean biases below 4% and the downwelling shortwave and longwave fluxes to within 6%. Our model remains stable in autoregressive simulation over 50 years while running ~$100\\times$ faster than UKCA. By training on paired emissions scenarios, our model learns responses to perturbations by capturing tropospheric ozone's response to changes in NO and CO emissions and surface radiation's response to aerosol. We further show that incorporating MLS satellite ozone retrievals into training corrects biases in the underlying UKCA fields, reducing zonal mean ozone error against collocated observations by 23% between 250 and 20 hPa. Our approach does not suggest process-based modeling ca", "link": "https://arxiv.org/abs/2610.22555", "authors": "James Weber, Makoto Kelp", "source": "arXiv", "published": "2026-10-15", "first_seen": "2026-11-26T13:59:01+00:00", "score": 46, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2025ms005608", "title": "Downscaling HRRR Radiation for Distributed Snow Modeling: Part 1—Incoming Shortwave Partitioning and Topographic Correction", "summary": "Recent work has demonstrated the operational potential of iSnobal, a process‐based spatially distributed snow model, in representing snow mass and energy balance when forced with meteorological inputs from the High‐Resolution Rapid Refresh (HRRR) numerical weather prediction model. Incoming shortwave radiation from HRRR has previously been assessed as a forcing field in iSnobal, but did not capture the interactions in complex terrain. In a two‐paper series, we implement new workflows to downscale and terrain‐correct radiation outputs from HRRR and unify the source of model forcing. This paper focuses on downscaling incoming shortwave radiation using Toposplit, a new workflow that involves decomposing the global downward flux into direct and diffuse components for terrain correction. We evaluate the method in the East River Watershed (ERW), CO during water years 2022–2023, comparing different incoming solar radiation schemes: a theoretical approach, unmodified HRRR, and Toposplit. Assessments against in situ instrumentation at four sites showed (a) a systematic positive bias in all modeled shortwave radiation with lower error in HRRR and Toposplit, (b) a greater overestimation of shortwave radiation during cloudy conditions, and (c) inconsistent improvements in modeled snow depth with Toposplit. Spatially, HRRR reduced modeled shortwave and increased snow depth, while Toposplit modulated values across aspect and elevation. This workflow improved upon the bias and physical representation of incoming shortwave radiation over the theoretical implementation but led to minimal im", "link": "https://doi.org/10.1029/2025ms005608", "authors": "Matthew Olson, Alvaro Robledano, Joachim Meyer, J. Michelle Hu, Mathis Leemann, S. McKenzie Skiles", "source": "Journal of Advances in Modeling Earth Systems", "published": "2026-11", "first_seen": "2026-11-26T13:59:01+00:00", "score": 46, "topics": ["Downscaling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2020ea001265", "title": "Downscaling of Satellite Remote Sensing Soil Moisture Products Over the Tibetan Plateau Based on the Random Forest Algorithm: Preliminary Results", "summary": "Soil moisture (SM) is an important index of soil drought, and it directly controls the energy balance and water cycle of the land surface. As an indicator and amplifier of global warming, the Tibetan Plateau (TP) is becoming warmer and wetter. Because of its particular geographical environment, large‐scale measurements of SM on the TP can only be achieved by satellite remote sensing. The resolution of current SM product of the Soil Moisture Active Passive (SMAP) satellite is 36 km : "Model uncertainties in climate change impacts on Sahel precipitation in ensembles of CMIP5 and CMIP6 simulations", "summary": "The impact of climate change on Sahel precipitation suffers from large uncertainties and is strongly model-dependent. In this study, we analyse sources of inter-model spread in Sahel precipitation change by decomposing precipitation into its dynamic and thermodynamic terms, using a large set of climate model simulations. Results highlight that model uncertainty is mostly related to the response of the atmospheric circulation to climate change (dynamic changes), while thermodynamic changes are less uncertain among climate models. Uncertainties arise mainly because the models simulate different shifts in atmospheric circulation over West Africa in a warmer climate. We linked the changes in atmospheric circulation to the changes in Sea Surface Temperature, emphasising that the Northern hemispheric temperature gradient is primary to explain uncertainties in Sahel precipitation change. Sources of Sahel precipitation uncertainties are shown to be the same in the new generation of climate models (CMIP6) as in the previous generation of models (CMIP5).", "link": "https://doi.org/10.1007/s00382-020-05332-0", "authors": "Paul-Arthur Monerie, Caroline M. Wainwright, Moussa Sidibe, Akintomide Afolayan Akinsanola", "source": "Climate Dynamics", "published": "2020-6-20", "first_seen": "2026-11-26T13:59:01+00:00", "score": 45, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "uncertainty"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-25-0128.1", "title": "A Multimodel, Multischeme Evaluation of Scale-Aware Convective Parameterization for Gray-Zone Tropical Cyclone Simulation over the South China Sea", "summary": "Gray-zone tropical cyclone (TC) simulations, in which convection is partially resolved and partially parameterized at grid spacings of approximately 3–15 km, are sensitive to how grid spacing changes across adaptive meshes. This study evaluates three scale-aware convective parameterization schemes (CPS), the Grell–Freitas (GF), Multiscale Kain–Fritsch (MSKF), and new Tiedtke (NTDK), across regional [Weather Research and Forecasting (WRF) Model] and global [Model for Prediction Across Scales (MPAS), ClusterTech Platform for Atmospheric Simulation (CPAS)] models for TC simulation over the South China Sea. Twenty-seven simulations spanning three TC cases (category-2–5 intensity, including single-TC and binary interaction scenarios) are verified against observations. While domain-averaged precipitation differs by only 10%–20% across models, the convective rain ratio (CRR, the fraction of total precipitation produced by the CPS) shows that models achieve similar rainfall through different convective partitionings. Across the 27 simulations, CPS choice accounts for 44% of CRR variance, compared with 29% for the model framework and 16% for the selected TC case. CRR differences are largest in the gray zone, ranging from 30% to over 90% across schemes. Both global models exhibit midlevel drying relative to WRF regardless of CPS choice. This deficit may partly reflect differences in large-scale moisture constraints between regional and global model frameworks. CPAS’s adaptive mesh partially restores outer rainband precipitation relative to MPAS but introduces discontinuities where gr", "link": "https://doi.org/10.1175/waf-d-25-0128.1", "authors": "Yue Zheng, Chi-Yung Tam, Xing Yu, Jianying Jiang, Wai-Pang Sze, Chi-Chiu Cheung", "source": "Weather and Forecasting", "published": "2026-11", "first_seen": "2026-11-26T13:59:01+00:00", "score": 45, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-24-0207.1", "title": "Forecasting Meridional Swings of the Mei-Yu Rain Belt and Western Pacific Subtropical High During 2020 Summer Extreme Flood", "summary": "The persistent extreme rainfall along the mei-yu front, as a pivotal weather phenomenon in East Asia in the boreal summer, often triggers devastating flood disasters. Notably, during June–July 2020 (JJ2020), the superheavy mei-yu rain belt exhibited pronounced meridional swings, rather than extreme precipitation intensity or duration, but this has received less attention in the literature. This study first identifies the latitudinal location of the rain belt (LLR) during the 2020 mei-yu season and then examines its relationship with the ridge line of the western Pacific subtropical high (WPSH-RL) and further evaluates its forecasting, utilizing real-time forecasts from the Global Ensemble Prediction System of the European Centre for Medium-Range Weather Forecasts (ECMWF-GEPS). We demonstrate that the LLR has a strong correlation with the WPSH-RL 2 days earlier during JJ2020 and the ECMWF-GEPS exhibits considerable performance in predicting the meridional swings of both the LLR and WPSH-RL though the prediction skills tend to decrease slightly when removing their seasonal northward migrations. These clearly indicate the ECMWF-GEPS’s good capability of capturing their synoptic and intraseasonal meridional swings and emphasize the importance of the WPSH-RL in forecasting the LLR. Moreover, for the short- and medium-term forecasts, the range between the 25% and 75% percentiles of ensemble members can well predict the recurring meridional swings in both the LLR and WPSH-RL. Therefore, a probabilistic forecast approach incorporating the ensemble range could provide a more skillfu", "link": "https://doi.org/10.1175/waf-d-24-0207.1", "authors": "Zuosen Zhao, Li Gao, Hong-Li Ren", "source": "Weather and Forecasting", "published": "2025-9", "first_seen": "2026-11-26T13:59:01+00:00", "score": 45, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.5067", "title": "Impact of direct assimilation of ground‐based microwave radiometer on numerical weather prediction: Accounting for interchannel observation error correlations", "summary": "This study clarifies the impact of directly assimilating the brightness temperature from a ground‐based microwave radiometer (GMWR) on the accuracy of numerical weather prediction. The study focuses on heavy rainfall caused by quasi‐stationary band‐shaped precipitation systems in Japan. We used the four‐dimensional variational method to assimilate the brightness temperatures observed by the GMWR network of the Japan Meteorological Agency. To efficiently handle interchannel observation error correlations, the observation term of the cost function was reformulated into the sum of squares of independent variables through a variable transformation based on the eigen‐decomposition of the observation error covariance matrix. Variational quality control was also applied to these independent variables, enabling dynamic quality control. As a result of GMWR assimilation, the accuracy of 12‐hour lead time precipitation forecasts was significantly improved, with notable reductions in biases in the water vapor and temperature fields, particularly in the lower troposphere. These results demonstrate that proper assimilation of GMWR data improves the accuracy of numerical weather prediction, especially for extreme weather events such as heavy rainfall.", "link": "https://doi.org/10.1002/qj.5067", "authors": "Yasutaka Ikuta, Hiromu Seko, Kouichi Yoshimoto, Kentaro Yamamoto, Takuya Kawabata, Hiroshi Ishimoto, Kentaro Araki, Takuya Tajiri", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2025-7-21", "first_seen": "2026-11-26T13:59:01+00:00", "score": 45, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.656", "title": "A new equitable score suitable for verifying precipitation in numerical weather prediction", "summary": "A new equitable score is developed for monitoring precipitation forecasts and for guiding forecast system development. To accommodate the difficult distribution of precipitation, the score measures the error in ‘probability space’ through use of the climatological cumulative distribution function. For sufficiently skilful forecasting systems, the new score is less sensitive to sampling uncertainty than other established scores. It is therefore called here the ‘Stable Equitable Error in Probability Space’ (SEEPS). Weather is partitioned into three categories: ‘dry’, ‘light precipitation’ and ‘heavy precipitation’. SEEPS adapts to the climate of the region in question so that it assesses the salient aspects of the local weather, encouraging ‘refinement’ and discouraging ‘hedging’. To permit continuous monitoring of a system with resolution increasing in time, forecasts are verified against point observations. With some careful choices, observation error and lack of representativeness of model grid‐box averages are found to have relatively little impact. SEEPS can identify key forecasting errors including the overprediction of drizzle, failure to predict heavy large‐scale precipitation and incorrectly locating convective cells. Area averages are calculated taking into account the observation density. A gain of ∼2 days, at lead times of 3–9 days, over the last 14 years is found in extratropical scores of forecasts made at the European Centre for Medium‐Range Weather Forecasts (ECMWF). This gain is due to system improvements, not the increased amount of data assimilated. SEEPS m", "link": "https://doi.org/10.1002/qj.656", "authors": "Mark J. Rodwell, David S. Richardson, Tim D. Hewson, Thomas Haiden", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2010-7", "first_seen": "2026-11-26T13:59:01+00:00", "score": 45, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.04270", "title": "From Sea Surface Height to Velocity - A Machine Learning Approach", "summary": "Inferring upper-ocean velocity from altimetric sea surface height (SSH) remains challenging below 50~km, scales now resolved by the Surface Water and Ocean Topography (SWOT) mission. Conventional methods rely on geostrophic or cyclogeostrophic balance. Here, we demonstrate that deep learning can predict the full velocity vector from SSH and environmental data and recover derivative-based diagnostics, including spectral energy flux. We trained a U-Net encoder--decoder on hourly fields from the pre-SWOT Cape Basin extraction of the LLC4320 ocean simulation, with 1.5-km grid spacing ($11.8$--$15.8^\\circ$E, $41$--$45^\\circ$S). Inputs were SSH, sea surface temperature (SST), and wind stress; targets were horizontal velocities at the surface and 50~m, where wind influence is weaker. At 50~m, the best model achieves a speed RMSE of $0.049\\,\\mathrm{m\\,s^{-1}}$, 29% lower than the geostrophic approximation. Predicted relative vorticity has a correlation of 0.93, compared with 0.75 for the geostrophic approximation. The model also recovers divergence with a correlation of 0.66, whereas geostrophic velocity is nondivergent by definition. Tests of training strategies yield four findings: SSH gradients outperform raw SSH as inputs; wind stress is the most useful covariate for total velocity prediction; SST benefits vary seasonally; and including vorticity and divergence in the loss improves accuracy. These results offer a path for transferring high-fidelity simulation physics to SWOT applications, where kilometer-scale SSH snapshots contain superposed balanced and unbalanced signals.", "link": "https://arxiv.org/abs/2611.04270", "authors": "Yaswanth Reddy Yaradoddi, Jinbo Wang, Elyes Serghine", "source": "arXiv", "published": "2026-11-03", "first_seen": "2026-11-26T13:59:01+00:00", "score": 44, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-12-4823-2019", "title": "The Canadian Earth System Model version 5 (CanESM5.0.3)", "summary": "The Canadian Earth System Model version 5 (CanESM5) is a global model developed to simulate historical climate change and variability, to make centennial-scale projections of future climate, and to produce initialized seasonal and decadal predictions. This paper describes the model components and their coupling, as well as various aspects of model development, including tuning, optimization, and a reproducibility strategy. We also document the stability of the model using a long control simulation, quantify the model's ability to reproduce large-scale features of the historical climate, and evaluate the response of the model to external forcing. CanESM5 is comprised of three-dimensional atmosphere (T63 spectral resolution equivalent roughly to 2.8 ∘ ) and ocean (nominally 1 ∘ ) general circulation models, a sea-ice model, a land surface scheme, and explicit land and ocean carbon cycle models. The model features relatively coarse resolution and high throughput, which facilitates the production of large ensembles. CanESM5 has a notably higher equilibrium climate sensitivity (5.6 K) than its predecessor, CanESM2 (3.7 K), which we briefly discuss, along with simulated changes over the historical period. CanESM5 simulations contribute to the Coupled Model Intercomparison Project phase 6 (CMIP6) and will be employed for climate science and service applications in Canada.", "link": "https://doi.org/10.5194/gmd-12-4823-2019", "authors": "Neil C. Swart, Jason N. S. Cole, Viatcheslav V. Kharin, Mike Lazare, John F. Scinocca, Nathan P. Gillett, James Anstey, Vivek Arora", "source": "Geoscientific Model Development", "published": "2019-11-25", "first_seen": "2026-11-26T13:59:01+00:00", "score": 44, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-17-7915-2024", "title": "Do data-driven models beat numerical models in forecasting weather extremes? A comparison of IFS HRES, Pangu-Weather, and GraphCast", "summary": "The last few years have witnessed the emergence of data-driven weather forecast models capable of competing with – and, in some respects, outperforming – physics-based numerical models. However, recent studies have questioned the capability of data-driven models to provide reliable forecasts of extreme events. Here, we aim to evaluate this claim by comparing the performance of leading data-driven models in a semi-operational setting, focusing on the prediction of near-surface temperature and wind speed extremes globally. We find that data-driven models mostly outperform ECMWF’s physics-based deterministic model in terms of global RMSE for forecasts made 1–10 d ahead and that they can also compete in terms of extreme weather predictions in most regions. However, the performance of data-driven models varies by region, type of extreme event, and forecast lead time. Notably, data-driven models appear to perform best for temperature extremes in regions closer to the tropics and at shorter lead times. We conclude that data-driven models may already be a useful complement to physics-based forecasts in regions where they display superior tail performance but note that some challenges still need to be overcome prior to operational implementation.", "link": "https://doi.org/10.5194/gmd-17-7915-2024", "authors": "Leonardo Olivetti, Gabriele Messori", "source": "Geoscientific Model Development", "published": "2024-11-7", "first_seen": "2026-11-26T13:59:01+00:00", "score": 44, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0121.1", "title": "On the Effective Resolution of AI Weather Prediction Models", "summary": "In this study, we investigate the effective resolution of deterministic artificial intelligence (AI) weather prediction models. We find that an ideal, perfectly trained AI model approximately follows the mean of the forecast distribution for the range of lead times used in the loss function during training. We demonstrate the consequences and limitations of this result with forecast data from several AI models, including Aurora, Pangu, GraphCast, and GenCast, and we compare them to ensemble and deterministic forecasts from the “physics-based” model of the European Centre for Medium-Range Weather Forecasts. We further demonstrate the impact of the resolution on mean-square error scores and suggest a simple method for a fairer comparison of two models with different effective resolution.", "link": "https://doi.org/10.1175/aies-d-25-0121.1", "authors": "Tobias Selz, Anna Allen, Wessel P. Bruinsma, George C. Craig, Stratis Markou, Richard E. Turner", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 44, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2025ms005609", "title": "Downscaling HRRR Radiation for Distributed Snow Modeling: Part 2—Topographic Correction of Incoming Longwave and Evaluation of Combined Radiation Updates", "summary": "The spatially distributed, process‐based snow model iSnobal is a longstanding research model that is widely used in the Western United States. The model has undergone development to be forced with outputs from the High‐Resolution Rapid Refresh (HRRR) numerical weather prediction model. However, the longwave radiation forcing remains internally prepared, with incoming longwave parameterized using empirical relationships that do not fully represent interactions in mountainous terrain. To unify model inputs, in this second paper of a two‐part series, incoming longwave radiation from HRRR is downscaled and adjusted for topography to inform the incoming longwave forcing in iSnobal. Evaluation in the East River Watershed, Colorado, during water years 2022–2023 shows that, relative to the traditional treatment of incoming longwave, this update reduces RMSE on average by 36.6–44.5 Wm −2 at measurement sites. Basin‐wide, when combined with the shortwave radiation updates from Part 1, the net radiative balance increased by +3 Wm −2 , due to reduction in net solar radiation (−34 Wm −2 ) and increase in net longwave radiation (+37 Wm −2 ). These changes lengthened the snow melt‐out date bias at in situ observation sites by 5–9 days, preserving the spatial variability of modeled snow depth across the watershed. The combined updates align radiation forcings with other model forcings, improve the ability of iSnobal to model processes contributing to radiative heterogeneity in complex terrain, and maintain accurate predictions of snowmelt in mountain watersheds for both research and operat", "link": "https://doi.org/10.1029/2025ms005609", "authors": "Alvaro Robledano, Matthew Olson, Joachim Meyer, J. Michelle Hu, S. McKenzie Skiles", "source": "Journal of Advances in Modeling Earth Systems", "published": "2026-11", "first_seen": "2026-11-26T13:59:01+00:00", "score": 44, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2020jd033611", "title": "Evaluation and Projection of Surface Wind Speed Over China Based on CMIP6 GCMs", "summary": "Surface wind speed has great impacts on the economy, environment, and society around the world. Based on 24 global climate models (GCMs) from Coupled Model Intercomparison Project Phase 6 (CMIP6), this paper assesses the historical surface wind speed over China, and quantifies the advancements of CMIP6 over CMIP5. In addition, future changes of surface wind speed under the Shared Socioeconomic Pathway scenarios of 1‐2.6, 2‐4.5, and 5‐8.5 (SSP1‐2.6, SSP2‐4.5, and SSP5‐8.5) are also provided, by using 18 out of the 24 models with all three scenarios. Results show that multimodel ensemble mean of CMIP6 can well capture the spatial distributions of the annual, summer, and winter surface wind speed and generally performs better than both the median of the individual CMIP6 GCMs and multimodel ensemble mean of CMIP5 in monthly, seasonal, and annual wind climatology. However, CMIP6 GCMs fail to reproduce the observed decreasing trends, in terms of magnitude and/or sign. Meanwhile, the annual cycle of the surface wind speed simulated by CMIP6 GCMs falsely demonstrates the maximum in winter instead of spring. In the context of global warming, surface wind speed is projected to decrease in most parts of China in the middle and late 21st century under the three scenarios. Moreover, the trends of wind speed averaged over China will decrease significantly in both annual and winter under all three scenarios, but it will increase significantly in summer under SSP5‐8.5.", "link": "https://doi.org/10.1029/2020jd033611", "authors": "Jie Wu, Ying Shi, Ying Xu", "source": "JGR: Atmospheres", "published": "2020-11-20", "first_seen": "2026-11-26T13:59:01+00:00", "score": 44, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-022-06422-x", "title": "Extended seasonal prediction of spring precipitation over the Upper Colorado River Basin", "summary": "This study provides extended seasonal predictions for the Upper Colorado River Basin (UCRB) precipitation in boreal spring using an artificial neural network (ANN) model and a stepwise linear regression model, respectively. Sea surface temperature (SST) predictors are developed taking advantage of the correlation between the precipitation and SST over three ocean basins. The extratropical North Pacific has a higher correlation with the UCRB spring precipitation than the tropical Pacific and North Atlantic. For the ANN model, the Pearson correlation coefficient between the observed and predicted precipitation exceeds 0.45 ( p -value < 0.01) for a lead time of 12 months. The mean absolute percentage error (MAPE) is below 20% and the Heidke skill score (HSS) is above 50%. Such long-lead prediction skill is probably due to the UCRB soil moisture bridging the SST and precipitation. The stepwise linear regression model shows similar prediction skills to those of ANN. Both models show prediction skills superior to those of an autoregression model (correlation < 0.10) that represents the baseline prediction skill and those of three of the North American Multi-Model Ensemble (NMME) forecast models. The three NMME models exhibit different skills in predicting the precipitation, with the best skills of the correlation ~ 0.40, MAPE < 25%, and HSS > 40% for lead times less than 8 months. This study highlights the advantage of oceanic climate signals in extended seasonal predictions for the UCRB spring precipitation and supports the improvement of the UCRB streamflow prediction and relat", "link": "https://doi.org/10.1007/s00382-022-06422-x", "authors": "Siyu Zhao, Rong Fu, Michael L. Anderson, Sudip Chakraborty, Jonathan H. Jiang, Hui Su, Yu Gu", "source": "Climate Dynamics", "published": "2022-7-21", "first_seen": "2026-11-26T13:59:01+00:00", "score": 44, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.21203/rs.3.rs-10229215/v1", "title": "Conditional Diffusion Downscaling for Probabilistic Subseasonal-to-Seasonal Precipitation Forecasts", "summary": "Kilometre-scale daily precipitation forecasts at Sub-seasonal to Seasonal (S2S) lead times are critical for climate-sensitive sectors, but General Circulation Model (GCM) outputs are coarse and biased. Their ensemble nature also undermines traditional downscaling methods such as Quantile Mapping, which assume predeﬁned relationships. Generative Adversarial Networks (GANs) can generate realistic precipitation ﬁelds but are unstable to train, while diﬀusion models struggle with ∗ To submit to Stochastic Environmental Research and Risk Assessment", "link": "https://doi.org/10.21203/rs.3.rs-10229215/v1", "authors": "Hao-Yu Song, Huidong Jin, Zhao-Hui Lin, Xi Wu", "source": "Research Square", "published": "2026", "first_seen": "2026-11-26T13:59:01+00:00", "score": 95, "topics": ["Downscaling", "Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1029/2026wr044598", "title": "Seasonal Hydropower Forecast Framework Using a Combination of Deep Learning and Physics‐Based Methods", "summary": "Seasonal hydropower forecasts can inform power‐system resource adequacy, but uncertainty propagates through climate, hydrologic, routing, water‐management, and generation components. We develop a regional planning prototype linking North American Multi‐Model Ensemble seasonal forecasts, Fourier Neural Operator (FNO) downscaling, an uncertainty‐aware long short‐term memory runoff model based on Uncountable Mixtures of Asymmetric Laplacians (UMAL‐LSTM), MOSART‐WM routing and water management, and plant‐level autoregressive generation estimates. During 2011–2020, FNO reduced monthly spatially averaged mean absolute error relative to the best non‐FNO baseline by 13.0% for precipitation, 16.3% for temperature, and 6.2% for wind speed, although residual biases and complex‐terrain errors remained. Runoff evaluation showed broad skill relative to the Global Reach‐level Flood Reanalysis reanalysis target; independent streamflow and controlled‐forcing checks indicated substantial spatial heterogeneity and contributions from both meteorological downscaling and hydrologic‐model limitations. Regional hydropower‐generation CRPS Skill Score (CRPSS) was approximately 0.25–0.33 at a 1‐month lead. Skill declined with lead and varied by region and season; by month four, several snow‐ and melt‐season regional CRPSS values approached or fell below zero. The framework provides probabilistic hydropower indicators for regional resource‐adequacy planning, but it is not a plant‐operations model because it does not explicitly represent plant‐specific submonthly constraints, flood‐control optimization", "link": "https://doi.org/10.1029/2026wr044598", "authors": "G. Konapala, C. Bracken, N. Voisin", "source": "Water Resources Research", "published": "2026-11-01", "first_seen": "2026-11-26T13:59:01+00:00", "score": 90, "topics": ["Downscaling", "Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "arxiv:2610.17693", "title": "Extreme events and statistics in an AI emulator of a global storm-resolving model", "summary": "We present HiRO-ACEv2 (High Resolution Output Ai2 Climate Emulator), a two-stage framework for AI emulation of the 3~km resolution X-SHiELD global storm-resolving model (GSRM), and highlight its ability to generate large ensembles of data for studying the characteristics of tropical cyclones and extreme events in high-resolution simulations at an inference computational cost over 300 times lower than that of traditional numerical GSRMs. HiRO-ACEv2 expands upon the precipitation-only HiRO-ACEv1 model to generate coherent precipitation, 10~m winds, and sea level pressure outputs, enabling a broader range of events to be simulated at high-resolution. Fine-resolution predictions are generated by running an autoregressive emulator of coarsened X-SHiELD at 100 km, whose multivariate outputs are regionally downscaled to 3~km resolution via a separately trained diffusion model. Particular importance is placed on capturing the statistics of extreme events during the diffusion downscaling step. Our ability to match the tails of distributions and generate realistic-looking extreme events in both the `perfect prediction'case as well as in free-running emulator rollouts is improved via the use of multiple denoisers at inference time and several updates to the data sampling, noise sampling, and loss weighting during training. HiRO-ACEv2 closely matches the high-resolution reference distributions of precipitation and near-surface winds out to their 99.9999th percentile values, and broadly tracks the reference distribution of tropical cyclone intensities.", "link": "https://arxiv.org/abs/2610.17693", "authors": "A. Kwa, W. Perkins, Troy Arcomano, Noah D. Brenowitz, C. Bretherton, S. Clark, Lucas M. Harris, J. McGibbon", "source": "Semantic Scholar", "published": "2026-10-13", "first_seen": "2026-11-26T13:59:01+00:00", "score": 88, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": ["precipitation", "extreme", "diffusion model", "emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1007/s40030-026-01007-x", "title": "Statistical Downscaling of CMIP6 Rainfall and Minimum Temperature Using Entropy TOPSIS Model Selection over Jharkhand, India", "summary": "", "link": "https://doi.org/10.1007/s40030-026-01007-x", "authors": "Maniranjan Kumar, Debshri Swargiary, Pramod Soni", "source": "Journal of The Institution of Engineers (India): Series A", "published": "2026-11-03", "first_seen": "2026-11-26T13:59:01+00:00", "score": 87, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["india", "cmip6"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1029/2026jd046624", "title": "Evaluating Statistical Downscaling Techniques for Regional Hydroclimatic Change Projections Over CONUS", "summary": "Projecting the impacts of future climate change is critical for water managers planning infrastructure resilience strategies. Global earth system model output is generally too coarse to provide the detailed, localized information needed for impact assessment, and the computational cost of running higher‐resolution global simulations over sufficiently long periods is prohibitive. Downscaling methods span a wide range of computational cost, and statistical approaches in particular offer a relatively inexpensive way to refine climate model output into a more actionable form. Here, we assess a broad suite of statistical and simplified dynamic downscaling approaches for nine regions across the coterminous United States (CONUS). We develop a suite of metrics to evaluate these methods, including a novel assessment of method performance under dominant large‐scale meteorological conditions identified using a k‐means weather‐typing algorithm along with traditionally used measures of precipitation and temperature, such as seasonal means and spatial variability, and representations of teleconnection patterns associated with El Niño–Southern Oscillation. We also include multiple observational data sets to account for observational uncertainty. This framework enables uncertainty quantification associated with climate model forcing, downscaling method choice, and observational data set selection on a per metric basis. Downscaled data set subselection using our evaluation can substantially alter the magnitude of the projected change signal, but rarely alters the sign of change when compare", "link": "https://doi.org/10.1029/2026jd046624", "authors": "N. Lybarger, E. Gutmann, A. Newman, Chanel Mueller, S. Hartke, Soren Rasmussen, M. Warner, A. Wood", "source": "Journal of Geophysical Research - Atmospheres", "published": "2026-10-13", "first_seen": "2026-11-26T13:59:01+00:00", "score": 81, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "s2:4313e59bbb1b986ac2b84ad1347672c8bf14e3cb", "title": "Super-resolution for downscaling climate data", "summary": "A common task in Earth Sciences is to infer climate information at local and regional scales from global climate models. An alternative to running expensive numerical models at high resolution is to use statistical downscaling techniques. Statistical downscaling aims at learning empirical links be- tween the large-scale and local-scale climate, i.e., a mapping from a low-resolution gridded variable to a higher-resolution grid that incorporates observational data. Seasonal climate predictions can forecast the climate vari- ability up to several months ahead and support a wide range of societal activities. The coarse spatial resolution of seasonal forecasts needs to be downscaled or refined to the local scale for specific applications. In this study, we present super-resolution (SR) techniques for the task of downscaling climate variables with a focus on temperature over Catalonia. Our models are trained using high and medium resolution ( ~ 5 and ~ 25 km) gridded climate datasets with the ultimate goal of increasing the resolution of coarse resolution ( ~100 km) seasonal forecasting systems. Taking the gridded data from ~100 to ~5 km implies a 20x upscaling factor. It is worth pointing out that handling such large upsampling factor is not typical in computer vision, where most applications factors while 16x is considered as extreme SR.", "link": "https://www.semanticscholar.org/paper/4313e59bbb1b986ac2b84ad1347672c8bf14e3cb", "authors": "C. Gomez Gonzalez, K. Serradell", "source": "UPCommons institutional repository (Universitat Politècnica de Catalunya)", "published": "2021", "first_seen": "2026-11-26T13:59:01+00:00", "score": 79, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "s2:28001cce0a929371acb1cd2ea93e9a46510786c4", "title": "TRANSFORMING ENVIRONMENTAL SCIENCE WITH DATA-DRIVEN MODELS: THE ROLE OF MACHINE LEARNING AND DEEP LEARNING", "summary": "The growing complexity and scale of environmental challenges, such as climate change, biodiversity loss, and pollution, necessitate a paradigm shift in analytical approaches. Traditional physical and statistical models often struggle with the non-linear, high-dimensional, and spatiotemporal nature of environmental data. This paper explores the transformative impact of data-driven models, specifically Machine Learning (ML) and Deep Learning (DL), in advancing environmental science. We provide a comprehensive review of their applications across key domains, including climate modeling, air and water quality forecasting, biodiversity monitoring, and precision conservation. A case study is presented, proposing a hybrid Convolutional Neural Network-Long Short-Term Memory (CNN-LSTM) architecture for predicting PM2.5 air pollutant concentrations. Trained on a publicly available dataset of meteorological and pollutant data, the model demonstrates superior performance (MAE: 8.2 µg/m³, R²: 0.91) compared to traditional benchmarks. The results underscore the capability of DL models to capture intricate spatiotemporal dependencies. We discuss the challenges of data quality, model interpretability, and computational demands, concluding that the integration of ML/DL with domain knowledge is crucial for building robust, trustworthy, and actionable tools for environmental management and policy-making.", "link": "https://www.semanticscholar.org/paper/28001cce0a929371acb1cd2ea93e9a46510786c4", "authors": "T. R. M. B. S. D. J. K. P. Punarselvam", "source": "TPM - Testing, Psychometrics, Methodology in Applied Psychology", "published": "2025", "first_seen": "2026-11-26T13:59:01+00:00", "score": 67, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1088/1748-9326/aeb279", "title": "Does higher-resolution climate forcing improve impact model performance?", "summary": "Climate-impact assessments increasingly use high-resolution climate forcing, often assuming that finer spatial detail improves impact projections. Yet this assumption has rarely been tested systematically across impact sectors, regions, and forcing variables. Here we use coordinated simulations from 16 impact models participating in the Inter-Sectoral Impact Model Intercomparison Project to evaluate how increasing forcing resolution from 60 km to 10 km, 3 km, and 1 km affects both climate-input accuracy and impact-model performance. We find that most gains occur when moving from 60 km to 10 km resolution. Further refinement to 3 km and 1 km yields smaller and less consistent benefits, and in some cases degrades performance. Improvements are strongest for temperature-sensitive models and in topographically complex regions, where finer forcing better captures spatial gradients. By contrast, precipitation-driven models and low-relief regions show weaker and less systematic gains. These results challenge the expectation that ever-finer climate forcing necessarily improves impact modelling. Instead, the value of resolution depends on the forcing variable, sector, region, and process representation of the impact model. Benchmarking resolution choices against impact-model performance, rather than climate-input accuracy alone, is therefore essential for designing efficient and decision-relevant climate-impact assessments.", "link": "https://doi.org/10.1088/1748-9326/aeb279", "authors": "J. Malle, C. Reyer, Y. Amitai, A. Augustynczik, Y. Be'eri-Shlevin, Elad Ben-Zur, P. Burek, Tarunsinh Chaudhari", "source": "Environmental Research Letters", "published": "2026-10-09", "first_seen": "2026-11-26T13:59:01+00:00", "score": 65, "topics": [], "watch": [], "boosts": ["precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "rec", "pick": null, "cites": null}, {"key": "arxiv:2610.07060", "title": "Skillful Data-Driven Subseasonal Soil Moisture Forecasting: Prospects and Limits for Flash Drought Prediction", "summary": "Despite substantial progress in short-to-medium-range weather forecasting, predicting high-impact events such as flash droughts remains a key challenge for both early warning operations and physically-based subseasonal-to-seasonal (S2S) prediction systems. Here we demonstrate that, for S2S soil-moisture forecasting over Europe, forecast skill depends as much on how the prediction problem is formulated as on the forecasting model itself. Using a Vision Transformer-based architecture with dual-pathway temporal and spatial attention, we show that residual learning is essential to outperform persistence. This advantage is realized only when forecasting root-zone soil moisture in physical units rather than standardized anomalies, revealing that the target representation itself constrains predictability. A probabilistic extension via quantile-head fine-tuning further provides well-calibrated predictive distributions. Benchmarked against deep-learning and operational ECMWF S2S baselines over 2021-2022, our model achieves the highest deterministic and probabilistic skill at all lead times and reliably detects anomalously dry root-zone states (below the 20th percentile). Yet flash drought onset, defined by multi-pentad intensification criteria, remains a fundamental challenge shared across all current S2S systems. These findings advance data-driven S2S soil-moisture forecasting while highlighting the remaining challenge of predicting rapid drought development.", "link": "https://arxiv.org/abs/2610.07060", "authors": "Noelia Otero, Atahan Özer, M. Fernández-Torres, Jackie Ma", "source": "Semantic Scholar", "published": "2026-10-05", "first_seen": "2026-11-26T13:59:01+00:00", "score": 57, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1016/j.isci.2026.117109", "title": "A source-target transfer learning framework with physics priors for subsurface chlorophyll reconstruction in the Northwest Pacific Ocean", "summary": "Summary Three-dimensional (3D) chlorophyll-a (Chl-a) distributions provide a foundation for understanding upper-ocean ecosystem dynamics and biogeochemical variability. We developed the source-target coupled network (ST-CoupleNet), a physics-guided transfer learning framework that combines Earth system model simulations with observation-constrained reconstructions to estimate subsurface Chl-a in the Northwest Pacific Ocean. The framework first learns large-scale spatiotemporal vertical representations from long-term CMIP6 simulations and then adapts them using reconstructed fields constrained by BioGeoChemical-Argo (BGC-Argo) observations, reducing simulation biases while preserving regional variability. By integrating dual-attention, residual learning, and convolutional long short-term memory (ConvLSTM) architectures, ST-CoupleNet substantially improves reconstruction accuracy over a conventional convolutional neural network (CNN). This framework demonstrates how transferable knowledge from climate simulations can be combined with autonomous observations to generate continuous 3D Chl-a fields, enabling large-scale investigations of subsurface marine ecosystems and biogeochemical change.", "link": "https://doi.org/10.1016/j.isci.2026.117109", "authors": "Xiang Gong, Xiao-Ling Li, Xiao-Yu Liu, Jin-Xuan Wan, Tao Zou, Xun Gong, Xin-Yu Guo, Wen-Ming Yin", "source": "iScience", "published": "2026-10-12", "first_seen": "2026-11-26T13:59:01+00:00", "score": 55, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1002/eng2.70984", "title": "Comparative Performance Analysis of CNN, Linear Regression, and Polynomial Interpolation Models for Sea Surface Temperature Prediction Across the Indian Ocean, Arabian Sea, and Bay of Bengal", "summary": "Accurate prediction of Sea Surface Temperature (SST) is vital for understanding ocean–atmosphere interactions, forecasting extreme weather events, and assessing climate change impacts, especially in tropical regions like the Indian Ocean, Arabian Sea, and Bay of Bengal. In this study, we evaluate and compare the performance of three SST prediction models: Convolutional Neural Networks (CNN), Polynomial Interpolation (Polyfit), and Linear Regression (LR). Using historical MODIS SST data from 2002 to 2010, the generated synthetic SST forecasts from 2011 to 2023 and assessed model performance over three oceanic regions. The CNN model was trained on 192 time steps, capturing complex non‐linear SST dynamics. The LR and Polyfit models provided interpretable and computationally efficient baselines. Results showed that the Linear Regression (LR) model achieved the best performance in the Bay of Bengal (RMSE = 0.70) and the Arabian Sea (RMSE = 0.87), whereas the Polyfit model achieved the lowest RMSE in the Indian Ocean (RMSE = 0.90). Overall, the CNN model demonstrated consistent performance across all three ocean basins, while Polyfit showed relatively poor performance in the Bay of Bengal and Arabian Sea because of its higher prediction errors. All models revealed an increasing SST trend consistent with regional ocean warming. Our findings suggest that while LR is effective in capturing seasonal SST trends, CNNs offer better adaptability to dynamic and non‐linear ocean systems. Polyfit, in contrast, is limited in its ability to generalize over long‐term forecasting. This study hi", "link": "https://doi.org/10.1002/eng2.70984", "authors": "M. S. Meer", "source": "Engineering Reports", "published": "2026-10-01", "first_seen": "2026-11-26T13:59:01+00:00", "score": 53, "topics": ["Deep Learning"], "watch": [], "boosts": ["india", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.3389/ffgc.2026.1970558", "title": "A spatially validated explainable framework for large-scale wildfire susceptibility mapping using deep sequence learning and gradient-boosting ensembles", "summary": "Wildfire susceptibility mapping requires predictive frameworks that are accurate, spatially transferable, interpretable, and computationally efficient. This study developed a arge-scale explainable modeling framework for Madhya Pradesh, India. Fifteen topographic, climatic, surface-energy, biophysical, hydrological, land-cover, and anthropogenic conditioning factors were harmonized to a 1-km grid. High-confidence MODIS active-fire observations were clustered using spatio-temporal DBSCAN, and vegetation-constrained pseudo-absences were generated using a 1-km exclusion distance. Six models were evaluated: XGBoost, LightGBM, Gradient Boosting, a stacked ensemble, a Temporal Convolutional Network (TCN), and TCN–BiLSTM. The neural models operated on ordered predictor sequences rather than true chronological time series. Performance was assessed using an independent 70:30 holdout split, bootstrap confidence intervals, repeated random splits, and five-fold 50-km spatial block cross-validation. The stacked ensemble achieved the highest observed held-out ROC–AUC of 0.800 (95% CI: 0.785–0.814), followed closely by XGBoost (0.795) and LightGBM (0.790), whereas TCN and TCN–BiLSTM reached 0.773 and 0.674, respectively. Spatial validation reduced mean AUC to 0.735–0.752. Susceptibility classes derived from training probabilities were independently supported by increasing held-out fire rates from 11.4% in the lowest class to 82.2% in the highest. Explainability analyses consistently identified NDVI and hydroclimatic–energy variables as major predictive contributors. Pseudo-absence distanc", "link": "https://doi.org/10.3389/ffgc.2026.1970558", "authors": "Bilel Zeroualı, Manoranjan Mishra, Afnan Abdullah Alturki, N. J. Kavhiza, Rajkumar Guria, Suman Paul, Debdeep Bhattacharyya, R. Marques da Silva", "source": "Frontiers in Forests and Global Change", "published": "2026-11-09", "first_seen": "2026-11-26T13:59:01+00:00", "score": 53, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["india"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1007/s11069-026-08456-4", "title": "Transferable machine learning prediction of urban pluvial flood water depth using multi-resolution digital elevation models", "summary": "Machine learning methods, particularly Random Forest (RF), present an effective solution for predicting urban pluvial flood water depth, especially in data-scarce regions where traditional hydrological and hydraulic observations are lacking. This study proposes a DEM-centric RF framework for predicting spatially continuous urban flood water depth across various precipitation return periods, evaluating its sensitivity to terrain resolution degradation and potential spatial transferability. The model is trained and tested in Milan using a 1 m LiDAR-derived DEM and evaluated with a coarser 5 m EU-DEM to assess sensitivity to reduced resolution. Transferability is tested by applying the trained model to Cologne using independent 1 m LiDAR data. Model performance is assessed across five precipitation scenarios (5–100-year return periods) using absolute error metrics, tolerance thresholds, spatial diagnostics, and confidence-stratified analyses. Results show that the framework retains useful predictive capability under reduced DEM resolution and cross-city transfer, although performance decreases compared with the original Milan 1 m configuration. Mean absolute errors remain below 0.30 m, with more than 58% of grid cells within ± 0.25 m of the reference flood depth. Prediction errors are mainly found in hydraulically complex areas, while the majority of the urban domain shows well-constrained predictions. Confidence diagnostics indicate that high- and very-high-confidence predictions comply with tolerance thresholds under both DEM resolution degradation and spatial transfer. Thes", "link": "https://doi.org/10.1007/s11069-026-08456-4", "authors": "B. Razdar, I. Manco, P. Schiano, A. Reder, P. Mercogliano", "source": "Natural Hazards", "published": "2026-11-03", "first_seen": "2026-11-26T13:59:01+00:00", "score": 52, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "s2:c76af9d3ddb98ada8b08dc1673b846e068c697a9", "title": "Learning from dense meteorological networks: a regional LSTM model for streamflow simulation", "summary": "", "link": "https://www.semanticscholar.org/paper/c76af9d3ddb98ada8b08dc1673b846e068c697a9", "authors": "I. González-Planet, D. Klotz, C. Juez", "source": "Semantic Scholar", "published": "", "first_seen": "2026-11-26T13:59:01+00:00", "score": 52, "topics": [], "watch": [], "boosts": [], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.47392/irjaeh.2026.0323", "title": "Satellite Imagery Analysis for Climate Monitoring and Space Applications Using Multi-Source Data Fusion and Deep Learning", "summary": "Big climate analysis, space evaluation and space analytics involves an inseparable element of satellite data. The complex of the Artificial Intelligence (AI), Machine Learning (ML), and Deep Learning (DL) products has contributed significantly to the improvement of the applications of remote sensing in the context of automation and precision. Convolutional Neural Networks (CNNs), spectral-spatial as well as hybrid deep learning models have been found to be better when it comes to classification and mapping land cover activities in the environment [1], [12]. Transformer-based models and CNN-Transformers hybrids are also used as latest developments and are more efficient at deriving global contextual features in satellite images [21], [22]. The detection of floods, monitoring of glaciers, mapping of wild fires, analyzing the urban heat, and numerous others are only a small number of real-world applications of AI-powered satellite systems [6], [9], [10]. Despite these advances, the problems of computational complexity, multi-sensor data heterogeneity, small scale real-time processing and cross-regional generalization [5], [18], [20] remain present. Research gaps, methodological tendencies, identification of 22 research studies, systematic review, forming the conceptual basis of an integrated climate monitoring system dubbed GeoSpectra is presented.", "link": "https://doi.org/10.47392/irjaeh.2026.0323", "authors": "Gaurav Tiwari, Sangam Gupta, Anupam Yadav, Dipti Ranjan", "source": "International Research Jo at sub‐seasonal to seasonal (S2S) timescales is critical for drought and flood forecasting, as well as for improving disaster preparedness in human society. Operational physics‐based numerical models are run to predict S2S sea surface temperature and corresponding climate indices, such as El Niño‐Southern Oscillation. However, these models are hampered by computational inefficiencies, rapidly dissipating ocean‐atmosphere initial conditions, and significant uncertainty and biases. Here, we introduce a novel spatiotemporal deep learning neural network to model the nonlinear and complex coupled atmosphere‐ocean weather systems. This model, named as CAS‐Canglong, incorporates climatic and temporal features and employs a self‐attention mechanism to enhance the prediction of global S2S sea surface temperature pattern. Compared to the physics‐based models, it shows higher computational efficiency and more predictive capability, improving one to three months sea surface temperature predictive skill by 55.6 ± 14.1% to 63.4 ± 15.5% in six ocean regions with dominant influence on S2S variability over land. This achievement underscores the huge potential of deep learning for largely improving forecasting skills at the S2S timescales over land.", "link": "https://doi.org/10.1002/advs.78271", "authors": "Long-Hao Wang, Xuan-Ze Zhang, Ruby L. Leung, F. Chiew, A. Aghakouchak, Kai-Ran Ying, Yong-Qiang Zhang", "source": "Advancement of science", "published": "2026-10-15", "first_seen": "2026-11-25T14:31:03+00:00", "score": 68, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "s2:49a371f2be9af580cb802527ce4ca7e6501b1396", "title": "Deep learning-based downscaling of PM 2 . 5 , NO 2 and O 3 over Europe across emission-reduction scenarios", "summary": "", "link": "https://www.semanticscholar.org/paper/49a371f2be9af580cb802527ce4ca7e6501b1396", "authors": "Anthony Rey-Pommier, E. Pisoni, M. Beauchamp, B. Bessagnet, A. de Meij, S. Zauli-Sajani, P. Thunis", "source": "Semantic Scholar", "published": "", "first_seen": "2026-11-25T14:31:03+00:00", "score": 68, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1007/s10707-026-00601-2", "title": "Self-supervised, physics-constrained super-resolution for wind mapping in the absence of high-resolution training references: a case study in Brazil", "summary": "Planning renewable-energy expansion at the national scale requires wind maps far more detailed than sparse meteorological networks and coarse reanalysis grids can typically offer. This study introduces PC-SRCNN, a physics-constrained, self-supervised super-resolution framework that lifts ERA5 wind fields over Brazil from a native 0.25° grid to 0.025°, folding in soft regularization terms for horizontal kinematic consistency and the logarithmic vertical wind profile. The model was evaluated against observations from 190 meteorological stations from Brazil’s INMET network across all twelve months of 2024, benchmarked against IDW, Kriging, U-Net, SRCNN, and a variant constrained only by horizontal kinematics (PC-SRCNN𝜑). The full PC-SRCNN was the only model to outperform native ERA5 with statistical significance in every month, cutting MAE by 5.6–11.0%, reaching vertical-profile R² between 0.80 and 0.87, and posting the lowest error at 133 of the 190 stations (70.0%); the PC-SRCNN𝜑 variant, in contrast, performed significantly worse than ERA5, and the purely data-driven models failed to consistently beat it. These findings show that physical regularization aids wind-field super-resolution only when it respects the vertical structure of the atmospheric boundary layer, suggesting the potential of this framework as a computationally lightweight approach for super-resolution wind mapping in settings where conventional numerical downscaling is computationally demanding. Self-supervised PC-SRCNN framework enhances ERA5 from 0.25° to 0.025° over Brazil. Evaluated against 190 INMET st", "link": "https://doi.org/10.1007/s10707-026-00601-2", "authors": "José Péricles Freire, Lihki Rubio, Jin Yang, Carlos E. Velasquez", "source": "GeoInformatica", "published": "2026-11-17", "first_seen": "2026-11-25T14:31:03+00:00", "score": 66, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.15666/aeer/2404_87838810", "title": "A HYBRID DEEP LEARNING FRAMEWORK FOR LONG-TERM RUNOFF FORECASTING: INTEGRATING TIME SERIES MODELING AND MACHINE LEARNING", "summary": "Long-term runoff forecasting is essential for sustainable water resource management, flood mitigation, and climate adaptation. However, existing hydrological and deep learning models often struggle to simultaneously capture multi-scale temporal dependencies, non-stationarity, and spatial heterogeneity in runoff processes. To address these challenges, this study proposes a Hybrid Deep Learning Framework for Long-Term Runoff Forecasting (HDF-LRF), integrating Climate-Aware Temporal Decomposition (CATD), Bidirectional Long Short-Term Memory (BiLSTM), Temporal Fusion Transformer (TFT), and XGBoost ensemble learning. The framework was developed using globally representative datasets, including GRDC, GRUN, and ERA5, covering 7,841 hydrological stations across diverse climatic regions. CATD was employed to separate trend, seasonal, and residual runoff compon
