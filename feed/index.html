to different grid sizes we perform our calculations on four common spatial resolutions (0.25° × 0.25°, 1° × 1°, 2.5° × 2.5°, and 3.75° × 2.5°). The impact of the chosen “order of operation” in calculating these indices is also determined. Our results show that moderate extremes are relatively insensitive to product and resolution choice, while extreme extremes can be very sensitive. For example, at 0.25° × 0.25° quasi‐global mean Rx1day values vary from 37 mm in PERSIANN‐CDR to 62 mm in T3B42. We find that the interproduct spread becomes prominent at resolutions of 1° × 1° and finer, thus establishing a minimum effective resolution at which observational products agree. Without improvements in interpro", "link": "https://doi.org/10.1002/2016jd025842", "authors": "Nicholas Herold, Ali Behrangi, Lisa V. Alexander", "source": "JGR: Atmospheres", "published": "2017-1-19", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1002/2017jd026783", "title": "Sensitivity of the regional climate in the Middle East and North Africa to volcanic perturbations", "summary": "The Middle East and North Africa (MENA) regional climate appears to be extremely sensitive to volcanic eruptions. Winter cooling after the 1991 Pinatubo eruption far exceeded the mean hemispheric temperature anomaly, even causing snowfall in Israel. To better understand MENA climate variability, the climate responses to the El Chichón and Pinatubo volcanic eruptions are analyzed using observations, NOAA/National Centers for Environmental Prediction Climate Forecast System Reanalysis, and output from the Geophysical Fluid Dynamics Laboratory's High‐Resolution Atmospheric Model. A multiple regression analysis both for the observations and the model output is performed on seasonal summer and winter composites to separate out the contributions from climate trends, El Niño–Southern Oscillation (ENSO), North Atlantic Oscillation (NAO), Indian summer monsoon, and volcanic aerosols. Strong regional temperature and precipitation responses over the MENA region are found in both winter and summer. The model and the observations both show that a positive NAO amplifies the MENA volcanic winter cooling. In boreal summer, the patterns of changing temperature and precipitation suggest a weakening and southward shift of the Intertropical Convergence Zone, caused by volcanic surface cooling and weakening of the Indian and West African monsoons. The model captures the main features of the climate response; however, it underestimates the total cooling, especially in winter, and exhibits a different spatial pattern of the NAO climate response in MENA compared to the observations. The conducted ", "link": "https://doi.org/10.1002/2017jd026783", "authors": "Muhammad Mubashar Dogar, Georgiy Stenchikov, Sergey Osipov, Bruce Wyman, Ming Zhao", "source": "JGR: Atmospheres", "published": "2017-8-10", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india*", "monsoon", "precipitation", "extreme*"]}, {"key": "doi:10.1029/2023jd039275", "title": "A Typical Weakly Forced Mountain‐To‐Plain Extreme Precipitation Event Exacerbated by Urbanization in Beijing", "summary": "The rainstorms that initiate over mountains, propagate to, and suddenly intensify in nearby plains pose great challenges for weather forecasters and the public. Being in a mountain‐plain transition zone, the city of Beijing is prone to rainfall extremes induced by weakly forced mountain‐to‐plain storms. Despite efforts to understand their possible mechanisms, it remains unclear whether and how these mountain‐to‐plain precipitation extremes are affected by urbanization in Beijing. Here we use a high‐resolution weather prediction model to hindcast a weakly forced mountain‐to‐plain extreme rainfall event impacting Beijing on 23 June 2011. We incorporate spatially varying urban canopy parameters into the model to assess their effect on rainfall simulation and find no significant improvement in model performance. By comparing simulations under current and pre‐urbanization scenarios, we find that urbanization intensifies the regional average rainfall within Beijing's Sixth Ring Road by ∼23%, with an increase in peak hourly rainfall rate reaching 27 mm hr −1 . The higher surface roughness and enhanced vertical motions in urban areas facilitate the transport of warm and humid air from lower to mid‐upper layers, fueling the development and maintenance of convective storms. The dragging effect of urban canopy leads to more moisture accumulation and slower‐moving convections, resulting in more rainfall falling in urban areas. Our study underscores the key role of local urbanization in shaping the mountain‐to‐plain rainstorms in Beijing, which may help improve the forecast capacity for", "link": "https://doi.org/10.1029/2023jd039275", "authors": "Yuting He, Jun Wang, Jinming Feng", "source": "JGR: Atmospheres", "published": "2023-11-27", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1029/2021jd034857", "title": "Uncertainty of Tropical Cyclone Wind Radii on Sea Surface Temperature Cooling", "summary": "The sea surface temperature (SST) beneath a tropical cyclone (TC) is of great importance to its dynamics; therefore, understanding and accurately estimating the magnitude of SST cooling is of vital importance. Existing studies have explored important influences on SST of TC translation speed, maximum surface winds, ocean thermal condition, and ocean stratification. But the influence of the TC wind radii (or collectively called the TC size) on SST has been largely overlooked. In this study, we assess the influence of wind radii uncertainty on SST cooling by a total of 15,983 numerical simulations for the western North Pacific during the 2014–2018 seasons. Results show a 6%–20% SST cooling error induced using wind radii from the Joint Typhoon Warning Center official forecast and a 35%–40% SST cooling error using wind radii from the operational runs of the Hurricane Weather Research and Forecasting (HWRF) model. Our results indicate that SST cooling is most sensitive to the radius of 64 kt winds (R64) due to its effects on the integrated kinetic energy of the TC and subsequent mixing of the ocean surface layer. It is also found that the correlation between SST cooling induced by the TC and its size is 0.49, which is the highest among all the parameters tested. This suggests that it is extremely important to get TC size correct in order to predict the SST cooling response, which then impacts TC evolution in numerical weather prediction models.", "link": "https://doi.org/10.1029/2021jd034857", "authors": "Iam‐Fei Pun, John A. Knaff, Charles R. Sampson", "source": "JGR: Atmospheres", "published": "2021-7-19", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme*", "uncertainty"]}, {"key": "doi:10.1029/2026jd047939", "title": "Enhanced Interannual Fluctuations of Northern Hemisphere Land Monsoon Rainfall in Long‐Term Projections", "summary": "Reliable projection of the interannual variability of Northern Hemisphere land monsoon rainfall (NHLMR) under global warming is vital to effective climate adaptation and disaster mitigation. Based on the performance of 33 models of Coupled Model Intercomparison Project Phase 6 (CMIP6), long‐term (2064–2099) projections of the interannual intensity of NHLMR under various emission scenarios are derived using a subset of physical‐constrained optimal models. Under high‐emission scenario, the leading mode of the interannual NHLMR will retain its nearly uniform spatial pattern but its intensity significantly enhances by 18.8%. While the intensity of tropical Pacific Ocean and its relationship with NHLMR both remain, which neither contribute to the intensified interannual NHLMR, the more frequent wet‐dry swings of NHLMR are primarily driven by the thermodynamic effect associated with the increased mean state moisture in a warming future. The projected insignificant relationship between NHLMR and tropical Atlantic Ocean (TAO) suggests a limited role of TAO in driving NHLMR interannual variability. However, the models' poor performance in simulating the NHLMR‐TAO linkage adds uncertainty for the projections.", "link": "https://doi.org/10.1029/2026jd047939", "authors": "Yeyan Jiang, Shengjie Chen, Ying Yang, Tim Li, Zhiwei Zhu", "source": "JGR: Atmospheres", "published": "2026-11-21", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["monsoon", "cmip6", "uncertainty"]}, {"key": "doi:10.1002/2016jd026279", "title": "Evaluating the present annual water budget of a Himalayan headwater river basin using a high‐resolution atmosphere‐hydrology model", "summary": "Understanding the present water budget in Himalayan Basins is a challenge due to poor in situ coverage, incomplete or unreliable records, and the limitations of coarse resolution gridded data set. In the study, a two‐way coupled implementation of the Weather Research and Forecasting (WRF) Model and the WRF‐Hydro hydrological modeling extension package (WRF/WRF‐Hydro) was employed in its offline configuration, over a 10 year simulation period for a mountainous river basin in North India. A triple nest is employed, in which the innermost domain had 3 km for atmospheric model grids and 300 m for hydrological components. Two microphysical parameterization (MP) schemes are quantitatively evaluated to reveal how differently MP influences orographic‐related precipitation and how it impacts hydrological responses. The WRF‐Hydro modeling system shows reasonable skill in capturing the spatial and temporal structure of high‐resolution precipitation, and the resulting stream flow hydrographs exhibit a good correspondence with observation at monthly timescales, although the model tends to generally underestimate streamflow amounts. The Thompson Scheme fits better to the observations in the study. More importantly, WRF shows that for high‐altitude precipitation, a high “bias” is exhibited in winter precipitation from WRF, which is about double to triple that as estimated from valley‐sited rain gauges and remotely sensed precipitation estimates from Tropical Rainfall Measuring Mission and Asian Precipitation ‐ Highly‐Resolved Observational Data Integration Towards Evaluation. Given the fu", "link": "https://doi.org/10.1002/2016jd026279", "authors": "Lu Li, David J. Gochis, Stefan Sobolowski, Michel D. S. Mesquita", "source": "JGR: Atmospheres", "published": "2017-5-3", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india*", "himalaya*", "precipitation"]}, {"key": "doi:10.1002/2015jd023404", "title": "Assessing and improving Noah‐MP land model simulations for the central Tibetan Plateau", "summary": "The Tibetan Plateau (TP) region experiences strong land‐atmosphere interactions, and as an elevated heating source, significantly influences the formation of the Asian monsoon. Those interactions are not well represented in current land‐surface models (LSMs), partly due to difficulties in representing heterogeneities in soil structures in LSM. Simulations using the Noah with multiparameterization options (Noah‐MP) LSM are employed to assess the relative importance of parameterizing vertical soil heterogeneity, organic matter, and soil rhizosphere and their impacts on seasonal evolution of soil temperature, soil moisture, and surface energy and water budgets at the sparsely vegetated Amdo site located in central TP. The LSM spin‐up time at the central TP depends on the complexity of the model physics, ranging from 4 years with simplest soil physics to 30 years with the addition of organic matter and spare to dense rhizosphere parameterization in Noah‐MP. Representing layered soil texture and organic matter does not improve low biases in topsoil moisture. Reducing the saturated conductivity from the mucilage in the rhizosphere produces better results. Surface sensible and latent heat fluxes are better simulated in the monsoon season as well. Adding layered soil texture and organic matter in Noah‐MP retard the thawing in deep soil layers, and the rhizosphere effect delays thawing even more in the transient season. Uncertainties in soil initialization significantly affect deep‐soil temperature and moisture, but uncertainties in atmospheric forcing conditions mainly affect topso", "link": "https://doi.org/10.1002/2015jd023404", "authors": "Yanhong Gao, Kai Li, Fei Chen, Yingsha Jiang, Chungu Lu", "source": "JGR: Atmospheres", "published": "2015-9-23", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["monsoon", "uncertainty"]}, {"key": "doi:10.1002/2014jd021606", "title": "Microphysics of clouds and rain over the Western Ghat", "summary": "In an attempt to unravel the interactions between cloud microphysics and dynamics that make shallow clouds precipitate heavily in this region, some unique observations of rain and cloud microphysical parameters are presented here from two stations, Pune and Mahabaleshwar, one each on the lee and windward sides, respectively, of the Western Ghat (WG) mountains in peninsular India. To elucidate rain microphysics, we used the raindrop size distribution (DSD) by fitting three parameter Gamma functions to the observed raindrop spectra. Over Pune, during stratiform rain with bright band (BB) at 0°C isotherm; concave upward DSD shapes are observed below the BB which becomes concave downward at lower altitudes. It is due to breakup process of large raindrops which increases drop concentration at midsizes suggesting coalescence, collision, and breakup processes. Both slope and intercept parameters of Gamma DSD decrease during no BB condition as altitudes decrease, signifying collision and coalescence processes. Over Mahabaleshwar, bimodal and monomodal DSD are observed during light and heavy rainfall, respectively. With shallow storm heights, small raindrops mainly contribute to both types of rainfall. The DSDs are parameterized, and their radar reflectivity factor‐rainfall intensity relationships are evaluated suggesting the dominance of collision‐coalescence processes. Aircraft measurements of orographic clouds over the WG suggest interaction of cloud mass with the ambient updraft speed. The orographically forced updrafts foster rapid condensational growth of cloud droplets trigge", "link": "https://doi.org/10.1002/2014jd021606", "authors": "Mahen Konwar, S. K. Das, S. M. Deshpande, K. Chakravarty, B. N. Goswami", "source": "JGR: Atmospheres", "published": "2014-5-27", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india*", "precipitation"]}, {"key": "doi:10.1029/2020jd034275", "title": "Observational Quantification of Aerosol Invigoration for Deep Convective Cloud Lifecycle Properties Based on Geostationary Satellite", "summary": "Aerosols affect cloud microstructure, dynamics, and precipitation by acting as cloud condensation nuclei (CCN) and ice nuclei with a large uncertainty for deep convective clouds (DCCs). Here, we quantify the relationships between aerosols and DCC properties after isolating aerosol impacts from meteorology based on the METEOSAT geostationary satellite and Modern‐Era Retrospective Analysis for Research and Application Version 2 (MERRA‐2) reanalysis data. Results show that fine aerosols (radius <1 µm), which serve as the best proxy for CCN from MERRA‐2, exhibit the strongest aerosol invigoration for DCC compared with aerosol optical depth and coarse aerosols. Overall, added fine aerosols result in colder cloud top temperatures (CTTs), longer lifetime, and more rainfall amounts, especially over land. As CTT decreases monotonically with added aerosols, cloud lifetime and rainfall amount reach a maximum at aerosol loading of 5 and 1.5 µg/m 3 over land and ocean, respectively. Added precipitable water (PW) vapor and convective available potential energy (CAPE) are conducive to the development of more vigorous DCC. For fixed PW and CAPE, CTT decreases by up to −12.2°C ± 0.5°C with fine aerosol concentration over land and up to −4.4°C ± 1.0°C over ocean. The DCC lifetime is lengthened by a factor of 1.3 ± 0.1 from clean condition to optimal aerosol loading over land. A respective enhancement in rainfall amounts over land is indicated by a factor of 2.6 ± 0.4. The decreases in lifetime and rainfall beyond the optimal aerosol concentration are likely due to less aerosol wet scavenging", "link": "https://doi.org/10.1029/2020jd034275", "authors": "Zengxin Pan, Daniel Rosenfeld, Yannian Zhu, Feiyue Mao, Wei Gong, Lin Zang", "source": "JGR: Atmospheres", "published": "2021-5-4", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "uncertainty"]}, {"key": "doi:10.1038/s41612-026-01500-x", "title": "Toward a deeper understanding of tropical cyclone precipitation: insights from SHAP-based AI attribution", "summary": "Precipitation induced by tropical cyclones poses severe threats to both coastal and inland regions, yet its environmental associations remain incompletely understood. Leveraging a LightGBM model combined with SHapley Additive exPlanations, this study quantifies the relationships of atmospheric variables across three vertical layers with four TC precipitation characteristics: precipitation rate, precipitation amount, maximum precipitation intensity, and precipitation area. The analysis is based on global TC records, IMERG precipitation, and ERA5 reanalysis over the past two decades. Attribution results show that mid-to-upper-level vertical velocity and relative humidity are the variables most strongly associated with oceanic TC precipitation, while over land, air temperature and relative humidity become more important. These environmental associations further exhibit pronounced heterogeneity across TC subregions, extreme-event conditions, ocean basins, latitudes, and storm characteristics. Overall, these results offer interpretable insights into the relationships between TC precipitation and environmental factors and may inform future modeling efforts.", "link": "https://doi.org/10.1038/s41612-026-01500-x", "authors": "Weiqing Qi, Bin Yong, Elizabeth A. Ritchie, J. Scott Tyo, Josh May, Jian Shi", "source": "npj Climate and Atmospheric Science", "published": "2026-8-6", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1038/s41612-024-00575-8", "title": "Europe faces up to tenfold increase in extreme fires in a warming climate", "summary": "This study quantifies how changes in temperature and precipitation would influence the intensity and duration of extreme fires across Europe. The analysis explores the impact of a range of climate change projections on fire events compared to a baseline of fire danger, using a 30-year ERA5 reanalysis. The results show that areas in southern Europe could experience a tenfold increase in the probability of catastrophic fires occurring in any given year under a moderate CMIP6 scenario. If global temperatures reach the +2 °C threshold, central and northern Europe will also become more susceptible to wildfires during droughts. The increased probability of fire extremes in a warming climate, in combination with an average one-week extension of the fire season across most countries, would put extra strain on Europe’s ability to cope in the forthcoming decades.", "link": "https://doi.org/10.1038/s41612-024-00575-8", "authors": "Siham El Garroussi, Francesca Di Giuseppe, Christopher Barnard, Fredrik Wetterhall", "source": "npj Climate and Atmospheric Science", "published": "2024-1-29", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "extreme*"]}, {"key": "doi:10.1038/s41612-022-00258-2", "title": "West coast India’s rainfall is becoming more convective", "summary": "A disastrous cloudburst and associated floods in Kerala during the 2019 monsoon season raise the hypothesis that rainfall over the west coast of India, much of which is stratiform, may be trending towards being more convective. As a first exploration, we sought statistically significant differences in monthly ERA-5 reanalysis data for the monsoon season between two epochs, 1980–1999 and 2000–2019. Results suggest a more convective (deeper, ice-rich) cloud population in recent decades, with patterns illustrated in ERA-5 spatial maps. Deepening of convection, above and beyond its trend in amount, is also indicated by the steeper regression slope of outgoing longwave radiation trends against precipitation than that exhibited in interannual variability. Our reanalysis results are strengthened by related trends manifested in more direct observations from satellite and gauge-based rainfall and a CAPE index from balloon soundings data.", "link": "https://doi.org/10.1038/s41612-022-00258-2", "authors": "A. V. Sreenath, S. Abhilash, P. Vijaykumar, B. E. Mapes", "source": "npj Climate and Atmospheric Science", "published": "2022-5-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india*", "monsoon", "precipitation"]}, {"key": "doi:10.1038/s41612-023-00361-y", "title": "Potential for surprising heat and drought events in wheat-producing regions of USA and China", "summary": "Previous analyses of the possibility of global breadbasket failures have extrapolated risks based on historical relationships between climate and yields. However, climate change is causing unprecedented events globally, which could exceed critical thresholds and reduce yields, even if there is no historical precedent. This means that we are likely underestimating climate risks to our food system. In the case of wheat, parts of the USA and China show little historical relationship between yields and temperature, but extreme temperatures are now possible that exceed critical physiological thresholds in wheat plants. UNprecedented Simulated Extreme ENsemble (UNSEEN) approaches use large ensembles to generate plausible unprecedented events, which can inform our assessment of the risk to crops. We use the UNSEEN approach with a large ensemble of archived seasonal forecasts to generate thousands of plausible events over the last 40 years and compare the results with historically observed extreme temperature and precipitation. In the US midwest, extreme temperatures that would have happened approximately 1-in-100-years in 1981 now have a return period of 1-in-6 years, while in China, the current return period is on the order of 1-in-16 years. This means that in the US midwest, extreme temperatures that used to have a 1% chance to occur in 1981 now have a 17% chance to occur in any given year, while in China, the chance increased from 1% to 6%. Record-breaking years exceeding critical thresholds for enzymes in the wheat plant are now more likely than in the past, and these record-b", "link": "https://doi.org/10.1038/s41612-023-00361-y", "authors": "Erin Coughlan de Perez, Hamsa Ganapathi, Gibbon I. T. Masukwedza, Timothy Griffin, Timo Kelder", "source": "npj Climate and Atmospheric Science", "published": "2023-6-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1038/s41612-025-01021-z", "title": "Growing human-induced climate change fingerprint in regional weekly fire extremes", "summary": "Wildfires cause large damage to natural and human systems. Despite the clear connection between human-induced climate change and increased fire weather risk, a global, systematic attribution of observed extreme fires to human-induced climate change is lacking. Here, we address this gap by first linking observed regional weekly burned area extremes (>85th percentile) to the fire weather index (FWI) during the fire seasons of 2002–2015 via a logistic regression model, and then using simulations from climate models to quantify the impact of human-induced climate change. Focusing on regions with good predictability of the statistical model, we find that human-induced climate change was responsible for a fraction equal to 8% (±4%, standard deviation across climate models) of the predicted probability of more than 700 regional fire extremes on average, thereby increasing the probability of experiencing a fire extreme across 15 out of 19 analysed regions. While higher temperature is the main driver of the increased fire extreme probability, shifts in precipitation, relative humidity, and/or wind speed substantially modulated fire changes across many regions. Mainly because of warming, the probability of extreme fires attributable to human-induced climate change increased by 5.2%/decade globally over 2002–2015, in line with an acceleration of the climate-driven enhancement of fire extremes over the last decades that may continue in the near future. These findings highlight the urgent need for sustainable fire management strategies.", "link": "https://doi.org/10.1038/s41612-025-01021-z", "authors": "Sifang Feng, Jakob Zscheischler, Zengchao Hao, Emanuele Bevacqua", "source": "npj Climate and Atmospheric Science", "published": "2025-4-23", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1038/s41612-024-00853-5", "title": "How well do climate modes explain precipitation variability?", "summary": "Large-scale modes of climate variability, such as the El Niño-Southern Oscillation, North Atlantic Oscillation, and Indian Ocean Dipole, show significant regional correlations with seasonal weather conditions, and are routinely forecast by meteorological agencies attempting to anticipate seasonal precipitation patterns. Here, we use machine learning together with more traditional approaches to quantify how much precipitation variability can be explained by large-scale modes of variability, and to understand the degree to which these modes interact non-linearly. We find that the relationship between climate modes and precipitation is predominantly non-linear. In some regions and seasons climate modes can explain up to 80% of precipitation variability. However, variability explained is below 10% for more than half of the land surface, and only 1% of the land shows values above 50%. This outcome provides a clear rationale to limit expectations of predictability from modes of variability in all but a few select regions and seasons.", "link": "https://doi.org/10.1038/s41612-024-00853-5", "authors": "Sanaa Hobeichi, Gab Abramowitz, Alex Sen Gupta, Andréa S. Taschetto, Doug Richardson, Neelesh Rampal", "source": "npj Climate and Atmospheric Science", "published": "2024-12-4", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Deep Learning"], "watch": [], "boosts": ["india*", "precipitation"]}, {"key": "doi:10.1038/s41612-021-00224-4", "title": "Increased occurrence of high impact compound events under climate change", "summary": "While compound weather and climate events (CEs) can lead to significant socioeconomic consequences, their response to climate change is mostly unexplored. We report the first multi-model assessment of future changes in return periods for the co-occurrence of heatwaves and drought, and extreme winds and precipitation based on the Coupled Model Intercomparison Project (CMIP6) and three emission scenarios. Extreme winds and precipitation CEs occur more frequently in many regions, particularly under higher emissions. Heatwaves and drought occur more frequently everywhere under all emission scenarios examined. For each CMIP6 model, we derive a skill score for simulating CEs. Models with higher skill in simulating historical CEs project smaller increases in the number of heatwaves and drought in Eurasia, but larger numbers of strong winds and heavy precipitation CEs everywhere for all emission scenarios. This result is partly masked if the whole CMIP6 ensemble is used, pointing to the considerable value in further improvements in climate models.", "link": "https://doi.org/10.1038/s41612-021-00224-4", "authors": "N. N. Ridder, A. M. Ukkola, A. J. Pitman, S. E. Perkins-Kirkpatrick", "source": "npj Climate and Atmospheric Science", "published": "2022-1-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "extreme*"]}, {"key": "doi:10.1038/s41612-024-00579-4", "title": "Global increase in future compound heat stress-heavy precipitation hazards and associated socio-ecosystem risks", "summary": "Compound extremes of lethal heat stress-heavy precipitation events (CHPEs) seriously threaten social and ecological sustainability, while their evolution and effects at the global scale under climate warming remain unclear. Here we develop the global picture of projected changes in CHPEs under various scenarios and investigate their socioeconomic and ecosystem risks combining hazard, exposure, and vulnerability through the composite indicator approach. We find a high percentage of heat stress is followed by heavy precipitation, probably driven by atmospheric conditions. Global average frequency and intensity of CHPEs are projected to increase in the future under high-emission scenarios. Joint return periods of CHPEs are projected to decrease globally, predominantly driven by changes in heat stress extremes. In the long-term future, over half of the population, gross domestic product, and gross primary productivity may face high risk in most regions, with developed regions facing the highest risks under SSP5-8.5 and developing regions facing the highest risks under SSP3-7.0.", "link": "https://doi.org/10.1038/s41612-024-00579-4", "authors": "Zhiling Zhou, Liping Zhang, Qin Zhang, Chen Hu, Gangsheng Wang, Dunxian She", "source": "npj Climate and Atmospheric Science", "published": "2024-1-31", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1038/s41612-023-00468-2", "title": "Increased risk of flash droughts with raised concurrent hot and dry extremes under global warming", "summary": "Flash droughts pose large threats to crop yields and ecosystem services due to their sudden onset and rapid intensification, arousing wide public concern in a warming climate. Their long-term characteristics of change, underlying mechanisms, and especially potential impacts on agriculture, forests, and populations at a global scale, however, remain largely unknown. We used in situ observations, two observation-based global reanalysis data sets, and 22 Earth system models to determine that flash droughts are shifting toward more frequent, accelerated-onset, and longer duration. These changes increased the exposure of agricultural areas, forested areas, and populations to flash droughts by 20.3%, 17.1%, and 30.0%, respectively, during 2001–2020 compared to 1981–2000, with a disproportionate increase in integrated risks across the Amazon Basin and eastern and southern Asia. The increase in concurrent hot and dry climatic conditions driven by warming has been mostly responsible for enabling and intensifying flash droughts over large regions. State-of-the-art Coupled Model Intercomparison Project Phase 6 (CMIP6) models, however, failed to identify the acceleration of the onset time of flash droughts and widely underestimated the occurrence of flash droughts that are driven only by precipitation deficits or by heat waves, probably because they misrepresent the dependence between precipitation and temperature and underestimate the sensitivity of soil moisture to temperature and precipitation at short timescales (e.g., 5 days). These syntheses comprehensively advance our understand", "link": "https://doi.org/10.1038/s41612-023-00468-2", "authors": "Zhaoqi Zeng, Wenxiang Wu, Josep Peñuelas, Yamei Li, Wenzhe Jiao, Zhaolei Li", "source": "npj Climate and Atmospheric Science", "published": "2023-9-7", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "extreme*"]}, {"key": "doi:10.1038/s41612-025-01226-2", "title": "The global Sahel monsoon ocean-pressure index reconciles its regional and large-scale features", "summary": "Monitoring Sahelian rainfall variability is increasingly critical as climate extremes intensify across the region. Here, we develop the Sahelian Monsoon Ocean-Pressure Index (SMOPI), a novel global synthetic indicator constructed from five dynamically coherent sea-level pressure regions statistically linked to June-September Sahel monsoon rainfall. SMOPI captures intra-seasonal and interannual variability, and crucially, reflects the influence of both regional processes and large-scale teleconnections on monsoon dynamics. It aligns with the dominant rainfall variability mode in reanalyses and 29 CMIP6 models. Strong/positive SMOPI phases coincide with wet years and are associated with enhanced convergence, favorable jet configurations, and robust Pacific, Atlantic, and Indian Ocean teleconnections. Conversely, weak/negative SMOPI phases correspond to drought conditions and divergent moisture fluxes. SMOPI exposes model failures in reproducing historical droughts and offers new physical insights into rainfall-driving mechanisms. It stands out as a scalable, potentially transferable diagnostic tool for monitoring/forecasting and evaluating Sahelian monsoon rainfall under global warming.", "link": "https://doi.org/10.1038/s41612-025-01226-2", "authors": "Alain T. Tamoffo, Torsten Weber, Fernand L. Mouassom, Benjamin Le-Roy, Claas Teichmann, Daniela Jacob", "source": "npj Climate and Atmospheric Science", "published": "2025-9-15", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india*", "monsoon", "cmip6", "extreme*"]}, {"key": "doi:10.1038/s41612-021-00219-1", "title": "Famines and likelihood of consecutive megadroughts in India", "summary": "Consecutive failures in the summer monsoon rainfall led to widespread and severe droughts with profound implications for agricultural activities in India. However, the likelihood of successive megadroughts in India’s past and future climate remain poorly understood. Using Palmer Drought Severity Index (PDSI) from the Monsoon Asia Drought Atlas (MADA), we show that the major famines that affected millions of people during 1200–2018 were linked with summer monsoon droughts. Four megadroughts covering more than 40% of the country occurred for two consecutive summer monsoon seasons during 1200–2018. The most recent and severe megadrought occurred in 2002–2003. Simulations from the Community Earth System Model (CESM) for the last millennium (850–2005) ensemble (LME) show that the likelihood of two and three-year consecutive megadroughts during the summer monsoon is about 0.7 and 0.3 events per 100 years, respectively. Large ensemble simulations from CESM (CESM-LE) show a decline in the frequency of megadroughts in the future. Summer monsoon megadroughts are strongly associated with the warm sea surface temperature (SST) anomalies over the Pacific Ocean in the past and future climate. Substantial warming under the projected future climate can cause megadroughts under near-normal precipitation during the summer monsoon season. Despite the projected decline in the likelihood of the summer monsoon megadroughts under the warming climate, megadroughts in the future can have considerable implications for India’s food production and water availability.", "link": "https://doi.org/10.1038/s41612-021-00219-1", "authors": "Vimal Mishra, Saran Aadhar", "source": "npj Climate and Atmospheric Science", "published": "2021-12-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india*", "monsoon", "precipitation"]}, {"key": "doi:10.1038/s41612-021-00190-x", "title": "Global climatology and trends in convective environments from ERA5 and rawinsonde data", "summary": "Globally, thunderstorms are responsible for a significant fraction of rainfall, and in the mid-latitudes often produce extreme weather, including large hail, tornadoes and damaging winds. Despite this importance, how the global frequency of thunderstorms and their accompanying hazards has changed over the past 4 decades remains unclear. Large-scale diagnostics applied to global climate models have suggested that the frequency of thunderstorms and their intensity is likely to increase in the future. Here, we show that according to ERA5 convective available potential energy (CAPE) and convective precipitation (CP) have decreased over the tropics and subtropics with simultaneous increases in 0–6 km wind shear (BS06). Conversely, rawinsonde observations paint a different picture across the mid-latitudes with increasing CAPE and significant decreases to BS06. Differing trends and disagreement between ERA5 and rawinsondes observed over some regions suggest that results should be interpreted with caution, especially for CAPE and CP across tropics where uncertainty is the highest and reliable long-term rawinsonde observations are missing.", "link": "https://doi.org/10.1038/s41612-021-00190-x", "authors": "Mateusz Taszarek, John T. Allen, Mattia Marchio, Harold E. Brooks", "source": "npj Climate and Atmospheric Science", "published": "2021-6-11", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*", "uncertainty"]}, {"key": "doi:10.5194/wcd-1-635-2020", "title": "The effect of seasonally and spatially varying chlorophyll on Bay of Bengal surface ocean properties and the South Asian monsoon", "summary": "Chlorophyll absorbs solar radiation in the upper ocean, increasing the mixed layer radiative heating and sea surface temperatures (SST). Although the influence of chlorophyll distributions in the Arabian Sea on the southwest monsoon has been demonstrated, there is a current knowledge gap regarding how chlorophyll distributions in the Bay of Bengal influence the southwest monsoon. The solar absorption caused by chlorophyll can be parameterized as an optical parameter, h 2 , which expresses the scale depth of the absorption of blue light. Seasonally and spatially varying h 2 fields in the Bay of Bengal were imposed in a 30-year simulation using an atmospheric general circulation model coupled to a mixed layer thermodynamic ocean model in order to investigate the effect of chlorophyll distributions on regional SST, the southwest monsoon circulation, and precipitation. There are both direct local upper-ocean effects, through changes in solar radiation absorption, and indirect remote atmospheric responses. The depth of the mixed layer relative to the perturbed solar penetration depths modulates the response of the SST to chlorophyll. The largest SST response of 0.5 ∘ C to chlorophyll forcing occurs in coastal regions, where chlorophyll concentrations are high ( > 1 mg m −3 ), and when climatological mixed layer depths shoal during the inter-monsoon periods. Precipitation increases significantly (by up to 3 mm d −1 ) across coastal Myanmar during the southwest monsoon onset and over northeast India and Bangladesh during the Autumn inter-monsoon period, decreasing model biases.", "link": "https://doi.org/10.5194/wcd-1-635-2020", "authors": "Jack Giddings, Adrian J. Matthews, Nicholas P. Klingaman, Karen J. Heywood, Manoj Joshi, Benjamin G. M. Webber", "source": "Weather and Climate Dynamics", "published": "2020-10-20", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india*", "monsoon", "precipitation"]}, {"key": "doi:10.5194/wcd-6-1515-2025", "title": "Dynamics, predictability, impacts and climate change considerations of the catastrophic Mediterranean Storm Daniel (2023)", "summary": "In September 2023, Storm Daniel formed in the central Mediterranean Sea, causing significant socioeconomic impacts in Greece, including fatalities and severe damage to agricultural infrastructure. Within a few days, it evolved into a tropical-like storm (medicane) that made landfall in Libya, likely becoming, to our knowledge, the most catastrophic and lethal weather event ever documented in the region. This study places Storm Daniel as a centerpiece of the disasters in Greece and Libya. We conducted a comprehensive analysis that links a cyclone system with hazardous weather conditions relevant to extreme precipitation, floods and significant sea wave activity. In addition, we examine Daniel's predictability in different development stages and draw connections with previous case studies. Given the climatologically extreme precipitation produced by Daniel, we examine the capacity of numerical weather prediction models to capture such extremes, and we finally investigate potential links to climate change. Daniel initially developed like any other intense Mediterranean cyclone, including medicanes: due to upper-tropospheric forcing followed by Rossby wave breaking. At this stage, it produced significant socioeconomic impacts in Greece. As it intensified and attained tropical-like characteristics, it developed markedly just prior to landfall, reaching peak intensity over land. Considering the short lead times (around 4 d), the cyclone formation exhibited low predictability, whilst landfall in Libya was more predictable. Our analysis of impacts highlights that numerical weather ", "link": "https://doi.org/10.5194/wcd-6-1515-2025", "authors": "Emmanouil Flaounas, Stavros Dafis, Silvio Davolio, Davide Faranda, Christian Ferrarin, Katharina Hartmuth", "source": "Weather and Climate Dynamics", "published": "2025-11-24", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.5194/wcd-3-173-2022", "title": "Mediterranean cyclones: current knowledge and open questions on dynamics, prediction, climatology and impacts", "summary": "A large number of intense cyclones occur every year in the Mediterranean basin, one of the climate change hotspots. Producing a broad range of severe socio-economic and environmental impacts in such a densely populated region, Mediterranean cyclones call for coordinated and interdisciplinary research efforts. This article aims at supporting these efforts by reviewing the status of knowledge in the broad field of Mediterranean cyclones. First, we focus on the climatology of Mediterranean cyclone tracks, their relationship to large-scale atmospheric circulation and their future trends. Second, we discuss the dynamics and atmospheric processes that govern the genesis and development of Mediterranean cyclones. Then, we present the different subtypes of Mediterranean cyclones, devoting special attention to medicanes, i.e. cyclones with tropical characteristics and subjects of numerous recent studies. In a subsequent section, we review the state of the art in forecasting cyclones and relevant high-impact weather, and we discuss in detail the challenges and recent efforts to increase their forecast skill. Finally, we discuss the main impacts produced by cyclones, namely heavy precipitation, windstorms, dust transport, storm surges and sea wave extremes. In the last section of this review article, we thoroughly outline the future directions of research that would advance the broader field of Mediterranean cyclones.", "link": "https://doi.org/10.5194/wcd-3-173-2022", "authors": "Emmanouil Flaounas, Silvio Davolio, Shira Raveh-Rubin, Florian Pantillon, Mario Marcello Miglietta, Miguel Angel Gaertner", "source": "Weather and Climate Dynamics", "published": "2022-2-14", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.5194/wcd-3-555-2022", "title": "Summertime changes in climate extremes over the peripheral Arctic regions after a sudden sea ice retreat", "summary": "The retreat of Arctic sea ice is frequently considered to be a possible driver of changes in climate extremes in the Arctic and possibly down to mid-latitudes. However, it remains unclear how the atmosphere will respond to a near-total retreat of summer Arctic sea ice, a reality that might occur in the foreseeable future. This study explores this question by conducting sensitivity experiments with two global coupled climate models run at two different horizontal resolutions to investigate the change in temperature and precipitation extremes during summer over peripheral Arctic regions following a sudden reduction in summer Arctic sea ice cover. An increase in frequency and persistence of maximum surface air temperature is found in all peripheral Arctic regions during the summer, when sea ice loss occurs. For each 1×10 6 km 2 of Arctic sea ice extent reduction, the absolute frequency of days exceeding the surface air temperature of the climatological 90th percentile increases by ∼ 4 % over the Svalbard area, and the duration of warm spells increases by ∼ 1 d per month over the same region. Furthermore, we find that the 10th percentile of surface daily air temperature increases more than the 90th percentile, leading to a weakened diurnal cycle of surface air temperature. Finally, an increase in extreme precipitation, which is less robust than the increase in extreme temperatures, is found in all regions in summer. These findings suggest that a sudden retreat of summer Arctic sea ice clearly impacts the extremes in maximum surface air temperature and precipitation over the per", "link": "https://doi.org/10.5194/wcd-3-555-2022", "authors": "Steve Delhaye, Thierry Fichefet, François Massonnet, David Docquier, Rym Msadek, Svenya Chripko", "source": "Weather and Climate Dynamics", "published": "2022-5-11", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.5194/wcd-1-349-2020", "title": "The American monsoon system in HadGEM3 and UKESM1", "summary": "The simulated climate of the American monsoon system (AMS) in the UK models HadGEM3 GC3.1 (GC3) and the Earth system model UKESM1 is assessed and compared to observations and reanalysis. We evaluate the pre-industrial control, AMIP and historical experiments of UKESM1 and two configurations of GC3: a low (1.875∘×1.25∘) and a medium (0.83∘×0.56∘) resolution. The simulations show a good representation of the seasonal cycle of temperature in monsoon regions, although the historical experiments overestimate the observed summer temperature in the Amazon, Mexico and Central America by more than 1.5 K. The seasonal cycle of rainfall and general characteristics of the North American monsoon of all the simulations agree well with observations and reanalysis, showing a notable improvement from previous versions of the HadGEM model. The models reasonably simulate the bimodal regime of precipitation in southern Mexico, Central America and the Caribbean known as the midsummer drought, although with a stronger-than-observed difference between the two peaks of precipitation and the dry period. Austral summer biases in the modelled Atlantic Intertropical Convergence Zone (ITCZ), cloud cover and regional temperature patterns are significant and influence the simulated regional rainfall in the South American monsoon. These biases lead to an overestimation of precipitation in southeastern Brazil and an underestimation of precipitation in the Amazon. The precipitation biases over the Amazon and southeastern Brazil are greatly reduced in the AMIP simulations, highlighting that the Atlantic sea ", "link": "https://doi.org/10.5194/wcd-1-349-2020", "authors": "Jorge L. García-Franco, Lesley J. Gray, Scott Osprey", "source": "Weather and Climate Dynamics", "published": "2020-7-21", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["monsoon", "precipitation"]}, {"key": "doi:10.5194/wcd-2-489-2021", "title": "Seasonal climate influences on the timing of the Australian monsoon onset", "summary": "The timing of the first monsoon burst of the season, or the monsoon onset, can be a critical piece of information for agriculture, fire management, water management, and emergency response in monsoon regions. Why do some monsoon seasons start earlier or later than others? Previous research has investigated the impact of climate influences such as the El Niño–Southern Oscillation (ENSO) on monsoon variability, but most studies have considered only the impact on rainfall and not the timing of the onset. While this question could be applied to any monsoon system, this research presented in this paper has focused on the Australian monsoon. Even with the wealth of research available on the variability of the Australian monsoon season, the timing of the monsoon onset is one aspect of seasonal variability that still lacks skilful seasonal prediction. To help us better understand the influence of large-scale climate drivers on monsoon onset timing, we recreated 11 previously published Australian monsoon onset datasets and extended these to all cover the same period from the 1950/1951 through the 2020/2021 Australian wet seasons. The extended datasets were then tested for correlations with several standard climate indices to identify which climate drivers could be used as predictors for monsoon onset timing. The results show that many of the relationships between monsoon onset dates and ENSO that were previously published are not as strong when considering the extended datasets. Only a strong La Niña pattern usually has an impact on monsoon onset timing, while ENSO-neutral and El Ni", "link": "https://doi.org/10.5194/wcd-2-489-2021", "authors": "Joel Lisonbee, Joachim Ribbe", "source": "Weather and Climate Dynamics", "published": "2021-6-11", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["india*", "monsoon"]}, {"key": "doi:10.5194/wcd-5-959-2024", "title": "ClimaMeter: contextualizing extreme weather in a changing climate", "summary": "Climate change is a global challenge with multiple far-reaching consequences, including the intensification and increased frequency of many extreme-weather events. In response to this pressing issue, we present ClimaMeter, a platform designed to assess and contextualize extreme-weather events relative to climate change. The platform offers near-real-time insights into the dynamics of extreme events, serving as a resource for researchers and policymakers while also being a science dissemination tool for the general public. ClimaMeter currently analyses heatwaves, cold spells, heavy precipitation, and windstorms. This paper elucidates the methodology, data sources, and analytical techniques on which ClimaMeter relies, providing a comprehensive overview of its scientific foundation. We further present two case studies: the late 2023 French heatwave and the July 2023 Storm Poly. We use two distinct datasets for each case study, namely Multi-Source Weather (MSWX) data, which serve as the reference for our rapid-attribution protocol, and the ERA5 dataset, widely regarded as the leading global climate reanalysis. These examples highlight both the strengths and limitations of ClimaMeter in expounding the link between climate change and the dynamics of extreme-weather events.", "link": "https://doi.org/10.5194/wcd-5-959-2024", "authors": "Davide Faranda, Gabriele Messori, Erika Coppola, Tommaso Alberti, Mathieu Vrac, Flavio Pons", "source": "Weather and Climate Dynamics", "published": "2024-7-24", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.5194/wcd-3-811-2022", "title": "Decline in Etesian winds after large volcanic eruptions in the last millennium", "summary": "The northerly Etesian winds are a stable summertime circulation system in the eastern Mediterranean, emerging from a steep pressure gradient between the central Europe and Balkans high-pressure and the Anatolian low-pressure systems. Etesian winds are influenced by the variability in the Indian summer monsoon (ISM), but their sensitivity to external forcing on interannual and longer timescales is not well understood. Here, for the first time, we investigate the sensitivity of Etesian winds to large volcanic eruptions in a set of model simulations over the last millennium and reanalysis of the 20th century. We provide model evidence for significant volcanic signatures, manifested as a robust reduction in the wind speed and the total number of days with Etesian winds in July and August. These are robust responses to all strong eruptions in the last millennium, and in the extreme case of Samalas, the ensemble-mean response suggests a post-eruption summer without Etesians. The significant decline in the number of days with Etesian winds is attributed to the weakening of the ISM in the post-eruption summers, which is associated with a reduced large-scale subsidence and weakened surface pressure gradients in the eastern Mediterranean. Our analysis identifies a stronger sensitivity of Etesian winds to the Northern Hemisphere volcanic forcing, particularly for volcanoes before the 20th century, while for the latest large eruption of Pinatubo modelled and observed responses are insignificant. These findings could improve seasonal predictions of the wind circulation in the eastern Me", "link": "https://doi.org/10.5194/wcd-3-811-2022", "authors": "Stergios Misios, Ioannis Logothetis, Mads F. Knudsen, Christoffer Karoff, Vassilis Amiridis, Kleareti Tourpali", "source": "Weather and Climate Dynamics", "published": "2022-7-29", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india*", "monsoon", "extreme*"]}, {"key": "doi:10.5194/wcd-3-337-2022", "title": "Future changes in the extratropical storm tracks and cyclone intensity, wind speed, and structure", "summary": "Future changes in extratropical cyclones and the associated storm tracks are uncertain. Using the new CMIP6 models, we investigate changes to seasonal mean storm tracks and composite wind speeds at different levels of the troposphere for the winter and summer seasons in both the Northern Hemisphere (NH) and Southern Hemisphere (SH). Changes are assessed across four different climate scenarios. The seasonal mean storm tracks are predicted to shift polewards in the SH and also in the North Pacific, with an extension into Europe for the North Atlantic storm track. Overall, the number of cyclones will decrease by ∼5 % by the end of the 21st century, although the number of extreme cyclones will increase by 4 % in NH winter. Cyclone wind speeds are projected to strengthen throughout the troposphere in the winter seasons and also summer in the SH, with a weakening projected in NH summer, although there are minimal changes in the maximum wind speed in the lower troposphere. Changes in wind speeds are concentrated in the warm sector of cyclones, and the area of extreme winds may be up to 40 % larger by the end of the century. The largest changes are seen for the SSP5-85 scenario, although a large amount of change can be mitigated by restricting warming to that seen in the SSP1-26 and 2-45 scenarios. Extreme cyclones show larger increases in wind speed and peak vorticity than the average-strength cyclones, with the extreme cyclones showing a larger increase in wind speed in the warm sector.", "link": "https://doi.org/10.5194/wcd-3-337-2022", "authors": "Matthew D. K. Priestley, Jennifer L. Catto", "source": "Weather and Climate Dynamics", "published": "2022-3-31", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "extreme*"]}, {"key": "doi:10.5194/wcd-7-2087-2026", "title": "Climate change effects on analogues of contrasting extratropical cyclones over the UK, Ireland and France", "summary": "Extreme extratropical cyclones present major socio-economic risks in the mid-latitudes and are sensitive to anthropogenic climate change. Robust projections of the aggregate properties of extreme cyclones based on climate-model output have emerged in recent years. However, such projections group together cyclones with a range of contrasting dynamical characteristics potentially obscuring climate change effects on particular types of cyclones. Here, we adopt the cyclone track analogue approach to examine the influence of climate change on four contrasting historical cyclones impacting the UK, Ireland and France: the Great Storm in October 1987, Martin in December 1999, Ophelia in October 2017, and Arwen in November 2021. Analogues are identified in the recently-produced CANARI large ensemble simulations for both the present climate (1980–2010) and a high-emission future scenario (SSP3–7.0, 2070–2100). Averaged across the four cases, the overall number of analogue cyclones decreases in future while the intensity of the most extreme cyclones increase, in both precipitation rate and lower-tropospheric wind speed, aligning well with consensus cyclone projections. However, the four cases exhibit contrasting responses, indicating that cyclone-specific changes under anthropogenic warming can diverge from the aggregate signal. For example, there is a marked future increase in the number of cyclones with a path similar to the Great Storm. Such changes are likely driven by regional variations in the conditions for baroclinic growth. Since individual cyclones are typically associated w", "link": "https://doi.org/10.5194/wcd-7-2087-2026", "authors": "Farrell Morgan, Ben Harvey, Kevin Hodges, Oscar Martínez-Alvarado", "source": "Weather and Climate Dynamics", "published": "2026-10-29", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.5194/wcd-7-65-2026", "title": "Storm Boris (2024) in the current and future climate: a dynamics-centered contextualization, and some lessons learnt", "summary": "The response of mean and extreme precipitation to anthropogenic global warming stems both from warming of the troposphere and dynamical changes in the large-scale circulation, especially upward motions. The interaction between these two components complicates future projections and makes the attribution of extreme precipitation events challenging, both using conditional (e.g., analog-based) and unconditional (e.g., extreme value theory-based) methods. In this study we reflect upon this problem and propose some possible solutions to tackle it starting from the case study of Storm Boris, that led to major floods over central Europe in mid-September 2024. The first step is the identification of key circulation features associated with the event, whose representation is deemed crucial to obtain realistic analogs: the presence of a slow-moving, upper-level potential vorticity (PV) cutoff, the peculiar track of the surface cyclone associated with Boris, and the presence of anomalously strong forcing for ascent. Circulation analogs of Boris are then identified in a large ensemble of present-day and future-climate simulations with the CESM1 model, to understand how “Boris-like” storms will change in an end-of-the-century high warming scenario. We find that the combined use of upper-level PV and of a surface cyclone identification algorithm substantially improves the quality of the analogs, both in terms of the large-scale flow pattern and the precipitation associated with the cyclone. Analogs of Boris restricted to the same season in a warmer climate feature on average less precipi", "link": "https://doi.org/10.5194/wcd-7-65-2026", "authors": "Jacopo Riboldi, Robin Noyelle, Ellina Agayar, Hanin Binder, Marc Federer, Katharina Hartmuth", "source": "Weather and Climate Dynamics", "published": "2026-1-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.5194/wcd-2-129-2021", "title": "A global climatological perspective on the importance of Rossby wave breaking and intense moisture transport for extreme precipitation events", "summary": "Extreme precipitation events (EPEs) frequently cause flooding with dramatic socioeconomic impacts in many parts of the world. Previous studies considered two synoptic-scale processes, Rossby wave breaking and intense moisture transport, typically in isolation, and their linkage to such EPEs in several regions. This study presents for the first time a global and systematic climatological analysis of these two synoptic-scale processes, in tandem and in isolation, for the occurrence of EPEs. To this end, we use 40-year ERA-Interim reanalysis data (1979–2018) and apply object-based identification methods for (i) daily EPEs, (ii) stratospheric potential vorticity (PV) streamers as indicators of Rossby wave breaking, and (iii) structures of high vertically integrated horizontal water vapour transport (IVT). First, the importance of these two synoptic-scale processes is demonstrated by case studies of previously documented flood events that inflicted catastrophic impacts in different parts of the world. Next, a climatological quantification shows that Rossby wave breaking is associated with > 90 % of EPEs over central North America and the Mediterranean, whereas intense moisture transport is linked to > 95 % of EPEs over many coastal zones, consistent with findings of atmospheric river-related studies. Combined Rossby wave breaking and intense moisture transport contributes up to 70 % of EPEs in several subtropical and extratropical regions, including (semi)arid desert regions where tropical–extratropical interactions are of key importance for (heavy) rainfall. Odds ratios of EPEs", "link": "https://doi.org/10.5194/wcd-2-129-2021", "authors": "Andries Jan de Vries", "source": "Weather and Climate Dynamics", "published": "2021-3-9", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1007/s00382-026-08457-w", "title": "European winter climate storylines based on changes in the North Atlantic jet stream’s eastward extension", "summary": "Model projections of future European winter climate vary substantially due to the spread of atmospheric circulation changes. The uncertainty may be assessed with storylines, plausible physically self-consistent descriptions of future climate. Storylines are commonly formed by regression from remote drivers of circulation changes or from optimized circulation change metrics. In this study, we instead form storylines based on North Atlantic jet stream changes that have a direct physical connection to the European-wide climate. We present a clustering-based method for forming circulation storylines that accounts for all changes in the zonal wind field without pre-selected metrics, and compare it to a method based on regression with jet change metrics. The most important features of jet stream changes that emerge from the cluster analysis are the intensification and poleward shift of the jet extension over Europe. These are not strongly connected to jet changes over the North Atlantic. A substantial part of the climate projection uncertainty may be captured by storylines formed around weak and strong jet extension changes. Additionally, the storylines may be used to investigate connections between future changes in different parts of Europe. The storyline with a shifting and strongly intensifying jet extension projects the strongest wetting in northern Europe and strongest drying in Iberia, while western Europe experiences most wetting if the extension intensifies but does not shift. As storylines simultaneously represent future changes in precipitation, solar radiation and nea", "link": "https://doi.org/10.1007/s00382-026-08457-w", "authors": "Juho Koskentausta, Alexey Yu. Karpechko, Victoria A. Sinclair", "source": "Climate Dynamics", "published": "2026-11-20", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "uncertainty"]}, {"key": "doi:10.1007/s00382-017-3963-8", "title": "Seasonal prediction of South Asian monsoon in CFSv2", "summary": "", "link": "https://doi.org/10.1007/s00382-017-3963-8", "authors": "V. Krishnamurthy", "source": "Climate Dynamics", "published": "2017-10-24", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["monsoon"]}, {"key": "doi:10.1007/s00382-017-3841-4", "title": "Evaluation of NMME temperature and precipitation bias and forecast skill for South Asia", "summary": "", "link": "https://doi.org/10.1007/s00382-017-3841-4", "authors": "Benjamin A. Cash, Julia V. Manganello, James L. Kinter", "source": "Climate Dynamics", "published": "2017-8-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"]}, {"key": "doi:10.1007/s00382-021-06105-z", "title": "Future urban heat island influence on precipitation", "summary": "Urbanization and global warming are two of the major human impacts on the environment. The Urban Heat Island (UHI) effect can change precipitation patterns. Global warming also leads to changes in precipitation and especially an increase in intensity and frequency of extreme precipitation. With urbanization expected to grow in the future, the role of UHI in a warmer climate is an important research question. We present results from 20-year long regional convection-permitting model simulations that include the UHI effect, run for historical and future climates for two megacities, Paris and Shanghai. In the warmer future climate, urban-induced precipitation is found to decrease compared to the historical climate, for both mean and extreme precipitation, with large uncertainties due to natural variability. The mean precipitation increase due to UHI in Paris is 2.2± 1.4% and 1.8 ± 1.3% for historical and future conditions, respectively. Shanghai has slightly weaker mean precipitation change than Paris at present and no change in the future. The future reduction of the urban effect is found to be caused by a decrease in summer precipitation for both cities. Interannual variability in precipitation due to UHI is larger for Shanghai than Paris. The UHI effect on extreme precipitation is also reduced in the future climate and the area with precipitation increase is more concentrated. The general increase in extreme precipitation due to global warming, in combination with the precipitation redistribution due to UHI, underline the importance for future urban planning to mitigate dama", "link": "https://doi.org/10.1007/s00382-021-06105-z", "authors": "B. M. Steensen, L. Marelle, Ø. Hodnebrog, G. Myhre", "source": "Climate Dynamics", "published": "2022-1-23", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Downscaling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1007/s00382-020-05234-1", "title": "Storyline description of Southern Hemisphere midlatitude circulation and precipitation response to greenhouse gas forcing", "summary": "As evidence of climate change strengthens, knowledge of its regional implications becomes an urgent need for decision making. Current understanding of regional precipitation changes is substantially limited by our understanding of the atmospheric circulation response to climate change, which to a high degree remains uncertain. This uncertainty is reflected in the wide spread in atmospheric circulation changes projected in multimodel ensembles, which cannot be directly interpreted in a probabilistic sense. The uncertainty can instead be represented by studying a discrete set of physically plausible storylines of atmospheric circulation changes. By mining CMIP5 model output, here we take this broader perspective and develop storylines for Southern Hemisphere (SH) midlatitude circulation changes, conditioned on the degree of global-mean warming, based on the climate responses of two remote drivers: the enhanced warming of the tropical upper troposphere and the strengthening of the stratospheric polar vortex. For the three continental domains in the SH, we analyse the precipitation changes under each storyline. To allow comparison with previous studies, we also link both circulation and precipitation changes with those of the Southern Annular Mode. Our results show that the response to tropical warming leads to a strengthening of the midlatitude westerly winds, whilst the response to a delayed breakdown (for DJF) or strengthening (for JJA) of the stratospheric vortex leads to a poleward shift of the westerly winds and the storm tracks. However, the circulation response is not z", "link": "https://doi.org/10.1007/s00382-020-05234-1", "authors": "Julia Mindlin, Theodore G. Shepherd, Carolina S. Vera, Marisol Osman, Giuseppe Zappa, Robert W. Lee", "source": "Climate Dynamics", "published": "2020-5", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "uncertainty"]}, {"key": "doi:10.1175/mwr-d-20-0102.1", "title": "On the Consequences of PBL Scheme Diffusion on UTLS Wave and Turbulence Representation in High-Resolution NWP Models", "summary": "Mesoscale numerical weather prediction (NWP) models are routinely exercised at kilometer-scale horizontal grid spacings (Δ x ). Such fine grids will usually allow at least partial resolution of small-scale gravity waves and turbulence in the upper troposphere and lower stratosphere (UTLS). However, planetary boundary layer (PBL) parameterization schemes used with these NWP model simulations typically apply explicit subgrid-scale vertical diffusion throughout the entire vertical extent of the domain, an effect that cannot be ignored. By way of an example case of observed widespread turbulence over the U.S. Great Plains, we demonstrate that the PBL scheme’s mixing in NWP model simulations of Δ x = 1 km can have significant effects on the onset and characteristics of the modeled UTLS gravity waves. Qualitatively, PBL scheme diffusion is found to affect not only background conditions responsible for UTLS wave activity, but also to control the local vertical mixing that triggers or hinders the onset and propagation of these waves. Comparisons are made to a reference large-eddy simulation with Δ x = 250 m to statistically quantify these effects. A significant and systematic overestimation of resolved vertical velocities, wave-scale fluxes, and kinetic energy is uncovered in the 1-km simulations, both in clear-air and in-cloud conditions. These findings are especially relevant for upper-level gravity wave and turbulence simulations using high-resolution kilometer-scale NWP models.", "link": "https://doi.org/10.1175/mwr-d-20-0102.1", "authors": "Domingo Muñoz-Esparza, Robert D. Sharman, Stanley B. Trier", "source": "Monthly Weather Review", "published": "2020-10-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": []}, {"key": "doi:10.1175/mwr-d-11-00121.1", "title": "Stratocumulus Clouds", "summary": "This paper reviews the current knowledge of the climatological, structural, and organizational aspects of stratocumulus clouds and the physical processes controlling them. More of Earth’s surface is covered by stratocumulus clouds than by any other cloud type making them extremely important for Earth’s energy balance, primarily through their reflection of solar radiation. They are generally thin clouds, typically occupying the upper few hundred meters of the planetary boundary layer (PBL), and they preferably occur in shallow PBLs that are readily coupled by turbulent mixing to the surface moisture supply. Thus, stratocumuli favor conditions of strong lower-tropospheric stability, large-scale subsidence, and a ready supply of surface moisture; therefore, they are common over the cooler regions of subtropical and midlatitude oceans where their coverage can exceed 50% in the annual mean. Convective instability in stratocumulus clouds is driven primarily by the emission of thermal infrared radiation from near the cloud tops and the resulting turbulence circulations are enhanced by latent heating in updrafts and cooling in downdrafts. Turbulent eddies and evaporative cooling drives entrainment at the top of the stratocumulus-topped boundary layer (STBL), which is stronger than it would be in the absence of cloud, and this tends to result in a deepening of the STBL over time. Many stratocumulus clouds produce some drizzle through the collision–coalescence process, but thicker clouds drizzle more readily, which can lead to changes in the dynamics of the STBL that favor increased ", "link": "https://doi.org/10.1175/mwr-d-11-00121.1", "authors": "Robert Wood", "source": "Monthly Weather Review", "published": "2012-8-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*", "uncertainty"]}, {"key": "doi:10.1175/mwr-d-13-00168.1", "title": "Climatological Characteristics of Atmospheric Rivers and Their Inland Penetration over the Western United States", "summary": "Narrow corridors of water vapor transport known as atmospheric rivers (ARs) contribute to extreme precipitation and flooding along the West Coast of the United States, but knowledge of their influence over the interior is limited. Here, the authors use Interim European Centre for Medium-Range Weather Forecasts (ECMWF) Re-Analysis (ERA-Interim) data, Climate Prediction Center (CPC) precipitation analyses, and Snowpack Telemetry (SNOTEL) observations to describe the characteristics of cool-season (November–April) ARs over the western United States. It is shown that AR frequency and duration exhibit a maximum along the Oregon–Washington coast, a strong transition zone upwind (west) of and over the Cascade–Sierra ranges, and a broad minimum that extends from the “high” Sierra south of Lake Tahoe eastward across the central Great Basin and into the deep interior. East of the Cascade–Sierra ranges, AR frequency and duration are largest over the interior northwest, while AR duration is large compared to AR frequency over the interior southwest. The fractions of cool-season precipitation and top-decile 24-h precipitation events attributable to ARs are largest over and west of the Cascade–Sierra ranges. Farther east, these fractions are largest over the northwest and southwest interior, with distinctly different large-scale patterns and AR orientations enabling AR penetration into each of these regions. In contrast, AR-related precipitation over the Great Basin east of the high Sierra is rare. These results indicate that water vapor depletion over major topographic barriers is a key", "link": "https://doi.org/10.1175/mwr-d-13-00168.1", "authors": "Jonathan J. Rutz, W. James Steenburgh, F. Martin Ralph", "source": "Monthly Weather Review", "published": "2014-1-24", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1175/mwr-d-16-0255.1", "title": "Near-Surface Thermodynamic Sensitivities in Simulated Extreme-Rain-Producing Mesoscale Convective Systems", "summary": "This study investigates the influences of low-level atmospheric water vapor on the precipitation produced by simulated warm-season midlatitude mesoscale convective systems (MCSs). In a series of semi-idealized numerical model experiments using initial conditions gleaned from composite environments from observed cases, small increases in moisture were applied to the model initial conditions over a layer either 600 m or 1 km deep. The precipitation produced by the MCS increased with larger moisture perturbations as expected, but the rainfall changes were disproportionate to the magnitude of the moisture perturbations. The experiment with the largest perturbation had a water vapor mixing ratio increase of approximately 2 g kg−1 over the lowest 1 km, corresponding to a 3.4% increase in vertically integrated water vapor, and the area-integrated MCS precipitation in this experiment increased by nearly 60% over the control. The locations of the heaviest rainfall also changed in response to differences in the strength and depth of the convectively generated cold pool. The MCSs in environments with larger initial moisture perturbations developed stronger cold pools, and the convection remained close to the outflow boundary, whereas the convective line was displaced farther behind the outflow boundary in the control and the simulations with smaller moisture perturbations. The high sensitivity of both the amount and location of MCS rainfall to small changes in low-level moisture demonstrates how small moisture errors in numerical weather prediction models may lead to large errors in t", "link": "https://doi.org/10.1175/mwr-d-16-0255.1", "authors": "Russ S. Schumacher, John M. Peters", "source": "Monthly Weather Review", "published": "2017-5-11", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1175/waf-d-10-05020.1", "title": "The Impacts of Taiwan Topography on the Predictability of Typhoon Morakot’s Record-Breaking Rainfall: A High-Resolution Ensemble Simulation", "summary": "In this study, the impacts of Taiwan topography on the extreme rainfall of Typhoon Morakot and the predictability of this rainfall are examined with a high-resolution (4 km) ensemble simulation using the Advanced Research core of the Weather Research and Forecasting Model (WRF-ARW). Ensemble prediction with realistic topography reproduces salient features of orographic precipitation. The 24- and 96-h accumulated rainfall amount and distribution from the ensemble mean compare reasonably well with the observed precipitation. When the terrain of Taiwan is removed, the rainfall distribution is markedly changed, suggesting the importance of the orography in determining the rainfall structure. Moreover, the peak 96-h rainfall amount is reduced to less than 20%, and the total rainfall amount over southern Taiwan is reduced to less than 60% of the experiments with Taiwan topography. Further analysis indicates that Taiwan’s topography substantially increases the variability of rainfall prediction. Analysis uncertainties as reflected in the perturbed initial state of the ensemble are amplified due to orographic influences on the typhoon circulation. As a result, significant variability occurs in the storm track, timing, and location of landfall, an
