hin the US in the past few decades. Understanding the physics leading to long‐term trends in regional extreme precipitation is essential but the progress is limited partially by the horizontal resolution of climate models. The latest fully coupled 25‐km GFDL (Geophysical Fluid Dynamics Laboratory) SPEAR ( S eamless system for P rediction and EA rth system R esearch) simulations provide a good opportunity to study changes in regional extreme precipitation and the relevant physical processes. Here, we focus on the contributions of changes in synoptic‐scale events, including atmospheric rivers (AR) and tropical cyclone (TC)‐related events, to the trend of extreme precipitation in the fall season over the Northeast US in both the recent past and future projections using the 25‐km GFDL‐SPEAR. In observations, increasing extreme precipitation over the NEUS since the 1990s is mainly linked to TC‐related events, especially those undergoing extratropical transitions. In the future, both AR‐related and TC‐related extreme precipitation over the NEUS are projected to increase, even though the numbers of TCs in the North Atlantic are projected to decrease in the SPEAR simulations using the SSP5‐8.5 projection of future radiative forcing. Factors such as enhancing TC intensity, strengthening TC‐related precipitation, and/or westward shift in Atlantic TC tracks may offset the influence of declining Atlantic TC numbers in the model projections, leading to more frequent ", "link": "https://doi.org/10.1029/2023ef004370", "authors": "Bor‐Ting Jong, Hiroyuki Murakami, Thomas L. Delworth, William F. Cooke", "source": "Earth's Future", "published": "2024-4", "first_seen": "2026-11-23T21:25:47+00:00", "score": 49, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-022-06257-6", "title": "Effects of grid spacing on high-frequency precipitation variance in coupled high-resolution global ocean–atmosphere models", "summary": "Abstract High-frequency precipitation variance is calculated in 12 different free-running (non-data-assimilative) coupled high resolution atmosphere–ocean model simulations, an assimilative coupled atmosphere–ocean weather forecast model, and an assimilative reanalysis. The results are compared with results from satellite estimates of precipitation and rain gauge observations. An analysis of irregular sub-daily fluctuations, which was applied by Covey et al. (Geophys Res Lett 45:12514–12522, 2018. https://doi.org/10.1029/2018GL078926 ) to satellite products and low-resolution climate models, is applied here to rain gauges and higher-resolution models. In contrast to lower-resolution climate simulations, which Covey et al. (2018) found to be lacking with respect to variance in irregular sub-daily fluctuations, the highest-resolution simulations examined here display an irregular sub-daily fluctuation variance that lies closer to that found in satellite products. Most of the simulations used here cannot be analyzed via the Covey et al. (2018) technique, because they do not output precipitation at sub-daily intervals. Thus the remainder of the paper focuses on frequency power spectral density of precipitation and on cumulative distribution functions over time scales (2–100 days) that are still relatively “high-frequency” in the context of climate modeling. Refined atmospheric or oceanic model grid spacing is generally found to increase high-frequency precipitation variance in simulations, approaching the values derived from observations. Mesoscale-eddy-rich ocean simulations s", "link": "https://doi.org/10.1007/s00382-022-06257-6", "authors": "Charles X. Light, Brian K. Arbic, Paige E. Martin, Laurent Brodeau, J. Thomas Farrar, Stephen M. Griffies", "source": "Climate Dynamics", "published": "2022-3-29", "first_seen": "2026-11-23T21:25:47+00:00", "score": 49, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023jd039772", "title": "Challenges in Simulating Prevailing Fog Types Over Urban Region of Delhi", "summary": "Accurately predicting fog is challenging due to interplay of myriad processes in its formation and high spatiotemporal variability. This study compares the performance of the Weather Research and Forecasting model with control (CNTL‐WRF) and assimilated fine‐grid (HRLDAS‐WRF) soil fields in the Ingo‐Gangetic Plain (IGP) over a 2‐years winter period (2019–2020 and 2020–2021). Results show HRLDAS‐WRF enhances accuracy in representing surface fog's heterogeneity and lifecycle across the IGP, demonstrating a spatial skill improvement of approximately 18% with a Fraction Skill Score of 0.44, compared to CNTL‐WRF's (0.36). Employing fog classification algorithm identifies 25 dense fog episodes (Vis < 500 m) over Delhi's urban boundary layer, including 14 radiation (RAD), 5 cloud‐base lowering (CBL), 3 advection + radiation (ADV + RAD), and 3 evaporation (EVA) episodes. CNTL‐WRF predicts 20 episodes but misses five due to a dry bias in the initial moisture conditions. However, HRLDAS‐WRF demonstrates limited vertical fog growth in various occurrences, highlighting the crucial role of fine‐gridded soil states for enhanced land‐surface feedback. Detailed analysis shows a 40% reduction in mean onset error for RAD fog occurrences in HRLDAS‐WRF when compared to CNTL‐WRF. In CBL fog episodes, both models exhibit significant radiative cooling and inversion before fog onset, leading to inaccurate predictions as RAD fog. Similarly, forecasting the abrupt development of ADV + RAD fog episodes is challenging as models struggle to replicate moisture intrusion over radiatively cooled surfaces ", "link": "https://doi.org/10.1029/2023jd039772", "authors": "Avinash N. Parde, Sachin D. Ghude, Narendra Gokul Dhangar, Utkarsh Prakash Bhautmage, Sandeep Wagh, Prasanna Lonkar, Gaurav Govardhan, Rakesh Kumar", "source": "JGR: Atmospheres", "published": "2024-4-2", "first_seen": "2026-11-23T21:44:54+00:00", "score": 49, "topics": ["Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.21521", "title": "Run it Back: Autoregression vs. Video Diffusion for Final-Conditioned Weather Trajectories", "summary": "Low-likelihood, high-impact extremes are projected to increase in severity and frequency in a warming climate. Sampling the precursors that lead to these events traditionally requires massive ensembles that scale poorly with lead time and rarity, and typical rare-event sampling and ensemble-boosting methods do not show how a single extreme might arise from diverse synoptic precursors. Recently, Lin et al.\\ (2026) showed this is possible with final-conditioned 66-hour trajectories (trajectories constrained to end at an observed state) from cBottle-video, a pre-trained, off-the-shelf video diffusion climate emulator not explicitly fine-tuned for this task (Brenowitz et al., 2025). However, its ensembles were underdispersed and geostrophically inconsistent, and it reproduces conditioned frames only approximately, hindering autoregressive rollout. Here, we train Rewind-AR, a backward-in-time probabilistic autoregressive model with a FourCastNet~3 backbone (Bonev et al., 2025), and generate final-conditioned ensembles for the same three cases: the 2021 Pacific Northwest heatwave, Hurricane Ian, and Superstorm Sandy (in the Supplementary Information). The leading modes of Rewind-AR's antecedent 500 hPa geopotential height explain far more of the across-member variance than cBottle-video's for both hurricane position and heatwave surface temperature, and Rewind-AR better reproduces the day-over-day heatwave intensification observed in ERA5. Finally, geostrophic inconsistencies close to the conditioning frame seen in cBottle-video are not reproduced by Rewind-AR. Nevertheless, up t", "link": "https://arxiv.org/abs/2611.21521", "authors": "Jerry Lin, Elizabeth A. Barnes", "source": "arXiv", "published": "2026-11-16T18:13:42Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 48, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme", "emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-10-359-2017", "title": "The Cloud Feedback Model Intercomparison Project (CFMIP) contribution to CMIP6", "summary": "The primary objective of CFMIP is to inform future assessments of cloud feedbacks through improved understanding of cloud–climate feedback mechanisms and better evaluation of cloud processes and cloud feedbacks in climate models. However, the CFMIP approach is also increasingly being used to understand other aspects of climate change, and so a second objective has now been introduced, to improve understanding of circulation, regional-scale precipitation, and non-linear changes. CFMIP is supporting ongoing model inter-comparison activities by coordinating a hierarchy of targeted experiments for CMIP6, along with a set of cloud-related output diagnostics. CFMIP contributes primarily to addressing the CMIP6 questions How does the Earth system respond to forcing? and What are the origins and consequences of systematic model biases? and supports the activities of the WCRP Grand Challenge on Clouds, Circulation and Climate Sensitivity.A compact set of Tier 1 experiments is proposed for CMIP6 to address this question: (1) what are the physical mechanisms underlying the range of cloud feedbacks and cloud adjustments predicted by climate models, and which models have the most credible cloud feedbacks? Additional Tier 2 experiments are proposed to address the following questions. (2) Are cloud feedbacks consistent for climate cooling and warming, and if not, why? (3) How do cloud-radiative effects impact the structure, the strength and the variability of the general atmospheric circulation in present and future climates? (4) How do responses in the climate system due to changes in so", "link": "https://doi.org/10.5194/gmd-10-359-2017", "authors": "Mark J. Webb, Timothy Andrews, Alejandro Bodas-Salcedo, Sandrine Bony, Christopher S. Bretherton, Robin Chadwick", "source": "Geoscientific Model Development", "published": "2017-1-25", "first_seen": "2026-11-23T21:25:47+00:00", "score": 48, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2018jd030082", "title": "Unraveling the Mystery of Indian Summer Monsoon Prediction: Improved Estimate of Predictability Limit", "summary": "Abstract Large socioeconomic impact of the Indian summer monsoon (ISM) extremes motivated numerous attempts at its long range prediction over the past century. However, a rather low potential predictability (PP) of the seasonal ISM, contributed significantly by “internal,” interannual variability was considered insurmountable. Here we show that the internal variability contributed by the ISM subseasonal (synoptic + intraseasonal) fluctuations, so far considered chaotic, is partly predictable as found to be tied to slowly varying forcing (e.g., El Niño and Southern Oscillation). This provides a scientific basis for predictability of the ISM rainfall beyond the conventional estimates of PP. We establish a much higher actual limit of PP ( r ∼0.82) through an extensive reforecast experiment (1,920 years of simulation) by improving two major physics in a global coupled climate model, which raises a hope for a very reliable dynamical seasonal ISM forecasting in the near future.", "link": "https://doi.org/10.1029/2018jd030082", "authors": "Subodh Kumar Saha, Anupam Hazra, Samir Pokhrel, Hemantkumar S. Chaudhari, K. Sujith, Archana Rai", "source": "JGR: Atmospheres", "published": "2019-2-19", "first_seen": "2026-11-23T21:25:47+00:00", "score": 48, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["india", "monsoon", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-023-00353-y", "title": "Physics informed deep neural network embedded in a chemical transport model for the Amazon rainforest", "summary": "Abstract Secondary organic aerosols (SOA) are fine particles in the atmosphere, which interact with clouds, radiation and affect the Earth’s energy budget. SOA formation involves chemistry in gas phase, aqueous aerosols, and clouds. Simulating these chemical processes involve solving a stiff set of differential equations, which are computationally expensive steps for three-dimensional chemical transport models. Deep neural networks (DNNs) are universal function approximators that could be used to represent the complex nonlinear changes in aerosol physical and chemical processes; however, key challenges such as generalizability to extended time periods, preservation of mass balance, simulating sparse model outputs, and maintaining physical constraints have limited their use in atmospheric chemistry. Here, we develop an approach of using a physics-informed DNN that overcomes previous such challenges and demonstrates its applicability for the chemical formation processes of isoprene epoxydiol SOA (IEPOX-SOA) over the Amazon rainforest. The DNN is trained with data generated by simulating IEPOX-SOA over the entire atmospheric column, using the Weather Research and Forecasting Model coupled with Chemistry (WRF-Chem). The trained DNN is then embedded within WRF-Chem to replace the computationally expensive default solver of IEPOX-SOA formation. The trained DNN predictions generalizes well with the default model simulation of the IEPOX-SOA mass concentrations and its size distribution (20 size bins) over several days of simulations in both dry and wet seasons. The embedded DNN red", "link": "https://doi.org/10.1038/s41612-023-00353-y", "authors": "Himanshu Sharma, Manish Shrivastava, Balwinder Singh", "source": "npj Climate and Atmospheric Science", "published": "2023-3-31", "first_seen": "2026-11-23T21:25:47+00:00", "score": 48, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-023-00358-7", "title": "The uneven impact of climate change on drought with elevation in the Canary Islands", "summary": "Abstract Climate models project an increase in drought and aridity in many regions in response to greenhouse gas concentrations in the atmosphere. In areas with complex topography, such as the Canary Islands, elevation gradients may play an important role in future changes. Convection-permitting climate simulations driven by data from three global climate models included in the Coupled Model Intercomparison Project (CMIP5) have been performed for the Canary Islands. A significant increase in the duration and severity of drought is projected by the end of the twenty-first century (2070–2099), relative to the recent past (1980–2009), under intermediate and high emissions scenarios. In addition, the percentage of land affected by droughts, on average, would increase considerably, covering up to 96% in the higher elevations, in the business-as-usual scenario. These changes and the increase in aridity are more pronounced at higher altitudes due to a clear dependence of temperature rise as a function of elevation and a substantial decrease in precipitation.", "link": "https://doi.org/10.1038/s41612-023-00358-7", "authors": "Judit Carrillo, Sara Hernández-Barrera, Francisco J. Expósito, Juan P. Díaz, Albano González, Juan C. Pérez", "source": "npj Climate and Atmospheric Science", "published": "2023-4-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 48, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/2008waf2007101.1", "title": "On the Impact of WRF Model Vertical Grid Resolution on Midwest Summer Rainfall Forecasts", "summary": "Abstract Weather Research and Forecast (WRF) model exploratory sensitivity simulations were performed to determine the impact of vertical grid resolution (VGR) on the forecast skill of Midwest summer rainfall. Varying the VGR indicated that a refined VGR, while adopting the widely used North America Regional Reanalysis (NARR) for initial and lateral boundary conditions, does not necessarily result in a consistent improvement in quantitative precipitation forecasts (QPFs). When averaged over a variety of microphysical schemes in an illustrative case, equitable threat score (ETS) and bias values actually worsened with a greater overpredicted rainfall for half of the rainfall thresholds when the VGR was refined. Averaged over strongly forced cases, ETS values worsened for all rainfall thresholds while biases mostly increased, indicating a further overprediction of rainfall when the number of levels was increased. Skill improved, however, for all rainfall thresholds when the resolution above the melting level was increased. Skill also improved for most rainfall thresholds when the resolution in the surface layer was increased, which is attributed to better-resolved surface turbulent momentum and thermal fluxes. Likewise, a refined VGR resulted in improvements in weakly forced cases, which are governed mostly by thermodynamic forcing and are sensitive to vertical profiles of temperature and moisture. Application of the factor separation method suggested that the refined VGR more frequently had a negative impact on skill through the interaction between lower-atmospheric processes", "link": "https://doi.org/10.1175/2008waf2007101.1", "authors": "Eric A. Aligo, William A. Gallus, Moti Segal", "source": "Weather and Forecasting", "published": "2009-4-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 48, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021ef002401", "title": "Urbanization Contributes Little to Global Warming but Substantially Intensifies Local and Regional Land Surface Warming", "summary": "Increasing urbanization causes an urban heat island (UHI) effect and exacerbates health risks of heat waves due to global warming. The surface UHI (SUHI) in large cities has been extensively studied, yet a systematic evaluation on the impacts of urbanization on local‐to global‐scale land surface warming is lacking. We propose a new procedure to quantify the warming effects of urbanization at local, regional, and global scales using high‐resolution satellite observations. We find strong local warming effects for 88% of the urban‐dominated pixels across the globe and cooling effects for the rest of the urban lands on a diurnal mean timescale, with a global urban mean intensity of 1.1°C in 2015. The SUHI effects differ substantially by time of day, season, and climate zone, and are closely related to surface evapotranspiration. By extending local effects to the entire land surface, we estimate a diurnal mean warming of only 0.008°C globally. However, urbanization can have large warming effects regionally, especially in eastern China, the eastern United States, and Europe. In addition, we show that global urban expansion results in over three‐quarters of SUHI effects in 1985–2015, and its effect will likely increase by 50%–200% by the end of this century. The SUHI‐added warming could be up to 0.12°C in summer in Europe by 2100 under a fossil‐fueled development pathway. Our results reveal that urbanization substantially intensifies local and regional land surface warming and that prioritized attention should be given to the SUHI‐added warming in highly or rapidly urbanized regio", "link": "https://doi.org/10.1029/2021ef002401", "authors": "Decheng Zhou, Jingfeng Xiao, Steve Frolking, Liangxia Zhang, Guoyi Zhou", "source": "Earth's Future", "published": "2022-5", "first_seen": "2026-11-23T21:44:54+00:00", "score": 48, "topics": ["Close to your work"], "watch": [], "boosts": [], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021ea002123", "title": "A Method to Improve Land Use Representation for Weather Simulations Based on High‐Resolution Data Sets—Application to Corine Land Cover Data in the WRF Model", "summary": "Land cover (LC) data incorporation, for weather modeling purposes, highlights many problems. The straightforward Single Level Mode (SLM) aggregation is not adapted for high‐resolution LC maps, with a high number of classes, because it could generate false classifications. We propose a Multi‐Level Mode (MLM) aggregation method that includes a hierarchical structure. This study focuses on the Corine Land Cover (CLC) data set. Differences between MLM and SLM methods are small at the finest horizontal resolution and increase to a value of around 16% at 9‐km horizontal resolution. To further integrate CLC data into WRF (Weather Research Forecasting model), we included a dedicated table of physical parameters next to using the classical conversion toward the USGS one. To evaluate the LC impact on the modeled boundary layer, we used WRF at 1 km to simulate a 4‐day period with diurnal cycles of valley winds in the heterogeneous western pre‐Alps area. We tested three LCs (USGS, MODIS, and CLC), where CLC has two physical parameter tables and two aggregation methods. CLC performs better than other tested LCs. The CLC aggregation methods revealed limited differences between the simulated variables, although the MLM method gives better results. Since these comparisons are restricted to a single location with the same LC type, the differences between various simulations regarding atmospheric parameters probably result from horizontal advection from upwind areas where surface conditions differ. Extended time series with multiple locations and diverse meteorological conditions need to be ", "link": "https://doi.org/10.1029/2021ea002123", "authors": "M. de Bode, T. Hedde, P. Roubin, P. Durand", "source": "Earth and Space Science", "published": "2023-2", "first_seen": "2026-11-23T21:44:54+00:00", "score": 48, "topics": ["Close to your work"], "watch": [], "boosts": [], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021ef002487", "title": "Hydrological Intensification Will Increase the Complexity of Water Resource Management", "summary": "Abstract Global warming intensifies the hydrological cycle by altering the rate of water fluxes to and from the terrestrial surface, resulting in an increase in extreme precipitation events and longer dry spells. Prior hydrological intensification work has largely focused on precipitation without joint consideration of evaporative demand changes and how plants respond to these changes. Informed by state‐of‐the‐art climate models, we examine projected changes in hydrological intensification and its role in complicating water resources management using a framework that accounts for precipitation surplus and evaporative demand. Using a metric that combines the difference between daily precipitation and daily evaporative demand (surplus events) and consecutive days when evaporative demand exceeds precipitation (deficit time), we show that, globally, surplus events will become larger (+11.5% and +18.5% for moderate and high emission scenarios, respectively) and the duration between them longer (+5.1%; +9.6%) by the end of the century, with the largest changes in the northern latitudes. The intra‐annual occurrence of these extremes will stress existing water management infrastructure in major river basins, where over one third of years during 2070–2100 under a moderate emissions scenario will be hydrologically intense (large intra‐annual increases in surplus intensity and deficit time), tripling that of the historical baseline. Larger increases in hydrologically intense years are found in basins with large reservoir capacity (e.g., Amazon, Congo, and Danube River Basins), which h", "link": "https://doi.org/10.1029/2021ef002487", "authors": "Darren L. Ficklin, Sarah E. Null, John T. Abatzoglou, Kimberly A. Novick, Daniel T. Myers", "source": "Earth's Future", "published": "2022-3", "first_seen": "2026-11-23T21:25:47+00:00", "score": 47, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/2015jd024651", "title": "New gridded daily climatology of Finland: Permutation‐based uncertainty estimates and temporal trends in climate", "summary": "Abstract Long‐term time series of key climate variables with a relevant spatiotemporal resolution are essential for environmental science. Moreover, such spatially continuous data, based on weather observations, are commonly used in, e.g., downscaling and bias correcting of climate model simulations. Here we conducted a comprehensive spatial interpolation scheme where seven climate variables (daily mean, maximum, and minimum surface air temperatures, daily precipitation sum, relative humidity, sea level air pressure, and snow depth) were interpolated over Finland at the spatial resolution of 10 × 10 km 2 . More precisely, (1) we produced daily gridded time series ( FMI _ ClimGrid ) of the variables covering the period of 1961–2010, with a special focus on evaluation and permutation‐based uncertainty estimates, and (2) we investigated temporal trends in the climate variables based on the gridded data. National climate station observations were supplemented by records from the surrounding countries, and kriging interpolation was applied to account for topography and water bodies. For daily precipitation sum and snow depth, a two‐stage interpolation with a binary classifier was deployed for an accurate delineation of areas with no precipitation or snow. A robust cross‐validation indicated a good agreement between the observed and interpolated values especially for the temperature variables and air pressure, although the effect of seasons was evident. Permutation‐based analysis suggested increased uncertainty toward northern areas, thus identifying regions with suboptimal stati", "link": "https://doi.org/10.1002/2015jd024651", "authors": "Juha Aalto, Pentti Pirinen, Kirsti Jylhä", "source": "JGR: Atmospheres", "published": "2016-4-22", "first_seen": "2026-11-23T21:25:47+00:00", "score": 47, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-023-00468-2", "title": "Increased risk of flash droughts with raised concurrent hot and dry extremes under global warming", "summary": "Abstract Flash droughts pose large threats to crop yields and ecosystem services due to their sudden onset and rapid intensification, arousing wide public concern in a warming climate. Their long-term characteristics of change, underlying mechanisms, and especially potential impacts on agriculture, forests, and populations at a global scale, however, remain largely unknown. We used in situ observations, two observation-based global reanalysis data sets, and 22 Earth system models to determine that flash droughts are shifting toward more frequent, accelerated-onset, and longer duration. These changes increased the exposure of agricultural areas, forested areas, and populations to flash droughts by 20.3%, 17.1%, and 30.0%, respectively, during 2001–2020 compared to 1981–2000, with a disproportionate increase in integrated risks across the Amazon Basin and eastern and southern Asia. The increase in concurrent hot and dry climatic conditions driven by warming has been mostly responsible for enabling and intensifying flash droughts over large regions. State-of-the-art Coupled Model Intercomparison Project Phase 6 (CMIP6) models, however, failed to identify the acceleration of the onset time of flash droughts and widely underestimated the occurrence of flash droughts that are driven only by precipitation deficits or by heat waves, probably because they misrepresent the dependence between precipitation and temperature and underestimate the sensitivity of soil moisture to temperature and precipitation at short timescales (e.g., 5 days). These syntheses comprehensively advance our u", "link": "https://doi.org/10.1038/s41612-023-00468-2", "authors": "Zhaoqi Zeng, Wenxiang Wu, Josep Peñuelas, Yamei Li, Wenzhe Jiao, Zhaolei Li", "source": "npj Climate and Atmospheric Science", "published": "2023-9-7", "first_seen": "2026-11-23T21:25:47+00:00", "score": 47, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-5-959-2024", "title": "ClimaMeter: contextualizing extreme weather in a changing climate", "summary": "Climate change is a global challenge with multiple far-reaching consequences, including the intensification and increased frequency of many extreme-weather events. In response to this pressing issue, we present ClimaMeter, a platform designed to assess and contextualize extreme-weather events relative to climate change. The platform offers near-real-time insights into the dynamics of extreme events, serving as a resource for researchers and policymakers while also being a science dissemination tool for the general public. ClimaMeter currently analyses heatwaves, cold spells, heavy precipitation, and windstorms. This paper elucidates the methodology, data sources, and analytical techniques on which ClimaMeter relies, providing a comprehensive overview of its scientific foundation. We further present two case studies: the late 2023 French heatwave and the July 2023 Storm Poly. We use two distinct datasets for each case study, namely Multi-Source Weather (MSWX) data, which serve as the reference for our rapid-attribution protocol, and the ERA5 dataset, widely regarded as the leading global climate reanalysis. These examples highlight both the strengths and limitations of ClimaMeter in expounding the link between climate change and the dynamics of extreme-weather events.", "link": "https://doi.org/10.5194/wcd-5-959-2024", "authors": "Davide Faranda, Gabriele Messori, Erika Coppola, Tommaso Alberti, Mathieu Vrac, Flavio Pons", "source": "Weather and Climate Dynamics", "published": "2024-7-24", "first_seen": "2026-11-23T21:25:47+00:00", "score": 47, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41558-024-01990-8", "title": "Climate damage projections beyond annual temperature", "summary": "Abstract Estimates of global economic damage from climate change assess the effect of annual temperature changes. However, the roles of precipitation, temperature variability and extreme events are not yet known. Here, by combining projections of climate models with empirical dose–response functions translating shifts in temperature means and variability, rainfall patterns and extreme precipitation into economic damage, we show that at +3 ° C global average losses reach 10% of gross domestic product, with worst effects (up to 17%) in poorer, low-latitude countries. Relative to annual temperature damage, the additional impacts of projecting variability and extremes are smaller and dominated by interannual variability, especially at lower latitudes. However, accounting for variability and extremes when estimating the temperature dose–response function raises global economic losses by nearly two percentage points and exacerbates economic tail risks. These results call for region-specific risk assessments and the integration of other climate variables for a better understanding of climate change impacts.", "link": "https://doi.org/10.1038/s41558-024-01990-8", "authors": "Paul Waidelich, Fulden Batibeniz, James Rising, Jarmo S. Kikstra, Sonia I. Seneviratne", "source": "Nature Climate Change", "published": "2024-4-17", "first_seen": "2026-11-23T21:25:47+00:00", "score": 47, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2026.10068", "title": "Evaluating bias-adjusted climate data for extreme heat metrics in agricultural applications", "summary": "Abstract Bias adjustment is standard preprocessing for climate model output used in crop-impact and damage-assessment work. Most validation studies still emphasize mean temperature, even though agricultural applications often depend on nonlinear heat metrics built from daily extremes. We evaluate how bias adjustment propagates into Extreme Degree Day (EDD) metrics, which crop-yield and damage functions use to summarize heat stress above specified temperature cutoffs. Using ERA5 reanalysis as reference, we compare EDD from raw and bias-adjusted CMIP6 models (GFDL-ESM4, MPI-ESM1-2-HR, and EC-Earth3) across European ADM1 regions for 1994–2014. We compute EDD at seven thresholds (0, 4, 8, 12, 28, 30, and 32 °C), aggregate it with harvested-area weights for seven crops under rainfed and irrigated management, and sum it over crop-specific phenological windows. Bias adjustment reduces mean absolute error at low and moderate thresholds (EDD ≤ $ \\le $ less than or equals 12 °C) by 37–86 °C ⋅ $ \\cdot $ dot days at EDD-0 and 29–64 °C ⋅ $ \\cdot $ dot days at EDD-8. At extreme thresholds (EDD ≥ $ \\ge $ greater than or equals 28 °C), Δ $ \\Delta $ upper Delta Skill is small on average (1–4 °C ⋅ $ \\cdot $ dot days at EDD-28), and bias adjustment increases error in about 40% of evaluated combinations. The split between helpful and unhelpful bias adjustment follows the EDD threshold more closely than model identity, which has implications for impact studies that treat bias-adjusted data as uniformly preferable.", "link": "https://doi.org/10.1017/eds.2026.10068", "authors": "Muhammad Taky Tahmid", "source": "Environmental Data Science", "published": "2026", "first_seen": "2026-1 jection of the interannual variability of Northern Hemisphere land monsoon rainfall (NHLMR) under global warming is vital to effective climate adaptation and disaster mitigation. Based on the performance of 33 models of Coupled Model Intercomparison Project Phase 6 (CMIP6), long‐term (2064–2099) projections of the interannual intensity of NHLMR under various emission scenarios are derived using a subset of physical‐constrained optimal models. Under high‐emission scenario, the leading mode of the interannual NHLMR will retain its nearly uniform spatial pattern but its intensity significantly enhances by 18.8%. While the intensity of tropical Pacific Ocean and its relationship with NHLMR both remain, which neither contribute to the intensified interannual NHLMR, the more frequent wet‐dry swings of NHLMR are primarily driven by the thermodynamic effect associated with the increased mean state moisture in a warming future. The projected insignificant relationship between NHLMR and tropical Atlantic Ocean (TAO) suggests a limited role of TAO in driving NHLMR interannual variability. However, the models' poor performance in simulating the NHLMR‐TAO linkage adds uncertainty for the projections.", "link": "https://doi.org/10.1029/2026jd047939", "authors": "Yeyan Jiang, Shengjie Chen, Ying Yang, Tim Li, Zhiwei Zhu", "source": "JGR: Atmospheres", "published": "2026-11-21", "first_seen": "2026-11-23T21:25:47+00:00", "score": 46, "topics": ["Climate Modelling"], "watch": [], "boosts": ["monsoon", "cmip6", "uncertainty"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.27605", "title": "Adapting AI Weather Foundation Models to a Changing Climate", "summary": "AI weather foundation models learn from historical archives, while the climate distribution encountered during deployment continues to evolve. This growing model--climate mismatch motivates continual adaptation without repeated full-model retraining, but the structure of weather forecast errors determines how such adaptation should be performed. We develop an online adaptation framework that exploits two complementary error structures: geographically persistent biases and flow-dependent errors that vary with the atmospheric state. Analysis of Aurora-1.3B reveals strongly concentrated forecast-loss sensitivity in its decoder, motivating flow-dependent corrections within fixed low-dimensional sensitivity subspaces. A residual memory tracks persistent errors remaining after this correction, while a variable-wise online gate controls the contribution of the persistent component. We evaluate Aurora-1.3B using ERA5 from 1959--1968 for offline initialization and a strictly chronological 1969--2022 stream for online evaluation, with updates restricted to previously available verification targets. For 2-metre temperature, distributional departure from the historical reference, measured directly from ERA5, is associated with larger frozen-model errors and greater adaptation gains, while the adapted model maintains more stable skill across evaluation periods. Across 69 output fields and five lead times from 6 to 72 hours, our method reduces MSE and MAE by 6.90\\% and 6.45\\%, respectively, relative to $δ$-Adapter, the strongest of six online adaptation baselines.", "link": "https://arxiv.org/abs/2611.27605", "authors": "Xinlei Xiong, Wenbo Hu, Shuxun Zhou, Lingxi Xie, Richang Hong, Qi Tian", "source": "arXiv", "published": "2026-11-20T13:36:07Z", "first_seen": "2026-11-23T14:47:49+00:00", "score": 45, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022ms003426", "title": "Systematic Bias Correction in Ocean Mesoscale Forecasting Using Machine Learning", "summary": "Abstract The ocean circulation is modulated by meandering currents and eddies. Forecasting their evolution is a key target of operational models, but their forecast skill remains limited. We propose a machine learning approach that improves the output of an ocean circulation model by learning and predicting its systematic biases. This method can be applied a priori to any region, and is tested in the Gulf of Mexico, where the Loop Current (LC) and the large anticyclonic eddies that detach from it are major forecasting targets. The LC dynamics are recurrent and lie on a low‐dimensional dynamical attractor. Building upon the information gained analyzing this low dimensional attractor, we improve the representation of sea surface anomalies in model outputs through information from satellite altimeter data using a Sequence‐to‐Sequence model, which is a special class of Recurrent Neural Network. Building upon the HYCOM‐NCODA analysis system, we deliver a correction to the forecast at the observation resolution. For at least 15 days the proposed method learns to forecast the systematic bias in the HYCOM‐NCODA, outperforming persistence, and improving the forecast. This data‐driven approach is fast and can be implemented as an added step to any dynamical hindcasting or forecasting model. It offers an interesting avenue for further developing hybrid modeling tools. In these tools, fundamental physical conservations are preserved through the integration of partial differential equations which obey them. In addition, the method highlights specific deficiencies of the hindcast system ", "link": "https://doi.org/10.1029/2022ms003426", "authors": "Guangpeng Liu, Annalisa Bracco, Julien Brajard", "source": "Journal of Advances in Modeling Earth Systems", "published": "2023-11", "first_seen": "2026-11-23T14:47:49+00:00", "score": 45, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.19978", "title": "GPROF V08: Improving Satellite Precipitation Estimates Across a Heterogeneous Constellation of Passive-Microwave Sensors", "summary": "Precipitation estimates from the passive microwave observations (PMW) of the Global Precipitation Measurement (GPM) mission serve a wide range of scientific, societal, and economic applications. The Goddard Profiling Algorithm (GPROF) is the operational precipitation retrieval used to produce the level-two precipitation estimates for the GPM mission. This study presents GPROF V08 - the most recent version of GPROF and a major update aimed at improving the accuracy of precipitation estimates from the GPM constellation. GPROF V08 replaces the single-pixel Bayesian retrieval scheme used by earlier GPROF versions with a convolutional neural network (CNN). Implementing the algorithm for the full GPM constellation required addressing several challenges such as the generation of synthetic observations suitable for training CNN retrievals, which has been described in the first part of this two-part study. This second part describes the final, operational implementation of GPROF V08, which adds a finetuning stage to the training to overcome remaining uncertainties in the synthetic training data. We extensively validate the new GPROF V08 algorithm for principal GPM sensors against reference precipitation estimates from combined radar and radiometer retrievals from GPM and TRMM as well as independent ground-based reference measurements. While the magnitude of improvements varies by sensor and surface type, the retrieval accuracy for all assessed sensors is improved. Although challenges such as the persistence of climatological biases (which remain of the same order as for GPROF V07) p", "link": "https://arxiv.org/abs/2611.19978", "authors": "Simon Pfreundschuh, Paula J. Brown, Christian D. Kummerow", "source": "arXiv", "published": "2026-11-15T12:41:31Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 45, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024ms004930", "title": "Radiative, Hydrologic, and Circulation Responses to Warming in Cess‐Potter Simulations Using the Global 3.25‐km SCREAM", "summary": "Abstract Using the global 3.25‐km Simple Cloud Resolving E3SM Atmosphere Model (SCREAM 3 km), a pair of 13‐month Cess‐Potter simulations are performed to quantify the radiative feedbacks and the hydrologic and circulation responses to warming. Large‐scale aspects of SCREAM 3 km's top‐of‐atmosphere radiative fluxes, precipitation rates, and circulations are in good agreement with observations and reanalysis, with notable differences, including a drier lower free‐troposphere in the Tropics, reduced precipitation and humidity over the Tropical West Pacific, and poleward shifted Southern Hemisphere midlatitude jet. In response to warming, SCREAM 3 km predicts a total radiative feedback within the top 15% of the CMIP5 and CMIP6 models, which puts it substantially higher than the feedback reported by other kilometer‐scale models. SCREAM 3 km's high radiative feedback stems from a strongly positive shortwave cloud feedback, most prominent over the mid‐ and high‐latitudes. SCREAM 3 km's high precipitation response also puts it among the highest of CMIP models, whereas its circulation response is within the spread of CMIP models. An ensemble of five perturbed initial condition Cess‐Potter simulations with a 12 km version of SCREAM (SCREAM 12 km) is performed to characterize uncertainty and resolution sensitivity. It suggests that the uncertainty from analyzing a pair of 1‐year simulations is small compared to the inter‐model spread in feedbacks and precipitation response. SCREAM 12 km also produces a strong precipitation response to warming but a much lower cloud feedback and total ", "link": "https://doi.org/10.1029/2024ms004930", "authors": "C. R. Terai, N. D. Keen, P. M. Caldwell, H. Beydoun, P. A. Bogenschutz, L.‐W. Chao", "source": "Journal of Advances in Modeling Earth Systems", "published": "2025-10", "first_seen": "2026-11-23T21:25:47+00:00", "score": 45, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-13-00136.1", "title": "Reproducing the September 2013 Record-Breaking Rainfall over the Colorado Front Range with High-Resolution WRF Forecasts", "summary": "Abstract Four convection-permitting Weather Research and Forecasting Model (WRF) forecasts were produced in an attempt to replicate the record-breaking rainfall across the Colorado Front Range between 1200 UTC 11 September and 1200 UTC 13 September 2013. A nested WRF domain with 4- and 1-km horizontal grid spacings was employed, and sensitivity to initial conditions (ICs) and microphysics (MP) parameterizations was examined. Rainfall forecasts were compared to gridded observations produced by National Weather Service River Forecast Centers and gauge measurements from the Community Collaborative Rain, Hail and Snow Network (CoCoRaHS). All 1-km forecasts produced 48-h rainfall exceeding 250 mm over portions of the Colorado Front Range and were more consistent with observations than the 4-km forecasts. While localized sensitivities to both ICs and MP were noted, systematic differences were not attributable to the varied ICs or MP schemes. At times, the 1-km forecasts produced precipitation structures similar to those observed, but none of the forecasts successfully captured the observed mesoscale evolution of the entire rainfall event. Nonetheless, as all 1-km forecasts produced torrential rainfall over the Colorado Front Range, these forecasts could have been useful guidance for this event.", "link": "https://doi.org/10.1175/waf-d-13-00136.1", "authors": "Craig S. Schwartz", "source": "Weather and Forecasting", "published": "2014-4-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 45, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-24-0045.1", "title": "Evaluation of Seasonal Precipitation in South Asian Monsoon Using FGOALS-f2 Seamless Prediction System", "summary": "Abstract Timely and effective seasonal climate prediction is crucial to reduce the losses from hydrometeorological disasters by providing early warning. Evaluating the model’s performance is essential for its accurate interpretation and implementation. Here, we examined the precipitation forecast of the South Asian monsoon using the second-generation finite-volume version of the Flexible Global Ocean–Atmosphere–Land System Model (FGOALS-f2), a seamless prediction system. The hindcast skill was assessed using multiple metrics for lead times of 0–2 months. The result demonstrates that the prediction skill is positive across the majority of regions up to a 1-month lead. However, the skill varies on lead times and geographical areas, with notably better skills up to a 1-month lead in central (particularly surrounding Nepal) and western (southern Pakistan and Afghanistan) regions. Furthermore, we proposed a physical mechanism to explain the seasonal prediction skill of precipitation and the tropical sea surface temperature (SST) signal, along with the Indian Ocean dipole (IOD) relationship. Typically, the model shows better forecasting accuracy in regions where it accurately represents the strong connection with SST indices. Additionally, for a 0-month lead forecast, the model performs well in predicting El Niño–Southern Oscillation (ENSO) and IOD indices, with correlation values of 0.71 and 0.52, respectively. We also explored how tropical cyclones could affect predicting precipitation in South Asia. Finally, we presented and compared real-time forecasts from 2020 to 2023. The ", "link": "https://doi.org/10.1175/waf-d-24-0045.1", "authors": "Dipendra Lamichhane, Qing Bao, Bian He, Ke Wei, Jing Yang, Guoxiong Wu", "source": "Weather and Forecasting", "published": "2025-5", "first_seen": "2026-11-23T21:25:47+00:00", "score": 45, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["india", "monsoon", "precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-19-955-2026", "title": "BuRNN (v1.0): a data-driven fire model", "summary": "Fires play an important role in the Earth system but remain complex phenomena that are challenging to model numerically. Here, we present the first version of BuRNN, a data-driven model simulating burned area on a global 0.5° × 0.5° grid with a monthly time resolution. We trained Long Short-Term Memory networks to predict satellite-based burned area (GFED5) from a range of climatic, vegetation and socio-economic parameters. We employed a region-based cross-validation strategy to account for the high spatial autocorrelation in our data. BuRNN outperforms the process-based fire models participating in ISIMIP3a on a global scale across a wide range of metrics. Regionally, BuRNN outperforms almost all models across a set of benchmarking metrics in all regions. Through explainable AI we unravel the difference in regional drivers of burned area in our models, showing that the presence/absence of bare ground and C 4 grasses along with the fire weather index have the largest effects on our predictions of burned area. Lastly, we used BuRNN to reconstruct global burned area for 1901–2019 and compare the simulations against independent long-term historical fire observation databases in five countries and the EU. Our approach highlights the potential of machine learning to improve burned area simulations and our understanding of past fire behaviour.", "link": "https://doi.org/10.5194/gmd-19-955-2026", "authors": "Seppe Lampe, Lukas Gudmundsson, Basil Kraft, Stijn Hantson, Douglas Kelley, Vincent Humphrey", "source": "Geoscientific Model Development", "published": "2026-1-29", "first_seen": "2026-11-23T14:47:49+00:00", "score": 44, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.14207", "title": "DailyWildfireCAN: A Dataset and Benchmark for Next-Day Wildfire Spread Prediction in Canada", "summary": "Wildfires represent a critical ecological and socio-economic challenge in Canada, where vast boreal forests and a warming climate have amplified the frequency and severity of extreme fire seasons. Predicting next-day wildfire spread can support fire management, but requires capturing complex interactions among weather, fuels, and terrain. Deep learning has emerged as a promising approach to learning these relationships from heterogeneous environmental data, yet its development and evaluation depend on representative datasets. Existing deep learning research on wildfire spread relies predominantly on US-focused datasets, leaving Canadian fire environments underrepresented. To address this gap, we present DailyWildfireCAN, a multi-modal, multi-temporal dataset and benchmark for predicting next-day wildfire spread across Canada. The dataset tracks continuous fire progression over multi-day events at a high spatial and temporal resolution of 90-m and 24-hour, respectively. This resolution preserves fine-scale information relevant to fire-edge geometry, local fuel variations, and terrain effects, supporting research toward improved daily wildfire spread forecasting. DailyWildfireCAN covers 2,440 wildfire events across eight fire seasons 2017-2024 and integrates 33 features across diverse modalities, including topography, meteorology, land cover, vegetation and forest structure, human influence indices, and satellite imagery. We establish a comprehensive benchmark comparing mono-temporal and multi-temporal prediction models, accompanied by a multi-dimensional evaluation framework", "link": "https://arxiv.org/abs/2611.14207", "authors": "Mahacine Ettahri, Hager Radi Abdelwahed, Toluwaleke Olutayo, Daniel Aloise, Gaétan Marceau Caron", "source": "arXiv", "published": "2026-11-10T15:29:13Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 44, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024ef004916", "title": "Future Patterns of Compound Dry and Hot Summers and Their Link to Soil Moisture Droughts in Europe", "summary": "Abstract Compound dry and hot extreme (CDHE) summers in Europe, like 2015, 2018 and 2022, have wide ranging impacts: heat exacerbates moisture shortages during dry periods whereas water demand rises. Current studies of CDHE are mostly conducted in observations or coarse‐resolution global climate model large ensembles. While the latter allow for the assessment of rare CDHE against the backdrop of internal variability, global ensembles fail in providing robust climate change signals at impact‐relevant scales. To overcome this issue, we exploit a regional 50‐member single‐model initial condition large ensemble (SMILE). The SMILE provides an extensive database of CDHE in a current climate and at two global warming levels (+2°C, +3°C) across Europe in high geographical detail. We identify Northern France, Southern Germany, Switzerland, Southern Ireland, and the western coasts of the Black Sea with currently low CDHE frequency as emerging hotspots. These regions experience a tenfold increase of CDHE under global warming conditions, in parts resulting in yet unseen heat and dryness. Temperature is the dominant driver of frequency increases, except for western Europe. Additionally, tail dependence strengthens in regions with large increases in CDHE frequency. In European agricultural areas, soil moisture shows stronger negative correlations with CDHE intensity than with precipitation or temperature. Finally, our results indicate fewer CDHE summers in a +2°C world compared to a +3°C world, highlighting the importance of climate mitigation to reduce the frequency of these multi‐hazar", "link": "https://doi.org/10.1029/2024ef004916", "authors": "Andrea Böhnisch, Elizaveta Felsche, Magdalena Mittermeier, Benjamin Poschlod, Ralf Ludwig", "source": "Earth's Future", "published": "2025-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 44, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023jd039275", "title": "A Typical Weakly Forced Mountain‐To‐Plain Extreme Precipitation Event Exacerbated by Urbanization in Beijing", "summary": "Abstract The rainstorms that initiate over mountains, propagate to, and suddenly intensify in nearby plains pose great challenges for weather forecasters and the public. Being in a mountain‐plain transition zone, the city of Beijing is prone to rainfall extremes induced by weakly forced mountain‐to‐plain storms. Despite efforts to understand their possible mechanisms, it remains unclear whether and how these mountain‐to‐plain precipitation extremes are affected by urbanization in Beijing. Here we use a high‐resolution weather prediction model to hindcast a weakly forced mountain‐to‐plain extreme rainfall event impacting Beijing on 23 June 2011. We incorporate spatially varying urban canopy parameters into the model to assess their effect on rainfall simulation and find no significant improvement in model performance. By comparing simulations under current and pre‐urbanization scenarios, we find that urbanization intensifies the regional average rainfall within Beijing's Sixth Ring Road by ∼23%, with an increase in peak hourly rainfall rate reaching 27 mm hr −1 . The higher surface roughness and enhanced vertical motions in urban areas facilitate the transport of warm and humid air from lower to mid‐upper layers, fueling the development and maintenance of convective storms. The dragging effect of urban canopy leads to more moisture accumulation and slower‐moving convections, resulting in more rainfall falling in urban areas. Our study underscores the key role of local urbanization in shaping the mountain‐to‐plain rainstorms in Beijing, which may help improve the forecast cap", "link": "https://doi.org/10.1029/2023jd039275", "authors": "Yuting He, Jun Wang, Jinming Feng", "source": "JGR: Atmospheres", "published": "2023-11-27", "first_seen": "2026-11-23T21:25:47+00:00", "score": 44, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/2014jd021606", "title": "Microphysics of clouds and rain over the Western Ghat", "summary": "Abstract In an attempt to unravel the interactions between cloud microphysics and dynamics that make shallow clouds precipitate heavily in this region, some unique observations of rain and cloud microphysical parameters are presented here from two stations, Pune and Mahabaleshwar, one each on the lee and windward sides, respectively, of the Western Ghat (WG) mountains in peninsular India. To elucidate rain microphysics, we used the raindrop size distribution (DSD) by fitting three parameter Gamma functions to the observed raindrop spectra. Over Pune, during stratiform rain with bright band (BB) at 0°C isotherm; concave upward DSD shapes are observed below the BB which becomes concave downward at lower altitudes. It is due to breakup process of large raindrops which increases drop concentration at midsizes suggesting coalescence, collision, and breakup processes. Both slope and intercept parameters of Gamma DSD decrease during no BB condition as altitudes decrease, signifying collision and coalescence processes. Over Mahabaleshwar, bimodal and monomodal DSD are observed during light and heavy rainfall, respectively. With shallow storm heights, small raindrops mainly contribute to both types of rainfall. The DSDs are parameterized, and their radar reflectivity factor‐rainfall intensity relationships are evaluated suggesting the dominance of collision‐coalescence processes. Aircraft measurements of orographic clouds over the WG suggest interaction of cloud mass with the ambient updraft speed. The orographically forced updrafts foster rapid condensational growth of cloud drople", "link": "https://doi.org/10.1002/2014jd021606", "authors": "Mahen Konwar, S. K. Das, S. M. Deshpande, K. Chakravarty, B. N. Goswami", "source": "JGR: Atmospheres", "published": "2014-5-27", "first_seen": "2026-11-23T21:25:47+00:00", "score": 44, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-026-08457-w", "title": "European winter climate storylines based on changes in the North Atlantic jet stream’s eastward extension", "summary": "Abstract Model projections of future European winter climate vary substantially due to the spread of atmospheric circulation changes. The uncertainty may be assessed with storylines, plausible physically self-consistent descriptions of future climate. Storylines are commonly formed by regression from remote drivers of circulation changes or from optimized circulation change metrics. In this study, we instead form storylines based on North Atlantic jet stream changes that have a direct physical connection to the European-wide climate. We present a clustering-based method for forming circulation storylines that accounts for all changes in the zonal wind field without pre-selected metrics, and compare it to a method based on regression with jet change metrics. The most important features of jet stream changes that emerge from the cluster analysis are the intensification and poleward shift of the jet extension over Europe. These are not strongly connected to jet changes over the North Atlantic. A substantial part of the climate projection uncertainty may be captured by storylines formed around weak and strong jet extension changes. Additionally, the storylines may be used to investigate connections between future changes in different parts of Europe. The storyline with a shifting and strongly intensifying jet extension projects the strongest wetting in northern Europe and strongest drying in Iberia, while western Europe experiences most wetting if the extension intensifies but does not shift. As storylines simultaneously represent future changes in precipitation, solar radiatio", "link": "https://doi.org/10.1007/s00382-026-08457-w", "authors": "Juho Koskentausta, Alexey Yu. Karpechko, Victoria A. Sinclair", "source": "Climate Dynamics", "published": "2026-11-20", "first_seen": "2026-11-23T21:25:47+00:00", "score": 44, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2025.10016", "title": "A physics-informed machine learning parameterization for cloud microphysics in ICON", "summary": "Abstract We developed a cloud microphysics parameterization for the icosahedral nonhydrostatic modeling framework (ICON) model based on physics-informed machine learning (ML). By training our ML model on high-resolution simulation data, we enhance the representation of cloud microphysics in Earth system models (ESMs) compared to traditional parameterization schemes, in particular by considering the influence of high-resolution dynamics that are not resolved in coarse ESMs. We run a global, kilometer-scale ICON simulation with a one-moment cloud microphysics scheme, the complex graupel scheme, to generate 12 days of training data. Our ML approach combines a microphysics trigger classifier and a regression model. The microphysics trigger classifier identifies the grid cells where changes due to the cloud microphysical parameterization are expected. In those, the workflow continues by calling the regression model and additionally includes physical constraints for mass positivity and water mass conservation to ensure physical consistency. The microphysics trigger classifier achieves an F1 score of 0.93 on classifying unseen grid cells. The regression model reaches an $ {R}^2 $ score of 0.72 averaged over all seven microphysical tendencies on simulated days used for validation only. This results in a combined offline performance of 0.78. Using explainability techniques, we explored the correlations between input and output features, finding a strong alignment with the graupel scheme and, hence, physical understanding of cloud microphysical processes. This parameterization provid", "link": "https://doi.org/10.1017/eds.2025.10016", "authors": "Ellen Sarauer, Mierk Schwabe, Philipp Weiss, Axel Lauer, Philip Stier, Veronika Eyring", "source": "Environmental Data Science", "published": "2025", "first_seen": "2026-11-23T14:47:49+00:00", "score": 43, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": ["Veronika Eyring"], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "arxiv:2611.16941", "title": "Upscale energy transfer from mesoscale convective systems to African easterly waves", "summary": "African easterly waves (AEWs) drive the synoptic variability of West African monsoon rainfall via intricate two-way interactions with mesoscale convective systems (MCSs). The composite MCS-AEW system is a canonical example of multiscale interactions in the tropical atmosphere, with upscale feedbacks from deep convection driving the evolution of a larger-scale circulation. Here we support this perspective through application of techniques from turbulence theory, calculating for the first time patterns of interscale kinetic energy transfer, $\\mathcal{D}_L$, across different spatial scales $L$ around MCSs and AEW lifecycle phases. We study AEW and MCS dynamics in two pan-tropical 40 day Met Office Unified Model simulations with $\\sim$5km grid spacings, for which $\\mathcal{D}_L$ is calculated with the LoSSETT software package. We find explicitly-simulated MCSs show a distinctive vertical dipole structure of $\\mathcal{D}_L$ at scales below 1000km, with strong upscale energy transfer located in the upper troposphere within storm anvils. Regionally, upscale energy transfer occurs most strongly where organised convection is active. We find 200hPa upscale transfer consistently leads AEW troughs, and that growing continental AEWs in the explicit simulation are characterised by strengthened upscale transfer of energy from MCS to AEW scales. Case-study analysis shows this transfer can contribute to the eddy kinetic energy growth of strengthening AEW troughs. These signals are weak in a simulation with parameterised convection: here, zonal mean energetics show enhanced barotropic conver", "link": "https://arxiv.org/abs/2611.16941", "authors": "Ben Maybee, Elliot McKinnon-Gray, Dan Shipley, John Methven", "source": "arXiv", "published": "2026-11-12T15:23:00Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 43, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["monsoon"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-17-8873-2024", "title": "Architectural insights into and training methodology optimization of Pangu-Weather", "summary": "Data-driven medium-range weather forecasts have recently outperformed classical numerical weather prediction models, with Pangu-Weather (PGW) being the first breakthrough model to achieve this. The Transformer-based PGW introduced novel architectural components including the three-dimensional attention mechanism (3D Transformer) in the Transformer blocks. Additionally, it features an Earth-specific positional bias term which accounts for weather states being related to the absolute position on Earth. However, the effectiveness of different architectural components is not yet well understood. Here, we reproduce the 24 h forecast model of PGW based on subsampled 6-hourly data. We then present an ablation study of PGW to better understand the sensitivity to the model architecture and training procedure. We find that using a two-dimensional attention mechanism (2D Transformer) yields a model that is more robust to training, converges faster, and produces better forecasts compared to using the 3D Transformer. The 2D Transformer reduces the overall computational requirements by 20 %–30 %. Further, the Earth-specific positional bias term can be replaced with a relative bias, reducing the model size by nearly 40 %. A sensitivity study comparing the convergence of the PGW model and the 2D-Transformer model shows large batch effects; however, the 2D-Transformer model is more robust to such effects. Lastly, we propose a new training procedure that increases the speed of convergence for the 2D-Transformer model by 30 % without any further hyperparameter tuning.", "link": "https://doi.org/10.5194/gmd-17-8873-2024", "authors": "Deifilia To, Julian Quinting, Gholam Ali Hoshyaripour, Markus Götz, Achim Streit, Charlotte Debus", "source": "Geoscientific Model Development", "published": "2024-12-13", "first_seen": "2026-11-23T21:25:47+00:00", "score": 43, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2006gl025734", "title": "Climate change hot‐spots", "summary": "A Regional Climate Change Index (RCCI), is developed based on regional mean precipitation change, mean surface air temperature change, and change in precipitation and temperature interannual variability. The RCCI is a comparative index designed to identify the most responsive regions to climate change, or Hot‐Spots. The RCCI is calculated for 26 land regions from the latest set of climate change projections by 20 global climate models for the A1B, A2 and B1 IPCC emission scenarios. The Mediterranean and North Eastern European regions emerge as the primary Hot‐Spots, followed by high latitude northern hemisphere regions and by Central America, the most prominent tropical Hot‐Spot. The main African Hot‐Spots are Southern Equatorial Africa and the Sahara. Eastern North America is the prominent Hot‐Spot over the continental U.S. Different factors over different regions contribute to the magnitude of the RCCI, which is in fact greater than 0 for all regions.", "link": "https://doi.org/10.1029/2006gl025734", "authors": "F. Giorgi", "source": "Geophysical Research Letters", "published": "2006-4", "first_seen": "2026-11-23T21:25:47+00:00", "score": 43, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024ef004845", "title": "Global Assessment of Compound Climate Extremes and Exposures of Population, Agriculture, and Forest Lands Under Two Climate Scenarios", "summary": "Abstract Climate change is expected to increase the global occurrence and intensity of heatwaves, extreme precipitation, and flash droughts. However, it is not well understood how the compound heatwave, extreme precipitation, and flash drought events will likely change, and how global population, agriculture, and forest will likely be exposed to these compound events under future climate change scenarios. This research uses eight CMIP6 climate models to assess the current and future global compound climate extreme events, as well as population, agriculture, and forestry exposures to these events, under two climate scenarios, Shared Socioeconomic Pathways (SSP), SSP1‐2.6 and SSP5‐8.5 for three time periods: early‐, mid‐, and late‐ 21st century. Climate extremes are derived for heatwaves, extreme precipitation, and flash droughts using locational‐dependent thresholds. We find that compound heatwaves and flash drought events result in the largest increases in exposure of populations, agriculture, and forest lands, under SSP5‐8.5 late‐century projections of sequential heatwaves and flash droughts. Late‐century projections of sequential heatwaves and flash droughts show hot spots of exposure increases in population exposure greater than 50 million person‐events in China, India, and Europe; increases in agriculture land exposures greater than 90 thousand km 2 ‐events in China, South America, and Oceania; and increase in forest land exposure greater than 120 thousand km 2 ‐events in Oceania and South America regions when compared to the historical period. The findings from this st", "link": "https://doi.org/10.1029/2024ef004845", "authors": "Tayler A. Schillerberg, Di Tian", "source": "Earth's Future", "published": "2024-9", "first_seen": "2026-11-23T21:25:47+00:00", "score": 43, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "cmip6", "precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ef003983", "title": "KNMI'23 Climate Scenarios for the Netherlands: Storyline Scenarios of Regional Climate Change", "summary": "Abstract This paper presents the methodology for the construction of the KNMI'23 national climate scenarios for the Netherlands. We have developed six scenarios, that cover a substantial part of the uncertainty in CMIP6 projections of future climate change in the region. Different sources of uncertainty are disentangled as much as possible, partly by means of a storyline approach. Uncertainty in future emissions is covered by making scenarios conditional on different SSP scenarios (SSP1‐2.6, SSP2‐4.5, and SSP5‐8.5). For each SSP scenario and time horizon (2050, 2100, 2150), we determine a global warming level based on the median of the constrained estimates of climate sensitivity from IPCC AR6. The remaining climate model uncertainty of the regional climate response at these warming levels is covered by two storylines, which are designed with a focus on the annual and seasonal mean precipitation response (a dry‐trending and wet‐trending variant for each SSP). This choice was motivated by the importance of future water management to society. For users with specific interests we provide means how to account for the impact of the uncertainty in climate sensitivity. Since CMIP6 GCM data do not provide the required spatial detail for impact modeling, we reconstruct the CMIP6 responses by resampling internal variability in a GCM‐RCM initial‐condition ensemble. The resulting climate scenarios form a detailed storyline of plausible future climates in the Netherlands. The data can be used for impact calculations and assessments by stakeholders, and will be used to inform policy maki", "link": "https://doi.org/10.1029/2023ef003983", "authors": "Karin van der Wiel, Jules Beersma, Henk van den Brink, Folmer Krikken, Frank Selten, Camiel Severijns", "source": "Earth's Future", "published": "2024-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 43, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "uncertainty"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-025-01226-2", "title": "The global Sahel monsoon ocean-pressure index reconciles its regional and large-scale features", "summary": "Abstract Monitoring Sahelian rainfall variability is increasingly critical as climate extremes intensify across the region. Here, we develop the Sahelian Monsoon Ocean-Pressure Index (SMOPI), a novel global synthetic indicator constructed from five dynamically coherent sea-level pressure regions statistically linked to June-September Sahel monsoon rainfall. SMOPI captures intra-seasonal and interannual variability, and crucially, reflects the influence of both regional processes and large-scale teleconnections on monsoon dynamics. It aligns with the dominant rainfall variability mode in reanalyses and 29 CMIP6 models. Strong/positive SMOPI phases coincide with wet years and are associated with enhanced convergence, favorable jet configurations, and robust Pacific, Atlantic, and Indian Ocean teleconnections. Conversely, weak/negative SMOPI phases correspond to drought conditions and divergent moisture fluxes. SMOPI exposes model failures in reproducing historical droughts and offers new physical insights into rainfall-driving mechanisms. It stands out as a scalable, potentially transferable diagnostic tool for monitoring/forecasting and evaluating Sahelian monsoon rainfall under global warming.", "link": "https://doi.org/10.1038/s41612-025-01226-2", "authors": "Alain T. Tamoffo, Torsten Weber, Fernand L. Mouassom, Benjamin Le-Roy, Claas Teichmann, Daniela Jacob", "source": "npj Climate and Atmospheric Science", "published": "2025-9-15", "first_seen": "2026-11-23T21:25:47+00:00", "score": 43, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "monsoon", "cmip6", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-021-00190-x", "title": "Global climatology and trends in convective environments from ERA5 and rawinsonde data", "summary": "Abstract Globally, thunderstorms are responsible for a significant fraction of rainfall, and in the mid-latitudes often produce extreme weather, including large hail, tornadoes and damaging winds. Despite this importance, how the global frequency of thunderstorms and their accompanying hazards has changed over the past 4 decades remains unclear. Large-scale diagnostics applied to global climate models have suggested that the frequency of thunderstorms and their intensity is likely to increase in the future. Here, we show that according to ERA5 convective available potential energy (CAPE) and convective precipitation (CP) have decreased
