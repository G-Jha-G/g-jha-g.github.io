c Aperture Radar (SAR) wind fields processed using the CMOD5 model. WRF outputs were generated every 30 minutes for three nested domains (9 km, 3 km, 1 km) through 975 short-term simulations. SAR/CMOD5 wind fields are provided at 500 m and 1 km resolution across 104 acquisition dates. Validation shows strong agreement: daily spatial averages of 10 m wind speed yield RMSE and MAE below 3 m/s on over 93% of acquisition days, while more than 91.5% of pixel-level residuals fall within $\\pm$3 m/s. In situ measurements from the Itajaí buoy further confirmed the reliability of both sources. The dataset supports regional climate studies, wind energy resource assessment, and machine-learning applications in forecasting and downscaling, with usage examples included to aid practical adoption.", "link": "https://arxiv.org/abs/2511.18704", "authors": "Luan C. V. Silva, Lívia Sancho, Mauricio S. Silva, Elisa Passos, Larissa F. R. Jacinto, Rebeca S. Lyra, Nilton O. Moraes, Carina S. Bock", "source": "arXiv", "published": "2025-11-24", "first_seen": "2026-11-24T14:57:46+00:00", "score": 54, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-9-3461-2016", "title": "The Scenario Model Intercomparison Project (ScenarioMIP) for CMIP6", "summary": "Projections of future climate change play a fundamental role in improving understanding of the climate system as well as characterizing societal risks and response options. The Scenario Model Intercomparison Project (ScenarioMIP) is the primary activity within Phase 6 of the Coupled Model Intercomparison Project (CMIP6) that will provide multi-model climate projections based on alternative scenarios of future emissions and land use changes produced with integrated assessment models. In this paper, we describe ScenarioMIP's objectives, experimental design, and its relation to other activities within CMIP6. The ScenarioMIP design is one component of a larger scenario process that aims to facilitate a wide range of integrated studies across the climate science, integrated assessment modeling, and impacts, adaptation, and vulnerability communities, and will form an important part of the evidence base in the forthcoming Intergovernmental Panel on Climate Change (IPCC) assessments. At the same time, it will provide the basis for investigating a number of targeted science and policy questions that are especially relevant to scenario-based analysis, including the role of specific forcings such as land use and aerosols, the effect of a peak and decline in forcing, the consequences of scenarios that limit warming to below 2 °C, the relative contributions to uncertainty from scenarios, climate models, and internal variability, and long-term climate system outcomes beyond the 21st century. To serve this wide range of scientific communities and address these questions, a design has been", "link": "https://doi.org/10.5194/gmd-9-3461-2016", "authors": "Brian C. O'Neill, Claudia Tebaldi, Detlef P. van Vuuren, Veronika Eyring, Pierre Friedlingstein, George Hurtt, Reto Knutti, Elmar Kriegler", "source": "Geoscientific Model Development", "published": "2016-9-28", "first_seen": "2026-11-24T14:57:46+00:00", "score": 54, "topics": ["Climate Modelling"], "watch": ["Veronika Eyring"], "boosts": ["cmip6", "uncertainty"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1175/aies-d-26-0005.1", "title": "Progress toward Forecasting Excessive Rainfall with Random Forests Based on a Deterministic Convection-Allowing Model", "summary": "Machine learning applied to high-resolution numerical weather prediction forecasts is gaining popularity for prediction of high-impact weather events, but questions remain on how to design such systems. Building off prior work, we describe sensitivity experiments using a random forest (RF) system for excessive rainfall prediction using the deterministic High-Resolution Rapid Refresh (HRRR). We find that applying an RF trained on HRRRv3 to daily forecasts from HRRRv4 does not significantly degrade results. In terms of the spatial aggregation of predictor information for the RF, we find that forecasts are significantly improved when the system uses data from all nearby model grid points, rather than just sparse input points, particularly for events featuring small-scale precipitation maxima. Forecasts are also improved when predictors are averaged across multiple HRRR initializations rather than taken from a single HRRR initialization, as the RF is better able to learn relationships with the reduced uncertainty of the time-lagged ensemble mean predictors. The HRRR-based RF was evaluated during the Flash Flood and Intense Rainfall (FFaIR) experiment over three consecutive years, with year-over-year improvements in the system. The HRRR-based RF exhibits an underprediction bias, partially attributable to using a more comprehensive dataset of excessive rainfall for verification than for RF training. Evaluation of RF skill during more than 4 years of real-time forecasts reveals that RFs based on deterministic convection-allowing models continue to underperform relative to a Global", "link": "https://doi.org/10.1175/aies-d-26-0005.1", "authors": "Eric P. James, Russ S. Schumacher", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 54, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-23-0093.1", "title": "Evidential Deep Learning: Enhancing Predictive Uncertainty Estimation for Earth System Science Applications", "summary": "Robust quantification of predictive uncertainty is a critical addition needed for machine learning applied to weather and climate problems to improve the understanding of what is driving prediction sensitivity. Ensembles of machine learning models provide predictive uncertainty estimates in a conceptually simple way but require multiple models for training and prediction, increasing computational cost and latency. Parametric deep learning can estimate uncertainty with one model by predicting the parameters of a probability distribution but does not account for epistemic uncertainty. Evidential deep learning, a technique that extends parametric deep learning to higher-order distributions, can account for both aleatoric and epistemic uncertainties with one model. This study compares the uncertainty derived from evidential neural networks to that obtained from ensembles. Through applications of the classification of winter precipitation type and regression of surface-layer fluxes, we show evidential deep learning models attaining predictive accuracy rivaling standard methods while robustly quantifying both sources of uncertainty. We evaluate the uncertainty in terms of how well the predictions are calibrated and how well the uncertainty correlates with prediction error. Analyses of uncertainty in the context of the inputs reveal sensitivities to underlying meteorological processes, facilitating interpretation of the models. The conceptual simplicity, interpretability, and computational efficiency of evidential neural networks make them highly extensible, offering a promising a", "link": "https://doi.org/10.1175/aies-d-23-0093.1", "authors": "John S. Schreck, David John Gagne, Charlie Becker, William E. Chapman, Kim Elmore, Da Fan, Gabrielle Gantos, Eliot Kim", "source": "Artificial Intelligence for the Earth Systems", "published": "2024-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 54, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-24-0052.1", "title": "Neural Prediction of Lagrangian Drift Trajectories on the Sea Surface", "summary": "This study proposes a new deep learning approach for the simulation of Lagrangian drift at the sea surface with the objective to overcome the current limitations of the existing model-based and learning-based methods. The proposed framework, called DriftNet, is inspired by the Eulerian Fokker–Planck representation of Lagrangian drift. DriftNet is able to simulate the Lagrangian trajectory of a fluid parcel given the corresponding Eulerian sea surface currents and the spatially explicit encoding of the parcel’s initial position. The efficacy of DriftNet is demonstrated through three benchmarks: two benchmarks involving fully simulated ocean data and one combining operational ocean reanalysis model along with in situ drifters’ data. The study focuses on two regions with different dynamical regimes: the northeast Pacific and the Gulf Stream. The findings indicate that DriftNet outperforms current state-of-the-art model-based and learning-based methods. Additionally, this study explores how the sea surface height—derived from both modeled and observed ocean—affects Lagrangian drift simulations when used as input to DriftNet. Significance Statement We propose a novel deep learning model, DriftNet, for the conditional generation of Lagrangian trajectories on the sea surface. Our model is based on Eulerian Fokker–Planck formalism and can be conditioned by multiple geophysical fields. We highlight the overall overperformance of DriftNet compared to the baseline model-based and learning-based approaches. We put in evidence the capacity of the proposed method to extract pertinent inf", "link": "https://doi.org/10.1175/aies-d-24-0052.1", "authors": "Daria Botvynko, Carlos Granero-Belinchon, Simon van Gennip, Abdesslam Benzinou, Ronan Fablet", "source": "Artificial Intelligence for the Earth Systems", "published": "2025-7", "first_seen": "2026-11-24T14:57:46+00:00", "score": 54, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021ms002464", "title": "Detecting Climate Signals Using Explainable AI With Single‐Forcing Large Ensembles", "summary": "It remains difficult to disentangle the relative influences of aerosols and greenhouse gases on regional surface temperature trends in the context of global climate change. To address this issue, we use a new collection of initial‐condition large ensembles from the Community Earth System Model version 1 that are prescribed with different combinations of industrial aerosol and greenhouse gas forcing. To compare the climate response to these external forcings, we adopt an artificial neural network (ANN) architecture from previous work that predicts the year by training on maps of near‐surface temperature. We then utilize layer‐wise relevance propagation (LRP) to visualize the regional temperature signals that are important for the ANN's prediction in each climate model experiment. To mask noise when extracting only the most robust climate patterns from LRP, we introduce a simple uncertainty metric that can be adopted to other explainable artificial intelligence (AI) problems. We find that the North Atlantic, Southern Ocean, and Southeast Asia are key regions of importance for the neural network to make its prediction, especially prior to the early‐21st century. Notably, we also find that the ANN predictions based on maps of observations correlate higher to the actual year after training on the large ensemble experiment with industrial aerosols held fixed to 1920 levels. This work illustrates the sensitivity of regional temperature signals to changes in aerosol forcing in historical simulations. By using explainable AI methods, we have the opportunity to improve our understand", "link": "https://doi.org/10.1029/2021ms002464", "authors": "Zachary M. Labe, Elizabeth A. Barnes", "source": "Journal of Advances in Modeling Earth Systems", "published": "2021-6", "first_seen": "2026-11-24T14:57:46+00:00", "score": 54, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2026jd047940", "title": "Quantifying Historical Tropical Cyclone‐Heat Compound Events Using Global Climate Models", "summary": "Tropical cyclones (TCs) followed by extreme heat (TC‐heat events) pose growing public health risks, motivating the need for rigorous quantification of these hazards across the globe. We use three high‐resolution global climate models (GCMs) from the NOAA Geophysical Fluid Dynamics Laboratory alongside observation‐based data sets to assess the historical global distribution of TC‐heat compound events from 1980 to 2019, and GCMs’ ability to capture these hazards. We find that TC‐heat events occur across all major TC basins, with hot spots along the Gulf Coast of North America, western Mexico, East and Southeast Asia, southeastern Africa, and northwest Australia. The GCMs broadly reproduce the observed spatial distribution and seasonal cycle of TC‐heat events, although biases remain in event frequency. Historical trends in TC‐heat event frequency in observations are positive, but robustness of trends is limited as assessed via statistical significance and variation across model ensemble members. Analysis across regions reveals that TC occurrence is the primary driver of spatial variability in TC‐heat events, with a secondary role for variations in heat extremes. Sensitivity tests to definition choice show that event frequency is most sensitive to TC intensity threshold and TC radius, while sensitivity to the post‐storm temporal window is comparatively small. Heat index (HI) threshold sensitivity depends on the reanalysis data set used for bias correction, highlighting this choice as an additional source of uncertainty in TC‐heat event estimates. These results demonstrate that ", "link": "https://doi.org/10.1029/2026jd047940", "authors": "Samantha Frucht, Suzana J. Camargo, Hiroyuki Murakami, Chia‐Ying Lee, Tom Matthews, Gabriel A. Vecchi, Wenchang Yang, Jane W. Baldwin", "source": "JGR: Atmospheres", "published": "2026-11-24", "first_seen": "2026-11-24T14:57:46+00:00", "score": 54, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["extreme", "uncertainty"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2018jd029571", "title": "The Sensitivity of Terrestrial δ 18 O Gradients to Hydroclimate Evolution", "summary": "Terrestrial gradients in the oxygen isotopic composition of meteoric water ( δ 18 O ), as reconstructed through proxies, reflect characteristics of ancient hydrologic conditions. These gradients are primarily influenced by the atmospheric transport of water vapor and the balance of precipitation and evapotranspiration, which are linked to climate and topography. We incorporate these effects into a one‐dimensional model that predicts the spatial evolution of δ 18 O based on local topography and the regional water‐energy budget. Specifically, we build on existing reactive transport models by incorporating parameterizations of orographic precipitation and energetic constraints on evapotranspiration following the Budyko water balance framework. We test our model on three modern transects that represent topographically distinct environments. These are the Amazon Basin (lowlands), the Cascade Range (mountains), and the eastern Himalayan Range (lowlands and mountains). Comparisons among these gradients demonstrate that the topographic regime determines how sensitive isotope records are to hydroclimate evolution. As a result, isotope records differentially express signatures of topography and the regional water balance, and we present a quantitative framework to predict this trade‐off. Finally, we link these effects to climate evolution and discuss how our model may help disentangle topographic and climatic signals through Earth history.", "link": "https://doi.org/10.1029/2018jd029571", "authors": "Tyler Kukla, Matthew J. Winnick, Kate Maher, Daniel E. Ibarra, C. Page Chamberlain", "source": "JGR: Atmospheres", "published": "2019-1-21", "first_seen": "2026-11-24T14:57:46+00:00", "score": 54, "topics": ["Climate Modelling"], "watch": [], "boosts": ["himalaya", "precipitation"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-025-01032-w", "title": "Seasonal prediction of Indian summer monsoon extreme rainfall frequency", "summary": "", "link": "https://doi.org/10.1038/s41612-025-01032-w", "authors": "Devabrat Sharma, Santu Das, B. N. Goswami", "source": "npj Climate and Atmospheric Science", "published": "2025-4-13", "first_seen": "2026-11-24T14:57:46+00:00", "score": 54, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["india", "monsoon", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-024-07257-4", "title": "The added value of simulated near-surface wind speed over the Alps from a km-scale multimodel ensemble", "summary": "The advancement of computational resources has allowed researchers to run convection-permitting regional climate model (CPRCM) simulations. A pioneering effort promoting a multimodel ensemble of such simulations is the CORDEX Flagship Pilot Studies (FPS) on “Convective Phenomena over Europe and the Mediterranean” over an extended Alps region. In this study, the Distribution Added Value metric is used to determine the improvement of the representation of all available FPS hindcast simulations for the daily mean near-surface wind speed. The analysis is performed on normalized empirical probability distributions and considers station observation data as the reference. The use of a normalized metric allows for spatial comparison among the different regions (coast and inland), altitudes and seasons. This approach permits a direct assessment of the added value between the CPRCM simulations against their global driving reanalysis (ERA-Interim) and respective coarser resolution regional model counterparts. In general, the results show that CPRCMs add value to their global driving reanalysis or forcing regional model, due to better-resolved topography or through better representation of ocean-land contrasts. However, the nature and magnitude of the improvement in the wind speed representation vary depending on the model, the season, the altitude, or the region. Among seasons, the improvement is usually larger in summer than winter. CPRCMs generally display gains at low and medium-range altitudes. In addition, despite some shortcomings in comparison to ERA-Interim, which can be attri", "link": "https://doi.org/10.1007/s00382-024-07257-4", "authors": "M. O. Molina, J. M. Careto, C. Gutiérrez, E. Sánchez, K. Goergen, S. Sobolowski, E. Coppola, E. Pichelli", "source": "Climate Dynamics", "published": "2024-5-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 54, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-016-3208-2", "title": "Impact of spectral nudging on regional climate simulation over CORDEX East Asia using WRF", "summary": "", "link": "https://doi.org/10.1007/s00382-016-3208-2", "authors": "Jianping Tang, Shuyu Wang, Xiaorui Niu, Pinhong Hui, Peishu Zong, Xueyuan Wang", "source": "Climate Dynamics", "published": "2016-6-3", "first_seen": "2026-11-24T14:57:46+00:00", "score": 54, "topics": ["Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-21-0026.1", "title": "Forecasting excessive rainfall with random forests and a deterministic convection-allowing model", "summary": "Approximately seven years of daily initializations from the convection-allowing National Severe Storms Laboratory Weather Research and Forecasting model are used as inputs to train random forest (RF) machine learning models to probabilistically predict instances of excessive rainfall. Unlike other hazards, excessive rainfall does not have an accepted definition, so multiple definitions of excessive rainfall and flash flooding – including flash flood reports and 24-hr average recurrence intervals (ARIs) – are used to explore RF configuration forecast sensitivities. RF forecasts are analogous to operational Weather Prediction Center (WPC) day-1 Excessive Rainfall Outlooks (EROs) and their resolution, reliability, and skill are strongly influenced by rainfall definitions and how inputs are assembled for training. Models trained with 1-y ARI exceedances defined by the Stage-IV (ST4) precipitation analysis perform poorly in the northern Great Plains and southwest U.S., in part due to a high bias in the number of training events in these regions. Increasing the ARI threshold to 2 years or removing ST4 data from training, optimizing forecast skill geographically, and spatially averaging meteorological inputs for training generally results in improved CONUS-wide RF forecast skill. Both EROs and RF forecasts have seasonal skill – poor forecasts in the late fall and winter and skillful forecasts in the summer and early fall. However, the EROs are consistently and significantly better than their RF counterparts, regardless of RF configuration, particularly in the summer months. The re", "link": "https://doi.org/10.1175/waf-d-21-0026.1", "authors": "Aaron J. Hill, Russ S. Schumacher", "source": "Weather and Forecasting", "published": "2021-7-21", "first_seen": "2026-11-24T14:57:46+00:00", "score": 54, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.09317", "title": "Stable probabilistic emulation of partially observed dynamical systems", "summary": "Predicting the long-term behavior of partially observed dynamical systems such as the coupled atmosphere-ocean system is central to societal decision-making. Motivated by the success of deep learning emulators in weather forecasting, data-driven climate models represent a promising approach. However, climate emulation poses distinct challenges: models must account for unresolved fast variables introduced by unavoidable coarse-graining, reproduce long-term statistics, and remain stable over arbitrarily long rollouts and under external perturbations. These requirements motivate stochastic data-driven emulators, but modern generative models lack stability guarantees. We introduce forced-dissipative stochastic interpolants, a generative framework for learning stochastic reduced dynamics. Its architecture uses structural constraints inspired by turbulent dynamics, which provide stability by design while retaining the flexibility of stochastic interpolants to represent complex probabilistic dynamics. Building on the theory of Markov-chain stability, we establish a Foster--Lyapunov drift condition and prove geometric ergodicity for our emulator, together with stability under steady external forcing. We evaluate the framework on the two-timescale Lorenz-96 system, a prototype of partially observed multiscale turbulence. The resulting emulator remains stable over long integrations and under finite-amplitude forcing, with accurate prediction of forced responses of both the mean and variance.", "link": "https://arxiv.org/abs/2611.09317", "authors": "Mario Massy, Sara Shamekh, Fabrizio Falasca, Matthieu Blanke", "source": "arXiv", "published": "2026-11-06", "first_seen": "2026-11-24T14:57:46+00:00", "score": 53, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["emulator"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.25545", "title": "Beyond the record: evaluating probabilistic AI weather forecasts deep in the tail", "summary": "Can probabilistic artificial intelligence (AI) weather forecasts retain skill beyond their training domain? We compare four state-of-the-art AI models (ArchesWeatherGen, U-Cast, WeatherNext2 and GenCast-mini) with the physics-based IFS-ENS over land in 2022, at 1.5° resolution and lead times of 2--10 days. Monthly ERA5 records from 1979--2021 define common historical boundaries, and we characterize new records set in 2022 by their depth, i.e., the exceedance margin relative to local historical variability. Two proper scores, record-threshold weighted CRPS and Brier score, assess the magnitude and probability of record exceedances across all eligible cases, retaining both missed extremes and false alarms. Verified against ERA5, AI models outperform IFS-ENS for heat and cold records at almost every lead and depth. For heat, the advantage strengthens with depth, partly because IFS-ENS over-forecasts deep records, and largely persists for deeper records under HRES-fc0 verification. For wind, gains erode for deeper records and longer leads. Better tail scores can nevertheless coexist with aggregate probability deficits or surpluses, and some improvements arise chiefly on non-exceedances. Increasing underprediction on progressively more extreme observed subsets can also arise through outcome selection, even for an ideal conditional-mean forecast. These findings establish that native probabilistic AI ensembles retain, and for heat increase, their advantage over IFS-ENS as thresholds move beyond local records, although all advantages narrow with lead time. They caution against gene", "link": "https://arxiv.org/abs/2610.25545", "authors": "Bastiaan Van Velthoven, Cas Decancq, Diego G. Miralles, Stijn Luca, Thomas Mortier", "source": "arXiv", "published": "2026-10-18", "first_seen": "2026-11-24T14:57:46+00:00", "score": 53, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.24665", "title": "Permafrost augmented simulation and forecast using hybrid modeling through spectral neural networks", "summary": "Purpose - Global warming is impacting several crucial Earth systems, including the permafrost. This study investigates the possibility of performing fast and reliable simulation and forecasting of permafrost behavior, addressing a critical gap in the existing literature related to high computation times and energy costs of the simulations. Methodology - A numerical cryohydrogeological study on water and energy transfer in a forested, continuous permafrost site has been conducted using parallel high-performance computing to simulate the permafrost dynamics. The numerical results reasonably replicate the measured soil temperature profiles and the dynamics of infiltrated waters. This work uses a spectral network to achieve a fast, reliable, and stable surrogate model for the simulations to forecast over long periods of time. The surrogate is also enhanced by assimilating experimental data through the development of a hybrid modeling framework. Findings - The proposed approach improves the physical simulation while maintaining the stability of the dynamic model over long periods of time. The results reveal that the proposed hybrid modeling remains stable in integration and forecasting. The final hybrid solution demonstrates a significant improvement in simulation accuracy when tested against a test set of measurements. Predictions of the permafrost behavior in the coming decade are later made based on the CMIP6 climate change scenarios. Originality - This research offers a novel perspective on permafrost modeling that extends the current understanding of its behavior under diff", "link": "https://arxiv.org/abs/2610.24665", "authors": "Chady Ghnatios, Thibault Xavier, Anatoly S. Prokushkin, Laurent Orgogozo, Francisco Chinesta", "source": "arXiv", "published": "2026-10-17", "first_seen": "2026-11-24T14:57:46+00:00", "score": 53, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2020gl088229", "title": "Improving AI System Awareness of Geoscience Knowledge: Symbiotic Integration of Physical Approaches and Deep Learning", "summary": "Modeling dynamic geophysical phenomena is at the core of Earth and environmental studies. The geoscientific community relying mainly on physical representations may want to consider much deeper adoption of artificial intelligence (AI) instruments in the context of AI's global success and emergence of big Earth data. A new perspective of using hybrid physics‐AI approaches is a grand vision, but actualizing such approaches remains an open question in geoscience. This study develops a general approach to improving AI geoscientific awareness, wherein physical approaches such as temporal dynamic geoscientific models are included as special recurrent neural layers in a deep learning architecture. The illustrative case of runoff modeling across the conterminous United States demonstrates that the physics‐aware DL model has enhanced prediction accuracy, robust transferability, and good intelligence for inferring unobserved processes. This study represents a firm step toward realizing the vision of tackling Earth system challenges by physics‐AI integration.", "link": "https://doi.org/10.1029/2020gl088229", "authors": "Shijie Jiang, Yi Zheng, Dimitri Solomatine", "source": "Geophysical Research Letters", "published": "2020-7", "first_seen": "2026-11-24T14:57:46+00:00", "score": 53, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-7-89-2026", "title": "Considerable yet contrasting regional imprint of circulation change on summer temperature trends across the Northern hemisphere mid-latitudes", "summary": "Rising summer temperatures and more frequent heat extremes are well-documented outcomes of anthropogenic climate change. However, the extent to which atmospheric circulation changes contribute to these trends remains contested. Regional differences across the northern mid-latitudes suggest that circulation plays a role, yet robustly quantifying its contribution over multiple decades is very challenging. We address this by systematically testing statistical and machine learning methods that decompose temperature signals into a thermodynamic and a dynamic contribution against climate model simulations. Specifically, we use unforced simulations with circulation nudged to match a forced simulation that includes anthropogenic emissions and land-use change. We apply decomposition methods to the forced simulations and compare their estimates of circulation-induced trends with those found in nudged circulation simulations. Our analysis reveals that most methods accurately identify the sign of circulation-induced changes in temperature, although they consistently underestimate their magnitude. Despite this limitation, the results demonstrate that circulation changes have made a substantial contribution to summer temperature trends across the northern mid-latitudes. In Europe, a hotspot region, we estimate that up to half of the observed summer warming between 1979 and 2023 can be attributed to circulation trends. Furthermore, circulation trends have contributed to warmer summer temperatures over Western North America, Central Siberia, Mongolia, Central China, and northeastern Canada", "link": "https://doi.org/10.5194/wcd-7-89-2026", "authors": "Peter Pfleiderer, Anna Merrifield, István Dunkl, Homer Durand, Enora Cariou, Julien Cattiaux, Gustau Camps-Valls, Sebastian Sippel", "source": "Weather and Climate Dynamics", "published": "2026-1-15", "first_seen": "2026-11-24T14:57:46+00:00", "score": 53, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/1520-0434(2003)018<0918:sopfss>2.0.co;2", "title": "Sensitivity of Precipitation Forecast Skill Scores to Bilinear Interpolation and a Simple Nearest-Neighbor Average Method on High-Resolution Verification Grids", "summary": "", "link": "https://doi.org/10.1175/1520-0434(2003)018<0918:sopfss>2.0.co;2", "authors": "Christophe Accadia, Stefano Mariani, Marco Casaioli, Alfredo Lavagnini, Antonio Speranza", "source": "Weather and Forecasting", "published": "2003-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 53, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41558-019-0639-x", "title": "The potential to reduce uncertainty in regional runoff projections from climate models", "summary": "", "link": "https://doi.org/10.1038/s41558-019-0639-x", "authors": "Flavio Lehner, Andrew W. Wood, Julie A. Vano, David M. Lawrence, Martyn P. Clark, Justin S. Mankin", "source": "Nature Climate Change", "published": "2019-11-26", "first_seen": "2026-11-24T14:57:46+00:00", "score": 53, "topics": ["Climate Modelling"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.11066", "title": "Rescene-ESM: an Earth system model built around a frozen AI weather model", "summary": "Earth system models underpin climate projections, but their cost limits how many scenarios, ensemble members and impact pathways can be explored. Machine-learning weather models forecast as skillfully as physics-based models at a fraction of the cost, yet coupled to an ocean they have produced weak El Nino variability or have learned it from climate-model output, and none carries the climate through rivers to the people exposed to it. Here we present Rescene-ESM, an Earth system model whose coupler, YAHO, yokes a frozen 20.8-million-parameter AI weather model to physically formulated ocean, sea-ice, land, river, carbon and energy components constrained by observations. Adding the couplings one at a time shows what each contributes: over a climatological ocean the AI atmosphere varies from year to year by a third of the observed amount over the oceans, and an interactive mixed layer, an equatorial wave ocean, the residual of the observed sea surface temperature (SST) equation as stochastic forcing and the land's moisture flux raise this step by step and bring El Nino and its teleconnections, leaving the mean climate almost unchanged. The full model simulates about 1,000 years per day on one graphics processing unit, holds the observed climate for a thousand years without drift, reproduces the observed 1979-2022 global warming, carries forced change with a physically based structure around the frozen network (transient climate response 1.60 K), routes runoff to 212 river gauges with a median seasonal-cycle correlation of 0.79 and, driven by emissions, separates the heatwave e", "link": "https://arxiv.org/abs/2611.11066", "authors": "Minjong Cheon, Kaoru Kakinuma", "source": "arXiv", "published": "2026-11-08", "first_seen": "2026-11-24T14:57:46+00:00", "score": 52, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.25570", "title": "Reinforcement-Aligned Probabilistic Weather Forecasting with Discrete Tokens", "summary": "Global medium-range weather forecasting must not only generate ensembles efficiently to characterize uncertainty in future states, but also serve downstream applications such as extreme-event warnings and cross-sphere coupled simulations. We introduce WeatherCraft, a framework that unifies probabilistic generation and reinforcement learning alignment through discrete weather tokens, bringing the GPT-style pretraining--post-training paradigm to global medium-range weather forecasting. A multiscale tokenizer represents atmospheric states as a coarse-to-fine token hierarchy, while a Transformer models causal dependencies across time and scale and predicts tokens within each scale in parallel. Direct sampling generates diverse ensembles, and exact token log-probabilities enable Group Relative Policy Optimization (GRPO) to maximize downstream task rewards without differentiating through evaluators or coupled models. On the ERA5 benchmark, WeatherCraft's eight-member ensemble mean reduces day-15 normalized RMSE by 17.6% relative to the strongest evaluated deterministic baseline and, with KV caching, achieves an approximately $18\\times$ inference speedup over GenCast. Direct fair-CRPS adaptation improves ensemble probabilistic skill, while reward-based post-training improves forecasts of persistent land temperature extremes and coupled ocean heat extremes. This work establishes discrete autoregressive modeling as a general foundation for scalable, task-alignable Earth system foundation models.", "link": "https://arxiv.org/abs/2611.25570", "authors": "Jinhan Li, Zhisheng Chen, Yuxuan Li, Yuan Gao, Fan Xu, Hao Wu, Jinlong Du, Kun Wang", "source": "arXiv", "published": "2026-11-19", "first_seen": "2026-11-24T14:57:46+00:00", "score": 52, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2603.02879", "title": "Disentangling regional impacts of joint teleconnections using causal representation learning", "summary": "Understanding teleconnections of large-scale modes of climate variability is relevant for seasonal predictability and support a dynamical understanding of climatic changes. While numerical model experiments are the most common approach for investigating counterfactual climate responses, their conclusions are subject to model biases. Data-driven approaches offer a complementary perspective. Deep learning can extract reduced-dimensional patterns but usually lacks causal interpretability, while causal methods can disentangle signals in the presence of confounding yet are typically based on simple indices. Treating dimensionality reduction and causal inference separately thereby risks losing the teleconnection signal of interest. This paper introduces DAG-VAE, a causal representation learning approach that embeds a physics-informed directed acyclic graph in the latent space of a variational autoencoder. Combining deep learning with causal inference, the method jointly learns nonlinear reduced representations of large-scale modes of variability and their causal interactions. We apply DAG-VAE to disentangle the influences of the Pacific and Indian Oceans on the short rains over the Greater Horn of Africa. Trained on seasonal hindcasts, the method identifies dynamically meaningful representations and recovers spatial response patterns consistent with SST-replacement experiments. Trained on reanalysis data, DAG-VAE identifies a different response pattern to direct influence of the tropical Pacific, highlighting potential model biases and the value of DAG-VAE as a complementary, dat", "link": "https://arxiv.org/abs/2603.02879", "authors": "Fiona R. Spuler, Marlene Kretschmer, Magdalena Alonso Balmaseda, Masilin Gudoshava, Theodore G. Shepherd", "source": "arXiv", "published": "2026-03-03", "first_seen": "2026-11-24T14:57:46+00:00", "score": 52, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["india", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-9-3751-2016", "title": "The Decadal Climate Prediction Project (DCPP) contribution to CMIP6", "summary": "The Decadal Climate Prediction Project (DCPP) is a coordinated multi-model investigation into decadal climate prediction, predictability, and variability. The DCPP makes use of past experience in simulating and predicting decadal variability and forced climate change gained from the fifth Coupled Model Intercomparison Project (CMIP5) and elsewhere. It builds on recent improvements in models, in the reanalysis of climate data, in methods of initialization and ensemble generation, and in data treatment and analysis to propose an extended comprehensive decadal prediction investigation as a contribution to CMIP6 (Eyring et al., 2016) and to the WCRP Grand Challenge on Near Term Climate Prediction (Kushnir et al., 2016). The DCPP consists of three components. Component A comprises the production and analysis of an extensive archive of retrospective forecasts to be used to assess and understand historical decadal prediction skill, as a basis for improvements in all aspects of end-to-end decadal prediction, and as a basis for forecasting on annual to decadal timescales. Component B undertakes ongoing production, analysis and dissemination of experimental quasi-real-time multi-model forecasts as a basis for potential operational forecast production. Component C involves the organization and coordination of case studies of particular climate shifts and variations, both natural and naturally forced (e.g. the “hiatus”, volcanoes), including the study of the mechanisms that determine these behaviours. Groups are invited to participate in as many or as few of the components of the DCPP,", "link": "https://doi.org/10.5194/gmd-9-3751-2016", "authors": "George J. Boer, Douglas M. Smith, Christophe Cassou, Francisco Doblas-Reyes, Gokhan Danabasoglu, Ben Kirtman, Yochanan Kushnir, Masahide Kimoto", "source": "Geoscientific Model Development", "published": "2016-10-25", "first_seen": "2026-11-24T14:57:46+00:00", "score": 52, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-26-0017.1", "title": "Climate Knowledge in Large Language Models", "summary": "Large language models (LLMs) are increasingly deployed for climate-related applications, where understanding internal climatological knowledge is important for assessing their reliability. Despite growing adoption, the capacity of LLMs to recall climate normals from parametric knowledge (information stored in the model’s weights, without external retrieval) remains largely uncharacterized. We investigate this capacity focusing on a prototypical query: July mean 2-m air temperature, 1991–2020, at specified locations. We construct a global grid of queries at 1° resolution land points, providing coordinates and location descriptors, and validate responses against ERA5 reanalysis. We further extend the evaluation to the 12 monthly normals for 4 of our best-performing LLMs on a subset of the grid. Results show that LLMs reproduce broad geographic regularities in climatological temperature fields, capturing latitudinal and topographic patterns, with July root-mean-square errors of 3°–6°C and biases of ±1°C; errors are comparable across the annual cycle. However, spatially coherent errors remain: Performance degrades sharply above 1500 m, where root-mean-square error (RMSE) reaches 5°–13°C compared to 2°–4°C at lower elevations. Including geographic context (country, city, region) reduces errors by 27% on average. While models capture the global mean magnitude of observed warming between 1950–74 and 2000–24, they fail to reproduce spatial patterns of temperature change. This limitation highlights that while LLMs may capture present-day climate distributions, they struggle to repre", "link": "https://doi.org/10.1175/aies-d-26-0017.1", "authors": "Ivan Kuznetsov, Jacopo Grassi, Dmitrii Pantiukhin, Boris Shapkin, Thomas Jung, Nikolay Koldunov", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 52, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-23-0090.1", "title": "Dynamical Tests of a Deep Learning Weather Prediction Model", "summary": "Global deep learning weather prediction models have recently been shown to produce forecasts that rival those from physics-based models run at operational centers. It is unclear whether these models have encoded atmospheric dynamics or simply pattern matching that produces the smallest forecast error. Answering this question is crucial to establishing the utility of these models as tools for basic science. Here, we subject one such model, Pangu-Weather, to a set of four classical dynamical experiments that do not resemble the model training data. Localized perturbations to the model output and the initial conditions are added to steady time-averaged conditions, to assess the propagation speed and structural evolution of signals away from the local source. Perturbing the model physics by adding a steady tropical heat source results in a classical Matsuno–Gill response near the heating and planetary waves that radiate into the extratropics. A localized disturbance on the winter-averaged North Pacific jet stream produces realistic extratropical cyclones and fronts, including the spontaneous emergence of polar lows. Perturbing the 500-hPa height field alone yields adjustment from a state of rest to one of wind–pressure balance over ∼6 h. Localized subtropical low pressure systems produce Atlantic hurricanes, provided the initial amplitude exceeds about 4 hPa, and setting the initial humidity to zero eliminates hurricane development. We conclude that the model encodes realistic physics in all experiments and suggest that it can be used as a tool for rapidly testing a wide range ", "link": "https://doi.org/10.1175/aies-d-23-0090.1", "authors": "Gregory J. Hakim, Sanjit Masanam", "source": "Artificial Intelligence for the Earth Systems", "published": "2024-7", "first_seen": "2026-11-24T14:57:46+00:00", "score": 52, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2019ea000819", "title": "Future Climate Projection in Northwest China With RegCM4.6", "summary": "An effective assessment of future climate change, especially future precipitation forecasting, is an important basis for the rational development of adaptive strategies for Northwest China, where the ecological environment is fragile and encompasses arid and semiarid regions. In this work, the performance of a regional climate model is assessed; then, climate changes in the near future (2018–2037), middle future (2050–2069), and distant future (2080–2099) are analyzed under representative concentration pathways (RCPs) RCP2.6, RCP4.5, and RCP8.5. The following conclusions are drawn: (1) Compared to the Met Office Hadley Centre Earth System (HadGEM2‐ES) global climate model, the latest regional climate model, RegCM4.6, with a community land model land surface process scheme and Tiedtke cumulus convective parameterization, can create a good simulation of the present‐day mean climatology over Northwest China, including temperature, precipitation, and climate extremes, and can also provide finer‐scale climate information in complex terrain and better correct the cold bias than HadGEM2‐ES. At the same time, RegCM4 inherited the bias from HadGEM2‐ES, for example, both the RegCM4 and the HadGEM2‐ES overestimated precipitation in DJF in the southeast of the study area. (2) The future near surface air temperature will experience continuous warming over Northwest China under the RCP8.5 scenario, and the warming will become more significant and exceed 6 °C by the end of the 21st century. In RegCM4, future precipitation will continue to increase and will increase by 50 mm by the end of ", "link": "https://doi.org/10.1029/2019ea000819", "authors": "X. D. Pan, L. Zhang, C. L. Huang", "source": "Earth and Space Science", "published": "2020-2", "first_seen": "2026-11-24T14:57:46+00:00", "score": 52, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-024-00834-8", "title": "Hybrid physics-AI outperforms numerical weather prediction for extreme precipitation nowcasting", "summary": "", "link": "https://doi.org/10.1038/s41612-024-00834-8", "authors": "Puja Das, August Posch, Nathan Barber, Michael Hicks, Kate Duffy, Thomas Vandal, Debjani Singh, Katie van Werkhoven", "source": "npj Climate and Atmospheric Science", "published": "2024-11-18", "first_seen": "2026-11-24T14:57:46+00:00", "score": 52, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr-d-21-0150.1", "title": "Machine Learning Methods for Postprocessing Ensemble Forecasts of Wind Gusts: A Systematic Comparison", "summary": "Postprocessing ensemble weather predictions to correct systematic errors has become a standard practice in research and operations. However, only a few recent studies have focused on ensemble postprocessing of wind gust forecasts, despite its importance for severe weather warnings. Here, we provide a comprehensive review and systematic comparison of eight statistical and machine learning methods for probabilistic wind gust forecasting via ensemble postprocessing that can be divided in three groups: state-of-the-art postprocessing techniques from statistics [ensemble model output statistics (EMOS), member-by-member postprocessing, isotonic distributional regression], established machine learning methods (gradient-boosting extended EMOS, quantile regression forests), and neural network–based approaches (distributional regression network, Bernstein quantile network, histogram estimation network). The methods are systematically compared using 6 years of data from a high-resolution, convection-permitting ensemble prediction system that was run operationally at the German weather service, and hourly observations at 175 surface weather stations in Germany. While all postprocessing methods yield calibrated forecasts and are able to correct the systematic errors of the raw ensemble predictions, incorporating information from additional meteorological predictor variables beyond wind gusts leads to significant improvements in forecast skill. In particular, we propose a flexible framework of locally adaptive neural networks with different probabilistic forecast types as output, which n", "link": "https://doi.org/10.1175/mwr-d-21-0150.1", "authors": "Benedikt Schulz, Sebastian Lerch", "source": "Monthly Weather Review", "published": "2022-1", "first_seen": "2026-11-24T14:57:46+00:00", "score": 52, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": ["Sebastian Lerch"], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1002/qj.70365", "title": "Development of a Transformer‐based cloud‐fraction parametrization scheme for the Korean Integrated Model", "summary": "CloudFormer is a deep‐learning‐based cloud‐fraction parametrization scheme designed to represent vertically resolved cloud fraction and to remain adaptable under changing climate conditions. The proposed CloudFormer builds on a Transformer encoder with self‐attention and introduces pressure‐aware positional encoding based on the logarithm of pressure to capture the atmosphere's physical stratification. Using European Centre for Medium‐Range Weather Forecasts Reanalysis v5 (ERA5) reanalysis data and a compact set of thermodynamic and microphysical variables, the model predicts full‐column cloud‐fraction profiles. To validate the effectiveness of the proposed model, we conduct sensitivity experiments over architectural variants and input variable sets. CloudFormer consistently outperforms conventional neural‐network baselines and widely used diagnostic cloud‐fraction schemes, yielding lower normalized root‐mean‐square error and better reproduction of the latitude–pressure structure of ERA5 cloudiness, including tropical deep convection and midlatitude frontal clouds. The best skill is obtained when cloud liquid, ice, and snow water content and temperature are used as predictors, whereas relative humidity is excluded, highlighting the dominant role of cloud water and the redundancy of composite variables such as relative humidity. An additional sensitivity analysis regarding the training period (detailed in the ) demonstrates that models updated with contemporary data exhibit further performance gains. This suggests that the proposed framework can effectively leverage the incr", "link": "https://doi.org/10.1002/qj.70365", "authors": "Hyeon‐Ju Jeon, Rae‐Seol Park, Gil Lee, Eun‐Jin Kim", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2026-11-24", "first_seen": "2026-11-24T14:57:46+00:00", "score": 52, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-24-0014.1", "title": "Random Forests’ Postprocessing Capability of Enhancing Predictive Skill on Subseasonal Time Scales—A Flow-Dependent View on Central European Winter Weather", "summary": "Weather predictions 2–4 weeks in advance, called the subseasonal time scale, are highly relevant for socioeconomic decision-makers. Unfortunately, the skill of numerical weather prediction models at this time scale is generally low. Here, we use probabilistic random forest (RF)-based machine learning models to postprocess the subseasonal to seasonal (S2S) reforecasts of the European Centre for Medium-Range Weather Forecasts (ECMWF). We show that these models are able to improve the forecasts slightly in a 20-winter mean at lead times of 14, 21, and 28 days for wintertime central European mean 2-m temperatures compared to the lead-time-dependent mean bias-corrected ECMWF’s S2S reforecasts and RF-based models using only reanalysis data as input. Predictions of the occurrence of cold wave days are improved at lead times of 21 and 28 days. Thereby, forecasts of continuous temperatures show a better skill than forecasts of binary occurrences of cold wave days. Furthermore, we analyze if the skill depends on the large-scale flow configuration of the atmosphere at initialization, as represented by weather regimes (WRs). We find that the WR at the start of the forecast influences the skill and its evolution across lead times. These results can be used to assess the conditional improvement of forecasts initialized during one WR in comparison to forecasts initialized during another WR. Significance Statement Forecasts of winter temperatures and cold waves 2–4 weeks in advance done by numerical weather prediction (NWP) models are often unsatisfactory due to the chaotic characteristics", "link": "https://doi.org/10.1175/aies-d-24-0014.1", "authors": "Selina M. Kiefer, Sebastian Lerch, Patrick Ludwig, Joaquim G. Pinto", "source": "Artificial Intelligence for the Earth Systems", "published": "2024-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 51, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": ["Sebastian Lerch"], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1029/2020gl090617", "title": "Increase in Compound Drought and Heatwaves in a Warming World", "summary": "Compound drought and heatwaves can cause significant damage to the environment, economy, and society. In this study, we quantify the spatio‐temporal changes in compound drought and heatwave (CDHW) events by integrating weekly self‐calibrated Palmer Drought Severity Index (sc_PDSI) and daily maximum temperatures during the period 1983 to 2016. Multiple data products are used to examine the robustness of sc_PDSI in the compound event analysis. The results consistently suggest significant increases in drought‐related heatwaves and affected global land area in recent (warmer) periods. Several regions across the globe witnessed rise in CDHW frequency (one to three events/year), duration (2–10 days/year), and severity. This increasing pattern is spatially asymmetric, and greater amplification is observed across the Northern hemisphere due to recent warming. Furthermore, the background aridity influences the spatiotemporal evolution of CDHW events. The results can be applied to minimize the impacts of extreme CDHWs in critical geographical regions.", "link": "https://doi.org/10.1029/2020gl090617", "authors": "Sourav Mukherjee, Ashok Kumar Mishra", "source": "Geophysical Research Letters", "published": "2021-1-9", "first_seen": "2026-11-24T14:57:46+00:00", "score": 51, "topics": ["Close to your work"], "watch": [], "boosts": ["extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-020-05306-2", "title": "Robust late twenty-first century shift in the regional monsoons in RegCM-CORDEX simulations", "summary": "We use an unprecedented ensemble of regional climate model (RCM) projections over seven regional CORDEX domains to provide, for the first time, an RCM-based global view of monsoon changes at various levels of increased greenhouse gas (GHG) forcing. All regional simulations are conducted using RegCM4 at a 25 km horizontal grid spacing using lateral and lower boundary forcing from three General Circulation Models (GCMs), which are part of the fifth phase of the Coupled Model Inter-comparison Project (CMIP5). Each simulation covers the period from 1970 through 2100 under two Representative Concentration Pathways (RCP2.6 and RCP8.5). Regional climate simulations exhibit high fidelity in capturing key characteristics of precipitation and atmospheric dynamics across monsoon regions in the historical period. In the future period, regional monsoons exhibit a spatially robust delay in the monsoon onset, an increase in seasonality, and a reduction in the rainy season length at higher levels of radiative forcing. All regions with substantial delays in the monsoon onset exhibit a decrease in pre-monsoon precipitation, indicating a strong connection between pre-monsoon drying and a shift in the monsoon onset. The weakening of latent heat driven atmospheric warming during the pre-monsoon period delays the overturning of atmospheric subsidence in the monsoon regions, which defers their transitioning into deep convective states. Monsoon changes under the RCP2.6 scenario are mostly within the baseline variability.", "link": "https://doi.org/10.1007/s00382-020-05306-2", "authors": "Moetasim Ashfaq, Tereza Cavazos, Michelle Simões Reboita, José Abraham Torres-Alavez, Eun-Soon Im, Christiana Funmilola Olusegun, Lincoln Alves, Kesondra Key", "source": "Climate Dynamics", "published": "2020-6-4", "first_seen": "2026-11-24T14:57:46+00:00", "score": 51, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["monsoon", "precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-023-06931-3", "title": "Climatology of near-surface wind speed from observational, reanalysis and high-resolution regional climate model data over the Tibetan Plateau", "summary": "As near-surface wind speed plays a role in regulating surface evaporation and thus the hydrological cycle, it is crucial to explore its spatio-temporal characteristics. However, in-situ measurements are scarce over the Tibetan Plateau, limiting the understanding of wind speed climate across this high-elevation region. This study explores the climatology of near-surface wind speed over the Tibetan Plateau by using for the first time homogenized observations together with reanalysis products and regional climate model simulations. Measuring stations across the center and the west of the plateau are at higher elevations and display higher mean and standard deviation, confirming that wind speed increases with increasing altitude. By exploring wind characteristics with a focus on seasonal cycle through cluster analysis, three regions of distinct wind regimes can be identified: (1) the central Tibetan Plateau, characterized by high elevation; (2) the eastern and the peripheral areas of the plateau; and (3) the Qaidam basin, a topographic depression strongly influenced by the blocking effect of the surrounding mountainous terrain. Notably, the ERA5 reanalysis, with its improvements in horizontal, vertical, and temporal spacing, model physics and data assimilation, demonstrates closer agreement to the measured wind conditions than its predecessor ERA-Interim. It successfully reproduces the three identified wind regimes. However, the newest ERA5-Land product does not show improvements compared to ERA5, most likely because they share most of the parametrizations. Furthermore, the two", "link": "https://doi.org/10.1007/s00382-023-06931-3", "authors": "Lorenzo Minola, Gangfeng Zhang, Tinghai Ou, Julia Kukulies, Julia Curio, Jose A. Guijarro, Kaiqiang Deng, Cesar Azorin-Molina", "source": "Climate Dynamics", "published": "2023-9-16", "first_seen": "2026-11-24T14:57:46+00:00", "score": 51, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-023-06745-3", "title": "How well do high-resolution Global Climate Models (GCMs) simulate tropical cyclones in the Bay of Bengal?", "summary": "Using six HighResMIP multi-ensemble GCMs (both the atmosphere-only and coupled versions) at 25 km resolution, the Tropical Cyclone (TC) activity over the Bay of Bengal (BoB) is examined in the present (1950–2014) climate. We use the Genesis Potential Index (GPI) to study the large-scale environmental conditions associated with the TC frequency in the models. Although the models struggle to reproduce the observed frequency and intensity of TCs, most models can capture the bimodal characteristics of the seasonal cycle of cyclones over the BoB (with fewer TCs during the pre-monsoon [April–May] than the post-monsoon [October–November] season). We find that GPI can capture the seasonal variation of the TC frequency over the BoB in both the observations and models. After calibrating the maximum sustained windspeeds in the models with IBTrACS, we find that like the observations the proportion of strong cyclones is also higher in the pre-monsoon than the post-monsoon. However, the inter-seasonal contrast of the proportion of strong cyclones between the pre-monsoon and post-monsoon seasons is reduced in almost all the models compared to the observations. The windshear term in GPI contributes the most to the model biases in all models during the post-monsoon season. This bias is caused by weakening of upper-level (200 hPa) easterlies in analysed models. During the pre-monsoon season, the environmental term in GPI dominating the model biases varies from model to model. When comparing the atmosphere-only and coupled versions of the models, a reduction of 0.5 °C in the sea surface tempe", "link": "https://doi.org/10.1007/s00382-023-06745-3", "authors": "Shammi Akhter, Christopher E. Holloway, Kevin Hodges, Benoit Vanniere", "source": "Climate Dynamics", "published": "2023-3-27", "first_seen": "2026-11-24T14:57:46+00:00", "score": 51, "topics": ["Climate Modelling"], "watch": [], "boosts": ["monsoon"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.26486", "title": "How Wet-Biased Datasets Shape the Training and Mislead the Evaluation of Generative Precipitation Nowcasting", "summary": "Generative models for precipitation nowcasting are trained and evaluated predominantly on wet-biased datasets, which over-represent precipitation events to emphasize rare extremes. Selecting test cases based on target observations is known to favor forecasts that match the selected distribution rather than the intended deployment distribution. We show analytically that the same target-dependent selection, applied to the training set, tilts the conditional distribution learned by an ideal generative model by exactly the factor that such an evaluation rewards. We test both evaluation and training effects with a satellite-to-radar diffusion model in a controlled experiment that crosses wet-biased and uniform sampling of the training and of the test set. The evaluation effect appears in full: the same model looks under-predictive on a wet-biased test set but over-predicts light rain on a deployment-consistent one, whichever way it was trained. Inverse probability weighting recovers the deployment scores from the wet-biased set. The training effect is real but partial: the model trained on wet-biased data forecasts more rain than its uniformly trained counterpart, yet remains far from calibrated even on a test set drawn like its training set, and gains skill for rain at a modest cost in calibration. Wet-biased training is thus a trade-off, not an error. Using classifier-free guidance as an example of a tuned quantity, we show how this misdirects model development: most scores on the wet-biased test set favor the largest guidance scale, whereas calibration, frequency bias, and a ", "link": "https://arxiv.org/abs/2610.26486", "authors": "Christoph Metzl, Stefan Kapsreiter, Kianusch Vahid Yousefnia, Virginia Poli, Richard Müller, Frank Krüger, Tobias Bölle", "source": "arXiv", "published": "2026-10-19", "first_seen": "2026-11-24T14:57:46+00:00", "score": 50, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme", "diffusion model"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/jame.20015", "title": "Atmospheric component of the MPI‐M Earth System Model: ECHAM6", "summary": "ECHAM6, the sixth generation of the atmospheric general circulation model ECHAM, is described. Major changes with respect to its predecessor affect the representation of shortwave radiative transfer, the height of the model top. Minor changes have been made to model tuning and convective triggering. Several model configurations, differing in horizontal and vertical resolution, are compared. As horizontal resolution is increased beyond T63, the simulated climate improves but changes are incremental; major biases appear to be limited by the parameterization of small‐scale physical processes, such as clouds and convection. Higher vertical resolution in the middle atmosphere leads to a systematic reduction in temperature biases in the upper troposphere, and a better representation of the middle atmosphere and its modes of variability. ECHAM6 represents the present climate as well as, or better than, its predecessor. The most marked improvements are evident in the circulation of the extratropics. ECHAM6 continues to have a good representation of tropical variability. A number of biases, however, remain. These include a poor representation of low‐level clouds, systematic shifts in major precipitation features, biases in the partitioning of precipitation between land and sea (particularly in the tropics), and midlatitude jets that appear to be insufficiently poleward. The response of ECHAM6 to increasing concentrations of greenhouse gases is similar to that of ECHAM5. The equilibrium climate sensitivity of the mixed‐resolution (T63L95) configuration is between 2.9 and 3.4 K and is", "link": "https://doi.org/10.1002/jame.20015", "authors": "Bjorn Stevens, Marco Giorgetta, Monika Esch, Thorsten Mauritsen, Traute Crueger, Sebastian Rast, Marc Salzmann, Hauke Schmidt", "source": "Journal of Advances in Modeling Earth Systems", "published": "2013-4-18", "first_seen": "2026-11-24T14:57:46+00:00", "score": 50, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022ms003474", "title": "Online Model Error Correction With Neural Networks in the Incremental 4D‐Var Framework", "summary": "Recent studies have demonstrated that it is possible to combine machine learning with data assimilation to reconstruct the dynamics of a physical model partially and imperfectly observed. The surrogate model can be defined as an hybrid combination where a physical model based on prior knowledge is enhanced with a statistical model estimated by a neural network (NN). The training of the NN is typically done offline, once a large enough data set of model state estimates is available. By contrast, with online approaches the surrogate model is improved each time a new system state estimate is computed. Online approaches naturally fit the sequential framework encountered in geosciences where new observations become available with time. In a recent methodology paper, we have developed a new weak‐constraint 4D‐Var formulation which can be used to train a NN for online model error correction. In the present article, we develop a simplified version of that method, in the incremental 4D‐Var framework adopted by most operational weather centers. The simplified method is implemented in the European Center for Medium‐Range Weather Forecasts (ECMWF) Object‐Oriented Prediction System, with the help of a newly developed Fortran NN library, and tested with a two‐layer two‐dimensional quasi geostrophic model. The results confirm that online learning is effective and yields a more accurate model error correction than offline learning. Finally, the simplified method is compatible with future applications to state‐of‐the‐art models such as the ECMWF Integrated Forecasting System.", "link": "https://doi.org/10.1029/2022ms003474", "authors": "Alban Farchi, Marcin Chrust, Marc Bocquet, Patrick Laloyaux, Massimo Bonavita", "source": "Journal of Advances in Modeling Earth Systems", "published": "2023-8-29", "first_seen": "2026-11-24T14:57:46+00:00", "score": 50, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2020ef001502", "title": "Projected Impacts of Climate Change on Drought Patterns Over East Africa", "summary": "Investigation of the pressing impacts of climate change on drought is vital for sustainable societal and ecosystem functioning. The magnitude of how much the drought will change and the way how droughts would affect society and the environment are inadequately addressed over East Africa. This study aimed at assessing future drought changes using an ensemble of five Global Climate Models (GCMs) in the Coupled Model Intercomparison Project (CMIP5) over East Africa. To this end, drought characteristics were investigated under the Representative Concentration Pathways (RCPs) 2.6, 4.5, and 8.5 in the near term (the 2020s; 2011–2040), midcentury (2050s; 2041–2070), and end of century (2080s; 2071–2,100). The changes of the Standardized Precipitation Index (SPI) and Standardized Precipitation‐Evapotranspiration Index (SPEI) were first compared, and the SPEI was used for measuring future droughts as it showed stronger changes due to its inclusion of temperature effects. Drought area in East Africa is likely to increase at the end of the 21st century by 16%, 36%, and 54% under RCP 2.6, 4.5, and 8.5, respectively, with the areas affected by extreme drought increasing more rapidly than severe and moderate droughts. Spatially, drought event, duration, frequency and intensity would increase in Sudan, Tanzania, Somalia, and South Sudan, but generally decrease in Kenya, Uganda, and Ethiopian highlands. Results also confirm that drought changes over East Africa follow the “dry gets drier and wet gets wetter” paradigm. The findings provide important guidance for improving identification of ", "link": "https://doi.org/10.1029/2020ef001502", "authors": "Gebremedhin Gebremeskel Haile, Qiuhong Tang, Seyed‐Mohammad Hosseini‐Moghari, Xingcai Liu, T. G. Gebremicael, Guoyong Leng, Asfaw Kebede, Ximeng Xu", "source": "Earth's Future", "published": "2020-6-25", "first_seen": "2026-11-24T14:57:46+00:00", "score": 50, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022jd036603", "title": "An Improved Cluster‐Wise Typhoon Rainfall Forecasting Model Based on Machine Learning and Deep Learning Models Over the Northwestern Pacific Ocean", "summary": "Though large amounts of work with artificial intelligence are used in typhoon rainfall forecasting, the predictive skills of existing models are unsatisfactory. To address this problem, this study aims to propose an improved cluster‐wise typhoon rainfall forecasting model that integrates the grid‐search cross‐validation method with machine learning and deep learning (DL) models including support vector machine (SVM), random forest (RF), adaptive boosting (AdaBoost), convolutional neural network (CNN), and long short‐term memory (LSTM). Grid‐search cross‐validation is a modified parameterization technique that helps to find the best parameters for machine/DL models. In the first stage, a second‐order polynomial regression model was used to cluster the typhoon track; and in the second stage, cluster‐wise typhoon rainfall was recognized within a 500 km radius from each typhoon center. After that, a modified cluster‐wise typhoon rainfall forecasting model was proposed using cluster‐wise antecedent hourly typhoon rainfall within this distance for 1–6 hr lead time. Results show that the proposed model based on the SVM, RF, AdaBoost, CNN, and LSTM is capable of providing more accurate forecasts (the efficiency of the forecast is increased by 45%–90%) than the existing typhoon rainfall forecasting models that are based on SVM with a genetic algorithm, RF, artificial neural network, multilayer perceptron network, and deep neural network. Therefore, the current study recommends using cluster‐wise typhoon rainfall forecasting model with a grid‐search cross‐validation method for disast", "link": "https://doi.org/10.1029/2022jd036603", "authors": "Md. Jalal Uddin, Yubin Li, Md. Abdus Sattar, Mingyang Liu, Nan Yang", "source": "JGR: Atmospheres", "published": "2022-7-12", "first_seen": "2026-11-24T14:57:46+00:00", "score": 50, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/2010waf2222426.1", "title": "Effects of Surface Heat and Moisture Exchange on ARW-WRF Warm-Season Precipitation Forecasts over the Central United States", "summary": "The evolution of the daytime planetary boundary layer (PBL) and its association with warm-season precipitation is strongly impacted by land–atmosphere heat and moisture exchange (hereafter surface exchange). However, substantial uncertainty exists in the parameterization of the surface exchange in numerical weather prediction (NWP) models. In the current study, the authors examine 0–24-h convection-permitting forecasts with different surface exchange strengths for a 6-day period during the International H2O Project (IHOP_2002). Results indicate sensitivity in the timing of simulated afternoon convection initiation and subsequent precipitation amounts to variations in surface exchange strength. Convection initiation in simulations with weak surface exchange was delayed by 2–3 h compared to simulations with strong surface exc
