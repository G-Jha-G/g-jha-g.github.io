 for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021ms002477", "title": "Machine Learning Emulation of Gravity Wave Drag in Numerical Weather Forecasting", "summary": "We assess the value of machine learning as an accelerator for the parameterization schemes of operational weather forecasting systems, specifically the parameterization of nonorographic gravity wave drag. Emulators of this scheme can be trained to produce stable and accurate results up to seasonal forecasting timescales. Generally, networks that are more complex produce emulators that are more accurate. By training on an increased complexity version of the existing parameterization scheme, we build emulators that produce more accurate forecasts. For medium range forecasting, we have found evidence that our emulators are more accurate than the version of the parametrization scheme that is used for operational predictions. Using the current operational CPU hardware, our emulators have a similar computational cost to the existing scheme, but are heavily limited by data movement. On GPU hardware, our emulators perform 10 times faster than the existing scheme on a CPU.", "link": "https://doi.org/10.1029/2021ms002477", "authors": "Matthew Chantry, Sam Hatfield, Peter Dueben, Inna Polichtchouk, Tim Palmer", "source": "Journal of Advances in Modeling Earth Systems", "published": "2021-7", "first_seen": "2026-11-26T13:59:01+00:00", "score": 55, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["emulator"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2019ef001469", "title": "Insights From CMIP6 for Australia's Future Climate", "summary": "Outputs from new state‐of‐the‐art climate models under the Coupled Model Inter‐comparison Project phase 6 (CMIP6) promise improvement and enhancement of climate change projections information for Australia. Here we focus on three key aspects of CMIP6: what is new in these models, how the available CMIP6 models evaluate compared to CMIP5, and their projections of the future Australian climate compared to CMIP5 focussing on the highest emissions scenario. The CMIP6 ensemble has several new features of relevance to policymakers and others, for example, the integrated matrix of socioeconomic and concentration pathways. The CMIP6 models show incremental improvements in the simulation of the climate in the Australian region, including a reduced equatorial Pacific cold tongue bias, slightly improved rainfall teleconnections with large‐scale climate drivers, improved representation of atmosphere and ocean extreme heat events, as well as dynamic sea level. However, important regional biases remain, evident in the excessive rainfall over the Maritime Continent and rainfall pattern biases in the nearby tropical convergence zones. Projections of Australian temperature and rainfall from the available CMIP6 ensemble broadly agree with those from CMIP5, except for a group of CMIP6 models with higher climate sensitivity and greater warming and increase in some extremes after 2050. CMIP6 rainfall projections are similar to CMIP5, but the ensemble examined has a narrower range of rainfall change in austral summer in Northern Australia and austral winter in Southern Australia. Overall, future", "link": "https://doi.org/10.1029/2019ef001469", "authors": "M. R. Grose, S. Narsey, F. P. Delage, A. J. Dowdy, M. Bador, G. Boschat, C. Chung, J. B. Kajtar", "source": "Earth's Future", "published": "2020-5", "first_seen": "2026-11-26T13:59:01+00:00", "score": 55, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024jd042224", "title": "Influence of Ground‐Based Microwave Radiometer Profile Assimilation on Fog Genesis Forecasts in the Winter Boundary Layer of Northern India", "summary": "This study investigates the synergistic impacts of conventional and non‐conventional atmospheric data assimilation (DA) and fine‐gridded soil state assimilation on wintertime fog formation over the Indo‐Gangetic Plain (IGP), with a specific focus on Delhi. Two DA experiments were conducted using the Weather Research and Forecasting (WRF) model: the first (DA1) assimilated temperature and humidity profiles from a microwave radiometer (MWR) using 3DVar/GSI‐based system, while second (DA2) extended DA1 by incorporating fine‐gridded initial soil fields from the High‐Resolution Land Data Assimilation System (HRLDAS). The effectiveness of these data sets in improving the forecast accuracy of wintertime meteorological parameters within the boundary layer was evaluated. MWR profiles were validated against simultaneous radiosonde (RS) measurements during the winter seasons of 2017–2019, and bias correction using RS data was implemented to enhance MWR profile accuracy. The results indicated that the assimilation of MWR profiles (DA1) improves the accuracy of near surface temperature and humidity forecasts, conducive for fog conditions. The inclusion of soil state assimilation (DA2) further improves the representation of soil states, thereby better capturing the physical processes associated with fog formation. With DA2, biases in near‐surface meteorological and soil variables were significantly reduced (50% in T 2 , 16% in RH 2 , 66% in SM, 46% in ST) compared to DA1. DA2 also improved the representation of surface fog heterogeneity and lifecycle across the IGP, with a spatial skill ", "link": "https://doi.org/10.1029/2024jd042224", "authors": "Avinash N. Parde, Sachin D. Ghude, V. S. Prasad, K. B. R. R. Hari Prasad, Narendra Gokul Dhangar, Prasanna Lonkar, R. K. Jenamani, Mrinal Biswas", "source": "JGR: Atmospheres", "published": "2025-5-7", "first_seen": "2026-11-26T13:59:01+00:00", "score": 55, "topics": ["Downscaling"], "watch": [], "boosts": ["india"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023jd038618", "title": "Performance of Regional Climate Model Precipitation Simulations Over the Terrain‐Complex Andes‐Amazon Transition Region", "summary": "Regional climate models (RCMs) are widely used to assess future impacts associated with climate change at regional and local scales. RCMs must represent relevant climate variables in the present‐day climate to be considered fit‐for‐purpose for impact assessment. This condition is particularly difficult to meet over complex regions such as the Andes‐Amazon transition region, where the Andean topography and abundance of tropical rainfall regimes remain a challenge for numerical climate models. In this study, we evaluate the ability of 30 regional climate simulations (6 RCMs driven by 10 global climate models) to reproduce historical (1981–2005) rainfall climatology and temporal variability over the Andes‐Amazon transition region. We assess spatio‐temporal features such as spatial distribution of rainfall, focusing on the orographic effects over the Andes‐Amazon “rainfall hotspots” region, and seasonal and interannual precipitation variability. The Eta RCM exhibits the highest spatial correlation (up to 0.6) and accurately reproduces mean annual precipitation and orographic precipitation patterns across the region, while some other RCMs have good performances at specific locations. Most RCMs simulate a wet bias over the highlands, particularly at the eastern Andean summits, as evidenced by the 100%–2,500% overestimations of precipitation in these regions. Annual cycles are well represented by most RCMs, but peak seasons are exaggerated, especially at equatorial locations. No RCM is particularly skillful in reproducing the interannual variability patterns. Results highlight ski", "link": "https://doi.org/10.1029/2023jd038618", "authors": "Ricardo A. Gutierrez, Clémentine Junquas, Elisa Armijos, Anna A. Sörensson, Jhan‐Carlo Espinoza", "source": "JGR: Atmospheres", "published": "2024-1-6", "first_seen": "2026-11-26T13:59:01+00:00", "score": 55, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-019-04664-w", "title": "Regionalization and parameterization of a hydrologic model significantly affect the cascade of uncertainty in climate-impact projections", "summary": "", "link": "https://doi.org/10.1007/s00382-019-04664-w", "authors": "Saeid Ashraf Vaghefi, Majid Iravani, David Sauchyn, Yuliya Andreichuk, Greg Goss, Monireh Faramarzi", "source": "Climate Dynamics", "published": "2019-2-9", "first_seen": "2026-11-26T13:59:01+00:00", "score": 55, "topics": ["Climate Modelling"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-21-0179.1", "title": "Forecasting Convection with a “Scale-Aware” Tiedtke Cumulus Parameterization Scheme at Kilometer Scales", "summary": "A scale-aware convective parameterization based on the Tiedtke scheme is developed and tested in the Weather Research and Forecasting (WRF) Model and the Model for Prediction Across Scales (MPAS) for a few convective cases at grid sizes in the ranges of 1.5–4.5 km. These tests demonstrate that the scale-aware scheme effectively reduces the outcome of deep convection by decreasing the convective portion of the total surface precipitation. When compared to the model runs that use microphysics without the cumulus parameterization at these grid sizes, the modified Tiedtke scheme is shown to improve some aspects of the precipitation forecasts. When the scheme is applied on a variable mesh in MPAS, it handles the convection across the mesh transition zones smoothly. Significance Statement Representing convection accounting for variations in the size of grid mesh is crucial in numerical models with variable resolutions, and in precipitation events where convection is not well depicted even by a model mesh of a few kilometers. Many convective parameterizations have already considered this grid-size dependency. This paper fills a gap by applying the same concept to a different convective parameterization, and evaluating it in a few precipitation forecast scenarios.", "link": "https://doi.org/10.1175/waf-d-21-0179.1", "authors": "Wei Wang", "source": "Weather and Forecasting", "published": "2022-8", "first_seen": "2026-11-26T13:59:01+00:00", "score": 55, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2022.26", "title": "DL4DS—Deep learning for empirical downscaling", "summary": "A common task in Earth Sciences is to infer climate information at local and regional scales from global climate models. Dynamical downscaling requires running expensive numerical models at high resolution, which can be prohibitive due to long model runtimes. On the other hand, statistical downscaling techniques present an alternative approach for learning links between the large- and local-scale climate in a more efficient way. A large number of deep neural network-based approaches for statistical downscaling have been proposed in recent years, mostly based on convolutional architectures developed for computer vision and super-resolution tasks. This paper presents deep learning for empirical downscaling (DL4DS), a python library that implements a wide variety of state-of-the-art and novel algorithms for downscaling gridded Earth Science data with deep neural networks. DL4DS has been designed with the goal of providing a general framework for training convolutional neural networks with configurable architectures and learning strategies to facilitate the conduction of comparative and ablation studies in a robust way. We showcase the capabilities of DL4DS on air quality Copernicus Atmosphere Monitoring Service (CAMS) data over the western Mediterranean area. The DL4DS library can be found in this repository: https://github.com/carlos-gg/dl4ds", "link": "https://doi.org/10.1017/eds.2022.26", "authors": "Carlos Alberto Gomez Gonzalez", "source": "Environmental Data Science", "published": "2023", "first_seen": "2026-11-26T13:59:01+00:00", "score": 55, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2026.10051", "title": "Calibrated conformal prediction intervals for microphysical process rates", "summary": "Conformal prediction (CP) can yield statistically valid prediction intervals for any regression model, with no model modifications and small computational costs. To assess its practical value, we apply conformal methods to quantify uncertainty in machine learning emulators of six microphysical process rates (MPRs). MPRs describe small-scale processes in atmospheric clouds such as precipitation formation and aerosol–cloud interactions and help understand weather and climate. The emulators are trained on simulation output from the ICOsahedral Nonhydrostatic (ICON) model in a limited-area numerical weather prediction configuration. We compare split CP for deterministic emulators with conformalized quantile regression (CQR) for quantile regression (QR) emulators. Both CP methods yield well-calibrated and sharp prediction intervals on average, but CQR provides more consistent intervals across several orders of magnitude, making it preferable for the uncertainty quantification of climate variables.", "link": "https://doi.org/10.1017/eds.2026.10051", "authors": "Miriam Simm, Corinna Hoose, Tom Beucler", "source": "Environmental Data Science", "published": "2026", "first_seen": "2026-11-26T13:59:01+00:00", "score": 55, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": ["Tom Beucler"], "boosts": ["precipitation", "emulator", "uncertainty"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": true, "cites": null}, {"key": "arxiv:2610.17896", "title": "Cumulus parameterization controls simulated rainfall more than microphysics, but not at heavy thresholds: a 3 * 2 factorial WRF study over the Western Himalaya", "summary": "Rainfall forecasts over the Western Himalaya remain poor, and the relative contributions of the cumulus and microphysics parameterizations to that error are not well constrained.", "link": "https://arxiv.org/abs/2610.17896", "authors": "Satyam Kumar, Akshay Sunil, Devesh Sheoran", "source": "arXiv", "published": "2026-10-13", "first_seen": "2026-11-26T13:59:01+00:00", "score": 54, "topics": ["Climate Modelling"], "watch": [], "boosts": ["himalaya"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.24665", "title": "Permafrost augmented simulation and forecast using hybrid modeling through spectral neural networks", "summary": "Purpose - Global warming is impacting several crucial Earth systems, including the permafrost. This study investigates the possibility of performing fast and reliable simulation and forecasting of permafrost behavior, addressing a critical gap in the existing literature related to high computation times and energy costs of the simulations. Methodology - A numerical cryohydrogeological study on water and energy transfer in a forested, continuous permafrost site has been conducted using parallel high-performance computing to simulate the permafrost dynamics. The numerical results reasonably replicate the measured soil temperature profiles and the dynamics of infiltrated waters. This work uses a spectral network to achieve a fast, reliable, and stable surrogate model for the simulations to forecast over long periods of time. The surrogate is also enhanced by assimilating experimental data through the development of a hybrid modeling framework. Findings - The proposed approach improves the physical simulation while maintaining the stability of the dynamic model over long periods of time. The results reveal that the proposed hybrid modeling remains stable in integration and forecasting. The final hybrid solution demonstrates a significant improvement in simulation accuracy when tested against a test set of measurements. Predictions of the permafrost behavior in the coming decade are later made based on the CMIP6 climate change scenarios. Originality - This research offers a novel perspective on permafrost modeling that extends the current understanding of its behavior under diff", "link": "https://arxiv.org/abs/2610.24665", "authors": "Chady Ghnatios, Thibault Xavier, Anatoly S. Prokushkin, Laurent Orgogozo, Francisco Chinesta", "source": "arXiv", "published": "2026-10-17", "first_seen": "2026-11-26T13:59:01+00:00", "score": 54, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2605.25161", "title": "FMSIM: A Multimodal Flow Matching Framework for Conditional Geomodeling", "summary": "Subsurface geomodeling plays a critical role in reservoir characterization, uncertainty quantification, and subsurface flow prediction. However, integrating heterogeneous sources of geological information, including conceptual geological descriptions, sparse well observations, and spatial prior constraints, remains a significant challenge for traditional geostatistical and data-driven geomodeling approaches. In this study, we present FMSIM, a multi-modal conditional flow matching framework for subsurface facies model generation. FMSIM utilizes a deep learning formulation to learn a velocity field that transports samples from a simple prior distribution to a complex geological facies distribution. Global geological semantic information is incorporated through a learned semantic representation framework and a learned prior model, while local hard constraints are enforced via an iterative projection strategy during sampling to ensure 100% fidelity to well observations. Additionally, a temporal guidance gating mechanism is introduced to regulate the influence of spatial probability maps, balancing large-scale trend alignment with fine-scale geological variability. Benefiting from the framework design, the model enables efficient and stable training with a simple loss function. The framework's fully convolutional architecture also demonstrates promising generalization to moderately larger grid sizes not seen during training without retraining. Results on a synthetic fluvial channel dataset indicate that FMSIM captures complex non-stationary geological features and produces geolo", "link": "https://arxiv.org/abs/2605.25161", "authors": "Jiayuan Huang, Suihong Song, Tapan Mukerji", "source": "arXiv", "published": "2026-05-24", "first_seen": "2026-11-26T13:59:01+00:00", "score": 54, "topics": ["Deep Learning"], "watch": [], "boosts": ["flow matching", "uncertainty"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2602.05083", "title": "Large-Ensemble Simulations Reveal Links Between Atmospheric Blocking Frequency and Sea Surface Temperature Variability", "summary": "Atmospheric blocking events drive persistent weather extremes in midlatitudes, but isolating the influence of sea surface temperature (SST) from chaotic internal atmospheric variability on these events remains a challenge. We address this challenge using century-long (1900-2010), large-ensemble simulations with two computationally efficient deep-learning general circulation models. We find these models skillfully reproduce the observed blocking climatology, matching or exceeding the performance of a traditional high-resolution model and representative CMIP6 models. Averaging the large ensembles filters internal atmospheric noise to isolate the SST-forced component of blocking variability, yielding substantially higher correlations with reanalysis than for individual ensemble members. We identify robust teleconnections linking Greenland blocking frequency to North Atlantic SST and El Niño-like patterns. Furthermore, SST-forced trends in blocking frequency show a consistent decline in winter over Greenland, and an increase over Europe. These results demonstrate that SST variability exerts a significant and physically interpretable influence on blocking frequency and establishes large ensembles from deep learning models as a powerful tool for separating forced SST signals from internal noise.", "link": "https://arxiv.org/abs/2602.05083", "authors": "Zilu Meng, Gregory J. Hakim, Wenchang Yang, Gabriel A. Vecchi", "source": "arXiv", "published": "2026-02-04", "first_seen": "2026-11-26T13:59:01+00:00", "score": 54, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["cmip6", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-9-3461-2016", "title": "The Scenario Model Intercomparison Project (ScenarioMIP) for CMIP6", "summary": "Projections of future climate change play a fundamental role in improving understanding of the climate system as well as characterizing societal risks and response options. The Scenario Model Intercomparison Project (ScenarioMIP) is the primary activity within Phase 6 of the Coupled Model Intercomparison Project (CMIP6) that will provide multi-model climate projections based on alternative scenarios of future emissions and land use changes produced with integrated assessment models. In this paper, we describe ScenarioMIP's objectives, experimental design, and its relation to other activities within CMIP6. The ScenarioMIP design is one component of a larger scenario process that aims to facilitate a wide range of integrated studies across the climate science, integrated assessment modeling, and impacts, adaptation, and vulnerability communities, and will form an important part of the evidence base in the forthcoming Intergovernmental Panel on Climate Change (IPCC) assessments. At the same time, it will provide the basis for investigating a number of targeted science and policy questions that are especially relevant to scenario-based analysis, including the role of specific forcings such as land use and aerosols, the effect of a peak and decline in forcing, the consequences of scenarios that limit warming to below 2 °C, the relative contributions to uncertainty from scenarios, climate models, and internal variability, and long-term climate system outcomes beyond the 21st century. To serve this wide range of scientific communities and address these questions, a design has been", "link": "https://doi.org/10.5194/gmd-9-3461-2016", "authors": "Brian C. O'Neill, Claudia Tebaldi, Detlef P. van Vuuren, Veronika Eyring, Pierre Friedlingstein, George Hurtt, Reto Knutti, Elmar Kriegler", "source": "Geoscientific Model Development", "published": "2016-9-28", "first_seen": "2026-11-26T13:59:01+00:00", "score": 54, "topics": ["Climate Modelling"], "watch": ["Veronika Eyring"], "boosts": ["cmip6", "uncertainty"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1175/aies-d-26-0005.1", "title": "Progress toward Forecasting Excessive Rainfall with Random Forests Based on a Deterministic Convection-Allowing Model", "summary": "Machine learning applied to high-resolution numerical weather prediction forecasts is gaining popularity for prediction of high-impact weather events, but questions remain on how to design such systems. Building off prior work, we describe sensitivity experiments using a random forest (RF) system for excessive rainfall prediction using the deterministic High-Resolution Rapid Refresh (HRRR). We find that applying an RF trained on HRRRv3 to daily forecasts from HRRRv4 does not significantly degrade results. In terms of the spatial aggregation of predictor information for the RF, we find that forecasts are significantly improved when the system uses data from all nearby model grid points, rather than just sparse input points, particularly for events featuring small-scale precipitation maxima. Forecasts are also improved when predictors are averaged across multiple HRRR initializations rather than taken from a single HRRR initialization, as the RF is better able to learn relationships with the reduced uncertainty of the time-lagged ensemble mean predictors. The HRRR-based RF was evaluated during the Flash Flood and Intense Rainfall (FFaIR) experiment over three consecutive years, with year-over-year improvements in the system. The HRRR-based RF exhibits an underprediction bias, partially attributable to using a more comprehensive dataset of excessive rainfall for verification than for RF training. Evaluation of RF skill during more than 4 years of real-time forecasts reveals that RFs based on deterministic convection-allowing models continue to underperform relative to a Global", "link": "https://doi.org/10.1175/aies-d-26-0005.1", "authors": "Eric P. James, Russ S. Schumacher", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 54, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-23-0093.1", "title": "Evidential Deep Learning: Enhancing Predictive Uncertainty Estimation for Earth System Science Applications", "summary": "Robust quantification of predictive uncertainty is a critical addition needed for machine learning applied to weather and climate problems to improve the understanding of what is driving prediction sensitivity. Ensembles of machine learning models provide predictive uncertainty estimates in a conceptually simple way but require multiple models for training and prediction, increasing computational cost and latency. Parametric deep learning can estimate uncertainty with one model by predicting the parameters of a probability distribution but does not account for epistemic uncertainty. Evidential deep learning, a technique that extends parametric deep learning to higher-order distributions, can account for both aleatoric and epistemic uncertainties with one model. This study compares the uncertainty derived from evidential neural networks to that obtained from ensembles. Through applications of the classification of winter precipitation type and regression of surface-layer fluxes, we show evidential deep learning models attaining predictive accuracy rivaling standard methods while robustly quantifying both sources of uncertainty. We evaluate the uncertainty in terms of how well the predictions are calibrated and how well the uncertainty correlates with prediction error. Analyses of uncertainty in the context of the inputs reveal sensitivities to underlying meteorological processes, facilitating interpretation of the models. The conceptual simplicity, interpretability, and computational efficiency of evidential neural networks make them highly extensible, offering a promising a", "link": "https://doi.org/10.1175/aies-d-23-0093.1", "authors": "John S. Schreck, David John Gagne, Charlie Becker, William E. Chapman, Kim Elmore, Da Fan, Gabrielle Gantos, Eliot Kim", "source": "Artificial Intelligence for the Earth Systems", "published": "2024-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 54, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024ef005495", "title": "Spatially and Seasonally Differentiated Response of Soil Moisture Droughts to Climate Change in Germany", "summary": "Global warming is altering soil moisture (SM) droughts in Europe with a strong drying trend projected in the Mediterranean and wetting trends projected in Scandinavia. Central Europe, including Germany, lies in a transitional zone showing weaker and diverging change signals exposing the region to uncertainties. The recent extreme drought years in Germany, which resulted in multi‐sectoral impacts accounting to combined drought and heat damages of 35 billion Euros and large scale forest losses, underline the relevance of studying future changes in SM droughts. To analyze the projected SM drought changes and associated uncertainties in Germany, we utilize a large ensemble of 57 bias‐adjusted and spatially disaggregated regional climate model simulations to run the hydrologic model mHM at a high spatial resolution of approximately 1.2 km. We show that projections of future changes in soil moisture droughts over Germany depend on the emission scenario, the soil depth and the timing during the vegetation growing period. Most robust and widespread increases in soil moisture drought intensities are projected for upper soil layers in the late growing season (July–September) under the high emission scenario. There are greater uncertainties in the changes in soil moisture droughts in the early vegetation growing period (April–June). We find stronger imprints of changes in meteorological drivers controlling the spatial disparities of SM droughts than regional diversity in physio‐geographic landscape properties. Our study provides nuanced insights into SM drought changes for an importan", "link": "https://doi.org/10.1029/2024ef005495", "authors": "Friedrich Boeing, Sabine Attinger, Thorsten Wagener, Oldrich Rakovec, Luis Samaniego, Stephan Thober, Julian Schlaak, Sebastian Müller", "source": "Earth's Future", "published": "2025-5", "first_seen": "2026-11-26T13:59:01+00:00", "score": 54, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2020jd034483", "title": "Changes in Unevenness of Wet‐Day Precipitation Over China During 1961–2020", "summary": "Precipitation falls unevenly in space and time, which has significant consequences for human society and natural ecosystems. Based on 2,134 gauged observations during 1961–2020 and historical simulations of 14 models participating in the Coupled Model Intercomparison Project Phase 6 (CMIP6), we analyze precipitation unevenness over China in terms of the spatiotemporal distribution of wet days (>1 mm) and wet‐day precipitation amount throughout the year. We also explore precipitation extremes related to the unevenness. Spatially, precipitation shows medium unevenness in China. Temporally, the unevenness in distribution of wet days increases from southeast (generally humid) to northwest (generally arid). This temporal unevenness weakened in large parts of western China during 1991–2020 relative to 1961–1990. As for precipitation amount, the distribution of precipitation that falls on wet days is more uneven in water‐limited regions compared with humid regions. Associated with this unevenness, between 1961 and 2020, the top 50% of annual precipitation fell in approximately the 12 wettest days, and the maximum 1‐day precipitation for the year contributed 10% on average to annual precipitation. The period 1991–2020 shows overall greater unevenness in eastern China and less unevenness in western China relative to the first 30 years. Multimodel ensemble means of CMIP6 simulations agree with the basic spatial pattern of observations, while underestimating the magnitude of temporal unevenness of precipitation. If these regional differences in precipitation unevenness were to persist", "link": "https://doi.org/10.1029/2020jd034483", "authors": "Jingya Han, Chiyuan Miao, Qingyun Duan, Jingwen Wu, Jiaojiao Gou, Haiyan Zheng", "source": "JGR: Atmospheres", "published": "2021-9-30", "first_seen": "2026-11-26T13:59:01+00:00", "score": 54, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2018jd029571", "title": "The Sensitivity of Terrestrial δ 18 O Gradients to Hydroclimate Evolution", "summary": "Terrestrial gradients in the oxygen isotopic composition of meteoric water ( δ 18 O ), as reconstructed through proxies, reflect characteristics of ancient hydrologic conditions. These gradients are primarily influenced by the atmospheric transport of water vapor and the balance of precipitation and evapotranspiration, which are linked to climate and topography. We incorporate these effects into a one‐dimensional model that predicts the spatial evolution of δ 18 O based on local topography and the regional water‐energy budget. Specifically, we build on existing reactive transport models by incorporating parameterizations of orographic precipitation and energetic constraints on evapotranspiration following the Budyko water balance framework. We test our model on three modern transects that represent topographically distinct environments. These are the Amazon Basin (lowlands), the Cascade Range (mountains), and the eastern Himalayan Range (lowlands and mountains). Comparisons among these gradients demonstrate that the topographic regime determines how sensitive isotope records are to hydroclimate evolution. As a result, isotope records differentially express signatures of topography and the regional water balance, and we present a quantitative framework to predict this trade‐off. Finally, we link these effects to climate evolution and discuss how our model may help disentangle topographic and climatic signals through Earth history.", "link": "https://doi.org/10.1029/2018jd029571", "authors": "Tyler Kukla, Matthew J. Winnick, Kate Maher, Daniel E. Ibarra, C. Page Chamberlain", "source": "JGR: Atmospheres", "published": "2019-1-21", "first_seen": "2026-11-26T13:59:01+00:00", "score": 54, "topics": ["Climate Modelling"], "watch": [], "boosts": ["himalaya", "precipitation"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-024-07257-4", "title": "The added value of simulated near-surface wind speed over the Alps from a km-scale multimodel ensemble", "summary": "The advancement of computational resources has allowed researchers to run convection-permitting regional climate model (CPRCM) simulations. A pioneering effort promoting a multimodel ensemble of such simulations is the CORDEX Flagship Pilot Studies (FPS) on “Convective Phenomena over Europe and the Mediterranean” over an extended Alps region. In this study, the Distribution Added Value metric is used to determine the improvement of the representation of all available FPS hindcast simulations for the daily mean near-surface wind speed. The analysis is performed on normalized empirical probability distributions and considers station observation data as the reference. The use of a normalized metric allows for spatial comparison among the different regions (coast and inland), altitudes and seasons. This approach permits a direct assessment of the added value between the CPRCM simulations against their global driving reanalysis (ERA-Interim) and respective coarser resolution regional model counterparts. In general, the results show that CPRCMs add value to their global driving reanalysis or forcing regional model, due to better-resolved topography or through better representation of ocean-land contrasts. However, the nature and magnitude of the improvement in the wind speed representation vary depending on the model, the season, the altitude, or the region. Among seasons, the improvement is usually larger in summer than winter. CPRCMs generally display gains at low and medium-range altitudes. In addition, despite some shortcomings in comparison to ERA-Interim, which can be attri", "link": "https://doi.org/10.1007/s00382-024-07257-4", "authors": "M. O. Molina, J. M. Careto, C. Gutiérrez, E. Sánchez, K. Goergen, S. Sobolowski, E. Coppola, E. Pichelli", "source": "Climate Dynamics", "published": "2024-5-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 54, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": { prediction of forced responses of both the mean and variance.", "link": "https://arxiv.org/abs/2611.09317", "authors": "Mario Massy, Sara Shamekh, Fabrizio Falasca, Matthieu Blanke", "source": "arXiv", "published": "2026-11-06", "first_seen": "2026-11-26T13:59:01+00:00", "score": 53, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["emulator"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.25545", "title": "Beyond the record: evaluating probabilistic AI weather forecasts deep in the tail", "summary": "Can probabilistic artificial intelligence (AI) weather forecasts retain skill beyond their training domain? We compare four state-of-the-art AI models (ArchesWeatherGen, U-Cast, WeatherNext2 and GenCast-mini) with the physics-based IFS-ENS over land in 2022, at 1.5° resolution and lead times of 2--10 days. Monthly ERA5 records from 1979--2021 define common historical boundaries, and we characterize new records set in 2022 by their depth, i.e., the exceedance margin relative to local historical variability. Two proper scores, record-threshold weighted CRPS and Brier score, assess the magnitude and probability of record exceedances across all eligible cases, retaining both missed extremes and false alarms. Verified against ERA5, AI models outperform IFS-ENS for heat and cold records at almost every lead and depth. For heat, the advantage strengthens with depth, partly because IFS-ENS over-forecasts deep records, and largely persists for deeper records under HRES-fc0 verification. For wind, gains erode for deeper records and longer leads. Better tail scores can nevertheless coexist with aggregate probability deficits or surpluses, and some improvements arise chiefly on non-exceedances. Increasing underprediction on progressively more extreme observed subsets can also arise through outcome selection, even for an ideal conditional-mean forecast. These findings establish that native probabilistic AI ensembles retain, and for heat increase, their advantage over IFS-ENS as thresholds move beyond local records, although all advantages narrow with lead time. They caution against gene", "link": "https://arxiv.org/abs/2610.25545", "authors": "Bastiaan Van Velthoven, Cas Decancq, Diego G. Miralles, Stijn Luca, Thomas Mortier", "source": "arXiv", "published": "2026-10-18", "first_seen": "2026-11-26T13:59:01+00:00", "score": 53, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-9-3751-2016", "title": "The Decadal Climate Prediction Project (DCPP) contribution to CMIP6", "summary": "The Decadal Climate Prediction Project (DCPP) is a coordinated multi-model investigation into decadal climate prediction, predictability, and variability. The DCPP makes use of past experience in simulating and predicting decadal variability and forced climate change gained from the fifth Coupled Model Intercomparison Project (CMIP5) and elsewhere. It builds on recent improvements in models, in the reanalysis of climate data, in methods of initialization and ensemble generation, and in data treatment and analysis to propose an extended comprehensive decadal prediction investigation as a contribution to CMIP6 (Eyring et al., 2016) and to the WCRP Grand Challenge on Near Term Climate Prediction (Kushnir et al., 2016). The DCPP consists of three components. Component A comprises the production and analysis of an extensive archive of retrospective forecasts to be used to assess and understand historical decadal prediction skill, as a basis for improvements in all aspects of end-to-end decadal prediction, and as a basis for forecasting on annual to decadal timescales. Component B undertakes ongoing production, analysis and dissemination of experimental quasi-real-time multi-model forecasts as a basis for potential operational forecast production. Component C involves the organization and coordination of case studies of particular climate shifts and variations, both natural and naturally forced (e.g. the “hiatus”, volcanoes), including the study of the mechanisms that determine these behaviours. Groups are invited to participate in as many or as few of the components of the DCPP,", "link": "https://doi.org/10.5194/gmd-9-3751-2016", "authors": "George J. Boer, Douglas M. Smith, Christophe Cassou, Francisco Doblas-Reyes, Gokhan Danabasoglu, Ben Kirtman, Yochanan Kushnir, Masahide Kimoto", "source": "Geoscientific Model Development", "published": "2016-10-25", "first_seen": "2026-11-26T13:59:01+00:00", "score": 53, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-26-0017.1", "title": "Climate Knowledge in Large Language Models", "summary": "Large language models (LLMs) are increasingly deployed for climate-related applications, where understanding internal climatological knowledge is important for assessing their reliability. Despite growing adoption, the capacity of LLMs to recall climate normals from parametric knowledge (information stored in the model’s weights, without external retrieval) remains largely uncharacterized. We investigate this capacity focusing on a prototypical query: July mean 2-m air temperature, 1991–2020, at specified locations. We construct a global grid of queries at 1° resolution land points, providing coordinates and location descriptors, and validate responses against ERA5 reanalysis. We further extend the evaluation to the 12 monthly normals for 4 of our best-performing LLMs on a subset of the grid. Results show that LLMs reproduce broad geographic regularities in climatological temperature fields, capturing latitudinal and topographic patterns, with July root-mean-square errors of 3°–6°C and biases of ±1°C; errors are comparable across the annual cycle. However, spatially coherent errors remain: Performance degrades sharply above 1500 m, where root-mean-square error (RMSE) reaches 5°–13°C compared to 2°–4°C at lower elevations. Including geographic context (country, city, region) reduces errors by 27% on average. While models capture the global mean magnitude of observed warming between 1950–74 and 2000–24, they fail to reproduce spatial patterns of temperature change. This limitation highlights that while LLMs may capture present-day climate distributions, they struggle to repre", "link": "https://doi.org/10.1175/aies-d-26-0017.1", "authors": "Ivan Kuznetsov, Jacopo Grassi, Dmitrii Pantiukhin, Boris Shapkin, Thomas Jung, Nikolay Koldunov", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 53, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-7-89-2026", "title": "Considerable yet contrasting regional imprint of circulation change on summer temperature trends across the Northern hemisphere mid-latitudes", "summary": "Rising summer temperatures and more frequent heat extremes are well-documented outcomes of anthropogenic climate change. However, the extent to which atmospheric circulation changes contribute to these trends remains contested. Regional differences across the northern mid-latitudes suggest that circulation plays a role, yet robustly quantifying its contribution over multiple decades is very challenging. We address this by systematically testing statistical and machine learning methods that decompose temperature signals into a thermodynamic and a dynamic contribution against climate model simulations. Specifically, we use unforced simulations with circulation nudged to match a forced simulation that includes anthropogenic emissions and land-use change. We apply decomposition methods to the forced simulations and compare their estimates of circulation-induced trends with those found in nudged circulation simulations. Our analysis reveals that most methods accurately identify the sign of circulation-induced changes in temperature, although they consistently underestimate their magnitude. Despite this limitation, the results demonstrate that circulation changes have made a substantial contribution to summer temperature trends across the northern mid-latitudes. In Europe, a hotspot region, we estimate that up to half of the observed summer warming between 1979 and 2023 can be attributed to circulation trends. Furthermore, circulation trends have contributed to warmer summer temperatures over Western North America, Central Siberia, Mongolia, Central China, and northeastern Canada", "link": "https://doi.org/10.5194/wcd-7-89-2026", "authors": "Peter Pfleiderer, Anna Merrifield, István Dunkl, Homer Durand, Enora Cariou, Julien Cattiaux, Gustau Camps-Valls, Sebastian Sippel", "source": "Weather and Climate Dynamics", "published": "2026-1-15", "first_seen": "2026-11-26T13:59:01+00:00", "score": 53, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/1520-0434(2003)018<0918:sopfss>2.0.co;2", "title": "Sensitivity of Precipitation Forecast Skill Scores to Bilinear Interpolation and a Simple Nearest-Neighbor Average Method on High-Resolution Verification Grids", "summary": "", "link": "https://doi.org/10.1175/1520-0434(2003)018<0918:sopfss>2.0.co;2", "authors": "Christophe Accadia, Stefano Mariani, Marco Casaioli, Alfredo Lavagnini, Antonio Speranza", "source": "Weather and Forecasting", "published": "2003-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 53, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.11066", "title": "Rescene-ESM: an Earth system model built around a frozen AI weather model", "summary": "Earth system models underpin climate projections, but their cost limits how many scenarios, ensemble members and impact pathways can be explored. Machine-learning weather models forecast as skillfully as physics-based models at a fraction of the cost, yet coupled to an ocean they have produced weak El Nino variability or have learned it from climate-model output, and none carries the climate through rivers to the people exposed to it. Here we present Rescene-ESM, an Earth system model whose coupler, YAHO, yokes a frozen 20.8-million-parameter AI weather model to physically formulated ocean, sea-ice, land, river, carbon and energy components constrained by observations. Adding the couplings one at a time shows what each contributes: over a climatological ocean the AI atmosphere varies from year to year by a third of the observed amount over the oceans, and an interactive mixed layer, an equatorial wave ocean, the residual of the observed sea surface temperature (SST) equation as stochastic forcing and the land's moisture flux raise this step by step and bring El Nino and its teleconnections, leaving the mean climate almost unchanged. The full model simulates about 1,000 years per day on one graphics processing unit, holds the observed climate for a thousand years without drift, reproduces the observed 1979-2022 global warming, carries forced change with a physically based structure around the frozen network (transient climate response 1.60 K), routes runoff to 212 river gauges with a median seasonal-cycle correlation of 0.79 and, driven by emissions, separates the heatwave e", "link": "https://arxiv.org/abs/2611.11066", "authors": "Minjong Cheon, Kaoru Kakinuma", "source": "arXiv", "published": "2026-11-08", "first_seen": "2026-11-26T13:59:01+00:00", "score": 52, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.34101", "title": "AlignPre: Skill-Aligned Post-Training for Latent-Free Generative Precipitation Nowcasting", "summary": "Precipitation nowcasting requires accurate short-term predictions under rapidly evolving spatiotemporal dynamics. Generative diffusion models can produce detailed and competitive radar forecasts by modeling conditional distributions. However, most existing approaches rely on separately trained components, such as deterministic branches or latent compression modules. More fundamentally, distribution matching alone fails to explicitly optimize operational forecast skill. We propose AlignPre, a streamlined pixel-space nowcasting framework that bridges this gap via skill-aligned post-training (SAPT). AlignPre employs an end-to-end flow-matching forecaster with a hierarchical spatiotemporal architecture for distribution matching and direct radar-field synthesis, without latent compression. During post-training, SAPT exploits the analytic structure of forecast verification scores to construct a differentiable objective. By backpropagating gradients of this objective from radar fields to the generator, SAPT turns forecast verification into direct training feedback. Across three real-world benchmarks spanning different forecast horizons, AlignPre consistently surpasses state-of-the-art deterministic and generative baselines in forecast skill, demonstrating that aligning generative modeling with domain-specific verification provides an effective paradigm for meteorological forecasting.", "link": "https://arxiv.org/abs/2611.34101", "authors": "Demin Yu, Kenghong Lin, Xutao Li", "source": "arXiv", "published": "2026-11-25", "first_seen": "2026-11-26T13:59:01+00:00", "score": 52, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "flow matching", "diffusion model"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.25570", "title": "Reinforcement-Aligned Probabilistic Weather Forecasting with Discrete Tokens", "summary": "Global medium-range weather forecasting must not only generate ensembles efficiently to characterize uncertainty in future states, but also serve downstream applications such as extreme-event warnings and cross-sphere coupled simulations. We introduce WeatherCraft, a framework that unifies probabilistic generation and reinforcement learning alignment through discrete weather tokens, bringing the GPT-style pretraining--post-training paradigm to global medium-range weather forecasting. A multiscale tokenizer represents atmospheric states as a coarse-to-fine token hierarchy, while a Transformer models causal dependencies across time and scale and predicts tokens within each scale in parallel. Direct sampling generates diverse ensembles, and exact token log-probabilities enable Group Relative Policy Optimization (GRPO) to maximize downstream task rewards without differentiating through evaluators or coupled models. On the ERA5 benchmark, WeatherCraft's eight-member ensemble mean reduces day-15 normalized RMSE by 17.6% relative to the strongest evaluated deterministic baseline and, with KV caching, achieves an approximately $18\\times$ inference speedup over GenCast. Direct fair-CRPS adaptation improves ensemble probabilistic skill, while reward-based post-training improves forecasts of persistent land temperature extremes and coupled ocean heat extremes. This work establishes discrete autoregressive modeling as a general foundation for scalable, task-alignable Earth system foundation models.", "link": "https://arxiv.org/abs/2611.25570", "authors": "Jinhan Li, Zhisheng Chen, Yuxuan Li, Yuan Gao, Fan Xu, Hao Wu, Jinlong Du, Kun Wang", "source": "arXiv", "published": "2026-11-19", "first_seen": "2026-11-26T13:59:01+00:00", "score": 52, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2603.02879", "title": "Disentangling regional impacts of joint teleconnections using causal representation learning", "summary": "Understanding teleconnections of large-scale modes of climate variability is relevant for seasonal predictability and support a dynamical understanding of climatic changes. While numerical model experiments are the most common approach for investigating counterfactual climate responses, their conclusions are subject to model biases. Data-driven approaches offer a complementary perspective. Deep learning can extract reduced-dimensional patterns but usually lacks causal interpretability, while causal methods can disentangle signals in the presence of confounding yet are typically based on simple indices. Treating dimensionality reduction and causal inference separately thereby risks losing the teleconnection signal of interest. This paper introduces DAG-VAE, a causal representation learning approach that embeds a physics-informed directed acyclic graph in the latent space of a variational autoencoder. Combining deep learning with causal inference, the method jointly learns nonlinear reduced representations of large-scale modes of variability and their causal interactions. We apply DAG-VAE to disentangle the influences of the Pacific and Indian Oceans on the short rains over the Greater Horn of Africa. Trained on seasonal hindcasts, the method identifies dynamically meaningful representations and recovers spatial response patterns consistent with SST-replacement experiments. Trained on reanalysis data, DAG-VAE identifies a different response pattern to direct influence of the tropical Pacific, highlighting potential model biases and the value of DAG-VAE as a complementary, dat", "link": "https://arxiv.org/abs/2603.02879", "authors": "Fiona R. Spuler, Marlene Kretschmer, Magdalena Alonso Balmaseda, Masilin Gudoshava, Theodore G. Shepherd", "source": "arXiv", "published": "2026-03-03", "first_seen": "2026-11-26T13:59:01+00:00", "score": 52, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["india", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-23-0090.1", "title": "Dynamical Tests of a Deep Learning Weather Prediction Model", "summary": "Global deep learning weather prediction models have recently been shown to produce forecasts that rival those from physics-based models run at operational centers. It is unclear whether these models have encoded atmospheric dynamics or simply pattern matching that produces the smallest forecast error. Answering this question is crucial to establishing the utility of these models as tools for basic science. Here, we subject one such model, Pangu-Weather, to a set of four classical dynamical experiments that do not resemble the model training data. Localized perturbations to the model output and the initial conditions are added to steady time-averaged conditions, to assess the propagation speed and structural evolution of signals away from the local source. Perturbing the model physics by adding a steady tropical heat source results in a classical Matsuno–Gill response near the heating and planetary waves that radiate into the extratropics. A localized disturbance on the winter-averaged North Pacific jet stream produces realistic extratropical cyclones and fronts, including the spontaneous emergence of polar lows. Perturbing the 500-hPa height field alone yields adjustment from a state of rest to one of wind–pressure balance over ∼6 h. Localized subtropical low pressure systems produce Atlantic hurricanes, provided the initial amplitude exceeds about 4 hPa, and setting the initial humidity to zero eliminates hurricane development. We conclude that the model encodes realistic physics in all experiments and suggest that it can be used as a tool for rapidly testing a wide range ", "link": "https://doi.org/10.1175/aies-d-23-0090.1", "authors": "Gregory J. Hakim, Sanjit Masanam", "source": "Artificial Intelligence for the Earth Systems", "published": "2024-7", "first_seen": "2026-11-26T13:59:01+00:00", "score": 52, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ef003786", "title": "Future Global Population Exposure to Record‐Breaking Climate Extremes", "summary": "The increase in record‐breaking extreme events caused by climate change poses a threat to human health and well‐being. Understanding the future impacts of such events on global populations can provide decision‐making support for policies aiming to mitigate climate change. Here, we investigated the population exposure to eight climate extreme indices and drivers of exposure trajectories based on National Aeronautics and Space Administration Earth Exchange Global Daily Downscaled Projections Coupled Model Intercomparison Project 6 and population projection data under four shared socioeconomic pathway scenarios at a spatial resolution of 0.25° × 0.25°. The results show that by the mid‐twenty‐first century, most regions worldwide, especially Africa and South America, will continue to experience record‐breaking temperatures and compound drought and heatwaves (CDHWs). Regarding population exposure, under SSP3‐7.0 in the late twenty‐first century, the mean value of the multimodel median expected annual exposure (EAE) of all extreme temperature indices and CDHW reaches 8.12 billion persons per year. Population exposure hotspots will be concentrated in Central Africa, South Asia, Southeast Asia, and East Asia, mostly in developing countries, where 55.01%–87.42% of the EAE is found. The drivers of exposure trajectories are spatially heterogeneous. The increase in record‐breaking probability contributes more than population growth to EAE growth in most regions of the world except Central Asia, the Middle East, and most of Africa. These findings reveal the future trajectories of record", "link": "https://doi.org/10.1029/2023ef003786", "authors": "Bohao Li, Kai Liu, Ming Wang, Qianzhi Wang, Qian He, Chenxia Li", "source": "Earth's Future", "published": "2023-11", "first_seen": "2026-11-26T13:59:01+00:00", "score": 52, "topics": ["Downscaling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-024-00834-8", "title": "Hybrid physics-AI outperforms numerical weather prediction for extreme precipitation nowcasting", "summary": "", "link": "https://doi.org/10.1038/s41612-024-00834-8", "authors": "Puja Das, August Posch, Nathan Barber, Michael Hicks, Kate Duffy, Thomas Vandal, Debjani Singh, Katie van Werkhoven", "source": "npj Climate and Atmospheric Science", "published": "2024-11-18", "first_seen": "2026-11-26T13:59:01+00:00", "score": 52, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr-d-21-0150.1", "title": "Machine Learning Methods for Postprocessing Ensemble Forecasts of Wind Gusts: A Systematic Comparison", "summary": "Postprocessing ensemble weather predictions to correct systematic errors has become a standard practice in research and operations. However, only a few recent studies have focused on ensemble postprocessing of wind gust forecasts, despite its importance for severe weather warnings. Here, we provide a comprehensive review and systematic comparison of eight statistical and machine learning methods for probabilistic wind gust forecasting via ensemble postprocessing that can be divided in three groups: state-of-the-art postprocessing techniques from statistics [ensemble model output statistics (EMOS), member-by-member postprocessing, isotonic distributional regression], established machine learning methods (gradient-boosting extended EMOS, quantile regression forests), and neural network–based approaches (distributional regression network, Bernstein quantile network, histogram estimation network). The methods are systematically compared using 6 years of data from a high-resolution, convection-permitting ensemble prediction system that was run operationally at the German weather service, and hourly observations at 175 surface weather stations in Germany. While all postprocessing methods yield calibrated forecasts and are able to correct the systematic errors of the raw ensemble predictions, incorporating information from additional meteorological predictor variables beyond wind gusts leads to significant improvements in forecast skill. In particular, we propose a flexible framework of locally adaptive neural networks with different probabilistic forecast types as output, which n", "link": "https://doi.org/10.1175/mwr-d-21-0150.1", "authors": "Benedikt Schulz, Sebastian Lerch", "source": "Monthly Weather Review", "published": "2022-1", "first_seen": "2026-11-26T13:59:01+00:00", "score": 52, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": ["Sebastian Lerch"], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1175/waf-d-18-0178.1", "title": "Evaluation of Cumulus and Microphysics Parameterizations in WRF across the Convective Gray Zone", "summary": "This study evaluates the grid-length dependency of the Weather Research and Forecasting (WRF) Model precipitation performance for two cases in the Southern Great Plains of the United States. The aim is to investigate the ability of different cumulus and microphysics parameterization schemes to represent precipitation processes throughout the transition between parameterized and resolved convective scales (e.g., the gray zone). The cases include the following: 1) a mesoscale convective system causing intense local precipitation, and 2) a frontal passage with light but continuous rainfall. The choice of cumulus parameterization appears to be a crucial differentiator in convective development and resulting precipitation patterns in the WRF simulations. Different microphysics schemes produce very similar outcomes, yet some of the more sophisticated schemes have substantially longer run times. This suggests that this additional computational expense does not necessarily provide meaningful forecast improvements, and those looking to run such schemes should perform their own evaluation to determine if this expense is warranted for their application. The best performing cumulus scheme overall for the two cases studies here was the scale-aware Grell–Freitas cumulus scheme. It was able to reproduce a smooth transition from subgrid- (cumulus) to resolved-scale (microphysics) precipitation with increasing resolution. It also produced the smallest errors for the convective event, outperforming the other cumulus schemes in predicting the timing and intensity of the precipitation.", "link": "https://doi.org/10.1175/waf-d-18-0178.1", "authors": "Julia Jeworrek, Gregory West, Roland Stull", "source": "Weather and Forecasting", "published": "2019-8-1", "first_seen": "2026-11-26T13:59:01+00:00", "score": 52, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.70365", "title": "Development of a Transformer‐based cloud‐fraction parametrization scheme for the Korean Integrated Model", "summary": "CloudFormer is a deep‐learning‐based cloud‐fraction parametrization scheme designed to represent vertically resolved cloud fraction and to remain adaptable under changing climate conditions. The proposed CloudFormer builds on a Transformer encoder with self‐attention and introduces pressure‐aware positional encoding based on the logarithm of pressure to capture the atmosphere's physical stratification. Using European Centre for Medium‐Range Weather Forecasts Reanalysis v5 (ERA5) reanalysis data and a compact set of thermodynamic and microphysical variables, the model predicts full‐column cloud‐fraction profiles. To validate the effectiveness of the proposed model, we conduct sensitivity experiments over architectural variants and input variable sets. CloudFormer consistently outperforms conventional neural‐network baselines and widely used diagnostic cloud‐fraction schemes, yielding lower normalized root‐mean‐square error and better reproduction of the latitude–pressure structure of ERA5 cloudiness, including tropical deep convection and midlatitude frontal clouds. The best skill is obtained when cloud liquid, ice, and snow water content and temperature are used as predictors, whereas relative humidity is excluded, highlighting the dominant role of cloud water and the redundancy of composite variables such as relative humidity. An additional sensitivity analysis regarding the training period (detailed in the ) demonstrates that models updated with contemporary data exhibit further performance gains. This suggests that the proposed framework can effectively leverage the incr", "link": "https://doi.org/10.1002/qj.70365", "authors": "Hyeon‐Ju Jeon, Rae‐Seol Park, Gil Lee, Eun‐Jin Kim", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2026-11-24", "first_seen": "2026-11-26T13:59:01+00:00", "score": 52, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-19-3157-2026", "title": "DSCALE v0.1 – an open-source algorithm for downscaling regional and global mitigation pathways to the country level", "summary": "Integrated Assessment Models (IAMs) provide low-carbon scenarios at a global scale or for broad economic aggregates, as running these models for every country would be computationally demanding. Lack of national results from IAMs, hinders the enhancement of NDCs (Nationally Determined Contributions) and LTS (Long Term Strategies) in accordance with the 1.5 °C target and best available science. To address this limitation, we have developed DSCALE (Downscaling Scenarios to the Country level for Assessment of Low carbon Emissions), a novel algorithm designed to downscale regional IAMs outcomes to the country level. In this paper we present the methodology and show results for both current policy and 1.5 °C scenarios from the NGFS 2023 release. This downscaling tool provides insights for energy and emission developments and targets at the country level consistent with global scenarios from IAMs. Moreover, this tool facilitates the integration of IAMs results with other models and tools requiring energy and emissions data at the country level, such as the macroeconomic NiGEM model.", "link": "https://doi.org/10.5194/gmd-19-3157-2026", "authors": "Fabio Sferra, Bas van Ruijven, Keywan Riahi, Philip Hackstock, Florian Maczek, Jarmo S. Kikstra, Reinhard Haas", "source": "Geoscientific Model Development", "published": "2026-4-22", "first_seen": "2026-11-26T13:59:01+00:00", "score": 51, "topics": ["Downscaling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/jame.20015", "title": "Atmospheric component of the MPI‐M Earth System Model: ECHAM6", "summary": "ECHAM6, the sixth generation of the atmospheric general circulation model ECHAM, is described. Major changes with respect to its predecessor affect the representation of shortwave radiative transfer, the height of the model top. Minor changes have been made to model tuning and convective triggering. Several model configurations, differing in horizontal and vertical resolution, are compared. As horizontal resolution is increased beyond T63, the simulated climate improves but changes are incremental; major biases appear to be limited by the parameterization of small‐scale physical processes, such as clouds and convection. Higher vertical resolution in the middle atmosphere leads to a systematic reduction in temperature biases in the upper troposphere, and a better representation of the middle atmosphere and its modes of variability. ECHAM6 represents the present climate as well as, or better than, its predecessor. The most marked improvements are evident in the circulation of the extratropics. ECHAM6 continues to have a good representation of tropical variability. A number of biases, however, remain. These include a poor representation of low‐level clouds, systematic shifts in major precipitation features, biases in the partitioning of precipitation between land and sea (particularly in the tropics), and midlatitude jets that appear to be insufficiently poleward. The response of ECHAM6 to increasing concentrations of greenhouse gases is similar to that of ECHAM5. The equilibrium climate sensitivity of the mixed‐resolution (T63L95) configuration is between 2.9 and 3.4 K and is", "link": "https://doi.org/10.1002/jame.20015", "authors": "Bjorn Stevens, Marco Giorgetta, Monika Esch, Thorsten Mauritsen, Traute Crueger, Sebastian Rast, Marc Salzmann, Hauke Schmidt", "source": "Journal of Advances in Modeling Earth Systems", "published": "2013-4-18", "first_seen": "2026-11-26T13:59:01+00:00", "score": 51, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2026gl123405", "title": "Future Mediterranean Summer Drying Across Models: Opposing Dynamic and Thermodynamic Constraints", "summary": "Coupled Model Intercomparison Project Phase 6 (CMIP6) models project drier Mediterranean summers under global warming, yet exhibit substantial inter‐model spread. Notably, models with stronger global‐mean warming produce little additional drying. We show that this muted sensitivity to warming levels arises from the offset between thermodynamically driven drying and reduced regional subsidence. Moreover, the uncertainty in the subsidence response dominates the overall hydroclimate uncertainty. The subsidence response is mainly mediated by dry enthalpy advection linked to changes in tropical monsoon heating. Specifically, stronger West African summer monsoon rainfall is associated with a larger interhemispheric warming contrast, particularly excess warming in the northern mid‐to‐high latitudes, while weaker South Asian summer monsoon rainfall is associated with excess warming in the eastern tropical Pacific. These findings clarify why models diverge under identical greenhouse gas forcing and highlight the central role of the regional pattern of surface warming.", "link": "https://doi.org/10.1029/2026gl123405", "authors": "Linqiang He, Michela Biasutti, Yochanan Kushnir", "source": "Geophysical Research Letters", "published": "2026-10-1", "first_seen": "2026-11-26T13:59:01+00:00", "score": 51, "topics": ["Climate Modelling"], "watch": [], "boosts": ["monsoon", "cmip6", "uncertainty"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021jd035681", "title": "Planetary Boundary Layer Height Modulates Aerosol—Water Vapor Interactions During Winter in the Megacity of Delhi", "summary": "The Indo‐Gangetic Plain (IGP) is one of the dominant sources of air pollution worldwide. During winter, the variations in planetary boundary layer (PBL) height, driven by a strong radiative thermal inversion, affect the regional air pollution dispersion. To date, measurements of aerosol‐water vapor interactions, especially cloud condensation nuclei (CCN) activity, are limited in the Indian subcontinent, causing large uncertainties in radiative forcing estimates of aerosol‐cloud interactions. We present the results of a one‐month field campaign (February‐March 2018) in the megacity, Delhi, a significant polluter in the IGP. We measured the composition of fine particulate matter (PM 1 ) and size‐resolved CCN properties over a wide range of water vapor supersaturations. The analysis includes PBL modeling, backward trajectories, receptor models and fire spots to elucidate the influence of PBL and air mass origins on aerosols. The aerosol properties depended strongly on PBL height and a simple power‐law fit could parameterize the observed correlations of PM 1 mass, aerosol particle number and CCN number with PBL height, indicating PBL induced changes in aerosol accumulation. The low inorganic mass fractions, low aerosol hygroscopicity and high externally mixed weakly CCN‐active particles under low PBL height ( 100 m) indicated the influence of PBL on aerosol aging processes. In contrast, aerosol properties did not depend strongly on air mass origins or wind direction, implying that the observed aerosol and CCN are from local emissions. An error function could parameterize the re", "link": "https://doi.org/10.1029/2021jd035681", "authors": "Subha S. Raj, Ovid O. Krüger, Amit Sharma, Upasana Panda, Christopher Pöhlker, David Walter, Jan‐David Förster, Rishi Pal Singh", "source": "JGR: Atmospheres", "published": "2021-12-15", "first_seen": "2026-11-26T13:59:01+00:00", "score": 51, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-024-00638-w", "title": "Do AI models produce better weather forecasts than physics-based models? A quantitative evaluation case study of Storm Ciarán", "summary": "There has been huge recent interest in the potential of making operational weather forecasts using machine learning techniques. As they become a part of the weather forecasting toolbox, there is a pressing need to understand how well current machine learning models can simulate high-impact weather events. We compare short to medium-range forecasts of Storm Ciarán, a European windstorm that caused sixteen deaths and extensive damage in Northern Europe, made by machine learning and numerical weather prediction models. The four machine learning models considered (FourCastNet, Pangu-Weather, GraphCast and FourCastNet-v2) produce forecasts that accurately capture the synoptic-scale structure of the cyclone including the position of the cloud head, shape of the warm sector and location of the warm conveyor belt jet, and the large-scale dynamical drivers important for the rapid storm development such as the position of the storm relative to the upper-level jet exit. However, their ability to resolve the more detailed structures important for issuing weather warnings is more mixed. All of the machine learning models underestimate the peak amplitude of winds associated with the storm, only some machine learning models resolve the warm core seclusion and none of the machine learning models capture the sharp bent-back warm frontal gradient. Our study shows there is a great deal about the performance and properties of machine learning weather forecasts that can be derived from case studies of high-impact weather events such as Storm Ciarán.", "link": "https://doi.org/10.1038/s41612-024-00638-w", "authors": "Andrew J. Charlton-Perez, Helen F. Dacre, Simon Driscoll, Suzanne L. Gray, Ben Harvey, Natalie J. Harvey, Kieran M. R. Hunt, Robert W. Lee", "source": "npj Climate and Atmospheric Science", "published": "2024-4-22", "first_seen": "2026-11-26T13:59:01+00:00", "score": 51, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-020-05306-2", "title": "Robust late twenty-first century sh
