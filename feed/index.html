ise sampled from the learned distribution. We also compare four categories of perturbation methods for ensemble forecasting, that is, fixed distribution perturbation, learned distribution perturbation, MC dropout, and multi model ensemble. Comparisons on the WeatherBench data set show t", "link": "https://doi.org/10.1029/2022ms003211", "authors": "Yuan Hu, Lei Chen, Zhibin Wang, Hao Li", "source": "Journal of Advances in Modeling Earth Systems", "published": "2023-2", "first_seen": "2026-11-24T14:57:46+00:00", "score": 66, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022ef003183", "title": "Global Future Climate Signal by Latitudes Using CMIP6 GCMs", "summary": "This study estimated global climate change signals at different latitudes for four main Shared Socioeconomic Pathways (SSPs). Five evaluation metrics were integrated using the Technique for Order of Preference by Similarity to Ideal Solution to quantify the historical reproducibility of 25 CMIP6 General Circulation Models (GCMs) with Global Precipitation Climatology Centre precipitation and Climatic Research Unit temperature as the reference. The most suitable GCMs for simulating climate over different latitudes, selected based on evaluation metrics, were used to prepare a multimodel ensemble and project the future annual and seasonal precipitation and temperature in the near (2031–2065) and far future (2066–2100). The results showed that GCMs estimated the historical mean temperature efficiently but underestimated the monthly precipitation compared to the reference data. The changes in precipitation and temperature at mid‐latitudes (N45.5°–60°) showed the highest variability for all scenarios. The maximum increases in both climate variables for SSP5‐8.5 were 80.5% and 4.8% at N45.5°–60°, respectively. In contrast, the temperature and precipitation at S30.5°–45° revealed a decreasing pattern. Mid‐latitude winter (S30.5°–45°) would be drier in the future than in the base period (1980–2014). This study showed that precipitation variability and the mean temperature in the northern hemisphere would be larger for SSPs with higher radiative forcing. Therefore, the results of this study help improve knowledge of global future climate change by latitudes.", "link": "https://doi.org/10.1029/2022ef003183", "authors": "Young Hoon Song, Eun‐Sung Chung, Shamsuddin Shahid", "source": "Earth's Future", "published": "2024-3", "first_seen": "2026-11-24T14:57:46+00:00", "score": 66, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr-d-18-0187.1", "title": "Neural Networks for Postprocessing Ensemble Weather Forecasts", "summary": "Ensemble weather predictions require statistical postprocessing of systematic errors to obtain reliable and accurate probabilistic forecasts. Traditionally, this is accomplished with distributional regression models in which the parameters of a predictive distribution are estimated from a training period. We propose a flexible alternative based on neural networks that can incorporate nonlinear relationships between arbitrary predictor variables and forecast distribution parameters that are automatically learned in a data-driven way rather than requiring prespecified link functions. In a case study of 2-m temperature forecasts at surface stations in Germany, the neural network approach significantly outperforms benchmark postprocessing methods while being computationally more affordable. Key components to this improvement are the use of auxiliary predictor variables and station-specific information with the help of embeddings. Furthermore, the trained neural network can be used to gain insight into the importance of meteorological variables, thereby challenging the notion of neural networks as uninterpretable black boxes. Our approach can easily be extended to other statistical postprocessing and forecasting problems. We anticipate that recent advances in deep learning combined with the ever-increasing amounts of model and observation data will transform the postprocessing of numerical weather forecasts in the coming decade.", "link": "https://doi.org/10.1175/mwr-d-18-0187.1", "authors": "Stephan Rasp, Sebastian Lerch", "source": "Monthly Weather Review", "published": "2018-11", "first_seen": "2026-11-24T14:57:46+00:00", "score": 66, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": ["Stephan Rasp", "Sebastian Lerch"], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "arxiv:2610.37159", "title": "Physics-Guided Flow Matching: A Generative AI Framework for Global Total Electron Content Forecasting", "summary": "Accurate forecasting of global total electron content (TEC) is important for space weather monitoring and the reliable operation of satellite communication and navigation systems. We propose a physics-guided generative artificial intelligence (AI) framework for day-ahead global TEC forecasting. The framework builds on flow matching, which learns to gradually transform samples from an initial distribution into new samples that share the statistical characteristics of the target data. The proposed model incorporates ionospheric dynamics described by a partial differential equation (PDE) into this transformation process, guiding the changes between initial and target samples using physical knowledge. The model further combines the physical dynamics with statistical patterns captured from data to learn this transformation, adaptively adjusting their relative contributions at each location. The model is trained and evaluated using one year of global TEC data generated by the Thermosphere Ionosphere Electrodynamics General Circulation Model (TIEGCM). The results demonstrate that our model improves both spatial and temporal forecasting accuracy over representative benchmarks, including statistical, deep learning, and generative AI methods at all lead times and across latitudes. The average root mean square error (RMSE) is 39.2% lower than that of ConvLSTM and 23.8% lower than that of the same framework without physical guidance. The learned contribution weights vary systematically with latitude and across geographic locations, showing how the physical contribution changes across t", "link": "https://arxiv.org/abs/2610.37159", "authors": "Si-Tong Yang, Feng Ye, Xian Lu, Dong Lin, Benjamin C. Martinez", "source": "arXiv", "published": "2026-10-27", "first_seen": "2026-11-24T14:57:46+00:00", "score": 65, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["flow matching"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2602.11313", "title": "Hierarchical Testing of a Hybrid Machine Learning-Physics Global Atmosphere Model", "summary": "Machine learning (ML)-based models have demonstrated high skill and computational efficiency, often outperforming conventional physics-based models in weather and subseasonal predictions. While prior studies have assessed their fidelity in capturing synoptic-scale atmospheric dynamics, their performance across timescales and under out-of-distribution forcing, such as +3K or +4K uniform-warming forcings, and the sources of biases remain elusive, to establish the model reliability for Earth science. Here, we design three sets of experiments targeting synoptic-scale phenomena, interannual variability, and out-of-distribution uniform-warming forcings. We evaluate the Neural General Circulation Model (NeuralGCM), a hybrid model integrating a dynamical core with ML-based component, against observations and physics-based Earth system models (ESMs). At the synoptic scale, NeuralGCM captures the evolution and propagation of extratropical cyclones with performance comparable to ESMs. At the interannual scale, when forced by El Niño-Southern Oscillation sea surface temperature (SST) anomalies, NeuralGCM successfully reproduces associated teleconnection patterns but exhibits deficiencies in capturing nonlinear response. Under out-of-distribution uniform-warming forcings, NeuralGCM simulates similar responses in global-average temperature and precipitation and reproduces large-scale tropospheric circulation features similar to those in ESMs. Notable weaknesses include overestimating the tracks and spatial extent of extratropical cyclones, biases in the teleconnected wave train triggered", "link": "https://arxiv.org/abs/2602.11313", "authors": "Ziming Chen, L. Ruby Leung, Wenyu Zhou, Jian Lu, Sandro W. Lubis, Ye Liu, Chuan-Chieh Chang, Bryce E. Harrop", "source": "arXiv", "published": "2026-02-11", "first_seen": "2026-11-24T14:57:46+00:00", "score": 65, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2019ea000984", "title": "Environmental Lapse Rate for High‐Resolution Land Surface Downscaling: An Application to ERA5", "summary": "In this study we derive the environmental lapse rate (ELR) from vertical profiles of temperature in the lower troposphere, applying it to downscale air temperature of the new European Centre For Medium‐Range Weather Forecasts (ECMWF) reanalysis ERA5, which replaces ERA‐Interim (ERAI). We focus over the western U.S. region, a data‐rich area with observations of daily maximum and minimum temperature (Global Historical Climatology Network) and snow depth and soil temperature. Observations indicate an ELR of −4.5 K·km −1 in the region, lower than the commonly used −6.5 K·km −1 . ERA5 ELR agrees with the observational estimates, with some overestimation in winter and limitations in the diurnal variability. The elevation correction of ERA5 temperature using different ELR showed the benefits of deriving ELR fields from ERA5 vertical profiles, when compared with a constant ELR. Simulations with the ECMWF land surface model, at 9‐km resolution, driven by ERA5 using different ELR corrections showed the added value of the methodology, but the impact of different ELR corrections is limited. However, the validity of the downscaling method in reducing temperature to station altitude suggests that there is sufficient generality for application at kilometer and subkilometer resolutions. By comparing the estimated representativity errors of observations with reanalysis, the improvements from ERAI to ERA5 are mainly visible in the random component of the error. Large systematic biases remain, which require further attention from the modeling and data assimilation, and limit the potential ben", "link": "https://doi.org/10.1029/2019ea000984", "authors": "Emanuel Dutra, Joaquín Muñoz‐Sabater, Souhail Boussetta, Takuya Komori, Shoji Hirahara, Gianpaolo Balsamo", "source": "Earth and Space Science", "published": "2020-5", "first_seen": "2026-11-24T14:57:46+00:00", "score": 65, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022jd038199", "title": "The Fifth Generation Regional Climate Modeling System, RegCM5: Description and Illustrative Examples at Parameterized Convection and Convection‐Permitting Resolutions", "summary": "We introduce the latest version of the RegCM regional climate modeling system, RegCM5. Compared to the previous model version (RegCM4) the main new development is the inclusion of the non‐hydrostatic dynamical core from the weather prediction model MOLOCH, which is more accurate and much more computationally stable and efficient than the previous one. In particular, the new dynamical core is best designed for use at convection‐permitting resolutions of a few km. Several physics schemes and coupled model components have also been upgraded compared to the previous version of the model. A set of test simulations for present day climate conditions at parameterized convection and convection permitting resolutions over different European domains is presented for illustrative purposes. Overall, for these simulations RegCM5 exhibits a better performance than RegCM4 for the majority of statistics analyzed, especially at convection‐permitting resolutions. However, this performance depends on the physics schemes used, and further optimization work is under way to fully test the model in different climate settings and reduce current biases. RegCM5 is a freely available, computationally efficient, flexible, and portable Regional Earth System model designed for community use, so that prospective model users are welcome to access its code and use it for different applications.", "link": "https://doi.org/10.1029/2022jd038199", "authors": "Filippo Giorgi, Erika Coppola, Graziano Giuliani, James M. Ciarlo`, Emanuela Pichelli, Rita Nogherotto, Francesca Raffaele, Piero Malguzzi", "source": "JGR: Atmospheres", "published": "2023-3-27", "first_seen": "2026-11-24T14:57:46+00:00", "score": 65, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-014-2307-1", "title": "Analysis of the daily rainfall events over India using a new long period (1901–2010) high resolution (0.25° × 0.25°) gridded rainfall data set", "summary": "", "link": "https://doi.org/10.1007/s00382-014-2307-1", "authors": "D. S. Pai, Latha Sridhar, M. R. Badwaik, M. Rajeevan", "source": "Climate Dynamics", "published": "2014-8-29", "first_seen": "2026-11-24T14:57:46+00:00", "score": 65, "topics": ["Close to your work"], "watch": [], "boosts": ["india"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-022-06593-7", "title": "The added value of km-scale simulations to describe temperature over complex orography: the CORDEX FPS-Convection multi-model ensemble runs over the Alps", "summary": "The increase in computational resources has enabled the emergence of multi-model ensembles of convection-permitting regional climate model (CPRCM) simulations at very high horizontal resolutions. An example is the CORDEX Flagship Pilot Study on “Convective phenomena at high resolution over Europe and the Mediterranean”, a set of kilometre-scale simulations over an extended Alpine domain. This first-of-its-kind multi-model ensemble, forced by the ERA-Interim reanalysis, can be considered a benchmark dataset. This study uses a recently proposed metric to determine the added value of all the available Flagship Pilot Study hindcast kilometre-scale simulations for maximum and minimum temperature. The analysis is performed using state-of-the-art gridded and station observations as ground truth. This approach directly assesses the added value between the high-resolution CPRCMs against their driving global simulations and coarser resolution RCM counterparts. Overall, models display some modest gains, but also considerable shortcomings are exhibited. In part, these deficiencies can be attributed to the assimilation of temperature observations into ERA-Interim. Although the gains for the use of kilometre-scale resolution for temperature are limited, the improvement of the spatial representation of local atmospheric circulations and land–atmosphere interactions can ultimately lead to gains, particularly in coastal areas.", "link": "https://doi.org/10.1007/s00382-022-06593-7", "authors": "P. M. M. Soares, J. A. M. Careto, Rita M. Cardoso, Klaus Goergen, Eleni Katragkou, Stefan Sobolowski, Erika Coppola, Nikolina Ban", "source": "Climate Dynamics", "published": "2022-12-23", "first_seen": "2026-11-24T14:57:46+00:00", "score": 65, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-22-0043.1", "title": "Seamless Lightning Nowcasting with Recurrent-Convolutional Deep Learning", "summary": "A deep learning model is presented to nowcast the occurrence of lightning at a 5-min time resolution 60 min into the future. The model is based on a recurrent-convolutional architecture that allows it to recognize and predict the spatiotemporal development of convection, including the motion, growth and decay of thunderstorm cells. The predictions are performed on a stationary grid, without the use of storm object detection and tracking. The input data, collected from an area in and surrounding Switzerland, comprise ground-based radar data, visible/infrared satellite data and derived cloud products, lightning detection, numerical weather prediction, and digital elevation model data. We analyze different alternative loss functions, class weighting strategies and model features, providing guidelines for future studies to select loss functions optimally and to properly calibrate the probabilistic predictions of their model. On the basis of these analyses, we use focal loss in this study but conclude that it only provides a small benefit over cross entropy, which is a viable option if recalibration of the model is not practical. The model achieves a pixelwise critical success index (CSI) of 0.45 to predict lightning occurrence within 8 km over the 60-min nowcast period, ranging from a CSI of 0.75 at a 5-min lead time to a CSI of 0.32 at a 60-min lead time. Significance Statement We have developed a method based on artificial intelligence to forecast the occurrence of lightning at 5-min intervals within the next hour from the forecast time. The method utilizes a neural network t", "link": "https://doi.org/10.1175/aies-d-22-0043.1", "authors": "Jussi Leinonen, Ulrich Hamann, Urs Germann", "source": "Artificial Intelligence for the Earth Systems", "published": "2022-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 64, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-26-0049.1", "title": "Effectiveness and Limitations of Machine Learning for Predicting Lower Atmosphere Temperature Profiles", "summary": "Temperature profiles in the lower atmosphere rapidly evolve during the morning transition, and predicting their details over complex urban environments is particularly important for pollutant dispersal. Temperature profiles can be predicted by operational weather models but are sensitive to model parameterizations. Machine learning models can be used, but require high-resolution profiles that are often unavailable. To overcome this, pre-dawn temperature and wind speed observations from aircraft over Dallas-Fort Worth, TX are used to predict the morning transition. Initially, only temperature is used as an input to assess several types and configurations of machine learning models. Each model’s prediction is evaluated based on various methods because standard metrics, such as mean square error (MSE), may be minimized but miss important features, such as strong temperature gradients. A long short-term memory network with an AdamW optimizer does not result in the lowest MSE but does better capturing the temperature structure. The model tends toward the annual mean by underestimating the onset of mixing and near-surface temperature in summer and overestimating these in the winter. Including wind speed does not have a statistically significant improvement in MSE but performs better sequentially and with the inversion at the top of the boundary layer. Further refinements are likely to improve rapidly updated short-term forecasts, which may provide an additional forecast tool, but large gradients, extreme means, and external forcing remain an inherent challenge. These results high", "link": "https://doi.org/10.1175/aies-d-26-0049.1", "authors": "Kip F. Nielsen, David A. Rahn, Nathaniel A. Brunsell, Erik S. Van Vleck", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-11-2", "first_seen": "2026-11-24T14:57:46+00:00", "score": 64, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021ms002954", "title": "ClimateBench v1.0: A Benchmark for Data‐Driven Climate Projections", "summary": "Many different emission pathways exist that are compatible with the Paris climate agreement, and many more are possible that miss that target. While some of the most complex Earth System Models have simulated a small selection of Shared Socioeconomic Pathways, it is impractical to use these expensive models to fully explore the space of possibilities. Such explorations therefore mostly rely on one‐dimensional impulse response models, or simple pattern scaling approaches to approximate the physical climate response to a given scenario. Here we present ClimateBench—the first benchmarking framework based on a suite of Coupled Model Intercomparison Project, AerChemMIP and Detection‐Attribution Model Intercomparison Project simulations performed by a full complexity Earth System Model, and a set of baseline machine learning models that emulate its response to a variety of forcers. These emulators can predict annual mean global distributions of temperature, diurnal temperature range and precipitation (including extreme precipitation) given a wide range of emissions and concentrations of carbon dioxide, methane and aerosols, allowing them to efficiently probe previously unexplored scenarios. We discuss the accuracy and interpretability of these emulators and consider their robustness to physical constraints such as total energy conservation. Future opportunities incorporating such physical constraints directly in the machine learning models and using the emulators for detection and attribution studies are also discussed. This opens a wide range of opportunities to improve predicti", "link": "https://doi.org/10.1029/2021ms002954", "authors": "D. Watson‐Parris, Y. Rao, D. Olivié, Ø. Seland, P. Nowack, G. Camps‐Valls, P. Stier, S. Bouabid", "source": "Journal of Advances in Modeling Earth Systems", "published": "2022-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 64, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme", "emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021ms002515", "title": "Evaluation of CMIP6 Global Climate Models for Simulating Land Surface Energy and Water Fluxes During 1979–2014", "summary": "This study examined the overall performance of the climate models in Phase 6 of the Coupled Model Intercomparison Project (CMIP6) in simulating the key energy and water fluxes over land. For this purpose, this study selected multiple land flux products as reference data sets and assessed the global spatial means, patterns, trends, seasonal cycles, and regional mean estimates of the sensible heat (SH), latent heat (LH), net radiation (RN), runoff (RF), and precipitation (PR) simulated by 32 CMIP6 models in recent decades. The global (Antarctica, Greenland, and hot deserts are not included) mean SH, LH, RN, RF, and PR simulated by the CMIP6 models are 37.55 ± 4.81 W m −2 , 49.88 ± 5.31 W m −2 , 89.10 ± 4.45 W m −2 , 351.31 ± 95.28 mm yr −1 , and 948.35 ± 88.77 mm yr −1 , respectively. The ensemble median of CMIP6 simulations (CMIP6‐MED) can provide robust estimates of global and regional land fluxes, which are within the ranges given by the reference data sets, and highly consistent spatiotemporal patterns of these fluxes. The comparison of CMIP6‐MED with the first preferred reference data sets shows that CMIP6‐MED generally overestimates the water and energy fluxes over land, except for the simulated RF and PR in the Amazon region. The most disagreements between CMIP6‐MED and the reference data sets occur in South America (particularly the Amazon region) and the Tibetan Plateau. Finally, the sources of model biases are discussed. It is suggested that current land flux products should be widely used to optimize the structures and parameters of climate models in future work.", "link": "https://doi.org/10.1029/2021ms002515", "authors": "Jianduo Li, Chiyuan Miao, Wei Wei, Guo Zhang, Lijuan Hua, Yueli Chen, Xiaoxiao Wang", "source": "Journal of Advances in Modeling Earth Systems", "published": "2021-6", "first_seen": "2026-11-24T14:57:46+00:00", "score": 64, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2025ms005207", "title": "Local Off‐Grid Weather Forecasting With Multi‐Modal Earth Observation Data", "summary": "Urgent applications like wildfire management and renewable energy generation require precise, localized weather forecasts near the Earth's surface. However, forecasts produced by machine learning models or numerical weather prediction systems are typically generated on large‐scale regular grids, where direct downscaling fails to capture fine‐grained, near‐surface weather patterns. In this work, we propose a multi‐modal transformer model trained end‐to‐end to downscale gridded forecasts to off‐grid locations of interest. Our models directly combine local historical weather observations (e.g., wind, temperature, dewpoint) with gridded forecasts to produce locally accurate predictions at various lead times. Multiple data modalities are collected and concatenated at station‐level locations, treated as a token at each station. Using self‐attention, the token corresponding to the target location aggregates information from its neighboring tokens. Experiments using weather stations across the Northeastern United States show that our model outperforms a range of data‐driven and non‐data‐driven off‐grid forecasting methods. They also reveal that direct input of station data provides a marked improvement in local weather forecasting accuracy, reducing the prediction error by up to 80% compared to pure gridded data based models. This approach demonstrates how to bridge the gap between large‐scale weather models and locally accurate forecasts to support high‐stakes, location‐sensitive decision‐making.", "link": "https://doi.org/10.1029/2025ms005207", "authors": "Qidong Yang, Jonathan Giezendanner, Daniel Salles Civitarese, Johannes Jakubik, Eric Schmitt, Anirban Chandra, Jeremy Vila, Detlef Hohl", "source": "Journal of Advances in Modeling Earth Systems", "published": "2025-12", "first_seen": "2026-11-24T14:57:46+00:00", "score": 64, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-026-08105-3", "title": "Evaluation of projected changes in precipitation and temperature under NEX-GDDP CMIP6 scenario driven by climate change", "summary": "", "link": "https://doi.org/10.1007/s00382-026-08105-3", "authors": "Pravesh Kumar, Venkata Reddy Keesara, Eswar Sai Buri", "source": "Climate Dynamics", "published": "2026-3-16", "first_seen": "2026-11-24T14:57:46+00:00", "score": 64, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.18393", "title": "WeatherDreamer: Learning a World Model from Multimodal Earth Observations", "summary": "Machine learning weather models now rival operational global forecasts but still start from analyses produced by separate, expensive data assimilation (DA) systems, which for global models are typically updated every six hours. Observation-to-observation models avoid this dependence, but most omit the recursive filtering cycle that lets DA systems carry a background state through sparse, irregular observations. We introduce WeatherDreamer, a world model that learns this cycle end-to-end from 18 global observing systems, without reanalysis. It infers a latent state from observations, carries it forward hour by hour with learned dynamics, corrects it each hour with new observations, and can predict what any of its observing systems would measure at any location. At held-out stations, its ensembles beat NOAA's Global Ensemble Forecast System (GEFS) for temperature, dew point and wind out to 12 h and are better calibrated than GEFS and the ECMWF ensemble. Precipitation, cloud-top height and solar irradiance, never inputs at inference, are inferred with skill matching or exceeding operational products at short leads. Against the first guess of NOAA's Gridpoint Statistical Interpolation (GSI) DA system, WeatherDreamer's short-range departures are within 10% of GSI's at surface stations and within 25% for moisture-sensitive microwave channels, but up to five times larger for temperature-sounding channels. Never given observation errors, its learned update assumes errors close to known instrument and retrieval errors of microwave sounders and scatterometer winds. WeatherDreamer als", "link": "https://arxiv.org/abs/2611.18393", "authors": "Kate Duffy, Elise Penn, Tristan Ballard, August Posch, Thomas J. Vandal", "source": "arXiv", "published": "2026-11-13", "first_seen": "2026-11-24T14:57:46+00:00", "score": 63, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2512.12183", "title": "HydroDiffusion: Diffusion-Based Probabilistic Streamflow Forecasting with a State Space Backbone", "summary": "Recent advances have introduced diffusion models for probabilistic streamflow forecasting, demonstrating strong early flood-warning skill. However, current implementations rely on recurrent Long Short-Term Memory (LSTM) backbones and single-step training objectives, which limit their ability to capture long-range dependencies and produce coherent forecast trajectories across lead times. To address these limitations, we developed HydroDiffusion, a diffusion-based probabilistic forecasting framework with a decoder-only state space model backbone. The proposed framework jointly denoises full multi-day trajectories in a single pass, ensuring temporal coherence and mitigating error accumulation common in autoregressive prediction. HydroDiffusion is evaluated across 531 watersheds in the contiguous United States (CONUS) in the CAMELS dataset. We benchmark HydroDiffusion against two diffusion baselines with LSTM backbones, as well as the recently proposed Diffusion-based Runoff Model (DRUM). Results show that HydroDiffusion achieves strong nowcast accuracy when driven by observed meteorological forcings, and maintains consistent performance across the full simulation horizon. Moreover, HydroDiffusion delivers stronger deterministic and probabilistic forecast skill than DRUM in operational forecasting. These results establish HydroDiffusion as a robust generative modeling framework for medium-range streamflow forecasting, providing both a new modeling benchmark and a foundation for future research on probabilistic hydrologic prediction at continental scales.", "link": "https://arxiv.org/abs/2512.12183", "authors": "Yihan Wang, Annan Yu, Lujun Zhang, Charuleka Varadharajan, N. Benjamin Erichson", "source": "arXiv", "published": "2025-12-13", "first_seen": "2026-11-24T14:57:46+00:00", "score": 63, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["diffusion model"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2026gl124797", "title": "Increasing Spatial Unevenness of Dry‐Wet Conditions With Global Warming", "summary": "Despite little change in total rainy‐season precipitation across the Northern Hemisphere, extreme dry and wet events have become more frequent, indicating intensifying spatial unevenness of dry‐wet conditions. This observed pattern is consistent with expectations from climate process understanding and evidence from climate models. However, a systematic hemispheric‐scale quantitative assessment of this unevenness remains lacking. To fill this gap, this study examines it through changes in extreme‐event occurrence, distributional shifts, and direct unevenness indices. Observations show that the land area affected by extremes increased by about 1 percentage point per decade, with particularly strong increases in densely populated regions such as the Mediterranean and East Asia. Multi‐model ensemble projections indicate that this tendency will persist and strengthen under higher‐emission scenarios, with increasing divergence toward both drier and wetter extremes. Emission reductions cannot fully prevent this trend but can substantially limit its amplification, highlighting the importance of mitigation and low‐carbon transitions.", "link": "https://doi.org/10.1029/2026gl124797", "authors": "Zhaoyang Li, Shanshan Wang, Dongyu He, Zijian He", "source": "Geophysical Research Letters", "published": "2026-11-24", "first_seen": "2026-11-24T14:57:46+00:00", "score": 63, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-013-1942-2", "title": "Development of an artificial neural network based multi-model ensemble to estimate the northeast monsoon rainfall over south peninsular India: an application of extreme learning machine", "summary": "", "link": "https://doi.org/10.1007/s00382-013-1942-2", "authors": "Nachiketa Acharya, Nitin Anand Shrivastava, B. K. Panigrahi, U. C. Mohanty", "source": "Climate Dynamics", "published": "2013-9-20", "first_seen": "2026-11-24T14:57:46+00:00", "score": 63, "topics": ["Deep Learning"], "watch": [], "boosts": ["india", "monsoon", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.37325", "title": "Scale-aware and spatially-localised optimisation of kilometre-scale MLWP models", "summary": "Preserving fine-scale structure without degrading spatial accuracy is a central challenge for kilometre-scale machine-learning weather prediction (MLWP). We introduce a loss based on the dual-tree complex wavelet transform that constrains atmospheric fields jointly by scale, location, and orientation. We evaluate its performance using an experimental joint global--regional FastNet configuration, which produces \\SI{1.5}{km} forecasts over the UK alongside $\\sim$\\SI{31}{km} global forecasts. Relative to both mean-squared error (MSE) and an FFT-based spectral objective, the wavelet loss substantially improves spectral fidelity. Compared with MSE training, it maintains similar pointwise performance, improves neighbourhood-based verification, and produces sharper precipitation fields with more realistic intensity distributions. These results demonstrate that spatially localised wavelet constraints can preserve multiscale atmospheric structure while largely avoiding the loss of pointwise accuracy associated with globally supported spectral objectives.", "link": "https://arxiv.org/abs/2610.37325", "authors": "James Chappell, Sophie Luise Arana, Jack Bowyer, Matthew Burnand, Alejandro Coca-Castro, Evangeline Corcoran, Eric G. Daub, Tom Dunstan", "source": "arXiv", "published": "2026-10-27", "first_seen": "2026-11-24T14:57:46+00:00", "score": 62, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.28219" on models are thus pr", "link": "https://arxiv.org/abs/2611.31212", "authors": "Omar Sallam, David Coe, Jeremy Feinstein, Hugo Torres, Sofia Sahagun Covarrubias, Eugene Yan", "source": "arXiv", "published": "2026-11-23", "first_seen": "2026-11-24T14:57:46+00:00", "score": 62, "topics": ["Deep Learning"], "watch": [], "boosts": ["diffusion model"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2020ms002217", "title": "Process‐Based Climate Model Development Harnessing Machine Learning: I. A Calibration Tool for Parameterization Improvement", "summary": "The development of parameterizations is a major task in the development of weather and climate models. Model improvement has been slow in the past decades, due to the difficulty of encompassing key physical processes into parameterizations, but also of calibrating or “tuning” the many free parameters involved in their formulation. Machine learning techniques have been recently used for speeding up the development process. While some studies propose to replace parameterizations by data‐driven neural networks, we rather advocate that keeping physical parameterizations is key for the reliability of climate projections. In this paper we propose to harness machine learning to improve physical parameterizations. In particular, we use Gaussian process‐based methods from uncertainty quantification to calibrate the model free parameters at a process level. To achieve this, we focus on the comparison of single‐column simulations and reference large‐eddy simulations over multiple boundary‐layer cases. Our method returns all values of the free parameters consistent with the references and any structural uncertainties, allowing a reduced domain of acceptable values to be considered when tuning the three‐dimensional (3D) global model. This tool allows to disentangle deficiencies due to poor parameter calibration from intrinsic limits rooted in the parameterization formulations. This paper describes the tool and the philosophy of tuning in single‐column mode. Part 2 shows how the results from our process‐based tuning can help in the 3D global model tuning.", "link": "https://doi.org/10.1029/2020ms002217", "authors": "Fleur Couvreux, Frédéric Hourdin, Daniel Williamson, Romain Roehrig, Victoria Volodina, Najda Villefranque, Catherine Rio, Olivier Audouin", "source": "Journal of Advances in Modeling Earth Systems", "published": "2021-2-26", "first_seen": "2026-11-24T14:57:46+00:00", "score": 62, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2025ms005118", "title": "ClimaLand: A Land Surface Model Designed to Enable Data‐Driven Parameterizations", "summary": "Land surface models (LSMs) are essential tools for simulating the coupled climate system, representing the dynamics of water, energy, and carbon fluxes on land and their interaction with the atmosphere. However, parameterizing sub‐grid processes at the scales relevant to climate models (10–100 km) remains a considerable challenge. The parameterizations typically have a large number of unknown and often correlated parameters, making calibration and uncertainty quantification difficult. Moreover, many existing LSMs are not readily adaptable to the incorporation of modern machine learning (ML) parameterizations trained with in situ and satellite data. This article presents the first version of ClimaLand, a new LSM designed for overcoming these limitations, including a description of the core equations underlying the model, the results of an extensive set of validation exercises, and an assessment of the computational performance of the model. We show that ClimaLand can erived extreme precipitation estimates in major climate regions. We find that MCSs produce the vast majority of extreme precipitation in the tropics and some mid‐latitude land regions, while extreme precipitation in mid and high‐latitude ocean and coastal regions are dominated by cyclones and ARs. Importantly, most extreme precipitation events are associated with phenomena interacting across scales that intensify precipitation. These interactions are a function of the intensity (i.e., rarity) of extreme events. The presented methodology and results could have wide‐ranging applications including training of machine learning methods, Lagrangian‐based evaluation of ", "link": "https://doi.org/10.1029/2023ef003534", "authors": "Andreas F. Prein, Priscilla A. Mooney, James M. Done", "source": "Earth's Future", "published": "2023-11", "first_seen": "2026-11-24T14:57:46+00:00", "score": 62, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2025ea004970", "title": "Estimating Regional Snow Water Equivalent Using a Physics‐Informed Graph Convolution Network Model", "summary": "Snow water equivalent (SWE), which quantifies the amount of water in a snowpack, is critical for water supply forecasting. This study explores machine learning (ML) models' capability of representing the spatial distribution of SWE across the western United States. Nine graph convolution network (GCN) models using different loss functions, including a series of physics‐informed loss functions, are developed and compared to a baseline extra tree (ET) model. Different approaches for physics‐informed loss function are examined according to the correlation among geographic and meteorological conditions and are expected to help ML models ": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ms003640", "title": "Time Variability Correction of CMIP6 Climate Change Projections", "summary": "Accurate projections of climate change and associated extreme events under differing emission scenarios are linked to realistic representations of the temporal variability of the atmosphere at a variety of time scales, for example, annual, seasonal, synoptic, and daily. Here a new method is employed to explicitly quantify a model's ability to accurately represent covariance at and between differing time scales. From our global‐scale analysis, on average, raw Coupled Model Intercomparison Project Phase 6 (CMIP6) models misrepresent temporal variances at differing time scales for maximum temperature (tasmax) by a considerable margin, particularly at 183‐, 92‐ and 46‐day time scales. To ameliorate such variability errors, we propose a novel Time Variability Correction (TVC) method that corrects temporal covariances while preserving the essential time‐event sequence of the model simulations. We adopt a model‐as‐truth framework to evaluate the effectiveness of the TVC method under future forcing conditions when applied to daily tasmax simulations from 23 CMIP6 models for 1% of the global grid cells. TVC‐corrected temperatures generally show improved matching of temporal variance and lag correlations in the out‐of‐sample projection period compared to simple mean‐corrected projections. By imparting more realistic temporal‐correlations to model series, TVC is expected to improve the projections of extreme events associated with persistent heat, such as heatwaves. Applying TVC to future temperature projections using actual observations significantly increases the temperature varianc", "link": "https://doi.org/10.1029/2023ms003640", "authors": "Y. Shao, C. H. Bishop, S. Hobeichi, N. Nishant, G. Abramowitz, S. Sherwood", "source": "Journal of Advances in Modeling Earth Systems", "published": "2024-2", "first_seen": "2026-11-24T14:57:46+00:00", "score": 61, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-025-01311-6", "title": "A deep learning-based land-atmosphere coupled model for heatwave prediction", "summary": "", "link": "https://doi.org/10.1038/s41612-025-01311-6", "authors": "Dongjin Cho, Yoo-Geun Ham, Suyeon Jeong, Seon-Yu Kang", "source": "npj Climate and Atmospheric Science", "published": "2026-2-2", "first_seen": "2026-11-24T14:57:46+00:00", "score": 61, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2607.05658", "title": "Integrating GNSS-Derived Zenith Wet Delay into a Weather Foundation Model Improves Precipitation Forecasting", "summary": "Global Navigation Satellite Systems (GNSS), best known for positioning, also serve weather science, as atmospheric water vapour delays their signals. This delay, the Zenith Wet Delay (ZWD), is a direct, all-weather measure of column moisture. Although assimilated into numerical weather prediction for decades, ZWD is not yet used by leading Machine Learning Weather Models (MLWM), despite addressing a known deficiency: the underestimation of severe precipitation. Here we present the first integration of GNSS-derived ZWD into Aurora, a state-of-the-art weather foundation model. Our extended Aurora learns ZWD with skill comparable to its pretrained variables. More importantly, including ZWD systematically improves forecasts when fine-tuning for 6-hour accumulated precipitation. Gains grow with severity, reaching an 8.8% increase in Equitable Threat Score at the 99th percentile, while the precipitation power spectrum becomes more realistic at synoptic and planetary scales. GNSS observations therefore encode information that MLWM can exploit for high-impact precipitation.", "link": "https://arxiv.org/abs/2607.05658", "authors": "Leonardo Trentini, Fanny Lehmann, Laura Crocetti, Benedikt Soja", "source": "arXiv", "published": "2026-07-06", "first_seen": "2026-11-24T14:57:46+00:00", "score": 60, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-17-399-2024", "title": "GAN-argcPredNet v2.0: a radar echo extrapolation model based on spatiotemporal process enhancement", "summary": "Precipitation nowcasting has important implications for urban operation and flood prevention. Radar echo extrapolation is a common method in precipitation nowcasting. Using deep learning models to extrapolate radar echo data has great potential. The increase of lead time leads to a weaker correlation between the real rainfall evolution and the generated images. The evolution information is easily lost during extrapolation, which is reflected as echo attenuation. Existing models, including generative adversarial network (GAN)-based models, have difficulty curbing attenuation, resulting in insufficient accuracy in rainfall prediction. To solve this issue, a spatiotemporal process enhancement network (GAN-argcPredNet v2.0) based on GAN-argcPredNet v1.0 has been designed. GAN-argcPredNet v2.0 curbs attenuation by avoiding blurring or maintaining the intensity. A spatiotemporal image correlation (STIC) prediction network is designed as the generator. By suppressing the blurring effect of rain distribution and reducing the negative bias by STIC attention, the generator generates more accurate images. Furthermore, the discriminator is a channel–spatial (CS) convolution network. The discriminator enhances the discrimination of echo information and provides better guidance to the generator in image generation by CS attention. The experiments are based on the radar dataset of southern China. The results show that GAN-argcPredNet v2.0 performs better than other models. In heavy rainfall prediction, compared with the baseline, the probability of detection (POD), the critical success in", "link": "https://doi.org/10.5194/gmd-17-399-2024", "authors": "Kun Zheng, Qiya Tan, Huihua Ruan, Jinbiao Zhang, Cong Luo, Siyu Tang, Yunlei Yi, Yugang Tian", "source": "Geoscientific Model Development", "published": "2024-1-16", "first_seen": "2026-11-24T14:57:46+00:00", "score": 60, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0108.1", "title": "Improvement of a Neural Network Convection Scheme by Including Triggering and Evaluation in Present and Future Climates", "summary": "In this study, we improve a neural network (NN) parameterization of deep convection in the global atmosphere model ARP-GEM. To account for the sporadic nature of convection, we develop an NN parameterization that includes a triggering mechanism capable of detecting whether deep convection is active within a grid cell. This new data-driven parameterization outperforms the existing NN parameterization in present climate when replacing the original deep convection scheme of ARP-GEM. Online simulations with the NN parameterization run without stability issues. Then, this NN parameterization is evaluated online in a warmer climate. We also confirm that using relative humidity instead of the specific total humidity as input for the NN (trained with present data) tends to improve the performance and generalization in warmer climate. Finally, we perform the training of the NN parameterization with data from a warmer climate, and this configuration gets similar results when used in simulations in present or warmer climates. Significance Statement This paper introduces a data-driven parameterization that significantly improves upon the method described in Balogh et al. Incorporating physical knowledge in the data-driven parameterization leads to reduced biases in the simulation using the data-driven parameterization and enhances both online performance and stability, including in climates not encountered during the data-driven parameterization’s training phase.", "link": "https://doi.org/10.1175/aies-d-25-0108.1", "authors": "Hugo Germain, Blanka Balogh, Olivier Geoffroy, David Saint-Martin", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 60, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0083.1", "title": "Stop Using Root-Mean-Square Error as a Precipitation Target!", "summary": "Root-mean-square error (RMSE) remains the default training loss for data-driven precipitation models, despite precipitation being semicontinuous, zero inflated, strictly nonnegative, and heavy tailed. This Gaussian-implied objective misspecifies the data-generating process because it tolerates negative predictions, underpenalizes rare heavy events, and ignores the mass at zero. We suggest replacing RMSE with the Tweedie deviance, a likelihood-based and differentiable loss from the exponential–dispersion family, with variance function V ( μ ) = μ p . For 1 < p < 2, it yields a compound Poisson–gamma distribution with a point mass at zero and a continuous density over y > 0, matching observed precipitation characteristics. In this paper, we (i) estimate p from the variance–mean power law and show that precipitation across temporal aggregations is far from Gaussian and that the Tweedie power p increases with accumulation length toward a gamma limit and (ii) demonstrate consistent skill gains when training deep data-driven models with Tweedie deviance instead of RMSE. In diffusion-model downscaling over Beijing, Tweedie loss improves wet-pixel MAE and extreme recall (∼0.611 vs 0.566 at the 99th percentile). In convolutional long short-term memory (ConvLSTM) nowcasting over Kolkata, Tweedie loss yields improvements in wet-pixel MAE and dry-pixel hit rates, with improvements autoregressively compounding over lead time (for MAE, from 3.5% at t + 1 growing to 8.7% at t + 4). Extreme recall at the 99.9th percentile is not significantly higher at t + 1 but becomes significantly highe", "link": "https://doi.org/10.1175/aies-d-25-0083.1", "authors": "Kieran M. R. Hunt", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 60, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme", "diffusion model"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0111.1", "title": "S2G Deep Interpolation: A Deep Learning Framework for Generating High-Resolution Wind Gust Fields from Sparse Mesonet Observations", "summary": "The growing deployment of surface observational networks (so-called mesonets) has the potential to transform many sectors, such as agriculture, water resource management, renewable energy assessment, disaster risk reduction, power outage prediction, and high-impact weather monitoring. However, network observations are sparse, whereas these downstream applications typically require gridded data. Traditional interpolation methods, such as Barnes interpolation, do not perform well in complex terrain. Therefore, in this study, we propose a deep learning–based framework, called sparse-to-gridded deep interpolation (S2G-DI), to generate high-resolution spatially continuous fields from sparse surface observations. We focus on wind gusts, which are challenging to interpolate due to their highly localized and transient nature but are critical for assessing weather-related hazards. We experimented with three deep learning architectures, employing convolutional neural networks and transformers with increasing complexity, and our sensitivity analysis shows that a U-Net architecture with meteorological and topographic inputs significantly outperforms Barnes interpolation, reducing root-mean-square error (RMSE) by over 30% and better preserving fine-scale features. The model remains robust to missing data and generalizes well even with limited training data. Evaluations during extreme wind gust events confirm that the framework captures both spatial structure and intensity more reliably than traditional methods. However, for some of these cases, there is still room for improvement for th", "link": "https://doi.org/10.1175/aies-d-25-0111.1", "authors": "Harish Baki, Maximilian Pierzyna, Sukanta Basu", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 60, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-24-0106.1", "title": "Machine Learning Predictions of Deep Convection Initiation: The Importance of Geographic Information, the Sensitivity to Training Region, and Dominant Environmental Parameters", "summary": "Machine learning–based predictions of deep convection initiation (DCI) have shown promise for a range of applications. Previous research has relied on training data that are temporally and/or geographically limited. The first goal of the research presented here is to determine how machine learning models for DCI trained on data from small geographic regions perform relative to models trained over larger geographic regions, and if models trained over larger geographic regions have improved performance through incorporation of geographic information (i.e., latitude and longitude as predictor variables). Results show that performance for a model developed over the entire study area (full model) outperforms regional models when evaluated over the entire study area. When evaluated in the different subregions, the full model has comparable performance to the “home” model for that region. Results also show that the full model also benefits from incorporating geographic information as predictors. The second goal of the research presented here is to use the machine learning model to assess the importance of parameters typically used to differentiate environments capable of supporting DCI from those that do not. The four most important parameters for the full model are convective available potential energy (CAPE), mixing ratio difference (low-/midlevel difference between a parcel and the environment), convective inhibition (CIN) depth (CD) [the distance a parcel would need to be lifted to reach its level of free convection (LFC)], maximum Ω (low-/midlevel vertical motion), and liftin", "link": "https://doi.org/10.1175/aies-d-24-0106.1", "authors": "Stephen A. Shield, Adam L. Houston", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-1", "first_seen": "2026-11-24T14:57:46+00:00", "score": 60, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.25075", "title": "Evaluation of machine-learning and deep-learning SPEI drought forecasts against persistence across timescales and lead times in Bangladesh", "summary": "Bangladesh, home to nearly 178 million people, is highly vulnerable to recurring droughts that threaten food security and rural livelihoods. Machine-learning and deep-learning models are increasingly used to forecast drought indices such as the Standardized Precipitation Evapotranspiration Index (SPEI). Most studies report accuracy without a persistence reference, although accumulated indices are strongly autocorrelated, and seldom test drought detection, longer leads or variation between training runs. This study forecast SPEI at 3-, 6- and 12-month timescales one to three months ahead for the eight divisions of Bangladesh, using ERA5 reanalysis checked against 35 Bangladesh Meteorological Department stations. Five models, XGBoost, CNN, Bi-LSTM, CNN-BiLSTM and CEEMDAN-BiLSTM, were trained with five seeds each, scored on accuracy, skill against persistence and drought detection, and interpreted with Shapley values. At a one-month lead, the CNN-BiLSTM and Bi-LSTM beat persistence clearly at SPEI-3 and SPEI-6 (skill 0.408 and 0.350), while at SPEI-12 a Nash-Sutcliffe efficiency of 0.872 barely exceeded persistence (0.850). Skill and detection could disagree: at SPEI-3 and a three-month lead, XGBoost had the highest skill (0.439) yet detected none of the 119 drought months. Only at SPEI-6 did the forecasts beat persistence significantly and match its detection at all three leads, with fewer false alarms. At SPEI-12, gains were small or absent and varied between seeds. The forecasts kept 76-80% of their correlation against station-derived SPEI and relied mainly on precipitation", "link": "https://arxiv.org/abs/2611.25075", "authors": "Mahir Ahnaf, Showmitra Kumar Sarkar", "source": "arXiv", "published": "2026-11-18", "first_seen": "2026-11-24T14:57:46+00:00", "score": 59, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.11918", "title": "Ensemble Covariance Propagation with Machine Learning Weather Prediction Models in a Realistic Data Assimilation System", "summary": "Integrating machine learning weather prediction (MLWP) models into classical data assimilation (DA) workflows requires that they accurately evolve ensemble covariances. We evaluate this capability in a two-way coupled DA system, where an ensemble variational (EnVar) component evolves the mean and an ensemble Kalman filter (EnKF) evolves the covariances. The system is cycled over one month and assimilates a wide range of real-world observations, including microwave radiances. Using the MLWP model GraphCast for the EnKF and the physics-based MPAS model for the EnVar yields ensemble spread and covariances comparable to a reference configuration in which MPAS evolves both components. The resulting EnVar mean achieves consistently lower RMSE against GFS analyses, except near the model top, where spurious correlations degrade performance. These results demonstrate that MLWP models can propagate covariance information in a realistic DA cycling system and provide a proof of concept for their integration into future operational ensemble systems.", "link": "https://arxiv.org/abs/2611.11918", "authors": "Simon Toedtli, David Ahijevych, Wei Wang, Chris Snyder", "source": "arXiv", "published": "2026-11-09", "first_seen": "2026-11-24T14:57:46+00:00", "score": 59, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2609.12274", "title": "Ensemble Forecast Updates without Model Re-integration Based on Ultra-rapid Data Assimilation: Idealized Experiments with a Heavy Rainfall Case", "summary": "Observations at high frequency have become dramatically more abundant with recent technological advances. Ultra-rapid data assimilation (URDA) has been proposed to exploit them, frequently updating ensemble forecasts at lower cost without re-integrating the forecast model. In this study, we examine the applicability of URDA to a realistic numerical weather prediction (NWP). Specifically, we conducted idealized experiments for the heavy rainfall event of August 2021, using the regional atmospheric model Scalable Computing for Advanced Library and Environment (SCALE-RM). In the experiments, pseudo-observations emulating the Automated Meteorological Data Acquisition System (AMeDAS) were assumed to become available every 10 min. The results show that the threat score for hourly precipitation is generally improved in the forecasts updated by URDA relative to the pre-existing baseline forecasts, through the ensemble-based error covariance. Furthermore, for sea level pressure, temperature, relative humidity, and winds, the root mean square error of the URDA-updated forecasts is reduced relative to that of the baseline forecasts as the forecasts are successively updated by assimilating additional observations. These results indicate the potential of URDA to operate effectively with a realistic NWP model.", "link": "https://arxiv.org/abs/2609.12274", "authors": "Fumitoshi Kawasaki, Kenta Kurosawa, Atsushi Okazaki, Shunji Kotsuki", "source": "arXiv", "published": "2026-09-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 59, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-7-387-2014", "title": "TopoSCALE v.1.0: downscaling gridded climate data in complex terrain", "summary": "Simulation of land surface processes is problematic in heterogeneous terrain due to the the high resolution required of model grids to capture strong lateral variability caused by, for example, topography, and the lack of accurate meteorological forcing data at the site or scale it is required. Gridded data products produced by atmospheric models can fill this gap, however, often not at an appropriate spatial resolution to drive land-surface simulations. In this study we describe a method that uses the well-resolved description of the atmospheric column provided by climate models, together with high-resolution digital elevation models (DEMs), to downscale coarse-grid climate variables to a fine-scale subgrid. The main aim of this approach is to provide high-resolution driving data for a land-surface model (LSM). The method makes use of an interpolation of pressure-level data according to topographic height of the subgrid. An elevation and topography correction is used to downscale short-wave radiation. Long-wave radiation is downscaled by deriving a cloud-component of all-sky emissivity at grid level and using downscaled temperature and relative humidity fields to describe variability with elevation. Precipitation is downscaled with a simple non-linear lapse and optionally disaggregated using a climatology approach. We test the method in comparison with unscaled grid-level data and a set of reference methods, against a large evaluation dataset (up to 210 stations per variable) in the Swiss Alps. We demonstrate that the method can be used to derive meteorological inputs in c", "link": "https://doi.org/10.5194/gmd-7-387-2014", "authors": "J. Fiddes, S. Gruber", "source": "Geoscientific Model Development", "published": "2014-2-21", "first_seen": "2026-11-24T14:57:46+00:00", "score": 59, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-18-7907-2025", "title": "REMO2020: a modernised modular regional climate model", "summary": "This paper introduces REMO2020, a modernised version of the well-known and widely used REgional climate MOdel (REMO). REMO2020 has undergone fundamental changes in its code structure to provide a more modular, operationally focused design, facilitating the inclusion of new components and updates. Here, we describe the default configuration of REMO2020, which includes the following updates compared to the previous version, REMO2015: (i) the FLake lake model, (ii) a state-of-the-art MACv2-SP aerosol climatology, (iii) a newly developed three-layer snow module, (iv) a prognostic precipitation scheme, (v) an updated time filter, and (vi) a new tuning approach. Additionally, we describe some optional modules that can be activated separately, such as the interactive MOsaic-based VEgetation model iMOVE. REMO2020 outperforms its predecessor REMO2015 with regard to nearly all evaluation metrics used to evaluate simulations of Europe's climate. The persistent warm-temperature bias over central Europe and the cold-temperature bias over northern Europe have been significantly reduced in REMO2020. Similarly, the previously modelled dry bias in central Europe has been nearly eliminated, and the extent of the wet bias in eastern Europe has been reduced. The precipitation distribution in REMO2020 is much more realistic, especially in terms of heavy-precipitation extremes. Statistically, REMO2020 aligns better with long-term measurements than with older versions. Mountainous areas still present a challenge in REMO2020, especially with a higher vertical resolution. In this paper, we demonstr", "link": "https://doi.org/10.5194/gmd-18-7907-2025", "authors": "Joni-Pekka Pietikäinen, Kevin Sieck, Lars Buntemeyer, Thomas Frisius, Christine Nam, Peter Hoffmann, Christina Pop, Diana Rechid", "source": "Geoscientific Model Development", "published": "2025-10-28", "first_seen": "2026-11-24T14:57:46+00:00", "score": 59, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0064.1", "title": "Bayesian Deep Learning for Convective Initiation Nowcasting Uncertainty Estimation", "summary": "This study evaluated the probability and uncertainty forecasts of five recently proposed Bayesian deep learning methods relative to a deterministic residual neural network (ResNet) baseline for 0–1-h convective initiation (CI) nowcasting using Geostationary Operational Environmental Satellite ( GOES-16 ) satellite infrared observations. Uncertainty was assessed by how well probabilistic forecasts were calibrated and how well uncertainty separated forecasts with large and small errors. Three Bayesian deep learning methods produced probabilistic forecasts that were comparable to those of the deterministic ResNet. Among them, the initial-weights ensemble + Monte Carlo (MC) dropout, a collection of deterministic ResNets with different initial weights to start training and dropout activated during inference, produced the most well-calibrated probability forecasts and the most reliable uncertainty estimates. The Bayesian ResNet ensemble performed worse than the deterministic ResNet at certain forecast times, likely due to the challenge of optimizing a larger number of parameters. To address this issue, the Bayesian–Model Priors with Empirical Bayes using Deep neural network (MOPED) ResNet ensemble was adopted, which constrained the hypothesis search near the deterministic ResNet solution and achieved forecast skill comparable to that of the deterministic ResNet. All Bayesian methods demonstrated well-calibrated uncertainty and effectively separated cases with large and small errors. In generalization tests, the initial-weights ensemble + MC dropout demonstrated better forecast sk", "link": "https://doi.org/10.1175/aies-d-25-0064.1", "authors": "Da Fan, David John Gagne, Steven J. Greybush, Eugene E. Clothiaux, John S. Schreck, Chaopeng Shen", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-4", "first_seen": "2026-11-24T14:57:46+00:00", "score": 59, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-020-00148-5", "title": "Predicting global patterns of long-term climate change from short-term simulations using machine learning", "summary": "Understanding and estimating regional climate change under different anthropogenic emission scenarios is pivotal for informing societal adaptation and mitigation measures. However, the high computational complexity of state-of-the-art climate models remains a central bottleneck in this endeavour. Here we introduce a machine learning approach, which utilises a unique dataset of existing climate model simulations to learn relationships between short-term and long-term temperature responses to different climate forcing scenarios. This approach not only has the potential to accelerate climate change projections by reducing the costs of scenario computations, but also helps uncover early indicators of modelled long-term climate responses, which is of relevance to climate change detection, predictability, and attribution. Our results highlight challenges and opportunities for data-driven climate modelling, especially concerning the incorporation of even larger model datasets in the future. We therefore encourage extensive data sharing among research institutes to build ever more powerful climate response emulators, and thus to enable faster climate change projections.", "link": "https://doi.org/10.1038/s41612-020-00148-5", "authors": "L. A. Mansfield, P. J. Nowack, M. Kasoar, R. G. Everitt, W. J. Collins, A. Voulgarakis", "source": "npj Climate and Atmospheric Science", "published": "2020-11-19", "first_seen": "2026-11-24T14:57:46+00:00", "score": 59, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.70364", "title": "An observationally constrained probabilistic trigger for organized deep convection in a numerical weather prediction ensemble", "summary": "A novel stochastic parametrization scheme representing organized convection is described. The effects of mesoscale convective systems (MCSs) are represented in an observationally constrained manner, by probabilistically triggering an MCS scheme in regions of enhanced environmental total column water vapour. In combination with the probabilistic trigger, patterns with given spatio‐temporal scales determine where and when the scheme is active. Our scheme builds on the multiscale coherent structure parametrization (MCSP), which represents the top‐heavy heating structure associated with MCSs. The original and new MCSP schemes are tested in a numerical weather prediction ensemble. Both MCSP schemes improve the spatio‐temporal scales of tropical precipitation compared with a control, although both degrade the distribution of precipitation intensities. When the spread–error relationship of tropical precipitation is analysed, the new scheme successfully boosts spread compared with the original MCSP, improving the underdispersion of the ensemble seen with the original MCSP.", "link": "https://doi.org/10.1002/qj.70364", "authors": "M. R. Muetzelfeldt, R. S. Plant, H. M. Christensen, Z. Zhang, T. Woollings, A. Stirling, W. Tennant, M. Moncrieff", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2026-11-24", "first_seen": "2026-11-24T14:57:46+00:00", "score": 59, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.23216", "title": "Energy-Aware Earth System Science: A Community Roadmap", "summary": "Earth system models underpin the evidence that informs net-zero policy, yet their energy demands are rarely considered when judging model quality. Using archived output from 159 models spanning five generations of the Coupled Model Intercomparison Project (CMIP), we show that model error has fallen at a constant rate of 13.5 per cent per doubling of compute since 1995. Halving CMIP6 error would require 28 times more compute. Improvements are uneven, with sea-level pressure and surface air temperature errors declining 3.5-fold and 2.7-fold since CMIP1, but precipitation error by only 7 per cent. Machine-learning weather models match or exceed operational forecast skill at a fraction of the runtime, but none publishes measured energy, and including training changes how they rank. We propose a skill-energy framework that combines an empirical Pareto front with a ranking score. These findings argue for standardised reporting of energy use and performance ahead of CMIP8.", "link": "https://arxiv.org/abs/2610.23216", "authors": "Ioana Colfescu, Annalisa Bracco, Kara Moraw, Chen Lu, Michael Bareford, Tom Beucler, Massimo Bollasina, Juan Carlos Bilbao-Ludena", "source": "arXiv", "published": "2026-10-16", "first_seen": "2026-11-24T14:57:46+00:00", "score": 58, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": ["Tom Beucler"], "boosts": ["cmip6", "precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "arxiv:2610.28327", "title": "Observation Assimilation Transformer: Probabilistic Weather Analysis from Sparse Station Observations", "summary": "We present the Observation Assimilation Transformer (OAT), a geometry-aware neural process that corrects and refines a prior numerical weather prediction (NWP) field into a high-resolution posterior field by assimilating sparse observations. OAT is an encoder-decoder transformer that considers a set of observed locations and their NWP prior to condition predictions at a set of arbitrary unobserved query locations. Its sparse attention mechanism makes it scalable to thousands of station observations and depends on relative positions between locations, never on the absolute coordinates. The model allows for partially missing observations, predictions at arbitrary continuous locations without grid projection, and outputs are parametric distributions. A station-randomized training algorithm is developed with continuous ranked probability score (CRPS) loss. We test OAT on two datasets - one at regional scale with hundreds of stations, and one at continental scale with thousands of
