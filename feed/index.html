-09-19", "first_seen": "2026-11-24T14:57:46+00:00", "score": 82, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": ["Niklas Boers"], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1175/aies-d-24-0033.1", "title": "Validating Deep Learning Weather Forecast Models on Recent High-Impact Extreme Events", "summary": "The forecast accuracy of machine learning (ML) weather prediction models is improving rapidly, leading many to speak of a “second revolution in weather forecasting.” With numerous methods being developed and limited physical guarantees offered by ML models, there is a critical need for a comprehensive evaluation of these emerging techniques. While this need has been partly fulfilled by benchmark datasets, they provide little information on rare and impactful extreme events or on compound impact metrics, for which model accuracy might degrade due to misrepresented dependencies between variables. To address these issues, we compare ML weather prediction models (GraphCast, Pangu-Weather, and FourCastNet) and ECMWF’s high-resolution forecast system (HRES) in three case studies: the 2021 Pacific Northwest heatwave, the 2023 South Asian humid heatwave, and the North American winter storm in 2021. We find that ML weather prediction models locally achieve similar accuracy to HRES on the record-shattering Pacific Northwest heatwave but underperform when aggregated over space and time. However, they forecast the compound winter storm substantially better. We also highlight structural differences in how the errors of HRES and the ML models build up to that event. The ML forecasts lack important variables for a detailed assessment of the health risks of the 2023 humid heatwave. Using a possible substitute variable, prediction errors show spatial patterns with the highest danger levels over Bangladesh being underestimated by the ML models. Generally, case study–driven, impact-centric ev", "link": "https://doi.org/10.1175/aies-d-24-0033.1", "authors": "Olivier C. Pasche, Jonathan Wider, Zhongwei Zhang, Jakob Zscheischler, Sebastian Engelke", "source": "Artificial Intelligence for the Earth Systems", "published": "2025-1", "first_seen": "2026-11-24T14:57:46+00:00", "score": 82, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.06539", "title": "Evaluating the prediction of subgrid eddy kinetic energy from a machine learning model", "summary": "Global climate model resolution is still too coarse to fully resolve mesoscale processes, therefore subgrid closures are required to approximate the feedback of eddies onto the resolved flow. With high-resolution datasets now readily available, there has been a rapid growth in the use of machine learning to develop new eddy closures that could help reduce model biases and uncertainty. In this work we employ an offline learning approach with a convolutional neural network to predict subgrid eddy kinetic energy ($KE_e$), laying the initial groundwork for a machine-learned scale-aware GEOMETRIC eddy closure for the UK's Earth System Model. We address the question of whether global parameterizations are needed or if regional closures are sufficient by evaluating a number of neural network models through region and feature ablation experiments. ML parameterization models generalize to unseen regions when their training data share similar feature and target distributions with those regions. Models that fail to generalize incur distributional shift, or employ different filtering scales for the true eddy kinetic energy field. When holding out features, there is improvement among the generalizable ML models, with some feature spaces leading to improvements in some regions but degrading performance in others. Generally, power spectral density of $KE_e$ tend to diverge at small scales, though some feature spaces are able to minimize this divergence. Overall, the best performing model trained on all regions achieves time-mean and anomaly R2 scores of R2$\\approx 0.95$ and R2$\\approx 0.8", "link": "https://arxiv.org/abs/2611.06539", "authors": "Thomas Wilder, Ranjini Swaminathan, David Storkey, Till Kuhlbrodt", "source": "arXiv", "published": "2026-11-04", "first_seen": "2026-11-24T14:57:46+00:00", "score": 81, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2602.16515", "title": "Generative deep learning improves reconstruction of global historical climate records", "summary": "Instrumental observations from the early twentieth century are sparse and uncertain, limiting estimates of historical climate variability and change. Existing reconstructions rely largely on statistical interpolation, smoothing spatiotemporal variability and leading to underestimation of local extremes. Recent deterministic machine-learning approaches focus primarily on spatial inpainting of coarse-resolution temperature fields but do not explicitly quantify uncertainty or enforce spatiotemporal consistency. Here, we present GenCRest, a generative deep-learning model that reconstructs globally complete temperature and precipitation fields from sparse, uncertain observations using a generative prior learned from Earth-system models and reanalyses. GenCRest preserves accuracy, temporal persistence, and higher-order variability of climate dynamics, consistently outperforming statistical and machine-learning benchmarks. Applying GenCRest to observational records that underpin climate assessments, we find stronger early-twentieth-century ENSO variability and identify approximately 50% more El Niño events documented in the literature, which are not represented in established datasets. Our reconstructions reveal a more spatially heterogeneous history of temperature change during 1900--1980, with pronounced regional warming and cooling contrasts, particularly in the Arctic. For 1981--2024, our results suggest that recent assessments overestimate Arctic-mean warming due to interpolation smoothing, while underestimating warming in the Greenland, Barents, and Kara Seas. Furthermore, b", "link": "https://arxiv.org/abs/2602.16515", "authors": "Zhen Qian, Teng Liu, Duo Chan, Sebastian Bathiany, Shangshang Yang, Philipp Hess, Nils Bochow, Christian Burmester", "source": "arXiv", "published": "2026-02-18", "first_seen": "2026-11-24T14:57:46+00:00", "score": 81, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-14-5125-2021", "title": "COSMO-CLM regional climate simulations in the Coordinated Regional Climate Downscaling Experiment (CORDEX) framework: a review", "summary": "In the last decade, the Climate Limited-area Modeling Community (CLM-Community) has contributed to the Coordinated Regional Climate Downscaling Experiment (CORDEX) with an extensive set of regional climate simulations. Using several versions of the COSMO-CLM-Community model, ERA-Interim reanalysis and eight global climate models from phase 5 of the Coupled Model Intercomparison Project (CMIP5) were dynamically downscaled with horizontal grid spacings of 0.44 ∘ (∼ 50 km), 0.22 ∘ (∼ 25 km), and 0.11 ∘ (∼ 12 km) over the CORDEX domains Europe, South Asia, East Asia, Australasia, and Africa. This major effort resulted in 80 regional climate simulations publicly available through the Earth System Grid Federation (ESGF) web portals for use in impact studies and climate scenario assessments. Here we review the production of these simulations and assess their results in terms of mean near-surface temperature and precipitation to aid the future design of the COSMO-CLM model simulations. It is found that a domain-specific parameter tuning is beneficial, while increasing horizontal model resolution (from 50 to 25 or 12 km grid spacing) alone does not always improve the performance of the simulation. Moreover, the COSMO-CLM performance depends on the driving data. This is generally more important than the dependence on horizontal resolution, model version, and configuration. Our results emphasize the importance of performing regional climate projections in a coordinated way, where guidance from both the global (GCM) and regional (RCM) climate modeling communities is needed to increase ", "link": "https://doi.org/10.5194/gmd-14-5125-2021", "authors": "Silje Lund Sørland, Roman Brogli, Praveen Kumar Pothapakula, Emmanuele Russo, Jonas Van de Walle, Bodo Ahrens, Ivonne Anders, Edoardo Bucchignani", "source": "Geoscientific Model Development", "published": "2021-8-17", "first_seen": "2026-11-24T14:57:46+00:00", "score": 81, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-9-4087-2016", "title": "WCRP COordinated Regional Downscaling EXperiment (CORDEX): a diagnostic MIP for CMIP6", "summary": "The COordinated Regional Downscaling EXperiment (CORDEX) is a diagnostic model intercomparison project (MIP) in CMIP6. CORDEX builds on a foundation of previous downscaling intercomparison projects to provide a common framework for downscaling activities around the world. The CORDEX Regional Challenges provide a focus for downscaling research and a basis for making use of CMIP6 global climate model (GCM) output to produce downscaled projected changes in regional climates and assess sources of uncertainties in the projections, all of which can potentially be distilled into climate change information for vulnerability, impacts and adaptation studies. CORDEX Flagship Pilot Studies advance regional downscaling by targeting one or more of the CORDEX Regional Challenges. A CORDEX-CORE framework is planned that will produce a baseline set of homogeneous high-resolution, downscaled projections for regions worldwide. In CMIP6, CORDEX coordinates with ScenarioMIP and is structured to allow cross comparisons with HighResMIP and interaction with the CMIP6 VIACS Advisory Board.", "link": "https://doi.org/10.5194/gmd-9-4087-2016", "authors": "William J. Gutowski Jr., Filippo Giorgi, Bertrand Timbal, Anne Frigon, Daniela Jacob, Hyun-Suk Kang, Krishnan Raghavan, Boram Lee", "source": "Geoscientific Model Development", "published": "2016-11-17", "first_seen": "2026-11-24T14:57:46+00:00", "score": 81, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-18-6095-2025", "title": "Impact of spatial resolution on multi-scenario WRF-ARW simulations driven by the CMIP6 MPI-ESM1-2-HR global model: a focus on precipitation distribution over Italy", "summary": "We present the results of downscaling CMIP6 global climate projections to local scales for the Mediterranean and Italian regions, aiming to produce high-resolution climate information for the assessment of climate change signals, with a focus on precipitation extreme events. We performed hindcast (i.e., ERA5-driven) and historical simulations (driven by the MPI-ESM1-2-HR model) to simulate the present (1980–2014) and future (2015–2100) climate under three different emission scenarios (SSP1-2.6, SSP2-4.5, SSP5-8.5). For each experiment, a double-nesting approach is adopted to dynamically downscale global data to the regional domain of interest, firstly over the Europe (EURO) COordinated Regional climate Downscaling Experiment (CORDEX) domain, at a spatial resolution of 15 km, and then further refined (second nesting) over Italy and the northwestern Mediterranean at a resolution of 5 km, i.e., in the so-called gray zone (5–10 km), close to the convection-permitting (CP) limit. Besides validating the experimental protocol, this work potentially questions the need for climate simulations to always resort to deep convection parameterizations when spatial refinement is increased up to the limit of the CP scale, yet convective processes are still not explicitly resolved. Analyses of air temperature and precipitation are presented, with a focus on the spatial distribution of precipitation, its probability density function, and the statistics of extreme events for both current climate and far-end scenarios. By the end of the century for all the scenarios and seasons there is a proje", "link": "https://doi.org/10.5194/gmd-18-6095-2025", "authors": "Maria Vittoria Struglia, Alessandro Anav, Marta Antonelli, Sandro Calmanti, Franco Catalano, Alessandro Dell'Aquila, Emanuela Pichelli, Giovanna Pisacane", "source": "Geoscientific Model Development", "published": "2025-9-17", "first_seen": "2026-11-24T14:57:46+00:00", "score": 81, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0117.1", "title": "An NWP-Free, Observation-Driven Deep Learning Approach to Heavy-Rainfall Nowcasting beyond the Three-Hour Limit", "summary": "Quasi-stationary convective bands over Kyushu, Japan, frequently trigger rainy-season disasters, and hours with ≥50 mm h −1 rainfall are increasing. However, skillful nowcasts beyond 3 h remain limited. This study presents the Fused Lattice of Observation-Based Weather Sensors Network (FlowsNet), an observation-based multisensor fusion model that learns directly from radar/rain gauge–analyzed precipitation, surface variables from ground stations, geostationary satellite imagery, and satellite-derived precipitation context. The model targets category-4 (C4; ≥50 mm h −1 ) rainfall and incorporates two attention mechanisms: a channelwise module that weights informative modalities and a spatial module that aligns features with banded structures at multihour leads. Training uses a tail-aware ordinal loss that couples focal reweighting with an Earth mover’s distance–based ordinal penalty to emphasize rare extremes. FlowsNet maintains a nonzero C4 critical success index through 6 h. From 4 to 6 h, it matches or exceeds the Japan Meteorological Agency’s very-short-range forecast, and it outperforms a leading extrapolation-based method and state-of-the-art deep learning nowcasting models. Case studies show preserved band geometry and corridor placement at long lead over complex terrain. Ablation experiments identify satellite water vapor context and near-surface humidity as key for long-lead C4 prediction; combining satellite context with surface observations stabilizes placement and reduces false alarms. By avoiding numerical weather prediction model state and objective analyses/re", "link": "https://doi.org/10.1175/aies-d-25-0117.1", "authors": "Ryu Shimabukuro, Tomohiko Tomita, Tsuyoshi Yamaura, Ken-ichi Fukui", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 81, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0001.1", "title": "Regional Data-Driven Weather Modeling with a Global Stretched Grid", "summary": "We present Bris, a data-driven weather model suitable for regional forecasting applications. The model extends the Artificial Intelligence Forecasting System by introducing a stretched-grid architecture that dedicates higher resolution over a regional area of interest and maintains a lower resolution elsewhere on the globe. The model is based on graph neural networks, which naturally affords arbitrary multiresolution grid configurations. The model is applied to short-range weather prediction for the Nordics, producing forecasts at 2.5-km spatial and 6-h temporal resolutions. Bris is pretrained on 43 years of global ERA5 data at 31-km resolution and is further refined using 3.3 years of 2.5-km resolution operational analyses from the Meteorological Cooperation (MetCoOp) Ensemble Prediction System (MEPS). The performance of the model is evaluated against surface observations from measurement stations across Norway and is compared to short-range weather forecasts from MEPS. In terms of root-mean-square error, Bris outperforms both the control run and the ensemble mean of MEPS for 2-m temperature. Bris also produces competitive precipitation and wind speed forecasts but is shown to underestimate extreme events.", "link": "https://doi.org/10.1175/aies-d-25-0001.1", "authors": "Thomas Nils Nipen, Håvard Homleid Haugen, Magnus Sikora Ingstad, Even Marius Nordhagen, Aram Farhad Shafiq Salihi, Paulina Tedesco, Ivar Ambjørn Seierstad, Jørn Kristiansen", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-4", "first_seen": "2026-11-24T14:57:46+00:00", "score": 81, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024ms004485", "title": "Online Learning of Entrainment Closures in a Hybrid Machine Learning Parameterization", "summary": "This work integrates machine learning into an atmospheric parameterization to target uncertain mixing processes while maintaining interpretable, predictive, and well‐established physical equations. We adopt an eddy‐diffusivity mass‐flux (EDMF) parameterization for the unified modeling of various convective and turbulent regimes. To avoid drift and instability that plague offline‐trained machine learning parameterizations that are subsequently coupled with climate models, we frame learning as an inverse problem: Data‐driven models are embedded within the EDMF parameterization and trained online in a one‐dimensional vertical global climate model (GCM) column. Training is performed against output from large‐eddy simulations (LES) forced with GCM‐simulated large‐scale conditions in the Pacific. Rather than optimizing subgrid‐scale tendencies, our framework directly targets climate variables of interest, such as the vertical profiles of entropy and liquid water path. Specifically, we use ensemble Kalman inversion to simultaneously calibrate both the EDMF parameters and the parameters governing data‐driven lateral mixing rates. The calibrated parameterization outperforms existing EDMF schemes, particularly in tropical and subtropical locations of the present climate, and maintains high fidelity in simulating shallow cumulus and stratocumulus regimes under increased sea surface temperatures from AMIP4K experiments. The results showcase the advantage of physically constraining data‐driven models and directly targeting relevant variables through online learning to build robust and s", "link": "https://doi.org/10.1029/2024ms004485", "authors": "Costa Christopoulos, Ignacio Lopez‐Gomez, Tom Beucler, Yair Cohen, Charles Kawczynski, Oliver R. A. Dunbar, Tapio Schneider", "source": "Journal of Advances in Modeling Earth Systems", "published": "2024-11", "first_seen": "2026-11-24T14:57:46+00:00", "score": 81, "topics": ["Deep Learning", "Climate Modelling"], "watch": ["Tom Beucler"], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1007/s00382-026-08461-0", "title": "Ongoing challenges in the representation of minimum and maximum temperatures at the kilometer-scale in the European Alps: evaluating two downscaling approaches", "summary": "In regions with complex terrain, high-resolution models are necessary to study regional climate and climate change impacts. Due to the high computational costs of dynamical downscaling, statistical downscaling techniques are often preferred to generate information at the kilometer-scale, despite their known limitations. While the benefits of kilometer-scale modeling for precipitation and wind are well-established, temperature is rarely in the focus of evaluation. Thus, here we assess the representation of minimum and maximum daily temperatures in high-resolution regional climate models (RCMs) at the kilometer-scale in the Alpine countries Austria and Switzerland. We compare dynamically downscaled, convection-permitting RCMs with model ensembles which have been downscaled by applying bias adjustment methods. Dynamically downscaled kilometer-scale RCMs exhibit considerable season- and elevation-dependent temperature biases. A percentile-based evaluation approach demonstrates that these models tend to overestimate hot and cold extremes. Furthermore, despite being designed to replicate observed statistics, bias-adjusted models still show distributional artefacts of the raw input models. While convection-permitting models have been shown to greatly improve the representation of variables with high spatio-temporal variability, temperature is still prone to substantial biases. In their current state, dynamically downscaled models do not offer a more accurate representation of temperature in these regions than bias-adjusted output. Our results thus underscore the importance of mode", "link": "https://doi.org/10.1007/s00382-026-08461-0", "authors": "Isabella Kohlhauser, Alzbeta Medvedova, Nikolina Ban, Douglas Maraun", "source": "Climate Dynamics", "published": "2026-11-20", "first_seen": "2026-11-24T14:57:46+00:00", "score": 81, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2022.30", "title": "Long-term stability and generalization of observationally-constrained stochastic data-driven models for geophysical turbulence", "summary": "Recent years have seen a surge in interest in building deep learning-based fully data-driven models for weather prediction. Such deep learning models, if trained on observations can mitigate certain biases in current state-of-the-art weather models, some of which stem from inaccurate representation of subgrid-scale processes. However, these data-driven models, being over-parameterized, require a lot of training data which may not be available from reanalysis (observational data) products. Moreover, an accurate, noise-free, initial condition to start forecasting with a data-driven weather model is not available in realistic scenarios. Finally, deterministic data-driven forecasting models suffer from issues with long-term stability and unphysical climate drift, which makes these data-driven models unsuitable for computing climate statistics. Given these challenges, previous studies have tried to pre-train deep learning-based weather forecasting models on a large amount of imperfect long-term climate model simulations and then re-train them on available observational data. In this article, we propose a convolutional variational autoencoder (VAE)-based stochastic data-driven model that is pre-trained on an imperfect climate model simulation from a two-layer quasi-geostrophic flow and re-trained, using transfer learning, on a small number of noisy observations from a perfect simulation. This re-trained model then performs stochastic forecasting with a noisy initial condition sampled from the perfect simulation. We show that our ensemble-based stochastic data-driven model outperf", "link": "https://doi.org/10.1017/eds.2022.30", "authors": "Ashesh Chattopadhyay, Jaideep Pathak, Ebrahim Nabizadeh, Wahid Bhimji, Pedram Hassanzadeh", "source": "Environmental Data Science", "published": "2023", "first_seen": "2026-11-24T14:57:46+00:00", "score": 81, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-023-00397-0", "title": "Regional aerosol forecasts based on deep learning and numerical weather prediction", "summary": "Atmospheric chemistry transport models have been extensively applied in aerosol forecasts over recent decades, whereas they are facing challenges from uncertainties in emission rates, meteorological data, and over-simplified chemical parameterizations. Here, we developed a spatial-temporal deep learning framework, named PPN (Pollution-Predicting Net for PM 2.5 ), to accurately and efficiently predict regional PM 2.5 concentrations. It has an encoder-decoder architecture and combines the preceding PM 2.5 observations and numerical weather prediction. Besides, the model proposes a weighted loss function to promote the forecasting performance in extreme events. We applied the proposed model to forecast 3-day PM 2.5 concentrations over the Beijing-Tianjin-Hebei region in China on a three-hour-by-three-hour basis. Overall, the model showed good performance with R 2 and RMSE values of 0.7 and 17.7 μg m −3 , respectively. It could capture the high PM 2.5 concentration in the south and relatively low concentration in the north and exhibit better performance within the next 24 h. The use of the weighted loss function decreased the level of “high values underestimation, low values overestimation”, while incorporating the preceding PM 2.5 observations into the encoder phase improved the predictive accuracy within 24 h. We also compared the model result with that from a state-of-the-art numerical model (WRF-Chem with pollutant data assimilation). The temporal R 2 and RMSE from the WRF-Chem were 0.30−0.77 and 19−45 μg m −3 while those from the PPN model were 0.42−0.84 and 15−42 μg m −3 ", "link": "https://doi.org/10.1038/s41612-023-00397-0", "authors": "Yulu Qiu, Jin Feng, Ziyin Zhang, Xiujuan Zhao, Ziming Li, Zhiqiang Ma, Ruijin Liu, Jia Zhu", "source": "npj Climate and Atmospheric Science", "published": "2023-6-21", "first_seen": "2026-11-24T14:57:46+00:00", "score": 80, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-21-0207.1", "title": "Postprocessing of NWP Precipitation Forecasts Using Deep Learning", "summary": "This study analyzes the potential of deep learning using probabilistic artificial neural networks (ANNs) for postprocessing ensemble precipitation forecasts at four observation locations. We split the precipitation forecast problem into two tasks: estimating the probability of precipitation and predicting the hourly precipitation. We then compare the performance with classical statistical postprocessing (logistical regression and GLM). ANNs show a higher performance at three of the four stations for estimating the probability of precipitation and at all stations for predicting the hourly precipitation. Further, two more general ANN models are trained using the merged data from all four stations. These general ANNs exhibit an increase in performance compared to the station-specific ANNs at most stations. However, they show a significant decay in performance at one of the stations at estimating the hourly precipitation. The general models seem capable of learning meaningful interactions in the data and generalizing these to improve the performance at other sites, which also causes the loss of local information at one station. Thus, this study indicates the potential of deep learning in weather forecasting workflows.", "link": "https://doi.org/10.1175/waf-d-21-0207.1", "authors": "Adrian Rojas-Campos, Martin Wittenbrink, Pascal Nieters, Erik J. Schaffernicht, Jan D. Keller, Gordon Pipa", "source": "Weather and Forecasting", "published": "2023-3", "first_seen": "2026-11-24T14:57:46+00:00", "score": 80, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-26-0013.1", "title": "Generative and deterministic deep learning models comparison for fine-scale precipitation retrievals from infrared brightness temperature", "summary": "Accurate precipitation estimation at fine spatial scales is critical for hydrology, agriculture, and climate studies. Infrared brightness temperatures from geostationary satellites offer excellent temporal coverage over continental-scale domains. However, because these measurements primarily characterize cloud-top properties rather than precipitation processes near the surface, their correlation with rainfall intensity remains limited, making quantitative precipitation estimation challenging. In this study, we conduct a systematic inter-comparison of state-of-the-art deep learning models for high-resolution precipitation retrieval from Meteosat Second Generation infrared brightness temperatures over metropolitan France. These models include deterministic U-Nets, transformer-based architectures, conditional GANs, and diffusion models. We construct a curated dataset spanning 2008–2023, combining Météo-France radar mosaics as reference with multi-channel infrared observations, and design preprocessing and sampling strategies to address the heavy-tailed, intermittent nature of rainfall. Our results show that deterministic models provide robust mean estimates and excel in pixel-wise accuracy, but systematically under-estimate extreme precipitation. In contrast, generative models better capture the full precipitation distribution, including rare and heavy rainfall events, producing more realistic spatial structures at the cost of reduced pixel-wise fidelity. These results highlight a trade-off between pixel-wise accuracy and precipitation variability, showing that generative appr", "link": "https://doi.org/10.1175/aies-d-26-0013.1", "authors": "Matthieu Meignin, Cécile Mallet, Nicolas Viltard", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-11-5", "first_seen": "2026-11-24T14:57:46+00:00", "score": 79, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation", "extreme", "diffusion model"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-22-0035.1", "title": "Global Extreme Heat Forecasting Using Neural Weather Models", "summary": "Heatwaves are projected to increase in frequency and severity with global warming. Improved warning systems would help reduce the associated loss of lives, wildfires, power disruptions, and reduction in crop yields. In this work, we explore the potential for deep learning systems trained on historical data to forecast extreme heat on short, medium and subseasonal time scales. To this purpose, we train a set of neural weather models (NWMs) with convolutional architectures to forecast surface temperature anomalies globally, 1 to 28 days ahead, at ∼200-km resolution and on the cubed sphere. The NWMs are trained using the ERA5 reanalysis product and a set of candidate loss functions, including the mean-square error and exponential losses targeting extremes. We find that training models to minimize custom losses tailored to emphasize extremes leads to significant skill improvements in the heatwave prediction task, relative to NWMs trained on the mean-square-error loss. This improvement is accomplished with almost no skill reduction in the general temperature prediction task, and it can be efficiently realized through transfer learning, by retraining NWMs with the custom losses for a few epochs. In addition, we find that the use of a symmetric exponential loss reduces the smoothing of NWM forecasts with lead time. Our best NWM is able to outperform persistence in a regressive sense for all lead times and temperature anomaly thresholds considered, and shows positive regressive skill relative to the ECMWF subseasonal-to-seasonal control forecast after 2 weeks. Significance Statemen", "link": "https://doi.org/10.1175/aies-d-22-0035.1", "authors": "Ignacio Lopez-Gomez, Amy McGovern, Shreya Agrawal, Jason Hickey", "source": "Artificial Intelligence for the Earth Systems", "published": "2023-1", "first_seen": "2026-11-24T14:57:46+00:00", "score": 79, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-22-0036.1", "title": "Emulating Rainfall-Runoff-Inundation Model using Deep Neural Network with Dimensionality Reduction", "summary": "Predicting the spatial distribution of maximum inundation depth (depth-MAP) is important for the mitigation of hydrological disasters induced by extreme precipitation. However, physics-based rainfall-runoff-inundation (RRI) models, which are used operationally to predict hydrological disasters in Japan, require massive computational resources for numerical simulations. Here, we aimed at developing a computationally inexpensive deep learning model (Rain2Depth) that emulates an RRI model. Our study focused on the Omono River (Akita Prefecture, Japan) and predicted the depth-MAP from spatial and temporal rainfall data for individual events. Rain2Depth was developed based on a convolutional neural network (CNN), and predicts depth-MAP from 7-day successive hourly rainfall at 13 rain gauge stations in the basin. For training the Rain2Depth, we simulated the depth-MAP by the RRI model forced by 50-ensembles of 30-year data from large-ensemble weather/climate predictions. Instead of using the input and output data directly, we extracted important features from input and output data with two dimensionality reduction techniques (principal component analysis (PCA) and the CNN approach) prior to training the network. This dimensionality reduction aimed to avoid overfitting caused by insufficient training data. The nonlinear CNN approach was superior to the linear PCA for extracting features. Finally, Rain2Depth was architected by connecting the extracted features between input and output data through a neural network. Rain2Depth-based predictions were more accurate than predictions fr", "link": "https://doi.org/10.1175/aies-d-22-0036.1", "authors": "Masahiro Momoi, Shunji Kotsuki, Ryota Kikuchi, Satoshi Watanabe, Masafumi Yamada, Shiori Abe", "source": "Artificial Intelligence for the Earth Systems", "published": "2023-1-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 79, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-23-0107.1", "title": "Detecting Spatiotemporal Dynamics of Western European Heatwaves Using Deep Learning", "summary": "Heatwaves over western Europe are increasing faster than elsewhere, which recent studies have attributed at least partly to changes in atmospheric dynamics. To understand the dynamical drivers of heatwaves, we develop a heatwave classification based on their spatiotemporal evolution over western Europe. We use the KNMI large-ensemble time scale (KNMI-LENTIS) large ensemble dataset of 1600 years of present-day climate and find approximately 14 000 heatwaves. To detect heatwaves, we use the Generalized Density-based Spatial Clustering of Applications with Noise (GDBSCAN) algorithm to cluster together grid points based on their surface temperature extremes. For each heatwave, we extract a 5-day window of daily sea level pressure and streamfunction at 250 hPa, capturing their near-surface and upper-level atmospheric circulation. We use a 3D variational autoencoder (VAE) to extract compact representations from this high-dimensional circulation dataset. We reduce the dimensionality to a 128-dimensional latent space, which we analyze with several algorithms ( t -distributed stochastic neighbor embedding, k -means, and the Gaussian mixture model). This yields physically distinct types of heatwaves that are interpretable with known circulation patterns, i.e., U.K. high, Scandinavian high, Atlantic high, and Atlantic low. Our results indicate that the VAE can extract meaningful features from high-dimensional climate data. We find that the heatwave phase space, as found with opt-SNE, is continuous with the four circulation regimes at its corners but with soft boundaries between these ", "link": "https://doi.org/10.1175/aies-d-23-0107.1", "authors": "T. Happé, J. S. Wijnands, M. Á. Fernández-Torres, P. Scussolini, L. Muntjewerf, D. Coumou", "source": "Artificial Intelligence for the Earth Systems", "published": "2024-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 79, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-015-2597-y", "title": "Precipitation climatology over India: validation with observations and reanalysis datasets and spatial trends", "summary": "", "link": "https://doi.org/10.1007/s00382-015-2597-y", "authors": "P. Kishore, S. Jyothi, Ghouse Basha, S. V. B. Rao, M. Rajeevan, Isabella Velicogna, Tyler C. Sutterley", "source": "Climate Dynamics", "published": "2015-4-23", "first_seen": "2026-11-24T14:57:46+00:00", "score": 79, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2020ms002203", "title": "WeatherBench: A Benchmark Data Set for Data‐Driven Weather Forecasting", "summary": "Data‐driven approaches, most prominently deep learning, have become powerful tools for prediction in many domains. A natural question to ask is whether data‐driven methods could also be used to predict global weather patterns days in advance. First studies show promise but the lack of a common data set and evaluation metrics make intercomparison between studies difficult. Here we present a benchmark data set for data‐driven medium‐range weather forecasting (specifically 3–5 days), a topic of high scientific interest for atmospheric and computer scientists alike. We provide data derived from the ERA5 archive that has been processed to facilitate the use in machine learning models. We propose simple and clear evaluation metrics which will enable a direct comparison between different methods. Further, we provide baseline scores from simple linear regression techniques, deep learning models, as well as purely physical forecasting models. The data set is publicly available at https://github.com/pangeo‐data/WeatherBench and the companion code is reproducible with tutorials for getting started. We hope that this data set will accelerate research in data‐driven weather forecasting.", "link": "https://doi.org/10.1029/2020ms002203", "authors": "Stephan Rasp, Peter D. Dueben, Sebastian Scher, Jonathan A. Weyn, Soukayna Mouatadid, Nils Thuerey", "source": "Journal of Advances in Modeling Earth Systems", "published": "2020-11", "first_seen": "2026-11-24T14:57:46+00:00", "score": 78, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": ["Stephan Rasp"], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1029/2020ms002301", "title": "Potential and Limitations of Machine Learning for Modeling Warm‐Rain Cloud Microphysical Processes", "summary": "The use of machine learning based on neural networks for cloud microphysical parameterizations is investigated. As an example, we use the warm‐rain formation by collision‐coalescence, that is, the parameterization of autoconversion, accretion, and self‐collection of droplets in a two‐moment framework. Benchmark solutions of the kinetic collection equations are performed using a Monte Carlo superdroplet algorithm. The superdroplet method provides reliable but noisy estimates of the warm‐rain process rates. For each process rate, a neural network is trained using standard machine learning techniques. The resulting models make skillful predictions for the process rates when compared to the testing data. However, when solving the ordinary differential equations, the solutions are not as good as those of an established warm‐rain parameterization. This deficiency can be seen as a limitation of the machine learning methods that are applied, but at the same time, it points toward a fundamental ill‐posedness of the commonly used two‐moment warm‐rain schemes. More advanced machine learning methods that include a notion of time derivatives, therefore, have the potential to overcome these problems.", "link": "https://doi.org/10.1029/2020ms002301", "authors": "Axel Seifert, Stephan Rasp", "source": "Journal of Advances in Modeling Earth Systems", "published": "2020-11-30", "first_seen": "2026-11-24T14:57:46+00:00", "score": 78, "topics": ["Deep Learning", "Climate Modelling"], "watch": ["Stephan Rasp"], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1029/2020ms002109", "title": "Improving Data‐Driven Global Weather Prediction Using Deep Convolutional Neural Networks on a Cubed Sphere", "summary": "We present a significantly improved data‐driven global weather forecasting framework using a deep convolutional neural network (CNN) to forecast several basic atmospheric variables on a global grid. New developments in this framework include an off‐line volume‐conservative mapping to a cubed‐sphere grid, improvements to the CNN architecture and the minimization of the loss function over multiple steps in a prediction sequence. The cubed‐sphere remapping minimizes the distortion on the cube faces on which convolution operations are performed and provides natural boundary conditions for padding in the CNN. Our improved model produces weather forecasts that are indefinitely stable and produce realistic weather patterns at lead times of several weeks and longer. For short‐ to medium‐range forecasting, our model significantly outperforms persistence, climatology, and a coarse‐resolution dynamical numerical weather prediction (NWP) model. Unsurprisingly, our forecasts are worse than those from a high‐resolution state‐of‐the‐art operational NWP system. Our data‐driven model is able to learn to forecast complex surface temperature patterns from few input atmospheric state variables. On annual time scales, our model produces a realistic seasonal cycle driven solely by the prescribed variation in top‐of‐atmosphere solar forcing. Although it currently does not compete with operational weather forecasting models, our data‐driven CNN executes much faster than those models, suggesting that machine learning could prove to be a valuable tool for large‐ensemble forecasting.", "link": "https://doi.org/10.1029/2020ms002109", "authors": "Jonathan A. Weyn, Dale R. Durran, Rich Caruana", "source": "Journal of Advances in Modeling Earth Systems", "published": "2020-9", "first_seen": "2026-11-24T14:57:46+00:00", "score": 77, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-023-00512-1", "title": "FuXi: a cascade machine learning forecasting system for 15-day global weather forecast", "summary": "Over the past few years, the rapid development of machine learning (ML) models for weather forecasting has led to state-of-the-art ML models that have superior performance compared to the European Centre for Medium-Range Weather Forecasts (ECMWF)’s high-resolution forecast (HRES), which is widely considered as the world’s best physics-based weather forecasting system. Specifically, ML models have outperformed HRES in 10-day forecasts with a spatial resolution of 0.25 ∘ . However, the challenge remains in mitigating the accumulation of forecast errors for longer effective forecasts, such as achieving comparable performance to the ECMWF ensemble in 15-day forecasts. Despite various efforts to reduce accumulation errors, such as implementing autoregressive multi-time step loss, relying on a single model has been found to be insufficient for achieving optimal performance in both short and long lead times. Therefore, we present FuXi, a cascaded ML weather forecasting system that provides 15-day global forecasts at a temporal resolution of 6 hours and a spatial resolution of 0.25 ∘ . FuXi is developed using 39 years of the ECMWF ERA5 reanalysis dataset. The performance evaluation demonstrates that FuXi has forecast performance comparable to ECMWF ensemble mean (EM) in 15-day forecasts. FuXi surpasses the skillful forecast lead time achieved by ECMWF HRES by extending the lead time for Z500 from 9.25 to 10.5 days and for T2M from 10 to 14.5 days. Moreover, the FuXi ensemble is created by perturbing initial conditions and model parameters, enabling it to provide forecast uncertaint", "link": "https://doi.org/10.1038/s41612-023-00512-1", "authors": "Lei Chen, Xiaohui Zhong, Feng Zhang, Yuan Cheng, Yinghui Xu, Yuan Qi, Hao Li", "source": "npj Climate and Atmospheric Science", "published": "2023-11-16", "first_seen": "2026-11-24T14:57:46+00:00", "score": 77, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/2017ms001003", "title": "Impact of bias‐corrected reanalysis‐derived lateral boundary conditions on WRF simulations", "summary": "Lateral and lower boundary conditions derived from a suitable global reanalysis data set form the basis for deriving a dynamically consistent finer resolution downscaled product for climate and hydrological assessment studies. A problem with this, however, is that systematic biases have been noted to be present in the global reanalysis data sets that form these boundaries, biases which can be carried into the downscaled simulations thereby reducing their accuracy or efficacy. In this work, three Weather Research and Forecasting (WRF) model downscaling experiments are undertaken to investigate the impact of bias correcting European Centre for Medium range Weather Forecasting Reanalysis ERA‐Interim (ERA‐I) atmospheric temperature and relative humidity using Atmospheric Infrared Sounder (AIRS) satellite data. The downscaling is performed over a domain centered over southern Africa between the years 2003 and 2012. The sample mean and the mean as well as standard deviation at each grid cell for each variable are used for bias correction. The resultant WRF simulations of near‐surface temperature and precipitation are evaluated seasonally and annually against global gridded observational data sets and compared with ERA‐I reanalysis driving field. The study reveals inconsistencies between the impact of the bias correction prior to downscaling and the resultant model simulations after downscaling. Mean and standard deviation bias‐corrected WRF simulations are, however, found to be marginally better than mean only bias‐corrected WRF simulations and raw ERA‐I reanalysis‐driven WRF sim", "link": "https://doi.org/10.1002/2017ms001003", "authors": "Ditiro Benson Moalafhi, Ashish Sharma, Jason Peter Evans, Rajeshwar Mehrotra, Eytan Rocheta", "source": "Journal of Advances in Modeling Earth Systems", "published": "2017-8", "first_seen": "2026-11-24T14:57:46+00:00", "score": 76, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2018jd030094", "title": "Thirty Years of Regional Climate Modeling: Where Are We and Where Are We Going next?", "summary": "The year 2019 marks the thirtieth anniversary of the development of the first regional climate model (RCM), and here an overview is provided of the progress in regional modeling research and of the main challenges lying ahead. RCMs were primarily developed to provide fine‐scale climate information for impact studies, but they have evolved into general and multipurpose modeling tools. Among the main achievements in RCM research the focus is on: the development of community RCMs applicable to a wide variety of studies and regional contexts; the increase of model simulation length up to centennial scales and spatial resolutions up to convection‐permitting scales (few kilometers), leading to a better understanding of regional to local climate change signals; the development of fully coupled Regional Earth System Models; the inception of intercomparison projects culminating in the international Coordinated Regional Climate Downscaling Experiment; the extensive use of RCM simulations for impact assessments; and the involvement of the scientific community from developing countries in climate modeling research. Among the outstanding issues in need of more attention are the Added Value of using this downscaling technique; various technical aspects concerning RCM simulations; and uncertainties in RCM‐based climate projections. Future directions in RCM research are discussed, with highlight on: transition to convection‐permitting modeling systems; further development of Regional Earth System Models including the human component; next phase of the Coordinated Regional Climate Downscali", "link": "https://doi.org/10.1029/2018jd030094", "authors": "Filippo Giorgi", "source": "JGR: Atmospheres", "published": "2019-6-13", "first_seen": "2026-11-24T14:57:46+00:00", "score": 76, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2026.10038", "title": "Assessing the risk of future Dunkelflaute events for Germany using generative deep learning", "summary": "The European electricity power grid is transitioning toward renewable energy sources, characterized by an increasing share of offshoreand onshore wind and solar power. However, the weather dependency of these energy sources poses a challenge to grid stability, with so-called Dunkelflaute events—periods of low wind and solar power generation—being of particular concern due to their potential to cause electricity supply shortages. In this study, we investigate the impact of these events on the German electricity production in the years and decades to come. For this purpose, we adapt a recently developed generative deep learning framework to downscale climate simulations from the CMIP6 ensemble. We first compare their statistics to the historical record taken from ERA5 data. Next, we use these downscaled simulations to assess plausible future occurrences of Dunkelflaute events in Germany under the optimistic low (SSP2–4.5) and high (SSP5–8.5) emission scenarios. Our analysis indicates that both the frequency and duration of Dunkelflaute events in Germany in the ensemble mean are projected to remain largely unchanged compared to the historical period. This suggests that, under the considered climate scenarios, the associated risk is expected to remain stable throughout the century.", "link": "https://doi.org/10.1017/eds.2026.10038", "authors": "Felix Strnad, Jonathan Schmidt, Fabian Mockert, Philipp Hennig, Nicole Ludwig", "source": "Environmental Data Science", "published": "2026", "first_seen": "2026-11-24T14:57:46+00:00", "score": 76, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-23-0103.1", "title": "Beyond Ensemble Averages: Leveraging Climate Model Ensembles for Subseasonal Forecasting", "summary": "Producing high-quality forecasts of key climate variables, such as temperature and precipitation, on subseasonal time scales has long been a gap in operational forecasting. This study explores an application of machine learning (ML) models as postprocessing tools for subseasonal forecasting. Lagged numerical ensemble forecasts (i.e., an ensemble where the members have different initialization dates) and observational data, including relative humidity, pressure at sea level, and geopotential height, are incorporated into various ML methods to predict monthly average precipitation and 2-m temperature 2 weeks in advance for the continental United States. For regression, quantile regression, and tercile classification tasks, we consider using linear models, random forests, convolutional neural networks, and stacked models (a multimodel approach based on the prediction of the individual ML models). Unlike previous ML approaches that often use ensemble mean alone, we leverage information embedded in the ensemble forecasts to enhance prediction accuracy. Additionally, we investigate extreme event predictions that are crucial for planning and mitigation efforts. Considering ensemble members as a collection of spatial forecasts, we explore different approaches to using spatial information. Trade-offs between different approaches may be mitigated with model stacking. Our proposed models outperform standard baselines such as climatological forecasts and ensemble means. In addition, we investigate feature importance, trade-offs between using the full ensemble or only the ensemble mean,", "link": "https://doi.org/10.1175/aies-d-23-0103.1", "authors": "Elena Orlova, Haokun Liu, Raphael Rossellini, Benjamin A. Cash, Rebecca Willett", "source": "Artificial Intelligence for the Earth Systems", "published": "2024-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 75, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2019ms001958", "title": "Analog Forecasting of Extreme‐Causing Weather Patterns Using Deep Learning", "summary": "Numerical weather prediction models require ever‐growing computing time and resources but, still, have sometimes difficulties with predicting weather extremes. We introduce a data‐driven framework that is based on analog forecasting (prediction using past similar patterns) and employs a novel deep learning pattern‐recognition technique (capsule neural networks, CapsNets) and an impact‐based autolabeling strategy. Using data from a large‐ensemble fully coupled Earth system model, CapsNets are trained on midtropospheric large‐scale circulation patterns (Z500) labeled 0–4 depending on the existence and geographical region of surface temperature extremes over North America several days ahead. The trained networks predict the occurrence/region of cold or heat waves, only using Z500, with accuracies (recalls) of 69–45% (77–48%) or 62–41% (73–47%) 1–5 days ahead. Using both surface temperature and Z500, accuracies (recalls) with CapsNets increase to 80% (88%). In both cases, CapsNets outperform simpler techniques such as convolutional neural networks and logistic regression, and their accuracy is least affected as the size of the training set is reduced. The results show the promises of multivariate data‐driven frameworks for accurate and fast extreme weather predictions, which can potentially augment numerical weather prediction efforts in providing early warnings.", "link": "https://doi.org/10.1029/2019ms001958", "authors": "Ashesh Chattopadhyay, Ebrahim Nabizadeh, Pedram Hassanzadeh", "source": "Journal of Advances in Modeling Earth Systems", "published": "2020-2", "first_seen": "2026-11-24T14:57:46+00:00", "score": 75, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.36944", "title": "Impact of Cumulus Parameterization and Cloud Microphysics on WRF Simulation of an Extreme Rainfall Event over Maharashtra, India: A 3 by 3 Factorial Assessment", "summary": "Simulating extreme monsoon rainfall over the Konkan coast and Western Ghats remains challenging at 9 km resolution, where convection is partly resolved and partly parameterised. This study evaluates the sensitivity of Weather Research and Forecasting (WRF) simulations of the 5-7 July 2026 Maharashtra rainfall event to cumulus and cloud microphysics schemes. Nine simulations employed a 3 x 3 factorial design combining WSM6, WDM6 and Thompson microphysics with Kain-Fritsch, Tiedtke and Grell-Freitas cumulus schemes. Rainfall was evaluated against IMD 0.25-degree gridded observations, with IMERG and ERA5 as additional references. A descriptive factorial decomposition showed that cumulus parameterisation accounted for 97.3% of across-experiment variation in mean rainfall, 88.2% in RMSE and 84.7% in spatial correlation, while microphysics contributed 2.0%, 2.1% and 9.3%, respectively. Kain-Fritsch produced the highest spatial correlations (0.533-0.581) but substantially overestimated rainfall. Tiedtke achieved the smallest mean biases and RMSE, although compensating regional errors concealed a 28-34% rainfall deficit over the Konkan-Ghats belt and substantial underestimation on 7 July. Grell-Freitas showed large wet biases and relatively high RMSE. All nine simulations displaced the event-total rainfall maximum approximately 140-195 km northward. WSM6-Tiedtke achieved the lowest RMSE, whereas Thompson-Kain-Fritsch better represented the rainfall spatial pattern. The findings demonstrate that, for this event and fixed model configuration, cumulus parameterisation exerted substant", "link": "https://arxiv.org/abs/2610.36944", "authors": "Devesh, Satyam Kumar, Akshay Sunil", "source": "arXiv", "published": "2026-10-27", "first_seen": "2026-11-24T14:57:46+00:00", "score": 74, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "monsoon", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-11-2563-2018", "title": "Comparison of spatial downscaling methods of general circulation model results to study climate variability during the Last Glacial Maximum", "summary": "The extent to which climate conditions influenced the spatial distribution of hominin populations in the past is highly debated. General circulation models (GCMs) and archaeological data have been used to address this issue. Most GCMs are not currently capable of simulating past surface climate conditions with sufficiently detailed spatial resolution to distinguish areas of potential hominin habitat, however. In this paper, we propose a statistical downscaling method (SDM) for increasing the resolution of climate model outputs in a computationally efficient way. Our method uses a generalised additive model (GAM), calibrated over present-day climatology data, to statistically downscale temperature and precipitation time series from the outputs of a GCM simulating the climate of the Last Glacial Maximum (19 000–23 000 BP) over western Europe. Once the SDM is calibrated, we first interpolate the coarse-scale GCM outputs to the final resolution and then use the GAM to compute surface air temperature and precipitation levels using these interpolated GCM outputs and fine-resolution geographical variables such as topography and distance from an ocean. The GAM acts as a transfer function, capturing non-linear relationships between variables at different spatial scales and correcting for the GCM biases. We tested three different techniques for the first interpolation of GCM output: bilinear, bicubic and kriging. The resulting SDMs were evaluated by comparing downscaled temperature and precipitation at local sites with paleoclimate reconstructions based on paleoclimate archives (arch", "link": "https://doi.org/10.5194/gmd-11-2563-2018", "authors": "Guillaume Latombe, Ariane Burke, Mathieu Vrac, Guillaume Levavasseur, Christophe Dumas, Masa Kageyama, Gilles Ramstein", "source": "Geoscientific Model Development", "published": "2018-7-3", "first_seen": "2026-11-24T14:57:46+00:00", "score": 74, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-26-0056.1", "title": "Optimizing CorrDiff for High-Resolution Downscaling: Sensitivity to Training Design and Multivariate Conditioning over Complex Terrain in Taiwan", "summary": "High-resolution atmospheric downscaling is essential for regional climate applications, yet the systematic optimization of generative AI/ML-based frameworks for operational deployment remains insufficiently characterized. This study evaluates the sensitivity and robustness of Corrective Diffusion (CorrDiff) using a 33-year paired dataset comprising ERA5 reanalysis and the 2-km Taiwan Re-Analysis Downscaling (TReAD) dataset over Taiwan’s complex terrain. Controlled experiments examine sensitivity to training data length, atmospheric predictor configuration and multivariate output strategy, and variable-dependent downscaling performance. Precipitation downscaling skill generally improves with training length, with diminishing marginal gains beyond approximately 20 years within the 5–25-year range examined. A pronounced land–sea asymmetry in improvement is identified, consistent with a terrain-locking interpretation in which complex orography produces persistent, learnable precipitation structures over land. Joint downscaling of multiple surface variables generally improves precipitation spatial skill relative to single-variable approaches. When ERA5 precipitation is available as a predictor, a surface-only multivariate configuration approaches the performance of the full three-dimensional configuration; when precipitation is removed, three-dimensional atmospheric information becomes more valuable, while adding 850-hPa specific humidity recovers most of the resulting RMSE degradation, particularly during convectively dominated seasons. CorrDiff also achieves substantially larg", "link": "https://doi.org/10.1175/aies-d-26-0056.1", "authors": "Jing-Shan Hong, Ching-Teng Lee, Yun-Ting Jhu, Yun-Jing Chen, Tzu-Ting Lo, Wan-Ling Tseng", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-11-19", "first_seen": "2026-11-24T14:57:46+00:00", "score": 74, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2024.24", "title": "Cloudy with a chance of precision: satellite’s autoconversion rates forecasting powered by machine learning", "summary": "Precipitation is one of the most relevant weather and climate processes. Its formation rate is sensitive to perturbations such as by the interactions between aerosols, clouds, and precipitation. These interactions constitute one of the biggest uncertainties in determining the radiative forcing of climate change. High-resolution simulations such as the ICOsahedral non-hydrostatic large-eddy model (ICON-LEM) offer valuable insights into these interactions. However, due to exceptionally high computation costs, it can only be employed for a limited period and area. We address this challenge by developing new models powered by emerging machine learning approaches capable of forecasting autoconversion rates—the rate at which small droplets collide and coalesce becoming larger droplets—from satellite observations providing long-term global spatial coverage for more than two decades. In particular, our approach involves two phases: (1) we develop machine learning models which are capable of predicting autoconversion rates by leveraging high-resolution climate model data, (2) we repurpose our best machine learning model to predict autoconversion rates directly from satellite observations. We compare the performance of our machine learning models against simulation data under several different conditions, showing from both visual and statistical inspections that our approaches are able to identify key features of the reference simulation data to a high degree. Additionally, the autoconversion rates obtained from the simulation output and satellite data (predicted) demonstrate statist", "link": "https://doi.org/10.1017/eds.2024.24", "authors": "Maria Carolina Novitasari, Johannes Quaas, Miguel R. D. Rodrigues", "source": "Environmental Data Science", "published": "2024", "first_seen": "2026-11-24T14:57:46+00:00", "score": 74, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-15-5967-2022", "title": "Rad-cGAN v1.0: Radar-based precipitation nowcasting model with conditional generative adversarial networks for multiple dam domains", "summary": "Numerical weather prediction models and probabilistic extrapolation methods using radar images have been widely used for precipitation nowcasting. Recently, machine-learning-based precipitation nowcasting models have also been actively developed for relatively short-term precipitation predictions. This study was aimed at developing a radar-based precipitation nowcasting model using an advanced machine-learning technique, conditional generative adversarial network (cGAN), which shows high performance in image generation tasks. The cGAN-based precipitation nowcasting model, named Rad-cGAN, developed in this study was trained with the radar reflectivity data of the Soyang-gang Dam basin in South Korea with a spatial domain of 128 × 128 pixels, spatial resolution of 1 km, and temporal resolution of 10 min. The model performance was evaluated using previously developed machine-learning-based precipitation nowcasting models, namely convolutional long short-term memory (ConvLSTM) and U-Net. In addition, Eulerian persistence model and pySTEPS, a radar-based deterministic nowcasting system, are used as baseline models. We demonstrated that Rad-cGAN outperformed reference models at 10 min lead time prediction for the Soyang-gang Dam basin based on verification metrics: Pearson correlation coefficient ( R ), root mean square error (RMSE), Nash–Sutcliffe efficiency (NSE), critical success index (CSI), and fraction skill scores (FSS) at an intensity threshold of 0.1, 1.0, and 5.0 mm h −1 . However, unlike low rainfall intensity, the CSI at high rainfall intensity in Rad-cGAN deteriorate", "link": "https://doi.org/10.5194/gmd-15-5967-2022", "authors": "Suyeon Choi, Yeonjoo Kim", "source": "Geoscientific Model Development", "published": "2022-8-1", "first_seen": "2026-11-24T14:57:46+00:00", "score": 73, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-23-0089.1", "title": "Multidecadal Sea Level Prediction Using Neural Networks and Spectral Clustering on Climate Model Large Ensembles and Satellite Altimeter Data", "summary": "Sea surface height observations provided by satellite altimetry since 1993 show a rising rate (3.4 mm yr −1 ) for global mean sea level. While on average, sea level has risen 10 cm over the last 30 years, there is considerable regional variation in the sea level change. Through this work, we predict sea level trends 30 years into the future at a 2° spatial resolution and investigate the future patterns of the sea level change. We show the potential of machine learning (ML) in this challenging application of long-term sea level forecasting over the global ocean. Our approach incorporates sea level data from both altimeter observations and climate model simulations. We develop a supervised learning framework using fully connected neural networks (FCNNs) that can predict the sea level trend based on climate model projections. Alongside this, our method provides uncertainty estimates associated with the ML prediction. We also show the effectiveness of partitioning our spatial dataset and learning a dedicated ML model for each segmented region. We compare two partitioning strategies: one achieved using domain knowledge and the other employing spectral clustering. Our results demonstrate that segmenting the spatial dataset with spectral clustering improves the ML predictions. Significance Statement Long-term projections are needed to help coastal communities adapt to sea level rise. Forecasting multidecadal sea level change is a complex problem. In this paper, we show the promise of machine learning in producing such forecasts 30 years in advance and over the global ocean. Contin", "link": "https://doi.org/10.1175/aies-d-23-0089.1", "authors": "Saumya Sinha, John Fasullo, R. Steven Nerem, Claire Monteleoni", "source": "Artificial Intelligence for the Earth Systems", "published": "2024-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 73, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2019ea000740", "title": "Comparative Assessment of Various Machine Learning‐Based Bias Correction Methods for Numerical Weather Prediction Model Forecasts of Extreme Air Temperatures in Urban Areas", "summary": "Forecasts of maximum and minimum air temperatures are essential to mitigate the damage of extreme weather events such as heat waves and tropical nights. The Numerical Weather Prediction (NWP) model has been widely used for forecasting air temperature, but generally it has a systematic bias due to its coarse grid resolution and lack of parametrizations. This study used random forest (RF), support vector regression (SVR), artificial neural network (ANN) and a multi‐model ensemble (MME) to correct the Local Data Assimilation and Prediction System (LDAPS; a local NWP model over Korea) model outputs of next‐day maximum and minimum air temperatures ( and ) in Seoul, South Korea. A total of 14 LDAPS model forecast data, the daily maximum and minimum air temperatures of in‐situ observations, and five auxiliary data were used as input variables. The results showed that the LDAPS model had an R 2 of 0.69, a bias of −0.85 °C and an RMSE of 2.08 °C for forecast, whereas the proposed models resulted in the improvement with R 2 from 0.75 to 0.78, bias from −0.16 to −0.07 °C and RMSE from 1.55 to 1.66 °C by hindcast validation. For forecasting , the LDAPS model had an R 2 of 0.77, a bias of 0.51 °C and an RMSE of 1.43 °C by hindcast, while the bias correction models showed R 2 values ranging from 0.86 to 0.87, biases from −0.03 to 0.03 °C, and RMSEs from 0.98 to 1.02 °C. The MME model had better generalization performance than the three single machine learning models by hindcast validation and leave‐one‐station‐out cross‐validation.", "link": "https://doi.org/10.1029/2019ea000740", "authors": "Dongjin Cho, Cheolhee Yoo, Jungho Im, Dong‐Hyun Cha", "source": "Earth and Space Science", "published": "2020-3-28", "first_seen": "2026-11-24T14:57:46+00:00", "score": 73, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ea003227", "title": "Deep Learning for Daily 2‐m Temperature Downscaling", "summary": "This study proposes a novel method, which is a U‐shaped convolutional neural network that combines non‐local attention mechanisms, Res2net residual modules, and terrain information (UNR‐Net). The original U‐Net method and the linear regression (LR) method are conducted as benchmarks. Generally, the UNR‐Net has demonstrated promise in performing a 10× downscaling for daily 2‐m temperature over North China with lead times of 1–7 days and shows superiority to the U‐Net and LR methods. To be specific, U‐Net and UNR‐Net demonstrate higher Nash‐Sutcliffe Efficiency coefficient values compared to LR by 0.052 and 0.077, respectively. The corresponding improvements in pattern correlation coefficient are 0.013 and 0.016, while the root mean square error values are higher by 0.22 and 0.338, respectively. Additionally, the structural similarity index metric is higher by 0.033 and lower by 0.015. Furthermore, regions with significant errors are primarily distributed in complex terrain areas such as the Taihang Mountains, where UNR‐Net exhibits noticeable improvements. In addition, the 12 components‐based error decomposition method is proposed to analyze the error source of different models. Generally, the smallest errors are observed during the summer season and the sequence error component is proven to be the main source error of 2‐m temperature forecasts. Furthermore, UNR‐Net consistently demonstrates the lowest errors among all 12 error components. Therefore, combining the numerical weather prediction model and deep learning method is very promising in downscaling temperature forecas", "link": "https://doi.org/10.1029/2023ea003227", "authors": "Shuyan Ding, Xiefei Zhi, Yang Lyu, Yan Ji, Weijun Guo", "source": "Earth and Space Science", "published": "2024-2", "first_seen": "2026-11-24T14:57:46+00:00", "score": 73, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2026jd046857", "title": "Changes in Lake‐Effect Snow Across the Great Lakes Revealed Using Dynamically Downscaled Climate Simulations", "summary": "The Laurentian Great Lakes region experiences mesoscale lake‐effect snow bands during the boreal cold season. These events can produce extreme whiteout conditions, high snowfall accumulations, and significant localized impacts on transportation and regional economies. Lake‐effect snow develops under combinations of temperature, wind shear, and atmospheric instability, all of which are expected to change in a warming climate. Understanding how climate change may influence lake‐effect precipitation is therefore important for anticipating regional hazards. General circulation models (GCMs), the primary tools used to study climate and natural hazards, are typically too coarse to resolve mesoscale processes such as lake‐effect precipitation. Moreover, even high‐resolution global models vary substantially in their treatment of the Great Lakes and their ability to reproduce recognizable lake‐effect snowfall patterns. High‐resolution dynamical downscaling is therefore required to better represent these processes. This study analyzes simulations from a high‐resolution dynamically downscaled GCM over the contiguous United States, with grid spacing sufficient to explicitly represent convective processes relevant to lake‐effect precipitation. Three 15‐year periods are examined: historical (1990–2005), mid‐century (2040–2055), and end‐of‐century (2085–2100) under the Representative Concentration Pathway 8.5 scenario. Results indicate that snowfall from lake‐effect events is projected to persist and, in some regions, increase in intensity. The strongest events become more intense, partic", "link": "https://doi.org/10.1029/2026jd046857", "authors": "Shaun Laurinaitis, Zachary J. Lebo, Victor Gensini, Stefan Rahimi, Walker Ashley, Alex Haberlie, Allison Michaelis", "source": "JGR: Atmospheres", "published": "2026-11-24", "first_seen": "202
