MSG/SEVIRI", "summary": "Accurate quantification of precipitation is critical for anticipating extreme cli mate events such as droughts and flash floods, yet ground rain gauges and weather radars in Northern Algeria suffer from limited spatial coverage and high maintenance costs. Satellite remote sensing via Meteosat Second Generation (MSG/SEVIRI) multispectral imagery offers optimal spatio-temporal coverage, but converting indirect cloud-top properties into direct rainfall rates remains challenging. To overcome the limitations of standard machine learning and conventional convolutional neural networks in modeling long-range atmospheric dependencies, this study proposes a novel end-to-end hybrid deep learning architecture, combining ConvNeXt, Dual-Transformer, and U-Net models, for direct pixel-wise precipitation regression without intermediate classification. The model leverages a ConvNeXt backbone with large-kernel depthwise convolutions for local spatial feature extraction, a Dual-Transformer module utilizing parallel spatial and spectral attention to capture non-local cloud structures, and a U-Net decoder with multi-scale skip connections for high-resolution rainfall reconstruction. Trained and validated against reference target fields constructed from weather radar and rain gauge fusion covering 2006–2012, the proposed ConvNeXt + Dual-Transformer + U-Net framework demonstrates superior performance over traditional machine learning baselines (RF, MLP, SVM) and standard CNN architectures (U-Net, ConvNeXt + U-Net). The model effectively reduces heteroscedastic error dispersion, achieving Pearson ", "link": "https://doi.org/10.3390/geomatics6050115", "authors": "Mounir Sehad, Yacine Mohia, M. Lazri, Fethi Ouallouche, K. Labadi, R. Absi, S. Hamaci", "source": "Geomatics", "published": "2026-10-04", "first_seen": "2026-11-24T14:57:46+00:00", "score": 73, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1088/2515-7620/aeb47d", "title": "An optimized hybrid deep learning framework for short-range rainfall forecasting in Mumbai’s monsoon regime", "summary": "Short-range rainfall forecasting in tropical coastal megacities is a formidable challenge owing to the nonlinear dynamics, strong seasonality, and pronounced interannual variability that characterize monsoon precipitation regimes. This study develops and evaluates deep learning frameworks for multi-lead-time (D + 1 to D + 4) daily rainfall forecasting over Mumbai (72.88° E, 19.07° N), India, a densely populated coastal metropolis where accurate precipitation prediction is directly consequential for flood early warning. Six forecasting systems namely Random Forest, XGBoost, a one-dimensional convolutional neural network (CNN), a Transformer, and two metaheuristically tuned variants of a novel Conv1D–CBAM–BiLSTM–attention Enhanced Hybrid architecture (genetic algorithms (GA)-Hybrid and PSO-Enhanced) are benchmarked against persistence and climatology references. The PSO-Enhanced ensemble is the strongest system at every lead, attaining R2 = 0.636 (RMSE = 8.97 mm d−1) at D + 1 and 0.454, 0.373 and 0.399 at D + 2D + 4, ahead of the GA-Hybrid (0.626, 0.428, 0.352, 0.385), the strongest gradient-boosting benchmark XGBoost (R2 ⩽ 0.561), persistence (R2 = 0.572 at D + 1, declining to 0.049 by D + 4), and climatology (R2 = 0.327, lead-independent). Recurrent-memory architectures outperform the memoryless CNN and Transformer at every lead, indicating that sequential dependence, rather than attention alone, carries most of the exploitable predictive signal. For detection of rainfall exceeding the 95th percentile, the two optimized hybrids achieve the highest critical success index at ", "link": "https://doi.org/10.1088/2515-7620/aeb47d", "authors": "Manpreet Kaur Aiden, Sanjeev Thakur, A. Kasimahanthi, Manmeet Singh, D. Mehrotra", "source": "Environmental Research Communications", "published": "2026-10-14", "first_seen": "2026-11-24T14:57:46+00:00", "score": 72, "topics": ["Deep Learning"], "watch": [], "boosts": ["india", "monsoon", "precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1007/s44288-026-00775-0", "title": "An observational perspective on extreme precipitation indices over the mountainous regions of Northwest Himalaya", "summary": "The Northwest Himalaya region is highly susceptible to extreme rainfall events due to its steep topography and complex climatic variability, which can trigger significant hydro-meteorological hazards, including heavy snowfall, hailstorms, floods, and droughts. The erratic precipitation patterns, both in the short and long term, exacerbate these hazards. Furthermore, climate change is amplifying the frequency and intensity of extreme weather events, thereby increasing the vulnerability of the region and posing substantial challenges for infrastructure resilience, agricultural sustainability, and effective disaster management. This study utilizes the High Asia Refined Analysis version 2 dataset (HARv2), a high-resolution (10 km) WRF model output, spanning 1981–2020, to analyze precipitation trends across three sub-regions — Jammu & Kashmir (JK), Himachal Pradesh (HP), and Uttarakhand (UK) — validated against IMD and IMDAA datasets. All extreme precipitation indices as defined by the Expert Team on Climate Change Detection and Indices (ETCCDI) have been used for the study. ERA5 and HARv2 derived VIMT analysis is done for large-scale moisture influx understanding, and the role of ENSO in driving moisture transport is examined. JK exhibits the most pronounced drying signal, with statistically significant declines across multiple precipitation indices, while increasing CDD over both JK and HP indicates growing drought risk. UK shows no significant trends, reflecting the dominant role of orographic processes in its precipitation regime. A distinct spatial gradient in precipitation", "link": "https://doi.org/10.1007/s44288-026-00775-0", "authors": "Kritika Nag, S. Pattanayak, V. Venkatramanan, Vartika Sharma, M. S. Shekhar", "source": "Discover Geoscience", "published": "2026-10-15", "first_seen": "2026-11-24T14:57:46+00:00", "score": 71, "topics": [], "watch": [], "boosts": ["himalaya", "precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.3390/rs18203593", "title": "Spatial Super-Resolution of Satellite-Derived SST Data via Generative Adversarial Networks in the Mediterranean Sea", "summary": "In this work, we compare deep convolutional and generative models to improve the reconstruction of sea surface temperature (SST) gradients and effective resolution from cloud-contaminated satellite infrared data. Standard gap-filling techniques produce spatially complete datasets, but they inherently smooth out fine-scale features and gradients that may be critical for a better understanding of the ocean dynamics. Here, we investigate how the use of deep learning models as Autoencoders (AEs) and generative models as Conditional Generative Adversarial Networks (C-GANs) differently contribute to recovering the small-scale structures lost during interpolation. Our supervised, observation-based training relies on satellite-derived SST data from the Mediterranean Sea, with a focus on learning the statistical relationship between high-resolution fields and their low-resolution counterparts. We apply a tiling and merging strategy to deal with limited observational coverage and to ensure spatial continuity. Quantitative validation based on mean squared error metrics, spectral analysis, and gradient statistics shows that the AE reduces the reconstruction error, but it fails to recover high-frequency variability. In contrast, the C-GAN effectively restores the statistical properties of the true SST field at the cost of increasing the pointwise discrepancy with the ground truth observations. Our results highlight the potential of deep models to enhance the physical and statistical realism of gap-filled satellite data in oceanographic applications.", "link": "https://doi.org/10.3390/rs18203593", "authors": "C. Fanelli, Tian-Yi Li, Luca Biferale, B. Buongiorno Nardelli, D. Ciani, A. Pisano, M. Buzzicotti", "source": "Remote Sensing", "published": "2026-10-19", "first_seen": "2026-11-24T14:57:46+00:00", "score": 71, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1371/journal.pone.0343910", "title": "Summer seasonal precipitation prediction in the middle and lower reaches of the Yangtze River using neural network approaches", "summary": "Accurate prediction of summer precipitation is essential for agricultural planning and flood prevention. However, precipitation is strongly nonlinear. In the middle and lower reaches of the Yangtze River (MLYR), many interacting factors and large interannual variability make conventional forecasting methods unreliable. This study proposes neural network approaches to address this challenge. We select independent predictors from 130 circulation indices of the National Climate Center (NCC) and from the ERA5 monthly dataset, including sea surface temperature (SST), 500 hPa geopotential height, and land surface variables. Predictors are chosen through correlation, partial correlation, and autocorrelation analyses. They are then processed with detrended fluctuation analysis (DFA), standardization, and normalization. Four models are trained: a back propagation (BP) network, a gated recurrent unit (GRU) network, a coupled BP-GRU network, and a particle swarm optimization (PSO)-optimized coupled BP-GRU network. A strict chronological split is used (training: 1980–2000; validation: 2001–2010; testing: 2011–2024). Results are reported as the mean ± standard deviation over ten independent runs. The PSO-optimized coupled network performs best (test MSE = 0.0177 ± 0.0106; spatial correlation r = 0.44). It outperforms the standalone GRU (MSE = 0.0207 ± 0.0003), the coupled BP-GRU (MSE = 0.0357 ± 0.0175), and the standalone BP model (MSE = 0.0447 ± 0.0212). It is also the only network to beat the climatological baseline (MSE = 0.0181). The GRU is the most stable across runs but reproduces", "link": "https://doi.org/10.1371/journal.pone.0343910", "authors": "Xin-Ran Ren, Ling-Yan Li", "source": "PLoS ONE", "published": "2026-11-05", "first_seen": "2026-11-24T14:57:46+00:00", "score": 71, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1109/jstars.2026.3746867", "title": "A Progressive Downscaling Framework With Hybrid Attention Mechanisms for High-Resolution Soil Moisture Estimation", "summary": "Soil moisture is a critical variable regulating terrestrial water and energy exchange, with broad applications in drought monitoring, water resources management, and climate change research. However, passive microwave soil moisture products are often constrained by coarse spatial resolution, limiting their utility for regional- and local-scale applications. To address this challenge, we propose a progressive downscaling framework with hybrid attention mechanisms (PDHAM) to generate high-resolution soil moisture estimates. The framework progressively downscales soil moisture through two cascaded stages, first from 0.36° to 0.06° and then from 0.06° to 0.01°, thereby improving downscaling robustness. Each stage incorporates a hybrid attention module to enhance the extraction of spatial details. The effectiveness of PDHAM was evaluated using in situ observations across mainland China. PDHAM consistently outperformed a backpropagation neural network, a deep belief network, and a residual dense network, achieving an average correlation coefficient of 0.72 and an unbiased root-mean-square error of 0.061 m3/m3. Moreover, the downscaled results compared favorably with two existing high-resolution soil moisture datasets. These findings demonstrate the strong potential of PDHAM to improve fine-scale soil moisture monitoring and support hydrological, agricultural, and climatological applications.", "link": "https://doi.org/10.1109/jstars.2026.3746867", "authors": "Pei-Long Chen, Ying-Hong Jing, X. She, Jiao Yang, Yao Li", "source": "IEEE Journal of Selected Topics in Applied Earth Observations and Remote Sensing", "published": "2026", "first_seen": "2026-11-24T14:57:46+00:00", "score": 70, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1029/2026jh001372", "title": "A Super‐Resolution Model for Enhancing the Intensity and Structure of Tropical Cyclone Predictions", "summary": "Accurate predictions of intensity and structure of tropical cyclones (TCs) are crucial for disaster warning, prevention and mitigation. Traditional dynamical models with coarse horizontal resolutions suffer from systematic underprediction of TC intensity, whereas those with fine horizontal resolutions require intensive computations. Deep learning (DL)‐based models are computationally efficient yet substantially underpredict the TC intensity. To enhance the prediction of DL‐based weather models for TC intensities and structures, a hybrid framework (HybSR‐TC) is proposed here. By integrating a Swin Transformer backbone with multi‐variable processing and meta‐upsampling techniques, HybSR‐TC is trained based on low‐resolution (0.25°) forecasts of Pangu‐Weather and high‐resolution (2 km) weather research and forecasting forecasts with accurate TC tracks and well simulated intensities and structures. For TC predictions, HybSR‐TC maps the 6‐hr Pangu‐Weather forecasts of surface pressure and wind fields at 0.25° resolution to 2‐km resolution fields without the requirement for massive computational costs. HybSR‐TC can better capture the rapid intensification and temporal evolution of TCs than Pangu‐Weather and bilinear interpolation. HybSR‐TC produces significantly smaller errors of TC intensity and structure than Pangu‐Weather and bilinear interpolation, until approximately 10‐day lead times. Thus, the ability of HybSR‐TC to enhance the forecasts of TC intensity and structure based on the low‐resolution forecasts from AI models has been demonstrated.", "link": "https://doi.org/10.1029/2026jh001372", "authors": "Zhi-Yu Zhao, Yan-Long Ao, Wei Zhang, Li-Li Lei, Zhe-Min Tan, Qi-Feng Qian", "source": "Journal of Geophysical Research", "published": "2026-11-04", "first_seen": "2026-11-24T14:57:46+00:00", "score": 70, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1109/lgrs.2026.3735399", "title": "OSISAF-to-MASAM2: Deep Learning for Sea Ice Concentration Super-Resolution Product", "summary": "This letter presents a deep learning approach for Arctic sea ice concentration (SIC) downscaling based on multisensor fusion applied during the model training stage. While conventional downscaling methods primarily enhance spatial resolution, the proposed approach also improves physical consistency by fusing the widely used Ocean and Sea Ice Satellite Application Facility (OSISAF) SIC dataset with the high-resolution multisensor-corrected MASAM2 product. This synthesis not only increases spatial resolution from 25 to 4 km, but also yields more realistic ice patterns, as validated by a high structural similarity metric and a mean absolute error (MAE) of 0.02. A comparison of U-Net-based and attention U-Net architectures with classical interpolation methods, a conditional diffusion baseline, and a manual hybrid approach demonstrates the advantages of the proposed solution. The projection change between the two products is embedded in the network as a fixed resampling layer, removing the external remapping stage from the pipeline. The presented model has strong potential to improve sea ice forecasting quality and generate high-resolution historical datasets. Code and weights are provided on https://github.com/ITMO-NSS-team/GRSL_masam2_downscaling", "link": "https://doi.org/10.1109/lgrs.2026.3735399", "authors": "Julia Borisova, Dmitry Morozov, Dmitry Gilemkhanov, N. O. Nikitin", "source": "IEEE Geoscience and Remote Sensing Letters", "published": "2026", "first_seen": "2026-11-24T14:57:46+00:00", "score": 70, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "doi:10.1029/2026jh001400", "title": "HiResCastNet: A 3D Deep Learning Model for Probabilistic Regional High‐Resolution Subseasonal Forecasting Through Downscaling", "summary": "High‐resolution subseasonal forecasts, spanning two to 6 weeks, play a vital role in bridging the gap between short‐range forecasts and seasonal predictions. They provide crucial information for decision‐making in disaster and hazard preparedness, early warning systems, water resource management, and renewable energy. However, generating subseasonal forecasts at high spatial and temporal resolutions remains a significant challenge. Global subseasonal forecasting systems such as European Center for Medium‐Range Weather Forecasts (ECMWF) typically provide outputs at a coarse spatial resolution of about 31 km and a temporal resolution of 12 hr, which limits their usefulness for regional‐scale planning and impact assessments. Our three‐dimensional (3D) high‐resolution regional subseasonal forecasts are generated by dynamically downscaling the ECMWF subseasonal forecasts using the Weather Research and Forecasting (WRF) model, producing outputs at a spatial resolution of 4 km and a temporal resolution of 3 hr. Yet, the dynamical downscaling model is computationally very demanding, especially when using multiple ensemble members. To address this limitation, we introduce HiResCastNet, a data‐driven, probabilistic downscaling framework combining Swin‐transformer and a diffusion model, which serves as an efficient surrogate for the traditional downscaling system. HiResCastNet takes spatio‐temporal coarse resolution forecasts from ECMWF subseasonal system as inputs, and generates 3D high‐resolution forecasts at 4 km spatial resolution and 3‐hourly intervals. Our results suggest that H", "link": "https://doi.org/10.1029/2026jh001400", "authors": "Sofien Resifi, Elissar Al Aawar, T. Luong, I. Hoteit", "source": "Journal of Geophysical Research", "published": "2026-10-31", "first_seen": "2026-11-23T21:44:54+00:00", "score": 97, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["diffusion model"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1029/2026jh001290", "title": "High‐Resolution Downscaling of a Lightweight Climate Emulator Using Diffusion‐Based Super‐Resolution", "summary": "High‐resolution climate fields are essential for the assessment of their regional and local effects. Current global climate models, along with being computationally expensive, are often too coarse for applications that depend on local extremes and orographic gradients. Machine learning offers a computationally efficient route for both climate emulation and super‐resolution from coarse simulations to finer spatial scales. Therefore, we develop a data‐driven downscaling framework for the Lightweight Uncoupled ClImate Emulator (LUCIE), a lightweight Spherical Fourier Neural Operator climate emulator introduced by Guan et al. (2025, https://doi.org/10.1029/2025ms005152 ). We compare deterministic super‐resolution baselines, including a U‐Net and Spherical Fourier Neural Operator (SFNO), with two probabilistic diffusion formulations: a conditional Elucidated Diffusion Model and a diffusion‐posterior‐sampling approach. The models are trained on 6‐hourly ERA5 reanalysis fields from 2000 to 2009 and evaluated on out‐of‐sample LUCIE predictions from 2010 to 2018, downscaling coarse emulator states to km resolution. Performance is assessed against ERA5 using latitude‐weighted root mean square error (RMSE), power spectra, probability density functions, and the leading Empirical Orthogonal Function of zonal wind. These diagnostics test whether deterministic and probabilistic super‐resolution models can recover fine‐scale climatological statistics, high‐wavenumber variability, and dominant modes with an imperfect coarse emulator. Our results characterize the strengths and limitations of", "link": "https://doi.org/10.1029/2026jh001290", "authors": "Hai-Wen Guan, Dibyajyoti Chakraborty, Moein Darman, Troy Arcomano, Ashesh Chattopadhyay, Romit Maulik", "source": "Journal of Geophysical Research", "published": "2026-10-01", "first_seen": "2026-11-23T21:44:54+00:00", "score": 97, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["extreme", "diffusion model", "emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1038/s41598-026-80185-x", "title": "Trade-offs in deep learning approaches for precipitation downscaling across weather regimes", "summary": "Accurate high-resolution precipitation information is critical for assessing hydrological extremes and climate change impacts in complex topographic regions. While machine learning-based downscaling provides a computationally efficient alternative to dynamical models, its performance can depend on regional climate characteristics and terrain complexity. In this study, we systematically benchmarked representative deep learning approaches for daily statistical downscaling over Japan, including quantile-based and stochastic CNN formulations, two- (2D) and three-dimensional (3D) U-Net variants, and a diffusion-based generative model, alongside conventional baselines. Model performance was evaluated using comprehensive statistical and spatial metrics under both climatological and typhoon-affected conditions, enabling us to assess model robustness under extreme precipitation regimes. We further developed a proof-of-concept forecasting configuration for 3D U-Net prediction of next-day precipitation from short predictor sequences, together with an extreme super-resolution experiment to assess scalability to very high target resolutions. The results revealed clear trade-offs: quantile mapping best reproduced distributional properties, deterministic CNNs performed particularly well for standard deterministic metrics, the stochastic CNN achieved the highest average neighborhood-scale skill, and the diffusion model best reproduced the spatial power spectrum, while U-Nets tended to smooth small scales. Nevertheless, the asymmetric-loss U-Net provided the most robust performance during t", "link": "https://doi.org/10.1038/s41598-026-80185-x", "authors": "Alessandro Damiani, N. Ishizaki, R. Cordero, S. Feron", "source": "Scientific Reports", "published": "2026-11-11", "first_seen": "2026-11-23T21:44:54+00:00", "score": 95, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": ["precipitation", "extreme", "diffusion model"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1029/2026ea005059", "title": "Zero‐Shot Transferability of Deep Learning Models for Precipitation Super‐Resolution Across Diverse Climate Regimes", "summary": "High‐resolution precipitation fields are essential for characterizing climate extremes, assessing sectoral impacts, and improving early warning systems. However, the resolution of global Earth system models (ESMs) and numerical weather prediction (NWP) systems remains limited by computational constraints. This study assesses the zero‐shot transferability of deep learning (DL)‐based super‐resolution (SR) models for precipitation across diverse geographic domains, data sources, and temporal scales. A suite of DL‐based SR architectures, ranging from convolutional baselines to spatial‐attention‐based generative models, is trained on a limited regional observational record of satellite‐derived precipitation from three monsoon‐dominated regions of the Indian subcontinent during 2001–2014. DL model generalization is assessed through out‐of‐sample transfer across climatically diverse domains using observations (2015–2023), NWP forecasts (2018–2023), and a 150‐year ESM simulation spanning 1950–2100, all without retraining or fine‐tuning. Across tropical, subtropical, and mid‐latitude climate regimes, the models show strong zero‐shot transferability, achieving Kling‐Gupta efficiency (KGE) scores approximately 0.85 or higher. Skill gains are evident in fine‐scale spatial variability and extreme precipitation statistics that are poorly represented in the coarse‐resolution inputs. Cross‐source application to weather forecasts and long‐term climate simulations further demonstrates the applicability of SR models across differing forcing data and evolving climate conditions. While differen", "link": "https://doi.org/10.1029/2026ea005059", "authors": "Midhun Murukesh, Pankaj Kumar", "source": "Earth and Space Science", "published": "2026-10-01", "first_seen": "2026-11-23T21:44:54+00:00", "score": 92, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["india", "monsoon", "precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.5194/gmd-19-9235-2026", "title": "China regional 3 km downscaling based on residual Corrective Diffusion model", "summary": "A fundamental challenge in numerical weather prediction is efficiently producing high-resolution forecasts. A widely adopted solution is to downscale coarser global model outputs. This study focuses on statistical downscaling, which uses historical data to learn mappings between low- and high-resolution meteorological fields. Deep learning has become a key tool for this, enabling powerful super-resolution models like diffusion models and Generative Adversarial Networks for downscaling applications. Herein, we leverage CorrDiff, a diffusion-based downscaling framework, with three key enhancements relative to its original implementation. First, the study domain is expanded to nearly 40 times the spatial extent of the original version. Second, the scope of target downscaling variables is extended beyond surface variables to incorporate upper-air variables across six pressure levels. Third, a global residual connection is integrated to further boost prediction accuracy. To produce 3 km resolution forecasts for the China region, the trained CorrDiff model is applied to 25 km global grid forecasts derived from two sources: a conventional global numerical weather prediction model and a deep learning-based weather model developed using Spherical Fourier Neural Operators. The China Meteorological Administration Mesoscale Model (CMA-MESO) is selected as the baseline for comparative evaluation. Experimental results demonstrate that the downscaled forecasts generated by our framework outperform the direct forecasts of CMA-MESO for almost all target variables, as quantified by the Mean ", "link": "https://doi.org/10.5194/gmd-19-9235-2026", "authors": "Hong-Lu Sun, Hao Jing, Zhi-Xiang Dai, Sa Xiao, Wei Xue, Jian Sun, Qi-Feng Lu", "source": "Geoscientific Model Development", "published": "2026-09-29", "first_seen": "2026-11-23T21:44:54+00:00", "score": 92, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["diffusion model"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "arxiv:2609.39833", "title": "RainAtlas: A Multi-Continental Dataset for Precipitation Downscaling", "summary": "Extreme rainfall events are increasing in intensity and frequency as climate change accelerates. While kilometer-scale precipitation forecasts are critical for supporting local decision-making, the limited availability of high-resolution precipitation observations hinders their accuracy, especially in under-resourced regions. Machine learning models are widely used to downscale precipitation data to km-scale, but their application to unseen geographies presents challenges. First, processing raw high-resolution precipitation datasets across regions requires significant engineering and domain expertise. Second, generalization across regions remains difficult. To help overcome these barriers, we release RainAtlas, a large-scale, ML-ready and multi-continental dataset for precipitation downscaling. Covering three continents, RainAtlas harmonizes heterogeneous hourly km-scale observations to a common 2-km grid. Each regional partition contains around 210,000 aligned low- and high-resolution precipitation pairs, respectively from ERA5 reanalysis and direct observations. We benchmark state-of-the-art ML-based downscaling models across RainAtlas using a wide range of metrics. Our evaluation reveals substantial variance in out-of-domain generalization depending on the training regions. This underscores the need for cross-regional, multi-source km-scale evaluation, establishing RainAtlas as a well-positioned benchmark for precipitation downscaling research.", "link": "https://arxiv.org/abs/2609.39833", "authors": "Pierre Lemaire, Luca Schmidt, W. Suijker, Alex Hernández-García, D. Rolnick", "source": "arXiv.org", "published": "2026-09-30", "first_seen": "2026-11-23T21:44:54+00:00", "score": 92, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1038/s41612-026-01424-6", "title": "New horizons in statistical downscaling and AI approaches for sustainable km-scale climate simulations", "summary": "Statistical downscaling translates coarse-resolution climate model output into locally relevant information for climate services and impact assessment. Recent advances in artificial intelligence (AI) enable high-resolution, probabilistic, and computationally efficient approaches. This paper provides a perspective on the evolution from classical to AI-driven and hybrid downscaling approaches, assesses key challenges related to interpretability, uncertainty, data availability, and computational requirements, and outlines physically constrained and generative frameworks that support decision-making across sectors.", "link": "https://doi.org/10.1038/s41612-026-01424-6", "authors": "K. Chun, L. Aragão, M. Olmo, V. Nguyen, C. B. Risanto, M. Bettolli, Y. Ezber, Emir Toker", "source": "npj Climate and Atmospheric Science", "published": "2026-05-04", "first_seen": "2026-11-23T21:44:54+00:00", "score": 92, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "doi:10.1117/12.3131069", "title": "A physics-informed neural network for downscaling ERA5 reanalysis sea surface temperature to kilometre-scale resolution", "summary": "Sea surface temperature (SST) from ERA5 reanalysis (0.25° × 0.25°) is too coarse to resolve fronts and mesoscale eddies in coastal waters. Here we construct a physics-informed neural network (PINN) that embeds the ocean advection–diffusion equation as a training constraint. The network takes spatiotemporal coordinates as input, uses coarse ERA5 SST as supervised labels, and outputs physically consistent high-resolution SST. Applied to daily ERA5 data over the Yellow Sea for 2021, the model downscales SST from 0.25° to 5 km resolution. Applied to daily ERA5 data over the Yellow Sea for 2021, the model downscales SST from 0.25° to 5 km resolution with a root-mean-square error of 0.94 °C and R2 of 0.92. This model outperforms traditional methods such as bilinear interpolation. It also preserves thermodynamically consistent fine-scale structures at temperature fronts and water-mass boundaries. This framework offers a physically credible route for generating high-resolution coastal reanalysis datasets and is extensible to other ocean variables.", "link": "https://doi.org/10.1117/12.3131069", "authors": "Si-Qi Zhang, Dong Zhang", "source": "International Conference on Remote Sensing, Mapping, and Geographic Systems", "published": "2026-10-22", "first_seen": "2026-11-23T21:44:54+00:00", "score": 89, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "arxiv:2610.03757", "title": "Generalizable Neural Downscaling of Earth System Model Wind Fields via Continuous Dynamics Modeling", "summary": "Accurate high-resolution wind field simulations are critical for resolving fine-scale atmospheric dynamics, yet the simulation of wind fields in Earth System Models (ESMs) remains limited by coarse spatial resolution and systematic biases. To address this, data-driven down scaling techniques have been widely used to enhance coarse-resolution ESM outputs. However, existing methods are typically tied to fixed discretizations, limiting generalization across models with different native resolutions. Here we formulate global near-surface wind downscaling as an operator-learning problem on continuous atmospheric state fields and develop a downscaling neural operator that maps coarse-scale fields to fine-scale counterparts across heterogeneous discretizations. The operator learning-based neural downscaling framework outperforms dominant baselines, recovers fine-scale physical structures, and generalizes to previously unseen ESMs and future climate scenarios without retraining, while preserving long-term wind projection trends. These findings establish a generalizable paradigm for high-resolution climate downscaling across diverse simulation outputs and future scenarios.", "link": "https://arxiv.org/abs/2610.03757", "authors": "Chen Yu, Jia-Nan Wei, Han-Lin Kong, Hao Sun, B. He, Wen-Guan Wang", "source": "Semantic Scholar", "published": "2026-09-26", "first_seen": "2026-11-23T21:44:54+00:00", "score": 87, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.3390/cli14110233", "title": "AI-Based Super-Resolution Approaches to Reconstruct Temperature Fields of Climatic Data Using Deep Neural Networks", "summary": "High-fidelity climate analysis is heavily constrained both by the computational costs of high-resolution dynamical simulations and by the general scarcity of fine-scale observational data for model evaluation. To address these limitations, in this work we propose a deep learning framework for spatial climate downscaling using an AI-based super-resolution (SR) approach. We develop Deep Neural Network architectures designed to upscale 2 m surface temperature fields, bridging the gap between gridded global reanalysis data at lower scale (1.0°) and higher scale (0.25°). We developed three DNN models, specifically ResNet, RNN, and ConvRNN, trained and validated on ECMWF ERA5 data from the early years of the current millennium (i.e., 01/01,01/04,01/07,01/10 of 2001,2003,2005 at 00:00) and evaluated over various periods, including 1992, a historical period influenced by the 1991 Mount Pinatubo eruption (a large volcanic eruption which is known to have had impacts on the climate due to the massive stratospheric injections of sulfur dioxide). The framework is tested also on the Berkeley Earth global observational dataset and on outputs from a MPI-ESM1-2-LR historical global climate simulation and compared with traditional interpolation methods, to verify the models generalization capability. The models reached high levels of accuracy, with errors lower than 0.5 K and a similarity index higher than 0.97, successfully capturing the spatio-temporal dynamics of temperature fields. Overall, the novelty of this work is in three main aspects: the implementation of DNN capable to capture th", "link": "https://doi.org/10.3390/cli14110233", "authors": "E. Amato, Lorenzo Basile, V. Zago, D. Zanchettin, C. del Negro", "source": "Climate", "published": "2026-11-01", "first_seen": "2026-11-23T21:44:54+00:00", "score": 87, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "arxiv:2607.17037", "title": "Apeliotes: A Diffusion-Based Modeling Framework for km-scale Multi-Level Atmospheric Fields", "summary": "High-resolution atmospheric data are required to resolve mesoscale and localized meteorological structures, however, such datasets remain limited in many regions of the world. Existing high-resolution weather products are typically produced through dynamical downscaling, which is computationally expensive and difficult to scale across locations, variables, and forecast scenarios. These limitations motivate machine-learning-based downscaling systems that can generate multiple weather variables stochastically while producing new high-resolution fields directly. In this paper we present Apeliotes, a framework for high-resolution weather forecasting. Built on the global re-analysis atmospheric data, a pre-trained global weather foundation model, and a regionally trained generative diffusion model, Apeliotes not only provides accurate kilometer-scale weather variables, but also multi-level atmospheric fields which are not directly available in the existing global atmospheric data. Our comprehensive evaluation demonstrates that Apeliotes achieves highly competitive performance. The model predicts vertical wind profile with less than 3% error between truth and predicted fields, achieving correlations of 0.91 for 10-m wind speed and 0.99 for 2-m temperature, with NRMSE values of 0.42 and 0.17, respectively.", "link": "https://arxiv.org/abs/2607.17037", "authors": "Evangelia Rafaela Frastali, Achyut Paudel, Maryam Golbazi, Frank Liu", "source": "International Conference on Machine Learning and Applications", "published": "2026-07-19", "first_seen": "2026-11-23T21:44:54+00:00", "score": 87, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["diffusion model"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "doi:10.5194/essd-18-7593-2026", "title": "High-resolution global groundwater storage anomalies: a 1 km downscaled dataset", "summary": "Groundwater depletion poses a challenge to water security, but the coarse spatial resolution of Gravity Recovery and Climate Experiment (GRACE) observations limits the characterization of groundwater variability at regional and local scales. Here, we present a 1 km monthly global groundwater storage anomaly (GWSA) dataset covering April 2002–December 2020. The dataset was generated using Singular Spectrum Analysis (SSA) for temporal gap filling, 19 high-resolution hydroclimatic and geophysical predictors, and aquifer-stratified machine-learning downscaling. Extreme Gradient Boosting (XGBoost) and deep neural networks (DNN) were evaluated as candidate models, and XGBoost was selected for dataset production based on internal, cross-scale, and in-situ evaluations. When aggregated to the original GRACE scale, the 1 km product agreed closely with the original GWSA ( R 2 = 0.972, RMSE = 2.10 cm). Independent evaluation used a global archive of 152 069 groundwater-monitoring wells and a 1° spatial-block calibration–validation design. Effective specific yield ( S yeff ) was estimated from calibration blocks and transferred to held-out blocks before comparison at a common 0.25° grid. For XGBoost, the held-out evaluation yielded R 2 = 0.538, RMSE = 0.378 cm yr −1 , and Bias = 0.106 cm yr −1 . The association between modeled and observation-derived trends remained similar under ± 30 % perturbations in S yeff , although amplitude-related metrics were more sensitive to the conversion coefficient. Standardized time-series comparisons and monthly evaluations of representative aquifers sho", "link": "https://doi.org/10.5194/essd-18-7593-2026", "authors": "Chen Zhang, Yi-Fei Fan, Wen-Xia Han, Ying-Chun Ge, Jia-Bei Zhu, Tao Che", "source": "Earth System Science Data", "published": "2026-10-19", "first_seen": "2026-11-23T21:44:54+00:00", "score": 87, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": ["india", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1007/s12665-026-13186-8", "title": "Enhancing GRACE-derived terrestrial water storage estimates through bias-corrected downscaling using machine learning and artificial bee colony optimization", "summary": "Accurate monitoring of spatiotemporal variations of Terrestrial Water Storage (TWS) is essential for sustainable water resources management in arid and semi-arid regions. The Gravity Recovery and Climate Experiment (GRACE) and GRACE-Follow On (GRACE-FO) satellite missions serve as valuable tools for estimating changes in TWS; however, their coarse spatial resolution poses challenges for applications at local and regional scales. In this study, downscaling of the GRACE data for the Yazd province, Iran, was conducted using three Machine Learning (ML) models, including Extreme Gradient Boosting (XGBoost) and two Deep Neural Networks, i.e., DNN1 and DNN2, while the latter has more hidden layers than the former. To enhance accuracy and reduce the systematic bias in the model outputs, the Artificial Bee Colony (ABC) metaheuristic algorithm and a hybrid version combining ABC and Quantile Mapping were employed as the bias correction framework. The input data for the models were derived from high-resolution datasets, including CHIRPS for precipitation and TerraClimate for climatic variables listed in Table 1. The performance evaluation of the models, based on statistical indices, indicated that the XGBoost model achieved the highest accuracy in reproducing TWS anomalies (R2 = 0.829) and the lowest error among the ML models. The implementation of the ABC algorithm resulted in a 12.45% reduction in root mean square errors (RMSE) and improved the consistency between model outputs and observations from piezometer wells. Temporal and spatial analyses demonstrate a continuous decline in e", "link": "https://doi.org/10.1007/s12665-026-13186-8", "authors": "M. Goodarzi, Masoud Asgarzadeh Torghabeh, Majid Niazkar", "source": "Environmental Earth Sciences", "published": "2026-10-30", "first_seen": "2026-11-23T21:44:54+00:00", "score": 86, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.3390/hydrology13110307", "title": "Evaluating the Long-Term Robustness of Hybrid Deep Learning Models for Streamflow Projections Under Climate Change", "summary": "Data-driven models can help represent hydrological processes at the basin scale and predict future conditions, particularly in basins where information on physical characteristics is limited. Although these models have long been used in hydrological modeling, their reliability for long-term projections under changing climatic conditions remains insufficiently understood. This study evaluates the long-term robustness and projection consistency of data-driven algorithms under climate-change conditions using two hybrid deep learning architectures: (1) a Wavelet Transform–Deep Neural Network (WT–DNN) and (2) a Convolutional Neural Network–Long Short-Term Memory–Attention Block (CNN–LSTM–AB). It also investigates whether synthetic data augmentation using a Generative Adversarial Network (GAN) during model training improves predictive performance. The study used hydrological and climatic data, including streamflow, precipitation, minimum temperature, and maximum temperature, from the Yamula Reservoir Basin, a semi-arid agricultural basin in Türkiye. The models were trained and validated for monthly streamflow using climate data from the HadGEM2–ES global circulation model for the 2000–2020 period. Long-term streamflow projections for 2021–2098 were then generated under the RCP4.5 and RCP8.5 scenarios. Model performance and robustness were assessed through sensitivity analysis, comparison of models trained with and without GAN-based data augmentation, comparison with long short-term memory (LSTM) and other recently proposed hybrid deep learning architectures, and evaluation of lon", "link": "https://doi.org/10.3390/hydrology13110307", "authors": "Arshya Razavi Nematollahi, Mete Çelik, Filiz Dadaser-celik", "source": "Hydrology", "published": "2026-11-17", "first_seen": "2026-11-23T21:44:54+00:00", "score": 84, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "s2:bcaf88659ca33302e6d9723f1b1fc5efd8269df4", "title": "Comprehensive evaluation on the robustness of deep learning based rainfall-runoff models under climate change scenarios", "summary": "", "link": "https://www.semanticscholar.org/paper/bcaf88659ca33302e6d9723f1b1fc5efd8269df4", "authors": "Aldo A. Tapia, A. Bennett", "source": "Semantic Scholar", "published": "", "first_seen": "2026-11-23T21:44:54+00:00", "score": 84, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1109/isctis70043.2026.11572552", "title": "A Convolutional Neural Network-Based Statistical Downscaling Study of ERA5 Air Temperature at the Station Scale", "summary": "To evaluate the performance of Convolutional Neural Networks (CNN) in the station-scale application of reanalysis data, this study conducts a statistical downscaling investigation of ERA5 temperature data, using Macau as a case study. A spatiotemporally matched dataset was constructed using hourly ERA5 reanalysis data and surface observation station records from 2012 to 2022. A lightweight CNN model was developed, employing the grid fields surrounding the stations as inputs and the measured station temperatures as outputs. To investigate the influence of spatial feature extraction ranges on model performance, the downscaling effects were comparatively analyzed across four input window sizes (11 × 11, 21 × 21, 31 × 31, and 41 × 41). Simultaneously, nearest neighbor interpolation, bilinear interpolation, and cubic spline interpolation were introduced as baseline methods. Multi-dimensional evaluations were performed using Mean Squared Error (MSE), Root Mean Square Error (RMSE), Mean Absolute Error (MAE), and Correlation Coefficient (CC). The experimental results demonstrate that the CNN model effectively captures spatial correlations between grid points, with accuracy significantly surpassing that of traditional interpolation methods. Furthermore, the model performance varied with the size of the input window, confirming the critical importance of the spatial domain extent for local temperature estimation. This study indicates that the lightweight CNN provides an efficient and feasible solution for the station-scale downscaling of ERA5 data, serving as a reference for the refi", "link": "https://doi.org/10.1109/isctis70043.2026.11572552", "authors": "Huixian Wu, Hoiio Kong, Chanseng Wong", "source": "2026 6th International Symposium on Computer Technology and Information Science (ISCTIS)", "published": "2026-05-15", "first_seen": "2026-11-23T21:44:54+00:00", "score": 84, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "doi:10.1016/j.aiig.2026.100226", "title": "Deep learning–based downscaling of ERA5-Land temperature to 250 m resolution over the Trentino–South Tyrol Alpine region", "summary": "", "link": "https://doi.org/10.1016/j.aiig.2026.100226", "authors": "Ihcene Djouama, Nabil Kadache, Rachid Seghir", "source": "Artificial Intelligence in Geosciences", "published": "2026-05-01", "first_seen": "2026-11-23T21:44:54+00:00", "score": 84, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "doi:10.1108/ijccsm-09-2025-0332", "title": "Unlocking wind energy potential in data-scarce regions: a deep learning framework for strategic climate action in Vietnam’s Central Highlands", "summary": "As Vietnam accelerates its transition toward a sustainable energy future under ambitious national strategies like the Power Development Plan VIII (PDP8), a critical barrier persists: the lack of high-fidelity resource maps for strategic planning. This is particularly acute in data-scarce regions with high potential, such as Vietnam’s Central Highlands. This study aims to address this strategic gap by developing and validating a robust deep learning framework to produce an enhanced and detailed high-resolution wind energy map for this region, providing a conservative proof-of-concept for regional energy planning. The framework integrates coarse-resolution daily wind speed data from an ensemble of 11 global climate models with long-term observational records (1985–2023) from a sparse network of meteorological stations. To preserve synoptic extremes critical for wind power, the downscaling was conducted at a daily temporal resolution. A suite of advanced machine learning and deep learning models were systematically trained. To address the limitations of spatial interpolation in complex terrain, the downscaled 10 m wind speeds were extrapolated to a 149 m commercial hub-height using a terrain-aware power law, integrating high-resolution surface roughness data. A technical potential map (GWh/km²/year) was then generated by combining the turbine power curve (Enercon E-101) with a GIS-based availability index (AI), factoring in constraints such as elevation, slope, land cover and urban buffers. Deep learning architectures, particularly the convolutional neural network and XGBoost,", "link": "https://doi.org/10.1108/ijccsm-09-2025-0332", "authors": "Do Quang Linh, Dung Duc Tran, A. Dang", "source": "International Journal of Climate Change Strategies and Management", "published": "2026-10-12", "first_seen": "2026-11-23T21:44:54+00:00", "score": 84, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "arxiv:2512.13753", "title": "Time‐Aware UNet and Super‐Resolution Deep Residual Networks for Spatial Downscaling", "summary": "Satellite observations of atmospheric pollutants are often available only at coarse spatial resolution, which limits their use in local‐scale environmental analysis. Spatial downscaling methods aim to transform such data into high‐resolution fields. In this work, two widely used deep learning architectures—the super‐resolution deep residual network (SRDRN) and the encoder–decoder‐based UNet—for spatial downscaling, are extended with a lightweight temporal module that encodes observation time using either sinusoidal or radial basis function representations and integrates temporal features with spatial information. The proposed time‐aware extensions are evaluated in a case study on ozone downscaling over Italy. Results show that, with only a minor increase in computational cost, incorporating temporal information significantly improves downscaling accuracy and accelerates model convergence.", "link": "https://arxiv.org/abs/2512.13753", "authors": "Mika Sipilä, S. Maggio, S. De Iaco, K. Nordhausen, M. Palma, S. Taskinen", "source": "Environmetrics", "published": "2025-12-15", "first_seen": "2026-11-23T21:44:54+00:00", "score": 84, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "doi:10.1007/s00704-026-06716-8", "title": "Monthly model-adaptive machine-learning ensemble of CMIP6 models for global land temperature and precipitation projections", "summary": "", "link": "https://doi.org/10.1007/s00704-026-06716-8", "authors": "Jian-Zhong Lu, Piao-Yin Zhang, Zhi-Yu Ye, Xiao-Ling Chen, Quang Phi Nguyen", "source": "Theoretical and Applied Climatology", "published": "2026-11-14", "first_seen": "2026-11-23T21:44:54+00:00", "score": 83, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1111/jfr3.70144", "title": "Comparative Evaluation of Deep Learning–Based Super–Resolution Models for Urban Flood Mapping", "summary": "Urban flood forecasting benefits from high‐resolution inundation maps, but fine‐grid hydrodynamic simulations are computationally costly. We compared three CNN–based super–resolution (SR) models, ResUNet, EDSR, and RCAN, for downscaling physics–based simulations in downtown Portland, Oregon, using paired flood maps at 1 m (HR) and both 4 and 8 m (LR). Performance was assessed using image level metrics (PSNR, SSIM) and flood specific indicators: CSI for flood extent, RMSE for water depth accuracy, and a depth–based severity classification. At 4× upscaling, all SR models outperformed the LR baseline; RCAN performed best (PSNR +57%, SSIM +31%, RMSE −73%, CSI +53%), followed by EDSR (PSNR +50%, SSIM +30%, RMSE −64%, CSI +45%) and ResUNet (RMSE −55%, CSI +40%). Analysis of class–wise recall showed RCAN leading for non–flood (98.06%, +6.59 pp) and severe flood (96.48%, +16.90 pp), while EDSR led for mild flood class (97.95%, +6.49 pp). Errors were most pronounced along wet–dry boundaries and in complex urban geometries, where RCAN and EDSR reduced error magnitude more effectively than ResUNet. Models with larger numbers of parameters required longer training times. Furthermore, the computational cost further increased with more training epochs and especially at 4× upscaling relative to 8×, reflecting differences in model complexity and scaling configuration. Taken together, these findings support SR as a practical complement to physics–based modeling for real time forecasting and planning, while also providing guidance for selecting architectures under varying computational budge", "link": "https://doi.org/10.1111/jfr3.70144", "authors": "Hyeonjin Choi, Hyuna Woo, Hyungon Ryu, D. Rhee, Seong Jin Noh", "source": "Journal of Flood Risk Management", "published": "2025-10-26", "first_seen": "2026-11-23T21:44:54+00:00", "score": 79, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "arxiv:2604.09505", "title": "Enhancing the accuracy of under-resolved numerical simulations of atmospheric flows with super resolution", "summary": "Super-resolution (SR) techniques based on deep learning have recently emerged as a promising approach to enhance the spatial resolution of computational fluid dynamics simulations while containing computational cost. In this paper, we investigate several SR architectures to improve coarse-grid simulations of mesoscale atmospheric flows, with training data generated from simulations of the weakly compressible Euler equations. We compare a baseline convolutional neural network (CNN), an attention-enhanced CNN, a multi-scale CNN designed to capture flow structures across different spatial scales, and a diffusion-based SR model. The methods are evaluated on two standard atmospheric benchmarks: the rising thermal bubble and the density current. Results show that the baseline CNN can accurately reconstruct simpler flow features, while more complex flows require multi-scale architectures. Overall, SR based on the multi-scale CNN provides the best balance of accuracy, robustness, and computational efficiency, outperforming even a state-of-the-art diffusion-based approach. We also analyze the sensitivity of the models to the size of the training dataset, highlighting limitations and trade-offs of the proposed SR strategies.", "link": "https://arxiv.org/abs/2604.09505", "authors": "A. Sheidani, M. Girfoglio, A. Quaini, G. Rozza", "source": "Results in Engineering", "published": "2026-04-10", "first_seen": "2026-11-23T21:44:54+00:00", "score": 75, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "doi:10.1088/3049-4753/aeac30", "title": "Model architecture and calibration period sensitivity in controlled super-resolution reconstruction of near-surface air temperature", "summary": "Super-resolution reconstruction recovers fine-scale fields from coarse inputs, but its reliability across periods depends on whether relationships learned historically remain transferable. Using a controlled ERA5-Land 2 m temperature super-resolution reconstruction experiment over Africa, we compare U-Net, RCAN, super-resolution convolutional neural network, XGBoost, and quantile delta mapping (QDM) trained on the 1950s, 1980s, and 2010s and evaluated on the same daily 2021–2025 data. In the multiyear evaluation, spatial convolutional models outperform the pixel-wise baseline, with U-Net achieving the lowest mean root mean squared error across calibration periods in every year. In percentile-based hot-context subsets, XGBoost exhibits substantially larger errors and stronger dependence on training-period recency. U-Net maintains the lowest error, while RCAN has smaller calibration-period spread than U-Net. QDM has the smallest spread but higher error than the unadjusted coarse input. Within this same-source reconstruction setting, calibration-period sensitivity is both model- and distribution-dependent: average performance can conceal failures in the hot tail, and model selection should evaluate calibration-period sensitivity and extreme-temperature behavior separately.", "link": "https://doi.org/10.1088/3049-4753/aeac30", "authors": "Jangho Lee, Sara Shamekh", "source": "Machine Learning: Earth", "published": "2026-09-24", "first_seen": "2026-11-23T21:44:54+00:00", "score": 64, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "doi:10.1016/j.envsoft.2026.107207", "title": "Spherical graph neural super-resolution for atmospheric moisture fields with conservation correction and cross-resolution transfer", "summary": "", "link": "https://doi.org/10.1016/j.envsoft.2026.107207", "authors": "Nicholas Hong Sheng Chung, Thalosang Tshireletso, Meghdad Bagheri", "source": "Environmental Modelling & Software", "published": "2027-01-01", "first_seen": "2026-11-23T21:44:54+00:00", "score": 55, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "doi:10.1016/j.neucom.2025.130653", "title": "Local spatial self-attention based deep network for meteorological data downscaling", "summary": "", "link": "https://doi.org/10.1016/j.neucom.2025.130653", "authors": "Sheng Gao, Lian-Lei Lin, Zong-Wei Zhang, Jun-Kai Wang, Han-Qing Zhao, Hang-Yi Yu", "source": "Neurocomputing", "published": "2025-06-01", "first_seen": "2026-11-23T21:44:54+00:00", "score": 55, "topics": ["Downscaling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "doi:10.1002/hyp.70188", "title": "Centennial Scale Spatio‐Temporal Analysis of Meteorological Drought in the State of Himachal Pradesh Using Standardised Precipitation Index and Copula‐Based Return Period", "summary": "", "link": "https://doi.org/10.1002/hyp.70188", "authors": "Madhu Mehta, S. Mittal, U. Chaudhari, Disha Kumari, Pritam Chand", "source": "Semantic Scholar", "published": "2025-07-01", "first_seen": "2026-11-23T21:44:54+00:00", "score": 54, "topics": [], "watch": [], "boosts": ["precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "doi:10.1002/joc.70287", "title": "A Novel Sequential Weighting and Standardisation Framework for Robust Drought Assessment Using CMIP6 Projections", "summary": "In the era of global warming, drought remains one of the most pressing, insidious and complex climatic phenomena. Although Global Climate Models (GCMs) are indispensable for simulating past and future climate patterns, they continue to face persistent challenges in accurately characterising drought under diverse climate conditions due to inherent model uncertainties. Multi‐model ensembles (MMEs) are widely adopted to reduce these uncertainties; however, conventional MME approaches often overlook three critical aspects: (i) the independent relative contribution of individual GCMs, (ii) the influence of point‐wise value deviations and (iii) the sequential order of predictor inclusion in the analysis. Neglecting these factors can result in biassed weighting, reduced interpretability and overestimation of drought severity in subsequent assessments. This study introduces an integrated two‐stage framework, Integrated Ensemble Based on Sequential Predictor Contribution Analysis for Standardised Climate Indices (IEBSPCASCI), for future drought assessment using GCM projections, combining a novel weighting strategy with an optimised drought index formulation. In Stage 1, we propose the sequential relative impact weighting ensemble (SRIWE), a new GCM ensemble weighting scheme that accounts for point‐wise discrepancies and sequential predictor contributions with addressing multicollinearity among models; in Stage 2, we develop the Standardised Partitioned Impact Severity Drought Index (SPISDI), an optimal‐standardisation‐based index enhancing drought severity quantification under futur", "link": "https://doi.org/10.1002/joc.70287", "authors": "Hussnain Abbas, Muhammad Shakeel, Muhammad Mohsin, Zulfiqar Ali, Amna Nazeer, Dr. Rizwan Niaz, Naim Ahmad", "source": "International Journal of Climatology", "published": "2026-
