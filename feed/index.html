<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading desk</title>
<meta name="robots" content="noindex, nofollow">
<link rel="alternate" type="application/rss+xml" href="feed.xml" title="Research feed">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#101b2d;--mute:#566375;--line:#dde4ec;--soft:#f4f7fa;--accent:#9b2c12;--star:#b7791f;--sans:"Schibsted Grotesk",Helvetica,Arial,sans-serif;--serif:Literata,Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 var(--sans)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:48px}
header.top{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line);padding-bottom:18px}
h1{font:700 28px/1.1 var(--sans);margin:0;letter-spacing:-.01em}
.sub{color:var(--mute);margin:6px 0 0;font-size:14px}
.back{font-size:14px;color:var(--mute);text-decoration:none}
.back:hover{color:var(--ink)}
aside{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow:auto;padding-right:4px}
aside h2{font:600 13px/1 var(--sans);color:var(--mute);margin:26px 0 10px}
aside h2:first-child{margin-top:0}
.brief{background:var(--soft);border-radius:6px;padding:14px 16px}
.brief b{display:block;font:700 30px/1 var(--sans);letter-spacing:-.02em}
.brief span{color:var(--mute);font-size:13px}
.nav button{display:flex;justify-content:space-between;width:100%;padding:6px 10px;border-radius:4px;text-align:left}
.nav button:hover{background:var(--soft)}
.nav button[aria-pressed=true]{background:var(--ink);color:#fff}
.nav small{opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}
.chip[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff}
.people button{display:flex;justify-content:space-between;align-items:baseline;width:100%;padding:5px 0;text-align:left;border-bottom:1px solid var(--line);gap:8px}
.people button:hover .pn{text-decoration:underline}
.people button[aria-pressed=true] .pn{color:var(--accent);font-weight:600}
.pw{color:var(--mute);font-size:12px}
.pc{font-size:12px;color:var(--mute);min-width:1.5em;text-align:right}
.pc.on{color:var(--accent);font-weight:700}
.tools button,.tools a{display:block;font-size:13px;color:var(--mute);padding:3px 0;text-decoration:none}
.tools button:hover,.tools a:hover{color:var(--ink);text-decoration:underline}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.bar input[type=search]{flex:1 1 260px;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{padding:7px 11px;font-size:13px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
select{font:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
.count{color:var(--mute);font-size:13px;margin:10px 0 0}
.day{font:600 13px/1 var(--sans);color:var(--mute);margin:30px 0 4px;padding-bottom:8px;border-bottom:1px solid var(--ink)}
ol{list-style:none;margin:0;padding:0}
li.p{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
li.p.cur{box-shadow:inset 3px 0 0 var(--accent);background:linear-gradient(90deg,var(--soft),transparent 60%)}
li.p.done{opacity:.45}
.rel{display:flex;flex-direction:column-reverse;gap:2px;align-self:start;width:18px;margin-top:7px}
.rel i{display:block;height:4px;border-radius:1px;background:var(--line)}
.rel i.on{background:var(--ink)}
.t{font:600 17px/1.35 var(--sans);text-decoration:none}
.t:hover{text-decoration:underline}
.m{font-size:13px;color:var(--mute);margin-top:5px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.tag{border:1px solid var(--line);border-radius:3px;padding:0 6px;font-size:12px;color:var(--ink)}
.w{background:#fbeee8;color:var(--accent);border-radius:3px;padding:0 6px;font-size:12px;font-weight:600}
.au{font-size:13px;color:var(--mute);margin-top:4px}
.au mark{background:none;color:var(--accent);font-weight:600}
.ab{font:15px/1.65 var(--serif);margin:10px 0 0;max-width:72ch;display:none}
li.open .ab{display:block}
.act{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:13px}
.act button,.act a{color:var(--mute);text-decoration:none}
.act button:hover,.act a:hover{color:var(--ink);text-decoration:underline}
.act .st[aria-pressed=true]{color:var(--star);font-weight:600}
#dl h2{margin-top:26px}
.dl a{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:13px}
.dl a:hover span:first-child{text-decoration:underline}
.dl b{color:var(--accent);white-space:nowrap}
.why{font-size:13px;color:var(--mute);margin-top:4px}
.why em{font-style:normal;color:var(--ink)}
.kind{background:var(--ink);color:#fff;border-radius:3px;padding:0 6px;font-size:12px;font-weight:600}
.empty{padding:50px 0;color:var(--mute);font:16px/1.6 var(--serif)}
.keys{margin-top:36px;color:var(--mute);font-size:12px}
kbd{font:12px var(--sans);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:860px){.wrap{grid-template-columns:1fr;gap:20px}aside{position:static;max-height:none}.keys{display:none}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Reading desk</h1>
      <p class="sub" id="sub"></p>
    </div>
    <a class="back" href="../">Back to site</a>
  </header>

  <aside>
    <h2>Since your last visit</h2>
    <div class="brief"><b id="newN">0</b><span id="newT">new papers</span></div>

    <div id="dl"></div>

    <h2>View</h2>
    <div class="nav" id="views"></div>

    <h2>Topics</h2>
    <div class="chips" id="topics"></div>

    <h2>People to watch</h2>
    <div class="people" id="people"></div>

    <h2>Starred papers</h2>
    <div class="tools">
      <button id="bib">Download BibTeX for Zotero</button>
      <button id="md">Copy as reading notes</button>
      <button id="teach">Teach the ranker (likes.json)</button>
      <button id="backup">Back up stars and reads</button>
      <button id="restore">Restore from backup</button>
      <a href="feed.xml">RSS feed</a>
    </div>
  </aside>

  <main>
    <div class="bar">
      <input type="search" id="q" placeholder="Search titles, abstracts, authors" aria-label="Search papers">
      <div class="seg" id="win" role="group" aria-label="Time window"></div>
      <div class="seg" id="sort" role="group" aria-label="Sort order"></div>
      <select id="src" aria-label="Source"></select>
    </div>
    <p class="count" id="count"></p>
    <div id="list"></div>
    <p class="keys"><kbd>j</kbd> <kbd>k</kbd> move, <kbd>a</kbd> abstract, <kbd>s</kbd> star, <kbd>x</kbd> mark read, <kbd>n</kbd> not for me, <kbd>o</kbd> open, <kbd>/</kbd> search. Stars and reads are saved in this browser only; use backup to move them.</p>
  </main>
</div>

ming local-scale analyses, as neglecting to account for these uncertainties may risk overconfidence relative to the full range of possible climate futures.", "link": "https://doi.org/10.1038/s41612-023-00486-0", "authors": "David C. Lafferty, Ryan L. Sriver", "source": "npj Climate and Atmospheric Science", "published": "2023-9-30", "first_seen": "2026-11-23T14:47:49+00:00", "score": 87, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "extreme", "uncertainty"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.5194/gmd-17-7285-2024", "title": "Selecting CMIP6 global climate models (GCMs) for Coordinated Regional Climate Downscaling Experiment (CORDEX) dynamical downscaling over Southeast Asia using a standardised benchmarking framework", "summary": "Downscaling global climate models (GCMs) provides crucial high-resolution data needed for informed decision-making at regional scales. However, there is no uniform approach to select the most suitable GCMs. Over Southeast Asia (SEA), observations are sparse and have large uncertainties, complicating GCM selection especially for rainfall. To guide this selection, we apply a standardised benchmarking framework to select CMIP6 GCMs for dynamical downscaling over SEA, addressing current observational limitations. This framework identifies fit-for-purpose models through a two-step process: (a) selecting models that meet minimum performance requirements in simulating the fundamental characteristics of rainfall (e.g. bias, spatial pattern, annual cycle and trend) and (b) selecting models from (a) to further assess whether key precipitation drivers (monsoon) and teleconnections from modes of variability are captured, i.e. the El Niño–Southern Oscillation (ENSO) and Indian Ocean Dipole (IOD). GCMs generally exhibit wet biases, particularly over the complex terrain of the Mari a, Kerala, received unprecedented heavy rainfall, which led to widespread flooding. We aim to characterize the convective nature of these events and the large-scale atmospheric forcing, while exploring their predictability by three state-of-the-art global prediction systems: the National Centers for Environmental Prediction (NCEP)-based India Meteorological Department (IMD) operational Global Forecast System (GFS), the European Centre for Medium-Range Weather Forecasts (ECMWF) Integrated Forecast System (IFS), and the Unified Model–based NCUM being run at the National Centre for Medium Range Weather Forecasting (NCMRWF). Satellite, radar, and lightning observations suggest that these rain events were dominated by cumulus congestus and shallow convection with strong zonal flow leading to orographically enhanced rainfall over the Ghats mountain range; sporadic deep convection was also present during the 2019 event. A moisture budget analyses using the fifth major global reanalysis produced by ECMWF (ERA5) and forecast output revealed significantly increased moisture convergence below 800 hPa during the main rain events compared to August climatology. The total column-integrated precipitable water tendency, however, is found to be small throughout the month of August, indicating a balance between moisture convergence and drying by precipitation. By applying a Rossby wave filter to the rainfall anomalies it is shown that the large-scale moisture convergence is associated with westward-propagating barotropic Rossby w", "link": "https://doi.org/10.1175/waf-d-20-0162.1", "authors": "Parthasarathi Mukhopadhyay, Peter Bechtold, Yuejian Zhu, R. Phani Murali Krishna, Siddharth Kumar, Malay Ganai", "source": "Weather and Forecasting", "published": "2021-8", "first_seen": "2026-11-23T21:25:47+00:00", "score": 76, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["india", "precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1002/qj.4645", "title": "Climate change quadruples flood‐causing extreme monsoon rainfall events in Bangladesh and northeast India", "summary": "Bangladesh and northeast India are the most densely populated regions in the world where severe floods as a result of extreme rainfall events kill hundreds of people and cause socio‐economic losses regularly. Owing to local high topography, the moisture‐carrying monsoon winds converge near southeast Bangladesh (SEB) and northeast Bangladesh and India (NEBI), which produces significant extreme rainfall events from May to October. Using observed data, we find an increasing trend of 1‐day extreme event (150 mmday) frequency during 1950–2021. The extreme rainfall events quadrupled over western Meghalaya (affecting NEBI) and coastal SEB during this period. Composite analysis indicates that warm Bay of Bengal sea‐surface temperature intensifies the lower tropospheric moisture transport and flux through the low‐level jet (LLJ) to inland, where mountain‐forced moisture converges and precipitates as rainfall during extreme events. To understand the role of climate change, we use high‐resolution downscaled models from Coupled Model Intercomparison Project phase 6 (CMIP6). We find that the monsoon extreme event increase is ongoing and the region of quadrupled events further extends over the NEBI and SEB in the future (2050–2079) compared with historical simulations (1950–1979). A quadrupling of the intense daily moisture transport episodes due to increased LLJ instability, a northward shift of LLJ, and increased moisture contribute to the increased future extreme events. This dynamic process causes moisture to be transported to the NEBI from the southern Bay of Bengal, and the local t", "link": "https://doi.org/10.1002/qj.4645", "authors": "Abdullah A. Fahad, Mahdi Hasan, Noshin Sharmili, Shammunul Islam, Erik T. Swenson, M. K. Roxy", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2024-1-23", "first_seen": "2026-11-23T21:25:47+00:00", "score": 76, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["india", "monsoon", "cmip6", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1029/2022jd036659", "title": "Evaluation of CMIP6 GCMs Over the CONUS for Downscaling Studies", "summary": "Abstract Despite the necessity of Global Climate Models (GCMs) sub‐selection in downscaling studies, an objective approach for their selection is currently lacking. Building on the previously established concepts in GCMs evaluation frameworks, we develop a weighted averaging technique to remove the redundancy in the evaluation criteria and rank 37 GCMs from the sixth phase of the Coupled Models Intercomparison Project over the contiguous United States. GCMs are rated based on their average performance across 66 evaluation measures in the historical period (1981–2014) after each metric is weighted between zero and one, depending on its uniqueness. The robustness of the outcome is tested by repeating the process with the empirical orthogonal function analysis in which each GCM is ranked based on its sum of distances from the reference in the principal component space. The two methodologies work in contrasting ways to remove the metrics redundancy but eventually develop similar GCMs rankings. A disparity in GCMs' behavior related to their sensitivity to the size of the evaluation suite is observed, highlighting the need for comprehensive multi‐variable GCMs evaluation at varying timescales for determining their skillfulness over a region. The sub‐selection goal is to use a representative set of skillful models over the region of interest without substantial overlap in their future climate responses and modeling errors in representing historical climate. Additional analyses of GCMs' independence and spread in their future projections provide the necessary information to objecti", "link": "https://doi.org/10.1029/2022jd036659", "authors": "Moetasim Ashfaq, Deeksha Rastogi, Joy Kitson, Muhammad Adnan Abid, Shih‐Chieh Kao", "source": "JGR: Atmospheres", "published": "2022-11-5", "first_seen": "2026-11-23T14:47:49+00:00", "score": 75, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023jd038513", "title": "Identifying Robust Changes of Extreme Precipitation in Japan From Large Ensemble 5‐km‐Grid Regional Experiments for 4K Warming Scenario", "summary": "Abstract To evaluate the impacts of global warming on local‐scale extreme precipitation in Japan, 720‐year ensemble dynamical downscaling is conducted by a regional climate model with a 5 km grid spacing. Our dynamical downscaling is based on the large ensemble data set called the database for Policy Decision making for Future climate change (d4PDF). Comparing the historical and 4K warming climates, the annual maximum daily and hourly precipitation are enhanced over Japan due to global warming. The increasing rate of annual maximum daily precipitation is larger over the coast of the Pacific Ocean in eastern and western Japan and the northern parts of Japan. The periods in which the extreme daily precipitation increases in each region depend on the movement of the Baiu front and the number of typhoons from June through September. The 50‐year return value of the maximum 24‐hr land precipitation within 500 km of the typhoon center is 960 mm/24hr in the 5 km experiment. This value is larger by 1.87 times than that of the 20 km experiment. The rate of future increase in the 50‐year return value related to typhoons is 1.30 relative to the present values for the 5 km experiments. The local‐scale quasi‐stationary band‐shaped precipitation system, which is called senjo‐kousuitai in Japanese, sometimes brings local‐scale heavy precipitation to Japan. The senjo‐kousuitai is well reproduced in the 5 km experiments and shows increases in frequency and intensity under the 4K warming condition. This study also discusses the application of our 5 km experiments to hydrological fields.", "link": "https://doi.org/10.1029/2023jd038513", "authors": "H. Kawase, M. Nosaka, S. I. Watanabe, K. Yamamoto, T. Shimura, Y. Naka", "source": "JGR: Atmospheres", "published": "2023-9-19", "first_seen": "2026-11-23T21:25:47+00:00", "score": 74, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022ea002671", "title": "Fate of Rainfall Over the North Indian States in the 1.5 and 2°C Warming Scenarios", "summary": "Abstract Rise in mean temperature put a great deal of uncertainty about how weather and climate extremes may play out, particularly in India's varied climatic zones. Consequently, it is important to understand the possible changes in both magnitude and direction of weather and climate extremes like rainfall for different warming levels of 1.5 and 2°C scenarios concerning preindustrial and present levels. Hence in the present study, the precipitation behavior of seven North Indian states that is, Haryana, Himachal Pradesh, J&K, Punjab, Rajasthan, Uttar Pradesh, and Uttarakhand carefully studied using CMIP5 models. Future projections of precipitation has been done for the Paris Agreement global warming level of 1.5 and 2°C scenarios. Along with model validation and future projections of precipitation, the return period of extreme rainfall is also discussed to understand the behavior of the occurrence of extreme precipitation. Statistical analysis shows that the ensemble means have the least error as compared to the other six CMIP5 models. Therefore, future analysis has been done with the ensemble mean. Our findings show that the precipitation is likely to decrease in the 1.5°C scenarios, while it is likely to increase in the 2°C scenarios. The occurrence and intensity of extreme rainfall events are likely to be more frequent in all the models. The return period of the extreme rainfall events is likely to increase in all the states in both the warming scenarios. A three‐fold rise is likely to increase extreme rainfall events in the 2°C scenario.", "link": "https://doi.org/10.1029/2022ea002671", "authors": "Kanhu Charan Pattnayak, Amit Awasthi, Kuldeep Sharma, Bibhuti Bhusan Pattnayak", "source": "Earth and Space Science", "published": "2023-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 73, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "precipitation", "extreme", "uncertainty"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/2016jd025842", "title": "Large uncertainties in observed daily precipitation extremes over land", "summary": "Abstract We explore uncertainties in observed daily precipitation extremes over the terrestrial tropics and subtropics (50°S–50°N) based on five commonly used products: the Climate Hazards Group InfraRed Precipitation with Stations (CHIRPS) dataset, the Global Precipitation Climatology Centre‐Full Data Daily (GPCC‐FDD) dataset, the Tropical Rainfall Measuring Mission (TRMM) multi‐satellite research product (T3B42 v7), the Precipitation Estimation from Remotely Sensed Information using Artificial Neural Networks–Climate Data Record (PERSIANN‐CDR), and the Global Precipitation Climatology Project's One‐Degree Daily (GPCP‐1DD) dataset. We use the precipitation indices R10mm and Rx1day, developed by the Expert Team on Climate Change Detection and Indices, to explore the behavior of “moderate” and “extreme” extremes, respectively. In order to assess the sensitivity of extreme precipitation to different grid sizes we perform our calculations on four common spatial resolutions (0.25° × 0.25°, 1° × 1°, 2.5° × 2.5°, and 3.75° × 2.5°). The impact of the chosen “order of operation” in calculating these indices is also determined. Our results show that moderate extremes are relatively insensitive to product and resolution choice, while extreme extremes can be very sensitive. For example, at 0.25° × 0.25° quasi‐global mean Rx1day values vary from 37 mm in PERSIANN‐CDR to 62 mm in T3B42. We find that the interproduct spread becomes prominent at resolutions of 1° × 1° and finer, thus establishing a minimum effective resolution at which observational products agree. Without improvements in", "link": "https://doi.org/10.1002/2016jd025842", "authors": "Nicholas Herold, Ali Behrangi, Lisa V. Alexander", "source": "JGR: Atmospheres", "published": "2017-1-19", "first_seen": "2026-11-23T21:25:47+00:00", "score": 73, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/2016jd026279", "title": "Evaluating the present annual water budget of a Himalayan headwater river basin using a high‐resolution atmosphere‐hydrology model", "summary": "Abstract Understanding the present water budget in Himalayan Basins is a challenge due to poor in situ coverage, incomplete or unreliable records, and the limitations of coarse resolution gridded data set. In the study, a two‐way coupled implementation of the Weather Research and Forecasting (WRF) Model and the WRF‐Hydro hydrological modeling extension package (WRF/WRF‐Hydro) was employed in its offline configuration, over a 10 year simulation period for a mountainous river basin in North India. A triple nest is employed, in which the innermost domain had 3 km for atmospheric model grids and 300 m for hydrological components. Two microphysical parameterization (MP) schemes are quantitatively evaluated to reveal how differently MP influences orographic‐related precipitation and how it impacts hydrological responses. The WRF‐Hydro modeling system shows reasonable skill in capturing the spatial and temporal structure of high‐resolution precipitation, and the resulting stream flow hydrographs exhibit a good correspondence with observation at monthly timescales, although the model tends to generally underestimate streamflow amounts. The Thompson Scheme fits better to the observations in the study. More importantly, WRF shows that for high‐altitude precipitation, a high “bias” is exhibited in winter precipitation from WRF, which is about double to triple that as estimated from valley‐sited rain gauges and remotely sensed precipitation estimates from Tropical Rainfall Measuring Mission and Asian Precipitation ‐ Highly‐Resolved Observational Data Integration Towards Evaluation. Giv", "link": "https://doi.org/10.1002/2016jd026279", "authors": "Lu Li, David J. Gochis, Stefan Sobolowski, Michel D. S. Mesquita", "source": "JGR: Atmospheres", "published": "2017-5-3", "first_seen": "2026-11-23T21:25:47+00:00", "score": 73, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "himalaya", "precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-6-43-2025", "title": "Western disturbances and climate variability: a review of recent developments", "summary": "Western disturbances (WDs) are synoptic-scale weather systems embedded within the subtropical westerly jet. Manifesting as upper-level troughs often associated with a lower-tropospheric low over western or northern India, they share some dynamical features with extratropical cyclones. WDs are most common during the boreal winter (December to March), during which they bring the majority of precipitation – both rain and snow – to the western Himalaya, as well as to surrounding areas of north India, Pakistan, and the Tibetan Plateau. WDs are also associated with weather hazards such as heavy snowfall, hailstorms, fog, cloudbursts, avalanches, frost, and cold waves. In this paper, we review recent developments in understanding WDs and their impacts. Over the last decade, recent studies have collectively made use of novel data, novel analysis techniques such as tracking algorithms, and the increasing availability of high-resolution weather and climate models. This review is separated into six main sections – structure and thermodynamics, precipitation and impacts, teleconnections, modelling experiments, forecasting at a range of scales, and paleoclimate and climate change – each motivated with a brief discussion of the accomplishments and limitations of previous research. A number of step changes in understanding are synthesised. Use of new modelling frameworks and tracking algorithms has significantly improved knowledge of WD structure and variability, and a more frequentist approach can now be taken. Improved observation systems have helped quantification of water security ove", "link": "https://doi.org/10.5194/wcd-6-43-2025", "authors": "Kieran M. R. Hunt, Jean-Philippe Baudouin, Andrew G. Turner, A. P. Dimri, Ghulam Jeelani, ", "source": "Weather and Climate Dynamics", "published": "2025-1-9", "first_seen": "2026-11-23T21:25:47+00:00", "score": 72, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["india", "himalaya", "precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2019ef001473", "title": "Analysis of Compound Climate Extremes and Exposed Population in Africa Under Two Different Emission Scenarios", "summary": "Abstract It is well established that Africa is particularly exposed to climate extremes including heat waves, droughts, and intense rainfall events. How exposed Africa is to the co‐occurrence of these events is however virtually unknown. This study provides the first analysis of projected changes in the co‐occurrence of five such compound climate extremes in Africa, under a low (RCP2.6) and high (RCP8.5) emissions scenario. These changes are combined with population projections for a low (SSP1) and high (SSP3) population growth scenario, in order to provide estimates of the number of people that may be exposed to such events at the end of the 21st century. We make use of an ensemble of regional climate projections from the Coordinated Output for Regional Evaluations (CORE) project embedded in the Coordinated Regional Climate Downscaling Experiment (CORDEX) framework. This ensemble comprises five different Earth System Model/Regional Climate Model (ESM/RCM) combinations with three different ESMs and two RCMs. We show that all five compound climate extremes will increase in frequency, with changes being greater under RCP8.5 than RCP2.6. Moreover, populations exposed to these changes are greater under RCP8.5/SSP3, than RCP2.6/SSP1, increasing by 47‐ and 12‐fold, respectively, compared to the present‐day. Regions of Africa that are particularly exposed are West Africa, Central‐East Africa, and Northeast and Southeast Africa. Increased exposure is mainly driven by the interaction between climate and population growth, and the effect of population alone. This has important policy", "link": "https://doi.org/10.1029/2019ef001473", "authors": "T. Weber, P. Bowyer, D. Rechid, S. Pfeifer, F. Raffaele, A. R. Remedio", "source": "Earth's Future", "published": "2020-9", "first_seen": "2026-11-23T21:25:47+00:00", "score": 71, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-6-981-2025", "title": "Probabilistic seasonal outlook for the rainy season over India by monitoring the onset dates using GPM IMERG satellite-based precipitation", "summary": "We utilized the Integrated Multi-Satellite Retrievals for Global Precipitation Mission version 6 (IMERG) rainfall observation (available in real time) over India to determine the onset and withdrawal of the rainy season. The annual mean climatology derived from IMERG observations over India aligned closely with the rain gauge-based India Meteorological Department observation. The IMERG rainfall time series was randomly perturbed to generate 101 ensemble members at every grid point of the rainfall analysis to obtain a corresponding ensemble of the onset and withdrawal dates of the rainy season. The perturbations were designed to sample the uncertainty due to random synoptic or mesoscale rain events influencing the diagnosis of the onset/withdrawal dates at the granularity of the IMERG observations (available at 10 km grid). Following earlier studies, we find from the IMERG dataset that seasons with an earlier onset date are strongly related to a lengthier and wetter season, whereas seasons with a later onset date correspond to a shorter and a drier season. In contrast, the connections between El Niño–Southern Oscillation (ENSO) and Indian Ocean dipole (IOD) with the onset, withdrawal, seasonal length, and rainfall of the rainy season were comparatively weaker over most of India. The generation of ensembles in this study underscores the potential for real-time application of generating reliable, probabilistic seasonal outlooks of the rainy season over India by leveraging the local links amongst onset date, seasonal length, and seasonal rainfall anomalies. This potential is fu", "link": "https://doi.org/10.5194/wcd-6-981-2025", "authors": "Chempampadam Balasubramannian Jayasankar, Vasubandhu Misra", "source": "Weather and Climate Dynamics", "published": "2025-9-25", "first_seen": "2026-11-23T21:44:54+00:00", "score": 71, "topics": ["Close to your work"], "watch": [], "boosts": ["india", "precipitation", "uncertainty"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022ef003011", "title": "Future Changes in Climate and Hydroclimate Extremes in East Africa", "summary": "Abstract Climate change is affecting the agriculture, water, and energy sectors in East Africa and the impact is projected to increase in the future. To allow adaptation and mitigation of the impacts, we assessed the changes in climate and their impacts on hydrology and hydrological extremes in East Africa. We used outputs from seven CMIP‐6 Global Climate Models (GCMs) and 1981–2010 is used as a reference period. The output from GCMs are statistically downscaled using the Bias Correction‐Constructed Analogs with Quantile mapping reordering method to drive a high‐resolution hydrological model. The Variable Infiltration Capacity and vector‐based routing models are used to simulate runoff and streamflow across 68,300 river reaches in East Africa. The results show an increase in annual precipitation (up to 35%) in Ethiopia, Uganda, and Kenya and a decrease (up to 4.5%) in Southern Tanzania in the 2050s (2041–2070) and 2080s (2071–2100). During the long rainy season (March–May), precipitation is projected to be higher (up to 43%) than the reference period in Southern Ethiopia, Kenya, and Uganda but lower (up to −20%) in Tanzania. Large parts of Kenya, Uganda, Tanzania, and Southern Ethiopia show an increase in precipitation (up to 38%) during the short rainy season (October–December). Temperature and evapotranspiration will continue to increase in the future. Further, annual and seasonal streamflow and hydrological extremes (droughts and floods) are projected to increase in large parts of the region throughout the 21st century calling for site‐specific adaptation.", "link": "https://doi.org/10.1029/2022ef003011", "authors": "S. H. Gebrechorkos, M. T. Taye, B. Birhanu, D. Solomon, T. Demissie", "source": "Earth's Future", "published": "2023-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 70, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023jd038906", "title": "Detecting Extreme Temperature Events Using Gaussian Mixture Models", "summary": "Abstract Extreme temperature events have traditionally been detected assuming a unimodal distribution of temperature data. We found that surface temperature data can be described more accurately with a multimodal rather than a unimodal distribution. Here, we applied Gaussian Mixture Models (GMM) to daily near‐surface maximum air temperature data from the historical and future Coupled Model Intercomparison Project Phase 6 (CMIP6) simulations for 46 land regions defined by the Intergovernmental Panel on Climate Change. Using the multimodal distribution, we found that temperature extremes, defined based on daily data in the warmest mode of the GMM distributions, are getting more frequent in all regions. Globally, a 10‐year extreme temperature event relative to 1985–2014 conditions will occur 13.6 times more frequently in the future under 3.0°C of global warming levels (GWL). The frequency increase can be even higher in tropical regions, such that 10‐year extreme temperature events will occur almost twice a week. Additionally, we analyzed the change in future temperature distributions under different GWL and found that the hot temperatures are increasing faster than cold temperatures in low latitudes, while the cold temperatures are increasing faster than the hot temperatures in high latitudes. The smallest changes in temperature distribution can be found in tropical regions, where the annual temperature range is small. Our method captures the differences in geographical regions and shows that the frequency of extreme events will be even higher than reported in previous studies", "link": "https://doi.org/10.1029/2023jd038906", "authors": "Aytaç Paçal, Birgit Hassler, Katja Weigel, M. Levent Kurnaz, Michael F. Wehner, Veronika Eyring", "source": "JGR: Atmospheres", "published": "2023-9-22", "first_seen": "2026-11-23T21:25:47+00:00", "score": 70, "topics": ["Climate Modelling"], "watch": ["Veronika Eyring"], "boosts": ["cmip6", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1002/2015ef000336", "title": "Uncertainty partition challenges the predictability of vital details of climate change", "summary": "Abstract Decision makers and consultants are particularly interested in “detailed” information on future climate to prepare adaptation strategies and adjust design criteria. Projections of future climate at local spatial scales and fine temporal resolutions are subject to the same uncertainties as those at the global scale but the partition among uncertainty sources (emission scenarios, climate models, and internal climate variability) remains largely unquantified. At the local scale, the uncertainty of the mean and extremes of precipitation is shown to be irreducible for mid and end‐of‐century projections because it is almost entirely caused by internal climate variability (stochasticity). Conversely, projected changes in mean air temperature and other meteorological variables can be largely constrained, even at local scales, if more accurate emission scenarios can be developed. The results were obtained by applying a comprehensive stochastic downscaling technique to climate model outputs for three exemplary locations. In contrast with earlier studies, the three sources of uncertainty are considered as dependent and, therefore, non‐additive. The evidence of the predominant role of internal climate variability leaves little room for uncertainty reduction in precipitation projections; however, the inference is not necessarily negative, because the uncertainty of historic observations is almost as large as that for future projections with direct implications for climate change adaptation measures.", "link": "https://doi.org/10.1002/2015ef000336", "authors": "Simone Fatichi, Valeriy Y. Ivanov, Athanasios Paschalis, Nadav Peleg, Peter Molnar, Stefan Rimkus", "source": "Earth's Future", "published": "2016-5", "first_seen": "2026-11-23T21:25:47+00:00", "score": 69, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme", "uncertainty"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-022-00258-2", "title": "West coast India’s rainfall is becoming more convective", "summary": "Abstract A disastrous cloudburst and associated floods in Kerala during the 2019 monsoon season raise the hypothesis that rainfall over the west coast of India, much of which is stratiform, may be trending towards being more convective. As a first exploration, we sought statistically significant differences in monthly ERA-5 reanalysis data for the monsoon season between two epochs, 1980–1999 and 2000–2019. Results suggest a more convective (deeper, ice-rich) cloud population in recent decades, with patterns illustrated in ERA-5 spatial maps. Deepening of convection, above and beyond its trend in amount, is also indicated by the steeper regression slope of outgoing longwave radiation trends against precipitation than that exhibited in interannual variability. Our reanalysis results are strengthened by related trends manifested in more direct observations from satellite and gauge-based rainfall and a CAPE index from balloon soundings data.", "link": "https://doi.org/10.1038/s41612-022-00258-2", "authors": "A. V. Sreenath, S. Abhilash, P. Vijaykumar, B. E. Mapes", "source": "npj Climate and Atmospheric Science", "published": "2022-5-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 68, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "monsoon", "precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ef003583", "title": "Future Projections of Extreme Integrated Water Vapor Transport and Population Exposure Over the Asian Monsoon Region", "summary": "Abstract Global warming leads to an intensification of the water cycle and an increase in extreme climate events. Most previous researchers have used precipitation to project extreme hydrological changes. However, compared with precipitation, global climate models (GCMs) have a better performance in simulating the integrated vapor transport (IVT). IVT is thus a reliable tool for understanding how hydrological extremes may change in the future. In this study, we first discuss the relationship between IVT and precipitation over the Asian monsoon (AM) region during 1979–2014. We then assess the climatology, variability and extremes of IVT over the AM region and subregions using 16 GCMs from CMIP6. We further apply GCMs to project changes in the magnitude and probability of dangerous extreme IVT events (e.g., 20‐, 50‐ and 100‐year events) in the future. Finally, we quantify the population exposure to extreme IVT events, and explain change in exposure and its uncertainty. Results show that CMIP6 GCMs capture the spatial distribution of IVT well; the intensity of simulated IVT is lower than the ERA5 IVT. Under global warming of 1.5, 2, and 3°C, the magnitude of extreme events, which is independent of the return period (RP), increases over the AM region with relative changes of about 7%, 12%, and 21%, respectively. The probability increases consistently with global warming and the RP. The increase in exposure for the South Asian monsoon (East Asian monsoon) region is both contributed by more extreme IVT events and higher (fewer) population counts; the former has a larger proportio", "link": "https://doi.org/10.1029/2023ef003583", "authors": "Lianyi Guo, Yi Shi, Yang Zhao", "source": "Earth's Future", "published": "2023-8", "first_seen": "2026-11-23T21:25:47+00:00", "score": 67, "topics": ["Climate Modelling"], "watch": [], "boosts": ["monsoon", "cmip6", "precipitation", "extreme", "uncertainty"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-021-00219-1", "title": "Famines and likelihood of consecutive megadroughts in India", "summary": "Abstract Consecutive failures in the summer monsoon rainfall led to widespread and severe droughts with profound implications for agricultural activities in India. However, the likelihood of successive megadroughts in India’s past and future climate remain poorly understood. Using Palmer Drought Severity Index (PDSI) from the Monsoon Asia Drought Atlas (MADA), we show that the major famines that affected millions of people during 1200–2018 were linked with summer monsoon droughts. Four megadroughts covering more than 40% of the country occurred for two consecutive summer monsoon seasons during 1200–2018. The most recent and severe megadrought occurred in 2002–2003. Simulations from the Community Earth System Model (CESM) for the last millennium (850–2005) ensemble (LME) show that the likelihood of two and three-year consecutive megadroughts during the summer monsoon is about 0.7 and 0.3 events per 100 years, respectively. Large ensemble simulations from CESM (CESM-LE) show a decline in the frequency of megadroughts in the future. Summer monsoon megadroughts are strongly associated with the warm sea surface temperature (SST) anomalies over the Pacific Ocean in the past and future climate. Substantial warming under the projected future climate can cause megadroughts under near-normal precipitation during the summer monsoon season. Despite the projected decline in the likelihood of the summer monsoon megadroughts under the warming climate, megadroughts in the future can have considerable implications for India’s food production and water availability.", "link": "https://doi.org/10.1038/s41612-021-00219-1", "authors": "Vimal Mishra, Saran Aadhar", "source": "npj Climate and Atmospheric Science", "published": "2021-12-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 67, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "monsoon", "precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-019-04958-z", "title": "North American extreme precipitation events and related large-scale meteorological patterns: a review of statistical methods, dynamics, modeling, and trends", "summary": "Abstract This paper surveys the current state of knowledge regarding large-scale meteorological patterns (LSMPs) associated with short-duration (less than 1 week) extreme precipitation events over North America. In contrast to teleconnections, which are typically defined based on the characteristic spatial variations of a meteorological field or on the remote circulation response to a known forcing, LSMPs are defined relative to the occurrence of a specific phenomenon—here, extreme precipitation—and with an emphasis on the synoptic scales that have a primary influence in individual events, have medium-range weather predictability, and are well-resolved in both weather and climate models. For the LSMP relationship with extreme precipitation, we consider the previous literature with respect to definitions and data, dynamical mechanisms, model representation, and climate change trends. There is considerable uncertainty in identifying extremes based on existing observational precipitation data and some limitations in analyzing the associated LSMPs in reanalysis data. Many different definitions of “extreme” are in use, making it difficult to directly compare different studies. Dynamically, several types of meteorological systems—extratropical cyclones, tropical cyclones, mesoscale convective systems, and mesohighs—and several mechanisms—fronts, atmospheric rivers, and orographic ascent—have been shown to be important aspects of extreme precipitation LSMPs. The extreme precipitation is often realized through mesoscale processes organized, enhanced, or triggered by the LSMP. Under", "link": "https://doi.org/10.1007/s00382-019-04958-z", "authors": "Mathew Barlow, William J. Gutowski, John R. Gyakum, Richard W. Katz, Young-Kwon Lim, Russ S. Schumacher", "source": "Climate Dynamics", "published": "2019-9-20", "first_seen": "2026-11-23T21:25:47+00:00", "score": 67, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2020gl088662", "title": "Projected Future Changes in Tropical Cyclones Using the CMIP6 HighResMIP Multimodel Ensemble", "summary": "Abstract Future changes in tropical cyclone properties are an important component of climate change impacts and risk for many tropical and midlatitude countries. In this study we assess the performance of a multimodel ensemble of climate models, at resolutions ranging from 250 to 25 km. We use a common experimental design including both atmosphere‐only and coupled simulations run over the period 1950–2050, with two tracking algorithms applied uniformly across the models. There are overall improvements in tropical cyclone frequency, spatial distribution, and intensity in models at 25 km resolution, with several of them able to represent very intense storms. Projected tropical cyclone activity by 2050 generally declines in the South Indian Ocean, while changes in other ocean basins are more uncertain and sensitive to both tracking algorithm and imposed forcings. Coupled models with smaller biases suggest a slight increase in average TC 10 m wind speeds by 2050.", "link": "https://doi.org/10.1029/2020gl088662", "authors": "Malcolm John Roberts, Joanne Camp, Jon Seddon, Pier Luigi Vidale, Kevin Hodges, Benoît Vannière", "source": "Geophysical Research Letters", "published": "2020-7-16", "first_seen": "2026-11-23T14:47:49+00:00", "score": 66, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "cmip6"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2018ef001001", "title": "How Much Information Is Required to Well Constrain Local Estimates of Future Precipitation Extremes?", "summary": "Abstract Global warming is expected to increase the amount of atmospheric moisture, resulting in heavier extreme precipitation. Various studies have used the historical relationship between extreme precipitation and temperature ( temperature scaling ) to provide guidance about precipitation extremes in a future warmer climate. Here we assess how much information is required to robustly identify temperature scaling relationships, and whether these relationships are equally effective at different times in the future in estimating precipitation extremes everywhere across North America. Using a large ensemble of 35 North American regional climate simulations of the period 1951–2100, we show that individual climate simulations of length comparable to that of typical instrumental records are unable to constrain temperature scaling relationships well enough to reliably estimate future extremes of local precipitation accumulation for hourly to daily durations in the model's climate. Hence, temperature scaling relationships estimated from the limited historical observations are unlikely to be able to provide reliable guidance for future adaptation planning at local spatial scales. In contrast, well‐constrained temperature scaling relations based on multiple regional climate simulations do provide a feasible basis for accurately projecting precipitation extremes of hourly to daily durations in different future periods over more than 90% of the North American land area.", "link": "https://doi.org/10.1029/2018ef001001", "authors": "Chao Li, Francis Zwiers, Xuebin Zhang, Guilong Li", "source": "Earth's Future", "published": "2019-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 66, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-021-06105-z", "title": "Future urban heat island influence on precipitation", "summary": "Abstract Urbanization and global warming are two of the major human impacts on the environment. The Urban Heat Island (UHI) effect can change precipitation patterns. Global warming also leads to changes in precipitation and especially an increase in intensity and frequency of extreme precipitation. With urbanization expected to grow in the future, the role of UHI in a warmer climate is an important research question. We present results from 20-year long regional convection-permitting model simulations that include the UHI effect, run for historical and future climates for two megacities, Paris and Shanghai. In the warmer future climate, urban-induced precipitation is found to decrease compared to the historical climate, for both mean and extreme precipitation, with large uncertainties due to natural variability. The mean precipitation increase due to UHI in Paris is 2.2± 1.4% and 1.8 ± 1.3% for historical and future conditions, respectively. Shanghai has slightly weaker mean precipitation change than Paris at present and no change in the future. The future reduction of the urban effect is found to be caused by a decrease in summer precipitation for both cities. Interannual variability in precipitation due to UHI is larger for Shanghai than Paris. The UHI effect on extreme precipitation is also reduced in the future climate and the area with precipitation increase is more concentrated. The general increase in extreme precipitation due to global warming, in combination with the precipitation redistribution due to UHI, underline the importance for future urban planning to miti", "link": "https://doi.org/10.1007/s00382-021-06105-z", "authors": "B. M. Steensen, L. Marelle, Ø. Hodnebrog, G. Myhre", "source": "Climate Dynamics", "published": "2022-1-23", "first_seen": "2026-11-23T21:25:47+00:00", "score": 65, "topics": ["Downscaling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.325", "title": "Analysis of the 26 July 2005 heavy rain event over Mumbai, India using the Weather Research and Forecasting (WRF) model", "summary": "A case‐study of the 26 July 2005 Mumbai heavy‐rain event that recorded 944 mm rainfall in 24 h with significant spatial variability was carried out using the Weather Research and Forecasting (WRF) model. The event was poorly forecasted by operational models and resulted in large human and economic losses. The present results indicate that the WRF system was able to reproduce the heavy rainfall event and the associated dynamical and thermo‐ dynamical features. A number of experiments were conducted with the WRF model that suggest the highly localized, heavy rain was the result of an interaction of synoptic‐scale weather systems with the mesoscale, coastal land‐surface features. These experiments indicate that the large‐scale rising motion over the Mumbai region was synoptically forced. Analysis of the model‐simulated intense, but short‐lived, convective rain cells forming in the large‐scale rising motion over Mumbai traces their moisture source to the north and northwesterly flow from the Arabian Sea. Synthetic sensitivity simulations without topography and without a land surface (land replaced with water) show that the large‐scale synoptic flow positioned the low‐pressure system over the Arabian Sea, while the mesoscale land‐surface (including topography and latent heating) feedback modulated the location and intensity of the rain by changes in the winds and regional moisture convergences. Another important feature captured in the high‐resolution model analysis is the formation of a mesoscale vortex over Mumbai that appears to have enhanced the conditions for localized, hea", "link": "https://doi.org/10.1002/qj.325", "authors": "Anil Kumar, J. Dudhia, R. Rotunno, Dev Niyogi, U. C. Mohanty", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2008-10", "first_seen": "2026-11-23T21:44:54+00:00", "score": 65, "topics": ["Close to your work"], "watch": [], "boosts": ["india"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ef004222", "title": "Hydrological Projections in the Third Pole Using Artificial Intelligence and an Observation‐Constrained Cryosphere‐Hydrology Model", "summary": "Abstract The water resources of the Third Pole (TP), highly sensitive to climate change and glacier melting, significantly impact the water and food security of millions in Asia. However, projecting future spatial‐temporal runoff changes for TP's mountainous basins remains a formidable challenge. Here, we've leveraged the long short‐term memory model (LSTM) to craft a grid‐scale artificial intelligence (AI) model named LSTM‐grid. This model has enabled the production of hydrological projections for the seven major river basins of TP. The LSTM‐grid model integrates monthly precipitation, air temperature, and total glacier mass changes (total_GMC) data at a 0.25‐degree model grid. Training the LSTM‐grid model employed gridded historical monthly runoff and evapotranspiration data sets generated by an observation‐constrained cryosphere‐hydrology model at the headwaters of seven TP river basins during 2000–2017. Our results demonstrate the LSTM grid's effectiveness and usefulness, exhibiting a Nash‐Sutcliffe Efficiency coefficient exceeding 0.92 during the verification periods (2013–2017). Moreover, river basins in the monsoon region exhibited a higher rate of runoff increase compared to those in the westerlies region. Intra‐annual projections indicated notable increases in spring runoff, especially in basins where glacier meltwater significantly contributes to runoff. Additionally, the LSTM‐grid model aptly captures the runoff changes before and after the turning points of glacier melting, highlighting the growing influence of precipitation on runoff after reaching the maximum ", "link": "https://doi.org/10.1029/2023ef004222", "authors": "Junshui Long, Lei Wang, Deliang Chen, Ning Li, Jing Zhou, Xiuping Li", "source": "Earth's Future", "published": "2024-4", "first_seen": "2026-11-23T14:47:49+00:00", "score": 64, "topics": ["Deep Learning"], "watch": [], "boosts": ["monsoon", "precipitation"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022ef003303", "title": "Multivariate Drought Monitoring, Propagation, and Projection Using Bias‐Corrected General Circulation Models", "summary": "Abstract Understanding how droughts are characterized, propagated, and projected, particularly multivariate droughts, is necessary to explain the variability and changes in drought characteristics. This study aims to understand multimodel global drought monitoring, propagation, and projection by utilizing a multivariate standardized drought index (MSDI) during the historical (1959–2014) and future (2045–2100) periods under two socioeconomic pathways SSPs (370 and 585), derived from the bias‐corrected Coupled Model Intercomparison Project Phase 6 (CMIP6). Based on the energy metrics, the multivariate bias correction method outperformed other techniques in correcting the biases in the CMIP6 drought representation. The drought indicators demonstrate distinct categories for meteorological, hydrological, and multivariate droughts. There were significant high cross correlations between Heatwave Total Length (HWTL) and MSDI in Africa and South America for all lagged times. Europe and North America generally saw the maximum MSDI drought duration (228 months) during the historical period. For future projections, Africa recorded the maximum drought duration (197 months), while Europe witnessed the minimum drought duration for SSP 370 (171 months), and North America (149 months) for SSP 585. Furthermore, during the historical period in tropical Africa, the propagation of meteorological to hydrological drought was slower during the wet months than during the dry months. Under the SSP 370 future projection, there was a shift in the long period of meteorological‐hydrological propagation ", "link": "https://doi.org/10.1029/2022ef003303", "authors": "Oluwafemi E. Adeyeri, Wen Zhou, Patrick Laux, Christopher E. Ndehedehe, Xuan Wang, Muhammad Usman", "source": "Earth's Future", "published": "2023-4", "first_seen": "2026-11-23T14:47:49+00:00", "score": 64, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-021-00224-4", "title": "Increased occurrence of high impact compound events under climate change", "summary": "Abstract While compound weather and climate events (CEs) can lead to significant socioeconomic consequences, their response to climate change is mostly unexplored. We report the first multi-model assessment of future changes in return periods for the co-occurrence of heatwaves and drought, and extreme winds and precipitation based on the Coupled Model Intercomparison Project (CMIP6) and three emission scenarios. Extreme winds and precipitation CEs occur more frequently in many regions, particularly under higher emissions. Heatwaves and drought occur more frequently everywhere under all emission scenarios examined. For each CMIP6 model, we derive a skill score for simulating CEs. Models with higher skill in simulating historical CEs project smaller increases in the number of heatwaves and drought in Eurasia, but larger numbers of strong winds and heavy precipitation CEs everywhere for all emission scenarios. This result is partly masked if the whole CMIP6 ensemble is used, pointing to the considerable value in further improvements in climate models.", "link": "https://doi.org/10.1038/s41612-021-00224-4", "authors": "N. N. Ridder, A. M. Ukkola, A. J. Pitman, S. E. Perkins-Kirkpatrick", "source": "npj Climate and Atmospheric Science", "published": "2022-1-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 64, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-024-00584-7", "title": "Locally opposite responses of the 2023 Beijing–Tianjin–Hebei extreme rainfall event to global anthropogenic warming", "summary": "The effect of anthropogenic warming on extreme rainfall events is a hot topic in this era of global warming, and increasing attention is being paid to its impact at regional and local scales. We explore the localized response of precipitation during the high-impact “23·7” extreme rainfall event in the Beijing–Tianjin–Hebei region under anthropogenic warming using ensemble convective-permitting simulations. We identify two sub-regions with opposite responses: anthropogenic warming decreased (increased) precipitation in the northern (southern) sub-region of the Beijing–Tianjin–Hebei area. Further analysis shows that anthropogenic warming intensified the remnant of Typhoon Dusuari and increased rainfall in its inner core but decreased rainfall in the peripheral spiral rain band. These are the main reasons for the locally inconsistent responses of extreme rainfall to anthropogenic warming. We emphasize that anthropogenic warming, as a global background signal, directly affects the intensity and structure of specific weather systems rather than local precipitation. A high-impact extreme rainfall event, therefore, cannot always be simply attributed to climate warming enhancing precipitation at every location in a particular region.", "link": "https://doi.org/10.1038/s41612-024-00584-7", "authors": "Dajun Zhao, Hongxiong Xu, Ying Li, Yubin Yu, Yihong Duan, Xiangde Xu, Lianshou Chen", "source": "npj Climate and Atmospheric Science", "published": "2024-2-6", "first_seen": "2026-11-23T21:44:54+00:00", "score": 64, "topics": ["Close to your work"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.38775", "title": "Skillful and realistic precipitation forecasting with reinforced diffusion", "summary": "Accurate precipitation forecasting remains elusive as physics-based models struggle to resolve mesoscale convection and machine learning often yields physically inconsistent, blurred results that consistently underestimate extreme events. We present FitzRoy, the first system that simultaneously achieves state-of-the-art predictive skill and physical realism over the continental United States. Through a reinforced diffusion framework, where a conditional discrete diffusion model is refined via reinforcement learning, FitzRoy effectively resolves the long-standing trade-off between pointwise accuracy and structural fidelity. Across lead times up to 24 hours, FitzRoy consistently matches or exceeds state-of-the-art models while preserving structural realism and capturing extreme events. Its low-latency inference further enables deployment in real-time operational settings. In case studies such as the 2025 Texas Hill Country floods and the 2026 Missouri floods, FitzRoy signals record-breaking accumulations that existing models largely missed. By bridging the gap between realism and skill, FitzRoy establishes a new frontier for high-fidelity precipitation forecasting.", "link": "https://arxiv.org/abs/2610.38775", "authors": "Ozan Sener, Anand Avati, David Hafner, Jierui Lin, Laura Manduchi, Xiaoying Pang", "source": "arXiv", "published": "2026-10-28T19:50:45Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 63, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation", "extreme", "diffusion model"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-22-0023.1", "title": "A Hybrid Physics–AI Model to Improve Hydrological Forecasts", "summary": "Abstract The National Oceanic and Atmospheric Administration has developed a very high-resolution streamflow forecast using National Water Model (NWM) for 2.7 million stream locations in the United States. However, considerable challenges exist for quantifying uncertainty at ungauged locations and forecast reliability. A data science approach is presented to address the challenge. The long-range daily streamflow forecasts are analyzed from December 2018 to August 2021 for Alabama and Georgia. The forecast is evaluated at 389 observed USGS stream gauging locations using standard deterministic metrics. Next, the forecast errors are grouped using watersheds’ biophysical characteristics, including drainage area, land use, soil type, and topographic index. The NWM forecasts are more skillful for larger and forested watersheds than smaller and urban watersheds. The NWM forecast considerably overestimates the streamflow in the urban watersheds. The classification and regression tree analysis confirm the dependency of the forecast errors on the biophysical characteristics. A densely connected neural network model consisting of six layers [deep learning (DL)] is developed using biophysical characteristics, NWM forecast as inputs, and the forecast errors as outputs. The DL model successfully learns location invariant transferrable knowledge from the domain trained in the gauged locations and applies the learned model to estimate forecast errors at the ungauged locations. A temporal and spatial split of the gauged data shows that the probability of capturing the observations in the fo", "link": "https://doi.org/10.1175/aies-d-22-0023.1", "authors": "Yanan Duan, Sathish Akula, Sanjiv Kumar, Wonjun Lee, Sepideh Khajehei", "source": "Artificial Intelligence for the Earth Systems", "published": "2023-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 63, "topics": ["Deep Learning"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2205.00743", "title": "Machine-learned cloud classes from satellite data for process-oriented climate model evaluation", "summary": "Clouds play a key role in regulating climate change but are difficult to simulate within Earth system models (ESMs). Improving the representation of clouds is one of the key tasks towards more robust climate change projections. This study introduces a new machine-learning based framework relying on satellite observations to improve understanding of the representation of clouds and their relevant processes in climate models. The proposed method is capable of assigning distributions of established cloud types to coarse data. It facilitates a more objective evaluation of clouds in ESMs and improves the consistency of cloud process analysis. The method is built on satellite data from the MODIS instrument labelled by deep neural networks with cloud types defined by the World Meteorological Organization (WMO), using cloud type labels from CloudSat as ground truth. The method is applicable to datasets with information about physical cloud variables comparable to MODIS satellite data and at sufficiently high temporal resolution. We apply the method to alternative satellite data from the Cloud\\_cci project (ESA Climate Change Initiative), coarse-grained to typical resolutions of climate models. The resulting cloud type distributions are physically consistent and the horizontal resolutions typical of ESMs are sufficient to apply our method. We recommend outputting crucial variables required by our method for future ESM data evaluation. This will enable the use of labelled satellite data for a more systematic evaluation of clouds in climate models.", "link": "https://arxiv.org/abs/2205.00743", "authors": "A. Kaps, A. Lauer, G. Camps-Valls, P. Gentine, L. Gómez-Chova, V. Eyring", "source": "arXiv", "published": "2022-05-02T08:49:49Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 63, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2601.06941", "title": "Towards Operational Streamflow Forecasting in the Limpopo River Basin using Long Short-Term Memory Networks", "summary": "Robust hydrological simulation is key for sustainable development, water management strategies, and climate change adaptation. In recent years, deep learning methods have been demonstrated to outperform mechanistic models at the task of hydrological discharge simulation. Adoption of these methods has been catalysed by the proliferation of large sample hydrology datasets, consisting of the observed discharge and meteorological drivers, along with geological and topographical catchment descriptors. Deep learning methods infer rainfall-runoff characteristics that have been shown to generalise across catchments, benefitting from the data diversity in large datasets. Despite this, application to catchments in Africa has been limited. The lack of adoption of deep learning methodologies is primarily due to sparsity or lack of the spatiotemporal observational data required to enable downstream model training. We therefore investigate the application of deep learning models, including LSTMs, for hydrological discharge simulation in the transboundary Limpopo River basin, emphasising application to data scarce regions. We conduct a number of computational experiments primarily focused on assessing the impact of varying the LSTM model input data on performance. Results confirm that data constraints remain the largest obstacle to deep learning applications across African river basins. We further outline the impact of human influence on data-driven modelling which is a commonly overlooked aspect of data-driven large-sample hydrology approaches and investigate solutions for model adaptati", "link": "https://arxiv.org/abs/2601.06941", "authors": "James Tlhomole, Edoardo Borgomeo, Karthikeyan Matheswaran, Mariangel Garcia Andarcia", "source": "arXiv", "published": "2026-01-11", "first_seen": "2026-11-23T21:44:54+00:00", "score": 63, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/jgrd.50150", "title": "Updated analyses of temperature and precipitation extreme indices since the beginning of the twentieth century: The HadEX2 dataset", "summary": "In this study, we present the collation and analysis of the gridded land‐based dataset of indices of temperature and precipitation extremes: HadEX2. Indices were calculated based on station data using a consistent approach recommended by the World Meteorological Organization (WMO) Expert Team on Climate Change Detection and Indices, resulting in the production of 17 temperature and 12 precipitation indices derived from daily maximum and minimum temperature and precipitation observations. High‐quality in situ observations from over 7000 temperature and 11,000 precipitation meteorological stations across the globe were obtained to calculate the indices over the period of record available for each station. Monthly and annual indices were then interpolated onto a 3.75° × 2.5° longitude‐latitude grid over the period 1901–2010. Linear trends in the gridded fields were computed and tested for statistical significance. Overall there was very good agreement with the previous HadEX dataset during the overlapping data period. Results showed widespread significant changes in temperature extremes consistent with warming, especially for those indices derived from daily minimum temperature over the whole 110 years of record but with stronger trends in more recent decades. Seasonal results showed significant warming in all seasons but more so in the colder months. Precipitation indices also showed widespread and significant trends, but the changes were much more spatially heterogeneous compared with temperature changes. However, results indicated more areas with significant increasing tren", "link": "https://doi.org/10.1002/jgrd.50150", "authors": "M. G. Donat, L. V. Alexander, H. Yang, I. Durre, R. Vose, R. J. H. Dunn, K. M. Willett, E. Aguilar", "source": "JGR: Atmospheres", "published": "2013-3-4", "first_seen": "2026-11-23T21:44:54+00:00", "score": 63, "topics": ["Close to your work"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.13941", "title": "PARDIG: Global Precipitation Estimates Learned from Sparse Satellite Observations", "summary": "Estimating precipitation at the global scale is vital for Earth system science and disaster response, yet observational coverage and measurement precision remain constrained. Existing solutions provide options that trade off desirable traits such as skill, latency, geographical coverage, temporal coverage, and spatial and temporal resolution. We present PARDIG, an artificial intelligence framework based on a spherical graph-mesh transformer architecture that produces near-real-time global precipitation estimates. PARDIG is trained on dense multi-modal inputs, including atmospheric state analyses and multi-spectral geostationary satellite imagery, to predict sparse, high-precision precipitation measurements from spaceborne radar. At inference, the trained model is applied densely across the globe at $0.1^\\circ$ spatial and 15-minute temporal resolution, producing complete near-real-time precipitation fields from 2016 to the present, alongside a historical variant extending the record back to 1999. Evaluation against three independent radar networks (over the US, Europe, and Japan) and against over 36,000 surface stations worldwide shows that PARDIG consistently outperforms IMERG V07 (Final and Early), MSWEP V3, ERA5, and HRES across precipitation thresholds and regions, with the largest improvements at extreme intensities. Case studies of extreme precipitation events demonstrate that PARDIG successfully captures their spatial structure and timing. The improvements also extend to forecasting: WeatherNext 3, a global weather model, produces more skillful precipitation forecast", "link": "https://arxiv.org/abs/2611.13941", "authors": "Guy Shalev, Stephan Rasp, Boris Babenko, Andrew El-Kadi, Mohammed Alewi Hassen, Samier Merchant", "source": "arXiv", "published": "2026-11-10T11:28:50Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 62, "topics": ["Deep Learning"], "watch": ["Stephan Rasp"], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1002/qj.3921", "title": "Convection‐permitting modelling improves simulated precipitation over the central and eastern Tibetan Plateau", "summary": "Abstract The Tibetan Plateau (TP) plays an essential role in influencing the global climate, and precipitation is one of its most important water‐cycle components. However, accurately simulating precipitation over the TP is a long‐standing challenge. In this study, a convection‐permitting model (CPM; with 4 km grid spacing) that covers the entire TP was conducted and compared to two mesoscale models (MSMs; with model horizontal resolutions of 13 and 35 km) over the course of a summer. The results showed that the two MSMs have notable wet biases over the TP and can overestimate the summer precipitation by more than 4.0 mm·day −1 in some parts of the Three Rivers Source region. Moreover, both MSMs have more frequent light rainfall; increasing horizontal resolution of the MSMs alone does not reduce the excessive precipitation. Further investigation reveals that the MSMs have a spurious early‐afternoon rainfall peak, which can be linked to a strong dependence on convective available potential energy (CAPE) that dominates the wet biases. Herein, we highlight that the sensitivity of CAPE to surface temperatures may cause the MSMs to have a spurious hydrological response to surface warming. Users of climate projections should be aware of this potential model uncertainty when investigating future hydrological changes over the TP. In comparison, the CPM removes the spurious afternoon rainfall and thus significantly reduces the wet bias simulated by the MSMs. In addition, the CPM also better depicts the precipitation frequency and intensity, and is therefore a promising tool for dyna", "link": "https://doi.org/10.1002/qj.3921", "authors": "Puxi Li, Kalli Furtado, Tianjun Zhou, Haoming Chen, Jian Li", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2020-10-14", "first_seen": "2026-11-23T21:25:47+00:00", "score": 62, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/2013ef000185", "title": "Observational‐ and model‐based trends and projections of extreme precipitation over the contiguous United States", "summary": "Abstract Historical and projected trends in extreme precipitation events are examined in Coupled Model Intercomparison Project 5 ( CMIP5 ) models and observations, over the contiguous United States ( CONUS ), using several approaches. This study updates earlier studies that have used the extreme precipitation index ( EPI ) to assess observations and goes further by using the EPI to evaluate available climate model simulations. An increasing trend over the CONUS was found in the EPI , with large differences among seven subregions of the United States. Median of CMIP5 simulations also finds an increasing trend in th
