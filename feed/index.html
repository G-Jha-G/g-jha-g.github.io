onents are in companion papers) and details the coupling between them. The performance of GC3 is assessed in terms of mean biases and variability in long climate simulations using present‐day forcing. The suitability of the configuration for predictability on shorter time scales (weather and seasonal forecasting) is also briefly discussed. The performance of GC3 is compared against GC2, the previous Met Office coupled model configuration, and against an older configuration (HadGEM2‐AO) which was the submission to CMIP5. In many respects, the performance of GC3 is comparable with GC2, however, there is a notable improvement in the Southern Ocean warm sea surface temperature bias which has been reduced by 75%, and there are improvements in cloud amount and some aspects of tropical variability. Relative to HadGEM2‐AO, many aspects of the present‐day climate are improved in GC3 including tropospheric and stratospheric temperature structure, most aspects of tropical and extratropical variability and top‐of‐atmosphere and surface fluxes. A number of outstanding errors are identified including a residual asymmetric sea surface temperature bias (cool northern hemisphere, warm Southern Ocean), an overly strong global hydrological cycle", "link": "https://doi.org/10.1002/2017ms001115", "authors": "K. D. Williams, D. Copsey, E. W. Blockley, A. Bodas‐Salcedo, D. Calvert, R. Comer", "source": "Journal of Advances in Modeling Earth Systems", "published": "2018-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 31, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023jd039675", "title": "Impacts of Atlantic and Pacific Multidecadal Variability on South American Precipitation and Temperature in the CESM Simulations and Observations", "summary": "Abstract The Community Earth System Model version 1 (CESM1) and version 2 (CESM2)'s abilities to simulate the impacts of Atlantic multidecadal variability (AMV) and Pacific multidecadal variability (PMV) on South American precipitation and temperature have not been assessed, and how the AMV and PMV modulate each other's influences on South American climate is not well understood. Here we use observations, reanalyses, and CESM1 and CESM2 simulations from 1920 to 2015 to study those problems. The models can reproduce the observed precipitation and temperature responses to AMV well, but can only roughly reproduce such responses to PMV. The precipitation response over the South Atlantic convergence zone (SACZ) is better simulated by CESM2 compared to CESM1, which is associated with an improved horizontal moisture flux over this region. However, the models cannot accurately simulate the observed differences between the influences of Pacific interannual and multidecadal variability on South American precipitation and temperature. The impacts of AMV and PMV on South American precipitation are modulated by the other mode via changes in horizontal moisture flux over the SACZ and River Plate basin in summer, as well as changes in vertical motion over the equatorial regions in winter. Similarly, the impacts of AMV and PMV on South American temperature are also modulated by the other mode. Over water‐limited regions, such as northeastern Brazil and southern Argentina, the precipitation and temperature responses are anti‐correlated, possibly via surface evaporation.", "link": "https://doi.org/10.1029/2023jd039675", "authors": "Zhaoxiangrui He, Aiguo Dai, Mathias Vuille", "source": "JGR: Atmospheres", "published": "2024-6-26", "first_seen": "2026-11-23T21:25:47+00:00", "score": 31, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-7-2087-2026", "title": "Climate change effects on analogues of contrasting extratropical cyclones over the UK, Ireland and France", "summary": "Extreme extratropical cyclones present major socio-economic risks in the mid-latitudes and are sensitive to anthropogenic climate change. Robust projections of the aggregate properties of extreme cyclones based on climate-model output have emerged in recent years. However, such projections group together cyclones with a range of contrasting dynamical characteristics potentially obscuring climate change effects on particular types of cyclones. Here, we adopt the cyclone track analogue approach to examine the influence of climate change on four contrasting historical cyclones impacting the UK, Ireland and France: the Great Storm in October 1987, Martin in December 1999, Ophelia in October 2017, and Arwen in November 2021. Analogues are identified in the recently-produced CANARI large ensemble simulations for both the present climate (1980–2010) and a high-emission future scenario (SSP3–7.0, 2070–2100). Averaged across the four cases, the overall number of analogue cyclones decreases in future while the intensity of the most extreme cyclones increase, in both precipitation rate and lower-tropospheric wind speed, aligning well with consensus cyclone projections. However, the four cases exhibit contrasting responses, indicating that cyclone-specific changes under anthropogenic warming can diverge from the aggregate signal. For example, there is a marked future increase in the number of cyclones with a path similar to the Great Storm. Such changes are likely driven by regional variations in the conditions for baroclinic growth. Since individual cyclones are typically associated w", "link": "https://doi.org/10.5194/wcd-7-2087-2026", "authors": "Farrell Morgan, Ben Harvey, Kevin Hodges, Oscar Martínez-Alvarado", "source": "Weather and Climate Dynamics", "published": "2026-10-29", "first_seen": "2026-11-23T21:25:47+00:00", "score": 31, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-21-0151.1", "title": "The High-Resolution Rapid Refresh (HRRR): An Hourly Updating Convection-Allowing Forecast Model. Part I: Motivation and System Description", "summary": "Abstract The High-Resolution Rapid Refresh (HRRR) is a convection-allowing implementation of the Advanced Research version of the Weather Research and Forecasting (WRF-ARW) Model with hourly data assimilation that covers the conterminous United States and Alaska and runs in real time at the NOAA/National Centers for Environmental Prediction (NCEP). Implemented operationally at NOAA/NCEP in 2014, the HRRR features 3-km horizontal grid spacing and frequent forecasts (hourly for CONUS and 3-hourly for Alaska). HRRR initialization is designed for optimal short-range forecast skill with a particular focus on the evolution of precipitating systems. Key components of the initialization are radar-reflectivity data assimilation, hybrid ensemble-variational assimilation of conventional weather observations, and a cloud analysis to initialize stratiform cloud layers. From this initial state, HRRR forecasts are produced out to 18 h every hour, and out to 48 h every 6 h, with boundary conditions provided by the Rapid Refresh system. Between 2014 and 2020, HRRR development was focused on reducing model bias errors and improving forecast realism and accuracy. Improved representation of the planetary boundary layer, subgrid-scale clouds, and land surface contributed extensively to overall HRRR improvements. The final version of the HRRR (HRRRv4), implemented in late 2020, also features hybrid data assimilation using flow-dependent covariances from a 3-km, 36-member ensemble (“HRRRDAS”) with explicit convective storms. HRRRv4 also includes prediction of wildfire smoke plumes. The HRRR provi", "link": "https://doi.org/10.1175/waf-d-21-0151.1", "authors": "David C. Dowell, Curtis R. Alexander, Eric P. James, Stephen S. Weygandt, Stanley G. Benjamin, Geoffrey S. Manikin", "source": "Weather and Forecasting", "published": "2022-8", "first_seen": "2026-11-23T21:25:47+00:00", "score": 31, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.70176", "title": "Intensity dependence of El Niño and La Niña evolution and mixed‐layer heat‐budget processes", "summary": "Abstract El Niño and La Niña events exhibit distinct spatial, temporal, and dynamical behaviors that vary with their intensity, yet these variations remain underexplored. Using European Centre for Medium‐Range Weather Forecasts (ECMWF) Reanalysis 5th Generation (ERA5) data (1940–2024), we examine the onset, peak, decay, duration, and spatial evolution of sea‐surface temperature (SST) and precipitation anomalies for weak, moderate, strong, and very strong El Niño and La Niña events. Composite analyses reveal pronounced intensity‐dependent behavior. La Niña events maintain consistent locations of peak SST and rainfall anomalies regardless of intensity, whereas El Niño events exhibit a clear east‐to‐west shift in the location of maximum SST with decreasing intensity. Event duration increases with intensity: stronger events start earlier and persist longer. Strong El Niños last up to two months longer than strong La Niñas, whereas weak La Niñas outlast weak El Niños by about one month. To diagnose the mechanisms behind these intensity‐dependent behaviors, a mixed‐layer heat budget is applied using the Ocean Reanalysis System 5 (ORAS5; 1979–2018). Thermocline and zonal advective terms strengthen, expand eastward, and emerge earlier with increasing intensity for both El Niño and La Niña. In contrast, the Ekman contribution shows opposite intensity dependence for El Niño: it is pronounced in the eastern equatorial Pacific during weak events but weaker and more spatially diffuse during stronger El Niño events, whereas stronger La Niña events exhibit more coherent Ekman cooling. The", "link": "https://doi.org/10.1002/qj.70176", "authors": "Parya Adibi, Reza Rezaian, Omid Alizadeh, Tobias Sauter", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2026-3-13", "first_seen": "2026-11-23T21:25:47+00:00", "score": 31, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.2881", "title": "Spatial verification using wavelet transforms: a review", "summary": "Due to the emergence of new high‐resolution numerical weather prediction (NWP) models and the availability of new or more reliable remote sensing data, the importance of efficient spatial verification techniques is growing. Wavelet transforms offer an effective framework to decompose spatial data into separate (and possibly orthogonal) scales and directions. Most wavelet‐based spatial verification techniques have been developed or refined in the last decade and concentrate on assessing forecast performance (i.e. forecast skill or forecast error) on distinct physical scales. Particularly during the last 5 years, a significant growth in meteorological applications could be observed. However, a comparison with other scientific fields, such as feature detection, image fusion, texture analysis or facial and biometric recognition, shows that there is still a considerable, currently unused potential to derive useful diagnostic information. In order to tap the full potential of wavelet analysis, we review the state‐of‐the‐art in one‐ and two‐dimensional wavelet analysis and its application, with emphasis on spatial verification. We further use a technique developed for texture analysis in the context of high‐resolution quantitative precipitation forecasts, which is able to assess the structural characteristics of the precipitation fields and allows efficient clustering of ensemble data.", "link": "https://doi.org/10.1002/qj.2881", "authors": "Michael Weniger, Florian Kapp, Petra Friederichs", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2016-12-19", "first_seen": "2026-11-23T21:25:47+00:00", "score": 31, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024ms004280", "title": "Evaluation of Autoconversion Representation in E3SMv2 Using an Ensemble of Large‐Eddy Simulations of Low‐Level Warm Clouds", "summary": "Abstract In numerical atmospheric models that treat cloud and rain droplet populations as separate condensate categories, precipitation initiation in warm clouds is often represented by an autoconversion rate , which is the rate of formation of new rain droplets through the collisions of cloud droplets. Being a function of the cloud droplet size distribution (DSD), the local is commonly parameterized as a function of DSD moments: cloud droplet number and mass concentrations. When applied in a large‐scale model, the grid‐mean must also include a correction, or enhancement factor, to account for the horizontal variability of the cloud properties across the model grid. In this study, we evaluate the Au representation in the Energy Exascale Earth System Model version 2 (E3SMv2) climate model using large‐eddy simulations (LES), which explicitly resolve cloud droplet spectra, and therefore the local , as well as its spatial variability. The analysis of an ensemble of warm low‐level cloud cases shows that the E3SMv2 formulation represents the reasonably well compared to the horizontally averaged explicitly computed rate from LES. The agreement, however, comes from a combination of an underestimated E3SM‐tuned local rate and an overestimated subgrid cloud variability enhancement factor. The latter bias is traced to neglecting the horizontal variability of and its co‐variability with in parameterizing the grid‐mean .", "link": "https://doi.org/10.1029/2024ms004280", "authors": "Mikhail Ovchinnikov, Po‐Lun Ma, Colleen M. Kaul, Kyle G. Pressel, Meng Huang, Jacob Shpund", "source": "Journal of Advances in Modeling Earth Systems", "published": "2024-10", "first_seen": "2026-11-23T21:25:47+00:00", "score": 30, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2018ef000995", "title": "When Will Current Climate Extremes Affecting Maize Production Become the Norm?", "summary": "Abstract We estimate the effects of climate anomalies (heat stress and drought) on annual maize production, variability, and trend from the country level to the global scale using a statistical model. Moderate climate anomalies and extremes are diagnosed with two indicators of heat stress and drought computed over maize growing regions during the most relevant period of maize growth. The calibrated model linearly combines these two indicators into a single Combined Stress Index. The Combined Stress Index explains 50% of the observed global production variability in the period 1980–2010. We apply the model on an ensemble of high‐resolution global climate model simulations. Global maize losses, due to extreme climate events with 10‐year return times during the period 1980–2010, will become the new normal already at 1.5 °C global warming levels (approximately 2020s). At 2 °C warming (late 2030s), maize areas will be affected by heat stress and drought never experienced before, affecting many major and minor production regions.", "link": "https://doi.org/10.1029/2018ef000995", "authors": "M. Zampieri, A. Ceglar, F. Dentener, A. Dosio, G. Naumann, M. van den Berg", "source": "Earth's Future", "published": "2019-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 30, "topics": ["Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2025ea004363", "title": "Improving “23.07” Heavy Rainstorm Simulation Through Assimilating FY‐3E MWTS‐3 Radiance Data", "summary": "Abstract FengYun‐3E (FY‐3E) satellite, launched on 5 July 2021, is equipped with the third‐generation Microwave Temperature Sounder (MWTS‐3). Two window channels of MWTS‐3 are used to build a cloud detection module, and efficient assimilation of MWTS‐3 clear‐sky radiance data is implemented in the Weather Research and Forecasting Model (WRF). To assess the influence of assimilating MWTS‐3 radiances on extreme precipitation weather forecasting, a heavy rainstorm event that occurred in North China from 29 July to 2 August 2023, has been selected. After assimilating MWTS‐3 radiance data, the geopotential height field adjusted, leading to a northwestward shift of the Western Pacific Subtropical High as well as an eastward adjustment of the weather system. The forecasts with assimilated MWTS‐3 data reduced the root mean square error of temperature, zonal wind, and meridional wind, with clear improvements in temperature forecast skill at the 100–400 hPa levels within the first 33 hr of the forecast period. The 6–hr maximum rainfall center located southwest of Beijing was more successfully reproduced in the model simulation. Additionally, the precipitation forecast skill above the threshold of 15 mm was improved. Moreover, the water vapor transport and vertical motion conditions in Beijing has improved after assimilating MWTS‐3 data, which are likely to be contributing factors to the enhancements in the precipitation forecasting performance.", "link": "https://doi.org/10.1029/2025ea004363", "authors": "Shengjie Zhu, Deqin Li, Shibo Gao, Qian Xie, Xiao Pan", "source": "Earth and Space Science", "published": "2025-5", "first_seen": "2026-11-23T21:25:47+00:00", "score": 30, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023jd039328", "title": "Mechanisms Controlling the 4D Distribution of Rainfall and Latent Heating Over the Rainiest Region on Earth", "summary": "Abstract Global Precipitation Measurement satellite and ERA5 reanalysis data are used to study the 4D (latitude, longitude, altitude, time) distribution of rainfall intensity and latent heating fields over the rainiest region on Earth, located over western Colombia and the far eastern equatorial Pacific. The annual and interannual variability and the location of both variables' maxima are identified, and their spatiotemporal correlations are quantified. Static analyses of the winds show that the colder Choco low‐level jet (LLJ) and the warmer Caribbean‐Panama jet form a tropical frontal system. Dynamic analyses of 3D streamlines reveal that the Choco LLJ is at the core of a quasi‐permanent mini‐Hadley cell over the Pacific, with sinking motion between 6°S‐Equator and rising motion at 5°N–8°N, comprised between 1,000 and 700 hPa. Such vortex dynamics enhances the convergence of the northerly winds and the Panama jet, and exacerbates deep convection in association with the orographic lifting over the Colombian Andes. The large‐scale branches of that flow illuminate the shape and dynamics of the Walker cell over tropical South America. Correlation analyses illustrate the connections between rainfall and 3D winds as moisture transport mechanisms. Correlation and singular value decomposition analyses suggest that oceanic (continental) evaporation is associated with rainfall during the drier (wetter) season, and the importance of high‐levels temperatures and vertical integrals of diverse thermal and energy variables on rainfall bolster the view that the condensational heating is ", "link": "https://doi.org/10.1029/2023jd039328", "authors": "Germán Poveda", "source": "JGR: Atmospheres", "published": "2023-11-28", "first_seen": "2026-11-23T21:25:47+00:00", "score": 30, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr-d-13-00168.1", "title": "Climatological Characteristics of Atmospheric Rivers and Their Inland Penetration over the Western United States", "summary": "Abstract Narrow corridors of water vapor transport known as atmospheric rivers (ARs) contribute to extreme precipitation and flooding along the West Coast of the United States, but knowledge of their influence over the interior is limited. Here, the authors use Interim European Centre for Medium-Range Weather Forecasts (ECMWF) Re-Analysis (ERA-Interim) data, Climate Prediction Center (CPC) precipitation analyses, and Snowpack Telemetry (SNOTEL) observations to describe the characteristics of cool-season (November–April) ARs over the western United States. It is shown that AR frequency and duration exhibit a maximum along the Oregon–Washington coast, a strong transition zone upwind (west) of and over the Cascade–Sierra ranges, and a broad minimum that extends from the “high” Sierra south of Lake Tahoe eastward across the central Great Basin and into the deep interior. East of the Cascade–Sierra ranges, AR frequency and duration are largest over the interior northwest, while AR duration is large compared to AR frequency over the interior southwest. The fractions of cool-season precipitation and top-decile 24-h precipitation events attributable to ARs are largest over and west of the Cascade–Sierra ranges. Farther east, these fractions are largest over the northwest and southwest interior, with distinctly different large-scale patterns and AR orientations enabling AR penetration into each of these regions. In contrast, AR-related precipitation over the Great Basin east of the high Sierra is rare. These results indicate that water vapor depletion over major topographic barriers", "link": "https://doi.org/10.1175/mwr-d-13-00168.1", "authors": "Jonathan J. Rutz, W. James Steenburgh, F. Martin Ralph", "source": "Monthly Weather Review", "published": "2014-1-24", "first_seen": "2026-11-23T21:25:47+00:00", "score": 30, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.16714", "title": "Forecasting carbon-risk hotspots ahead of the extreme 2026 El Niño", "summary": "A potentially super El Niño is forecasted in 2026, raising the need to anticipate land carbon-cycle risks before its impacts unfold. We develop a prospective early-warning framework that uses dynamic global vegetation models driven by an ensemble of ECMWF seasonal climate forecasts and machine-learning burned area predictions. Forecasts indicate a $0.23 \\pm 0.21$ PgC reduction in global net biome productivity in the second half of 2026, with hotspots of sink weakening in eastern South America and elevated fire risk in Southeast Asia.", "link": "https://arxiv.org/abs/2610.16714", "authors": "Xiaomeng Du, Runda Jiang, Philippe Ciais, Pierre Friedlingstein, Stephen Sitch, Mike O'Sullivan", "source": "arXiv", "published": "2026-10-12T12:48:36Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 29, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2605.22836", "title": "Real-Time Earthquake Magnitude Classification from Initial P-Waves: Models, Dataset, and Comparative Analysis for South Asia", "summary": "Rapid earthquake magnitude estimation is crucial for effective early warning systems that can save lives and reduce economic damage. In this paper, we present a comprehensive study of magnitude classification using only the vertical component of the initial 7-second P-wave window from a single station. We compare six machine learning approaches that range from traditional models to state-of-the-art deep learning architectures. We also curated a novel dataset of 7,318 earthquake events in South Asia. The dataset was categorized into five Richter-scale classes: slight (3.0-3.9), light (4.0-4.9), moderate (5.0-5.9), strong (6.0-6.9) and severe (>= 7.0). Our experiments show that deep learning models substantially outperform traditional approaches. Our Transformer based architecture achieved 76.23% standard accuracy and 81.56% adaptive accuracy with 4.8 ms inference latency. The adaptive-accuracy metric is introduced for the inherent uncertainty in magnitude estimation of near class boundaries. These results indicate that the attention mechanisms in Transformers combined with adaptive classification effectively capture the temporal dynamics of seismic signals. The architectural advantage facilitates promising generalization to rare high-magnitude events, despite the inherent data scarcity characteristic of seismic catalogs. The adaptive accuracy provides a more realistic assessment of model performance, and the result suggests viability for real-time deployment.", "link": "https://arxiv.org/abs/2605.22836", "authors": "Md Nasiat Hasan Fahim, Md. Abid Ullah Muhib, Rayhanul Amin Tanvir, Abdullah Al Noman", "source": "arXiv", "published": "2026-05-10T16:25:05Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 29, "topics": ["Deep Learning"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2018ms001369", "title": "Global Mean Climate and Main Patterns of Variability in the CMCC‐CM2 Coupled Model", "summary": "Abstract Euro‐Mediterranean Centre on Climate Change coupled climate model (CMCC‐CM2) represents the new family of the global coupled climate models developed and used at CMCC. It is based on the atmospheric, land and sea ice components from the Community Earth System Model coupled with the global ocean model Nucleus for European Modeling of the Ocean. This study documents the model components, the coupling strategy, particularly for the oceanic, atmospheric, and sea ice components, and the overall model ability in reproducing the observed mean climate and main patterns of interannual variability. As a first step toward a more comprehensive, process‐oriented, validation of the model, this work analyzes a 200‐year simulation performed under constant forcing corresponding to present‐day climate conditions. In terms of mean climate, the model is able to realistically reproduce the main patterns of temperature, precipitation, and winds. Specifically, we report improvements in the representation of the sea surface temperature with respect to the previous version of the model. In terms of mean atmospheric circulation features, we notice a realistic simulation of upper tropospheric winds and midtroposphere geopotential eddies. The oceanic heat transport and the Atlantic meridional overturning circulation satisfactorily compare with present‐day observations and estimates from global ocean reanalyses. The sea ice patterns and associated seasonal variations are realistically reproduced in both hemispheres, with a better skill in winter. Main weaknesses of the simulated climate are re", "link": "https://doi.org/10.1029/2018ms001369", "authors": "A. Cherchi, P. G. Fogli, T. Lovato, D. Peano, D. Iovino, S. Gualdi", "source": "Journal of Advances in Modeling Earth Systems", "published": "2019-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 29, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021gl095778", "title": "Biased Estimates of Equilibrium Climate Sensitivity and Transient Climate Response Derived From Historical CMIP6 Simulations", "summary": "Abstract This study assesses the effective climate sensitivity (EffCS) and transient climate response (TCR) derived from global energy budget constraints within historical simulations of eight CMIP6 global climate models (GCMs). These calculations are enabled by use of the Radiative Forcing Model Intercomparison Project (RFMIP) simulations, which permit accurate quantification of the radiative forcing. Long‐term historical energy budget constraints generally underestimate EffCS from CO 2 quadrupling and TCR from CO 2 ramping, owing to changes in radiative feedbacks and changes in ocean heat uptake efficiency. Atmospheric GCMs forced by observed warming patterns produce lower values of EffCS that are more in line with those inferred from observed historical energy budget changes. The differences in the EffCS estimates from historical energy budget constraints of models and observations are traced to discrepancies between modeled and observed historical surface warming patterns.", "link": "https://doi.org/10.1029/2021gl095778", "authors": "Yue Dong, Kyle C. Armour, Cristian Proistosescu, Timothy Andrews, David S. Battisti, Piers M. Forster", "source": "Geophysical Research Letters", "published": "2021-12-23", "first_seen": "2026-11-23T21:25:47+00:00", "score": 29, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022jd037382", "title": "Intermodel Spread in Walker Circulation Responses Linked to Spread in Moist Stability and Radiation Responses", "summary": "Abstract The response of the Pacific Walker circulation (WC) to long‐term warming remains uncertain. Here, we diagnose contributions to the WC response in comprehensive and idealized general circulation model (GCM) simulations. We find that the spread in WC response is substantial across both the Coupled Model Intercomparison Project (CMIP6) and the Atmospheric Model Intercomparison Project (AMIP) models, implicating differences in atmospheric models in the spread in projected WC strength. Using a moist static energy (MSE) budget, we evaluate the contributions to changes in the WC strength related to changes in gross moist stability (GMS), horizontal MSE advection, radiation, and surface fluxes. We find that the multimodel mean WC weakening is mostly related to changes in GMS and radiation. Furthermore, the spread in WC response is related to the spread in GMS and radiation responses. The GMS response is potentially sensitive to parameterized convective entrainment which can affect lapse rates and the depth of convection. We thus investigate the role of entrainment in setting the GMS response by varying the entrainment rate in an idealized GCM. The idealized GCM is run with a simplified Betts‐Miller convection scheme, modified to represent entrainment. The weakening of the WC with warming in the idealized GCM is dampened when higher entrainment rates are used. However, the spread in GMS responses due to differing entrainment rates is much smaller than the spread in GMS responses across CMIP6 models. Therefore, further work is needed to understand the large spread in GMS res", "link": "https://doi.org/10.1029/2022jd037382", "authors": "Margaret L. Duffy, Paul A. O’Gorman", "source": "JGR: Atmospheres", "published": "2023-1-6", "first_seen": "2026-11-23T21:25:47+00:00", "score": 29, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-7-2133-2026", "title": "Co-occurrence of atmospheric deserts over Europe with strong positive temperature anomalies, thunderstorms, and dust events", "summary": "Atmospheric deserts are air masses originating in hot, dry, and deep convective boundary layers over arid and/or elevated regions and are advected across cooler, moister regions while possibly being modified by diabatic processes and differential advection. They are frequently advected over Europe and can modify temperature profiles throughout the free troposphere, with implications for convective potential. Atmospheric deserts generalise elevated mixed layers, which are known to influence near-surface temperatures and the formation of thunderstorms, but it remains unknown how frequently atmospheric deserts co-occur with strong positive temperature anomalies and lightning. We also investigate if atmospheric deserts frequently co-occur with dust events, since the source region for European atmospheric deserts is also the main source region for dust events. Atmospheric desert air is tracked during the study period from May 2022 to April 2024, using a direct detection method based on Lagrangian trajectories initiated at a very high spatio-temporal resolution. Positive temperature anomaly events, thunderstorms, and dust events are identified from reanalysis datasets and ground based lightning observation data. Conditional probabilities and corresponding standardised log-odds ratios provide insight into whether the mentioned extreme events occur more frequently in the presence of atmospheric deserts. The probability of events with strong positive temperature anomalies, thunderstorms, or dust anomalies is enhanced in the presence of atmospheric deserts in almost the entire domain", "link": "https://doi.org/10.5194/wcd-7-2133-2026", "authors": "Fiona Fix-Hewitt, Achim Zeileis, Isabell Stucke, Reto Stauffer, Georg J. Mayr", "source": "Weather and Climate Dynamics", "published": "2026-11-5", "first_seen": "2026-11-23T21:25:47+00:00", "score": 29, "topics": ["Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr-d-19-0110.1", "title": "Warm-Sector Heavy Rainfall in Southern China and Its WRF Simulation Evaluation: A Low-Level-Jet Perspective", "summary": "Abstract Warm-sector heavy rainfall in southern China refers to the heavy rainfall that occurs within the warm sector hundreds of kilometers south of a front or without a front during April–June, characterized by poor predictability and a close relationship with low-level jets (LLJs). Based on 45 warm-sector heavy rainfall episodes in 2013 and 2014 in southern China, this study examines their general characteristics and evaluates the performance of convection-permitting WRF Model simulations from an LLJ perspective. The results show that 64% of the warm-sector heavy rainfall episodes are associated with an LLJ (LLJ type) and 36% are not (no-LLJ type). The LLJ type is distinct from the no-LLJ type, with large rainfall accumulation along the coastal area. It is more common for LLJs to occur at both 800 and 925 hPa in the LLJ type, where there is a wide 800-hPa LLJ west of Guangdong Province and two 925-hPa LLJs over Beibu Gulf and the South China Sea (SCS). The coastal convergence associated with the terminus of the LLJ on 925 hPa is conducive to the coastal rainfall. WRF generally presents lower QPF skill in the LLJ type than in the no-LLJ type, due to the severe underestimation of coastal rainfall. The QPF skill of the LLJ type is significantly correlated with the forecast accuracy of LLJs, especially at 925 hPa. The north bias of the simulated LLJ on 925 hPa over the SCS and the associated overestimation of wind speed below ~900 hPa over the inland region weaken the coastal convergence and eventually lead to the underestimation in coastal precipitation.", "link": "https://doi.org/10.1175/mwr-d-19-0110.1", "authors": "Murong Zhang, Zhiyong Meng", "source": "Monthly Weather Review", "published": "2019-11-14", "first_seen": "2026-11-23T21:25:47+00:00", "score": 29, "topics": ["Downscaling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/1520-0493(1974)102<0509:vvcsuf>2.0.co;2", "title": "Various Vertical Coordinate Systems Used for Numerical Weather Prediction", "summary": "", "link": "https://doi.org/10.1175/1520-0493(1974)102<0509:vvcsuf>2.0.co;2", "authors": "Akira Kasahara", "source": "Monthly Weather Review", "published": "1974-7", "first_seen": "2026-11-23T14:47:49+00:00", "score": 28, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2025ms005133", "title": "Evaluating Mean State Cloud Properties in the Simple Cloud‐Resolving E3SM Atmosphere Model (SCREAM)", "summary": "Abstract Accurately simulating clouds remains a key challenge in global climate models, primarily because cloud formation involves sub‐grid processes that are parameterized and crudely represented in models. This study examines the performance of DOE's Simple Cloud‐Resolving Energy Exascale Earth System (E3SM) Atmosphere Model (SCREAM) in simulating cloud properties and their spatio‐temporal distribution by comparing against satellite observations. Two horizontal resolutions of SCREAM (3 and 12 km) are examined, and both depict a realistic spatial structure of mean‐state cloud cover but underestimate its global mean magnitude. SCREAM 3 km reasonably reproduces the distribution of mean‐state cloud properties across various cloud optical thickness and cloud‐top pressure regimes, with performance comparable to CMIP5 and CMIP6 ensemble and marginally outperforming SCREAM 12 km. Still, SCREAM 3 km tends to underpredict low clouds and optically thin clouds, highlighting the need for continued improvement in representing unresolved processes. This study provides a basis for confidence in the representation of clouds in SCREAM, as simulating mean‐state clouds is a necessary prerequisite for trusting its cloud responses to changes in aerosols and greenhouse gases.", "link": "https://doi.org/10.1029/2025ms005133", "authors": "Li‐Wei Chao, Mark D. Zelinka, Christopher R. Terai, Hassan Beydoun, Benjamin R. Hillman, Noel D. Keen", "source": "Journal of Advances in Modeling Earth Systems", "published": "2025-11", "first_seen": "2026-11-23T21:25:47+00:00", "score": 28, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024ef005624", "title": "Evaluating the Role of Internal Climate Variability and Bias Adjustment Methods on Decadal Glacier Projections", "summary": "Abstract Glacier mass loss is one of the main contributors to sea‐level rise and poses challenges for future water resources. Refining glacier projections and sources of uncertainty thus supports climate adaptation and mitigation. Here we explicitly quantify the impact of internal climate variability and climate data bias adjustment methods on regional and global glacier projections through 2100 for various emissions scenarios. Uncertainty from internal climate variability is comparable to climate model structural uncertainty (i.e., arising from physical representations and parameter settings) in the coming decades at the regional level, but is not a major source of uncertainty in centennial global glacier projections. Bias adjustment options (method and time period) moderately impact projections at regional and glacier scales, but have a smaller impact (∼2% of global glacier mass at 2100, relative to 2020) at global scales. In some regions, the uncertainty due to internal climate variability is larger than climate model structural uncertainty for the entirety of the 21st century, and bias adjustment options can nearly double the regional uncertainty by 2100. At the glacier scale, bias adjustments can lead to differences in projected decadal and centennial mass loss of up to 30%, although these greatest differences are associated with the smallest (<1 km 2 ) glaciers. Overall, internal climate variability and climate data bias adjustment methods are important to consider, especially in regional applications, to better estimate uncertainty in future sea‐level rise and water ", "link": "https://doi.org/10.1029/2024ef005624", "authors": "Matthew Weathers, David R. Rounce, John Fasullo, Fabien Maussion", "source": "Earth's Future", "published": "2025-7", "first_seen": "2026-11-23T21:25:47+00:00", "score": 28, "topics": ["Climate Modelling"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-023-00361-y", "title": "Potential for surprising heat and drought events in wheat-producing regions of USA and China", "summary": "Abstract Previous analyses of the possibility of global breadbasket failures have extrapolated risks based on historical relationships between climate and yields. However, climate change is causing unprecedented events globally, which could exceed critical thresholds and reduce yields, even if there is no historical precedent. This means that we are likely underestimating climate risks to our food system. In the case of wheat, parts of the USA and China show little historical relationship between yields and temperature, but extreme temperatures are now possible that exceed critical physiological thresholds in wheat plants. UNprecedented Simulated Extreme ENsemble (UNSEEN) approaches use large ensembles to generate plausible unprecedented events, which can inform our assessment of the risk to crops. We use the UNSEEN approach with a large ensemble of archived seasonal forecasts to generate thousands of plausible events over the last 40 years and compare the results with historically observed extreme temperature and precipitation. In the US midwest, extreme temperatures that would have happened approximately 1-in-100-years in 1981 now have a return period of 1-in-6 years, while in China, the current return period is on the order of 1-in-16 years. This means that in the US midwest, extreme temperatures that used to have a 1% chance to occur in 1981 now have a 17% chance to occur in any given year, while in China, the chance increased from 1% to 6%. Record-breaking years exceeding critical thresholds for enzymes in the wheat plant are now more likely than in the past, and these", "link": "https://doi.org/10.1038/s41612-023-00361-y", "authors": "Erin Coughlan de Perez, Hamsa Ganapathi, Gibbon I. T. Masukwedza, Timothy Griffin, Timo Kelder", "source": "npj Climate and Atmospheric Science", "published": "2023-6-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 28, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-25-0224.1", "title": "Environmental Transitions Driving Microphysical Changes in Lake-Enhanced Snow Events", "summary": "Abstract The environmental processes driving snowfall regime transitions during high-impact snow events in the Great Lakes Region are examined using a combination of ground-based observations and high-resolution simulations from the Weather Research and Forecasting (WRF) model. With a focus on observations near Marquette, Michigan, four snowfall cases are analyzed to evaluate the transition from synoptic-scale (cyclone-driven) forcing to shallow lake-effect forcing. The WRF simulations capture the timing and vertical reflectivity structures of these cases well, closely matching observed snowfall regimes. However, the model underestimates both snow accumulation and the variability in particle size distributions (PSDs) compared to observations. Despite these biases, WRF accurately identifies the timing of key microphysical transitions. These transitions are linked to cold air advection following the passage of a midlatitude cyclone, which lowers in-cloud temperatures into the dendritic growth zone (−12 °C to −18 °C) and are accompanied by a deeper convective boundary layer. During this transition, enhanced snowfall structures are driven by onshore flow and orographic lift, resulting in broadened PSDs and increased snowfall accumulations; this transition period occurs hours before the onset of lake effect snowfall bands. The consistent cold air advection and low-level convergence observed in each case highlight environmental markers associated with transitions to increased snowfall particle sizes and higher snow-to-liquid ratios. This provides improved understanding of microph", "link": "https://doi.org/10.1175/waf-d-25-0224.1", "authors": "David S. Henderson, Claire Pettersen, Jason A. Otkin, Stephen W. Nesbitt, Mark S. Kulie", "source": "Weather and Forecasting", "published": "2026-11-17", "first_seen": "2026-11-23T21:25:47+00:00", "score": 28, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022gl100916", "title": "A Deep Learning‐Based Bias Correction Method for Predicting Ocean Surface Waves in the Northwest Pacific Ocean", "summary": "Abstract Ocean waves, especially extreme waves, are vital for air‐sea interaction and shipping. However, current wave models still have significant biases. Based on a numerical wave model and a deep learning model, a BU‐Net by adding batch normalization layers to a U‐Net, we accurately predict the significant wave height (SWH) of the Northwest Pacific Ocean. For each day in 2017–2021, we conducted a 3‐day hindcast experiment using WAVEWATCH3 (WW3) to obtain the SWH forecasts at lead times of 24, 48, and 72 hr, forced by GFS real‐time forecast surface winds. After using BU‐Net, the mean Root Mean Squared Errors (RMSEs) of the SWH forecast from WW3 at lead times of 24, 48, and 72 hr are reduced by 40%, 38%, and 30%, respectively. During typhoon passages, the drop percentages of RMSEs all exceed 20% for three lead times. Therefore, combining numerical models and deep learning is very promising in wave forecasting.", "link": "https://doi.org/10.1029/2022gl100916", "authors": "Danyi Sun, Wenyu Huang, Yong Luo, Jingjia Luo, Jonathon S. Wright, Haohuan Fu", "source": "Geophysical Research Letters", "published": "2022-12-8", "first_seen": "2026-11-23T14:47:49+00:00", "score": 27, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022ef003019", "title": "Globally Increasing Atmospheric Aridity Over the 21st Century", "summary": "Abstract Vapor pressure deficit (VPD) is of great importance to control the land‐atmosphere exchange of water and CO 2 . Here we use in situ observations to assess the performance of monthly VPD calculated from state‐of‐the‐art data sets including CRU, ERA5, and Modern‐Era Retrospective analysis for Research and Applications, Version 2 (MERRA2). We investigate trends in VPD at global scale and for different climatic zones for 1981–2020 and future trends (2021–2100) from Coupled Model Inter‐comparison Project phase 6 (CMIP6) outputs. The results show that monthly VPD estimated from CRU, ERA5, and MERRA2 correlated well against in situ estimates from 15,531 World Meteorological Organization stations, with R 2 ranging between 0.92 and 0.96. Moreover, robust correlations were also found across in situ stations and when analyzing different months separately. During 1981–2020, VPD increased in all climatic zones, with the strongest increase in the arid zone, followed by tropical, temperate, cold and polar zones. CMIP6 simulations show a continuously increasing trend in VPD (0.028 hPa year −1 ), with the largest increase in the arid zone (0.063 hPa year −1 ). The magnitudes of trends are found to increase following the magnitude of CO 2 increases in the future emission scenarios. We highlight that atmospheric aridification will continue under global warming, which may pose an increasing threat to terrestrial ecosystems and particularly dryland agricultural systems.", "link": "https://doi.org/10.1029/2022ef003019", "authors": "Zhongxiang Fang, Wenmin Zhang, Martin Brandt, Abdulhakim M. Abdi, Rasmus Fensholt", "source": "Earth's Future", "published": "2022-10", "first_seen": "2026-11-23T21:25:47+00:00", "score": 27, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-025-01201-x", "title": "Tropical volcanic impacts on MENA climate via ENSO and NAO dynamics in a high-top model", "summary": "Abstract Volcanic eruptions are among the strongest climate drivers, yet their regional impacts on the Middle East and North Africa (MENA) remain poorly constrained. Post-eruption amplified winter cooling in MENA is often attributed to a volcanically forced positive North Atlantic Oscillation (NAO), but the concurrent occurrence of El Niño–Southern Oscillation (ENSO) complicates attribution. Furthermore, summer climatic responses, including tropical warming and mid-latitude cooling, remain underexplored. Here, we present a pioneering research using a high-top coupled climate model (MIROC6) to assess volcanic-induced ENSO–NAO interactions and their regional climate impacts. We demonstrate that volcanic-induced NAO variability is the primary driver of post-eruption MENA winter cooling, with El Niño acting as a modulator rather than a fundamental trigger. We further reveal distinct summer climate anomalies, including suppressed precipitation over the Intertropical Convergence Zone (ITCZ). These findings underscore the importance of high-top models to resolve stratospheric influences on post-volcanic climate variability.", "link": "https://doi.org/10.1038/s41612-025-01201-x", "authors": "Muhammad Mubashar Dogar, Shingo Watanabe, Masatomo Fujiwara, Muhammad Adnan Abid, Turki M. Habeebullah, Basit Khan", "source": "npj Climate and Atmospheric Science", "published": "2025-9-29", "first_seen": "2026-11-23T21:25:47+00:00", "score": 27, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-1-349-2020", "title": "The American monsoon system in HadGEM3 and UKESM1", "summary": "The simulated climate of the American monsoon system (AMS) in the UK models HadGEM3 GC3.1 (GC3) and the Earth system model UKESM1 is assessed and compared to observations and reanalysis. We evaluate the pre-industrial control, AMIP and historical experiments of UKESM1 and two configurations of GC3: a low (1.875∘×1.25∘) and a medium (0.83∘×0.56∘) resolution. The simulations show a good representation of the seasonal cycle of temperature in monsoon regions, although the historical experiments overestimate the observed summer temperature in the Amazon, Mexico and Central America by more than 1.5 K. The seasonal cycle of rainfall and general characteristics of the North American monsoon of all the simulations agree well with observations and reanalysis, showing a notable improvement from previous versions of the HadGEM model. The models reasonably simulate the bimodal regime of precipitation in southern Mexico, Central America and the Caribbean known as the midsummer drought, although with a stronger-than-observed difference between the two peaks of precipitation and the dry period. Austral summer biases in the modelled Atlantic Intertropical Convergence Zone (ITCZ), cloud cover and regional temperature patterns are significant and influence the simulated regional rainfall in the South American monsoon. These biases lead to an overestimation of precipitation in southeastern Brazil and an underestimation of precipitation in the Amazon. The precipitation biases over the Amazon and southeastern Brazil are greatly reduced in the AMIP simulations, highlighting that the Atlantic sea ", "link": "https://doi.org/10.5194/wcd-1-349-2020", "authors": "Jorge L. García-Franco, Lesley J. Gray, Scott Osprey", "source": "Weather and Climate Dynamics", "published": "2020-7-21", "first_seen": "2026-11-23T21:25:47+00:00", "score": 27, "topics": ["Climate Modelling"], "watch": [], "boosts": ["monsoon", "precipitation"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-7-223-2026", "title": "Linking European droughts to year-round weather regimes", "summary": "European droughts have far-reaching socio-economic and ecological impacts, yet their prediction remains challenging due to the complex interplay between large-scale atmospheric circulation patterns and local thermodynamic processes. This study investigates how persistent North Atlantic weather regimes influence the occurrence and spatial distribution of seasonal meteorological droughts across Europe throughout the year. Using reanalysis datasets and a tailored regionalization based on drought synchronicity, we identify six coherent European sub-regions and relate drought events, defined by the standardized precipitation index (SPI3), to year-round weather regimes derived from 500 hPa geopotential height anomalies. Our analysis shows that while each weather regime exhibits distinctive and relatively stable precipitation patterns throughout the year, only a fraction of droughts – primarily in western Europe and during winter – can be directly attributed to anomalies in regime frequency. The findings underline the partial but regionally significant role of North Atlantic circulation patterns in shaping European drought risk, highlighting opportunities and limitations for improving drought forecasts on sub-seasonal to seasonal timescales. This study emphasizes the added value of using year-round weather regimes as a unifying framework for understanding drought drivers, overcoming the constraints of purely seasonal classifications. Improved understanding of these links could help refine climate models and support more robust early-warning systems for drought management across di", "link": "https://doi.org/10.5194/wcd-7-223-2026", "authors": "Onaïa Savary, Constantin Ardilouze, Julien Cattiaux", "source": "Weather and Climate Dynamics", "published": "2026-1-28", "first_seen": "2026-11-23T21:25:47+00:00", "score": 27, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-1-127-2020", "title": "Potential vorticity structure of embedded convection in a warm conveyor belt and its relevance for large-scale dynamics", "summary": "Warm conveyor belts (WCBs) are important airstreams in extratropical cyclones. They can influence large-scale flow evolution by modifying the potential vorticity (PV) distribution during their cross-isentropic ascent. Although WCBs are typically described as slantwise-ascending and stratiform-cloud-producing airstreams, recent studies identified convective activity embedded within the large-scale WCB cloud band. However, the impacts of this WCB-embedded convection have not been investigated in detail. In this study, we systematically analyze the influence of embedded convection in an eastern North Atlantic WCB on the cloud and precipitation structure, on the PV distribution, and on larger-scale flow. For this reason, we apply online trajectories in a high-resolution convection-permitting simulation and perform a composite analysis to compare quasi-vertically ascending convective WCB trajectories with typical slantwise-ascending WCB trajectories. We find that the convective WCB ascent leads to substantially stronger surface precipitation and the formation of graupel in the middle to upper troposphere, which is absent for the slantwise WCB category, indicating the key role of WCB-embedded convection for precipitation extremes. Compared to the slantwise WCB trajectories, the initial equivalent potential temperature of the convective WCB trajectories is higher, and the convective WCB trajectories originate from a region of larger potential instability, which gives rise to more intense cloud diabatic heating and stronger cross-isentropic ascent. Moreover, the signature of embedd", "link": "https://doi.org/10.5194/wcd-1-127-2020", "authors": "Annika Oertel, Maxi Boettcher, Hanna Joos, Michael Sprenger, Heini Wernli", "source": "Weather and Climate Dynamics", "published": "2020-4-9", "first_seen": "2026-11-23T21:25:47+00:00", "score": 27, "topics": ["Downscaling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr3441.1", "title": "Probabilistic Quantitative Precipitation Forecasting Using Bayesian Model Averaging", "summary": "Abstract Bayesian model averaging (BMA) is a statistical way of postprocessing forecast ensembles to create predictive probability density functions (PDFs) for weather quantities. It represents the predictive PDF as a weighted average of PDFs centered on the individual bias-corrected forecasts, where the weights are posterior probabilities of the models generating the forecasts and reflect the forecasts’ relative contributions to predictive skill over a training period. It was developed initially for quantities whose PDFs can be approximated by normal distributions, such as temperature and sea level pressure. BMA does not apply in its original form to precipitation, because the predictive PDF of precipitation is nonnormal in two major ways: it has a positive probability of being equal to zero, and it is skewed. In this study BMA is extended to probabilistic quantitative precipitation forecasting. The predictive PDF corresponding to one ensemble member is a mixture of a discrete component at zero and a gamma distribution. Unlike methods that predict the probability of exceeding a threshold, BMA gives a full probability distribution for future precipitation. The method was applied to daily 48-h forecasts of 24-h accumulated precipitation in the North American Pacific Northwest in 2003–04 using the University of Washington mesoscale ensemble. It yielded predictive distributions that were calibrated and sharp. It also gave probability of precipitation forecasts that were much better calibrated than those based on consensus voting of the ensemble members. It gave better estimate", "link": "https://doi.org/10.1175/mwr3441.1", "authors": "J. Mc Lean Sloughter, Adrian E. Raftery, Tilmann Gneiting, Chris Fraley", "source": "Monthly Weather Review", "published": "2007-9-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 27, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr-d-16-0255.1", "title": "Near-Surface Thermodynamic Sensitivities in Simulated Extreme-Rain-Producing Mesoscale Convective Systems", "summary": "Abstract This study investigates the influences of low-level atmospheric water vapor on the precipitation produced by simulated warm-season midlatitude mesoscale convective systems (MCSs). In a series of semi-idealized numerical model experiments using initial s proposed for the statistical correction of weather forecasts based on observed analogs. An estimate is sought for the probability density function (pdf) of the observed state, given today’s numerical forecast. Assume that an infinite set of reforecasts (hindcasts) and associated observations are available and that the climate is stable. Assume that it is possible to find a set of past model forecast states that are nearly identical to the current forecast state. With the dates of these past forecasts, the asymptotically correct probabilistic forecast can be formed from the distribution of observed states on those dates. Unfortunately, this general theory of analogs is not useful for estimating the global pdf with a limited set of reforecasts, for the chance of finding even one effectively identical forecast analog in that limited set is vanishingly small, and the climate is not stable. Nonetheless, approximations can be made to this theory to make it useful for statistically correcting weather forecasts. For instance, when estimating the state in a local region, choose the dates of analogs based on a pattern match of the local weather forecast; with a few decades of reforecasts, there are usually many close analogs. Several approximate analog techniques are then tested for their ability to skillfully calibrate probabilistic forecasts of 24-h precipitation amount. A 25-yr set of reforecasts from a reduced-resolution global forecast model is used. The analog techniques find past ensemble-mean forecasts in a local region that are similar to today’s", "link": "https://doi.org/10.1175/mwr3237.1", "authors": "Thomas M. Hamill, Jeffrey S. Whitaker", "source": "Monthly Weather Review", "published": "2006-11-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 27, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.406", "title": "A Gill–Matsuno‐type mechanism explains the tropical Atlantic influence on African and Indian monsoon rainfall", "summary": "Abstract Recent studies using coupled atmosphere–ocean models have shown that the tropical Atlantic has a significant impact on the Indian monsoon. In this article, the observational basis for this teleconnection is examined and the physical mechanism responsible for bridging sea‐surface temperatures (SSTs) in the Atlantic and precipitation over India is investigated with idealized atmospheric general circulation model (AGCM) experiments in which constant SST anomalies are prescribed and ‘switched on’ in the tropical Atlantic region. A simple Gill–Matsuno‐type quadrupole response is proposed to explain the teleconnection between the tropical Atlantic and the Indian basin, with an enforcement of the eastward response likely due to nonlinear interactions with the mean monsoon circulation. The simplicity of this mechanism suggests the reproducibility of this result with a broad range of AGCMs. Copyright © 2009 Royal Meteorological Society", "link": "https://doi.org/10.1002/qj.406", "authors": "F. Kucharski, A. Bracco, J. H. Yoo, A. M. Tompkins, L. Feudale, P. Ruti", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2009-4", "first_seen": "2026-11-23T21:25:47+00:00", "score": 27, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "monsoon", "precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2018gl081584", "title": "Arctic‐Boreal Lake Dynamics Revealed Using CubeSat Imagery", "summary": "Abstract Fine‐scale, subseasonal fluctuations in Arctic‐Boreal surface water reflect regional water balance and modulate trace gas emissions to the atmosphere but have eluded detection using traditional satellite remote sensing. We use high‐resolution (~3–5 m), high‐frequency CubeSat sensors to measure near‐daily changes in lake surface area through an object‐based tracking method that incorporates machine learning to overcome notable limitations of CubeSat imagery. From ~76,000 images we obtain >2.2 million individual observations of changing surface areas for 85,358 lakes in Northern Canada and Alaska between 1 May and 1 October 2017. We find broad‐scale lake area declines across diverse climatic, hydrologic, and physiographic terrains. Localized exceptions reveal lowland flooding and aquatic vegetation phenology cycles. Cumulative small shoreline changes of abundant lakes on the Canadian Shield exceed total inundation variations of better‐studied lowland environments, revealing a surprisingly dynamic landscape with respect to subseasonal variations in surface water extent and trace gas emissions.", "link": "https://doi.org/10.1029/2018gl081584", "authors": "Sarah W. Cooley, Laurence C. Smith, Jonathan C. Ryan, Lincoln H. Pitcher, Tamlin M. Pavelsky", "source": "Geophysical Research Letters", "published": "2019-2-19", "first_seen": "2026-11-23T14:47:49+00:00", "score": 26, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021gl095311", "title": "Clays Are Not Created Equal: How Clay Mineral Type Affects Soil Parameterization", "summary": "Abstract Clay minerals dominate the soil colloidal fraction and its specific surface area. Differences among clay mineral types significantly influence their effects on soil hydrological and mechanical behavior. Presently, the soil clay content is used to parameterize soil hydraulic and mechanical properties (SHMP) for land surface models while disregarding the type of clay mineral. This undifferentiated use of clay leads to inconsistent parameterization, particularly between tropical and temperate soils, as shown herein. We capitalize on recent global maps of clay minerals that exhibit strong climatic and spatial segregation of active and inactive clays to consider spatially resolved clay mineral types in SHMP estimation. Clay mineral‐informed pedotransfer functions and machine learning algorithms trained with datasets including different clay types and soil structure formation processes improve SHMP representation regionally with broad implications for hydrological and geomechanical Earth surface processes.", "link": "https://doi.org/10.1029/2021gl095311", "authors": "P. Lehmann, B. Leshchinsky, S. Gupta, B. B. Mirus, S. Bickel, N. Lu", "source": "Geophysical Research Letters", "published": "2021-10-20", "first_seen": "2026-11-23T14:47:49+00:00", "score": 26, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.4", "title": "The role of the ocean in the Madden–Julian Oscillation: Implications for MJO prediction", "summary": "Abstract The role of coupled processes in the Madden–Julian Oscillation (MJO) is investigated in the European Centre for Medium‐Range Weather Forecasts Monthly Forecasting System. A series of forecasts initialized daily for 47 days during the Tropical Ocean Global Atmosphere Coupled Ocean Atmosphere Response Experiment (TOGA‐COARE) period are performed with sea surface temperatures (SSTs) provided by persistence of initial conditions, and coupling to either a full dynamical ocean model with vertical resolution in the upper ocean typical of coupled models (10 m), or, a 1D mixed layer ocean model with high (∼1 m) vertical resolution in the upper ocean. The experiment with the full dynamical model shows improved skill compared with the persisted SST experiment, indicating a role for coupled processes in the MJO. The experiment with the mixed layer model shows a further improvement in skill over the full dynamical ocean, particularly for the phases of the MJO where the convection is active over the Indian Ocean or West Pacific. This further improvement comes about from an enhanced sensitivity of the SST to the surface flux anomalies associated with the MJO. Additional sensitivity experiments reveal that the improved representation of the diurnal cycle which results from the increased vertical resolution is a significant factor in the improved skill of the experiments with the mixed layer model. Copyright © 2007 Royal Meteorological Society", "link": "https://doi.org/10.1002/qj.4", "authors": "S. J. Woolnough, F. Vitart, M. A. Balmaseda", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2007-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 26, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["india"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-7-1759-2026", "title": "Droughts in western Central Europe and associated atmospheric circulation patterns since 1844", "summary": "Droughts in western Central Europe have major impacts on agriculture, ecosystems, and society, yet their long-term variability and drivers remain poorly understood. This study investigates drought variability over the past 180 years and its link to atmospheric circulation. Three reanalysis datasets (ERA5, 20CRv3, and ModE-RA), evaluated against long weather station observations, are used to identify meteorological drought events via the 3-month Standardized Precipitation (Evapotranspiration) Indexes (SPI-3 & SPEI-3), and to relate them to atmospheric circulation patterns through k -means clustering of 500 hPa geopotential height anomalies. Results show that recent severe and successive droughts have historical precedents and occur within pronounced multidecadal variability. Yet the 2010s emerge as the driest decade when assessed with SPEI-3, a feature that disappears when only precipitation is considered, highlighting the increasing contribution of atmospheric evaporative demand (AED) to drought severity. Although year-round SPEI-3 exhibits no long-term trend, increasing AED has progressively offset increasing precipitation, leading to contrasting seasonal responses with autumn and winter becoming wetter, whereas summer and, more recently, spring becoming drier. Four recurrent circulation patterns are identified across drought events in western Central Europe, with droughts becoming increasingly associated with the European High, characterised by large anticyclonic and positive AED anomalies. Droughts under this pattern occur mostly in spring and are particularly intense, o", "link": "https://doi.org/10.5194/wcd-7-1759-2026", "authors": "Emile Neimry, Hugues Goosse, Mathieu Jonard", "source": "Weather and Climate Dynamics", "published": "2026-9-10", "first_seen": "2026-11-23T21:25:47+00:00", "score": 25, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-4-591-2023", "title": "Uncertainty growth and forecast reliability during extratropical cyclogenesis", "summary": "In global numerical weather prediction, the strongest contribution to ensemble variance growth over the first few days is at synoptic scales. Hence it is particularly important to ensure that this synoptic-scale variance is reliable. Here we focus on wintertime synoptic-scale growth in the North Atlantic storm track. In the 12 h background forecasts of the Ensemble of Data Assimilations (EDA) from the European Centre for Medium-Range Weather Forecasts (ECMWF), we find that initial variance growth at synoptic scales tends to be organized in particular flow situations, such as during the deepening of cyclones (cyclogenesis). Both baroclinic and diabatic aspects may be involved in the overall growth rate. However, evaluation of reliability through use of an extended error–spread equation indicates that the ECMWF ensemble forecast, which is initialized from the EDA but with additional singular vector perturbations, appears to have too much variance at a lead time of 2 d and that this over-spread is associated with cyclogenesis situations. Comparison of variance growth rates and reliability with other forecast systems within The International Grand Global Ensemble (TIGGE) archive indicates some sensitivity to the model or its initialization. For the ECMWF ensemble forecast, sensitivity experiments suggest that a large part of the total day-2 spread in cyclogenesis cases is associated with the growth of EDA uncertainty, but up to 25 % can be associated with the additional singular vector perturbations to the initial conditions and up to 25 % with the representation of model uncer", "link": "https://doi.org/10.5194/wcd-4-591-2023", "authors": "Mark J. Rodwell, Heini Wernli", "source": "Weather and Climate Dynamics", "published": "2023-7-5", "first_seen": "2026-11-23T21:25:47+00:00", "score": 25, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-10-05020.1", "title": "The Impacts of Taiwan Topography on the Predictability of Typhoon Morakot’s Record-Breaking Rainfall: A High-Resolution Ensemble Simulation", "summary": "Abstract In this study, the impacts of Taiwan topography on the extreme rainfall of Typhoon Morakot and the predictability of this rainfall are examined with a high-resolution (4 km) ensemble simulation using the Advanced Research core of the Weather Research and Forecasting Model (WRF-ARW). Ensemble prediction with realistic topography reproduces salient features of orographic precipitation. The 24- and 96-h accumulated rainfall amount and distribution from the ensemble mean compare reasonably well with the observed precipitation. When the terrain of Taiwan is removed, the rainfall distribution is markedly changed, suggesting the importance of the orography in determining the rainfall structure. Moreover, the peak 96-h rainfall amount is reduced to less than 20%, and the total rainfall amount over southern Taiwan is reduced to less than 60% of the experiments with Taiwan topography. Further analysis indicates that Taiwan’s topography substantially increases the variability of rainfall prediction. Analysis uncertainties as reflected in the perturbed initial state of the ensemble are amplified due to orographic influences on the typhoon circulation. As a result, significant variability occurs in the storm track, timing, and location of landfall, and storm intensities, which in turn, increases the rainfall variability. These results suggest that accurate prediction of heavy precipitation at a specific location and at high temporal resolution for an event such as Typhoon Morakot over Taiwan is extremely challenging. The forecasting of such an event would benefit from probabili", "link": "https://doi.org/10.1175/waf-d-10-05020.1", "authors": "Xingqin Fang, Ying-Hwa Kuo, Anyu Wang", "source": "Weather and Forecasting", "published": "2011-10-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 25, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-15-0016.1", "title": "Numerical Simulations of Typhoon Morakot (2009) Using a Multiply Nested Tropical Cyclone Prediction Model", "summary": "Abstract High-impact Typhoon Morakot (2009) was investigated using a multiply nested regional tropical cyclone prediction model. In the numerical simulations, the horizontal grid spacing, cumulus parameterizations, and microphysical parameterizations were varied, and the sensitivity of the track, intensity, and quantitative precipitation forecasts (QPFs) was examined. With regard to horizontal grid spacing, it is found that convective-permitting (5 km) resolution is necessary for a reasonably accurate QPF, while little benefit is gained through the use of a fourth domain at 1.67-km horizontal resolution. Significant sensitivity of the track forecast was found to the cumulus parameterization, which impacted the model QPFs. In particular, the simplified Arakawa–Schubert parameterization tended to erroneously regenerate the remnants of Tropical Storm Goni to the southwest of Morakot, affecting the large-scale steering flow and the track of Morakot. Strong sensitivity of the QPFs to the microphysical parameterization was found, with the track and intensity showing little sensitivity. It is also found that Morakot’s accumulated precipitation was reasonably predictable, with the control simulation producing an equitable threat score of 0.56 for the 3-day accumulated precipitation using a threshold of 500 mm. This high predictability of precipitation is due in part to more predictable large-scale and topographic forcing.", "link": "https://doi.org/10.1175/waf-d-15-0016.1", "authors": "Eric A. Hendricks, Yi Jin, Jonathan R. Moskaitis, James D. Doyle, Melinda S. Peng, Chun-Chieh Wu", "source": "Weather and Forecasting", "published": "2016-4-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 25, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Generative precipitati
