rvé Giordani", "source": "Journal of Advances in Modeling Earth Systems", "published": "2024-5", "first_seen": "2026-11-23T21:25:47+00:00", "score": 37, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024ef004553", "title": "Climate‐Driven Projections of Future Global Wetlands Extent", "summary": "Abstract Wetlands are crucial components of the Earth's system, interacting with various processes such as the hydrological cycle, energy exchanges with the atmosphere, and global nitrogen and carbon cycles. The future trajectory of wetlands is anticipated to be influenced not only by direct human activities, but also by climate change. Here we present our assessment of climate‐driven global changes in wetlands extent, focusing on the main wetland complexes. We used an approach based on the Topographic Hydrological model (TOPMODEL) and soil liquid water content projections from 14 models of the Coupled Model Intercomparison Project Phase 6 (CMIP6). Our analysis reveals a consistent decrease in wetlands extent in the Mediterranean, Central America, and northern South America, with a substantial loss of 28% in the western Amazon Basin for the end of the 21st century (2081–2100) under the SSP370 scenario. Conversely, Central Africa exhibits an increase in wetlands extent, except in the Congo Basin. Nevertheless, most of the areas studied (80%) present uncertain results, due to conflicting projections of changes between the models. Notably, we show that there is significant uncertainty among CMIP6 models regarding liquid soil water content in high latitudes. By narrowing our focus to 10 models, which seem to better represent the thawing of permafrost, we obtain a better inter‐model agreement. We then find a modest declines in the overall global area (<5%), but an average loss of 13% beyond 50°N. Specific areas like the Hudson Bay Lowlands experiencing a 21% decrease and the Wes", "link": "https://doi.org/10.1029/2024ef004553", "authors": "Lucas Hardouin, Bertrand Decharme, Jeanne Colin, Christine Delire", "source": "Earth's Future", "published": "2024-9", "first_seen": "2026-11-23T21:25:47+00:00", "score": 37, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/2017jd026783", "title": "Sensitivity of the regional climate in the Middle East and North Africa to volcanic perturbations", "summary": "Abstract The Middle East and North Africa (MENA) regional climate appears to be extremely sensitive to volcanic eruptions. Winter cooling after the 1991 Pinatubo eruption far exceeded the mean hemispheric temperature anomaly, even causing snowfall in Israel. To better understand MENA climate variability, the climate responses to the El Chichón and Pinatubo volcanic eruptions are analyzed using observations, NOAA/National Centers for Environmental Prediction Climate Forecast System Reanalysis, and output from the Geophysical Fluid Dynamics Laboratory's High‐Resolution Atmospheric Model. A multiple regression analysis both for the observations and the model output is performed on seasonal summer and winter composites to separate out the contributions from climate trends, El Niño–Southern Oscillation (ENSO), North Atlantic Oscillation (NAO), Indian summer monsoon, and volcanic aerosols. Strong regional temperature and precipitation responses over the MENA region are found in both winter and summer. The model and the observations both show that a positive NAO amplifies the MENA volcanic winter cooling. In boreal summer, the patterns of changing temperature and precipitation suggest a weakening and southward shift of the Intertropical Convergence Zone, caused by volcanic surface cooling and weakening of the Indian and West African monsoons. The model captures the main features of the climate response; however, it underestimates the total cooling, especially in winter, and exhibits a different spatial pattern of the NAO climate response in MENA compared to the observations. The c", "link": "https://doi.org/10.1002/2017jd026783", "authors": "Muhammad Mubashar Dogar, Georgiy Stenchikov, Sergey Osipov, Bruce Wyman, Ming Zhao", "source": "JGR: Atmospheres", "published": "2017-8-10", "first_seen": "2026-11-23T21:25:47+00:00", "score": 37, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "monsoon", "precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-6-1723-2025", "title": "Hectometric-scale modelling of the mixed layer in an urban region evaluated with a dense LiDAR-ceilometer network", "summary": "With development in recent years of hectometric (𝒪(100 m); hm) scale numerical weather prediction (NWP) models, there is a need for their evaluation with high spatio-temporal scale observations. Here we assess UK Met Office Unified Model (UM) simulations with grid-spacing down to 100 m using a dense network of observations obtained during the urbisphere -Berlin campaign. A network of 25 automatic lidars-ceilometers (ALCs) provide aerosol attenuated backscatter observations from which mixed-layer height (MLH) is determined. UM simulated aerosol on 2 d (18 April and 4 August 2022) is used to determine model MLH with a novel algorithm (MMLH). Evaluation of MMLH with ALCs is focused on the MLH (1) urban-rural variability, and (2) urban plume. MMLH is consistently able to reproduce the vertical extent of the mixed layer during late afternoon despite the 2 case-study days having different maxima. MMLH performance is better in the 100 m model domain compared to a 300 m configuration, which may be explained by the higher vertical resolution in the 100 m configuration. During the August case in which an extreme heat event occurred, a delayed MLH growth is seen in the morning and afternoon over the city compared to the rural surroundings in both the model and ALCs. Both days show a distinct influence of the city through the mixed layer, including a plume extending downwind of the city that is detectable in both the observations and model. The modelled urban plume has a deeper mixed layer compared to the rural surroundings (4 August: ∼ 500 m; 18 April: ∼ 200 m) for up to 15 km downwin", "link": "https://doi.org/10.5194/wcd-6-1723-2025", "authors": "Russell H. Glazer, Sue Grimmond, Lewis Blunn, Daniel Fenner, Humphrey Lean, Andreas Christen", "source": "Weather and Climate Dynamics", "published": "2025-12-5", "first_seen": "2026-11-23T21:25:47+00:00", "score": 37, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.15421", "title": "Advancing global water cycle science with the upcoming MAGIC satellite mission through data assimilation", "summary": "The GRACE and GRACE-FO missions provide unique global measurements of terrestrial water storage anomalies (TWSA) from space since 2003. However, in order to spatially downscale the GRACE/-FO resolution of 300 km further, and to vertically disaggregate TWSA into soil moisture, groundwater and other contributions, the TWSA observations were assimilated into hydrological and land surface models in the past while improving the realism of the models. With the upcoming MAGIC (Mass Change and Geosciences International Constellation) constellation consisting of two satellite pairs (NASA/DLR GRACE-C and ESA NGGM), significant advancements are expected for the monitoring of water mass changes, with improved temporal and spatial resolution, reduced latency, and with lower noise levels. In this study, we reviewed the capabilities and limitations of existing GRACE/-FO data assimilation systems. We then investigated the benefit of including data from the upcoming MAGIC constellation into existing assimilation frameworks to improve not only data sets for water and carbon cycle science but also in view of operational applications, within a closed-loop simulation. For example, we extended a global 17 years GRACE/-FO assimilation era to a long time series of 33 years with synthetic MAGIC data assimilated and show reductions in groundwater trends errors and errors in identifying hydrological extreme events. We further showed for Europe that both storage and river runoff simulations benefit from more frequent assimilation, which the integration of MAGIC data will enable due to the foreseen 5-d", "link": "https://arxiv.org/abs/2611.15421", "authors": "Helena Gerdener, Yorck Ewerdwalbesloh, Anne Springer, Annika Nitschke, Jürgen Kusche", "source": "arXiv", "published": "2026-11-11T12:50:28Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 36, "topics": ["Downscaling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2020ms002274", "title": "The Impact of Resolving Subkilometer Processes on Aerosol‐Cloud Interactions of Low‐Level Clouds in Global Model Simulations", "summary": "Abstract Subkilometer processes are critical to the physics of aerosol‐cloud interaction (ACI) but have been dependent on parameterizations in global model simulations. We thus report the strength of ACI in the Ultra‐Parameterized Community Atmosphere Model (UPCAM), a multiscale climate model that uses coarse exterior resolution to embed explicit cloud‐resolving models with enough resolution (250 m horizontal, 20 m vertical) to quasi‐resolve subkilometer eddies. To investigate the impact on ACIs, UPCAM's simulations are compared to a coarser multiscale model with 4 km horizontal resolution. UPCAM produces cloud droplet number concentrations ( N d ) and cloud liquid water path (LWP) values that are higher than the coarser model but equally plausible compared to observations. Our analysis focuses on the Northern Hemisphere (20–50°N) oceans, where historical aerosol increases have been largest. We find similarities in the overall radiative forcing from ACIs in the two models, but this belies fundamental underlying differences. The radiative forcing from increases in LWP is weaker in UPCAM, whereas the forcing from increases in N d is larger. Surprisingly, the weaker LWP increase is not due to a weaker increase in LWP in raining clouds, but a combination of weaker increase in LWP in nonraining clouds and a smaller fraction of raining clouds in UPCAM. The implication is that as global modeling moves toward finer than storm‐resolving grids, nuanced model validation of ACI statistics conditioned on the existence of precipitation and good observational constraints on the baseline p", "link": "https://doi.org/10.1029/2020ms002274", "authors": "C. R. Terai, M. S. Pritchard, P. Blossey, C. S. Bretherton", "source": "Journal of Advances in Modeling Earth Systems", "published": "2020-11", "first_seen": "2026-11-23T21:25:47+00:00", "score": 36, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2020gl087768", "title": "What Caused the Extreme Indian Ocean Dipole Event in 2019?", "summary": "Abstract An extreme positive Indian Ocean Dipole (IOD) event occurred in 2019 boreal autumn, which has induced severe climate impacts around the Indian Ocean basin. In this study, the cause for 2019 IOD event and the related mechanism are explored. We find that the remarkable strengthening of Australian high and weakening of sea level pressure over South China Sea/Philippine Sea have been evidently visible since May 2019. Such a record‐breaking interhemispheric pressure gradient (IHPG) induced northward cross‐equatorial flow over the western Maritime Continent, which triggered strong wind‐evaporation‐SST and thermocline feedbacks in 2019. In addition to 2019 case, historical IOD events are highly correlated with IHPG from boreal late spring to summer. We show that skillful IHPG prediction can be made in March by European Centre for Medium‐Range Weather Forecasts seasonal forecast system, which makes it quite possible for the early warning of extreme IOD events by two to three seasons ahead.", "link": "https://doi.org/10.1029/2020gl087768", "authors": "Bo Lu, Hong‐Li Ren", "source": "Geophysical Research Letters", "published": "2020-6-3", "first_seen": "2026-11-23T21:25:47+00:00", "score": 36, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["india", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2003gl018857", "title": "The 2003 heat wave in Europe: A shape of things to come? An analysis based on Swiss climatological data and model simulations", "summary": "The 2003 heat wave that affected much of Europe from June to September bears a close resemblance to what many regional climate models are projecting for summers in the latter part of the 21st century. Model results suggest that under enhanced atmospheric greenhouse‐gas concentrations, summer temperatures are likely to increase by over 4°C on average, with a corresponding increase in the frequency of severe heat waves. Statistical features of the 2003 heat wave for the Swiss site of Basel are investigated and compared to both past, 20th century events and possible future extreme temperatures based on model simulations of climatic change. For many purposes, the 2003 event can be used as an analog of future summers in coming decades in climate impacts and policy studies.", "link": "https://doi.org/10.1029/2003gl018857", "authors": "Martin Beniston", "source": "Geophysical Research Letters", "published": "2004-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 36, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2020ef001854", "title": "“Certain Uncertainty: The Role of Internal Climate Variability in Projections of Regional Climate Change and Risk Management”", "summary": "Abstract Internal climate variability co‐exists with anthropogenic climate change and places limits on the accuracy of regional climate projections due to its inherent unpredictability. This “certain” uncertainty in regional projections introduced by internal variability contrasts with uncertainty resulting from structural differences amongst climate models, which is potentially reducible as climate models improve. Initial‐condition “Large Ensembles” of simulations with individual climate models provide a new perspective on the expected range of future climate change outcomes. Their value for climate risk assessment, adaptation management, and decision‐making has yet to be fully realized.", "link": "https://doi.org/10.1029/2020ef001854", "authors": "Clara Deser", "source": "Earth's Future", "published": "2020-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 36, "topics": ["Climate Modelling"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/jgrd.50416", "title": "Diagnosing evaporative fraction over land from boundary‐layer clouds", "summary": "Abstract The potential use of continental fair‐weather shallow cumuli as a way to retrieve the daily surface evaporative fraction over land is evaluated in convective conditions. The proposed method utilizes the fact that both the timing of cloud occurrence and the cloud‐base height at the time of occurrence provide strong constraints on the surface energy balance and evaporative fraction. The retrieval is especially reliable in the presence of relatively stable and humid‐free troposphere profiles. The advantage of the method is that it provides a more direct estimate of the surface evaporative fraction than indirect estimation based on inversion of a highly parameterized land‐surface model. In addition, the evaporative fraction is obtained at a scale of a few kilometers, which is more pertinent for weather and climate studies. The retrieval strategy is tested and validated for three contrasting climates: the U.S. southern Great Plains, West Africa, and the Netherlands. We suggest that the use of satellite observations of shallow cumuli can help constrain the retrieval of the surface evaporative fraction within a data assimilation scheme/reanalysis.", "link": "https://doi.org/10.1002/jgrd.50416", "authors": "Pierre Gentine, Craig R. Ferguson, Albert A. M. Holtslag", "source": "JGR: Atmospheres", "published": "2013-8-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 36, "topics": ["Climate Modelling"], "watch": ["Pierre Gentine"], "boosts": [], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1038/s41612-026-01500-x", "title": "Toward a deeper understanding of tropical cyclone precipitation: insights from SHAP-based AI attribution", "summary": "Abstract Precipitation induced by tropical cyclones poses severe threats to both coastal and inland regions, yet its environmental associations remain incompletely understood. Leveraging a LightGBM model combined with SHapley Additive exPlanations, this study quantifies the relationships of atmospheric variables across three vertical layers with four TC precipitation characteristics: precipitation rate, precipitation amount, maximum precipitation intensity, and precipitation area. The analysis is based on global TC records, IMERG precipitation, and ERA5 reanalysis over the past two decades. Attribution results show that mid-to-upper-level vertical velocity and relative humidity are the variables most strongly associated with oceanic TC precipitation, while over land, air temperature and relative humidity become more important. These environmental associations further exhibit pronounced heterogeneity across TC subregions, extreme-event conditions, ocean basins, latitudes, and storm characteristics. Overall, these results offer interpretable insights into the relationships between TC precipitation and environmental factors and may inform future modeling efforts.", "link": "https://doi.org/10.1038/s41612-026-01500-x", "authors": "Weiqing Qi, Bin Yong, Elizabeth A. Ritchie, J. Scott Tyo, Josh May, Jian Shi", "source": "npj Climate and Atmospheric Science", "published": "2026-8-6", "first_seen": "2026-11-23T21:25:47+00:00", "score": 36, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-2-971-2021", "title": "A dynamical adjustment perspective on extreme event attribution", "summary": "Here we demonstrate that dynamical adjustment allows a straightforward approach to extreme event attribution within a conditional framework. We illustrate the potential of the approach with two iconic extreme events that occurred in 2010: the early winter European cold spell and the Russian summer heat wave. We use a dynamical adjustment approach based on constructed atmospheric circulation analogues to isolate the various contributions to these two extreme events using only observational and reanalysis datasets. Dynamical adjustment results confirm previous findings regarding the role of atmospheric circulation in the two extreme events and provide a quantitative estimate of the various dynamic and thermodynamic contributions to the event amplitude. Furthermore, the approach is also used to identify the drivers of the recent 1979–2018 trends in summer extreme maximum and minimum temperature changes over western Europe and western Asia. The results suggest a significant role of the dynamic component in explaining temperature extreme changes in different regions, including regions around the Black and Caspian seas as well as central Europe and the coasts of western Europe. Finally, dynamical adjustment offers a simple and complementary storyline approach to extreme event attribution with the advantage that no climate model simulations are needed, making it a promising candidate for the fast-track component of any real-time extreme event attribution system.", "link": "https://doi.org/10.5194/wcd-2-971-2021", "authors": "Laurent Terray", "source": "Weather and Climate Dynamics", "published": "2021-10-25", "first_seen": "2026-11-23T21:25:47+00:00", "score": 36, "topics": ["Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-026-08421-8", "title": "A multi-model assessment of evolving forced changes in northern hemisphere modes of atmospheric circulation variability and the role of the tropical Pacific", "summary": "Abstract Understanding how modes of climate variability will change in a warming world is essential for improving regional climate projections. Using eight single model initial-condition large ensembles (SMILEs), we examine projected changes in the leading Northern Hemisphere modes of wintertime atmospheric circulation variability: the Pacific North American pattern (PNA), the North Pacific Oscillation (NPO), the East Pacific Pattern (EPP), and the North Atlantic Oscillation (NAO), and their influence on precipitation. By applying a snapshot empirical orthogonal function analysis to the 500 hPa geopotential height field in each SMILE, we are able to characterise how patterns, amplitudes, and impacts of each mode are projected to evolve over the next century. While most of the SMILEs generally capture the observed modes of variability, we find substantial disagreement in their projections of the NPO and NAO. The PNA response is more robust across models and is associated with a consistent intensification of the Aleutian low variability, which has implications for the volatility of future precipitation patterns over the United States. Both the PNA and NPO projections become more consistent between models when influences from the tropical Pacific are removed, highlighting that inter-model differences in projections of the El Niño Southern Oscillation can confound projections of extra-tropical modes of variability. In contrast, NAO projections remain model-dependent even when tropical Pacific influences are removed. The EPP emerges as an increasingly important mode for Californ", "link": "https://doi.org/10.1007/s00382-026-08421-8", "authors": "Nicola Maher, Clara Deser, John P. O’Brien", "source": "Climate Dynamics", "published": "2026-11-20", "first_seen": "2026-11-23T21:25:47+00:00", "score": 36, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr-d-13-00354.1", "title": "The Influence of Land Surface Heterogeneities on Cloud Size Development", "summary": "Abstract This study analyzes the effects of land surface heterogeneities at various horizontal scales on the transition from shallow to deep convection and on the cloud size distribution. An idealized case of midlatitude summertime convection is simulated by means of large-eddy simulations coupled to an interactive land surface. The transition is accelerated over heterogeneous surfaces. The simulation with an intermediate patch size of 12.8 km exhibits the fastest transition with a transition time two-thirds that over a homogeneous surface. A similar timing is observed for the precipitation onset whereas the total accumulated rainfall tends to increase with patch size. The cloud size distribution can be approximated by a power law with a scale break. The exponent of the power law is independent of the heterogeneity scale, implying a similar cloud cover between the simulations. In contrast, the scale break varies with patch size. The size of the largest clouds does not scale with the boundary layer height, although their maximum size scales with the patch size. Finally, the idea that larger clouds grow faster, known from homogeneous surface conditions, is not fully valid over heterogeneous surfaces. These various aspects can be understood from the complex interplay between the characteristics of the triggered mesoscale circulations and a cloud development acting in response to the diurnal cycle in surface heating. The results also call for adequate representation of such effects in convective parameterizations.", "link": "https://doi.org/10.1175/mwr-d-13-00354.1", "authors": "Malte Rieck, Cathy Hohenegger, Chiel C. van Heerwaarden", "source": "Monthly Weather Review", "published": "2014-9-19", "first_seen": "2026-11-23T21:25:47+00:00", "score": 36, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-14-2977-2021", "title": "BCC-CSM2-HR: a high-resolution version of the Beijing Climate Center Climate System Model", "summary": "BCC-CSM2-HR is a high-resolution version of the Beijing Climate Center (BCC) Climate System Model (T266 in the atmosphere and 1/4 ∘ latitude × 1/4 ∘ longitude in the ocean). Its development is on the basis of the medium-resolution version BCC-CSM2-MR (T106 in the atmosphere and 1 ∘ latitude × 1 ∘ longitude in the ocean) which is the baseline for BCC participation in the Coupled Model Intercomparison Project Phase 6 (CMIP6). This study documents the high-resolution model, highlights major improvements in the representation of atmospheric dynamical core and physical processes. BCC-CSM2-HR is evaluated for historical climate simulations from 1950 to 2014, performed under CMIP6-prescribed historical forcing, in comparison with its previous medium-resolution version BCC-CSM2-MR. Observed global warming trends of surface air temperature from 1950 to 2014 are well captured by both BCC-CSM2-MR and BCC-CSM2-HR. Present-day basic atmospheric mean states during the period from 1995 to 2014 are then evaluated at global scale, followed by an assessment on climate variabilities in the tropics including the tropical cyclones (TCs), the El Niño–Southern Oscillation (ENSO), the Madden–Julian Oscillation (MJO), and the quasi-biennial oscillation (QBO) in the stratosphere. It is shown that BCC-CSM2-HR represents the global energy balance well and can realistically reproduce the main patterns of atmospheric temperature and wind, precipitation, land surface air temperature, and sea surface temperature (SST). It also improves the spatial patterns of sea ice and associated seasonal variations in ", "link": "https://doi.org/10.5194/gmd-14-2977-2021", "authors": "Tongwen Wu, Rucong Yu, Yixiong Lu, Weihua Jie, Yongjie Fang, Jie Zhang", "source": "Geoscientific Model Development", "published": "2021-5-26", "first_seen": "2026-11-23T21:25:47+00:00", "score": 35, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-12-2727-2019", "title": "Description and basic evaluation of simulated mean state, internal variability, and climate sensitivity in MIROC6", "summary": "The sixth version of the Model for Interdisciplinary Research on Climate (MIROC), called MIROC6, was cooperatively developed by a Japanese modeling community. In the present paper, simulated mean climate, internal climate variability, and climate sensitivity in MIROC6 are evaluated and briefly summarized in comparison with the previous version of our climate model (MIROC5) and observations. The results show that the overall reproducibility of mean climate and internal climate variability in MIROC6 is better than that in MIROC5. The tropical climate systems (e.g., summertime precipitation in the western Pacific and the eastward-propagating Madden–Julian oscillation) and the midlatitude atmospheric circulation (e.g., the westerlies, the polar night jet, and troposphere–stratosphere interactions) are significantly improved in MIROC6. These improvements can be attributed to the newly implemented parameterization for shallow convective processes and to the inclusion of the stratosphere. While there are significant differences in climates and variabilities between the two models, the effective climate sensitivity of 2.6 K remains the same because the differences in radiative forcing and climate feedback tend to offset each other. With an aim towards contributing to the sixth phase of the Coupled Model Intercomparison Project, designated simulations tackling a wide range of climate science issues, as well as seasonal to decadal climate predictions and future climate projections, are currently ongoing using MIROC6.", "link": "https://doi.org/10.5194/gmd-12-2727-2019", "authors": "Hiroaki Tatebe, Tomoo Ogura, Tomoko Nitta, Yoshiki Komuro, Koji Ogochi, Toshihiko Takemura", "source": "Geoscientific Model Development", "published": "2019-7-8", "first_seen": "2026-11-23T21:25:47+00:00", "score": 35, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2025ef006311", "title": "Strengthening Coupling Between Vegetation and Soil‐Atmosphere Compound Drought Over the Past Two Decades", "summary": "Abstract Soil‐atmosphere compound drought (SACD) significantly impacts vegetation, with effects expected to intensify under global warming. However, the dynamic coupling relationship between vegetation and SACD considering the optimal time lag remains unclear. To address this, we first employed copulas to develop a SACD index at temporal scales ranging from 1 to 24 months. Based on this index, the coupling relationship represented by the maximum correlation coefficient ( R max ) and the optimal time lag ( T opt ) between the Leaf Area Index and the SACD was examined. Furthermore, the coupling degree between the two was explored both temporally and spatially. The results revealed a significant nonlinear trend in both R max and T opt , with turning points identified using the Ensemble Empirical Mode Decomposition occurring between 2010–2014 and 2011–2015, respectively. Additionally, it was found that the temporal coupling degree was strong, while the spatial coupling was initially weaker but showed an increasing trend, particularly in water‐limited regions. Land surface model simulations indicated that CO 2 was the dominant driver of the vegetation‐drought coupling relationship and degree. Machine learning and SHapley Additive Explanations underscored the critical importance of meteorological variables, with radiation, precipitation and temperature being identified as the most influential meteorological factors. Finally, based on the Peter‐Clark Momentary Conditional Independence Plus, the complex causal relationship network between meteorological factors and the vegetation‐d", "link": "https://doi.org/10.1029/2025ef006311", "authors": "Rong Wu, Zijun Wang, Fangxiu Meng, Yangyang Liu, Haiyun Shi", "source": "Earth's Future", "published": "2025-8", "first_seen": "2026-11-23T21:25:47+00:00", "score": 35, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022ef003038", "title": "Modeling Post‐Wildfire Hydrologic Response: Review and Future Directions for Applications of Physically Based Distributed Simulation", "summary": "Abstract Wildfire is a growing concern as climate shifts. The hydrologic effects of wildfire, which include elevated hazards and changes in water quantity and quality, are increasingly assessed using numerical models. Post‐wildfire application of physically based distributed models provides unique insight into the underlying processes that affect water resources after wildfire. This work reviews and synthesizes post‐wildfire applications of physically based distributed models by examining the scales and geographic/ecohydrologic distribution of model applications, hydrologic response process representation, model parameterization, and model performance metrics. Highlighted gaps and opportunities for advancing physically based distributed hydrologic response modeling after wildfire include the following: (a) applying models in under‐represented geographic (S. America, Africa, Asia) and ecohydrologic regions (arid or dry subhumid climates), (b) incorporating all four major streamflow generation mechanisms (infiltration excess, saturation excess, subsurface storm flow, and groundwater flow), (c) representing integrated vadose zone and saturated zone processes to better capture subsurface streamflow generation, (d) building new remotely sensed model parameterization methods for precipitation interception, infiltration, and overland flow that account for burn severity and recovery, (e) incorporating distributed state variables (e.g., soil moisture, groundwater levels) in model performance assessment, (f) designing model intercomparison studies, including field datasets specifical", "link": "https://doi.org/10.1029/2022ef003038", "authors": "Brian A. Ebel, Zachary M. Shephard, Michelle A. Walvoord, Sheila F. Murphy, Trevor F. Partridge, Kim S. Perkins", "source": "Earth's Future", "published": "2023-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 35, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/2014jd022232", "title": "Influence of irrigation on land hydrological processes over California", "summary": "Abstract In this study, a regional climate model (RCM) is employed to investigate the effect of irrigation on hydrology over California through implementing a “realistic irrigation” scheme. Our results indicate that the RCM with a realistic irrigation scheme commonly practiced in California can capture the soil moisture and evapotranspiration (ET) variation very well in comparison with the available in situ and remote sensing data. The RCM results show significant improvement in comparison with those outputs from the default run and the commonly used runs with fixed soil moisture at field capacity. Furthermore, the model reproduces the observed decreasing trends of the reference ET (i.e., ET0) from the California Irrigation Management Information System (CIMIS). The observed decreasing trend is most likely due to the decreasing trend of downward solar radiation shown by models and CIMIS observations. This issue is fundamental in projecting future irrigation water demand. The deep soil percolation rate changes depending on the irrigation method and irrigation duration. Finally, the model results show that precipitation change due to irrigation in California is relatively small in amount and mainly occurs along the midlatitudes in the western United States.", "link": "https://doi.org/10.1002/2014jd022232", "authors": "Soroosh Sorooshian, Amir AghaKouchak, Jialun Li", "source": "JGR: Atmospheres", "published": "2014-12-5", "first_seen": "2026-11-23T21:25:47+00:00", "score": 35, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022gl102283", "title": "Multi‐Task Learning for Simultaneous Retrievals of Passive Microwave Precipitation Estimates and Rain/No‐Rain Classification", "summary": "Abstract Satellite‐based precipitation estimations provide frequent, large‐scale measurements. Deep learning has recently shown significant potential for improving estimation accuracy. Most studies have employed a two‐stage framework, which is a sequential architecture of a rain/no‐rain binary classification task followed by a rain rate regression task. This study proposes a novel precipitation retrieval framework in which these two tasks are simultaneously trained using multi‐task learning approach (MTL). Furthermore, a novel network architecture and loss function were designed to reap the benefits of MTL. The proposed two‐task model successfully achieved a better performance than the conventional single‐task model possibly due to efficient knowledge transfer between tasks. Furthermore, the product intercomparison showed that our product outperformed existing products in rain rate retrieval and also yielded better skills in the rain/no‐rain retrieval task.", "link": "https://doi.org/10.1029/2022gl102283", "authors": "Takumi Bannai, Haoyang Xu, Nobuyuki Utsumi, Eunho Koo, Keming Lu, Hyungjun Kim", "source": "Geophysical Research Letters", "published": "2023-4-5", "first_seen": "2026-11-23T21:25:47+00:00", "score": 34, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2026ea005073", "title": "An Enhanced Hydrometeor Detection Algorithm for Precipitation Identification in GPM", "summary": "Abstract Precipitation is a fundamental component of the climate system, linking the water and energy cycles and regulating climate variability, feedbacks, and extremes. Accurate precipitation detection provides essential constraints on the global water cycles and serves as a key benchmark for evaluating climate model performance. The Global Precipitation Measurement (GPM) mission, equipped with the first spaceborne dual‐frequency radar (DPR), offers unprecedented capability for observing the three‐dimensional structure of global precipitation, including phase, intensity and microphysical properties. However, existing precipitation detection algorithm does not explicitly account for weak radar signals, limiting their ability to capture the early development and full evolution of precipitation systems. In this study, we propose an enhanced hydrometeor detection algorithm for GPM DPR observations that combines a bilateral filter technique and a power‐probability weighting scheme. Through effectively suppressing background noise while preserving physically meaningful weak signals, our method can significantly improve the detection of small hydrometeors at high altitudes and along precipitation boundaries—regions that are frequently missed by the current GPM operational algorithm. Validation using collocated CloudSat observations demonstrates substantial improvements of our method, with increases of 63.6% the Ka band and a 37.5% in the Ku band. These advancements provide a more comprehensive depiction of precipitation systems structure and offer improved observational support f", "link": "https://doi.org/10.1029/2026ea005073", "authors": "Yucheng Qiu, Jinming Ge, Xiaojie Li, Jianping Huang, Xiuqing Hu, BoChun Liu", "source": "Earth and Space Science", "published": "2026-11", "first_seen": "2026-11-23T21:25:47+00:00", "score": 34, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-024-00575-8", "title": "Europe faces up to tenfold increase in extreme fires in a warming climate", "summary": "Abstract This study quantifies how changes in temperature and precipitation would influence the intensity and duration of extreme fires across Europe. The analysis explores the impact of a range of climate change projections on fire events compared to a baseline of fire danger, using a 30-year ERA5 reanalysis. The results show that areas in southern Europe could experience a tenfold increase in the probability of catastrophic fires occurring in any given year under a moderate CMIP6 scenario. If global temperatures reach the +2 °C threshold, central and northern Europe will also become more susceptible to wildfires during droughts. The increased probability of fire extremes in a warming climate, in combination with an average one-week extension of the fire season across most countries, would put extra strain on Europe’s ability to cope in the forthcoming decades.", "link": "https://doi.org/10.1038/s41612-024-00575-8", "authors": "Siham El Garroussi, Francesca Di Giuseppe, Christopher Barnard, Fredrik Wetterhall", "source": "npj Climate and Atmospheric Science", "published": "2024-1-29", "first_seen": "2026-11-23T21:25:47+00:00", "score": 34, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-019-0071-y", "title": "Robust skill of decadal climate predictions", "summary": "Abstract There is a growing need for skilful predictions of climate up to a decade ahead. Decadal climate predictions show high skill for surface temperature, but confidence in forecasts of precipitation and atmospheric circulation is much lower. Recent advances in seasonal and annual prediction show that the signal-to-noise ratio can be too small in climate models, requiring a very large ensemble to extract the predictable signal. Here, we reassess decadal prediction skill using a much larger ensemble than previously available, and reveal significant skill for precipitation over land and atmospheric circulation, in addition to surface temperature. We further propose a more powerful approach than used previously to evaluate the benefit of initialisation with observations, improving our understanding of the sources of skill. Our results show that decadal climate is more predictable than previously thought and will aid society to prepare for, and adapt to, ongoing climate variability and change.", "link": "https://doi.org/10.1038/s41612-019-0071-y", "authors": "D. M. Smith, R. Eade, A. A. Scaife, L.-P. Caron, G. Danabasoglu, T. M. DelSole", "source": "npj Climate and Atmospheric Science", "published": "2019-5-17", "first_seen": "2026-11-23T21:25:47+00:00", "score": 34, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-021-00223-5", "title": "Human-caused long-term changes in global aridity", "summary": "Abstract Widespread aridification of the land surface causes substantial environmental challenges and is generally well documented. However, the mechanisms underlying increased aridity remain relatively underexplored. Here, we investigated the anthropogenic and natural factors affecting long-term global aridity changes using multisource observation-based aridity index, factorial simulations from the Coupled Model Intercomparison Project phase 6 (CMIP6), and rigorous detection and attribution (D&A) methods. Our study found that anthropogenic forcings, mainly rising greenhouse gas emissions (GHGE) and aerosols, caused the increased aridification of the globe and each hemisphere with high statistical confidence for 1965–2014; the GHGE contributed to drying trends, whereas the aerosol emissions led to wetting tendencies; moreover, the bias-corrected CMIP6 future aridity index based on the scaling factors from optimal D&A demonstrated greater aridification than the original simulations. These findings highlight the dominant role of human effects on increasing aridification at broad spatial scales, implying future reductions in aridity will rely primarily on the GHGE mitigation.", "link": "https://doi.org/10.1038/s41612-021-00223-5", "authors": "Rongfan Chai, Jiafu Mao, Haishan Chen, Yaoping Wang, Xiaoying Shi, Mingzhou Jin", "source": "npj Climate and Atmospheric Science", "published": "2021-12-21", "first_seen": "2026-11-23T21:25:47+00:00", "score": 34, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2607.09614", "title": "Inunda: A GPU-Native, Agent-enabled, Differentiable Solver for High-Resolution Flood Inundation Modeling", "summary": "Predicting where floodwater goes and how deep it gets, at high resolution and across large domains, remains computationally expensive with conventional hydraulic solvers, while purely data-driven surrogates are fast but lack physical guarantees and generalize poorly beyond their training events. We present Inunda, a GPU-native flood inundation model that solves the two-dimensional shallow water equations. Inunda uses a mass-conservative local-inertial scheme and runs multi-day events over millions of cells in minutes on a single GPU. Because every operator is autograd-compatible, the solver is differentiable by construction: model parameters can be estimated by gradient descent against gage observations through reverse-mode automatic differentiation of the full simulation. We demonstrate Inunda on three case studies. For a hindcast of Hurricane Harvey (2017) in Harris County, Texas, Inunda matches surveyed high-water marks to a mean absolute error of 0.67 m, competitive with or better than a suite of established flood models, and reaches a median gage water-level Nash Sutcliffe efficiency of +0.72, more than double the +0.31 of the operational National Water Model v3.0. For the July 2025 Central Texas flash flood, Inunda is driven by an 18-member 1-km convection-allowing precipitation ensemble to produce probabilistic flood forecasts whose skill improves systematically as lead time to the crest shortens. For a post-fire flash-flood application in the Rio Ruidoso burn scar, differentiable calibration recovers the saturated hydraulic conductivity as a spatially explicit field", "link": "https://arxiv.org/abs/2607.09614", "authors": "Zhi Li", "source": "arXiv", "published": "2026-07-10T17:13:19Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 33, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2604.23127", "title": "A Dynamic Learning Observatory Reveals the Rapid Salinization of Satkhira, Bangladesh", "summary": "Soil salinity is a major environmental challenge in coastal Bangladesh, threatening agricultural productivity and local livelihoods. This study develops a machine-learning-based framework to predict and map soil salinity in Satkhira district by integrating field observations with Landsat-derived spectral indices. A total of 205 soil samples collected during 2024-2025 were used to train an Extreme Gradient Boosting (XGBoost) model, and predictions were further improved using a Generalized Additive Model (GAM). Spatial cross-validation was applied to reduce autocorrelation bias, and bootstrap resampling was used to quantify prediction uncertainty. The results show strong spatial variability of soil salinity, with higher concentrations in the southern and central coastal regions and lower levels in the northern inland areas. Vegetation indices, particularly NDVI, along with salinity-related spectral indicators, were identified as key predictors. 10-year-window peak-exposure maps generated for 2014-2023 reveal recurrent high-salinity zones and a persistent, expanding footprint of moderate-to-high salinity exposure across the central parts of the district. Uncertainty analysis indicates higher variability in coastal zones and improved prediction stability when multi-year datasets are combined. The proposed framework provides a robust and scalable approach for long-term monitoring of soil salinity. It supports climate-resilient agriculture, land-use planning, and evidence-based decision-making in coastal Bangladesh.", "link": "https://arxiv.org/abs/2604.23127", "authors": "Showmitra Kumar Sarkar, Sai Ravela", "source": "arXiv", "published": "2026-04-25T03:49:04Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 33, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2019ms001725", "title": "Impact of a Multi‐Layer Snow Scheme on Near‐Surface Weather Forecasts", "summary": "Abstract Snow cover properties have a large impact on the partitioning of surface energy fluxes and thereby on near‐surface weather parameters. Snow schemes of intermediate complexity have been widely used for hydrological and climate studies, whereas their impact on typical weather forecast time scales has received less attention. A new multilayer snow scheme is implemented in the European Centre for Medium‐range Weather Forecasts Integrated Forecasting System and its impact on snow and 2‐m temperature forecasts is evaluated. The new snow scheme is evaluated offline at well‐instrumented field sites and compared to the current single‐layer scheme. The new scheme largely improves the representation of snow depth for most of the sites considered, reducing the root‐mean‐square error averaged over all sites by more than 30%. The improvements are due to a better description of snow density in thick and cold snowpacks, but also due to an improved representation of sporadic melting episodes because of the inclusion of a thin top snow layer with a low thermal inertia. The evaluation of coupled 10‐day weather forecasts shows an improved representation of snow depth at all lead times, demonstrating a positive impact at the global scale. Regarding the impact on weather parameters, the multilayer snow scheme improves the simulated minimum 2‐m temperature, by decreasing the positive bias and improving the amplitude of the diurnal cycle over snow‐covered regions. However, the increased variability of the 2‐m temperature can have a detrimental impact in regions characterized by preexistin", "link": "https://doi.org/10.1029/2019ms001725", "authors": "Gabriele Arduini, Gianpaolo Balsamo, Emanuel Dutra, Jonathan J. Day, Irina Sandu, Souhail Boussetta", "source": "Journal of Advances in Modeling Earth Systems", "published": "2019-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 33, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2018ms001583", "title": "The Community Land Model Version 5: Description of New Features, Benchmarking, and Impact of Forcing Uncertainty", "summary": "Abstract The Community Land Model (CLM) is the land component of the Community Earth System Model (CESM) and is used in several global and regional modeling systems. In this paper, we introduce model developments included in CLM version 5 (CLM5), which is the default land component for CESM2. We assess an ensemble of simulations, including prescribed and prognostic vegetation state, multiple forcing data sets, and CLM4, CLM4.5, and CLM5, against a range of metrics including from the International Land Model Benchmarking (ILAMBv2) package. CLM5 includes new and updated processes and parameterizations: (1) dynamic land units, (2) updated parameterizations and structure for hydrology and snow (spatially explicit soil depth, dry surface layer, revised groundwater scheme, revised canopy interception and canopy snow processes, updated fresh snow density, simple firn model, and Model for Scale Adaptive River Transport), (3) plant hydraulics and hydraulic redistribution, (4) revised nitrogen cycling (flexible leaf stoichiometry, leaf N optimization for photosynthesis, and carbon costs for plant nitrogen uptake), (5) global crop model with six crop types and time‐evolving irrigated areas and fertilization rates, (6) updated urban building energy, (7) carbon isotopes, and (8) updated stomatal physiology. New optional features include demographically structured dynamic vegetation model (Functionally Assembled Terrestrial Ecosystem Simulator), ozone damage to plants, and fire trace gas emissions coupling to the atmosphere. Conclusive establishment of improvement or degradation of indiv", "link": "https://doi.org/10.1029/2018ms001583", "authors": "David M. Lawrence, Rosie A. Fisher, Charles D. Koven, Keith W. Oleson, Sean C. Swenson, Gordon Bonan", "source": "Journal of Advances in Modeling Earth Systems", "published": "2019-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 33, "topics": ["Climate Modelling"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022ms003156", "title": "The DOE E3SM Model Version 2: Overview of the Physical Model and Initial Model Evaluation", "summary": "Abstract This work documents version two of the Department of Energy's Energy Exascale Earth System Model (E3SM). E3SMv2 is a significant evolution from its predecessor E3SMv1, resulting in a model that is nearly twice as fast and with a simulated climate that is improved in many metrics. We describe the physical climate model in its lower horizontal resolution configuration consisting of 110 km atmosphere, 165 km land, 0.5° river routing model, and an ocean and sea ice with mesh spacing varying between 60 km in the mid‐latitudes and 30 km at the equator and poles. The model performance is evaluated with Coupled Model Intercomparison Project Phase 6 Diagnosis, Evaluation, and Characterization of Klima simulations augmented with historical simulations as well as simulations to evaluate impacts of different forcing agents. The simulated climate has many realistic features of the climate system, with notable improvements in clouds and precipitation compared to E3SMv1. E3SMv1 suffered from an excessively high equilibrium climate sensitivity (ECS) of 5.3 K. In E3SMv2, ECS is reduced to 4.0 K which is now within the plausible range based on a recent World Climate Research Program assessment. However, a number of important biases remain including a weak Atlantic Meridional Overturning Circulation, deficiencies in the characteristics and spectral distribution of tropical atmospheric variability, and a significant underestimation of the observed warming in the second half of the historical period. An analysis of single‐forcing simulations indicates that correcting the historical tem", "link": "https://doi.org/10.1029/2022ms003156", "authors": "Jean‐Christophe Golaz, Luke P. Van Roekel, Xue Zheng, Andrew F. Roberts, Jonathan D. Wolfe, Wuyin Lin", "source": "Journal of Advances in Modeling Earth Systems", "published": "2022-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 33, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2025ms005288", "title": "Evaluation of E3SM Simulated Aerosols and Aerosol‐Cloud Interactions Across GCM and Convection‐Permitting Scales", "summary": "Abstract This paper introduces an Earth system modeling testbed for predicting aerosols and aerosol‐cloud interactions (ACIs) at convection‐permitting scales. Using the Energy Exascale Earth System Model (E3SM) version 2 with a four‐mode Modal Aerosol Module, we conduct simulations at 3.25 km resolution on a regionally refined mesh (RRM) across four regions with distinct aerosol and cloud regimes. Results are compared with the standard 100 km E3SM configuration and evaluated against satellite, aircraft, and ground‐based observations. We find that increasing model resolution improves heavy precipitation simulation but amplifies positive bias in light drizzle at coarse resolution. These resolution‐induced changes affect cloud and aerosol properties to varying degrees across regions. Generally, cloud cover and liquid water path (LWP) show better agreement with satellite retrievals at 3.25 km, though surface‐based comparisons suggest otherwise. Aerosol composition remains poorly represented at both resolutions. The RRM increases Aitken mode aerosol number concentrations via enhanced new particle formation. However, accumulation mode aerosols are decreased at higher resolution as aerosol removals become more efficient. This partially contributes to fewer cloud condensation nuclei (CCN) and lower cloud droplet number concentrations (), which produces larger model biases in some scenarios. These findings suggest that solely increasing horizontal resolution to kilometer scales is insufficient to broadly improve aerosol and cloud predictions without concurrent advancements in physic", "link": "https://doi.org/10.1029/2025ms005288", "authors": "Meng Huang, Po‐Lun Ma, Adam C. Varble, Jerome D. Fast, Taufiq Hassan, Jianfeng Li", "source": "Journal of Advances in Modeling Earth Systems", "published": "2025-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 33, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2020ef001762", "title": "Significant Land Contributions to Interannual Predictability of East Asian Summer Monsoon Rainfall", "summary": "Abstract Marked by large interannual variability, East Asian summer monsoon (EASM) rainfall has profound socio‐economic impacts through its dominant influence on floods and droughts. Improving predictions of the interannual variations of EASM rainfall has important implications for over 20% of the world's population. While coupled modeling systems have demonstrated some prediction skill related to the El Niño Southern Oscillation with remote influence on EASM rainfall, the impact of soil moisture has heretofore not been systematically investigated. Using a weakly coupled data assimilation (WCDA) system to constrain the soil moisture and soil temperature in a coupled climate model with a global land data assimilation product, this study demonstrates significant improvements in simulating the interannual variations of EASM rainfall, capturing the notable shift to a “wetter‐South‐drier‐North” rainfall pattern in China in the early 1990s. Hindcast simulations initialized with the well‐balanced states from a coupled simulation with WCDA also show significant multi‐year rainfall prediction skill over East China and Tibetan Plateau. Improvements in predicting the EASM rainfall are attributed to the strong land‐atmosphere coupling in large areas over China, which allows improved predictions of soil moisture to influence precipitation through soil moisture‐precipitation feedback, and the effects of land anomalies on the EASM circulation. This study highlights the significant contribution of land to the interannual predictability of EASM rainfall, with a great potential to advance sk", "link": "https://doi.org/10.1029/2020ef001762", "authors": "Pengfei Shi, Hui Lu, L. Ruby Leung, Yujun He, Bin Wang, Kun Yang", "source": "Earth's Future", "published": "2021-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 33, "topics": ["Climate Modelling"], "watch": [], "boosts": ["monsoon", "precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-21-0130.1", "title": "The High-Resolution Rapid Refresh (HRRR): An Hourly Updating Convection-Allowing Forecast Model. Part II: Forecast Performance", "summary": "Abstract The High-Resolution Rapid Refresh (HRRR) is a convection-allowing implementation of the Advanced Research version of the Weather Research and Forecast (WRF-ARW) Model that covers the conterminous United States and Alaska and runs hourly (for CONUS; every 3 h for Alaska) in real time at the National Centers for Environmental Prediction. The high-resolution forecasts support a variety of user applications including aviation, renewable energy, and prediction of many forms of severe weather. In this second of two articles, forecast performance is documented for a wide variety of forecast variables and across HRRR versions. HRRR performance varies across geographical domain, season, and time of day depending on both prevalence of particular meteorological phenomena and the availability of both conventional and nonconventional observations. Station-based verification of surface weather forecasts (2-m temperature and dewpoint temperature, 10-m winds, visibility, and cloud ceiling) highlights the ability of the HRRR to represent daily planetary boundary layer evolution and the development of convective and stratiform cloud systems, while gridded verification of simulated composite radar reflectivity and quantitative precipitation forecasts reveals HRRR predictive skill for summer and winter precipitation systems. Significant improvements in performance for specific forecast problems are documented for the upgrade versions of the HRRR (HRRRv2, v3, and v4) implemented in 2016, 2018, and 2020, respectively. Development of the HRRR model data assimilation and physics paves the", "link": "https://doi.org/10.1175/waf-d-21-0130.1", "authors": "Eric P. James, Curtis R. Alexander, David C. Dowell, Stephen S. Weygandt, Stanley G. Benjamin, Geoffrey S. Manikin", "source": "Weather and Forecasting", "published": "2022-8", "first_seen": "2026-11-23T21:25:47+00:00", "score": 33, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/2009waf2222252.1", "title": "Toward Better Understanding of the Contiguous Rain Area (CRA) Method for Spatial Forecast Verification", "summary": "Abstract The contiguous rain area (CRA) method for spatial forecast verification is a features-based approach that evaluates the properties of forecast rain systems, namely, their location, size, intensity, and finescale pattern. It is one of many recently developed spatial verification approaches that are being evaluated as part of a Spatial Forecast Verification Methods Intercomparison Project. To better understand the strengths and weaknesses of the CRA method, it has been tested here on a set of idealized geometric and perturbed forecasts with known errors, as well as nine precipitation forecasts from three high-resolution numerical weather prediction models. The CRA method was able to identify the known errors for the geometric forecasts, but only after a modification was introduced to allow nonoverlapping forecast and observed features to be matched. For the perturbed cases in which a radar rain field was spatially translated and amplified to simulate forecast errors, the CRA method also reproduced the known errors except when a high-intensity threshold was used to define the CRA (≥10 mm h−1) and a large translation error was imposed (&gt;200 km). The decomposition of total error into displacement, volume, and pattern components reflected the source of the error almost all of the time when a mean squared error formulation was used, but not necessarily when a correlation-based formulation was used. When applied to real forecasts, the CRA method gave similar results when either best-fit criteria, minimization of the mean squared error, or maximization of the correlation", "link": "https://doi.org/10.1175/2009waf2222252.1", "authors": "Elizabeth E. Ebert, William A. Gallus", "source": "Weather and Forecasting", "published": "2009-10-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 33, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-25-0049.1", "title": "Winter Temperature Prediction in Northeast China: The XGBoost-Based Cold/Warm Year Ensemble Model", "summary": "Abstract Winter temperature in Northeast China significantly affects agriculture, energy use, and daily life, making accurate predictions is vital for social and economic planning. Prediction skills of the dynamical model for winter temperature prediction are different between warm and cold years, which has not been fully considered in previous multimodel ensemble predictions. Extreme gradient boosting (XGBoost), one of the popular deep learning methods, can use the gradient boosting to effectively handle large datasets and make it adept at capturing nonlinear temperature dynamics. This study utilizes three dynamical model predictions, along with on-site observation, and develops an XGBoost-Based Cold/Warm Year Ensemble Model (XEM). Validation results indicate that the XEM model shows different performances in winter temperature prediction among dynamical models. XEM can effectively improve accuracy and predictive skill of the winter temperature prediction comparing with the original model in Northeast China, with the average increase of anomaly correlation coefficient (ACC) by 0.49 and anomaly consistency score (PCS) by 21.1%. The XEM demonstrated remarkable enhancements in the independent sample validation in 2021 and 2022. The ACC achieved its maximum improvement of 0.85, while the PCS saw its highest enhancement at 45.9%, indicating a substantial leap in predictive performance. Additionally, the Shapley additive explanation (SHAP) value and gain analysis reveals that XEM can properly prioritize meteorological factors like 200-hPa geopotential height anomalies (H200) and", "link": "https://doi.org/10.1175/waf-d-25-0049.1", "authors": "Chenwei Yao, Xiaojuan Wang, Yinzhong Wu, Fan Yue, Guolin Feng", "source": "Weather and Forecasting", "published": "2025-11", "first_seen": "2026-11-23T21:25:47+00:00", "score": 33, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-024-00579-4", "title": "Global increase in future compound heat stress-heavy precipitation hazards and associated socio-ecosystem risks", "summary": "Abstract Compound extremes of lethal heat stress-heavy precipitation events (CHPEs) seriously threaten social and ecological sustainability, while their evolution and effects at the global scale under climate warming remain unclear. Here we develop the global picture of projected changes in CHPEs under various scenarios and investigate their socioeconomic and ecosystem risks combining hazard, exposure, and vulnerability through the composite indicator approach. We find a high percentage of heat stress is followed by heavy precipitation, probably driven by atmospheric conditions. Global average frequency and intensity of CHPEs are projected to increase in the future under high-emission scenarios. Joint return periods of CHPEs are projected to decrease globally, predominantly driven by changes in heat stress extremes. In the long-term future, over half of the population, gross domestic product, and gross primary productivity may face high risk in most regions, with developed regions facing the highest risks under SSP5-8.5 and developing regions facing the highest risks under SSP3-7.0.", "link": "https://doi.org/10.1038/s41612-024-00579-4", "authors": "Zhiling Zhou, Liping Zhang, Qin Zhang, Chen Hu, Gangsheng Wang, Dunxian She", "source": "npj Climate and Atmospheric Science", "published": "2024-1-31", "first_seen": "2026-11-23T21:25:47+00:00", "score": 32, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr3199.1", "title": "A New Vertical Diffusion Package with an Explicit Treatment of Entrainment Processes", "summary": "Abstract This paper proposes a revised vertical diffusion package with a nonlocal turbulent mixing coefficient in the planetary boundary layer (PBL). Based on the study of Noh et al. and accumulated results of the behavior of the Hong and Pan algorithm, a revised vertical diffusion algorithm that is suitable for weather forecasting and climate prediction models is developed. The major ingredient of the revision is the inclusion of an explicit treatment of entrainment processes at the top of the PBL. The new diffusion package is called the Yonsei University PBL (YSU PBL). In a one-dimensional offline test framework, the revised scheme is found to improve several features compared with the Hong and Pan implementation. The YSU PBL increases boundary layer mixing in the thermally induced free convection regime and decreases it in the mechanically induced forced convection regime, which alleviates the well-known problems in the Medium-Range Forecast (MRF) PBL. Excessive mixing in the mixed layer in the presence of strong winds is resolved. Overly rapid growth of the PBL in the case of the Hong and Pan is also rectified. The scheme has been successfully implemented in the Weather Research and Forecast model producing a more realistic structure of the PBL and its development. In a case study of a frontal tornado outbreak, it is found that some systematic biases of the large-scale features such as an afternoon cold bias at 850 hPa in the MRF PBL are resolved. Consequently, the new scheme does a better job in reproducing the convective inhibition. Because the convective inhibition i", "link": "https://doi.org/10.1175/mwr3199.1", "authors": "Song-You Hong, Yign Noh, Jimy Dudhia", "source": "Monthly Weather Review", "published": "2006-9-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 32, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-19-0158.1", "title": "Use of the Autoregressive Integrated Moving Average (ARIMA) Model to Forecast Near-Term Regional Temperature and Precipitation", "summary": "Abstract A data-driven approach for obtaining near-term (2–20 years) regional temperature and precipitation projections utilizing local historical observations was established in this study to facilitate civil and environmental engineering applications. Given the unique characteristics of temporal correlation and skewness exhibited in individual time series of temperature and precipitation variables, a statistical time series forecasting technique was developed based on the autoregressive integrated moving average (ARIMA) model. Annual projections obtained from the ARIMA model—depending on individual series—can be interpreted as an integration of the most recent observations and the long-term historical trend. In addition to annual temperature and precipitation forecasts, methods of estimating confidence intervals for different return periods and simulating future daily temperature and precipitation were developed to extend the applicability for use in engineering. Quantitative comparisons of annual temperature and precipitation forecasts developed from the ARIMA model and other common statistical techniques such as a linear trend method were performed. Results suggested that while the ARIMA model cannot outperform all other techniques for all evaluated climate indices, the ARIMA model in general provides more accurate projections—especially interval forecasts—and is more reliable than other common statistical techniques. With the use of the ARIMA-based statistical forecasting model, interpretable and reliable near-term, location-specific temperature and precipitation forec", "link": "https://doi.org/10.1175/waf-d-19-0158.1", "authors": "Yuchuan Lai, David A. Dzombak", "source": "Weather and Forecasting", "published": "2020-4-27", "first_seen": "2026-11-23T21:25:47+00:00", "score": 32, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.4270", "title": "Can a climate model successfully diagnose clear‐air turbulence and its response to climate change?", "summary": "Abstract : Atmospheric turbulence causes the majority of weather‐related aircraft accidents. Climate models project large increases in clear‐air turbulence as the jet streams become more sheared in response to climate change. However, climate models have coarser resolutions than the numerical weather prediction models that are used to forecast clear‐air turbulence operationally, raising questions about their suitability for this purpose. Here we provide the first rigorous demonstration that climate models are capable of successfully diagnosing clear‐air turbulence and its response to climate change. We use an ensemble of seven clear‐air turbulence diagnostics to compare 38 years of historic turbulence diagnosed from climate model simulations and high‐resolution reanalysis data. We find that the differences in turbulence between the climate model and reanalysis data are much smaller than the spread between the diagnostics. When using a climate model to calculate the probabilities (and their temporal trends) of encountering clear‐air turbulence of any strength, at any flight cruising level, and in any season, we find that most of the uncertainty stems from the turbulence diagnostics rather than the climate model. These results confirm the suitability of climate models for the task of producing future clear‐air turbulence projections. The turbulence increases are generally larger when diagnosed from the reanalysis data than the climate model, suggesting that previous quantifications from climate models of the response of clear‐air turbulence to climate change may be underestim", "link": "https://doi.org/10.1002/qj.4270", "authors": "Paul D. Williams, Luke N. Storer", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2022-4", "first_seen": "2026-11-23T21:25:47+00:00", "score": 32, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.3313", "title": "The Global Precipitation Measurement (GPM) mission's scientific achievements and societal contributions: reviewing four years of advanced rain and snow observations", "summary": "Precipitation represents a life‐critical energy and hydrologic exchange between the Earth's atmosphere and its surface. As such, knowledge of where, when and how much rain and snow falls is essential for scientific research and societal applications. Building on the 17‐year success of the Tropical Rainfall Measurement Mission (TRMM), the Global Precipitation Measurement (GPM) Core Observatory (GPM‐CO) is the first US National Aeronautical and Space Administration (NASA) satellite mission specifically designed with sensors to observe the structure and intensities of both rain and falling snow. The GPM‐CO has proved to be a worthy successor to TRMM, extending and improving high‐quality active and passive microwave observations across all times of day. The GPM‐CO launched in early 2014, is a joint mission between NASA and the Japanese Aerospace Exploration Agency (JAXA), with sensors that include the NASA‐provided GPM Microwave Imager and the JAXA‐provided Dual‐frequency Precipitation Radar. These sensors were devised with high accuracy standards enabling them to be used as a reference for inter‐calibrating a constellation of partner satellite data. These inter‐calibrated partner satellite retrievals are used with infrared data to produce merged precipitation estimates at temporal scales of 30 min and spatial scales of 0.1° × 0.1°. Precipitation estimates from the GPM‐CO and partner constellation satellites, provided in near real time and later reprocessed with all ancillary data, are an indispensable source of precipitation data for operational and scientific users. Advances ", "link": "https://doi.org/10.1002/qj.3313", "authors": "Gail Skofronick‐Jackson, Dalia Kirschbaum, Walter Petersen, George Huffman, Chris Kidd, Erich Stocker", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2018-11", "first_seen": "2026-11-23T21:25:47+00:00", "score": 32, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/2017ms001115", "title": "The Met Office Global Coupled Model 3.0 and 3.1 (GC3.0 and GC3.1) Configurations", "summary": "Abstract The Global Coupled 3 (GC3) configuration of the Met Office Unified Model is presented. Among other applications, GC3 is the basis of the United Kingdom's submission to the Coupled Model Intercomparison Project 6 (CMIP6). This paper documents the model components that make up the configuration (although the scientific descriptions of these comp
