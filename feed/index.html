elected HRRR forecast variables. By evaluating these approaches under a unified setup, we provide a clearer understanding of how each data source contributes to predictive skill over the contiguous United States (CONUS). Forecasts are produced at 1-km spatial resolution, beginning with direct 1-h predictions and extending to 12 h using autoregressive rollouts. Performance is evaluated using both CONUS-wide and region-specific metrics that assess overall performance and skill at high-intensity rainfall thresholds. Across all lead times, our DL framework consistently outperforms the HRRR baseline in pixelwise and spatiostatistical metrics. The hybrid model performs best at the shortest lead time, while the HRRR-corrective model outperforms others at longer lead times, maintaining high skill through 12 h. To assess reliability, we incorporate physically informed uncertainty quantification tailored to the residual learning setup. Thes", "link": "https://doi.org/10.1175/aies-d-26-0067.1", "authors": "Marina Vicens-Miquel, Amy McGovern, Aaron J. Hill, Efi Foufoula-Georgiou, Clement Guilloteau, Samuel S. P. Shen", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 84, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ms004021", "title": "Advancing Parsimonious Deep Learning Weather Prediction Using the HEALPix Mesh", "summary": "We present a parsimonious deep learning weather prediction model to forecast seven atmospheric variables with 3‐hr time resolution for up to 1‐year lead times on a 110‐km global mesh using the Hierarchical Equal Area isoLatitude Pixelization (HEALPix). In comparison to state‐of‐the‐art (SOTA) machine learning (ML) weather forecast models, such as Pangu‐Weather and GraphCast, our DLWP‐HPX model uses coarser resolution and far fewer prognostic variables. Yet, at 1‐week lead times, its skill is only about 1 day behind both SOTA ML forecast models and the SOTA numerical weather prediction model from the European Center for Medium‐Range Weather Forecasts. We report several improvements in model design, including switching from the cubed sphere to the HEALPix mesh, inverting the channel depth of the U‐Net, and introducing gated recurrent units (GRU) on each level of the U‐Net hierarchy. The consistent east‐west orientation of all cells on the HEALPix mesh facilitates the development of location‐invariant convolution kernels that successfully propagate weather patterns across the globe without requiring separate kernels for the polar and equatorial faces of the cube sphere. Without any loss of spectral power after the first 2 days, the model can be unrolled autoregressively for hundreds of steps into the future to generate realistic states of the atmosphere that respect seasonal trends, as showcased in 1‐year simulations.", "link": "https://doi.org/10.1029/2023ms004021", "authors": "Matthias Karlbauer, Nathaniel Cresswell‐Clay, Dale R. Durran, Raul A. Moreno, Thorsten Kurth, Boris Bonev, Noah Brenowitz, Martin V. Butz", "source": "Journal of Advances in Modeling Earth Systems", "published": "2024-8", "first_seen": "2026-11-26T13:59:01+00:00", "score": 84, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024ms004505", "title": "Generative Data Assimilation of Sparse Weather Station Observations at Kilometer Scales", "summary": "Data assimilation of observations into full atmospheric states is essential for weather forecast model initialization. Recently, methods for deep generative data assimilation have been proposed which allow for using new input data without retraining the model. They could also dramatically accelerate the costly data assimilation process used in operational regional weather models. Here, in a central US testbed, we demonstrate the viability of Score‐based Data Assimilation (SDA) in the context of realistically complex km‐scale weather. We train an unconditional diffusion model to generate snapshots of a state‐of‐the‐art km‐scale analysis product, the High Resolution Rapid Refresh. Then, using SDA to incorporate sparse weather station data, the model produces maps of precipitation and surface winds. The generated fields display physically plausible structures, such as gust fronts, and sensitivity tests confirm learned physics through multivariate relationships. Preliminary skill analysis shows the approach already outperforms a naive baseline of the High‐Resolution Rapid Refresh system itself. By incorporating observations from 40 weather stations, 10% lower RMSEs on left‐out stations are attained. Despite some lingering imperfections such as insufficiently disperse ensemble DA estimates, we find the results overall an encouraging proof of concept, and the first at km‐scale. It is a ripe time to explore extensions that combine increasingly ambitious regional state generators with an increasing set of in situ, ground‐based, and satellite remote sensing data streams.", "link": "https://doi.org/10.1029/2024ms004505", "authors": "Peter Manshausen, Yair Cohen, Peter Harrington, Jaideep Pathak, Mike Pritchard, Piyush Garg, Morteza Mardani, Karthik Kashinath", "source": "Journal of Advances in Modeling Earth Systems", "published": "2025-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 84, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "diffusion model"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2026gl123664", "title": "Enhanced Retrieval of Raindrop Size Distribution by Integrating Disdrometer Observations and Atmospheric Variables With Machine Learning", "summary": "Accurate representation of raindrop size distribution (DSD) is crucial for understanding precipitation microphysics and improving quantitative precipitation forecasting. Conventional methods in numerical models often prescribe the DSD shape parameter as a constant or derive it from empirical relationships based solely on disdrometer observations, limiting their ability to capture DSD variability driven by dynamic, thermodynamic, and microphysical processes. This study develops a machine learning (ML) framework integrating disdrometer observations with environmental atmospheric variables to retrieve DSD parameters. Trained on data from 11 stations in Shanghai during 2019–2021, three ML models outperform conventional methods, effectively reducing biases and capturing observed DSD variability. They remain robust in independent heavy‐rainfall and tropical cyclone validations during 2022–2025, providing reliable DSD and rain rate estimates. Feature analysis and ablation experiments further underscore the critical role of environmental factors in improving retrieval accuracy, offering a data‐driven pathway to improve DSD parameterizations in numerical models.", "link": "https://doi.org/10.1029/2026gl123664", "authors": "Limin Lin, Huiling Yuan, Xuwei Bao, Shangshang Yang, Lin Deng, Shuai Zhang, Yuanming Zhao", "source": "Geophysical Research Letters", "published": "2026-10-6", "first_seen": "2026-11-26T13:59:01+00:00", "score": 84, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.06539", "title": "Evaluating the prediction of subgrid eddy kinetic energy from a machine learning model", "summary": "Global climate model resolution is still too coarse to fully resolve mesoscale processes, therefore subgrid closures are required to approximate the feedback of eddies onto the resolved flow. With high-resolution datasets now readily available, there has been a rapid growth in the use of machine learning to develop new eddy closures that could help reduce model biases and uncertainty. In this work we employ an offline learning approach with a convolutional neural network to predict subgrid eddy kinetic energy ($KE_e$), laying the initial groundwork for a machine-learned scale-aware GEOMETRIC eddy closure for the UK's Earth System Model. We address the question of whether global parameterizations are needed or if regional closures are sufficient by evaluating a number of neural network models through region and feature ablation experiments. ML parameterization models generalize to unseen regions when their training data share similar feature and target distributions with those regions. Models that fail to generalize incur distributional shift, or employ different filtering scales for the true eddy kinetic energy field. When holding out features, there is improvement among the generalizable ML models, with some feature spaces leading to improvements in some regions but degrading performance in others. Generally, power spectral density of $KE_e$ tend to diverge at small scales, though some feature spaces are able to minimize this divergence. Overall, the best performing model trained on all regions achieves time-mean and anomaly R2 scores of R2$\\approx 0.95$ and R2$\\approx 0.8", "link": "https://arxiv.org/abs/2611.06539", "authors": "Thomas Wilder, Ranjini Swaminathan, David Storkey, Till Kuhlbrodt", "source": "arXiv", "published": "2026-11-04", "first_seen": "2026-11-26T13:59:01+00:00", "score": 82, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2609.23149", "title": "ClimTip-GML: A global bias-corrected and downscaled dataset for assessing impacts of climate tipping events", "summary": "Assessing the impacts of future climate scenarios including tipping events of major Earth system components such as the Amazon rainforest (ARF) or the Atlantic meridional overturning circulation (AMOC), requires accurate and high-resolution simulations. Here, we present ClimTip-GML, the first globally bias-corrected and downscaled climate dataset for impact assessment of large-scale tipping scenarios, comprising eight key variables at 0.25° spatial resolution from three general circulation models (GCMs): CESM1-CAM5, HadGEM3-GC31-MM, and MPI-ESM1-2-HR. The dataset includes 100-year-long climate simulations with preindustrial and historical conditions, as well as scenarios at a +2°C warming level with and without tipping transitions of the AMOC or ARF. We apply generative machine learning (GML) techniques trained on reanalysis data to bias-correct and downscale the GCMs in a manner that is physically consistent across space, time, and all eight variables. Comprehensive validation shows substantially reduced biases, improved small-scale spatial variability, multivariate correlations, and consistent long-term climate responses to the external forcing and tipping events. The results hence permit substantially improved impact assessments of tipping transitions of the ARF and AMOC, directly informing mitigation and adaptation policies.", "link": "https://arxiv.org/abs/2609.23149", "authors": "Philipp Hess, Sebastian Bathiany, Lucas Ferreira Correa, Laura C. Jackson, Casey R. Patrizio, Niklas Boers", "source": "arXiv", "published": "2026-09-19", "first_seen": "2026-11-26T13:59:01+00:00", "score": 82, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": ["Niklas Boers"], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "arxiv:2602.16515", "title": "Generative deep learning improves reconstruction of global historical climate records", "summary": "Instrumental observations from the early twentieth century are sparse and uncertain, limiting estimates of historical climate variability and change. Existing reconstructions rely largely on statistical interpolation, smoothing spatiotemporal variability and leading to underestimation of local extremes. Recent deterministic machine-learning approaches focus primarily on spatial inpainting of coarse-resolution temperature fields but do not explicitly quantify uncertainty or enforce spatiotemporal consistency. Here, we present GenCRest, a generative deep-learning model that reconstructs globally complete temperature and precipitation fields from sparse, uncertain observations using a generative prior learned from Earth-system models and reanalyses. GenCRest preserves accuracy, temporal persistence, and higher-order variability of climate dynamics, consistently outperforming statistical and machine-learning benchmarks. Applying GenCRest to observational records that underpin climate assessments, we find stronger early-twentieth-century ENSO variability and identify approximately 50% more El Niño events documented in the literature, which are not represented in established datasets. Our reconstructions reveal a more spatially heterogeneous history of temperature change during 1900--1980, with pronounced regional warming and cooling contrasts, particularly in the Arctic. For 1981--2024, our results suggest that recent assessments overestimate Arctic-mean warming due to interpolation smoothing, while underestimating warming in the Greenland, Barents, and Kara Seas. Furthermore, b", "link": "https://arxiv.org/abs/2602.16515", "authors": "Zhen Qian, Teng Liu, Duo Chan, Sebastian Bathiany, Shangshang Yang, Philipp Hess, Nils Bochow, Christian Burmester", "source": "arXiv", "published": "2026-02-18", "first_seen": "2026-11-26T13:59:01+00:00", "score": 82, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0001.1", "title": "Regional Data-Driven Weather Modeling with a Global Stretched Grid", "summary": "We present Bris, a data-driven weather model suitable for regional forecasting applications. The model extends the Artificial Intelligence Forecasting System by introducing a stretched-grid architecture that dedicates higher resolution over a regional area of interest and maintains a lower resolution elsewhere on the globe. The model is based on graph neural networks, which naturally affords arbitrary multiresolution grid configurations. The model is applied to short-range weather prediction for the Nordics, producing forecasts at 2.5-km spatial and 6-h temporal resolutions. Bris is pretrained on 43 years of global ERA5 data at 31-km resolution and is further refined using 3.3 years of 2.5-km resolution operational analyses from the Meteorological Cooperation (MetCoOp) Ensemble Prediction System (MEPS). The performance of the model is evaluated against surface observations from measurement stations across Norway and is compared to short-range weather forecasts from MEPS. In terms of root-mean-square error, Bris outperforms both the control run and the ensemble mean of MEPS for 2-m temperature. Bris also produces competitive precipitation and wind speed forecasts but is shown to underestimate extreme events.", "link": "https://doi.org/10.1175/aies-d-25-0001.1", "authors": "Thomas Nils Nipen, Håvard Homleid Haugen, Magnus Sikora Ingstad, Even Marius Nordhagen, Aram Farhad Shafiq Salihi, Paulina Tedesco, Ivar Ambjørn Seierstad, Jørn Kristiansen", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-4", "first_seen": "2026-11-26T13:59:01+00:00", "score": 82, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0117.1", "title": "An NWP-Free, Observation-Driven Deep Learning Approach to Heavy-Rainfall Nowcasting beyond the Three-Hour Limit", "summary": "Quasi-stationary convective bands over Kyushu, Japan, frequently trigger rainy-season disasters, and hours with ≥50 mm h −1 rainfall are increasing. However, skillful nowcasts beyond 3 h remain limited. This study presents the Fused Lattice of Observation-Based Weather Sensors Network (FlowsNet), an observation-based multisensor fusion model that learns directly from radar/rain gauge–analyzed precipitation, surface variables from ground stations, geostationary satellite imagery, and satellite-derived precipitation context. The model targets category-4 (C4; ≥50 mm h −1 ) rainfall and incorporates two attention mechanisms: a channelwise module that weights informative modalities and a spatial module that aligns features with banded structures at multihour leads. Training uses a tail-aware ordinal loss that couples focal reweighting with an Earth mover’s distance–based ordinal penalty to emphasize rare extremes. FlowsNet maintains a nonzero C4 critical success index through 6 h. From 4 to 6 h, it matches or exceeds the Japan Meteorological Agency’s very-short-range forecast, and it outperforms a leading extrapolation-based method and state-of-the-art deep learning nowcasting models. Case studies show preserved band geometry and corridor placement at long lead over complex terrain. Ablation experiments identify satellite water vapor context and near-surface humidity as key for long-lead C4 prediction; combining satellite context with surface observations stabilizes placement and reduces false alarms. By avoiding numerical weather prediction model state and objective analyses/re", "link": "https://doi.org/10.1175/aies-d-25-0117.1", "authors": "Ryu Shimabukuro, Tomohiko Tomita, Tsuyoshi Yamaura, Ken-ichi Fukui", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 82, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-24-0033.1", "title": "Validating Deep Learning Weather Forecast Models on Recent High-Impact Extreme Events", "summary": "The forecast accuracy of machine learning (ML) weather prediction models is improving rapidly, leading many to speak of a “second revolution in weather forecasting.” With numerous methods being developed and limited physical guarantees offered by ML models, there is a critical need for a comprehensive evaluation of these emerging techniques. While this need has been partly fulfilled by benchmark datasets, they provide little information on rare and impactful extreme events or on compound impact metrics, for which model accuracy might degrade due to misrepresented dependencies between variables. To address these issues, we compare ML weather prediction models (GraphCast, Pangu-Weather, and FourCastNet) and ECMWF’s high-resolution forecast system (HRES) in three case studies: the 2021 Pacific Northwest heatwave, the 2023 South Asian humid heatwave, and the North American winter storm in 2021. We find that ML weather prediction models locally achieve similar accuracy to HRES on the record-shattering Pacific Northwest heatwave but underperform when aggregated over space and time. However, they forecast the compound winter storm substantially better. We also highlight structural differences in how the errors of HRES and the ML models build up to that event. The ML forecasts lack important variables for a detailed assessment of the health risks of the 2023 humid heatwave. Using a possible substitute variable, prediction errors show spatial patterns with the highest danger levels over Bangladesh being underestimated by the ML models. Generally, case study–driven, impact-centric ev", "link": "https://doi.org/10.1175/aies-d-24-0033.1", "authors": "Olivier C. Pasche, Jonathan Wider, Zhongwei Zhang, Jakob Zscheischler, Sebastian Engelke", "source": "Artificial Intelligence for the Earth Systems", "published": "2025-1", "first_seen": "2026-11-26T13:59:01+00:00", "score": 82, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022ms003219", "title": "Correcting a 200 km Resolution Climate Model in Multiple Climates by Machine Learning From 25 km Resolution Simulations", "summary": "Bretherton et al. (2022, https://doi.org/10.1029/2021MS002794 ) demonstrated a successful approach for using machine learning (ML) to help a coarse‐resolution global atmosphere model with real geography (a ∼200 km version of NOAA's FV3GFS) evolve more like a fine‐resolution model, at the scales resolved by both. This study extends that work for application in multiple climates and multi‐year ML‐corrected simulations. Here four fine‐resolution (∼25 km) 2 year reference simulations are run using FV3GFS with climatological sea surface temperatures perturbed uniformly by −4, 0, +4, and +8 K. A data set of state‐dependent corrective tendencies is then derived through nudging the ∼200 km model to the coarsened state of the fine‐resolution simulations in each climate. Along with the surface radiative fluxes, the corrective tendencies of temperature and specific humidity are machine‐learned as functions of the column state. ML predictions for the fluxes and corrective tendencies are applied in 5.25 years ∼200 km resolution simulations in each climate, and improve the spatial pattern errors of land precipitation by 8%–28% and land surface temperature by 19%–25% across the four climates. The ML has a neutral impact on the pattern error of oceanic precipitation.", "link": "https://doi.org/10.1029/2022ms003219", "authors": "Spencer K. Clark, Noah D. Brenowitz, Brian Henn, Anna Kwa, Jeremy McGibbon, W. Andre Perkins, Oliver Watt‐Meyer, Christopher S. Bretherton", "source": "Journal of Advances in Modeling Earth Systems", "published": "2022-9", "first_seen": "2026-11-26T13:59:01+00:00", "score": 82, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2020ms002268", "title": "Machine Learning the Warm Rain Process", "summary": "Clouds are critical for weather and climate prediction. The multiple scales of cloud processes make simulation difficult. Often models and measurements are used to develop empirical relationships for large‐scale models to be computationally efficient. Machine learning provides another potential tool to improve our empirical parameterizations of clouds. To explore these opportunities, we replace the warm rain formation process in a General Circulation Model (GCM) with a detailed treatment from a bin microphysical model that causes a 400% slowdown in the GCM. We analyze the changes in climate that result from the use of the bin microphysical calculation and find improvements in the rain onset and frequency of light rain compared to high resolution process models and observations. We also find a resulting change in the cloud feedback response of the model to warming, which will significantly impact the climate sensitivity. We then replace the bin microphysical model with several neural networks designed to emulate the autoconversion and accretion rates produced by the bin microphysical model. The neural networks are organized into two stages: the first stage identifies where tendencies will be nonzero (and the sign of the tendency), and the second stage predicts the magnitude of the autoconversion and accretion rates. We describe the risks of overfitting, extrapolation, and linearization by using perfect model experiments with and without the emulator. We can recover the solutions with the emulators in almost all respects, and get simulations that perform as the detailed model", "link": "https://doi.org/10.1029/2020ms002268", "authors": "A. Gettelman, D. J. Gagne, C.‐C. Chen, M. W. Christensen, Z. J. Lebo, H. Morrison, G. Gantos", "source": "Journal of Advances in Modeling Earth Systems", "published": "2021-2", "first_seen": "2026-11-26T13:59:01+00:00", "score": 82, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-023-00397-0", "title": "Regional aerosol forecasts based on deep learning and numerical weather prediction", "summary": "Atmospheric chemistry transport models have been extensively applied in aerosol forecasts over recent decades, whereas they are facing challenges from uncertainties in emission rates, meteorological data, and over-simplified chemical parameterizations. Here, we developed a spatial-temporal deep learning framework, named PPN (Pollution-Predicting Net for PM 2.5 ), to accurately and efficiently predict regional PM 2.5 concentrations. It has an encoder-decoder architecture and combines the preceding PM 2.5 observations and numerical weather prediction. Besides, the model proposes a weighted loss function to promote the forecasting performance in extreme events. We applied the proposed model to forecast 3-day PM 2.5 concentrations over the Beijing-Tianjin-Hebei region in China on a three-hour-by-three-hour basis. Overall, the model showed good performance with R 2 and RMSE values of 0.7 and 17.7 μg m −3 , respectively. It could capture the high PM 2.5 concentration in the south and relatively low concentration in the north and exhibit better performance within the next 24 h. The use of the weighted loss function decreased the level of “high values underestimation, low values overestimation”, while incorporating the preceding PM 2.5 observations into the encoder phase improved the predictive accuracy within 24 h. We also compared the model result with that from a state-of-the-art numerical model (WRF-Chem with pollutant data assimilation). The temporal R 2 and RMSE from the WRF-Chem were 0.30−0.77 and 19−45 μg m −3 while those from the PPN model were 0.42−0.84 and 15−42 μg m −3 ", "link": "https://doi.org/10.1038/s41612-023-00397-0", "authors": "Yulu Qiu, Jin Feng, Ziyin Zhang, Xiujuan Zhao, Ziming Li, Zhiqiang Ma, Ruijin Liu, Jia Zhu", "source": "npj Climate and Atmospheric Science", "published": "2023-6-21", "first_seen": "2026-11-26T13:59:01+00:00", "score": 81, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2022.30", "title": "Long-term stability and generalization of observationally-constrained stochastic data-driven models for geophysical turbulence", "summary": "Recent years have seen a surge in interest in building deep learning-based fully data-driven models for weather prediction. Such deep learning models, if trained on observations can mitigate certain biases in current state-of-the-art weather models, some of which stem from inaccurate representation of subgrid-scale processes. However, these data-driven models, being over-parameterized, require a lot of training data which may not be available from reanalysis (observational data) products. Moreover, an accurate, noise-free, initial condition to start forecasting with a data-driven weather model is not available in realistic scenarios. Finally, deterministic data-driven forecasting models suffer from issues with long-term stability and unphysical climate drift, which makes these data-driven models unsuitable for computing climate statistics. Given these challenges, previous studies have tried to pre-train deep learning-based weather forecasting models on a large amount of imperfect long-term climate model simulations and then re-train them on available observational data. In this article, we propose a convolutional variational autoencoder (VAE)-based stochastic data-driven model that is pre-trained on an imperfect climate model simulation from a two-layer quasi-geostrophic flow and re-trained, using transfer learning, on a small number of noisy observations from a perfect simulation. This re-trained model then performs stochastic forecasting with a noisy initial condition sampled from the perfect simulation. We show that our ensemble-based stochastic data-driven model outperf", "link": "https://doi.org/10.1017/eds.2022.30", "authors": "Ashesh Chattopadhyay, Jaideep Pathak, Ebrahim Nabizadeh, Wahid Bhimji, Pedram Hassanzadeh", "source": "Environmental Data Science", "published": "2023", "first_seen": "2026-11-26T13:59:01+00:00", "score": 81, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-17-2265-2024", "title": "An overview of the Western United States Dynamically Downscaled Dataset (WUS-D3)", "summary": "Predicting future climate change over a region of complex terrain, such as the western United States (US), remains challenging due to the low resolution of global climate models (GCMs). Yet the climate extremes of recent years in this region, such as floods, wildfires, and drought, are likely to intensify further as climate warms, underscoring the need for high-quality and high-resolution predictions. Here, we present an ensemble of dynamically downscaled simulations over the western US from 1980–2100 at 9 km grid spacing, driven by 16 latest-generation GCMs. This dataset is titled the Western US Dynamically Downscaled Dataset (WUS-D3). We describe the challenges of producing WUS-D3, including GCM selection and technical issues, and we evaluate the simulations' realism by comparing historical results to temperature and precipitation observations. The future downscaled climate change signals are shaped in physically credible ways by the regional model's more realistic coastlines and topography. (1) The mean warming signals are heavily influenced by more realistic snowpack. (2) Mean precipitation changes are often consistent with wetting on the windward side of mountain complexes, as warmer, moister air masses are uplifted orographically during precipitation events. (3) There are large fractional precipitation increases on the lee side of mountain complexes, leading to potentially significant changes in water resources and ecology in these arid landscapes. (4) Increases in precipitation extremes are generally larger than in the GCMs, driven by locally intensified atmospheric ", "link": "https://doi.org/10.5194/gmd-17-2265-2024", "authors": "Stefan Rahimi, Lei Huang, Jesse Norris, Alex Hall, Naomi Goldenson, Will Krantz, Benjamin Bass, Chad Thackeray", "source": "Geoscientific Model Development", "published": "2024-3-20", "first_seen": "2026-11-26T13:59:01+00:00", "score": 80, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-22-0035.1", "title": "Global Extreme Heat Forecasting Using Neural Weather Models", "summary": "Heatwaves are projected to increase in frequency and severity with global warming. Improved warning systems would help reduce the associated loss of lives, wildfires, power disruptions, and reduction in crop yields. In this work, we explore the potential for deep learning systems trained on historical data to forecast extreme heat on short, medium and subseasonal time scales. To this purpose, we train a set of neural weather models (NWMs) with convolutional architectures to forecast surface temperature anomalies globally, 1 to 28 days ahead, at ∼200-km resolution and on the cubed sphere. The NWMs are trained using the ERA5 reanalysis product and a set of candidate loss functions, including the mean-square error and exponential losses targeting extremes. We find that training models to minimize custom losses tailored to emphasize extremes leads to significant skill improvements in the heatwave prediction task, relative to NWMs trained on the mean-square-error loss. This improvement is accomplished with almost no skill reduction in the general temperature prediction task, and it can be efficiently realized through transfer learning, by retraining NWMs with the custom losses for a few epochs. In addition, we find that the use of a symmetric exponential loss reduces the smoothing of NWM forecasts with lead time. Our best NWM is able to outperform persistence in a regressive sense for all lead times and temperature anomaly thresholds considered, and shows positive regressive skill relative to the ECMWF subseasonal-to-seasonal control forecast after 2 weeks. Significance Statemen", "link": "https://doi.org/10.1175/aies-d-22-0035.1", "authors": "Ignacio Lopez-Gomez, Amy McGovern, Shreya Agrawal, Jason Hickey", "source": "Artificial Intelligence for the Earth Systems", "published": "2023-1", "first_seen": "2026-11-26T13:59:01+00:00", "score": 80, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-21-0207.1", "title": "Postprocessing of NWP Precipitation Forecasts Using Deep Learning", "summary": "This study analyzes the potential of deep learning using probabilistic artificial neural networks (ANNs) for postprocessing ensemble precipitation forecasts at four observation locations. We split the precipitation forecast problem into two tasks: estimating the probability of precipitation and predicting the hourly precipitation. We then compare the performance with classical statistical postprocessing (logistical regression and GLM). ANNs show a higher performance at three of the four stations for estimating the probability of precipitation and at all stations for predicting the hourly precipitation. Further, two more general ANN models are trained using the merged data from all four stations. These general ANNs exhibit an increase in performance compared to the station-specific ANNs at most stations. However, they show a significant decay in performance at one of the stations at estimating the hourly precipitation. The general models seem capable of learning meaningful interactions in the data and generalizing these to improve the performance at other sites, which also causes the loss of local information at one station. Thus, this study indicates the potential of deep learning in weather forecasting workflows.", "link": "https://doi.org/10.1175/waf-d-21-0207.1", "authors": "Adrian Rojas-Campos, Martin Wittenbrink, Pascal Nieters, Erik J. Schaffernicht, Jan D. Keller, Gordon Pipa", "source": "Weather and Forecasting", "published": "2023-3", "first_seen": "2026-11-26T13:59:01+00:00", "score": 80, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-26-0013.1", "title": "Generative and deterministic deep learning models comparison for fine-scale precipitation retrievals from infrared brightness temperature", "summary": "Accurate precipitation estimation at fine spatial scales is critical for hydrology, agriculture, and climate studies. Infrared brightness temperatures from geostationary satellites offer excellent temporal coverage over continental-scale domains. However, because these measurements primarily characterize cloud-top properties rather than precipitation processes near the surface, their correlation with rainfall intensity remains limited, making quantitative precipitation estimation challenging. In this study, we conduct a systematic inter-comparison of state-of-the-art deep learning models for high-resolution precipitation retrieval from Meteosat Second Generation infrared brightness temperatures over metropolitan France. These models include deterministic U-Nets, transformer-based architectures, conditional GANs, and diffusion models. We construct a curated dataset spanning 2008–2023, combining Météo-France radar mosaics as reference with multi-channel infrared observations, and design preprocessing and sampling strategies to address the heavy-tailed, intermittent nature of rainfall. Our results show that deterministic models provide robust mean estimates and excel in pixel-wise accuracy, but systematically under-estimate extreme precipitation. In contrast, generative models better capture the full precipitation distribution, including rare and heavy rainfall events, producing more realistic spatial structures at the cost of reduced pixel-wise fidelity. These results highlight a trade-off between pixel-wise accuracy and precipitation variability, showing that generative appr", "link": "https://doi.org/10.1175/aies-d-26-0013.1", "authors": "Matthieu Meignin, Cécile Mallet, Nicolas Viltard", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-11-5", "first_seen": "2026-11-26T13:59:01+00:00", "score": 79, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation", "extreme", "diffusion model"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-22-0036.1", "title": "Emulating Rainfall-Runoff-Inundation Model using Deep Neural Network with Dimensionality Reduction", "summary": "Predicting the spatial distribution of maximum inundation depth (depth-MAP) is important for the mitigation of hydrological disasters induced by extreme precipitation. However, physics-based rainfall-runoff-inundation (RRI) models, which are used operationally to predict hydrological disasters in Japan, require massive computational resources for numerical simulations. Here, we aimed at developing a computationally inexpensive deep learning model (Rain2Depth) that emulates an RRI model. Our study focused on the Omono River (Akita Prefecture, Japan) and predicted the depth-MAP from spatial and temporal rainfall data for individual events. Rain2Depth was developed based on a convolutional neural network (CNN), and predicts depth-MAP from 7-day successive hourly rainfall at 13 rain gauge stations in the basin. For training the Rain2Depth, we simulated the depth-MAP by the RRI model forced by 50-ensembles of 30-year data from large-ensemble weather/climate predictions. Instead of using the input and output data directly, we extracted important features from input and output data with two dimensionality reduction techniques (principal component analysis (PCA) and the CNN approach) prior to training the network. This dimensionality reduction aimed to avoid overfitting caused by insufficient training data. The nonlinear CNN approach was superior to the linear PCA for extracting features. Finally, Rain2Depth was architected by connecting the extracted features between input and output data through a neural network. Rain2Depth-based predictions were more accurate than predictions fr", "link": "https://doi.org/10.1175/aies-d-22-0036.1", "authors": "Masahiro Momoi, Shunji Kotsuki, Ryota Kikuchi, Satoshi Watanabe, Masafumi Yamada, Shiori Abe", "source": "Artificial Intelligence for the Earth Systems", "published": "2023-1-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 79, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2026gl124747", "title": "Discrepancies in Extreme Daily and Monthly Precipitation Trends Between Observations and Earth System Models", "summary": "While extreme precipitation is expected to intensify globally in a warming climate, changes in extreme precipitation on regional scales remain uncertain. To understand how well Earth system models (ESMs) capture recent changes in regional extreme precipitation, we compare trends in daily and monthly extreme precipitation across multiple observational data sets and three ESM ensembles. Observations and ESMs show similar increases in the percent of land area with positive trends in daily precipitation extremes over time, but ESMs underestimate the magnitude of both positive and negative observed trends in daily extremes. For monthly extremes, ESMs simulate much more widespread increases compared to observations in recent decades. As a result, many recent observed decreasing trends in monthly extreme precipitation fall outside the model distribution. We find similar results when comparing observed trends to those in high‐resolution simulations. These results highlight ongoing challenges in constraining the magnitude of regional extreme precipitation change.", "link": "https://doi.org/10.1029/2026gl124747", "authors": "Frances V. Davenport, Danielle Touma", "source": "Geophysical Research Letters", "published": "2026-10-6", "first_seen": "2026-11-26T13:59:01+00:00", "score": 79, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-026-08431-6", "title": "Validation of wind and precipitation fields from a convection-permitting model ensemble against high resolution reanalysis and observations", "summary": "Modelling fine-scale atmospheric processes is paramount to correctly reproduce high-impact extreme events. Indeed, convection-permitting models (CPMs) play a crucial role in modelling convection, unlocking better representation of precipitation. However, little is known about the ability of these km-scale climate models to represent other crucial atmospheric variables like strong winds. In this study, hourly precipitation and wind fields from an ensemble mean of CPMs are compared with a high-resolution reanalysis dataset over northern Italy, which is characterised by the mixture of a large plain surrounded by a complex orography. The aims are: (i) exploring whether a high-resolution reanalysis product can be a reliable reference dataset for CPM evaluation; (ii) verifying the ability of the CPM ensemble to reproduce accurately both precipitation and wind hourly statistics as well as events. Furthermore, results show good agreement between in-situ observations and SPHERA, supporting its role as a reference dataset. Compared to SPHERA, the CPM ensemble represents wind and precipitation fields well in terms of relative bias and spatial patterns, except for underestimating heavy summer rainfall. Spatial distributions are generally well captured, though summer heavy precipitation shows reduced spatial variability and correlation. Event analysis reveals CPMs underestimate precipitation and wind events when studied separately, but overestimate compound events of heavy rainfall and extreme wind. Overall, the analysis provided promising insights on the capability of CPMs to represent", "link": "https://doi.org/10.1007/s00382-026-08431-6", "authors": "Luigi Cesarini, Giorgia Fosser, Marianna Adinolfi, Hendrik Feldmann, Chris J. Short", "source": "Climate Dynamics", "published": "2026-11-26", "first_seen": "2026-11-26T13:59:01+00:00", "score": 79, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-015-2597-y", "title": "Precipitation climatology over India: validation with observations and reanalysis datasets and spatial trends", "summary": "", "link": "https://doi.org/10.1007/s00382-015-2597-y", "authors": "P. Kishore, S. Jyothi, Ghouse Basha, S. V. B. Rao, M. Rajeevan, Isabella Velicogna, Tyler C. Sutterley", "source": "Climate Dynamics", "published": "2015-4-23", "first_seen": "2026-11-26T13:59:01+00:00", "score": 79, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021ms002502", "title": "Sub‐Seasonal Forecasting With a Large Ensemble of Deep‐Learning Weather Prediction Models", "summary": "We present an ensemble prediction system using a Deep Learning Weather Prediction (DLWP) model that recursively predicts six key atmospheric variables with six‐hour time resolution. This computationally efficient model uses convolutional neural networks (CNNs) on a cubed sphere grid to produce global forecasts. The trained model requires just three minutes on a single GPU to produce a 320‐member set of six‐week forecasts at 1.4° resolution. Ensemble spread is primarily produced by randomizing the CNN training process to create a set of 32 DLWP models with slightly different learned weights. Although our DLWP model does not forecast precipitation, it does forecast total column water vapor and gives a reasonable 4.5‐day deterministic forecast of Hurricane Irma. In addition to simulating mid‐latitude weather systems, it spontaneously generates tropical cyclones in a one‐year free‐running simulation. Averaged globally and over a two‐year test set, the ensemble mean RMSE retains skill relative to climatology beyond two‐weeks, with anomaly correlation coefficients remaining above 0.6 through six days. Our primary application is to subseasonal‐to‐seasonal (S2S) forecasting at lead times from two to six weeks. Current forecast systems have low skill in predicting one‐ or 2‐week‐average weather patterns at S2S time scales. The continuous ranked probability score (CRPS) and the ranked probability skill score (RPSS) show that the DLWP ensemble is only modestly inferior in performance to the European Center for Medium Range Weather Forecasts (ECMWF) S2S ensemble over land at lead times", "link": "https://doi.org/10.1029/2021ms002502", "authors": "Jonathan A. Weyn, Dale R. Durran, Rich Caruana, Nathaniel Cresswell‐Clay", "source": "Journal of Advances in Modeling Earth Systems", "published": "2021-7", "first_seen": "2026-11-26T13:59:01+00:00", "score": 78, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2020ms002203", "title": "WeatherBench: A Benchmark Data Set for Data‐Driven Weather Forecasting", "summary": "Data‐driven approaches, most prominently deep learning, have become powerful tools for prediction in many domains. A natural question to ask is whether data‐driven methods could also be used to predict global weather patterns days in advance. First studies show promise but the lack of a common data set and evaluation metrics make intercomparison between studies difficult. Here we present a benchmark data set for data‐driven medium‐range weather forecasting (specifically 3–5 days), a topic of high scientific interest for atmospheric and computer scientists alike. We provide data derived from the ERA5 archive that has been processed to facilitate the use in machine learning models. We propose simple and clear evaluation metrics which will enable a direct comparison between different methods. Further, we provide baseline scores from simple linear regression techniques, deep learning models, as well as purely physical forecasting models. The data set is publicly available at https://github.com/pangeo‐data/WeatherBench and the companion code is reproducible with tutorials for getting started. We hope that this data set will accelerate research in data‐driven weather forecasting.", "link": "https://doi.org/10.1029/2020ms002203", "authors": "Stephan Rasp, Peter D. Dueben, Sebastian Scher, Jonathan A. Weyn, Soukayna Mouatadid, Nils Thuerey", "source": "Journal of Advances in Modeling Earth Systems", "published": "2020-11", "first_seen": "2026-11-26T13:59:01+00:00", "score": 78, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": ["Stephan Rasp"], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1029/2020ms002109", "title": "Improving Data‐Driven Global Weather Prediction Using Deep Convolutional Neural Networks on a Cubed Sphere", "summary": "We present a significantly improved data‐driven global weather forecasting framework using a deep convolutional neural network (CNN) to forecast several basic atmospheric variables on a global grid. New developments in this framework include an off‐line volume‐conservative mapping to a cubed‐sphere grid, improvements to the CNN architecture and the minimization of the loss function over multiple steps in a prediction sequence. The cubed‐sphere remapping minimizes the distortion on the cube faces on which convolution operations are performed and provides natural boundary conditions for padding in the CNN. Our improved model produces weather forecasts that are indefinitely stable and produce realistic weather patterns at lead times of several weeks and longer. For short‐ to medium‐range forecasting, our model significantly outperforms persistence, climatology, and a coarse‐resolution dynamical numerical weather prediction (NWP) model. Unsurprisingly, our forecasts are worse than those from a high‐resolution state‐of‐the‐art operational NWP system. Our data‐driven model is able to learn to forecast complex surface temperature patterns from few input atmospheric state variables. On annual time scales, our model produces a realistic seasonal cycle driven solely by the prescribed variation in top‐of‐atmosphere solar forcing. Although it currently does not compete with operational weather forecasting models, our data‐driven CNN executes much faster than those models, suggesting that machine learning could prove to be a valuable tool for large‐ensemble forecasting.", "link": "https://doi.org/10.1029/2020ms002109", "authors": "Jonathan A. Weyn, Dale R. Durran, Rich Caruana", "source": "Journal of Advances in Modeling Earth Systems", "published": "2020-9", "first_seen": "2026-11-26T13:59:01+00:00", "score": 77, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-023-00512-1", "title": "FuXi: a cascade machine learning forecasting system for 15-day global weather forecast", "summary": "Over the past few years, the rapid development of machine learning (ML) models for weather forecasting has led to state-of-the-art ML models that have superior performance compared to the European Centre for Medium-Range Weather Forecasts (ECMWF)’s high-resolution forecast (HRES), which is widely considered as the world’s best physics-based weather forecasting system. Specifically, ML models have outperformed HRES in 10-day forecasts with a spatial resolution of 0.25 ∘ . However, the challenge remains in mitigating the accumulation of forecast errors for longer effective forecasts, such as achieving comparable performance to the ECMWF ensemble in 15-day forecasts. Despite various efforts to reduce accumulation errors, such as implementing autoregressive multi-time step loss, relying on a single model has been found to be insufficient for achieving optimal performance in both short and long lead times. Therefore, we present FuXi, a cascaded ML weather forecasting system that provides 15-day global forecasts at a temporal resolution of 6 hours and a spatial resolution of 0.25 ∘ . FuXi is developed using 39 years of the ECMWF ERA5 reanalysis dataset. The performance evaluation demonstrates that FuXi has forecast performance comparable to ECMWF ensemble mean (EM) in 15-day forecasts. FuXi surpasses the skillful forecast lead time achieved by ECMWF HRES by extending the lead time for Z500 from 9.25 to 10.5 days and for T2M from 10 to 14.5 days. Moreover, the FuXi ensemble is created by perturbing initial conditions and model parameters, enabling it to provide forecast uncertaint", "link": "https://doi.org/10.1038/s41612-023-00512-1", "authors": "Lei Chen, Xiaohui Zhong, Feng Zhang, Yuan Cheng, Yinghui Xu, Yuan Qi, Hao Li", "source": "npj Climate and Atmospheric Science", "published": "2023-11-16", "first_seen": "2026-11-26T13:59:01+00:00", "score": 77, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024ms004839", "title": "ADAF: An Artificial Intelligence Data Assimilation Framework for Weather Forecasting", "summary": "The forecasting skill of numerical weather prediction (NWP) models critically depends on the accurate initial conditions, also known as analysis, provided by data assimilation (DA). Traditional DA methods often face a trade‐off between computational cost and accuracy due to complex linear algebra computations and the high dimensionality of the model, especially in non‐linear systems. Moreover, processing massive data in real‐time requires substantial computational resources. To address this, we introduce an artificial intelligence‐based data assimilation framework (ADAF) to generate high‐quality kilometer‐scale analysis. This study is the pioneering work using real‐world observations from varied locations and multiple sources to verify the AI method's efficacy in DA, including sparse surface weather observations and satellite imagery. We implemented ADAF for four near‐surface variables in the Contiguous United States (CONUS). The results demonstrate that ADAF consistently aligns closely with actual observations, providing high‐quality analysis fields capable of reconstructing extreme events, such as tropical cyclone wind fields. Sensitivity experiments reveal that ADAF can generate high‐quality analysis even with low‐accuracy backgrounds and extremely sparse surface observations. ADAF can assimilate multi‐source observations within a three‐hour window at low computational cost, taking about two seconds on an AMD MI200 graphics processing unit (GPU). ADAF‐generated analysis fields improved short‐term (0–6 hr) forecasts of an AI‐based weather prediction model, outperforming H", "link": "https://doi.org/10.1029/2024ms004839", "authors": "Yanfei Xiang, Weixin Jin, Haiyu Dong, Jonathan Weyn, Mingliang Bai, Zuliang Fang, Pengcheng Zhao, Hongyu Sun", "source": "Journal of Advances in Modeling Earth Systems", "published": "2025-9", "first_seen": "2026-11-26T13:59:01+00:00", "score": 76, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/2017ms001003", "title": "Impact of bias‐corrected reanalysis‐derived lateral boundary conditions on WRF simulations", "summary": "Lateral and lower boundary conditions derived from a suitable global reanalysis data set form the basis for deriving a dynamically consistent finer resolution downscaled product for climate and hydrological assessment studies. A problem with this, however, is that systematic biases have been noted to be present in the global reanalysis data sets that form these boundaries, biases which can be carried into the downscaled simulations thereby reducing their accuracy or efficacy. In this work, three Weather Research and Forecasting (WRF) model downscaling experiments are undertaken to investigate the impact of bias correcting European Centre for Medium range Weather Forecasting Reanalysis ERA‐Interim (ERA‐I) atmospheric temperature and relative humidity using Atmospheric Infrared Sounder (AIRS) satellite data. The downscaling is performed over a domain centered over southern Africa between the years 2003 and 2012. The sample mean and the mean as well as standard deviation at each grid cell for each variable are used for bias correction. The resultant WRF simulations of near‐surface temperature and precipitation are evaluated seasonally and annually against global gridded observational data sets and compared with ERA‐I reanalysis driving field. The study reveals inconsistencies between the impact of the bias correction prior to downscaling and the resultant model simulations after downscaling. Mean and standard deviation bias‐corrected WRF simulations are, however, found to be marginally better than mean only bias‐corrected WRF simulations and raw ERA‐I reanalysis‐driven WRF sim", "link": "https://doi.org/10.1002/2017ms001003", "authors": "Ditiro Benson Moalafhi, Ashish Sharma, Jason Peter Evans, Rajeshwar Mehrotra, Eytan Rocheta", "source": "Journal of Advances in Modeling Earth Systems", "published": "2017-8", "first_seen": "2026-11-26T13:59:01+00:00", "score": 76, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-023-00347-w", "title": "Increases in extreme precipitation over the Northeast United States using high-resolution climate model simulations", "summary": "Extreme precipitation is among the most destructive natural disasters. Simulating changes in regional extreme precipitation remains challenging, partially limited by climate models’ horizontal resolution. Here, we use an ensemble of high-resolution global climate model simulations to study September–November extreme precipitation over the Northeastern United States, where extremes have increased rapidly since the mid-1990s. We show that a model with 25 km horizontal resolution simulates much more realistic extreme precipitation than comparable models with 50 or 100 km resolution, including frequency, amplitude, and temporal variability. The 25 km model simulated trends are quantitatively consistent with observed trends over recent decades. We use the same model for future projections. By the mid-21st century, the model projects unprecedented rainfall events over the region, driven by increasing anthropogenic radiative forcing and distinguishable from natural variability. Very extreme events (>150 mm/day) may be six times more likely by 2100 than in the early 21st century.", "link": "https://doi.org/10.1038/s41612-023-00347-w", "authors": "Bor-Ting Jong, Thomas L. Delworth, William F. Cooke, Kai-Chih Tseng, Hiroyuki Murakami", "source": "npj Climate and Atmospheric Science", "published": "2023-3-22", "first_seen": "2026-11-26T13:59:01+00:00", "score": 76, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2026.10038", "title": "Assessing the risk of future Dunkelflaute events for Germany using generative deep learning", "summary": "The European electricity power grid is transitioning toward renewable energy sources, characterized by an increasing share of offshoreand onshore wind and solar power. However, the weather dependency of these energy sources poses a challenge to grid stability, with so-called Dunkelflaute events—periods of low wind and solar power generation—being of particular concern due to their potential to cause electricity supply shortages. In this study, we investigate the impact of these events on the German electricity production in the years and decades to come. For this purpose, we adapt a recently developed generative deep learning framework to downscale climate simulations from the CMIP6 ensemble. We first compare their statistics to the historical record taken from ERA5 data. Next, we use these downscaled simulations to assess plausible future occurrences of Dunkelflaute events in Germany under the optimistic low (SSP2–4.5) and high (SSP5–8.5) emission scenarios. Our analysis indicates that both the frequency and duration of Dunkelflaute events in Germany in the ensemble mean are projected to remain largely unchanged compared to the historical period. This suggests that, under the considered climate scenarios, the associated risk is expected to remain stable throughout the century.", "link": "https://doi.org/10.1017/eds.2026.10038", "authors": "Felix Strnad, Jonathan Schmidt, Fabian Mockert, Philipp Hennig, Nicole Ludwig", "source": "Environmental Data Science", "published": "2026", "first_seen": "2026-11-26T13:59:01+00:00", "score": 76, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-26-0056.1", "title": "Optimizing CorrDiff for High-Resolution Downscaling: Sensitivity to Training Design and Multivariate Conditioning over Complex Terrain in Taiwan", "summary": "High-resolution atmospheric downscaling is essential for regional climate applications, yet the systematic optimization of generative AI/ML-based frameworks for operational deployment remains insufficiently characterized. This study evaluates the sensitivity and robustness of Corrective Diffusion (CorrDiff) using a 33-year paired dataset comprising ERA5 reanalysis and the 2-km Taiwan Re-Analysis Downscaling (TReAD) dataset over Taiwan’s complex terrain. Controlled experiments examine sensitivity to training data length, atmospheric predictor configuration and multivariate output strategy, and variable-dependent downscaling performance. Precipitation downscaling skill generally improves with training length, with diminishing marginal gains beyond approximately 20 years within the 5–25-year range examined. A pronounced land–sea asymmetry in improvement is identified, consistent with a terrain-locking interpretation in which complex orography produces persistent, learnable precipitation structures over land. Joint downscaling of multiple surface variables generally improves precipitation spatial skill relative to single-variable approaches. When ERA5 precipitation is available as a predictor, a surface-only multivariate configuration approaches the performance of the full three-dimensional configuration; when precipitation is removed, three-dimensional atmospheric information becomes more valuable, while adding 850-hPa specific humidity recovers most of the resulting RMSE degradation, particularly during convectively dominated seasons. CorrDiff also achieves substantially larg", "link": "https://doi.org/10.1175/aies-d-26-0056.1", "authors": "Jing-Shan Hong, Ching-Teng Lee, Yun-Ting Jhu, Yun-Jing Chen, Tzu-Ting Lo, Wan-Ling Tseng", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-11-19", "first_seen": "2026-11-26T13:59:01+00:00", "score": 75, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.36944", "title": "Impact of Cumulus Parameterization and Cloud Microphysics on WRF Simulation of an Extreme Rainfall Event over Maharashtra, India: A 3 by 3 Factorial Assessment", "summary": "Simulating extreme monsoon rainfall over the Konkan coast and Western Ghats remains challenging at 9 km resolution, where convection is partly resolved and partly parameterised. This study evaluates the sensitivity of Weather Research and Forecasting (WRF) simulations of the 5-7 July 2026 Maharashtra rainfall event to cumulus and cloud microphysics schemes. Nine simulations employed a 3 x 3 factorial design combining WSM6, WDM6 and Thompson microphysics with Kain-Fritsch, Tiedtke and Grell-Freitas cumulus schemes. Rainfall was evaluated against IMD 0.25-degree gridded observations, with IMERG and ERA5 as additional references. A descriptive factorial decomposition showed that cumulus parameterisation accounted for 97.3% of across-experiment variation in mean rainfall, 88.2% in RMSE and 84.7% in spatial correlation, while microphysics contributed 2.0%, 2.1% and 9.3%, respectively. Kain-Fritsch produced the highest spatial correlations (0.533-0.581) but substantially overestimated rainfall. Tiedtke achieved the smallest mean biases and RMSE, although compensating regional errors concealed a 28-34% rainfall deficit over the Konkan-Ghats belt and substantial underestimation on 7 July. Grell-Freitas showed large wet biases and relatively high RMSE. All nine simulations displaced the event-total rainfall maximum approximately 140-195 km northward. WSM6-Tiedtke achieved the lowest RMSE, whereas Thompson-Kain-Fritsch better represented the rainfall spatial pattern. The findings demonstrate that, for this event and fixed model configuration, cumulus parameterisation exerted substant", "link": "https://arxiv.org/abs/2610.36944", "authors": "Devesh, Satyam Kumar, Akshay Sunil", "source": "arXiv", "published": "2026-10-27", "first_seen": "2026-11-26T13:59:01+00:00", "score": 74, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "monsoon", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-16-6433-2023", "title": "Machine learning for numerical weather and climate modelling: a review", "summary": "Machine learning (ML) is increasing in popularity in the field of weather and climate modelling. Applications range from improved solvers and preconditioners, to parameterization scheme emulation and replacement, and more recently even to full ML-based weather and climate prediction models. While ML has been used in this space for more than 25 years, it is only in the last 10 or so years that progress has accelerated to the point that ML applications are becoming competitive with numerical knowledge-based alternatives. In this review, we provide a roughly chronological summary of the application of ML to aspects of weather and climate modelling from early publications through to the latest progress at the time of writing. We also provide an overview of key ML terms, methodologies, and ethical considerations. Finally, we discuss some potentially beneficial future research directions. Our aim is to provide a primer for researchers and model developers to rapidly familiarize and update themselves with the world of ML in the context of weather and climate models.", "link": "https://doi.org/10.5194/gmd-16-6433-2023", "authors": "Catherine O. de Burgh-Day, Tennessee Leeuwenburg", "source": "Geoscientific Model Development", "published": "2023-11-14", "first_seen": "2026-11-26T13:59:01+00:00", "score": 74, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-22-0086.1", "title": "A Review of Recent and Emerging Machine Learning Applications for Climate Variability and Weather Phenomena", "summary": "Climate variability and weather phenomena can cause extremes and pose significant risk to society and ecosystems, making continued advances in our physical understanding of such events of utmost importance for regional and global security. Advances in machine learning (ML) have been leveraged for applications in climate variability and weather, empowering scientists to approach questions using big data in new ways. Growing interest across the scientific community in these areas has motivated coordination between the physical and computer science disciplines to further advance the state of the science and tackle pressing challenges. During a recently held workshop that had participants across academia, private industry, and research laboratories, it became clear that a comprehensive review of recent and emerging ML applications for climate variability and weather phenomena that can cause extremes was needed. This article aims to fulfill this need by discussing recent advances, challenges, and research priorities in the following topics: sources of predictability for modes of climate variability, feature detection, extreme weather and climate prediction and precursors, observation–model integration, downscaling, and bias correction. This article provides a review for domain scientists seeking to incorporate ML into their research. It also provides a review for those with some ML experience seeking to broaden their knowledge of ML applications for climate variability and weather.", "link": "https://doi.org/10.1175/aies-d-22-0086.1", "authors": "Maria J. Molina, Travis A. O’Brien, Gemma Anderson, Moetasim Ashfaq, Katrina E. Bennett, William D. Collins, Katherine Dagon, Juan M. Restrepo", "source": "Artificial Intelligence for the Earth Systems", "published": "2023-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 74, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2024.24", "title": "Cloudy with a chance of precision: satellite’s autoconversion rates forecasting powered by machine learning", "summary": "Precipitation is one of the most relevant weather and climate processes. Its formation rate is sensitive to perturbations such as by the interactions between aerosols, clouds, and precipitation. These interactions constitute one of the biggest uncertainties in determining the radiative forcing of climate change. High-resolution simulations such as the ICOsahedral non-hydrostatic large-eddy model (ICON-LEM) offer valuable insights into these interactions. However, due to exceptionally high computation costs, it can only be employed for a limited period and area. We address this challenge by developing new models powered by emerging machine learning approaches capable of forecasting autoconversion rates—the rate at which small droplets collide and coalesce becoming larger droplets—from satellite observations providing long-term global spatial coverage for more than two decades. In particular, our approach involves two phases: (1) we develop machine learning models which are capable of predicting autoconversion rates by leveraging high-resolution climate model data, (2) we repurpose our best machine learning model to predict autoconversion rates directly from satellite observations. We compare the performance of our machine learning models against simulation data under several different conditions, showing from both visual and statistical inspections that our approaches are able to identify key features of the reference simulation data to a high degree. Additionally, the autoconversion rates obtained from the simulation output and satellite data (predicted) demonstrate statist", "link": "https://doi.org/10.1017/eds.2024.24", "authors": "Maria Carolina Novitasari, Johannes Quaas, Miguel R. D. Rodrigues", "source": "Environmental Data Science", "published": "2024", "first_seen": "2026-11-26T13:59:01+00:00", "score": 74, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2025gl114953", "title": "Robust Projections of Changing Precipitation Evenness in a Warming Climate", "summary": "Global warming is expected to increase global mean precipitation by 2%–4%/K, but this increase may be uneven, leading to more flooding but also droughts. Utilizing the Gini index, a metric frequently used in economics, we analyze the evenness of precipitation distribution locally and globally from daily to annual‐mean timescale in CMIP6 global warming simulations. Spatial evenness of daily precipitation decreases over land and ocean, tropics and extratropics. Changes in temporal evenness of local‐daily precipitation show a complex geographic pattern. However, particularly over land, we show that a simple theoretical scaling explains this complexity to result from increased precipitation intensity scaling at about the Clausius‐Clapeyron rate, and a local balance between changes in annual‐mean precipitation and dry‐day fraction. These results provide a novel perspective on the relation between global constraints on the hydrological cycle to regional precipitation changes independent of changes in the geographic distribution of precipitation.", "link": "https://doi.org/10.1029/2025gl114953", "authors": "Hsin Hsu, Stephan Fueglistaler", "source": "Geophysical Research Letters", "published": "2025-4-30", "first_seen": "2026-11-26T13:59:01+00:00", "score": 73, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2019ea000740", "title": "Comparative Assessment of Various Machine Learning‐Based Bias Correction Methods for Numerical Weather Prediction Model Forecasts of Extreme Air Temperatures in Urban Areas", "summary": "Forecasts of maximum and minimum air temperatures are essential to mitigate the damage of extreme weather events such as heat waves and tropical nights. The Numerical Weather Prediction (NWP) model has been widely used for forecasting air temperature, but generally it has a systematic bias due to its coarse grid resolution and lack of parametrizations. This study used random forest (RF), support vector regression (SVR), artificial neural network (ANN) and a multi‐model ensemble (MME) to correct the Local Data Assimilation and Prediction System (LDAPS; a local NWP model over Korea) model outputs of next‐day maximum and minimum air temperatures ( and ) in Seoul, South Korea. A total of 14 LDAPS model forecast data, the daily maximum and minimum air temperatures of in‐situ observations, and five auxiliary data were used as input variables. The results showed that the LDAPS model had an R 2 of 0.69, a bias of −0.85 °C and an RMSE of 2.08 °C for forecast, whereas the proposed models resulted in the improvement with R 2 from 0.75 to 0.78, bias from −0.16 to −0.07 °C and RMSE from 1.55 to 1.66 °C by hindcast validation. For forecasting , the LDAPS model had an R 2 of 0.77, a bias of 0.51 °C and an RMSE of 1.43 °C by hindcast, while the bias correction models showed R 2 values ranging from 0.86 to 0.87, biases from −0.03 to 0.03 °C, and RMSEs from 0.98 to 1.02 °C. The MME model had better generalization performance than the three single machine learning models by hindcast validation and leave‐one‐station‐out cross‐validation.", "link": "https://doi.org/10.1029/2019ea000740", "authors": "Dongjin Cho, Cheolhee Yoo, Jungho Im, Dong‐Hyun Cha", "source": "Earth and Space Science", "published": "2020-3-28", "first_seen": "2026-11-26T13:59:01+00:00", "score": 73, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ea003227", "title": "Deep Learning for Daily 2‐m Temperature Downscaling", "summary": "This study proposes a novel method, which is a U‐shaped convolutional neural network that combines non‐local attention mechanisms, Res2net residual modules, and terrain information (UNR‐Net). The original U‐Net method and the linear regression (LR) method are conducted as benchmarks. Generally, the UNR‐Net has demonstrated promise in performing a 10× downscaling for daily 2‐m temperature over North China with lead times of 1–7 days and shows superiority to the U‐Net and LR methods. To be specific, U‐Net and UNR‐Net demonstrate higher Nash‐Sutcliffe Efficiency coefficient values compared to LR by 0.052 and 0.077, respectively. The corresponding improvements in pattern correlation coefficient a
