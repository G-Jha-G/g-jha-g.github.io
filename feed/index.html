on downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-18-1545-2025", "title": "Quantifying the analysis uncertainty for nowcasting application", "summary": "This study proposes a method to quantify uncertainty represented by errors in very-high-resolution near-surface analysis, specifically for weather nowcasting applications. Gaussian distributed perturbations are used to perturb the first guess and observation with a variance equal to that of the first-guess error. This error reflects the spatial characteristics of the difference between the first guess and observations and dominates the primary sources of analysis uncertainty. However, mapping perturbations to analyse the grid mesh through interpolation results in underdispersion, particularly in areas without stations. To address this issue, Gaussian perturbations are inflated with an inflation factor to amplify the dispersion. This method was applied to high-resolution analysis and nowcasting for hourly temperature, humidity, and wind components in the Beijing–Tianjin–Hebei region to assess its effectiveness in representing uncertainty. The generated ensemble analysis exhibits reasonable spread and high reliability, indicating accurate quantification of analysis uncertainty. Ensemble nowcasting is extrapolated from ensemble analysis to evaluate the transmission of perturbation during extrapolation. Verification results of ensemble nowcasting reflect the fact that the spread increases effectively during extrapolation up to a lead time of 6 h. However, the increase in the spread is highly dependent on the persistence of numerical weather prediction. The results demonstrate that generating appropriate perturbations based on analysis errors effectively represents the analysis ", "link": "https://doi.org/10.5194/gmd-18-1545-2025", "authors": "Yanwei Zhu, Aitor Atencia, Markus Dabernig, Yong Wang", "source": "Geoscientific Model Development", "published": "2025-3-10", "first_seen": "2026-11-23T14:47:49+00:00", "score": 24, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2019ms002012", "title": "The Flexible Global Ocean‐Atmosphere‐Land System Model Grid‐Point Version 3 (FGOALS‐g3): Description and Evaluation", "summary": "Abstract This paper introduces the Flexible Global Ocean‐Atmosphere‐Land System Model: Grid‐Point Version 3 (FGOALS‐g3) and evaluates its basic performance based on some of its participation in the sixth phase of the Coupled Model Intercomparison Project (CMIP6) experiments. Our results show that many significant improvements have been achieved by FGOALS‐g3 in terms of climatological mean states, variabilities, and long‐term trends. For example, FGOALS‐g3 has a small (−0.015°C/100 yr) climate drift in 700‐yr preindustrial control (piControl) runs and smaller biases in climatological mean variables, such as the land/sea surface temperatures (SSTs) and seasonal soil moisture cycle, compared with its previous version FGOALS‐g2 during the historical period. The characteristics of climate variabilities, for example, Madden‐Julian oscillation (MJO) eastward/westward propagation ratios, spatial patterns of interannual variability of tropical SST anomalies, and relationship between the East Asian Summer Monsoon and El Niño–Southern Oscillation (ENSO), are well captured by FGOALS‐g3. In particular, the cooling trend of globally averaged surface temperature during 1940–1970, which is a challenge for most CMIP3 and CMIP5 models, is well reproduced by FGOALS‐g3 in historical runs. In addition to the external forcing factors recommended by CMIP6, anthropogenic groundwater forcing from 1965 to 2014 was incorporated into the FGOALS‐g3 historical runs.", "link": "https://doi.org/10.1029/2019ms002012", "authors": "Lijuan Li, Yongqiang Yu, Yanli Tang, Pengfei Lin, Jinbo Xie, Mirong Song", "source": "Journal of Advances in Modeling Earth Systems", "published": "2020-9", "first_seen": "2026-11-23T21:25:47+00:00", "score": 24, "topics": ["Climate Modelling"], "watch": [], "boosts": ["monsoon", "cmip6"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-2-1-2021", "title": "Lagrangian detection of precipitation moisture sources for an arid region in northeast Greenland: relations to the North Atlantic Oscillation, sea ice cover, and temporal trends from 1979 to 2017", "summary": "Temperature in northeast Greenland is expected to rise at a faster rate than the global average as a consequence of anthropogenic climate change. Associated with this temperature rise, precipitation is also expected to increase as a result of increased evaporation from a warmer and ice-free Arctic Ocean. In recent years, numerous palaeoclimate projects have begun working in the region with the aim of improving our understanding of how this highly sensitive region responds to a warmer world. However, a lack of meteorological stations within the area makes it difficult to place the palaeoclimate records in the context of present-day climate. This study aims to improve our understanding of precipitation and moisture source dynamics over a small arid region located at 80 ∘ N in northeast Greenland. The origin of water vapour for precipitation over the study region is detected by a Lagrangian moisture source diagnostic, which is applied to reanalysis data from the European Centre for Medium-Range Weather Forecasts (ERA-Interim) from 1979 to 2017. While precipitation amounts are relatively constant during the year, the regional moisture sources display a strong seasonality. The most dominant winter moisture sources are the North Atlantic above 45 ∘ N and the ice-free Atlantic sector of the Arctic Ocean, while in summer the patterns shift towards local and north Eurasian continental sources. During the positive phases of the North Atlantic Oscillation (NAO), evaporation and moisture transport from the Norwegian Sea are stronger, resulting in larger and more variable precipitation ", "link": "https://doi.org/10.5194/wcd-2-1-2021", "authors": "Lilian Schuster, Fabien Maussion, Lukas Langhamer, Gina E. Moseley", "source": "Weather and Climate Dynamics", "published": "2021-1-14", "first_seen": "2026-11-23T21:25:47+00:00", "score": 24, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41558-023-01812-3", "title": "Soil heat extremes can outpace air temperature extremes", "summary": "Abstract Quantifying changes in hot temperature extremes is key for developing adaptation strategies. Changes in hot extremes are often determined on the basis of air temperatures; however, hydrology and many biogeochemical processes are more sensitive to soil temperature. Here we show that soil hot extremes are increasing faster than air hot extremes by 0.7 °C per decade in intensity and twice as fast in frequency on average over Central Europe. Furthermore, we identify soil temperature as a key factor in the soil moisture–temperature feedback. During dry and warm conditions, the energy absorbed by the soil is used to warm the soil, increasing the release of sensible heat flux and surface air temperatures. This increase in surface air temperature leads to a higher atmospheric demand for water, increasing soil evaporation, which may further dry and warm the soil highlighting the contribution of soil moisture–temperature feedback to the evolution of hot extremes in a warming climate.", "link": "https://doi.org/10.1038/s41558-023-01812-3", "authors": "Almudena García-García, Francisco José Cuesta-Valero, Diego G. Miralles, Miguel D. Mahecha, Johannes Quaas, Markus Reichstein", "source": "Nature Climate Change", "published": "2023-9-21", "first_seen": "2026-11-23T21:25:47+00:00", "score": 24, "topics": ["Watched author"], "watch": ["Markus Reichstein"], "boosts": ["extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1175/aies-d-24-0114.1", "title": "Evaluating the Robustness of PCMCI+ for Causal Discovery of Flood Drivers", "summary": "Abstract Estimating causal drivers of high-impact extreme events such as floods from data is an aspiring pursuit. Time series causal discovery methods, such as the conditional-independence-based PC Momentary Conditional Independence (PCMCI) framework, are designed to identify causal relationships from complex multivariate observational time series. However, the application to extreme event data remains a challenge due to, by the nature of extremes, data length limitations, conditional independence testing for nonlinear relationships, and potential violations of the methods’ assumptions. So far, these challenges have mostly been explored on synthetic data with limited transferability to real-world applications. In this study, we evaluate causal discovery on real and pseudoreal data generated with a hydrological model across 45 catchments with varying flood-generating processes. Because no detailed causal ground truth exists, we focus on the robustness of output graphs. To this end, we simulate a large sample, identify discharge peaks, and investigate the robustness of the causal discovery algorithm PCMCI+ when applied to different realizations of the same setting for various sample sizes. We find that the robustness generally increases with sample size, yet a significant proportion of inferred causal edges remain inconsistent even for large datasets. Notably, while some flood drivers are reliably identified, other key hydrological mechanisms are systematically missed even for very large sample sizes, highlighting methodological limitations. Our study provides a blueprint for", "link": "https://doi.org/10.1175/aies-d-24-0114.1", "authors": "Peter Miersch, Wiebke Günther, Jakob Runge, Jakob Zscheischler", "source": "Artificial Intelligence for the Earth Systems", "published": "2025-10", "first_seen": "2026-11-23T21:25:47+00:00", "score": 23, "topics": ["Deep Learning"], "watch": ["Jakob Runge"], "boosts": ["extreme", "uncertainty"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1029/2018ms001418", "title": "One Step at a Time: How Model Time Step Significantly Affects Convection‐Permitting Simulations", "summary": "Abstract We show that there is a strong sensitivity of cloud microphysics to model time step in idealized convection‐permitting simulations using the COnsortium for Small‐scale MOdeling model. Specifically, we found a 53% reduction in precipitation when the time step is increased from 1 to 15 s, changes to the location of precipitation and hail reaching the surface, and changes to the vertical distribution of hydrometeors. The effect of cloud condensation nuclei perturbations on precipitation also changes both magnitude and sign with the changing model time step. The sensitivity arises because of the numerical implementation of processes in the model, specifically the so‐called “splitting” of the dynamics (e.g., advection and diffusion) and the parameterized physics (e.g., microphysics scheme). Calculating one step at a time (sequential‐update splitting) gives a significant time step dependence because large supersaturation with respect to liquid is generated in updraft regions, which strongly affect parameterized microphysical process rates—in particular, ice nucleation. In comparison, calculating both dynamics and microphysics using the same inputs of temperature and water vapor (hybrid parallel splitting) or adding an additional saturation adjustment within the dynamics reduces the time step sensitivity of surface precipitation by limiting the supersaturation seen by the microphysics, although sensitivity to time step remains for some processes.", "link": "https://doi.org/10.1029/2018ms001418", "authors": "Andrew I. Barrett, Constanze Wellmann, Axel Seifert, Corinna Hoose, Bernhard Vogel, Michael Kunz", "source": "Journal of Advances in Modeling Earth Systems", "published": "2019-3", "first_seen": "2026-11-23T21:25:47+00:00", "score": 23, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr-d-25-0206.1", "title": "What Is the Minimum Ensemble Size That Is Sufficient to Reduce Uncertainty in Assessing Model Skill in the West-WRF Ensemble?", "summary": "Abstract The minimum number of members in a numerical weather prediction ensemble has long been debated. In this study, we estimate the minimum ensemble size ( N min ) for prediction of temperature, precipitation, and snow water equivalent for the 200-member regional weather model West-WRF ensemble for the winter (December–March) 2021–22. We give examples of how to estimate N min for three skill metrics by finding the number of ensemble members needed to reduce the relative difference in mean skill score from that of the full ensemble or to reduce the spread of the skill score to a certain threshold depending on the skill score. The N min estimates are found when the relative difference in skill reduces to two different sample thresholds. The less stringent threshold N min for deterministic and probabilistic skill (∼20–30) is similar to the size of ensembles currently produced at operational centers. There is a smaller difference between the less stringent threshold N min and more stringent threshold N min to account for sampling uncertainty. The N min based on all metrics shows some sensitivity to whether an atmospheric river is landfalling. A simple postprocessing scheme minimizing biases and leveraging persistence was used to test sensitivity of N min to bias correction. The most sensitivity was shown for snow water equivalent resulting in a reduction in the difference between the two thresholds for sampling uncertainty. Significance Statement The minimum number of members in a weather forecasting model ensemble has long been debated. Here, we determine a minimum ensembl", "link": "https://doi.org/10.1175/mwr-d-25-0206.1", "authors": "Michael A. Brunke, William D. Scheftic, Leong Wai Siu, Xubin Zeng, Matthew Simpson, Daniel F. Steinhoff", "source": "Monthly Weather Review", "published": "2026-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 23, "topics": ["Downscaling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr3120.1", "title": "The Operational JMA Nonhydrostatic Mesoscale Model", "summary": "Abstract An operational nonhydrostatic mesoscale model has been developed by the Numerical Prediction Division (NPD) of the Japan Meteorological Agency (JMA) in partnership with the Meteorological Research Institute (MRI). The model is based on the MRI/NPD unified nonhydrostatic model (MRI/NPD-NHM), while several modifications have been made for operational numerical weather prediction with a horizontal resolution of 10 km. A fourth-order advection scheme considering staggered grid configuration is implemented. The buoyancy term is directly evaluated from density perturbation. A time-splitting scheme for advection has been developed, where the low-order (second order) part of advection is modified in the latter half of the leapfrog time integration. Physical processes have also been revised, especially in the convective parameterization and PBL schemes. A turbulent kinetic energy (TKE) diagnostic scheme has been developed to overcome problems that arise to predict TKE. The model performance for mesoscale NWP has been verified by comparison with a former operational hydrostatic mesoscale model of JMA. It is found that the new nonhydrostatic mesoscale model outperforms the hydrostatic model in the prediction of synoptic fields and quantitative precipitation forecasts.", "link": "https://doi.org/10.1175/mwr3120.1", "authors": "Kazuo Saito, Tsukasa Fujita, Yoshinori Yamada, Jun-ichi Ishida, Yukihiro Kumagai, Kohei Aranami", "source": "Monthly Weather Review", "published": "2006-4-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 23, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.3790", "title": "Evaluating the GECCO3 1948–2018 ocean synthesis – a configuration for initializing the MPI‐ESM climate model", "summary": "Abstract The paper describes an update of the GECCO (German contribution to the Estimating the Circulation and Climate of the Ocean project) ocean synthesis, now in its version 3, and provides an evaluation of the results with assimilated and independent data. GECCO3 covers the 71‐year period 1948–2018 and differs from its predecessor by returning to a single assimilation window instead of partitioning the period in 5‐year‐long overlapping windows which was previously necessary to yield convergence. A solution to the convergence problem is presented. GECCO3 is intended to be used for the initialization of coupled climate models and is configured for the higher‐resolution version of the earth system model (MPI‐ESM) developed at the Max Planck Institute for Meteorology. It uses the bathymetry and grid of the MPI‐ESM with quasi‐uniform resolution of 0.4°, thereby providing the first global eddy‐permitting synthesis based on the adjoint method. The synthesis additionally features the estimation of various mixing parameters and can regionally choose between explicit or parametrized eddy fluxes. Except for the altimeter data in tropical regions, GECCO3 is in better agreement with the assimilated data than GECCO2. The improvements relative to the in situ data partly result from the much larger amount of Argo data, which show lower model–data differences. Global heat content changes are in good agreement with recent estimates, but show uptake almost exclusively in the top 700 m. An alternative version of GECCO3, created by starting from different first‐guess control parameters, was", "link": "https://doi.org/10.1002/qj.3790", "authors": "Armin Köhl", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2020-4-20", "first_seen": "2026-11-23T21:25:47+00:00", "score": 23, "topics": ["Climate Modelling"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-7-2077-2014", "title": "A suite of early Eocene (~ 55 Ma) climate model boundary conditions", "summary": "Abstract. We describe a set of early Eocene (~ 55 Ma) climate model boundary conditions constructed in a self-consistent reference frame and incorporating recent data and methodologies. Given the growing need for uniform experimental design within the Eocene climate modelling community and the challenges faced in simulating the prominent features of Eocene climate, we make publicly available our data sets of Eocene topography, bathymetry, tidal dissipation, vegetation, aerosol distributions and river runoff. Major improvements in our boundary conditions over previous efforts include the implementation of the ANTscape palaeotopography of Antarctica, more accurate representations of the Drake Passage and Tasman Gateway, as well as an approximation of sub grid cell topographic variability. Our boundary conditions also include for the first time modelled estimates of Eocene aerosol distributions and tidal dissipation, both consistent with our palaeotopography and palaeobathymetry. The resolution of our data sets is unprecedented and will facilitate high resolution climate simulations. In light of the inherent uncertainties involved in reconstructing global boundary conditions for past time periods these data sets should be considered as one interpretation of the available data and users are encouraged to modify them according to their needs and interpretations. This paper marks the beginning of a process for reconstructing a set of accurate, open-access Eocene boundary conditions for use in climate models.", "link": "https://doi.org/10.5194/gmd-7-2077-2014", "authors": "N. Herold, J. Buzan, M. Seton, A. Goldner, J. A. M. Green, R. D. Müller", "source": "Geoscientific Model Development", "published": "2014-9-16", "first_seen": "2026-11-23T14:47:49+00:00", "score": 22, "topics": ["Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021ms002544", "title": "Convection‐Permitting Simulations With the E3SM Global Atmosphere Model", "summary": "Abstract This paper describes the first implementation of the Δ x = 3.25 km version of the Energy Exascale Earth System Model (E3SM) global atmosphere model and its behavior in a 40‐day prescribed‐sea‐surface‐temperature simulation (January 20 through February 28, 2020). This simulation was performed as part of the DYnamics of the Atmospheric general circulation Modeled On Non‐hydrostatic Domains (DYAMOND) Phase 2 model intercomparison. Effective resolution is found to be the horizontal dynamics grid resolution despite using a coarser grid for physical parameterizations. Despite this new model being in an immature and untuned state, moving to 3.25 km grid spacing solves several long‐standing problems with the E3SM model. In particular, Amazon precipitation is much more realistic, the frequency of light and heavy precipitation is improved, agreement between the simulated and observed diurnal cycle of tropical precipitation is excellent, and the vertical structure of tropical convection and coastal stratocumulus look good. In addition, the new model is able to capture the frequency and structure of important weather events (e.g., tropical cyclones, extratropical cyclones including atmospheric rivers, and cold air outbreaks). Interestingly, this model does not get rid of the erroneous southern branch of the intertropical convergence zone nor the tendency for strongest convection to occur over the Maritime Continent rather than the West Pacific, both of which are classic climate model biases. Several other problems with the simulation are identified, underscoring the fact that ", "link": "https://doi.org/10.1029/2021ms002544", "authors": "P. M. Caldwell, C. R. Terai, B. Hillman, N. D. Keen, P. Bogenschutz, W. Lin", "source": "Journal of Advances in Modeling Earth Systems", "published": "2021-11", "first_seen": "2026-11-23T21:25:47+00:00", "score": 22, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021ef002278", "title": "Vulnerability to Water Shortage Under Current and Future Water Supply‐Demand Conditions Across U.S. River Basins", "summary": "Abstract Climate change, population growth, urbanization, and interactions thereof may alter the water supply‐demand balance and lead to shifts in water shortage characteristics at different timescales. This study proposes an approach to improve the vulnerability assessments of U.S. river basins to the shortage at the interannual to decadal timescales by characterizing shifts in intensity, duration, and frequency (IDF) of water shortage events from current (1986–2015) to future (2070–2099) periods. The results indicate that under the driest future climate projection, the frequency and intensity of over‐year ( D > 12 months) events at the monthly scale and decadal ( D > 10 years) events at the annual scale tend to increase in the Southwest, Southern, middle Great Plain, and Great Lakes regions. Conversely, the frequency of interannual ( D < 12 months) events at the monthly scale and annual ( D > 1 year) and multi‐year ( D > 3 years) events at the annual scale is likely to increase in the West Coast regions. Besides, river basins with a higher rate of aridification are likely to experience more frequent over‐year ( D > 12 months) events, while river basins with a decrease in aridification were projected to undergo more frequent interannual ( D < 12 months) events due to an increase in the variability of extreme weather anomalies within a year. The findings of this study provide new insights to understand and characterize vulnerability to water shortage under current and future water supply‐demand conditions and can inform the development of effective mitigation and/or adaptat", "link": "https://doi.org/10.1029/2021ef002278", "authors": "Hadi Heidari, Mazdak Arabi, Travis Warziniack", "source": "Earth's Future", "published": "2021-10", "first_seen": "2026-11-23T21:25:47+00:00", "score": 22, "topics": ["Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021ef002340", "title": "Guidelines for Studying Diverse Types of Compound Weather and Climate Events", "summary": "Abstract Compound weather and climate events are combinations of climate drivers and/or hazards that contribute to societal or environmental risk. Studying compound events often requires a multidisciplinary approach combining domain knowledge of the underlying processes with, for example, statistical methods and climate model outputs. Recently, to aid the development of research on compound events, four compound event types were introduced, namely (a) preconditioned , (b) multivariate , (c) temporally compounding , and (d) spatially compounding events. However, guidelines on how to study these types of events are still lacking. Here, we consider four case studies, each associated with a specific event type and a research question, to illustrate how the key elements of compound events (e.g., analytical tools and relevant physical effects) can be identified. These case studies show that (a) impacts on crops from hot and dry summers can be exacerbated by preconditioning effects of dry and bright springs. (b) Assessing compound coastal flooding in Perth (Australia) requires considering the dynamics of a non‐stationary multivariate process. For instance, future mean sea‐level rise will lead to the emergence of concurrent coastal and fluvial extremes, enhancing compound flooding risk. (c) In Portugal, deep‐landslides are often caused by temporal clusters of moderate precipitation events. Finally, (d) crop yield failures in France and Germany are strongly correlated, threatening European food security through spatially compounding effects. These analyses allow for identifying gene", "link": "https://doi.org/10.1029/2021ef002340", "authors": "Emanuele Bevacqua, Carlo De Michele, Colin Manning, Anaïs Couasnon, Andreia F. S. Ribeiro, Alexandre M. Ramos", "source": "Earth's Future", "published": "2021-11", "first_seen": "2026-11-23T21:25:47+00:00", "score": 22, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022ef003463", "title": "Pervasive Permafrost Thaw Exacerbates Future Risk of Water Shortage Across the Tibetan Plateau", "summary": "Abstract Rivers originating from the Tibetan Plateau (TP) provide water to more than 1 billion people living downstream. Almost 40% of the TP is currently underlain by permafrost, which serves as both an ice reserve and a flow barrier and is expected to degrade drastically in a warming climate. The hydrological impacts of permafrost thaw across the TP, however, remain poorly understood. Here, we quantify the permafrost change on the TP over 1980–2100 and evaluate its hydrological impacts using a physically‐based cryospheric‐hydrological model at a high spatial resolution. Using the ensemble mean of 38 models from the Coupled Model Intercomparison Project Phase 6 (CMIP6), the near‐surface permafrost area and the total ground ice storage are projected to decrease by 86.4% and 61.6% during 2020–2100 under a high‐emission scenario, respectively. The lowering of the permafrost table and removal of permafrost as a flow barrier would enhance infiltration and raise subsurface storage capacity. The diminished water supply from ground ice melt and enhanced subsurface storage capacity could jointly reduce annual runoff and lead to exacerbated regional water shortage when facing future droughts. If the most severe 10‐year drought in the historical period occurs again in the future, the annual river runoff will further decrease by 9.7% and 11.3% compared with the historical dry period due to vanishing cryosphere in the source area of Yellow and Yangtze River. Our findings highlight the importance to get prepared for the additional water shortage risks caused by pervasive permafrost thaw", "link": "https://doi.org/10.1029/2022ef003463", "authors": "Taihua Wang, Dawen Yang, Yuting Yang, Guanheng Zheng, Huijun Jin, Xin Li", "source": "Earth's Future", "published": "2023-10", "first_seen": "2026-11-23T21:25:47+00:00", "score": 22, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/2017ef000715", "title": "Satellite‐Based Assessment of Rainfall‐Triggered Landslide Hazard for Situational Awareness", "summary": "Abstract Determining the time, location, and severity of natural disaster impacts is fundamental to formulating mitigation strategies, appropriate and timely responses, and robust recovery plans. A Landslide Hazard Assessment for Situational Awareness (LHASA) model was developed to indicate potential landslide activity in near real‐time. LHASA combines satellite‐based precipitation estimates with a landslide susceptibility map derived from information on slope, geology, road networks, fault zones, and forest loss. Precipitation data from the Global Precipitation Measurement (GPM) mission are used to identify rainfall conditions from the past 7 days. When rainfall is considered to be extreme and susceptibility values are moderate to very high, a “nowcast” is issued to indicate the times and places where landslides are more probable. When LHASA nowcasts were evaluated with a Global Landslide Catalog, the probability of detection (POD) ranged from 8% to 60%, depending on the evaluation period, precipitation product used, and the size of the spatial and temporal window considered around each landslide point. Applications of the LHASA system are also discussed, including how LHASA is used to estimate long‐term trends in potential landslide activity at a nearly global scale and how it can be used as a tool to support disaster risk assessment. LHASA is intended to provide situational awareness of landslide hazards in near real‐time, providing a flexible, open‐source framework that can be adapted to other spatial and temporal scales based on data availability.", "link": "https://doi.org/10.1002/2017ef000715", "authors": "Dalia Kirschbaum, Thomas Stanley", "source": "Earth's Future", "published": "2018-3", "first_seen": "2026-11-23T21:25:47+00:00", "score": 22, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2020jd034275", "title": "Observational Quantification of Aerosol Invigoration for Deep Convective Cloud Lifecycle Properties Based on Geostationary Satellite", "summary": "Abstract Aerosols affect cloud microstructure, dynamics, and precipitation by acting as cloud condensation nuclei (CCN) and ice nuclei with a large uncertainty for deep convective clouds (DCCs). Here, we quantify the relationships between aerosols and DCC properties after isolating aerosol impacts from meteorology based on the METEOSAT geostationary satellite and Modern‐Era Retrospective Analysis for Research and Application Version 2 (MERRA‐2) reanalysis data. Results show that fine aerosols (radius <1 µm), which serve as the best proxy for CCN from MERRA‐2, exhibit the strongest aerosol invigoration for DCC compared with aerosol optical depth and coarse aerosols. Overall, added fine aerosols result in colder cloud top temperatures (CTTs), longer lifetime, and more rainfall amounts, especially over land. As CTT decreases monotonically with added aerosols, cloud lifetime and rainfall amount reach a maximum at aerosol loading of 5 and 1.5 µg/m 3 over land and ocean, respectively. Added precipitable water (PW) vapor and convective available potential energy (CAPE) are conducive to the development of more vigorous DCC. For fixed PW and CAPE, CTT decreases by up to −12.2°C ± 0.5°C with fine aerosol concentration over land and up to −4.4°C ± 1.0°C over ocean. The DCC lifetime is lengthened by a factor of 1.3 ± 0.1 from clean condition to optimal aerosol loading over land. A respective enhancement in rainfall amounts over land is indicated by a factor of 2.6 ± 0.4. The decreases in lifetime and rainfall beyond the optimal aerosol concentration are likely due to less aerosol wet s", "link": "https://doi.org/10.1029/2020jd034275", "authors": "Zengxin Pan, Daniel Rosenfeld, Yannian Zhu, Feiyue Mao, Wei Gong, Lin Zang", "source": "JGR: Atmospheres", "published": "2021-5-4", "first_seen": "2026-11-23T21:25:47+00:00", "score": 22, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-024-00569-6", "title": "Record-shattering 2023 Spring heatwave in western Mediterranean amplified by long-term drought", "summary": "Abstract The western Mediterranean region experienced an exceptional and unprecedented early heatwave in April 2023. By shattering historical temperature records, especially in the Iberian Peninsula and northwestern Africa, this extreme offers a stark illustration of a drought–heatwave compound event. Here, we investigate the soil moisture–temperature interactions that underpinned this event, using the most up-to-date observations and a robust statistical analysis. Our results reveal that soil moisture deficit preconditions, concurring with a strong subtropical ridge as a synoptic driver, had a key contribution to the amplification and duration of this record-breaking heatwave. Specifically, we estimate that the most extreme temperature records would have been 4.53 times less likely and 2.19 °C lower had the soils been wet. These findings indicate that soil moisture content may be a crucial variable for seasonal forecasting of early HW in this region and in other Mediterranean climate regimes that are already suffering an increment in the frequency of compound drought–heatwave events.", "link": "https://doi.org/10.1038/s41612-024-00569-6", "authors": "Marc Lemus-Canovas, Damián Insua-Costa, Ricardo M. Trigo, Diego G. Miralles", "source": "npj Climate and Atmospheric Science", "published": "2024-1-23", "first_seen": "2026-11-23T21:25:47+00:00", "score": 22, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-022-06455-2", "title": "Large-scale circulation patterns and their influence on European winter windstorm predictions", "summary": "Abstract Severe winter windstorms are amongst the most damaging weather events for Europe and show significant interannual variability. While surface variables (temperature, precipitation) have been successfully predicted for some time now, predictability of severe windstorms caused by extra-tropical cyclones remains less well explored. This study investigates windstorm prediction skill of the UK Met Office Global Seasonal Forecast System Version 5 (GloSea5) for the Northeast-Atlantic and European region. Based on an objective Lagrangian tracking of severe, damage relevant windstorms, three storm parameters are analysed: windstorm frequency and two intensity measures. Firstly, skill based on direct tracking of simulated windstorms is diagnosed. Significant positive skill for storm frequency and intensity is found over an extended area at the downstream end of the storm track, i.e., from the UK to southern Scandinavia. The skill for frequency agrees well with previous studies for older model versions, while the results of event-based intensity are novel. Receiver Operating Characteristic Curves for three smaller regions reveal significant skill for high and low storm activity seasons. Second, skill of windstorm characteristics based on their multi-linear regressions to three dominant large-scale circulation patterns [i.e., the North Atlantic Oscillation (NAO), the Scandinavian Pattern (SCA), and the East-Atlantic Pattern (EA)] are analysed. Although these large-scale patterns explain up to 80% of the interannual variance of windstorm frequency and up to 60% for intensity, th", "link": "https://doi.org/10.1007/s00382-022-06455-2", "authors": "Lisa Degenhardt, Gregor C. Leckebusch, Adam A. Scaife", "source": "Climate Dynamics", "published": "2022-10-18", "first_seen": "2026-11-23T21:25:47+00:00", "score": 22, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-12-00062.1", "title": "Calibrated Short-Range Ensemble Precipitation Forecasts Using Extended Logistic Regression with Interaction Terms", "summary": "Abstract Extended logistic regression has been shown to be a method well suited to calibrating precipitation forecasts from medium-range ensemble prediction systems. The extension of the logistic regression unifies the separate predictive equations for each threshold, introducing the predictive threshold as part of the predictors. Mutually consistent probabilities and a reduction in the total number of regression parameters to be evaluated are part of the benefits of the extended approach. However, considering the predictive threshold as the only “unification” predictor constrains the regression parameters associated with the primary predictors to be constant with the threshold. To alleviate the rigidity of the extended scheme, interaction terms are introduced in the unified predictive equation. Within the framework of the convection-permitting German-focused Consortium for Small-Scale Modeling ensemble prediction system (COSMO-DE-EPS), it is shown that extended logistic regression, applied to short-range precipitation forecasts with the ensemble mean as the primary predictor, improves the performance of the system. Interaction effects are first illustrated through the analysis of regression parameters and then the positive impact on the calibrated forecasts of the new extended logistic regression scheme, including interaction terms, is shown using quantitative and qualitative measures of reliability and sharpness.", "link": "https://doi.org/10.1175/waf-d-12-00062.1", "authors": "Zied Ben Bouallègue", "source": "Weather and Forecasting", "published": "2013-4-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 22, "topics": ["Downscaling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.2591", "title": "Serial clustering of extratropical cyclones in a multi‐model ensemble of historical and future simulations", "summary": "This study has investigated serial (temporal) clustering of extratropical cyclones simulated by 17 climate models participating in CMIP5. Clustering was estimated by calculating the dispersion (ratio of variance to mean) of 30 December–February counts of Atlantic storm tracks passing near each grid point. Results from single historical simulations of 1975–2005 were compared to those from historical ERA40 reanalyses from 1958 to 2001 and single future model projections of 2069–2099 under the RCP4.5 climate change scenario. Models were generally able to capture the broad features in reanalyses reported previously: underdispersion/regularity (i.e. variance less than mean) in the western core of the Atlantic storm track surrounded by overdispersion/clustering (i.e. variance greater than mean) to the north and south and over Western Europe. Regression of counts onto North Atlantic Oscillation (NAO) indices revealed that much of the overdispersion in the historical reanalyses and model simulations can be accounted for by NAO variability. Future changes in dispersion were generally found to be small and not consistent across models. The overdispersion statistic, for any 30‐year sample, is prone to large amounts of sampling uncertainty which obscures the climate change signal. For example, the projected increase in dispersion for storm counts near London in the CNRMCM5 model is 0.1 compared to a standard deviation of 0.25. Projected changes in the mean and variance of NAO are insufficient to create changes in overdispersion that are discernible above natural sampling variations.", "link": "https://doi.org/10.1002/qj.2591", "authors": "T. Economou, D. B. Stephenson, J. G. Pinto, L. C. Shaffrey, G. Zappa", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2015-8-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 22, "topics": ["Climate Modelling"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2019ms001689", "title": "Confronting the Challenge of Modeling Cloud and Precipitation Microphysics", "summary": "Abstract In the atmosphere, microphysics refers to the microscale processes that affect cloud and precipitation particles and is a key linkage among the various components of Earth's atmospheric water and energy cycles. The representation of microphysical processes in models continues to pose a major challenge leading to uncertainty in numerical weather forecasts and climate simulations. In this paper, the problem of treating microphysics in models is divided into two parts: (i) how to represent the population of cloud and precipitation particles, given the impossibility of simulating all particles individually within a cloud, and (ii) uncertainties in the microphysical process rates owing to fundamental gaps in knowledge of cloud physics. The recently developed Lagrangian particle‐based method is advocated as a way to address several conceptual and practical challenges of representing particle populations using traditional bulk and bin microphysics parameterization schemes. For addressing critical gaps in cloud physics knowledge, sustained investment for observational advances from laboratory experiments, new probe development, and next‐generation instruments in space is needed. Greater emphasis on laboratory work, which has apparently declined over the past several decades relative to other areas of cloud physics research, is argued to be an essential ingredient for improving process‐level understanding. More systematic use of natural cloud and precipitation observations to constrain microphysics schemes is also advocated. Because it is generally difficult to quantify ind", "link": "https://doi.org/10.1029/2019ms001689", "authors": "Hugh Morrison, Marcus van Lier‐Walqui, Ann M. Fridlind, Wojciech W. Grabowski, Jerry Y. Harrington, Corinna Hoose", "source": "Journal of Advances in Modeling Earth Systems", "published": "2020-7-31", "first_seen": "2026-11-23T21:25:47+00:00", "score": 21, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-022-00324-9", "title": "More frequent central Pacific El Niño and stronger eastern pacific El Niño in a warmer climate", "summary": "Abstract El Niño events exhibit rich diversity in their spatial patterns, which can lead to distinct global impacts. Therefore, how El Niño pattern diversity will change in a warmer climate is one of the most critical issues for future climate projections. Based on the sixth Coupled Model Intercomparison Project simulations, we report an inter-model consensus on future El Niño diversity changes. Central Pacific (CP) El Niño events are projected to occur more frequently compared to eastern Pacific (EP) El Niño events. Concurrently, EP El Niño events are projected to increase in amplitude, leading to higher chances of extreme EP El Niño occurrences. We suggest that enhanced upper-ocean stability due to greenhouse warming can lead to a stronger surface-layer response for increasing positive feedbacks, more favorable excitation of CP El Niño. Whereas, enhanced nonlinear atmospheric responses to EP sea surface temperatures can lead to a higher probability of extreme EP El Niño.", "link": "https://doi.org/10.1038/s41612-022-00324-9", "authors": "Na-Yeon Shin, Jong-Seong Kug, Malte F. Stuecker, Fei-Fei Jin, Axel Timmermann, Geon-Il Kim", "source": "npj Climate and Atmospheric Science", "published": "2022-12-16", "first_seen": "2026-11-23T21:25:47+00:00", "score": 21, "topics": ["Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-3-811-2022", "title": "Decline in Etesian winds after large volcanic eruptions in the last millennium", "summary": "The northerly Etesian winds are a stable summertime circulation system in the eastern Mediterranean, emerging from a steep pressure gradient between the central Europe and Balkans high-pressure and the Anatolian low-pressure systems. Etesian winds are influenced by the variability in the Indian summer monsoon (ISM), but their sensitivity to external forcing on interannual and longer timescales is not well understood. Here, for the first time, we investigate the sensitivity of Etesian winds to large volcanic eruptions in a set of model simulations over the last millennium and reanalysis of the 20th century. We provide model evidence for significant volcanic signatures, manifested as a robust reduction in the wind speed and the total number of days with Etesian winds in July and August. These are robust responses to all strong eruptions in the last millennium, and in the extreme case of Samalas, the ensemble-mean response suggests a post-eruption summer without Etesians. The significant decline in the number of days with Etesian winds is attributed to the weakening of the ISM in the post-eruption summers, which is associated with a reduced large-scale subsidence and weakened surface pressure gradients in the eastern Mediterranean. Our analysis identifies a stronger sensitivity of Etesian winds to the Northern Hemisphere volcanic forcing, particularly for volcanoes before the 20th century, while for the latest large eruption of Pinatubo modelled and observed responses are insignificant. These findings could improve seasonal predictions of the wind circulation in the eastern Me", "link": "https://doi.org/10.5194/wcd-3-811-2022", "authors": "Stergios Misios, Ioannis Logothetis, Mads F. Knudsen, Christoffer Karoff, Vassilis Amiridis, Kleareti Tourpali", "source": "Weather and Climate Dynamics", "published": "2022-7-29", "first_seen": "2026-11-23T21:25:47+00:00", "score": 21, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "monsoon", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-5-1103-2024", "title": "The connection between North Atlantic storm track regimes and eastern Mediterranean cyclonic activity", "summary": "A unique chain connects the flow over the North Atlantic and the development of cyclones within the Mediterranean basin. One typical mechanism includes several successive processes: upper-level flow perturbations upstream cause Rossby wave breaking (RWB) events along the jet stream, which in turn develop into potential vorticity streamers. These streamers reach the Mediterranean, and through increased baroclinicity they enhance cyclonic activity in the region. Using European Centre for Medium-Range Weather Forecasts (ECMWF) reanalysis v5 (ERA5) data and rain gauge measurements, we provide a systematic analysis connecting wintertime North Atlantic storm track regimes and eastern Mediterranean cyclones and rainfall. To do so, we use different detection algorithms for each element in the chain (RWBs, streamers and cyclones). A cluster analysis of upper-tropospheric eddy kinetic energy reveals a favorable configuration of the storm track where North Atlantic storms are able to propagate farther northeast. This results in upper-level potential vorticity streamers forming more eastward alongside above-average precipitation over the Levant. Meanwhile, other latitudinal positions of the storm track (southward or northward) were found to hinder cyclonic activity in the region and reduce rainfall there. The intense rainy winter of 1991–1992 is brought as a test case to exemplify this mechanism in its extreme. We show that the rain-enhancing storm track regime was prominent throughout most of this season, alongside frequent streamers in the eastern Mediterranean.", "link": "https://doi.org/10.5194/wcd-5-1103-2024", "authors": "Dor Sandler, Hadas Saaroni, Baruch Ziv, Talia Tamarin-Brodsky, Nili Harnik", "source": "Weather and Climate Dynamics", "published": "2024-9-10", "first_seen": "2026-11-23T21:25:47+00:00", "score": 21, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-10-1903-2017", "title": "GLEAM v3: satellite-based land evaporation and root-zone soil moisture", "summary": "Abstract. The Global Land Evaporation Amsterdam Model (GLEAM) is a set of algorithms dedicated to the estimation of terrestrial evaporation and root-zone soil moisture from satellite data. Ever since its development in 2011, the model has been regularly revised, aiming at the optimal incorporation of new satellite-observed geophysical variables, and improving the representation of physical processes. In this study, the next version of this model (v3) is presented. Key changes relative to the previous version include (1) a revised formulation of the evaporative stress, (2) an optimized drainage algorithm, and (3) a new soil moisture data assimilation system. GLEAM v3 is used to produce three new data sets of terrestrial evaporation and root-zone soil moisture, including a 36-year data set spanning 1980–2015, referred to as v3a (based on satellite-observed soil moisture, vegetation optical depth and snow-water equivalent, reanalysis air temperature and radiation, and a multi-source precipitation product), and two satellite-based data sets. The latter share most of their forcing, except for the vegetation optical depth and soil moisture, which are based on observations from different passive and active C- and L-band microwave sensors (European Space Agency Climate Change Initiative, ESA CCI) for the v3b data set (spanning 2003–2015) and observations from the Soil Moisture and Ocean Salinity (SMOS) satellite in the v3c data set (spanning 2011–2015). Here, these three data sets are described in detail, compared against analogous data sets generated using the previous version of ", "link": "https://doi.org/10.5194/gmd-10-1903-2017", "authors": "Brecht Martens, Diego G. Miralles, Hans Lievens, Robin van der Schalie, Richard A. M. de Jeu, Diego Fernández-Prieto", "source": "Geoscientific Model Development", "published": "2017-5-17", "first_seen": "2026-11-23T21:25:47+00:00", "score": 20, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2019ms002035", "title": "Seasonal to Decadal Predictions With MIROC6: Description and Basic Evaluation", "summary": "Abstract The present paper presents results of seasonal‐to‐decadal climate predictions based on a coupled climate model called the Model for Interdisciplinary Research on Climate version 6 (MIROC6) contributing to the Coupled Model Intercomparison Project Phase 6 (CMIP6). MIROC6 is initialized every year for 1960–2018 by assimilating observed ocean temperature and salinity anomalies and full fields of sea ice concentration and by prescribing atmospheric initial states from reanalysis data. The impacts of updating the system on prediction skill are then evaluated by comparing hindcast experiments between the MIROC6 prediction system and a previous system based on MIROC version 5 (MIROC5). Skill of seasonal prediction is overall improved in association with representation and initialization of El Niño/Southern Oscillation (ENSO), the Quasi‐Biennial Oscillation (QBO), and the Northern Hemisphere sea ice concentration in MIROC6. In particular, the QBO is skillfully predicted up to 3 years ahead with a maximum anomaly correlation exceeding r = 0.8. The prediction skill for the North Atlantic Oscillation in winter is also enhanced, but the prediction still suffers from model's inherent errors. On decadal timescales, MIROC6 has a larger fraction of areas of the globe with better surface temperature skill at all lead times than MIROC5, and it has predictive skill in the annual‐mean sea surface temperature (SST) in the North Atlantic and the Pacific. In particular, MIROC6 hindcasts at 2–5 years lead time are able to capture the spatial structure of SST changes in the North Pacific a", "link": "https://doi.org/10.1029/2019ms002035", "authors": "Takahito Kataoka, Hiroaki Tatebe, Hiroshi Koyama, Takashi Mochizuki, Koji Ogochi, Hiroaki Naoe", "source": "Journal of Advances in Modeling Earth Systems", "published": "2020-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 20, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021ea001950", "title": "Sentinel‐Based Inventory of Thermokarst Lakes and Ponds Across Permafrost Landscapes on the Qinghai‐Tibet Plateau", "summary": "Abstract Thermokarst lakes and ponds (hereafter referred to as thaw lakes) play an important role in the permafrost regions by regulating hydrology, ecology, and biogeochemistry. However, detailed quantitative information on thaw lake extent and distribution remains poorly resolved across the entire permafrost regions on the Qinghai‐Tibet Plateau (QTP). Here, we applied the random forest (RF) model and manual visual vectorization methods to extract thaw lake boundaries on the QTP based on Sentinel‐2 images. Accuracy assessment was comprehensively demonstrated regarding the inherent spatial resolution of imagery and RF model performance. The results showed that the accumulated uncertainty of the total thaw lake area was ±5.75 km 2 , and the mean accuracy (91.9%) from field‐measured boundaries of 132 thaw lakes supported the accuracy of this inventory. A total of ∼161,300 thaw lakes with sizes ranging from 500 m 2 to 3 km 2 were detected, with a total area of ∼2,825.45 ± 5.75 km 2 . Most thaw lakes were detected in the continuous permafrost type (94.1%) and within the elevations of 4,500–5,000 m (68.4%). The small thaw lakes (<10,000 m 2 ) predominated the total lake number (78.9%) but contributed to a small portion of the total lake area (12.7%). Spatial distributions of thaw lakes in terms of different climatic and environmental conditions were also comprehensively explored, including temperature, precipitation, ground thermal stability, active layer thickness, vegetation, soil properties, and underground ice content. This inventory is expected to be incorporated into Earth", "link": "https://doi.org/10.1029/2021ea001950", "authors": "Zhiqiang Wei, Zhiheng Du, Lei Wang, Jiahui Lin, Yaru Feng, Qian Xu", "source": "Earth and Space Science", "published": "2021-11", "first_seen": "2026-11-23T21:25:47+00:00", "score": 20, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-5-913-2024", "title": "Model spread in multidecadal North Atlantic Oscillation variability connected to stratosphere–troposphere coupling", "summary": "The underestimation in multidecadal variability in the wintertime North Atlantic Oscillation (NAO) by global climate models remains poorly understood. Understanding the origins of this weak NAO variability is important for making model projections more reliable. Past studies have linked the weak multidecadal NAO variability in models to an underestimated atmospheric response to the Atlantic Multidecadal Variability (AMV). We investigate historical simulations from Coupled Model Intercomparison Project Phase 6 (CMIP6) large-ensemble models and find that most of the models do not reproduce observed multidecadal NAO variability, as found in previous generations of climate models. We explore statistical relationships with physical drivers that may contribute to inter-model spread in NAO variability. There is a significant anticorrelation across models between the AMV–NAO coupling parameter and multidecadal NAO variability over the full historical period (r=-0.55, p < 0.05). However, this relationship is relatively weak and becomes obscured when using a common period (1900–2010) and de-trending the data in a consistent way, with observations to enable a model–data comparison. This suggests that the representation of NAO–AMV coupling contributes to a modest proportion of inter-model spread in multidecadal NAO variability, although the importance of this process for model spread could be underestimated, given evidence of a systematically poor representation of the coupling in the models. We find a significant inter-model correlation between multidecadal NAO variability and multide", "link": "https://doi.org/10.5194/wcd-5-913-2024", "authors": "Rémy Bonnet, Christine M. McKenna, Amanda C. Maycock", "source": "Weather and Climate Dynamics", "published": "2024-7-19", "first_seen": "2026-11-23T21:25:47+00:00", "score": 20, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-3-337-2022", "title": "Future changes in the extratropical storm tracks and cyclone intensity, wind speed, and structure", "summary": "Future changes in extratropical cyclones and the associated storm tracks are uncertain. Using the new CMIP6 models, we investigate changes to seasonal mean storm tracks and composite wind speeds at different levels of the troposphere for the winter and summer seasons in both the Northern Hemisphere (NH) and Southern Hemisphere (SH). Changes are assessed across four different climate scenarios. The seasonal mean storm tracks are predicted to shift polewards in the SH and also in the North Pacific, with an extension into Europe for the North Atlantic storm track. Overall, the number of cyclones will decrease by ∼5 % by the end of the 21st century, although the number of extreme cyclones will increase by 4 % in NH winter. Cyclone wind speeds are projected to strengthen throughout the troposphere in the winter seasons and also summer in the SH, with a weakening projected in NH summer, although there are minimal changes in the maximum wind speed in the lower troposphere. Changes in wind speeds are concentrated in the warm sector of cyclones, and the area of extreme winds may be up to 40 % larger by the end of the century. The largest changes are seen for the SSP5-85 scenario, although a large amount of change can be mitigated by restricting warming to that seen in the SSP1-26 and 2-45 scenarios. Extreme cyclones show larger increases in wind speed and peak vorticity than the average-strength cyclones, with the extreme cyclones showing a larger increase in wind speed in the warm sector.", "link": "https://doi.org/10.5194/wcd-3-337-2022", "authors": "Matthew D. K. Priestley, Jennifer L. Catto", "source": "Weather and Climate Dynamics", "published": "2022-3-31", "first_seen": "2026-11-23T21:25:47+00:00", "score": 20, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-20-0143.1", "title": "Evaluation of ECMWF Precipitation Predictions in China during 2015–18", "summary": "Abstract Precipitation forecasts from the ECMWF model from March to September during 2015–18 were evaluated using observed precipitation at 2411 stations from the China Meteorological Administration. To eliminate the influence of varying climatology in different regions in China, the stable equitable error in probability space method was used to obtain criteria for 3- and 6-h accumulated precipitation at each station and classified precipitation into light, medium, and heavy precipitation. The model was evaluated for these categories using categorical and continuous methods. The threat score and the equitable threat score showed that the model’s forecasts of rainfall were generally more accurate at shorter lead times, and the best performance occurred in the middle and lower reaches of the Yangtze River basin. The miss ratio for heavy precipitation was higher in the northern region than in the southern region, while heavy precipitation false alarms were more frequent in southwestern China. Overall, the miss ratio and false alarm ratio for heavy precipitation were highest in northern China and western China, respectively. For light and medium precipitation, the model performed best in the middle and lower reaches of the Yangtze River basin. The model predicted too much light and medium precipitation, but too little heavy precipitation. Heavy precipitation was generally underestimated over all of China, especially in the western region of China, South China, and the Yungui Plateau. Heavy precipitation was systematically underestimated because of the resolution and the related", "link": "https://doi.org/10.1175/waf-d-20-0143.1", "authors": "Cui Liu, Jianhua Sun, Xinlin Yang, Shuanglong Jin, Shenming Fu", "source": "Weather and Forecasting", "published": "2021-6", "first_seen": "2026-11-23T21:25:47+00:00", "score": 20, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-15-8111-2022", "title": "Impact of physical parameterizations on wind simulation with WRF V3.9.1.1 under stable conditions at planetary boundary layer gray-zone resolution: a case study over the coastal regions of North China", "summary": "Reliable simulation of wind fields under stable weather conditions is vital for preventing air pollution. In this study, we investigate how different physical parameterizations impact simulated near-surface wind at 10 m height over the coastal regions of North China using the Weather Research and Forecasting (WRF) model with a horizontal grid spacing of 0.5 km. We performed 640 simulations using combinations of 10 planetary boundary layer (PBL), 16 microphysics (MP), and four shortwave–longwave radiation (SW–LW) schemes. Model performance is evaluated using measurements from 105 weather station observations. The results show that the WRF model can reproduce the temporal variation of wind speed in a reasonable way. The simulated wind speed is most sensitive to the PBL schemes, followed by SW–LW schemes and MP schemes. Among all PBL schemes, the MYJ scheme shows the best temporal correlation with the observed wind speed, while the Yonsei University (YSU) scheme has the lowest model bias. Dudhia–RRTM and MYDM7 show the best model performances out of all SW–LW and MP schemes, respectively, and the interactions among schemes also have large influences on wind simulation. Further investigation indicates that model sensitivity is also impacted by ocean proximity and elevation. For example, for coastal stations, MYNN shows the best correlation with observations among all PBL schemes, while Goddard shows the smallest bias of SW–LW schemes; these results are different from those of inland stations. In general, according to the bias metrics, WRF simulates wind speed less accurately fo", "link": "https://doi.org/10.5194/gmd-15-8111-2022", "authors": "Entao Yu, Rui Bai, Xia Chen, Lifang Shao", "source": "Geoscientific Model Development", "published": "2022-11-11", "first_seen": "2026-11-23T14:47:49+00:00", "score": 19, "topics": ["Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-26-0007.1", "title": "Real-Time Probabilistic Nowcasting of Lightning Density via a Sequential Monte Carlo Framework", "summary": "Abstract This study presents a particle filter–based framework for short-term lightning nowcasting using only lightning detection network observations. The method employs DBSCAN clustering to identify lightning-active structures and propagates them probabilistically, yielding useful skill at 1–3-h lead times, with declining but nonzero skill at 4–6 h. The results show that recall is more robust than precision across increasing lead times and that performance is sensitive to the ground-truth density threshold selection. Despite these limitations, the suggested approach achieves skill scores comparable to those of more data-intensive machine learning and NWP-based methods, while requiring minimal input data. Importantly, the algorithm can be implemented as a real-time Python application, demonstrating both its scientific value and practical applicability in data-constrained environments. Significance Statement Lightning represents a severe threat to human life and critical infrastructure, yet high-fidelity nowcasting often depends on data-intensive inputs like satellite or radar imagery, which are frequently unavailable in isolated regions. This study presents a robust, probabilistic framework for real-time lightning prediction using exclusively ground-based lightning strike data. By integrating clustering techniques with a particle filter, our method achieves its strongest predictive skill at 1–3-h lead times, with diminishing but still informative skill at longer horizons. Successfully operationalized for power grid management, this infrastructure-independent solution provi", "link": "https://doi.org/10.1175/waf-d-26-0007.1", "authors": "Vlad Landa, Yuval Reuveni, Yoav Yair, Chaim Lerman, Colin Price", "source": "Weather and Forecasting", "published": "2026-11", "first_seen": "2026-11-23T14:47:49+00:00", "score": 19, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2606.07165", "title": "Implicit Structural Modeling via Generative Diffusion Frameworks", "summary": "Implicit structural modeling can support understanding subsurface spatial configurations, revealing patterns of geological evolution, and enabling quantitative simulation of geological processes, thereby offering substantial scientific and engineering value. Conventional approaches formulate it as an optimization problem or framework interpolation to fit a continuous scalar field, whereas machine learning methods typically adopt discriminative regression to directly predict implicit models. However, in complex scenarios involving fault intersections, branching, and thrust nappes, these methods still struggle to maintain topological consistency and kinematic plausibility. In this work, we develop an implicit structural modeling approach based on diffusion models. We construct a set of training data through a simulation based synthesis pipeline and design a dedicated encoder for conditional injection, allowing the conditional branch to converge rapidly while effectively reinforcing the input conditional priors throughout the diffusion process, thereby more stably propagating structural constraints. We then inject these conditional features into a backbone network pretrained on large scale natural images to enable conditional training of the diffusion model. Although our synthetic data include only a relatively stylized normal fault system, experiments demonstrate strong generalization, enabling the model to effectively handle diverse complex structural types such as strike slip faults and intricate flower fault systems. More importantly, even in challenging thrust nappe setti", "link": "https://arxiv.org/abs/2606.07165", "authors": "Yimin Dou, Xinming Wu, Zhixiang Guo, Hui Gao, Buyu Deng", "source": "arXiv", "published": "2026-06-05T11:35:15Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 19, "topics": ["Deep Learning"], "watch": [], "boosts": ["diffusion model"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2603.13973", "title": "Learning relaxation time distributions from spectral induced polarization data with a complex-valued variational autoencoder", "summary": "Spectral induced polarization (SIP) is a geophysical method used to characterize subsurface materials. It measures the frequency-dependent complex electrical resistivity of rocks and soils through the application of an alternating current. Debye and Warburg decompositions are standard methods for analyzing and interpreting SIP data, as they allow estimation of the relaxation time distribution (RTD) of geomaterials. However, conventional decomposition approaches treat measurements independently, work in real-valued spaces despite the complex-valued nature of SIP data, and provide limited uncertainty quantification. These limitations reduce the effectiveness of conventional decomposition on heterogeneous datasets. We reformulate the decomposition approach as an unsupervised machine learning problem and introduce a conditional variational autoencoder (CVAE) that learns a shared mapping from SIP datasets to continuous RTDs. The model is validated on a dataset comprising 140 laboratory and field SIP measurements of granular mixtures, sedimentary and igneous rock, and cementitious materials. The CVAE operates in complex-valued data space and achieves reconstruction errors of 0.53 % and 0.27 % for the imaginary and phase components of resistivity, respectively, with evidence of improvement over conventional methods at corresponding p-values of 0.007 and 0.06. The inferred RTDs are stable and physically consistent, and their total chargeability and mean relaxation time correlate with polarizable grain content and grain size, respectively, with coefficients of determination up to 0.", "link": "https://arxiv.org/abs/2603.13973", "authors": "Charles L. Bérubé, Sébastien Gagnon, Lahiru M. A. Nagasingha, Jean-Luc Gagnon, E. Rachel Kenko, Reza Ghanati", "source": "arXiv", "published": "2026-03-14T14:57:38Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 19, "topics": ["Deep Learning"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-26-0093.1", "title": "Data-Driven Solutions to the Wave Action Balance Equation: A Physics-Centric Taxonomy and Review of AI Wave Modelling", "summary": "Abstract Wind-generated surface gravity waves are a dominant feature of the ocean dynamic environment, critical for maritime safety, offshore engineering, and global climate systems. While third-generation Numerical Wave Models (NWMs) constitute the current operational backbone, they remain constrained by high computational costs and parameterization approximations. The rapid development of Artificial Intelligence (AI) has opened a new data-driven pathway for wave modelling. Despite the growing number of AI-based wave modelling studies, the field lacks a physically consistent organizing framework. AI models are powerful nonlinear function approximators, but they cannot override the causal constraints imposed by wave physics. Yet many existing studies remain architecture-driven rather than physics-driven, leading to physically under-constrained and potentially misleading model formulations. Here we present a physics-centric taxonomy of data-driven phase-averaged wave modelling derived from the wave action balance equation. Rather than classifying studies by network architecture, we organize existing approaches into four functional paradigms according to their treatment of propagation and source-term physics: (1) time-series autoregressive, (2) initial/boundary conditions-and-forcing, (3) historical forcing-driven, and (4) hybrid numerical-statistical frameworks. We show that purely time-series autoregressive models are physically under-constrained when neglecting external forcing or propagation, whereas the other three frameworks provide parallel pathways toward physically r", "link": "https://doi.org/10.1175/aies-d-26-0093.1", "authors": "Haoyu Jiang, Sitian Li", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-11-23", "first_seen": "2026-11-23T21:25:47+00:00", "score": 19, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022ef003395", "title": "Global Vegetation‐Temperature Sensitivity and Its Driving Forces in the 21st Century", "summary": "Abstract It has been projected that climatic warming will contribute to vegetation productivity variability at the global scale. With a continued warming, to what extent and where the vegetation productivity is most affected by warming has still not been adequately quantified. Herein, based on 11 earth system model outputs, we predict the characteristics of vegetation‐temperature sensitivity ( S vpt , defined as higher/lower temperature produce more/less vegetation) changes under different CO 2 emission scenarios and various vegetation types, further assessing the relationship of the S vpt to socio‐ecosystems. At the end of the 21st century, the area proportion with the global temperature increases >2°C under the SSP1‐2.6, SSP2‐4.5, SSP3‐7.0, and SSP5‐8.5 scenarios are 3%, 40%, 97%, and 99%, respectively. The largest contribution to the global terrestrial gross primary productivity growth is at low latitudes. 33%–63% of global terrestrial ecosystems show a significantly negative trend in the S vpt , indicating the weakened promotion effect of warming on vegetation growth. In particular, in 2060, there will be a clear reversal of the trend from carbon sink to carbon source under the SSP3‐7.0 scenario, spatially distributed mainly in the Amazon rainforest, tropical Africa, and southern North America. Precipitation is also an important factor affecting the S vpt change, and there is an inverted U‐shaped relationship between them. Precipitation thresholds are higher under the high emission scenario when S vpt reaches its highest value. Moreover, socio‐demographic pressures in p", "link": "https://doi.org/10.1029/2022ef003395", "authors": "Wang Yuxi, Peng Li, Yue Yuemin, Chen Tiantian", "source": "Earth's Future", "published": "2024-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 19, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/2015jd023404", "title": "Assessing and improving Noah‐MP land model simulations for the central Tibetan Plateau", "summary": "Abstract The Tibetan Plateau (TP) region experiences strong land‐atmosphere interactions, and as an elevated heating source, significantly influences the formation of the Asian monsoon. Those interactions are not well represented in current land‐surface models (LSMs), partly due to difficulties in representing heterogeneities in soil structures in LSM. Simulations using the Noah with multiparameterization options (Noah‐MP) LSM are employed to assess the relative importance of parameterizing vertical soil heterogenei
