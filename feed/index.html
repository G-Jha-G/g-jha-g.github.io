plications. We then develop a decision-backward evaluation framework: define the action and information available when it must be taken, reproduce the relevant shift, retain a matched task-specific baseline, and report misses, false alarms, reliability and end-to-end latency. The framework turns transf", "link": "https://arxiv.org/abs/2611.30198", "authors": "Parastoo Farajpoor, Mohammadreza Narimani", "source": "arXiv", "published": "2026-11-23", "first_seen": "2026-11-24T14:57:46+00:00", "score": 45, "topics": ["Deep Learning"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.42111", "title": "SATFRONT: Detecting Atmospheric Fronts with Satellite Data using Machine Learning", "summary": "Atmospheric fronts are associated with much of the high-impact weather in the mid-latitudes, yet their identification and classification remain largely manual and subjective. Existing deep learning approaches rely primarily on gridded reanalysis or forecast data, limiting their applicability to satellite observations available for time-critical applications. We introduce SATFRONT, a machine learning framework for detecting cold, warm, and occluded fronts over Europe from geostationary satellite observations, with reanalysis data as an optional additional input. The model is trained on frontal analyses from five European national meteorological services and evaluated against UK Met Office analyses for 2024. Using satellite observations alone, SATFRONT achieves a Critical Success Index (CSI) of 0.428 at a 150 km tolerance, within the range of agreement between analyses from different meteorological services (0.277-0.501) and higher than that of an operational rule-based front detector that uses satellite data (0.133). Adding ERA5 reanalysis increases the CSI to 0.591. ERA5 substantially improves the placement of individual fronts, although its effect on their annual spatial distribution varies by front type. These results demonstrate that cold, warm, and occluded fronts can be detected directly from geostationary satellite observations, providing a basis for automated frontal analyses at the high temporal frequency required for time-critical applications.", "link": "https://arxiv.org/abs/2610.42111", "authors": "Ioannis Dravilas, Miruna Stoicescu, Roope Tervo, Carlos Horn, Oriol Hinojo Comellas, Sina Montazeri, Andrea Meraner, Ana Lucic", "source": "arXiv", "published": "2026-10-30", "first_seen": "2026-11-24T14:57:46+00:00", "score": 45, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.25001", "title": "UtoMe: Observation-Uncertainty-Guided Token Merging for Weather Foundation Models", "summary": "Weather transformers process dense reanalysis fields whose reliability varies across variables, locations, and weather regimes. Token merging can reduce computation, but feature similarity alone does not account for this heterogeneous input uncertainty. We introduce UtoMe, an observation-uncertainty-guided token merging framework that combines dynamics saliency with ensemble data assimilation spread as a relative input-reliability proxy. The resulting importance score protects selected tokens as anchors and calibrates bipartite matching between the remaining tokens. Three variants use external uncertainty at both training and inference, during training only, or neither stage. In ERA5 72-hour forecasting at two spatial resolutions, UtoMe improves Overall error over train-time ToMe at matched token budgets. At $1.40625^\\circ$ and 50% token reduction, UtoMe-E lowers Overall error from 67.32 to 53.00 at the same 0.55x encoder FLOPs. Small reductions remain close to the full-token baseline; larger reductions incur measurable accuracy losses. Component ablations and spatial uncertainty controls support combining dynamics with aligned uncertainty when allocating a weather transformer's token budget.", "link": "https://arxiv.org/abs/2610.25001", "authors": "Yunbei Zhang, Janet Wang, Xi Xiao, Jihun Hamm, Xiao Wang", "source": "arXiv", "published": "2026-10-18", "first_seen": "2026-11-24T14:57:46+00:00", "score": 45, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-9-2809-2016", "title": "LS3MIP (v1.0) contribution to CMIP6: the Land Surface, Snow and Soil moisture Model Intercomparison Project – aims, setup and expected outcome", "summary": "The Land Surface, Snow and Soil Moisture Model Intercomparison Project (LS3MIP) is designed to provide a comprehensive assessment of land surface, snow and soil moisture feedbacks on climate variability and climate change, and to diagnose systematic biases in the land modules of current Earth system models (ESMs). The solid and liquid water stored at the land surface has a large influence on the regional climate, its variability and predictability, including effects on the energy, water and carbon cycles. Notably, snow and soil moisture affect surface radiation and flux partitioning properties, moisture storage and land surface memory. They both strongly affect atmospheric conditions, in particular surface air temperature and precipitation, but also large-scale circulation patterns. However, models show divergent responses and representations of these feedbacks as well as systematic biases in the underlying processes. LS3MIP will provide the means to quantify the associated uncertainties and better constrain climate change projections, which is of particular interest for highly vulnerable regions (densely populated areas, agricultural regions, the Arctic, semi-arid and other sensitive terrestrial ecosystems). The experiments are subdivided in two components, the first addressing systematic land biases in offline mode (“LMIP”, building upon the 3rd phase of Global Soil Wetness Project; GSWP3) and the second addressing land feedbacks attributed to soil moisture and snow in an integrated framework (“LFMIP”, building upon the GLACE-CMIP blueprint).", "link": "https://doi.org/10.5194/gmd-9-2809-2016", "authors": "Bart van den Hurk, Hyungjun Kim, Gerhard Krinner, Sonia I. Seneviratne, Chris Derksen, Taikan Oki, Hervé Douville, Jeanne Colin", "source": "Geoscientific Model Development", "published": "2016-8-24", "first_seen": "2026-11-24T14:57:46+00:00", "score": 45, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0074.1", "title": "Knowledge-guided machine learning for disentangling Pacific sea surface temperature variability across timescales", "summary": "Global weather and climate patterns are strongly influenced by dominant modes of anomalous Pacific sea surface temperature (SST) variability, including the El Niño-Southern Oscillation (ENSO), Pacific Meridional Mode (PMM), and Pacific Decadal Oscillation (PDO). However, disentangling these modes of variability remains challenging due to their spatial overlap and nonlinear coupling, which violate the assumptions of traditional linear methods. We develop a Knowledge-Guided AutoEncoder (KGAE) that uses spatiotemporal constraints and a gradient-based sparsity incentive to identify physically interpretable modes of detrended SST variability, each defined by a single broad characteristic timescale, without the need for predefined temporal filters or thresholds. The KGAE separates ENSO-like modes on 2- and 3–7-year timescales, as well as a decadal mode with characteristics reminiscent of the PDO and PMM, each with distinct spatial patterns. We perturb each latent dimension and use finite differences to characterize the state-independent and state-dependent sensitivities. We demonstrate that the decadal mode modulates ENSO diversity (central versus eastern Pacific) through both interference and nonlinear state dependence, and that a quasibiennial mode interacts with the interannual mode to characterize ENSO onset and decay. We assess the robustness of the KGAEs to random initialization and training stochasticity, to sampling bias induced by a time-stratified cross-validation scheme, and to unseen data (generalization). When applied to climate model output, KGAEs reveal model-speci", "link": "https://doi.org/10.1175/aies-d-25-0074.1", "authors": "Kyle J. C. Hall, Maria J. Molina, Emily F. Wisinski, Gerald A. Meehl, Antonietta Capotondi", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10-26", "first_seen": "2026-11-24T14:57:46+00:00", "score": 45, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ef003632", "title": "Exposure of Global Rail and Road Infrastructures in Future Record‐Breaking Climate Extremes", "summary": "Transport infrastructures built on historical experience are expected to face multiple threats under climate change, especially the continuous interruptive losses and additional maintenance costs caused by more intense or frequent record‐breaking extreme climate events. In this study, we investigated the change in the exposure of global rail and road infrastructures to eight record‐breaking meteorological hazards using the latest Coupled Model Intercomparison Project Phase 6 (CMIP6) climate data, including extreme temperature and extreme precipitation. Our findings suggest that higher extreme heat and increasing thaw‐freezing index ratio pose great threats to global rail and road infrastructures. The expected annual exposures of these two hazards are 4 and 2 times the average exposure level of eight hazards, respectively. Moreover, the exposure rapidly increases due to sharply increasing drought and heavy rain compound events as emissions growth and development accelerate, rising from 7% to 18% in eight hazard exposures. Sustainable and lower radiative forcing pathways would contribute to the exposure mitigation, with the peak exposure of eight hazards under the SSP2‐4.5 and SSP1‐2.6 scenarios averaging 29% and 52% lower, respectively, than that under the SSP3‐7.0, which is an extreme scenario we may be on track for under current global efforts. However, the fact that most areas will still be affected by multiple hazards is probably unavoidable. Thus, in parallel with global efforts to reduce greenhouse gas emissions, we recommend that the transport sector incorporate local", "link": "https://doi.org/10.1029/2023ef003632", "authors": "Qianzhi Wang, Kai Liu, Ming Wang, Elco Koks, Haizhong Wang", "source": "Earth's Future", "published": "2024-1", "first_seen": "2026-11-24T14:57:46+00:00", "score": 45, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-025-01055-3", "title": "Dynamically downscaled seasonal heat wave projections in the CONUS", "summary": "", "link": "https://doi.org/10.1038/s41612-025-01055-3", "authors": "Hannah J. Rubin, Leyuan Zhang, Joshua S. Fu, Deeksha Rastogi, Shih-Chieh Kao, Moetasim Ashfaq", "source": "npj Climate and Atmospheric Science", "published": "2025-6-19", "first_seen": "2026-11-24T14:57:46+00:00", "score": 45, "topics": ["Downscaling"], "watch": [], "boosts": [], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-018-0027-7", "title": "Evaluation of heat wave forecasts seamlessly across subseasonal timescales", "summary": "We develop an extreme heat validation approach for medium-range forecast models and apply it to the NCEP coupled forecast model, for which we also attempt to diagnose sources of poor forecast skill. A weighting strategy based on the Poisson function is developed to provide a seamless transition from short-term day-by-day weather forecasts to expanding time means across subseasonal timescales. The skill of heat wave forecasts over the conterminous United States is found to be rather insensitive to the choice of skill metric; however, forecast skill does display spatial patterns that vary depending on whether daily mean, minimum, or maximum temperatures are the basis of the heat wave metric. The NCEP model fails to persist heat waves as readily as is observed. This inconsistency worsens with longer forecast lead times. Land–atmosphere feedbacks appear to be a stronger factor for heat wave maintenance at southern latitudes, but the NCEP model seems to misrepresent those feedbacks, particularly over the Southwest United States, leading to poor skill in that region. The NCEP model also has unrealistically weak coupling over agricultural areas of the northern United States, but this does not seem to degrade model skill there. Overall, we find that the Poisson weighting strategy combined with a variety of deterministic and probabilistic skill metrics provides a versatile framework for validation of dynamical model heat wave forecasts at subseasonal timescales.", "link": "https://doi.org/10.1038/s41612-018-0027-7", "authors": "Trent W. Ford, Paul A. Dirmeyer, David O. Benson", "source": "npj Climate and Atmospheric Science", "published": "2018-10-15", "first_seen": "2026-11-24T14:57:46+00:00", "score": 45, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-020-05332-0", "title": "Model uncertainties in climate change impacts on Sahel precipitation in ensembles of CMIP5 and CMIP6 simulations", "summary": "The impact of climate change on Sahel precipitation suffers from large uncertainties and is strongly model-dependent. In this study, we analyse sources of inter-model spread in Sahel precipitation change by decomposing precipitation into its dynamic and thermodynamic terms, using a large set of climate model simulations. Results highlight that model uncertainty is mostly related to the response of the atmospheric circulation to climate change (dynamic changes), while thermodynamic changes are less uncertain among climate models. Uncertainties arise mainly because the models simulate different shifts in atmospheric circulation over West Africa in a warmer climate. We linked the changes in atmospheric circulation to the changes in Sea Surface Temperature, emphasising that the Northern hemispheric temperature gradient is primary to explain uncertainties in Sahel precipitation change. Sources of Sahel precipitation uncertainties are shown to be the same in the new generation of climate models (CMIP6) as in the previous generation of models (CMIP5).", "link": "https://doi.org/10.1007/s00382-020-05332-0", "authors": "Paul-Arthur Monerie, Caroline M. Wainwright, Moussa Sidibe, Akintomide Afolayan Akinsanola", "source": "Climate Dynamics", "published": "2020-6-20", "first_seen": "2026-11-24T14:57:46+00:00", "score": 45, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "uncertainty"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-24-0207.1", "title": "Forecasting Meridional Swings of the Mei-Yu Rain Belt and Western Pacific Subtropical High During 2020 Summer Extreme Flood", "summary": "The persistent extreme rainfall along the mei-yu front, as a pivotal weather phenomenon in East Asia in the boreal summer, often triggers devastating flood disasters. Notably, during June–July 2020 (JJ2020), the superheavy mei-yu rain belt exhibited pronounced meridional swings, rather than extreme precipitation intensity or duration, but this has received less attention in the literature. This study first identifies the latitudinal location of the rain belt (LLR) during the 2020 mei-yu season and then examines its relationship with the ridge line of the western Pacific subtropical high (WPSH-RL) and further evaluates its forecasting, utilizing real-time forecasts from the Global Ensemble Prediction System of the European Centre for Medium-Range Weather Forecasts (ECMWF-GEPS). We demonstrate that the LLR has a strong correlation with the WPSH-RL 2 days earlier during JJ2020 and the ECMWF-GEPS exhibits considerable performance in predicting the meridional swings of both the LLR and WPSH-RL though the prediction skills tend to decrease slightly when removing their seasonal northward migrations. These clearly indicate the ECMWF-GEPS’s good capability of capturing their synoptic and intraseasonal meridional swings and emphasize the importance of the WPSH-RL in forecasting the LLR. Moreover, for the short- and medium-term forecasts, the range between the 25% and 75% percentiles of ensemble members can well predict the recurring meridional swings in both the LLR and WPSH-RL. Therefore, a probabilistic forecast approach incorporating the ensemble range could provide a more skillfu", "link": "https://doi.org/10.1175/waf-d-24-0207.1", "authors": "Zuosen Zhao, Li Gao, Hong-Li Ren", "source": "Weather and Forecasting", "published": "2025-9", "first_seen": "2026-11-24T14:57:46+00:00", "score": 45, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-25-0128.1", "title": "A Multimodel, Multischeme Evaluation of Scale-Aware Convective Parameterization for Gray-Zone Tropical Cyclone Simulation over the South China Sea", "summary": "Gray-zone tropical cyclone (TC) simulations, in which convection is partially resolved and partially parameterized at grid spacings of approximately 3–15 km, are sensitive to how grid spacing changes across adaptive meshes. This study evaluates three scale-aware convective parameterization schemes (CPS), the Grell–Freitas (GF), Multiscale Kain–Fritsch (MSKF), and new Tiedtke (NTDK), across regional [Weather Research and Forecasting (WRF) Model] and global [Model for Prediction Across Scales (MPAS), ClusterTech Platform for Atmospheric Simulation (CPAS)] models for TC simulation over the South China Sea. Twenty-seven simulations spanning three TC cases (category-2–5 intensity, including single-TC and binary interaction scenarios) are verified against observations. While domain-averaged precipitation differs by only 10%–20% across models, the convective rain ratio (CRR, the fraction of total precipitation produced by the CPS) shows that models achieve similar rainfall through different convective partitionings. Across the 27 simulations, CPS choice accounts for 44% of CRR variance, compared with 29% for the model framework and 16% for the selected TC case. CRR differences are largest in the gray zone, ranging from 30% to over 90% across schemes. Both global models exhibit midlevel drying relative to WRF regardless of CPS choice. This deficit may partly reflect differences in large-scale moisture constraints between regional and global model frameworks. CPAS’s adaptive mesh partially restores outer rainband precipitation relative to MPAS but introduces discontinuities where gr", "link": "https://doi.org/10.1175/waf-d-25-0128.1", "authors": "Yue Zheng, Chi-Yung Tam, Xing Yu, Jianying Jiang, Wai-Pang Sze, Chi-Chiu Cheung", "source": "Weather and Forecasting", "published": "2026-11", "first_seen": "2026-11-24T14:57:46+00:00", "score": 45, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-24-0187.1", "title": "Center Fixing of Tropical Cyclones Using Uncertainty-Aware Deep Learning Applied to High-Temporal-Resolution Geostationary Satellite Imagery", "summary": "Determining the location of a tropical cyclone’s (TC) surface circulation center—“center fixing”—is a critical first step in the TC-forecasting process, affecting current/future estimates of track, intensity, and structure. Despite a recent increase in automated center-fixing methods, only one such method [Automated Rotational Center Hurricane Eye Retrieval, version 2 (ARCHER-2)] is operational, and its best performance is achieved when using microwave or scatterometer data, which are often unavailable. We develop a deep learning algorithm called GeoCenter; besides a few scalars in the operational Automated Tropical Cyclone Forecasting System, it relies only on geostationary infrared (IR) satellite imagery, which is available for all TC basins at high frequency (10 min) and low latency (<10 min) during both day and night. GeoCenter ingests an animation (time series) of IR images, including nine channels at lag times up to 4 h. The animation is centered at a “first guess” location, offset from the true TC-center location by 48 km on average and sometimes >100 km; GeoCenter is tasked with correcting this offset. On an independent testing dataset, GeoCenter achieves a mean/median/root-mean-square (RMS) error of 26.6/22.2/32.4 km for all systems, 24.7/20.8/30.0 km for tropical systems, and 14.6/12.5/17.3 km for category 2–5 hurricanes, respectively. These values are similar to ARCHER-2 errors with microwave or scatterometer data and better than ARCHER-2 errors when only IR data are available. GeoCenter also performs skillful uncertainty quantification, producing a well-calibrat", "link": "https://doi.org/10.1175/waf-d-24-0187.1", "authors": "Ryan Lagerquist, Galina Chirokova, Robert DeMaria, Mark DeMaria, Imme Ebert-Uphoff", "source": "Weather and Forecasting", "published": "2026-2", "first_seen": "2026-11-24T14:57:46+00:00", "score": 45, "topics": ["Deep Learning"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.04270", "title": "From Sea Surface Height to Velocity - A Machine Learning Approach", "summary": "Inferring upper-ocean velocity from altimetric sea surface height (SSH) remains challenging below 50~km, scales now resolved by the Surface Water and Ocean Topography (SWOT) mission. Conventional methods rely on geostrophic or cyclogeostrophic balance. Here, we demonstrate that deep learning can predict the full velocity vector from SSH and environmental data and recover derivative-based diagnostics, including spectral energy flux. We trained a U-Net encoder--decoder on hourly fields from the pre-SWOT Cape Basin extraction of the LLC4320 ocean simulation, with 1.5-km grid spacing ($11.8$--$15.8^\\circ$E, $41$--$45^\\circ$S). Inputs were SSH, sea surface temperature (SST), and wind stress; targets were horizontal velocities at the surface and 50~m, where wind influence is weaker. At 50~m, the best model achieves a speed RMSE of $0.049\\,\\mathrm{m\\,s^{-1}}$, 29% lower than the geostrophic approximation. Predicted relative vorticity has a correlation of 0.93, compared with 0.75 for the geostrophic approximation. The model also recovers divergence with a correlation of 0.66, whereas geostrophic velocity is nondivergent by definition. Tests of training strategies yield four findings: SSH gradients outperform raw SSH as inputs; wind stress is the most useful covariate for total velocity prediction; SST benefits vary seasonally; and including vorticity and divergence in the loss improves accuracy. These results offer a path for transferring high-fidelity simulation physics to SWOT applications, where kilometer-scale SSH snapshots contain superposed balanced and unbalanced signals.", "link": "https://arxiv.org/abs/2611.04270", "authors": "Yaswanth Reddy Yaradoddi, Jinbo Wang, Elyes Serghine", "source": "arXiv", "published": "2026-11-03", "first_seen": "2026-11-24T14:57:46+00:00", "score": 44, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-12-4823-2019", "title": "The Canadian Earth System Model version 5 (CanESM5.0.3)", "summary": "The Canadian Earth System Model version 5 (CanESM5) is a global model developed to simulate historical climate change and variability, to make centennial-scale projections of future climate, and to produce initialized seasonal and decadal predictions. This paper describes the model components and their coupling, as well as various aspects of model development, including tuning, optimization, and a reproducibility strategy. We also document the stability of the model using a long control simulation, quantify the model's ability to reproduce large-scale features of the historical climate, and evaluate the response of the model to external forcing. CanESM5 is comprised of three-dimensional atmosphere (T63 spectral resolution equivalent roughly to 2.8 ∘ ) and ocean (nominally 1 ∘ ) general circulation models, a sea-ice model, a land surface scheme, and explicit land and ocean carbon cycle models. The model features relatively coarse resolution and high throughput, which facilitates the production of large ensembles. CanESM5 has a notably higher equilibrium climate sensitivity (5.6 K) than its predecessor, CanESM2 (3.7 K), which we briefly discuss, along with simulated changes over the historical period. CanESM5 simulations contribute to the Coupled Model Intercomparison Project phase 6 (CMIP6) and will be employed for climate science and service applications in Canada.", "link": "https://doi.org/10.5194/gmd-12-4823-2019", "authors": "Neil C. Swart, Jason N. S. Cole, Viatcheslav V. Kharin, Mike Lazare, John F. Scinocca, Nathan P. Gillett, James Anstey, Vivek Arora", "source": "Geoscientific Model Development", "published": "2019-11-25", "first_seen": "2026-11-24T14:57:46+00:00", "score": 44, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-17-7915-2024", "title": "Do data-driven models beat numerical models in forecasting weather extremes? A comparison of IFS HRES, Pangu-Weather, and GraphCast", "summary": "The last few years have witnessed the emergence of data-driven weather forecast models capable of competing with – and, in some respects, outperforming – physics-based numerical models. However, recent studies have questioned the capability of data-driven models to provide reliable forecasts of extreme events. Here, we aim to evaluate this claim by comparing the performance of leading data-driven models in a semi-operational setting, focusing on the prediction of near-surface temperature and wind speed extremes globally. We find that data-driven models mostly outperform ECMWF’s physics-based deterministic model in terms of global RMSE for forecasts made 1–10 d ahead and that they can also compete in terms of extreme weather predictions in most regions. However, the performance of data-driven models varies by region, type of extreme event, and forecast lead time. Notably, data-driven models appear to perform best for temperature extremes in regions closer to the tropics and at shorter lead times. We conclude that data-driven models may already be a useful complement to physics-based forecasts in regions where they display superior tail performance but note that some challenges still need to be overcome prior to operational implementation.", "link": "https://doi.org/10.5194/gmd-17-7915-2024", "authors": "Leonardo Olivetti, Gabriele Messori", "source": "Geoscientific Model Development", "published": "2024-11-7", "first_seen": "2026-11-24T14:57:46+00:00", "score": 44, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0121.1", "title": "On the Effective Resolution of AI Weather Prediction Models", "summary": "In this study, we investigate the effective resolution of deterministic artificial intelligence (AI) weather prediction models. We find that an ideal, perfectly trained AI model approximately follows the mean of the forecast distribution for the range of lead times used in the loss function during training. We demonstrate the consequences and limitations of this result with forecast data from several AI models, including Aurora, Pangu, GraphCast, and GenCast, and we compare them to ensemble and deterministic forecasts from the “physics-based” model of the European Centre for Medium-Range Weather Forecasts. We further demonstrate the impact of the resolution on mean-square error scores and suggest a simple method for a fairer comparison of two models with different effective resolution.", "link": "https://doi.org/10.1175/aies-d-25-0121.1", "authors": "Tobias Selz, Anna Allen, Wessel P. Bruinsma, George C. Craig, Stratis Markou, Richard E. Turner", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 44, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2025ms005609", "title": "Downscaling HRRR Radiation for Distributed Snow Modeling: Part 2—Topographic Correction of Incoming Longwave and Evaluation of Combined Radiation Updates", "summary": "The spatially distributed, process‐based snow model iSnobal is a longstanding research model that is widely used in the Western United States. The model has undergone development to be forced with outputs from the High‐Resolution Rapid Refresh (HRRR) numerical weather prediction model. However, the longwave radiation forcing remains internally prepared, with incoming longwave parameterized using empirical relationships that do not fully represent interactions in mountainous terrain. To unify model inputs, in this second paper of a two‐part series, incoming longwave radiation from HRRR is downscaled and adjusted for topography to inform the incoming longwave forcing in iSnobal. Evaluation in the East River Watershed, Colorado, during water years 2022–2023 shows that, relative to the traditional treatment of incoming longwave, this update reduces RMSE on average by 36.6–44.5 Wm −2 at measurement sites. Basin‐wide, when combined with the shortwave radiation updates from Part 1, the net radiative balance increased by +3 Wm −2 , due to reduction in net solar radiation (−34 Wm −2 ) and increase in net longwave radiation (+37 Wm −2 ). These changes lengthened the snow melt‐out date bias at in situ observation sites by 5–9 days, preserving the spatial variability of modeled snow depth across the watershed. The combined updates align radiation forcings with other model forcings, improve the ability of iSnobal to model processes contributing to radiative heterogeneity in complex terrain, and maintain accurate predictions of snowmelt in mountain watersheds for both research and operat", "link": "https://doi.org/10.1029/2025ms005609", "authors": "Alvaro Robledano, Matthew Olson, Joachim Meyer, J. Michelle Hu, S. McKenzie Skiles", "source": "Journal of Advances in Modeling Earth Systems", "published": "2026-11", "first_seen": "2026-11-24T14:57:46+00:00", "score": 44, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/jame.20013", "title": "Why is it so difficult to represent stably stratified conditions in numerical weather prediction (NWP) models?", "summary": "In the 1990s, scientists at European Centre for Medium‐Range Weather Forecasts (ECMWF) suggested that artificially enhancing turbulent diffusion in stable conditions improves the representation of two important aspects of weather forecasts, i.e., near‐surface temperatures and synoptic cyclones. Since then, this practice has often been used for tuning the large‐scale performance of operational numerical weather prediction (NWP) models, although it is widely recognized to be detrimental for an accurate representation of stable boundary layers. Here we investigate why, 20 years on, such a compromise is still needed in the ECMWF model. We find that reduced turbulent diffusion in stable conditions improves the representation of winds in stable boundary layers, but it deteriorates the large‐scale flow and the near‐surface temperatures. This suggests that enhanced diffusion is still needed to compensate for errors caused by other poorly represented processes. Among these, we identify the orographic drag, which influences the large‐scale flow in a similar way to the turbulence closure for stable conditions, and the strength of the land‐atmosphere coupling, which partially controls the near‐surface temperatures. We also take a closer look at the relationship between the turbulence closure in stable conditions and the large‐scale flow, which was not investigated in detail with a global NWP model. We demonstrate that the turbulent diffusion in stable conditions affects the large‐scale flow by modulating not only the strength of synoptic cyclones and anticyclones, but also the amplitud", "link": "https://doi.org/10.1002/jame.20013", "authors": "Irina Sandu, Anton Beljaars, Peter Bechtold, Thorsten Mauritsen, Gianpaolo Balsamo", "source": "Journal of Advances in Modeling Earth Systems", "published": "2013-4-2", "first_seen": "2026-11-24T14:57:46+00:00", "score": 44, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-017-3609-x", "title": "Rain-on-snow events over North America based on two Canadian regional climate models", "summary": "", "link": "https://doi.org/10.1007/s00382-017-3609-x", "authors": "Dae Il Jeong, Laxmi Sushama", "source": "Climate Dynamics", "published": "2017-3-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 44, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/1520-0493(1999)127<0341:asislr>2.0.co;2", "title": "A Semi-Implicit Semi-Lagrangian Regional Climate Model: The Canadian RCM", "summary": "", "link": "https://doi.org/10.1175/1520-0493(1999)127<0341:asislr>2.0.co;2", "authors": "Daniel Caya, René Laprise", "source": "Monthly Weather Review", "published": "1999-3", "first_seen": "2026-11-24T14:57:46+00:00", "score": 44, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-25-0156.1", "title": "A Bias Correction Approach for Extreme Heat Event Forecasts over Complex Terrain", "summary": "With the intensification of global warming, the Sichuan-Chongqing region of China has experienced a growing incidence of heat waves and associated disasters. However, due to complex topographic conditions, model-based early warning capabilities remain inadequate, particularly on the sub-seasonal to seasonal (S2S) scale. In this study, we analyze the prediction skills of five S2S models (CMA, ECCC, ECMWF, NCEP and UKMO). Additionally, focusing on models that demonstrate superior skills in forecasting summer daily maximum air temperature (Tmax), we develop a set of bias correction approaches and conduct a comprehensive evaluation on them. Results indicate that the CMA performs best overall, particularly in predicting heat events, while the ECMWF shows better capability to capture the temporal variability of daily Tmax among the five models. Forecast errors of both models exhibit notable sensitivity to terrain features and are correlated with El Niño-Southern Oscillation (ENSO) variations. The quantile mapping bias correction method that integrates complex topography, ENSO phases, and model forecast attributes reliably improves the forecast skill of both CMA and ECMWF in the SCR, whether in hindcast or independent validation. It can help ECMWF to successfully capture heat events that were widely missed in the original forecasts. Furthermore, it delivers effective improvement in forecast accuracy of the two models for extreme heat waves in August 2006 and 2022.", "link": "https://doi.org/10.1175/waf-d-25-0156.1", "authors": "Yumeng Zhou, Yishu Pang, Jie Wu, Changyan Zhou, Yue Wu, Yu Luo", "source": "Weather and Forecasting", "published": "2026-11-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 44, "topics": ["Downscaling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.49707934202", "title": "Monsoon seasonal forecasting", "summary": "", "link": "https://doi.org/10.1002/qj.49707934202", "authors": "Charles Normand", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "1953-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 44, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["monsoon"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2026.10072", "title": "Deep learning for the detection of melt ponds on sea ice from airborne infrared images", "summary": "Melt ponds are puddles of water on Arctic summer sea ice that play an important role in the Arctic climate system, mainly through their influence on the surface energy balance. The albedo of polar oceans is primarily determined by the area fractions of sea ice and darker open ocean. However, the presence of melt ponds also significantly reduces the reflective properties of sea ice. This allows more solar energy to be absorbed, accelerating regional ice melt in a phenomenon known as ice-albedo feedback. Despite their importance, there is a lack of observational datasets that explicitly parameterize melt ponds next to sea ice and open water, and the existing data are mainly based on optical imagery. In this study, we present a new helicopter-borne dataset based on (TIR) and employ a deep learning-based semantic segmentation approach to classify surface types (melt ponds, sea ice, and open water). We evaluate the performance of several model architectures: U-Net, UNet++, PSPNet, DeepLabV3+, SwinTransformer, SAM2-UNet, and AutoSAM. Among these models, UNet++ pre-trained on the AID dataset demonstrates the highest performance, achieving a melt pond (IoU) of 0.486, a sea ice IoU of 0.764, and an open water IoU of 0.660. Furthermore, we apply the most effective model to the datasets of five helicopter flights, resulting in (MPF) estimates with a bias of approximately 11%, which is higher than for melt pond classifications based on visible observations.", "link": "https://doi.org/10.1017/eds.2026.10072", "authors": "Marlena Reil, Gunnar Spreen, Marcus Huntemann, Lena Buth, Dennis G. Wilson", "source": "Environmental Data Science", "published": "2026", "first_seen": "2026-11-24T14:57:46+00:00", "score": 44, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.39592", "title": "Operator-Aware Posterior Sampling for Multivariate Weather Downscaling", "summary": "Statistical downscaling is the task of reconstructing high-resolution meteorological fields from coarse inputs. A principled approach formulates downscaling as a Bayesian inverse problem, using a diffusion prior over high-resolution fields and incorporating the coarse field only at inference through a likelihood. This decouples the prior from the coarse source, allowing one pretrained model to adapt to different sources. However, two challenges limit this flexibility: (1) when coarse and target fields come from different reanalysis systems, no fixed coarsening operator can capture their relationship; and (2) guidance gradients can differ by orders of magnitude across variables, making a single guidance strength ineffective. This paper addresses both challenges within the guidance loop, leaving the prior unchanged. We learn the forward operator from paired data and normalize the gradient per channel. We show that this normalization corresponds to steepest descent under a block-max norm, allowing a single guidance strength across variables. Our code is publicly available at https://github.com/CarloSaccardi/operator-aware-weather-downscaling.", "link": "https://arxiv.org/abs/2610.39592", "authors": "Carlo Saccardi, Rudolf Saathof, Geethu Joseph, Justin Dauwels", "source": "arXiv", "published": "2026-10-29", "first_seen": "2026-11-24T14:57:46+00:00", "score": 43, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41598-026-73361-6", "title": "A physics guided hybrid modeling framework for rainfall runoff forecasting in data scarce regions", "summary": "Rainfall-runoff (R-R) forecasting in data-scarce regions remains challenging due to limited hydrometeorological observations, uncertainties in satellite-based precipitation products (SPPs), and t ": "Early warning of meteorological drought in Morocco’s Atlas mountains: a multi-paradigm benchmark of satellite-augmented deep learning and tree-based models", "summary": "Meteorological drought monitoring in Morocco’s High Atlas and Anti-Atlas Mountains remains reactive, yet few predictive studies have combined satellite observations with spatiotemporal deep learning in mountainous terrain. We develop a Convolutional Gated Recurrent Unit (ConvGRU) framework to forecast the 6-month Standardized Precipitation Index (SPI-6) across the High Atlas and Anti-Atlas at 1- to 3-month lead times. The model ingests 18 input channels combining CHIRPS precipitation, ERA5-Land reanalysis fields, satellite-derived NDVI, and static terrain features over a 115 × 210-pixel domain at 5.5 km resolution, with a strict leakage-free temporal split. At a 1-month lead, the ConvGRU and a non-spatial gradient-boosted ensemble (XGBoost) achieved nearly equal forecast accuracy (RMSE = 0.696 and 0.698, respectively), with the ConvGRU improving on damped persistence by 11.8% (Diebold-Mariano p = 0.003) and ridge regression by 9.7% (RMSE = 0.771). The added architectural complexity of spatiotemporal deep learning did not translate into superior forecast skill in this data regime, with the non-spatial gradient-boosted ensemble matching the convolutional models across horizons. In a test-period evaluation of the severe April 2024 drought (92% of the area affected), both the spatiotemporal and non-spatial models recovered most of the drought extent one month in advance (ConvGRU 81%, XGBoost 94%), far exceeding the 29% recovered by damped persistence. As the forecast horizon extends to two and three months, predictive skill across all architectures decays rapidly toward the bas", "link": "https://doi.org/10.1007/s00704-026-06633-w", "authors": "Nacer Aderdour, M. Maanan, H. Rueff, H. Rhinane", "source": "Theoretical and Applied Climatology", "published": "2026-10-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 81, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1109/jstars.2026.3738080", "title": "Geo-ARD: A Hybrid ARDB-Guided Residual Diffusion Model for Geospatial Wind Field Super-Resolution", "summary": "High-resolution (HR) ocean wind field data is undamental to meteorology and oceanography, yet satellite-derived products (e.g., OCN) are spatiotemporally sparse. Conversely, reanalysis data (e.g., ERA5) offers global, hourly coverage but at a coarse low-resolution (LR), suffering from systematic bias and an inability to resolve fine-scale structures. To bridge this data gap, we propose geospatial attention-based residual dense block (ARDB)-guided residual diffusion (Geo-ARD), a novel 5× super-resolution framework that generates high-fidelity 0.05$^\\circ$ wind fields from 0.25$^\\circ$ inputs. Our framework introduces a two-stage approach to systematically address both domain bias and resolution enhancement. First, a pretrained alignment network, optimized with a hybrid regression and contrastive loss, maps the biased LR ERA5 data into an aligned feature space consistent with HR OCN observations. Second, the core of our model is a guided diffusion process conditioned on a novel ARDB. This hybrid CNN–Transformer conditioner embeds efficient self-attention mechanisms directly within its dense blocks, enabling it to capture both the local textures and the critical long-range spatial dependencies inherent in global wind fields. The denoising diffusion model is then tasked with a simplified objective: generating only the high-frequency residual within an analytically defined latent space, allowing it to focus entirely on fine-detail synthesis. To optimize for high-impact events, the framework is trained with a compound loss, featuring a novel quadratically weighted L1 diffusion lo", "link": "https://doi.org/10.1109/jstars.2026.3738080", "authors": "Yun Zhang, Hao-Tian Cai, Jia-Ning Liang, Wen-Bo Zhang, Shu-Hu Yang, Yan-Ling Han, Bo Peng, Xiao-Wei Wan", "source": "IEEE Journal of Selected Topics in Applied Earth Observations and Remote Sensing", "published": "2026", "first_seen": "2026-11-24T14:57:46+00:00", "score": 80, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["india", "diffusion model"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.5194/isprs-archives-l-4-w2-2026-139-2026", "title": "AI-Based Framework for Urban Climate Downscaling: A Case Study of Sofia", "summary": "With the increasing availability of powerful computational resources and artificial intelligence (AI), a data-driven approach has been gaining attention in atmospheric science, particularly in downscaling/emulating research. For example, Convolutional Neural Networks (CNNs) are used to emulate fine-resolution climate data fields by physics-based models. Although CNN-based downscaling has shown good performance for air temperature across various climate scales, studies at the urban scale remain limited due to the scarcity of long-term high-resolution climate data that can represent local urban effects. This study explores whether CNNs can accurately downscale/emulate urban-scale temperature distributions, with a focus on the urban heat island (UHI), using 250 m resolution Weather Research and Forecasting (WRF) simulation data over Sofia, Bulgaria, as training data. Input features, including air temperature, wind components, surface solar radiation, and elevation, are used, and their impacts on targeted 250 m resolution air temperature are evaluated. The results show that, while the CNN-based approach shows promise in generating urban-scale temperature distributions, the selection/combination of input features influences downscaling performance. Warm bias exceeding +2.00 °C was almost eliminated by including all input features. The downscaled result emulated the broad spatial pattern. However, detailed spatial and temporal variability, such as UHI, was still not captured. These findings revealed that the input feature selection can influence CNN-based temperature downscaling,", "link": "https://doi.org/10.5194/isprs-archives-l-4-w2-2026-139-2026", "authors": "Koki Nakamura, L. Vitanova, Q. Doan, D. Petrova-Antonova", "source": "The International Archives of the Photogrammetry, Remote Sensing and Spatial Information Sciences", "published": "2026-09-28", "first_seen": "2026-11-24T14:57:46+00:00", "score": 79, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.3390/rs18213665", "title": "A Comparative Study of Deep Learning Architectures for Multi-Source Precipitation Data Fusion Towards Daily Precipitation Estimation in the Yellow River Basin, China", "summary": "Accurate precipitation estimation is crucial for water management and flood reconstructions, yet remains challenging due to sparse ground observations and systematic satellite biases. Despite the rise of deep learning in multi-source fusion, controlled comparisons under a unified framework remain scarce, and the roles of window size and precipitation product combinations remain underexplored. This study evaluated five deep learning architectures, namely 1D CNN, 2D CNN, 1D–2D CNN, 3D CNN, and Transformer, for fusing three precipitation products (IMERG, MSWEP, and ERA5-Land) to estimate station-scale daily precipitation in the Yellow River Basin, China. Results showed that deep learning models consistently outperformed individual products, weighting methods, and machine learning methods, with Transformer achieving the best overall performance, followed by 3D CNN; MSWEP led the standalone products. Spatial improvements were more pronounced in densely gauged areas, but Transformer also performed well in the sparse western regions. All products and fusion models tended to overestimate no-rain and light-rain events and underestimate moderate-to-heavy, and extreme events, with Transformer yielding the largest reductions in conditional RMSE and BIAS for heavy and extreme events. Enlarging the spatial or temporal window individually improved performance, and combining both worked even better. Ablation experiments revealed that IMERG contributed little unique information, whereas incorporating more products generally improved Transformer performance. Overall, Transformer demonstrated", "link": "https://doi.org/10.3390/rs18213665", "authors": "Mei-Xia Xie, Z. Di, Sheng-Lei Zhang, Xu-Rui Wang", "source": "Remote Sensing", "published": "2026-10-26", "first_seen": "2026-11-24T14:57:46+00:00", "score": 79, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1029/2025wr042530", "title": "In the Age of AI—Are National Models and Data Sets Still Important for Stream Flow Prediction?", "summary": "Accurate streamflow prediction is critical for effective water resource management, and recent advances in deep learning and multi‐basin data sets have significantly improved model skill. Global deep‐learning models, trained on thousands of catchments have demonstrated strong generalization across diverse climates and continents. However, these models rely solely on globally available meteorological inputs, potentially overlooking the value of nationally developed data sets with enhanced regional accuracy. In this study, we assess the benefit of using Canada's high‐resolution national reanalysis data set (CaSR) in long short‐term memory (LSTM) models for streamflow prediction. We compare model performance using different meteorological forcings, global (ERA5‐Land), continental (Daymet), national (CaSR), and a combined “Complete” model, across over 1,000 Canadian stream gauges. Model performance is evaluated using the Nash–Sutcliffe Efficiency (NSE), Kling‐Gupta Efficiency (KGE) and related metrics. We also benchmark our best‐performing model against Google's global LSTM streamflow model at 412 Canadian gauges. Results show that national‐scale deep‐learning models using CaSR outperforms deep‐learning models using only global or continental inputs. The Complete model achieved the highest performance, with a median KGE 0.886−exceeding the 0.839 achieved by Google's global model within Canada. These findings suggest that nationally trained models using a wide array of inputs, including national meteorological data sets, can outperform state‐of‐the‐art global deep‐learning model", "link": "https://doi.org/10.1029/2025wr042530", "authors": "Brett Snider, E. Roshani", "source": "Water Resources Research", "published": "2026-10-01", "first_seen": "2026-11-24T14:57:46+00:00", "score": 79, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1088/2515-7620/aeba46", "title": "Centenary evolution of rainfall datasets: a comprehensive review of gauge, radar satellite, and physics-guided machine learning-based products", "summary": "Accurate precipitation data are crucial for understanding hydroclimatic processes to support water resource management and disaster risk reduction. This study presents a systematic review of rainfall datasets from the early 20th century to the present, emphasizing the roles of artificial intelligence (AI) and machine learning (ML) in precipitation estimation. Unlike prior reviews that primarily catalog global precipitation datasets or examine individual ML applications, this synthesis jointly traces observing-system evolution and evaluates when ML adds demonstrable value relative to named conventional baselines. The evolution of datasets is categorized into four overlapping phases: (i) gauge-based observations, (ii) ground-based weather radar quantitative precipitation estimation (iii) satellite-era products, and (iv) modern multi-source and AI-enhanced datasets. Early gauge-based datasets, provide long-term climate records vital for historical analysis, though they are limited by sparse spatial coverage and interpolation uncertainties. Ground-based radar networks added repeated kilometer-scale mapping of storm structure, although reflectivity-to-rainfall conversion and gauge adjustment introduce their own errors. The satellite era, marked by missions such as Tropical Rainfall Measuring Mission and global precipitation measurement, has significantly improved precipitation monitoring by providing near-global coverage with higher spatial and temporal resolution. However, these datasets still face challenges related to systematic biases and the representation of extreme events", "link": "https://doi.org/10.1088/2515-7620/aeba46", "authors": "D. P., S. Devaraj, A. K, Sowmya H. N., Kavana S, Shruthi R, A. G, Anu S. Patil", "source": "Environmental Research Communications", "published": "2026-11-01", "first_seen": "2026-11-24T14:57:46+00:00", "score": 75, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": ["precipitation", "extreme", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling:
