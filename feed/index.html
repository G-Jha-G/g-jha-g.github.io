 stations. On these datasets OAT outperforms several baselines and shows well calibrated predictions. In an illustrative case study, OAT's downscaling capabilities are demonstrated by downscaling ERA5 (~31km) to COSMO (1km), where OAT achieves lower mean absolute error (MAE) and CRPS for temperature and precipitation on test stations compared to COSMO.", "link": "https://arxiv.org/abs/2610.28327", "authors": "Christian Donner, Michele Cattaneo, Maxim Samarin, Francesco Zanetta, Icíar Lloréns Jover, Gabriela Aznar Siguan, Michele Volpi", "source": "arXiv", "published": "2026-10-20", "first_seen": "2026-11-24T14:57:46+00:00", "score": 58, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2512.18815", "title": "Controllable Probabilistic Forecasting with Stochastic Decomposition Layers", "summary": "AI weather prediction ensembles with latent noise injection and optimized with the continuous ranked probability score (CRPS) have produced both accurate and well-calibrated predictions with far less computational cost compared with diffusion-based methods. However, current CRPS ensemble approaches vary in their training strategies and noise injection mechanisms, with most injecting noise globally throughout the network via conditional normalization. This structure increases training expense and limits the physical interpretability of the stochastic perturbations. We introduce Stochastic Decomposition Layers (SDL) for converting deterministic machine learning weather models into probabilistic ensemble systems. Adapted from StyleGAN's hierarchical noise injection, SDL applies learned perturbations at three decoder scales through latent-driven modulation, per-pixel noise, and channel scaling. When applied to WXFormer via transfer learning, SDL requires less than 2\\% of the computational cost needed to train the baseline model. Each ensemble member is generated from a compact latent tensor (5 MB), enabling perfect reproducibility and post-inference spread adjustment through latent rescaling. Evaluation on 2022 ERA5 reanalysis shows ensembles with spread-skill ratios approaching unity and rank histograms that progressively flatten toward uniformity through medium-range forecasts, achieving calibration competitive with operational IFS-ENS. Multi-scale experiments reveal hierarchical uncertainty: coarse layers modulate synoptic patterns while fine layers control mesoscale variabi", "link": "https://arxiv.org/abs/2512.18815", "authors": "John S. Schreck, William E. Chapman, Charlie Becker, David John Gagne, Dhamma Kimpara, Nihanth Cherukuru, Judith Berner, Kirsten J. Mayer", "source": "arXiv", "published": "2025-12-21", "first_seen": "2026-11-24T14:57:46+00:00", "score": 58, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2511.22610", "title": "Super-resolution of satellite-derived SST data via Generative Adversarial Networks", "summary": "In this work, we address the super-resolution problem of satellite-derived sea surface temperature (SST) using deep generative models. Although standard gap-filling techniques are effective in producing spatially complete datasets, they inherently smooth out fine-scale features that may be critical for a better understanding of the ocean dynamics. We investigate the use of deep learning models as Autoencoders (AEs) and generative models as Conditional-Generative Adversarial Networks (C-GANs), to reconstruct small-scale structures lost during interpolation. Our supervised -- model free -- training is based on SST observations of the Mediterranean Sea, with a focus on learning the conditional distribution of high-resolution fields given their low-resolution counterparts. We apply a tiling and merging strategy to deal with limited observational coverage and to ensure spatial continuity. Quantitative evaluations based on mean squared error metrics, spectral analysis, and gradient statistics show that while the AE reduces reconstruction error, it fails to recover high-frequency variability. In contrast, the C-GAN effectively restores the statistical properties of the true SST field at the cost of increasing the pointwise discrepancy with the ground truth observation. Our results highlight the potential of deep generative models to enhance the physical and statistical realism of gap-filled satellite data in oceanographic applications.", "link": "https://arxiv.org/abs/2511.22610", "authors": "Claudia Fanelli, Tiany Li, Luca Biferale, Bruno Buongiorno Nardelli, Daniele Ciani, Andrea Pisano, Michele Buzzicotti", "source": "arXiv", "published": "2025-11-27", "first_seen": "2026-11-24T14:57:46+00:00", "score": 58, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-17-1667-2024", "title": "High-resolution multi-scaling of outdoor human thermal comfort and its intra-urban variability based on machine learning", "summary": "As the frequency and intensity of heatwaves will continue to increase in the future, accurate and high-resolution mapping and forecasting of human outdoor thermal comfort in urban environments are of great importance. This study presents a machine-learning-based outdoor thermal comfort model with a good trade-off between computational cost, complexity, and accuracy compared to common numerical urban climate models. The machine learning approach is basically an emulation of different numerical urban climate models. The final model consists of four submodels that predict air temperature, relative humidity, wind speed, and mean radiant temperature based on meteorological forcing and geospatial data on building forms, land cover, and vegetation. These variables are then combined into a thermal index (universal thermal climate index – UTCI). All four submodel predictions and the final model output are evaluated using street-level measurements from a dense urban sensor network in Freiburg, Germany. The final model has a mean absolute error of 2.3 K. Based on a city-wide simulation for Freiburg, we demonstrate that the model is fast and versatile enough to simulate multiple years at hourly time steps to predict street-level UTCI at 1 m spatial resolution for an entire city. Simulations indicate that neighbourhood-averaged thermal comfort conditions vary widely between neighbourhoods, even if they are attributed to the same local climate zones, for example, due to differences in age and degree of urban vegetation. Simulations also show contrasting differences in the location of hot", "link": "https://doi.org/10.5194/gmd-17-1667-2024", "authors": "Ferdinand Briegel, Jonas Wehrle, Dirk Schindler, Andreas Christen", "source": "Geoscientific Model Development", "published": "2024-2-26", "first_seen": "2026-11-24T14:57:46+00:00", "score": 58, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-26-0063.1", "title": "Probabilistic high-temporal resolution surface wind nowcasting with deep learning models", "summary": "High temporal frequency wind speed and direction predictions are critical for short-term operational decisions in the aviation sector, including runway selection, aircraft arrival sequencing, and departure planning. These decisions benefit substantially from having reliable forecasts several hours in advance, allowing operators to evaluate potential scenarios and formulate robust strategies. This results in a demand for forecasts with long forecast horizons at the minute-level time scale, a challenging problem since wind fluctuations are highly random. This study develops probabilistic wind nowcasts at individual sites using well-established deep learning (DL) models. By directly modelling the predictive distributions or quantiles of wind variables, the proposed DL approaches capture both the mean behaviour and the inherent variability of the wind field. Two complementary probabilistic models with distinct architectures and mechanisms are investigated. Both models outperform current Numerical Weather Prediction (NWP) hourly predictions, achieving reductions in forecast error of approximately 10%–30%. Their outputs are further analysed to characterize their respective strengths and limitations. Finally, we demonstrate that a weighted ensemble of the two models can potentially provide additional performance gains, outperforming each individual model, even for the demonstrated case in which one of the individual model has overall significantly worse performance than the other.", "link": "https://doi.org/10.1175/aies-d-26-0063.1", "authors": "Mengmeng Han, Brad Murphy, Tennessee Leeuwenburg", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-11-13", "first_seen": "2026-11-24T14:57:46+00:00", "score": 58, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2019ef001461", "title": "Twenty‐First Century Drought Projections in the CMIP6 Forcing Scenarios", "summary": "There is strong evidence that climate change will increase drought risk and severity, but these conclusions depend on the regions, seasons, and drought metrics being considered. We analyze changes in drought across the hydrologic cycle (precipitation, soil moisture, and runoff) in projections from Phase Six of the Coupled Model Intercomparison Project (CMIP6). The multimodel ensemble shows robust drying in the mean state across many regions and metrics by the end of the 21st century, even following the more aggressive mitigation pathways (SSP1‐2.6 and SSP2‐4.5). Regional hotspots with strong drying include western North America, Central America, Europe and the Mediterranean, the Amazon, southern Africa, China, Southeast Asia, and Australia. Compared to SSP3‐7.0 and SSP5‐8.5, however, the severity of drying in the lower warming scenarios is substantially reduced and further precipitation declines in many regions are avoided. Along with drying in the mean state, the risk of the historically most extreme drought events also increases with warming, by 200–300% in some regions. Soil moisture and runoff drying in CMIP6 is more robust, spatially extensive, and severe than precipitation, indicating an important role for other temperature‐sensitive drought processes, including evapotranspiration and snow. Given the similarity in drought responses between CMIP5 and CMIP6, we speculate that both generations of models are subject to similar uncertainties, including vegetation processes, model representations of precipitation, and the degree to which model responses to warming are consi", "link": "https://doi.org/10.1029/2019ef001461", "authors": "B. I. Cook, J. S. Mankin, K. Marvel, A. P. Williams, J. E. Smerdon, K. J. Anchukaitis", "source": "Earth's Future", "published": "2020-6", "first_seen": "2026-11-24T14:57:46+00:00", "score": 58, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-025-01067-z", "title": "Hourly extreme rainfall projections over South Korea using convection permitting climate simulations", "summary": "", "link": "https://doi.org/10.1038/s41612-025-01067-z", "authors": "Ga-Yeong Seo, Seung-Ki Min, Donghyun Lee, Seok-Woo Son, Chanil Park, Dong-Hyun Cha", "source": "npj Climate and Atmospheric Science", "published": "2025-6-5", "first_seen": "2026-11-24T14:57:46+00:00", "score": 58, "topics": ["Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-025-01090-0", "title": "ACE2: accurately learning subseasonal to decadal atmospheric variability and forced responses", "summary": "Existing machine learning models of weather variability are not formulated to enable assessment of their response to varying external boundary conditions such as sea surface temperature and greenhouse gases. Here we present ACE2 (Ai2 Climate Emulator version 2) and its application to reproducing atmospheric variability over the past 80 years on timescales from days to decades. ACE2 is a 450M-parameter autoregressive machine learning emulator, operating with 6-hour temporal resolution, 1° horizontal resolution and eight atmospheric vertical layers. It exactly conserves global dry air mass and moisture and can be stepped forward stably for arbitrarily many steps with a throughput of about 1500 simulated years per wall clock day. ACE2 generates emergent phenomena such as tropical cyclones, the Madden Julian Oscillation, and sudden stratospheric warmings. Furthermore, it accurately reproduces the atmospheric response to El Niño variability and global trends of temperature over the past 80 years. However, its sensitivities to separately changing sea surface temperature and carbon dioxide are not entirely realistic.", "link": "https://doi.org/10.1038/s41612-025-01090-0", "authors": "Oliver Watt-Meyer, Brian Henn, Jeremy McGibbon, Spencer K. Clark, Anna Kwa, W. Andre Perkins, Elynn Wu, Lucas Harris", "source": "npj Climate and Atmospheric Science", "published": "2025-5-29", "first_seen": "2026-11-24T14:57:46+00:00", "score": 58, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/1520-0434(1999)014<0338:pfuann>2.0.co;2", "title": "Precipitation Forecasting Using a Neural Network", "summary": "", "link": "https://doi.org/10.1175/1520-0434(1999)014<0338:pfuann>2.0.co;2", "authors": "Tony Hall, Harold E. Brooks, Charles A. Doswell", "source": "Weather and Forecasting", "published": "1999-6", "first_seen": "2026-11-24T14:57:46+00:00", "score": 58, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.29213", "title": "Huayu-Global: Skillful real-time quasi-global precipitation retrieval", "summary": "Satellite precipitation products face a persistent trade-off: real-time estimates are timely but less accurate, whereas the most reliable products are often released months after observation. This delay keeps high-quality precipitation information outside the decision window for flood warning and disaster response. Here we report Huayu-Global, a cross-constellation deep-learning system that combines three geostationary sensor streams from five satellites through a common retrieval framework and generates coherent quasi-global precipitation fields every thirty minutes. Across more than a million independent station records from two periods outside the training years, Huayu-Global improves event detection and precipitation-amount estimation relative to the real-time products evaluated and reaches delayed-product-level skill in key metrics. Huayu-Global therefore turns operational geostationary observations into a timely, high-skill precipitation layer for flood forecasting, water management and disaster response. Its cross-constellation design also provides a scalable foundation for incorporating future geostationary missions into hydrological and weather-prediction systems.", "link": "https://arxiv.org/abs/2610.29213", "authors": "Zijiang Song, Shuang Yang, Yuying Li, Zilong Zhu, Xigang Sun, Ting Liu, Wenye Xiao, Lina Yuan", "source": "arXiv", "published": "2026-10-21", "first_seen": "2026-11-24T14:57:46+00:00", "score": 57, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.16584", "title": "Identifying Arctic states vulnerable to rapid ice loss with a convolutional neural network", "summary": "This work investigates the incidence of rapid ice-loss events in the Arctic, in which a substantial fraction of September sea-ice is lost in only a few years. Such events are seen to occur in climate model simulations forced with increasing greenhouse gas concentrations, but not as yet in the relatively short observational record. We train a convolutional neural network (CNN) using six large climate model ensembles to diagnose vulnerability to rapid ice-loss events. The trained model is shown to separate higher and lower risk states in out-of-sample climate models via a leave-one-out cross-validation. The model emphasises the role of persistently thin sea-ice, remaining sea-ice extent and sustained high upper ocean heat content as predictors of rapid ice-loss. The CNN is applied to observational data over the satelite-era showing a signal for rapid ice-loss prior to a drop around 2007 and an increasing risk from around 2015 to present. Such rapid-ice loss events would likely have dramatic consequences for Arctic ecosystems, coastal communities and global shipping.", "link": "https://arxiv.org/abs/2610.16584", "authors": "Matthew Patterson, Ioana Colfescu, Nathan Kirk, Graeme MacGhilchrist", "source": "arXiv", "published": "2026-10-12", "first_seen": "2026-11-24T14:57:46+00:00", "score": 57, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.13346", "title": "Advancing Mass-Conserving Deep Learning for Distributed Hydrologic Modeling: A Case Study in a Snow-Dominated Watershed", "summary": "Recent progress in physics-aware deep learning (DL) has embedded mass conservation within Long Short-Term Memory (LSTM) architecture for hydrologic modeling, improving physical consistency and enabling diagnostics of internal states. However, existing mass-conserving neural networks are primarily developed in lumped formulations. Consequently, previous studies provide only fragmented and often indirect evidence of when and why imposed physical constraints may lead to unrealistic hydrologic behavior. To address this limitation, we propose Physics-Enhanced Conservation-Augmented Net (PECAN), a mass-conserving convolutional LSTM-based framework for distributed hydrologic modeling and diagnosing structural limitations of physics-aware DL models. PECAN is implemented in two variants: (1) PECAN-MC with a strict precipitation-based conservation constraint and (2) PECAN-MCR with a relaxed conservation constraint allowing additional water inputs beyond precipitation. Both variants are trained solely on gauge streamflow and evaluated in a snow-dominated watershed in Colorado. We benchmark PECAN against lumped DL baselines and the distributed process-based Variable Infiltration Capacity (VIC) model. Results show that PECAN achieves competitive outlet streamflow simulation accuracy while producing spatially explicit latent states for interpretation. Comparisons with reference soil moisture indicate that PECAN cell states resemble meaningful temporal soil moisture dynamics. However, analyses also reveal that PECAN misrepresents snow processes by prematurely removing winter snow water st", "link": "https://arxiv.org/abs/2611.13346", "authors": "Yihan Wang, Lujun Zhang, N. Benjamin Erichson, Yang Hong, Tiantian Yang", "source": "arXiv", "published": "2026-11-09", "first_seen": "2026-11-24T14:57:46+00:00", "score": 57, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2603.06782", "title": "Physics-Informed Diffusion Model for Generating Synthetic Extreme Rare Weather Events Data", "summary": "Data scarcity is a primary obstacle in developing robust Machine Learning (ML) models for detecting rapidly intensifying tropical cyclones. Traditional data augmentation techniques (rotation, flipping, brightness adjustment) fail to preserve the physical consistency and high-intensity gradients characteristic of rare Category 4-equivalent events, which constitute only 0.14\\% of our dataset (202 of 140,514 samples). We propose a physics-informed diffusion model based on the Context-UNet architecture to generate synthetic, multi-spectral satellite imagery of extreme weather events. Our model is conditioned on critical atmospheric parameters such as average wind speed, type of Ocean and stage of development (early, mature, late etc) -- the known drivers of rapid intensification. Using a controlled pre-generated noise sampling strategy and mixed-precision training, we generated $16\\times16$ wind-field samples that are cropped from multi-spectral satellite imagery which preserve realistic spatial autocorrelation and physical consistency. Results demonstrate that our model successfully learns discriminative features across ten distinct context classes, effectively mitigating the data bottleneck. Specifically, we address the extreme class imbalance in our dataset, where Class 4 (Ocean 2, early stage with average wind speed 50kn hurricane) contains only 202 samples compared to 79,768 samples in Class 0. This generative framework provides a scalable solution for augmenting training datasets for operational weather detection algorithms. The average Results yield an average Log-Spectr", "link": "https://arxiv.org/abs/2603.06782", "authors": "Marawan Yakout, Tannistha Maiti, Monira Majhabeen, Tarry Singh", "source": "arXiv", "published": "2026-03-06", "first_seen": "2026-11-24T14:57:46+00:00", "score": 57, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme", "diffusion model"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-23-0043.1", "title": "Spatially Local Surrogate Modeling of Subgrid-Scale Effects in Idealized Atmospheric Flows: A Deep Learned Approach Using High-Resolution Simulation Data", "summary": "We introduce a machine learned surrogate model from high-resolution simulation data to capture the subgrid-scale effects in dry, stratified atmospheric flows. We use deep neural networks (NNs) to model the spatially local state differences between a coarse-resolution simulation and a high-resolution simulation. The setup enables the capture of both dissipative and antidissipative effects in the state differences. The NN model is able to accurately capture the state differences in offline tests outside the training regime. In online tests intended for production use, the NN-coupled coarse simulation has higher accuracy over a significant period of time compared to the coarse-resolution simulation without any correction. We provide evidence of the capability of the NN model to accurately capture high-gradient regions in the flow field. With the accumulation of the errors, the NN-coupled simulation becomes computationally unstable after approximately 90 coarse simulation time steps. Insights gained from these surrogate models further pave the way for formulating stable, complex, physics-based spatially local NN models which are driven by traditional subgrid-scale turbulence closure models. Significance Statement Flows in the atmosphere are highly chaotic and turbulent, comprising flow structures of broad scales. For effective computational modeling of atmospheric flows, the effects of the small- and large-scale structures need to be captured by the simulations. Capturing the small-scale structures requires fine-resolution simulations. Even with the current state-of-the-art sup", "link": "https://doi.org/10.1175/aies-d-23-0043.1", "authors": "Muralikrishnan Gopalakrishnan Meena, Matthew R. Norman, David M. Hall, Michael S. Pritchard", "source": "Artificial Intelligence for the Earth Systems", "published": "2024-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 57, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2020ef001616", "title": "Projecting Exposure to Extreme Climate Impact Events Across Six Event Categories and Three Spatial Scales", "summary": "The extent and impact of climate‐related extreme events depend on the underlying meteorological, hydrological, or climatological drivers as well as on human factors such as land use or population density. Here we quantify the pure effect of historical and future climate change on the exposure of land and population to extreme climate impact events using an unprecedentedly large ensemble of harmonized climate impact simulations from the Inter‐Sectoral Impact Model Intercomparison Project phase 2b. Our results indicate that global warming has already more than doubled both the global land area and the global population annually exposed to all six categories of extreme events considered: river floods, tropical cyclones, crop failure, wildfires, droughts, and heatwaves. Global warming of 2°C relative to preindustrial conditions is projected to lead to a more than fivefold increase in cross‐category aggregate exposure globally. Changes in exposure are unevenly distributed, with tropical and subtropical regions facing larger increases than higher latitudes. The largest increases in overall exposure are projected for the population of South Asia.", "link": "https://doi.org/10.1029/2020ef001616", "authors": "Stefan Lange, Jan Volkholz, Tobias Geiger, Fang Zhao, Iliusi Vega, Ted Veldkamp, Christopher P. O. Reyer, Lila Warszawski", "source": "Earth's Future", "published": "2020-11-26", "first_seen": "2026-11-24T14:57:46+00:00", "score": 57, "topics": ["Close to your work"], "watch": [], "boosts": ["extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-026-01558-7", "title": "Environment-conditioned deep learning for severe convection nowcasting", "summary": "", "link": "https://doi.org/10.1038/s41612-026-01558-7", "authors": "Lei Chen, Zijian Zhu, Xiaoran Zhuang, Tianyuan Qi, Yuxuan Feng, Xiaohui Zhong, Hao Li", "source": "npj Climate and Atmospheric Science", "published": "2026-10-2", "first_seen": "2026-11-24T14:57:46+00:00", "score": 57, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-5-779-2024", "title": "Divergent convective outflow in ICON deep-convection-permitting and parameterised deep convection simulations", "summary": "Upper-tropospheric deep convective outflows during an event on 10–11 June 2019 over central Europe are analysed in ensembles of the operational Icosahedral Nonhydrostatic (ICON) numerical weather prediction model. Both a parameterised and an explicit representation of deep convective systems is studied. Near-linear response of deep convective outflow strength to net latent heating is found for parameterised convection, while different but physically coherent patterns of outflow variability are found in convection-permitting simulations at 1 km horizontal grid spacing. We investigate if the conceptual model for outflow strength proposed in our previous idealised large-eddy simulation (LES) study is able to explain the variation in outflow strength in a real-case scenario. Convective organisation and aggregation induce a non-linear increase in the magnitude of deep convective outflows with increasing net latent heating in convection-permitting simulations, consistent with the conceptual model. However, in contrast to expectations from the conceptual model, a dependence of the outflow strength on the dimensionality of convective overturning (two-dimensional versus three-dimensional) cannot be fully corroborated from the real-case simulations. Our results strongly suggest that the interactions between gravity waves emitted by heating in individual deep convective elements within larger organised convective systems are of prime importance for the representation of divergent outflow strength from organised convection in numerical models.", "link": "https://doi.org/10.5194/wcd-5-779-2024", "authors": "Edward Groot, Patrick Kuntze, Annette Miltenberger, Holger Tost", "source": "Weather and Climate Dynamics", "published": "2024-5-31", "first_seen": "2026-11-24T14:57:46+00:00", "score": 57, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/1520-0493(1993)121<2794:doasgr>2.0.co;2", "title": "Development of a Second-Generation Regional Climate Model (RegCM2). Part I: Boundary-Layer and Radiative Transfer Processes", "summary": "", "link": "https://doi.org/10.1175/1520-0493(1993)121<2794:doasgr>2.0.co;2", "authors": "Filippo Giorgi, Maria Rosaria Marinucci, Gary T. Bates", "source": "Monthly Weather Review", "published": "1993-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 57, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.01614", "title": "Sonny-ENS: demystifying machine-learning ensemble weather forecasting", "summary": "Every weather forecast is uncertain, and decisions from flood warnings to energy trading depend on how well that uncertainty is quantified. Machine-learning (ML) ensembles now quantify it better than the best physics-based ensemble, yet two things about them remain opaque: whether their skill requires hundreds to thousands of accelerator-days of training, and how a network with a simple source of randomness produces a spread that follows the flow. Here we introduce Sonny-ENS, an ensemble of three 68.9-million-parameter networks with Monte Carlo dropout, trained on the continuous ranked probability score (CRPS) in 2.7 A40 GPU-days. On 2022, it has a lower CRPS than the European Centre for Medium-Range Weather Forecasts ensemble (ENS) on 96% of 570 targets and an 8.3% lower mean CRPS at lead times of 1-10 days. It outperforms the operational GenCast on 69% of the targets, and a 51-member, 15-day forecast takes 69 s on one GPU. Ablations identify the ingredients of this skill, and a Kolmogorov-Arnold sparse autoencoder shows that dropout injects uncertainty mainly in the tropics, whereas the spread grows where the atmosphere is baroclinically unstable (spatial correlation 0.91 with the Eady growth rate). Skillful probabilistic weather forecasts are therefore within reach of a single GPU server.", "link": "https://arxiv.org/abs/2611.01614", "authors": "Minjong Cheon", "source": "arXiv", "published": "2026-11-01", "first_seen": "2026-11-24T14:57:46+00:00", "score": 56, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.24708", "title": "Spherical Physics-informed Neural Operator with Multi-scale Coupling for Meteorological Downscaling", "summary": "Meteorological downscaling is crucial for high-resolution regional climate forecasting and disaster early warning. While neural operators have emerged as a promising paradigm for modeling complex spatiotemporal mappings, existing frameworks often struggle with spherical manifold geometric distortions, inherent atmospheric multi-scale coupling mismatches, and lack of explicit atmospheric laws. We propose the Spherical Physics-informed Neural Operator, which utilizes a Spherical Laplacian Decomposition to partition atmospheric fields into hierarchical frequency components, maintaining exact point-wise correspondence across scales. To evaluate these representations at arbitrary locations, we introduce a localized spherical integral operator that approximates continuous kernel transforms via geometry-aware attention. Dynamical consistency is further enforced by embedding differentiable constraints into the learning process. Extensive experiments demonstrate that our framework attains superior accuracy and zero-shot generalization across various meteorological variables and unseen queries, representing a robust and interpretable solution for global-to-regional meteorological downscaling.", "link": "https://arxiv.org/abs/2610.24708", "authors": "Yiqiang Ye, Yichi Wang, Haodi Zhang, Jiawei Wen, Jiahui Jiang, Zhaoyu Zhong, Jiangjian Yu, Chunxia Xiao", "source": "arXiv", "published": "2026-10-17", "first_seen": "2026-11-24T14:57:46+00:00", "score": 56, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-8-1339-2015", "title": "Development of the GEOS-5 atmospheric general circulation model: evolution from MERRA to MERRA2", "summary": "The Modern-Era Retrospective Analysis for Research and Applications-2 (MERRA2) version of the Goddard Earth Observing System-5 (GEOS-5) atmospheric general circulation model (AGCM) is currently in use in the NASA Global Modeling and Assimilation Office (GMAO) at a wide range of resolutions for a variety of applications. Details of the changes in parameterizations subsequent to the version in the original MERRA reanalysis are presented here. Results of a series of atmosphere-only sensitivity studies are shown to demonstrate changes in simulated climate associated with specific changes in physical parameterizations, and the impact of the newly implemented resolution-aware behavior on simulations at different resolutions is demonstrated. The GEOS-5 AGCM presented here is the model used as part of the GMAO MERRA2 reanalysis, global mesoscale simulations at 10 km resolution through 1.5 km resolution, the real-time numerical weather prediction system, and for atmosphere-only, coupled ocean-atmosphere and coupled atmosphere-chemistry simulations. The seasonal mean climate of the MERRA2 version of the GEOS-5 AGCM represents a substantial improvement over the simulated climate of the MERRA version at all resolutions and for all applications. Fundamental improvements in simulated climate are associated with the increased re-evaporation of frozen precipitation and cloud condensate, resulting in a wetter atmosphere. Improvements in simulated climate are also shown to be attributable to changes in the background gravity wave drag, and to upgrades in the relationship between the ocean su", "link": "https://doi.org/10.5194/gmd-8-1339-2015", "authors": "A. Molod, L. Takacs, M. Suarez, J. Bacmeister", "source": "Geoscientific Model Development", "published": "2015-5-12", "first_seen": "2026-11-24T14:57:46+00:00", "score": 56, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-24-0047.1", "title": "Efficient Modeling of Subkilometer Surface Wind with Gaussian Processes and Neural Networks", "summary": "Accurately representing surface weather at the subkilometer scale is crucial for optimal decision-making in a wide range of applications. This motivates the use of statistical techniques to provide accurate and calibrated probabilistic predictions at a lower cost compared to numerical simulations. Wind represents a particularly challenging variable to model due to its high spatial and temporal variability. This paper presents a novel approach that integrates Gaussian processes and neural networks to model surface wind gusts at subkilometer resolution, leveraging multiple data sources, including numerical weather prediction models, topographical descriptors, and in situ measurements. Results demonstrate the added value of modeling the multivariate covariance structure of the variable of interest, as opposed to only applying a univariate probabilistic regression approach. Modeling the covariance enables the optimal integration of observed measurements from ground stations, which is shown to reduce the continuous ranked probability score compared to the baseline. Moreover, it allows the generation of realistic fields that are also marginally calibrated, aided by scalable techniques such as random Fourier features and pathwise conditioning. We discuss the effect of different modeling choices, as well as different degrees of approximation, and present our results for a case study. Significance Statement Accurately representing the surface wind at the subkilometer scale is valuable for various applications, but it represents a difficult challenge, especially in the presence of co", "link": "https://doi.org/10.1175/aies-d-24-0047.1", "authors": "Francesco Zanetta, Daniele Nerini, Matteo Buzzi, Henry Moss", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-4", "first_seen": "2026-11-24T14:57:46+00:00", "score": 56, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024ms004464", "title": "Development of a Data‐Driven Lightning Scheme for Implementation in Global Climate Models", "summary": "This study proposes a new lightning scheme applicable at the global scale, predicting lightning rates from climatic variables. Using satellite lightning records spanning a period of 29 years, we apply machine learning methods to derive a functional relationship between lightning and climate reanalysis data. In particular, we design a tree‐based regression scheme, representing different lightning regimes with separate single hidden layer neural networks of low dimensionality. We apply multiple complexity constraints in the development stages, which makes our lightning scheme straightforward to implement within global climate models (GCMs). We demonstrate that, for years not used for training, our lightning scheme captures of the daily global spatio‐temporal lightning variability, which corresponds to a relative improvement compared to well‐established lightning schemes. Similarly, the scheme correlates well with lightning observations for the monthly climatology , inter‐annual variability , and latitudinal and longitudinal distributions . Most notably, the lightning scheme brings a critical improvement in representing lightning magnitude and variability in the three tropical lightning chimney regions: central Africa, the Amazon, and the Maritime Continent. We implement the lightning scheme in the Community Earth System Model to verify its stability and performance as a GCM component, and we provide detailed implementation guidelines. As an intermediate approach between high‐dimensional machine learning models and first‐order lightning parameterizations, our lightning scheme ", "link": "https://doi.org/10.1029/2024ms004464", "authors": "Vincent Verjans, Christian L. E. Franzke", "source": "Journal of Advances in Modeling Earth Systems", "published": "2025-1-30", "first_seen": "2026-11-24T14:57:46+00:00", "score": 56, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024gl114298", "title": "Toward Artificial General Intelligence in Hydrogeological Modeling With an Integrated Latent Diffusion Framework", "summary": "Deep learning models have been extensively applied to various aspects of hydrogeological modeling. However, traditional approaches often rely on separate task‐specific models, resulting in time‐consuming selection and tuning processes. This study develops an integrated Latent Diffusion Model (LDM) framework to address four key hydrogeological modeling tasks: aquifer heterogeneity structure generation, surrogate modeling for flow and transport, and direct inversion of aquifer heterogeneity structure. Using a consistent architecture and hyperparameters, the LDM demonstrates robust multi‐task processing capabilities, accurately capturing aquifer heterogeneity, enabling rapid predictions of hydraulic head and solute transport, and efficiently performing direct inversion without iterative simulations. By integrating multiple tasks within a single framework, LDM eliminates the need for task‐specific models or extensive parameter optimization, offering an efficient and adaptive general solution for deep learning‐based hydrogeological modeling. Its generalization across diverse objectives underscores its potential as a cornerstone for advancing Artificial General Intelligence in hydrogeological modeling.", "link": "https://doi.org/10.1029/2024gl114298", "authors": "Chuanjun Zhan, Zhenxue Dai, Jiu Jimmy Jiao, Mohamad Reza Soltanian, Huichao Yin, Kenneth C. Carroll", "source": "Geophysical Research Letters", "published": "2025-2-6", "first_seen": "2026-11-24T14:57:46+00:00", "score": 56, "topics": ["Deep Learning"], "watch": [], "boosts": ["diffusion model"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-013-2046-8", "title": "Simulation of the annual and diurnal cycles of rainfall over South Africa by a regional climate model", "summary": "", "link": "https://doi.org/10.1007/s00382-013-2046-8", "authors": "Benjamin Pohl, Mathieu Rouault, Shouraseni Sen Roy", "source": "Climate Dynamics", "published": "2014-1-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 56, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-23-0213.1", "title": "WRF Model Forecast Evaluation of Extreme Rainfall Events over Karnataka during the Indian Summer Monsoon", "summary": "The skill of the Weather Research and Forecasting (WRF) Model in predicting extreme rainfall events (EREs) is investigated for two different initialization times: 1200 UTC (12-h lead time) and 0000 UTC (zero lead time). A high-resolution (3-km) WRF Model configuration is used to simulate 38 EREs in Karnataka, a state in southwest India. These EREs were identified by analyzing daily accumulated rainfall recorded by telemetric rain gauge (TRG) stations over the region, specifically during the prominent rainy season in the state (June–November) for the period 2015–19. EREs were defined using the 99.993rd percentile threshold for each subdivision and year. The model forecasts of rainfall and other meteorological variables were verified against high-density TRG (6480 stations) and telemetric weather station (860 stations) observations throughout Karnataka. The model performance was assessed through computation of quantitative error measures and statistical skill scores. Consistently, both sets of experiments reveal a propensity of the WRF Model to overestimate rainfall in the coastal region, with simulations initialized at 0000 UTC displaying a more pronounced wet bias compared to those at 1200 UTC. However, simulations initialized at 0000 UTC are more skillful than 1200 UTC in predicting the frequency of rainfall occurrences. The validation of other meteorological variables indicates that the model tends to underpredict temperature and overpredict relative humidity, especially during night hours, while it overpredicts wind speed over the region. Quantification of the model erro", "link": "https://doi.org/10.1175/waf-d-23-0213.1", "authors": "Ajay Bankar, V. Rakesh, Smrati Purwar", "source": "Weather and Forecasting", "published": "2025-8", "first_seen": "2026-11-24T14:57:46+00:00", "score": 56, "topics": ["Close to your work"], "watch": [], "boosts": ["india", "monsoon", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-18-0136.1", "title": "Estimating Tropical Cyclone Intensity by Satellite Imagery Utilizing Convolutional Neural Networks", "summary": "Accurately estimating tropical cyclone (TC) intensity is one of the most critical steps in TC forecasting and disaster warning/management. For over 40 years, the Dvorak technique (and several improved versions) has been applied for estimating TC intensity by forecasters worldwide. However, the operational Dvorak techniques primarily used in various agencies have several deficiencies, such as inherent subjectivity leading to inconsistent intensity estimates within various basins. This collaborative study between meteorologists and data scientists has developed a deep-learning model using satellite imagery to estimate TC intensity. The conventional convolutional neural network (CNN), which is a mature technology for object classification, requires several modifications when being used for directly estimating TC intensity (a regression task). Compared to the Dvorak technique, the CNN model proposed here is objective and consistent among various basins; it has been trained with satellite infrared brightness temperature and microwave rain-rate data from 1097 global TCs during 2003–14 and optimized with data from 188 TCs during 2015–16. This paper also introduces an upgraded version that further improves the accuracy by using additional TC information (i.e., basin, day of year, local time, longitude, and latitude) and applying a postsmoothing procedure. An independent testing dataset of 94 global TCs during 2017 has been used to evaluate the model performance. A root-mean-square intensity difference of 8.39 kt (1 kt ≈ 0.51 m s−1) is achieved relative to the best track intensities", "link": "https://doi.org/10.1175/waf-d-18-0136.1", "authors": "Buo-Fu Chen, Boyo Chen, Hsuan-Tien Lin, Russell L. Elsberry", "source": "Weather and Forecasting", "published": "2019-4-1", "first_seen": "2026-11-24T14:57:46+00:00", "score": 56, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.08148", "title": "Detecting Weather Fronts from Satellite Observations: What Does Reanalysis Add?", "summary": "Weather fronts are transition regions between air masses with contrasting thermodynamic properties and are associated with mid-latitude precipitation and severe weather. We investigate machine learning (ML) methods for detecting weather fronts and quantify the contribution of reanalysis data to performance. We compare two configurations of the same ML model for pixel-wise frontal classification over the North Atlantic and Europe: (1) using only geostationary infrared satellite observations, and (2) additionally using 28 ERA5 reanalysis fields. The satellite-only model achieves a neighbourhood critical success index at a 150 km tolerance (CSI@150) of $0.402$, which lies within the range of agreement between analyses from different meteorological services. The satellite$+$ERA5 model achieves $0.575$, an improvement of $0.173$. Our analysis shows that low-level winds are the least predictable from the satellite representation ($R^2 = 0.23$, compared with $0.88$ for temperature), while removing winds or moisture causes the largest decreases in detection performance.", "link": "https://arxiv.org/abs/2611.08148", "authors": "Ioannis Dravilas, Miruna Stoicescu, Roope Tervo, Carlos Horn, Oriol Hinojo Comellas, Sina Montazeri, Andrea Meraner, Ana Lucic", "source": "arXiv", "published": "2026-11-05", "first_seen": "2026-11-24T14:57:46+00:00", "score": 55, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.15053", "title": "PhysXAI: A Theoretical Framework for Diagnosing Physical Hallucinations in Weather Foundation Models", "summary": "Modern machine learning models for global weather forecasting achieve remarkable predictive accuracy, yet they frequently produce states that violate fundamental physical laws, including conservation of mass, hydrostatic balance, or spectral energy scaling. We term these outputs physical hallucinations and propose PhysXAI, a rigorous diagnostic framework that detects, localises, and attributes such inconsistencies. Unlike existing post-hoc metric suites, PhysXAI is a learnable system that explicitly decouples forecast error from physical plausibility. We formalise the problem through a novel joint condition on numerical and physical residuals, and introduce a multi-branch encoder that extracts representations from conservation, dynamical, spectral, cross-variable, and spatiotemporal residuals. A key innovation is a physics-consistency contrastive learning objective, which we theoretically show the latent representation to be approximately isometric to the physical residual space, ensuring that diagnostic decisions remain grounded in physically meaningful deviations. We further derive an adaptive multi-objective loss with gradient-based weighting to balance competing diagnostic objectives. The framework produces spatially resolved hallucination maps, violation-type classifications, and calibrated Bayesian uncertainty, enabling both detection and interpretable attribution of physical inconsistencies. We conduct a comprehensive comparative evaluation of PhysXAI across ERA5, WeatherBench 2, and MERRA-2, using forecasts from GraphCast, Pangu-Weather, and NeuralGCM, with Python-w", "link": "https://arxiv.org/abs/2611.15053", "authors": "Anjan Mahapatra, Nikhil Raj", "source": "arXiv", "published": "2026-11-11", "first_seen": "2026-11-24T14:57:46+00:00", "score": 55, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.25370", "title": "Multi-site Learning for Forecasting Day-Ahead Wind-Power Production for Onshore Wind Farms in Great Britain with Deep Neural Networks", "summary": "Accurate day-ahead wind-power production forecasting is increasingly important for energy system operations, market activity and balancing Great Britain's grid as wind generation grows. In this study, we train multi-site deep neural networks (DNNs) using pooled historical production and reanalysis weather data from 88 onshore wind Balancing Mechanism Units (BMUs). Forecasts are produced at 09:00 UK time for the following midnight-to-midnight delivery day, matching NESO's operational day-ahead forecasting schedule. We use reanalysis weather as future covariates during training and numerical weather prediction (NWP) forecasts during inference, extending training beyond the available historical NWP archive. Our multi-site recurrent neural network outperforms site-specific RNNs and a multi-site XGBoost model, while processing the full future-weather trajectory for the forecast horizon further improves accuracy relative to hour-aligned approaches. Our best model, an RNN with a bidirectional weather encoder (BiRNN) for NWP trajectory processing, reduces MW mean absolute error and root mean squared error relative to NESO by 17.94% and 12.51%, respectively, across 638,246 matched BMU-hour observations under conditions approximating unconstrained wind farm operations. In 40 leave-one-out trials, the BiRNN achieves lower MAE than NESO at 32 excluded sites, indicating transferable forecasting ability despite reduced accuracy when sites are omitted from training. Our capacity-estimation, data-cleaning and reanalysis-based training approach provides a basis for scaling NWP-aware multi-s", "link": "https://arxiv.org/abs/2610.25370", "authors": "James Kean, Aidan O'Sullivan", "source": "arXiv", "published": "2026-10-18", "first_seen": "2026-11-24T14:57:46+00:00", "score": 55, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.03381", "title": "A Geometry-Informed Neural Operator surrogate of LISFLOOD-FP for rapid pluvial-fluvial flood forecasting: the case of Forlì, Italy", "summary": "Physically based two-dimensional hydraulic models are too slow for real-time inundation forecasting and large ensembles. We present a time-dependent geometry-informed neural operator (GINO) surrogate of LISFLOOD-FP for the municipality of Forlì (Italy), severely affected by the May 2023 Emilia-Romagna floods. The surrogate is designed for an operational setting in which only river stage gauges and rain gauges are available. A reproducible pipeline turns public regional observations into a physically based training set: each river inflow is driven by the first stage gauge downstream of it through a calibrated water-surface boundary condition, and rain enters as SCS-CN effective rainfall. The surrogate is an autoregressive GINO trained on 216 simulations of 24 observed events with scaled forcing. It predicts volume-conserving polygon-mean depths on an exposure-based Voronoi mesh of 659 nodes, with a 20 min step over 72 h. The surrogate is tested on 38 independent observed events that it never saw during training. On these events it reaches a critical success index (CSI) of 0.934 at 0.05m and 0.844 at 0.3 m, a depth RMSE of 0.008m and an $R^2$ of 0.984 for maximum-depth maps. On one NVIDIA A10G GPU a 72-h forecast takes 1.7 s instead of 55 s with LISFLOOD-FP, and a 50-member ensemble, computed in a single batched rollout, takes 6.2 s instead of about 46 min, which makes probabilistic flood forecasting practical. These results show that neural-operator surrogates can deliver accurate pluvial-fluvial flood forecasts driven by river stage for operational early warning.", "link": "https://arxiv.org/abs/2611.03381", "authors": "Samuele Maria Garofalo, Fabio Limardo, Simonetta Bodojra, Mohammad Amin Nabian, Mehdi Taghizadeh", "source": "arXiv", "published": "2026-11-02", "first_seen": "2026-11-24T14:57:46+00:00", "score": 55, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2019ms002010", "title": "Presentation and Evaluation of the IPSL‐CM6A‐LR Climate Model", "summary": "This study presents the global climate model IPSL‐CM6A‐LR developed at Institut Pierre‐Simon Laplace (IPSL) to study natural climate variability and climate response to natural and anthropogenic forcings as part of the sixth phase of the Coupled Model Intercomparison Project (CMIP6). This article describes the different model components, their coupling, and the simulated climate in comparison to previous model versions. We focus here on the representation of the physical climate along with the main characteristics of the global carbon cycle. The model's climatology, as assessed from a range of metrics (related in particular to radiation, temperature, precipitation, and wind), is strongly improved in comparison to previous model versions. Although they are reduced, a number of known biases and shortcomings (e.g., double Intertropical Convergence Zone [ITCZ], frequency of midlatitude wintertime blockings, and El Niño–Southern Oscillation [ENSO] dynamics) persist. The equilibrium climate sensitivity and transient climate response have both increased from the previous climate model IPSL‐CM5A‐LR used in CMIP5. A large ensemble of more than 30 members for the historical period (1850–2018) and a smaller ensemble for a range of emissions scenarios (until 2100 and 2300) are also presented and discussed.", "link": "https://doi.org/10.1029/2019ms002010", "authors": "Olivier Boucher, Jérôme Servonnat, Anna Lea Albright, Olivier Aumont, Yves Balkanski, Vladislav Bastrikov, Slimane Bekki, Rémy Bonnet", "source": "Journal of Advances in Modeling Earth Systems", "published": "2020-7", "first_seen": "2026-11-24T14:57:46+00:00", "score": 55, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-026-01334-7", "title": "Bridging idealized and operational models: an explainable AI framework for Earth system emulators", "summary": "Computer models are indispensable tools for understanding the Earth system. While high-resolution operational models have achieved many successes, they exhibit persistent biases, particularly in simulating extreme events and statistical distributions. In contrast, coarse-grained idealized models isolate fundamental processes and can be precisely calibrated to excel in characterizing specific dynamical and statistical features. However, different models remain siloed by disciplinary boundaries. By leveraging the complementary strengths of models of varying complexity, we develop an explainable AI framework for Earth system emulators. It bridges the model hierarchy through a reconfigured latent data assimilation technique, uniquely suited to exploit the sparse output from the idealized models. The resulting bridging model inherits the high resolution and comprehensive variables of operational models while achieving global accuracy enhancements through targeted improvements from idealized models. Crucially, the mechanism of AI provides a clear rationale for these advancements, moving beyond black-box correction to physically insightful understanding in a computationally efficient framework that enables effective physics-assisted digital twins and uncertainty quantification. We demonstrate its power by significantly correcting biases in CMIP6 simulations of El Niño spatiotemporal patterns, leveraging statistically accurate idealized models. This work also highlights the importance of pushing idealized model development and advancing communication between modeling communities.", "link": "https://doi.org/10.1038/s41612-026-01334-7", "authors": "Pouria Behnoudfar, Charlotte Moser, Marc Bocquet, Sibo Cheng, Nan Chen", "source": "npj Climate and Atmospheric Science", "published": "2026-1-30", "first_seen": "2026-11-24T14:57:46+00:00", "score": 55, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["cmip6", "extreme", "emulator", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-020-05447-4", "title": "Bias correction of temperature and precipitation over China for RCM simulations using the QM and QDM methods", "summary": "Two different bias correction methods, the quantile mapping (QM) and quantile delta mapping (QDM), are applied to simulated daily temperature and precipitation over China from a set of 21st century regional climate model (the ICTP RegCM4) projections. The RegCM4 is driven by five different general circulation models (GCMs) under the representative concentration pathway RCP4.5 at a grid spacing of 25 km using the CORDEX East Asia domain. The focus is on mean temperature and precipitation in December–January–February (DJF) and June–July–August (JJA). The impacts of the two methods on the present day biases and future change signals are investigated. Results show that both the QM and QDM methods are effective in removing the systematic model biases during the validation period. For the future changes, the QDM preserves the temperature change signals well, in both magnitude and spatial distribution, while the QM artificially modifies the change signal by decreasing the warming and modifying the patterns of change. For precipitation, both methods preserve the change signals well but they produce greater magnitude of the projected increase, especially the QDM. We also show that the effects of bias correction are variable- and season-dependent. Our results show that different bias correction methods can affect in different way the simulated change signals, and therefore care has to be taken in carrying out the bias correction process.", "link": "https://doi.org/10.1007/s00382-020-05447-4", "authors": "Yao Tong, Xuejie Gao, Zhenyu Han, Yaqi Xu, Ying Xu, Filippo Giorgi", "source": "Climate Dynamics", "published": "2020-9-8", "first_seen": "2026-11-24T14:57:46+00:00", "score": 55, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-014-2242-1", "title": "Benefit of convection permitting climate model simulations in the representation of convective precipitation", "summary": "", "link": "https://doi.org/10.1007/s00382-014-2242-1", "authors": "G. Fosser, S. Khodayar, P. Berg", "source": "Climate Dynamics", "published": "2014-8-2", "first_seen": "2026-11-24T14:57:46+00:00", "score": 55, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-17-0136.1", "title": "Improving the Explicit Prediction of Freezing Rain in a Kilometer-Scale Numerical Weather Prediction Model", "summary": "A freezing rain event, in which the Meteorological Centre of Canada’s 2.5-km numerical weather prediction system significantly underpredicted the quantity of freezing rain, is examined. The prediction system models precipitation types explicitly, directly from the Milbrandt–Yau microphysics scheme. It was determined that the freezing rain underprediction for this case was due primarily to excessive refreezing of rain, originating from melting snow and graupel, in and under the temperature inversion of the advancing warm front ultimately depleting the supply of rain reaching the surface. The refreezing was caused from excessive collisional freezing between rain and graupel. Sensitivity experiments were conducted to examine the effects of a temperature threshold for collisional freezing and on varying the values of the collection efficiencies between rain and ice-phase hydrometeors. It was shown that by reducing the rain–graupel collection efficiency and by imposing a temperature threshold of −5°C, above which collisional freezing is not permitted, excessive rain–graupel collection and graupel formation can be controlled in the microphysics scheme, leading to an improved simulation of freezing rain at the surface.", "link": "https://doi.org/10.1175/waf-d-17-0136.1", "authors": "Agnieszka Barszcz, Jason A. Milbrandt, Julie M. Thériault", "source": "Weather and Forecasting", "published": "2018-5-17", "first_seen": "2026-11-24T14:57:46+00:00", "score": 55, "topics": ["Downscaling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-21-0179.1", "title": "Forecasting Convection with a “Scale-Aware” Tiedtke Cumulus Parameterization Scheme at Kilometer Scales", "summary": "A scale-aware convective parameterization based on the Tiedtke scheme is developed and tested in the Weather Research and Forecasting (WRF) Model and the Model for Prediction Across Scales (MPAS) for a few convective cases at grid sizes in the ranges of 1.5–4.5 km. These tests demonstrate that the scale-aware scheme effectively reduces the outcome of deep convection by decreasing the convective portion of the total surface precipitation. When compared to the model runs that use microphysics without the cumulus parameterization at these grid sizes, the modified Tiedtke scheme is shown to improve some aspects of the precipitation forecasts. When the scheme is applied on a variable mesh in MPAS, it handles the convection across the mesh transition zones smoothly. Significance Statement Representing convection accounting for variations in the size of grid mesh is crucial in numerical models with variable resolutions, and in precipitation events where convection is not well depicted even by a model mesh of a few kilometers. Many convective parameterizations have already considered this grid-size dependency. This paper fills a gap by applying the same concept to a different convective parameterization, and evaluating it in a few precipitation forecast scenarios.", "link": "https://doi.org/10.1175/waf-d-21-0179.1", "authors": "Wei Wang", "source": "Weather and Forecasting", "published": "2022-8", "first_seen": "2026-11-24T14:57:46+00:00", "score": 55, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf2007106.1", "title": "Some Practical Considerations Regarding Horizontal Resolution in the First Generation of Operational Convection-Allowing NWP", "summary": "During the 2005 NOAA Hazardous Weather Testbed Spring Experiment two different high-resolution configurations of the Weather Research and Forecasting-Advanced Research WRF (WRF-ARW) model were used to produce 30-h forecasts 5 days a week for a total of 7 weeks. These configurations used the same physical parameterizations and the same input dataset for the initial and boundary conditions, differing primarily in their spatial resolution. The first set of runs used 4-km horizontal grid spacing with 35 vertical levels while the second used 2-km grid spacing and 51 vertical levels. Output from these daily forecasts is analyzed to assess the numerical forecast sensitivity to spatial resolution in the upper end of the convection-allowing range of grid spacing. The focus is on the central United States and the time period 18–30 h after model initialization. The analysis is based on a combination of visual comparison, systematic subjective verification conducted during the Spring Experiment, and objective metrics based largely on the mean diurnal cycle of the simulated reflectivity and precipitation fields. Additional insight is gained by examining the size distributions of the individual reflectivity and precipitation entities, and by comparing forecasts of mesocyclone occurrence in the two sets of forecasts. In general, the 2-km forecasts provide more detailed presentations of convective activity, but there appears to be little, if any, forecast skill on the scales where the added details emerge. On the scales where both model configurations show higher levels of skill—the scale ", "link": "https://doi.org/10.1175/waf2007106.1", "authors": "John S. Kain, Steven J. Weiss, David R. Bright, Michael E. Baldwin, Jason J. Levit, Gregory W. Carbin, Craig S. Schwartz, Morris L. Weisman", "source": "Weather and Forecasting", "published": "2008-10-1", "first_seen": "2026-11-24T14:57:46+00:00", "score": 55, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2022.26", "title": "DL4DS—Deep learning for empirical downscaling", "summary": "A common task in Earth Sciences is to infer climate information at local and regional scales from global climate models. Dynamical downscaling requires running expensive numerical models at high resolution, which can be prohibitive due to long model runtimes. On the other hand, statistical downscaling techniques present an alternative approach for learning links between the large- and local-scale climate in a more efficient way. A large number of deep neural network-based approaches for statistical downscaling have been proposed in recent years, mostly based on convolutional architectures developed for computer vision and super-resolution tasks. This paper presents deep learning for empirical downscaling (DL4DS), a python library that implements a wide variety of state-of-the-art and novel algorithms for downscaling gridded Earth Science data with deep neural networks. DL4DS has been designed with the goal of providing a general framework for training convolutional neural networks with configurable architectures and learning strategies to facilitate the conduction of comparative and ablation studies in a robust way. We showcase the capabilities of DL4DS on air quality Copernicus Atmosphere Monitoring Service (CAMS) data over the western Mediterranean area. The DL4DS library can be found in this repository: https://github.com/carlos-gg/dl4ds", "link": "https://doi.org/10.1017/eds.2022.26", "authors": "Carlos Alberto Gomez Gonzalez", "source": "Environmental Data Science", "published": "2023", "first_seen": "2026-11-24T14:57:46+00:00", "score": 55, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2026.10051", "title": "Calibrated conformal prediction intervals for microphysical process rates", "summary": "Conformal prediction (CP) can yield statistically valid prediction intervals for any regression model, with no model modifications and small computational costs. To assess its practical value, we apply conformal methods to quantify uncertainty in machine learning emulators of six microphysical process rates (MPRs). MPRs describe small-scale processes in atmospheric clouds such as precipitation formation and aerosol–cloud interactions and help understand weather and climate. The emulators are trained on simulation output from the ICOsahedral Nonhydrostatic (ICON) model in a limited-area numerical weather prediction configuration. We compare split CP for deterministic emulators with conformalized quantile regression (CQR) for quantile regression (QR) emulators. Both CP methods yield well-calibrated and sharp prediction intervals on average, but CQR provides more consistent intervals across several orders of magnitude, making it preferable for the uncertainty quantification of climate variables.", "link": "https://doi.org/10.1017/eds.2026.10051", "authors": "Miriam Simm, Corinna Hoose, Tom Beucler", "source": "Environmental Data Science", "published": "2026", "first_seen": "2026-11-24T14:57:46+00:00", "score": 55, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": ["Tom Beucler"], "boosts": ["precipitation", "emulator", "uncertainty"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": true, "cites": null}, {"key": "arxiv:2610.17896", "title": "Cumulus parameterization controls simulated rainfall more than microphysics, but not at heavy thresholds: a 3 * 2 factorial WRF study over the Western Himalaya", "summary": "Rainfall forecasts over the Western Himalaya remain poor, and the relative contributions of the cumulus and microphysics parameterizations to that error are not well constrained.", "link": "https://arxiv.org/abs/2610.17896", "authors": "Satyam Kumar, Akshay Sunil, Devesh Sheoran", "source": "arXiv", "published": "2026-10-13", "first_seen": "2026-11-24T14:57:46+00:00", "score": 54, "topics": ["Climate Modelling"], "watch": [], "boosts": ["himalaya"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2605.25161", "title": "FMSIM: A Multimodal Flow Matching Framework for Conditional Geomodeling", "summary": "Subsurface geomodeling plays a critical role in reservoir characterization, uncertainty quantification, and subsurface flow prediction. However, integrating heterogeneous sources of geological information, including conceptual geological descriptions, sparse well observations, and spatial prior constraints, remains a significant challenge for traditional geostatistical and data-driven geomodeling approaches. In this study, we present FMSIM, a multi-modal conditional flow matching framework for subsurface facies model generation. FMSIM utilizes a deep learning formulation to learn a velocity field that transports samples from a simple prior distribution to a complex geological facies distribution. Global geological semantic information is incorporated through a learned semantic representation framework and a learned prior model, while local hard constraints are enforced via an iterative projection strategy during sampling to ensure 100% fidelity to well observations. Additionally, a temporal guidance gating mechanism is introduced to regulate the influence of spatial probability maps, balancing large-scale trend alignment with fine-scale geological variability. Benefiting from the framework design, the model enables efficient and stable training with a simple loss function. The framework's fully convolutional architecture also demonstrates promising generalization to moderately larger grid sizes not seen during training without retraining. Results on a synthetic fluvial channel dataset indicate that FMSIM captures complex non-stationary geological features and produces geolo", "link": "https://arxiv.org/abs/2605.25161", "authors": "Jiayuan Huang, Suihong Song, Tapan Mukerji", "source": "arXiv", "published": "2026-05-24", "first_seen": "2026-11-24T14:57:46+00:00", "score": 54, "topics": ["Deep Learning"], "watch": [], "boosts": ["flow matching", "uncertainty"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2602.05083", "title": "Large-Ensemble Simulations Reveal Links Between Atmospheric Blocking Frequency and Sea Surface Temperature Variability", "summary": "Atmospheric blocking events drive persistent weather extremes in midlatitudes, but isolating the influence of sea surface temperature (SST) from chaotic internal atmospheric variability on these events remains a challenge. We address this challenge using century-long (1900-2010), large-ensemble simulations with two computationally efficient deep-learning general circulation models. We find these models skillfully reproduce the observed blocking climatology, matching or exceeding the performance of a traditional high-resolution model and representative CMIP6 models. Averaging the large ensembles filters internal atmospheric noise to isolate the SST-forced component of blocking variability, yielding substantially higher correlations with reanalysis than for individual ensemble members. We identify robust teleconnections linking Greenland blocking frequency to North Atlantic SST and El Niño-like patterns. Furthermore, SST-forced trends in blocking frequency show a consistent decline in winter over Greenland, and an increase over Europe. These results demonstrate that SST variability exerts a significant and physically interpretable influence on blocking frequency and establishes large ensembles from deep learning models as a powerful tool for separating forced SST signals from internal noise.", "link": "https://arxiv.org/abs/2602.05083", "authors": "Zilu Meng, Gregory J. Hakim, Wenchang Yang, Gabriel A. Vecchi", "source": "arXiv", "published": "2026-02-04", "first_seen": "2026-11-24T14:57:46+00:00", "score": 54, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["cmip6", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2511.18704", "title": "A multiresolution weather dataset for the Southwestern South Atlantic (2017-2018)", "summary": "The Southwestern South Atlantic (SWSA) is a key region for climate research and renewable energy assessment, yet high-resolution meteorological data are scarce. We present a multiresolution dataset spanning February 2017--November 2018, combining Weather Research and Forecasting (WRF) simulations with Sentinel-1A/B Syntheti
