kilometre-scale resolution", "summary": "Sea surface temperature (SST) from ERA5 reanalysis (0.25° × 0.25°) is too coarse to resolve fronts and mesoscale eddies in coastal waters. Here we construct a physics-informed neural network (PINN) that embeds the ocean advection–diffusion equation as a training constraint. The network takes spatiotemporal coordinates as input, uses coarse ERA5 SST as supervised labels, and outputs physically consistent high-resolution SST. Applied to daily ERA5 data over the Yellow Sea for 2021, the model downscales SST from 0.25° to 5 km resolution. Applied to daily ERA5 data over the Yellow Sea for 2021, the model downscales SST from 0.25° to 5 km resolution with a root-mean-square error of 0.94 °C and R2 of 0.92. This model outperforms traditional methods such as bilinear interpolation. It also preserves thermodynamically consistent fine-scale structures at temperature fronts and water-mass boundaries. This framework offers a physically credible route for generating high-resolution coastal reanalysis datasets and is extensible to other ocean variables.", "link": "https://doi.org/10.1117/12.3131069", "authors": "Si-Qi Zhang, Dong Zhang", "source": "International Conference on Remote Sensing, Mapping, and Geographic Systems", "published": "2026-10-22", "first_seen": "2026-11-23T21:44:54+00:00", "score": 89, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "arxiv:2610.03757", "title": "Generalizable Neural Downscaling of Earth System Model Wind Fields via Continuous Dynamics Modeling", "summary": "Accurate high-resolution wind field simulations are critical for resolving fine-scale atmospheric dynamics, yet the simulation of wind fields in Earth System Models (ESMs) remains limited by coarse spatial resolution and systematic biases. To address this, data-driven down scaling techniques have been widely used to enhance coarse-resolution ESM outputs. However, existing methods are typically tied to fixed discretizations, limiting generalization across models with different native resolutions. Here we formulate global near-surface wind downscaling as an operator-learning problem on continuous atmospheric state fields and develop a downscaling neural operator that maps coarse-scale fields to fine-scale counterparts across heterogeneous discretizations. The operator learning-based neural downscaling framework outperforms dominant baselines, recovers fine-scale physical structures, and generalizes to previously unseen ESMs and future climate scenarios without retraining, while preserving long-term wind projection trends. These findings establish a generalizable paradigm for high-resolution climate downscaling across diverse simulation outputs and future scenarios.", "link": "https://arxiv.org/abs/2610.03757", "authors": "Chen Yu, Jia-Nan Wei, Han-Lin Kong, Hao Sun, B. He, Wen-Guan Wang", "source": "Semantic Scholar", "published": "2026-09-26", "first_seen": "2026-11-23T21:44:54+00:00", "score": 87, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.3390/cli14110233", "title": "AI-Based Super-Resolution Approaches to Reconstruct Temperature Fields of Climatic Data Using Deep Neural Networks", "summary": "High-fidelity climate analysis is heavily constrained both by the computational costs of high-resolution dynamical simulations and by the general scarcity of fine-scale observational data for model evaluation. To address these limitations, in this work we propose a deep learning framework for spatial climate downscaling using an AI-based super-resolution (SR) approach. We develop Deep Neural Network architectures designed to upscale 2 m surface temperature fields, bridging the gap between gridded global reanalysis data at lower scale (1.0°) and higher scale (0.25°). We developed three DNN models, specifically ResNet, RNN, and ConvRNN, trained and validated on ECMWF ERA5 data from the early years of the current millennium (i.e., 01/01,01/04,01/07,01/10 of 2001,2003,2005 at 00:00) and evaluated over various periods, including 1992, a historical period influenced by the 1991 Mount Pinatubo eruption (a large volcanic eruption which is known to have had impacts on the climate due to the massive stratospheric injections of sulfur dioxide). The framework is tested also on the Berkeley Earth global observational dataset and on outputs from a MPI-ESM1-2-LR historical global climate simulation and compared with traditional interpolation methods, to verify the models generalization capability. The models reached high levels of accuracy, with errors lower than 0.5 K and a similarity index higher than 0.97, successfully capturing the spatio-temporal dynamics of temperature fields. Overall, the novelty of this work is in three main aspects: the implementation of DNN capable to capture th", "link": "https://doi.org/10.3390/cli14110233", "authors": "E. Amato, Lorenzo Basile, V. Zago, D. Zanchettin, C. del Negro", "source": "Climate", "published": "2026-11-01", "first_seen": "2026-11-23T21:44:54+00:00", "score": 87, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "arxiv:2607.17037", "title": "Apeliotes: A Diffusion-Based Modeling Framework for km-scale Multi-Level Atmospheric Fields", "summary": "High-resolution atmospheric data are required to resolve mesoscale and localized meteorological structures, however, such datasets remain limited in many regions of the world. Existing high-resolution weather products are typically produced through dynamical downscaling, which is computationally expensive and difficult to scale across locations, variables, and forecast scenarios. These limitations motivate machine-learning-based downscaling systems that can generate multiple weather variables stochastically while producing new high-resolution fields directly. In this paper we present Apeliotes, a framework for high-resolution weather forecasting. Built on the global re-analysis atmospheric data, a pre-trained global weather foundation model, and a regionally trained generative diffusion model, Apeliotes not only provides accurate kilometer-scale weather variables, but also multi-level atmospheric fields which are not directly available in the existing global atmospheric data. Our comprehensive evaluation demonstrates that Apeliotes achieves highly competitive performance. The model predicts vertical wind profile with less than 3% error between truth and predicted fields, achieving correlations of 0.91 for 10-m wind speed and 0.99 for 2-m temperature, with NRMSE values of 0.42 and 0.17, respectively.", "link": "https://arxiv.org/abs/2607.17037", "authors": "Evangelia Rafaela Frastali, Achyut Paudel, Maryam Golbazi, Frank Liu", "source": "International Conference on Machine Learning and Applications", "published": "2026-07-19", "first_seen": "2026-11-23T21:44:54+00:00", "score": 87, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["diffusion model"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "doi:10.5194/essd-18-7593-2026", "title": "High-resolution global groundwater storage anomalies: a 1 km downscaled dataset", "summary": "Groundwater depletion poses a challenge to water security, but the coarse spatial resolution of Gravity Recovery and Climate Experiment (GRACE) observations limits the characterization of groundwater variability at regional and local scales. Here, we present a 1 km monthly global groundwater storage anomaly (GWSA) dataset covering April 2002–December 2020. The dataset was generated using Singular Spectrum Analysis (SSA) for temporal gap filling, 19 high-resolution hydroclimatic and geophysical predictors, and aquifer-stratified machine-learning downscaling. Extreme Gradient Boosting (XGBoost) and deep neural networks (DNN) were evaluated as candidate models, and XGBoost was selected for dataset production based on internal, cross-scale, and in-situ evaluations. When aggregated to the original GRACE scale, the 1 km product agreed closely with the original GWSA ( R 2 = 0.972, RMSE = 2.10 cm). Independent evaluation used a global archive of 152 069 groundwater-monitoring wells and a 1° spatial-block calibration–validation design. Effective specific yield ( S yeff ) was estimated from calibration blocks and transferred to held-out blocks before comparison at a common 0.25° grid. For XGBoost, the held-out evaluation yielded R 2 = 0.538, RMSE = 0.378 cm yr −1 , and Bias = 0.106 cm yr −1 . The association between modeled and observation-derived trends remained similar under ± 30 % perturbations in S yeff , although amplitude-related metrics were more sensitive to the conversion coefficient. Standardized time-series comparisons and monthly evaluations of representative aquifers sho", "link": "https://doi.org/10.5194/essd-18-7593-2026", "authors": "Chen Zhang, Yi-Fei Fan, Wen-Xia Han, Ying-Chun Ge, Jia-Bei Zhu, Tao Che", "source": "Earth System Science Data", "published": "2026-10-19", "first_seen": "2026-11-23T21:44:54+00:00", "score": 86, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": ["india", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1007/s12665-026-13186-8", "title": "Enhancing GRACE-derived terrestrial water storage estimates through bias-corrected downscaling using machine learning and artificial bee colony optimization", "summary": "Accurate monitoring of spatiotemporal variations of Terrestrial Water Storage (TWS) is essential for sustainable water resources management in arid and semi-arid regions. The Gravity Recovery and Climate Experiment (GRACE) and GRACE-Follow On (GRACE-FO) satellite missions serve as valuable tools for estimating changes in TWS; however, their coarse spatial resolution poses challenges for applications at local and regional scales. In this study, downscaling of the GRACE data for the Yazd province, Iran, was conducted using three Machine Learning (ML) models, including Extreme Gradient Boosting (XGBoost) and two Deep Neural Networks, i.e., DNN1 and DNN2, while the latter has more hidden layers than the former. To enhance accuracy and reduce the systematic bias in the model outputs, the Artificial Bee Colony (ABC) metaheuristic algorithm and a hybrid version combining ABC and Quantile Mapping were employed as the bias correction framework. The input data for the models were derived from high-resolution datasets, including CHIRPS for precipitation and TerraClimate for climatic variables listed in Table 1. The performance evaluation of the models, based on statistical indices, indicated that the XGBoost model achieved the highest accuracy in reproducing TWS anomalies (R2 = 0.829) and the lowest error among the ML models. The implementation of the ABC algorithm resulted in a 12.45% reduction in root mean square errors (RMSE) and improved the consistency between model outputs and observations from piezometer wells. Temporal and spatial analyses demonstrate a continuous decline in e", "link": "https://doi.org/10.1007/s12665-026-13186-8", "authors": "M. Goodarzi, Masoud Asgarzadeh Torghabeh, Majid Niazkar", "source": "Environmental Earth Sciences", "published": "2026-10-30", "first_seen": "2026-11-23T21:44:54+00:00", "score": 85, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.3390/hydrology13110307", "title": "Evaluating the Long-Term Robustness of Hybrid Deep Learning Models for Streamflow Projections Under Climate Change", "summary": "Data-driven models can help represent hydrological processes at the basin scale and predict future conditions, particularly in basins where information on physical characteristics is limited. Although these models have long been used in hydrological modeling, their reliability for long-term projections under changing climatic conditions remains insufficiently understood. This study evaluates the long-term robustness and projection consistency of data-driven algorithms under climate-change conditions using two hybrid deep learning architectures: (1) a Wavelet Transform–Deep Neural Network (WT–DNN) and (2) a Convolutional Neural Network–Long Short-Term Memory–Attention Block (CNN–LSTM–AB). It also investigates whether synthetic data augmentation using a Generative Adversarial Network (GAN) during model training improves predictive performance. The study used hydrological and climatic data, including streamflow, precipitation, minimum temperature, and maximum temperature, from the Yamula Reservoir Basin, a semi-arid agricultural basin in Türkiye. The models were trained and validated for monthly streamflow using climate data from the HadGEM2–ES global circulation model for the 2000–2020 period. Long-term streamflow projections for 2021–2098 were then generated under the RCP4.5 and RCP8.5 scenarios. Model performance and robustness were assessed through sensitivity analysis, comparison of models trained with and without GAN-based data augmentation, comparison with long short-term memory (LSTM) and other recently proposed hybrid deep learning architectures, and evaluation of lon", "link": "https://doi.org/10.3390/hydrology13110307", "authors": "Arshya Razavi Nematollahi, Mete Çelik, Filiz Dadaser-celik", "source": "Hydrology", "published": "2026-11-17", "first_seen": "2026-11-23T21:44:54+00:00", "score": 84, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "s2:bcaf88659ca33302e6d9723f1b1fc5efd8269df4", "title": "Comprehensive evaluation on the robustness of deep learning based rainfall-runoff models under climate change scenarios", "summary": "", "link": "https://www.semanticscholar.org/paper/bcaf88659ca33302e6d9723f1b1fc5efd8269df4", "authors": "Aldo A. Tapia, A. Bennett", "source": "Semantic Scholar", "published": "", "first_seen": "2026-11-23T21:44:54+00:00", "score": 84, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1109/isctis70043.2026.11572552", "title": "A Convolutional Neural Network-Based Statistical Downscaling Study of ERA5 Air Temperature at the Station Scale", "summary": "To evaluate the performance of Convolutional Neural Networks (CNN) in the station-scale application of reanalysis data, this study conducts a statistical downscaling investigation of ERA5 temperature data, using lution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "doi:10.1016/j.aiig.2026.100226", "title": "Deep learning–based downscaling of ERA5-Land temperature to 250 m resolution over the Trentino–South Tyrol Alpine region", "summary": "", "link": "https://doi.org/10.1016/j.aiig.2026.100226", "authors": "Ihcene Djouama, Nabil Kadache, Rachid Seghir", "source": "Artificial Intelligence in Geosciences", "published": "2026-05-01", "first_seen": "2026-11-23T21:44:54+00:00", "score": 84, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "doi:10.1108/ijccsm-09-2025-0332", "title": "Unlocking wind energy potential in data-scarce regions: a deep learning framework for strategic climate action in Vietnam’s Central Highlands", "summary": "As Vietnam accelerates its transition toward a sustainable energy future under ambitious national strategies like the Power Development Plan VIII (PDP8), a critical barrier persists: the lack of high-fidelity resource maps for strategic planning. This is particularly acute in data-scarce regions with high potential, such as Vietnam’s Central Highlands. This study aims to address this strategic gap by developing and validating a robust deep learning framework to produce an enhanced and detailed high-resolution wind energy map for this region, providing a conservative proof-of-concept for regional energy planning. The framework integrates coarse-resolution daily wind speed data from an ensemble of 11 global climate models with long-term observational records (1985–2023) from a sparse network of meteorological stations. To preserve synoptic extremes critical for wind power   $(id).onclick = e => { const b=e.target.closest('button'); if(!b) return; F[key] = isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v; render(); };
}
seg('win', [[3,'3 days'],[7,'Week'],[30,'Month']], 'win');
seg('sort', [['rel','Relevance'],['new','Newest']], 'sort');
const srcs = [...new Set(items.map(i => i.source.startsWith('Google Scholar') ? 'Google Scholar alert' : i.source))].sort();
$('src').innerHTML = '<option value="">All sources</option>' + srcs.map(s => `<option>${esc(s)}</option>`).join('');
$('src').onchange = e => { F.src = e.target.value; render(); };
$('q').oninput = e => { F.q = e.target.value.toLowerCase().trim(); render(); };

function base(it){
  if ((Date.now() - it.seen) > F.win * 864e5) return false;
  if (F.topic && !it.topics.includes(F.topic)) return false;
  if (F.person && !(it.watch||[]).includes(F.person)) return false;
  if (F.src && !(it.source === F.src || (F.src === 'Google Scholar alert' && it.source.startsWith('Google Scholar')))) return false;
  if (F.q && !F.q.split(/\s+/).every(w => it.hay.includes(w))) return false;
  return true;
}

function sidebar(){
  const pool = items.filter(base);
  $('views').innerHTML = VIEWS.map(([v,l,fn]) =>
    `<button data-v="${v}" aria-pressed="${F.view==v}"><span>${l}</span><small>${pool.filter(fn).length}</small></button>`).join('');
  const tc = t => items.filter(i => P(i) && i.topics.includes(t)).length;
  $('topics').innerHTML = D.topics.map(t => `<button class="chip" data-t="${esc(t)}" aria-pressed="${F.topic==t}">${esc(t)} <small>${tc(t)}</small></button>`).join('');
  $('people').innerHTML = D.people.length ? D.people.map(p => {
    const n = items.filter(i => P(i) && (i.watch||[]).includes(p.name)).length;
    return `<button data-p="${esc(p.name)}" aria-pressed="${F.person==p.name}"><span><span class="pn">${esc(p.name)}</span><br><span class="pw">${esc(p.where)}</span></span><span class="pc ${n?'on':''}">${n}</span></button>`;
  }).join('') : '<p class="pw">Add names under watch_people in config.yml.</p>';
}
$('views').onclick = e => { const b=e.target.closest('button'); if(b){ F.view=b.dataset.v; render(); } };
$('topics').onclick = e => { const b=e.target.closest('button'); if(b){ F.topic = F.topic==b.dataset.t ? null : b.dataset.t; render(); } };
$('people').onclick = e => { const b=e.target.closest('button'); if(b){ F.person = F.person==b.dataset.p ? null : b.dataset.p; if(F.person) F.view='all'; render(); } };

function dayLabel(d){
  const a = new Date(d); a.setHours(0,0,0,0); const t = new Date(); t.setHours(0,0,0,0);
  const diff = Math.round((t - a) / 864e5);
  return diff===0 ? 'Today' : diff===1 ? 'Yesterday' : a.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
}
function authorsHtml(it){
  let s = esc(it.authors);
  (it.watch||[]).forEach(n => { s = s.replace(new RegExp(esc(n).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'), m => `<mark>${m}</mark>`); });
  return s;
}
function card(it, i){
  const bars = Math.max(1, Math.min(5, Math.ceil((it.score||0) / 20)));
  const isJob = it.kind === 'job';
  const id = it.key.replace(/^(arxiv|doi):/,'');
  const links = [];
  if (isJob) links.length = 0;
  else if (it.isArxiv){ links.push(`<a href="https://arxiv.org/pdf/${esc(id)}">PDF</a>`, `<a href="https://www.alphaxiv.org/abs/${esc(id)}">Discuss on alphaXiv</a>`); }
  if (!isJob) links.push(`<a href="https://www.semanticscholar.org/search?q=${encodeURIComponent(it.title)}">Semantic Scholar</a>`);
  const badge = it.kind==='rec' ? '<span class="kind">Recommended</span>' : it.kind==='cite' ? '<span class="kind">Cites you</span>' : isJob ? '<span class="kind">Job ad</span>' : '';
  const why = it.kind==='cite' && it.cites && it.cites[0] ? `<div class="why">Cites your paper <em>${esc(it.cites[0])}</em></div>`
            : it.why && !isJob ? `<div class="why">Close to ${esc(it.why.src)}: <em>${esc(it.why.title)}</em></div>` : '';
  return `<li class="p${S.done[it.key]?' done':''}${openSet.has(it.key)?' open':''}" data-i="${i}">
    <div class="rel" title="Relevance ${it.score} of 100">${[1,2,3,4,5].map(n=>`<i class="${n<=bars?'on':''}"></i>`).join('')}</div>
    <div>
      <a class="t" href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title)}</a>
      <div class="m">${badge}<span>${esc(it.source)}${it.kind!=='paper'&&it.published?', '+esc(String(it.published).slice(0,10)):''}</span>${isNew(it)?'<span class="w">New</span>':''}${(it.watch||[]).length?'<span class="w">Watched author</span>':''}${it.topics.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${(it.boosts||[]).length?`<span>also: ${esc(it.boosts.map(b=>b.replace('*','')).join(', '))}</span>`:''}</div>
      ${it.authors?`<div class="au">${authorsHtml(it)}</div>`:''}
      ${why}
      ${it.summary?`<p class="ab">${esc(it.summary)}</p>`:''}
      <div class="act">
        ${it.summary?'<button data-a="ab">Abstract</button>':''}
        <button class="st" data-a="star" aria-pressed="${!!S.star[it.key]}">${S.star[it.key]?'Starred':'Star'}</button>
        <button data-a="done">${S.done[it.key]?'Mark unread':'Mark read'}</button>
        <button data-a="no">${S.no[it.key]?'Undo not for me':'Not for me'}</button>
        ${isJob?'':'<button data-a="cite">Copy BibTeX</button>'}
        ${links.join('')}
      </div>
    </div></li>`;
}

function render(){
  sidebar();
  ['win','sort'].forEach(id => [...$(id).children].forEach(b => b.setAttribute('aria-pressed', String(F[id]) === b.dataset.v)));
  const fn = VIEWS.find(v => v[0]==F.view)[2];
  shown = items.filter(it => base(it) && fn(it));
  shown.sort(F.sort==='rel' ? (a,b) => b.score - a.score || b.seen - a.seen : (a,b) => b.seen - a.seen || b.score - a.score);
  $('count').textContent = shown.length + (shown.length===1?' paper':' papers');
  if (!shown.length){
    const msg = F.view==='inbox' ? 'You are through today\'s picks. Open All papers for the rest, or come back tomorrow.' :
                F.view==='cite' ? 'No new citations found yet. They appear here as soon as Semantic Scholar lists them.' :
                F.view==='job' ? 'No matching postdoc ads right now. Add Google Alerts or job-site feeds under jobs in config.yml.' :
                F.view==='star' ? 'No starred papers yet. Star a paper to keep it here and export it to Zotero.' :
                'No papers match these filters. Clear the search or pick another topic.';
    $('list').innerHTML = `<p class="empty">${msg}</p>`; cur=-1; return;
  }
  let html = '', lastDay = '';
  shown.forEach((it,i) => {
    if (F.sort==='new'){ const d = dayLabel(it.seen); if (d!==lastDay){ if(lastDay) html+='</ol>'; html += `<h3 class="day">${d}</h3><ol>`; lastDay=d; } }
    else if (i===0) html += '<ol>';
    html += card(it,i);
  });
  $('list').innerHTML = html + '</ol>';
  if (cur >= shown.length) cur = shown.length - 1;
  mark();
}

function bib(it){
  const first = (it.authors.split(',')[0]||'anon').trim().split(' ').pop().replace(/[^A-Za-z]/g,'');
  const year = (it.published||it.first_seen).slice(0,4);
  const word = (it.title.match(/[A-Za-z]{4,}/)||['paper'])[0].toLowerCase();
  const id = it.key.replace(/^(arxiv|doi):/,'');
  const au = it.authors.split(',').map(s=>s.trim()).filter(Boolean).join(' and ');
  return it.isArxiv
    ? `@misc{${first}${year}${word},\n  title = {${it.title}},\n  author = {${au}},\n  year = {${year}},\n  eprint = {${id}},\n  archivePrefix = {arXiv},\n  url = {${it.link}}\n}`
    : `@article{${first}${year}${word},\n  title = {${it.title}},\n  author = {${au}},\n  journal = {${it.source}},\n  year = {${year}},\n  doi = {${id}}\n}`;
}
function copy(t, msg){ (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(()=>toast(msg), ()=>prompt('Copy:', t)); }
function download(name, text){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'})); a.download=name; a.click(); URL.revokeObjectURL(a.href); }

function act(it, a, li){
  if (a==='ab'){ openSet.has(it.key) ? openSet.delete(it.key) : openSet.add(it.key); li.classList.toggle('open'); return; }
  if (a==='star'){ S.star[it.key] ? delete S.star[it.key] : (S.star[it.key] = Object.assign({}, it, {hay:undefined, seen:undefined})); save(); toast(S.star[it.key]?'Starred':'Star removed'); }
  if (a==='no'){ S.no[it.key] ? delete S.no[it.key] : (S.no[it.key] = {title: it.title, summary: (it.summary||'').slice(0,600)}); save(); toast(S.no[it.key]?'Noted. Export likes.json to teach the ranker':'Undone'); }
  if (a==='done'){ S.done[it.key] ? delete S.done[it.key] : (S.done[it.key]=1); save(); }
  if (a==='cite'){ copy(bib(it), 'BibTeX copied'); return; }
  const keep = cur; render(); cur = Math.min(keep, shown.length-1); mark();
}
$('list').onclick = e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const li = b.closest('li.p'); cur = +li.dataset.i; act(shown[cur], b.dataset.a, li);
};
function mark(){
  document.querySelectorAll('li.p.cur').forEach(l => l.classList.remove('cur'));
  const li = document.querySelector(`li.p[data-i="${cur}"]`);
  if (li){ li.classList.add('cur'); const r=li.getBoundingClientRect(); if (r.top<0 || r.bottom>innerHeight) li.scrollIntoView({block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); }
}
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea') || e.metaKey || e.ctrlKey || e.altKey){ if (e.key==='Escape') e.target.blur(); return; }
  if (e.key==='/'){ e.preventDefault(); $('q').focus(); return; }
  if (e.key==='j'){ cur = Math.min(cur+1, shown.length-1); mark(); }
  else if (e.key==='k'){ cur = Math.max(cur-1, 0); mark(); }
  else if (cur>=0 && shown[cur]){
    const li = document.querySelector(`li.p[data-i="${cur}"]`);
    if (e.key==='a') act(shown[cur],'ab',li);
    else if (e.key==='s') act(shown[cur],'star',li);
    else if (e.key==='x') act(shown[cur],'done',li);
    else if (e.key==='n') act(shown[cur],'no',li);
    else if (e.key==='o') window.open(shown[cur].link,'_blank','noopener');
  }
});

const starred = () => Object.values(S.star);
$('bib').onclick = () => { const s=starred(); if(!s.length) return toast('Star some papers first'); download('starred-papers.bib', s.map(bib).join('\n\n')); };
$('md').onclick = () => { const s=starred(); if(!s.length) return toast('Star some papers first');
  copy(s.map(it => `- ${it.title} (${(it.authors.split(',')[0]||'').trim()} et al., ${it.source}, ${(it.published||it.first_seen).slice(0,4)}) ${it.link}\n  Why it matters: `).join('\n'), 'Reading notes copied'); };
$('teach').onclick = () => {
  const slim = o => Object.fromEntries(Object.entries(o).map(([k,v]) => [k, {title:v.title, summary:(v.summary||'').slice(0,800)}]));
  if (!Object.keys(S.star).length && !Object.keys(S.no).length) return toast('Star or mark some papers first');
  download('likes.json', JSON.stringify({star: slim(S.star), no: slim(S.no)}, null, 1));
  toast('Upload likes.json into the feed folder on GitHub');
};
$('backup').onclick = () => download('reading-desk-backup.json', JSON.stringify(S));
$('restore').onclick = () => { const f=document.createElement('input'); f.type='file'; f.accept='.json';
  f.onchange = () => f.files[0].text().then(t => { try { const o=JSON.parse(t); Object.assign(S.star, o.star||{}); Object.assign(S.done, o.done||{}); save(); render(); toast('Restored'); } catch(e){ toast('That file is not a reading desk backup'); } });
  f.click(); };

render();
})();
</script>
</body>
</html>
