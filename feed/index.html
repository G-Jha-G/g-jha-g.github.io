ift in the regional monsoons in RegCM-CORDEX simulations", "summary": "We use an unprecedented ensemble of regional climate model (RCM) projections over seven regional CORDEX domains to provide, for the first time, an RCM-based global view of monsoon changes at various levels of increased greenhouse gas (GHG) forcing. All regional simulations are conducted using RegCM4 at a 25 km horizontal grid spacing using lateral and lower boundary forcing from three General Circulation Models (GCMs), which are part of the fifth phase of the Coupled Model Inter-comparison Project (CMIP5). Each simulation covers the period from 1970 through 2100 under two Representative Concentration Pathways (RCP2.6 and RCP8.5). Regional climate simulations exhibit high fidelity in capturing key characteristics of precipitation and atmospheric dynamics across monsoon regions in the historical period. In the future period, regional monsoons exhibit a spatially robust delay in the monsoon onset, an increase in seasonality, and a reduction in the rainy season length at higher levels of radiative forcing. All regions with substantial delays in the monsoon onset exhibit a decrease in pre-monsoon precipitation, indicating a strong connection between pre-monsoon drying and a shift in the monsoon onset. The weakening of latent heat driven atmospheric warming during the pre-monsoon period delays the overturning of atmospheric subsidence in the monsoon regions, which defers their transitioning into deep convective states. Monsoon changes under the RCP2.6 scenario are mostly within the baseline variability.", "link": "https://doi.org/10.1007/s00382-020-05306-2", "authors": "Moetasim Ashfaq, Tereza Cavazos, Michelle Simões Reboita, José Abraham Torres-Alavez, Eun-Soon Im, Christiana Funmilola Olusegun, Lincoln Alves, Kesondra Key", "source": "Climate Dynamics", "published": "2020-6-4", "first_seen": "2026-11-26T13:59:01+00:00", "score": 51, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["monsoon", "precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-023-06931-3", "title": "Climatology of near-surface wind speed from observational, reanalysis and high-resolution regional climate model data over the Tibetan Plateau", "summary": "As near-surface wind speed plays a role in regulating surface evaporation and thus the hydrological cycle, it is crucial to explore its spatio-temporal characteristics. However, in-situ measurements are scarce over the Tibetan Plateau, limiting the understanding of wind speed climate across this high-elevation region. This study explores the climatology of near-surface wind speed over the Tibetan Plateau by using for the first time homogenized observations together with reanalysis products and regional climate model simulations. Measuring stations across the center and the west of the plateau are at higher elevations and display higher mean and standard deviation, confirming that wind speed increases with increasing altitude. By exploring wind characteristics with a focus on seasonal cycle through cluster analysis, three regions of distinct wind regimes can be identified: (1) the central Tibetan Plateau, characterized by high elevation; (2) the eastern and the peripheral areas of the plateau; and (3) the Qaidam basin, a topographic depression strongly influenced by the blocking effect of the surrounding mountainous terrain. Notably, the ERA5 reanalysis, with its improvements in horizontal, vertical, and temporal spacing, model physics and data assimilation, demonstrates closer agreement to the measured wind conditions than its predecessor ERA-Interim. It successfully reproduces the three identified wind regimes. However, the newest ERA5-Land product does not show improvements compared to ERA5, most likely because they share most of the parametrizations. Furthermore, the two", "link": "https://doi.org/10.1007/s00382-023-06931-3", "authors": "Lorenzo Minola, Gangfeng Zhang, Tinghai Ou, Julia Kukulies, Julia Curio, Jose A. Guijarro, Kaiqiang Deng, Cesar Azorin-Molina", "source": "Climate Dynamics", "published": "2023-9-16", "first_seen": "2026-11-26T13:59:01+00:00", "score": 51, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr3145.1", "title": "Object-Based Verification of Precipitation Forecasts. Part I: Methodology and Application to Mesoscale Rain Areas", "summary": "A recently developed method of defining rain areas for the purpose of verifying precipitation produced by numerical weather prediction models is described. Precipitation objects are defined in both forecasts and observations based on a convolution (smoothing) and thresholding procedure. In an application of the new verification approach, the forecasts produced by the Weather Research and Forecasting (WRF) model are evaluated on a 22-km grid covering the continental United States during July–August 2001. Observed rainfall is derived from the stage-IV product from NCEP on a 4-km grid (averaged to a 22-km grid). It is found that the WRF produces too many large rain areas, and the spatial and temporal distribution of the rain areas reveals regional underestimates of the diurnal cycle in rain-area occurrence frequency. Objects in the two datasets are then matched according to the separation distance of their centroids. Overall, WRF rain errors exhibit no large biases in location, but do suffer from a positive size bias that maximizes during the later afternoon. This coincides with an excessive narrowing of the rainfall intensity range, consistent with the dominance of parameterized convection. Finally, matching ability has a strong dependence on object size and is interpreted as the influence of relatively predictable synoptic-scale systems on the larger areas.", "link": "https://doi.org/10.1175/mwr3145.1", "authors": "Christopher Davis, Barbara Brown, Randy Bullock", "source": "Monthly Weather Review", "published": "2006-7-1", "first_seen": "2026-11-26T13:59:01+00:00", "score": 51, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr2923.1", "title": "New Approach to Calculation of Atmospheric Model Physics: Accurate and Fast Neural Network Emulation of Longwave Radiation in a Climate Model", "summary": "A new approach based on a synergetic combination of statistical/machine learning and deterministic modeling within atmospheric models is presented. The approach uses neural networks as a statistical or machine learning technique for an accurate and fast emulation or statistical approximation of model physics parameterizations. It is applied to development of an accurate and fast approximation of an atmospheric longwave radiation parameterization for the NCAR Community Atmospheric Model, which is the most time consuming component of model physics. The developed neural network emulation is two orders of magnitude, 50–80 times, faster than the original parameterization. A comparison of the parallel 10-yr climate simulations performed with the original parameterization and its neural network emulations confirmed that these simulations produce almost identical results. The obtained results show the conceptual and practical possibility of an efficient synergetic combination of deterministic and statistical learning components within an atmospheric climate or forecast model. A developmental framework and practical validation criteria for neural network emulations of model physics components are outlined.", "link": "https://doi.org/10.1175/mwr2923.1", "authors": "Vladimir M. Krasnopolsky, Michael S. Fox-Rabinovitz, Dmitry V. Chalikov", "source": "Monthly Weather Review", "published": "2005-5-1", "first_seen": "2026-11-26T13:59:01+00:00", "score": 51, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.26486", "title": "How Wet-Biased Datasets Shape the Training and Mislead the Evaluation of Generative Precipitation Nowcasting", "summary": "Generative models for precipitation nowcasting are trained and evaluated predominantly on wet-biased datasets, which over-represent precipitation events to emphasize rare extremes. Selecting test cases based on target observations is known to favor forecasts that match the selected distribution rather than the intended deployment distribution. We show analytically that the same target-dependent selection, applied to the training set, tilts the conditional distribution learned by an ideal generative model by exactly the factor that such an evaluation rewards. We test both evaluation and training effects with a satellite-to-radar diffusion model in a controlled experiment that crosses wet-biased and uniform sampling of the training and of the test set. The evaluation effect appears in full: the same model looks under-predictive on a wet-biased test set but over-predicts light rain on a deployment-consistent one, whichever way it was trained. Inverse probability weighting recovers the deployment scores from the wet-biased set. The training effect is real but partial: the model trained on wet-biased data forecasts more rain than its uniformly trained counterpart, yet remains far from calibrated even on a test set drawn like its training set, and gains skill for rain at a modest cost in calibration. Wet-biased training is thus a trade-off, not an error. Using classifier-free guidance as an example of a tuned quantity, we show how this misdirects model development: most scores on the wet-biased test set favor the largest guidance scale, whereas calibration, frequency bias, and a ", "link": "https://arxiv.org/abs/2610.26486", "authors": "Christoph Metzl, Stefan Kapsreiter, Kianusch Vahid Yousefnia, Virginia Poli, Richard Müller, Frank Krüger, Tobias Bölle", "source": "arXiv", "published": "2026-10-19", "first_seen": "2026-11-26T13:59:01+00:00", "score": 50, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme", "diffusion model"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.03738", "title": "RATSIFT: Resolution-Adaptive Transformer for Solar Irradiance Forecasting and Temporal Downscaling", "summary": "Accurate forecasting and temporal downscaling of solar irradiance is critical for reliable renewable energy integration and grid management. Traditional methods often struggle to capture rapid irradiance variability. In this work, we develop a Transformer-based architecture for simultaneous forecasting and temporal downscaling. The model takes input data at arbitrary resolutions and generates outputs at any resolutions represented within the training data, leveraging both global and local contextual information. To improve training efficiency, a genetic algorithm-based optimization framework is implemented to identify suitable model hyperparameters, while reducing the computational cost of exhaustive grid search. The effectiveness of the proposed model is shown by analyzing real data in Dallas, Texas. The proposed model achieved root mean square error (RMSE) values of 28.785, 29.544, 30.157, 32.132~W/m\\(^2\\) for 15-, 30-, 60-minute, and irregularly spaced global input and producing forecast at 5-minutes resolution, respectively. Furthermore, this model produced reliable uncertainty estimates, exhibiting wider prediction intervals for high-resolution inputs during volatile solar conditions, whereas coarser-resolution inputs result in narrower intervals and significantly lower training time and computational cost. Our approach provides a scalable and efficient framework for multi-resolution solar irradiance forecasting and temporal downscaling, suitable for practical energy forecasting and grid management applications.", "link": "https://arxiv.org/abs/2611.03738", "authors": "Jesto Peter, Timothy M. Hansen, Hossein Moradi Rekabdarkolaee", "source": "arXiv", "published": "2026-11-01", "first_seen": "2026-11-26T13:59:01+00:00", "score": 50, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.36751", "title": "Generative Refinement Learning for Temporal Interpolation in Scientific Machine Learning", "summary": "Computationally expensive simulations and real-world observations often provide data at a lower temporal resolution than downstream tasks require. Averaging observations at fixed grid points can introduce errors, and motion estimates alone do not determine how the physical field values change. In this work, we study whether learning to correct a simple numerical interpolation improves the reconstruction of intermediate scientific fields. Our model, interpolative FLow EXpert (iFLEX), first estimates the missing field by taking a weighted average of the two observations at each grid point, giving more weight to the observation closer to the requested time. During training, subtracting this estimate from an observed intermediate field gives the residual that a conditional diffusion model learns to generate. Both observations condition the model, together with the target time, the interval between observations, and available physical parameters. To reconstruct an unobserved intermediate field, the generated residual is added to the weighted average. We evaluate iFLEX on Navier-Stokes Kraichnan turbulence, Shanghai radar precipitation, and sea surface temperature. Across these datasets, iFLEX achieves lower reconstruction error than the evaluated baselines, including optical-flow and diffusion models developed for video frame interpolation in computer vision. In a controlled turbulence comparison at a Reynolds number of 36,000, learning the residual reduces relative Frobenius norm error from about 13.7 for direct field generation to 10.5, with the diffusion backbone and training", "link": "https://arxiv.org/abs/2610.36751", "authors": "Pu Ren, Michael W. Mahoney, N. Benjamin Erichson", "source": "arXiv", "published": "2026-10-27", "first_seen": "2026-11-26T13:59:01+00:00", "score": 50, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation", "diffusion model"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2605.00652", "title": "D-SHIFT: Transferring High Spatial Information from GRACE Monthly TWSA Mascon to Daily Products Using Generative Adversarial Networks", "summary": "The Gravity Recovery and Climate Experiment (GRACE) and GRACE Follow-On missions provide monthly terrestrial water storage anomaly (TWSA) estimates for monitoring large-scale water storage change. The monthly temporal resolution of official products limits the analysis of high-frequency hydrological events, while existing daily GRACE products often have reduced spatial resolution due to sparse groundtrack coverage and required smoothing and regularization. This study introduces D-SHIFT (Daily Spatial High-Resolution Inference via Feature Transformation), a deep learning-based framework for generating daily, high-resolution TWSA fields from daily spherical harmonic coefficient (SHC) solutions. The model is trained in the monthly domain by using low-resolution daily solutions and other auxiliary features as inputs, while targeting on monthly mascon products. The model is then applied to daily SHC inputs to generate products with similar spatial resolution of monthly products. Monthly validation against mascon products gives a global mean root mean square error of about 2.3cm, with good correlation and explained variance agreement. Daily analyses show that D-SHIFT produces spatially coherent day-to-day fields and improves basin-scale trend and seasonality estimates compared with low-resolution SHC. The basin-area double-difference analysis indicates that these gains are most relevant for spatially localized signals affected by smoothing and leakage. In Greenland, D-SHIFT better reproduces coastal mass-loss patterns and gives a basin-mean trend of -10.5cm/yr, close to the CSR M", "link": "https://arxiv.org/abs/2605.00652", "authors": "Andreas Dombos, Junyang Gou, Benedikt Soja", "source": "arXiv", "published": "2026-05-01", "first_seen": "2026-11-26T13:59:01+00:00", "score": 50, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022ms003589", "title": "Synthesizing Sea Surface Temperature and Satellite Altimetry Observations Using Deep Learning Improves the Accuracy and Resolution of Gridded Sea Surface Height Anomalies", "summary": "Gridded sea surface height (SSH) maps estimated from satellite altimetry are widely used for estimating surface ocean geostrophic currents. Satellite altimeters observe SSH along one‐dimensional tracks widely spaced in space and time, making accurately reconstructing the two‐dimensional (2D) SSH field challenging. Traditionally, SSH is mapped using optimal interpolation (OI). However, OI artificially smooths the SSH field leading to high mapping errors in regions with rapidly‐evolving mesoscale features such as western boundary currents. Motivated by the dynamical relation between SSH and sea surface temperature (SST) and the notion that even the chaotic evolution of mesoscale ocean turbulence may contain repeating patterns, we outline a deep learning (DL) approach where a neural network is trained to reconstruct 2D SSH by synthesizing altimetry and SST observations. In the Gulf Stream Extension region, dominated by mesoscale variability, our DL method substantially improves the SSH reconstruction compared to existing methods. Our SSH map has 17% lower root‐mean‐square error and resolves spatial scales 30% smaller than OI compared against independent altimeter observations. Surface geostrophic currents calculated from our map are closer to surface drifter observations and appear qualitatively more realistic, with stronger currents, a clearer separation between the Gulf Stream and neighboring eddies, and the appearance of smaller coherent eddies missed by other methods. Our map yields significant re‐estimations of important dynamical quantities such as eddy kinetic energy, v", "link": "https://doi.org/10.1029/2022ms003589", "authors": "Scott A. Martin, Georgy E. Manucharyan, Patrice Klein", "source": "Journal of Advances in Modeling Earth Systems", "published": "2023-5", "first_seen": "2026-11-26T13:59:01+00:00", "score": 50, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022gl099955", "title": "Observed Changes in Daily Precipitation Intensity in the United States", "summary": "The characterization of changes over the full distribution of precipitation intensities remains an overlooked and underexplored subject, despite their critical importance to hazard assessments and water resource management. Here, we aggregate daily in situ Global Historical Climatology Network precipitation observations within 17 internally consistent domains in the United States for two time periods (1951–1980 and 1991–2020). We find statistically significant changes in wet day precipitation distributions in all domains—changes primarily driven by a shift from lower to higher wet day intensities. Patterns of robust change are geographically consistent, with increases in the mean (4.5%–5.7%) and standard deviation (4.4%–8.7%) of wet day intensity in the eastern U.S., but mixed signals in the western U.S. Beyond their critical importance to the aforementioned impact assessments, these observational results can also inform climate model performance evaluations.", "link": "https://doi.org/10.1029/2022gl099955", "authors": "Ryan D. Harp, Daniel E. Horton", "source": "Geophysical Research Letters", "published": "2022-10-11", "first_seen": "2026-11-26T13:59:01+00:00", "score": 50, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr-d-17-0061.1", "title": "Impact of Tibetan Plateau Surface Heating on Persistent Extreme Precipitation Events in Southeastern China", "summary": "This paper combines observations, climatic analysis, and numerical modeling to investigate the Tibetan Plateau’s (TP) surface heating conditions’ influence on extreme persistent precipitation events (PEPEs) in southeastern China. Observations indicated an increase of TP surface air temperature 3–4 days prior to extreme persistent precipitation events in southeastern China. NCEP reanalysis data revealed a significant low pressure anomaly in southern China and a high pressure anomaly in northern China during extreme persistent precipitation event periods. Using correlation analysis and random resampling nonparametric statistics, a typical PEPE event from 17 to 25 June 2010 was selected for numerical simulation. The Weather Research and Forecasting (WRF) Model was used to investigate the impact of the TP’s surface heating on the evolution of this event. Three contrasting WRF experiments were conducted with different surface heating strengths by changing initial soil moisture over the TP. Different soil conditions generate different intensities of surface sensible heat fluxes and boundary layer structures over the TP resulting in two main effects on downstream convective rainfall: modulating large-scale atmospheric circulations and modifying the water vapor transport at southern China. Increased surface heating in the TP strengthens a high pressure system over the Yangtze Plain, thereby blocking the northward movement of precipitation. It also enhances the water vapor transport from the South China Sea to southern China. The combined effects substantially increase precipitation", "link": "https://doi.org/10.1175/mwr-d-17-0061.1", "authors": "Bingcheng Wan, Zhiqiu Gao, Fei Chen, Chungu Lu", "source": "Monthly Weather Review", "published": "2017-9", "first_seen": "2026-11-26T13:59:01+00:00", "score": 50, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/2010waf2222426.1", "title": "Effects of Surface Heat and Moisture Exchange on ARW-WRF Warm-Season Precipitation Forecasts over the Central United States", "summary": "The evolution of the daytime planetary boundary layer (PBL) and its association with warm-season precipitation is strongly impacted by land–atmosphere heat and moisture exchange (hereafter surface exchange). However, substantial uncertainty exists in the parameterization of the surface exchange in numerical weather prediction (NWP) models. In the current study, the authors examine 0–24-h convection-permitting forecasts with different surface exchange strengths for a 6-day period during the International H2O Project (IHOP_2002). Results indicate sensitivity in the timing of simulated afternoon convection initiation and subsequent precipitation amounts to variations in surface exchange strength. Convection initiation in simulations with weak surface exchange was delayed by 2–3 h compared to simulations with strong surface exchange, and area-averaged total precipitation amounts were less by up to a factor of 2. Over the western high plains (105°–100°W longitude), where deep convection is locally generated, simulations using a formulation for surface exchange that varied with the vegetation category (height) produced area-averaged diurnal cycles of forecasted precipitation amounts in better agreement with observations than simulations that used the current Advanced Research Weather Research and Forecasting Model (ARW-WRF) formulation. Parcel theory is used to diagnose mechanisms by which differences in surface exchange influence convection initiation in individual case studies. The more rapid initiation in simulations with strong surface exchange results from a more rapid remov", "link": "https://doi.org/10.1175/2010waf2222426.1", "authors": "S. B. Trier, M. A. LeMone, F. Chen, K. W. Manning", "source": "Weather and Forecasting", "published": "2011-2-1", "first_seen": "2026-11-26T13:59:01+00:00", "score": 50, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.3263", "title": "Drivers of interannual variability of the E ast A frican “ L ong R ains”", "summary": "The East African Long Rains season is unusual in that its year‐to‐year rainfall variability is mostly insensitive to the main modes of interannual tropical sea‐surface temperature (SST) variability (ENSO, Indian Ocean Dipole). Various alternative drivers of interannual variability have been described previously but remain poorly understood. Here we present an analysis of three important drivers: regional Indian Ocean SST, seasonal amplitude of the Madden–Julian Oscillation (MJO) and phase of the Quasi‐Biennial Oscillation (QBO). Reanalyses and instrumental datasets are in close agreement about rainfall interannual variability across the region as a whole, which represents 30–50% of the total variance. Subregional structure of the remaining variance is far more uncertain and is not considered here. We use modern reanalyses to understand how the proposed drivers affect March–April mean. Common to all three drivers is their ability to modify the large‐scale subsidence over the East African region during boreal spring. SST in the western Indian Ocean achieves this via anomalous boundary‐layer heating of the lower troposphere. The MJO modifies subsidence over the region through anomalous ascent and descent. Rainfall over East Africa responds to this MJO forcing in a unidirectional way, allowing seasonal rectification and interannual modulation by seasonal MJO amplitude. Understanding the QBO's influence is complicated by the limited number of cycles over the reanalysis period. Each driver individually has a modest effect on the Long Rains, but added together they explain 30–60% ", "link": "https://doi.org/10.1002/qj.3263", "authors": "Michael Vellinga, Sean F. Milton", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2018-4", "first_seen": "2026-11-26T13:59:01+00:00", "score": 50, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.24020", "title": "Enabling joint chemical and meteorological data assimilation with an atmospheric foundation model", "summary": "The hydroxyl radical (OH) is the main oxidant in the troposphere and accounts for 88% of the methane sink, yet its abundance and trends remain poorly constrained. Satellites observe many of the chemical and meteorological drivers of OH, but assimilating both requires a model that represents chemistry and meteorology together. Existing chemistry-climate models are too expensive for joint data assimilation. Here, we present AuroraChem, a fine-tuned version of the Aurora atmospheric foundation model that jointly simulates meteorology and the GEOS-Chem chemical fields needed to constrain OH. A one-year AuroraChem rollout takes 12 minutes on one GPU. Free rollouts remain stable for one year but do not fully capture seasonal cycles. Using idealized data assimilation, we find that chemical observations can constrain the meteorological state and meteorological observations can constrain the chemical state. Inserting only the chemical fields raises the annual mean spatial correlation of 500 hPa temperature from 0.89 to 0.92 and recovers the moisture and circulation pattern of the Indian summer monsoon. Inserting only the meteorological fields raises the 500 hPa OH correlation from 0.89 to 0.93, close to the 0.94 from inserting the chemical fields themselves, and recovers the OH seasonal cycle. Inserting only NO2 columns sampled at TROPOMI pixels gives an OH correlation of 0.93. These relationships likely reflect learned covariances rather than physical coupling, and covariances are what data assimilation uses to let an observation of one variable update the others. AuroraChem theref", "link": "https://arxiv.org/abs/2611.24020", "authors": "Eliot J. Kim, Eric J. Mei, Peter D. Ivatt, Lee T. Murray, Alexander J. Turner", "source": "arXiv", "published": "2026-11-18", "first_seen": "2026-11-26T13:59:01+00:00", "score": 49, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["india", "monsoon"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.19966", "title": "Towards GPROF V08: A Machine-Learning Framework for Simulating Passive Microwave Observations of Precipitation", "summary": "Spatially resolved precipitation retrievals based on convolutional neural networks (CNNs) can improve precipitation estimates from passive microwave (PMW) observations and will be used to implement the next operational PMW retrieval algorithm for the Global Precipitation Measurement (GPM) mission. However, the conventional radiative transfer simulations used to extend the retrieval algorithm to the various sensors of the GPM constellation do not provide the spatial coverage required to train CNN-based retrievals. To address this, we introduce a machine-learning-based simulation framework that enables the training of the CNN-based GPROF-NN 3D retrieval algorithm for the full GPM constellation. At the core of this framework is Satformer, a new neural-network architecture that can translate PMW observations between any pair of GPM sensors. The resulting synthetic observations exhibit lower errors than conventional radiative transfer simulations and lead to more accurate precipitation retrievals when used to train GPROF-NN precipitation retrievals. We further demonstrate the applicability of the framework to new instruments by developing GPROF-NN retrievals for the Microwave Imager aboard the Weather System Follow-on Microwave satellite. While GPROF-NN retrievals based on the new simulation framework achieve lower instantaneous retrieval errors and higher correlations compared to independent reference data than conventional retrievals, residual simulation errors can introduce systematic biases in the resulting retrievals. The proposed simulation framework provides a key compone", "link": "https://arxiv.org/abs/2611.19966", "authors": "Simon Pfreundschuh, Christian D. Kummerow, Paula J. Brown", "source": "arXiv", "published": "2026-11-15", "first_seen": "2026-11-26T13:59:01+00:00", "score": 49, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.15540", "title": "Sensitivity Fidelity Reveals Physical Dependencies Beyond Forecast Accuracy in Deep-Learning Earth-System Models", "summary": "Deep-learning models increasingly rival numerical simulation in Earth-system forecasting, yet forecast error alone cannot determine whether their learned input-output dependencies are physically consistent. Here we introduce sensitivity fidelity as an additional criterion: alongside prediction error, model responses to input perturbations should be examined against a trusted reference or established physical knowledge. In an idealized Rayleigh-Bénard convection benchmark, four surrogate architectures achieved low forecast errors yet encoded markedly different sensitivities. Quantitative comparison with a matched adjoint distinguished the models far more sharply than forecast accuracy and showed that predictive skill and sensitivity fidelity need not coincide, while finite-perturbation experiments further linked these differences to the propagation of initial-condition uncertainty. We then applied this strategy to El Niño-Southern Oscillation prediction, where no adjoint reference exists and learned sensitivities showed event-wise robustness, validity under finite perturbations, and consistency with established precursors. These results identify gradient-based evaluation as a discriminating complement to forecast-error metrics, providing a practical test of whether data-driven Earth-system models learn physically credible dependencies.", "link": "https://arxiv.org/abs/2610.15540", "authors": "Qi Chen, Peng Zhan, Hongxing Cui, Wenqing Cui, Ibrahim Hoteit", "source": "arXiv", "published": "2026-10-11", "first_seen": "2026-11-26T13:59:01+00:00", "score": 49, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2604.21233", "title": "Assessing Emulator Design and Training for Modal Aerosol Microphysics Parameterizations in E3SMv2", "summary": "Toward the goal of using Scientific Machine Learning (SciML) emulators to improve the numerical representation of aerosol processes in global atmospheric models, we explore the emulation of aerosol microphysics processes under cloud-free conditions in the 4-mode Modal Aerosol Module (MAM4) within the Energy Exascale Earth System Model version 2 (E3SMv2). To develop an in-depth understanding of the challenges and opportunities in applying SciML to aerosol processes, we begin with a simple feedforward neural network architecture that has been used in earlier studies, but we systematically examine key emulator design choices, including architecture complexity and variable normalization, while closely monitoring training convergence behavior. Our results show that optimization convergence, scaling strategy, and network complexity strongly influence emulation accuracy. When effective scaling is applied and convergence is achieved, the relatively simple architecture, used together with a moderate network size, can reproduce key features of the microphysics-induced aerosol concentration changes with promising accuracy. These findings provide practical clues for the next stages of emulator development; they also provide general insights that are likely applicable to the emulation of other aerosol processes, as well as other atmospheric physics involving multi-scale variability.", "link": "https://arxiv.org/abs/2604.21233", "authors": "Shady E. Ahmed, Hui Wan, Saad Qadeer, Panos Stinis, Kezhen Chong, Mohammad Taufiq Hassan Mozumder, Kai Zhang, Ann S. Almgren", "source": "arXiv", "published": "2026-04-23", "first_seen": "2026-11-26T13:59:01+00:00", "score": 49, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024ef005877", "title": "Enlarging Difference Between Persistent Extreme Precipitation and Fixed‐Time Extremes in China", "summary": "Extreme precipitation occurs persistently in nature and has caused a series of social, environmental, and ecological problems. However, most analyses of extreme precipitation are conducted at fixed‐time intervals, which may lead to misconceptions of the spatial‐temporal changes and causes, hindering scientific understanding and engineering prevention. In this study, we quantified the differences between persistent and fixed‐time extreme precipitation in China using historical observations from over 2,400 meteorological stations between 1960 and 2019 and future simulations from 10 global climate models during 2021–2100 under three scenarios (SSP126, SSP370, and SSP585). The national average annual‐maximum persistent precipitation (Rx1event) was 2.5 times greater than extremes for fixed‐time precipitation (Rx1day) historically, and 2.8 times higher in the future period. Although Rx1day increased faster than Rx1event in the historical period, it is projected to grow more slowly than Rx1event in all three future scenarios. Both Rx1day and Rx1event exhibit Hook structures responding to temperature. The Peak temperatures of Hook structures are expected to rise by 2–6°C with projected future climate change, causing the precipitation‐temperature response curve to shift to the high‐value direction, thereby increasing the magnitude of Rx1day by 5%–12% and Rx1event by 22%–29%. Our research enlightens disaster preventers and researchers to pay more attention to persistent extreme precipitation, especially in areas where it differs significantly from the fixed‐time scale.", "link": "https://doi.org/10.1029/2024ef005877", "authors": "Yihui Zhang, Kang Liang, Xiaomang Liu, Changming Liu", "source": "Earth's Future", "published": "2025-7", "first_seen": "2026-11-26T13:59:01+00:00", "score": 49, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-021-05638-7", "title": "Quantifying the influence of natural climate variability on in situ measurements of seasonal total and extreme daily precipitation", "summary": "While various studies explore the relationship between individual sources of climate variability and extreme precipitation, there is a need for improved understanding of how these physical phenomena simultaneously influence precipitation in the observational record across the contiguous United States. In this work, we introduce a single framework for characterizing the historical signal (anthropogenic forcing) and noise (natural variability) in seasonal mean and extreme precipitation. An important aspect of our analysis is that we simultaneously isolate the individual effects of seven modes of variability while explicitly controlling for joint inter-mode relationships. Our method utilizes a spatial statistical component that uses in situ measurements to resolve relationships to their native scales; furthermore, we use a data-driven procedure to robustly determine statistical significance. In Part I of this work we focus on natural climate variability: detection is mostly limited to DJF and SON for the modes of variability considered, with the El Niño/Southern Oscillation, the Pacific–North American pattern, and the North Atlantic Oscillation exhibiting the largest influence. Across all climate indices considered, the signals are larger and can be detected more clearly for seasonal total versus extreme precipitation. We are able to detect at least some significant relationships in all seasons in spite of extremely large (> 95%) background variability in both mean and extreme precipitation. Furthermore, we specifically quantify how the spatial aspect of our analysis reduces u", "link": "https://doi.org/10.1007/s00382-021-05638-7", "authors": "Mark D. Risser, Michael F. Wehner, John P. O’Brien, Christina M. Patricola-DiRosario, Travis A. O’Brien, William D. Collins, Christopher J. Paciorek, Huanping Huang", "source": "Climate Dynamics", "published": "2021-2-4", "first_seen": "2026-11-26T13:59:01+00:00", "score": 49, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation", "extreme", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr-d-25-0125.1", "title": "Using Diffusion Models to Do Data Assimilation", "summary": "The recent surge in machine learning (ML) methods for geophysical modeling has raised the question of how these methods might be applied to data assimilation (DA). We focus on diffusion modeling (a form of generative artificial intelligence) for systems that can perform the entire DA process, rather than on ML-based tools used within a conventional DA system. We identify at least three distinct types of diffusion-based DA systems and show that they differ in the posterior distribution they target for sampling. These posterior distributions correspond to different priors and/or likelihoods, which in turn result in unique training datasets, computational requirements, and state estimate qualities. Our analysis further shows that a diffusion DA system designed to target the same posterior distribution as current ensemble DA algorithms requires retraining at each DA cycle. We discuss the implications of these findings for the use of diffusion modeling in DA.", "link": "https://doi.org/10.1175/mwr-d-25-0125.1", "authors": "Daniel Hodyss, Matthias Morzfeld", "source": "Monthly Weather Review", "published": "2026-2", "first_seen": "2026-11-26T13:59:01+00:00", "score": 49, "topics": ["Deep Learning"], "watch": [], "boosts": ["diffusion model"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr-d-10-05013.1", "title": "Operational Convective-Scale Numerical Weather Prediction with the COSMO Model: Description and Sensitivities", "summary": "Since April 2007, the numerical weather prediction model, COSMO (Consortium for Small Scale Modelling), has been used operationally in a convection-permitting configuration, named COSMO-DE, at the Deutscher Wetterdienst (DWD; German weather service). Here the authors discuss the model changes that were necessary for the convective scale, and report on the experience from the first years of operational application of the model. For COSMO-DE the ability of the numerical solver to treat small-scale structures has been improved by using a Runge–Kutta method, which allows for the use of higher-order upwind advection schemes. The one-moment cloud microphysics parameterization has been extended by a graupel class, and adaptations for describing evaporation of rain and stratiform precipitation processes were made. Comparisons with a much more sophisticated two-moment scheme showed only minor differences in most cases with the exception of strong squall-line situations. Whereas the deep convection parameterization was switched off completely, small-scale shallow convection was still parameterized by the appropriate part of the Tiedtke scheme. During the first year of operational use, convective events in synoptically driven situations were satisfactorily simulated. Also the daily cycles of summertime 10-m wind and 1-h precipitation sums were well captured. However, it became evident that the boundary layer description had to be adapted to enhance convection initiation in airmass convection situations. Here the asymptotic Blackadar length scale l∞ had proven to be a sensitive paramet", "link": "https://doi.org/10.1175/mwr-d-10-05013.1", "authors": "Michael Baldauf, Axel Seifert, Jochen Förstner, Detlev Majewski, Matthias Raschendorfer, Thorsten Reinhardt", "source": "Monthly Weather Review", "published": "2011-12-1", "first_seen": "2026-11-26T13:59:01+00:00", "score": 49, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.4540", "title": "Convective systems and rainfall in East Africa", "summary": "East Africa is particularly vulnerable to weather extremes, with severe weather linked to thousands of deaths per year. Improved forecasts of convective events in this region are urgently needed, from both nowcasting and numerical weather prediction models. Improving these forecasts requires further knowledge of convection in this region. This study aims to improve understanding of convective events in East Africa, based on a six‐year climatology of convective life cycles and the associated precipitation. Convective systems are identified as contiguous areas of cold cloud in geostationary satellite measurements over East Africa. A tracking algorithm is used to trace the evolution of the properties of these systems through time and space. Matching the systems to surface precipitation obtained from satellite microwave observations provides insight into how the life cycles of these systems relate to precipitation at the surface. Over the region as a whole, 59% of the accumulated precipitation can be attributed to the tracked convective systems. The majority (81%) of heavy precipitation events (10 mmhr −1 ) are attributable to convective systems, while light rainfall events (1 mmhr −1 ) are not (1.8%). Most of the tracked convective systems have an area less than 400 km 2 and last for less than an hour. However, the less frequent larger longer‐lived systems produce the majority of the regional accumulated precipitation. Composite life cycles of the tracked systems show rapid intensification and the heaviest precipitation initially, followed by a steady increase in area and weak", "link": "https://doi.org/10.1002/qj.4540", "authors": "Peter G. Hill, Thorwald H. M. Stein, Carlo Cafaro", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2023-8-13", "first_seen": "2026-11-26T13:59:01+00:00", "score": 49, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2024.14", "title": "Time series predictions in unmonitored sites: a survey of machine learning techniques in water resources", "summary": "Prediction of dynamic environmental variables in unmonitored sites remains a long-standing challenge for water resources science. The majority of the world’s freshwater resources have inadequate monitoring of critical environmental variables needed for management. Yet, the need to have widespread predictions of hydrological variables such as river flow and water quality has become increasingly urgent due to climate and land use change over the past decades, and their associated impacts on water resources. Modern machine learning methods increasingly outperform their process-based and empirical model counterparts for hydrologic time series prediction with their ability to extract information from large, diverse data sets. We review relevant state-of-the art applications of machine learning for streamflow, water quality, and other water resources prediction and discuss opportunities to improve the use of machine learning with emerging methods for incorporating watershed characteristics and process knowledge into classical, deep learning, and transfer learning methodologies. The analysis here suggests most prior efforts have been focused on deep learning frameworks built on many sites for predictions at daily time scales in the United States, but that comparisons between different classes of machine learning methods are few and inadequate. We identify several open questions for time series predictions in unmonitored sites that include incorporating dynamic inputs and site characteristics, mechanistic understanding and spatial context, and explainable AI techniques in modern ma", "link": "https://doi.org/10.1017/eds.2024.14", "authors": "Jared D. Willard, Charuleka Varadharajan, Xiaowei Jia, Vipin Kumar", "source": "Environmental Data Science", "published": "2025", "first_seen": "2026-11-26T13:59:01+00:00", "score": 49, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2026.10069", "title": "Remote sensing-driven machine learning models for SMI-based drought assessment and forecasting", "summary": "The complex and interconnected nature of climate systems makes drought forecasting highly challenging. This study integrates remote sensing and machine learning for Soil Moisture Index (SMI)-based drought prediction. In the first stage, Landsat 8 imagery and SRTM DEM data are used to estimate SMI in drought-prone regions of southern and western Turkey. A comparative analysis of four machine learning algorithms—Random Forests (RF), Gradient Boosting Machines (GBM), eXtreme Gradient Boosting (XGBoost), and LightGBM—is conducted to evaluate their ability to represent SMI from remotely sensed land surface factors. Results show that RF provides the best accuracy, with feature importance analysis highlighting Landsat 8 thermal bands as the most influential predictors. In the second stage, a multistep Convolutional Long Short-Term Memory (ConvLSTM) network is applied to a time series of Landsat 8 images to forecast SMI ~1 month (32 days) ahead. The forecasting framework is evaluated using both the original image sequence and a cloud-gap-filled sequence to assess the impact of cloud contamination on prediction performance. This dual-stage framework demonstrates the value of combining machine learning with remote sensing for both SMI-based drought modeling and forecasting. By capturing key spatial and temporal patterns, the proposed approach offers a robust tool for monitoring drought risk and supporting agricultural management in climate-sensitive regions.", "link": "https://doi.org/10.1017/eds.2026.10069", "authors": "Gokce Gok, Burcu Hudaverdi", "source": "Environmental Data Science", "published": "2026", "first_seen": "2026-11-26T13:59:01+00:00", "score": 49, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.06130", "title": "Short-Term Forecasting of Heterogeneous Wind Power Fleets: Global Temporal Fusion Transformer Leveraging Static Covariates", "summary": "Accurate short-term wind power forecasting is critical for grid stability and electricity trading. While transformer-based deep learning is state of the art, industry practice relies mostly on local models trained for individual assets. This study investigates whether a global temporal fusion transformer (TFT), trained jointly on a heterogeneous portfolio of wind farms across Germany, outperforms site-specific local models in 48-hour-ahead forecasting. Using numerical weather prediction (NWP) data from the regional ICON-D2 and the global ECMWF HRES models, we compare the global TFT against local models and a linear regression baseline. The global model leverages static covariates, such as farm age, altitude above sea level, hub height, rotor diameter and power curve parameters, to learn shared representations across sites. We evaluate on 100 synthetic wind farm profiles and a real portfolio of 11 German wind farms, across two seasonal test periods with intermediate retraining. The global TFT outperforms the local models for 87% of the synthetic and 77% of the real wind farms and clearly surpasses the linear baseline. Wilcoxon signed-rank tests confirm that these gains are significant across both seasons and datasets. Crucially, this superiority depends on static covariates: without asset-specific context, the global model fails to generalize. The TFT's variable selection network (VSN) reveals the learned feature selection. Altitude emerges as a relevant static discriminator on both datasets, while hub height is decisive on the real portfolio. For dynamic inputs, the encoder", "link": "https://arxiv.org/abs/2611.06130", "authors": "Viktor Walter, Andreas Wagner", "source": "arXiv", "published": "2026-11-04", "first_seen": "2026-11-26T13:59:01+00:00", "score": 48, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2025ms005591", "title": "Weather Sensitivity to Sea Surface Temperatures Over the Contiguous United States in a Medium Ensemble of High‐Resolution Regionally Refined Simulations Using E3SM", "summary": "Climate model simulations have long been invaluable tools for synoptic meteorology. However, they are generally too coarse in resolution to resolve fine‐scale extreme weather, which require stronger spatial gradients and sharper representations of topography. Here we perform an ensemble of sea surface temperature (SST)‐forced experiments with the Energy Exascale Earth System Model, applying its regionally‐refined model capability over the contiguous United States. The prescribed SSTs are historically‐derived and designed to represent recurrent patterns of Pacific Ocean variability. Our ensemble allows for understanding of how leading modes of ocean variability affect global hydroclimate but with the added capacity to resolve extreme weather at regional scale over the US. We focus our study on how ocean modes of variability specifically affect extreme heat and extreme precipitation events, snowpack, tropical cyclones, and atmospheric rivers. We find that extreme weather is realistically simulated at regional scale but shown to have a persistent wet precipitation bias and warm temperature bias, which impacts the utility of the ensemble. Nonetheless, our simulations provide a large sample of highly impactful extremes, including extremes possible over the historical period but without a historical analog, and their response to ocean variability.", "link": "https://doi.org/10.1029/2025ms005591", "authors": "S. H. Baek, C. M. Zarzycki, P. A. Ullrich, C. Randall, A. Srivastava, W.‐Y. Wu, R. McCrary, A. M. Rhoades", "source": "Journal of Advances in Modeling Earth Systems", "published": "2026-11", "first_seen": "2026-11-26T13:59:01+00:00", "score": 48, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/grl.50686", "title": "Multimodel projections and uncertainties of irrigation water demand under climate change", "summary": "Crop irrigation is responsible for 70% of humanity's water demand. Since the late 1990s, the expansion of irrigated areas has been tapering off, and this trend is expected to continue in the future. Future irrigation water demand (IWD) is, however, subject to large uncertainties due to anticipated climate change. Here, we use a set of seven global hydrological models (GHMs) to quantify the impact of projected global climate change on IWD on currently irrigated areas by the end of this century, and to assess the resulting uncertainties arising from both the GHMs and climate projections. The resulting ensemble projections generally show an increasing trend in future IWD, but the increase varies substantially depending on the degree of global warming and associated regional precipitation changes. Under the highest greenhouse gas emission scenario (RCP8.5), IWD will considerably increase during the summer in the Northern Hemisphere (>20% by 2100), and the present peak IWD is projected to shift one month or more over regions where ≥80% of the global irrigated areas exist and 4 billion people currently live. Uncertainties arising from GHMs and global climate models (GCMs) are large, with GHM uncertainty dominating throughout the century and with GCM uncertainty substantially increasing from the midcentury, indicating the choice of GHM outweighing by far the uncertainty arising from the choice of GCM and associated emission scenario.", "link": "https://doi.org/10.1002/grl.50686", "authors": "Yoshihide Wada, Dominik Wisser, Stephanie Eisner, Martina Flörke, Dieter Gerten, Ingjerd Haddeland, Naota Hanasaki, Yoshimitsu Masaki", "source": "Geophysical Research Letters", "published": "2013-9-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 48, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2026ea005326", "title": "Spatiotemporal Mapping of Sea Surface Height and Temperature Fields From Satellite Observations Using Score‐Based Data Assimilation", "summary": "Submesoscale flows at the ocean surface play a crucial role in the Earth system but are difficult to observe on a global scale. Modern satellite observation systems allow us to partially bridge this gap by capturing fields that are dynamically linked to the surface flow such as sea surface height anomaly (SSHA) and sea surface temperature (SST) at submesoscale resolution. However, these high‐resolution observations contain frequent temporal and spatial gaps, which create challenges for traditional reconstruction methods that depend on SSHA and SST data on a uniform grid. To address this, we apply diffusion models guided using the score‐based data assimilation (SDA) algorithm to generate plausible time series of SSHA and SST evolution over small regions of the ocean surface at submesoscale resolution based on spatially and temporally sparse satellite observations. Our procedure is based on training unconditional generative diffusion models to predict the time series evolution of satellite‐observable surface fields using MITgcm llc4320, a high resolution numerical ocean model, as a “prior” field, and steering the generative process via posterior sampling. Next, we use the SDA algorithm to extend our generative models’ receptive field to encompass observations spaced over arbitrarily long time series. We test our models” performance over a wide range of dynamical regimes and observational conditions in an idealized setting and apply our models to real Surface Water and Ocean Topography SSHA data and Advanced Clear‐Sky Processor for Ocean SST fields as proof of concept and moti", "link": "https://doi.org/10.1029/2026ea005326", "authors": "Tatsu Monkman, Dhruv Balwada, Spencer Jones, Scott Martin, K. Shafer Smith", "source": "Earth and Space Science", "published": "2026-11", "first_seen": "2026-11-26T13:59:01+00:00", "score": 48, "topics": ["Deep Learning"], "watch": [], "boosts": ["diffusion model"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2019jd031601", "title": "Cloud and Precipitation Properties of MCSs Along the Meiyu Frontal Zone in Central and Southern China and Their Associated Large‐Scale Environments", "summary": "This study focuses on investigating the cloud and precipitation features of Meiyu mesoscale convective systems (MCSs) and their relation to the large‐scale environments in central and southern China using satellite observations and reanalysis data during the period 2014–2018. MCSs from two different locations, the Yangtze River Basin (YRB) and Southern China (SC), are examined separately. The Meiyu MCSs have a mean precipitation rate of 3.6 mm/hr and contribute 20% to 60% of the total precipitation during the Meiyu period. The diurnal cycle of Meiyu MCSs shows a maximum precipitation amount in the morning, which is associated with the enhanced nocturnal low‐level jet (LLJ) overnight. Although the synoptic setups in YRB and SC are found to be similar when normalized around the MCS initiation locations, MCSs exhibit some differences in terms of the cloud top height, precipitation rate, and duration, which are likely by the differences in the local forcing. Large interannual variations are found in MCSs' number, cloud size, lifetime, and rainfall intensity, which is found to be associated with the interannual variabilities in the large‐scale environments. By comparing the large‐scale environments with climatological mean states, we find that the year with the most intense MCS activity during the study period is characterized by an intensified southwesterly LLJ, which increases the moisture transport from the Indian Ocean and an enhancement of the midtropospheric westerly jet, which induces adiabatic ascent along the Meiyu front, creating more favorable conditions for convectio", "link": "https://doi.org/10.1029/2019jd031601", "authors": "Wenjun Cui, Xiquan Dong, Baike Xi, Min Liu", "source": "JGR: Atmospheres", "published": "2020-3-18", "first_seen": "2026-11-26T13:59:01+00:00", "score": 48, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-4-809-2023", "title": "Atmospheric response to cold wintertime Tibetan Plateau conditions over eastern Asia in climate models", "summary": "Central Asian orography (namely the Tibetan and Mongolian plateaux) sets important features of the winter climate over eastern Asia and the Pacific. By deflecting the mid-latitude jet polewards it contributes to the formation of the Siberian high and, on the lee side, to the advection of dry cold continental air over the eastern Asian coast and the Pacific Ocean, where atmospheric instability and cyclogenesis thrive. While the mechanic forcing by the orography is assessed in a number of modelling studies, it is still not clear how near-surface temperature over the two most prominent orographic barriers of the central Asian continent – the Tibetan and Mongolian plateaux – influences the winter climate. The problem is particularly relevant in view of a well-known cold bias in state-of-the-art climate models in proximity to the Tibetan Plateau, likely related to the modelling of land processes and land–atmosphere interaction over complex orography. Here we take advantage of the large spread in near-surface temperature over the central Asian plateaux within the Coupled Model Intercomparison Project Phase 6 (CMIP6) to study how colder-than-average Asian plateau temperatures impact the atmospheric circulation. Based on composites of the CMIP6 models' climatologies showing the coldest Tibetan Plateau conditions, we find that such negative temperature anomalies appear to amplify the atmospheric response to orography, with an intensification of the eastern Asian winter monsoon and of the equatorward flank of the Pacific jet. The results of the CMIP6 composite analysis are supported ", "link": "https://doi.org/10.5194/wcd-4-809-2023", "authors": "Alice Portal, Fabio D'Andrea, Paolo Davini, Mostafa E. Hamouda, Claudia Pasquero", "source": "Weather and Climate Dynamics", "published": "2023-9-15", "first_seen": "2026-11-26T13:59:01+00:00", "score": 48, "topics": ["Climate Modelling"], "watch": [], "boosts": ["monsoon", "cmip6"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2024.19", "title": "FloodGNN-GRU: a spatio-temporal graph neural network for flood prediction", "summary": "Classical approaches for flood prediction apply numerical methods for the solution of partial differential equations that capture the physics of inundation processes (e.g., the 2D Shallow Water equations). However, traditional inundation models are still unable to satisfy the requirements of many relevant applications, including early-warning systems, high-resolution (or large spatial domain) simulations, and robust inference over distributions of inputs (e.g., rainfall events). Machine learning (ML) approaches are a promising alternative to physics-based models due to their ability to efficiently capture correlations between relevant inputs and outputs in a data-driven fashion. In particular, once trained, ML models can be tested/deployed much more efficiently than classical approaches. Yet, few ML-based solutions for spatio-temporal flood prediction have been developed, and their reliability/accuracy is poorly understood. In this paper, we propose FloodGNN-GRU, a spatio-temporal flood prediction model that combines a graph neural network (GNN) and a gated recurrent unit (GRU) architecture. Compared to existing approaches, FloodGNN-GRU (i) employs a graph-based model (GNN); (ii) operates on both spatial and temporal dimensions; and (iii) processes the water flow velocities as vector features, instead of scalar features. We evaluate FloodGNN-GRU using a LISFLOOD-FP simulation of Hurricane Harvey (2017) in Houston, Texas. Our results, based on several metrics, show that FloodGNN-GRU outperforms several data-driven alternatives in terms of accuracy. Moreover, our approach can", "link": "https://doi.org/10.1017/eds.2024.19", "authors": "Arnold Kazadi, James Doss-Gollin, Antonia Sebastian, Arlei Silva", "source": "Environmental Data Science", "published": "2024", "first_seen": "2026-11-26T13:59:01+00:00", "score": 48, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.04536", "title": "Machine learning emulators of dynamic global vegetation models for fast gridded carbon budget predictions", "summary": "The land carbon sink explains most of the variability of the atmospheric CO2 growth rate, but the Global Carbon Budget estimates it with dynamic global vegetation models (DGVMs) run once a year. Emulators could provide it sooner if they reproduce each model outside its training period. Here we show that convolutional neural network emulators of 19 of these models, driven by ERA5 climate and their own past predictions, reproduce the global land sink of these models and its spread over two years not used in training. Global monthly net biome production (NBP) anomalies were reproduced with a median R^2 of 0.81. The error of the multi-model mean annual NBP was at most 0.23 GtC yr^-1. At the grid-cell level, the median R^2 of monthly anomalies was 0.30, partly because of errors that accumulate in the emulated NBP history.", "link": "https://arxiv.org/abs/2611.04536", "authors": "Piyu Ke, Xiaofan Gui, Stephen Sitch, Zhu Liu, Xun Li, Jiang Bian, Pierre Friedlingstein, Philippe Ciais", "source": "arXiv", "published": "2026-11-03", "first_seen": "2026-11-26T13:59:01+00:00", "score": 47, "topics": ["Deep Learning"], "watch": [], "boosts": ["emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.22077", "title": "Can AI Forecast the Extremes? Evaluating Probabilistic Weather Models on Tropical Cyclones", "summary": "Weather prediction is undergoing an important shift, with data-driven AI models outperforming leading numerical weather prediction systems on average at a fraction of the computational cost. Yet, whether this success extends to extreme events remains contested. Earlier evaluations have exposed important shortcomings, but have largely focused on deterministic models and metrics, leaving the capabilities of the latest probabilistic models less understood. We conduct an extensive benchmark of tropical cyclone forecasting, comparing GenCast, FourCastNet 3, and FGN with ECMWF's operational physics-based ensemble, IFS-ENS. We develop a suite of probabilistic metrics and diagnostic analyses to assess cyclone tracking, intensity biases, uncertainty, and the wind-pressure relationship that characterizes storm structure. We find that, despite remaining limitations in intensity and ensemble spread, leading AI models substantially outperform IFS-ENS in cyclone tracking: FGN achieves better probabilistic location scores for 90% of evaluated storms in 2025. Further analyses reveal model-specific failure modes and suggest a lingering influence of pretraining data, pointing to opportunities for targeted improvement. Nonetheless, these results suggest that AI models are capable of capturing physical relationships that remain predictive well beyond typical weather conditions, motivating further investigation into how these capabilities emerge and how to strengthen them.", "link": "https://arxiv.org/abs/2610.22077", "authors": "Nathan Chalumeau, Xavier Renard, Remi Meynadier, Hugo Rakotoarimanga, Marcin Detyniecki, Emmanuel de Bezenac", "source": "arXiv", "published": "2026-10-15", "first_seen": "2026-11-26T13:59:01+00:00", "score": 47, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.24329", "title": "Distribution-Free Uncertainty Quantification for Weather Forecasting: Conformal Prediction Under Spatiotemporal Dependence", "summary": "Conformal prediction gives finite-sample, distribution-free marginal coverage and has begun to be applied to gridded weather forecasts. Marginal coverage concerns the long-run fraction of covered points at a location, not how coverage behaves jointly across space and time on a given day. I benchmark eight interval-construction procedures (Gaussian, pooled and per-cell split conformal, per-season, adaptive conformal inference and rolling windows) for gridded 2 m temperature forecasts at eight lead times from 6 hours to 10 days, using ERA5 at 5.625 degree resolution, a deliberately modest convolutional forecaster and ECMWF's operational HRES, with calibration in 2017-2018 and testing in 2019-2021. Alongside coverage, width and interval score, I report dependence diagnostics: a spatial overdispersion index, quantiles of daily spatial coverage and miss persistence relative to a shuffled-days null. Per-cell methods reach near-nominal marginal coverage, yet the day-to-day variance of the fraction of cells covered is roughly 3 to 10 times what independent cells would give, and misses cluster in time; both effects grow with lead time for the CNN, also appear for HRES, and are shared by all methods. An oracle that divides each day's normalised errors by that day's mean removes 81 to 92 percent of the excess dispersion for the CNN and 93 to 98 percent for HRES, so days of large errors across much of the grid account for most of it. A day-scale predicted from seasonal terms and already-verified errors lowers the overdispersion index without widening intervals but improves interval sco", "link": "https://arxiv.org/abs/2611.24329", "authors": "Mariya", "source": "arXiv", "published": "2026-11-18", "first_seen": "2026-11-26T13:59:01+00:00", "score": 47, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2602.22293", "title": "Learning global river system hydrodynamics with a topology-informed foundation model", "summary": "Accurate river prediction is essential for water, food, and energy security, yet extending it reliably from sparse in-situ gauges to the full river network remains an open challenge. Although machine learning has transformed Earth-system modelling, the same sparse and uneven observations have largely confined its advances for rivers to discrete basins rather than connected river systems. Here we introduce GraphRiverCast (GRC), a topology-informed river foundation model for reach-level prediction across the global river network. Exploiting the connectivity and energetics of rivers, it is trained on sparse gauges and predicts daily multivariate hydrodynamics with no prior river conditions. GRC outperforms strong physics-based and machine-learning models. Attribution experiments show that, compared with standard autoregressive models that rely more on temporal recurrence, GRC reconstructs river states from topology and forcing, learning the dynamics themselves and inheriting the self-correcting character of river systems. Its skill therefore barely decays with lead time, even far beyond its training horizon. It also generalises to ungauged reaches and finer-resolution networks, bringing reliable hydrodynamic prediction to poorly monitored regions. More broadly, harnessing the structure and energetics of a system offers a strategy for machine learning in other observation-limited Earth systems.", "link": "https://arxiv.org/abs/2602.22293", "authors": "Hancheng Ren, Gang Zhao, Shuo Wang, Louise Slater, Dai Yamazaki, Shu Liu, Jingfang Fan, Xueying Li", "source": "arXiv", "published": "2026-02-25", "first_seen": "2026-11-26T13:59:01+00:00", "score": 47, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-18-8157-2025", "title": "Development of a model framework for terrestrial carbon flux prediction: the Regional Carbon and Climate Analytics Tool (RCCAT) applied to non-tidal wetlands", "summary": "Wetlands play a pivotal role in carbon sequestration but emit methane (CH 4 ), creating uncertainty in their net climate impact. Although process-based models offer mechanistic insights into wetland dynamics, they require extensive site-specific parameterisation (e.g. soil carbon profiles, pore-water chemistry, vegetation-specific model parameters), as well as high-resolution hydrological and meteorological inputs that are often difficult to obtain outside of well-instrumented research sites, which makes regional upscaling challenging. In contrast, data-driven models provide a scalable alternative by leveraging available datasets to identify patterns and relationships, making them more adaptable for large-scale applications. However, their performance can vary significantly depending on the quality and representativeness of the data, as well as the model design, which raises questions about their reliability and generalizability in complex wetland systems. To address these issues, we present a data-driven framework for upscaling wetland CO 2 and CH 4 emissions, across a range of machine learning models that vary in complexity, validated against an extensive observational dataset from the Sacramento-San Joaquin Delta. We show that artificial intelligence (AI) approaches, including Random Forests, gradient boosting methods (XGBoost, LightGBM), Support Vector Machines (SVM) and Recurrent Neural Networks (GRU, LSTM), outperform linear regression models, with RNNs standing out, achieving an R 2 of 0.73 for daily CO 2 flux predictions compared to 0.64 for linear regression, and a", "link": "https://doi.org/10.5194/gmd-18-8157-2025", "authors": "Ashley Brereton, Zelalem A. Mekonnen, Bhavna Arora, William J. Riley, Kunxiaojia Yuan, Yi Xu, Yu Zhang, Qing Zhu", "source": "Geoscientific Model Development", "published": "2025-11-5", "first_seen": "2026-11-26T13:59:01+00:00", "score": 47, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-18-5605-2025", "title": "Huge ensembles – Part 2: Properties of a huge ensemble of hindcasts generated with spherical Fourier neural operators", "summary": "In Part 1, we created an ensemble based on spherical Fourier neural operators. As initial condition perturbations, we used bred vectors, and as model perturbations, we used multiple checkpoints trained independently from scratch. Based on diagnostics that assess the ensemble's physical fidelity, our ensemble has comparable performance to operational weather forecasting systems. However, it requires orders-of-magnitude fewer computational resources. Here in Part 2, we generate a huge ensemble (HENS), with 7424 members initialized each day of summer 2023. We enumerate the technical requirements for running huge ensembles at this scale. HENS precisely samples the tails of the forecast distribution and presents a detailed sampling of internal variability. HENS has two primary applications: (1) as a large dataset with which to study the statistics and drivers of extreme weather and (2) as a weather forecasting system. For extreme climate statistics, HENS samples events 4 σ away from the ensemble mean. At each grid cell, HENS increases the skill of the most accurate ensemble member and enhances coverage of possible future trajectories. As a weather forecasting model, HENS issues extreme weather forecasts with better uncertainty quantification. It also reduces the probability of outlier events, in which the verification value lies outside the ensemble forecast distribution.", "link": "https://doi.org/10.5194/gmd-18-5605-2025", "authors": "Ankur Mahesh, William D. Collins, Boris Bonev, Noah Brenowitz, Yair Cohen, Peter Harrington, Karthik Kashinath, Thorsten Kurth", "source": "Geoscientific Model Development", "published": "2025-9-4", "first_seen": "2026-11-26T13:59:01+00:00", "score": 47, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual ne
