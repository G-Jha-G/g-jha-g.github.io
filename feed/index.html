present day, which is much higher than other estimates of ∼ 0.3 %–10 %. Our new isoprene EFs substantially reduce the amount of isoprene emitted by C 4 grasslands, in line with observational studies and other modelling approaches, while also improving the emissions from other known sources, such as tropical broadleaf trees. Similar results are f", "link": "https://doi.org/10.5194/gmd-16-3083-2023", "authors": "James Weber, James A. King, Katerina Sindelarova, Maria Val Martin", "source": "Geoscientific Model Development", "published": "2023-6-1", "first_seen": "2026-11-23T14:47:49+00:00", "score": 3, "topics": ["Climate Modelling"], "watch": [], "boosts": []}, {"key": "doi:10.5194/gmd-7-2077-2014", "title": "A suite of early Eocene (~ 55 Ma) climate model boundary conditions", "summary": "We describe a set of early Eocene (~ 55 Ma) climate model boundary conditions constructed in a self-consistent reference frame and incorporating recent data and methodologies. Given the growing need for uniform experimental design within the Eocene climate modelling community and the challenges faced in simulating the prominent features of Eocene climate, we make publicly available our data sets of Eocene topography, bathymetry, tidal dissipation, vegetation, aerosol distributions and river runoff. Major improvements in our boundary conditions over previous efforts include the implementation of the ANTscape palaeotopography of Antarctica, more accurate representations of the Drake Passage and Tasman Gateway, as well as an approximation of sub grid cell topographic variability. Our boundary conditions also include for the first time modelled estimates of Eocene aerosol distributions and tidal dissipation, both consistent with our palaeotopography and palaeobathymetry. The resolution of our data sets is unprecedented and will facilitate high resolution climate simulations. In light of the inherent uncertainties involved in reconstructing global boundary conditions for past time periods these data sets should be considered as one interpretation of the available data and users are encouraged to modify them according to their needs and interpretations. This paper marks the beginning of a process for reconstructing a set of accurate, open-access Eocene boundary conditions for use in climate models.", "link": "https://doi.org/10.5194/gmd-7-2077-2014", "authors": "N. Herold, J. Buzan, M. Seton, A. Goldner, J. A. M. Green, R. D. Müller", "source": "Geoscientific Model Development", "published": "2014-9-16", "first_seen": "2026-11-23T14:47:49+00:00", "score": 3, "topics": ["Climate Modelling"], "watch": [], "boosts": []}, {"key": "doi:10.5194/gmd-19-955-2026", "title": "BuRNN (v1.0): a data-driven fire model", "summary": "Fires play an important role in the Earth system but remain complex phenomena that are challenging to model numerically. Here, we present the first version of BuRNN, a data-driven model simulating burned area on a global 0.5° × 0.5° grid with a monthly time resolution. We trained Long Short-Term Memory networks to predict satellite-based burned area (GFED5) from a range of climatic, vegetation and socio-economic parameters. We employed a region-based cross-validation strategy to account for the high spatial autocorrelation in our data. BuRNN outperforms the process-based fire models participating in ISIMIP3a on a global scale across a wide range of metrics. Regionally, BuRNN outperforms almost all models across a set of benchmarking metrics in all regions. Through explainable AI we unravel the difference in regional drivers of burned area in our models, showing that the presence/absence of bare ground and C 4 grasses along with the fire weather index have the largest effects on our predictions of burned area. Lastly, we used BuRNN to reconstruct global burned area for 1901–2019 and compare the simulations against independent long-term historical fire observation databases in five countries and the EU. Our approach highlights the potential of machine learning to improve burned area simulations and our understanding of past fire behaviour.", "link": "https://doi.org/10.5194/gmd-19-955-2026", "authors": "Seppe Lampe, Lukas Gudmundsson, Basil Kraft, Stijn Hantson, Douglas Kelley, Vincent Humphrey", "source": "Geoscientific Model Development", "published": "2026-1-29", "first_seen": "2026-11-23T14:47:49+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": []}, {"key": "doi:10.5194/gmd-15-8111-2022", "title": "Impact of physical parameterizations on wind simulation with WRF V3.9.1.1 under stable conditions at planetary boundary layer gray-zone resolution: a case study over the coastal regions of North China", "summary": "Reliable simulation of wind fields under stable weather conditions is vital for preventing air pollution. In this study, we investigate how different physical parameterizations impact simulated near-surface wind at 10 m height over the coastal regions of North China using the Weather Research and Forecasting (WRF) model with a horizontal grid spacing of 0.5 km. We performed 640 simulations using combinations of 10 planetary boundary layer (PBL), 16 microphysics (MP), and four shortwave–longwave radiation (SW–LW) schemes. Model performance is evaluated using measurements from 105 weather station observations. The results show that the WRF model can reproduce the temporal variation of wind speed in a reasonable way. The simulated wind speed is most sensitive to the PBL schemes, followed by SW–LW schemes and MP schemes. Among all PBL schemes, the MYJ scheme shows the best temporal correlation with the observed wind speed, while the Yonsei University (YSU) scheme has the lowest model bias. Dudhia–RRTM and MYDM7 show the best model performances out of all SW–LW and MP schemes, respectively, and the interactions among schemes also have large influences on wind simulation. Further investigation indicates that model sensitivity is also impacted by ocean proximity and elevation. For example, for coastal stations, MYNN shows the best correlation with observations among all PBL schemes, while Goddard shows the smallest bias of SW–LW schemes; these results are different from those of inland stations. In general, according to the bias metrics, WRF simulates wind speed less accurately fo", "link": "https://doi.org/10.5194/gmd-15-8111-2022", "authors": "Entao Yu, Rui Bai, Xia Chen, Lifang Shao", "source": "Geoscientific Model Development", "published": "2022-11-11", "first_seen": "2026-11-23T14:47:49+00:00", "score": 3, "topics": ["Climate Modelling"], "watch": [], "boosts": []}, {"key": "doi:10.5194/gmd-16-7375-2023", "title": "Perspectives of physics-based machine learning strategies for geoscientific applications governed by partial differential equations", "summary": "An accurate assessment of the physical states of the Earth system is an essential component of many scientific, societal, and economical considerations. These assessments are becoming an increasingly challenging computational task since we aim to resolve models with high resolutions in space and time, to consider complex coupled partial differential equations, and to estimate uncertainties, which often requires many realizations. Machine learning methods are becoming a very popular method for the construction of surrogate models to address these computational issues. However, they also face major challenges in producing explainable, scalable, interpretable, and robust models. In this paper, we evaluate the perspectives of geoscience applications of physics-based machine learning, which combines physics-based and data-driven methods to overcome the limitations of each approach taken alone. Through three designated examples (from the fields of geothermal energy, geodynamics, and hydrology), we show that the non-intrusive reduced-basis method as a physics-based machine learning approach is able to produce highly precise surrogate models that are explainable, scalable, interpretable, and robust.", "link": "https://doi.org/10.5194/gmd-16-7375-2023", "authors": "Denise Degen, Daniel Caviedes Voullième, Susanne Buiter, Harrie-Jan Hendricks Franssen, Harry Vereecken, Ana González-Nicolás", "source": "Geoscientific Model Development", "published": "2023-12-19", "first_seen": "2026-11-23T14:47:49+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": []}, {"key": "doi:10.1029/2023gl104037", "title": "A Pacific Tropical Decadal Variability Challenge for Climate Models", "summary": "Understanding and forecasting Tropical Pacific Decadal‐scale Variability (TPDV) strongly rely on climate model simulations. Using a Linear Inverse Modeling (LIM) diagnostic approach, we reveal Coupled Model Intercomparison Project Phase 6 models have significant challenges in reproducing the spatial structure and dominant mechanisms of TPDV. Specifically, while the models' ensemble mean pattern of TPDV resembles that of observations, the spread across models is very large and most models show significant differences from observations. In observations, removing the coupling between extratropics and tropics reduces TPDV by ∼60%–70%, and removing the tropical thermocline variability makes the central tropical Pacific a key center of action for TPDV and El Niño Southern Oscillation variability. These characteristics are only confirmed in a subset of models. Differences between observations and simulations are outside the range of natural internal TPDV noise and pose important questions regarding our ability to model the impacts of natural internal low‐frequency variability superimposed on long‐term climate change.", "link": "https://doi.org/10.1029/2023gl104037", "authors": "Yingying Zhao, Emanuele Di Lorenzo, Matthew Newman, Antonietta Capotondi, Samantha Stevenson", "source": "Geophysical Research Letters", "published": "2023-8-3", "first_seen": "2026-11-23T14:47:49+00:00", "score": 3, "topics": ["Climate Modelling"], "watch": [], "boosts": []}, {"key": "doi:10.1007/s00382-017-3648-3", "title": "Seasonal ENSO phase locking in the Kiel Climate Model: The importance of the equatorial cold sea surface temperature bias", "summary": "", "link": "https://doi.org/10.1007/s00382-017-3648-3", "authors": "C. Wengel, M. Latif, W. Park, J. Harlaß, T. Bayr", "source": "Climate Dynamics", "published": "2017-3-28", "first_seen": "2026-11-23T14:47:49+00:00", "score": 3, "topics": ["Climate Modelling"], "watch": [], "boosts": []}, {"key": "doi:10.1175/1520-0493(1974)102<0509:vvcsuf>2.0.co;2", "title": "Various Vertical Coordinate Systems Used for Numerical Weather Prediction", "summary": "", "link": "https://doi.org/10.1175/1520-0493(1974)102<0509:vvcsuf>2.0.co;2", "authors": "Akira Kasahara", "source": "Monthly Weather Review", "published": "1974-7", "first_seen": "2026-11-23T14:47:49+00:00", "score": 3, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": []}, {"key": "doi:10.1002/qj.49711749802", "title": "Atmospheric soundings from satellites—false expectation or the key to improved weather prediction?", "summary": "Temperature and water vapour soundings from satellites have been available for more than 20 years. Because of the global nature of these data, satellite soundings were expected to improve significantly global numerical weather prediction (NWP). Indeed, experiments with the satellite soundings provided during the Global Weather Experiment (GWE) in 1979 revealed the positive impact of these data on extended‐range forecasts, particularly in the southern hemisphere. Unfortunately, since the GWE, the value of satellite soundings has apparently diminished. I believe this to be due largely to improvements in the models which have surpassed the inherently poor vertical resolution of these data relative to that of the contemporary NWP models. The satellite data can even degrade the analysis/forecast operation through the aliasing of small‐scale features which may be properly represented by the vertical scale resolved by the model. This lecture addresses, from a historical perspective, the dilemma of the decreasing value of satellite soundings in the weather‐forecast application (i.e., the reasons for the unfulfilled expectations of these data). Attention is then turned to the improvements in the satellite technology and the application techniques needed to reverse this trend.", "link": "https://doi.org/10.1002/qj.49711749802", "authors": "William L. Smith", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "1991-1", "first_seen": "2026-11-23T14:47:49+00:00", "score": 3, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": []}, {"key": "doi:10.1038/s42256-020-00247-1", "title": "Self-supervised retinal thickness prediction enables deep learning from unlabelled data to boost classification of diabetic retinopathy", "summary": "", "link": "https://doi.org/10.1038/s42256-020-00247-1", "authors": "Olle G. Holmberg, Niklas D. Köhler, Thiago Martins, Jakob Siedlecki, Tina Herold, Leonie Keidel", "source": "Nature Machine Intelligence", "published": "2020-11-9", "first_seen": "2026-11-23T14:47:49+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": []}, {"key": "doi:10.1038/s42256-023-00708-3", "title": "Annotating metabolite mass spectra with domain-inspired chemical formula transformers", "summary": "", "link": "https://doi.org/10.1038/s42256-023-00708-3", "authors": "Samuel Goldman, Jeremy Wohlwend, Martin Stražar, Guy Haroush, Ramnik J. Xavier, Connor W. Coley", "source": "Nature Machine Intelligence", "published": "2023-8-17", "first_seen": "2026-11-23T14:47:49+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": []}, {"key": "doi:10.1038/s42256-022-00503-6", "title": "Learning biophysical determinants of cell fate with deep neural networks", "summary": "", "link": "https://doi.org/10.1038/s42256-022-00503-6", "authors": "Christopher J. Soelistyo, Giulia Vallardi, Guillaume Charras, Alan R. Lowe", "source": "Nature Machine Intelligence", "published": "2022-6-30", "first_seen": "2026-11-23T14:47:49+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": []}, {"key": "doi:10.1038/s42256-024-00794-x", "title": "A computational framework for neural network-based variational Monte Carlo with Forward Laplacian", "summary": "", "link": "https://doi.org/10.1038/s42256-024-00794-x", "authors": "Ruichen Li, Haotian Ye, Du Jiang, Xuelan Wen, Chuwei Wang, Zhe Li", "source": "Nature Machine Intelligence", "published": "2024-2-13", "first_seen": "2026-11-23T14:47:49+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": []}, {"key": "doi:10.1038/s42256-019-0137-x", "title": "Assessing the importance of magnetic resonance contrasts using collaborative generative adversarial networks", "summary": "", "link": "https://doi.org/10.1038/s42256-019-0137-x", "authors": "Dongwook Lee, Won-Jin Moon, Jong Chul Ye", "source": "Nature Machine Intelligence", "published": "2020-1-17", "first_seen": "2026-11-23T14:47:49+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": []}, {"key": "arxiv:2611.23429", "title": "The balance of evidence indicates a slowing AMOC", "summary": "The Atlantic Meridional Overturning Circulation (AMOC) is a critical component of the climate system. Climate models have long predicted a slowing of the AMOC due to anthropogenic forcing, with a risk of passing tipping points in the future. The question of whether the AMOC is already weakening is still somewhat controversial. Continuous monitoring is only available for the past two decades, a period too short to tease apart contributions of natural variability and climate change. Reconstructions of AMOC strength going back further in time have different limitations which are debated in the literature. Here we compile and discuss this heterogeneous body of evidence, focusing on latitudes south of 45°N where northward and southward flow are separated vertically. We conclude that the balance of multiple lines of evidence strongly supports a past and ongoing AMOC slowing in response to global warming, although some uncertainty remains regarding its magnitude and timing.", "link": "https://arxiv.org/abs/2611.23429", "authors": "Stefan Rahmstorf, Levke Caesar", "source": "arXiv", "published": "2026-11-17T19:31:30Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Climate Modelling"], "watch": [], "boosts": ["uncertainty"]}, {"key": "arxiv:2611.21068", "title": "Reconstruction and Forecast of Extreme Waves from a Single Observation", "summary": "The state space of a dynamical system can, under suitable conditions, be reconstructed from a single observational time-series through delay-coordinate embedding. However, reconstructing the spatiotemporal evolution of nonlinear water waves from highly sparse measurements remains a considerable challenge. Here, by combining deep learning, compressed sensing, and the self-similarity properties of unidirectional nonlinear water wave evolution equation, we show that the evolving surface elevation of a highly nonlinear wave field can be reconstructed from observations collected at a {\\it single} measurement location. We subsequently use these reconstructions to forecast rogue waves associated with self-focusing soliton dynamics from point observations obtained in controlled water wave tank experiments, demonstrating excellent agreement with measurements of the fully evolved wave field. Our results show that extreme wave events can be forecast from remarkably sparse observations and provide a framework that may be extended to other nonlinear dispersive systems governed by the interplay of dispersion and nonlinearity.", "link": "https://arxiv.org/abs/2611.21068", "authors": "Zachary T. Hilliard, Amin Chabchoub, Mohammad Farazmand", "source": "arXiv", "published": "2026-11-16T13:21:27Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme*"]}, {"key": "arxiv:2611.19978", "title": "GPROF V08: Improving Satellite Precipitation Estimates Across a Heterogeneous Constellation of Passive-Microwave Sensors", "summary": "Precipitation estimates from the passive microwave observations (PMW) of the Global Precipitation Measurement (GPM) mission serve a wide range of scientific, societal, and economic applications. The Goddard Profiling Algorithm (GPROF) is the operational precipitation retrieval used to produce the level-two precipitation estimates for the GPM mission. This study presents GPROF V08 - the most recent version of GPROF and a major update aimed at improving the accuracy of precipitation estimates from the GPM constellation. GPROF V08 replaces the single-pixel Bayesian retrieval scheme used by earlier GPROF versions with a convolutional neural network (CNN). Implementing the algorithm for the full GPM constellation required addressing several challenges such as the generation of synthetic observations suitable for training CNN retrievals, which has been described in the first part of this two-part study. This second part describes the final, operational implementation of GPROF V08, which adds a finetuning stage to the training to overcome remaining uncertainties in the synthetic training data. We extensively validate the new GPROF V08 algorithm for principal GPM sensors against reference precipitation estimates from combined radar and radiometer retrievals from GPM and TRMM as well as independent ground-based reference measurements. While the magnitude of improvements varies by sensor and surface type, the retrieval accuracy for all assessed sensors is improved. Although challenges such as the persistence of climatological biases (which remain of the same order as for GPROF V07) p", "link": "https://arxiv.org/abs/2611.19978", "authors": "Simon Pfreundschuh, Paula J. Brown, Christian D. Kummerow", "source": "arXiv", "published": "2026-11-15T12:41:31Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation"]}, {"key": "arxiv:2611.12787", "title": "MarsNet: Learning the Martian Atmosphere from Observations Alone", "summary": "We present MarsNet, a machine-learned model of the Martian atmosphere trained only on observations. Existing reanalyses assimilate spacecraft retrievals into general circulation models (GCMs), so where observations are sparse their fields largely reflect the model. We therefore use extant reanalyses only for evaluation. MarsNet alternates a two-hour forecast with an update that assimilates the observations of each window, and both steps are learned jointly. Because the Martian record is too sparse for an unrestricted network, learning is confined within a fixed physical structure: the state is in physical units, the forecast uses physical tendencies of fixed form and learned strength, and the update is a bounded Kalman update. MarsNet is trained on Mars Years (MY) 24--31 and evaluated on independent observations. On three seasons of MGS radio-occultation temperatures assimilated by no dataset, MarsNet matches or improves on the three reanalyses in the lowest three scale heights, with a near-surface root-mean-square error (RMSE) of 4.2 K against 4.4--5.4 K, but is less accurate aloft. The model's surface pressures are the most accurate of the four products (RMSE 10 Pa against Curiosity in MY32, compared with 20--46 Pa). On withheld Mars Climate Sounder profiles of MY32, its temperatures beat an observed climatology and persistence, including in ten-sol forecasts without new observations, and its stated uncertainty is close to calibrated. Much of the temperature skill is present before training and appears to come from the structure and tables fitted to the observations, whil", "link": "https://arxiv.org/abs/2611.12787", "authors": "Sebastian Mengwall, J. Michael Battalio", "source": "arXiv", "published": "2026-11-09T17:57:01Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Climate Modelling"], "watch": [], "boosts": ["uncertainty"]}, {"key": "arxiv:2611.07910", "title": "Inertial sub-range detection and characterization for ground-layer turbulence at new extremely large telescope sites in Chile", "summary": "The atmospheric boundary layer (ABL) presents turbulence regimes that diverge from the classical Kolmogorov 1941 (K41) power-law spectrum widely assumed in optical atmospheric profiling, yet turbulence characterization for astronomical applications remains predominantly based on K41 assumptions. Using high-frequency sonic anemometer data from site-testing campaigns at the Giant Magellan Telescope (GMT) and Thirty Meter Telescope (TMT) sites in Chile, we apply detrended fluctuation analysis (DFA)---a technique from fractal time-series analysis---to identify the inertial sub-range and evaluate statistical isotropy in the ABL, comparing our approach with the Fourier-based algorithm for robust identification of the inertial subrange (ARIIS). Strict Kolmogorov conditions---simultaneous isotropy and $k^{-5/3}$ scaling across all fields---are satisfied in fewer than 7 per cent of observations. Temperature fields systematically decouple from velocity components under stable stratification, exhibiting Bolgiano-Obukhov scaling ($k^{-7/5}$) during nighttime hours, indicating active rather than passive scalar behaviour. DFA-detected regime transitions correlate with characteristic turbulence scales, providing objective, model-free boundaries for the inertial subrange. Comparative $C_n^2$ estimation reveals that structure function methods assuming K41 scaling diverge significantly from flux-based parameterizations under stable conditions. The rarity of true Kolmogorov conditions at these sites necessitates stratification-aware methodologies for accurate optical turbulence characterizati", "link": "https://arxiv.org/abs/2611.07910", "authors": "Marco Sepúlveda, Darío G. Pérez", "source": "arXiv", "published": "2026-11-05T12:25:55Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Climate Modelling"], "watch": [], "boosts": ["extreme*"]}, {"key": "arxiv:2611.05922", "title": "Shifts in Rossby wave regimes via the change of group velocity with zonal jets", "summary": "Evidences show it is questionable to use the trends in Rossby wave phase speed (Cpx) to interpret the relation between the changes of extreme events and westerly jets. We propose, by using 70 years (1954-2023) of ERA5 reanalysis, that the trends in extremes are associated with the shifts of Rossby wave regimes, via the westerly-induced changes in Rossby wave group velocity (Cgx), which are two to three times larger than those in Cpx. We find significant deceleration in the subtropics and polar regions, alongside a salient midlatitude acceleration, of Rossby wave Cgx, especially over the East Asia-Pacific-North America and North Atlantic-Europe sectors. These changes induce robust shifts in spatiotemporal regimes of Rossby waves, from the transient synoptic-scale regime toward the quasi-stationary planetary-scale wave regime where Cgx decelerates, and vice versa. The CESM2 Large Ensemble confirms that the observed pattern over the Eurasia-Pacific-North America sector is a forced response to external forcing, while uncertainties remain over the polar regions and the North Atlantic. We suggest that westerly trends may reshape the regimes of extratropical Rossby wave activity and extreme weather events through the changes in group velocity rather than phase speed of Rossby waves.", "link": "https://arxiv.org/abs/2611.05922", "authors": "Zhixiang Li, Jianhua Lu, Yimin Liu, Tim Woollings", "source": "arXiv", "published": "2026-11-04T04:14:17Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Climate Modelling"], "watch": [], "boosts": ["extreme*"]}, {"key": "arxiv:2611.04768", "title": "RadarFill: Observation-Constrained Gap Filling of Systematic Blind Zones in 3-D Weather Radar Reflectivity Mosaics", "summary": "Ground-based weather radar mosaics contain systematic blind zones, especially at low altitudes, where missing reflectivity lacks corresponding complete observations for direct verification. We present RadarFill, an observation-constrained conditional diffusion framework for gap filling in three-dimensional radar reflectivity mosaics. RadarFill conditions on partially observed reflectivity and an observation mask, enforces available observations throughout reverse sampling, and preserves valid measurements in the final field. For training and controlled evaluation, structured synthetic missingness is designed from altitude-dependent missing-data statistics and the vertical nesting of blind zones in an operational 3-D radar mosaic product. Across 4,384 held-out test times and representative convective and typhoon cases, RadarFill recovers principal precipitation structures and moderate-to-strong echoes under extensive low-level missingness and generally outperforms conventional interpolation and a learning-based reference model. For real blind-zone evaluation, RadarFill model is applied directly to Fujian Province and compared with 90 matched volume scans from an independent phased-array radar. Within the principal 1-2 km low-level blind zones, RadarFill yields lower reflectivity errors than conventional interpolation, and the gap-filled precipitation structures show broad agreement with independent observations. In two controlled nowcasting experiments, improvements in RadarFill-initialized fields persist into subsequent forecasts, with the largest benefits at low altitudes ", "link": "https://arxiv.org/abs/2611.04768", "authors": "Xin Huang, Haofei Sun, Wei Han, Yunfan Yang, Huaguan Chen, Xingtao Song", "source": "arXiv", "published": "2026-11-03T12:13:13Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"]}, {"key": "arxiv:2611.03326", "title": "Six-hourly Probabilistic Precipitation Forecasts Created From Hourly Probabilities", "summary": "A lightweight neural network is described that produces six-hourly, spatially detailed probabilistic quantitative precipitation forecasts (PQPF) from a sequence of hourly spatially detailed probabilistic forecasts, for lead times from 6 to 72\\,h. The hourly forecasts were generated by a ``zero-inflated'' Attention Residual U-Net that outputs the parameters of a probability distribution including a probability of no precipitation and a weighted mixture of two Gamma distributions at each grid point for each hourly forecast lead time. The six-hourly network passes the six consecutive hourly parameter sets, together with summary statistics of the spatial texture of the raw deterministic forecast, through a small recurrent (GRU) layer and a multi-layer perceptron, and maps them to a corresponding zero-inflated mixture of three Gamma distributions describing the six-hourly accumulated precipitation. Training uses sets of hourly probabilistic forecasts, drawn preferentially from wet and heavy-precipitation cases (importance sampling), and matched Multi-Radar Multi-Sensor (MRMS) six-hourly precipitation accumulations, subject to a quality threshold. The resulting six-hourly probabilistic forecasts are well calibrated and skillful, as demonstrated by reliability diagrams, performance diagrams and Brier Skill Scores evaluated over an out-of-sample period spanning day 12 through the end of every month of 2025. The Brier Skill Scores are consistently and significantly higher than those of a baseline that sums independent draws from the hourly distributions. Forecasts show realistic mod", "link": "https://arxiv.org/abs/2611.03326", "authors": "Thomas M Hamill", "source": "arXiv", "published": "2026-11-02T15:49:25Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation"]}, {"key": "arxiv:2610.23094", "title": "Graph-Learned Spring SST Evolution and Land-Ocean Synergy Improve Yangtze Summer Rainfall Prediction", "summary": "Seasonal prediction of Yangtze summer rainfall is challenged by nonstationary oceanic precursors. Here we demonstrate that accounting for the evolution of spring SST and state-dependent land surface information improves predictability. Graph total variation (GTV) is applied to March-May SST fields over the western Pacific, Niño3.4, and tropical Indian Ocean to identify spatially coherent, month-specific SST coefficients for each grid cell and month to form a scalar GTV index. The learned coefficient patterns capture April-to-May ENSO decay and an opposing Indian Ocean adjustment, consistent with coupled Indo-Pacific variability. During 2008-2022, the GTV index prediction outperforms Niño3.4-based and sparse-regression benchmarks. Further improvement is achieved by including interactions of May Indo-China Peninsula soil moisture with Indian Ocean SST, importantly also correcting several underestimated wet summers. Circulation diagnostics associate the learned index with a summer geopotential-height dipole and Yangtze moisture convergence, while dry-Indochina/warm-Indian-Ocean conditions coincide with stronger westward extension of the western Pacific subtropical high.", "link": "https://arxiv.org/abs/2610.23094", "authors": "Yifu Gao, Haishan Chen, Runze Li, Efi Foufoula-Georgiou, Jasper A. Vrugt", "source": "arXiv", "published": "2026-10-16T08:05:41Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["india*"]}, {"key": "arxiv:2610.16714", "title": "Forecasting carbon-risk hotspots ahead of the extreme 2026 El Niño", "summary": "A potentially super El Niño is forecasted in 2026, raising the need to anticipate land carbon-cycle risks before its impacts unfold. We develop a prospective early-warning framework that uses dynamic global vegetation models driven by an ensemble of ECMWF seasonal climate forecasts and machine-learning burned area predictions. Forecasts indicate a $0.23 \\pm 0.21$ PgC reduction in global net biome productivity in the second half of 2026, with hotspots of sink weakening in eastern South America and elevated fire risk in Southeast Asia.", "link": "https://arxiv.org/abs/2610.16714", "authors": "Xiaomeng Du, Runda Jiang, Philippe Ciais, Pierre Friedlingstein, Stephen Sitch, Mike O'Sullivan", "source": "arXiv", "published": "2026-10-12T12:48:36Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme*"]}, {"key": "arxiv:2611.25119", "title": "Auditing Learned Dynamics in Weather Models", "summary": "Learned weather models are experimentally accessible computational systems whose internal representations can be inspected and manipulated. Using sparse autoencoder features from GraphCast, DeepMind's autoregressive weather forecasting model, we test whether causal relevance requires physical semantics, a question that matters for auditing whether AI forecasters used in high-assurance settings rely on reliable mechanisms. We also look at whether physically associated latent directions can be steered to improve extreme-event forecasts, where interventions are applied to the model's internal activations during the rollout. We find that ablating a feature locked to GraphCast's computational mesh increases global geopotential height error despite lacking conventional physical semantics. Second, suppressing convection- and low-level-vorticity-associated features weakens predicted tropical-cyclone deepening (the fall in central pressure during intensification), while amplifying them reduces intensity error, with amplification of convection features through feature scaling achieving a median of 51\\% error reduction over seven storms. Together, these results separate interpretable, physical association from causal utility and establish sparse features as experimental coordinates for auditing and intervening on learned weather dynamics.", "link": "https://arxiv.org/abs/2611.25119", "authors": "Skylar Gu, Christina Last", "source": "arXiv", "published": "2026-11-18T19:58:01Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme*"]}, {"key": "arxiv:2611.19757", "title": "Spatiotemporal Reconstruction of Auroral Precipitations with Neural Fields", "summary": "Auroras provide remote optical observations of energetic electrons precipitating into the upper atmosphere, and whose energy distribution encodes key information about large scale magnetospheric processes. Recovering the underlying electron precipitation field from ground-based camera images of auroras remains a challenging inverse problem. Existing auroral tomography techniques are often limited to simplified static settings, discrete spatial and energy grids, or strong assumptions on the electron energy spectrum. We propose to model the dynamic auroral electron precipitation field via a temporally conditioned neural network. The state of the precipitation field at each frame is represented by a per-frame latent code driven by learned discrete dynamics. A shared decoder maps horizontal positions and latent states to electron energy spectra. The predicted flux is converted to multi-wavelength volume emission rates and rendered into camera images accounting for delayed emissions. We evaluate the method on synthetic dynamic auroral sequences and real multi-view auroral videos, showing that the proposed representation produces temporally coherent precipitation reconstructions and image projections consistent with the observations.", "link": "https://arxiv.org/abs/2611.19757", "authors": "Nazar Misyats, Mizuki Fukizawa, Yoshimasa Tanaka, Satoshi Ikehata", "source": "arXiv", "published": "2026-11-15T03:38:35Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation"]}, {"key": "arxiv:2611.14207", "title": "DailyWildfireCAN: A Dataset and Benchmark for Next-Day Wildfire Spread Prediction in Canada", "summary": "Wildfires represent a critical ecological and socio-economic challenge in Canada, where vast boreal forests and a warming climate have amplified the frequency and severity of extreme fire seasons. Predicting next-day wildfire spread can support fire management, but requires capturing complex interactions among weather, fuels, and terrain. Deep learning has emerged as a promising approach to learning these relationships from heterogeneous environmental data, yet its development and evaluation depend on representative datasets. Existing deep learning research on wildfire spread relies predominantly on US-focused datasets, leaving Canadian fire environments underrepresented. To address this gap, we present DailyWildfireCAN, a multi-modal, multi-temporal dataset and benchmark for predicting next-day wildfire spread across Canada. The dataset tracks continuous fire progression over multi-day events at a high spatial and temporal resolution of 90-m and 24-hour, respectively. This resolution preserves fine-scale information relevant to fire-edge geometry, local fuel variations, and terrain effects, supporting research toward improved daily wildfire spread forecasting. DailyWildfireCAN covers 2,440 wildfire events across eight fire seasons 2017-2024 and integrates 33 features across diverse modalities, including topography, meteorology, land cover, vegetation and forest structure, human influence indices, and satellite imagery. We establish a comprehensive benchmark comparing mono-temporal and multi-temporal prediction models, accompanied by a multi-dimensional evaluation framework", "link": "https://arxiv.org/abs/2611.14207", "authors": "Mahacine Ettahri, Hager Radi Abdelwahed, Toluwaleke Olutayo, Daniel Aloise, Gaétan Marceau Caron", "source": "arXiv", "published": "2026-11-10T15:29:13Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme*"]}, {"key": "arxiv:2611.07444", "title": "Two-stage residual learning for calibrated uncertainty in solar irradiance forecasts", "summary": "Accurate forecasting of renewable generation requires not only point predictions but also reliable estimates of the uncertainty attached to them, particularly at extended horizons. Machine learning models are increasingly used to predict solar output, but they typically report a single value and capture the associated uncertainty poorly. The standard remedy is to train a model to predict the parameters of an assumed probability distribution directly. Here we develop an alternative two-stage method, motivated by synthetic solar signal generation, in which the forecast error is modeled separately from the expected irradiance. A first long short-term memory (LSTM) network predicts the expected global horizontal irradiance, and a second network models the distribution of the forecast error, which is added back to the mean to give both the forecast and its uncertainty. Using historical weather data from the National Solar Radiation Database and a probability integral transform evaluation, we show that explicitly modeling the error brings the predicted standard deviation markedly closer to the historical value, reducing the deviation between the two by 34.6 percent for a standalone LSTM and by 56.5 percent when the LSTM is coupled to Gaussian process regression, the most reliable of the configurations tested. Because the method models the total forecast error directly, it captures the full predictive uncertainty that matters for decisions, rather than only the model contribution that dropout-based approaches estimate.", "link": "https://arxiv.org/abs/2611.07444", "authors": "RR Flanagan, E Kasha, PW Talbot, AS Epiny, MR Deinert", "source": "arXiv", "published": "2026-11-05T04:42:16Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": ["uncertainty"]}, {"key": "arxiv:2611.07160", "title": "A Survey of Nonlinear Filtering Methods for Data Assimilation and Recent Advances in Generative AI-Enabled Score Filters", "summary": "Many real-world applications, such as numerical weather prediction or wildfire tracking, involve modeling highly nonlinear dynamical systems that are chaotic and influenced by various sources of uncertainty. To improve model prediction accuracy and reduce such uncertainties, data assimilation (DA) combines the dynamical model with partial, noisy observations to estimate the evolution of the system's state. Doing so depends on solving the optimal filtering problem: computing the conditional distribution of a hidden state given a sequence of observations. Classical approaches fail along three distinct axes: Kalman-based methods assume Gaussian posteriors and produce biased estimates under nonlinear observation operators; particle-based methods represent distributions with weighted samples and collapse in high dimensions due to the curse of dimensionality; and kernel-based methods move beyond discrete particle representations but cannot maintain their density approximation affordably as dimension grows. The Ensemble Score Filter (EnSF) avoids all three constraints by encoding the filtering density in a score function and approximating that score with a training-free Monte Carlo estimator, enabling stable filtering in high-dimensional, chaotic systems. This survey traces EnSF's mathematical foundations, establishes it as the state of the art for non-Gaussian, high-dimensional filtering, and examines fourteen extensions that expand its operational reach. Twelve of the fourteen extensions preserve this training-free Monte Carlo estimator at the core of the update, with only two d", "link": "https://arxiv.org/abs/2611.07160", "authors": "Cath Pham, Kadesha Reynolds", "source": "arXiv", "published": "2026-11-04T21:36:57Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"]}, {"key": "arxiv:2611.00433", "title": "Local Spatial TreeSHAP: Geographically Explainable AI Revealing Urbanization-Dependent Spatial Heterogeneity in Flood Resilience", "summary": "Urban flood resilience emerges from complex interactions among natural, built, and socio-economic systems, yet most recovery policies implicitly assume that resilience mechanisms are spatially uniform. To address this gap, this study develops a spatially explainable machine learning framework that integrates geographically weighted random forests with a novel Local Spatial TreeSHAP algorithm, enabling nonlinear resilience mechanisms to be identified and interpreted at the community scale. The framework is applied to 779 communities affected by the July 2023 extreme rainstorm in Beijing. Results reveal that resilience mechanisms exhibit substantially stronger spatial heterogeneity than the underlying physical and socio-economic conditions themselves, with SHAP-value spatial autocorrelation decreasing by 66.2% on average relative to predictor variables. Three distinct resilience regimes emerge across the urbanization gradient. Highly urbanized communities benefit from synergistic interactions among commercial infrastructure and accommodation services; transitional medium urbanized communities are constrained by infrastructure-development mismatches that create facility gaps despite continued urban expansion; and low urbanized communities are dominated by ecological and topographic thresholds, where adverse interactions between transportation and river-network structures undermine recovery capacity. Field investigations and interviews with 12 stakeholders corroborate these patterns. By linking geographically weighted machine learning with locally grounded attribution analysis,", "link": "https://arxiv.org/abs/2611.00433", "authors": "Zeyu Zhao, Xiaoshan Zhou, Fanxin Meng, Dongping Fang, Helen X. H. Bao", "source": "arXiv", "published": "2026-10-30T22:31:20Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme*"]}, {"key": "arxiv:2610.25625", "title": "Zephyrus-R1: Agentic Reinforcement Learning for Weather Reporting", "summary": "Reinforcement learning (RL) has emerged as a key method for training AI models in scientific applications, but RL remains difficult when outputs cannot easily be verified against a known ground-truth answer. Natural-language weather forecast reports are one such domain: they translate atmospheric data into assessments of weather evolution, hazards, and uncertainty for both the general public and key decision-makers. Unlike numerical weather-analysis questions, they admit many valid outputs, which limits deterministic verification. To address this, we develop Zephyrus-R1, a practical framework for RL on scientific weather forecast reporting. We focus on three key components of the agentic RL pipeline: reward design, curriculum learning, and an analysis of human-expert alignment. To encourage both report legibility and factual accuracy, we design a reward function that combines a meteorological rubric with bidirectional claim entailment, both evaluated against National Weather Service reference reports. Our framework optimizes this reward in a simulated tool-calling environment, enabling vision-language agents to gather and analyze forecast evidence across regions and lead times before producing a report. We use annotations from three meteorologists to audit the claim labels produced by our LLM judges. Finally, a curriculum helps small models first develop tool use and scientific reasoning through RL on verifiable weather-analysis questions, then optimize the open-ended report reward. After training Qwen3.5-4B with Zephyrus-R1, we improve the mean across six judge-metric scor", "link": "https://arxiv.org/abs/2610.25625", "authors": "Fengfei Yu, Marshall Fisher, Isadora White, Sumanth Varambally, Yasaman Jafari, Shivam Yadav", "source": "arXiv", "published": "2026-10-19T01:05:16Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"]}, {"key": "arxiv:2610.22120", "title": "Scene Reconstruction Using Ubiquitous Wireless Signals via Diffusion Posterior Inference Over physics-Grounded Representations", "summary": "Knowing the layout of the physical world matters for many applications, yet the sensors we rely on for it (e.g., cameras and LiDAR) can fail in darkness, in adverse weather, or behind walls. Wireless signals do not face these limitations: every link between a base station and a user is shaped by the buildings it passes, reflects from, or is blocked by, leaving information about the surrounding scene embedded in the wireless channel measured at the endpoints. However, mapping channel measurements to the environment is a severely ill-posed problem: a measurement records only the structures that interact with the transmitted electromagnetic waves along its propagation paths, and even these observations can often be explained by multiple plausible scenes. We therefore formulate wireless scene reconstruction as posterior inference and develop a hierarchical framework with two complementary stages to approach this problem. A wireless foundation model, pretrained to respect propagation physics, transforms each channel measurement into a representation of the scene structure that shaped the observation. A diffusion model then jointly integrates representations from multiple measurements to model and sample the posterior over building occupancy, with consensus over samples producing the final reconstruction. We demonstrate that the framework can accurately recover building footprints from wireless channel measurements alone and show that its performance depends critically on both design components: physics-grounded representations expose scene-relevant information, while joint poste", "link": "https://arxiv.org/abs/2610.22120", "authors": "Vahid Yazdnian, Yasaman Ghasempour", "source": "arXiv", "published": "2026-10-15T15:59:08Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": ["diffusion model*"]}, {"key": "arxiv:2611.15421", "title": "Advancing global water cycle science with the upcoming MAGIC satellite mission through data assimilation", "summary": "The GRACE and GRACE-FO missions provide unique global measurements of terrestrial water storage anomalies (TWSA) from space since 2003. However, in order to spatially downscale the GRACE/-FO resolution of 300 km further, and to vertically disaggregate TWSA into soil moisture, groundwater and other contributions, the TWSA observations were assimilated into hydrological and land surface models in the past while improving the realism of the models. With the upcoming MAGIC (Mass Change and Geosciences International Constellation) constellation consisting of two satellite pairs (NASA/DLR GRACE-C and ESA NGGM), significant advancements are expected for the monitoring of water mass changes, with improved temporal and spatial resolution, reduced latency, and with lower noise levels. In this study, we reviewed the capabilities and limitations of existing GRACE/-FO data assimilation systems. We then investigated the benefit of including data from the upcoming MAGIC constellation into existing assimilation frameworks to improve not only data sets for water and carbon cycle science but also in view of operational applications, within a closed-loop simulation. For example, we extended a global 17 years GRACE/-FO assimilation era to a long time series of 33 years with synthetic MAGIC data assimilated and show reductions in groundwater trends errors and errors in identifying hydrological extreme events. We further showed for Europe that both storage and river runoff simulations benefit from more frequent assimilation, which the integration of MAGIC data will enable due to the foreseen 5-d", "link": "https://arxiv.org/abs/2611.15421", "authors": "Helena Gerdener, Yorck Ewerdwalbesloh, Anne Springer, Annika Nitschke, Jürgen Kusche", "source": "arXiv", "published": "2026-11-11T12:50:28Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Downscaling"], "watch": [], "boosts": ["extreme*"]}, {"key": "arxiv:2611.14922", "title": "A Transferable Pretrained 3D Model for Impedance Inversion with Sparse-Well Prior Conditioning", "summary": "Deep-learning-based seismic impedance inversion commonly requires retraining for each target survey, which may generalize poorly beyond the conditioning locations when well control is extremely sparse. We propose a transferable three-dimensional inversion framework that separates offline learning from target-survey deployment. A masked autoencoder first learns seismic structural representations from unlabeled multi-survey data, after which the frozen encoder is incorporated into an inversion network trained on synthetic geological models with sparse-well-derived low-frequency priors. During deployment, the complete inversion network remains fixed; the available conditioning well is used only to construct the low-frequency prior and align the global impedance range. Experiments on the Overthrust model show that the proposed method achieves the lowest full-volume NRMSE and reduces the P95 trace-wise NRMSE from 0.1310 to 0.1074 relative to the best target-trained baseline, indicating fewer localized large errors under different well locations. In a field survey with one conditioning well and three blind wells, it reduces the mean blind-well NRMSE by 20.95% relative to the target-trained U-Net while maintaining the highest correlation. These results demonstrate that the proposed framework transfers useful impedance information beyond the conditioning location with low deployment cost and without retraining the inversion network.", "link": "https://arxiv.org/abs/2611.14922", "authors": "Gen Li, Zhaoyun Zong, Diqiong Jiang, Man Tang", "source": "arXiv", "published": "2026-11-11T02:25:11Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme*"]}, {"key": "arxiv:2610.34510", "title": "Magnetic Topological Evolution and the Predictive Role of Winding-flux-based Masked PILs in Extreme Solar Flares from AR13664 and AR13842", "summary": "Using vector magnetogram data from the Helioseismic Magnetic Imager (HMI) on board the Solar Dynamics Observatory (SDO), we present detailed case studies of precursor activity in Active Regions (ARs) 13664 and 13842, which produced several intense flares. We examined the spatiotemporal evolution of key magnetic topological parameters, including winding, helicity, winding-flux-based masked polarity inversion lines (PILs), and PIL gradients, from the precursor to the post-flare phases. The temporal evolution of the winding flux showed a significant enhancement during the precursor phase, and this trend was consistent across the seven X-class and five M-class flares (>= M5.0). The spatial distribution of both raw and Gaussian-smoothed winding-flux enhancement is co-located with flare footpoint regions of highly twisted core fields, as indicated by the photospheric magnetic topology. The winding-flux-based masked PILs that persisted around the flare locations showed a significant increase in strength and area during the precursor activity. These masked PILs spatially coincide with regions likely hosting non-potential core magnetic fields associated with the observed flares. Furthermore, the gradient of strong PILs extracted from the ARs was positively correlated with flare-associated locations and typically increased several hours (approx. 3-5 h) before flare onset. By imposing a gradient threshold on strong PILs, we isolate magnetic regions repeatedly associated with flare initiation, providing useful constraints in regimes where current flare-forecasting models remain uncerta", "link": "https://arxiv.org/abs/2610.34510", "authors": "Prithish Halder, Sudheer K. Mishra, Abhishekh K. Srivastava, Ayumi Asai, Peter A. Dowben", "source": "arXiv", "published": "2026-10-25T19:10:37Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme*"]}, {"key": "arxiv:2608.22163", "title": "Basin-Scale Modeling of Multiple Storage Projects in the Broom Creek Formation, North Dakota, USA: Unified Model and Uncertainty Quantification", "summary": "Quantifying the interactions between neighboring projects will be essential as carbon storage operations expand in scale. However, many existing basin-scale studies are deterministic or rely on hypothetical scenarios. In addition, simulations that do not fully account for neighboring projects may suffice for initial permitting. In this study, we develop a unified basin-scale model for the Broom Creek Formation in North Dakota. The model includes a total of five (existing and planned) projects, involving 18~injection wells with a maximum potential injection rate of 30~MTPA. The unified model, constructed by integrating publicly available geological and project data, contains $44\\times10^6$ cells and requires over two days to run. To enable faster simulations, we present a multilevel treatment that combines four-level nested local grid refinement, constructed through the solution of a constraint-satisfaction problem, with optimized power averaging for permeability in coarse regions. After demonstrating the accuracy of the coarse model, we use it to assess uncertainty in key quantities of interest (QoIs), including total CO$_2$ injected and plume area after 50~years, across a wide range of geological realizations and model parameters. In addition, we develop a deep learning surrogate model, which is used in global sensitivity analyses to identify dominant contributors to QoI variance. Comparisons between the unified model and standalone project simulations are presented to quantify inter-project interference. This can be substantial in some cases, e.g., for one project, the me", "link": "https://arxiv.org/abs/2608.22163", "authors": "Keisuke Yamamura, Louis J. Durlofsky", "source": "arXiv", "published": "2026-08-23T01:28:50Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": ["uncertainty"]}, {"key": "arxiv:2608.16317", "title": "Coupled Transient Processes Govern Intraplate Earthquake Swarm Evolution: Insights from the 2019-2020 Palghar Sequence", "summary": "Earthquake swarms provide a natural window into fault response to transient perturbations, yet their driving processes are commonly interpreted using fluid-driven and aseismic-slip-driven end-member models. Intraplate swarms offer a unique setting to test these models because low secular tectonic loading heightens the sensitivity of faults to transient, non-tectonic forcing. We use a machine-learning-enhanced catalog of $\\sim$50,000 earthquakes from the 2019--2020 Palghar earthquake swarm in western India to test this end-member framework. High-resolution relocations, together with moment tensor solutions, reveal two shallow normal faults in a granitic basement, with seismicity sequentially migrating from the western to the eastern fault before expanding into the intervening damage zone. Although the swarm exhibits an overall diffusion-like expansion, the relocated seismicity reveals a persistent $\\sim$5-km-deep localized seismicity band and repeated migration fronts sometimes propagating faster than expected from fluid diffusion alone. The velocity--duration scalings of these intermittent episodes span both fluid- and slow-slip-driven regimes. Sequential fault activation and contrasting migration styles throughout the swarm duration reveal dynamics that cannot be explained by either end-member mechanism alone. Instead, the Palghar swarm evolved through coupled fluid-assisted deformation and transient stress transfer within an interacting fault network, with migration episodes consistent with aseismic deformation. These observations reveal that high-resolution catalogs can ", "link": "https://arxiv.org/abs/2608.16317", "authors": "Ratna Bhagat, Pathikrit Bhattacharya, K. M. Sreejith, Harsha S. Bhat, Vineet K. Gahalaut", "source": "arXiv", "published": "2026-08-17T09:24:21Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": ["india*"]}, {"key": "arxiv:2607.20989", "title": "Latent Variable-Mediated Cross-Learning for Few-Shot Acoustic Impedance Imaging", "summary": "Acoustic impedance imaging is a fundamental yet severely ill-posed problem in subsurface analysis: the seismic wavelet is unknown, observations are band-limited, and labeled well-log samples are extremely scarce (typically <1% of all traces). Existing semi-supervised deep learning methods mitigate few-shot problem by incorporating forward modeling, yet they either rely on inaccurate prior wavelet assumptions or introduce auxiliary networks, leading to unstable optimization and degraded performance. We propose RD-SCL, a novel framework that integrates regularized deconvolution with semi-supervised cross-learning. At its core lies a differentiable, closed-form first-order Tikhonov deconvolution operator that dynamically estimates the latent wavelet in the frequency domain during training, providing stable physics-guided feedback without explicit auxiliary networks and fixed wavelet priors. Building on this operator, we design a symmetric cross-learning that enforces consistency between predictions on labeled and unlabeled data, thereby effectively exploiting abundant unlabeled traces. Extensive experiments on the SEAM and Marmousi 2 benchmarks demonstrate that RD-SCL consistently outperforms state-of-the-art supervised and semi-supervised methods, achieving substantial gains with lower computational cost. With only 56.5k learnable parameters and competitive runtime, RD-SCL offers a practical, physically consistent, and efficient solution for acoustic impedance imaging.", "link": "https://arxiv.org/abs/2607.20989", "authors": "Junheng Peng, Yong Li, Mingwei Wang, Yi Bao", "source": "arXiv", "published": "2026-07-23T07:13:01Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme*"]}, {"key": "arxiv:2607.09614", "title": "Inunda: A GPU-Native, Agent-enabled, Differentiable Solver for High-Resolution Flood Inundation Modeling", "summary": "Predicting where floodwater goes and how deep it gets, at high resolution and across large domains, remains computationally expensive with conventional hydraulic solvers, while purely data-driven surrogates are fast but lack physical guarantees and generalize poorly beyond their training events. We present Inunda, a GPU-native flood inundation model that solves the two-dimensional shallow water equations. Inunda uses a mass-conservative local-inertial scheme and runs multi-day events over millions of cells in minutes on a single GPU. Because every operator is autograd-compatible, the solver is differentiable by construction: model parameters can be estimated by gradient descent against gage observations through reverse-mode automatic differentiation of the full simulation. We demonstrate Inunda on three case studies. For a hindcast of Hurricane Harvey (2017) in Harris County, Texas, Inunda matches surveyed high-water marks to a mean absolute error of 0.67 m, competitive with or better than a suite of established flood models, and reaches a median gage water-level Nash Sutcliffe efficiency of +0.72, more than double the +0.31 of the operational National Water Model v3.0. For the July 2025 Central Texas flash flood, Inunda is driven by an 18-member 1-km convection-allowing precipitation ensemble to produce probabilistic flood forecasts whose skill improves systematically as lead time to the crest shortens. For a post-fire flash-flood application in the Rio Ruidoso burn scar, differentiable calibration recovers the saturated hydraulic conductivity as a spatially explicit field", "link": "https://arxiv.org/abs/2607.09614", "authors": "Zhi Li", "source": "arXiv", "published": "2026-07-10T17:13:19Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation"]}, {"key": "arxiv:2606.17069", "title": "Implicit Neural Representations Framework for One-Dimensional Magnetotelluric Inversion", "summary": "Magnetotelluric (MT) inversion is a very useful technique to image the subsurface electrical resistivity structures. It is used for mineral exploration, geothermal studies, groundwater assessment, and lithospheric investigations. In this work, we proposed a physics-informed machine learning framework for 1D MT inversion based on implicit neural representations (INR). Our approach models the subsurface resistivity as a continuous function of depth using a coordinate-based neural network. This method does not require fixed discretization or layered models. The neural network is trained directly on a differentiable MT forward-model loss based on Wait's recursive impedance formulation. This setup allows inversion to occur in a physics-consistent optimization framework. The implicit regularization avoids the need for manual tuning of external regularization. We have tested this method on synthetic conductor models and real MT data. The results showed its ability to recover geologically relevant resistivity structures over various depths and thicknesses. Through different initializations, we can compute an ensemble of plausible models to estimate model uncertainty. These results suggest that implicit neural representations provide a flexible framework for geophysical inversion, with even greater potential in higher-dimensional MT problems and joint inversion applications.", "link": "https://arxiv.org/abs/2606.17069", "authors": "Fareeda Begum Shaik, Roshan K. Singh, Pankaj K Mishra", "source": "arXiv", "published": "2026-06-05T15:59:11Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": ["uncertainty"]}, {"key": "arxiv:2606.07165", "title": "Implicit Structural Modeling via Generative Diffusion Frameworks", "summary": "Implicit structural modeling can support understanding subsurface spatial configurations, revealing patterns of geological evolution, and enabling quantitative simulation of geological processes, thereby offering substantial scientific and engineering value. Conventional approaches formulate it as an optimization problem or framework interpolation to fit a continuous scalar field, whereas machine learning methods typically adopt discriminative regression to directly predict implicit models. However, in complex scenarios involving fault intersections, branching, and thrust nappes, these methods still struggle to maintain topological consistency and kinematic plausibility. In this work, we develop an implicit structural modeling approach based on diffusion models. We construct a set of training data through a simulation based synthesis pipeline and design a dedicated encoder for conditional injection, allowing the conditional branch to converge rapidly while effectively reinforcing the input conditional priors throughout the diffusion process, thereby more stably propagating structural constraints. We then inject these conditional features into a backbone network pretrained on large scale natural images to enable conditional training of the diffusion model. Although our synthetic data include only a relatively stylized normal fault system, experiments demonstrate strong generalization, enabling the model to effectively handle diverse complex structural types such as strike slip faults and intricate flower fault systems. More importantly, even in challenging thrust nappe setti", "link": "https://arxiv.org/abs/2606.07165", "authors": "Yimin Dou, Xinming Wu, Zhixiang Guo, Hui Gao, Buyu Deng", "source": "arXiv", "published": "2026-06-05T11:35:15Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": ["diffusion model*"]}, {"key": "arxiv:2606.03572", "title": "GeoVolDiff: Taming 3D Geological Volumes with Latent Diffusion", "summary": "Deep learning has become a prevailing paradigm across a wide range of geophysical applications. Yet most existing studies concentrate on methodological refinements -- novel network architectures, physics-informed constraints, or taskspecific loss functions -- while paying comparatively little attention to a more fundamental challenge of any data-driven approach: the availability and representativeness of high-quality training data. This limitation is especially pronounced in geophysics. Unlike computer vision, which benefits from large-scale, well-curated benchmarks such as ImageNet, comparably abundant and reliably labelled geophysical data are prohibitively expensive to acquire and, in most field settings, lack accessible ground-truth supervision. To alleviate this data deficiency, we propose GeoVolDiff, a generative framework for three-dimensional geological volumes. It comprises three coupled stages: (i) constructing a foundational training corpus through physics-based forward simulation; (ii) training a Latent Diffusion Model (LDM) to capture the statistical distribution of 3D geological structures; and (iii) synthesizing diverse, structurally plausible volumes at scale for downstream geophysical tasks. We examine the utility of the synthesized data on a representative downstream task, seismic impedance inversion. Without incorporating any additional physical or geological prior, inversion networks pre-trained exclusively on synthesized data attain competitive performance on both synthetic and field datasets, indicating that data synthesised by the generative model can", "link": "https://arxiv.org/abs/2606.03572", "authors": "Qi Pang, Hongling Chen, Jinghuai Gao", "source": "arXiv", "published": "2026-06-02T12:40:06Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": ["diffusion model*"]}, {"key": "arxiv:2605.22836", "title": "Real-Time Earthquake Magnitude Classification from Initial P-Waves: Models, Dataset, and Comparative Analysis for South Asia", "summary": "Rapid earthquake magnitude estimation is crucial for effective early warning systems that can save lives and reduce economic damage. In this paper, we present a comprehensive study of magnitude classification using only the vertical component of the initial 7-second P-wave window from a single station. We compare six machine learning approaches that range from traditional models to state-of-the-art deep learning architectures. We also curated a novel dataset of 7,318 earthquake events in South Asia. The dataset was categorized into five Richter-scale classes: slight (3.0-3.9), light (4.0-4.9), moderate (5.0-5.9), strong (6.0-6.9) and severe (>= 7.0). Our experiments show that deep learning models substantially outperform traditional approaches. Our Transformer based architecture achieved 76.23% standard accuracy and 81.56% adaptive accuracy with 4.8 ms inference latency. The adaptive-accuracy metric is introduced for the inherent uncertainty in magnitude estimation of near class boundaries. These results indicate that the attention mechanisms in Transformers combined with adaptive classification effectively capture the temporal dynamics of seismic signals. The architectural advantage facilitates promising generalization to rare high-magnitude events, despite the inherent data scarcity characteristic of seismic catalogs. The adaptive accuracy provides a more realistic assessment of model performance, and the result suggests viability for real-time deployment.", "link": "https://arxiv.org/abs/2605.22836", "authors": "Md Nasiat Hasan Fahim, Md. Abid Ullah Muhib, Rayhanul Amin Tanvir, Abdullah Al Noman", "source": "arXiv", "published": "2026-05-10T16:25:05Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": ["uncertainty"]}, {"key": "arxiv:2605.06255", "title": "Synthetic Well Log Generation with Preserved Multivariate Correlations and Vertical Facies Stacking Patterns", "summary": "We present a novel procedure for generating synthetic well logs that simultaneously preserves multivariate correlations among petrophysical properties (Density, P-Sonic, S-Sonic) and vertical stacking patterns of electrofacies. The methodology integrates Markov chain models, autoencoder-based dimensionality reduction, and Markov chain Monte Carlo (MCMC) sampling in latent space. Application to a real turbidite reservoir dataset demonstrates that the framework successfully sustains fundamental rock physics relationships and generates geologically realistic vertical heterogeneity consistent with actual well log measurements. This technique addresses critical data scarcity in machine learning applications for seismic interpretation while enabling credible synthetic seismogram generation for scenario testing and uncertainty quantification in petroleum exploration and field development.", "link": "https://arxiv.org/abs/2605.06255", "authors": "Josue Fonseca, Marcus Saraiva", "source": "arXiv", "published": "2026-05-07T13:32:20Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": ["uncertainty"]}, {"key": "arxiv:2604.27102", "title": "Anomaly Detection in Soil Heavy Metal Contamination Using Unsupervised Learning for Environmental Risk Assessment", "summary": "Soil contamination by heavy metals poses a persistent environmental and public health concern in rapidly urbanising regions of Ghana, particularly at unregulated waste disposal sites. This study applies an unsupervised machine learning framework to detect and characterise anomalous heavy metal contamination patterns in soils from twelve waste sites and residential controls in the Central Region, of Ghana. Concentrations of eight metals (As, Cd, Cr, Cu, Hg, Ni, Pb, Zn) were analysed alongside standard health risk indices, including the Hazard Index (HI) and Incremental Lifetime Cancer Risk (ILCR). Isolation Forest and PCA reconstruction error each identified $12$ anomalous samples ($15.4\\%$ of $78$ samples), while DBSCAN detected no density-isolated noise points. A consensus approach isolated six robust anomalies ($7.7\\%)$, all spatially concentrated at a single site (S3). Anomalies exhibited approximately $70$--$80\\%$ higher mean HI values than normal samples, with all consensus anomalies exceeding the HI$=1$ threshold. PCA reconstruction error showed a strong positive association with HI ($r \\approx 0.8$), indicating consistency between multivariate deviation and health risk. Three distinct anomaly types were identified: extreme Cu enrichment at S3, anomalously low Ni at S4/S5, and moderate multi-metal (Pb--Zn) co-elevation at S9--S12. The results demonstrate that unsupervised machine learning provides granular, objective insight beyond aggregate indices, enabling targeted site prioritisation and risk-informed environmental management.", "link": "https://arxiv.org/abs/2604.27102", "authors": "Isaac Tettey Adjokatse, Samuel Senyo Koranteng, George Yamoah Afrifa, Theophilus Ansah-Narh, Marcellin Atemkeng, Joseph Bremang Tandoh", "source": "arXiv", "published": "2026-04-29T18:47:19Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme*"]}, {"key": "arxiv:2603.18925", "title": "Improving moment tensor solutions under Earth structure uncertainty with simulation-based inference", "summary": "Bayesian inference represents a principled way to incorporate Earth structure uncertainty in full-waveform moment tensor inversions, but traditional approaches generally require significant approximations that risk biasing the resulting solutions. We introduce a robust method for handling theory errors using simulation-based inference (SBI), a machine learning approach that empirically models their impact on the observations. This framework retains the rigour of Bayesian inference while avoiding restrictive assumptions about the functional form of the uncertainties. We begin by demonstrating that the common Gaussian parametrisation of theory errors breaks down under minor ($1-3 \\%$) 1-D Earth model uncertainty. To address this issue, we develop two formalisms for utilising SBI to improve the quality of the moment tensor solutions: one using physics-based insights into the theory errors, and another utilising an end-to-end deep learning algorithm. We then compare the results of moment tensor inversion with the standard Gaussian approach and SBI, and demonstrate that Gaussian assumptions induce bias and significantly under-report moment tensor uncertainties. We also show that these effects are particularly problematic when inverting short period data and for shallow, isotropic events. On the other hand, SBI produces more reliable, better calibrated posteriors of the earthquake source mechanism. Finally, we successfully apply our methodology to two well studied moderate magnitude earthquakes: one from the 1997 Long Valley Caldera volcanic earthquake sequence, and the 2020 Zagr", "link": "https://arxiv.org/abs/2603.18925", "authors": "A. A. Saoulis, T. -S. Pham, A. M. G. Ferreira", "source": "arXiv", "published": "2026-03-19T14:04:17Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": ["uncertainty"]}, {"key": "arxiv:2603.13973", "title": "Learning relaxation time distributions from spectral induced polarization data with a complex-valued variational autoencoder", "summary": "Spectral induced polarization (SIP) is a geophysical method used to characterize subsurface materials. It measures the frequency-dependent complex electrical resistivity of rocks and soils through the application of an alternating current. Debye and Warburg decompositions are standard methods for analyzing and interpreting SIP data, as they allow estimation of the relaxation time distribution (RTD) of geomaterials. However, conventional decomposition approaches treat measurements independently, work in real-valued spaces despite the complex-valued nature of SIP data, and provide limited uncertainty quantification. These limitations reduce the effectiveness of conventional decomposition on heterogeneous datasets. We reformulate the decomposition approach as an unsupervised machine learning problem and introduce a conditional variational autoencoder (CVAE) that learns a shared mapping from SIP datasets to continuous RTDs. The model is validated on a dataset comprising 140 laboratory and field SIP measurements of granular mixtures, sedimentary and igneous rock, and cementitious materials. The CVAE operates in complex-valued data space and achieves reconstruction errors of 0.53 % and 0.27 % for the imaginary and phase components of resistivity, respectively, with evidence of improvement over conventional methods at corresponding p-values of 0.007 and 0.06. The inferred RTDs are stable and physically consistent, and their total chargeability and mean relaxation time correlate with polarizable grain content and grain size, respectively, with coefficients of determination up to 0.", "link": "https://arxiv.org/abs/2603.13973", "authors": "Charles L. Bérubé, Sébastien Gagnon, Lahiru M. A. Nagasingha, Jean-Luc Gagnon, E. Rachel Kenko, Reza Ghanati", "source": "arXiv", "published": "2026-03-14T14:57:38Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 3, "topics": ["Deep Learning"], "watch": [], "boosts": ["uncertainty"]}, {"key": "arxiv:2602.0
