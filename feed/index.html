recipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1109/isctis70043.2026.11572552", "title": "A Convolutional Neural Network-Based Statistical Downscaling Study of ERA5 Air Temperature at the Station Scale", "summary": "To evaluate the performance of Convolutional Neural Networks (CNN) in the station-scale application of reanalysis data, this study conducts a statistical downscaling investigation of ERA5 temperature data, using Macau as a case study. A spatiotemporally matched dataset was constructed using hourly ERA5 reanalysis data and surface observation station records from 2012 to 2022. A lightweight CNN model was developed, employing the grid fields surrounding the stations as inputs and the measured station temperatures as outputs. To investigate the influence of spatial feature extraction ranges on model performance, the downscaling effects were comparatively analyzed across four input window sizes (11 × 11, 21 × 21, 31 × 31, and 41 × 41). Simultaneously, nearest neighbor interpolation, bilinear interpolation, and cubic spline interpolation were introduced as baseline methods. Multi-dimensional evaluations were performed using Mean Squared Error (MSE), Root Mean Square Error (RMSE), Mean Absolute Error (MAE), and Correlation Coefficient (CC). The experimental results demonstrate that the CNN model effectively captures spatial correlations between grid points, with accuracy significantly surpassing that of traditional interpolation methods. Furthermore, the model performance varied with the size of the input window, confirming the critical importance of the spatial domain extent for local temperature estimation. This study indicates that the lightweight CNN provides an efficient and feasible solution for the station-scale downscaling of ERA5 data, serving as a reference for the refi", "link": "https://doi.org/10.1109/isctis70043.2026.11572552", "authors": "Huixian Wu, Hoiio Kong, Chanseng Wong", "source": "2026 6th International Symposium on Computer Technology and Information Science (ISCTIS)", "published": "2026-05-15", "first_seen": "2026-11-23T21:44:54+00:00", "score": 85, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "doi:10.3390/hydrology13110307", "title": "Evaluating the Long-Term Robustness of Hybrid Deep Learning Models for Streamflow Projections Under Climate Change", "summary": "Data-driven models can help represent hydrological processes at the basin scale and predict future conditions, particularly in basins where information on physical characteristics is limited. Although these models have long been used in hydrological modeling, their reliability for long-term projections under changing climatic conditions remains insufficiently understood. This study evaluates the long-term robustness and projection consistency of data-driven algorithms under climate-change conditions using two hybrid deep learning architectures: (1) a Wavelet Transform–Deep Neural Network (WT–DNN) and (2) a Convolutional Neural Network–Long Short-Term Memory–Attention Block (CNN–LSTM–AB). It also investigates whether synthetic data augmentation using a Generative Adversarial Network (GAN) during model training improves predictive performance. The study used hydrological and climatic data, including streamflow, precipitation, minimum temperature, and maximum temperature, from the Yamula Reservoir Basin, a semi-arid agricultural basin in Türkiye. The models were trained and validated for monthly streamflow using climate data from the HadGEM2–ES global circulation model for the 2000–2020 period. Long-term streamflow projections for 2021–2098 were then generated under the RCP4.5 and RCP8.5 scenarios. Model performance and robustness were assessed through sensitivity analysis, comparison of models trained with and without GAN-based data augmentation, comparison with long short-term memory (LSTM) and other recently proposed hybrid deep learning architectures, and evaluation of lon", "link": "https://doi.org/10.3390/hydrology13110307", "authors": "Arshya Razavi Nematollahi, Mete Çelik, Filiz Dadaser-celik", "source": "Hydrology", "published": "2026-11-17", "first_seen": "2026-11-23T21:44:54+00:00", "score": 84, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "s2:bcaf88659ca33302e6d9723f1b1fc5efd8269df4", "title": "Comprehensive evaluation on the robustness of deep learning based rainfall-runoff models under climate change scenarios", "summary": "", "link": "https://www.semanticscholar.org/paper/bcaf88659ca33302e6d9723f1b1fc5efd8269df4", "authors": "Aldo A. Tapia, A. Bennett", "source": "Semantic Scholar", "published": "", "first_seen": "2026-11-23T21:44:54+00:00", "score": 84, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1016/j.aiig.2026.100226", "title": "Deep learning–based downscaling of ERA5-Land temperature to 250 m resolution over the Trentino–South Tyrol Alpine region", "summary": "", "link": "https://doi.org/10.1016/j.aiig.2026.100226", "authors": "Ihcene Djouama, Nabil Kadache, Rachid Seghir", "source": "Artificial Intelligence in Geosciences", "published": "2026-05-01", "first_seen": "2026-11-23T21:44:54+00:00", "score": 84, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "doi:10.1108/ijccsm-09-2025-0332", "title": "Unlocking wind energy potential in data-scarce regions: a deep learning framework for strategic climate action in Vietnam’s Central Highlands", "summary": "As Vietnam accelerates its transition toward a sustainable energy future under ambitious national strategies like the Power Development Plan VIII (PDP8), a critical barrier persists: the lack of high-fidelity resource maps for strategic planning. This is particularly acute in data-scarce regions with high potential, such as Vietnam’s Central Highlands. This study aims to address this strategic gap by developing and validating a robust deep learning framework to produce an enhanced and detailed high-resolution wind energy map for this region, providing a conservative proof-of-concept for regional energy planning. The framework integrates coarse-resolution daily wind speed data from an ensemble of 11 global climate models with long-term observational records (1985–2023) from a sparse network of meteorological stations. To preserve synoptic extremes critical for wind power, the downscaling was conducted at a daily temporal resolution. A suite of advanced machine learning and deep learning models were systematically trained. To address the limitations of spatial interpolation in complex terrain, the downscaled 10 m wind speeds were extrapolated to a 149 m commercial hub-height using a terrain-aware power law, integrating high-resolution surface roughness data. A technical potential map (GWh/km²/year) was then generated by combining the turbine power curve (Enercon E-101) with a GIS-based availability index (AI), factoring in constraints such as elevation, slope, land cover and urban buffers. Deep learning architectures, particularly the convolutional neural network and XGBoost,", "link": "https://doi.org/10.1108/ijccsm-09-2025-0332", "authors": "Do Quang Linh, Dung Duc Tran, A. Dang", "source": "International Journal of Climate Change Strategies and Management", "published": "2026-10-12", "first_seen": "2026-11-23T21:44:54+00:00", "score": 84, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "arxiv:2512.13753", "title": "Time‐Aware UNet and Super‐Resolution Deep Residual Networks for Spatial Downscaling", "summary": "Satellite observations of atmospheric pollutants are often available only at coarse spatial resolution, which limits their use in local‐scale environmental analysis. Spatial downscaling methods aim to transform such data into high‐resolution fields. In this work, two widely used deep learning architectures—the super‐resolution deep residual network (SRDRN) and the encoder–decoder‐based UNet—for spatial downscaling, are extended with a lightweight temporal module that encodes observation time using either sinusoidal or radial basis function representations and integrates temporal features with spatial information. The proposed time‐aware extensions are evaluated in a case study on ozone downscaling over Italy. Results show that, with only a minor increase in computational cost, incorporating temporal information significantly improves downscaling accuracy and accelerates model convergence.", "link": "https://arxiv.org/abs/2512.13753", "authors": "Mika Sipilä, S. Maggio, S. De Iaco, K.   $('topics').innerHTML = D.topics.map(t => `<button class="chip" data-t="${esc(t)}" aria-pressed="${F.topic==t}">${esc(t)} <small>${tc(t)}</small></button>`).join('');
  $('people').innerHTML = D.people.length ? D.people.map(p => {
    const n = items.filter(i => P(i) && (i.watch||[]).includes(p.name)).length;
    return `<button data-p="${esc(p.name)}" aria-pressed="${F.person==p.name}"><span><span class="pn">${esc(p.name)}</span><br><span class="pw">${esc(p.where)}</span></span><span class="pc ${n?'on':''}">${n}</span></button>`;
  }).join('') : '<p class="pw">Add names under watch_people in config.yml.</p>';
}
$('views').onclick = e => { const b=e.target.closest('button'); if(b){ F.view=b.dataset.v; render(); } };
$('topics').onclick = e => { const b=e.target.closest('button'); if(b){ F.topic = F.topic==b.dataset.t ? null : b.dataset.t; render(); } };
$('people').onclick = e => { const b=e.target.closest('button'); if(b){ F.person = F.person==b.dataset.p ? null : b.dataset.p; if(F.person) F.view='all'; render(); } };

function dayLabel(d){
  const a = new Date(d); a.setHours(0,0,0,0); const t = new Date(); t.setHours(0,0,0,0);
  const diff = Math.round((t - a) / 864e5);
  return diff===0 ? 'Today' : diff===1 ? 'Yesterday' : a.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
}
function authorsHtml(it){
  let s = esc(it.authors);
  (it.watch||[]).forEach(n => { s = s.replace(new RegExp(esc(n).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'), m => `<mark>${m}</mark>`); });
  return s;
}
function card(it, i){
  const bars = Math.max(1, Math.min(5, Math.ceil((it.score||0) / 20)));
  const isJob = it.kind === 'job';
  const id = it.key.replace(/^(arxiv|doi):/,'');
  const links = [];
  if (isJob) links.length = 0;
  else if (it.isArxiv){ links.push(`<a href="https://arxiv.org/pdf/${esc(id)}">PDF</a>`, `<a href="https://www.alphaxiv.org/abs/${esc(id)}">Discuss on alphaXiv</a>`); }
  if (!isJob) links.push(`<a href="https://www.semanticscholar.org/search?q=${encodeURIComponent(it.title)}">Semantic Scholar</a>`);
  const badge = it.kind==='rec' ? '<span class="kind">Recommended</span>' : it.kind==='cite' ? '<span class="kind">Cites you</span>' : isJob ? '<span class="kind">Job ad</span>' : '';
  const why = it.kind==='cite' && it.cites && it.cites[0] ? `<div class="why">Cites your paper <em>${esc(it.cites[0])}</em></div>`
            : it.why && !isJob ? `<div class="why">Close to ${esc(it.why.src)}: <em>${esc(it.why.title)}</em></div>` : '';
  return `<li class="p${S.done[it.key]?' done':''}${openSet.has(it.key)?' open':''}" data-i="${i}">
    <div class="rel" title="Relevance ${it.score} of 100">${[1,2,3,4,5].map(n=>`<i class="${n<=bars?'on':''}"></i>`).join('')}</div>
    <div>
      <a class="t" href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title)}</a>
      <div class="m">${badge}<span>${esc(it.source)}${it.kind!=='paper'&&it.published?', '+esc(String(it.published).slice(0,10)):''}</span>${isNew(it)?'<span class="w">New</span>':''}${(it.watch||[]).length?'<span class="w">Watched author</span>':''}${it.topics.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${(it.boosts||[]).length?`<span>also: ${esc(it.boosts.map(b=>b.replace('*','')).join(', '))}</span>`:''}</div>
      ${it.authors?`<div class="au">${authorsHtml(it)}</div>`:''}
      ${why}
      ${it.summary?`<p class="ab">${esc(it.summary)}</p>`:''}
      <div class="act">
        ${it.summary?'<button data-a="ab">Abstract</button>':''}
        <button class="st" data-a="star" aria-pressed="${!!S.star[it.key]}">${S.star[it.key]?'Starred':'Star'}</button>
        <button data-a="done">${S.done[it.key]?'Mark unread':'Mark read'}</button>
        <button data-a="no">${S.no[it.key]?'Undo not for me':'Not for me'}</button>
        ${isJob?'':'<button data-a="cite">Copy BibTeX</button>'}
        ${links.join('')}
      </div>
    </div></li>`;
}

function render(){
  sidebar();
  ['win','sort'].forEach(id => [...$(id).children].forEach(b => b.setAttribute('aria-pressed', String(F[id]) === b.dataset.v)));
  const fn = VIEWS.find(v => v[0]==F.view)[2];
  shown = items.filter(it => base(it) && fn(it));
  shown.sort(F.sort==='rel' ? (a,b) => b.score - a.score || b.seen - a.seen : (a,b) => b.seen - a.seen || b.score - a.score);
  $('count').textContent = shown.length + (shown.length===1?' paper':' papers');
  if (!shown.length){
    const msg = F.view==='inbox' ? 'You are through today\'s picks. Open All papers for the rest, or come back tomorrow.' :
                F.view==='cite' ? 'No new citations found yet. They appear here as soon as Semantic Scholar lists them.' :
                F.view==='job' ? 'No matching postdoc ads right now. Add Google Alerts or job-site feeds under jobs in config.yml.' :
                F.view==='star' ? 'No starred papers yet. Star a paper to keep it here and export it to Zotero.' :
                'No papers match these filters. Clear the search or pick another topic.';
    $('list').innerHTML = `<p class="empty">${msg}</p>`; cur=-1; return;
  }
  let html = '', lastDay = '';
  shown.forEach((it,i) => {
    if (F.sort==='new'){ const d = dayLabel(it.seen); if (d!==lastDay){ if(lastDay) html+='</ol>'; html += `<h3 class="day">${d}</h3><ol>`; lastDay=d; } }
    else if (i===0) html += '<ol>';
    html += card(it,i);
  });
  $('list').innerHTML = html + '</ol>';
  if (cur >= shown.length) cur = shown.length - 1;
  mark();
}

function bib(it){
  const first = (it.authors.split(',')[0]||'anon').trim().split(' ').pop().replace(/[^A-Za-z]/g,'');
  const year = (it.published||it.first_seen).slice(0,4);
  const word = (it.title.match(/[A-Za-z]{4,}/)||['paper'])[0].toLowerCase();
  const id = it.key.replace(/^(arxiv|doi):/,'');
  const au = it.authors.split(',').map(s=>s.trim()).filter(Boolean).join(' and ');
  return it.isArxiv
    ? `@misc{${first}${year}${word},\n  title = {${it.title}},\n  author = {${au}},\n  year = {${year}},\n  eprint = {${id}},\n  archivePrefix = {arXiv},\n  url = {${it.link}}\n}`
    : `@article{${first}${year}${word},\n  title = {${it.title}},\n  author = {${au}},\n  journal = {${it.source}},\n  year = {${year}},\n  doi = {${id}}\n}`;
}
function copy(t, msg){ (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(()=>toast(msg), ()=>prompt('Copy:', t)); }
function download(name, text){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'})); a.download=name; a.click(); URL.revokeObjectURL(a.href); }

function act(it, a, li){
  if (a==='ab'){ openSet.has(it.key) ? openSet.delete(it.key) : openSet.add(it.key); li.classList.toggle('open'); return; }
  if (a==='star'){ S.star[it.key] ? delete S.star[it.key] : (S.star[it.key] = Object.assign({}, it, {hay:undefined, seen:undefined})); save(); toast(S.star[it.key]?'Starred':'Star removed'); }
  if (a==='no'){ S.no[it.key] ? delete S.no[it.key] : (S.no[it.key] = {title: it.title, summary: (it.summary||'').slice(0,600)}); save(); toast(S.no[it.key]?'Noted. Export likes.json to teach the ranker':'Undone'); }
  if (a==='done'){ S.done[it.key] ? delete S.done[it.key] : (S.done[it.key]=1); save(); }
  if (a==='cite'){ copy(bib(it), 'BibTeX copied'); return; }
  const keep = cur; render(); cur = Math.min(keep, shown.length-1); mark();
}
$('list').onclick = e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const li = b.closest('li.p'); cur = +li.dataset.i; act(shown[cur], b.dataset.a, li);
};
function mark(){
  document.querySelectorAll('li.p.cur').forEach(l => l.classList.remove('cur'));
  const li = document.querySelector(`li.p[data-i="${cur}"]`);
  if (li){ li.classList.add('cur'); const r=li.getBoundingClientRect(); if (r.top<0 || r.bottom>innerHeight) li.scrollIntoView({block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); }
}
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea') || e.metaKey || e.ctrlKey || e.altKey){ if (e.key==='Escape') e.target.blur(); return; }
  if (e.key==='/'){ e.preventDefault(); $('q').focus(); return; }
  if (e.key==='j'){ cur = Math.min(cur+1, shown.length-1); mark(); }
  else if (e.key==='k'){ cur = Math.max(cur-1, 0); mark(); }
  else if (cur>=0 && shown[cur]){
    const li = document.querySelector(`li.p[data-i="${cur}"]`);
    if (e.key==='a') act(shown[cur],'ab',li);
    else if (e.key==='s') act(shown[cur],'star',li);
    else if (e.key==='x') act(shown[cur],'done',li);
    else if (e.key==='n') act(shown[cur],'no',li);
    else if (e.key==='o') window.open(shown[cur].link,'_blank','noopener');
  }
});

const starred = () => Object.values(S.star);
$('bib').onclick = () => { const s=starred(); if(!s.length) return toast('Star some papers first'); download('starred-papers.bib', s.map(bib).join('\n\n')); };
$('md').onclick = () => { const s=starred(); if(!s.length) return toast('Star some papers first');
  copy(s.map(it => `- ${it.title} (${(it.authors.split(',')[0]||'').trim()} et al., ${it.source}, ${(it.published||it.first_seen).slice(0,4)}) ${it.link}\n  Why it matters: `).join('\n'), 'Reading notes copied'); };
$('teach').onclick = () => {
  const slim = o => Object.fromEntries(Object.entries(o).map(([k,v]) => [k, {title:v.title, summary:(v.summary||'').slice(0,800)}]));
  if (!Object.keys(S.star).length && !Object.keys(S.no).length) return toast('Star or mark some papers first');
  download('likes.json', JSON.stringify({star: slim(S.star), no: slim(S.no)}, null, 1));
  toast('Upload likes.json into the feed folder on GitHub');
};
$('backup').onclick = () => download('reading-desk-backup.json', JSON.stringify(S));
$('restore').onclick = () => { const f=document.createElement('input'); f.type='file'; f.accept='.json';
  f.onchange = () => f.files[0].text().then(t => { try { const o=JSON.parse(t); Object.assign(S.star, o.star||{}); Object.assign(S.done, o.done||{}); save(); render(); toast('Restored'); } catch(e){ toast('That file is not a reading desk backup'); } });
  f.click(); };

render();
})();
</script>
</body>
</html>
