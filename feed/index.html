lable every 10 min. The results show that the threat score for hourly precipitation is generally improved in the forecasts updated by URDA relative to the pre-existing baseline forecasts, through the ensemble-based error covariance. Furthermore, for sea level pressure, temperature, relative humidity, and winds, the root mean square error of the URDA-updated forecasts is reduced relative to that of the baseline forecasts as the forecasts are successively updated by assimilating additional observations. These results indicate the potential of URDA to operate effectively with a realistic NWP model.", "link": "https://arxiv.org/abs/2609.12274", "authors": "Fumitoshi Kawasaki, Kenta Kurosawa, Atsushi Okazaki, Shunji Kotsuki", "source": "arXiv", "published": "2026-09-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 59, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2511.22610", "title": "Super-resolution of satellite-derived SST data via Generative Adversarial Networks", "summary": "In this work, we address the super-resolution problem of satellite-derived sea surface temperature (SST) using deep generative models. Although standard gap-filling techniques are effective in producing spatially complete datasets, they inherently smooth out fine-scale features that may be critical for a better understanding of the ocean dynamics. We investigate the use of deep learning models as Autoencoders (AEs) and generative models as Conditional-Generative Adversarial Networks (C-GANs), to reconstruct small-scale structures lost during interpolation. Our supervised -- model free -- training is based on SST observations of the Mediterranean Sea, with a focus on learning the conditional distribution of high-resolution fields given their low-resolution counterparts. We apply a tiling and merging strategy to deal with limited observational coverage and to ensure spatial continuity. Quantitative evaluations based on mean squared error metrics, spectral analysis, and gradient statistics show that while the AE reduces reconstruction error, it fails to recover high-frequency variability. In contrast, the C-GAN effectively restores the statistical properties of the true SST field at the cost of increasing the pointwise discrepancy with the ground truth observation. Our results highlight the potential of deep generative models to enhance the physical and statistical realism of gap-filled satellite data in oceanographic applications.", "link": "https://arxiv.org/abs/2511.22610", "authors": "Claudia Fanelli, Tiany Li, Luca Biferale, Bruno Buongiorno Nardelli, Daniele Ciani, Andrea Pisano, Michele Buzzicotti", "source": "arXiv", "published": "2025-11-27", "first_seen": "2026-11-26T13:59:01+00:00", "score": 59, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ms003899", "title": "A Variational LSTM Emulator of Sea Level Contribution From the Antarctic Ice Sheet", "summary": "The Antarctic ice sheet (AIS) will be a dominant contributor to global mean sea level rise in the 21st century but remains a major source of uncertainty. The Ice Sheet Model Intercomparison for CMIP6 (ISMIP6) is an ensemble of continental‐scale models for studying the evolution of the AIS and projecting its future contribution to sea level. Due to their complexity and computational cost, ISMIP6 simulations are sparse and generated infrequently. Emulators are smaller‐scale models that approximate ISMs and enable experimentation and exploration into the drivers of sea level change. We introduce a neural network (NN) emulator to approximate the ISMIP6 ensemble, using a variational Long Short‐Term Memory (LSTM) with Monte Carlo dropout to quantify single‐projection uncertainty. The proposed NN emulator is compared to a Gaussian Process (GP) emulator on four criteria: accuracy of point estimates and predictive distributions of individual model projections, approximation of the ensemble projections, and model training time. The NN predicts more accurately on single projections, with a mean absolute error of 0.46 mm Sea Level Equivalent (SLE) versus 0.73 mm SLE for the GP, and has more accurate uncertainty estimates. The NN emulator also better approximates the ensemble distribution of ISMIP6 model projections, with a Kullback‐Leibler divergence of 18.26 versus 199.14 for GP at the projection year 2100. The NN enables more accurate experimentation with a reduced runtime, offering a new tool for understanding the important role of regional precipitation, ice sheet drainage systems,", "link": "https://doi.org/10.1029/2023ms003899", "authors": "Peter Van Katwyk, Baylor Fox‐Kemper, Hélène Seroussi, Sophie Nowicki, Karianne J. Bergen", "source": "Journal of Advances in Modeling Earth Systems", "published": "2023-12", "first_seen": "2026-11-26T13:59:01+00:00", "score": 59, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "emulator", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021ms002521", "title": "Building Tangent‐Linear and Adjoint Models for Data Assimilation With Neural Networks", "summary": "We assess the ability of neural network emulators of physical parametrization schemes in numerical weather prediction models to aid in the construction of linearized models required by four‐dimensional variational (4D‐Var) data assimilation. Neural networks can be differentiated trivially, and so if a physical parametrization scheme can be accurately emulated by a neural network then its tangent‐linear and adjoint versions can be obtained with minimal effort, compared with the standard paradigms of manual or automatic differentiation of the model code. Here we apply this idea by emulating the non‐orographic gravity wave drag parametrization scheme in an atmospheric model with a neural network, and deriving its tangent‐linear and adjoint models. We demonstrate that these neural network‐derived tangent‐linear and adjoint models not only pass the standard consistency tests but also can be used successfully to do 4D‐Var data assimilation. This technique holds the promise of significantly easing maintenance of tangent‐linear and adjoint codes in weather forecasting centers, if accurate neural network emulators can be constructed.", "link": "https://doi.org/10.1029/2021ms002521", "authors": "Sam Hatfield, Matthew Chantry, Peter Dueben, Philippe Lopez, Alan Geer, Tim Palmer", "source": "Journal of Advances in Modeling Earth Systems", "published": "2021-9", "first_seen": "2026-11-26T13:59:01+00:00", "score": 59, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["emulator"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2017jd027992", "title": "Prospects and Caveats of Weighting Climate Models for Summer Maximum Temperature Projections Over North America", "summary": "Uncertainties in climate projections exist due to natural variability, scenario uncertainty, and model uncertainty. It has been argued that model uncertainty can be decreased by giving more weight to those models in multimodel ensembles that are more skillful and realistic for a specific process or application. In addition, some models in multimodel ensembles are not independent. We use a weighting approach proposed recently that takes into account both model performance and interdependence and apply it to investigate projections of summer maximum temperature climatology over North America in two regions of different sizes. We quantify the influence of predicting diagnostics included in the method, look at ways how to choose them, and assess the influence of the observational data set used. The trend in shortwave radiation, mean precipitation, sea surface temperature variability, and variability and trend in maximum temperature itself are the most promising constraints on projections of summer maximum temperature over North America. The influence of the observational data sets is large for summer temperature climatology, since the observational and reanalysis products used for absolute maximum temperatures disagree. Including multiple predicting diagnostics leads to more similar results for different data sets. We find that the weighted multimodel mean reduces the change in summer daily temperature maxima compared to the nonweighted mean slightly (0.05–0.45 °C) over the central United States. We show that it is essential to have reliable observations for key variables to be", "link": "https://doi.org/10.1029/2017jd027992", "authors": "Ruth Lorenz, Nadja Herger, Jan Sedláček, Veronika Eyring, Erich M. Fischer, Reto Knutti", "source": "JGR: Atmospheres", "published": "2018-5-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 59, "topics": ["Climate Modelling"], "watch": ["Veronika Eyring"], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1007/s00382-026-08060-z", "title": "Unprecedented extreme meteorological droughts simulated in Fenno-Scandinavia with high-resolution climate models", "summary": "Convection-permitting regional climate models (CPRCMs) increasingly model local climate at scales smaller than 4 km. CPRCMs provide improved simulations of precipitation by resolving convection explicitly instead of relying on parametrisation. Still, CPRCMs’ implications for drought conditions remain underexplored, especially in Europe and Fenno-Scandinavia where future changes in drought frequency and intensity are still unclear. In this study, we use data from a recent CPRCM run based on HARMONIE-Climate (HCLIM) over Fenno-Scandinavia at approximately 3 km resolution to assess changes in drought probabilities in Fenno-Scandinavia using the Standardized Precipitation Index (SPI). Therefore, we developed a more nuanced multi-threshold method, analysing the previously overlooked different intensities of droughts. We found, according to the assessed simulations, fewer future months with moderate drought. However, the number of months with exceptional and unprecedented drought levels is projected to increase, especially during the growing season. Both the CPRCM and the regional climate models (RCM) demonstrate this signal. The CPRCM is projecting more droughts compared to the RCM, especially for the most intense drought intensities. According to the data in this study, large parts of Fenno-Scandinavia are projected to be affected by droughts of unprecedented intensities by the middle and especially by the end of the 21st century. Our findings show the potential of using CPRCMs for modelling drought, as the more accurate physical representation of precipitation manifests in an ", "link": "https://doi.org/10.1007/s00382-026-08060-z", "authors": "Ruben Häberli, Ole B. Christensen, Peter Thejll, Eigil Kaas", "source": "Climate Dynamics", "published": "2026-3", "first_seen": "2026-11-26T13:59:01+00:00", "score": 59, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.70364", "title": "An observationally constrained probabilistic trigger for organized deep convection in a numerical weather prediction ensemble", "summary": "A novel stochastic parametrization scheme representing organized convection is described. The effects of mesoscale convective systems (MCSs) are represented in an observationally constrained manner, by probabilistically triggering an MCS scheme in regions of enhanced environmental total column water vapour. In combination with the probabilistic trigger, patterns with given spatio‐temporal scales determine where and when the scheme is active. Our scheme builds on the multiscale coherent structure parametrization (MCSP), which represents the top‐heavy heating structure associated with MCSs. The original and new MCSP schemes are tested in a numerical weather prediction ensemble. Both MCSP schemes improve the spatio‐temporal scales of tropical precipitation compared with a control, although both degrade the distribution of precipitation intensities. When the spread–error relationship of tropical precipitation is analysed, the new scheme successfully boosts spread compared with the original MCSP, improving the underdispersion of the ensemble seen with the original MCSP.", "link": "https://doi.org/10.1002/qj.70364", "authors": "M. R. Muetzelfeldt, R. S. Plant, H. M. Christensen, Z. Zhang, T. Woollings, A. Stirling, W. Tennant, M. Moncrieff", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2026-11-24", "first_seen": "2026-11-26T13:59:01+00:00", "score": 59, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.23216", "title": "Energy-Aware Earth System Science: A Community Roadmap", "summary": "Earth system models underpin the evidence that informs net-zero policy, yet their energy demands are rarely considered when judging model quality. Using archived output from 159 models spanning five generations of the Coupled Model Intercomparison Project (CMIP), we show that model error has fallen at a constant rate of 13.5 per cent per doubling of compute since 1995. Halving CMIP6 error would require 28 times more compute. Improvements are uneven, with sea-level pressure and surface air temperature errors declining 3.5-fold and 2.7-fold since CMIP1, but precipitation error by only 7 per cent. Machine-learning weather models match or exceed operational forecast skill at a fraction of the runtime, but none publishes measured energy, and including training changes how they rank. We propose a skill-energy framework that combines an empirical Pareto front with a ranking score. These findings argue for standardised reporting of energy use and performance ahead of CMIP8.", "link": "https://arxiv.org/abs/2610.23216", "authors": "Ioana Colfescu, Annalisa Bracco, Kara Moraw, Chen Lu, Michael Bareford, Tom Beucler, Massimo Bollasina, Juan Carlos Bilbao-Ludena", "source": "arXiv", "published": "2026-10-16", "first_seen": "2026-11-26T13:59:01+00:00", "score": 58, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": ["Tom Beucler"], "boosts": ["cmip6", "precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "arxiv:2611.13346", "title": "Advancing Mass-Conserving Deep Learning for Distributed Hydrologic Modeling: A Case Study in a Snow-Dominated Watershed", "summary": "Recent progress in physics-aware deep learning (DL) has embedded mass conservation within Long Short-Term Memory (LSTM) architecture for hydrologic modeling, improving physical consistency and enabling diagnostics of internal states. However, existing mass-conserving neural networks are primarily developed in lumped formulations. Consequently, previous studies provide only fragmented and often indirect evidence of when and why imposed physical constraints may lead to unrealistic hydrologic behavior. To address this limitation, we propose Physics-Enhanced Conservation-Augmented Net (PECAN), a mass-conserving convolutional LSTM-based framework for distributed hydrologic modeling and diagnosing structural limitations of physics-aware DL models. PECAN is implemented in two variants: (1) PECAN-MC with a strict precipitation-based conservation constraint and (2) PECAN-MCR with a relaxed conservation constraint allowing additional water inputs beyond precipitation. Both variants are trained solely on gauge streamflow and evaluated in a snow-dominated watershed in Colorado. We benchmark PECAN against lumped DL baselines and the distributed process-based Variable Infiltration Capacity (VIC) model. Results show that PECAN achieves competitive outlet streamflow simulation accuracy while producing spatially explicit latent states for interpretation. Comparisons with reference soil moisture indicate that PECAN cell states resemble meaningful temporal soil moisture dynamics. However, analyses also reveal that PECAN misrepresents snow processes by prematurely removing winter snow water st", "link": "https://arxiv.org/abs/2611.13346", "authors": "Yihan Wang, Lujun Zhang, N. Benjamin Erichson, Yang Hong, Tiantian Yang", "source": "arXiv", "published": "2026-11-09", "first_seen": "2026-11-26T13:59:01+00:00", "score": 58, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.28327", "title": "Observation Assimilation Transformer: Probabilistic Weather Analysis from Sparse Station Observations", "summary": "We present the Observation Assimilation Transformer (OAT), a geometry-aware neural process that corrects and refines a prior numerical weather prediction (NWP) field into a high-resolution posterior field by assimilating sparse observations. OAT is an encoder-decoder transformer that considers a set of observed locations and their NWP prior to condition predictions at a set of arbitrary unobserved query locations. Its sparse attention mechanism makes it scalable to thousands of station observations and depends on relative positions between locations, never on the absolute coordinates. The model allows for partially missing observations, predictions at arbitrary continuous locations without grid projection, and outputs are parametric distributions. A station-randomized training algorithm is developed with continuous ranked probability score (CRPS) loss. We test OAT on two datasets - one at regional scale with hundreds of stations, and one at continental scale with thousands of stations. On these datasets OAT outperforms several baselines and shows well calibrated predictions. In an illustrative case study, OAT's downscaling capabilities are demonstrated by downscaling ERA5 (~31km) to COSMO (1km), where OAT achieves lower mean absolute error (MAE) and CRPS for temperature and precipitation on test stations compared to COSMO.", "link": "https://arxiv.org/abs/2610.28327", "authors": "Christian Donner, Michele Cattaneo, Maxim Samarin, Francesco Zanetta, Icíar Lloréns Jover, Gabriela Aznar Siguan, Michele Volpi", "source": "arXiv", "published": "2026-10-20", "first_seen": "2026-11-26T13:59:01+00:00", "score": 58, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2603.06782", "title": "Physics-Informed Diffusion Model for Generating Synthetic Extreme Rare Weather Events Data", "summary": "Data scarcity is a primary obstacle in developing robust Machine Learning (ML) models for detecting rapidly intensifying tropical cyclones. Traditional data augmentation techniques (rotation, flipping, brightness adjustment) fail to preserve the physical consistency and high-intensity gradients characteristic of rare Category 4-equivalent events, which constitute only 0.14\\% of our dataset (202 of 140,514 samples). We propose a physics-informed diffusion model based on the Context-UNet architecture to generate synthetic, multi-spectral satellite imagery of extreme weather events. Our model is conditioned on critical atmospheric parameters such as average wind speed, type of Ocean and stage of development (early, mature, late etc) -- the known drivers of rapid intensification. Using a controlled pre-generated noise sampling strategy and mixed-precision training, we generated $16\\times16$ wind-field samples that are cropped from multi-spectral satellite imagery which preserve realistic spatial autocorrelation and physical consistency. Results demonstrate that our model successfully learns discriminative features across ten distinct context classes, effectively mitigating the data bottleneck. Specifically, we address the extreme class imbalance in our dataset, where Class 4 (Ocean 2, early stage with average wind speed 50kn hurricane) contains only 202 samples compared to 79,768 samples in Class 0. This generative framework provides a scalable solution for augmenting training datasets for operational weather detection algorithms. The average Results yield an average Log-Spectr", "link": "https://arxiv.org/abs/2603.06782", "authors": "Marawan Yakout, Tannistha Maiti, Monira Majhabeen, Tarry Singh", "source": "arXiv", "published": "2026-03-06", "first_seen": "2026-11-26T13:59:01+00:00", "score": 58, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme", "diffusion model"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2512.18815", "title": "Controllable Probabilistic Forecasting with Stochastic Decomposition Layers", "summary": "AI weather prediction ensembles with latent noise injection and optimized with the continuous ranked probability score (CRPS) have produced both accurate and well-calibrated predictions with far less computational cost compared with diffusion-based methods. However, current CRPS ensemble approaches vary in their training strategies and noise injection mechanisms, with most injecting noise globally throughout the network via conditional normalization. This structure increases training expense and limits the physical interpretability of the stochastic perturbations. We introduce Stochastic Decomposition Layers (SDL) for converting deterministic machine learning weather models into probabilistic ensemble systems. Adapted from StyleGAN's hierarchical noise injection, SDL applies learned perturbations at three decoder scales through latent-driven modulation, per-pixel noise, and channel scaling. When applied to WXFormer via transfer learning, SDL requires less than 2\\% of the computational cost needed to train the baseline model. Each ensemble member is generated from a compact latent tensor (5 MB), enabling perfect reproducibility and post-inference spread adjustment through latent rescaling. Evaluation on 2022 ERA5 reanalysis shows ensembles with spread-skill ratios approaching unity and rank histograms that progressively flatten toward uniformity through medium-range forecasts, achieving calibration competitive with operational IFS-ENS. Multi-scale experiments reveal hierarchical uncertainty: coarse layers modulate synoptic patterns while fine layers control mesoscale variabi", "link": "https://arxiv.org/abs/2512.18815", "authors": "John S. Schreck, William E. Chapman, Charlie Becker, David John Gagne, Dhamma Kimpara, Nihanth Cherukuru, Judith Berner, Kirsten J. Mayer", "source": "arXiv", "published": "2025-12-21", "first_seen": "2026-11-26T13:59:01+00:00", "score": 58, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-17-1667-2024", "title": "High-resolution multi-scaling of outdoor human thermal comfort and its intra-urban variability based on machine learning", "summary": "As the frequency and intensity of heatwaves will continue to increase in the future, accurate and high-resolution mapping and forecasting of human outdoor thermal comfort in urban environments are of great importance. This study presents a machine-learning-based outdoor thermal comfort model with a good trade-off between computational cost, complexity, and accuracy compared to common numerical urban climate models. The machine learning approach is basically an emulation of different numerical urban climate models. The final model consists of four submodels that predict air temperature, relative humidity, wind speed, and mean radiant temperature based on meteorological forcing and geospatial data on building forms, land cover, and vegetation. These variables are then combined into a thermal index (universal thermal climate index – UTCI). All four submodel predictions and the final model output are evaluated using street-level measurements from a dense urban sensor network in Freiburg, Germany. The final model has a mean absolute error of 2.3 K. Based on a city-wide simulation for Freiburg, we demonstrate that the model is fast and versatile enough to simulate multiple years at hourly time steps to predict street-level UTCI at 1 m spatial resolution for an entire city. Simulations indicate that neighbourhood-averaged thermal comfort conditions vary widely between neighbourhoods, even if they are attributed to the same local climate zones, for example, due to differences in age and degree of urban vegetation. Simulations also show contrasting differences in the location of hot", "link": "https://doi.org/10.5194/gmd-17-1667-2024", "authors": "Ferdinand Briegel, Jonas Wehrle, Dirk Schindler, Andreas Christen", "source": "Geoscientific Model Development", "published": "2024-2-26", "first_seen": "2026-11-26T13:59:01+00:00", "score": 58, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-16-199-2023", "title": "WRF–ML v1.0: a bridge between WRF v4.3 and machine learning parameterizations and its application to atmospheric radiative transfer", "summary": "In numerical weather prediction (NWP) models, physical parameterization schemes are the most computationally expensive components, despite being greatly simplified. In the past few years, an increasing number of studies have demonstrated that machine learning (ML) parameterizations of subgrid physics have the potential to accelerate and even outperform conventional physics-based schemes. However, as the ML models are commonly implemented using the ML libraries written in Python, very few ML-based parameterizations have been successfully integrated with NWP models due to the difficulty of embedding Python functions into Fortran-based NWP models. To address this issue, we developed a coupler to allow the ML-based parameterizations to be coupled with a widely used NWP model, i.e., the Weather Research and Forecasting (WRF) model. Similar to the WRF I/O methodologies, the coupler provides the options to run the ML model inference with exclusive processors or the same processors for WRF calculations. In addition, to demonstrate the effectiveness of the coupler, the ML-based radiation emulators are trained and coupled with the WRF model successfully.", "link": "https://doi.org/10.5194/gmd-16-199-2023", "authors": "Xiaohui Zhong, Zhijian Ma, Yichen Yao, Lifei Xu, Yuan Wu, Zhibin Wang", "source": "Geoscientific Model Development", "published": "2023-1-6", "first_seen": "2026-11-26T13:59:01+00:00", "score": 58, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["emulator"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-26-0063.1", "title": "Probabilistic high-temporal resolution surface wind nowcasting with deep learning models", "summary": "High temporal frequency wind speed and direction predictions are critical for short-term operational decisions in the aviation sector, including runway selection, aircraft arrival sequencing, and departure planning. These decisions benefit substantially from having reliable forecasts several hours in advance, allowing operators to evaluate potential scenarios and formulate robust strategies. This results in a demand for forecasts with long forecast horizons at the minute-level time scale, a challenging problem since wind fluctuations are highly random. This study develops probabilistic wind nowcasts at individual sites using well-established deep learning (DL) models. By directly modelling the predictive distributions or quantiles of wind variables, the proposed DL approaches capture both the mean behaviour and the inherent variability of the wind field. Two complementary probabilistic models with distinct architectures and mechanisms are investigated. Both models outperform current Numerical Weather Prediction (NWP) hourly predictions, achieving reductions in forecast error of approximately 10%–30%. Their outputs are further analysed to characterize their respective strengths and limitations. Finally, we demonstrate that a weighted ensemble of the two models can potentially provide additional performance gains, outperforming each individual model, even for the demonstrated case in which one of the individual model has overall significantly worse performance than the other.", "link": "https://doi.org/10.1175/aies-d-26-0063.1", "authors": "Mengmeng Han, Brad Murphy, Tennessee Leeuwenburg", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-11-13", "first_seen": "2026-11-26T13:59:01+00:00", "score": 58, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024ms004308", "title": "Exploring Optimal Complexity for Water Stress Representation in Terrestrial Carbon Models: A Hybrid‐Machine Learning Model Approach", "summary": "Terrestrial biosphere models offer a comprehensive view of the global carbon cycle by integrating ecological processes across scales, yet they introduce significant uncertainties in climate and biogeochemical projections due to diverse process representations and parameter variations. For instance, different soil water limitation functions lead to wide productivity ranges across models. To address this, we propose the Differentiable Land Model (DifferLand), a novel hybrid machine learning approach replacing unknown water limitation functions in models with neural networks (NNs) to learn from data. Using automatic differentiation, we calibrated the embedded NN and the physical model parameters against daily observations of evapotranspiration, gross primary productivity, ecosystem respiration, and leaf area index across 16 FLUXNET sites. We evaluated six model configurations where NNs simulate increasingly complex soil water and photosynthesis interactions against test data sets to find the optimal structure‐performance tradeoff. Our findings show that a simple hybrid model with a univariate NN effectively captures site‐level water and carbon fluxes on a monthly timescale. Across a global aridity gradient, the magnitude of water stress limitation varies, but its functional form consistently converges to a piecewise linear relationship with saturation at high water levels. While models incorporating more interactions between soil water and meteorological drivers better fit observations at finer time scales, they risk overfitting and equifinality issues. Our study demonstrates ", "link": "https://doi.org/10.1029/2024ms004308", "authors": "J. Fang, P. Gentine", "source": "Journal of Advances in Modeling Earth Systems", "published": "2024-12", "first_seen": "2026-11-26T13:59:01+00:00", "score": 58, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2019ef001461", "title": "Twenty‐First Century Drought Projections in the CMIP6 Forcing Scenarios", "summary": "There is strong evidence that climate change will increase drought risk and severity, but these conclusions depend on the regions, seasons, and drought metrics being considered. We analyze changes in drought across the hydrologic cycle (precipitation, soil moisture, and runoff) in projections from Phase Six of the Coupled Model Intercomparison Project (CMIP6). The multimodel ensemble shows robust drying in the mean state across many regions and metrics by the end of the 21st century, even following the more aggressive mitigation pathways (SSP1‐2.6 and SSP2‐4.5). Regional hotspots with strong drying include western North America, Central America, Europe and the Mediterranean, the Amazon, southern Africa, China, Southeast Asia, and Australia. Compared to SSP3‐7.0 and SSP5‐8.5, however, the severity of drying in the lower warming scenarios is substantially reduced and further precipitation declines in many regions are avoided. Along with drying in the mean state, the risk of the historically most extreme drought events also increases with warming, by 200–300% in some regions. Soil moisture and runoff drying in CMIP6 is more robust, spatially extensive, and severe than precipitation, indicating an important role for other temperature‐sensitive drought processes, including evapotranspiration and snow. Given the similarity in drought responses between CMIP5 and CMIP6, we speculate that both generations of models are subject to similar uncertainties, including vegetation processes, model representations of precipitation, and the degree to which model responses to warming are consi", "link": "https://doi.org/10.1029/2019ef001461", "authors": "B. I. Cook, J. S. Mankin, K. Marvel, A. P. Williams, J. E. Smerdon, K. J. Anchukaitis", "source": "Earth's Future", "published": "2020-6", "first_seen": "2026-11-26T13:59:01+00:00", "score": 58, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024ef005219", "title": "Indian Ocean Dipole Impacts on Eastern African Short Rains Across Observations, Historical Simulations and Future Projections", "summary": "Eastern African “short rains” (October–December) are significantly influenced by the Indian Ocean Dipole (IOD), with increased rainfall during positive IOD events and dryness during negative IOD events. Most Coupled Model Intercomparison Project Phase 6 models overestimate the short‐rain response to IOD events in Eastern Africa, especially during negative events. This is due to enhanced zonal moisture transport anomalies, mainly related to amplified IOD intensity and the westward extension of the IOD eastern core. Mean‐state precipitation biases further contribute to overestimated short rains, traced back to the mean‐state positive IOD‐like biases. Under global warming, the contrasting short‐rain responses to IOD in the Horn of Africa and Southeastern Africa are primarily driven by the westward‐shifting IOD circulation. Enhanced impacts in the Horn of Africa are driven by stronger IOD‐related zonal winds and the more humid mean‐state atmosphere which is attributed to the IOD‐like warming pattern. In contrast, weakened impacts in Southeastern Africa are associated with anomalous meridional wind changes. Additionally, due to more extreme negative IOD events, the frequency as well as severity of droughts in the Horn of Africa are projected to increase. These findings provide valuable insights into Eastern Africa's climate dynamics and inform climate adaptation strategies.", "link": "https://doi.org/10.1029/2024ef005219", "authors": "Yiling Zheng, Chi‐Yung Tam, Matthew Collins", "source": "Earth's Future", "published": "2025-6", "first_seen": "2026-11-26T13:59:01+00:00", "score": 58, "topics": ["Close to your work"], "watch": [], "boosts": ["india", "precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-025-01067-z", "title": "Hourly extreme rainfall projections over South Korea using convection permitting climate simulations", "summary": "", "link": "https://doi.org/10.1038/s41612-025-01067-z", "authors": "Ga-Yeong Seo, Seung-Ki Min, Donghyun Lee, Seok-Woo Son, Chanil Park, Dong-Hyun Cha", "source": "npj Climate and Atmospheric Science", "published": "2025-6-5", "first_seen": "2026-11-26T13:59:01+00:00", "score": 58, "topics": ["Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.4667", "title": "Impact of the Madden–Julian oscillation and equatorial waves on tracked mesoscale convective systems over southeast Asia", "summary": "Southeast Asia is a region dominated by high‐impact weather, but numerical weather prediction here is a challenge owing to the complex orography and interactions between small‐ and large‐scale phenomena. Localised mesoscale convective systems (MCSs) can produce intense precipitation. Here, we track MCSs over a 5‐year period in Himawari satellite data, characterise the distribution of MCSs in the region, and investigate how they are modulated by the Madden–Julian oscillation (MJO) and equatorial waves. Between 10°S and 10°N in southeast Asia, MCSs account for 45–70% of the precipitation during boreal extended winter (November–April). Over most of the region, the fractional MCS contribution to rainfall is higher than average on days with extreme rainfall (>55%). Long‐lived (>12 hr) MCSs contribute disproportionately, providing 85% of the rainfall despite comprising only 34% of all MCSs. Variability in MCS rainfall accounts for >50% of the total rainfall variability during an MJO cycle, mostly due to larger numbers of MCSs in convectively active MJO phases. Variations in MCS size and mean rain rate due to shifts in the stratiform proportion provide compensating effects. In the west of the region, a shift to faster moving MCSs in active MJO phases and slower moving MCSs in inactive phases resulted in fast‐moving MCSs having the greatest impact on the MJO‐associated variability. Variability is larger in the west than in the east. Equatorial Kelvin waves modulate MCS rainfall, with MCSs accounting for 20–50% of local rainfall anomalies. This variability is again enhanced in the w", "link": "https://doi.org/10.1002/qj.4667", "authors": "Julia Crook, Fran Morris, Rory Gordon John Fitzpatrick, Simon C. Peatman, Juliane Schwendike, Thorwald H. Stein, Cathryn E. Birch, Sam Hardy", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2024-2-27", "first_seen": "2026-11-26T13:59:01+00:00", "score": 58, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.29213", "title": "Huayu-Global: Skillful real-time quasi-global precipitation retrieval", "summary": "Satellite precipitation products face a persistent trade-off: real-time estimates are timely but less accurate, whereas the most reliable products are often released months after observation. This delay keeps high-quality precipitation information outside the decision window for flood warning and disaster response. Here we report Huayu-Global, a cross-constellation deep-learning system that combines three geostationary sensor streams from five satellites through a common retrieval framework and generates coherent quasi-global precipitation fields every thirty minutes. Across more than a million independent station records from two periods outside the training years, Huayu-Global improves event detection and precipitation-amount estimation relative to the real-time products evaluated and reaches delayed-product-level skill in key metrics. Huayu-Global therefore turns operational geostationary observations into a timely, high-skill precipitation layer for flood forecasting, water management and disaster response. Its cross-constellation design also provides a scalable foundation for incorporating future geostationary missions into hydrological and weather-prediction systems.", "link": "https://arxiv.org/abs/2610.29213", "authors": "Zijiang Song, Shuang Yang, Yuying Li, Zilong Zhu, Xigang Sun, Ting Liu, Wenye Xiao, Lina Yuan", "source": "arXiv", "published": "2026-10-21", "first_seen": "2026-11-26T13:59:01+00:00", "score": 57, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024ms004464", "title": "Development of a Data‐Driven Lightning Scheme for Implementation in Global Climate Models", "summary": "This study proposes a new lightning scheme applicable at the global scale, predicting lightning rates from climatic variables. Using satellite lightning records spanning a period of 29 years, we apply machine learning methods to derive a functional relationship between lightning and climate reanalysis data. In particular, we design a tree‐based regression scheme, representing different lightning regimes with separate single hidden layer neural networks of low dimensionality. We apply multiple complexity constraints in the development stages, which makes our lightning scheme straightforward to implement within global climate models (GCMs). We demonstrate that, for years not used for training, our lightning scheme captures of the daily global spatio‐temporal lightning variability, which corresponds to a relative improvement compared to well‐established lightning schemes. Similarly, the scheme correlates well with lightning observations for the monthly climatology , inter‐annual variability , and latitudinal and longitudinal distributions . Most notably, the lightning scheme brings a critical improvement in representing lightning magnitude and variability in the three tropical lightning chimney regions: central Africa, the Amazon, and the Maritime Continent. We implement the lightning scheme in the Community Earth System Model to verify its stability and performance as a GCM component, and we provide detailed implementation guidelines. As an intermediate approach between high‐dimensional machine learning models and first‐order lightning parameterizations, our lightning scheme ", "link": "https://doi.org/10.1029/2024ms004464", "authors": "Vincent Verjans, Christian L. E. Franzke", "source": "Journal of Advances in Modeling Earth Systems", "published": "2025-1-30", "first_seen": "2026-11-26T13:59:01+00:00", "score": 57, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/2016jd025740", "title": "Present‐day irrigation mitigates heat extremes", "summary": "Irrigation is an essential practice for sustaining global food production and many regional economies. Emerging scientific evidence indicates that irrigation substantially affects mean climate conditions in different regions of the world. Yet how this practice influences climate extremes is currently unknown. Here we use ensemble simulations with the Community Earth System Model to assess the impacts of irrigation on climate extremes. An evaluation of the model performance reveals that irrigation has a small yet overall beneficial effect on the representation of present‐day near‐surface climate. While the influence of irrigation on annual mean temperatures is limited, we find a large impact on temperature extremes, with a particularly strong cooling during the hottest day of the year (−0.78 K averaged over irrigated land). The strong influence on extremes stems from the timing of irrigation and its influence on land‐atmosphere coupling strength. Together these effects result in asymmetric temperature responses, with a more pronounced cooling during hot and/or dry periods. The influence of irrigation is even more pronounced when considering subgrid‐scale model output, suggesting that local effects of land management are far more important than previously thought. Our results underline that irrigation has substantially reduced our exposure to hot temperature extremes in the past and highlight the need to account for irrigation in future climate projections.", "link": "https://doi.org/10.1002/2016jd025740", "authors": "Wim Thiery, Edouard L. Davin, David M. Lawrence, Annette L. Hirsch, Mathias Hauser, Sonia I. Seneviratne", "source": "JGR: Atmospheres", "published": "2017-2-2", "first_seen": "2026-11-26T13:59:01+00:00", "score": 57, "topics": ["Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-026-01558-7", "title": "Environment-conditioned deep learning for severe convection nowcasting", "summary": "", "link": "https://doi.org/10.1038/s41612-026-01558-7", "authors": "Lei Chen, Zijian Zhu, Xiaoran Zhuang, Tianyuan Qi, Yuxuan Feng, Xiaohui Zhong, Hao Li", "source": "npj Climate and Atmospheric Science", "published": "2026-10-2", "first_seen": "2026-11-26T13:59:01+00:00", "score": 57, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-20-0014.1", "title": "Using Artificial Neural Networks to Improve CFS Week-3–4 Precipitation and 2-m Air Temperature Forecasts", "summary": "Forecast skill from dynamical forecast models decreases quickly with projection time due to various errors. Therefore, postprocessing methods, from simple bias correction methods to more complicated multiple linear regression–based model output statistics, are used to improve raw model forecasts. Usually, these methods show clear forecast improvement over the raw model forecasts, especially for short-range weather forecasts. However, linear approaches have limitations because the relationship between predictands and predictors may be nonlinear. This is even truer for extended range forecasts, such as week-3–4 forecasts. In this study, neural network techniques are used to seek or model the relationships between a set of predictors and predictands, and eventually to improve week-3–4 precipitation and 2-m temperature forecasts made by the NOAA/NCEP Climate Forecast System. Benefitting from advances in machine learning techniques in recent years, more flexible and capable machine learning algorithms and availability of big datasets enable us not only to explore nonlinear features or relationships within a given large dataset, but also to extract more sophisticated pattern relationships and covariabilities hidden within the multidimensional predictors and predictands. Then these more sophisticated relationships and high-level statistical information are used to correct the model week-3–4 precipitation and 2-m temperature forecasts. The results show that to some extent neural network techniques can significantly improve the week-3–4 forecast accuracy and greatly increase the eff", "link": "https://doi.org/10.1175/waf-d-20-0014.1", "authors": "Yun Fan, Vladimir Krasnopolsky, Huug van den Dool, Chung-Yu Wu, Jon Gottschalck", "source": "Weather and Forecasting", "published": "2023-5", "first_seen": "2026-11-26T13:59:01+00:00", "score": 57, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.3179", "title": "Survey of data assimilation methods for convective‐scale numerical weather prediction at operational centres", "summary": "Data assimilation (DA) methods for convective‐scale numerical weather prediction at operational centres are surveyed. The operational methods include variational methods (3D‐Var and 4D‐Var), ensemble methods (LETKF) and hybrids between variational and ensemble methods (3DEnVar and 4DEnVar). At several operational centres, other assimilation algorithms, like latent heat nudging, are additionally applied to improve the model initial state, with emphasis on convective scales. It is demonstrated that the quality of forecasts based on initial data from convective‐scale DA is significantly better than the quality of forecasts from simple downscaling of larger‐scale initial data. However, the duration of positive impact depends on the weather situation, the size of the computational domain and the data that are assimilated. Furthermore it is shown that more advanced methods applied at convective scales provide improvements over simpler methods. This motivates continued research and development in convective‐scale DA. Challenges in research and development for improvements of convective‐scale DA are also reviewed and discussed. The difficulty of handling the wide range of spatial and temporal scales makes development of multi‐scale assimilation methods and space–time covariance localization techniques important. Improved utilization of observations is also important. In order to extract more information from existing observing systems of convective‐scale phenomena (e.g. weather radar data and satellite image data), it is necessary to provide improved statistical descriptions of the", "link": "https://doi.org/10.1002/qj.3179", "authors": "Nils Gustafsson, Tijana Janjić, Christoph Schraff, Daniel Leuenberger, Martin Weissmann, Hendrik Reich, Pierre Brousseau, Thibaut Montmerle", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2018-3-30", "first_seen": "2026-11-26T13:59:01+00:00", "score": 57, "topics": ["Downscaling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.08148", "title": "Detecting Weather Fronts from Satellite Observations: What Does Reanalysis Add?", "summary": "Weather fronts are transition regions between air masses with contrasting thermodynamic properties and are associated with mid-latitude precipitation and severe weather. We investigate machine learning (ML) methods for detecting weather fronts and quantify the contribution of reanalysis data to performance. We compare two configurations of the same ML model for pixel-wise frontal classification over the North Atlantic and Europe: (1) using only geostationary infrared satellite observations, and (2) additionally using 28 ERA5 reanalysis fields. The satellite-only model achieves a neighbourhood critical success index at a 150 km tolerance (CSI@150) of $0.402$, which lies within the range of agreement between analyses from different meteorological services. The satellite$+$ERA5 model achieves $0.575$, an improvement of $0.173$. Our analysis shows that low-level winds are the least predictable from the satellite representation ($R^2 = 0.23$, compared with $0.88$ for temperature), while removing winds or moisture causes the largest decreases in detection performance.", "link": "https://arxiv.org/abs/2611.08148", "authors": "Ioannis Dravilas, Miruna Stoicescu, Roope Tervo, Carlos Horn, Oriol Hinojo Comellas, Sina Montazeri, Andrea Meraner, Ana Lucic", "source": "arXiv", "published": "2026-11-05", "first_seen": "2026-11-26T13:59:01+00:00", "score": 56, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.01614", "title": "Sonny-ENS: demystifying machine-learning ensemble weather forecasting", "summary": "Every weather forecast is uncertain, and decisions from flood warnings to energy trading depend on how well that uncertainty is quantified. Machine-learning (ML) ensembles now quantify it better than the best physics-based ensemble, yet two things about them remain opaque: whether their skill requires hundreds to thousands of accelerator-days of training, and how a network with a simple source of randomness produces a spread that follows the flow. Here we introduce Sonny-ENS, an ensemble of three 68.9-million-parameter networks with Monte Carlo dropout, trained on the continuous ranked probability score (CRPS) in 2.7 A40 GPU-days. On 2022, it has a lower CRPS than the European Centre for Medium-Range Weather Forecasts ensemble (ENS) on 96% of 570 targets and an 8.3% lower mean CRPS at lead times of 1-10 days. It outperforms the operational GenCast on 69% of the targets, and a 51-member, 15-day forecast takes 69 s on one GPU. Ablations identify the ingredients of this skill, and a Kolmogorov-Arnold sparse autoencoder shows that dropout injects uncertainty mainly in the tropics, whereas the spread grows where the atmosphere is baroclinically unstable (spatial correlation 0.91 with the Eady growth rate). Skillful probabilistic weather forecasts are therefore within reach of a single GPU server.", "link": "https://arxiv.org/abs/2611.01614", "authors": "Minjong Cheon", "source": "arXiv", "published": "2026-11-01", "first_seen": "2026-11-26T13:59:01+00:00", "score": 56, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.24708", "title": "Spherical Physics-informed Neural Operator with Multi-scale Coupling for Meteorological Downscaling", "summary": "Meteorological downscaling is crucial for high-resolution regional climate forecasting and disaster early warning. While neural operators have emerged as a promising paradigm for modeling complex spatiotemporal mappings, existing frameworks often struggle with spherical manifold geometric distortions, inherent atmospheric multi-scale coupling mismatches, and lack of explicit atmospheric laws. We propose the Spherical Physics-informed Neural Operator, which utilizes a Spherical Laplacian Decomposition to partition atmospheric fields into hierarchical frequency components, maintaining exact point-wise correspondence across scales. To evaluate these representations at arbitrary locations, we introduce a localized spherical integral operator that approximates continuous kernel transforms via geometry-aware attention. Dynamical consistency is further enforced by embedding differentiable constraints into the learning process. Extensive experiments demonstrate that our framework attains superior accuracy and zero-shot generalization across various meteorological variables and unseen queries, representing a robust and interpretable solution for global-to-regional meteorological downscaling.", "link": "https://arxiv.org/abs/2610.24708", "authors": "Yiqiang Ye, Yichi Wang, Haodi Zhang, Jiawei Wen, Jiahui Jiang, Zhaoyu Zhong, Jiangjian Yu, Chunxia Xiao", "source": "arXiv", "published": "2026-10-17", "first_seen": "2026-11-26T13:59:01+00:00", "score": 56, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-19-2821-2026", "title": "The Destination Earth digital twin for climate change adaptation", "summary": "The Climate Change Adaptation Digital Twin (Climate DT), developed as part of the European Commission's Destination Earth (DestinE) initiative, sets up an operational system for producing multi-decadal, multi-model global climate projections and translating climate data into climate impact information to support adaptation efforts. This system delivers data with local granularity at spatial resolutions of 5–10 km and hourly outputs, leading to globally consistent information at scales that matter for decision-making. It also enables the testing of what-if scenarios such as high-resolution storylines, which are physically consistent global simulations of extreme events under different climate conditions and provide contextual insights to support concrete adaptation decisions. They support the generation of more equitable (understood as accessible and relevant across regions) climate information. The Climate DT is built on cutting-edge infrastructure, expert collaboration, and digital innovation. It is designed to support on-demand responses to policy questions, with quantified uncertainty. It will foster interactivity by allowing users to influence simulation design, model output portfolios, and application integration through co-design. AI-based tools, including emulators and chatbots, are being developed in parallel to enhance climate information access. Sector-specific applications are embedded in the system to synchronously translate climate data into tailored climate-impact indicators, with examples provided for energy, water, and forest management. The applications hav", "link": "https://doi.org/10.5194/gmd-19-2821-2026", "authors": "Francisco J. Doblas-Reyes, Jenni Kontkanen, Irina Sandu, Mario Acosta, Mohammed Hussam Al Turjmam, Ivan Alsina-Ferrer, Miguel Andrés-Martínez, Costanza Anerdi", "source": "Geoscientific Model Development", "published": "2026-4-14", "first_seen": "2026-11-26T13:59:01+00:00", "score": 56, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["extreme", "emulator", "uncertainty"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-24-0047.1", "title": "Efficient Modeling of Subkilometer Surface Wind with Gaussian Processes and Neural Networks", "summary": "Accurately representing surface weather at the subkilometer scale is crucial for optimal decision-making in a wide range of applications. This motivates the use of statistical techniques to provide accurate and calibrated probabilistic predictions at a lower cost compared to numerical simulations. Wind represents a particularly challenging variable to model due to its high spatial and temporal variability. This paper presents a novel approach that integrates Gaussian processes and neural networks to model surface wind gusts at subkilometer resolution, leveraging multiple data sources, including numerical weather prediction models, topographical descriptors, and in situ measurements. Results demonstrate the added value of modeling the multivariate covariance structure of the variable of interest, as opposed to only applying a univariate probabilistic regression approach. Modeling the covariance enables the optimal integration of observed measurements from ground stations, which is shown to reduce the continuous ranked probability score compared to the baseline. Moreover, it allows the generation of realistic fields that are also marginally calibrated, aided by scalable techniques such as random Fourier features and pathwise conditioning. We discuss the effect of different modeling choices, as well as different degrees of approximation, and present our results for a case study. Significance Statement Accurately representing the surface wind at the subkilometer scale is valuable for various applications, but it represents a difficult challenge, especially in the presence of co", "link": "https://doi.org/10.1175/aies-d-24-0047.1", "authors": "Francesco Zanetta, Daniele Nerini, Matteo Buzzi, Henry Moss", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-4", "first_seen": "2026-11-26T13:59:01+00:00", "score": 56, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2019ms002010", "title": "Presentation and Evaluation of the IPSL‐CM6A‐LR Climate Model", "summary": "This study presents the global climate model IPSL‐CM6A‐LR developed at Institut Pierre‐Simon Laplace (IPSL) to study natural climate variability and climate response to natural and anthropogenic forcings as part of the sixth phase of the Coupled Model Intercomparison Project (CMIP6). This article describes the different model components, their coupling, and the simulated climate in comparison to previous model versions. We focus here on the representation of the physical climate along with the main characteristics of the global carbon cycle. The model's climatology, as assessed from a range of metrics (related in particular to radiation, temperature, precipitation, and wind), is strongly improved in comparison to previous model versions. Although they are reduced, a number of known biases and shortcomings (e.g., double Intertropical Convergence Zone [ITCZ], frequency of midlatitude wintertime blockings, and El Niño–Southern Oscillation [ENSO] dynamics) persist. The equilibrium climate sensitivity and transient climate response have both increased from the previous climate model IPSL‐CM5A‐LR used in CMIP5. A large ensemble of more than 30 members for the historical period (1850–2018) and a smaller ensemble for a range of emissions scenarios (until 2100 and 2300) are also presented and discussed.", "link": "https://doi.org/10.1029/2019ms002010", "authors": "Olivier Boucher, Jérôme Servonnat, Anna Lea Albright, Olivier Aumont, Yves Balkanski, Vladislav Bastrikov, Slimane Bekki, Rémy Bonnet", "source": "Journal of Advances in Modeling Earth Systems", "published": "2020-7", "first_seen": "2026-11-26T13:59:01+00:00", "score": 56, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024jd042204", "title": "Mesoscale Convective Systems Tracking Method Intercomparison (MCSMIP): Application to DYAMOND Global km‐Scale Simulations", "summary": "Global kilometer‐scale models represent the future of Earth system modeling, enabling explicit simulation of organized convective storms and their associated extreme weather. Here, we comprehensively evaluate tropical mesoscale convective system (MCS) characteristics in the DYAMOND (DYnamics of the atmospheric general circulation modeled on non‐hydrostatic domains) simulations for both summer and winter phases. Using 10 different feature trackers applied to simulations and satellite observations, we assess MCS frequency, precipitation, and other key characteristics. Substantial differences (a factor of 2–3) arise among trackers in observed MCS frequency and their precipitation contribution, but model‐observation differences in MCS statistics are more consistent across trackers. DYAMOND models are generally skillful in simulating tropical mean MCS frequency, with multi‐model mean biases ranging from −2%–8% over land and −8%–8% over ocean (summer vs. winter). However, most DYAMOND models underestimate MCS precipitation amount (23%) and their contribution to total precipitation (17%). Biases in precipitation contributions are generally smaller over land (13%) than over ocean (21%), with moderate inter‐model variability. While models better simulate MCS diurnal cycles and cloud shield characteristics, they overestimate MCS precipitation intensity and underestimate stratiform rain contributions (up to a factor of 2), particularly over land, albeit observational uncertainties exist. Additionally, models exhibit a wide range of precipitable water in the tropics compared to reanaly", "link": "https://doi.org/10.1029/2024jd042204", "authors": "Zhe Feng, Andreas F. Prein, Julia Kukulies, Thomas Fiolleau, William K. Jones, Ben Maybee, Zachary L. Moon, Kelly M. Núñez Ocasio", "source": "JGR: Atmospheres", "published": "2025-4-12", "first_seen": "2026-11-26T13:59:01+00:00", "score": 56, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-17-0136.1", "title": "Improving the Explicit Prediction of Freezing Rain in a Kilometer-Scale Numerical Weather Prediction Model", "summary": "A freezing rain event, in which the Meteorological Centre of Canada’s 2.5-km numerical weather prediction system significantly underpredicted the quantity of freezing rain, is examined. The prediction system models precipitation types explicitly, directly from the Milbrandt–Yau microphysics scheme. It was determined that the freezing rain underprediction for this case was due primarily to excessive refreezing of rain, originating from melting snow and graupel, in and under the temperature inversion of the advancing warm front ultimately depleting the supply of rain reaching the surface. The refreezing was caused from excessive collisional freezing between rain and graupel. Sensitivity experiments were conducted to examine the effects of a temperature threshold for collisional freezing and on varying the values of the collection efficiencies between rain and ice-phase hydrometeors. It was shown that by reducing the rain–graupel collection efficiency and by imposing a temperature threshold of −5°C, above which collisional freezing is not permitted, excessive rain–graupel collection and graupel formation can be controlled in the microphysics scheme, leading to an improved simulation of freezing rain at the surface.", "link": "https://doi.org/10.1175/waf-d-17-0136.1", "authors": "Agnieszka Barszcz, Jason A. Milbrandt, Julie M. Thériault", "source": "Weather and Forecasting", "published": "2018-5-17", "first_seen": "2026-11-26T13:59:01+00:00", "score": 56, "topics": ["Downscaling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-23-0213.1", "title": "WRF Model Forecast Evaluation of Extreme Rainfall Events over Karnataka during the Indian Summer Monsoon", "summary": "The skill of the Weather Research and Forecasting (WRF) Model in predicting extreme rainfall events (EREs) is investigated for two different initialization times: 1200 UTC (12-h lead time) and 0000 UTC (zero lead time). A high-resolution (3-km) WRF Model configuration is used to simulate 38 EREs in Karnataka, a state in southwest India. These EREs were identified by analyzing daily accumulated rainfall recorded by telemetric rain gauge (TRG) stations over the region, specifically during the prominent rainy season in the state (June–November) for the period 2015–19. EREs were defined using the 99.993rd percentile threshold for each subdivision and year. The model forecasts of rainfall and other meteorological variables were verified against high-density TRG (6480 stations) and telemetric weather station (860 stations) observations throughout Karnataka. The model performance was assessed through computation of quantitative error measures and statistical skill scores. Consistently, both sets of experiments reveal a propensity of the WRF Model to overestimate rainfall in the coastal region, with simulations initialized at 0000 UTC displaying a more pronounced wet bias compared to those at 1200 UTC. However, simulations initialized at 0000 UTC are more skillful than 1200 UTC in predicting the frequency of rainfall occurrences. The validation of other meteorological variables indicates that the model tends to underpredict temperature and overpredict relative humidity, especially during night hours, while it overpredicts wind speed over the region. Quantification of the model erro", "link": "https://doi.org/10.1175/waf-d-23-0213.1", "authors": "Ajay Bankar, V. Rakesh, Smrati Purwar", "source": "Weather and Forecasting", "published": "2025-8", "first_seen": "2026-11-26T13:59:01+00:00", "score": 56, "topics": ["Close to your work"], "watch": [], "boosts": ["india", "monsoon", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/nclimate3201", "title": "Future increases in extreme precipitation exceed observed scaling rates", "summary": "", "link": "https://doi.org/10.1038/nclimate3201", "authors": "Jiawei Bao, Steven C. Sherwood, Lisa V. Alexander, Jason P. Evans", "source": "Nature Climate Change", "published": "2017-1-9", "first_seen": "2026-11-26T13:59:01+00:00", "score": 56, "topics": ["Close to your work"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.15053", "title": "PhysXAI: A Theoretical Framework for Diagnosing Physical Hallucinations in Weather Foundation Models", "summary": "Modern machine learning models for global weather forecasting achieve remarkable predictive accuracy, yet they frequently produce states that violate fundamental physical laws, including conservation of mass, hydrostatic balance, or spectral energy scaling. We term these outputs physical hallucinations and propose PhysXAI, a rigorous diagnostic framework that detects, localises, and attributes such inconsistencies. Unlike existing post-hoc metric suites, PhysXAI is a learnable system that explicitly decouples forecast error from physical plausibility. We formalise the problem through a novel joint condition on numerical and physical residuals, and introduce a multi-branch encoder that extracts representations from conservation, dynamical, spectral, cross-variable, and spatiotemporal residuals. A key innovation is a physics-consistency contrastive learning objective, which we theoretically show the latent representation to be approximately isometric to the physical residual space, ensuring that diagnostic decisions remain grounded in physically meaningful deviations. We further derive an adaptive multi-objective loss with gradient-based weighting to balance competing diagnostic objectives. The framework produces spatially resolved hallucination maps, violation-type classifications, and calibrated Bayesian uncertainty, enabling both detection and interpretable attribution of physical inconsistencies. We conduct a comprehensive comparative evaluation of PhysXAI across ERA5, WeatherBench 2, and MERRA-2, using forecasts from GraphCast, Pangu-Weather, and NeuralGCM, with Python-w", "link": "https://arxiv.org/abs/2611.15053", "authors": "Anjan Mahapatra, Nikhil Raj", "source": "arXiv", "published": "2026-11-11", "first_seen": "2026-11-26T13:59:01+00:00", "score": 55, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.03381", "title": "A Geometry-Informed Neural Operator surrogate of LISFLOOD-FP for rapid pluvial-fluvial flood forecasting: the case of Forlì, Italy", "summary": "Physically based two-dimensional hydraulic models are too slow for real-time inundation forecasting and large ensembles. We present a time-dependent geometry-informed neural operator (GINO) surrogate of LISFLOOD-FP for the municipality of Forlì (Italy), severely affected by the May 2023 Emilia-Romagna floods. The surrogate is designed for an operational setting in which only river stage gauges and rain gauges are available. A reproducible pipeline turns public regional observations into a physically based training set: each river inflow is driven by the first stage gauge downstream of it through a calibrated water-surface boundary condition, and rain enters as SCS-CN effective rainfall. The surrogate is an autoregressive GINO trained on 216 simulations of 24 observed events with scaled forcing. It predicts volume-conserving polygon-mean depths on an exposure-based Voronoi mesh of 659 nodes, with a 20 min step over 72 h. The surrogate is tested on 38 independent observed events that it never saw during training. On these events it reaches a critical success index (CSI) of 0.934 at 0.05m and 0.844 at 0.3 m, a depth RMSE of 0.008m and an $R^2$ of 0.984 for maximum-depth maps. On one NVIDIA A10G GPU a 72-h forecast takes 1.7 s instead of 55 s with LISFLOOD-FP, and a 50-member ensemble, computed in a single batched rollout, takes 6.2 s instead of about 46 min, which makes probabilistic flood forecasting practical. These results show that neural-operator surrogates can deliver accurate pluvial-fluvial flood forecasts driven by river stage for operational early warning.", "link": "https://arxiv.org/abs/2611.03381", "authors": "Samuele Maria Garofalo, Fabio Limardo, Simonetta Bodojra, Mohammad Amin Nabian, Mehdi Taghizadeh", "source": "arXiv", "published": "2026-11-02", "first_seen": "2026-11-26T13:59:01+00:00", "score": 55, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2511.18704", "title": "A multiresolution weather dataset for the Southwestern South Atlantic (2017-2018)", "summary": "The Southwestern South Atlantic (SWSA) is a key region for climate research and renewable energy assessment, yet high-resolution meteorological data are scarce. We present a multiresolution dataset spanning February 2017--November 2018, combining Weather Research and Forecasting (WRF) simulations with Sentinel-1A/B Synthetic Aperture Radar (SAR) wind fields processed using the CMOD5 model. WRF outputs were generated every 30 minutes for three nested domains (9 km, 3 km, 1 km) through 975 short-term simulations. SAR/CMOD5 wind fields are provided at 500 m and 1 km resolution across 104 acquisition dates. Validation shows strong agreement: daily spatial averages of 10 m wind speed yield RMSE and MAE below 3 m/s on over 93% of acquisition days, while more than 91.5% of pixel-level residuals fall within $\\pm$3 m/s. In situ measurements from the Itajaí buoy further confirmed the reliability of both sources. The dataset supports regional climate studies, wind energy resource assessment, and machine-learning applications in forecasting and downscaling, with usage examples included to aid practical adoption.", "link": "https://arxiv.org/abs/2511.18704", "authors": "Luan C. V. Silva, Lívia Sancho, Mauricio S. Silva, Elisa Passos, Larissa F. R. Jacinto, Rebeca S. Lyra, Nilton O. Moraes, Carina S. Bock", "source": "arXiv", "published": "2025-11-24", "first_seen": "2026-11-26T13:59:01+00:00", "score": 55, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-24-0052.1", "title": "Neural Prediction of Lagrangian Drift Trajectories on the Sea Surface", "summary": "This study proposes a new deep learning approach for the simulation of Lagrangian drift at the sea surface with the objective to overcome the current limitations of the existing model-based and learning-based methods. The proposed framework, called DriftNet, is inspired by the Eulerian Fokker–Planck representation of Lagrangian drift. DriftNet is able to simulate the Lagrangian trajectory of a fluid parcel given the corresponding Eulerian sea surface currents and the spatially explicit encoding of the parcel’s initial position. The efficacy of DriftNet is demonstrated through three benchmarks: two benchmarks involving fully simulated ocean data and one combining operational ocean reanalysis model along with in situ drifters’ data. The study focuses on two regions with different dynamical regimes: the northeast Pacific and the Gulf Stream. The findings indicate that DriftNet outperforms current state-of-the-art model-based and learning-based methods. Additionally, this study explores how the sea surface height—derived from both modeled and observed ocean—affects Lagrangian drift simulations when used as input to DriftNet. Significance Statement We propose a novel deep learning model, DriftNet, for the conditional generation of Lagrangian trajectories on the sea surface. Our model is based on Eulerian Fokker–Planck formalism and can be conditioned by multiple geophysical fields. We highlight the overall overperformance of DriftNet compared to the baseline model-based and learning-based approaches. We put in evidence the capacity of the proposed method to extract pertinent inf", "link": "https://doi.org/10.1175/aies-d-24-0052.1", "authors": "Daria Botvynko, Carlos Granero-Belinchon, Simon van Gennip, Abdesslam Benzinou, Ronan Fablet", "source": "Artificial Intelligence for the Earth Systems", "published": "2025-7", "first_seen": "2026-11-26T13:59:01+00:00", "score": 55, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution
