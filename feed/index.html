the basis of the medium-resolution version BCC-CSM2-MR (T106 in the atmosphere and 1 ∘ latitude × 1 ∘ longitude in the ocean) which is the baseline for BCC participation in the Coupled Model Intercomparison Project Phase 6 (CMIP6). This study documents the high-resolution model, highlights major improvements in the representation of atmospheric dynamical core and physical processes. BCC-CSM2-HR is evaluated for historical climate simulations from 1950 to 2014, performed under CMIP6-prescribed historical forcing, in comparison with its previous medium-resolution version BCC-CSM2-MR. Observed global warming trends of surface air temperature from 1950 to 2014 are well captured by both BCC-CSM2-MR and BCC-CSM2-HR. Present-day basic atmospheric mean states during the period from 1995 to 2014 are then evaluated at global scale, followed by an assessment on climate variabilities in the tropics including the tropical cyclones (TCs), the El Niño–Southern Oscillation (ENSO), the Madden–Julian Oscillation (MJO), and the quasi-biennial oscillation (QBO) in the stratosphere. It is shown that BCC-CSM2-HR represents the global energy balance well and can realistically reproduce the main patterns of atmospheric temperature and wind, precipitation, land surface air temperature, and sea surface temperature (SST). It also improves the spatial patterns of sea ice and associated seasonal variations in ", "link": "https://doi.org/10.5194/gmd-14-2977-2021", "authors": "Tongwen Wu, Rucong Yu, Yixiong Lu, Weihua Jie, Yongjie Fang, Jie Zhang", "source": "Geoscientific Model Development", "published": "2021-5-26", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation"]}, {"key": "doi:10.5194/gmd-10-889-2017", "title": "The DeepMIP contribution to PMIP4: experimental design for model simulations of the EECO, PETM, and pre-PETM (version 1.0)", "summary": "Past warm periods provide an opportunity to evaluate climate models under extreme forcing scenarios, in particular high ( > 800 ppmv) atmospheric CO2 concentrations. Although a post hoc intercomparison of Eocene ( ∼ 50 Ma) climate model simulations and geological data has been carried out previously, models of past high-CO2 periods have never been evaluated in a consistent framework. Here, we present an experimental design for climate model simulations of three warm periods within the early Eocene and the latest Paleocene (the EECO, PETM, and pre-PETM). Together with the CMIP6 pre-industrial control and abrupt 4 × CO2 simulations, and additional sensitivity studies, these form the first phase of DeepMIP – the Deep-time Model Intercomparison Project, itself a group within the wider Paleoclimate Modelling Intercomparison Project (PMIP). The experimental design specifies and provides guidance on boundary conditions associated with palaeogeography, greenhouse gases, astronomical configuration, solar constant, land surface processes, and aerosols. Initial conditions, simulation length, and output variables are also specified. Finally, we explain how the geological data sets, which will be used to evaluate the simulations, will be developed.", "link": "https://doi.org/10.5194/gmd-10-889-2017", "authors": "Daniel J. Lunt, Matthew Huber, Eleni Anagnostou, Michiel L. J. Baatsen, Rodrigo Caballero, Rob DeConto", "source": "Geoscientific Model Development", "published": "2017-2-23", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "extreme*"]}, {"key": "doi:10.5194/gmd-17-5349-2024", "title": "Modelling boreal forest's mineral soil and peat C dynamics with the Yasso07 model coupled with the Ricker moisture modifier", "summary": "As soil microbial respiration is the major component of land CO 2 emissions, differences in the functional dependence of respiration on soil moisture among Earth system models (ESMs) contributes significantly to the uncertainties in their projections. Using soil organic C (SOC) stocks and CO 2 data from a boreal forest–mire ecotone in Finland and Bayesian data assimilation, we revised the original precipitation-based monotonic saturation dependency of the Yasso07 soil carbon model using the non-monotonic Ricker function based on soil volumetric water content. We fit the revised functional dependency of moisture to the observed microbial respiration and SOC stocks and compared its performance against the original Yasso07 model and the version used in the JSBACH land surface model with a reduction constant for decomposition rates in wetlands. The Yasso07 soil C model coupled with the calibrated unimodal Ricker moisture function with an optimum in well-drained soils accurately reconstructed observed SOC stocks and soil CO 2 emissions and clearly outperformed previous model versions on paludified organo-mineral soils in forested peatlands and water-saturated organic soils in mires. The best estimate of the posterior moisture response of decomposition used both measurements of SOC stocks and CO 2 data from the full range of moisture conditions (from dry and xeric to wet and water-saturated soils). We observed unbiased residuals of SOC and CO 2 data modelled with the moisture optimum in well-drained soils, suggesting that this modified function accounts more precisely for the lon", "link": "https://doi.org/10.5194/gmd-17-5349-2024", "authors": "Boris Ťupek, Aleksi Lehtonen, Alla Yurova, Rose Abramoff, Bertrand Guenet, Elisa Bruni", "source": "Geoscientific Model Development", "published": "2024-7-11", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*", "uncertainty"]}, {"key": "doi:10.5194/gmd-16-179-2023", "title": "The Euro-Mediterranean Center on Climate Change (CMCC) decadal prediction system", "summary": "Decadal climate predictions, obtained by constraining the initial condition of a dynamical model through a truthful estimate of the observed climate state, provide an accurate assessment of near-term climate change and are a useful tool to inform decision-makers on future climate-related risks. Here we present results from the CMIP6 (Coupled Model Intercomparison Project Phase 6) Decadal Climate Prediction Project (DCPP) decadal hindcasts produced with the operational CMCC (Euro-Mediterranean Center on Climate Change) decadal prediction system (DPS), based on the fully coupled CMCC-CM2-SR5 dynamical model. A 20-member suite of 10-year retrospective forecasts, initialized every year from 1960 to 2020, is performed using a full-field initialization strategy. The predictive skill for key variables is assessed and compared with the skill of an ensemble of non-initialized historical simulations so as to quantify the added value of the initialization. In particular, the CMCC DPS is able to skillfully reproduce past climate surface and subsurface temperature fluctuations over large parts of the globe. The North Atlantic Ocean is the region that benefits the most from initialization, with the largest skill enhancement occurring over the subpolar region compared to historical simulations. On the other hand, the predictive skill over the Pacific Ocean rapidly decays with forecast time, especially over the North Pacific. In terms of precipitation, the skill of the CMCC DPS is significantly higher than that of the historical simulations over a few specific regions, including the Sahel,", "link": "https://doi.org/10.5194/gmd-16-179-2023", "authors": "Dario Nicolì, Alessio Bellucci, Paolo Ruggieri, Panos J. Athanasiadis, Stefano Materia, Daniele Peano", "source": "Geoscientific Model Development", "published": "2023-1-5", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation"]}, {"key": "doi:10.1029/2021ms002647", "title": "Simulations With the Marine Biogeochemistry Library (MARBL)", "summary": "The Marine Biogeochemistry Library (MARBL) is a prognostic ocean biogeochemistry model that simulates marine ecosystem dynamics and the coupled cycles of carbon, nitrogen, phosphorus, iron, silicon, and oxygen. MARBL is a component of the Community Earth System Model (CESM); it supports flexible ecosystem configuration of multiple phytoplankton and zooplankton functional types; it is also portable, designed to interface with multiple ocean circulation models. Here, we present scientific documentation of MARBL, describe its configuration in CESM2 experiments included in the Coupled Model Intercomparison Project version 6 (CMIP6), and evaluate its performance against a number of observational data sets. The model simulates present‐day air‐sea CO 2 flux and many aspects of the carbon cycle in good agreement with observations. However, the simulated integrated uptake of anthropogenic CO 2 is weak, which we link to poor thermocline ventilation, a feature evident in simulated chlorofluorocarbon distributions. This also contributes to larger‐than‐observed oxygen minimum zones. Moreover, radiocarbon distributions show that the simulated circulation in the deep North Pacific is extremely sluggish, yielding extensive oxygen depletion and nutrient trapping at depth. Surface macronutrient biases are generally positive at low latitudes and negative at high latitudes. CESM2 simulates globally integrated net primary production (NPP) of 48 Pg C yr −1 and particulate export flux at 100 m of 7.1 Pg C yr −1 . The impacts of climate change include an increase in globally integrated NPP, but su", "link": "https://doi.org/10.1029/2021ms002647", "authors": "Matthew C. Long, J. Keith Moore, Keith Lindsay, Michael Levy, Scott C. Doney, Jessica Y. Luo", "source": "Journal of Advances in Modeling Earth Systems", "published": "2021-11-30", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "extreme*"]}, {"key": "doi:10.1029/2018ms001369", "title": "Global Mean Climate and Main Patterns of Variability in the CMCC‐CM2 Coupled Model", "summary": "Euro‐Mediterranean Centre on Climate Change coupled climate model (CMCC‐CM2) represents the new family of the global coupled climate models developed and used at CMCC. It is based on the atmospheric, land and sea ice components from the Community Earth System Model coupled with the global ocean model Nucleus for European Modeling of the Ocean. This study documents the model components, the coupling strategy, particularly for the oceanic, atmospheric, and sea ice components, and the overall model ability in reproducing the observed mean climate and main patterns of interannual variability. As a first step toward a more comprehensive, process‐oriented, validation of the model, this work analyzes a 200‐year simulation performed under constant forcing corresponding to present‐day climate conditions. In terms of mean climate, the model is able to realistically reproduce the main patterns of temperature, precipitation, and winds. Specifically, we report improvements in the representation of the sea surface temperature with respect to the previous version of the model. In terms of mean atmospheric circulation features, we notice a realistic simulation of upper tropospheric winds and midtroposphere geopotential eddies. The oceanic heat transport and the Atlantic meridional overturning circulation satisfactorily compare with present‐day observations and estimates from global ocean reanalyses. The sea ice patterns and associated seasonal variations are realistically reproduced in both hemispheres, with a better skill in winter. Main weaknesses of the simulated climate are related wit", "link": "https://doi.org/10.1029/2018ms001369", "authors": "A. Cherchi, P. G. Fogli, T. Lovato, D. Peano, D. Iovino, S. Gualdi", "source": "Journal of Advances in Modeling Earth Systems", "published": "2019-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india*", "precipitation"]}, {"key": "doi:10.1029/2023ms004019", "title": "WeatherBench 2: A Benchmark for the Next Generation of Data‐Driven Global Weather Models", "summary": "WeatherBench 2 is an update to the global, medium‐range (1–14 days) weather forecasting benchmark proposed by (Rasp et al., 2020, https://doi.org/10.1029/2020ms002203 ), designed with the aim to accelerate progress in data‐driven weather modeling. WeatherBench 2 consists of an open‐source evaluation framework, publicly available training, ground truth and baseline data as well as a continuously updated website with the latest metrics and state‐of‐the‐art models: https://sites.research.google/weatherbench . This paper describes the design principles of the evaluation framework and presents results for current state‐of‐the‐art physical and data‐driven weather models. The metrics are based on established practices for evaluating weather forecasts at leading operational weather centers. We define a set of headline scores to provide an overview of model performance. In addition, we also discuss caveats in the current evaluation setup and challenges for the future of data‐driven weather forecasting.", "link": "https://doi.org/10.1029/2023ms004019", "authors": "Stephan Rasp, Stephan Hoyer, Alexander Merose, Ian Langmore, Peter Battaglia, Tyler Russell", "source": "Journal of Advances in Modeling Earth Systems", "published": "2024-6", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Weather and S2S Forecasting"], "watch": ["Stephan Rasp"], "boosts": []}, {"key": "doi:10.1029/2023ms004147", "title": "Estimating Uncertainty in Simulated ENSO Statistics", "summary": "Large ensembles of model simulations are frequently used to reduce the impact of internal variability when evaluating climate models and assessing climate change induced trends. However, the optimal number of ensemble members required to distinguish model biases and climate change signals from internal variability varies across models and metrics. Here we analyze the mean, variance and skewness of precipitation and sea surface temperature in the eastern equatorial Pacific region often used to describe the El Niño–Southern Oscillation (ENSO), obtained from large ensembles of Coupled model intercomparison project phase 6 climate simulations. Leveraging established statistical theory, we develop and assess equations to estimate, a priori, the ensemble size or simulation length required to limit sampling‐based uncertainties in ENSO statistics to within a desired tolerance. Our results confirm that the uncertainty of these statistics decreases with the square root of the time series length and/or ensemble size. Moreover, we demonstrate that uncertainties of these statistics are generally comparable when computed using either pre‐industrial control or historical runs. This suggests that pre‐industrial runs can sometimes be used to estimate the expected uncertainty of statistics computed from an existing historical member or ensemble, and the number of simulation years (run duration and/or ensemble size) required to adequately characterize the statistic. This advance allows us to use existing simulations (e.g., control runs that are performed during model development) to design en", "link": "https://doi.org/10.1029/2023ms004147", "authors": "Yann Y. Planton, Jiwoo Lee, Andrew T. Wittenberg, Peter J. Gleckler, Éric Guilyardi, Shayne McGregor", "source": "Journal of Advances in Modeling Earth Systems", "published": "2024-9", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "uncertainty"]}, {"key": "doi:10.1029/2019ms002012", "title": "The Flexible Global Ocean‐Atmosphere‐Land System Model Grid‐Point Version 3 (FGOALS‐g3): Description and Evaluation", "summary": "This paper introduces the Flexible Global Ocean‐Atmosphere‐Land System Model: Grid‐Point Version 3 (FGOALS‐g3) and evaluates its basic performance based on some of its participation in the sixth phase of the Coupled Model Intercomparison Project (CMIP6) experiments. Our results show that many significant improvements have been achieved by FGOALS‐g3 in terms of climatological mean states, variabilities, and long‐term trends. For example, FGOALS‐g3 has a small (−0.015°C/100 yr) climate drift in 700‐yr preindustrial control (piControl) runs and smaller biases in climatological mean variables, such as the land/sea surface temperatures (SSTs) and seasonal soil moisture cycle, compared with its previous version FGOALS‐g2 during the historical period. The characteristics of climate variabilities, for example, Madden‐Julian oscillation (MJO) eastward/westward propagation ratios, spatial patterns of interannual variability of tropical SST anomalies, and relationship between the East Asian Summer Monsoon and El Niño–Southern Oscillation (ENSO), are well captured by FGOALS‐g3. In particular, the cooling trend of globally averaged surface temperature during 1940–1970, which is a challenge for most CMIP3 and CMIP5 models, is well reproduced by FGOALS‐g3 in historical runs. In addition to the external forcing factors recommended by CMIP6, anthropogenic groundwater forcing from 1965 to 2014 was incorporated into the FGOALS‐g3 historical runs.", "link": "https://doi.org/10.1029/2019ms002012", "authors": "Lijuan Li, Yongqiang Yu, Yanli Tang, Pengfei Lin, Jinbo Xie, Mirong Song", "source": "Journal of Advances in Modeling Earth Systems", "published": "2020-9", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["monsoon", "cmip6"]}, {"key": "doi:10.1029/2024ms004930", "title": "Radiative, Hydrologic, and Circulation Responses to Warming in Cess‐Potter Simulations Using the Global 3.25‐km SCREAM", "summary": "Using the global 3.25‐km Simple Cloud Resolving E3SM Atmosphere Model (SCREAM 3 km), a pair of 13‐month Cess‐Potter simulations are performed to quantify the radiative feedbacks and the hydrologic and circulation responses to warming. Large‐scale aspects of SCREAM 3 km's top‐of‐atmosphere radiative fluxes, precipitation rates, and circulations are in good agreement with observations and reanalysis, with notable differences, including a drier lower free‐troposphere in the Tropics, reduced precipitation and humidity over the Tropical West Pacific, and poleward shifted Southern Hemisphere midlatitude jet. In response to warming, SCREAM 3 km predicts a total radiative feedback within the top 15% of the CMIP5 and CMIP6 models, which puts it substantially higher than the feedback reported by other kilometer‐scale models. SCREAM 3 km's high radiative feedback stems from a strongly positive shortwave cloud feedback, most prominent over the mid‐ and high‐latitudes. SCREAM 3 km's high precipitation response also puts it among the highest of CMIP models, whereas its circulation response is within the spread of CMIP models. An ensemble of five perturbed initial condition Cess‐Potter simulations with a 12 km version of SCREAM (SCREAM 12 km) is performed to characterize uncertainty and resolution sensitivity. It suggests that the uncertainty from analyzing a pair of 1‐year simulations is small compared to the inter‐model spread in feedbacks and precipitation response. SCREAM 12 km also produces a strong precipitation response to warming but a much lower cloud feedback and total radiative", "link": "https://doi.org/10.1029/2024ms004930", "authors": "C. R. Terai, N. D. Keen, P. M. Caldwell, H. Beydoun, P. A. Bogenschutz, L.‐W. Chao", "source": "Journal of Advances in Modeling Earth Systems", "published": "2025-10", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "uncertainty"]}, {"key": "doi:10.1029/2025ms004989", "title": "Overview of the Nephele Perturbed Parameter Ensemble for Aerosol‐Cloud Interactions in E3SMv3", "summary": "Aerosol‐cloud interactions (aci) are the leading source of uncertainty in inferring climate sensitivity from the historical record. Earth system models (ESMs) struggle to represent aci because the processes responsible for these phenomena occur at much finer time and space scales than can be resolved by any ESM. Observational constraints provide key benchmarks to test ESMs, but cannot be used alone to fully understand aci processes except in very specific cases where causality is controlled; some degree of modeling is required to infer aci and estimate radiative forcing. Here, we generate and characterize a perturbed parameter ensemble (PPE) in version 3 of the Energy Exascale ESM (E3SMv3). We perturb 25 parameters that govern aci processes over 250 members and integrate the model over present‐day and preindustrial aerosol emissions. We find that the process representation in E3SMv3 is flexible and can generate global‐mean effective radiative forcings due to aci (ERFaci) ranging from −3.0 to +0.9 W m − 2 . The positive ERFaci values simulated by a portion of the PPE are implausible and result from parameter combinations that produce unrealistic top‐of‐atmosphere energy fluxes. While global‐mean cloud droplet number concentration always increases in response to anthropogenic aerosol, cloud liquid water path can both increase and decrease, suggesting that precipitation suppression is not the only aerosol‐cloud adjustment represented by E3SMv3. Analysis of which processes control liquid cloud adjustment in the PPE points toward stratiform precipitation processes and aerosol ac", "link": "https://doi.org/10.1029/2025ms004989", "authors": "J. M. Nugent, H. Brown, A. Kirby, D. T. McCoy, G. Allen, T. Aerenson", "source": "Journal of Advances in Modeling Earth Systems", "published": "2026-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "uncertainty"]}, {"key": "doi:10.1029/2020gl087768", "title": "What Caused the Extreme Indian Ocean Dipole Event in 2019?", "summary": "An extreme positive Indian Ocean Dipole (IOD) event occurred in 2019 boreal autumn, which has induced severe climate impacts around the Indian Ocean basin. In this study, the cause for 2019 IOD event and the related mechanism are explored. We find that the remarkable strengthening of Australian high and weakening of sea level pressure over South China Sea/Philippine Sea have been evidently visible since May 2019. Such a record‐breaking interhemispheric pressure gradient (IHPG) induced northward cross‐equatorial flow over the western Maritime Continent, which triggered strong wind‐evaporation‐SST and thermocline feedbacks in 2019. In addition to 2019 case, historical IOD events are highly correlated with IHPG from boreal late spring to summer. We show that skillful IHPG prediction can be made in March by European Centre for Medium‐Range Weather Forecasts seasonal forecast system, which makes it quite possible for the early warning of extreme IOD events by two to three seasons ahead.", "link": "https://doi.org/10.1029/2020gl087768", "authors": "Bo Lu, Hong‐Li Ren", "source": "Geophysical Research Letters", "published": "2020-6-3", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["india*", "extreme*"]}, {"key": "doi:10.1029/2021gl095778", "title": "Biased Estimates of Equilibrium Climate Sensitivity and Transient Climate Response Derived From Historical CMIP6 Simulations", "summary": "This study assesses the effective climate sensitivity (EffCS) and transient climate response (TCR) derived from global energy budget constraints within historical simulations of eight CMIP6 global climate models (GCMs). These calculations are enabled by use of the Radiative Forcing Model Intercomparison Project (RFMIP) simulations, which permit accurate quantification of the radiative forcing. Long‐term historical energy budget constraints generally underestimate EffCS from CO 2 quadrupling and TCR from CO 2 ramping, owing to changes in radiative feedbacks and changes in ocean heat uptake efficiency. Atmospheric GCMs forced by observed warming patterns produce lower values of EffCS that are more in line with those inferred from observed historical energy budget changes. The differences in the EffCS estimates from historical energy budget constraints of models and observations are traced to discrepancies between modeled and observed historical surface warming patterns.", "link": "https://doi.org/10.1029/2021gl095778", "authors": "Yue Dong, Kyle C. Armour, Cristian Proistosescu, Timothy Andrews, David S. Battisti, Piers M. Forster", "source": "Geophysical Research Letters", "published": "2021-12-23", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6"]}, {"key": "doi:10.1029/2023gl107262", "title": "Northward Extension of East Asian Summer Monsoon Since the Miocene Set by the Uplift of Tibetan Plateau", "summary": "The modern East Asian summer monsoon (EASM) features an extension from tropical to subtropical areas. However, the fundamental process that determines the northward extension of EASM in the geological history remains unclear. Here, we showed evidence from proxy data, climate modeling, and theoretical solutions that the northward extension of EASM to today's boundary emerged no later than the Miocene. The extension was driven by the monsoon seasonal march which features stepwise northward rainfall stages. The seasonal progression of monsoon was determined by Rossby wave responses from early summer to late summer and caused by the weakening of westerly jet colliding with the Tibetan Plateau (TP). The Rossby wave responses further led to a northward migration of the western Pacific subtropical high and thereby monsoon precipitation. Our findings propose a novel physical linkage between the geological evolution of EASM and the TP uplift in the context of monsoon seasonal march.", "link": "https://doi.org/10.1029/2023gl107262", "authors": "Linqiang He, Tianjun Zhou, Zhun Guo, Meng Zuo, Zikun Ren, Xiaolong Chen", "source": "Geophysical Research Letters", "published": "2024-3-5", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["monsoon", "precipitation"]}, {"key": "doi:10.1029/2006gl029068", "title": "Contribution of land‐atmosphere coupling to recent European summer heat waves", "summary": "Most of the recent European summer heat waves have been preceded by a pronounced spring precipitation deficit. The lack of precipitation and the associated depletion of soil moisture result in reduced latent cooling and thereby amplify the summer temperature extremes. In order to quantify the contribution of land‐atmosphere interactions, we conduct regional climate simulations with and without land‐atmosphere coupling for four selected major summer heat waves in 1976, 1994, 2003, and 2005. The coupled simulation uses a fully coupled land‐surface model, while in the uncoupled simulation the mean seasonal cycle of soil moisture is prescribed. The experiments reveal that land‐atmosphere coupling plays an important role for the evolution of the investigated heat waves both through local and remote effects. During all simulated events soil moisture‐temperature interactions increase the heat wave duration and account for typically 50–80% of the number of hot summer days. The largest impact is found for daily maximum temperatures during heat wave episodes.", "link": "https://doi.org/10.1029/2006gl029068", "authors": "E. M. Fischer, S. I. Seneviratne, D. Lüthi, C. Schär", "source": "Geophysical Research Letters", "published": "2007-3", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1029/2023ef004370", "title": "Contributions of Tropical Cyclones and Atmospheric Rivers to Extreme Precipitation Trends Over the Northeast US", "summary": "The Northeast United States (NEUS) has faced the most rapidly increasing occurrences of extreme precipitation within the US in the past few decades. Understanding the physics leading to long‐term trends in regional extreme precipitation is essential but the progress is limited partially by the horizontal resolution of climate models. The latest fully coupled 25‐km GFDL (Geophysical Fluid Dynamics Laboratory) SPEAR ( S eamless system for P rediction and EA rth system R esearch) simulations provide a good opportunity to study changes in regional extreme precipitation and the relevant physical processes. Here, we focus on the contributions of changes in synoptic‐scale events, including atmospheric rivers (AR) and tropical cyclone (TC)‐related events, to the trend of extreme precipitation in the fall season over the Northeast US in both the recent past and future projections using the 25‐km GFDL‐SPEAR. In observations, increasing extreme precipitation over the NEUS since the 1990s is mainly linked to TC‐related events, especially those undergoing extratropical transitions. In the future, both AR‐related and TC‐related extreme precipitation over the NEUS are projected to increase, even though the numbers of TCs in the North Atlantic are projected to decrease in the SPEAR simulations using the SSP5‐8.5 projection of future radiative forcing. Factors such as enhancing TC intensity, strengthening TC‐related precipitation, and/or westward shift in Atlantic TC tracks may offset the influence of declining Atlantic TC numbers in the model projections, leading to more frequent TC‐relate", "link": "https://doi.org/10.1029/2023ef004370", "authors": "Bor‐Ting Jong, Hiroyuki Murakami, Thomas L. Delworth, William F. Cooke", "source": "Earth's Future", "published": "2024-4", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1029/2021ef002340", "title": "Guidelines for Studying Diverse Types of Compound Weather and Climate Events", "summary": "Compound weather and climate events are combinations of climate drivers and/or hazards that contribute to societal or environmental risk. Studying compound events often requires a multidisciplinary approach combining domain knowledge of the underlying processes with, for example, statistical methods and climate model outputs. Recently, to aid the development of research on compound events, four compound event types were introduced, namely (a) preconditioned , (b) multivariate , (c) temporally compounding , and (d) spatially compounding events. However, guidelines on how to study these types of events are still lacking. Here, we consider four case studies, each associated with a specific event type and a research question, to illustrate how the key elements of compound events (e.g., analytical tools and relevant physical effects) can be identified. These case studies show that (a) impacts on crops from hot and dry summers can be exacerbated by preconditioning effects of dry and bright springs. (b) Assessing compound coastal flooding in Perth (Australia) requires considering the dynamics of a non‐stationary multivariate process. For instance, future mean sea‐level rise will lead to the emergence of concurrent coastal and fluvial extremes, enhancing compound flooding risk. (c) In Portugal, deep‐landslides are often caused by temporal clusters of moderate precipitation events. Finally, (d) crop yield failures in France and Germany are strongly correlated, threatening European food security through spatially compounding effects. These analyses allow for identifying general recom", "link": "https://doi.org/10.1029/2021ef002340", "authors": "Emanuele Bevacqua, Carlo De Michele, Colin Manning, Anaïs Couasnon, Andreia F. S. Ribeiro, Alexandre M. Ramos", "source": "Earth's Future", "published": "2021-11", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1029/2024ef004553", "title": "Climate‐Driven Projections of Future Global Wetlands Extent", "summary": "Wetlands are crucial components of the Earth's system, interacting with various processes such as the hydrological cycle, energy exchanges with the atmosphere, and global nitrogen and carbon cycles. The future trajectory of wetlands is anticipated to be influenced not only by direct human activities, but also by climate change. Here we present our assessment of climate‐driven global changes in wetlands extent, focusing on the main wetland complexes. We used an approach based on the Topographic Hydrological model (TOPMODEL) and soil liquid water content projections from 14 models of the Coupled Model Intercomparison Project Phase 6 (CMIP6). Our analysis reveals a consistent decrease in wetlands extent in the Mediterranean, Central America, and northern South America, with a substantial loss of 28% in the western Amazon Basin for the end of the 21st century (2081–2100) under the SSP370 scenario. Conversely, Central Africa exhibits an increase in wetlands extent, except in the Congo Basin. Nevertheless, most of the areas studied (80%) present uncertain results, due to conflicting projections of changes between the models. Notably, we show that there is significant uncertainty among CMIP6 models regarding liquid soil water content in high latitudes. By narrowing our focus to 10 models, which seem to better represent the thawing of permafrost, we obtain a better inter‐model agreement. We then find a modest declines in the overall global area (<5%), but an average loss of 13% beyond 50°N. Specific areas like the Hudson Bay Lowlands experiencing a 21% decrease and the Western Sibe", "link": "https://doi.org/10.1029/2024ef004553", "authors": "Lucas Hardouin, Bertrand Decharme, Jeanne Colin, Christine Delire", "source": "Earth's Future", "published": "2024-9", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "uncertainty"]}, {"key": "doi:10.1029/2024ef005185", "title": "Dynamical Factors Heavily Modulate the Future Increase of Sub‐Daily Extreme Precipitation in the Alpine‐Mediterranean Region", "summary": "Quantifying the future probability of sub‐daily extreme precipitation in a changing climate is crucial for risk management, engineering, and insurance. Kilometer‐scale convection‐permitting climate models (CPMs) represent convective precipitation and complex terrain more realistically than other climate models, thereby enhancing the representation of sub‐daily extremes. This study employs a novel statistical approach to evaluate projected changes in extreme sub‐daily precipitation and provides a physical interpretation of their driving processes. It focuses on the complex‐topography area of northern Italy, where resides almost half of the Italian population and a significant portion of the Italian economy, with a rich diversity in industry, agriculture, tourism. We use precipitation data from a CPMs ensemble covering three periods: historical (1996–2005), near future (2041–2050), far future (2090–2099) under the RCP8.5 scenario. Sub‐daily to daily precipitation extremes with return periods up to 100 years are examined. We find a general intensification of extremes across all durations (from 1 to 24 hr), stronger at shorter durations and rarer probabilities. Spatial patterns vary with duration, with higher and significant increases emerging in mountainous areas in Eastern Alps and North Apennines. The detected changes cannot be explained by thermodynamics alone, highlighting the modulating role of the changes in atmospheric dynamics. These findings are crucial for enhancing risk management strategies and adapting to natural hazards in a warming climate. This approach may be ", "link": "https://doi.org/10.1029/2024ef005185", "authors": "Eleonora Dallan, Francesco Marra, Giorgia Fosser, Marco Marani, Marco Borga", "source": "Earth's Future", "published": "2024-11-28", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1029/2021ef002409", "title": "Detectable Human Influence on Changes in Precipitation Extremes Across China", "summary": "This study explored the human influence on the observed changes in precipitation extremes across China for the period of 1961–2014 by the latest simulations from the Coupled Model Intercomparison Project Phase 6 (CMIP6). Changes in observations and CMIP6 simulations under different external forcings for annual total wet‐day precipitation (PRCPTOT), the number of heavy precipitation days (R10 mm), very wet days (R95p), extremely wet days (R99p), the maximum 1‐day precipitation amount (RX1day), and the maximum 5‐day precipitation amount (RX5day) are compared using a regularized optimal fingerprinting method. The results show that both anthropogenic (ANT) and greenhouse gas (GHG) experiments generally exhibit increasing trends in precipitation extremes over China, agreeing with the overall observed increases. The ANT influence is robustly detected for R95p, R99p, RX1day, and RX5day over China, with clear separation from the natural forcing. Additionally, the GHG signal is also detectable for R95p, R99p, and RX1day but separated from the natural and other ANT forcings for only R99p and RX1day and from the natural and ANT aerosol forcings for only RX5day. Thus, the intensified precipitation extremes can be attributed to human influence dominated by the GHG effect. However, detections fail for PRCPTOT and R10 mm. The ANT aerosol forcing may partly offset the role of the GHG responses to observed increases despite being undetectable. Based on the detection and attribution results, the observation‐constrained projections indicate that precipitation extremes are projected to signifi", "link": "https://doi.org/10.1029/2021ef002409", "authors": "Huiwen Xu, Huopo Chen, Huijun Wang", "source": "Earth's Future", "published": "2022-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "extreme*"]}, {"key": "doi:10.1002/2013ef000185", "title": "Observational‐ and model‐based trends and projections of extreme precipitation over the contiguous United States", "summary": "Historical and projected trends in extreme precipitation events are examined in Coupled Model Intercomparison Project 5 ( CMIP5 ) models and observations, over the contiguous United States ( CONUS ), using several approaches. This study updates earlier studies that have used the extreme precipitation index ( EPI ) to assess observations and goes further by using the EPI to evaluate available climate model simulations. An increasing trend over the CONUS was found in the EPI , with large differences among seven subregions of the United States. Median of CMIP5 simulations also finds an increasing trend in the EPI , but with a smaller magnitude than the observations. Model spread is large and in most cases bigger than the model signal itself. Statistically significant (95th confidence level) increasing trends in the observational‐based EPI occur over the Midwest and Eastern regions, while most decreasing trends occur over Western regions. Some models give negative correlation coefficients relative to observations. However, some ensemble members, for most models, show correlation coefficients greater than 0.5. Projections of extreme precipitation event frequency, for representative concentration pathway ( RCP ) scenarios 4.5 and 8.5, show increasing trends over the CONUS . Both scenarios give a steady increase throughout the period but the RCP 4.5 signal is smaller in magnitude. Overall, the RCP scenarios show an increase across all regions with the exception of some variability between decades in some regions for RCP 4.5. For the CONUS model spread is smaller than the projected", "link": "https://doi.org/10.1002/2013ef000185", "authors": "Emily Janssen, Donald J. Wuebbles, Kenneth E. Kunkel, Seth C. Olsen, Alex Goodman", "source": "Earth's Future", "published": "2014-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1029/2024ef004845", "title": "Global Assessment of Compound Climate Extremes and Exposures of Population, Agriculture, and Forest Lands Under Two Climate Scenarios", "summary": "Climate change is expected to increase the global occurrence and intensity of heatwaves, extreme precipitation, and flash droughts. However, it is not well understood how the compound heatwave, extreme precipitation, and flash drought events will likely change, and how global population, agriculture, and forest will likely be exposed to these compound events under future climate change scenarios. This research uses eight CMIP6 climate models to assess the current and future global compound climate extreme events, as well as population, agriculture, and forestry exposures to these events, under two climate scenarios, Shared Socioeconomic Pathways (SSP), SSP1‐2.6 and SSP5‐8.5 for three time periods: early‐, mid‐, and late‐ 21st century. Climate extremes are derived for heatwaves, extreme precipitation, and flash droughts using locational‐dependent thresholds. We find that compound heatwaves and flash drought events result in the largest increases in exposure of populations, agriculture, and forest lands, under SSP5‐8.5 late‐century projections of sequential heatwaves and flash droughts. Late‐century projections of sequential heatwaves and flash droughts show hot spots of exposure increases in population exposure greater than 50 million person‐events in China, India, and Europe; increases in agriculture land exposures greater than 90 thousand km 2 ‐events in China, South America, and Oceania; and increase in forest land exposure greater than 120 thousand km 2 ‐events in Oceania and South America regions when compared to the historical period. The findings from this study can b", "link": "https://doi.org/10.1029/2024ef004845", "authors": "Tayler A. Schillerberg, Di Tian", "source": "Earth's Future", "published": "2024-9", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india*", "cmip6", "precipitation", "extreme*"]}, {"key": "doi:10.1029/2023ef003983", "title": "KNMI'23 Climate Scenarios for the Netherlands: Storyline Scenarios of Regional Climate Change", "summary": "This paper presents the methodology for the construction of the KNMI'23 national climate scenarios for the Netherlands. We have developed six scenarios, that cover a substantial part of the uncertainty in CMIP6 projections of future climate change in the region. Different sources of uncertainty are disentangled as much as possible, partly by means of a storyline approach. Uncertainty in future emissions is covered by making scenarios conditional on different SSP scenarios (SSP1‐2.6, SSP2‐4.5, and SSP5‐8.5). For each SSP scenario and time horizon (2050, 2100, 2150), we determine a global warming level based on the median of the constrained estimates of climate sensitivity from IPCC AR6. The remaining climate model uncertainty of the regional climate response at these warming levels is covered by two storylines, which are designed with a focus on the annual and seasonal mean precipitation response (a dry‐trending and wet‐trending variant for each SSP). This choice was motivated by the importance of future water management to society. For users with specific interests we provide means how to account for the impact of the uncertainty in climate sensitivity. Since CMIP6 GCM data do not provide the required spatial detail for impact modeling, we reconstruct the CMIP6 responses by resampling internal variability in a GCM‐RCM initial‐condition ensemble. The resulting climate scenarios form a detailed storyline of plausible future climates in the Netherlands. The data can be used for impact calculations and assessments by stakeholders, and will be used to inform policy making in dif", "link": "https://doi.org/10.1029/2023ef003983", "authors": "Karin van der Wiel, Jules Beersma, Henk van den Brink, Folmer Krikken, Frank Selten, Camiel Severijns", "source": "Earth's Future", "published": "2024-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "uncertainty"]}, {"key": "doi:10.1029/2021ef002487", "title": "Hydrological Intensification Will Increase the Complexity of Water Resource Management", "summary": "Global warming intensifies the hydrological cycle by altering the rate of water fluxes to and from the terrestrial surface, resulting in an increase in extreme precipitation events and longer dry spells. Prior hydrological intensification work has largely focused on precipitation without joint consideration of evaporative demand changes and how plants respond to these changes. Informed by state‐of‐the‐art climate models, we examine projected changes in hydrological intensification and its role in complicating water resources management using a framework that accounts for precipitation surplus and evaporative demand. Using a metric that combines the difference between daily precipitation and daily evaporative demand (surplus events) and consecutive days when evaporative demand exceeds precipitation (deficit time), we show that, globally, surplus events will become larger (+11.5% and +18.5% for moderate and high emission scenarios, respectively) and the duration between them longer (+5.1%; +9.6%) by the end of the century, with the largest changes in the northern latitudes. The intra‐annual occurrence of these extremes will stress existing water management infrastructure in major river basins, where over one third of years during 2070–2100 under a moderate emissions scenario will be hydrologically intense (large intra‐annual increases in surplus intensity and deficit time), tripling that of the historical baseline. Larger increases in hydrologically intense years are found in basins with large reservoir capacity (e.g., Amazon, Congo, and Danube River Basins), which have signi", "link": "https://doi.org/10.1029/2021ef002487", "authors": "Darren L. Ficklin, Sarah E. Null, John T. Abatzoglou, Kimberly A. Novick, Daniel T. Myers", "source": "Earth's Future", "published": "2022-3", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1029/2025ef007928", "title": "Observation‐Constrained Projections Reveal Robust Streamflow Increases in Indian Rivers", "summary": "Reliable streamflow projections are essential for effective water‐resource management and climate adaptation. However, streamflow projections are associated with large uncertainties due to divergent precipitation projections from climate models, which directly propagate into hydrological estimates. Observation‐constrained approaches that condition future projections on past observations have been shown to reduce such uncertainties; however, they have not been applied to streamflow projections across the Indian rivers. Using long‐term streamflow and global mean surface temperature observations, climate model projections, hydrological modeling, and a Bayesian detection–attribution framework, we developed observational constrained streamflow projections for nine major Indian rivers. The method reduces the 5–95% confidence interval of future streamflow projections by nearly one‐third compared to raw multimodel ensembles, with constraint strength controlled by internal streamflow variability and inter‐model spread in the unconstrained ensemble. Projection uncertainty is further reduced to ∼20% when considering projections based only on skillful climate models. Constrained projections indicate significant increases in streamflow in the near‐, mid‐, and far‐future periods, except for the Cauvery basin, which shows a near‐term decline. Applying the method to raw precipitation projections reveals comparable constraint strength and increases confidence in the results, given the strong dependence of Indian river flows on precipitation. Our findings underscore the importance of combini", "link": "https://doi.org/10.1029/2025ef007928", "authors": "Dipesh Singh Chuphal, Vimal Mishra", "source": "Earth's Future", "published": "2026-3", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india*", "precipitation", "uncertainty"]}, {"key": "doi:10.1029/2020ef001762", "title": "Significant Land Contributions to Interannual Predictability of East Asian Summer Monsoon Rainfall", "summary": "Marked by large interannual variability, East Asian summer monsoon (EASM) rainfall has profound socio‐economic impacts through its dominant influence on floods and droughts. Improving predictions of the interannual variations of EASM rainfall has important implications for over 20% of the world's population. While coupled modeling systems have demonstrated some prediction skill related to the El Niño Southern Oscillation with remote influence on EASM rainfall, the impact of soil moisture has heretofore not been systematically investigated. Using a weakly coupled data assimilation (WCDA) system to constrain the soil moisture and soil temperature in a coupled climate model with a global land data assimilation product, this study demonstrates significant improvements in simulating the interannual variations of EASM rainfall, capturing the notable shift to a “wetter‐South‐drier‐North” rainfall pattern in China in the early 1990s. Hindcast simulations initialized with the well‐balanced states from a coupled simulation with WCDA also show significant multi‐year rainfall prediction skill over East China and Tibetan Plateau. Improvements in predicting the EASM rainfall are attributed to the strong land‐atmosphere coupling in large areas over China, which allows improved predictions of soil moisture to influence precipitation through soil moisture‐precipitation feedback, and the effects of land anomalies on the EASM circulation. This study highlights the significant contribution of land to the interannual predictability of EASM rainfall, with a great potential to advance skillful in", "link": "https://doi.org/10.1029/2020ef001762", "authors": "Pengfei Shi, Hui Lu, L. Ruby Leung, Yujun He, Bin Wang, Kun Yang", "source": "Earth's Future", "published": "2021-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["monsoon", "precipitation"]}, {"key": "doi:10.1029/2022ef002830", "title": "Projected Changes in Increased Drought Risks Over South Asia Under a Warmer Climate", "summary": "Every year, millions of people are at risk due to droughts in South Asia (SA). The likely impacts of droughts are projected to increase with global warming. This study uses the new ensemble mean of 23 global climate models from the Coupled Model Intercomparison Project phase 6 (CMIP6), population and gross domestic product (GDP) projections to quantify future changes in increasing drought risks and associated socioeconomic exposure across SA and its subregions under 1.5°C and 2°C of warming. We used two shared socioeconomic pathways (SSPs), SSP2‐4.5 and SSP5‐8.5. The most likely realization copula functions are used to model the joint distribution of drought severity and duration. Simultaneously, changes in the bivariate return period are calculated under a warming climate. The frequency of 50‐year historical droughts (under a bivariate framework) might double across 80% of the SA land area under 1.5°C of warming. Conversely, 12% of SA landmasses may suffer extreme droughts under 2°C of warming. The severe drought episode frequency is expected to increase under 1.5°C (40%–75%) and 2°C (60%–90%) of warming relative to the recent climate. The largest exposure increase is projected in R2 and R4, then R1. Additionally, 75% (65%) of the SA population (GDP) could suffer from increased drought risks under the 1.5°C warmer climate, whereas the additional 0.5°C warming will lead to an unbearable regional situation. Limiting global warming to 1.5°C compared with 2°C can significantly reduce the drought risk influence in SA. These findings can help disaster‐risk managers to adopt clim", "link": "https://doi.org/10.1029/2022ef002830", "authors": "Irfan Ullah, Xieyao Ma, Temesgen Gebremariam Asfaw, Jun Yin, Vedaste Iyakaremye, Farhan Saleem", "source": "Earth's Future", "published": "2022-10", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "extreme*"]}, {"key": "doi:10.1002/2017ef000715", "title": "Satellite‐Based Assessment of Rainfall‐Triggered Landslide Hazard for Situational Awareness", "summary": "Determining the time, location, and severity of natural disaster impacts is fundamental to formulating mitigation strategies, appropriate and timely responses, and robust recovery plans. A Landslide Hazard Assessment for Situational Awareness (LHASA) model was developed to indicate potential landslide activity in near real‐time. LHASA combines satellite‐based precipitation estimates with a landslide susceptibility map derived from information on slope, geology, road networks, fault zones, and forest loss. Precipitation data from the Global Precipitation Measurement (GPM) mission are used to identify rainfall conditions from the past 7 days. When rainfall is considered to be extreme and susceptibility values are moderate to very high, a “nowcast” is issued to indicate the times and places where landslides are more probable. When LHASA nowcasts were evaluated with a Global Landslide Catalog, the probability of detection (POD) ranged from 8% to 60%, depending on the evaluation period, precipitation product used, and the size of the spatial and temporal window considered around each landslide point. Applications of the LHASA system are also discussed, including how LHASA is used to estimate long‐term trends in potential landslide activity at a nearly global scale and how it can be used as a tool to support disaster risk assessment. LHASA is intended to provide situational awareness of landslide hazards in near real‐time, providing a flexible, open‐source framework that can be adapted to other spatial and temporal scales based on data availability.", "link": "https://doi.org/10.1002/2017ef000715", "authors": "Dalia Kirschbaum, Thomas Stanley", "source": "Earth's Future", "published": "2018-3", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1029/2024ef004916", "title": "Future Patterns of Compound Dry and Hot Summers and Their Link to Soil Moisture Droughts in Europe", "summary": "Compound dry and hot extreme (CDHE) summers in Europe, like 2015, 2018 and 2022, have wide ranging impacts: heat exacerbates moisture shortages during dry periods whereas water demand rises. Current studies of CDHE are mostly conducted in observations or coarse‐resolution global climate model large ensembles. While the latter allow for the assessment of rare CDHE against the backdrop of internal variability, global ensembles fail in providing robust climate change signals at impact‐relevant scales. To overcome this issue, we exploit a regional 50‐member single‐model initial condition large ensemble (SMILE). The SMILE provides an extensive database of CDHE in a current climate and at two global warming levels (+2°C, +3°C) across Europe in high geographical detail. We identify Northern France, Southern Germany, Switzerland, Southern Ireland, and the western coasts of the Black Sea with currently low CDHE frequency as emerging hotspots. These regions experience a tenfold increase of CDHE under global warming conditions, in parts resulting in yet unseen heat and dryness. Temperature is the dominant driver of frequency increases, except for western Europe. Additionally, tail dependence strengthens in regions with large increases in CDHE frequency. In European agricultural areas, soil moisture shows stronger negative correlations with CDHE intensity than with precipitation or temperature. Finally, our results indicate fewer CDHE summers in a +2°C world compared to a +3°C world, highlighting the importance of climate mitigation to reduce the frequency of these multi‐hazard events.", "link": "https://doi.org/10.1029/2024ef004916", "authors": "Andrea Böhnisch, Elizaveta Felsche, Magdalena Mittermeier, Benjamin Poschlod, Ralf Ludwig", "source": "Earth's Future", "published": "2025-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1029/2018ef001001", "title": "How Much Information Is Required to Well Constrain Local Estimates of Future Precipitation Extremes?", "summary": "Global warming is expected to increase the amount of atmospheric moisture, resulting in heavier extreme precipitation. Various studies have used the historical relationship between extreme precipitation and temperature ( temperature scaling ) to provide guidance about precipitation extremes in a future warmer climate. Here we assess how much information is required to robustly identify temperature scaling relationships, and whether these relationships are equally effective at different times in the future in estimating precipitation extremes everywhere across North America. Using a large ensemble of 35 North American regional climate simulations of the period 1951–2100, we show that individual climate simulations of length comparable to that of typical instrumental records are unable to constrain temperature scaling relationships well enough to reliably estimate future extremes of local precipitation accumulation for hourly to daily durations in the model's climate. Hence, temperature scaling relationships estimated from the limited historical observations are unlikely to be able to provide reliable guidance for future adaptation planning at local spatial scales. In contrast, well‐constrained temperature scaling relations based on multiple regional climate simulations do provide a feasible basis for accurately projecting precipitation extremes of hourly to daily durations in different future periods over more than 90% of the North American land area.", "link": "https://doi.org/10.1029/2018ef001001", "authors": "Chao Li, Francis Zwiers, Xuebin Zhang, Guilong Li", "source": "Earth's Future", "published": "2019-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1029/2023ef004333", "title": "Increasing Risk of a “Hot Eastern‐Pluvial Western” Asia", "summary": "Observations have revealed that the deadly “hot eastern‐pluvial western” climate pattern in Asia in summer 2022 is by no means an exception. In recent decade this pattern is becoming much more frequent owing to the notable westward extension and enhancement of the western Pacific subtropical high (WPSH). The anomalously enhanced WPSH fills the gap in geopotential heights between the Arabian Sea‐Iranian Plateau and the western Pacific, produces a heat dome over eastern Asia and intensifies the moisture convergence over western Asia by changing the water vapor transportation path. Projections of 19 CMIP6 models show that both the temperature in eastern Asia and precipitation in western Asia will remarkably increase under Shared Socioeconomic Pathway (SSP) 2‐4.5, SSP 3‐7.0, and SSP 5‐8.5 scenarios, with temperature anomalies 0.8°C, 1.5°C, and 2.4°C higher and the percentages of precipitation anomaly 6.3%, 9.4%, and 12.5% larger than the reference period in the near, middle, and long terms under the moderate emission scenario (SSP2‐4.5). Therefore, the “hot eastern‐pluvial western” Asia is becoming a new normal and exacerbating the risk of compound disasters.", "link": "https://doi.org/10.1029/2023ef004333", "authors": "Ting Ding, Hui Gao, Xiang Li", "source": "Earth's Future", "published": "2024-4-29", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation"]}, {"key": "doi:10.1029/2023ef003583", "title": "Future Projections of Extreme Integrated Water Vapor Transport and Population Exposure Over the Asian Monsoon Region", "summary": "Global warming leads to an intensification of the water cycle and an increase in extreme climate events. Most previous researchers have used precipitation to project extreme hydrological changes. However, compared with precipitation, global climate models (GCMs) have a better performance in simulating the integrated vapor transport (IVT). IVT is thus a reliable tool for understanding how hydrological extremes may change in the future. In this study, we first discuss the relationship between IVT and precipitation over the Asian monsoon (AM) region during 1979–2014. We then assess the climatology, variability and extremes of IVT over the AM region and subregions using 16 GCMs from CMIP6. We further apply GCMs to project changes in the magnitude and probability of dangerous extreme IVT events (e.g., 20‐, 50‐ and 100‐year events) in the future. Finally, we quantify the population exposure to extreme IVT events, and explain change in exposure and its uncertainty. Results show that CMIP6 GCMs capture the spatial distribution of IVT well; the intensity of simulated IVT is lower than the ERA5 IVT. Under global warming of 1.5, 2, and 3°C, the magnitude of extreme events, which is independent of the return period (RP), increases over the AM region with relative changes of about 7%, 12%, and 21%, respectively. The probability increases consistently with global warming and the RP. The increase in exposure for the South Asian monsoon (East Asian monsoon) region is both contributed by more extreme IVT events and higher (fewer) population counts; the former has a larger proportion.", "link": "https://doi.org/10.1029/2023ef003583", "authors": "Lianyi Guo, Yi Shi, Yang Zhao", "source": "Earth's Future", "published": "2023-8", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["monsoon", "cmip6", "precipitation", "extreme*", "uncertainty"]}, {"key": "doi:10.1029/2021ea001738", "title": "Validation of GPM IMERG Extreme Precipitation in the Maritime Continent by Station and Radar Data", "summary": "The Maritime Continent (MC) is a region subject to high impact weather (HIW) events, which are still poorly predicted by numerical weather prediction (NWP) models. To improve predictability of such events, NWP needs to be evaluated against accurate measures of extreme precipitation across the whole MC. With its global spatial coverage at high spatio‐temporal resolution, the Global Precipitation Measurement (GPM) data set is a suitable candidate. Here we evaluate extreme precipitation in the Integrated Multi‐Satellite Retrieval for GPM (IMERG) V06B product against station data from the Global Historical Climatology Network in Malaysia and the Philippines. We find that the high intragrid spatial variability of precipitation extremes results in large spatial sampling errors when each IMERG grid box is compared with individual co‐located precipitation measurements, a result that may explain discrepancies found in earlier studies in the MC. Overall, IMERG daily precipitation is similar to station precipitation between the 85th and 95th percentile, but tends to overestimate above the 95th. IMERG data were also compared with radar data in western Peninsular Malaysia for sub‐daily timescales. Allowing for uncertainties in radar data, the analysis suggests that the 95th percentile is still suitable for NWP evaluation of extreme sub‐daily precipitation, but that the rainfall rates diverge at higher percentiles. Hence, our overall recommendation is that the 95th percentile be used to evaluate NWP forecasts of HIW on daily and sub‐daily time scales against IMERG data, but that higher p", "link": "https://doi.org/10.1029/2021ea001738", "authors": "Nicolas A. Da Silva, Benjamin G. M. Webber, Adrian J. Matthews, Matthew M. Feist, Thorwald H. M. Stein, Christopher E. Holloway", "source": "Earth and Space Science", "published": "2021-7", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1029/2022ea002671", "title": "Fate of Rainfall Over the North Indian States in the 1.5 and 2°C Warming Scenarios", "summary": "Rise in mean temperature put a great deal of uncertainty about how weather and climate extremes may play out, particularly in India's varied climatic zones. Consequently, it is important to understand the possible changes in both magnitude and direction of weather and climate extremes like rainfall for different warming levels of 1.5 and 2°C scenarios concerning preindustrial and present levels. Hence in the present study, the precipitation behavior of seven North Indian states that is, Haryana, Himachal Pradesh, J&K, Punjab, Rajasthan, Uttar Pradesh, and Uttarakhand carefully studied using CMIP5 models. Future projections of precipitation has been done for the Paris Agreement global warming level of 1.5 and 2°C scenarios. Along with model validation and future projections of precipitation, the return period of extreme rainfall is also discussed to understand the behavior of the occurrence of extreme precipitation. Statistical analysis shows that the ensemble means have the least error as compared to the other six CMIP5 models. Therefore, future analysis has been done with the ensemble mean. Our findings show that the precipitation is likely to decrease in the 1.5°C scenarios, while it is likely to increase in the 2°C scenarios. The occurrence and intensity of extreme rainfall events are likely to be more frequent in all the models. The return period of the extreme rainfall events is likely to increase in all the states in both the warming scenarios. A three‐fold rise is likely to increase extreme rainfall events in the 2°C scenario.", "link": "https://doi.org/10.1029/2022ea002671", "authors": "Kanhu Charan Pattnayak, Amit Awasthi, Kuldeep Sharma, Bibhuti Bhusan Pattnayak", "source": "Earth and Space Science", "published": "2023-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india*", "precipitation", "extreme*", "uncertainty"]}, {"key": "doi:10.1029/2025ea004363", "title": "Improving “23.07” Heavy Rainstorm Simulation Through Assimilating FY‐3E MWTS‐3 Radiance Data", "summary": "FengYun‐3E (FY‐3E) satellite, launched on 5 July 2021, is equipped with the third‐generation Microwave Temperature Sounder (MWTS‐3). Two window channels of MWTS‐3 are used to build a cloud detection module, and efficient assimilation of MWTS‐3 clear‐sky radiance data is implemented in the Weather Research and Forecasting Model (WRF). To assess the influence of assimilating MWTS‐3 radiances on extreme precipitation weather forecasting, a heavy rainstorm event that occurred in North China from 29 July to 2 August 2023, has been selected. After assimilating MWTS‐3 radiance data, the geopotential height field adjusted, leading to a northwestward shift of the Western Pacific Subtropical High as well as an eastward adjustment of the weather system. The forecasts with assimilated MWTS‐3 data reduced the root mean square error of temperature, zonal wind, and meridional wind, with clear improvements in temperature forecast skill at the 100–400 hPa levels within the first 33 hr of the forecast period. The 6–hr maximum rainfall center located southwest of Beijing was more successfully reproduced in the model simulation. Additionally, the precipitation forecast skill above the threshold of 15 mm was improved. Moreover, the water vapor transport and vertical motion conditions in Beijing has improved after assimilating MWTS‐3 data, which are likely to be contributing factors to the enhancements in the precipitation forecasting performance.", "link": "https://doi.org/10.1029/2025ea004363", "authors": "Shengjie Zhu, Deqin Li, Shibo Gao, Qian Xie, Xiao Pan", "source": "Earth and Space Science", "published": "2025-5", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1029/2026ea005073", "title": "An Enhanced Hydrometeor Detection Algorithm for Precipitation Identification in GPM", "summary": "Precipitation is a fundamental component of the climate system, linking the water and energy cycles and regulating climate variability, feedbacks, and extremes. Accurate precipitation detection provides essential constraints on the global water cycles and serves as a key benchmark for evaluating climate model performance. The Global Precipitation Measurement (GPM) mission, equipped with the first spaceborne dual‐frequency radar (DPR), offers unprecedented capability for observing the three‐dimensional structure of global precipitation, including phase, intensity and microphysical properties. However, existing precipitation detection algorithm does not explicitly account for weak radar signals, limiting their ability to capture the early development and full evolution of precipitation systems. In this study, we propose an enhanced hydrometeor detection algorithm for GPM DPR observations that combines a bilateral filter technique and a power‐probability weighting scheme. Through effectively suppressing background noise while preserving physically meaningful weak signals, our method can significantly improve the detection of small hydrometeors at high altitudes and along precipitation boundaries—regions that are frequently missed by the current GPM operational algorithm. Validation using collocated CloudSat observations demonstrates substantial improvements of our method, with increases of 63.6% the Ka band and a 37.5% in the Ku band. These advancements provide a more comprehensive depiction of precipitation systems structure and offer improved observational support for enhanc", "link": "https://doi.org/10.1029/2026ea005073", "authors": "Yucheng Qiu, Jinming Ge, Xiaojie Li, Jianping Huang, Xiuqing Hu, BoChun Liu", "source": "Earth and Space Science", "published": "2026-11", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1029/2024ea003956", "title": "Moisture Sources and Atmospheric Circulation Patterns for Extreme Rainfall Event Over North China Plain From 29 July to 2 August 2023", "summary": "Two years following the extreme rainfall event in Henan Province in July 2021, North China was struck by another significant rainfall episode in late July and early August 2023 (the “23.7” event). This recent event, surpassed only by the August 1963 deluge in Henan province, precipitated extensive disasters across the Beijing‐Tianjin‐Hebei region (BTH) over the North China Plain. Understanding the mechanisms underlying such extreme precipitation events, including moisture sources and atmospheric circulation patterns, in the context of synoptic‐scale systems is crucial for accurate predictions and effective disaster mitigation in the future. To achieve this, this study utilized a vertically integrated water vapor transport method and a Water Accounting model to investigate the moisture sources and pathways of the “23.7” event. A systematic analysis of circulation patterns was also conducted based on the ERA5 reanalysis. The results showed that the western North Pacific and Indian Ocean contributed 38.1% and 18.6%, respectively, to the extreme rainfall over the BTH region. Additionally, terrestrial moisture sources contributed 16.59%, playing a significant role in the event. The stable and moisture‐laden air was transported to the BTH due to the influence of binary tropical cyclones “Doksuri” and “Khanun,” as well as the western Pacific subtropical high‐pressure system. Convergence and updraft dynamics trigger convective processes modulated by vortices and topography. The findings of this study help to build a deeper understanding of the formation processes and mechanisms beh", "link": "https://doi.org/10.1029/2024ea003956", "authors": "Hui Guo, Wanting Hu, Chen Yang, Fang Wan", "source": "Earth and Space Science", "published": "2024-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india*", "precipitation", "extreme*"]}, {"key": "doi:10.1029/2021ea001950", "title": "Sentinel‐Based Inventory of Thermokarst Lakes and Ponds Across Permafrost Landscapes on the Qinghai‐Tibet Plateau", "summary": "Thermokarst lakes and ponds (hereafter referred to as thaw lakes) play an important role in the permafrost regions by regulating hydrology, ecology, and biogeochemistry. However, detailed quantitative information on thaw lake extent and distribution remains poorly resolved across the entire permafrost regions on the Qinghai‐Tibet Plateau (QTP). Here, we applied the random forest (RF) model and manual visual vectorization methods to extract thaw lake boundaries on the QTP based on Sentinel‐2 images. Accuracy assessment was comprehensively demonstrated regarding the inherent spatial resolution of imagery and RF model performance. The results showed that the accumulated uncertainty of the total thaw lake area was ±5.75 km 2 , and the mean accuracy (91.9%) from field‐measured boundaries of 132 thaw lakes supported the accuracy of this inventory. A total of ∼161,300 thaw lakes with sizes ranging from 500 m 2 to 3 km 2 were detected, with a total area of ∼2,825.45 ± 5.75 km 2 . Most thaw lakes were detected in the continuous permafrost type (94.1%) and within the elevations of 4,500–5,000 m (68.4%). The small thaw lakes (<10,000 m 2 ) predominated the total lake number (78.9%) but contributed to a small portion of the total lake area (12.7%). Spatial distributions of thaw lakes in terms of different climatic and environmental conditions were also comprehensively explored, including temperature, precipitation, ground thermal stability, active layer thickness, vegetation, soil properties, and underground ice content. This inventory is expected to be incorporated into Earth system m", "link": "https://doi.org/10.1029/2021ea001950", "authors": "Zhiqiang Wei, Zhiheng Du, Lei Wang, Jiahui Lin, Yaru Feng, Qian Xu", "source": "Earth and Space Science", "published": "2021-11", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "uncertainty"]}, {"key": "doi:10.1002/jgrd.50416", "title": "Diagnosing evaporative fraction over land from boundary‐layer clouds", "summary": "The potential use of continental fair‐weather shallow cumuli as a way to retrieve the daily surface evaporative fraction over land is evaluated in convective conditions. The proposed method utilizes the fact that both the timing of cloud occurrence and the cloud‐base height at the time of occurrence provide strong constraints on the surface energy balance and evaporative fraction. The retrieval is especially reliable in the presence of relatively stable and humid‐free troposphere profiles. The advantage of the method is that it provides a more direct estimate of the surface evaporative fraction than indirect estimation based on inversion of a highly parameterized land‐surface model. In addition, the evaporative fraction is obtained at a scale of a few kilometers, which is more pertinent for weather and climate studies. The retrieval strategy is tested and validated for three contrasting climates: the U.S. southern Great Plains, West Africa, and the Netherlands. We suggest that the use of satellite observations of shallow cumuli can help constrain the retrieval of the surface evaporative fraction within a data assimilation scheme/reanalysis.", "link": "https://doi.org/10.1002/jgrd.50416", "authors": "Pierre Gentine, Craig R. Ferguson, Albert A. M. Holtslag", "source": "JGR: Atmospheres", "published": "2013-8-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": ["Pierre Gentine"], "boosts": []}, {"key": "doi:10.1029/2024jd042204", "title": "Mesoscale Convective Systems Tracking Method Intercomparison (MCSMIP): Application to DYAMOND Global km‐Scale Simulations", "summary": "Global kilometer‐scale models represent the future of Earth system modeling, enabling explicit simulation of organized convective storms and their associated extreme weather. Here, we comprehensively evaluate tropical mesoscale convective system (MCS) characteristics in the DYAMOND (DYnamics of the atmospheric general circulation modeled on non‐hydrostatic domains) simulations for both summer and winter phases. Using 10 different feature trackers applied to simulations and satellite observations, we assess MCS frequency, precipitation, and other key characteristics. Substantial differences (a factor of 2–3) arise among trackers in observed MCS frequency and their precipitation contribution, but model‐observation differences in MCS statistics are more consistent across trackers. DYAMOND models are generally skillful in simulating tropical mean MCS frequency, with multi‐model mean biases ranging from −2%–8% over land and −8%–8% over ocean (summer vs. winter). However, most DYAMOND models underestimate MCS precipitation amount (23%) and their contribution to total precipitation (17%). Biases in precipitation contributions are generally smaller over land (13%) than over ocean (21%), with moderate inter‐model variability. While models better simulate MCS diurnal cycles and cloud shield characteristics, they overestimate MCS precipitation intensity and underestimate stratiform rain contributions (up to a factor of 2), particularly over land, albeit observational uncertainties exist. Additionally, models exhibit a wide range of precipitable water in the tropics compared to reanaly", "link": "https://doi.org/10.1029/2024jd042204", "authors": "Zhe Feng, Andreas F. Prein, Julia Kukulies, Thomas Fiolleau, William K. Jones, Ben Maybee", "source": "JGR: Atmospheres", "published": "2025-4-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1002/2016jd025842", "title": "Large uncertainties in observed daily precipitation extremes over land", "summary": "We explore uncertainties in observed daily precipitation extremes over the terrestrial tropics and subtropics (50°S–50°N) based on five commonly used products: the Climate Hazards Group InfraRed Precipitation with Stations (CHIRPS) dataset, the Global Precipitation Climatology Centre‐Full Data Daily (GPCC‐FDD) dataset, the Tropical Rainfall Measuring Mission (TRMM) multi‐satellite research product (T3B42 v7), the Precipitation Estimation from Remotely Sensed Information using Artificial Neural Networks–Climate Data Record (PERSIANN‐CDR), and the Global Precipitation Climatology Project's One‐Degree Daily (GPCP‐1DD) dataset. We use the precipitation indices R10mm and Rx1day, developed by the Expert Team on Climate Change Detection and Indices, to explore the behavior of “moderate” and “extreme” extremes, respectively. In order to assess the sensitivity of extreme precipitation
