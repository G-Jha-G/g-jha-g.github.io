ical Turbulence", "summary": "The immense computational cost of traditional numerical weather and climate models has sparked the development of machine learning (ML) based emulators. Because ML methods benefit from long records of training data, it is common to use data sets that are temporally subsampled relative to the time steps required for the numerical integration of differential equations. Here, we investigate how this often overlooked processing step affects the quality of an emulator's predictions. We implement two ML architectures from a class of methods called reservoir computing: (a) a form of Nonlinear Vector Autoregression (NVAR), and (b) an Echo State Network (ESN). Despite their simplicity, it is well documented that these architectures excel at predicting low dimensional chaotic dynamics. We are therefore motivated to test these architectures in an idealized setting of predicting high dimensional geophysical turbulence as represented by Surface Quasi‐Geostrophic dynamics. In all cases, subsampling the training data consistently leads to an increased bias at small spatial scales that resembles numerical diffusion. Interestingly, the NVAR architecture becomes unstable when the temporal resolution is increased, indicating that the polynomial based interactions are insufficient at capturing the detailed nonlinearities of the turbulent flow. The ESN architecture is found to be more robust, suggesting a benefit to the more expensive but more general structure. Spectral errors are reduced by including a penalty on the kinetic energy density spectrum during training, although the subsampling re", "link": "https://doi.org/10.1029/2023ms003792", "authors": "Timothy A. Smith, Stephen G. Penny, Jason A. Platt, Tse‐Chun Chen", "source": "Journal of Advances in Modeling Earth Systems", "published": "2023-12", "first_seen": "2026-11-26T13:59:01+00:00", "score": 66, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr-d-18-0187.1", "title": "Neural Networks for Postprocessing Ensemble Weather Forecasts", "summary": "Ensemble weather predictions require statistical postprocessing of systematic errors to obtain reliable and accurate probabilistic forecasts. Traditionally, this is accomplished with distributional regression models in which the parameters of a predictive distribution are estimated from a training period. We propose a flexible alternative based on neural networks that can incorporate nonlinear relationships between arbitrary predictor variables and forecast distribution parameters that are automatically learned in a data-driven way rather than requiring prespecified link functions. In a case study of 2-m temperature forecasts at surface stations in Germany, the neural network approach significantly outperforms benchmark postprocessing methods while being computationally more affordable. Key components to this improvement are the use of auxiliary predictor variables and station-specific information with the help of embeddings. Furthermore, the trained neural network can be used to gain insight into the importance of meteorological variables, thereby challenging the notion of neural networks as uninterpretable black boxes. Our approach can easily be extended to other statistical postprocessing and forecasting problems. We anticipate that recent advances in deep learning combined with the ever-increasing amounts of model and observation data will transform the postprocessing of numerical weather forecasts in the coming decade.", "link": "https://doi.org/10.1175/mwr-d-18-0187.1", "authors": "Stephan Rasp, Sebastian Lerch", "source": "Monthly Weather Review", "published": "2018-11", "first_seen": "2026-11-26T13:59:01+00:00", "score": 66, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": ["Stephan Rasp", "Sebastian Lerch"], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1175/waf-d-24-0139.1", "title": "Leveraging Data-Driven Weather Models for Improving Numerical Weather Prediction Skill through Large-Scale Spectral Nudging", "summary": "Operational meteorological forecasting has long relied on physics-based numerical weather prediction (NWP) models. Recently, this landscape has faced disruption by the advent of data-driven artificial intelligence (AI)-based weather models, which offer tremendous computational performance and competitive forecasting accuracy. However, data-driven models for medium-range forecasting generally suffer from major limitations, including low effective resolution and a narrow range of predicted variables. This study illustrates the relative strengths and weaknesses of these competing paradigms using the physics-based Global Environmental Multiscale (GEM) and the AI-based GraphCast models. Analyses of their respective global predictions in physical and spectral space reveal that GraphCast-predicted large scales outperform GEM, particularly for longer lead times, even though fine scales predicted by GraphCast suffer from excessive smoothing. Building on this insight, a hybrid NWP–AI system is proposed, wherein temperature and horizontal wind components predicted by GEM are spectrally nudged toward GraphCast predictions at large scales, while GEM itself freely generates the fine-scale details critical for local predictability and weather extremes. This hybrid approach is capable of leveraging the strengths of GraphCast to enhance the prediction skill of the GEM model while generating a full suite of physically consistent forecast fields with a full power spectrum. Additionally, trajectories of tropical cyclones are predicted with enhanced accuracy without significant changes in inten", "link": "https://doi.org/10.1175/waf-d-24-0139.1", "authors": "Syed Zahid Husain, Leo Separovic, Jean-François Caron, Rabah Aider, Mark Buehner, Stéphane Chamberland, Ervig Lapalme, Ron McTaggart-Cowan", "source": "Weather and Forecasting", "published": "2025-9", "first_seen": "2026-11-26T13:59:01+00:00", "score": 66, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/nclimate3287", "title": "Understanding the regional pattern of projected future changes in extreme precipitation", "summary": "", "link": "https://doi.org/10.1038/nclimate3287", "authors": "S. Pfahl, P. A. O’Gorman, E. M. Fischer", "source": "Nature Climate Change", "published": "2017-5-15", "first_seen": "2026-11-26T13:59:01+00:00", "score": 66, "topics": ["Close to your work"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.37159", "title": "Physics-Guided Flow Matching: A Generative AI Framework for Global Total Electron Content Forecasting", "summary": "Accurate forecasting of global total electron content (TEC) is important for space weather monitoring and the reliable operation of satellite communication and navigation systems. We propose a physics-guided generative artificial intelligence (AI) framework for day-ahead global TEC forecasting. The framework builds on flow matching, which learns to gradually transform samples from an initial distribution into new samples that share the statistical characteristics of the target data. The proposed model incorporates ionospheric dynamics described by a partial differential equation (PDE) into this transformation process, guiding the changes between initial and target samples using physical knowledge. The model further combines the physical dynamics with statistical patterns captured from data to learn this transformation, adaptively adjusting their relative contributions at each location. The model is trained and evaluated using one year of global TEC data generated by the Thermosphere Ionosphere Electrodynamics General Circulation Model (TIEGCM). The results demonstrate that our model improves both spatial and temporal forecasting accuracy over representative benchmarks, including statistical, deep learning, and generative AI methods at all lead times and across latitudes. The average root mean square error (RMSE) is 39.2% lower than that of ConvLSTM and 23.8% lower than that of the same framework without physical guidance. The learned contribution weights vary systematically with latitude and across geographic locations, showing how the physical contribution changes across t", "link": "https://arxiv.org/abs/2610.37159", "authors": "Si-Tong Yang, Feng Ye, Xian Lu, Dong Lin, Benjamin C. Martinez", "source": "arXiv", "published": "2026-10-27", "first_seen": "2026-11-26T13:59:01+00:00", "score": 65, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["flow matching"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021ms002509", "title": "Learning to Correct Climate Projection Biases", "summary": "The fidelity of climate projections is often undermined by biases in climate models due to their simplification or misrepresentation of unresolved climate processes. While various bias correction methods have been developed to post‐process model outputs to match observations, existing approaches usually focus on limited, low‐order statistics, or break either the spatiotemporal consistency of the target variable, or its dependency upon model resolved dynamics. We develop a Regularized Adversarial Domain Adaptation (RADA) methodology to overcome these deficiencies, and enhance efficient identification and correction of climate model biases. Instead of pre‐assuming the spatiotemporal characteristics of model biases, we apply discriminative neural networks to distinguish historical climate simulation samples and observation samples. The evidences based on which the discriminative neural networks make distinctions are applied to train the domain adaptation neural networks to bias correct climate simulations. We regularize the domain adaptation neural networks using cycle‐consistent statistical and dynamical constraints. An application to daily precipitation projection over the contiguous United States shows that our methodology can correct all the considered moments of daily precipitation at approximately resolution, ensures spatiotemporal consistency and inter‐field correlations, and can discriminate between different dynamical conditions. Our methodology offers a powerful tool for disentangling model parameterization biases from their interactions with the chaotic evolution of", "link": "https://doi.org/10.1029/2021ms002509", "authors": "Baoxiang Pan, Gemma J. Anderson, André Goncalves, Donald D. Lucas, Céline J. W. Bonfils, Jiwoo Lee, Yang Tian, Hsi‐Yen Ma", "source": "Journal of Advances in Modeling Earth Systems", "published": "2021-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 65, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-22-0043.1", "title": "Seamless Lightning Nowcasting with Recurrent-Convolutional Deep Learning", "summary": "A deep learning model is presented to nowcast the occurrence of lightning at a 5-min time resolution 60 min into the future. The model is based on a recurrent-convolutional architecture that allows it to recognize and predict the spatiotemporal development of convection, including the motion, growth and decay of thunderstorm cells. The predictions are performed on a stationary grid, without the use of storm object detection and tracking. The input data, collected from an area in and surrounding Switzerland, comprise ground-based radar data, visible/infrared satellite data and derived cloud products, lightning detection, numerical weather prediction, and digital elevation model data. We analyze different alternative loss functions, class weighting strategies and model features, providing guidelines for future studies to select loss functions optimally and to properly calibrate the probabilistic predictions of their model. On the basis of these analyses, we use focal loss in this study but conclude that it only provides a small benefit over cross entropy, which is a viable option if recalibration of the model is not practical. The model achieves a pixelwise critical success index (CSI) of 0.45 to predict lightning occurrence within 8 km over the 60-min nowcast period, ranging from a CSI of 0.75 at a 5-min lead time to a CSI of 0.32 at a 60-min lead time. Significance Statement We have developed a method based on artificial intelligence to forecast the occurrence of lightning at 5-min intervals within the next hour from the forecast time. The method utilizes a neural network t", "link": "https://doi.org/10.1175/aies-d-22-0043.1", "authors": "Jussi Leinonen, Ulrich Hamann, Urs Germann", "source": "Artificial Intelligence for the Earth Systems", "published": "2022-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 64, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-26-0049.1", "title": "Effectiveness and Limitations of Machine Learning for Predicting Lower Atmosphere Temperature Profiles", "summary": "Temperature profiles in the lower atmosphere rapidly evolve during the morning transition, and predicting their details over complex urban environments is particularly important for pollutant dispersal. Temperature profiles can be predicted by operational weather models but are sensitive to model parameterizations. Machine learning models can be used, but require high-resolution profiles that are often unavailable. To overcome this, pre-dawn temperature and wind speed observations from aircraft over Dallas-Fort Worth, TX are used to predict the morning transition. Initially, only temperature is used as an input to assess several types and configurations of machine learning models. Each model’s prediction is evaluated based on various methods because standard metrics, such as mean square error (MSE), may be minimized but miss important features, such as strong temperature gradients. A long short-term memory network with an AdamW optimizer does not result in the lowest MSE but does better capturing the temperature structure. The model tends toward the annual mean by underestimating the onset of mixing and near-surface temperature in summer and overestimating these in the winter. Including wind speed does not have a statistically significant improvement in MSE but performs better sequentially and with the inversion at the top of the boundary layer. Further refinements are likely to improve rapidly updated short-term forecasts, which may provide an additional forecast tool, but large gradients, extreme means, and external forcing remain an inherent challenge. These results high", "link": "https://doi.org/10.1175/aies-d-26-0049.1", "authors": "Kip F. Nielsen, David A. Rahn, Nathaniel A. Brunsell, Erik S. Van Vleck", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-11-2", "first_seen": "2026-11-26T13:59:01+00:00", "score": 64, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021ms002954", "title": "ClimateBench v1.0: A Benchmark for Data‐Driven Climate Projections", "summary": "Many different emission pathways exist that are compatible with the Paris climate agreement, and many more are possible that miss that target. While some of the most complex Earth System Models have simulated a small selection of Shared Socioeconomic Pathways, it is impractical to use these expensive models to fully explore the space of possibilities. Such explorations therefore mostly rely on one‐dimensional impulse response models, or simple pattern scaling approaches to approximate the physical climate response to a given scenario. Here we present ClimateBench—the first benchmarking framework based on a suite of Coupled Model Intercomparison Project, AerChemMIP and Detection‐Attribution Model Intercomparison Project simulations performed by a full complexity Earth System Model, and a set of baseline machine learning models that emulate its response to a variety of forcers. These emulators can predict annual mean global distributions of temperature, diurnal temperature range and precipitation (including extreme precipitation) given a wide range of emissions and concentrations of carbon dioxide, methane and aerosols, allowing them to efficiently probe previously unexplored scenarios. We discuss the accuracy and interpretability of these emulators and consider their robustness to physical constraints such as total energy conservation. Future opportunities incorporating such physical constraints directly in the machine learning models and using the emulators for detection and attribution studies are also discussed. This opens a wide range of opportunities to improve predicti", "link": "https://doi.org/10.1029/2021ms002954", "authors": "D. Watson‐Parris, Y. Rao, D. Olivié, Ø. Seland, P. Nowack, G. Camps‐Valls, P. Stier, S. Bouabid", "source": "Journal of Advances in Modeling Earth Systems", "published": "2022-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 64, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme", "emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021jd036214", "title": "On the Application of an Observations‐Based Machine Learning Parameterization of Surface Layer Fluxes Within an Atmospheric Large‐Eddy Simulation Model", "summary": "Recently, machine learning techniques have been employed to develop improved models for predicting surface‐layer fluxes of momentum, heat and moisture based on field observations. Herein we explore refinement to these models, in particular artificial neural networks (NN), and investigate their applicability within an atmospheric large‐eddy simulation model as an alternative to the widely adopted standard of Monin − Obukhov (MO) similarity theory. Atmospheric boundary layer (ABL) simulations under different stability conditions are carried out for a variety of scenarios of increasing complexity, from dry steady neutral boundary layers to moist diurnal cycle. Simulations using the NN models result in predicted flux differences with respect to the corresponding MO simulations that are consistent with NN model skill in predicting the tower observations. These differences lead to notable modifications of mean and turbulence quantities throughout the ABL. While these NN models provide an alternative to improve upon MO, it is demonstrated that thorough scrutiny in design and evaluation is necessary to prevent unphysical predictions and establish a robust and generalizable parameterization. Design aspects considered include input feature engineering, applicability under inputs obtained from different heights, biased predictions due to climatological fingerprints, and sensitivity to the choice of activation function. In this context, it is shown how an atmospheric model can contribute toward efficiently investigating these relevant aspects, including expanding the training data set ", "link": "https://doi.org/10.1029/2021jd036214", "authors": "Domingo Muñoz‐Esparza, Charlie Becker, Jeremy A. Sauer, David John Gagne, John Schreck, Branko Kosović", "source": "JGR: Atmospheres", "published": "2022-8-16", "first_seen": "2026-11-26T13:59:01+00:00", "score": 64, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-026-08105-3", "title": "Evaluation of projected changes in precipitation and temperature under NEX-GDDP CMIP6 scenario driven by climate change", "summary": "", "link": "https://doi.org/10.1007/s00382-026-08105-3", "authors": "Pravesh Kumar, Venkata Reddy Keesara, Eswar Sai Buri", "source": "Climate Dynamics", "published": "2026-3-16", "first_seen": "2026-11-26T13:59:01+00:00", "score": 64, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41558-025-02350-w", "title": "Exploring climate futures with deep learning", "summary": "", "link": "https://doi.org/10.1038/s41558-025-02350-w", "authors": "Alaa Al Khourdajie", "source": "Nature Climate Change", "published": "2025-6-13", "first_seen": "2026-11-26T13:59:01+00:00", "score": 64, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.18393", "title": "WeatherDreamer: Learning a World Model from Multimodal Earth Observations", "summary": "Machine learning weather models now rival operational global forecasts but still start from analyses produced by separate, expensive data assimilation (DA) systems, which for global models are typically updated every six hours. Observation-to-observation models avoid this dependence, but most omit the recursive filtering cycle that lets DA systems carry a background state through sparse, irregular observations. We introduce WeatherDreamer, a world model that learns this cycle end-to-end from 18 global observing systems, without reanalysis. It infers a latent state from observations, carries it forward hour by hour with learned dynamics, corrects it each hour with new observations, and can predict what any of its observing systems would measure at any location. At held-out stations, its ensembles beat NOAA's Global Ensemble Forecast System (GEFS) for temperature, dew point and wind out to 12 h and are better calibrated than GEFS and the ECMWF ensemble. Precipitation, cloud-top height and solar irradiance, never inputs at inference, are inferred with skill matching or exceeding operational products at short leads. Against the first guess of NOAA's Gridpoint Statistical Interpolation (GSI) DA system, WeatherDreamer's short-range departures are within 10% of GSI's at surface stations and within 25% for moisture-sensitive microwave channels, but up to five times larger for temperature-sounding channels. Never given observation errors, its learned update assumes errors close to known instrument and retrieval errors of microwave sounders and scatterometer winds. WeatherDreamer als", "link": "https://arxiv.org/abs/2611.18393", "authors": "Kate Duffy, Elise Penn, Tristan Ballard, August Posch, Thomas J. Vandal", "source": "arXiv", "published": "2026-11-13", "first_seen": "2026-11-26T13:59:01+00:00", "score": 63, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.28219", "title": "Disentangling forced and internal components in observed climate evolution using spatiotemporal deep learning", "summary": "Attribution of observed historical climate evolution to externally forced change and internal variability is fundamental to understanding climate change and evaluating climate models. Yet such attribution remains challenging because the forced response is intertwined with internal variability in observations. Here, we develop a convolutional long short-term memory network (ConvLSTM) to disentangle these two components. Trained and evaluated using large-ensemble simulations from multiple climate models, ConvLSTM consistently outperforms existing model-based, statistical, and machine-learning approaches. Applying ConvLSTM to observations reveals an evolving spatial pattern of the forced response and substantial contributions from internal variability to recent multidecadal climate trends. For several key climate features whose attribution remains debated, ConvLSTM indicates that internal variability amplified the forced reversal of Atlantic interhemispheric temperature asymmetry, dominated the observed La Niña-like warming pattern over the equatorial Pacific and the associated precipitation decline over southwestern North America since 1980, and modulated Arctic amplification around its nearly constant threefold forced value. Comparison between the ConvLSTM-estimated and model-simulated forced responses reveals broadly consistent patterns but also important discrepancies, with climate models simulating stronger Northern Hemisphere warming, weaker subtropical high intensification, and smaller land precipitation declines. Overall, ConvLSTM provides a robust framework for attrib", "link": "https://arxiv.org/abs/2610.28219", "authors": "Parvathi Kooloth, Wenyu Zhou, L. Ruby Leung, Shang-Ping Xie, Hailong Wang, Qiang Fu", "source": "arXiv", "published": "2026-10-20", "first_seen": "2026-11-26T13:59:01+00:00", "score": 63, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2512.12183", "title": "HydroDiffusion: Diffusion-Based Probabilistic Streamflow Forecasting with a State Space Backbone", "summary": "Recent advances have introduced diffusion models for probabilistic streamflow forecasting, demonstrating strong early flood-warning skill. However, current implementations rely on recurrent Long Short-Term Memory (LSTM) backbones and single-step training objectives, which limit their ability to capture long-range dependencies and produce coherent forecast trajectories across lead times. To address these limitations, we developed HydroDiffusion, a diffusion-based probabilistic forecasting framework with a decoder-only state space model backbone. The proposed framework jointly denoises full multi-day trajectories in a single pass, ensuring temporal coherence and mitigating error accumulation common in autoregressive prediction. HydroDiffusion is evaluated across 531 watersheds in the contiguous United States (CONUS) in the CAMELS dataset. We benchmark HydroDiffusion against two diffusion baselines with LSTM backbones, as well as the recently proposed Diffusion-based Runoff Model (DRUM). Results show that HydroDiffusion achieves strong nowcast accuracy when driven by observed meteorological forcings, and maintains consistent performance across the full simulation horizon. Moreover, HydroDiffusion delivers stronger deterministic and probabilistic forecast skill than DRUM in operational forecasting. These results establish HydroDiffusion as a robust generative modeling framework for medium-range streamflow forecasting, providing both a new modeling benchmark and a foundation for future research on probabilistic hydrologic prediction at continental scales.", "link": "https://arxiv.org/abs/2512.12183", "authors": "Yihan Wang, Annan Yu, Lujun Zhang, Charuleka Varadharajan, N. Benjamin Erichson", "source": "arXiv", "published": "2025-12-13", "first_seen": "2026-11-26T13:59:01+00:00", "score": 63, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["diffusion model"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2020ms002217", "title": "Process‐Based Climate Model Development Harnessing Machine Learning: I. A Calibration Tool for Parameterization Improvement", "summary": "The development of parameterizations is a major task in the development of weather and climate models. Model improvement has been slow in the past decades, due to the difficulty of encompassing key physical processes into parameterizations, but also of calibrating or “tuning” the many free parameters involved in their formulation. Machine learning techniques have been recently used for speeding up the development process. While some studies propose to replace parameterizations by data‐driven neural networks, we rather advocate that keeping physical parameterizations is key for the reliability of climate projections. In this paper we propose to harness machine learning to improve physical parameterizations. In particular, we use Gaussian process‐based methods from uncertainty quantification to calibrate the model free parameters at a process level. To achieve this, we focus on the comparison of single‐column simulations and reference large‐eddy simulations over multiple boundary‐layer cases. Our method returns all values of the free parameters consistent with the references and any structural uncertainties, allowing a reduced domain of acceptable values to be considered when tuning the three‐dimensional (3D) global model. This tool allows to disentangle deficiencies due to poor parameter calibration from intrinsic limits rooted in the parameterization formulations. This paper describes the tool and the philosophy of tuning in single‐column mode. Part 2 shows how the results from our process‐based tuning can help in the 3D global model tuning.", "link": "https://doi.org/10.1029/2020ms002217", "authors": "Fleur Couvreux, Frédéric Hourdin, Daniel Williamson, Romain Roehrig, Victoria Volodina, Najda Villefranque, Catherine Rio, Olivier Audouin", "source": "Journal of Advances in Modeling Earth Systems", "published": "2021-2-26", "first_seen": "2026-11-26T13:59:01+00:00", "score": 63, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2019gl081898", "title": "Precipitation From Persistent Extremes is Increasing in Most Regions and Globally", "summary": "Extreme precipitation often persists for multiple days with variable duration but has usually been examined at fixed duration. Here we show that considering extreme persistent precipitation by complete event with variable duration, rather than a fixed temporal period, is a necessary metric to account for the complexity of changing precipitation. Observed global mean annual‐maximum precipitation is significantly stronger (49.5%) for persistent extremes than daily extremes. However, both globally observed and modeled rates of relative increases are lower for persistent extremes compared to daily extremes, especially for Southern Hemisphere and large regions in the 0‐45°N latitude band. Climate models also show significant differences in the magnitude and partly even the sign of local mean changes between daily and persistent extremes in global warming projections. Changes in extreme precipitation therefore are more complex than previously reported, and extreme precipitation events with varying duration should be taken into account for future climate change assessments.", "link": "https://doi.org/10.1029/2019gl081898", "authors": "Haibo Du, Lisa V. Alexander, Markus G. Donat, Tanya Lippmann, Arvind Srivastava, Jim Salinger, Andries Kruger, Gwangyong Choi", "source": "Geophysical Research Letters", "published": "2019-6-7", "first_seen": "2026-11-26T13:59:01+00:00", "score": 63, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/2013ef000185", "title": "Observational‐ and model‐based trends and projections of extreme precipitation over the contiguous United States", "summary": "Historical and projected trends in extreme precipitation events are examined in Coupled Model Intercomparison Project 5 ( CMIP5 ) models and observations, over the contiguous United States ( CONUS ), using several approaches. This study updates earlier studies that have used the extreme precipitation index ( EPI ) to assess observations and goes further by using the EPI to evaluate available climate model simulations. An increasing trend over the CONUS was found in the EPI , with large differences among seven subregions of the United States. Median of CMIP5 simulations also finds an increasing trend in the EPI , but with a smaller magnitude than the observations. Model spread is large and in most cases bigger than the model signal itself. Statistically significant (95th confidence level) increasing trends in the observational‐based EPI occur over the Midwest and Eastern regions, while most decreasing trends occur over Western regions. Some models give negative correlation coefficients relative to observations. However, some ensemble members, for most models, show correlation coefficients greater than 0.5. Projections of extreme precipitation event frequency, for representative concentration pathway ( RCP ) scenarios 4.5 and 8.5, show increasing trends over the CONUS . Both scenarios give a steady increase throughout the period but the RCP 4.5 signal is smaller in magnitude. Overall, the RCP scenarios show an increase across all regions with the exception of some variability between decades in some regions for RCP 4.5. For the CONUS model spread is smaller than the projected", "link": "https://doi.org/10.1002/2013ef000185", "authors": "Emily Janssen, Donald J. Wuebbles, Kenneth E. Kunkel, Seth C. Olsen, Alex Goodman", "source": "Earth's Future", "published": "2014-2", "first_seen": "2026-11-26T13:59:01+00:00", "score": 63, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024jd041140", "title": "Better Resolved Orography Improves Precipitation Simulation Over the Tibetan Plateau in High‐Resolution Models", "summary": "Regarded as the Asian Water Tower, the Tibetan Plateau (TP) collects atmospheric precipitation from a vast area of land and feeds into major rivers that sustain the livelihood of billions of people in East, South and Central Asia. It is critical to reasonably simulate the hydrological cycle over the TP in order to assess future climate risks to agriculture, water resources and ecosystem services. To address the chronic wet biases over the TP in state‐of‐the‐art climate models, we have compared 12 high‐resolution (HR) climate models (25–50 km) to their corresponding low‐resolution versions (100–200 km) with respect to the 1979–2014 climatology. It is found that the HR models consistently reduce about half of the wet biases over the TP, mainly from better resolved orography. The wet biases are reduced by 41% over the northern and western TP, mainly contributed by decreased frequency of light precipitation (0.1–10 mm day −1 ), which is attributed to reduced evaporation because of weakened surface wind by raised orography. The most significant reduction of biases (53%) rising from decreased frequency of mid‐heavy precipitation (10–50 mm day −1 ), appears over the southern and eastern TP, on the leeside of elevated orography where steeper orography enhances rain shadow effect by stronger downward motion along the sharper slope, while partly compensated by air column convergence due to vertical stretching of the downward flow for potential vorticity conservation. This study highlights the importance of surface processes and resolving complex orography in simulating precipitation ", "link": "https://doi.org/10.1029/2024jd041140", "authors": "Xiaolong Chen, Tianjun Zhou, Peili Wu, Malcolm J. Roberts", "source": "JGR: Atmospheres", "published": "2024-11-9", "first_seen": "2026-11-26T13:59:01+00:00", "score": 63, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-021-05823-8", "title": "Changing Indian monsoon rainfall patterns under the recent warming period 2001–2018", "summary": "", "link": "https://doi.org/10.1007/s00382-021-05823-8", "authors": "P. Maharana, R. Agnihotri, A. P. Dimri", "source": "Climate Dynamics", "published": "2021-6-2", "first_seen": "2026-11-26T13:59:01+00:00", "score": 63, "topics": ["Close to your work"], "watch": [], "boosts": ["india", "monsoon"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-013-1942-2", "title": "Development of an artificial neural network based multi-model ensemble to estimate the northeast monsoon rainfall over south peninsular India: an application of extreme learning machine", "summary": "", "link": "https://doi.org/10.1007/s00382-013-1942-2", "authors": "Nachiketa Acharya, Nitin Anand Shrivastava, B. K. Panigrahi, U. C. Mohanty", "source": "Climate Dynamics", "published": "2013-9-20", "first_seen": "2026-11-26T13:59:01+00:00", "score": 63, "topics": ["Deep Learning"], "watch": [], "boosts": ["india", "monsoon", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.37325", "title": "Scale-aware and spatially-localised optimisation of kilometre-scale MLWP models", "summary": "Preserving fine-scale structure without degrading spatial accuracy is a central challenge for kilometre-scale machine-learning weather prediction (MLWP). We introduce a loss based on the dual-tree complex wavelet transform that constrains atmospheric fields jointly by scale, location, and orientation. We evaluate its performance using an experimental joint global--regional FastNet configuration, which produces \\SI{1.5}{km} forecasts over the UK alongside $\\sim$\\SI{31}{km} global forecasts. Relative to both mean-squared error (MSE) and an FFT-based spectral objective, the wavelet loss substantially improves spectral fidelity. Compared with MSE training, it maintains similar pointwise performance, improves neighbourhood-based verification, and produces sharper precipitation fields with more realistic intensity distributions. These results demonstrate that spatially localised wavelet constraints can preserve multiscale atmospheric structure while largely avoiding the loss of pointwise accuracy associated with globally supported spectral objectives.", "link": "https://arxiv.org/abs/2610.37325", "authors": "James Chappell, Sophie Luise Arana, Jack Bowyer, Matthew Burnand, Alejandro Coca-Castro, Evangeline Corcoran, Eric G. Daub, Tom Dunstan", "source": "arXiv", "published": "2026-10-27", "first_seen": "2026-11-26T13:59:01+00:00", "score": 62, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.31212", "title": "Flood forecasting using a physics-guided conditional denoising diffusion probabilistic model", "summary": "High-resolution flood forecasting with full two-dimensional shallow water equation (SWE) solvers remains computationally expensive, even on GPUs. We develop a conditional denoising diffusion probabilistic model (DDPM) that forecasts the evolution of 30 m water-depth fields over a four-day horizon for the Des Plaines River watershed, Illinois. The model is trained on SynxFlow SWE simulations of 113 historical storms observed across twelve Midwestern states (2003-2024), each under three antecedent-wetness scenarios, and can optionally be conditioned on coarse 100 m or 150 m hydrodynamic simulations. Because reverse diffusion is stochastic, every forecast is a 20-member ensemble drawn from the same trained model. Coarse conditioning reduces the four-day mean water-depth RMSE of the ensemble mean from 0.170 m to 0.054 m (100 m) and 0.048 m (150 m). The coarser 150 m conditioning also gives the best critical success index (0.839), false alarm ratio, CRPS and Brier score at lower cost, so finer conditioning does not guarantee better skill. Averaging members reduces error by 5-11% relative to a single realization, and the ensemble provides spatially explicit exceedance probabilities, although the ensembles are under-dispersive (spread-to-error ratios 0.35-0.73). On a single GPU, a four-day forecast over 26 non-overlapping patches is 7.8x, 11.0x and 16.3x faster than the 30 m simulation for the 100 m, 150 m and unconditioned configurations, and projected speedups for a 14-day forecast reach 12-49x for one member and 48-58x for 20 members. Physics-guided diffusion models are thus pr", "link": "https://arxiv.org/abs/2611.31212", "authors": "Omar Sallam, David Coe, Jeremy Feinstein, Hugo Torres, Sofia Sahagun Covarrubias, Eugene Yan", "source": "arXiv", "published": "2026-11-23", "first_seen": "2026-11-26T13:59:01+00:00", "score": 62, "topics": ["Deep Learning"], "watch": [], "boosts": ["diffusion model"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2025ea004970", "title": "Estimating Regional Snow Water Equivalent Using a Physics‐Informed Graph Convolution Network Model", "summary": "Snow water equivalent (SWE), which quantifies the amount of water in a snowpack, is critical for water supply forecasting. This study explores machine learning (ML) models' capability of representing the spatial distribution of SWE across the western United States. Nine graph convolution network (GCN) models using different loss functions, including a series of physics‐informed loss functions, are developed and compared to a baseline extra tree (ET) model. Different approaches for physics‐informed loss function are examined according to the correlation among geographic and meteorological conditions and are expected to help ML models better capture SWE variability. Terrain characteristics, meteorological variables, and snow cover products are used as input features for regional SWE estimation. All ML models are trained on data sets at selected in situ sites during 2018–2021 and evaluated with 9 days in January–March 2025. Results show that GCN models generally outperform the ET model, capturing SWE spatial variability more effectively and achieving higher statistical metrics. The use of the SWE‐elevation‐precipitation‐based physics‐informed loss function provides the best results among all models with an improved coefficient of determination ( R 2 ) of 0.28 and the lowest root mean square error (RMSE) of 0.22 m, while underestimation is observed for high SWE. A site‐by‐site comparison reveals that model estimates from the GCN models generally agree with observations with R 2 of 0.5–0.9, showing a reliable capability of estimating SWE at a single given site. However, the GCN ", "link": "https://doi.org/10.1029/2025ea004970", "authors": "Wei‐Ting Hung, Ziheng Sun, Bowen Cui, Keren Zhou, Nicoleta Cristea, Justin Pflug, Annie Burgess, Daniel Tong", "source": "Earth and Space Science", "published": "2026-11", "first_seen": "2026-11-26T13:59:01+00:00", "score": 62, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024jd041775", "title": "Towards the Development of a Comprehensive Heatwave Proneness Index and Identification of Hotspots Across Indian Mainland", "summary": "Heatwaves (HWs) are one of the key‐emerging climatic hazards, with increasing duration, severity, and frequency all over the globe. Identifying HW‐prone regions and their evolving patterns is therefore essential for effective climate adaptation. To address this, we introduce the “Heat‐Wave Proneness Index (HWPI),” a novel metric to identify the key‐exposed regions or hotspots by integrating three key HW attributes—(a) the maximum annual HW magnitude, (b) the mean HW magnitude excluding the maximum (MeanX), and (c) the annual frequency (Frq) of HW events. By applying HWPI across the Indian mainland, we demonstrate its superiority to capture diverse regional variations in HW‐exposure more effectively than one of the widely‐used HW‐indices—Heat‐Wave Magnitude Index daily (HWMId). Further to validate the reliability of the proposed index, top 10 HW‐affected years are identified across India since 1951, out of which four are found from the recent past decade (2010–2019) itself. A comprehensive spatiotemporal analysis is also conducted using the proposed HWPI, over the historical (1951–2020) and future (2021–2050) periods, which reveals the western, central, north‐eastern and western peninsular India to be the most HW‐prone regions in the country. India as a whole will experience approx. two‐fold increase in HW‐ proneness toward mid‐century relative to the 1981–2010 baseline, as depicted from the multi‐model multi‐scenario analysis. Overall, we expect the newly proposed HWPI and visual identification of the future‐projected HW‐prone regions will not only be useful to the scientif", "link": "https://doi.org/10.1029/2024jd041775", "authors": "Subharthi Sarkar, Rajib Maity", "source": "JGR: Atmospheres", "published": "2024-12-3", "first_seen": "2026-11-26T13:59:01+00:00", "score": 62, "topics": ["Close to your work"], "watch": [], "boosts": ["india"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023jd038598", "title": "Intense Tropical Cyclones in the Western North Pacific Under Global Warming: A Dynamical Downscaling Approach", "summary": "This study aims to assess the global warming's impact on intense tropical cyclones (TCs) over the western North Pacific (WNP) through dynamical downscaling. 379 and 179 TCs reaching Category 1 in the High‐Resolution Atmospheric Model (HiRAM) are downscaled for use in the Weather Research and Forecasting (WRF) model at 5‐km horizontal resolution in the current climate (1979–2015) and for use in the Representative Concentration Pathways 8.5 (RCP8.5) in the future climate (2074–2100) scenarios, respectively. Inclusion of the downscaling simulations by WRF helps better reproduce the probability distribution of the TC's lifetime maximum intensity (LMI). In the warmer climate, the LMI of very intense TCs in WNP are projected to be stronger. Such an increase in intensity is statistically significant, and can be primarily explained by enhanced intensification rate. Meanwhile, TCs among the top 5% in LMI can reach higher intensities which cannot be attained in the current climate. After downscaling, the probability of WNP TCs reaching Category 4–5 increases by 6.5 percentage points in the late 21st century. This increase is 1.7 percentage points higher than the increase projected exclusively by HiRAM. Moreover, for TCs among the top 5% in LMI, a 233‐km and 300‐km westward shift of LMI locations is identified in the late 21st century for simulations with and without the downscaling approach, respectively. Both results suggest that very intense TCs would pose a higher threat to the WNP lands under global warming, as they become substantially stronger, and as their LMI locations migrat", "link": "https://doi.org/10.1029/2023jd038598", "authors": "Cheng‐Hsiang Chih, Chun‐Chieh Wu, Yi‐Hsuan Huang, Yi‐Chen Li, Li‐Zhi Shen, Huang‐Hsiung Hsu, Hsin‐Chien Liang", "source": "JGR: Atmospheres", "published": "2023-12-28", "first_seen": "2026-11-26T13:59:01+00:00", "score": 62, "topics": ["Downscaling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-024-00835-7", "title": "Assessing predictive attribution in NMME forecasts of summer precipitation in eastern china using deep learning", "summary": "", "link": "https://doi.org/10.1038/s41612-024-00835-7", "authors": "Xuan Tong, Wen Zhou", "source": "npj Climate and Atmospheric Science", "published": "2024-12-19", "first_seen": "2026-11-26T13:59:01+00:00", "score": 62, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-18-0183.1", "title": "Deep Learning for Spatially Explicit Prediction of Synoptic-Scale Fronts", "summary": "This paper describes the use of convolutional neural nets (CNN), a type of deep learning, to identify fronts in gridded data, followed by a novel postprocessing method that converts probability grids to objects. Synoptic-scale fronts are often associated with extreme weather in the midlatitudes. Predictors are 1000-mb (1 mb = 1 hPa) grids of wind velocity, temperature, specific humidity, wet-bulb potential temperature, and/or geopotential height from the North American Regional Reanalysis. Labels are human-drawn fronts from Weather Prediction Center bulletins. We present two experiments to optimize parameters of the CNN and object conversion. To evaluate our system, we compare the objects (predicted warm and cold fronts) with human-analyzed warm and cold fronts, matching fronts of the same type within a 100- or 250-km neighborhood distance. At 250 km our system obtains a probability of detection of 0.73, success ratio of 0.65 (or false-alarm rate of 0.35), and critical success index of 0.52. These values drastically outperform the baseline, which is a traditional method from numerical frontal analysis. Our system is not intended to replace human meteorologists, but to provide an objective method that can be applied consistently and easily to a large number of cases. Our system could be used, for example, to create climatologies and quantify the spread in forecast frontal properties across members of a numerical weather prediction ensemble.", "link": "https://doi.org/10.1175/waf-d-18-0183.1", "authors": "Ryan Lagerquist, Amy McGovern, David John Gagne II", "source": "Weather and Forecasting", "published": "2019-8-1", "first_seen": "2026-11-26T13:59:01+00:00", "score": 62, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2607.05658", "title": "Integrating GNSS-Derived Zenith Wet Delay into a Weather Foundation Model Improves Precipitation Forecasting", "summary": "Global Navigation Satellite Systems (GNSS), best known for positioning, also serve weather science, as atmospheric water vapour delays their signals. This delay, the Zenith Wet Delay (ZWD), is a direct, all-weather measure of column moisture. Although assimilated into numerical weather prediction for decades, ZWD is not yet used by leading Machine Learning Weather Models (MLWM), despite addressing a known deficiency: the underestimation of severe precipitation. Here we present the first integration of GNSS-derived ZWD into Aurora, a state-of-the-art weather foundation model. Our extended Aurora learns ZWD with skill comparable to its pretrained variables. More importantly, including ZWD systematically improves forecasts when fine-tuning for 6-hour accumulated precipitation. Gains grow with severity, reaching an 8.8% increase in Equitable Threat Score at the 99th percentile, while the precipitation power spectrum becomes more realistic at synoptic and planetary scales. GNSS observations therefore encode information that MLWM can exploit for high-impact precipitation.", "link": "https://arxiv.org/abs/2607.05658", "authors": "Leonardo Trentini, Fanny Lehmann, Laura Crocetti, Benedikt Soja", "source": "arXiv", "published": "2026-07-06", "first_seen": "2026-11-26T13:59:01+00:00", "score": 61, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-15-8245-2022", "title": "Impact of increased resolution on the representation of the Canary upwelling system in climate models", "summary": "We investigate the representation of the Canary upwelling system (CUS) in six global coupled climate models operated at high and standard resolution as part of the High Resolution Model Intercomparison Project (HighResMIP). The models' performance in reproducing the observed CUS is assessed in terms of various upwelling indices based on sea surface temperature (SST), wind stress, and sea surface height, focusing on the effect of increasing model spatial resolution. Our analysis shows that possible improvement in upwelling representation due to the increased spatial resolution depends on the subdomain of the CUS considered. Strikingly, along the Iberian Peninsula region, which is the northernmost part of the CUS, the models show lower skill at higher resolution compared to their corresponding lower-resolution version in both components for all the indices analyzed in this study. In contrast, over the southernmost part of the CUS, from the north of Morocco to the Senegalese coast, the high-ocean- and high-atmosphere-resolution models simulate a more realistic upwelling than the standard-resolution models, which largely differ from the range of observational estimates. These results suggest that increasing resolution is not a sufficient condition to obtain a systematic improvement in the simulation of the upwelling phenomena as represented by the indices considered here, and other model improvements notably in terms of the physical parameterizations may also play a role.", "link": "https://doi.org/10.5194/gmd-15-8245-2022", "authors": "Adama Sylla, Emilia Sanchez Gomez, Juliette Mignot, Jorge López-Parages", "source": "Geoscientific Model Development", "published": "2022-11-17", "first_seen": "2026-11-26T13:59:01+00:00", "score": 61, "topics": ["Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0108.1", "title": "Improvement of a Neural Network Convection Scheme by Including Triggering and Evaluation in Present and Future Climates", "summary": "In this study, we improve a neural network (NN) parameterization of deep convection in the global atmosphere model ARP-GEM. To account for the sporadic nature of convection, we develop an NN parameterization that includes a triggering mechanism capable of detecting whether deep convection is active within a grid cell. This new data-driven parameterization outperforms the existing NN parameterization in present climate when replacing the original deep convection scheme of ARP-GEM. Online simulations with the NN parameterization run without stability issues. Then, this NN parameterization is evaluated online in a warmer climate. We also confirm that using relative humidity instead of the specific total humidity as input for the NN (trained with present data) tends to improve the performance and generalization in warmer climate. Finally, we perform the training of the NN parameterization with data from a warmer climate, and this configuration gets similar results when used in simulations in present or warmer climates. Significance Statement This paper introduces a data-driven parameterization that significantly improves upon the method described in Balogh et al. Incorporating physical knowledge in the data-driven parameterization leads to reduced biases in the simulation using the data-driven parameterization and enhances both online performance and stability, including in climates not encountered during the data-driven parameterization’s training phase.", "link": "https://doi.org/10.1175/aies-d-25-0108.1", "authors": "Hugo Germain, Blanka Balogh, Olivier Geoffroy, David Saint-Martin", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 61, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0083.1", "title": "Stop Using Root-Mean-Square Error as a Precipitation Target!", "summary": "Root-mean-square error (RMSE) remains the default training loss for data-driven precipitation models, despite precipitation being semicontinuous, zero inflated, strictly nonnegative, and heavy tailed. This Gaussian-implied objective misspecifies the data-generating process because it tolerates negative predictions, underpenalizes rare heavy events, and ignores the mass at zero. We suggest replacing RMSE with the Tweedie deviance, a likelihood-based and differentiable loss from the exponential–dispersion family, with variance function V ( μ ) = μ p . For 1 < p < 2, it yields a compound Poisson–gamma distribution with a point mass at zero and a continuous density over y > 0, matching observed precipitation characteristics. In this paper, we (i) estimate p from the variance–mean power law and show that precipitation across temporal aggregations is far from Gaussian and that the Tweedie power p increases with accumulation length toward a gamma limit and (ii) demonstrate consistent skill gains when training deep data-driven models with Tweedie deviance instead of RMSE. In diffusion-model downscaling over Beijing, Tweedie loss improves wet-pixel MAE and extreme recall (∼0.611 vs 0.566 at the 99th percentile). In convolutional long short-term memory (ConvLSTM) nowcasting over Kolkata, Tweedie loss yields improvements in wet-pixel MAE and dry-pixel hit rates, with improvements autoregressively compounding over lead time (for MAE, from 3.5% at t + 1 growing to 8.7% at t + 4). Extreme recall at the 99.9th percentile is not significantly higher at t + 1 but becomes significantly highe", "link": "https://doi.org/10.1175/aies-d-25-0083.1", "authors": "Kieran M. R. Hunt", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 61, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme", "diffusion model"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ms003640", "title": "Time Variability Correction of CMIP6 Climate Change Projections", "summary": "Accurate projections of climate change and associated extreme events under differing emission scenarios are linked to realistic representations of the temporal variability of the atmosphere at a variety of time scales, for example, annual, seasonal, synoptic, and daily. Here a new method is employed to explicitly quantify a model's ability to accurately represent covariance at and between differing time scales. From our global‐scale analysis, on average, raw Coupled Model Intercomparison Project Phase 6 (CMIP6) models misrepresent temporal variances at differing time scales for maximum temperature (tasmax) by a considerable margin, particularly at 183‐, 92‐ and 46‐day time scales. To ameliorate such variability errors, we propose a novel Time Variability Correction (TVC) method that corrects temporal covariances while preserving the essential time‐event sequence of the model simulations. We adopt a model‐as‐truth framework to evaluate the effectiveness of the TVC method under future forcing conditions when applied to daily tasmax simulations from 23 CMIP6 models for 1% of the global grid cells. TVC‐corrected temperatures generally show improved matching of temporal variance and lag correlations in the out‐of‐sample projection period compared to simple mean‐corrected projections. By imparting more realistic temporal‐correlations to model series, TVC is expected to improve the projections of extreme events associated with persistent heat, such as heatwaves. Applying TVC to future temperature projections using actual observations significantly increases the temperature varianc", "link": "https://doi.org/10.1029/2023ms003640", "authors": "Y. Shao, C. H. Bishop, S. Hobeichi, N. Nishant, G. Abramowitz, S. Sherwood", "source": "Journal of Advances in Modeling Earth Systems", "published": "2024-2", "first_seen": "2026-11-26T13:59:01+00:00", "score": 61, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.11918", "title": "Ensemble Covariance Propagation with Machine Learning Weather Prediction Models in a Realistic Data Assimilation System", "summary": "Integrating machine learning weather prediction (MLWP) models into classical data assimilation (DA) workflows requires that they accurately evolve ensemble covariances. We evaluate this capability in a two-way coupled DA system, where an ensemble variational (EnVar) component evolves the mean and an ensemble Kalman filter (EnKF) evolves the covariances. The system is cycled over one month and assimilates a wide range of real-world observations, including microwave radiances. Using the MLWP model GraphCast for the EnKF and the physics-based MPAS model for the EnVar yields ensemble spread and covariances comparable to a reference configuration in which MPAS evolves both components. The resulting EnVar mean achieves consistently lower RMSE against GFS analyses, except near the model top, where spurious correlations degrade performance. These results demonstrate that MLWP models can propagate covariance information in a realistic DA cycling system and provide a proof of concept for their integration into future operational ensemble systems.", "link": "https://arxiv.org/abs/2611.11918", "authors": "Simon Toedtli, David Ahijevych, Wei Wang, Chris Snyder", "source": "arXiv", "published": "2026-11-09", "first_seen": "2026-11-26T13:59:01+00:00", "score": 60, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0111.1", "title": "S2G Deep Interpolation: A Deep Learning Framework for Generating High-Resolution Wind Gust Fields from Sparse Mesonet Observations", "summary": "The growing deployment of surface observational networks (so-called mesonets) has the potential to transform many sectors, such as agriculture, water resource management, renewable energy assessment, disaster risk reduction, power outage prediction, and high-impact weather monitoring. However, network observations are sparse, whereas these downstream applications typically require gridded data. Traditional interpolation methods, such as Barnes interpolation, do not perform well in complex terrain. Therefore, in this study, we propose a deep learning–based framework, called sparse-to-gridded deep interpolation (S2G-DI), to generate high-resolution spatially continuous fields from sparse surface observations. We focus on wind gusts, which are challenging to interpolate due to their highly localized and transient nature but are critical for assessing weather-related hazards. We experimented with three deep learning architectures, employing convolutional neural networks and transformers with increasing complexity, and our sensitivity analysis shows that a U-Net architecture with meteorological and topographic inputs significantly outperforms Barnes interpolation, reducing root-mean-square error (RMSE) by over 30% and better preserving fine-scale features. The model remains robust to missing data and generalizes well even with limited training data. Evaluations during extreme wind gust events confirm that the framework captures both spatial structure and intensity more reliably than traditional methods. However, for some of these cases, there is still room for improvement for th", "link": "https://doi.org/10.1175/aies-d-25-0111.1", "authors": "Harish Baki, Maximilian Pierzyna, Sukanta Basu", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 60, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-24-0106.1", "title": "Machine Learning Predictions of Deep Convection Initiation: The Importance of Geographic Information, the Sensitivity to Training Region, and Dominant Environmental Parameters", "summary": "Machine learning–based predictions of deep convection initiation (DCI) have shown promise for a range of applications. Previous research has relied on training data that are temporally and/or geographically limited. The first goal of the research presented here is to determine how machine learning models for DCI trained on data from small geographic regions perform relative to models trained over larger geographic regions, and if models trained over larger geographic regions have improved performance through incorporation of geographic information (i.e., latitude and longitude as predictor variables). Results show that performance for a model developed over the entire study area (full model) outperforms regional models when evaluated over the entire study area. When evaluated in the different subregions, the full model has comparable performance to the “home” model for that region. Results also show that the full model also benefits from incorporating geographic information as predictors. The second goal of the research presented here is to use the machine learning model to assess the importance of parameters typically used to differentiate environments capable of supporting DCI from those that do not. The four most important parameters for the full model are convective available potential energy (CAPE), mixing ratio difference (low-/midlevel difference between a parcel and the environment), convective inhibition (CIN) depth (CD) [the distance a parcel would need to be lifted to reach its level of free convection (LFC)], maximum Ω (low-/midlevel vertical motion), and liftin", "link": "https://doi.org/10.1175/aies-d-24-0106.1", "authors": "Stephen A. Shield, Adam L. Houston", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-1", "first_seen": "2026-11-26T13:59:01+00:00", "score": 60, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0064.1", "title": "Bayesian Deep Learning for Convective Initiation Nowcasting Uncertainty Estimation", "summary": "This study evaluated the probability and uncertainty forecasts of five recently proposed Bayesian deep learning methods relative to a deterministic residual neural network (ResNet) baseline for 0–1-h convective initiation (CI) nowcasting using Geostationary Operational Environmental Satellite ( GOES-16 ) satellite infrared observations. Uncertainty was assessed by how well probabilistic forecasts were calibrated and how well uncertainty separated forecasts with large and small errors. Three Bayesian deep learning methods produced probabilistic forecasts that were comparable to those of the deterministic ResNet. Among them, the initial-weights ensemble + Monte Carlo (MC) dropout, a collection of deterministic ResNets with different initial weights to start training and dropout activated during inference, produced the most well-calibrated probability forecasts and the most reliable uncertainty estimates. The Bayesian ResNet ensemble performed worse than the deterministic ResNet at certain forecast times, likely due to the challenge of optimizing a larger number of parameters. To address this issue, the Bayesian–Model Priors with Empirical Bayes using Deep neural network (MOPED) ResNet ensemble was adopted, which constrained the hypothesis search near the deterministic ResNet solution and achieved forecast skill comparable to that of the deterministic ResNet. All Bayesian methods demonstrated well-calibrated uncertainty and effectively separated cases with large and small errors. In generalization tests, the initial-weights ensemble + MC dropout demonstrated better forecast sk", "link": "https://doi.org/10.1175/aies-d-25-0064.1", "authors": "Da Fan, David John Gagne, Steven J. Greybush, Eugene E. Clothiaux, John S. Schreck, Chaopeng Shen", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-4", "first_seen": "2026-11-26T13:59:01+00:00", "score": 60, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2025ms005138", "title": "Improving AI Weather Prediction Models Using Global Mass and Energy Conservation Schemes", "summary": "Artificial Intelligence (AI) weather prediction (AIWP) models are powerful tools for medium‐range forecasts but often lack physical consistency, leading to outputs that violate conservation laws. This study introduces a set of novel physics‐based schemes designed to enforce the conservation of global dry air mass, moisture budget, and total atmospheric energy in AIWP models during both training and inference. The schemes are highly modular, allowing for seamless integration into a wide range of AI model architectures. Forecast experiments are conducted to demonstrate the benefit of conservation schemes using FuXi, an example AIWP model, modified and adapted for 1.0 grid spacing. Verification results show that the conservation schemes can guide the model in producing forecasts that obey conservation laws. The forecast skills of upper‐air and surface variables are also improved, with longer forecast lead times receiving larger benefits. Notably, large performance gains are found in the total precipitation forecasts, owing to the reduction of drizzle bias. The proposed conservation schemes establish a foundation for implementing other physics‐based schemes in the future. They also provide a new way to integrate atmospheric domain knowledge into the design and refinement of AIWP models.", "link": "https://doi.org/10.1029/2025ms005138", "authors": "Yingkai Sha, John S. Schreck, William Chapman, David John Gagne", "source": "Journal of Advances in Modeling Earth Systems", "published": "2025-11", "first_seen": "2026-11-26T13:59:01+00:00", "score": 60, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-026-08339-1", "title": "Heat-humidity driven heatwave extremes over India: dry–moist heatwaves and their intraseasonal modulation", "summary": "", "link": "https://doi.org/10.1007/s00382-026-08339-1", "authors": "Usman Mohseni, Shreya Mittal, Nikhil Ghodichore, R. Vinnarasi", "source": "Climate Dynamics", "published": "2026-8-13", "first_seen": "2026-11-26T13:59:01+00:00", "score": 60, "topics": ["Close to your work"], "watch": [], "boosts": ["india", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-023-06672-3", "title": "Wet bias of summer precipitation in the northwestern Tibetan Plateau in ERA5 is linked to overestimated lower-level southerly wind over the plateau", "summary": "The Tibetan Plateau (TP), also called the Third Pole, is considered to be “the world water tower”. The northwestern TP (NWTP), which has an average elevation higher than 4800 m, is an arid region where the summer precipitation is largely overestimated by the ERA5 global reanalysis product. We hypothesize that this wet bias is mainly caused by unrealistic lower-level winds that trigger strong convection over the region; it can be reduced by using a high-resolution regional climate model with a large domain that allows realistically representing interactions between the Westerlies and Asian summer monsoons. Here, downscaling using the Weather Research and Forecasting (WRF) model driven by ERA5 was conducted with a large domain (8°‒50° N, 65°‒125° E) at 9 km for the period 1979‒2019 (WRF9km). Precipitation values from WRF9km and ERA5 were evaluated against satellite observations; compared with ERA5, WRF9km captured the climatological summer precipitation over the NWTP with a much-reduced wet bias. The ERA5 overestimation is mainly caused by excessive convective precipitation, likely linked to strong vertical motions over the NWTP induced by an overestimated lower-level southerly wind.", "link": "https://doi.org/10.1007/s00382-023-06672-3", "authors": "Tinghai Ou, Deliang Chen, Jianping Tang, Changgui Lin, Xuejia Wang, Julia Kukulies, Hui-Wen Lai", "source": "Climate Dynamics", "published": "2023-1-16", "first_seen": "2026-11-26T13:59:01+00:00", "score": 60, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.25075", "title": "Evaluation of machine-learning and deep-learning SPEI drought forecasts against persistence across timescales and lead times in Bangladesh", "summary": "Bangladesh, home to nearly 178 million people, is highly vulnerable to recurring droughts that threaten food security and rural livelihoods. Machine-learning and deep-learning models are increasingly used to forecast drought indices such as the Standardized Precipitation Evapotranspiration Index (SPEI). Most studies report accuracy without a persistence reference, although accumulated indices are strongly autocorrelated, and seldom test drought detection, longer leads or variation between training runs. This study forecast SPEI at 3-, 6- and 12-month timescales one to three months ahead for the eight divisions of Bangladesh, using ERA5 reanalysis checked against 35 Bangladesh Meteorological Department stations. Five models, XGBoost, CNN, Bi-LSTM, CNN-BiLSTM and CEEMDAN-BiLSTM, were trained with five seeds each, scored on accuracy, skill against persistence and drought detection, and interpreted with Shapley values. At a one-month lead, the CNN-BiLSTM and Bi-LSTM beat persistence clearly at SPEI-3 and SPEI-6 (skill 0.408 and 0.350), while at SPEI-12 a Nash-Sutcliffe efficiency of 0.872 barely exceeded persistence (0.850). Skill and detection could disagree: at SPEI-3 and a three-month lead, XGBoost had the highest skill (0.439) yet detected none of the 119 drought months. Only at SPEI-6 did the forecasts beat persistence significantly and match its detection at all three leads, with fewer false alarms. At SPEI-12, gains were small or absent and varied between seeds. The forecasts kept 76-80% of their correlation against station-derived SPEI and relied mainly on precipitation", "link": "https://arxiv.org/abs/2611.25075", "authors": "Mahir Ahnaf, Showmitra Kumar Sarkar", "source": "arXiv", "published": "2026-11-18", "first_seen": "2026-11-26T13:59:01+00:00", "score": 59, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2609.12274", "title": "Ensemble Forecast Updates without Model Re-integration Based on Ultra-rapid Data Assimilation: Idealized Experiments with a Heavy Rainfall Case", "summary": "Observations at high frequency have become dramatically more abundant with recent technological advances. Ultra-rapid data assimilation (URDA) has been proposed to exploit them, frequently updating ensemble forecasts at lower cost without re-integrating the forecast model. In this study, we examine the applicability of URDA to a realistic numerical weather prediction (NWP). Specifically, we conducted idealized experiments for the heavy rainfall event of August 2021, using the regional atmospheric model Scalable Computing for Advanced Library and Environment (SCALE-RM). In the experiments, pseudo-observations emulating the Automated Meteorological Data Acquisition System (AMeDAS) were assumed to become avai
