6-11-24T14:57:46+00:00", "score": 73, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/1520-0434(1998)013<1194:lpffan>2.0.co;2", "title": "Localized Precipitation Forecasts from a Numerical Weather Prediction Model Using Artificial Neural Networks", "summary": "", "link": "https://doi.org/10.1175/1520-0434(1998)013<1194:lpffan>2.0.co;2", "authors": "Robert J. Kuligowski, Ana P. Barros", "source": "Weather and Forecasting", "published": "1998-12", "first_seen": "2026-11-24T14:57:46+00:00", "score": 73, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-23-0105.1", "title": "Enhancing the Rainfall Forecasting Accuracy of Ensemble Numerical Prediction Systems via Convolutional Neural Networks", "summary": "Ensemble prediction systems are commonly used to demonstrate the potential uncertainty of weather forecasts. These systems also help provide weather predictions to prepare for disasters. Specifically, a type of prediction called a quantitative precipitation forecast (QPF) is calculated from the average of multiple forecasts. The probability-matched mean (PMM) method is used to improve these QPF predictions when they underestimate rainfall. However, the PMM method can exhibit limitations when dealing with certain types of rain patterns. To address this issue, this study focuses on improving short-term heavy rainfall predictions using an artificial intelligence (AI) algorithm that combines deep neural networks (DNNs), including convolutional neural networks (CNNs), with a space-based attention mechanism [convolutional block attention module (CBAM)]. Four experiments were conducted to evaluate the new method, including those performed to optimize the timing of a 24-h QPF model, adjust the training dataset, and refine the training algorithm. Two specific weather events were assessed: rainfall influenced by southwest winds after typhoons and afternoon thunderstorm rainfall. A comparison of the results obtained via the root-mean-square error (RMSE) and structural similarity index measure (SSIM) reveals significant improvements in both accuracy and distribution of the QPF predictions over those of the PMM method. Compared with the PMM method, our approach can reduce the RMSE from 77.51 to 19.52 in the mei-yu case, an improvement of approximately 74.82%. The SSIM also increased fro", "link": "https://doi.org/10.1175/aies-d-23-0105.1", "authors": "Kuan-Cheng Lin, Wan-Ting Chen, Pao-Liang Chang, Zhi-Yuan Ye, Chin-Cheng Tsai", "source": "Artificial Intelligence for the Earth Systems", "published": "2024-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 72, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ms003697", "title": "Implementation and Evaluation of a Machine Learned Mesoscale Eddy Parameterization Into a Numerical Ocean Circulation Model", "summary": "We address the question of how to use a machine learned (ML) parameterization in a general circulation model (GCM), and assess its performance both computationally and physically. We take one particular ML parameterization (Guillaumin & Zanna, 2021, https://doi.org/10.1002/essoar.10506419.1 ) and evaluate the online performance in a different model from which it was previously tested. This parameterization is a deep convolutional network that predicts parameters for a stochastic model of subgrid momentum forcing by mesoscale eddies. We treat the parameterization as we would a conventional parameterization once implemented in the numerical model. This includes trying the parameterization in a different flow regime from that in which it was trained, at different spatial resolutions, and with other differences, all to test generalization. We assess whether tuning is possible, which is a common practice in GCM development. We find the parameterization, without modification or special treatment, to be stable and that the action of the parameterization to be diminishing as spatial resolution is refined. We also find some limitations of the machine learning model in implementation: (a) tuning of the outputs from the parameterization at various depths is necessary; (b) the forcing near boundaries is not predicted as well as in the open ocean; (c) the cost of the parameterization is prohibitively high on central processing units. We discuss these limitations, present some solutions to problems, and conclude that this particular ML parameterization does inject energy, and improve bac", "link": "https://doi.org/10.1029/2023ms003697", "authors": "Cheng Zhang, Pavel Perezhogin, Cem Gultekin, Alistair Adcroft, Carlos Fernandez‐Granda, Laure Zanna", "source": "Journal of Advances in Modeling Earth Systems", "published": "2023-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 72, "topics": ["Deep Learning", "Climate Modelling"], "watch": ["Laure Zanna"], "boosts": [], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1029/2019jd032344", "title": "Evaluation of the Large EURO‐CORDEX Regional Climate Model Ensemble", "summary": "The use of regional climate model (RCM)‐based projections for providing regional climate information in a research and climate service contexts is currently expanding very fast. This has been possible thanks to a considerable effort in developing comprehensive ensembles of RCM projections, especially for Europe, in the EURO‐CORDEX community (Jacob et al., 2014, 2020). As of end of 2019, EURO‐CORDEX has developed a set of 55 historical and scenario projections (RCP8.5) using 8 driving global climate models (GCMs) and 11 RCMs. This article presents the ensemble including its design. We target the analysis to better characterize the quality of the RCMs by providing an evaluation of these RCM simulations over a number of classical climate variables and extreme and impact‐oriented indices for the period 1981–2010. For the main variables, the model simulations generally agree with observations and reanalyses. However, several systematic biases are found as well, with shared responsibilities among RCMs and GCMs: Simulations are overall too cold, too wet, and too windy compared to available observations or reanalyses. Some simulations show strong systematic biases on temperature, others on precipitation or dynamical variables, but none of the models/simulations can be defined as the best or the worst on all criteria. The article aims at supporting a proper use of these simulations within a climate services context.", "link": "https://doi.org/10.1029/2019jd032344", "authors": "Robert Vautard, Nikolay Kadygrov, Carley Iles, Fredrik Boberg, Erasmo Buonomo, Katharina Bülow, Erika Coppola, Lola Corre", "source": "JGR: Atmospheres", "published": "2021-9", "first_seen": "2026-11-24T14:57:46+00:00", "score": 72, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-022-06622-5", "title": "Understanding CMIP6 biases in the representation of the Greater Horn of Africa long and short rains", "summary": "The societies of the Greater Horn of Africa (GHA) are vulnerable to variability in two distinct rainy seasons, the March–May ‘long’ rains and the October–December ‘short’ rains. Recent trends in both rainy seasons, possibly related to patterns of low-frequency variability, have increased interest in future climate projections from General Circulation Models (GCMs). However, previous generations of GCMs historically have poorly simulated the regional hydroclimate. This study conducts a process-based evaluation of simulations of the long and short rains in CMIP6, the latest generation of GCMs. Key biases in CMIP5 remain or are worsened, including long rains that are too short and weak and short rains that are too long and strong. Model biases are driven by a complex set of related oceanic and atmospheric factors, including simulations of the Walker Circulation. Biased wet short rains in models are connected with Indian Ocean zonal sea surface temperature (SST) gradients that are too warm in the west and convection that is too deep. Models connect equatorial African winds with the strength of the short rains, though in observations a robust connection is primarily found in the long rains. Model mean state biases in the timing of the western Indian Ocean SST seasonal cycle are associated with certain rainfall timing biases, though both biases may be due to a common source. Simulations driven by historical SSTs (AMIP runs) often have larger biases than fully coupled runs. A path towards using biases to better understand uncertainty in projections of GHA rainfall is suggested.", "link": "https://doi.org/10.1007/s00382-022-06622-5", "authors": "Kevin Schwarzwald, Lisa Goddard, Richard Seager, Mingfang Ting, Kate Marvel", "source": "Climate Dynamics", "published": "2022-12-27", "first_seen": "2026-11-24T14:57:46+00:00", "score": 72, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "cmip6", "uncertainty"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.4976", "title": "Association between the meridional displacement of the Asian jet and Indian summer monsoon rainfall in CMIP6 models: Impact of El Niño and Pacific decadal oscillation", "summary": "The relationship between meridional displacement of the Asian jet and Indian summer monsoon (ISM) is examined in the observations and 40 state‐of‐the‐art Coupled Model Intercomparison Project, phase 6 (CMIP6) historical simulations. The southward displacement of the Asian jet (SWDAJ) is found to be linked with reduced rainfall over central and north India including monsoon trough region in both the observations and most of the CMIP6 models. In general, models are able to simulate the characteristics of the SWDAJ during summer with some differences in zonal asymmetry. Detailed analysis elucidated two observed pathways that connect the SWDAJ with ISM rainfall variability. The first is the west Asian jet–easterly jet pathway, where the SWDAJ is linked with the southeastward shift of the South Asian high, contributing to the weakening of tropical easterly jet. This pattern aligns with changes in low‐level ISM circulation and contributed to reduced rainfall over India. The west Asian jet–easterly jet pathway is well represented by most of the CMIP6 models. The second pathway involves the East Asian jet–Pacific Japan pattern, in which the SWDAJ over East Asia strengthens the western North Pacific anticyclone through the barotropic–baroclinic coupling. The anomalous westward extended easterlies originating from the western North Pacific anticyclone hinder the southwesterly monsoon flow and suppress the rainfall. It is found that CMIP6 models largely failed to capture the East Asian jet–Pacific Japan pathway, likely due to the models' tendency to overestimate the simulation of the ", "link": "https://doi.org/10.1002/qj.4976", "authors": "Amol Vibhute, Jasti S. Chowdary, Patekar Darshana, Anant Parekh, C. Gnanaseelan", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2025-3-23", "first_seen": "2026-11-24T14:57:46+00:00", "score": 72, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "monsoon", "cmip6"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2022.4", "title": "Modeling and simulating spatial extremes by combining extreme value theory with generative adversarial networks", "summary": "Modeling dependencies between climate extremes is important for climate risk assessment, for instance when allocating emergency management funds. In statistics, multivariate extreme value theory is often used to model spatial extremes. However, most commonly used approaches require strong assumptions and are either too simplistic or over-parameterized. From a machine learning perspective, generative adversarial networks (GANs) are a powerful tool to model dependencies in high-dimensional spaces. Yet in the standard setting, GANs do not well represent dependencies in the extremes. Here we combine GANs with extreme value theory (evtGAN) to model spatial dependencies in summer maxima of temperature and winter maxima in precipitation over a large part of western Europe. We use data from a stationary 2000-year climate model simulation to validate the approach and explore its sensitivity to small sample sizes. Our results show that evtGAN outperforms classical GANs and standard statistical approaches to model spatial extremes. Already with about 50 years of data, which corresponds to commonly available climate records, we obtain reasonably good performance. In general, dependencies between temperature extremes are better captured than dependencies between precipitation extremes due to the high spatial coherence in temperature fields. Our approach can be applied to other climate variables and can be used to emulate climate models when running very long simulations to determine dependencies in the extremes is deemed infeasible.", "link": "https://doi.org/10.1017/eds.2022.4", "authors": "Younes Boulaguiem, Jakob Zscheischler, Edoardo Vignotto, Karin van der Wiel, Sebastian Engelke", "source": "Environmental Data Science", "published": "2022", "first_seen": "2026-11-24T14:57:46+00:00", "score": 72, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.09663", "title": "RainFlow: Flow Matching for Infrared-Only Quantitative Precipitation Estimation", "summary": "Geostationary infrared imagers observe precipitating systems every 10 to 15 minutes over large areas, but they sense cloud tops rather than the rain beneath. Their brightness temperatures constrain surface rain only weakly, so retrievals trained by regression return a smooth estimate that misses heavy rain and carries no measure of uncertainty. We treat infrared-only retrieval as conditional generation and introduce RainFlow, a flow-matching model that generates ensembles of rain fields from MSG/SEVIRI infrared observations, in a direct and a residual variant. Evaluated against radar over metropolitan France for a full year, the generated members are realistic rain fields, with the observed dry areas, heavy rain and spatial structure, and the ensemble mean is as accurate as a deterministic baseline. Used as probabilities, the ensembles locate heavy rain at scales where the baseline has no skill, and their spread captures most of the retrieval error, with only slight underdispersion. Trained with a time-sampling density that favours the noise end of the generative trajectory, the two variants reach similar skill. The direct variant depends strongly on this choice of density, whereas the residual variant is nearly insensitive to it. Evaluating the generated rain as a function of brightness temperature shows that the ensembles reproduce how rain depends on it over most of the range. It also isolates the remaining gap, an underestimate of both the amount and the variability of rain under the coldest cloud tops, which scores computed over all pixels do not reveal.", "link": "https://arxiv.org/abs/2611.09663", "authors": "Matthieu Meignin, Cécile Mallet, Nicolas Viltard", "source": "arXiv", "published": "2026-11-06", "first_seen": "2026-11-24T14:57:46+00:00", "score": 71, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation", "flow matching", "uncertainty"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-13-2631-2020", "title": "RainNet v1.0: a convolutional neural network for radar-based precipitation nowcasting", "summary": "In this study, we present RainNet, a deep convolutional neural network for radar-based precipitation nowcasting. Its design was inspired by the U-Net and SegNet families of deep learning models, which were originally designed for binary segmentation tasks. RainNet was trained to predict continuous precipitation intensities at a lead time of 5 min, using several years of quality-controlled weather radar composites provided by the German Weather Service (DWD). That data set covers Germany with a spatial domain of 900 km×900 km and has a resolution of 1 km in space and 5 min in time. Independent verification experiments were carried out on 11 summer precipitation events from 2016 to 2017. In order to achieve a lead time of 1 h, a recursive approach was implemented by using RainNet predictions at 5 min lead times as model inputs for longer lead times. In the verification experiments, trivial Eulerian persistence and a conventional model based on optical flow served as benchmarks. The latter is available in the rainymotion library and had previously been shown to outperform DWD's operational nowcasting model for the same set of verification events. RainNet significantly outperforms the benchmark models at all lead times up to 60 min for the routine verification metrics mean absolute error (MAE) and the critical success index (CSI) at intensity thresholds of 0.125, 1, and 5 mm h −1 . However, rainymotion turned out to be superior in predicting the exceedance of higher intensity thresholds (here 10 and 15 mm h −1 ). The limited ability of RainNet to predict heavy rainfall intensit", "link": "https://doi.org/10.5194/gmd-13-2631-2020", "authors": "Georgy Ayzel, Tobias Scheffer, Maik Heistermann", "source": "Geoscientific Model Development", "published": "2020-6-11", "first_seen": "2026-11-24T14:57:46+00:00", "score": 71, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-23-0098.1", "title": "Physically Explainable Deep Learning for Convective Initiation Nowcasting Using GOES-16 Satellite Observations", "summary": "Convective initiation (CI) nowcasting remains a challenging problem for both numerical weather prediction models and existing nowcasting algorithms. In this study, an object-based probabilistic deep learning model is developed to predict CI based on multichannel infrared GOES-16 satellite observations. The data come from patches surrounding potential CI events identified in Multi-Radar Multi-Sensor Doppler weather radar products over the Great Plains region from June and July 2020 and June 2021. An objective radar-based approach is used to identify these events. The deep learning model significantly outperforms the classical logistic model at lead times up to 1 h, especially on the false alarm ratio. Through case studies, the deep learning model exhibits dependence on the characteristics of clouds and moisture at multiple altitudes. Model explanation further reveals that the contribution of features to model predictions is significantly dependent on the baseline, a reference point against which the prediction is compared. Under a moist baseline, moisture gradients in the lower and middle troposphere contribute most to correct CI forecasts. In contrast, under a clear-sky baseline, correct CI forecasts are dominated by cloud-top features, including cloud-top glaciation, height, and cloud coverage. Our study demonstrates the advantage of using different baselines in further understanding model behavior and gaining scientific insights.", "link": "https://doi.org/10.1175/aies-d-23-0098.1", "authors": "Da Fan, Steven J. Greybush, Eugene E. Clothiaux, David John Gagne", "source": "Artificial Intelligence for the Earth Systems", "published": "2024-7", "first_seen": "2026-11-24T14:57:46+00:00", "score": 71, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-021-05941-3", "title": "Evaluation of a new 12 km regional perturbed parameter ensemble over Europe", "summary": "We evaluate a 12-member perturbed parameter ensemble of regional climate simulations over Europe at 12 km resolution, carried out as part of the UK Climate Projections (UKCP) project. This ensemble is formed by varying uncertain parameters within the model physics, allowing uncertainty in future projections due to climate modelling uncertainty to be explored in a systematic way. We focus on present day performance both compared to observations, and consistency with the driving global ensemble. Daily and seasonal temperature and precipitation are evaluated as two variables commonly used in impacts assessments. For precipitation we find that downscaling, even whilst within the convection-parameterised regime, generally improves daily precipitation, but not everywhere. In summer, the underestimation of dry day frequency is worse in the regional ensemble than in the driving simulations. For temperature we find that the regional ensemble inherits a large wintertime cold bias from the global model, however downscaling reduces this bias. The largest bias reduction is in daily winter cold temperature extremes. In summer the regional ensemble is cooler and wetter than the driving global models, and we examine cloud and radiation diagnostics to understand the causes of the differences. We also use a low-resolution regional simulation to determine whether the differences are a consequence of resolution, or due to other configuration differences, with the predominant configuration difference being the treatment of aerosols. We find that use of the EasyAerosol scheme in the regional mod", "link": "https://doi.org/10.1007/s00382-021-05941-3", "authors": "Simon O. Tucker, Elizabeth J. Kendon, Nicolas Bellouin, Erasmo Buonomo, Ben Johnson, James M. Murphy", "source": "Climate Dynamics", "published": "2021-8-30", "first_seen": "2026-11-24T14:57:46+00:00", "score": 71, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-16-1887-2023", "title": "The impact of lateral boundary forcing in the CORDEX-Africa ensemble over southern Africa", "summary": "The region of southern Africa (SAF) is among the most exposed climate change hotspots and is projected to experience severe impacts across multiple economical and societal sectors. For this reason, producing reliable projections of the expected impacts of climate change is key for local communities. In this work we use an ensemble of 19 regional climate model (RCM) simulations performed in the context of the Coordinated Regional Climate Downscaling Experiment (CORDEX) – Africa and a set of 10 global climate models (GCMs) participating in the Coupled Model Intercomparison Project Phase 5 (CMIP5) that were used as the driving GCMs in the RCM simulations. We are concerned about the degree to which RCM simulations are influenced by their driving GCMs, with regards to monthly precipitation climatologies, precipitation biases and precipitation change signal, according to the Representative Concentration Pathway (RCP) 8.5 for the end of the 21st century. We investigate the degree to which RCMs and GCMs are able to reproduce specific climatic features over SAF and over three sub-regions, namely the greater Angola region, the greater Mozambique region, and the greater South Africa region. We identify that during the beginning of the rainy season, when regional processes are largely dependent on the coupling between the surface and the atmosphere, the impact of the driving GCMs on the RCMs is smaller compared to the core of the rainy season, when precipitation is mainly controlled by the large-scale circulation. In addition, we show that RCMs are able to counteract the bias received ", "link": "https://doi.org/10.5194/gmd-16-1887-2023", "authors": "Maria Chara Karypidou, Stefan Pieter Sobolowski, Lorenzo Sangelantoni, Grigory Nikulin, Eleni Katragkou", "source": "Geoscientific Model Development", "published": "2023-4-6", "first_seen": "2026-11-24T14:57:46+00:00", "score": 70, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0022.1", "title": "Enhancing Operational Wind Downscaling Capabilities over Canada: Application of a Conditional Wasserstein GAN Methodology", "summary": "Downscaling based on artificial intelligence (AI) has been demonstrated to be a powerful tool for improving the spatial resolution of weather forecasts. This study advances wind downscaling by extending the DownGAN framework introduced by Annau et al. to operational Canadian numerical weather predictions (NWPs), namely, from the Global Deterministic Prediction System (GDPS) to the domain of the High-Resolution Deterministic Prediction System (HRDPS). We enhance the AI model by incorporating high-resolution static covariates, such as topography on the HRDPS grid, into a conditional Wasserstein generative adversarial network with gradient penalty, implemented using a U-Net-based generator. Following the DownGAN framework, our methodology integrates low-resolution GDPS forecasts (15 km, 10-day horizon) and high-resolution HRDPS forecasts (2.5 km, 48-h horizon) with frequency separation techniques adapted from computer vision. Through robust training and inference over the whole Canadian region, we demonstrate the operational scalability of our approach while achieving significant improvements in wind downscaling accuracy. Statistical validation highlights a reduction in root-mean-square error (RMSE) and log spectral distance (LSD) metrics compared to the original DownGAN. High-resolution conditioning covariates and frequency separation strategies prove instrumental in enhancing model performance. This work underscores the potential for extending high-resolution wind forecasts beyond the 48-h horizon, bridging the gap to the 10-day low-resolution global forecast window. Signifi", "link": "https://doi.org/10.1175/aies-d-25-0022.1", "authors": "Jorge Guevara, Victor Nascimento, Johannes Schmude, Daniel Salles Civitarese, Simon Corbeil-Létourneau, Madalina Surcel, Dominique Brunet", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 70, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0047.1", "title": "Medium-Range River Stage Forecasting with a Long Short-Term Memory Network", "summary": "Accurately forecasting rainfall–runoff and the subsequent rise and fall within rivers remains a challenge in hydrological modeling. While physical modeling system capabilities have improved, they can be computationally demanding and/or require extensive calibration when deploying at a new forecast point. Data-driven machine learning models can largely avoid these challenges while maintaining high accuracy. In this study, a long short-term memory (LSTM) network is used to produce river stage height forecasts based on lagged inputs of basin-averaged precipitation, modeled relative soil moisture, and gauge height. A basin-specific LSTM was developed and tested on 42 precipitation-dominated river basins. The results show that the LSTM statistically outperforms the corresponding ensemble of the medium-range National Water Model when driven by the same Global Forecast System precipitation. With a 0.14 higher average Nash–Sutcliffe efficiency and 13.1% lower peak bias over the 7-day forecast, the LSTM demonstrates high viability for operational use. Significance Statement Accurately forecasting river flooding is of high importance for protecting life and property. Traditional physics-based hydrological models that have been used by operational centers to provide forecasts to the public are computationally expensive and still have high uncertainties. In this study, we examined the use of machine learning for forecasting river flooding out to 7 days and determined that the developed machine learning framework provides better forecasts than a physics-based modeling approach and shows", "link": "https://doi.org/10.1175/aies-d-25-0047.1", "authors": "Andrew T. White, Christopher R. Hain, Kristopher D. White, Jonathan L. Case, Kevin Fuell", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-1", "first_seen": "2026-11-24T14:57:46+00:00", "score": 70, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021ef002500", "title": "Evaluation of the CMIP6 Precipitation Simulations Over Global Land", "summary": "Precipitation's temporal and spatial patterns under climate change significantly impact global terrestrial ecology and human social activities. Climate models are essential tools for assessing the impacts of climate change and formulating policies to address climate change. The evaluation results of historical climate model simulations can represent the reliability of their future simulations. This study evaluated the simulation capabilities of 41 historical All‐Forcing monthly precipitation simulations and three integrated models over global land in the Coupled Model Comparison Project Phase 6 (CMIP6). The results show that the simulation capability of global climate models (GCMs) in CMIP6 is highly variable overland around the world. This variability is manifested in two aspects: the spatial variability of the comprehensive simulation ability of each model in different geographical regions and climatic zones of the world and the significant difference in the simulation ability of different models in each region. These GCMs generally overestimate global monthly precipitation over land, with the exception of southeast Asia and tropical rainforest climate (Af), where all models underestimate monthly precipitation. Some GCMS can perform well regionally but poorly on the global scale. One example shows that EC‐Earth3's best capability at Cwc climatic zone, surpassing the integrated model, but failed to rank in the top 10 in 22 of the 29 climate zones. Our results highlight the need to select appropriate models for integration when conducting climate change studies at global an", "link": "https://doi.org/10.1029/2021ef002500", "authors": "Zhengyang Li, Tie Liu, Yue Huang, Jiabin Peng, Yunan Ling", "source": "Earth's Future", "published": "2022-8", "first_seen": "2026-11-24T14:57:46+00:00", "score": 70, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/2009mwr2750.1", "title": "Cloud and Precipitation Parameterization in a Meso-Gamma-Scale Operational Weather Prediction Model", "summary": "The paper assesses the difficulties of running an operational NWP model in the resolution range of 3–8 km. In this case, deep convection cells are neither much smaller than the grid box as assumed by most parameterization schemes, nor completely resolved as would be required for them to be treated explicitly. A specific approach is proposed, with an integrated sequential treatment of resolved condensation, deep convection, and microphysics together with the use of prognostic variables. It currently allows for the production of consistent and realistic results at resolutions ranging from a few tens of kilometers down to less than 4 km. Model skill scores and an example of an operational forecast at different resolutions are presented.", "link": "https://doi.org/10.1175/2009mwr2750.1", "authors": "Luc Gerard, Jean-Marcel Piriou, Radmila Brožková, Jean-François Geleyn, Doina Banciu", "source": "Monthly Weather Review", "published": "2009-11-1", "first_seen": "2026-11-24T14:57:46+00:00", "score": 70, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-24-0081.1", "title": "A Comparison of AI Weather Prediction and Numerical Weather Prediction Models for 1–7-Day Precipitation Forecasts", "summary": "Pure artificial intelligence (AI)-based weather prediction (AIWP) models have made waves within the scientific community and the media, claiming superior performance to numerical weather prediction (NWP) models. However, these models often lack impactful output variables such as precipitation. One exception is Google DeepMind’s GraphCast model, which became the first mainstream AIWP model to predict precipitation, but performed only limited verification. We present an analysis of the ECMWF’s Integrated Forecasting System (IFS)-initialized (GRAP IFS ) and the NCEP’s Global Forecast System (GFS)-initialized (GRAP GFS ) GraphCast precipitation forecasts over the contiguous United States and compare to results from the GFS and IFS models using 1) grid-based, 2) neighborhood, and 3) object-oriented metrics verified against the fifth major global reanalysis produced by ECMWF (ERA5) and the NCEP/Environmental Modeling Center (EMC) stage IV precipitation analysis datasets. We affirmed that GRAP GFS and GRAP IFS perform better than the GFS and IFS in terms of root-mean-square error and stable equitable errors in probability space, but the GFS and IFS precipitation distributions more closely align with the ERA5 and stage IV distributions. Equitable threat score also generally favored GraphCast, particularly for lower accumulation thresholds. Fractions skill score for increasing neighborhood sizes shows greater gains for the GFS and IFS than GraphCast, suggesting the NWP models may have a better handle on intensity but struggle with the location. Object-based verification for GraphCas", "link": "https://doi.org/10.1175/waf-d-24-0081.1", "authors": "Jacob T. Radford, Imme Ebert-Uphoff, Jebb Q. Stewart", "source": "Weather and Forecasting", "published": "2025-4", "first_seen": "2026-11-24T14:57:46+00:00", "score": 70, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-18-9237-2025", "title": "Urban heat forecasting in small cities: evaluation of a high-resolution operational numerical weather prediction model", "summary": "With rising global temperatures, urban environments are increasingly vulnerable to heat stress, often exacerbated by the Urban Heat Island (UHI) effect. While most UHI research has focused on large metropolitan areas around the world, relatively smaller-sized cities (with a population 100 000–300 000) remain understudied despite their growing exposure to extreme heat and meteorological significance. In particular, urban heat advection (UHA), the transport of heat by mean winds, remains a key but underexplored mechanism in most modeling frameworks. High-resolution numerical weather prediction (NWP) models are essential tools for simulating urban hydrometeorological conditions, yet most prior evaluations have focused on retrospective reanalysis products rather than forecasts. In this study, we assess the performance of a widely used operational weather forecast model, the High-Resolution Rapid Refresh (HRRR), as a representative example of current NWP systems. We investigate its ability to predict spatial and temporal patterns of urban heat and UHA within and around Lubbock, Texas, a small-sized city located in a semi-arid environment in the southwestern US. Using data collected between 1 September 2023, and 31 August 2024 from the Urban Heat Island Experiment in Lubbock, Texas (U-HEAT) network and five West Texas Mesonet stations, we compare 18 h forecasts against in situ observations. HRRR forecasts exhibit a consistent nighttime cold bias at both urban and rural sites, a daytime warm bias at rural locations, and a pervasive dry bias across all seasons. The model also syste", "link": "https://doi.org/10.5194/gmd-18-9237-2025", "authors": "Yuqi Huang, Chenghao Wang, Tyler Danzig, Temple R. Lee, Sandip Pal", "source": "Geoscientific Model Development", "published": "2025-11-28", "first_seen": "2026-11-24T14:57:46+00:00", "score": 69, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0122.1", "title": "Future Changes in Early Season Severe Weather: A Comparison of Machine Learning and Convection-Permitting Dynamical Downscaling", "summary": "Hazardous convective weather (HCW; i.e., tornadoes, large hail, and severe wind) is a damaging phenomenon caused by thunderstorms. However, future spatiotemporal changes in HCW are unknown, in part associated with the high computational cost of convection-permitting (≤4 km) global climate model simulations. We used the Weather Research and Forecasting (WRF) Model to conduct convection-permitting simulations to project future changes in early season (January–April) HCW over the central-to-eastern United States. Simulations were performed for a historical period (1991–2000) and a future period (2091–2100) forced by representative concentration pathway 8.5. HCW occurrence, defined as updraft vertical velocity (UVV) exceeding 18 m s −1 in a favorable environment, is projected to increase by 173% in the future based on convection-permitting simulations, with a 62% increase in the frequency of days with HCW. Future increases in HCW are supported by increases in UVV, HCW environmental favorability driven by CAPE, and the conditional probability of HCW occurrence. Finally, we trained a machine learning model (a U-Net) on historical convection-permitting data, with a test set withheld in both the historical and future climates to generate predictions of climate changes in HCW. The U-Net produces physically plausible estimates of HCW frequency in both climate states but underpredicts the magnitude of the climate change shift (59% increase, compared to the 173% increase in the dynamical model). If machine learning models can be further fine-tuned to predict storm-scale variables from ", "link": "https://doi.org/10.1175/aies-d-25-0122.1", "authors": "Nathan E. Erickson, Christina M. Patricola-DiRosario", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 69, "topics": ["Downscaling", "Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-024-00600-w", "title": "Convection-permitting climate models offer more certain extreme rainfall projections", "summary": "Extreme precipitation events lead to dramatic impacts on society and the situation will worsen under climate change. Decision-makers need reliable estimates of future changes as a basis for effective adaptation strategies, but projections at local scale from regional climate models (RCMs) are highly uncertain. Here we exploit the km-scale convection-permitting multi-model (CPM) ensemble, generated within the FPS Convection project, to provide new understanding of the changes in local precipitation extremes and related uncertainties over the greater Alpine region. The CPM ensemble shows a stronger increase in the fractional contribution from extreme events than the driving RCM ensemble during the summer, when convection dominates. We find that the CPM ensemble substantially reduces the model uncertainties and their contribution to the total uncertainties by more than 50%. We conclude that the more realistic representation of local dynamical processes in the CPMs provides more reliable local estimates of change, which are essential for policymakers to plan adaptation measures.", "link": "https://doi.org/10.1038/s41612-024-00600-w", "authors": "Giorgia Fosser, Marco Gaetani, Elizabeth J. Kendon, Marianna Adinolfi, Nikolina Ban, Danijel Belušić, Cécile Caillaud, João A. M. Careto", "source": "npj Climate and Atmospheric Science", "published": "2024-2-28", "first_seen": "2026-11-24T14:57:46+00:00", "score": 69, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-016-3210-8", "title": "Impact of Interdecadal Pacific Oscillation on Indian summer monsoon rainfall: an assessment from CMIP5 climate models", "summary": "", "link": "https://doi.org/10.1007/s00382-016-3210-8", "authors": "Manish K. Joshi, Fred Kucharski", "source": "Climate Dynamics", "published": "2016-6-8", "first_seen": "2026-11-24T14:57:46+00:00", "score": 69, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "monsoon"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2022.2", "title": "Evolution of machine learning in environmental science—A perspective", "summary": "The growth of machine learning (ML) in environmental science can be divided into a slow phase lasting till the mid-2010s and a fast phase thereafter. The rapid transition was brought about by the emergence of powerful new ML methods, allowing ML to successfully tackle many problems where numerical models and statistical models have been hampered. Deep convolutional neural network models greatly advanced the use of ML on 2D or 3D data. Transfer learning has allowed ML to progress in climate science, where data records are generally short for ML. ML and physics are also merging in new areas, for example: (a) using ML for general circulation model parametrization, (b) adding physics constraints in ML models, and (c) using ML in data assimilation.", "link": "https://doi.org/10.1017/eds.2022.2", "authors": "William W. Hsieh", "source": "Environmental Data Science", "published": "2022", "first_seen": "2026-11-24T14:57:46+00:00", "score": 69, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.27793", "title": "TerraNostra-Bench: Benchmarking Spatial Downscaling and Temporal Rollout for Global 1-km Land-Use Reconstruction", "summary": "Uncertainty in the terrestrial carbon cycle remains a major constraint in climate projections, partly due to imperfect land surface representations in Earth system models. We propose a data-driven framework for high-resolution land-use reconstruction, treated as a semantic-segmentation task, that combines coarse-resolution scenario data and climate classification with static geophysical features to produce annual land-use maps at 1 km resolution. We introduce TerraNostra-Bench, a change-aware evaluation protocol that separates spatial downscaling from autoregressive temporal rollout and scores models on the rare land-use-change pixels rather than the dominant static background. Using it, we compare convolutional (U-Net) and transformer (Swin) backbones in autoregressive and non-autoregressive schemes against persistence, linear, and shallow convolutional baselines. The autoregressive prior is the most informative input yet accumulates error over long rollouts: autoregressive models lose 5.7-7.2 accuracy points over 13 years, against 2.2-2.8 for non-autoregressive models. This trade-off is governed by the autoregressive choice rather than the backbone. It can be tuned by an inference-time prior-trust threshold that requires no retraining and by the training-time weighting of reconstruction and change objectives; the two levers trace complementary frontiers, with calibration recovering up to 10 accuracy points while keeping change sensitivity above the persistence floor. Extrapolating beyond the training window, backward to 1955-1959 and forward to 2015-2019 under scenario fo", "link": "https://arxiv.org/abs/2610.27793", "authors": "Amirpasha Mozaffari, Marina Castaño, Stefano Materia, Joan Vedrí, Jordi Varela-Agrelo, Dario Garcia-Gasulla, Etienne Tourigny, Mario Acosta", "source": "arXiv", "published": "2026-10-20", "first_seen": "2026-11-24T14:57:46+00:00", "score": 68, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0114.1", "title": "Extratropical Atmospheric Circulation Response to ENSO in Deep Learning Pacific Pacemaker Experiments", "summary": "Coupled atmosphere–ocean deep learning (DL) climate emulators are a new frontier but are known to exhibit weak ENSO variability, raising questions about their ability to simulate its teleconnections. Here, we present the first Pacific pacemaker (PACE) experiments using a coupled DL Earth system model (DLESyM) to bypass this weak variability and isolate the atmospheric response to observed ENSO forcing. We find that while the emulator realistically captures internal atmospheric variability, it produces a significantly amplified forced teleconnection response to ENSO. This amplified response leads to biases in simulating extremes, notably an overestimation of atmospheric blocking frequency and duration and an underestimation of peak intensity. Our findings underscore that coupled DL climate models require in-depth, process-based evaluation, analogous to traditional numerical models, to build confidence in their use for climate simulation and analysis. Significance Statement Deep learning (DL) ocean–atmosphere coupled climate models offer computational efficiency for climate science but exhibit weak El Niño and La Niña variability, raising questions about whether they realistically simulate remote weather impacts. We bypassed this limitation by constraining tropical Pacific Ocean temperatures to match historical observations, directly testing the atmospheric response in a DL coupled climate model. The model captures realistic spatial patterns but produces responses approximately 50% stronger than conventional-physics-based models. These amplified responses cause biases in simu", "link": "https://doi.org/10.1175/aies-d-25-0114.1", "authors": "Zhanxiang Hua, Christina Karamperidou, Zilu Meng", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 68, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme", "emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ms003763", "title": "Data‐Driven Equation Discovery of a Cloud Cover Parameterization", "summary": "A promising method for improving the representation of clouds in climate models, and hence climate projections, is to develop machine learning‐based parameterizations using output from global storm‐resolving models. While neural networks (NNs) can achieve state‐of‐the‐art performance within their training distribution, they can make unreliable predictions outside of it. Additionally, they often require post‐hoc tools for interpretation. To avoid these limitations, we combine symbolic regression, sequential feature selection, and physical constraints in a hierarchical modeling framework. This framework allows us to discover new equations diagnosing cloud cover from coarse‐grained variables of global storm‐resolving model simulations. These analytical equations are interpretable by construction and easily transferable to other grids or climate models. Our best equation balances performance and complexity, achieving a performance comparable to that of NNs ( R 2 = 0.94) while remaining simple (with only 11 trainable parameters). It reproduces cloud cover distributions more accurately than the Xu‐Randall scheme across all cloud regimes (Hellinger distances < 0.09), and matches NNs in condensate‐rich regimes. When applied and fine‐tuned to the ERA5 reanalysis, the equation exhibits superior transferability to new data compared to all other optimal cloud cover schemes. Our findings demonstrate the effectiveness of symbolic regression in discovering interpretable, physically‐consistent, and nonlinear equations to parameterize cloud cover.", "link": "https://doi.org/10.1029/2023ms003763", "authors": "Arthur Grundner, Tom Beucler, Pierre Gentine, Veronika Eyring", "source": "Journal of Advances in Modeling Earth Systems", "published": "2024-2-29", "first_seen": "2026-11-24T14:57:46+00:00", "score": 68, "topics": ["Deep Learning", "Climate Modelling"], "watch": ["Tom Beucler", "Pierre Gentine", "Veronika Eyring"], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1029/2020ms002225", "title": "Process‐Based Climate Model Development Harnessing Machine Learning: II. Model Calibration From Single Column to Global", "summary": "We demonstrate a new approach for climate model tuning in a realistic situation. Our approach, the mathematical foundations and technical details of which are given in Part I, systematically uses a single‐column configuration of a global atmospheric model on test cases for which reference large‐eddy‐simulations are available. The space of free parameters is sampled running the single‐column model from which metrics are estimated in the full parameter space using emulators. The parameter space is then reduced by retaining only the values for which the emulated metrics match large eddy simulations within a given tolerance to error. The approach is applied to the 6A version of the LMDZ model which results from a long investment in the development of physics parameterizations and by‐hand tuning. The boundary layer is revisited by increasing the vertical resolution and varying parameters that were kept fixed so far, which improves the representation of clouds at process scale. The approach allows us to automatically reach a tuning of this modified configuration as good as that of the 6A version. We show how this approach helps accelerate the introduction of new parameterizations. It allows us to maintain the physical foundations of the model and to ensure that the improvement of global metrics is obtained for a reasonable behavior at process level, reducing the risk of error compensations that may arise from over‐fitting some climate metrics. That is, we get things right for the right reasons.", "link": "https://doi.org/10.1029/2020ms002225", "authors": "Frédéric Hourdin, Daniel Williamson, Catherine Rio, Fleur Couvreux, Romain Roehrig, Najda Villefranque, Ionela Musat, Laurent Fairhead", "source": "Journal of Advances in Modeling Earth Systems", "published": "2021-6", "first_seen": "2026-11-24T14:57:46+00:00", "score": 68, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-026-01579-2", "title": "Resolution-adaptive generative ensemble prediction with integrated global-to-regional modelling on unstructured meshes", "summary": "Integrated global-to-regional ensemble prediction represents an important frontier in Earth system science, yet its realization is hindered by the prohibitive computational cost of running large ensembles on the associated unstructured variable-resolution meshes. Here we introduce HiRe-EFM, a generative deep learning model designed for integrated global-to-regional large-ensemble weather prediction. To address the dual challenges of geometric complexity and multi-scale information flow, HiRe-EFM employs a geometrically consistent mapping onto hierarchical meshes, implements adaptive cross-scale fusion, and incorporates localized enhancement to restore details in refined regions. Benchmarked against a state-of-the-art baseline on a global variable-resolution simulation dataset, HiRe-EFM improves global CRPS by 12.8% while maintaining well-calibrated ensemble dispersion. Crucially, the improvement rises to 16.1% within high-resolution target areas, demonstrating HiRe-EFM exploits the advantages of global variable-resolution simulations. By accelerating global ensemble forecasting by over three orders of magnitude, this study provides a viable pathway for integrated global-to-regional large-ensemble weather prediction.", "link": "https://doi.org/10.1038/s41612-026-01579-2", "authors": "Meixia Ren, Tao Wu, Wei Sun, Binqian Zhang, Jian Li, Yi Zhang, Yihui Zhou", "source": "npj Climate and Atmospheric Science", "published": "2026-11-19", "first_seen": "2026-11-24T14:57:46+00:00", "score": 68, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-24-0192.1", "title": "Machine Learning Models for Daily Rainfall Forecasting in Northern Tropical Africa Using Tropical Wave Predictors", "summary": "Numerical weather prediction models often struggle to outperform simple climatology-based precipitation forecasts in northern tropical Africa, even after statistical postprocessing. Artificial intelligence (AI)-based methods show promise, but accurately incorporating precipitation remains challenging. This study explores, for the first time, the predictive value of synoptic–planetary-scale forcing associated with African easterly waves (AEWs) and other tropical waves using machine learning (ML). We apply a gamma regression and convolutional neural network (CNN), trained on wave predictors derived from satellite-based rainfall estimates (GPM IMERG), to predict daily rainfall during the July–September monsoon season. Predictor variables capture local amplitude and phase information from seven wave types at the target 1° × 1° degree grid box and adjacent upstream and downstream neighbors, with important predictors selected via gradient-boosting regression. We find downstream predictors contributing most significantly to model skill, highlighting robust predictability of rainfall suppression during dry wave phases. Tropical depression (AEWs) emerges as the most influential predictor, while mixed Rossby–gravity, Kelvin, and inertio-gravity waves show importance in specific subregions. We transform deterministic ML predictions into probabilistic forecasts using the novel Easy Uncertainty Quantification (EasyUQ) and compare them against three benchmarks: extended probabilistic climatology with a 15-day window (EPC15) derived from GPM IMERG, European Centre for Medium-Range Weather", "link": "https://doi.org/10.1175/waf-d-24-0192.1", "authors": "Athul Rasheeda Satheesh, Peter Knippertz, Andreas H. Fink", "source": "Weather and Forecasting", "published": "2025-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 68, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["monsoon", "precipitation", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2025.10", "title": "WindDragon: automated deep learning for regional wind power forecasting", "summary": "Achieving net-zero carbon emissions by 2050 necessitates the integration of substantial wind power capacity into national power grids. However, the inherent variability and uncertainty of wind energy present significant challenges for grid operators, particularly in maintaining system stability and balance. Accurate short-term forecasting of wind power is therefore essential. This article introduces an innovative framework for regional wind power forecasting over short-term horizons (1–6 h), employing a novel Automated Deep Learning regression framework called WindDragon. Specifically designed to process wind speed maps, WindDragon automatically creates Deep Learning models leveraging Numerical Weather Prediction (NWP) data to deliver state-of-the-art wind power forecasts. We conduct extensive evaluations on data from France for the year 2020, benchmarking WindDragon against a diverse set of baselines, including both deep learning and traditional methods. The results demonstrate that WindDragon achieves substantial improvements in forecast accuracy over the considered baselines, highlighting its potential for enhancing grid reliability in the face of increased wind power integration.", "link": "https://doi.org/10.1017/eds.2025.10", "authors": "Julie Keisler, Etienne Le Naour", "source": "Environmental Data Science", "published": "2025", "first_seen": "2026-11-24T14:57:46+00:00", "score": 68, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.28315", "title": "Stochastic climate emulation at reduced cost with ACE2.5-ERA5", "summary": "We introduce ACE2.5-ERA5 (Ai2 Climate Emulator of ERA5, version 2.5), a stochastic autoregressive weather-climate AI model that produces calibrated weather ensembles with realistic small-scale structure on timescales from days to centuries. Its deterministic predecessor, ACE2-ERA5, retains 36% of its ERA5 target's precipitation spectral power at total wavenumbers 100--179; ACE2.5-ERA5 retains 86%. In weather forecasts its ensemble spread matches its error to within 4% from day 3. Time-mean climate is on par with or better than ACE2-ERA5, the precipitation response to ENSO is improved, and the model is stable over 1000 years. Interannual variability of global mean surface temperature is shown not to be calibrated in either ACE2.5-ERA5 or its predecessor. ACE2.5-ERA5 differs from ACE2-ERA5 in three ways. Noise-conditioned layer normalization, trained with a combined CRPS and spectral energy score loss in place of mean squared error, makes it stochastic. Spectral bottlenecking with grouped convolutions cuts the Spherical Fourier Neural Operator's spectral filter parameters by more than two orders of magnitude and leaves a model a tenth the size of ACE2-ERA5. Its time step is daily rather than 6-hourly. ACE2.5-ERA5 has 3.2 times the inference throughput of ACE2-ERA5. A 6-hourly variant has weather prediction skill similar to ACE2-ERA5. A 4-degree variant reaches comparable climate skill at an order of magnitude lower training cost, enabling rapid iteration during development. We release 1-degree daily, 4-degree daily and 1-degree 6-hourly checkpoints.", "link": "https://arxiv.org/abs/2611.28315", "authors": "Jeremy McGibbon, Troy Arcomano, Spencer K. Clark, James P. C. Duncan, Brian Henn, Oliver Watt-Meyer", "source": "arXiv", "published": "2026-11-20", "first_seen": "2026-11-24T14:57:46+00:00", "score": 67, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.23863", "title": "Comparing Data-Driven and Numerical Weather Prediction Forecasts of Extreme Weather: A Review", "summary": "Data-driven weather forecasting models, chiefly trained on reanalysis data, now match or beat physics-based numerical weather prediction (NWP) models on most headline scores, but whether this advantage extends to extreme weather is contested. We review peer-reviewed studies that directly compare data-driven forecasts with NWP for extremes, from nowcasting to subseasonal lead times. We discuss grey literature in the outlook but do not include it in the formal review. There is good agreement on the fact that data-driven models mostly outperform NWP on temperature extremes, tropical cyclone tracks and the location of synoptic features across time scales. The evidence is mixed for extreme precipitation and feature-based extreme event detection such as extremes related to atmospheric rivers, while it leans toward better NWP performance for estimating event intensity. For record-breaking events that lie outside the training distribution, the evidence is narrower. Nonetheless, both a systematic global evaluation and several case studies find that physics-based models retain the advantage, with data-driven models underestimating both the frequency and the magnitude of records. Hybrid systems that post-process NWP with machine-learning (ML), or couple data-driven forecasts with physics-based models, deliver some of the largest and most consistent gains. We argue that headline scores, verification choices and case selection explain much of the apparent disagreement in the literature, and provide recommendations for a more trustworthy and interpretable evaluation of data-driven models", "link": "https://arxiv.org/abs/2611.23863", "authors": "Gabriele Messori, Hiu-Wang Lau, Chenyu Dong, Gianmarco Mengaldo, Leonardo Olivetti", "source": "arXiv", "published": "2026-11-18", "first_seen": "2026-11-24T14:57:46+00:00", "score": 67, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.10882", "title": "Guiding future global temperature distributions with simulations and observations", "summary": "Assessing climate risks requires projections of daily temperature distributions, including rare and spatially widespread extremes. Climate simulations are costly and biased, while correcting them toward observations risks suppressing inter-model differences. We train a single machine-learning emulator, a conditional diffusion model, on seventeen CMIP6 models and ERA5 reanalysis to generate spatially coherent daily temperature fields conditioned on model identity, date, and CO2-equivalent concentration. At sampling time, diffusion guidance reduces model biases by steering each emulated climate-model distribution toward observations, with its strength selected through perfect-model experiments using withheld simulated futures. Observational influence decreases with projection horizon and forcing. Across seventeen synthetic targets, guidance more than halves median biases in the 1st and 99th percentiles of daily temperature, improves probabilistic scores and reliability, and reduces median annual global-mean temperature RMSE by 32-57% across three emission scenarios. In a detailed benchmark, guidance also outperforms established bias corrections on daily-field probabilistic scores. Efficient sampling generates large ensembles without further climate simulations. For example, our framework corrects CMIP6's roughly threefold historical overestimate of extreme-heat coverage, yet projects that concurrent extremes will affect nearly half of global land on a typical day in the 2080s under SSP3-7.0.", "link": "https://arxiv.org/abs/2611.10882", "authors": "Francesco Immorlano, Elijah Tavares, Felix Draxler, Juan Nathaniel, Violette Launeau, Duncan Watson-Parris, Padhraic Smyth, Pierre Gentine", "source": "arXiv", "published": "2026-11-07", "first_seen": "2026-11-24T14:57:46+00:00", "score": 67, "topics": ["Deep Learning", "Climate Modelling"], "watch": ["Pierre Gentine"], "boosts": ["cmip6", "extreme", "diffusion model", "emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "arxiv:2611.03925", "title": "Tropical Cyclone-Following Dataset for Limited-Area Machine Learning Applications", "summary": "This work presents a lightweight dataset of tropical cyclone (TC)-following meteorological variables to facilitate the development and application of machine learning (ML) methods in TC research. Using outputs from our previous climate downscaling and idealized simulations, the dataset is constructed as multichannel video sequences that track TC centers throughout their lifetimes. To demonstrate the dataset utility, we present an application in which a regional ML model is trained to predict TC intensity with explicit incorporation of lateral boundary conditions. Our results highlight the importance of lateral boundary information for predicting TC intensity with ML models inside a limited-area domain, underscoring the need to properly account for lateral boundaries when developing regional ML models for TC intensity forecast.", "link": "https://arxiv.org/abs/2611.03925", "authors": "Minh-Khanh Luong, Chanh Kieu", "source": "arXiv", "published": "2026-11-02", "first_seen": "2026-11-24T14:57:46+00:00", "score": 67, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2018ms001561", "title": "Evaluation of Machine Learning Classifiers for Predicting Deep Convection", "summary": "The realistic representation of convection in atmospheric models is paramount for skillful predictions of hazardous weather as well as climate, yet climate models especially suffer from large uncertainties in the parameterization of clouds and convection. In this work, we examine the use of machine learning (ML) to predict the occurrence of deep convection from a state‐of‐the‐art atmospheric reanalysis (ERA5). Logistic regression, random forests, gradient‐boosted decision trees, and deep neural networks were trained with lightning data to predict thunderstorm occurrence (TO) in Central and Northern Europe (2012–2017) and in Sri Lanka (2016–2017). Up to 40 input variables were used, representing, for example, instability, humidity, and inhibition. Feature importances derived for the various models emphasize the high importance of conditional instability for deep convection in Europe, while in Sri Lanka, TO is more strongly regulated by humidity. The Precision‐Recall curve indicates more than a twofold improvement in skill over convective available potential energy for short‐term (0–45 min) predictions of TO in Europe by using neural networks or gradient‐boosted decision tree and a larger improvement in the tropical domain. The diurnal cycle of deep convection is closely reproduced, suggesting that ML could be used to trigger convection in climate models. Finally, a strong relationship was found between area‐mean monthly TO and ML predictions, with correlation coefficients exceeding 0.94 in all domains. Convective available potential energy has a similar level of correlation ", "link": "https://doi.org/10.1029/2018ms001561", "authors": "Peter Ukkonen, Antti Mäkelä", "source": "Journal of Advances in Modeling Earth Systems", "published": "2019-6", "first_seen": "2026-11-24T14:57:46+00:00", "score": 67, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-020-05494-x", "title": "Assessing mean climate change signals in the global CORDEX-CORE ensemble", "summary": "The new Coordinated Output for Regional Evaluations (CORDEX-CORE) ensemble provides high-resolution, consistent regional climate change projections for the major inhabited areas of the world. It serves as a solid scientific basis for further research related to vulnerability, impact, adaptation and climate services in addition to existing CORDEX simulations. The aim of this study is to investigate and document the climate change information provided by the CORDEX-CORE simulation ensemble, as a part of the World Climate Research Programme (WCRP) CORDEX community. An overview of the annual and monthly mean climate change information in selected regions in different CORDEX domains is presented for temperature and precipitation, providing the foundation for detailed follow-up studies and applications. Initially, two regional climate models (RCMs), REMO and RegCM were used to downscale global climate model output. The driving simulations by AR5 global climate models (AR5-GCMs) were selected to cover the spread of high, medium, and low equilibrium climate sensitivity at a global scale. The CORDEX-CORE ensemble has doubled the spatial resolution compared to the previously existing CORDEX simulations in most of the regions (25 $$\\,\\mathrm {km}$$ km (0.22 $$^{\\circ }$$ ∘ ) versus 50 $$\\,\\mathrm {km}$$ km (0.44 $$^{\\circ }$$ ∘ )) leading to a potentially improved representation of, e.g., physical processes in the RCMs. The analysis focuses on changes in the IPCC physical climate reference regions. The results show a general reasonable representation of the spread of the temperature a", "link": "https://doi.org/10.1007/s00382-020-05494-x", "authors": "Claas Teichmann, Daniela Jacob, Armelle Reca Remedio, Thomas Remke, Lars Buntemeyer, Peter Hoffmann, Arne Kriegsmann, Ludwig Lierhammer", "source": "Climate Dynamics", "published": "2020-11-9", "first_seen": "2026-11-24T14:57:46+00:00", "score": 67, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-16-0099.1", "title": "AROME-MetCoOp: A Nordic Convective-Scale Operational Weather Prediction Model", "summary": "Since October 2013 a convective-scale weather prediction model has been used operationally to provide short-term forecasts covering large parts of the Nordic region. The model is now operated by a bilateral cooperative effort [Meteorological Cooperation on Operational Numerical Weather Prediction (MetCoOp)] between the Norwegian Meteorological Institute and the Swedish Meteorological and Hydrological Institute. The core of the model is based on the convection-permitting Applications of Research to Operations at Mesoscale (AROME) model developed by Météo-France. In this paper the specific modifications and updates that have been made to suit advanced high-resolution weather forecasts over the Nordic regions are described. This includes modifications in the surface drag description, microphysics, snow assimilation, as well as an update of the ecosystem and surface parameter description. Novel observation types are introduced in the operational runs, including ground-based Global Navigation Satellite System (GNSS) observations and radar reflectivity data from the Norwegian and Swedish radar networks. After almost two years’ worth of experience with the AROME-MetCoOp model, the model’s sensitivities to the use of specific parameterization settings are characterized and the forecast skills demonstrating the benefit as compared with the global European Centre for Medium-Range Weather Forecasts’ Integrated Forecasting System (ECMWF-IFS) are evaluated. Furthermore, case studies are provided to demonstrate the ability of the model to capture extreme precipitation and wind events.", "link": "https://doi.org/10.1175/waf-d-16-0099.1", "authors": "Malte Müller, Mariken Homleid, Karl-Ivar Ivarsson, Morten A. Ø. Køltzow, Magnus Lindskog, Knut Helge Midtbø, Ulf Andrae, Trygve Aspelien", "source": "Weather and Forecasting", "published": "2017-3-15", "first_seen": "2026-11-24T14:57:46+00:00", "score": 67, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-26-0033.1", "title": "A Language-Inspired Superresolution Architecture (LISA) for U.S. West Coast Low-Level Winds", "summary": "High-fidelity, high-resolution wind fields in the lower boundary layer are vital for energy planning, shipping, and coastal infrastructure, yet they remain computationally costly to obtain with conventional numerical models at a kilometer scale. We introduce the Language-Inspired Superresolution Architecture (LISA), a transformer encoder–decoder that maps hourly 0.25° fifth generation European Centre for Medium-Range Weather Forecasts (ECMWF) atmospheric reanalysis (ERA5) fields to hourly 3-km vector winds at 80 m over the U.S. West Coast. LISA offers two innovations. First, a wide-field encoder is pretrained with self-supervised masked autoencoding on two decades of unpaired ERA5 data, harvesting abundant coarse data without high-resolution labels. Second, a localization stage fine-tunes the system on 4.3 years of High-Resolution Rapid Refresh (HRRR) analyses using a progressive-mask curriculum that forces the decoder to infer an increasingly large portion of the 3-km field from large-scale context provided by ERA5. In out-of-sample testing for a whole year, the 4-h model (LISA-4h) reduces annual bias by 25% relative to the U-Net baseline (−0.29 vs +0.39 m s −1 ), while retaining comparable correlation (0.88 vs 0.91). LISA’s gains are most pronounced during downslope winds and coastal low-level jets, where root-mean-square error decreases up to 15%. Attention diagnostics reveal physically consistent focus on upper-level winds and geopotential height during atmospheric rivers and on 700-hPa winds and surface pressure during mechanically forced events, providing interpretabl", "link": "https://doi.org/10.1175/aies-d-26-0033.1", "authors": "Jack Dermigny, Sha Feng, Ye Liu, Larry K. Berg", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 66, "topics": ["Downscaling", "Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022ms003211", "title": "SwinVRNN: A Data‐Driven Ensemble Forecasting Model via Learned Distribution Perturbation", "summary": "The data‐driven approaches for medium‐range weather forecasting are recently shown to be extraordinarily promising for ensemble forecasting due to their fast inference speed compared to the traditional numerical weather prediction models. However, their forecast accuracy can hardly match the state‐of‐the‐art operational ECMWF Integrated Forecasting System (IFS) model. Previous data‐driven approaches perform ensemble forecasting using some simple perturbation methods, like the initial condition perturbation and the Monte Carlo dropout. However, their ensemble performance is often limited arguably by the sub‐optimal ways of applying perturbation. We propose a Swin Transformer‐based Variational Recurrent Neural Network (SwinVRNN), which is a stochastic weather forecasting model combining a SwinRNN predictor with a perturbation module. SwinRNN is designed as a Swin Transformer‐based recurrent neural network, which predicts the future states deterministically. Furthermore, to model the stochasticity in the prediction, we design a perturbation module following the Variational Auto‐Encoder paradigm to learn the multivariate Gaussian distributions of a time‐variant stochastic latent variable from the data. Ensemble forecasting can be easily performed by perturbing the model features leveraging the no
