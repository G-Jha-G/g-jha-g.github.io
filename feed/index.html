ry": "Large socioeconomic impact of the Indian summer monsoon (ISM) extremes motivated numerous attempts at its long range prediction over the past century. However, a rather low potential predictability (PP) of the seasonal ISM, contributed significantly by “internal,” interannual variability was considered insurmountable. Here we show that the internal variability contributed by the ISM subseasonal (synoptic + intraseasonal) fluctuations, so far considered chaotic, is partly predictable as found to be tied to slowly varying forcing (e.g., El Niño and Southern Oscillation). This provides a scientific basis for predictability of the ISM rainfall beyond the conventional estimates of PP. We establish a much higher actual limit of PP ( r ∼0.82) through an extensive reforecast experiment (1,920 years of simulation) by improving two major physics in a global coupled climate model, which raises a hope for a very reliable dynamical seasonal ISM forecasting in the near future.", "link": "https://doi.org/10.1029/2018jd030082", "authors": "Subodh Kumar Saha, Anupam Hazra, Samir Pokhrel, Hemantkumar S. Chaudhari, K. Sujith, Archana Rai", "source": "JGR: Atmospheres", "published": "2019-2-19", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["india*", "monsoon", "extreme*"]}, {"key": "doi:10.1002/jgrd.50571", "title": "Projection of occurrence of extreme dry‐wet years and seasons in Europe with stationary and nonstationary Standardized Precipitation Indices", "summary": "The probabilities of the occurrence of extreme dry/wet years and seasons in Europe are estimated by using two ways of the Standardized Precipitation Index (SPI and SPI‐GEV) and the Standardized Nonstationary Precipitation Index (SnsPI). The latter is defined as the SPI by fitting precipitation data with a nonstationary Gamma distribution in order to model the precipitation time dependence under climate change. Bias‐corrected daily precipitation outputs from five different regional climate models (RCMs) provided by the ENSEMBLES project are used. The five RCMs are selected so as to represent the main statistical properties of the whole ENSEMBLES set and the most extreme deviation from the ensemble mean. All indicators are calculated for the ensemble of the five models over the period 1971–2098. Results show that under global warming, climate in Europe will significantly change from its current state with the probability of the occurrence of extreme dry and wet years and seasons increasing, respectively, over southern dry and northern wet regions. Comparing nonstationary and stationary indices, the SnsPI is found to be more robust than the common SPI in the prediction of precipitation changes with multimodel ensembles.", "link": "https://doi.org/10.1002/jgrd.50571", "authors": "S. Russo, A. Dosio, A. Sterl, P. Barbosa, J. Vogt", "source": "JGR: Atmospheres", "published": "2013-7-25", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1029/2023jd038513", "title": "Identifying Robust Changes of Extreme Precipitation in Japan From Large Ensemble 5‐km‐Grid Regional Experiments for 4K Warming Scenario", "summary": "To evaluate the impacts of global warming on local‐scale extreme precipitation in Japan, 720‐year ensemble dynamical downscaling is conducted by a regional climate model with a 5 km grid spacing. Our dynamical downscaling is based on the large ensemble data set called the database for Policy Decision making for Future climate change (d4PDF). Comparing the historical and 4K warming climates, the annual maximum daily and hourly precipitation are enhanced over Japan due to global warming. The increasing rate of annual maximum daily precipitation is larger over the coast of the Pacific Ocean in eastern and western Japan and the northern parts of Japan. The periods in which the extreme daily precipitation increases in each region depend on the movement of the Baiu front and the number of typhoons from June through September. The 50‐year return value of the maximum 24‐hr land precipitation within 500 km of the typhoon center is 960 mm/24hr in the 5 km experiment. This value is larger by 1.87 times than that of the 20 km experiment. The rate of future increase in the 50‐year return value related to typhoons is 1.30 relative to the present values for the 5 km experiments. The local‐scale quasi‐stationary band‐shaped precipitation system, which is called senjo‐kousuitai in Japanese, sometimes brings local‐scale heavy precipitation to Japan. The senjo‐kousuitai is well reproduced in the 5 km experiments and shows increases in frequency and intensity under the 4K warming condition. This study also discusses the application of our 5 km experiments to hydrological fields.", "link": "https://doi.org/10.1029/2023jd038513", "authors": "H. Kawase, M. Nosaka, S. I. Watanabe, K. Yamamoto, T. Shimura, Y. Naka", "source": "JGR: Atmospheres", "published": "2023-9-19", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1002/2015jd024651", "title": "New gridded daily climatology of Finland: Permutation‐based uncertainty estimates and temporal trends in climate", "summary": "Long‐term time series of key climate variables with a relevant spatiotemporal resolution are essential for environmental science. Moreover, such spatially continuous data, based on weather observations, are commonly used in, e.g., downscaling and bias correcting of climate model simulations. Here we conducted a comprehensive spatial interpolation scheme where seven climate variables (daily mean, maximum, and minimum surface air temperatures, daily precipitation sum, relative humidity, sea level air pressure, and snow depth) were interpolated over Finland at the spatial resolution of 10 × 10 km 2 . More precisely, (1) we produced daily gridded time series ( FMI _ ClimGrid ) of the variables covering the period of 1961–2010, with a special focus on evaluation and permutation‐based uncertainty estimates, and (2) we investigated temporal trends in the climate variables based on the gridded data. National climate station observations were supplemented by records from the surrounding countries, and kriging interpolation was applied to account for topography and water bodies. For daily precipitation sum and snow depth, a two‐stage interpolation with a binary classifier was deployed for an accurate delineation of areas with no precipitation or snow. A robust cross‐validation indicated a good agreement between the observed and interpolated values especially for the temperature variables and air pressure, although the effect of seasons was evident. Permutation‐based analysis suggested increased uncertainty toward northern areas, thus identifying regions with suboptimal station densit", "link": "https://doi.org/10.1002/2015jd024651", "authors": "Juha Aalto, Pentti Pirinen, Kirsti Jylhä", "source": "JGR: Atmospheres", "published": "2016-4-22", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "uncertainty"]}, {"key": "doi:10.1038/s41612-023-00458-4", "title": "Drought characteristics in Mediterranean under future climate change", "summary": "The present work aims to address the physical properties of different drought types under near-future climates in the Mediterranean. To do so, we use a multi-model mean of the bias-adjusted and downscaled product of five Earth System Models participating in the Coupled Model Intercomparison Project—phase6 (CMIP6), provided by Inter-Sectoral Impact Model Intercomparison Project (ISIMIP), under four shared socioeconomic pathways (SSP1–2.6, SSP2–4.5, SSP3–7.0, and SSP5–8.5) for the period 2021–2060, to estimate the Standardized Precipitation Evapotranspiration Index (SPEI) at 1-, 6-, and 12-month time scales, and address the meteorological, agricultural, and hydrological drought, respectively. Additionally, SPEI is calculated from the bias-adjusted CMIP6 historical simulations and the reanalysis ‘WFDE5’ for 1980–2014 as a historical and reference period. The comparison of the CMIP6 with WFDE5 reveals a consistently increasing tendency for drought occurrences in the Mediterranean, particularly for agricultural and hydrological drought time scales. Nonetheless, an overestimation in historical trend magnitude is shown by the CMIP6 with respect to WFDE5. The projection results depict drought frequencies ranging between 12 and 25% of the studied period 2021–2060, varying with regions and climate scenarios. The tendency to increase the drought frequency is more pronounced in the southern than northern Mediterranean countries. Drought severity is remarkable in the aggregated time scales; consequently, more pressure is foreseen in the food and water sectors. Drought seasonality reveal", "link": "https://doi.org/10.1038/s41612-023-00458-4", "authors": "Yassmin H. Essa, Martin Hirschi, Wim Thiery, Ahmed M. El-Kenawy, Chunxue Yang", "source": "npj Climate and Atmospheric Science", "published": "2023-9-7", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation"]}, {"key": "doi:10.5194/wcd-5-345-2024", "title": "Increasing frequency and lengthening season of western disturbances are linked to increasing strength and delayed northward migration of the subtropical jet", "summary": "Western disturbances (WDs) are cyclonic storms that travel along the subtropical jet, bringing the majority of seasonal and extreme precipitation to the Hindu Kush, Karakoram, and western Himalaya in the winter months. They are a vital component of the region's water security. Although typically most common in the winter, WDs can also interact with the summer monsoon, leading to catastrophic consequences. These seem to be happening more frequently, and along with increasingly harsh winter seasons, questions are now being asked about how climate change is affecting WD frequency and intensity in both summer and winter seasons. An analysis of 17 previous studies assessing trends in WD frequency revealed no consensus, at least in part because they quantified trends in different regions, seasons, and time periods. In this study, a more robust approach is used, quantifying trends in WD frequency and intensity by region and month using a track catalogue derived from 70 years of European Centre for Medium-Range Weather Forecasts (ECMWF) reanalysis (ERA5) data. Winter WDs have increased significantly over the western and central Himalaya and the Hindu Kush in the last 70 years. This trend is attributed to a strengthening of the subtropical jet. The WD season has also significantly lengthened with WDs becoming far more common in May, June, and July, months where they were previously rare. For example, WDs have been twice as common in June in the last 20 years than during the previous 50. This is attributed to a delayed northward retreat of the subtropical jet, which historically has ", "link": "https://doi.org/10.5194/wcd-5-345-2024", "authors": "Kieran M. R. Hunt", "source": "Weather and Climate Dynamics", "published": "2024-3-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["india*", "himalaya*", "monsoon", "precipitation", "extreme*"]}, {"key": "doi:10.5194/wcd-5-1103-2024", "title": "The connection between North Atlantic storm track regimes and eastern Mediterranean cyclonic activity", "summary": "A unique chain connects the flow over the North Atlantic and the development of cyclones within the Mediterranean basin. One typical mechanism includes several successive processes: upper-level flow perturbations upstream cause Rossby wave breaking (RWB) events along the jet stream, which in turn develop into potential vorticity streamers. These streamers reach the Mediterranean, and through increased baroclinicity they enhance cyclonic activity in the region. Using European Centre for Medium-Range Weather Forecasts (ECMWF) reanalysis v5 (ERA5) data and rain gauge measurements, we provide a systematic analysis connecting wintertime North Atlantic storm track regimes and eastern Mediterranean cyclones and rainfall. To do so, we use different detection algorithms for each element in the chain (RWBs, streamers and cyclones). A cluster analysis of upper-tropospheric eddy kinetic energy reveals a favorable configuration of the storm track where North Atlantic storms are able to propagate farther northeast. This results in upper-level potential vorticity streamers forming more eastward alongside above-average precipitation over the Levant. Meanwhile, other latitudinal positions of the storm track (southward or northward) were found to hinder cyclonic activity in the region and reduce rainfall there. The intense rainy winter of 1991–1992 is brought as a test case to exemplify this mechanism in its extreme. We show that the rain-enhancing storm track regime was prominent throughout most of this season, alongside frequent streamers in the eastern Mediterranean.", "link": "https://doi.org/10.5194/wcd-5-1103-2024", "authors": "Dor Sandler, Hadas Saaroni, Baruch Ziv, Talia Tamarin-Brodsky, Nili Harnik", "source": "Weather and Climate Dynamics", "published": "2024-9-10", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.5194/wcd-6-43-2025", "title": "Western disturbances and climate variability: a review of recent developments", "summary": "Western disturbances (WDs) are synoptic-scale weather systems embedded within the subtropical westerly jet. Manifesting as upper-level troughs often associated with a lower-tropospheric low over western or northern India, they share some dynamical features with extratropical cyclones. WDs are most common during the boreal winter (December to March), during which they bring the majority of precipitation – both rain and snow – to the western Himalaya, as well as to surrounding areas of north India, Pakistan, and the Tibetan Plateau. WDs are also associated with weather hazards such as heavy snowfall, hailstorms, fog, cloudbursts, avalanches, frost, and cold waves. In this paper, we review recent developments in understanding WDs and their impacts. Over the last decade, recent studies have collectively made use of novel data, novel analysis techniques such as tracking algorithms, and the increasing availability of high-resolution weather and climate models. This review is separated into six main sections – structure and thermodynamics, precipitation and impacts, teleconnections, modelling experiments, forecasting at a range of scales, and paleoclimate and climate change – each motivated with a brief discussion of the accomplishments and limitations of previous research. A number of step changes in understanding are synthesised. Use of new modelling frameworks and tracking algorithms has significantly improved knowledge of WD structure and variability, and a more frequentist approach can now be taken. Improved observation systems have helped quantification of water security ove", "link": "https://doi.org/10.5194/wcd-6-43-2025", "authors": "Kieran M. R. Hunt, Jean-Philippe Baudouin, Andrew G. Turner, A. P. Dimri, Ghulam Jeelani, ", "source": "Weather and Climate Dynamics", "published": "2025-1-9", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["india*", "himalaya*", "precipitation"]}, {"key": "doi:10.5194/wcd-7-1525-2026", "title": "Multi-model high-resolution analysis of Tropical-Like Cyclone Daniel with WRF and ICON: peculiarities and sensitivity to convection schemes", "summary": "Medicane Daniel (September 2023) featured a multi-stage transition from a baroclinic disturbance to a compact tropical-like vortex, culminating in a rapid barotropic alignment on 9 September, challenging short-range prediction. This study delivers a side-by-side, high-resolution (∼ 2 km) assessment of Daniel using two state of the art weather forecasting models, WRF and ICON, configured to be as comparable as possible in terms of domain, forcing and vertical discretizations. Seven numerical simulations are compared assessing also sensitivity to the convection scheme: fully explicit, deep-cumulus parameterized and independent shallow-convection options (plus ICON's grayzone setting). Analysis methods include an objective cyclone tracker that combines mean sea-level pressure and lower tropospheric geopotential structure, intensity metrics (central pressure and 10 m wind) along the track, precipitation anomalies regridded against IMERG observations (Integrated Multi-satellitE Retrievals for GPM). Tropical characteristics are examined with Hart's Cyclone Phase Space and Temporal Annular Symmetric Mean (TASM) of equivalent potential temperature and wind to distill three-dimensional, time-mean storm structure during the peak warm-core phase. Both models reproduce Daniel's life cycle and produce realistic tracks. Intensity of the cyclone sharply varies from simulation to simulation, with different behavior of each model at changes in convection scheme. The study emphasizes the different responses of the two models both in reproducing such an extreme meteorological phenomenon and i", "link": "https://doi.org/10.5194/wcd-7-1525-2026", "authors": "Piero Serafini, Antonio Ricchi, Chiara Marsigli, Cristiano D'Amico, Matteo Nastasi, Renata Pelosini", "source": "Weather and Climate Dynamics", "published": "2026-8-26", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.5194/wcd-1-127-2020", "title": "Potential vorticity structure of embedded convection in a warm conveyor belt and its relevance for large-scale dynamics", "summary": "Warm conveyor belts (WCBs) are important airstreams in extratropical cyclones. They can influence large-scale flow evolution by modifying the potential vorticity (PV) distribution during their cross-isentropic ascent. Although WCBs are typically described as slantwise-ascending and stratiform-cloud-producing airstreams, recent studies identified convective activity embedded within the large-scale WCB cloud band. However, the impacts of this WCB-embedded convection have not been investigated in detail. In this study, we systematically analyze the influence of embedded convection in an eastern North Atlantic WCB on the cloud and precipitation structure, on the PV distribution, and on larger-scale flow. For this reason, we apply online trajectories in a high-resolution convection-permitting simulation and perform a composite analysis to compare quasi-vertically ascending convective WCB trajectories with typical slantwise-ascending WCB trajectories. We find that the convective WCB ascent leads to substantially stronger surface precipitation and the formation of graupel in the middle to upper troposphere, which is absent for the slantwise WCB category, indicating the key role of WCB-embedded convection for precipitation extremes. Compared to the slantwise WCB trajectories, the initial equivalent potential temperature of the convective WCB trajectories is higher, and the convective WCB trajectories originate from a region of larger potential instability, which gives rise to more intense cloud diabatic heating and stronger cross-isentropic ascent. Moreover, the signature of embedd", "link": "https://doi.org/10.5194/wcd-1-127-2020", "authors": "Annika Oertel, Maxi Boettcher, Hanna Joos, Michael Sprenger, Heini Wernli", "source": "Weather and Climate Dynamics", "published": "2020-4-9", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Downscaling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1007/s00382-019-04958-z", "title": "North American extreme precipitation events and related large-scale meteorological patterns: a review of statistical methods, dynamics, modeling, and trends", "summary": "This paper surveys the current state of knowledge regarding large-scale meteorological patterns (LSMPs) associated with short-duration (less than 1 week) extreme precipitation events over North America. In contrast to teleconnections, which are typically defined based on the characteristic spatial variations of a meteorological field or on the remote circulation response to a known forcing, LSMPs are defined relative to the occurrence of a specific phenomenon—here, extreme precipitation—and with an emphasis on the synoptic scales that have a primary influence in individual events, have medium-range weather predictability, and are well-resolved in both weather and climate models. For the LSMP relationship with extreme precipitation, we consider the previous literature with respect to definitions and data, dynamical mechanisms, model representation, and climate change trends. There is considerable uncertainty in identifying extremes based on existing observational precipitation data and some limitations in analyzing the associated LSMPs in reanalysis data. Many different definitions of “extreme” are in use, making it difficult to directly compare different studies. Dynamically, several types of meteorological systems—extratropical cyclones, tropical cyclones, mesoscale convective systems, and mesohighs—and several mechanisms—fronts, atmospheric rivers, and orographic ascent—have been shown to be important aspects of extreme precipitation LSMPs. The extreme precipitation is often realized through mesoscale processes organized, enhanced, or triggered by the LSMP. Understanding ", "link": "https://doi.org/10.1007/s00382-019-04958-z", "authors": "Mathew Barlow, William J. Gutowski, John R. Gyakum, Richard W. Katz, Young-Kwon Lim, Russ S. Schumacher", "source": "Climate Dynamics", "published": "2019-9-20", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme*", "uncertainty"]}, {"key": "doi:10.1007/s00382-022-06591-9", "title": "Near-term regional climate change in East Africa", "summary": "In the coming few decades, projected increases in global temperature and humidity are generally expected to exacerbate human exposure to climate extremes (e.g., humid-heat and rainfall extremes). Despite the growing risk of humid-heat stress (measured by wet-bulb temperature), it has received less attention in East Africa, where arid and semi-arid climatic conditions prevail. Moreover, no consensus has yet been reached across models regarding future changes in rainfall over this region. Here, we screen Global Climate Models (GCMs) from CMIP5 and CMIP6 and use, for boundary conditions, simulations from only those GCMs that simulate successfully recent climatic trends. Based on these GCMs and Regional Climate Model (RCM) simulations, we project that annual mean temperature is likely to rise by 2 ℃ toward midcentury (2021–2050) ​at a faster rate than the global average (about 1.5 ℃), under the RCP8.5 and SSP5-8.5 scenarios, associated with more frequent and severe climate extremes. In particular, low-lying regions in East Africa will be vulnerable to severe heat stress, with an extreme wet-bulb temperature approaching or exceeding the US National Weather Service’s extreme danger threshold of 31 ℃. On the other hand, population centers in the highlands of Ethiopia will receive significantly more precipitation during the autumn season and will see more extreme rainfall events, with implications for flooding and agriculture. The robustness of these results across all GCM and RCM simulations, and for both of CMIP5 and CMIP6 frameworks (CMIP: Coupled Model Inter-comparison Project)", "link": "https://doi.org/10.1007/s00382-022-06591-9", "authors": "Yeon-Woo Choi, Deborah J. Campbell, Elfatih A.B. Eltahir", "source": "Climate Dynamics", "published": "2022-11-24", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "extreme*"]}, {"key": "doi:10.1007/s00382-023-06776-w", "title": "Observed and projected changes in snow accumulation and snowline in California’s snowy mountains", "summary": "The Sierra Nevada and Southern Cascades—California’s snowy mountains—are primary freshwater sources and natural reservoirs for the states of California and Nevada. These mountains receive precipitation overwhelmingly from wintertime storms including atmospheric rivers (ARs), much of it falling as snow at the higher elevations. Using a seven-decade record of daily observed temperature and precipitation as well as a snow reanalysis and downscaled climate projections, we documented historical and future changes in snow accumulation and snowlines. In four key subregions of California’s snowy mountains, we quantified the progressing contribution of ARs and non-AR storms to the evolving and projected snow accumulation and snowlines (elevation of the snow-to-rain transition), exploring their climatology, variability and trends. Historically, snow makes up roughly a third of the precipitation affecting California’s mountains. While ARs make up only a quarter of all precipitating days and, due to their relative warmth, produce snowlines higher than do other storms, they contribute over 40% of the total seasonal snow. Under projected unabated warming, snow accumulation would decline to less than half of historical by the late twenty-first century, with the greatest snow loss at mid elevations (from 1500 to 3300 m by the mountain sub-regions) during fall and spring. Central and Southern Sierra Nevada peaks above 3400 m might see occasionally extreme snow accumulations in January–February resulting entirely from wetter ARs. AR-related snowlines are projected to increase by more than 70", "link": "https://doi.org/10.1007/s00382-023-06776-w", "authors": "Tamara Shulgina, Alexander Gershunov, Benjamin J. Hatchett, Kristen Guirguis, Aneesh C. Subramanian, Steven A. Margulis", "source": "Climate Dynamics", "published": "2023-5-25", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1175/mwr-d-15-0205.1", "title": "Clustering of Regional-Scale Extreme Precipitation Events in Southern Switzerland", "summary": "Temporal clustering of extreme precipitation events on subseasonal time scales is of crucial importance for the formation of large-scale flood events. Here, the temporal clustering of regional-scale extreme precipitation events in southern Switzerland is studied. These precipitation events are relevant for the flooding of lakes in southern Switzerland and northern Italy. This research determines whether temporal clustering is present and then identifies the dynamics that are responsible for the clustering. An observation-based gridded precipitation dataset of Swiss daily rainfall sums and ECMWF reanalysis datasets are used. Also used is a modified version of Ripley’s K function, which determines the average number of extreme events in a time period, to characterize temporal clustering on subseasonal time scales and to determine the statistical significance of the clustering. Significant clustering of regional-scale precipitation extremes is found on subseasonal time scales during the fall season. Four high-impact clustering episodes are then selected and the dynamics responsible for the clustering are examined. During the four clustering episodes, all heavy precipitation events were associated with an upper-level breaking Rossby wave over western Europe and in most cases strong diabatic processes upstream over the Atlantic played a role in the amplification of these breaking waves. Atmospheric blocking downstream over eastern Europe supported this wave breaking during two of the clustering episodes. During one of the clustering periods, several extratropical transitions of ", "link": "https://doi.org/10.1175/mwr-d-15-0205.1", "authors": "Yannick Barton, Paraskevi Giannakaki, Harald von Waldow, Clément Chevalier, Stephan Pfahl, Olivia Martius", "source": "Monthly Weather Review", "published": "2016-1-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1175/mwr-d-25-0206.1", "title": "What Is the Minimum Ensemble Size That Is Sufficient to Reduce Uncertainty in Assessing Model Skill in the West-WRF Ensemble?", "summary": "The minimum number of members in a numerical weather prediction ensemble has long been debated. In this study, we estimate the minimum ensemble size ( N min ) for prediction of temperature, precipitation, and snow water equivalent for the 200-member regional weather model West-WRF ensemble for the winter (December–March) 2021–22. We give examples of how to estimate N min for three skill metrics by finding the number of ensemble members needed to reduce the relative difference in mean skill score from that of the full ensemble or to reduce the spread of the skill score to a certain threshold depending on the skill score. The N min estimates are found when the relative difference in skill reduces to two different sample thresholds. The less stringent threshold N min for deterministic and probabilistic skill (∼20–30) is similar to the size of ensembles currently produced at operational centers. There is a smaller difference between the less stringent threshold N min and more stringent threshold N min to account for sampling uncertainty. The N min based on all metrics shows some sensitivity to whether an atmospheric river is landfalling. A simple postprocessing scheme minimizing biases and leveraging persistence was used to test sensitivity of N min to bias correction. The most sensitivity was shown for snow water equivalent resulting in a reduction in the difference between the two thresholds for sampling uncertainty. Significance Statement The minimum number of members in a weather forecasting model ensemble has long been debated. Here, we determine a minimum ensemble size ba", "link": "https://doi.org/10.1175/mwr-d-25-0206.1", "authors": "Michael A. Brunke, William D. Scheftic, Leong Wai Siu, Xubin Zeng, Matthew Simpson, Daniel F. Steinhoff", "source": "Monthly Weather Review", "published": "2026-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Downscaling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "uncertainty"]}, {"key": "doi:10.1175/mwr-d-16-0041.1", "title": "Impact of Warmer Eastern Tropical Pacific SST on the March 2015 Atacama Floods", "summary": "Northern Chile hosts the driest place on Earth in the Atacama Desert. Nonetheless, an extreme precipitation event affected the region on 24–26 March 2015 with 1-day accumulated precipitation exceeding 40 mm in several locations and hourly mean rainfall rates higher than 10 mm h −1 , producing floods and resulting in casualties and significant damage. The event is analyzed using ERA-Interim, surface station data, sounding observations, and satellite-based radar. Two main conditions favorable for precipitation were present at the time of the event: (i) a cutoff low (COL) off the coast of northern Chile and (ii) positive sea surface temperature (SST) anomalies over the eastern tropical Pacific. The circulation driven by the COL was strong but not extraordinary. Regional Climate Model, version 4 (RegCM4), is used to test the sensitivity of precipitation to SST anomalies by removing the warm SST anomaly in the eastern tropical Pacific. The cooler simulation produced very similar COL dry dynamics to that simulated in a control run (with observed SST), but suppressed the precipitation by 60%–80% over northern Chile and 100% in parts of the Atacama Desert due to the decreased availability of precipitable water. The results indicate that the warm SST anomaly over the eastern Pacific, favored by the onset of El Niño 2015/16, was instrumental to the extreme precipitation event by providing an anomalous source of water vapor transported to Atacama by the circulation ahead of the COL.", "link": "https://doi.org/10.1175/mwr-d-16-0041.1", "authors": "Deniz Bozkurt, Roberto Rondanelli, René Garreaud, Andrés Arriagada", "source": "Monthly Weather Review", "published": "2016-11", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1175/waf-d-20-0162.1", "title": "Unraveling the Mechanism of Extreme (More than 30 Sigma) Precipitation during August 2018 and 2019 over Kerala, India", "summary": "During August 2018 and 2019 the southern state of India, Kerala, received unprecedented heavy rainfall, which led to widespread flooding. We aim to characterize the convective nature of these events and the large-scale atmospheric forcing, while exploring their predictability by three state-of-the-art global prediction systems: the National Centers for Environmental Prediction (NCEP)-based India Meteorological Department (IMD) operational Global Forecast System (GFS), the European Centre for Medium-Range Weather Forecasts (ECMWF) Integrated Forecast System (IFS), and the Unified Model–based NCUM being run at the National Centre for Medium Range Weather Forecasting (NCMRWF). Satellite, radar, and lightning observations suggest that these rain events were dominated by cumulus congestus and shallow convection with strong zonal flow leading to orographically enhanced rainfall over the Ghats mountain range; sporadic deep convection was also present during the 2019 event. A moisture budget analyses using the fifth major global reanalysis produced by ECMWF (ERA5) and forecast output revealed significantly increased moisture convergence below 800 hPa during the main rain events compared to August climatology. The total column-integrated precipitable water tendency, however, is found to be small throughout the month of August, indicating a balance between moisture convergence and drying by precipitation. By applying a Rossby wave filter to the rainfall anomalies it is shown that the large-scale moisture convergence is associated with westward-propagating barotropic Rossby waves over", "link": "https://doi.org/10.1175/waf-d-20-0162.1", "authors": "Parthasarathi Mukhopadhyay, Peter Bechtold, Yuejian Zhu, R. Phani Murali Krishna, Siddharth Kumar, Malay Ganai", "source": "Weather and Forecasting", "published": "2021-8", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["india*", "precipitation", "extreme*"]}, {"key": "doi:10.1002/qj.4270", "title": "Can a climate model successfully diagnose clear‐air turbulence and its response to climate change?", "summary": "Atmospheric turbulence causes the majority of weather‐related aircraft accidents. Climate models project large increases in clear‐air turbulence as the jet streams become more sheared in response to climate change. However, climate models have coarser resolutions than the numerical weather prediction models that are used to forecast clear‐air turbulence operationally, raising questions about their suitability for this purpose. Here we provide the first rigorous demonstration that climate models are capable of successfully diagnosing clear‐air turbulence and its response to climate change. We use an ensemble of seven clear‐air turbulence diagnostics to compare 38 years of historic turbulence diagnosed from climate model simulations and high‐resolution reanalysis data. We find that the differences in turbulence between the climate model and reanalysis data are much smaller than the spread between the diagnostics. When using a climate model to calculate the probabilities (and their temporal trends) of encountering clear‐air turbulence of any strength, at any flight cruising level, and in any season, we find that most of the uncertainty stems from the turbulence diagnostics rather than the climate model. These results confirm the suitability of climate models for the task of producing future clear‐air turbulence projections. The turbulence increases are generally larger when diagnosed from the reanalysis data than the climate model, suggesting that previous quantifications from climate models of the response of clear‐air turbulence to climate change may be underestimates. Our r", "link": "https://doi.org/10.1002/qj.4270", "authors": "Paul D. Williams, Luke N. Storer", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2022-4", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"]}, {"key": "doi:10.1002/qj.3921", "title": "Convection‐permitting modelling improves simulated precipitation over the central and eastern Tibetan Plateau", "summary": "The Tibetan Plateau (TP) plays an essential role in influencing the global climate, and precipitation is one of its most important water‐cycle components. However, accurately simulating precipitation over the TP is a long‐standing challenge. In this study, a convection‐permitting model (CPM; with 4 km grid spacing) that covers the entire TP was conducted and compared to two mesoscale models (MSMs; with model horizontal resolutions of 13 and 35 km) over the course of a summer. The results showed that the two MSMs have notable wet biases over the TP and can overestimate the summer precipitation by more than 4.0 mm·day −1 in some parts of the Three Rivers Source region. Moreover, both MSMs have more frequent light rainfall; increasing horizontal resolution of the MSMs alone does not reduce the excessive precipitation. Further investigation reveals that the MSMs have a spurious early‐afternoon rainfall peak, which can be linked to a strong dependence on convective available potential energy (CAPE) that dominates the wet biases. Herein, we highlight that the sensitivity of CAPE to surface temperatures may cause the MSMs to have a spurious hydrological response to surface warming. Users of climate projections should be aware of this potential model uncertainty when investigating future hydrological changes over the TP. In comparison, the CPM removes the spurious afternoon rainfall and thus significantly reduces the wet bias simulated by the MSMs. In addition, the CPM also better depicts the precipitation frequency and intensity, and is therefore a promising tool for dynamic downs", "link": "https://doi.org/10.1002/qj.3921", "authors": "Puxi Li, Kalli Furtado, Tianjun Zhou, Haoming Chen, Jian Li", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2020-10-14", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "uncertainty"]}, {"key": "doi:10.1002/qj.4351", "title": "An evaluation of ERA5 precipitation for climate monitoring", "summary": "A key aim of climate monitoring is to place the current conditions of climate variables, such as surface air temperature and precipitation, in their historical context. In Europe, a leading provider of this information is the Copernicus Climate Change Service (C3S), which is implemented by the European Centre for Medium‐Range Weather Forecasts (ECMWF) on behalf of the European Commission. To undertake this activity in close‐to‐real time, C3S predominantly uses the ECMWF ERA5 reanalysis, and ERA5 precipitation is widely used as a proxy for observed precipitation for hydrological monitoring. However, for there to be confidence in the ERA5 data, it is essential to evaluate its ability to capture observed precipitation. In this study, we therefore evaluate ERA5 precipitation against observations globally to inform C3S monitoring activities and the broader climate science community. Using 24 hr precipitation observations at 5,637 stations from 2001 to 2020, results show that the smallest ERA5 random errors occur in the winter Extratropics and the largest ERA5 errors are in the Tropics. The errors grow in the summer Extratropics and the errors in the Tropics move with the intertropical convergence zone. These findings are mirrored in the stable equitable error in probability space (SEEPS) score, with the SEEPS signifying that ERA5 is more able to discriminate between different precipitation events in the Extratropics. In general, an ERA5 wet bias is also found. The assessment of annual maximum 1 day (RX1) precipitation accumulations and four extreme events shows that ERA5 cannot ", "link": "https://doi.org/10.1002/qj.4351", "authors": "David A. Lavers, Adrian Simmons, Freja Vamborg, Mark J. Rodwell", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2022-8-22", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "doi:10.1002/qj.4645", "title": "Climate change quadruples flood‐causing extreme monsoon rainfall events in Bangladesh and northeast India", "summary": "Bangladesh and northeast India are the most densely populated regions in the world where severe floods as a result of extreme rainfall events kill hundreds of people and cause socio‐economic losses regularly. Owing to local high topography, the moisture‐carrying monsoon winds converge near southeast Bangladesh (SEB) and northeast Bangladesh and India (NEBI), which produces significant extreme rainfall events from May to October. Using observed data, we find an increasing trend of 1‐day extreme event (150 mmday) frequency during 1950–2021. The extreme rainfall events quadrupled over western Meghalaya (affecting NEBI) and coastal SEB during this period. Composite analysis indicates that warm Bay of Bengal sea‐surface temperature intensifies the lower tropospheric moisture transport and flux through the low‐level jet (LLJ) to inland, where mountain‐forced moisture converges and precipitates as rainfall during extreme events. To understand the role of climate change, we use high‐resolution downscaled models from Coupled Model Intercomparison Project phase 6 (CMIP6). We find that the monsoon extreme event increase is ongoing and the region of quadrupled events further extends over the NEBI and SEB in the future (2050–2079) compared with historical simulations (1950–1979). A quadrupling of the intense daily moisture transport episodes due to increased LLJ instability, a northward shift of LLJ, and increased moisture contribute to the increased future extreme events. This dynamic process causes moisture to be transported to the NEBI from the southern Bay of Bengal, and the local t", "link": "https://doi.org/10.1002/qj.4645", "authors": "Abdullah A. Fahad, Mahdi Hasan, Noshin Sharmili, Shammunul Islam, Erik T. Swenson, M. K. Roxy", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2024-1-23", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["india*", "monsoon", "cmip6", "extreme*"]}, {"key": "doi:10.1038/s41558-023-01812-3", "title": "Soil heat extremes can outpace air temperature extremes", "summary": "Quantifying changes in hot temperature extremes is key for developing adaptation strategies. Changes in hot extremes are often determined on the basis of air temperatures; however, hydrology and many biogeochemical processes are more sensitive to soil temperature. Here we show that soil hot extremes are increasing faster than air hot extremes by 0.7 °C per decade in intensity and twice as fast in frequency on average over Central Europe. Furthermore, we identify soil temperature as a key factor in the soil moisture–temperature feedback. During dry and warm conditions, the energy absorbed by the soil is used to warm the soil, increasing the release of sensible heat flux and surface air temperatures. This increase in surface air temperature leads to a higher atmospheric demand for water, increasing soil evaporation, which may further dry and warm the soil highlighting the contribution of soil moisture–temperature feedback to the evolution of hot extremes in a warming climate.", "link": "https://doi.org/10.1038/s41558-023-01812-3", "authors": "Almudena García-García, Francisco José Cuesta-Valero, Diego G. Miralles, Miguel D. Mahecha, Johannes Quaas, Markus Reichstein", "source": "Nature Climate Change", "published": "2023-9-21", "first_seen": "2026-11-23T21:25:47+00:00", "score": 6, "topics": ["Watched author"], "watch": ["Markus Reichstein"], "boosts": ["extreme*"]}, {"key": "doi:10.5194/gmd-18-1545-2025", "title": "Quantifying the analysis uncertainty for nowcasting application", "summary": "This study proposes a method to quantify uncertainty represented by errors in very-high-resolution near-surface analysis, specifically for weather nowcasting applications. Gaussian distributed perturbations are used to perturb the first guess and observation with a variance equal to that of the first-guess error. This error reflects the spatial characteristics of the difference between the first guess and observations and dominates the primary sources of analysis uncertainty. However, mapping perturbations to analyse the grid mesh through interpolation results in underdispersion, particularly in areas without stations. To address this issue, Gaussian perturbations are inflated with an inflation factor to amplify the dispersion. This method was applied to high-resolution analysis and nowcasting for hourly temperature, humidity, and wind components in the Beijing–Tianjin–Hebei region to assess its effectiveness in representing uncertainty. The generated ensemble analysis exhibits reasonable spread and high reliability, indicating accurate quantification of analysis uncertainty. Ensemble nowcasting is extrapolated from ensemble analysis to evaluate the transmission of perturbation during extrapolation. Verification results of ensemble nowcasting reflect the fact that the spread increases effectively during extrapolation up to a lead time of 6 h. However, the increase in the spread is highly dependent on the persistence of numerical weather prediction. The results demonstrate that generating appropriate perturbations based on analysis errors effectively represents the analysis ", "link": "https://doi.org/10.5194/gmd-18-1545-2025", "authors": "Yanwei Zhu, Aitor Atencia, Markus Dabernig, Yong Wang", "source": "Geoscientific Model Development", "published": "2025-3-10", "first_seen": "2026-11-23T14:47:49+00:00", "score": 5, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["uncertainty"]}, {"key": "doi:10.5194/gmd-14-1987-2021", "title": "Global evaluation of the nutrient-enabled version of the land surface model ORCHIDEE-CNP v1.2 (r5986)", "summary": "The availability of phosphorus (P) and nitrogen (N) constrains the ability of ecosystems to use resources such as light, water and carbon. In turn, nutrients impact the distribution of productivity, ecosystem carbon turnovers and their net exchange of CO 2 with the atmosphere in response to variation of environmental conditions in both space and time. In this study, we evaluated the performance of the global version of the land surface model ORCHIDEE-CNP (v1.2), which explicitly simulates N and P biogeochemistry in terrestrial ecosystems coupled with carbon, water and energy transfers. We used data from remote sensing, ground-based measurement networks and ecological databases. Components of the N and P cycle at different levels of aggregation (from local to global) are in good agreement with data-driven estimates. When integrated for the period 1850 to 2017 forced with variable climate, rising CO 2 and land use change, we show that ORCHIDEE-CNP underestimates the land carbon sink in the Northern Hemisphere (NH) during recent decades despite an a priori realistic gross primary productivity (GPP) response to rising CO 2 . This result suggests either that processes other than CO 2 fertilization, which are omitted in ORCHIDEE-CNP such as changes in biomass turnover, are predominant drivers of the northern land sink and/or that the model parameterizations produce emerging nutrient limitations on biomass growth that are too strict in northern areas. In line with the latter, we identified biases in the simulated large-scale patterns of leaf and soil stoichiometry as well as plant", "link": "https://doi.org/10.5194/gmd-14-1987-2021", "authors": "Yan Sun, Daniel S. Goll, Jinfeng Chang, Philippe Ciais, Betrand Guenet, Julian Helfenstein", "source": "Geoscientific Model Development", "published": "2021-4-14", "first_seen": "2026-11-23T14:47:49+00:00", "score": 5, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": []}, {"key": "doi:10.1029/2018gl081584", "title": "Arctic‐Boreal Lake Dynamics Revealed Using CubeSat Imagery", "summary": "Fine‐scale, subseasonal fluctuations in Arctic‐Boreal surface water reflect regional water balance and modulate trace gas emissions to the atmosphere but have eluded detection using traditional satellite remote sensing. We use high‐resolution (~3–5 m), high‐frequency CubeSat sensors to measure near‐daily changes in lake surface area through an object‐based tracking method that incorporates machine learning to overcome notable limitations of CubeSat imagery. From ~76,000 images we obtain >2.2 million individual observations of changing surface areas for 85,358 lakes in Northern Canada and Alaska between 1 May and 1 October 2017. We find broad‐scale lake area declines across diverse climatic, hydrologic, and physiographic terrains. Localized exceptions reveal lowland flooding and aquatic vegetation phenology cycles. Cumulative small shoreline changes of abundant lakes on the Canadian Shield exceed total inundation variations of better‐studied lowland environments, revealing a surprisingly dynamic landscape with respect to subseasonal variations in surface water extent and trace gas emissions.", "link": "https://doi.org/10.1029/2018gl081584", "authors": "Sarah W. Cooley, Laurence C. Smith, Jonathan C. Ryan, Lincoln H. Pitcher, Tamlin M. Pavelsky", "source": "Geophysical Research Letters", "published": "2019-2-19", "first_seen": "2026-11-23T14:47:49+00:00", "score": 5, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": []}, {"key": "doi:10.1029/2023jd040055", "title": "Did Historical Storms Used in Probable Maximum Precipitation (PMP) Estimation Reach Maximum Efficiency? A Large Model Ensemble Approach", "summary": "The flood that would result from the greatest depth of precipitation “meteorologically possible”, or Probable Maximum Precipitation (PMP) is used in the design of dam spillways and other high‐risk structures. Historically, PMP has been estimated by scaling depth‐area‐duration relationships obtained from severe historical storms. Over the last decade, numerical weather prediction models have been used to instead simulate precipitation resulting from the addition of atmospheric moisture (called relative humidity maximization, or RHM). Despite the major improvement this represents, model‐based PMP relies on a key assumption, which this paper re‐evaluates in Oroville dam's Feather River watershed (California). Model‐based as well as earlier procedures assume that severe historical storms achieved maximum efficiency (moisture conversion to precipitation) and only maximize moisture. We examine the most severe storms found in the CESM2‐LE global climate model ensemble, which constitutes a very large artificial record (∼1,150 years) in comparison with the historical record, to understand the upper bounds of storm efficiency and precipitation. We downscale the 10 most severe CESM2‐LE storms (by precipitation totals), and identify key storm attributes (vertical motion, convection and convergence) that control precipitation efficiency. In comparison with historical storms, we find that CESM‐LE storms can have 30% higher efficiency and 32% higher precipitation, but produce only 8% higher PMP estimates, suggesting some convergence of model ensemble and historical storms in terms of PMP.", "link": "https://doi.org/10.1029/2023jd040055", "authors": "Emilie G. Tarouilly, Stefan R. Rahimi, Jason M. Cordeira, Dennis P. Lettenmaier", "source": "JGR: Atmospheres", "published": "2024-12-16", "first_seen": "2026-11-23T14:47:49+00:00", "score": 5, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"]}, {"key": "doi:10.1007/s00382-011-1032-2", "title": "Computing the distribution of return levels of extreme warm temperatures for future climate projections", "summary": "", "link": "https://doi.org/10.1007/s00382-011-1032-2", "authors": "M. Pausader, D. Bernie, S. Parey, M. Nogaj", "source": "Climate Dynamics", "published": "2011-3-4", "first_seen": "2026-11-23T14:47:49+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["extreme*"]}, {"key": "doi:10.1002/qj.70353", "title": "The impact of A eolus observations on extreme weather events in a mesoscale numerical weather prediction system", "summary": "The impact of assimilating horizontal line‐of‐sight wind observations from the Doppler wind lidar onboard the Aeolus satellite into a regional numerical weather prediction system for Japan and the surrounding region was evaluated using observing system experiments (OSEs). The OSEs were conducted using the Japan Meteorological Agency's mesoscale analysis and forecast system, with a particular focus on heavy rainfall events associated with quasi‐stationary convective bands and typhoons. The fit of the background fields to other wind and relative humidity observations was improved, particularly over the oceans. During the July 2020 heavy rainfall event, improved wind forecast accuracy in the surrounding environment 12 hr prior to the event contributed to a better representation of the humidity field, leading to an extended lead time for heavy rainfall prediction. In contrast, the impact on typhoons in 2020 was not robust, although improvements in track and intensity forecasts were found in some cases. The findings suggest that the positive impact on severe weather forecasts arises primarily from improvements in the surrounding environmental fields through cycled analyses, rather than from the direct assimilation impact along the satellite tracks.", "link": "https://doi.org/10.1002/qj.70353", "authors": "Izumi Okabe, Kozo Okamoto", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2026-11-23", "first_seen": "2026-11-23T14:47:49+00:00", "score": 5, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme*"]}, {"key": "arxiv:2611.24260", "title": "Vertical Structure-Based Composites for Analyzing Atmospheric Front Environments", "summary": "In many mid-latitude regions, a substantial fraction of extreme precipitation events occur in the vicinity of atmospheric fronts. To understand the processes that lead to such extreme precipitation, it is important to study the environment of the front. In this paper, we introduce a new method for computing vertical composites of frontal environments. Existing approaches construct such composites relative to front lines that represent the front at a single pressure level. However, fronts are vertically tilted and can exhibit substantial geometric variability, both within an individual front and between distinct events. Therefore, at levels away from the reference front line, the alignment of front environments based on a single front line commonly blurs the signals in the analyzed atmospheric variables. Our method accounts for the vertical structure of the front by computing composites relative to the actual front position at all height levels. We showcase the method using ERA5 reanalysis data for 50 cold fronts over Europe and apply it to thermodynamic and kinematic fields. Compared with conventional line-based composites, the new approach yields signals that are sharper and spatially more coherent. It also provides a visualization in which front-relative distances can be interpreted directly throughout the vertical column. Our method offers a general framework to study atmospheric processes in frontal environments and can be applied to different types and definitions of fronts.", "link": "https://arxiv.org/abs/2611.24260", "authors": "Anne Gossing, Miriam Kliemann, Vijay Natarajan, Stephan Pfahl, Daniel Baum", "source": "arXiv", "published": "2026-11-18T11:42:57Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme*"]}, {"key": "arxiv:2611.21521", "title": "Run it Back: Autoregression vs. Video Diffusion for Final-Conditioned Weather Trajectories", "summary": "Low-likelihood, high-impact extremes are projected to increase in severity and frequency in a warming climate. Sampling the precursors that lead to these events traditionally requires massive ensembles that scale poorly with lead time and rarity, and typical rare-event sampling and ensemble-boosting methods do not show how a single extreme might arise from diverse synoptic precursors. Recently, Lin et al.\\ (2026) showed this is possible with final-conditioned 66-hour trajectories (trajectories constrained to end at an observed state) from cBottle-video, a pre-trained, off-the-shelf video diffusion climate emulator not explicitly fine-tuned for this task (Brenowitz et al., 2025). However, its ensembles were underdispersed and geostrophically inconsistent, and it reproduces conditioned frames only approximately, hindering autoregressive rollout. Here, we train Rewind-AR, a backward-in-time probabilistic autoregressive model with a FourCastNet~3 backbone (Bonev et al., 2025), and generate final-conditioned ensembles for the same three cases: the 2021 Pacific Northwest heatwave, Hurricane Ian, and Superstorm Sandy (in the Supplementary Information). The leading modes of Rewind-AR's antecedent 500 hPa geopotential height explain far more of the across-member variance than cBottle-video's for both hurricane position and heatwave surface temperature, and Rewind-AR better reproduces the day-over-day heatwave intensification observed in ERA5. Finally, geostrophic inconsistencies close to the conditioning frame seen in cBottle-video are not reproduced by Rewind-AR. Nevertheless, up t", "link": "https://arxiv.org/abs/2611.21521", "authors": "Jerry Lin, Elizabeth A. Barnes", "source": "arXiv", "published": "2026-11-16T18:13:42Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme*", "emulator*"]}, {"key": "arxiv:2611.16255", "title": "HybridCT: ML Accelerated Tomography for Climate Relevant 3D Cloud Observations", "summary": "Low-level clouds are one of the largest sources of uncertainty in climate predictions, partly because we lack detailed three-dimensional (3D) measurements of their internal structure. Here, we present HybridCT, a cloud tomographic reconstruction scheme accelerated by machine learning (ML) that recovers 3D cloud extinction directly from passive multi-angle observations. An ML emulator maps radiances from multiple viewing angles to cloud optical thickness (COT), producing path-integrated projections, and a Simultaneous Algebraic Reconstruction Technique (SART) explicitly inverts these projections to retrieve 3D extinction. Training observations are generated from synthetic 3D cloud fields using radiative transfer simulations for nine viewing angles between $\\pm$70$^{\\circ}$. HybridCT reconstructs extinction with RMSE 13.3 km$^{-1}$ in 3.5 s, compared to 22.7 km$^{-1}$ in approx. 30 min for the state-of-the-art physics-based tomography framework AT3D, a speedup exceeding 500$\\times$. HybridCT thus provides a scalable route toward large-scale observations of 3D cloud structure relevant to radiative-budget interpretation and evaluation of high-resolution cloud simulations.", "link": "https://arxiv.org/abs/2611.16255", "authors": "Linda Forster, Nicholas J. LaHaye, Marcin J. Kurowski, Anna Jungbluth, Bernhard Mayer, Anthony B. Davis", "source": "arXiv", "published": "2026-11-12T03:57:26Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Deep Learning"], "watch": [], "boosts": ["emulator*", "uncertainty"]}, {"key": "arxiv:2611.15222", "title": "Improvements in Tropical Cyclone Representation in JRA-3Q over ERA5", "summary": "Reanalysis products are widely used for long-term tropical cyclone (TC) studies, yet the fidelity of their TC representation is not fully established. We evaluate TC representation in the recently released JRA-3Q reanalysis against the higher-resolution ERA5 using the SyCLoPS tracker. JRA-3Q achieves substantially higher detection skill, with a hit rate of 90% and a false alarm rate of 6% during 1979-2024. Unlike ERA5, which exhibits markedly degraded detection skill during the pre-satellite era, JRA-3Q maintains stable performance over time. We analyze false alarms and missed TCs in the North Indian basin, TC vortex evolution following TC bogussing, and the spatial variance of column-integrated moist static energy, showing that JRA-3Q's improvements stem from both reduced model biases and a more effective and consistently applied TC bogus scheme. A decomposition of TC representation errors into contributions from tracking algorithm, reanalysis, and best-track uncertainty helps explain the sources of these biases.", "link": "https://arxiv.org/abs/2611.15222", "authors": "Yushan Han, Paul A. Ullrich, Colin Zarzycki, Stella Bourdin", "source": "arXiv", "published": "2026-11-11T09:15:05Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india*", "uncertainty"]}, {"key": "arxiv:2610.38775", "title": "Skillful and realistic precipitation forecasting with reinforced diffusion", "summary": "Accurate precipitation forecasting remains elusive as physics-based models struggle to resolve mesoscale convection and machine learning often yields physically inconsistent, blurred results that consistently underestimate extreme events. We present FitzRoy, the first system that simultaneously achieves state-of-the-art predictive skill and physical realism over the continental United States. Through a reinforced diffusion framework, where a conditional discrete diffusion model is refined via reinforcement learning, FitzRoy effectively resolves the long-standing trade-off between pointwise accuracy and structural fidelity. Across lead times up to 24 hours, FitzRoy consistently matches or exceeds state-of-the-art models while preserving structural realism and capturing extreme events. Its low-latency inference further enables deployment in real-time operational settings. In case studies such as the 2025 Texas Hill Country floods and the 2026 Missouri floods, FitzRoy signals record-breaking accumulations that existing models largely missed. By bridging the gap between realism and skill, FitzRoy establishes a new frontier for high-fidelity precipitation forecasting.", "link": "https://arxiv.org/abs/2610.38775", "authors": "Ozan Sener, Anand Avati, David Hafner, Jierui Lin, Laura Manduchi, Xiaoying Pang", "source": "arXiv", "published": "2026-10-28T19:50:45Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation", "extreme*", "diffusion model*"]}, {"key": "arxiv:2611.23729", "title": "Toward Out-of-Distribution Generalization in Neural AC Power Flow", "summary": "Growing uncertainty in power system operations from renewables integration, extreme weather, and data center loads challenges the reliability of traditional power flow solvers at scale. Machine learning-based proxies are a potentially promising alternative, but the prohibitive cost of generating training data for large grids makes out-of-distribution generalization a key capability for deployment; currently, models trained on small grids lack that capability. In this work, we systematically evaluate how physics-informed losses, multi-grid training, and perturbation-based data augmentation improve the zero-shot transfer of three graph neural network-based power flow models from smaller systems to a larger, unseen 500-bus system. We find that (1) physics-informed losses improve transfer relative to purely supervised objectives; (2) multi-grid training on smaller systems matches the best single grid but does not close the gap to target-grid training; (3) perturbation-based augmentation on edge attributes improves transfer by up to 54.6%; and (4) random line/generator dropout does not consistently improve performance.", "link": "https://arxiv.org/abs/2611.23729", "authors": "Ojas Sanghi, Anvita Bhagavathula, Alvaro Carbonero, Priya L. Donti", "source": "arXiv", "published": "2026-11-18T02:41:59Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme*", "uncertainty"]}, {"key": "arxiv:2611.17438", "title": "Real-Time Diffusion Relighting as a Neural Sensor: Closing the Low-Light Domain Gap for Robotic Perception", "summary": "Low-light conditions severely degrade robotic perception: object detectors trained on daylight imagery are prone to failure under dark and adverse weather conditions that fall outside of their training distribution. Furthermore, from an efficiency standpoint, existing Low-Light Image Enhancement (LLIE) methods are designed for offline processing and are therefore impractical to integrate into live control loops. To address these issues, we propose to embed a Generative Neural Sensor within the control loop that treats illumination as a generative prior rather than a signal processing problem, enabling task-relevant semantic recovery. We further propose an Real-Time Perceptual Architecture that decouples high-latency semantic recovery from low-latency robotic control. Rather than blocking the control loop, our system runs a large-scale image-to-image diffusion model in a background thread, and is activated only when a drop in detection confidence signals a perceptual uncertainty event, significantly reducing computational overhead. Our method sets a new state-of-the-art performance on the ExDark low-light benchmark with 87.1% mAP, and under adverse weather conditions, significantly boosts detection rates over competing methods. On a navigation task in a closed-loop autonomous driving simulator (CARLA), we achieve a 100% lap completion rate, establishing a simulation-based proof-of-concept for integrating high-latency generative models with standard robotic control autonomy stacks.", "link": "https://arxiv.org/abs/2611.17438", "authors": "Shengjie Xu, Alexander Gao, Anshul Rai, Dae Yeol Lee, Guan-Ming Su, Ming C. Lin", "source": "arXiv", "published": "2026-11-12T19:10:40Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Deep Learning"], "watch": [], "boosts": ["diffusion model*", "uncertainty"]}, {"key": "arxiv:2610.20947", "title": "Ranked Right, Sized Wrong: Ensemble Spread Fails Silently at Streamflow Extremes", "summary": "Deep learning models, particularly Long Short-Term Memory networks, are increasingly used for operational streamflow forecasting, with ensemble spread providing a signal of predictive uncertainty. As climate change increases the frequency of hydroclimatic extremes, these models will increasingly operate under flow conditions that are rare in their historical records. We therefore evaluate whether ensemble spread remains informative under increasing flows, examining both its magnitude relative to error and its ability to rank errors. Prediction error is approximately $2\\times$ the corrected spread at ordinary flows and up to $4\\times$ at the highest flows, with the discrepancy increasing with flow (log-log slope $1.30$, 95% CI: $[1.20,1.41]$). Under-dispersion is strongest in observed extreme flows beyond the training record, reaching an $18\\times$ discrepancy. This is pervasive and not explainable by conditional mean bias. Area Under the Sparsification Error, a standard distribution-free metric of uncertainty ranking, describing how well a model knows when it is uncertain, indicates near-oracle ranking for ensemble spread ($0.071$), yet ordering by predicted discharge alone nearly matches it. Informative uncertainty ranking can coexist with severe under-dispersion. In deployment, error ranking cannot be verified, yet the spread is available, and it is relied on as the uncertainty signal under increasingly extreme conditions, while systematically understating risk, most severely for the extreme events that matter most.", "link": "https://arxiv.org/abs/2610.20947", "authors": "Justin Gallant, Tyler Wilson", "source": "arXiv", "published": "2026-10-14T21:12:10Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme*", "uncertainty"]}, {"key": "arxiv:2604.23127", "title": "A Dynamic Learning Observatory Reveals the Rapid Salinization of Satkhira, Bangladesh", "summary": "Soil salinity is a major environmental challenge in coastal Bangladesh, threatening agricultural productivity and local livelihoods. This study develops a machine-learning-based framework to predict and map soil salinity in Satkhira district by integrating field observations with Landsat-derived spectral indices. A total of 205 soil samples collected during 2024-2025 were used to train an Extreme Gradient Boosting (XGBoost) model, and predictions were further improved using a Generalized Additive Model (GAM). Spatial cross-validation was applied to reduce autocorrelation bias, and bootstrap resampling was used to quantify prediction uncertainty. The results show strong spatial variability of soil salinity, with higher concentrations in the southern and central coastal regions and lower levels in the northern inland areas. Vegetation indices, particularly NDVI, along with salinity-related spectral indicators, were identified as key predictors. 10-year-window peak-exposure maps generated for 2014-2023 reveal recurrent high-salinity zones and a persistent, expanding footprint of moderate-to-high salinity exposure across the central parts of the district. Uncertainty analysis indicates higher variability in coastal zones and improved prediction stability when multi-year datasets are combined. The proposed framework provides a robust and scalable approach for long-term monitoring of soil salinity. It supports climate-resilient agriculture, land-use planning, and evidence-based decision-making in coastal Bangladesh.", "link": "https://arxiv.org/abs/2604.23127", "authors": "Showmitra Kumar Sarkar, Sai Ravela", "source": "arXiv", "published": "2026-04-25T03:49:04Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme*", "uncertainty"]}, {"key": "arxiv:2604.10890", "title": "Forecasting Return Time of Extreme Precipitation by Large Deviation Theory", "summary": "Forecasting extreme precipitation is essential yet challenging due to its rarity and complexity. We develop a large deviation framework to estimate the return times of extreme precipitation events. We first find that the Landau distribution, originally introduced in plasma physics, accurately captures extreme precipitation at approximately 93% of global locations, outperforming conventional extreme value distributions with 76% matched locations under the same accuracy criterion. Enriching rare event samples by the fitted Landau distribution, we obtain more accurate estimates of large deviation rate functions and return times, enabling forecasts beyond historically observed precipitation intensities. Mapping historical return times to future projections from the Coupled Model Intercomparison Project Phase 6 (CMIP6), we show that return time curves under different emission scenarios collapse onto a unified relation, revealing a sharply increased lifetime exposure to extreme precipitation for 21st-century birth cohorts under most future emission scenarios.", "link": "https://arxiv.org/abs/2604.10890", "authors": "Haotian Xie, Haoxian Liu, Jingfang Fan, Ying Tang", "source": "arXiv", "published": "2026-04-13T01:37:26Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "extreme*"]}, {"key": "arxiv:2602.01909", "title": "Propagating the prior from far to near offset: A self-supervised diffusion framework for progressively recovering near-offsets of towed-streamer data", "summary": "In marine towed-streamer seismic acquisition, the nearest hydrophone is often two hundred meter away from the source resulting in missing near-offset traces, which degrades critical processing workflows such as surface-related multiple elimination, velocity analysis, and full-waveform inversion. Existing reconstruction methods, like transform-domain interpolation, often produce kinematic inconsistencies and amplitude distortions, while supervised deep learning approaches require complete ground-truth near-offset data that are unavailable in realistic acquisition scenarios. To address these limitations, we propose a self-supervised diffusion-based framework that reconstructs missing near-offset traces without requiring near-offset reference data. Our method leverages overlapping patch extraction with single-trace shifts from the available far-offset section to train a conditional diffusion model, which learns offset-dependent statistical patterns governing event curvature, amplitude variation, and wavelet characteristics. At inference, we perform trace-by-trace recursive extrapolation from the nearest recorded offset toward zero offset, progressively propagating learned prior information from far to near offsets. The generative formulation further provides uncertainty estimates via ensemble sampling, quantifying prediction confidence where validation data are absent. Controlled validation experiments on synthetic and field datasets show substantial performance gains over conventional parabolic Radon transform baselines. Operational deployment on actual near-offset gaps demon", "link": "https://arxiv.org/abs/2602.01909", "authors": "Shijun Cheng, Tariq Alkhalifah", "source": "arXiv", "published": "2026-02-02T10:13:18Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Deep Learning"], "watch": [], "boosts": ["diffusion model*", "uncertainty"]}, {"key": "doi:10.5194/gmd-11-1799-2018", "title": "Crossing the chasm: how to develop weather and climate models for next generation computers?", "summary": "Weather and climate models are complex pieces of software which include many individual components, each of which is evolving under pressure to exploit advances in computing to enhance some combination of a range of possible improvements (higher spatio-temporal resolution, increased fidelity in terms of resolved processes, more quantification of uncertainty, etc.). However, after many years of a relatively stable computing environment with little choice in processing architecture or programming paradigm (basically X86 processors using MPI for parallelism), the existing menu of processor choices includes significant diversity, and more is on the horizon. This computational diversity, coupled with ever increasing software complexity, leads to the very real possibility that weather and climate modelling will arrive at a chasm which will separate scientific aspiration from our ability to develop and/or rapidly adapt codes to the available hardware. In this paper we review the hardware and software trends which are leading us towards this chasm, before describing current progress in addressing some of the tools which we may be able to use to bridge the chasm. This brief introduction to current tools and plans is followed by a discussion outlining the scientific requirements for quality model codes which have satisfactory performance and portability, while simultaneously supporting productive scientific evolution. We assert that the existing method of incremental model improvements employing small steps which adjust to the changing hardware environment is likely to be inadequate ", "link": "https://doi.org/10.5194/gmd-11-1799-2018", "authors": "Bryan N. Lawrence, Michael Rezny, Reinhard Budich, Peter Bauer, Jörg Behrens, Mick Carter", "source": "Geoscientific Model Development", "published": "2018-5-8", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Climate Modelling"], "watch": [], "boosts": ["uncertainty"]}, {"key": "doi:10.5194/gmd-17-8873-2024", "title": "Architectural insights into and training methodology optimization of Pangu-Weather", "summary": "Data-driven medium-range weather forecasts have recently outperformed classical numerical weather prediction models, with Pangu-Weather (PGW) being the first breakthrough model to achieve this. The Transformer-based PGW introduced novel architectural components including the three-dimensional attention mechanism (3D Transformer) in the Transformer blocks. Additionally, it features an Earth-specific positional bias term which accounts for weather states being related to the absolute position on Earth. However, the effectiveness of different architectural components is not yet well understood. Here, we reproduce the 24 h forecast model of PGW based on subsampled 6-hourly data. We then present an ablation study of PGW to better understand the sensitivity to the model architecture and training procedure. We find that using a two-dimensional attention mechanism (2D Transformer) yields a model that is more robust to training, converges faster, and produces better forecasts compared to using the 3D Transformer. The 2D Transformer reduces the overall computational requirements by 20 %–30 %. Further, the Earth-specific positional bias term can be replaced with a relative bias, reducing the model size by nearly 40 %. A sensitivity study comparing the convergence of the PGW model and the 2D-Transformer model shows large batch effects; however, the 2D-Transformer model is more robust to such effects. Lastly, we propose a new training procedure that increases the speed of convergence for the 2D-Transformer model by 30 % without any further hyperparameter tuning.", "link": "https://doi.org/10.5194/gmd-17-8873-2024", "authors": "Deifilia To, Julian Quinting, Gholam Ali Hoshyaripour, Markus Götz, Achim Streit, Charlotte Debus", "source": "Geoscientific Model Development", "published": "2024-12-13", "first_seen": "2026-11-23T21:25:47+00:00", "score": 5, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": []}, {"key": "doi:10.5194/gmd-14-2977-2021", "title": "BCC-CSM2-HR: a high-resolution version of the Beijing Climate Center Climate System Model", "summary": "BCC-CSM2-HR is a high-resolution version of the Beijing Climate Center (BCC) Climate System Model (T266 in the atmosphere and 1/4 ∘ latitude × 1/4 ∘ longitude in the ocean). Its development is on
