<!DOCTYPE html>
<html lang="en">
<head>

<title>Reading desk</title>

<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#101b2d;--mute:#566375;--line:#dde4ec;--soft:#f4f7fa;--accent:#9b2c12;--star:#b7791f;--sans:"Schibsted Grotesk",Helvetica,Arial,sans-serif;--serif:Literata,Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 var(--sans)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:48px}
header.top{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line);padding-bottom:18px}
h1{font:700 28px/1.1 var(--sans);margin:0;letter-spacing:-.01em}
.sub{color:var(--mute);margin:6px 0 0;font-size:14px}
.back{font-size:14px;color:var(--mute);text-decoration:none}
.back:hover{color:var(--ink)}
aside{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow:auto;padding-right:4px}
aside h2{font:600 13px/1 var(--sans);color:var(--mute);margin:26px 0 10px}
aside h2:first-child{margin-top:0}
.brief{background:var(--soft);border-radius:6px;padding:14px 16px}
.brief b{display:block;font:700 30px/1 var(--sans);letter-spacing:-.02em}
.brief span{color:var(--mute);font-size:13px}
.nav button{display:flex;justify-content:space-between;width:100%;padding:6px 10px;border-radius:4px;text-align:left}
.nav button:hover{background:var(--soft)}
.nav button[aria-pressed=true]{background:var(--ink);color:#fff}
.nav small{opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}
.chip[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff}
.people button{display:flex;justify-content:space-between;align-items:baseline;width:100%;padding:5px 0;text-align:left;border-bottom:1px solid var(--line);gap:8px}
.people button:hover .pn{text-decoration:underline}
.people button[aria-pressed=true] .pn{color:var(--accent);font-weight:600}
.pw{color:var(--mute);font-size:12px}
.pc{font-size:12px;color:var(--mute);min-width:1.5em;text-align:right}
.pc.on{color:var(--accent);font-weight:700}
.tools button,.tools a{display:block;font-size:13px;color:var(--mute);padding:3px 0;text-decoration:none}
.tools button:hover,.tools a:hover{color:var(--ink);text-decoration:underline}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.bar input[type=search]{flex:1 1 260px;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{padding:7px 11px;font-size:13px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
select{font:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
.count{color:var(--mute);font-size:13px;margin:10px 0 0}
.day{font:600 13px/1 var(--sans);color:var(--mute);margin:30px 0 4px;padding-bottom:8px;border-bottom:1px solid var(--ink)}
ol{list-style:none;margin:0;padding:0}
li.p{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
li.p.cur{box-shadow:inset 3px 0 0 var(--accent);background:linear-gradient(90deg,var(--soft),transparent 60%)}
li.p.done{opacity:.45}
.rel{display:flex;flex-direction:column-reverse;gap:2px;align-self:start;width:18px;margin-top:7px}
.rel i{display:block;height:4px;border-radius:1px;background:var(--line)}
.rel i.on{background:var(--ink)}
.t{font:600 17px/1.35 var(--sans);text-decoration:none}
.t:hover{text-decoration:underline}
.m{font-size:13px;color:var(--mute);margin-top:5px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.tag{border:1px solid var(--line);border-radius:3px;padding:0 6px;font-size:12px;color:var(--ink)}
.w{background:#fbeee8;color:var(--accent);border-radius:3px;padding:0 6px;font-size:12px;font-weight:600}
.au{font-size:13px;color:var(--mute);margin-top:4px}
.au mark{background:none;color:var(--accent);font-weight:600}
.ab{font:15px/1.65 var(--serif);margin:10px 0 0;max-width:72ch;display:none}
li.open .ab{display:block}
.act{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:13px}
.act button,.act a{color:var(--mute);text-decoration:none}
.act button:hover,.act a:hover{color:var(--ink);text-decoration:underline}
.act .st[aria-pressed=true]{color:var(--star);font-weight:600}
#dl h2{margin-top:26px}
.dl a{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:13px}
.dl a:hover span:first-child{text-decoration:underline}
.dl b{color:var(--accent);white-space:nowrap}
.why{font-size:13px;color:var(--mute);margin-top:4px}
.why em{font-style:normal;color:var(--ink)}
.kind{background:var(--ink);color:#fff;border-radius:3px;padding:0 6px;font-size:12px;font-weight:600}
.empty{padding:50px 0;color:var(--mute);font:16px/1.6 var(--serif)}
.keys{margin-top:36px;color:var(--mute);font-size:12px}
kbd{font:12px var(--sans);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:860px){.wrap{grid-template-columns:1fr;gap:20px}aside{position:static;max-height:none}.keys{display:none}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Reading desk</h1>
      <p class="sub" id="sub"></p>
    </div>
    <a class="back" href="../">Back to site</a>
  </header>

  <aside>
    <h2>Since your last visit</h2>
    <div class="brief"><b id="newN">0</b><span id="newT">new papers</span></div>

    <div id="dl"></div>

    <h2>View</h2>
    <div class="nav" id="views"></div>

    <h2>Topics</h2>
    <div class="chips" id="topics"></div>

    <h2>People to watch</h2>
    <div class="people" id="people"></div>

    <h2>Starred papers</h2>
    <div class="tools">
      <button id="bib">Download BibTeX for Zotero</button>
      <button id="md">Copy as reading notes</button>
      <button id="teach">Teach the ranker (likes.json)</button>
      <button id="backup">Back up stars and reads</button>
      <button id="restore">Restore from backup</button>
      <a href="feed.xml">RSS feed</a>
    </div>
  </aside>

  <main>
    <div class="bar">
      <input type="search" id="q" placeholder="Search titles, abstracts, authors" aria-label="Search papers">
      <div class="seg" id="win" role="group" aria-label="Time window"></div>
      <div class="seg" id="sort" role="group" aria-label="Sort order"></div>
      <select id="src" aria-label="Source"></select>
    </div>
    <p class="count" id="count"></p>
    <div id="list"></div>
    <p class="keys"><kbd>j</kbd> <kbd>k</kbd> move, <kbd>a</kbd> abstract, <kbd>s</kbd> star, <kbd>x</kbd> mark read, <kbd>n</kbd> not for me, <kbd>o</kbd> open, <kbd>/</kbd> search. Stars and reads are saved in this browser only; use backup to move them.</p>
  </main>
</div>

An application for such an emulator is to downscale large-ensemble GCM simulations to allow quantification of $\\sim$100-1000-year return level rainfall, which in turn can be used to drive hydrological and flood models for improved projections of future changes in flood risk.", "link": "https://arxiv.org/abs/2610.26145", "authors": "Henry Addison, Elizabeth J. Kendon, Peter A. G. Watson", "source": "arXiv", "published": "2026-10-19", "first_seen": "2026-11-26T13:59:01+00:00", "score": 100, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": ["Henry Addison"], "boosts": ["precipitation", "extreme", "emulator"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": true, "cites": null}, {"key": "arxiv:2610.19885", "title": "Generative modelling for multivariate spatio-temporal downscaling of monthly climate fields", "summary": "Inferring climate fields at higher spatio-temporal resolutions from coarse representations is essential for accessing socioeconomic and environmental impacts. The downscaling of modelled climate fields faces a trade-off between data storage constraints, simulation efficiency, and resolution requirements. While many methods for spatial downscaling have been proposed, joint spatio-temporal downscaling has received comparable little attention. When deriving, for example, daily fields from climate datasets that are available only as monthly averages at coarser spatial resolution, it is highly challenging to faithfully reproduce extreme event statistics and spatiotemporal consistency. To address this task, we introduce a generative machine learning approach, using a diffusion model to jointly downscale monthly temperature and precipitation fields into temporally consistent daily fields at higher spatial resolution. We demonstrate that our approach can generate high-dimensional multivariate climate fields at daily temporal and 0.25° spatial resolution from monthly input fields at 1° spatial resolution, exhibiting coherent temporal dynamics and physically plausible spatial structures. In particular, by incorporating a conditional guidance technique, we show that a pre-trained diffusion model can be directly leveraged to efficiently generate daily high-resolution fields conditioned on monthly inputs, without requiring additional fine-tuning or retraining. Our probabilistic approach thus provides an efficient and generalizable framework for spatio-temporal climate downscaling, enabl", "link": "https://arxiv.org/abs/2610.19885", "authors": "Yu Huang, Shangshang Yang, Sebastian Bathiany, Michael Aich, Philipp Hess, Niklas Boers", "source": "arXiv", "published": "2026-10-14", "first_seen": "2026-11-26T13:59:01+00:00", "score": 100, "topics": ["Downscaling", "Deep Learning"], "watch": ["Niklas Boers"], "boosts": ["precipitation", "extreme", "diffusion model"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "arxiv:2609.11696", "title": "Stress-Testing Dynamical and Generative Downscaling Using Subseasonal Extreme Precipitation Forecasts", "summary": "Coarse spatial resolution limits the ability of subseasonal prediction models to resolve extreme precipitation. Downscaling with either dynamical or deep generative models can overcome this issue, but the comparative performance of these models for extremes across different atmospheric regimes remains poorly understood. In this work, we evaluate the Weather Research and Forecasting (WRF) model against a diffusion-based generative model by downscaling two physically distinct, extreme precipitation events up to lead times of 3 weeks. For a fair comparison with WRF, which can downscale boundary conditions from different driving models without model-specific training, the diffusion model is trained in an unpaired fashion. Both approaches improve upon the raw European Centre for Medium-Range Weather Forecasts forecasts, in comparison to fused rain gauge-radar observations in Switzerland (CombiPrecip), but exhibit regime-dependent strengths. WRF achieves the highest probabilistic skill for a multicell, non-stationary event. Conversely, the diffusion model is more consistent across different performance metrics for the two events, outperforming WRF in a more stationary supercell event. These results demonstrate that explicit dynamical modeling can add value for specific precipitation events for subseasonal lead times, and that generative downscaling adds value more broadly in different situations.", "link": "https://arxiv.org/abs/2609.11696", "authors": "Mauricio Lima, Marika Koukoula, Romain Pilon, Monika Feldmann, Erwan Koch, Daniela I. V. Domeisen, Tom Beucler", "source": "arXiv", "published": "2026-09-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 100, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": ["Tom Beucler"], "boosts": ["precipitation", "extreme", "diffusion model"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1175/aies-d-23-0066.1", "title": "Enhancing Regional Climate Downscaling through Advances in Machine Learning", "summary": "Despite the sophistication of global climate models (GCMs), their coarse spatial resolution limits their ability to resolve important aspects of climate variability and change at the local scale. Both dynamical and empirical methods are used for enhancing the resolution of climate projections through downscaling, each with distinct advantages and challenges. Dynamical downscaling is physics based but comes with a large computational cost, posing a barrier for downscaling an ensemble of GCMs large enough for reliable uncertainty quantification of climate risks. In contrast, empirical downscaling, which encompasses statistical and machine learning techniques, provides a computationally efficient alternative to downscaling GCMs. Empirical downscaling algorithms can be developed to emulate the behavior of dynamical models directly, or through frameworks such as perfect prognosis in which relationships are established between large-scale atmospheric conditions and local weather variables using observational data. However, the ability of empirical downscaling algorithms to apply their learned relationships out of distribution into future climates remains uncertain, as is their ability to represent certain types of extreme events. This review covers the growing potential of machine learning methods to address these challenges, offering a thorough exploration of the current applications and training strategies that can circumvent certain issues. Additionally, we propose an evaluation framework for machine learning algorithms specific to the problem of climate downscaling as needed ", "link": "https://doi.org/10.1175/aies-d-23-0066.1", "authors": "Neelesh Rampal, Sanaa Hobeichi, Peter B. Gibson, Jorge Baño-Medina, Gab Abramowitz, Tom Beucler, Jose González-Abad, William Chapman", "source": "Artificial Intelligence for the Earth Systems", "published": "2024-4", "first_seen": "2026-11-26T13:59:01+00:00", "score": 100, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": ["Tom Beucler"], "boosts": ["extreme", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1029/2020ms002405", "title": "Data‐Driven Medium‐Range Weather Prediction With a Resnet Pretrained on Climate Simulations: A New Model for WeatherBench", "summary": "Numerical weather prediction has traditionally been based on the models that discretize the dynamical and physical equations of the atmosphere. Recently, however, the rise of deep learning has created increased interest in purely data‐driven medium‐range weather forecasting with first studies exploring the feasibility of such an approach. To accelerate progress in this area, the WeatherBench benchmark challenge was defined. Here, we train a deep residual convolutional neural network (Resnet) to predict geopotential, temperature and precipitation at 5.625° resolution up to 5 days ahead. To avoid overfitting and improve forecast skill, we pretrain the model using historical climate model output before fine‐tuning on reanalysis data. The resulting forecasts outperform previous submissions to WeatherBench and are comparable in skill to a physical baseline at similar resolution. We also analyze how the neural network creates its predictions and find that, for the case studies analyzed, the model has learned physically reasonable correlations. Finally, we perform scaling experiments to estimate the potential skill of data‐driven approaches at higher resolutions.", "link": "https://doi.org/10.1029/2020ms002405", "authors": "Stephan Rasp, Nils Thuerey", "source": "Journal of Advances in Modeling Earth Systems", "published": "2021-2", "first_seen": "2026-11-26T13:59:01+00:00", "score": 100, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": ["Stephan Rasp"], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1029/2023ef004002", "title": "Deep Learning for Bias‐Correcting CMIP6‐Class Earth System Models", "summary": "The accurate representation of precipitation in Earth system models (ESMs) is crucial for reliable projections of the ecological and socioeconomic impacts in response to anthropogenic global warming. The complex cross‐scale interactions of processes that produce precipitation are challenging to model, however, inducing potentially strong biases in ESM fields, especially regarding extremes. State‐of‐the‐art bias correction methods only address errors in the simulated frequency distributions locally at every individual grid cell. Improving unrealistic spatial patterns of the ESM output, which would require spatial context, has not been possible so far. Here, we show that a postprocessing method based on physically constrained generative adversarial networks (cGANs) can correct biases of a state‐of‐the‐art, CMIP6‐class ESM both in local frequency distributions and in the spatial patterns at once. While our method improves local frequency distributions equally well as gold‐standard bias‐adjustment frameworks, it strongly outperforms any existing methods in the correction of spatial patterns, especially in terms of the characteristic spatial intermittency of precipitation extremes.", "link": "https://doi.org/10.1029/2023ef004002", "authors": "Philipp Hess, Stefan Lange, Christof Schötz, Niklas Boers", "source": "Earth's Future", "published": "2023-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 100, "topics": ["Downscaling", "Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": ["Niklas Boers"], "boosts": ["cmip6", "precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1175/aies-d-26-0008.1", "title": "Multivariate deep-learning based regional climate model emulators and the impact of temporal awareness", "summary": "Deep learning (DL) models have emerged as efficient approaches for producing high-resolution climate projections complementary to computationally expensive Regional Climate Models (RCMs). Many applications of high-resolution climate data, such as driving impact models or the characterization of extreme events, require multiple variables and an accurate representation of the relationships between them. Given that most DL-based RCM emulators are single-variate, this study investigates whether training multiple variables within the same model (i.e., multivariate emulators) can improve inter-variable coherence and emulator performance. This paper compares four multivariate RCM emulators and a single-variate baseline in their ability to reproduce daily 2D maps of average, maximum, and minimum surface temperature. All models rely on a U-Net-based architecture. Two models introduce temporality, one of which incorporates a ConvLSTM architecture, by using multiple days of input data. These models are evaluated within a perfect-model framework using a range of climate and numerical metrics. This study introduces a statistical significance testing framework to ensure that differences in model performance are not attributable to stochasticity in DL training. The results show that the temporal and multivariate emulators, especially the LSTM model, consistently outperform the other models across multiple metrics, while the non-temporal multivariate models perform similarly to the single-variate baseline.", "link": "https://doi.org/10.1175/aies-d-26-0008.1", "authors": "Christina Carty, Antoine Doury, Julien Boé", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-11-20", "first_seen": "2026-11-26T13:59:01+00:00", "score": 99, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["extreme", "emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "arxiv:2611.15284", "title": "A hybrid machine learning-analog framework for downscaling unprecedented climate extremes", "summary": "Extreme weather events are critical for climate impact assessments. While physical models can simulate unprecedented extremes, for example, through ensemble boosting, this approach is computationally demanding, often restricting output to coarse spatial resolutions. Probabilistic generative downscaling offers a solution by enabling efficient sampling from the entire climate distribution, including its extreme tails. Here, we first demonstrate that machine learning generated regional climate model heatwaves over Paris are physically realistic. We then leverage an emulated machine learning dataset to perform analog-based downscaling of coarse global climate model ensemble boosting events. Our hybrid framework effectively bridges high-resolution regional detail with rare-event sampling, providing an efficient tool for extreme event downscaling and capturing multi-model uncertainty.", "link": "https://arxiv.org/abs/2611.15284", "authors": "Nina Effenberger, Florian E. Roemer, Maybritt Schillinger, Maxim Samarin, Erich Fischer, Reto Knutti", "source": "arXiv", "published": "2026-11-11", "first_seen": "2026-11-26T13:59:01+00:00", "score": 97, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["extreme", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "arxiv:2610.33482", "title": "Climate downscaling with likelihood functional flow matching", "summary": "Decisions about heat, frost and flooding are made locally, yet reanalyses and climate models resolve tens of kilometres. Generative downscalers add kilometre-scale detail with uncertainty, but are tied to a grid, costly to sample and lack a tractable likelihood. Here we introduce CD-FFM, a functional flow-matching model that treats the high-resolution field as a continuous random field that one model can query at any location and resolution. Its velocity acts pointwise, so spatial variability comes from a noise prior fitted to the observed spectrum and every observation has an exact likelihood. Downscaling ERA5 to 1 km daily temperature over Fennoscandia, CD-FFM lowers the continuous ranked probability score by 27-31% against regression and 12-18% against a forty-times larger neural operator in each of three test years, and outperforms a CorrDiff-style diffusion model while sampling about fifty times faster. The same model transfers to precipitation and makes large kilometre-scale ensembles affordable.", "link": "https://arxiv.org/abs/2610.33482", "authors": "Zhi-Song Liu, Helmi Toropainen, Ammar Kheder, Michael Boy", "source": "arXiv", "published": "2026-10-24", "first_seen": "2026-11-26T13:59:01+00:00", "score": 97, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "flow matching", "diffusion model", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.5194/gmd-18-2051-2025", "title": "Can AI be enabled to perform dynamical downscaling? A latent diffusion model to mimic kilometer-scale COSMO5.0_CLM9 simulations", "summary": "Downscaling based on deep learning (DL) is a key application in Earth system modeling, enabling the generation of high-resolution fields from coarse numerical simulations at reduced computational costs compared to traditional regional models. Additionally, generative DL models can potentially provide uncertainty quantification through ensemble-like scenario generation, a task prohibitive for conventional numerical approaches. In this study, we apply a latent diffusion model (LDM) to demonstrate that recent advancements in generative modeling enable DL to deliver results comparable to those of numerical dynamical models, given the same input data, preserving the realism of fine-scale features and flow characteristics at reduced computational costs. We apply our LDM to downscale ERA5 data over Italy up to a resolution of 2 km. The high-resolution target data consist of 2 m temperature and 10 m horizontal wind components from a dynamical downscaling performed with COSMO-CLM. A selection of predictors from ERA5 is used as input, and a residual approach against a reference U-Net is leveraged in applying the LDM. The performance of the generative LDM is compared with reference baselines of increasing complexity: a quadratic interpolation of ERA5, a U-Net, and a generative adversarial network (GAN) built on the same reference U-Net. Results highlight the improvements introduced by the LDM architecture combined with the residual approach, outperforming all the baselines in terms of spatial error, frequency distributions, and power spectra. These findings point out the potential of ", "link": "https://doi.org/10.5194/gmd-18-2051-2025", "authors": "Elena Tomasi, Gabriele Franch, Marco Cristoforetti", "source": "Geoscientific Model Development", "published": "2025-4-1", "first_seen": "2026-11-26T13:59:01+00:00", "score": 97, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["diffusion model", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.5194/gmd-16-535-2023", "title": "Customized deep learning for precipitation bias correction and downscaling", "summary": "Systematic biases and coarse resolutions are major limitations of current precipitation datasets. Many deep learning (DL)-based studies have been conducted for precipitation bias correction and downscaling. However, it is still challenging for the current approaches to handle complex features of hourly precipitation, resulting in the incapability of reproducing small-scale features, such as extreme events. This study developed a customized DL model by incorporating customized loss functions, multitask learning and physically relevant covariates to bias correct and downscale hourly precipitation data. We designed six scenarios to systematically evaluate the added values of weighted loss functions, multitask learning, and atmospheric covariates compared to the regular DL and statistical approaches. The models were trained and tested using the Modern-era Retrospective Analysis for Research and Applications version 2 (MERRA2) reanalysis and the Stage IV radar observations over the northern coastal region of the Gulf of Mexico on an hourly time scale. We found that all the scenarios with weighted loss functions performed notably better than the other scenarios with conventional loss functions and a quantile mapping-based approach at hourly, daily, and monthly time scales as well as extremes. Multitask learning showed improved performance on capturing fine features of extreme events and accounting for atmospheric covariates highly improved model performance at hourly and aggregated time scales, while the improvement is not as large as from weighted loss functions. We show that th", "link": "https://doi.org/10.5194/gmd-16-535-2023", "authors": "Fang Wang, Di Tian, Mark Carroll", "source": "Geoscientific Model Development", "published": "2023-1-25", "first_seen": "2026-11-26T13:59:01+00:00", "score": 97, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ms004194", "title": "DiffESM: Conditional Emulation of Temperature and Precipitation in Earth System Models With 3D Diffusion Models", "summary": "Earth system models (ESMs) are essential for understanding the interaction between human activities and the Earth's climate. However, the computational demands of ESMs often limit the number of simulations that can be run, hindering the robust analysis of risks associated with extreme weather events. While low‐cost climate emulators have emerged as an alternative to emulate ESMs and enable rapid analysis of future climate, many of these emulators only provide output on at most a monthly frequency. This temporal resolution is insufficient for analyzing events that require daily characterization, such as heat waves or heavy precipitation. We propose using diffusion models, a class of generative deep learning models, to effectively downscale ESM output from a monthly to a daily frequency. Trained on a handful of ESM realizations, reflecting a wide range of radiative forcings, our DiffESM model takes monthly mean precipitation or temperature as input, and is capable of producing daily values with statistical characteristics close to ESM output. Combined with a low‐cost emulator providing monthly means, this approach requires only a small fraction of the computational resources needed to run a large ensemble. We evaluate model behavior using a number of extreme metrics, showing that DiffESM closely matches the spatio‐temporal behavior of the ESM output it emulates in terms of the frequency and spatial characteristics of phenomena such as heat waves, dry spells, or rainfall intensity.", "link": "https://doi.org/10.1029/2023ms004194", "authors": "Seth Bassetti, Brian Hutchinson, Claudia Tebaldi, Ben Kravitz", "source": "Journal of Advances in Modeling Earth Systems", "published": "2024-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 97, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme", "diffusion model", "emulator"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2023.18", "title": "A precipitation downscaling method using a super-resolution deconvolution neural network with step orography", "summary": "Coarse spatial resolution in gridded precipitation datasets, reanalysis, and climate model outputs restricts their ability to characterize the localized extreme rain events and limits the use of the coarse resolution information for local to regional scale climate management strategies. Deep learning models have recently been developed to rapidly downscale the coarse resolution precipitation to the high local scale resolution at a much lower cost than dynamic downscaling. However, these existing super-resolution deep learning modeling studies have not rigorously evaluated the model’s skill in producing fine-scale spatial variability, particularly over topographic features. These current deep-learning models also have difficulty predicting the complex spatial structure of extreme events. Here, we develop a model based on super-resolution deconvolution neural network (SRDN) to downscale the hourly precipitation and evaluate the predictions. We apply three versions of the SRDN model: (a) SRDN (no orography), (b) SRDN-O (orography only at final resolution enhancement), and (c) SRDN-SO (orography at each step of resolution enhancement). We assess the ability of SRDN-based models to reproduce the fine-scale spatial variability and compare it with the previously used deep learning model (DeepSD). All the models are trained and tested using the Conformal Cubic Atmospheric Model (CCAM) data to perform a 100 to 12.5 km of hourly precipitation downscaling over the Australian region. We found that SRDN-based models, including orography, deliver better fine-scale spatial structures of b", "link": "https://doi.org/10.1017/eds.2023.18", "authors": "P. Jyoteeshkumar Reddy, Richard Matear, John Taylor, Marcus Thatcher, Michael Grose", "source": "Environmental Data Science", "published": "2023", "first_seen": "2026-11-26T13:59:01+00:00", "score": 97, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2024.39", "title": "Deep learning based bias correction of TRMM precipitation estimates using IMD-gridded precipitation as ground observation", "summary": "Bias correction is a critical aspect of data-centric climate studies, as it aims to improve the consistency between observational data and simulations by climate models or estimates by remote sensing. Satellite-based estimates of climatic variables like precipitation often exhibit systematic bias when compared to ground observations. To address this issue, the application of bias correction techniques becomes necessary. This research work examines the use of deep learning to reduce the systematic bias of satellite estimations at each grid location while maintaining the spatial dependency across grid points. More specifically, we try to calibrate daily precipitation values of tropical rainfall measuring mission based TRMM_3B42_Daily precipitation data over Indian landmass with ground observations recorded by India Meteorological Department (IMD). We have focused on the precipitation estimates of the Indian Summer Monsoon Rainfall (ISMR) period (June–September) since India gets more than 75% of its annual rainfall in this period. We have benchmarked these deep learning methods against standard statistical methods like quantile mapping and quantile delta mapping on the above datasets. The comparative analysis shows the effectiveness of the deep learning architecture in bias correction.", "link": "https://doi.org/10.1017/eds.2024.39", "authors": "Sumanta Chandra Mishra Sharma, Adway Mitra", "source": "Environmental Data Science", "published": "2024", "first_seen": "2026-11-26T13:59:01+00:00", "score": 97, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["india", "monsoon", "precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-024-00679-1", "title": "Diffusion model-based probabilistic downscaling for 180-year East Asian climate reconstruction", "summary": "As our planet is entering into the “global boiling” era, understanding regional climate change becomes imperative. Effective downscaling methods that provide localized insights are crucial for this target. Traditional approaches, including computationally-demanding regional dynamical models or statistical downscaling frameworks, are often susceptible to the influence of downscaling uncertainty. Here, we address these limitations by introducing a diffusion probabilistic downscaling model (DPDM) into the meteorological field. This model can efficiently transform data from 1° to 0.1° resolution. Compared with deterministic downscaling schemes, it not only has more accurate local details, but also can generate a large number of ensemble members based on probability distribution sampling to evaluate the uncertainty of downscaling. Additionally, we apply the model to generate a 180-year dataset of monthly surface variables in East Asia, offering a more detailed perspective for understanding local scale climate change over the past centuries.", "link": "https://doi.org/10.1038/s41612-024-00679-1", "authors": "Fenghua Ling, Zeyu Lu, Jing-Jia Luo, Lei Bai, Swadhin K. Behera, Dachao Jin, Baoxiang Pan, Huidong Jiang", "source": "npj Climate and Atmospheric Science", "published": "2024-6-13", "first_seen": "2026-11-26T13:59:01+00:00", "score": 95, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": ["diffusion model", "uncertainty"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-25-0061.1", "title": "HRRRCast: A Data-Driven Emulator for Regional Weather Forecasting at Convection-Allowing Scales", "summary": "The High-Resolution Rapid Refresh (HRRR) model is a convection-allowing model used in operational weather forecasting across the contiguous United States (CONUS). To provide a computationally efficient alternative, we introduce HRRRCast, a data-driven emulator built with advanced machine learning techniques. HRRRCast includes two architectures: a ResNet-based model (ResHRRR), our main architecture, and a graph neural network–based model (GraphHRRR). ResHRRR utilizes convolutional neural networks enhanced with squeeze-and-excitation blocks and feature-wise linear modulation and supports probabilistic forecasting via the denoising diffusion implicit model (DDIM). To better handle longer lead times, we train a single model to predict multiple lead times (1, 3, and 6 h) and then use a greedy rollout strategy during inference. When evaluated on composite reflectivity over the full CONUS domain using ensembles of 3–10 members, ResHRRR outperforms HRRR forecast at the light rainfall threshold (20 dB Z ) and achieves competitive performance at moderate thresholds (30 dB Z ). Our work advances the pioneering StormCast model described in Pathak et al. by 1) training on the full CONUS domain, 2) training on multiple lead times to improve long-range performance, 3) using analysis data for training instead of the +1-h postanalysis data inadvertently used in StormCast, and 4) incorporating future Global Forecast System (GFS) weather states as inputs and adding a downscaling component that significantly improves long-lead forecast accuracy. Grid-based, neighborhood-based, and object-based", "link": "https://doi.org/10.1175/aies-d-25-0061.1", "authors": "Daniel Abdi, Isidora Jankov, Paul Madden, Vanderlei Vargas, Timothy A. Smith, Sergey Frolov, Montgomery Flora, Corey Potvin", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-4", "first_seen": "2026-11-26T13:59:01+00:00", "score": 94, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["diffusion model", "emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-12-4261-2019", "title": "Fast domain-aware neural network emulation of a planetary boundary layer parameterization in a numerical weather forecast model", "summary": "Parameterizations for physical processes in weather and climate models are computationally expensive. We use model output from the Weather Research Forecast (WRF) climate model to train deep neural networks (DNNs) and evaluate whether trained DNNs can provide an accurate alternative to the physics-based parameterizations. Specifically, we develop an emulator using DNNs for a planetary boundary layer (PBL) parameterization in the WRF model. PBL parameterizations are used in atmospheric models to represent the diurnal variation in the formation and collapse of the atmospheric boundary layer – the lowest part of the atmosphere. The dynamics and turbulence, as well as velocity, temperature, and humidity profiles within the boundary layer are all critical for determining many of the physical processes in the atmosphere. PBL parameterizations are used to represent these processes that are usually unresolved in a typical climate model that operates at horizontal spatial scales in the tens of kilometers. We demonstrate that a domain-aware DNN, which takes account of underlying domain structure (e.g., nonlocal mixing), can successfully simulate the vertical profiles within the boundary layer of velocities, temperature, and water vapor over the entire diurnal cycle. Results also show that a single trained DNN from one location can produce predictions of wind speed, temperature, and water vapor profiles over nearby locations with similar terrain conditions with correlations higher than 0.9 when compared with the WRF simulations used as the training dataset.", "link": "https://doi.org/10.5194/gmd-12-4261-2019", "authors": "Jiali Wang, Prasanna Balaprakash, Rao Kotamarthi", "source": "Geoscientific Model Development", "published": "2019-10-10", "first_seen": "2026-11-26T13:59:01+00:00", "score": 93, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-26-0020.1", "title": "Does Deep Learning Downscaling Affect Subseasonal-to-Seasonal Forecast Performance?", "summary": "The demand for precise, actionable forecasts for high-impact phenomena such as wildfires is growing. However, operational users of these forecasts often need tailored, interpretable outputs at finer scales rather than abstract improvements in global metrics. This work seeks to bridge that gap by systematically evaluating whether and how deep learning-(DL) based downscaling affects the performance of subseasonal-to-seasonal (S2S) forecasts. We explore whether DL-based downscaling improves not just spatial detail of forecasts but also the relevance and quality of predictions in practical contexts. The Unified Forecast System (UFS) Mid-Range subseasonal retrospective forecasts for week-one through week-four show consistently good forecast skill for temperature and vapor pressure deficit. The wind speed forecasts also show consistency between weeks but lack representation of high values and variability. Therefore, the UFS subseasonal forecast is useful for decision-making processes for heat and moisture conditions for wildfire use cases, but lacks accurate wind representation, a significant factor in extreme wildfire growth. Under baseline tuning, we find marginal statistical impacts of machine-learning-based downscaling on forecast skill when used as an out-of-the-box solution. Despite the lack of performance improvement, there is still a benefit to higher-resolution visuals of forecast data due to aesthetics and social behavior. Statistical downscaling, which is less computationally demanding, shows similar benefits to ML methods in terms of aesthetic improvements for higher ", "link": "https://doi.org/10.1175/aies-d-26-0020.1", "authors": "A. Valencia, T. Fenske, B. Kirtman, S.J. Kramer", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-11-25", "first_seen": "2026-11-26T13:59:01+00:00", "score": 93, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.19994", "title": "PrecipCorrDiff: A Deep Learning Framework for Generating 0.0625$^\\circ$ High-Resolution IMD Gridded Precipitation Data", "summary": "High-resolution precipitation datasets are essential for weather forecasting, hydrological modeling, and climate risk assessment, yet observation-based gridded products often lack the spatial detail required for regional applications. Here we present PrecipCorrDiff, a diffusion-based downscaling framework built by modifying the original corrector diffusion based archetecture that incorporates a customized loss function and a multi-scale residual generation strategy to improve the precipitation especially the representation of extremes. PrecipCorrDiff generates 0.0625° resolution India Meteorological Department (IMD) precipitation fields from 0.25° gridded data while preserving precipitation statistics and reconstructing fine-scale spatial variability. Validation against independent IMD station observations, comparing the proposed framework with the SRGAN-based model and the original CorrDiff model, indicates that the proposed framework substantially improves the representation of spatial precipitation patterns, rainfall intensity distributions, and extreme rainfall events, while eliminating the systematic negative bias present in the previously developed SRGAN-based model. Across four climatologically distinct homogeneous Indian monsoon regions, PrecipCorrDiff reproduces observed precipitation characteristics with near-zero spatial bias, demonstrating the potential of diffusion-based downscaling for generating physically consistent, high-resolution precipitation datasets for hydrological, meteorological, and climate applications.", "link": "https://arxiv.org/abs/2610.19994", "authors": "Bipin Kumar, Rajib Chattopadhyay, Harsh P. Bachhav, Jannu, Bhupendra Bahadur Singh, Ramesh Ragala, Ananda Kumar Das, Manish Modani", "source": "arXiv", "published": "2026-10-14", "first_seen": "2026-11-26T13:59:01+00:00", "score": 92, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["india", "monsoon", "precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2601.00629", "title": "Artificial intelligence and downscaling global climate model future projections", "summary": "A critical review of artificial intelligence and deep machine learning (AI/ML) applied to downscaling of global climate model simulations provides some words of caution, based on past experiences and well-established principles. Recent papers tend to ignore more subtle successes with statistics and mathematical based downscaling, and there are examples of inappropriate evaluation strategies and incomplete accounts of the scientific progress when it comes to climate downscaling. An incomplete description state-of-the-art and a dogmatic approach to evaluation may give a deceiving impression that AI/ML is superior to more statistics and mathematics based methods.", "link": "https://arxiv.org/abs/2601.00629", "authors": "Rasmus E. Benestad", "source": "arXiv", "published": "2026-01-02", "first_seen": "2026-11-26T13:59:01+00:00", "score": 92, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-26-0035.1", "title": "Do Climate Models Need Microphysical and Convective Parameterizations to Generate Accurate Precipitation Fields?", "summary": "Accurately representing surface precipitation is crucial for the operational use of weather and climate models. Presently, global numerical weather prediction (NWP) models struggle to accurately generate precipitation due to their parametrization of unresolved deep convective clouds and, in regions of grid-resolved ascent, inadequate parameterizations of cloud microphysics. Here we bypass these parameterizations with a machine learning model that diagnoses precipitation from 13 ERA5 fields that are easily observed and assimilated. Only three of these fields are moisture-related and all three are better observationally constrained than hydrometeor-class variables like rain or cloud liquid water. We train a pair of models; ML ERA5 using ERA5 precipitation as the target, and ML IMERG using a satellite based precipitation product. ML ERA5 closely reproduces the ERA5 precipitation at all intensities. When evaluated against the satellite dataset, ML IMERG closely matches observations, notably reproducing the diurnal cycle of the satellite product. ML IMERG generally captures extremes better than ERA5 while also avoiding the overproduction of light precipitation present in ERA5. When evaluated against a third ground-and-radar-based dataset, ML IMERG inherits the strengths of the satellite dataset which is superior to ERA5 in the summer months. Both ML IMERG and ML ERA5 are computationally inexpensive to run at inference, taking less than a second per output time to compute precipitation globally at 1°×1° resolution.", "link": "https://doi.org/10.1175/aies-d-26-0035.1", "authors": "Raul Moreno, Dale Durran", "source": "Artificial Intelligence for the Earth Systems", "published": "2026-11-17", "first_seen": "2026-11-26T13:59:01+00:00", "score": 92, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ms003800", "title": "Efficient Super‐Resolution of Near‐Surface Climate Modeling Using the Fourier Neural Operator", "summary": "Downscaling methods are critical in efficiently generating high‐resolution atmospheric data. However, state‐of‐the‐art statistical or dynamical downscaling techniques either suffer from the high computational cost of running a physical model or require high‐resolution data to develop a downscaling tool. Here, we demonstrate a recently proposed zero‐shot super‐resolution method, the Fourier neural operator (FNO), to efficiently perform downscaling without the need for high‐resolution data. Because the FNO learns dynamics in Fourier space, FNO is a resolution‐invariant emulator; it can be trained at a coarse resolution and produces emulation at any high resolution. We applied FNO to downscale a 4‐km resolution Weather Research and Forecasting (WRF) Model simulation of near‐surface heat‐related variables over the Great Lakes region. The FNO is driven by the atmospheric forcings and topographic features used in the WRF model at the same resolution. We incorporated a physics‐constrained loss in FNO by using the Clausius–Clapeyron relation to better constrain the relations among the emulated states. Trained on merely 600 WRF snapshots at 4‐km resolution, the FNO shows comparable performance with a widely‐used convolutional network, U‐Net, achieving averaged modified Kling–Gupta Efficiency of 0.88 and 0.94 on the test data set for temperature and pressure, respectively. We then employed the FNO to produce 1‐km emulations to reproduce the fine climate features. Further, by taking the WRF simulation as ground truth, we show consistent performances at the two resolutions, suggesting ", "link": "https://doi.org/10.1029/2023ms003800", "authors": "Peishi Jiang, Zhao Yang, Jiali Wang, Chenfu Huang, Pengfei Xue, T. C. Chakraborty, Xingyuan Chen, Yun Qian", "source": "Journal of Advances in Modeling Earth Systems", "published": "2023-7", "first_seen": "2026-11-26T13:59:01+00:00", "score": 92, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-025-01103-y", "title": "Global spatio-temporal ERA5 precipitation downscaling to km and sub-hourly scale using generative AI", "summary": "The spatial and temporal distribution of precipitation significantly impacts human lives. While reanalysis datasets provide consistent long-term global precipitation information that allows investigations of rainfall-driven hazards like larger-scale flooding, they lack the resolution to capture the high spatio-temporal variability of precipitation and miss intense local rainfall events. Here, we introduce spateGAN-ERA5, the first deep learning-based spatio-temporal downscaling of precipitation data on a global scale. SpateGAN-ERA5 enhances ERA5 precipitation data from 24 km and 1 h to 2 km and 10 min, delivering high-resolution rainfall fields with realistic spatio-temporal patterns and accurate rain rate distribution, including extremes. Its computational efficiency enables the generation of a large ensemble of solutions, addressing uncertainties inherent to downscaling challenges and supports practical applicability for generating high-resolution precipitation data for arbitrary ERA5 time periods and regions on demand. Trained solely on data from Germany and validated in the US and Australia, considering diverse climates, including tropical rainfall regimes, spateGAN-ERA5 demonstrates strong generalization, indicating robust global applicability. It fulfills critical needs for high-resolution precipitation data in hydrological and meteorological research.", "link": "https://doi.org/10.1038/s41612-025-01103-y", "authors": "Luca Glawion, Julius Polz, Harald Kunstmann, Benjamin Fersch, Christian Chwala", "source": "npj Climate and Atmospheric Science", "published": "2025-6-15", "first_seen": "2026-11-26T13:59:01+00:00", "score": 92, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-021-05847-0", "title": "On the suitability of deep convolutional neural networks for continental-wide downscaling of climate change projections", "summary": "In a recent paper, Baño-Medina et al. (Configuration and Intercomparison of deep learning neural models for statistical downscaling. preprint, 2019) assessed the suitability of deep convolutional neural networks (CNNs) for downscaling of temperature and precipitation over Europe using large-scale ‘perfect’ reanalysis predictors. They compared the results provided by CNNs with those obtained from a set of standard methods which have been traditionally used for downscaling purposes (linear and generalized linear models), concluding that CNNs are well suited for continental-wide applications. That analysis is extended here by assessing the suitability of CNNs for downscaling future climate change projections using Global Climate Model (GCM) outputs as predictors. This is particularly relevant for this type of “black-box” models, whose results cannot be easily explained based on physical reasons and could potentially lead to implausible downscaled projections due to uncontrolled extrapolation artifacts. Based on this premise, we analyze in this work the two key assumptions that are made in perfect prognosis downscaling: (1) the predictors chosen to build the statistical model should be well reproduced by GCMs and (2) the statistical model should be able to reliably extrapolate out of sample (climate change) conditions. As a first step to test the suitability of these models, the latter assumption is assessed here by analyzing how the CNNs affect the raw GCM climate change signal (defined as the difference, or delta, between future and historical climate). Our results show that,", "link": "https://doi.org/10.1007/s00382-021-05847-0", "authors": "Jorge Baño-Medina, Rodrigo Manzanas, José Manuel Gutiérrez", "source": "Climate Dynamics", "published": "2021-6-20", "first_seen": "2026-11-26T13:59:01+00:00", "score": 92, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.20405", "title": "Improved Precipitation Variability in the Community Atmosphere Model through Implementation of a Neural-Network Deep Convection Scheme", "summary": "Conventional deep convection schemes remain a primary source of uncertainty in global climate models, yet replacing them with data-driven alternatives while maintaining physical consistency and numerical stability is an open challenge. We present a hybrid configuration of the Community Atmosphere Model version 6 (CAM6), in which a fully connected deep neural network replaces the Zhang-McFarlane deep convection scheme (ZM), while radiation, turbulence, and other cloud processes are left unchanged. The network is trained on output from a storm-resolving global model - the global System for Atmospheric Modeling (gSAM) - using a coarse-graining approach to derive subgrid-scale convective fluxes and tendencies. This data-driven parameterization is ported to CAM6 and found to run stably for more than a decade while conserving energy and moisture. It produces a broadly realistic climatology without retuning the remaining parameterizations. Relative to the default Zhang-McFarlane scheme, the neural network parameterization substantially improves some long-standing model deficiencies. In particular, the biases in light precipitation and extreme precipitation are markedly reduced, and the diurnal cycle of tropical land precipitation shifts from a spurious midday peak over many regions to the observed late-afternoon peak. These results support targeted ML-based convection schemes as a viable path toward reducing systematic model errors in next-generation climate models.", "link": "https://arxiv.org/abs/2610.20405", "authors": "Xavier J. Levine, Griffin Mooers, Judith Berner, Jack W. Atkinson, Marat F. Khairoutdinov, Janni Yuval, Dominic Orchard, Paul A. O'Gorman", "source": "arXiv", "published": "2026-10-14", "first_seen": "2026-11-26T13:59:01+00:00", "score": 89, "topics": ["Deep Learning", "Climate Modelling"], "watch": aining. To this end, we create two realistic downscaling experiments with challenging upsampling factors (e.g., 8x and 15x) across data from different simulations: the European Centre for Medium-Range Weather Forecasts Reanalysis version 5 (ERA5) and the Wind Integration National Dataset Toolkit. While neural operator-based downscaling models perform better than interpolation and a simple convolutional baseline, we show the surprising performance of an approach that combines a powerful transformer-based model with parameter-free interpolation at zero-shot weather downscaling. We find that this Swin-Transformer-based approach mostly outperforms models with neural operator layers in", "link": "https://doi.org/10.1017/eds.2025.11", "authors": "Saumya Sinha, Brandon Benton, Patrick Emami", "source": "Environmental Data Science", "published": "2025", "first_seen": "2026-11-26T13:59:01+00:00", "score": 89, "topics": ["Downscaling", "Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-17-2347-2024", "title": "Advances and prospects of deep learning for medium-range extreme weather forecasting", "summary": "In recent years, deep learning models have rapidly emerged as a stand-alone alternative to physics-based numerical models for medium-range weather forecasting. Several independent research groups claim to have developed deep learning weather forecasts that outperform those from state-of-the-art physics-based models, and operational implementation of data-driven forecasts appears to be drawing near. However, questions remain about the capabilities of deep learning models with respect to providing robust forecasts of extreme weather. This paper provides an overview of recent developments in the field of deep learning weather forecasts and scrutinises the challenges that extreme weather events pose to leading deep learning models. Lastly, it argues for the need to tailor data-driven models to forecast extreme events and proposes a foundational workflow to develop such models.", "link": "https://doi.org/10.5194/gmd-17-2347-2024", "authors": "Leonardo Olivetti, Gabriele Messori", "source": "Geoscientific Model Development", "published": "2024-3-21", "first_seen": "2026-11-26T13:59:01+00:00", "score": 88, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-11-3999-2018", "title": "Challenges and design choices for global weather and climate models based on machine learning", "summary": "Can models that are based on deep learning and trained on atmospheric data compete with weather and climate models that are based on physical principles and the basic equations of motion? This question has been asked often recently due to the boom in deep-learning techniques. The question is valid given the huge amount of data that are available, the computational efficiency of deep-learning techniques and the limitations of today's weather and climate models in particular with respect to resolution and complexity.In this paper, the question will be discussed in the context of global weather forecasts. A toy model for global weather predictions will be presented and used to identify challenges and fundamental design choices for a forecast system based on neural networks.", "link": "https://doi.org/10.5194/gmd-11-3999-2018", "authors": "Peter D. Dueben, Peter Bauer", "source": "Geoscientific Model Development", "published": "2018-10-1", "first_seen": "2026-11-26T13:59:01+00:00", "score": 87, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-6-995-2025", "title": "Learning predictable and informative dynamical drivers of extreme precipitation using variational autoencoders", "summary": "Large-scale atmospheric dynamics modulate the occurrence of extreme precipitation events and provide sources of predictability of these events on timescales ranging from days to decades. In the midlatitudes, regional dynamical drivers are frequently represented as discrete, persistent and recurrent circulation regimes. However, available methods identify circulation regimes which are either predictable but not necessarily informative of the relevant local-scale impact studied, or targeted to a local-scale impact but no longer as predictable. In this paper, we introduce a generative machine learning method based on variational autoencoders for identifying probabilistic circulation regimes targeted to spatial patterns of precipitation. The method, CMM-VAE, combines targeted dimensionality reduction and probabilistic clustering in a coherent statistical model and extends a previous architecture published by the authors to allow for categorical target variables. We investigate the trade-off between regime informativeness of local precipitation extremes and predictability of the regimes at subseasonal lead times. In an application to study drivers of extreme precipitation over Morocco, we find that the targeted CMM-VAE regimes are more informative of the impact variable of interest, compared to two well-established linear approaches, while maintaining the predictability of conventional non-targeted circulation regimes in subseasonal hindcasts, hence resolving the trade-off identified in previous studies. Furthermore, the targeted regimes and their predictability are physically i", "link": "https://doi.org/10.5194/wcd-6-995-2025", "authors": "Fiona R. Spuler, Marlene Kretschmer, Magdalena Alonso Balmaseda, Yevgeniya Kovalchuk, Theodore G. Shepherd", "source": "Weather and Climate Dynamics", "published": "2025-9-26", "first_seen": "2026-11-26T13:59:01+00:00", "score": 87, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/2009waf2222320.1", "title": "Indian Summer Monsoon Precipitation Climatology in a High-Resolution Regional Climate Model: Impacts of Convective Parameterization on Systematic Biases", "summary": "In an attempt to develop a better simulation of the climatology of monsoon precipitation in climate models, this paper investigates the impacts of different convective closures on systematic biases of an Indian monsoon precipitation climatology in a high-resolution regional climate model. For this purpose, the Weather Research Forecast (WRF) model is run at 45- and 15-km (two-way nested) resolution with three convective parameterization schemes, namely the Grell–Devenyi (GD), the Betts–Miller–Janjić (BMJ), and the Kain–Fritsch (KF), for the period 1 May–31 October 2001–07. The model is forced with the NCEP–NCAR reanalysis data as the initial and boundary conditions. The simulated June–September (JJAS) mean monsoon rainfall with the three convective schemes is compared with the observations. KF is found to have a high moist bias over the central and western coastal Indian region while GD shows the opposite. Among the three, BMJ is able to produce a reasonable mean monsoon pattern. In an attempt to get further insight into the seasonal bias and its evolution, the probability distribution function (PDF) of different rain-rate categories and their percentage contribution to the seasonal total are computed. BMJ and KF underestimate the observations for lighter rain rates and overestimate for rain-rate categories of more than 10 mm day−1. GD shows an overestimation for lighter rain and an underestimation of PDF for moderate categories. The seasonal patterns of evolution of PDF plots of three rain-rate categories are analyzed to determine whether the convective schemes show any sy", "link": "https://doi.org/10.1175/2009waf2222320.1", "authors": "P. Mukhopadhyay, S. Taraphdar, B. N. Goswami, K. Krishnakumar", "source": "Weather and Forecasting", "published": "2010-4-1", "first_seen": "2026-11-26T13:59:01+00:00", "score": 87, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["india", "monsoon", "precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-021-05708-w", "title": "The first multi-model ensemble of regional climate simulations at kilometer-scale resolution, part I: evaluation of precipitation", "summary": "Here we present the first multi-model ensemble of regional climate simulations at kilometer-scale horizontal grid spacing over a decade long period. A total of 23 simulations run with a horizontal grid spacing of $$\\sim $$ ∼ 3 km, driven by ERA-Interim reanalysis, and performed by 22 European research groups are analysed. Six different regional climate models (RCMs) are represented in the ensemble. The simulations are compared against available high-resolution precipitation observations and coarse resolution ( $$\\sim $$ ∼ 12 km) RCMs with parameterized convection. The model simulations and observations are compared with respect to mean precipitation, precipitation intensity and frequency, and heavy precipitation on daily and hourly timescales in different seasons. The results show that kilometer-scale models produce a more realistic representation of precipitation than the coarse resolution RCMs. The most significant improvements are found for heavy precipitation and precipitation frequency on both daily and hourly time scales in the summer season. In general, kilometer-scale models tend to produce more intense precipitation and reduced wet-hour frequency compared to coarse resolution models. On average, the multi-model mean shows a reduction of bias from $$\\sim \\,$$ ∼ −40% at 12 km to $$\\sim \\,$$ ∼ −3% at 3 km for heavy hourly precipitation in summer. Furthermore, the uncertainty ranges i.e. the variability between the models for wet hour frequency is reduced by half with the use of kilometer-scale models. Although differences between the model simulations at the kilometer", "link": "https://doi.org/10.1007/s00382-021-05708-w", "authors": "Nikolina Ban, Cécile Caillaud, Erika Coppola, Emanuela Pichelli, Stefan Sobolowski, Marianna Adinolfi, Bodo Ahrens, Antoinette Alias", "source": "Climate Dynamics", "published": "2021-4-9", "first_seen": "2026-11-26T13:59:01+00:00", "score": 86, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-24-0095.1", "title": "Evaluating Probabilistic Deep Learning Methods for Uncertainty Quantification of Precipitation Bias Correction", "summary": "Climate models often exhibit biases in their precipitation predictions, particularly underestimating high-intensity events and overestimating low precipitation. Deep learning approaches offer promising solutions, but their epistemic uncertainty associated with a deep learning–based bias correction method has not previously been quantified for reliable downstream climate impact studies. While methods for capturing the epistemic uncertainty in deep learning frameworks exist, there is currently no consensus on the best method. In this work, we compare three uncertainty quantification (UQ) methods—Deep Ensembles (DEns), Monte Carlo Dropout (MCD), and Flipout—by assessing the reliability of their uncertainty estimates using standard measures such as sharpness and calibration. These UQ methods are applied to an existing deep learning precipitation bias correction model known as UFNet: a coupled U-Net and fully connected neural network. The methods utilized to assess the models’ uncertainties are 1) calibration, which ensures that the expected probabilities of the model align with reality and 2) sharpness, which is a measure of the precision of the model’s probabilistic predictions. Of the three UQ methods evaluated, the DEns and MCD methods demonstrated the best-calibrated performance (expected calibration error of 0.36 and 0.35, respectively), compared to Flipout (0.58). In contrast, Flipout had the sharpest predictions and the highest metric performance in bias correcting precipitation—especially for higher-order moments such as kurtosis with a spatial correlation of 72% compar", "link": "https://doi.org/10.1175/aies-d-24-0095.1", "authors": "Yannic Lops, Indrasis Chakraborty, Gemma J. Anderson, Donald D. Lucas, Daniel Galea, Shuang Yu", "source": "Artificial Intelligence for the Earth Systems", "published": "2025-7", "first_seen": "2026-11-26T13:59:01+00:00", "score": 85, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2018ms001351", "title": "Using Machine Learning to Parameterize Moist Convection: Potential for Modeling of Climate, Climate Change, and Extreme Events", "summary": "The parameterization of moist convection contributes to uncertainty in climate modeling and numerical w rst_seen": "2026-11-26T13:59:01+00:00", "score": 84, "topics": ["Deep Learning", "Climate Modelling"], "watch": ["Tom Beucler"], "boosts": ["monsoon", "precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "arxiv:2610.36186", "title": "Towards operational data-driven regional weather forecasting: extreme-event skill and near-real-time verification with HRRRCast", "summary": "Improving convective-scale skill in data-driven regional weather models requires better representing rare high-impact events, training at native resolution, broadening variable output, and demonstrating performance in real-time settings. Here, we evaluate these challenges using HRRRCast, a data-driven convection-allowing emulator trained on the High-Resolution Rapid Refresh (HRRR) analysis data. HRRRCast combines native 3-km training, moderate sigmoid-weighted loss reweighting for reflectivity and precipitation, and broader system improvements including expansion of the training archive from 3 to 9 years (2016--2025), increased vertical resolution, expanded outputs, and architectural upgrades. The weighted loss improves high-threshold skill while preserving common-event behavior. Native-resolution training avoids aliasing from 6-km subsampling and substantially improves fractions skill score at convective scales, with gains that persist across pooling windows. HRRRCast has also been running in near-real-time mode for the past year. In seven months of independent observation-based verification, HRRRCast ensemble means improve several near-surface metrics relative to operational HRRR and maintain strong precipitation and reflectivity performance. Single-member reflectivity skill is strongest at 20--30 dBZ; at 40 dBZ, skill is near parity at 6-km pooling and better at pooling radii $\\geq$30 km. Precipitation skill remains competitive through 1 in/h and extends to about 3 in/h in the best recent configuration. A focused comparison with HREF further shows useful low-cost probabi", "link": "https://arxiv.org/abs/2610.36186", "authors": "Daniel Abdi, Isidora Jankov, Vanderlei Vargas, Paul Madden, Emily Carpenter, Travis Wilson, Jeff Hamilton, Molly Smith", "source": "arXiv", "published": "2026-10-26", "first_seen": "2026-11-26T13:59:01+00:00", "score": 84, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme", "emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-19-6797-2026", "title": "RIME-X v1.0: combining simple climate models, Earth system models, and climate impact models into a unified statistical emulator for regional climate indicators", "summary": "Many tasks in climate science, including climate impact assessment, scenario analysis, and end-to-end attribution, require efficient methods to translate a wide range of emissions scenarios into regional-scale climate indicators while explicitly accounting for uncertainty. Climate and impact model emulators are statistical models that approximate selected outputs of comprehensive models and can perform this translation. The Rapid Impact Model Emulator (RIME) uses individual simulations from climate or impact models to empirically relate global mean surface air temperature (GMT) levels to regional-scale indicators, enabling the conversion of GMT trajectories, commonly derived from Simple Climate Models (SCMs), into time series of regional climate impacts. Here, we present the Rapid Impact Model Emulator Extended (RIME-X), an extension of the RIME framework that replaces deterministic emulation of individual models along single GMT trajectories with a probabilistic approach. RIME-X combines ensemble simulations of GMT derived from SCMs with warming-level-dependent regional indicator distributions estimated from weighted Model Intercomparison Project (MIP) data. This results in scenario-dependent, time-evolving probability distributions of those regional indicators. By jointly quantifying global and regional sources of uncertainty from the start, RIME-X enables systematic exploration of the full space of plausible regional climate impact trajectories under different emissions scenarios. The method is conceptually applicable to regional indicators whose distributions are predom", "link": "https://doi.org/10.5194/gmd-19-6797-2026", "authors": "Niklas Schwind, Mahé Perrette, Edward Byers, Annika Högner, Quentin Lejeune, Tessa Möller, Zebedee Nicholls, Peter Pfleiderer", "source": "Geoscientific Model Development", "published": "2026-7-30", "first_seen": "2026-11-26T13:59:01+00:00", "score": 84, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme", "emulator", "uncertainty"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-26-0067.1", "title": "A Diffusion-Based Framework for High-Resolution Precipitation Forecasting over the CONUS", "summary": "Accurate precipitation forecasting is essential for hydrometeorological risk management, especially for anticipating high-intensity rainfall that can lead to flash flooding and infrastructure damage. This study introduces a diffusion-based deep learning (DL) framework that systematically compares three residual prediction strategies differing only in their input sources: 1) a fully data-driven model using only past observations from the Multi-Radar Multi-Sensor (MRMS) system, 2) a corrective model using only forecasts from the High-Resolution Rapid Refresh (HRRR) numerical weather prediction system, and 3) a hybrid model integrating both MRMS and s
