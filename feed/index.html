e EPI , but with a smaller magnitude than the observations. Model spread is large and in most cases bigger than the model signal itself. Statistically significant (95th confidence level) increasing trends in the observational‐based EPI occur over the Midwest and Eastern regions, while most decreasing trends occur over Western regions. Some models give negative correlation coefficients relative to observations. However, some ensemble members, for most models, show correlation coefficients greater than 0.5. Projections of extreme precipitation event frequency, for representative concentration pathway ( RCP ) scenarios 4.5 and 8.5, show increasing trends over the CONUS . Both scenarios give a steady increase throughout the period but the RCP 4.5 signal is smaller in magnitude. Overall, the RCP scenarios show an increase across all regions with the exception of some variability between decades in some regions for RCP 4.5. For the CONUS model spread is smaller than the ", "link": "https://doi.org/10.1002/2013ef000185", "authors": "Emily Janssen, Donald J. Wuebbles, Kenneth E. Kunkel, Seth C. Olsen, Alex Goodman", "source": "Earth's Future", "published": "2014-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 61, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.3914", "title": "The influence of air–sea coupling on forecasts of the 2016 Indian summer monsoon and its intraseasonal variability", "summary": "Abstract Daily initialized coupled and uncoupled numerical weather prediction (NWP) forecasts from the global Met Office Unified Model (MetUM) are compared for the 2016 Indian summer monsoon. Three MetUM configurations are used: atmosphere only (ATM), coupled to a mixed‐layer ocean model (KPP), and coupled to a dynamical ocean model (NEMO). The analysis focuses on the impact of air–sea coupling, particularly in the Bay of Bengal (BoB), on NWP for monsoon rainfall. Seasonal‐mean biases in all three configurations are highly consistent and driven by errors in atmospheric processes. Rainfall is initially overestimated over India, but underestimated over the BoB, the latter associated with too much short‐wave radiation and too little cloud cover in MetUM. The excess short‐wave radiation ( >40 W · m −2 over the northwest BoB) is partially compensated by additional latent cooling, primarily due to overestimated surface wind speeds. In NEMO and KPP, coupling improves the timing of intraseasonal active and break phases over India, primarily the end of these phases, which are systematically too late in ATM. NEMO and KPP show a more realistic intraseasonal local phase relationship between sea surface temperature (SST) and rainfall throughout the BoB, but no configuration reproduces the observed significant lagged relationship between BoB SST and Indian rainfall. The lack of this relationship may be partly attributed to weak heat flux feedbacks to northern BoB SST, with the forecast short‐wave feedback having systematically the wrong sign (positive) compared to satellite radiation, an", "link": "https://doi.org/10.1002/qj.3914", "authors": "Maria Valdivieso, Simon C. Peatman, Nicholas P. Klingaman", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2020-10-30", "first_seen": "2026-11-23T21:25:47+00:00", "score": 61, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["india", "monsoon"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2025ef006934", "title": "Four Decades of Baseflow Drought Analysis Reveals Varying Contributions of Climatic Drivers and Physical Controls", "summary": "While the impacts of subsurface fluxes on mediating hydrologic response to droughts are often ignored, several studies indicate that baseflow can sustain rivers during droughts and decrease the vulnerability of water supplies. Therefore, given the increasing impacts of droughts on economic and environmental issues, understanding the baseflow drought (BFD) evolution and its drivers are critical. In this study, we quantify and analyze the long‐term evolution of BFD characteristics across the Contiguous United States. We use long‐term daily baseflow values of DeepBase data set and explainable machine learning models to identify and rank the climatic and physical drivers of BFD. Our analysis reveals notable regional disparities in BFDs, with western regions, particularly the Southwest, experiencing increased frequency and prolonged durations, while much of the eastern areas show declining trends. During the past decade, BFD frequency has been governed mainly by anomalies in the atmospheric water balance and by soil properties. Its duration has been primarily influenced by hydrogeologic attributes, and its intensity has been modulated most strongly by topographic setting. Highlighting the non‐stationary and complex nature of BFD mechanisms, our results have practical implications for water resource management and drought adaptation strategies.", "link": "https://doi.org/10.1029/2025ef006934", "authors": "Parnian Ghaneei, Ehsan Foroumandi, Kerstin Stahl, Hoori Ajami, Niko Wanders, Hamid Moradkhani", "source": "Earth's Future", "published": "2026-1", "first_seen": "2026-11-23T21:44:54+00:00", "score": 61, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/2007mwr2123.1", "title": "Scale-Selective Verification of Rainfall Accumulations from High-Resolution Forecasts of Convective Events", "summary": "Abstract The development of NWP models with grid spacing down to ∼1 km should produce more realistic forecasts of convective storms. However, greater realism does not necessarily mean more accurate precipitation forecasts. The rapid growth of errors on small scales in conjunction with preexisting errors on larger scales may limit the usefulness of such models. The purpose of this paper is to examine whether improved model resolution alone is able to produce more skillful precipitation forecasts on useful scales, and how the skill varies with spatial scale. A verification method will be described in which skill is determined from a comparison of rainfall forecasts with radar using fractional coverage over different sized areas. The Met Office Unified Model was run with grid spacings of 12, 4, and 1 km for 10 days in which convection occurred during the summers of 2003 and 2004. All forecasts were run from 12-km initial states for a clean comparison. The results show that the 1-km model was the most skillful over all but the smallest scales (approximately &lt;10–15 km). A measure of acceptable skill was defined; this was attained by the 1-km model at scales around 40–70 km, some 10–20 km less than that of the 12-km model. The biggest improvement occurred for heavier, more localized rain, despite it being more difficult to predict. The 4-km model did not improve much on the 12-km model because of the difficulties of representing convection at that resolution, which was accentuated by the spinup from 12-km fields.", "link": "https://doi.org/10.1175/2007mwr2123.1", "authors": "Nigel M. Roberts, Humphrey W. Lean", "source": "Monthly Weather Review", "published": "2008-1-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 60, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-19-11149-2026", "title": "Enhancing data-driven weather forecasting via gated relative position encoding and spatial-aware feed-forward network", "summary": "Transformer-based weather forecasting models often use static positional encodings, limiting their representation of flow-dependency and geographical heterogeneity. We introduce Gated Relative Position Encoding (GRPE) to address these limitations. Gating mechanism has recently been applied in data-driven weather forecasting, but its specific contribution remains insufficiently understood. We propose Spatial-Aware Feed-Forward Network (SAFN) to explore this question. GRPE constructs dynamic positional biases through a gated linear combination of learnable prototypes, allowing spatial relationships to vary with location and atmospheric state. SAFN combines depth-wise convolutions, multiplicative gating, and a learnable global positional bias to represent spatial feature interactions and persistent geographical influences. We integrate both components into the Neighborhood Attention Transformer for Atmospheric prediction (AtmoNAT), a global forecasting model with 43.4 million parameters trained on ERA5 reanalysis at 1.5° spatial resolution and 12 h temporal intervals. Evaluations using WeatherBench 2 metrics show that AtmoNAT's deterministic forecasts outperform the ensemble-mean forecasts of several other coarse-resolution models across most key variables at lead times up to 72 h. Over global land areas, AtmoNAT also outperforms several models trained at 0.25° resolution, including FuXi and GraphCast, for 10 m winds and 700 hPa specific humidity at lead times up to 120 h. Ablation experiments show that GRPE and SAFN each reduce root mean square errors by approximately 5 %–10 ", "link": "https://doi.org/10.5194/gmd-19-11149-2026", "authors": "Leyi Wang, Duo Zhang, Jerry Zhijian Yang, Baoxiang Pan, Dazhi Xi, Xiaoyu Huang", "source": "Geoscientific Model Development", "published": "2026-11-23", "first_seen": "2026-11-23T14:47:49+00:00", "score": 59, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/jgrd.50571", "title": "Projection of occurrence of extreme dry‐wet years and seasons in Europe with stationary and nonstationary Standardized Precipitation Indices", "summary": "The probabilities of the occurrence of extreme dry/wet years and seasons in Europe are estimated by using two ways of the Standardized Precipitation Index (SPI and SPI‐GEV) and the Standardized Nonstationary Precipitation Index (SnsPI). The latter is defined as the SPI by fitting precipitation data with a nonstationary Gamma distribution in order to model the precipitation time dependence under climate change. Bias‐corrected daily precipitation outputs from five different regional climate models (RCMs) provided by the ENSEMBLES project are used. The five RCMs are selected so as to represent the main statistical properties of the whole ENSEMBLES set and the most extreme deviation from the ensemble mean. All indicators are calculated for the ensemble of the five models over the period 1971–2098. Results show that under global warming, climate in Europe will significantly change from its current state with the probability of the occurrence of extreme dry and wet years and seasons increasing, respectively, over southern dry and northern wet regions. Comparing nonstationary and stationary indices, the SnsPI is found to be more robust than the common SPI in the prediction of precipitation changes with multimodel ensembles.", "link": "https://doi.org/10.1002/jgrd.50571", "authors": "S. Russo, A. Dosio, A. Sterl, P. Barbosa, J. Vogt", "source": "JGR: Atmospheres", "published": "2013-7-25", "first_seen": "2026-11-23T21:25:47+00:00", "score": 59, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41558-022-01309-5", "title": "Precipitation trends determine future occurrences of compound hot–dry events", "summary": "Abstract Compound hot–dry events—co-occurring hot and dry extremes—frequently cause damages to human and natural systems, often exceeding separate impacts from heatwaves and droughts. Strong increases in the occurrence of these events are projected with warming, but associated uncertainties remain large and poorly understood. Here, using climate model large ensembles, we show that mean precipitation trends exclusively modulate the future occurrence of compound hot–dry events over land. This occurs because local warming will be large enough that future droughts will always coincide with at least moderately hot extremes, even in a 2 °C warmer world. By contrast, precipitation trends are often weak and equivocal in sign, depending on the model, region and internal climate variability. Therefore, constraining regional precipitation trends will also constrain future compound hot–dry events. These results help to assess future frequencies of other compound extremes characterized by strongly different trends in the drivers.", "link": "https://doi.org/10.1038/s41558-022-01309-5", "authors": "Emanuele Bevacqua, Giuseppe Zappa, Flavio Lehner, Jakob Zscheischler", "source": "Nature Climate Change", "published": "2022-3-14", "first_seen": "2026-11-23T21:25:47+00:00", "score": 59, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2006gl029068", "title": "Contribution of land‐atmosphere coupling to recent European summer heat waves", "summary": "Most of the recent European summer heat waves have been preceded by a pronounced spring precipitation deficit. The lack of precipitation and the associated depletion of soil moisture result in reduced latent cooling and thereby amplify the summer temperature extremes. In order to quantify the contribution of land‐atmosphere interactions, we conduct regional climate simulations with and without land‐atmosphere coupling for four selected major summer heat waves in 1976, 1994, 2003, and 2005. The coupled simulation uses a fully coupled land‐surface model, while in the uncoupled simulation the mean seasonal cycle of soil moisture is prescribed. The experiments reveal that land‐atmosphere coupling plays an important role for the evolution of the investigated heat waves both through local and remote effects. During all simulated events soil moisture‐temperature interactions increase the heat wave duration and account for typically 50–80% of the number of hot summer days. The largest impact is found for daily maximum temperatures during heat wave episodes.", "link": "https://doi.org/10.1029/2006gl029068", "authors": "E. M. Fischer, S. I. Seneviratne, D. Lüthi, C. Schär", "source": "Geophysical Research Letters", "published": "2007-3", "first_seen": "2026-11-23T21:25:47+00:00", "score": 58, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-024-00853-5", "title": "How well do climate modes explain precipitation variability?", "summary": "Abstract Large-scale modes of climate variability, such as the El Niño-Southern Oscillation, North Atlantic Oscillation, and Indian Ocean Dipole, show significant regional correlations with seasonal weather conditions, and are routinely forecast by meteorological agencies attempting to anticipate seasonal precipitation patterns. Here, we use machine learning together with more traditional approaches to quantify how much precipitation variability can be explained by large-scale modes of variability, and to understand the degree to which these modes interact non-linearly. We find that the relationship between climate modes and precipitation is predominantly non-linear. In some regions and seasons climate modes can explain up to 80% of precipitation variability. However, variability explained is below 10% for more than half of the land surface, and only 1% of the land shows values above 50%. This outcome provides a clear rationale to limit expectations of predictability from modes of variability in all but a few select regions and seasons.", "link": "https://doi.org/10.1038/s41612-024-00853-5", "authors": "Sanaa Hobeichi, Gab Abramowitz, Alex Sen Gupta, Andréa S. Taschetto, Doug Richardson, Neelesh Rampal", "source": "npj Climate and Atmospheric Science", "published": "2024-12-4", "first_seen": "2026-11-23T21:25:47+00:00", "score": 58, "topics": ["Deep Learning"], "watch": [], "boosts": ["india", "precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-022-06591-9", "title": "Near-term regional climate change in East Africa", "summary": "Abstract In the coming few decades, projected increases in global temperature and humidity are generally expected to exacerbate human exposure to climate extremes (e.g., humid-heat and rainfall extremes). Despite the growing risk of humid-heat stress (measured by wet-bulb temperature), it has received less attention in East Africa, where arid and semi-arid climatic conditions prevail. Moreover, no consensus has yet been reached across models regarding future changes in rainfall over this region. Here, we screen Global Climate Models (GCMs) from CMIP5 and CMIP6 and use, for boundary conditions, simulations from only those GCMs that simulate successfully recent climatic trends. Based on these GCMs and Regional Climate Model (RCM) simulations, we project that annual mean temperature is likely to rise by 2 ℃ toward midcentury (2021–2050) ​at a faster rate than the global average (about 1.5 ℃), under the RCP8.5 and SSP5-8.5 scenarios, associated with more frequent and severe climate extremes. In particular, low-lying regions in East Africa will be vulnerable to severe heat stress, with an extreme wet-bulb temperature approaching or exceeding the US National Weather Service’s extreme danger threshold of 31 ℃. On the other hand, population centers in the highlands of Ethiopia will receive significantly more precipitation during the autumn season and will see more extreme rainfall events, with implications for flooding and agriculture. The robustness of these results across all GCM and RCM simulations, and for both of CMIP5 and CMIP6 frameworks (CMIP: Coupled Model Inter-comparison", "link": "https://doi.org/10.1007/s00382-022-06591-9", "authors": "Yeon-Woo Choi, Deborah J. Campbell, Elfatih A.B. Eltahir", "source": "Climate Dynamics", "published": "2022-11-24", "first_seen": "2026-11-23T21:25:47+00:00", "score": 58, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.20947", "title": "Ranked Right, Sized Wrong: Ensemble Spread Fails Silently at Streamflow Extremes", "summary": "Deep learning models, particularly Long Short-Term Memory networks, are increasingly used for operational streamflow forecasting, with ensemble spread providing a signal of predictive uncertainty. As climate change increases the frequency of hydroclimatic extremes, these models will increasingly operate under flow conditions that are rare in their historical records. We therefore evaluate whether ensemble spread remains informative under increasing flows, examining both its magnitude relative to error and its ability to rank errors. Prediction error is approximately $2\\times$ the corrected spread at ordinary flows and up to $4\\times$ at the highest flows, with the discrepancy increasing with flow (log-log slope $1.30$, 95% CI: $[1.20,1.41]$). Under-dispersion is strongest in observed extreme flows beyond the training record, reaching an $18\\times$ discrepancy. This is pervasive and not explainable by conditional mean bias. Area Under the Sparsification Error, a standard distribution-free metric of uncertainty ranking, describing how well a model knows when it is uncertain, indicates near-oracle ranking for ensemble spread ($0.071$), yet ordering by predicted discharge alone nearly matches it. Informative uncertainty ranking can coexist with severe under-dispersion. In deployment, error ranking cannot be verified, yet the spread is available, and it is relied on as the uncertainty signal under increasingly extreme conditions, while systematically understating risk, most severely for the extreme events that matter most.", "link": "https://arxiv.org/abs/2610.20947", "authors": "Justin Gallant, Tyler Wilson", "source": "arXiv", "published": "2026-10-14T21:12:10Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 57, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.4858", "title": "The hectometric modelling challenge: Gaps in the current state of the art and ways forward towards the implementation of 100‐m scale weather and climate models", "summary": "Abstract For a number of years research has been carried out in several centres which has demonstrated the potential benefits of 100‐m scale models for a range of meteorological phenomena. More recently, some meteorological services have started to consider seriously the operational implementation of practical hectometric models. Many, but by no means all, of the applications are likely to relate to urban areas, where the enhanced resolution has obvious benefits. This article is concerned with the issues that need to be addressed to bridge the gap between research at 100‐m scales and practical models. We highlight a number of key issues that need to be addressed, with suggestions of important avenues for future development. An overarching issue is the high computational cost of these models. Although some ideas to reduce this are presented, it will always be a serious constraint. This means that the benefits of these models over lower resolution ones, or other techniques for generating high‐resolution forecasts, will need to be clearly understood, as will the trade‐offs with resolution. We discuss issues with model dynamical cores and physics–dynamics coupling. There are a number of challenges around model parameterisations, where some of the traditional problems (e.g., convection) become easier but a number of new challenges (e.g., around surface parameterisations) appear. Observational data at these scales present a challenge and novel types of observations will need to be considered. Data assimilation will be needed for short‐range forecasts, but there is currently littl", "link": "https://doi.org/10.1002/qj.4858", "authors": "Humphrey W. Lean, Natalie E. Theeuwes, Michael Baldauf, Jan Barkmeijer, Geoffrey Bessardon, Lewis Blunn", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2024-10", "first_seen": "2026-11-23T21:25:47+00:00", "score": 57, "topics": ["Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.3200", "title": "The evolution, seasonality and impacts of western disturbances", "summary": "Western disturbances (WDs) are upper‐level synoptic‐scale systems embedded in the subtropical westerly jet stream (STWJ), often associated with extreme rainfall events in north India and Pakistan during boreal winter. Here, a tracking algorithm is applied to the upper‐tropospheric vorticity field for 37 years of ERA‐Interim reanalysis data, giving a catalogue of over 3000 events. These events are analysed in a composite framework: the vertical structure is explored across a large number of dynamic and thermodynamic fields, revealing a significant northwestward tilt with height, strong ascent ahead of the centre, which sits above the maximum surface precipitation, and a warm‐over‐cold, dry‐over‐moist structure, among other signatures of strong baroclinicity. Evolution of the structures of cloud cover and vertical wind speed are investigated as the composite WD passes across northern India. Cloud cover in particular is found to be particularly sensitive to the presence of the Himalayan foothills, with a significant maximum at 300 hPa approximately 1 day after the WD reaches peak intensity. k ‐means clustering is used to classify WDs according to both dynamical structure and precipitation footprint and the relationship between the two sets of WDs is explored. Finally, the statistical relationship between the STWJ position and WDs on interannual time‐scales is explored, showing that WD frequency in north India is highly sensitive to the jet location over Eurasia. Years with a greater number of WDs feature a STWJ shifted to the south, a pattern that is substantially more coheren", "link": "https://doi.org/10.1002/qj.3200", "authors": "Kieran M. R. Hunt, Andrew G. Turner, Len C. Shaffrey", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2018-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 57, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "himalaya", "precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/2016gl068409", "title": "Characterizing the onset and demise of the Indian summer monsoon", "summary": "An objective index of the onset and demise of the Indian summer monsoon (ISM) is introduced. This index has the advantage of simplicity by using only one variable, which is the spatially averaged all‐India rainfall, a reliably observed quantity for more than a century. The proposed onset index is shown to be insensitive to all historic false onsets. By definition, now the seasonal mean rainfall anomalies become a function of variations in onset and demise dates, rendering their monitoring to be very meaningful. This new index provides a comprehensive representation of the seasonal evolution of the ISM by capturing the corresponding changes in large‐scale dynamic and thermodynamic variables. We also show that the interannual variability of the onset date of the ISM is associated with El Niño–Southern Oscillation (ENSO) with early (late) onsets preceded by cold (warm) ENSO.", "link": "https://doi.org/10.1002/2016gl068409", "authors": "Ryne Noska, Vasubandhu Misra", "source": "Geophysical Research Letters", "published": "2016-5-7", "first_seen": "2026-11-23T21:44:54+00:00", "score": 57, "topics": ["Close to your work"], "watch": [], "boosts": ["india", "monsoon"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024ef005219", "title": "Indian Ocean Dipole Impacts on Eastern African Short Rains Across Observations, Historical Simulations and Future Projections", "summary": "Eastern African “short rains” (October–December) are significantly influenced by the Indian Ocean Dipole (IOD), with increased rainfall during positive IOD events and dryness during negative IOD events. Most Coupled Model Intercomparison Project Phase 6 models overestimate the short‐rain response to IOD events in Eastern Africa, especially during negative events. This is due to enhanced zonal moisture transport anomalies, mainly related to amplified IOD intensity and the westward extension of the IOD eastern core. Mean‐state precipitation biases further contribute to overestimated short rains, traced back to the mean‐state positive IOD‐like biases. Under global warming, the contrasting short‐rain responses to IOD in the Horn of Africa and Southeastern Africa are primarily driven by the westward‐shifting IOD circulation. Enhanced impacts in the Horn of Africa are driven by stronger IOD‐related zonal winds and the more humid mean‐state atmosphere which is attributed to the IOD‐like warming pattern. In contrast, weakened impacts in Southeastern Africa are associated with anomalous meridional wind changes. Additionally, due to more extreme negative IOD events, the frequency as well as severity of droughts in the Horn of Africa are projected to increase. These findings provide valuable insights into Eastern Africa's climate dynamics and inform climate adaptation strategies.", "link": "https://doi.org/10.1029/2024ef005219", "authors": "Yiling Zheng, Chi‐Yung Tam, Matthew Collins", "source": "Earth's Future", "published": "2025-6", "first_seen": "2026-11-23T21:44:54+00:00", "score": 57, "topics": ["Close to your work"], "watch": [], "boosts": ["india", "precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/2009waf2222242.1", "title": "Impacts of Satellite-Observed Winds and Total Precipitable Water on WRF Short-Range Forecasts over the Indian Region during the 2006 Summer Monsoon", "summary": "Assimilation experiments have been performed with the Weather Research and Forecasting (WRF) model’s three-dimensional variational data assimilation (3DVAR) scheme to assess the impacts of NASA’s Quick Scatterometer (QuikSCAT) near-surface winds, and Special Sensor Microwave Imager (SSM/I) wind speed and total precipitable water (TPW) on the analysis and on short-range forecasts over the Indian region. The control (without satellite data) as well as WRF 3DVAR sensitivity runs (which assimilated satellite data) were made for 48 h starting daily at 0000 UTC during July 2006. The impacts of assimilating the different satellite dataset were measured in comparison to the control run, which does not assimilate any satellite data. The spatial distribution of the forecast impacts (FIs) for wind, temperature, and humidity from 1-month assimilation experiments for July 2006 demonstrated that on an average, for 24- and 48-h forecasts, the satellite data provided useful information. Among the experiments, WRF wind speed prediction was improved by QuikSCAT surface wind and SSM/I TPW assimilation, while temperature and humidity prediction was improved due to the assimilation of SSM/I TPW. The rainfall prediction has also been improved significantly due to the assimilation of SSM/I TPW, with the largest improvement seen over the west coast of India. Through an improvement of the surface wind field, the QuikSCAT data also yielded a positive impact on the precipitation, particularly for day 1 forecasts. In contrast, the assimilation of SSM/I wind speed degraded the humidity and rainfall pre", "link": "https://doi.org/10.1175/2009waf2222242.1", "authors": "V. Rakesh, Randhir Singh, P. K. Pal, P. C. Joshi", "source": "Weather and Forecasting", "published": "2009-12-1", "first_seen": "2026-11-23T21:44:54+00:00", "score": 57, "topics": ["Close to your work"], "watch": [], "boosts": ["india", "monsoon", "precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023jd040055", "title": "Did Historical Storms Used in Probable Maximum Precipitation (PMP) Estimation Reach Maximum Efficiency? A Large Model Ensemble Approach", "summary": "Abstract The flood that would result from the greatest depth of precipitation “meteorologically possible”, or Probable Maximum Precipitation (PMP) is used in the design of dam spillways and other high‐risk structures. Historically, PMP has been estimated by scaling depth‐area‐duration relationships obtained from severe historical storms. Over the last decade, numerical weather prediction models have been used to instead simulate precipitation resulting from the addition of atmospheric moisture (called relative humidity maximization, or RHM). Despite the major improvement this represents, model‐based PMP relies on a key assumption, which this paper re‐evaluates in Oroville dam's Feather River watershed (California). Model‐based as well as earlier procedures assume that severe historical storms achieved maximum efficiency (moisture conversion to precipitation) and only maximize moisture. We examine the most severe storms found in the CESM2‐LE global climate model ensemble, which constitutes a very large artificial record (∼1,150 years) in comparison with the historical record, to understand the upper bounds of storm efficiency and precipitation. We downscale the 10 most severe CESM2‐LE storms (by precipitation totals), and identify key storm attributes (vertical motion, convection and convergence) that control precipitation efficiency. In comparison with historical storms, we find that CESM‐LE storms can have 30% higher efficiency and 32% higher precipitation, but produce only 8% higher PMP estimates, suggesting some convergence of model ensemble and historical storms in term", "link": "https://doi.org/10.1029/2023jd040055", "authors": "Emilie G. Tarouilly, Stefan R. Rahimi, Jason M. Cordeira, Dennis P. Lettenmaier", "source": "JGR: Atmospheres", "published": "2024-12-16", "first_seen": "2026-11-23T14:47:49+00:00", "score": 56, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-026-08453-0", "title": "Decoding Indian summer monsoon rainfall through time: a dynamic perspective", "summary": "", "link": "https://doi.org/10.1007/s00382-026-08453-0", "authors": "T. Reshma, Hamza Varikoden, C. A. Babu", "source": "Climate Dynamics", "published": "2026-11-20", "first_seen": "2026-11-23T21:44:54+00:00", "score": 56, "topics": ["Close to your work"], "watch": [], "boosts": ["india", "monsoon"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-19-10933-2026", "title": "Evaluation of precipitation variability over complex terrain based on observations and high resolution WRF v4.2.2 modelling", "summary": "Heterogeneity in the occurrence, amount and distribution of precipitation in mountainous areas is relevant for water resources and stresses the need for high-altitude observations and high-resolution modeling over complex terrain. This work focuses on the analysis of precipitation in the Sierra de Guadarrama, a mountain range at the center of the Iberian Plateau that provides water resources for several million citizens living within it and in nearby cities, mostly Madrid. The precipitation climatology is assessed from available observations and high resolution climate model simulations during the period 1991–2020. For this purpose, data from 37 stations located in the Sierra de Guadarrama and surrounding lowlands, with altitudes ranging from 600 to 2200 ma.s.l. have been analyzed and compared to model simulations. A regional simulation with the WRF model (version 4.2.2), driven with boundary conditions provided by the ERA5 reanalysis, was performed. The simulation has three nested domains with increasing resolutions of 9, 3, and 1 km, with the smallest domain covering the target region, including the Sierra de Guadarrama and surroundings. The comparison of the different data sources aims at characterizing the precipitation distribution over the area, assessing the performance of ERA5 and the potential added value of the increasing resolution of the WRF simulation in reproducing the observations. Results show that the increase in WRF resolution from 9 to 3 km produces a better representation of the overall climatology of precipitation and the altitudinal gradients. The 1 km", "link": "https://doi.org/10.5194/gmd-19-10933-2026", "authors": "Emilio Greciano-Zamorano, J. Fidel González-Rouco, Jorge Navarro-Montesinos, Cristina Vegas-Cañas, Félix García-Pereira, Elena García-Bustamante", "source": "Geoscientific Model Development", "published": "2026-11-17", "first_seen": "2026-11-23T21:25:47+00:00", "score": 55, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2025ef007928", "title": "Observation‐Constrained Projections Reveal Robust Streamflow Increases in Indian Rivers", "summary": "Abstract Reliable streamflow projections are essential for effective water‐resource management and climate adaptation. However, streamflow projections are associated with large uncertainties due to divergent precipitation projections from climate models, which directly propagate into hydrological estimates. Observation‐constrained approaches that condition future projections on past observations have been shown to reduce such uncertainties; however, they have not been applied to streamflow projections across the Indian rivers. Using long‐term streamflow and global mean surface temperature observations, climate model projections, hydrological modeling, and a Bayesian detection–attribution framework, we developed observational constrained streamflow projections for nine major Indian rivers. The method reduces the 5–95% confidence interval of future streamflow projections by nearly one‐third compared to raw multimodel ensembles, with constraint strength controlled by internal streamflow variability and inter‐model spread in the unconstrained ensemble. Projection uncertainty is further reduced to ∼20% when considering projections based only on skillful climate models. Constrained projections indicate significant increases in streamflow in the near‐, mid‐, and far‐future periods, except for the Cauvery basin, which shows a near‐term decline. Applying the method to raw precipitation projections reveals comparable constraint strength and increases confidence in the results, given the strong dependence of Indian river flows on precipitation. Our findings underscore the importance o", "link": "https://doi.org/10.1029/2025ef007928", "authors": "Dipesh Singh Chuphal, Vimal Mishra", "source": "Earth's Future", "published": "2026-3", "first_seen": "2026-11-23T21:25:47+00:00", "score": 55, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "precipitation", "uncertainty"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024jd042204", "title": "Mesoscale Convective Systems Tracking Method Intercomparison (MCSMIP): Application to DYAMOND Global km‐Scale Simulations", "summary": "Abstract Global kilometer‐scale models represent the future of Earth system modeling, enabling explicit simulation of organized convective storms and their associated extreme weather. Here, we comprehensively evaluate tropical mesoscale convective system (MCS) characteristics in the DYAMOND (DYnamics of the atmospheric general circulation modeled on non‐hydrostatic domains) simulations for both summer and winter phases. Using 10 different feature trackers applied to simulations and satellite observations, we assess MCS frequency, precipitation, and other key characteristics. Substantial differences (a factor of 2–3) arise among trackers in observed MCS frequency and their precipitation contribution, but model‐observation differences in MCS statistics are more consistent across trackers. DYAMOND models are generally skillful in simulating tropical mean MCS frequency, with multi‐model mean biases ranging from −2%–8% over land and −8%–8% over ocean (summer vs. winter). However, most DYAMOND models underestimate MCS precipitation amount (23%) and their contribution to total precipitation (17%). Biases in precipitation contributions are generally smaller over land (13%) than over ocean (21%), with moderate inter‐model variability. While models better simulate MCS diurnal cycles and cloud shield characteristics, they overestimate MCS precipitation intensity and underestimate stratiform rain contributions (up to a factor of 2), particularly over land, albeit observational uncertainties exist. Additionally, models exhibit a wide range of precipitable water in the tropics compared t", "link": "https://doi.org/10.1029/2024jd042204", "authors": "Zhe Feng, Andreas F. Prein, Julia Kukulies, Thomas Fiolleau, William K. Jones, Ben Maybee", "source": "JGR: Atmospheres", "published": "2025-4-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 55, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-6-879-2025", "title": "Physical processes leading to extreme day-to-day temperature change – Part 1: Present-day climate", "summary": "Extreme temperature changes from one day to another that are associated with either warming or cooling can have a significant impact on health, the environment, and society. Previous studies have shown that such day-to-day temperature (DTDT) changes are typically more pronounced in the extratropics than the tropics. However, the underlying physical processes and the relationship between extreme events and the large-scale atmospheric circulation remain poorly understood. Here, these processes are investigated for different locations around the globe based on ERA5 reanalysis data and Lagrangian backward-trajectory calculations. We show that extreme DTDT changes in the extratropics are generally associated with changes in air mass transport, particularly shifts from warmer to colder air parcels or vice versa that are linked to regionally specific synoptic-scale circulation anomalies (ridge or trough patterns). These dominant effects of advection are modulated by changes in adiabatic and diabatic processes in the transported air parcels, which either amplify or dampen DTDT decreases (cooling events) and increases (warming events) depending on the region and season. In contrast, extreme DTDT changes during December–February in the tropics are controlled by local processes rather than changes in advection. For instance, the most significant DTDT decreases are associated with a shift from less cloudy to more cloudy conditions, highlighting the crucial role of solar radiative heating. The mechanistic insights into the extreme DTDT changes obtained in this study can help improve the", "link": "https://doi.org/10.5194/wcd-6-879-2025", "authors": "Kalpana Hamal, Stephan Pfahl", "source": "Weather and Climate Dynamics", "published": "2025-9-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 55, "topics": ["Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-018-4449-z", "title": "Skill of Indian summer monsoon rainfall prediction in multiple seasonal prediction systems", "summary": "", "link": "https://doi.org/10.1007/s00382-018-4449-z", "authors": "Shipra Jain, Adam A. Scaife, Ashis K. Mitra", "source": "Climate Dynamics", "published": "2018-9-19", "first_seen": "2026-11-23T21:25:47+00:00", "score": 55, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["india", "monsoon"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-16-907-2023", "title": "The pseudo-global-warming (PGW) approach: methodology, software package PGW4ERA5 v1.1, validation, and sensitivity analyses", "summary": "The term “pseudo-global warming” (PGW) refers to a simulation strategy in regional climate modeling. The strategy consists of directly imposing large-scale changes in the climate system on a control regional climate simulation (usually representing current conditions) by modifying the boundary conditions. This differs from the traditional dynamic downscaling technique where output from a global climate model (GCM) is used to drive regional climate models (RCMs). The PGW climate changes are usually derived from a transient global climate model (GCM) simulation. The PGW approach offers several benefits, such as lowering computational requirements, flexibility in the simulation design, and avoiding biases from global climate models. However, implementing a PGW simulation is non-trivial, and care must be taken not to deteriorate the physics of the regional climate model when modifying the boundary conditions. To simplify the preparation of PGW simulations, we present a detailed description of the methodology and provide the companion software PGW4ERA5 facilitating the preparation of PGW simulations. In describing the methodology, particular attention is devoted to the adjustment of the pressure and geopotential fields. Such an adjustment is required when ensuring consistency between thermodynamical (temperature and humidity) changes on the one hand and dynamical changes on the other hand. It is demonstrated that this adjustment is important in the extratropics and highly essential in tropical and subtropical regions. We show that climate projections of PGW simulations prepared ", "link": "https://doi.org/10.5194/gmd-16-907-2023", "authors": "Roman Brogli, Christoph Heim, Jonas Mensch, Silje Lund Sørland, Christoph Schär", "source": "Geoscientific Model Development", "published": "2023-2-6", "first_seen": "2026-11-23T21:44:54+00:00", "score": 55, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021ef002271", "title": "Attributing and Projecting Heatwaves Is Hard: We Can Do Better", "summary": "Abstract It sounds straightforward. As the Earth warms due to the increased concentration of greenhouse gases in the atmosphere, global temperatures rise and so heatwaves become warmer as well. This means that a fixed temperature threshold is passed more often: the probability of extreme heat increases. However, land use changes, vegetation change, irrigation, air pollution, and other changes also drive local and regional trends in heatwaves. Sometimes they enhance heatwave intensity, but they can also counteract the effects of climate change, and in some regions, the mechanisms that impact on trends in heatwaves have not yet been fully identified. Climate models simulate heatwaves and the increased intensity and probability of extreme heat reasonably well on large scales. However, changes in annual daily maximum temperatures do not follow global warming over some regions, including the Eastern United States and parts of Asia, reflecting the influence of local drivers as well as natural variability. Also, temperature variability is unrealistic in many models, and can fail standard quality checks. Therefore, reliable attribution and projection of change in heatwaves remain a major scientific challenge in many regions, particularly where the moisture budget is not well simulated, and where land surface changes, changes in short‐lived forcers, and soil moisture interactions are important.", "link": "https://doi.org/10.1029/2021ef002271", "authors": "Geert Jan Van Oldenborgh, Michael F. Wehner, Robert Vautard, Friederike E. L. Otto, Sonia I. Seneviratne, Peter A. Stott", "source": "Earth's Future", "published": "2022-6", "first_seen": "2026-11-23T21:25:47+00:00", "score": 54, "topics": ["Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-7-1009-2026", "title": "Physical processes leading to extreme day-to-day temperature change – Part 2: Future climate change", "summary": "Extreme temperature swings from one day to the next, whether warming or cooling, can significantly impact human health, ecosystems, and the economy. These effects may become more pronounced or attenuated in the future. Part 1 of this research identified the physical processes – advection, as well as adiabatic and diabatic temperature changes – that cause extreme day-to-day temperature (DTDT) fluctuations in the present climate. Extreme DTDT variations are projected to change under future warming; however, how and which processes drive these changes remain poorly understood. This study addresses this question globally by analysing physical processes in Community Earth System Model Large Ensemble (CESM–LE) simulations under a high–emission scenario, employing both Eulerian composite and Lagrangian backwards–trajectory analyses. The projected changes in (extreme) DTDT variations display a seasonal contrast: weakening in mid- to high latitudes and intensification in the tropics during December–February (DJF), while during June–August (JJA), tropical intensification is more widespread, and only some extratropical locations experience reductions in DTDT variations. The spatial pattern of projected changes in the DTDT variations is mostly associated with changes in the standard deviation of daily temperature, whereas changes in temporal autocorrelation give rise to regional variations in magnitude. In the extratropics during DJF, the weakening of DTDT extremes is mainly driven by reduced advection contributions due to Arctic amplification. However, during JJA, reductions in extrem", "link": "https://doi.org/10.5194/wcd-7-1009-2026", "authors": "Kalpana Hamal, Stephan Pfahl", "source": "Weather and Climate Dynamics", "published": "2026-6-17", "first_seen": "2026-11-23T21:25:47+00:00", "score": 54, "topics": ["Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-023-06778-8", "title": "Evaluation of bias correction techniques for generating high-resolution daily temperature projections from CMIP6 models", "summary": "", "link": "https://doi.org/10.1007/s00382-023-06778-8", "authors": "Xinyi Li, Zhong Li", "source": "Climate Dynamics", "published": "2023-4-13", "first_seen": "2026-11-23T21:25:47+00:00", "score": 54, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-015-2735-6", "title": "How predictable is the anomaly pattern of the Indian summer rainfall?", "summary": "", "link": "https://doi.org/10.1007/s00382-015-2735-6", "authors": "Juan Li, Bin Wang", "source": "Climate Dynamics", "published": "2015-7-17", "first_seen": "2026-11-23T21:44:54+00:00", "score": 54, "topics": ["Close to your work"], "watch": [], "boosts": ["india"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-5-345-2024", "title": "Increasing frequency and lengthening season of western disturbances are linked to increasing strength and delayed northward migration of the subtropical jet", "summary": "Western disturbances (WDs) are cyclonic storms that travel along the subtropical jet, bringing the majority of seasonal and extreme precipitation to the Hindu Kush, Karakoram, and western Himalaya in the winter months. They are a vital component of the region's water security. Although typically most common in the winter, WDs can also interact with the summer monsoon, leading to catastrophic consequences. These seem to be happening more frequently, and along with increasingly harsh winter seasons, questions are now being asked about how climate change is affecting WD frequency and intensity in both summer and winter seasons. An analysis of 17 previous studies assessing trends in WD frequency revealed no consensus, at least in part because they quantified trends in different regions, seasons, and time periods. In this study, a more robust approach is used, quantifying trends in WD frequency and intensity by region and month using a track catalogue derived from 70 years of European Centre for Medium-Range Weather Forecasts (ECMWF) reanalysis (ERA5) data. Winter WDs have increased significantly over the western and central Himalaya and the Hindu Kush in the last 70 years. This trend is attributed to a strengthening of the subtropical jet. The WD season has also significantly lengthened with WDs becoming far more common in May, June, and July, months where they were previously rare. For example, WDs have been twice as common in June in the last 20 years than during the previous 50. This is attributed to a delayed northward retreat of the subtropical jet, which historically has ", "link": "https://doi.org/10.5194/wcd-5-345-2024", "authors": "Kieran M. R. Hunt", "source": "Weather and Climate Dynamics", "published": "2024-3-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 53, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["india", "himalaya", "monsoon", "precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.49711749802", "title": "Atmospheric soundings from satellites—false expectation or the key to improved weather prediction?", "summary": "Abstract Temperature and water vapour soundings from satellites have been available for more than 20 years. Because of the global nature of these data, satellite soundings were expected to improve significantly global numerical weather prediction (NWP). Indeed, experiments with the satellite soundings provided during the Global Weather Experiment (GWE) in 1979 revealed the positive impact of these data on extended‐range forecasts, particularly in the southern hemisphere. Unfortunately, since the GWE, the value of satellite soundings has apparently diminished. I believe this to be due largely to improvements in the models which have surpassed the inherently poor vertical resolution of these data relative to that of the contemporary NWP models. The satellite data can even degrade the analysis/forecast operation through the aliasing of small‐scale features which may be properly represented by the vertical scale resolved by the model. This lecture addresses, from a historical perspective, the dilemma of the decreasing value of satellite soundings in the weather‐forecast application (i.e., the reasons for the unfulfilled expectations of these data). Attention is then turned to the improvements in the satellite technology and the application techniques needed to reverse this trend.", "link": "https://doi.org/10.1002/qj.49711749802", "authors": "William L. Smith", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "1991-1", "first_seen": "2026-11-23T14:47:49+00:00", "score": 52, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024ef005185", "title": "Dynamical Factors Heavily Modulate the Future Increase of Sub‐Daily Extreme Precipitation in the Alpine‐Mediterranean Region", "summary": "Abstract Quantifying the future probability of sub‐daily extreme precipitation in a changing climate is crucial for risk management, engineering, and insurance. Kilometer‐scale convection‐permitting climate models (CPMs) represent convective precipitation and complex terrain more realistically than other climate models, thereby enhancing the representation of sub‐daily extremes. This study employs a novel statistical approach to evaluate projected changes in extreme sub‐daily precipitation and provides a physical interpretation of their driving processes. It focuses on the complex‐topography area of northern Italy, where resides almost half of the Italian population and a significant portion of the Italian economy, with a rich diversity in industry, agriculture, tourism. We use precipitation data from a CPMs ensemble covering three periods: historical (1996–2005), near future (2041–2050), far future (2090–2099) under the RCP8.5 scenario. Sub‐daily to daily precipitation extremes with return periods up to 100 years are examined. We find a general intensification of extremes across all durations (from 1 to 24 hr), stronger at shorter durations and rarer probabilities. Spatial patterns vary with duration, with higher and significant increases emerging in mountainous areas in Eastern Alps and North Apennines. The detected changes cannot be explained by thermodynamics alone, highlighting the modulating role of the changes in atmospheric dynamics. These findings are crucial for enhancing risk management strategies and adapting to natural hazards in a warming climate. This approac", "link": "https://doi.org/10.1029/2024ef005185", "authors": "Eleonora Dallan, Francesco Marra, Giorgia Fosser, Marco Marani, Marco Borga", "source": "Earth's Future", "published": "2024-11-28", "first_seen": "2026-11-23T21:25:47+00:00", "score": 52, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-023-00330-5", "title": "Inter-seasonal connection of typical European heatwave patterns to soil moisture", "summary": "Abstract Although prolonged heat periods have become a recurring feature of European climate, little knowledge is available on dominant spatial patterns of heatwaves and their influence on moisture-related processes. Increased knowledge will help to improve heatwave and drought prediction and mitigation. This study uses hierarchical agglomerative clustering to derive nine dominating spatial heatwave patterns from a 50-member regional climate model (Canadian Regional Climate Model version 5, CRCM5-LE). The heatwave patterns correspond well with clusters derived from an observational data set (E-OBS) and with extreme historical heatwave events. Moreover, we analyse the occurrence of heatwaves in the identified spatial patterns regarding a soil moisture deficit present before and after the event. We show that negative soil moisture anomalies in the preceding winter/spring (JFMA) can serve as a predictor for heatwaves in South Europe. For North Europe, we find a negative correlation between the number of heatwave days in summer and autumn (OND) soil moisture content.", "link": "https://doi.org/10.1038/s41612-023-00330-5", "authors": "Elizaveta Felsche, Andrea Böhnisch, Ralf Ludwig", "source": "npj Climate and Atmospheric Science", "published": "2023-1-21", "first_seen": "2026-11-23T21:25:47+00:00", "score": 52, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021ea001738", "title": "Validation of GPM IMERG Extreme Precipitation in the Maritime Continent by Station and Radar Data", "summary": "Abstract The Maritime Continent (MC) is a region subject to high impact weather (HIW) events, which are still poorly predicted by numerical weather prediction (NWP) models. To improve predictability of such events, NWP needs to be evaluated against accurate measures of extreme precipitation across the whole MC. With its global spatial coverage at high spatio‐temporal resolution, the Global Precipitation Measurement (GPM) data set is a suitable candidate. Here we evaluate extreme precipitation in the Integrated Multi‐Satellite Retrieval for GPM (IMERG) V06B product against station data from the Global Historical Climatology Network in Malaysia and the Philippines. We find that the high intragrid spatial variability of precipitation extremes results in large spatial sampling errors when each IMERG grid box is compared with individual co‐located precipitation measurements, a result that may explain discrepancies found in earlier studies in the MC. Overall, IMERG daily precipitation is similar to station precipitation between the 85th and 95th percentile, but tends to overestimate above the 95th. IMERG data were also compared with radar data in western Peninsular Malaysia for sub‐daily timescales. Allowing for uncertainties in radar data, the analysis suggests that the 95th percentile is still suitable for NWP evaluation of extreme sub‐daily precipitation, but that the rainfall rates diverge at higher percentiles. Hence, our overall recommendation is that the 95th percentile be used to evaluate NWP forecasts of HIW on daily and sub‐daily time scales against IMERG data, but that", "link": "https://doi.org/10.1029/2021ea001738", "authors": "Nicolas A. Da Silva, Benjamin G. M. Webber, Adrian J. Matthews, Matthew M. Feist, Thorwald H. M. Stein, Christopher E. Holloway", "source": "Earth and Space Science", "published": "2021-7", "first_seen": "2026-11-23T21:25:47+00:00", "score": 51, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-017-3841-4", "title": "Evaluation of NMME temperature and precipitation bias and forecast skill for South Asia", "summary": "", "link": "https://doi.org/10.1007/s00382-017-3841-4", "authors": "Benjamin A. Cash, Julia V. Manganello, James L. Kinter", "source": "Climate Dynamics", "published": "2017-8-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 51, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.03326", "title": "Six-hourly Probabilistic Precipitation Forecasts Created From Hourly Probabilities", "summary": "A lightweight neural network is described that produces six-hourly, spatially detailed probabilistic quantitative precipitation forecasts (PQPF) from a sequence of hourly spatially detailed probabilistic forecasts, for lead times from 6 to 72\\,h. The hourly forecasts were generated by a ``zero-inflated'' Attention Residual U-Net that outputs the parameters of a probability distribution including a probability of no precipitation and a weighted mixture of two Gamma distributions at each grid point for each hourly forecast lead time. The six-hourly network passes the six consecutive hourly parameter sets, together with summary statistics of the spatial texture of the raw deterministic forecast, through a small recurrent (GRU) layer and a multi-layer perceptron, and maps them to a corresponding zero-inflated mixture of three Gamma distributions describing the six-hourly accumulated precipitation. Training uses sets of hourly probabilistic forecasts, drawn preferentially from wet and heavy-precipitation cases (importance sampling), and matched Multi-Radar Multi-Sensor (MRMS) six-hourly precipitation accumulations, subject to a quality threshold. The resulting six-hourly probabilistic forecasts are well calibrated and skillful, as demonstrated by reliability diagrams, performance diagrams and Brier Skill Scores evaluated over an out-of-sample period spanning day 12 through the end of every month of 2025. The Brier Skill Scores are consistently and significantly higher than those of a baseline that sums independent draws from the hourly distributions. Forecasts show realistic mod", "link": "https://arxiv.org/abs/2611.03326", "authors": "Thomas M Hamill", "source": "arXiv", "published": "2026-11-02T15:49:25Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 50, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2021ef002409", "title": "Detectable Human Influence on Changes in Precipitation Extremes Across China", "summary": "Abstract This study explored the human influence on the observed changes in precipitation extremes across China for the period of 1961–2014 by the latest simulations from the Coupled Model Intercomparison Project Phase 6 (CMIP6). Changes in observations and CMIP6 simulations under different external forcings for annual total wet‐day precipitation (PRCPTOT), the number of heavy precipitation days (R10 mm), very wet days (R95p), extremely wet days (R99p), the maximum 1‐day precipitation amount (RX1day), and the maximum 5‐day precipitation amount (RX5day) are compared using a regularized optimal fingerprinting method. The results show that both anthropogenic (ANT) and greenhouse gas (GHG) experiments generally exhibit increasing trends in precipitation extremes over China, agreeing with the overall observed increases. The ANT influence is robustly detected for R95p, R99p, RX1day, and RX5day over China, with clear separation from the natural forcing. Additionally, the GHG signal is also detectable for R95p, R99p, and RX1day but separated from the natural and other ANT forcings for only R99p and RX1day and from the natural and ANT aerosol forcings for only RX5day. Thus, the intensified precipitation extremes can be attributed to human influence dominated by the GHG effect. However, detections fail for PRCPTOT and R10 mm. The ANT aerosol forcing may partly offset the role of the GHG responses to observed increases despite being undetectable. Based on the detection and attribution results, the observation‐constrained projections indicate that precipitation extremes are projected t", "link": "https://doi.org/10.1029/2021ef002409", "authors": "Huiwen Xu, Huopo Chen, Huijun Wang", "source": "Earth's Future", "published": "2022-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 50, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ef004333", "title": "Increasing Risk of a “Hot Eastern‐Pluvial Western” Asia", "summary": "Abstract Observations have revealed that the deadly “hot eastern‐pluvial western” climate pattern in Asia in summer 2022 is by no means an exception. In recent decade this pattern is becoming much more frequent owing to the notable westward extension and enhancement of the western Pacific subtropical high (WPSH). The anomalously enhanced WPSH fills the gap in geopotential heights between the Arabian Sea‐Iranian Plateau and the western Pacific, produces a heat dome over eastern Asia and intensifies the moisture convergence over western Asia by changing the water vapor transportation path. Projections of 19 CMIP6 models show that both the temperature in eastern Asia and precipitation in western Asia will remarkably increase under Shared Socioeconomic Pathway (SSP) 2‐4.5, SSP 3‐7.0, and SSP 5‐8.5 scenarios, with temperature anomalies 0.8°C, 1.5°C, and 2.4°C higher and the percentages of precipitation anomaly 6.3%, 9.4%, and 12.5% larger than the reference period in the near, middle, and long terms under the moderate emission scenario (SSP2‐4.5). Therefore, the “hot eastern‐pluvial western” Asia is becoming a new normal and exacerbating the risk of compound disasters.", "link": "https://doi.org/10.1029/2023ef004333", "authors": "Ting Ding, Hui Gao, Xiang Li", "source": "Earth's Future", "published": "2024-4-29", "first_seen": "2026-11-23T21:25:47+00:00", "score": 50, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024ea003956", "title": "Moisture Sources and Atmospheric Circulation Patterns for Extreme Rainfall Event Over North China Plain From 29 July to 2 August 2023", "summary": "Abstract Two years following the extreme rainfall event in Henan Province in July 2021, North China was struck by another significant rainfall episode in late July and early August 2023 (the “23.7” event). This recent event, surpassed only by the August 1963 deluge in Henan province, precipitated extensive disasters across the Beijing‐Tianjin‐Hebei region (BTH) over the North China Plain. Understanding the mechanisms underlying such extreme precipitation events, including moisture sources and atmospheric circulation patterns, in the context of synoptic‐scale systems is crucial for accurate predictions and effective disaster mitigation in the future. To achieve this, this study utilized a vertically integrated water vapor transport method and a Water Accounting model to investigate the moisture sources and pathways of the “23.7” event. A systematic analysis of circulation patterns was also conducted based on the ERA5 reanalysis. The results showed that the western North Pacific and Indian Ocean contributed 38.1% and 18.6%, respectively, to the extreme rainfall over the BTH region. Additionally, terrestrial moisture sources contributed 16.59%, playing a significant role in the event. The stable and moisture‐laden air was transported to the BTH due to the influence of binary tropical cyclones “Doksuri” and “Khanun,” as well as the western Pacific subtropical high‐pressure system. Convergence and updraft dynamics trigger convective processes modulated by vortices and topography. The findings of this study help to build a deeper understanding of the formation processes and mecha", "link": "https://doi.org/10.1029/2024ea003956", "authors": "Hui Guo, Wanting Hu, Chen Yang, Fang Wan", "source": "Earth and Space Science", "published": "2024-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 50, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ea003279", "title": "Observed Global Changes in Sector‐Relevant Climate Extremes Indices—An Extension to HadEX3", "summary": "Abstract Global gridded data sets of observed extremes indices underpin assessments of changes in climate extremes. However, similar efforts to enable the assessment of indices relevant to different sectors of society have been missing. Here we present a data set of sector‐specific indices, based on daily station data, that extends the HadEX3 data set of climate extremes indices. These additional indices, which can be used singly or in combinations, have been recommended by the World Meteorological Organization and are intended to empower decision makers in different sectors with accurate historical information about how sector‐relevant measures of the climate are changing, especially in regions where in situ daily temperature and rainfall data are hard to come by. The annual and/or monthly indices have been interpolated on to a 1.875° × 1.25° longitude‐latitude grid for 1901–2018. We show changes in globally‐averaged time series of these indices in comparison with reanalysis products. Changes in temperature‐based indices are consistent with global scale warming, with days with T max > 30°C (TXge30) increasing virtually everywhere with potential impacts on crop fertility. At the other end of the scale, the number of days with T min < −2°C (TNltm2) are reducing, decreasing potential damage from frosts. Changes in heat wave characteristics show increases in the number, duration and intensity of these extreme events in most places. The gridded netCDF files and, where possible, the underlying station indices are available from https://www.metoffice.gov.uk/hadobs/hadex3 and http", "link": "https://doi.org/10.1029/2023ea003279", "authors": "Robert J. H. Dunn, Nicholas Herold, Lisa V. Alexander, Markus G. Donat, Rob Allan, Margot Bador", "source": "Earth and Space Science", "published": "2024-4", "first_seen": "2026-11-23T21:25:47+00:00", "score": 50, "topics": ["Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-021-00178-7", "title": "Business-as-usual will lead to super and ultra-extreme heatwaves in the Middle East and North Africa", "summary": "Abstract Global climate projections suggest a significant intensification of summer heat extremes in the Middle East and North Africa (MENA). To assess regional impacts, and underpin mitigation and adaptation measures, robust information is required from climate downscaling studies, which has been lacking for the region. Here, we project future hot spells by using the Heat Wave Magnitude Index and a comprehensive ensemble of regional climate projections for MENA. Our results, for a business-as-usual pathway, indicate that in the second half of this century unprecedented super- and ultra-extreme heatwave conditions will emerge. These events involve excessively high temperatures (up to 56 °C and higher) and will be of extended duration (several weeks), being potentially life-threatening for humans. By the end of the century, about half of the MENA population (approximately 600 million) could be exposed to annually recurring super- and ultra-extreme heatwaves. It is expected that the vast majority of the exposed population (>90%) will live in urban centers, who would need to cope with these societally disruptive weather conditions.", "link": "https://doi.org/10.1038/s41612-021-00178-7", "authors": "George Zittis, Panos Hadjinicolaou, Mansour Almazroui, Edoardo Bucchignani, Fatima Driouech, Khalid El Rhaz", "source": "npj Climate and Atmospheric Science", "published": "2021-3-23", "first_seen": "2026-11-23T21:25:47+00:00", "score": 50, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-025-00896-2", "title": "Increasing temporal stability of global tropical cyclone precipitation", "summary": "Abstract Tropical cyclone (TC) precipitation has led to escalating urban flooding and transportation disruptions in recent years. The volatility of the TC rain rate (RR) over short periods complicates accurate forecasting. Here, we use satellite-based observational rainfall datasets from 1998 to 2019 to calculate changes in TC 24-h RR and quantify the temporal stability of TC precipitation. We demonstrate a significant global increase in the annual temporal stability of TC RR across the total rainfall area, inner-core, and rainband areas. Specifically, the probabilities of rapid RR increase and decrease events in the TC total rainfall area decreased at rates of –1.74 ± 0.57% per decade and –2.23 ± 0.55% per decade, respectively. Based on the reanalysis dataset, we propose that the synergistic effects of increased atmospheric stability and total column water vapor—both resulting from anthropogenic warming at low latitudes—are potentially associated with this trend.", "link": "https://doi.org/10.1038/s41612-025-00896-2", "authors": "E Deng, Qian Xiang, Johnny C. L. Chan, Yue Dong, Shifei Tu, Pak-Wai Chan", "source": "npj Climate and Atmospheric Science", "published": "2025-1-10", "first_seen": "2026-11-23T21:25:47+00:00", "score": 50, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr3145.1", "title": "Object-Based Verification of Precipitation Forecasts. Part I: Methodology and Application to Mesoscale Rain Areas", "summary": "Abstract A recently developed method of defining rain areas for the purpose of verifying precipitation produced by numerical weather prediction models is described. Precipitation objects are defined in both forecasts and observations based on a convolution (smoothing) and thresholding procedure. In an application of the new verification approach, the forecasts produced by the Weather Research and Forecasting (WRF) model are evaluated on a 22-km grid covering the continental United States during July–August 2001. Observed rainfall is derived from the stage-IV product from NCEP on a 4-km grid (averaged to a 22-km grid). It is found that the WRF produces too many large rain areas, and the spatial and temporal distribution of the rain areas reveals regional underestimates of the diurnal cycle in rain-area occurrence frequency. Objects in the two datasets are then matched according to the separation distance of their centroids. Overall, WRF rain errors exhibit no large biases in location, but do suffer from a positive size bias that maximizes during the later afternoon. This coincides with an excessive narrowing of the rainfall intensity range, consistent with the dominance of parameterized convection. Finally, matching ability has a strong dependence on object size and is interpreted as the influence of relatively predictable synoptic-scale systems on the larger areas.", "link": "https://doi.org/10.1175/mwr3145.1", "authors": "Christopher Davis, Barbara Brown, Randy Bullock", "source": "Monthly Weather Review", "published": "2006-7-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 50, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ef004370", "title": "Contributions of Tropical Cyclones and Atmospheric Rivers to Extreme Precipitation Trends Over the Northeast US", "summary": "Abstract The Northeast United States (NEUS) has faced the most rapidly increasing occurrences of extreme precipitation wit
