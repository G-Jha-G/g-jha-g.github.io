ents, while BiLSTM and TFT captured short- and long-term temporal dependencies. XGBoost was used to combine model outputs and enhance predictive performance. Experimental results demonstrate that HDF-LRF achieved an NSE of 0.918, RMSE of 18.4 mm/month, KGE of 0.903, and R² of 0.941, outperforming conventional hydrological, statistical, and deep learning baselines. Cross-regional transfer experiments showed a generalization ratio of 0.960, indicating strong robustness across hydroclimatic regions. The proposed framework provides an accurate, interpretable, and scalable solution for long-term runoff forecasting under current and future climate conditions.", "link": "https://doi.org/10.15666/aeer/2404_87838810", "authors": "Yao-Xue Zhu, G. Wei", "source": "Applied Ecology and Environmental Research", "published": "2026", "first_seen": "2026-11-25T14:31:03+00:00", "score": 63, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1007/s00704-026-06659-0", "title": "Comprehensive evaluation of multi-method bias correction for cmip6 climate models and future scenario simulation of extreme climate events: a case study of Jiangsu Province, China", "summary": "", "link": "https://doi.org/10.1007/s00704-026-06659-0", "authors": "Ping-Cheng Ruan, Yan Chen, Zhao-Zhong Feng", "source": "Theoretical and Applied Climatology", "published": "2026-10-26", "first_seen": "2026-11-25T14:31:03+00:00", "score": 63, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["cmip6", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1029/2025wr041874", "title": "Big Data for Small Streams: Leveraging a Coarse National Model to Enhance Fine‐Resolution Stream Temperature Predictions", "summary": "Predictive stream temperature models are commonly used to address spatial and temporal gaps in observational data because stream temperature information is essential for environmental management decisions. National models capture broad patterns driven by climate, topography, and seasonality, but often lack the spatial resolution to simulate fine‐scale variation in groundwater discharge, riparian shading, or tributary inflows. In contrast, watershed models may simulate finer‐resolution patterns but miss regional drivers or be limited by scarcity of observations. To generate watershed‐extent, fine‐resolution stream temperature predictions, we developed 18 multiscale machine‐learning models that leverage (a) a broad‐extent, coarse‐resolution stream temperature model and (b) finer‐resolution observations and predictor data. The coarse‐resolution model simulates daily stream temperature across the conterminous United States on the National Hydrologic Geospatial Fabric (13.7 km median reach length; 865,364 km total). The fine‐resolution models simulate daily stream temperature on the National Hydrography Dataset Plus version 2 (1.5 km median; 5,192,808 km total). We compared multiscale models to seven purely broad‐ (national) or watershed‐extent models, testing them in eight watersheds (436–985 km2) with differing hydrologic settings and under realistic data availability scenarios. Especially when observations within a watershed were scarce, multiscale models generated more accurate predictions than national or watershed‐specific models. A recurrent graph convolution neural netwo", "link": "https://doi.org/10.1029/2025wr041874", "authors": "J. Barclay, L. Koenig, Y. Fan, X. Jia, A. Appling", "source": "Water Resources Research", "published": "2026-10-01", "first_seen": "2026-11-25T14:31:03+00:00", "score": 63, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "doi:10.26877/lpt.v5i3.1087", "title": "Identification of Atmospheric Dynamics of a Tropical Hail Event and Application of Radar Reflectivity Nowcasting Using a UNet-ConvLSTM2D Deep Learning Model", "summary": "Hail is a small-scale hydrometeorological phenomenon threatening disaster-prone regions of Indonesia, yet understanding of its atmospheric dynamics and deep learning-based radar nowcasting remain limited. This study characterizes the atmospheric conditions of the Depok City hailstorm on 28 October 2024 and evaluates a hybrid UNet-ConvLSTM2D model in predicting radar reflectivity. The study employed Column Maximum (CMAX) radar reflectivity data in PNG and VOL formats from the Soekarno-Hatta Class I Meteorological Station, cloud-top temperature and Cloud Convective Overlay data from Himawari-9 satellite imagery, and ERA5 reanalysis data on storm thermodynamic and kinematic conditions, while radar data from January 2023 to October 2024 were used for model training and validation. Model performance was assessed using Mean Squared Error (MSE), Mean Absolute Error (MAE), Structural Similarity Index (SSIM), Critical Success Index (CSI), and Heidke Skill Score (HSS) across five reflectivity thresholds. Results show maximum radar reflectivity exceeding 55 dBZ at 08.18 UTC and 08.42 UTC, cloud-top temperatures of approximately -61°C to -73°C, and Convective Available Potential Energy (CAPE) of 524-590 J/kg with weak vertical wind shear of 2.4-2.8 m/s from ERA5, confirming a moderately unstable tropical convective environment. Prediction results yielded average values of 184.5897 for MSE, 9.7081 for MAE, and 0.3956 for SSIM, with CSI decreasing from 0.588 to 0.284 and HSS from 0.637 to 0.057 as lead time increased from 8 to 56 minutes. These findings are expected to enhance understand", "link": "https://doi.org/10.26877/lpt.v5i3.1087", "authors": "Muhizzadin Abdul Adzan, D. Septiadi, A. Mulsandi, L. N. Qomariyatuzzamzami", "source": "Lontar Physics Today", "published": "2026-10-19", "first_seen": "2026-11-25T14:31:03+00:00", "score": 62, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.3390/app162211462", "title": "LightRCAN: A Lightweight Super-Resolution Method for ERA5 Temperature Fields with Cross-Pressure-Level Transferability", "summary": "Temperature data are fundamental to meteorological and climatological research. High-Resolution (HR) fields are essential for regional climate, model validation, and extreme weather assessment. This study proposes a Lightweight Residual Channel Attention Network (LightRCAN) for spatial super-resolution (SR) reconstruction of ERA5 temperature fields, which is the fifth-generation global atmospheric reanalysis produced by the European Centre for Medium-Range Weather Forecasts (ECMWF). We reduce the resolution 0.25° ERA5 to 0.5°, create HR and Low-Resolution (LR) data pairs via bicubic interpolation, and train the network to reconstruct HR spatial structures from LR inputs. Results show LightRCAN accurately recovers spatial details. Compared with bicubic and bilinear interpolation, LightRCAN achieves lower reconstruction errors. Compared with the Residual Channel Attention Network (RCAN), LightRCAN reduces the number of parameters by 85% and floating-point operations (FLOPs) by 83%, while incurring only a 0.16 dB drop in Peak Signal-to-Noise Ratio (PSNR), thereby achieving a favorable accuracy–efficiency trade-off. We also evaluate cross-pressure-level transferability by freezing the backbone and fine-tuning the upsampling module and the reconstruction convolutional layer (3.6% of parameters). This strategy achieves the best balance between reconstruction performance and parameter efficiency, outperforming direct transfer. LightRCAN offers a computationally efficient solution for reconstruction.", "link": "https://doi.org/10.3390/app162211462", "authors": "Ping Yu, Hoiio Kong, Chanseng Wong, Zi-Jun Li", "source": "Applied Sciences", "published": "2026-11-19", "first_seen": "2026-11-25T14:31:03+00:00", "score": 61, "topics": ["Downscaling", "Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "doi:10.1007/s12145-026-02302-8", "title": "Explainable machine learning–based spatial downscaling of multi-depth FLDAS soil moisture to 500 m resolution using artificial neural networks and spatial cross-validation", "summary": "", "link": "https://doi.org/10.1007/s12145-026-02302-8", "authors": "Fatemeh Haji Sharafi, Elahe Khesali", "source": "Earth Science Informatics", "published": "2026-11-12", "first_seen": "2026-11-25T14:31:03+00:00", "score": 61, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1007/s40808-026-02932-3", "title": "Urban growth-induced surface thermal dynamics: an integrated deep learning assessment for Colombo, Sri Lanka", "summary": "Urban growth is a major driver of land surface temperature (LST) change, yet most LST forecasting studies do not explicitly incorporate future urban expansion. To address this gap, we develop an integrated deep learning (DL) framework that couples urban growth simulation with LST prediction for Colombo, Sri Lanka, and benchmark our proposed ResNet+Transformer model against six comparison models (four DL architectures and two machine learning methods) across both tasks. For urban growth simulation, the ResNet+Transformer achieves the highest accuracy (0.908), F1 score (0.8691), Figure of Merit (0.7684), precision (0.9152), and recall (0.8274), while also yielding the lowest quantity and allocation disagreement. The simulated urban growth maps for 2035 and 2045 were then incorporated as dynamic drivers in LST prediction. In this second task, the ResNet+Transformer again outperformed all benchmark models, achieving the lowest RMSE (0.951\\documentclass[12pt]{minimal} \\usepackage{amsmath} \\usepackage{wasysym} \\usepackage{amsfonts} \\usepackage{amssymb} \\usepackage{amsbsy} \\usepackage{mathrsfs} \\usepackage{upgreek} \\setlength{\\oddsidemargin}{-69pt} \\begin{document}$$^\\circ $$\\end{document}C) and MAE (0.651\\documentclass[12pt]{minimal} \\usepackage{amsmath} \\usepackage{wasysym} \\usepackage{amsfonts} \\usepackage{amssymb} \\usepackage{amsbsy} \\usepackage{mathrsfs} \\usepackage{upgreek} \\setlength{\\oddsidemargin}{-69pt} \\begin{document}$$^\\circ $$\\end{document}C), and the highest \\documentclass[12pt]{minimal} \\usepackage{amsmath} \\usepackage{wasysym} \\usepackage{amsfonts} \\usepackage{ams", "link": "https://doi.org/10.1007/s40808-026-02932-3", "authors": "Farasath Hasan, Xin-Tao Liu", "source": "Modeling Earth Systems and Environment", "published": "2026-10-16", "first_seen": "2026-11-25T14:31:03+00:00", "score": 59, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1007/s00704-026-06710-0", "title": "A simulation-pretrained deep learning model for monthly global temperature-field prediction", "summary": "", "link": "https://doi.org/10.1007/s00704-026-06710-0", "authors": "Xu-Yuan Guan, Jing-Yun Zheng, Xue-Zhen Zhang", "source": "Theoretical and Applied Climatology", "published": "2026-11-09", "first_seen": "2026-11-25T14:31:03+00:00", "score": 59, "topics": ["Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1371/journal.pone.0362741", "title": "DTCN-RevIN: A Densely Temporal Causal Network with reversible instance normalization for enhanced weather forecasting via multi-scale feature integration", "summary": "Accurate weather forecasting is of paramount importance for disaster prevention, agriculture, and resource management, yet traditional Numerical Weather Prediction (NWP) systems such as the Weather Research and Forecasting (WRF) model face inherent limitations in temporal resolution and computational efficiency when capturing rapidly evolving atmospheric dynamics. Meanwhile, existing deep learning approaches—including Long Short-Term Memory (LSTM) networks, Temporal Convolutional Networks (TCN), and Transformers—struggle with long-range temporal dependencies, distribution shift, and scalability. To address these challenges, this study proposes the Densely Temporal Causal Network with Reversible Instance Normalization (DTCN), a deep learning architecture that combines: (1) causal dilated convolutions for efficient temporal modeling, (2) dense inter-layer connections for enhanced feature propagation, (3) multi-scale feature integration, and critically, (4) RevIN standardization to address distribution shift in meteorological time series. Through 250 independent station-level model training runs (5 architectures × 10 stations × 5 random seeds), we systematically evaluate DTCN against four deep learning baseline architectures (TCN, LSTM, Transformer, and LSTM-Attention) for the 32→6 short-range forecasting configuration. Results show that: (i) DTCN achieves competitive top-tier overall performance, with RMSE of 0.0052 ± 0.0004 and R2 of 0.37 ± 0.06; (ii) DTCN matches TCN in rounded overall RMSE and R2, while showing slightly lower variance than TCN; (iii) all evaluated architec", "link": "https://doi.org/10.1371/journal.pone.0362741", "authors": "Xi-Xiang Yin, Sheng Shu, Ming-Lei Yuan", "source": "PLoS ONE", "published": "2026-11-18", "first_seen": "2026-11-25T14:31:03+00:00", "score": 58, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1007/s00382-026-08419-2", "title": "Teleconnection-aware machine learning calibration of multi-model seasonal forecasts for drought prediction over India", "summary": "", "link": "https://doi.org/10.1007/s00382-026-08419-2", "authors": "Paushali Deb, Saurabh Verma, L. Karthikeyan", "source": "Climate Dynamics", "published": "2026-10-26", "first_seen": "2026-11-25T14:31:03+00:00", "score": 58, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["india"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1038/s41598-026-73361-6", "title": "A physics guided hybrid modeling framework for rainfall runoff forecasting in data scarce regions", "summary": "Rainfall-runoff (R-R) forecasting in data-scarce regions remains challenging due to limited hydrometeorological observations, uncertainties in satellite-based precipitation products (SPPs), and the inability of individual modeling approaches to fully represent complex watershed dynamics. To address these challenges, this study develops a physics guided hybrid modeling framework that integrates bias-corrected satellite precipitation products, signal decomposition techniques, process-based hydrological modeling, and deep learning (DL) for improved runoff simulation and forecasting. In the proposed framework, physical knowledge is incorporated through the soil and water assessment tool (SWAT), which provides physically meaningful representations of watershed processes, while a long short-term memory (LSTM) network learns residual nonlinear relationships between physically simulated and observed runoff responses. Three widely used SPPs, including CHIRPS, IMERG, and PERSIANN-CDR, were evaluated against available rainfall observations, and a PDF-based additive bias correction approach was applied to improve precipitation estimates. Wavelet transform (WT) and variational mode decomposition (VMD) were further investigated within a time consistent feature construction framework to extract hydrologically relevant temporal patterns from corrected precipitation inputs and SWAT-simulated runoff outputs. The framework was evaluated in two hydroclimatically contrasting watersheds in Iran, namely the semi-arid Tabriz Basin and the humid Ghaem Shahr Basin. Results indicated that CHIRPS prov", "link": "https://doi.org/10.1038/s41598-026-73361-6", "authors": "A. Molajou, Ali Davanlou Tajbakhsh, Mehrdad Shokatian-Beiragh, Hossein Akbari Variani, Saeed Hedayati Aram, A. Brysiewicz", "source": "Scientific Reports", "published": "2026-10-02", "first_seen": "2026-11-24T14:57:46+00:00", "score": 84, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1007/s00704-026-06633-w", "title": "Early warning of meteorological drought in Morocco’s Atlas mountains: a multi-paradigm benchmark of satellite-augmented deep learning and tree-based models", "summary": "Meteorological drought monitoring in Morocco’s High Atlas and Anti-Atlas Mountains remains reactive, yet few predictive studies have combined satellite observations with spatiotemporal deep learning in mountainous terrain. We develop a Convolutional Gated Recurrent Unit (ConvGRU) framework to forecast the 6-month Standardized Precipitation Index (SPI-6) across the High Atlas and Anti-Atlas at 1- to 3-month lead times. The model ingests 18 input channels combining CHIRPS precipitation, ERA5-Land reanalysis fields, satellite-derived NDVI, and static terrain features over a 115 × 210-pixel domain at 5.5 km resolution, with a strict leakage-free temporal split. At a 1-month lead, the ConvGRU and a non-spatial gradient-boosted ensemble (XGBoost) achieved nearly equal forecast accuracy (RMSE = 0.696 and 0.698, respectively), with the ConvGRU improving on damped persistence by 11.8% (Diebold-Mariano p = 0.003) and ridge regression by 9.7% (RMSE = 0.771). The added architectural complexity of spatiotemporal deep learning did not translate into superior forecast skill in this data regime, with the non-spatial gradient-boosted ensemble matching the convolutional models across horizons. In a test-period evaluation of the severe April 2024 drought (92% of the area affected), both the spatiotemporal and non-spatial models recovered most of the drought extent one month in advance (ConvGRU 81%, XGBoost 94%), far exceeding the 29% recovered by damped persistence. As the forecast horizon extends to two and three months, predictive skill across all architectures decays rapidly toward the bas", "link": "https://doi.org/10.1007/s00704-026-06633-w", "authors": "Nacer Aderdour, M. Maanan, H. Rueff, H. Rhinane", "source": "Theoretical and Applied Climatology", "published": "2026-10-10", "first_seen": "2026-11-24T14:57:46+00:00", "score": 81, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1109/jstars.2026.3738080", "title": "Geo-ARD: A Hybrid ARDB-Guided Residual Diffusion Model for Geospatial Wind Field Super-Resolution", "summary": "High-resolution (HR) ocean wind field data is undamental to meteorology and oceanography, yet satellite-derived products (e.g., OCN) are spatiotemporally sparse. Conversely, reanalysis data (e.g., ERA5) offers global, hourly coverage but at a coarse low-resolution (LR), suffering from systematic bias and an inability to resolve fine-scale structures. To bridge this data gap, we propose geospatial attention-based residual dense block (ARDB)-guided residual diffusion (Geo-ARD), a novel 5× super-resolution framework that generates high-fidelity 0.05$^\\circ$ wind fields from 0.25$^\\circ$ inputs. Our framework introduces a two-stage approach to systematically address both domain bias and resolution enhancement. First, a pretrained alignment network, optimized with a hybrid regression and contrastive loss, maps the biased LR ERA5 data into an aligned feature space consistent with HR OCN observations. Second, the core of our model is a guided diffusion process conditioned on a novel ARDB. This hybrid CNN–Transformer conditioner embeds efficient self-attention mechanisms directly within its dense blocks, enabling it to capture both the local textures and the critical long-range spatial dependencies inherent in global wind fields. The denoising diffusion model is then tasked with a simplified objective: generating only the high-frequency residual within an analytically defined latent space, allowing it to focus entirely on fine-detail synthesis. To optimize for high-impact events, the framework is trained with a compound loss, featuring a novel quadratically weighted L1 diffusion lo", "link": "https://doi.org/10.1109/jstars.2026.3738080", "authors": "Yun Zhang, Hao-Tian Cai, Jia-Ning Liang, Wen-Bo Zhang, Shu-Hu Yang, Yan-Ling Han, Bo Peng, Xiao-Wei Wan", "source": "IEEE Journal of Selected Topics in Applied Earth Observations and Remote Sensing", "published": "2026", "first_seen": "2026-11-24T14:57:46+00:00", "score": 80, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["india", "diffusion model"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "doi:10.5194/isprs-archives-l-4-w2-2026-139-2026", "title": "AI-Based Framework for Urban Climate Downscaling: A Case Study of Sofia", "summary": "With the increasing availability of powerful computational resources and artificial intelligence (AI), a data-driven approach has been gaining attention in atmospheric science, particularly in downscaling/emulating research. For example, Convolutional Neural Networks (CNNs) are used to emulate fine-resolution climate data fields by physics-based models. Although CNN-based downscaling has shown good performance for air temperature across various climate scales, studies at the urban scale remain limited due to the scarcity of long-term high-resolution climate data that can represent local urban effects. This study explores whether CNNs can accurately downscale/emulate urban-scale temperature distributions, with a focus on the urban heat island (UHI), using 250 m resolution Weather Research and Forecasting (WRF) simulation data over Sofia, Bulgaria, as training data. Input features, including air temperature, wind components, surface solar radiation, and elevation, are used, and their impacts on targeted 250 m resolution air temperature are evaluated. The results show that, while the CNN-based approach shows promise in generating urban-scale temperature distributions, the selection/combination of input features influences downscaling performance. Warm bias exceeding +2.00 °C was almost eliminated by including all input features. The downscaled result emulated the broad spatial pattern. However, detailed spatial and temporal variability, such as UHI, was still not captured. These findings revealed that the input feature selection can influence CNN-based temperature downscaling,", "link": "https://doi.org/10.5194/isprs-archives-l-4-w2-2026-139-2026", "authors": "Koki Nakamura, L. Vitanova, Q. Doan, D. Petrova-Antonova", "source": "The International Archives of the Photogrammetry, Remote Sensing and Spatial Information Sciences", "published": "2026-09-28", "first_seen": "2026-11-24T14:57:46+00:00", "score": 79, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.3390/rs18213665", "title": "A Comparative Study of Deep Learning Architectures for Multi-Source Precipitation Data Fusion Towards Daily Precipitation Estimation in the Yellow River Basin, China", "summary": "Accurate precipitation estimation is crucial for water management and flood reconstructions, yet remains challenging due to sparse ground observations and systematic satellite biases. Despite the rise of deep learning in multi-source fusion, controlled comparisons under a unified framework remain scarce, and the roles of window size and precipitation product combinations remain underexplored. This study evaluated five deep learning architectures, namely 1D CNN, 2D CNN, 1D–2D CNN, 3D CNN, and Transformer, for fusing three precipitation products (IMERG, MSWEP, and ERA5-Land) to estimate station-scale daily precipitation in the Yellow River Basin, China. Results showed that deep learning models consistently outperformed individual products, weighting methods, and machine learning methods, with Transformer achieving the best overall performance, followed by 3D CNN; MSWEP led the standalone products. Spatial improvements were more pronounced in densely gauged areas, but Transformer also performed well in the sparse western regions. All products and fusion models tended to overestimate no-rain and light-rain events and underestimate moderate-to-heavy, and extreme events, with Transformer yielding the largest reductions in conditional RMSE and BIAS for heavy and extreme events. Enlarging the spatial or temporal window individually improved performance, and combining both worked even better. Ablation experiments revealed that IMERG contributed little unique information, whereas incorporating more products generally improved Transformer performance. Overall, Transformer demonstrated", "link": "https://doi.org/10.3390/rs18213665", "authors": "Mei-Xia Xie, Z. Di, Sheng-Lei Zhang, Xu-Rui Wang", "source": "Remote Sensing", "published": "2026-10-26", "first_seen": "2026-11-24T14:57:46+00:00", "score": 79, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1029/2025wr042530", "title": "In the Age of AI—Are National Models and Data Sets Still Important for Stream Flow Prediction?", "summary": "Accurate streamflow prediction is critical for effective water resource management, and recent advances in deep learning and multi‐basin data sets have significantly improved model skill. Global deep‐learning models, trained on thousands of catchments have demonstrated strong generalization across diverse climates and continents. However, these models rely solely on globally available meteorological inputs, potentially overlooking the value of nationally developed data sets with enhanced regional accuracy. In this study, we assess the benefit of using Canada's high‐resolution national reanalysis data set (CaSR) in long short‐term memory (LSTM) models for streamflow prediction. We compare model performance using different meteorological forcings, global (ERA5‐Land), continental (Daymet), national (CaSR), and a combined “Complete” model, across over 1,000 Canadian stream gauges. Model performance is evaluated using the Nash–Sutcliffe Efficiency (NSE), Kling‐Gupta Efficiency (KGE) and related metrics. We also benchmark our best‐performing model against Google's global LSTM streamflow model at 412 Canadian gauges. Results show that national‐scale deep‐learning models using CaSR outperforms deep‐learning models using only global or continental inputs. The Complete model achieved the highest performance, with a median KGE 0.886−exceeding the 0.839 achieved by Google's global model within Canada. These findings suggest that nationally trained models using a wide array of inputs, including national meteorological data sets, can outperform state‐of‐the‐art global deep‐learning model", "link": "https://doi.org/10.1029/2025wr042530", "authors": "Brett Snider, E. Roshani", "source": "Water Resources Research", "published": "2026-10-01", "first_seen": "2026-11-24T14:57:46+00:00", "score": 79, "topics": ["Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1088/2515-7620/aeba46", "title": "Centenary evolution of rainfall datasets: a comprehensive review of gauge, radar satellite, and physics-guided machine learning-based products", "summary": "Accurate precipitation data are crucial for understanding hydroclimatic processes to support water resource management and disaster risk reduction. This study presents a systematic review of rainfall datasets from the early 20th century to the present, emphasizing the roles of artificial intelligence (AI) and machine learning (ML) in precipitation estimation. Unlike prior reviews that primarily catalog global precipitation datasets or examine individual ML applications, this synthesis jointly traces observing-system evolution and evaluates when ML adds demonstrable value relative to named conventional baselines. The evolution of datasets is categorized into four overlapping phases: (i) gauge-based observations, (ii) ground-based weather radar quantitative precipitation estimation (iii) satellite-era products, and (iv) modern multi-source and AI-enhanced datasets. Early gauge-based datasets, provide long-term climate records vital for historical analysis, though they are limited by sparse spatial coverage and interpolation uncertainties. Ground-based radar networks added repeated kilometer-scale mapping of storm structure, although reflectivity-to-rainfall conversion and gauge adjustment introduce their own errors. The satellite era, marked by missions such as Tropical Rainfall Measuring Mission and global precipitation measurement, has significantly improved precipitation monitoring by providing near-global coverage with higher spatial and temporal resolution. However, these datasets still face challenges related to systematic biases and the representation of extreme events", "link": "https://doi.org/10.1088/2515-7620/aeba46", "authors": "D. P., S. Devaraj, A. K, Sowmya H. N., Kavana S, Shruthi R, A. G, Anu S. Patil", "source": "Environmental Research Communications", "published": "2026-11-01", "first_seen": "2026-11-24T14:57:46+00:00", "score": 75, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": ["precipitation", "extreme", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "arxiv:2611.21146", "title": "Model-based neural network for global floodplains analysis", "summary": "We address the super-resolution of multispectral remote sensing imagery for long-term floodplain monitoring, enhancing Landsat acquisitions towards Sentinel-2 resolution. Exploiting the period during which both missions observed the same areas, we build DLhasa-L2S , to our knowledge the first paired dataset dedicated to multispectral super-resolution for river analysis. It covers the Lhasa River (Tibet), whose strong anthropogenic changes and diverse hydromorphological profiles make it an ideal study area. We developed two model-based neural networks: a forward-backward (FB) plug-and-play scheme and an unfolded FB scheme. We compared them against learned neural networks baselines (SwinIR, RDN) on synthetic data, on real scenes, and through a statistical test over the whole real paired Landsat-Sentinel dataset. The unfolded network achieves the highest PSNR and SSIM on the real RGB components with fast inference, offering the best trade-off between accuracy and computational cost. For NDWI-based water segmentation, its performance shows no statistically significant difference from that of the best methods.", "link": "https://arxiv.org/abs/2611.21146", "authors": "Pierre Audisio, B. Belletti, N. Pustelnik", "source": "Semantic Scholar", "published": "2026-11-16", "first_seen": "2026-11-24T14:57:46+00:00", "score": 73, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.3390/geomatics6050115", "title": "A Hybrid ConvNeXt, Dual-Transformer, and U-Net Architecture for Direct Satellite-Based Precipitation Estimation from MSG/SEVIRI", "summary": "Accurate quantification of precipitation is critical for anticipating extreme cli mate events such as droughts and flash floods, yet ground rain gauges and weather radars in Northern Algeria suffer from limited spatial coverage and high maintenance costs. Satellite remote sensing via Meteosat Second Generation (MSG/SEVIRI) multispectral imagery offers optimal spatio-temporal coverage, but converting indirect cloud-top properties into direct rainfall rates remains challenging. To overcome the limitations of standard machine learning and conventional convolutional neural networks in modeling long-range atmospheric dependencies, this study proposes a novel end-to-end hybrid deep learning architecture, combining ConvNeXt, Dual-Transformer, and U-Net models, for direct pixel-wise precipitation regression without intermediate classification. The model leverages a ConvNeXt backbone with large-kernel depthwise convolutions for local spatial feature extraction, a Dual-Transformer module utilizing parallel spatial and spectral attention to capture non-local cloud structures, and a U-Net decoder with multi-scale skip connections for high-resolution rainfall reconstruction. Trained and validated against reference target fields constructed from weather radar and rain gauge fusion covering 2006–2012, the proposed ConvNeXt + Dual-Transformer + U-Net framework demonstrates superior performance over traditional machine learning baselines (RF, MLP, SVM) and standard CNN architectures (U-Net, ConvNeXt + U-Net). The model effectively reduces heteroscedastic error dispersion, achieving Pearson ", "link": "https://doi.org/10.3390/geomatics6050115", "authors": "Mounir Sehad, Yacine Mohia, M. Lazri, Fethi Ouallouche, K. Labadi, R. Absi, S. Hamaci", "source": "Geomatics", "published": "2026-10-04", "first_seen": "2026-11-24T14:57:46+00:00", "score": 73, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1088/2515-7620/aeb47d", "title": "An optimized hybrid deep learning framework for short-range rainfall forecasting in Mumbai’s monsoon regime", "summary": "Short-range rainfall forecasting in tropical coastal megacities is a formidable challenge owing to the nonlinear dynamics, strong seasonality, and pronounced interannual variability that characterize monsoon precipitation regimes. This study develops and evaluates deep learning frameworks for multi-lead-time (D + 1 to D + 4) daily rainfall forecasting over Mumbai (72.88° E, 19.07° N), India, a densely populated coastal metropolis where accurate precipitation prediction is directly consequential for flood early warning. Six forecasting systems namely Random Forest, XGBoost, a one-dimensional convolutional neural network (CNN), a Transformer, and two metaheuristically tuned variants of a novel Conv1D–CBAM–BiLSTM–attention Enhanced Hybrid architecture (genetic algorithms (GA)-Hybrid and PSO-Enhanced) are benchmarked against persistence and climatology references. The PSO-Enhanced ensemble is the strongest system at every lead, attaining R2 = 0.636 (RMSE = 8.97 mm d−1) at D + 1 and 0.454, 0.373 and 0.399 at D + 2D + 4, ahead of the GA-Hybrid (0.626, 0.428, 0.352, 0.385), the strongest gradient-boosting benchmark XGBoost (R2 ⩽ 0.561), persistence (R2 = 0.572 at D + 1, declining to 0.049 by D + 4), and climatology (R2 = 0.327, lead-independent). Recurrent-memory architectures outperform the memoryless CNN and Transformer at every lead, indicating that sequential dependence, rather than attention alone, carries most of the exploitable predictive signal. For detection of rainfall exceeding the 95th percentile, the two optimized hybrids achieve the highest critical success index at ", "link": "https://doi.org/10.1088/2515-7620/aeb47d", "authors": "Manpreet Kaur Aiden, Sanjeev Thakur, A. Kasimahanthi, Manmeet Singh, D. Mehrotra", "source": "Environmental Research Communications", "published": "2026-10-14", "first_seen": "2026-11-24T14:57:46+00:00", "score": 73, "topics": ["Deep Learning"], "watch": [], "boosts": ["india", "monsoon", "precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1007/s44288-026-00775-0", "title": "An observational perspective on extreme precipitation indices over the mountainous regions of Northwest Himalaya", "summary": "The Northwest Himalaya region is highly susceptible to extreme rainfall events due to its steep topography and complex climatic variability, which can trigger significant hydro-meteorological hazards, including heavy snowfall, hailstorms, floods, and droughts. The erratic precipitation patterns, both in the short and long term, exacerbate these hazards. Furthermore, climate change is amplifying the frequency and intensity of extreme weather events, thereby increasing the vulnerability of the region and posing substantial challenges for infrastructure resilience, agricultural sustainability, and effective disaster management. This study utilizes the High Asia Refined Analysis version 2 dataset (HARv2), a high-resolution (10 km) WRF model output, spanning 1981–2020, to analyze precipitation trends across three sub-regions — Jammu & Kashmir (JK), Himachal Pradesh (HP), and Uttarakhand (UK) — validated against IMD and IMDAA datasets. All extreme precipitation indices as defined by the Expert Team on Climate Change Detection and Indices (ETCCDI) have been used for the study. ERA5 and HARv2 derived VIMT analysis is done for large-scale moisture influx understanding, and the role of ENSO in driving moisture transport is examined. JK exhibits the most pronounced drying signal, with statistically significant declines across multiple precipitation indices, while increasing CDD over both JK and HP indicates growing drought risk. UK shows no significant trends, reflecting the dominant role of orographic processes in its precipitation regime. A distinct spatial gradient in precipitation", "link": "https://doi.org/10.1007/s44288-026-00775-0", "authors": "Kritika Nag, S. Pattanayak, V. Venkatramanan, Vartika Sharma, M. S. Shekhar", "source": "Discover Geoscience", "published": "2026-10-15", "first_seen": "2026-11-24T14:57:46+00:00", "score": 71, "topics": [], "watch": [], "boosts": ["himalaya", "precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.3390/rs18203593", "title": "Spatial Super-Resolution of Satellite-Derived SST Data via Generative Adversarial Networks in the Mediterranean Sea", "summary": "In this work, we compare deep convolutional and generative models to improve the reconstruction of sea surface temperature (SST) gradients and effective resolution from cloud-contaminated satellite infrared data. Standard gap-filling techniques produce spatially complete datasets, but they inherently smooth out fine-scale features and gradients that may be critical for a better understanding of the ocean dynamics. Here, we investigate how the use of deep learning models as Autoencoders (AEs) and generative models as Conditional Generative Adversarial Networks (C-GANs) differently contribute to recovering the small-scale structures lost during interpolation. Our supervised, observation-based training relies on satellite-derived SST data from the Mediterranean Sea, with a focus on learning the statistical relationship between high-resolution fields and their low-resolution counterparts. We apply a tiling and merging strategy to deal with limited observational coverage and to ensure spatial continuity. Quantitative validation based on mean squared error metrics, spectral analysis, and gradient statistics shows that the AE reduces the reconstruction error, but it fails to recover high-frequency variability. In contrast, the C-GAN effectively restores the statistical properties of the true SST field at the cost of increasing the pointwise discrepancy with the ground truth observations. Our results highlight the potential of deep models to enhance the physical and statistical realism of gap-filled satellite data in oceanographic applications.", "link": "https://doi.org/10.3390/rs18203593", "authors": "C. Fanelli, Tian-Yi Li, Luca Biferale, B. Buongiorno Nardelli, D. Ciani, A. Pisano, M. Buzzicotti", "source": "Remote Sensing", "published": "2026-10-19", "first_seen": "2026-11-24T14:57:46+00:00", "score": 71, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1371/journal.pone.0343910", "title": "Summer seasonal precipitation prediction in the middle and lower reaches of the Yangtze River using neural network approaches", "summary": "Accurate prediction of summer precipitation is essential for agricultural planning and flood prevention. However, precipitation is strongly nonlinear. In the middle and lower reaches of the Yangtze River (MLYR), many interacting factors and large interannual variability make conventional forecasting methods unreliable. This study proposes neural network approaches to address this challenge. We select independent predictors from 130 circulation indices of the National Climate Center (NCC) and from the ERA5 monthly dataset, including sea surface temperature (SST), 500 hPa geopotential height, and land surface variables. Predictors are chosen through correlation, partial correlation, and autocorrelation analyses. They are then processed with detrended fluctuation analysis (DFA), standardization, and normalization. Four models are trained: a back propagation (BP) network, a gated recurrent unit (GRU) network, a coupled BP-GRU network, and a particle swarm optimization (PSO)-optimized coupled BP-GRU network. A strict chronological split is used (training: 1980–2000; validation: 2001–2010; testing: 2011–2024). Results are reported as the mean ± standard deviation over ten independent runs. The PSO-optimized coupled network performs best (test MSE = 0.0177 ± 0.0106; spatial correlation r = 0.44). It outperforms the standalone GRU (MSE = 0.0207 ± 0.0003), the coupled BP-GRU (MSE = 0.0357 ± 0.0175), and the standalone BP model (MSE = 0.0447 ± 0.0212). It is also the only network to beat the climatological baseline (MSE = 0.0181). The GRU is the most stable across runs but reproduces", "link": "https://doi.org/10.1371/journal.pone.0343910", "authors": "Xin-Ran Ren, Ling-Yan Li", "source": "PLoS ONE", "published": "2026-11-05", "first_seen": "2026-11-24T14:57:46+00:00", "score": 71, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1109/jstars.2026.3746867", "title": "A Progressive Downscaling Framework With Hybrid Attention Mechanisms for High-Resolution Soil Moisture Estimation", "summary": "Soil moisture is a critical variable regulating terrestrial water and energy exchange, with broad applications in drought monitoring, water resources management, and climate change research. However, passive microwave soil moisture products are often constrained by coarse spatial resolution, limiting their utility for regional- and local-scale applications. To address this challenge, we propose a progressive downscaling framework with hybrid attention mechanisms (PDHAM) to generate high-resolution soil moisture estimates. The framework progressively downscales soil moisture through two cascaded stages, first from 0.36° to 0.06° and then from 0.06° to 0.01°, thereby improving downscaling robustness. Each stage incorporates a hybrid attention module to enhance the extraction of spatial details. The effectiveness of PDHAM was evaluated using in situ observations across mainland China. PDHAM consistently outperformed a backpropagation neural network, a deep belief network, and a residual dense network, achieving an average correlation coefficient of 0.72 and an unbiased root-mean-square error of 0.061 m3/m3. Moreover, the downscaled results compared favorably with two existing high-resolution soil moisture datasets. These findings demonstrate the strong potential of PDHAM to improve fine-scale soil moisture monitoring and support hydrological, agricultural, and climatological applications.", "link": "https://doi.org/10.1109/jstars.2026.3746867", "authors": "Pei-Long Chen, Ying-Hong Jing, X. She, Jiao Yang, Yao Li", "source": "IEEE Journal of Selected Topics in Applied Earth Observations and Remote Sensing", "published": "2026", "first_seen": "2026-11-24T14:57:46+00:00", "score": 70, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1029/2026jh001372", "title": "A Super‐Resolution Model for Enhancing the Intensity and Structure of Tropical Cyclone Predictions", "summary": "Accurate predictions of intensity and structure of tropical cyclones (TCs) are crucial for disaster warning, prevention and mitigation. Traditional dynamical models with coarse horizontal resolutions suffer from systematic underprediction of TC intensity, whereas those with fine horizontal resolutions require intensive computations. Deep learning (DL)‐based models are computationally efficient yet substantially underpredict the TC intensity. To enhance the prediction of DL‐based weather models for TC intensities and structures, a hybrid framework (HybSR‐TC) is proposed here. By integrating a Swin Transformer backbone with multi‐variable processing and meta‐upsampling techniques, HybSR‐TC is trained based on low‐resolution (0.25°) forecasts of Pangu‐Weather and high‐resolution (2 km) weather research and forecasting forecasts with accurate TC tracks and well simulated intensities and structures. For TC predictions, HybSR‐TC maps the 6‐hr Pangu‐Weather forecasts of surface pressure and wind fields at 0.25° resolution to 2‐km resolution fields without the requirement for massive computational costs. HybSR‐TC can better capture the rapid intensification and temporal evolution of TCs than Pangu‐Weather and bilinear interpolation. HybSR‐TC produces significantly smaller errors of TC intensity and structure than Pangu‐Weather and bilinear interpolation, until approximately 10‐day lead times. Thus, the ability of HybSR‐TC to enhance the forecasts of TC intensity and structure based on the low‐resolution forecasts from AI models has been demonstrated.", "link": "https://doi.org/10.1029/2026jh001372", "authors": "Zhi-Yu Zhao, Yan-Long Ao, Wei Zhang, Li-Li Lei, Zhe-Min Tan, Qi-Feng Qian", "source": "Journal of Geophysical Research", "published": "2026-11-04", "first_seen": "2026-11-24T14:57:46+00:00", "score": 70, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1109/lgrs.2026.3735399", "title": "OSISAF-to-MASAM2: Deep Learning for Sea Ice Concentration Super-Resolution Product", "summary": "This letter presents a deep learning approach for Arctic sea ice concentration (SIC) downscaling based on multisensor fusion applied during the model training stage. While conventional downscaling methods primarily enhance spatial resolution, the proposed approach also improves physical consistency by fusing the widely used Ocean and Sea Ice Satellite Application Facility (OSISAF) SIC dataset with the high-resolution multisensor-corrected MASAM2 product. This synthesis not only increases spatial resolution from 25 to 4 km, but also yields more realistic ice patterns, as validated by a high structural similarity metric and a mean absolute error (MAE) of 0.02. A comparison of U-Net-based and attention U-Net architectures with classical interpolation methods, a conditional diffusion baseline, and a manual hybrid approach demonstrates the advantages of the proposed solution. The projection change between the two products is embedded in the network as a fixed resampling layer, removing the external remapping stage from the pipeline. The presented model has strong potential to improve sea ice forecasting quality and generate high-resolution historical datasets. Code and weights are provided on https://github.com/ITMO-NSS-team/GRSL_masam2_downscaling", "link": "https://doi.org/10.1109/lgrs.2026.3735399", "authors": "Julia Borisova, Dmitry Morozov, Dmitry Gilemkhanov, N. O. Nikitin", "source": "IEEE Geoscience and Remote Sensing Letters", "published": "2026", "first_seen": "2026-11-24T14:57:46+00:00", "score": 70, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "doi:10.1029/2026jh001400", "title": "HiResCastNet: A 3D Deep Learning Model for Probabilistic Regional High‐Resolution Subseasonal Forecasting Through Downscaling", "summary": "High‐resolution subseasonal forecasts, spanning two to 6 weeks, play a vital role in bridging the gap between short‐range forecasts and seasonal predictions. They provide crucial information for decision‐making in disaster and hazard preparedness, early warning systems, water resource management, and renewable energy. However, generating subseasonal forecasts at high spatial and temporal resolutions remains a significant challenge. Global subseasonal forecasting systems such as European Center for Medium‐Range Weather Forecasts (ECMWF) typically provide outputs at a coarse spatial resolution of about 31 km and a temporal resolution of 12 hr, which limits their usefulness for regional‐scale planning and impact assessments. Our three‐dimensional (3D) high‐resolution regional subseasonal forecasts are generated by dynamically downscaling the ECMWF subseasonal forecasts using the Weather Research and Forecasting (WRF) model, producing outputs at a spatial resolution of 4 km and a temporal resolution of 3 hr. Yet, the dynamical downscaling model is computationally very demanding, especially when using multiple ensemble members. To address this limitation, we introduce HiResCastNet, a data‐driven, probabilistic downscaling framework combining Swin‐transformer and a diffusion model, which serves as an efficient surrogate for the traditional downscaling system. HiResCastNet takes spatio‐temporal coarse resolution forecasts from ECMWF subseasonal system as inputs, and generates 3D high‐resolution forecasts at 4 km spatial resolution and 3‐hourly intervals. Our results suggest that H", "link": "https://doi.org/10.1029/2026jh001400", "authors": "Sofien Resifi, Elissar Al Aawar, T. Luong, I. Hoteit", "source": "Journal of Geophysical Research", "published": "2026-10-31", "first_seen": "2026-11-23T21:44:54+00:00", "score": 97, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["diffusion model"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1029/2026jh001290", "title": "High‐Resolution Downscaling of a Lightweight Climate Emulator Using Diffusion‐Based Super‐Resolution", "summary": "High‐resolution climate fields are essential for the assessment of their regional and local effects. Current global climate models, along with being computationally expensive, are often too coarse for applications that depend on local extremes and orographic gradients. Machine learning offers a computationally efficient route for both climate emulation and super‐resolution from coarse simulations to finer spatial scales. Therefore, we develop a data‐driven downscaling framework for the Lightweight Uncoupled ClImate Emulator (LUCIE), a lightweight Spherical Fourier Neural Operator climate emulator introduced by Guan et al. (2025, https://doi.org/10.1029/2025ms005152 ). We compare deterministic super‐resolution baselines, including a U‐Net and Spherical Fourier Neural Operator (SFNO), with two probabilistic diffusion formulations: a conditional Elucidated Diffusion Model and a diffusion‐posterior‐sampling approach. The models are trained on 6‐hourly ERA5 reanalysis fields from 2000 to 2009 and evaluated on out‐of‐sample LUCIE predictions from 2010 to 2018, downscaling coarse emulator states to km resolution. Performance is assessed against ERA5 using latitude‐weighted root mean square error (RMSE), power spectra, probability density functions, and the leading Empirical Orthogonal Function of zonal wind. These diagnostics test whether deterministic and probabilistic super‐resolution models can recover fine‐scale climatological statistics, high‐wavenumber variability, and dominant modes with an imperfect coarse emulator. Our results characterize the strengths and limitations of", "link": "https://doi.org/10.1029/2026jh001290", "authors": "Hai-Wen Guan, Dibyajyoti Chakraborty, Moein Darman, Troy Arcomano, Ashesh Chattopadhyay, Romit Maulik", "source": "Journal of Geophysical Research", "published": "2026-10-01", "first_seen": "2026-11-23T21:44:54+00:00", "score": 97, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["extreme", "diffusion model", "emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1038/s41598-026-80185-x", "title": "Trade-offs in deep learning approaches for precipitation downscaling across weather regimes", "summary": "Accurate high-resolution precipitation information is critical for assessing hydrological extremes and climate change impacts in complex topographic regions. While machine learning-based downscaling provides a computationally efficient alternative to dynamical models, its performance can depend on regional climate characteristics and terrain complexity. In this study, we systematically benchmarked representative deep learning approaches for daily statistical downscaling over Japan, including quantile-based and stochastic CNN formulations, two- (2D) and three-dimensional (3D) U-Net variants, and a diffusion-based generative model, alongside conventional baselines. Model performance was evaluated using comprehensive statistical and spatial metrics under both climatological and typhoon-affected conditions, enabling us to assess model robustness under extreme precipitation regimes. We further developed a proof-of-concept forecasting configuration for 3D U-Net prediction of next-day precipitation from short predictor sequences, together with an extreme super-resolution experiment to assess scalability to very high target resolutions. The results revealed clear trade-offs: quantile mapping best reproduced distributional properties, deterministic CNNs performed particularly well for standard deterministic metrics, the stochastic CNN achieved the highest average neighborhood-scale skill, and the diffusion model best reproduced the spatial power spectrum, while U-Nets tended to smooth small scales. Nevertheless, the asymmetric-loss U-Net provided the most robust performance during t", "link": "https://doi.org/10.1038/s41598-026-80185-x", "authors": "Alessandro Damiani, N. Ishizaki, R. Cordero, S. Feron", "source": "Scientific Reports", "published": "2026-11-11", "first_seen": "2026-11-23T21:44:54+00:00", "score": 95, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": ["precipitation", "extreme", "diffusion model"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1029/2026ea005059", "title": "Zero‐Shot Transferability of Deep Learning Models for Precipitation Super‐Resolution Across Diverse Climate Regimes", "summary": "High‐resolution precipitation fields are essential for characterizing climate extremes, assessing sectoral impacts, and improving early warning systems. However, the resolution of global Earth system models (ESMs) and numerical weather prediction (NWP) systems remains limited by computational constraints. This study assesses the zero‐shot transferability of deep learning (DL)‐based super‐resolution (SR) models for precipitation across diverse geographic domains, data sources, and temporal scales. A suite of DL‐based SR architectures, ranging from convolutional baselines to spatial‐attention‐based generative models, is trained on a limited regional observational record of satellite‐derived precipitation from three monsoon‐dominated regions of the Indian subcontinent during 2001–2014. DL model generalization is assessed through out‐of‐sample transfer across climatically diverse domains using observations (2015–2023), NWP forecasts (2018–2023), and a 150‐year ESM simulation spanning 1950–2100, all without retraining or fine‐tuning. Across tropical, subtropical, and mid‐latitude climate regimes, the models show strong zero‐shot transferability, achieving Kling‐Gupta efficiency (KGE) scores approximately 0.85 or higher. Skill gains are evident in fine‐scale spatial variability and extreme precipitation statistics that are poorly represented in the coarse‐resolution inputs. Cross‐source application to weather forecasts and long‐term climate simulations further demonstrates the applicability of SR models across differing forcing data and evolving climate conditions. While differen", "link": "https://doi.org/10.1029/2026ea005059", "authors": "Midhun Murukesh, Pankaj Kumar", "source": "Earth and Space Science", "published": "2026-10-01", "first_seen": "2026-11-23T21:44:54+00:00", "score": 92, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["india", "monsoon", "precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.5194/gmd-19-9235-2026", "title": "China regional 3 km downscaling based on residual Corrective Diffusion model", "summary": "A fundamental challenge in numerical weather prediction is efficiently producing high-resolution forecasts. A widely adopted solution is to downscale coarser global model outputs. This study focuses on statistical downscaling, which uses historical data to learn mappings between low- and high-resolution meteorological fields. Deep learning has become a key tool for this, enabling powerful super-resolution models like diffusion models and Generative Adversarial Networks for downscaling applications. Herein, we leverage CorrDiff, a diffusion-based downscaling framework, with three key enhancements relative to its original implementation. First, the study domain is expanded to nearly 40 times the spatial extent of the original version. Second, the scope of target downscaling variables is extended beyond surface variables to incorporate upper-air variables across six pressure levels. Third, a global residual connection is integrated to further boost prediction accuracy. To produce 3 km resolution forecasts for the China region, the trained CorrDiff model is applied to 25 km global grid forecasts derived from two sources: a conventional global numerical weather prediction model and a deep learning-based weather model developed using Spherical Fourier Neural Operators. The China Meteorological Administration Mesoscale Model (CMA-MESO) is selected as the baseline for comparative evaluation. Experimental results demonstrate that the downscaled forecasts generated by our framework outperform the direct forecasts of CMA-MESO for almost all target variables, as quantified by the Mean ", "link": "https://doi.org/10.5194/gmd-19-9235-2026", "authors": "Hong-Lu Sun, Hao Jing, Zhi-Xiang Dai, Sa Xiao, Wei Xue, Jian Sun, Qi-Feng Lu", "source": "Geoscientific Model Development", "published": "2026-09-29", "first_seen": "2026-11-23T21:44:54+00:00", "score": 92, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["diffusion model"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "arxiv:2609.39833", "title": "RainAtlas: A Multi-Continental Dataset for Precipitation Downscaling", "summary": "Extreme rainfall events are increasing in intensity and frequency as climate change accelerates. While kilometer-scale precipitation forecasts are critical for supporting local decision-making, the limited availability of high-resolution precipitation observations hinders their accuracy, especially in under-resourced regions. Machine learning models are widely used to downscale precipitation data to km-scale, but their application to unseen geographies presents challenges. First, processing raw high-resolution precipitation datasets across regions requires significant engineering and domain expertise. Second, generalization across regions remains difficult. To help overcome these barriers, we release RainAtlas, a large-scale, ML-ready and multi-continental dataset for precipitation downscaling. Covering three continents, RainAtlas harmonizes heterogeneous hourly km-scale observations to a common 2-km grid. Each regional partition contains around 210,000 aligned low- and high-resolution precipitation pairs, respectively from ERA5 reanalysis and direct observations. We benchmark state-of-the-art ML-based downscaling models across RainAtlas using a wide range of metrics. Our evaluation reveals substantial variance in out-of-domain generalization depending on the training regions. This underscores the need for cross-regional, multi-source km-scale evaluation, establishing RainAtlas as a well-positioned benchmark for precipitation downscaling research.", "link": "https://arxiv.org/abs/2609.39833", "authors": "Pierre Lemaire, Luca Schmidt, W. Suijker, Alex Hernández-García, D. Rolnick", "source": "arXiv.org", "published": "2026-09-30", "first_seen": "2026-11-23T21:44:54+00:00", "score": 92, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1038/s41612-026-01424-6", "title": "New horizons in statistical downscaling and AI approaches for sustainable km-scale climate simulations", "summary": "Statistical downscaling translates coarse-resolution climate model output into locally relevant information for climate services and impact assessment. Recent advances in artificial intelligence (AI) enable high-resolution, probabilistic, and computationally efficient approaches. This paper provides a perspective on the evolution from classical to AI-driven and hybrid downscaling approaches, assesses key challenges related to interpretability, uncertainty, data availability, and computational requirements, and outlines physically constrained and generative frameworks that support decision-making across sectors.", "link": "https://doi.org/10.1038/s41612-026-01424-6", "authors": "K. Chun, L. Aragão, M. Olmo, V. Nguyen, C. B. Risanto, M. Bettolli, Y. Ezber, Emir Toker", "source": "npj Climate and Atmospheric Science", "published": "2026-05-04", "first_seen": "2026-11-23T21:44:54+00:00", "score": 92, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "doi:10.1117/12.3131069", "title": "A physics-informed neural network for downscaling ERA5 reanalysis sea surface temperature to kilometre-scale resolution", "summary": "Sea surface temperature (SST) from ERA5 reanalysis (0.25° × 0.25°) is too coarse to resolve fronts and mesoscale eddies in coastal waters. Here we construct a physics-informed neural network (PINN) that embeds the ocean advection–diffusion equation as a training constraint. The network takes spatiotemporal coordinates as input, uses coarse ERA5 SST as supervised labels, and outputs physically consistent high-resolution SST. Applied to daily ERA5 data over the Yellow Sea for 2021, the model downscales SST from 0.25° to 5 km resolution. Applied to daily ERA5 data over the Yellow Sea for 2021, the model downscales SST from 0.25° to 5 km resolution with a root-mean-square error of 0.94 °C and R2 of 0.92. This model outperforms traditional methods such as bilinear interpolation. It also preserves thermodynamically consistent fine-scale structures at temperature fronts and water-mass boundaries. This framework offers a physically credible route for generating high-resolution coastal reanalysis datasets and is extensible to other ocean variables.", "link": "https://doi.org/10.1117/12.3131069", "authors": "Si-Qi Zhang, Dong Zhang", "source": "International Conference on Remote Sensing, Mapping, and Geographic Systems", "published": "2026-10-22", "first_seen": "2026-11-23T21:44:54+00:00", "score": 90, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "arxiv:2610.03757", "title": "Generalizable Neural Downscaling of Earth System Model Wind Fields via Continuous Dynamics Modeling", "summary": "Accurate high-resolution wind field simulations are critical for resolving fine-scale atmospheric dynamics, yet the simulation of wind fields in Earth System Models (ESMs) remains limited by coarse spatial resolution and systematic biases. To address this, data-driven down scaling techniques have been widely used to enhance coarse-resolution ESM outputs. However, existing methods are typically tied to fixed discretizations, limiting generalization across models with different native resolutions. Here we formulate global near-surface wind downscaling as an operator-learning problem on continuous atmospheric state fields and develop a downscaling neural operator that maps coarse-scale fields to fine-scale counterparts across heterogeneous discretizations. The operator learning-based neural downscaling framework outperforms dominant baselines, recovers fine-scale physical structures, and generalizes to previously unseen ESMs and future climate scenarios without retraining, while preserving long-term wind projection trends. These findings establish a generalizable paradigm for high-resolution climate downscaling across diverse simulation outputs and future scenarios.", "link": "https://arxiv.org/abs/2610.03757", "authors": "Chen Yu, Jia-Nan Wei, Han-Lin Kong, Hao Sun, B. He, Wen-Guan Wang", "source": "Semantic Scholar", "published": "2026-09-26", "first_seen": "2026-11-23T21:44:54+00:00", "score": 87, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.3390/cli14110233", "title": "AI-Based Super-Resolution Approaches to Reconstruct Temperature Fields of Climatic Data Using Deep Neural Networks", "summary": "High-fidelity climate analysis is heavily constrained both by the computational costs of high-resolution dynamical simulations and by the general scarcity of fine-scale observational data for model evaluation. To address these limitations, in this work we propose a deep learning framework for spatial climate downscaling using an AI-based super-resolution (SR) approach. We develop Deep Neural Network architectures designed to upscale 2 m surface temperature fields, bridging the gap between gridded global reanalysis data at lower scale (1.0°) and higher scale (0.25°). We developed three DNN models, specifically ResNet, RNN, and ConvRNN, trained and validated on ECMWF ERA5 data from the early years of the current millennium (i.e., 01/01,01/04,01/07,01/10 of 2001,2003,2005 at 00:00) and evaluated over various periods, including 1992, a historical period influenced by the 1991 Mount Pinatubo eruption (a large volcanic eruption which is known to have had impacts on the climate due to the massive stratospheric injections of sulfur dioxide). The framework is tested also on the Berkeley Earth global observational dataset and on outputs from a MPI-ESM1-2-LR historical global climate simulation and compared with traditional interpolation methods, to verify the models generalization capability. The models reached high levels of accuracy, with errors lower than 0.5 K and a similarity index higher than 0.97, successfully capturing the spatio-temporal dynamics of temperature fields. Overall, the novelty of this work is in three main aspects: the implementation of DNN capable to capture th", "link": "https://doi.org/10.3390/cli14110233", "authors": "E. Amato, Lorenzo Basile, V. Zago, D. Zanchettin, C. del Negro", "source": "Climate", "published": "2026-11-01", "first_seen": "2026-11-23T21:44:54+00:00", "score": 87, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "arxiv:2607.17037", "title": "Apeliotes: A Diffusion-Based Modeling Framework for km-scale Multi-Level Atmospheric Fields", "summary": "High-resolution atmospheric data are required to resolve mesoscale and localized meteorological structures, however, such datasets remain limited in many regions of the world. Existing high-resolution weather products are typically produced through dynamical downscaling, which is computationally expensive and difficult to scale across locations, variables, and forecast scenarios. These limitations motivate machine-learning-based downscaling systems that can generate multiple weather variables stochastically while producing new high-resolution fields directly. In this paper we present Apeliotes, a framework for high-resolution weather forecasting. Built on the global re-analysis atmospheric data, a pre-trained global weather foundation model, and a regionally trained generative diffusion model, Apeliotes not only provides accurate kilometer-scale weather variables, but also multi-level atmospheric fields which are not directly available in the existing global atmospheric data. Our comprehensive evaluation demonstrates that Apeliotes achieves highly competitive performance. The model predicts vertical wind profile with less than 3% error between truth and predicted fields, achieving correlations of 0.91 for 10-m wind speed and 0.99 for 2-m temperature, with NRMSE values of 0.42 and 0.17, respectively.", "link": "https://arxiv.org/abs/2607.17037", "authors": "Evangelia Rafaela Frastali, Achyut Paudel, Maryam Golbazi, Frank Liu", "source": "International Conference on Machine Learning and Applications", "published": "2026-07-19", "first_seen": "2026-11-23T21:44:54+00:00", "score": 87, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["diffusion model"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "cite", "pick": null, "cites": ["Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks"]}, {"key": "doi:10.5194/essd-18-7593-2026", "title": "High-resolution global groundwater storage anomalies: a 1 km downscaled dataset", "summary": "Groundwater depletion poses a challenge to water security, but the coarse spatial resolution of Gravity Recovery and Climate Experiment (GRACE) observations limits the characterization of groundwater variability at regional and local scales. Here, we present a 1 km monthly global groundwater storage anomaly (GWSA) dataset covering April 2002–December 2020. The dataset was generated using Singular Spectrum Analysis (SSA) for temporal gap filling, 19 high-resolution hydroclimatic and geophysical predictors, and aquifer-stratified machine-learning downscaling. Extreme Gradient Boosting (XGBoost) and deep neural networks (DNN) were evaluated as candidate models, and XGBoost was selected for dataset production based on internal, cross-scale, and in-situ evaluations. When aggregated to the original GRACE scale, the 1 km product agreed closely with the original GWSA ( R 2 = 0.972, RMSE = 2.10 cm). Independent evaluation used a global archive of 152 069 groundwater-monitoring wells and a 1° spatial-block calibration–validation design. Effective specific yield ( S yeff ) was estimated from calibration blocks and transferred to held-out blocks before comparison at a common 0.25° grid. For XGBoost, the held-out evaluation yielded R 2 = 0.538, RMSE = 0.378 cm yr −1 , and Bias = 0.106 cm yr −1 . The association between modeled and observation-derived trends remained similar under ± 30 % perturbations in S yeff , although amplitude-related metrics were more sensitive to the conversion coefficient. Standardized time-series comparisons and monthly evaluations of representative aquifers sho", "link": "https://doi.org/10.5194/essd-18-7593-2026", "authors": "Chen Zhang, Yi-Fei Fan, Wen-Xia Han, Ying-Chun Ge, Jia-Bei Zhu, Tao Che", "source": "Earth System Science Data", "published": "2026-10-19", "first_seen": "2026-11-23T21:44:54+00:00", "score": 87, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": ["india", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1007/s12665-026-13186-8", "title": "Enhancing GRACE-derived terrestrial water storage estimates through bias-corrected downscaling using machine learning and artificial bee colony optimization", "summary": "Accurate monitoring of spatiotemporal variations of Terrestrial Water Storage (TWS) is essential for sustainable water resources management in arid and semi-arid regions. The Gravity Recovery and Climate Experiment (GRACE) and GRACE-Follow On (GRACE-FO) satellite missions serve as valuable tools for estimating changes in TWS; however, their coarse spatial resolution poses challenges for applications at local and regional scales. In this study, downscaling of the GRACE data for the Yazd province, Iran, was conducted using three Machine Learning (ML) models, including Extreme Gradient Boosting (XGBoost) and two Deep Neural Networks, i.e., DNN1 and DNN2, while the latter has more hidden layers than the former. To enhance accuracy and reduce the systematic bias in the model outputs, the Artificial Bee Colony (ABC) metaheuristic algorithm and a hybrid version combining ABC and Quantile Mapping were employed as the bias correction framework. The input data for the models were derived from high-resolution datasets, including CHIRPS for precipitation and TerraClimate for climatic variables listed in Table 1. The performance evaluation of the models, based on statistical indices, indicated that the XGBoost model achieved the highest accuracy in reproducing TWS anomalies (R2 = 0.829) and the lowest error among the ML models. The implementation of the ABC algorithm resulted in a 12.45% reduction in root mean square errors (RMSE) and improved the consistency between model outputs and observations from piezometer wells. Temporal and spatial analyses demonstrate a continuous decline in e", "link": "https://doi.org/10.1007/s12665-026-13186-8", "authors": "M. Goodarzi, Masoud Asgarzadeh Torghabeh, Majid Niazkar", "source": "Environmental Earth Sciences", "published": "2026-10-30", "first_seen": "2026-11-23T21:44:54+00:00", "score": 86, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": ["p
