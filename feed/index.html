ty, organic matter, and soil rhizosphere and their impacts on seasonal evolution of soil temperature, soil moisture, and surface energy and water budgets at the sparsely vegetated Amdo site located in central TP. The LSM spin‐up time at the central TP depends on the complexity of the model physics, ranging from 4 years with simplest soil physics to 30 years with the addition of organic matter and spare to dense rhizosphere parameterization in Noah‐MP. Representing layered soil texture and organic matter does not improve low biases in topsoil moisture. Reducing the saturated conductivity from the mucilage in the rhizosphere produces better results. Surface sensible and latent heat fluxes are better simulated in the monsoon season as well. Adding layered soil texture and organic matter in Noah‐MP retard the thawing in deep soil layers, and the rhizosphere effect delays thawing even more in the transient season. Uncertainties in soil initialization significantly affect deep‐soil temperature and moisture, but uncertainties in atmospheric forcing conditions mainly aff", "link": "https://doi.org/10.1002/2015jd023404", "authors": "Yanhong Gao, Kai Li, Fei Chen, Yingsha Jiang, Chungu Lu", "source": "JGR: Atmospheres", "published": "2015-9-23", "first_seen": "2026-11-23T21:25:47+00:00", "score": 19, "topics": ["Climate Modelling"], "watch": [], "boosts": ["monsoon", "uncertainty"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-023-00422-2", "title": "Main drivers of Indian Ocean Dipole asymmetry revealed by a simple IOD model", "summary": "Abstract Indian Ocean Dipole phenomenon (IOD) refers to a dominant zonal contrast pattern of sea surface temperature anomaly (SSTA) over tropical Indian Ocean (TIO) on interannual time scales. Its positive phase, characterized by anomalously warm western TIO and anomalously cold southeastern TIO, is usually stronger than its negative phase, namely a positively skewed IOD. Here, we investigate causes for the IOD asymmetry using a prototype IOD model, of which physical processes include both linear and nonlinear feedback processes, El Nino’s asymmetric impact, and a state-dependent noise. Parameters for the model were empirically obtained using various reanalysis SST data sets. The results reveal that the leading cause of IOD asymmetry without accounting seasonality is a local nonlinear process, and secondly the state-dependent noise, the direct effect by the positively skewed ENSO and its nonlinear teleconnection; the latter two have almost equal contribution. However, the contributions by each process are season dependent. For boreal summer, both local nonlinear feedback process and the state-dependent noise are major drivers of IOD asymmetry with negligible contribution from ENSO. The ENSO impacts become important in boreal fall, along with the other two processes.", "link": "https://doi.org/10.1038/s41612-023-00422-2", "authors": "Soon-Il An, Hyo-Jin Park, Soong-Ki Kim, Wenju Cai, Agus Santoso, Daehyun Kim", "source": "npj Climate and Atmospheric Science", "published": "2023-7-15", "first_seen": "2026-11-23T21:25:47+00:00", "score": 19, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-26-0150.1", "title": "Tropical Cyclone Representation and Forecast Skill in GEOS-S2S-3", "summary": "Abstract This study evaluates tropical cyclone (TC) climatology, structure, and subseasonal prediction skill in the latest NASA Goddard Earth Observing System Subseasonal-to-Seasonal forecast system, Version 3 (GEOS-S2S-3), comparing its performance with its predecessor GEOS-S2S-2. The two systems show contrasting genesis biases: GEOS-S2S-3 overproduces annual TC count by roughly 1.5 times observed values across most basins, while GEOS-S2S-2 slightly underestimates it. Both systems capture the observed seasonal cycle but underestimate TC intensity, the latter being expected at 0.5° atmospheric resolution. GEOS-S2S-3 simulates longer TC lifespans, which, combined with its higher genesis rate, produce higher modified accumulated cyclone energy than GEOS-S2S-2. To investigate the excessive genesis rate in GEOS-S2S-3, we examined the large-scale environment, convective precipitation, and vertical velocity. Neither large-scale environmental favorability nor mean convective precipitation differences provides a satisfying explanation; the analysis points to differences in the vertical structure of convection — particularly stronger lower-tropospheric ascent in GEOS-S2S-3—as a potentially relevant contributor, possibly related to changes in the tuning of parameterizations for moist processes. In terms of TC structure, GEOS-S2S-3 shows a more realistic vortex than its predecessor, with stronger inner-core ascent, higher mid-level relative humidity, and stronger tangential winds than GEOS-S2S-2, though neither system simulates a distinct eyewall at 0.5° resolution. Finally, GEOS-S2S-", "link": "https://doi.org/10.1175/waf-d-26-0150.1", "authors": "K. S. S. Sai Srujan, Chia-Ying Lee, Jorge L. García-Franco, Suzana J. Camargo, Michael K. Tippett, Young-Kwon Lim", "source": "Weather and Forecasting", "published": "2026-11-23", "first_seen": "2026-11-23T21:25:47+00:00", "score": 19, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.00433", "title": "Local Spatial TreeSHAP: Geographically Explainable AI Revealing Urbanization-Dependent Spatial Heterogeneity in Flood Resilience", "summary": "Urban flood resilience emerges from complex interactions among natural, built, and socio-economic systems, yet most recovery policies implicitly assume that resilience mechanisms are spatially uniform. To address this gap, this study develops a spatially explainable machine learning framework that integrates geographically weighted random forests with a novel Local Spatial TreeSHAP algorithm, enabling nonlinear resilience mechanisms to be identified and interpreted at the community scale. The framework is applied to 779 communities affected by the July 2023 extreme rainstorm in Beijing. Results reveal that resilience mechanisms exhibit substantially stronger spatial heterogeneity than the underlying physical and socio-economic conditions themselves, with SHAP-value spatial autocorrelation decreasing by 66.2% on average relative to predictor variables. Three distinct resilience regimes emerge across the urbanization gradient. Highly urbanized communities benefit from synergistic interactions among commercial infrastructure and accommodation services; transitional medium urbanized communities are constrained by infrastructure-development mismatches that create facility gaps despite continued urban expansion; and low urbanized communities are dominated by ecological and topographic thresholds, where adverse interactions between transportation and river-network structures undermine recovery capacity. Field investigations and interviews with 12 stakeholders corroborate these patterns. By linking geographically weighted machine learning with locally grounded attribution analysis,", "link": "https://arxiv.org/abs/2611.00433", "authors": "Zeyu Zhao, Xiaoshan Zhou, Fanxin Meng, Dongping Fang, Helen X. H. Bao", "source": "arXiv", "published": "2026-10-30T22:31:20Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 18, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-024-00615-3", "title": "Strengthened impact of boreal winter North Pacific Oscillation on ENSO development in warming climate", "summary": "Abstract The North Pacific Oscillation (NPO), an important mode of atmospheric variability, is a crucial trigger for the development of El Niño-Southern Oscillation (ENSO) via the seasonal footprinting mechanism. How the NPO effect on ENSO changes in response to greenhouse warming remains unclear, however. Here, using climate model simulations under high-emission scenarios, we show that greenhouse warming leads to an enhanced influence of NPO on ENSO as is manifested by enhanced responses of winter sea surface temperature (SST), precipitation and wind anomalies in the equatorial Pacific to the preceding winter NPO. The strengthened NPO impact is also reflected in an increased frequency of NPO events that are followed by ENSO events. Warmer background SST enhances the wind-evaporation-SST feedback over the subtropical North Pacific due to a nonlinear SST-evaporation relationship. This strengthens the NPO-generated surface zonal wind anomalies over the equatorial western-central Pacific, which trigger ENSO. Increased impact of winter NPO on ENSO could enable prediction of interannual variability at longer leads.", "link": "https://doi.org/10.1038/s41612-024-00615-3", "authors": "Shangfeng Chen, Wen Chen, Shang-Ping Xie, Bin Yu, Renguang Wu, Zhibiao Wang", "source": "npj Climate and Atmospheric Science", "published": "2024-3-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 18, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-025-01021-z", "title": "Growing human-induced climate change fingerprint in regional weekly fire extremes", "summary": "Abstract Wildfires cause large damage to natural and human systems. Despite the clear connection between human-induced climate change and increased fire weather risk, a global, systematic attribution of observed extreme fires to human-induced climate change is lacking. Here, we address this gap by first linking observed regional weekly burned area extremes (>85th percentile) to the fire weather index (FWI) during the fire seasons of 2002–2015 via a logistic regression model, and then using simulations from climate models to quantify the impact of human-induced climate change. Focusing on regions with good predictability of the statistical model, we find that human-induced climate change was responsible for a fraction equal to 8% (±4%, standard deviation across climate models) of the predicted probability of more than 700 regional fire extremes on average, thereby increasing the probability of experiencing a fire extreme across 15 out of 19 analysed regions. While higher temperature is the main driver of the increased fire extreme probability, shifts in precipitation, relative humidity, and/or wind speed substantially modulated fire changes across many regions. Mainly because of warming, the probability of extreme fires attributable to human-induced climate change increased by 5.2%/decade globally over 2002–2015, in line with an acceleration of the climate-driven enhancement of fire extremes over the last decades that may continue in the near future. These findings highlight the urgent need for sustainable fire management strategies.", "link": "https://doi.org/10.1038/s41612-025-01021-z", "authors": "Sifang Feng, Jakob Zscheischler, Zengchao Hao, Emanuele Bevacqua", "source": "npj Climate and Atmospheric Science", "published": "2025-4-23", "first_seen": "2026-11-23T21:25:47+00:00", "score": 18, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-6-1179-2025", "title": "Southern Annular Mode persistence and westerly jet: a reassessment using high-resolution global models", "summary": "This study evaluates the performance of high-resolution (grid sizes of 9–28 km for the atmosphere; 5–13 km for the ocean) global simulations from the EERIE project in representing the persistence of the Southern Annular Mode (SAM), a leading mode of Southern Hemisphere climate variability. Using the decorrelation timescale of the SAM index ( τ ), we compare EERIE simulations with CMIP6 models and ERA5 reanalysis. EERIE simulations reduce long-standing biases in SAM persistence, especially in early summer, with τ values of 9–20 d compared to CMIP6's 9–32 d and ERA5's 11 d. This improvement correlates with a more accurate climatological jet latitude ( λ 0 ). EERIE atmosphere-only AMIP runs outperform the coupled simulations in both τ and λ 0 , showing smaller biases and ranges of variability, underscoring the critical role of sea surface temperature (SST) representation in shaping atmospheric circulation. In these AMIP experiments, the atmospheric eddy feedback strength, combined with the damping timescale estimated via friction, correlates more strongly with τ than λ 0 . We speculate that the well-captured jet position (biases < 1° relative to ERA5), due to prescribed SSTs, limits λ 0 's explanatory power for τ differences, allowing other processes to dominate. Using a finer model grid (9 km vs. 28 km) of the same AMIP model reduces τ , though the mechanism remains unclear. Finally, motivated by the importance of oceanic eddies in the Southern Ocean, we conducted sensitivity experiments that filter transient mesoscale features from the SST boundary conditions. The results su", "link": "https://doi.org/10.5194/wcd-6-1179-2025", "authors": "Ting-Chen Chen, Hugues Goosse, Cécile Davrinche, Stephy Libera, Christopher Roberts, Matthias Aengenheyster", "source": "Weather and Climate Dynamics", "published": "2025-10-21", "first_seen": "2026-11-23T21:25:47+00:00", "score": 18, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-6-1339-2025", "title": "Anthropogenic climate change has increased severity of mid-latitude storms and impacted airport operations", "summary": "The impact of extreme weather events, particularly those associated with tropical and extra-tropical cyclones (TC and ETC), on aviation can rise serious concerns in the context of the ongoing climate change. These events often lead to significant disruptions, including flight cancellations, delays, re-routing, and impacts on airport infrastructure resilience to adverse weather conditions. This study conducts an analysis of the influence of anthropogenic climate change on four recent major storm events that occurred over Europe, the USA, and East Asia, with an in-depth analysis on the Storm Eunice, a powerful ETC that affected the UK and Ireland. Using climate reanalysis data we assess the dynamics of these extreme storms and their implications for aviation operations, particularly during critical phases such as take-off and landing. Our research underscores the growing intensity of extreme storms, particularly stronger winds, driven by human-induced climate change, and stresses the need for taking into account growing climate hazards to optimize planes and airport operations.", "link": "https://doi.org/10.5194/wcd-6-1339-2025", "authors": "Lia Rapella, Tommaso Alberti, Davide Faranda, Philippe Drobinski", "source": "Weather and Climate Dynamics", "published": "2025-11-7", "first_seen": "2026-11-23T21:25:47+00:00", "score": 18, "topics": ["Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1256/qj.04.176", "title": "The ERA‐40 re‐analysis", "summary": "Abstract ERA‐40 is a re‐analysis of meteorological observations from September 1957 to August 2002 produced by the European Centre for Medium‐Range Weather Forecasts (ECMWF) in collaboration with many institutions. The observing system changed considerably over this re‐analysis period, with assimilable data provided by a succession of satellite‐borne instruments from the 1970s onwards, supplemented by increasing numbers of observations from aircraft, ocean‐buoys and other surface platforms, but with a declining number of radiosonde ascents since the late 1980s. The observations used in ERA‐40 were accumulated from many sources. The first part of this paper describes the data acquisition and the principal changes in data type and coverage over the period. It also describes the data assimilation system used for ERA‐40. This benefited from many of the changes introduced into operational forecasting since the mid‐1990s, when the systems used for the 15‐year ECMWF re‐analysis (ERA‐15) and the National Centers for Environmental Prediction/National Center for Atmospheric Research (NCEP/NCAR) re‐analysis were implemented. Several of the improvements are discussed. General aspects of the production of the analyses are also summarized. A number of results indicative of the overall performance of the data assimilation system, and implicitly of the observing system, are presented and discussed. The comparison of background (short‐range) forecasts and analyses with observations, the consistency of the global mass budget, the magnitude of differences between analysis and background field", "link": "https://doi.org/10.1256/qj.04.176", "authors": "S. M. Uppala, P. W. KÅllberg, A. J. Simmons, U. Andrae, V. Da Costa Bechtold, M. Fiorino", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2005-10", "first_seen": "2026-11-23T21:25:47+00:00", "score": 18, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2023.10", "title": "Exploring the nonstationarity of coastal sea level probability distributions", "summary": "Abstract Studies agree on a significant global mean sea level rise in the 20th century and its recent 21st century acceleration in the satellite record. At regional scale, the evolution of sea level probability distributions is often assumed to be dominated by changes in the mean. However, a quantification of changes in distributional shapes in a changing climate is currently missing. To this end, we propose a novel framework quantifying significant changes in probability distributions from time series data. The framework first quantifies linear trends in quantiles through quantile regression. Quantile slopes are then projected onto a set of four orthogonal polynomials quantifying how such changes can be explained by independent shifts in the first four statistical moments. The framework proposed is theoretically founded, general, and can be applied to any climate observable with close-to-linear changes in distributions. We focus on observations and a coupled climate model (GFDL-CM4). In the historical period, trends in coastal daily sea level have been driven mainly by changes in the mean and can therefore be explained by a shift of the distribution with no change in shape. In the modeled world, robust changes in higher order moments emerge with increasing $ {\\mathrm{CO}}_2 $ concentration. Such changes are driven in part by ocean circulation alone and get amplified by sea level pressure fluctuations, with possible consequences for sea level extremes attribution studies.", "link": "https://doi.org/10.1017/eds.2023.10", "authors": "Fabrizio Falasca, Andrew Brettin, Laure Zanna, Stephen M. Griffies, Jianjun Yin, Ming Zhao", "source": "Environmental Data Science", "published": "2023", "first_seen": "2026-11-23T21:25:47+00:00", "score": 18, "topics": ["Climate Modelling"], "watch": ["Laure Zanna"], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1002/2013jd020564", "title": "Serial clustering of extratropical cyclones over the North Atlantic and Europe under recent and future climate conditions", "summary": "Under particular large‐scale atmospheric conditions, several windstorms may affect Europe within a short time period. The occurrence of such cyclone families leads to large socioeconomic impacts and cumulative losses. The serial clustering of windstorms is analyzed for the North Atlantic/western Europe. Clustering is quantified as the dispersion (ratio variance/mean) of cyclone passages over a certain area. Dispersion statistics are derived for three reanalysis data sets and a 20‐run European Centre Hamburg Version 5 /Max Planck Institute Version–Ocean Model Version 1 global climate model (ECHAM5/MPI‐OM1 GCM) ensemble. The dependence of the seriality on cyclone intensity is analyzed. Confirming previous studies, serial clustering is identified in reanalysis data sets primarily on both flanks and downstream regions of the North Atlantic storm track. This pattern is a robust feature in the reanalysis data sets. For the whole area, extreme cyclones cluster more than nonextreme cyclones. The ECHAM5/MPI‐OM1 GCM is generally able to reproduce the spatial patterns of clustering under recent climate conditions, but some biases are identified. Under future climate conditions (A1B scenario), the GCM ensemble indicates that serial clustering may decrease over the North Atlantic storm track area and parts of western Europe. This decrease is associated with an extension of the polar jet toward Europe, which implies a tendency to a more regular occurrence of cyclones over parts of the North Atlantic Basin poleward of 50°N and western Europe. An increase of clustering of cyclones is proje", "link": "https://doi.org/10.1002/2013jd020564", "authors": "Joaquim G. Pinto, Nina Bellenbaum, Melanie K. Karremann, Paul M. Della‐Marta", "source": "JGR: Atmospheres", "published": "2013-11-22", "first_seen": "2026-11-23T21:25:47+00:00", "score": 17, "topics": ["Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-7-263-2026", "title": "Mediterranean Sea heat uptake variability as a precursor to winter precipitation in the Levant", "summary": "The Eastern Mediterranean is experiencing severe warming and drying, driven by global warming, making seasonal precipitation prediction in the region imperative. Given that the Mediterranean Sea is the primary source of regional moisture and synoptic variability, here we explore the observed relation of Mediterranean Sea variability to Levant land precipitation during winter – the dominant wet season. Using Empirical Orthogonal Function (EOF) objective analysis, we identify three dominant modes of sea surface temperature (SST) and ocean heat uptake variability in the Mediterranean Sea. Of these, two modes characterized by east-west variations are found to be statistically related to winter land precipitation in the Levant. Based on these relations, we define an Aegean Sea heat uptake anomaly index (AQA), which is strongly correlated with Levant winter precipitation. Specifically, AQA values during August are found to predict Levant land precipitation in the following winter (December–February, R=-0.60). Wetter winters over the Levant following negative August AQA values are associated with more persistent eastward-propagating Mediterranean storms, driven by enhanced baroclinicity and a stronger subtropical jet. The results present AQA as a useful seasonal predictor of Levant winter precipitation and indicate that representations of processes affecting Mediterranean cyclones, the subtropical jet, and ocean-atmosphere heat exchange are key to seasonal forecasting skill in the Levant.", "link": "https://doi.org/10.5194/wcd-7-263-2026", "authors": "Ofer Cohen, Assaf Hochman, Ehud Strobach, Dorita Rostkier-Edelstein, Hezi Gildor, Ori Adam", "source": "Weather and Climate Dynamics", "published": "2026-2-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 17, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-20-0160.1", "title": "The Use of the Conway–Maxwell–Poisson in the Seasonal Forecasting of Tropical Cyclones", "summary": "Abstract The Conway–Maxwell–Poisson distribution improves the precision with which seasonal counts of tropical cyclones may be modeled. Conventionally the Poisson is used, which assumes that the formation and transit of tropical cyclones is the result of a Poisson process, such that their frequency distribution has equal mean and variance (“equi-dispersion”). However, earlier studies of observed records have sometimes found overdispersion, where the variance exceeds the mean, indicating that tropical cyclones are clustered in particular years. The evidence presented here demonstrates that at least some of this overdispersion arises from observational inhomogeneities. Once this is removed, and particularly near the coasts, there is evidence for equi-dispersion or underdispersion. To more accurately model numbers of tropical cyclones, we investigate the use of the Conway–Maxwell–Poisson as an alternative to the Poisson that represents any dispersion characteristic. An example is given for East China where using it improves the skill of a prototype seasonal forecast of tropical cyclone landfall.", "link": "https://doi.org/10.1175/waf-d-20-0160.1", "authors": "Timothy D. Mitchell, Joanne Camp", "source": "Weather and Forecasting", "published": "2021-6", "first_seen": "2026-11-23T21:25:47+00:00", "score": 17, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1017/eds.2024.54", "title": "Modeling of spatial extremes in environmental data science: time to move away from max-stable processes", "summary": "Abstract Environmental data science for spatial extremes has traditionally relied heavily on max-stable processes. Even though the popularity of these models has perhaps peaked with statisticians, they are still perceived and considered as the “state of the art” in many applied fields. However, while the asymptotic theory supporting the use of max-stable processes is mathematically rigorous and comprehensive, we think that it has also been overused, if not misused, in environmental applications, to the detriment of more purposeful and meticulously validated models. In this article, we review the main limitations of max-stable process models, and strongly argue against their systematic use in environmental studies. Alternative solutions based on more flexible frameworks using the exceedances of variables above appropriately chosen high thresholds are discussed, and an outlook on future research is given. We consider the opportunities offered by hybridizing machine learning with extreme-value statistics, highlighting seven key recommendations moving forward.", "link": "https://doi.org/10.1017/eds.2024.54", "authors": "Raphaël Huser, Thomas Opitz, Jennifer L. Wadsworth", "source": "Environmental Data Science", "published": "2025", "first_seen": "2026-11-23T21:25:47+00:00", "score": 17, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.23729", "title": "Toward Out-of-Distribution Generalization in Neural AC Power Flow", "summary": "Growing uncertainty in power system operations from renewables integration, extreme weather, and data center loads challenges the reliability of traditional power flow solvers at scale. Machine learning-based proxies are a potentially promising alternative, but the prohibitive cost of generating training data for large grids makes out-of-distribution generalization a key capability for deployment; currently, models trained on small grids lack that capability. In this work, we systematically evaluate how physics-informed losses, multi-grid training, and perturbation-based data augmentation improve the zero-shot transfer of three graph neural network-based power flow models from smaller systems to a larger, unseen 500-bus system. We find that (1) physics-informed losses improve transfer relative to purely supervised objectives; (2) multi-grid training on smaller systems matches the best single grid but does not close the gap to target-grid training; (3) perturbation-based augmentation on edge attributes improves transfer by up to 54.6%; and (4) random line/generator dropout does not consistently improve performance.", "link": "https://arxiv.org/abs/2611.23729", "authors": "Ojas Sanghi, Anvita Bhagavathula, Alvaro Carbonero, Priya L. Donti", "source": "arXiv", "published": "2026-11-18T02:41:59Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 16, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme", "uncertainty"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-11-1799-2018", "title": "Crossing the chasm: how to develop weather and climate models for next generation computers?", "summary": "Weather and climate models are complex pieces of software which include many individual components, each of which is evolving under pressure to exploit advances in computing to enhance some combination of a range of possible improvements (higher spatio-temporal resolution, increased fidelity in terms of resolved processes, more quantification of uncertainty, etc.). However, after many years of a relatively stable computing environment with little choice in processing architecture or programming paradigm (basically X86 processors using MPI for parallelism), the existing menu of processor choices includes significant diversity, and more is on the horizon. This computational diversity, coupled with ever increasing software complexity, leads to the very real possibility that weather and climate modelling will arrive at a chasm which will separate scientific aspiration from our ability to develop and/or rapidly adapt codes to the available hardware. In this paper we review the hardware and software trends which are leading us towards this chasm, before describing current progress in addressing some of the tools which we may be able to use to bridge the chasm. This brief introduction to current tools and plans is followed by a discussion outlining the scientific requirements for quality model codes which have satisfactory performance and portability, while simultaneously supporting productive scientific evolution. We assert that the existing method of incremental model improvements employing small steps which adjust to the changing hardware environment is likely to be inadequate ", "link": "https://doi.org/10.5194/gmd-11-1799-2018", "authors": "Bryan N. Lawrence, Michael Rezny, Reinhard Budich, Peter Bauer, Jörg Behrens, Mick Carter", "source": "Geoscientific Model Development", "published": "2018-5-8", "first_seen": "2026-11-23T21:25:47+00:00", "score": 16, "topics": ["Climate Modelling"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ms004147", "title": "Estimating Uncertainty in Simulated ENSO Statistics", "summary": "Abstract Large ensembles of model simulations are frequently used to reduce the impact of internal variability when evaluating climate models and assessing climate change induced trends. However, the optimal number of ensemble members required to distinguish model biases and climate change signals from internal variability varies across models and metrics. Here we analyze the mean, variance and skewness of precipitation and sea surface temperature in the eastern equatorial Pacific region often used to describe the El Niño–Southern Oscillation (ENSO), obtained from large ensembles of Coupled model intercomparison project phase 6 climate simulations. Leveraging established statistical theory, we develop and assess equations to estimate, a priori, the ensemble size or simulation length required to limit sampling‐based uncertainties in ENSO statistics to within a desired tolerance. Our results confirm that the uncertainty of these statistics decreases with the square root of the time series length and/or ensemble size. Moreover, we demonstrate that uncertainties of these statistics are generally comparable when computed using either pre‐industrial control or historical runs. This suggests that pre‐industrial runs can sometimes be used to estimate the expected uncertainty of statistics computed from an existing historical member or ensemble, and the number of simulation years (run duration and/or ensemble size) required to adequately characterize the statistic. This advance allows us to use existing simulations (e.g., control runs that are performed during model development) to ", "link": "https://doi.org/10.1029/2023ms004147", "authors": "Yann Y. Planton, Jiwoo Lee, Andrew T. Wittenberg, Peter J. Gleckler, Éric Guilyardi, Shayne McGregor", "source": "Journal of Advances in Modeling Earth Systems", "published": "2024-9", "first_seen": "2026-11-23T21:25:47+00:00", "score": 16, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2025jd044533", "title": "A Double Bright Band Originating From Atmospheric Instability Based on Ka‐Band Radar Observation at Wuhan in China", "summary": "Abstract Using observation from a Ka‐band cloud radar at a midlatitude station, we present a double melting layer (ML) bright band phenomenon in stratiform precipitation, which is found to originate from atmospheric instability rather than warm front passage in earlier reports. In radar observations, a preexisting bright band experiences a descent and then rises back to its initial height after a little while over an hour. During the two transitions, a weak and a strong double bright band occurs, respectively. When the double bright band arises, hydrometeors undergo incomplete melting in the upper ML and subsequently refreeze before entering the lower ML. Reanalysis and radiosonde data show that there is no significant change in the zonal and meridional winds, but a strong updraft is induced due to the occurrence of atmospheric instability. Analysis indicated that the instability is caused by intense atmospheric convergence; in the meantime, there are lots of upward Doppler velocities for hydrometeors in the radar measurement, confirming the occurrence of convection due to the instability. Hence, the expansion effect of updrafts causes cooling, and then, the temperature gradually recovers from the high to low levels as the updrafts weaken and ultimately cease, leading to the thermal inversion layer associated with the double bright band.", "link": "https://doi.org/10.1029/2025jd044533", "authors": "Rang Cao, Kai Ming Huang, Fan Yi, Jun Jie Fang, Zi Rui Zhang, Fang Zheng Cheng", "source": "JGR: Atmospheres", "published": "2025-9-20", "first_seen": "2026-11-23T21:25:47+00:00", "score": 16, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-023-06776-w", "title": "Observed and projected changes in snow accumulation and snowline in California’s snowy mountains", "summary": "Abstract The Sierra Nevada and Southern Cascades—California’s snowy mountains—are primary freshwater sources and natural reservoirs for the states of California and Nevada. These mountains receive precipitation overwhelmingly from wintertime storms including atmospheric rivers (ARs), much of it falling as snow at the higher elevations. Using a seven-decade record of daily observed temperature and precipitation as well as a snow reanalysis and downscaled climate projections, we documented historical and future changes in snow accumulation and snowlines. In four key subregions of California’s snowy mountains, we quantified the progressing contribution of ARs and non-AR storms to the evolving and projected snow accumulation and snowlines (elevation of the snow-to-rain transition), exploring their climatology, variability and trends. Historically, snow makes up roughly a third of the precipitation affecting California’s mountains. While ARs make up only a quarter of all precipitating days and, due to their relative warmth, produce snowlines higher than do other storms, they contribute over 40% of the total seasonal snow. Under projected unabated warming, snow accumulation would decline to less than half of historical by the late twenty-first century, with the greatest snow loss at mid elevations (from 1500 to 3300 m by the mountain sub-regions) during fall and spring. Central and Southern Sierra Nevada peaks above 3400 m might see occasionally extreme snow accumulations in January–February resulting entirely from wetter ARs. AR-related snowlines are projected to increase by mor", "link": "https://doi.org/10.1007/s00382-023-06776-w", "authors": "Tamara Shulgina, Alexander Gershunov, Benjamin J. Hatchett, Kristen Guirguis, Aneesh C. Subramanian, Steven A. Margulis", "source": "Climate Dynamics", "published": "2023-5-25", "first_seen": "2026-11-23T21:25:47+00:00", "score": 16, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2512.11685", "title": "Machine-learned global glacier ice volumes", "summary": "We present a global dataset of glacier ice thickness modeled with IceBoost v2.0, a machine learning model trained on 7 million ice thickness measurements and informed by physical and geometrical predictors. We model the distributed ice thickness for every glacier in the two latest Randolph Glacier Inventory releases (v6.0 and v7.0), totaling 215,547 and 274,531 glacier outlines, respectively, plus 955 ice masses contiguous with the Greenland Ice Sheet. We find a global glacier volume of $(149 \\pm 38)\\times 10^3$ km$^3$, consistent with the previous ensemble estimate of $(147 \\pm 28)\\times 10^3$ km$^3$. The corresponding sea-level equivalent, $323 \\pm 91$ mm, is likewise consistent with the earlier value of $315 \\pm 63$ mm. Compared to measurements, IceBoost error is 20-45% lower than the other solutions in the high Arctic, highlighting the value of machine-learning approaches. Confidence in our solution is highest at higher latitudes. Over mountainous terrain, small glaciers, and under-represented lower-latitude regions, confidence is lower. IceBoost v2.0 demonstrates strong generalization at ice sheet margins. On the Geikie Plateau (East Greenland), we find nearly twice as much ice as previously reported, highlighting the method's potential to infer bed topography in parts of the ice sheets. The quality of the solutions depends on the accuracy of the training data, the Digital Elevation Model, ice velocity fields, and glacier geometries, including nunataks. Using the Jensen Gap, we probe the model's curvature with respect to input errors and find it is strongly concave ove", "link": "https://arxiv.org/abs/2512.11685", "authors": "N. Maffezzoli, E. Rignot, C. Barbante, M. Morlighem, T. Petersen, S. Vascon", "source": "arXiv", "published": "2025-12-12T16:07:00Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 15, "topics": ["Deep Learning"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-10-889-2017", "title": "The DeepMIP contribution to PMIP4: experimental design for model simulations of the EECO, PETM, and pre-PETM (version 1.0)", "summary": "Abstract. Past warm periods provide an opportunity to evaluate climate models under extreme forcing scenarios, in particular high ( > 800 ppmv) atmospheric CO2 concentrations. Although a post hoc intercomparison of Eocene ( ∼ 50 Ma) climate model simulations and geological data has been carried out previously, models of past high-CO2 periods have never been evaluated in a consistent framework. Here, we present an experimental design for climate model simulations of three warm periods within the early Eocene and the latest Paleocene (the EECO, PETM, and pre-PETM). Together with the CMIP6 pre-industrial control and abrupt 4 × CO2 simulations, and additional sensitivity studies, these form the first phase of DeepMIP – the Deep-time Model Intercomparison Project, itself a group within the wider Paleoclimate Modelling Intercomparison Project (PMIP). The experimental design specifies and provides guidance on boundary conditions associated with palaeogeography, greenhouse gases, astronomical configuration, solar constant, land surface processes, and aerosols. Initial conditions, simulation length, and output variables are also specified. Finally, we explain how the geological data sets, which will be used to evaluate the simulations, will be developed.", "link": "https://doi.org/10.5194/gmd-10-889-2017", "authors": "Daniel J. Lunt, Matthew Huber, Eleni Anagnostou, Michiel L. J. Baatsen, Rodrigo Caballero, Rob DeConto", "source": "Geoscientific Model Development", "published": "2017-2-23", "first_seen": "2026-11-23T21:25:47+00:00", "score": 15, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2018ms001603", "title": "The DOE E3SM Coupled Model Version 1: Overview and Evaluation at Standard Resolution", "summary": "Abstract This work documents the first version of the U.S. Department of Energy (DOE) new Energy Exascale Earth System Model (E3SMv1). We focus on the standard resolution of the fully coupled physical model designed to address DOE mission‐relevant water cycle questions. Its components include atmosphere and land (110‐km grid spacing), ocean and sea ice (60 km in the midlatitudes and 30 km at the equator and poles), and river transport (55 km) models. This base configuration will also serve as a foundation for additional configurations exploring higher horizontal resolution as well as augmented capabilities in the form of biogeochemistry and cryosphere configurations. The performance of E3SMv1 is evaluated by means of a standard set of Coupled Model Intercomparison Project Phase 6 (CMIP6) Diagnosis, Evaluation, and Characterization of Klima simulations consisting of a long preindustrial control, historical simulations (ensembles of fully coupled and prescribed SSTs) as well as idealized CO 2 forcing simulations. The model performs well overall with biases typical of other CMIP‐class models, although the simulated Atlantic Meridional Overturning Circulation is weaker than many CMIP‐class models. While the E3SMv1 historical ensemble captures the bulk of the observed warming between preindustrial (1850) and present day, the trajectory of the warming diverges from observations in the second half of the twentieth century with a period of delayed warming followed by an excessive warming trend. Using a two‐layer energy balance model, we attribute this divergence to the model's stro", "link": "https://doi.org/10.1029/2018ms001603", "authors": "Jean‐Christophe Golaz, Peter M. Caldwell, Luke P. Van Roekel, Mark R. Petersen, Qi Tang, Jonathan D. Wolfe", "source": "Journal of Advances in Modeling Earth Systems", "published": "2019-7", "first_seen": "2026-11-23T21:25:47+00:00", "score": 15, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/2017ms001157", "title": "The Role of Convective Gustiness in Reducing Seasonal Precipitation Biases in the Tropical West Pacific", "summary": "Abstract Precipitation is an important climate quantity that is critically relevant to society. In spite of intense efforts, significant precipitation biases remain in most climate models. One pervasive and persistent bias found in many general circulation models occurs in the Tropical West Pacific where northern hemisphere summer‐time precipitation is often underestimated compared to observations. Using the DOE‐E3SM model, the inclusion of a missing process, convective gustiness, is shown to reduce those biases through a net increase in surface evaporation. Gustiness in surface wind fields is assumed to arise empirically in proportion to the intensity of convective precipitation. The increased evaporation can be treated as an increase in the moist static energy forcing into the atmosphere. A Normalized Gross Moist Stability (NGMS) framework (which characterizes the relationship between convective forcing and convective response) is used to explore the processes responsible for the precipitation bias, and the impact of the gustiness parameterization in reducing that bias. Because the NGMS of the Tropical West Pacific is less than unity in the E3SMv1 model, the increase in energy forcing amplifies the increase in precipitation to exceed that of the evaporative flux. Convective gustiness favors increased precipitation in regions where the resolved surface winds are weak and convection is present.", "link": "https://doi.org/10.1002/2017ms001157", "authors": "Bryce E. Harrop, Po‐Lun Ma, Philip J. Rasch, Richard B. Neale, Cecile Hannay", "source": "Journal of Advances in Modeling Earth Systems", "published": "2018-4", "first_seen": "2026-11-23T21:25:47+00:00", "score": 15, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-024-00624-2", "title": "Future drought risk and adaptation of pastoralism in Eurasian rangelands", "summary": "Abstract Drought risk threatens pastoralism in rangelands, which are already under strain from climatic and socioeconomic changes. We examine the future drought risk (2031–2060 and 2071–2100) to rangeland productivity across Eurasia (West, Central, and East Asia) using a well-tested process-based ecosystem model and projections of five climate models under three shared socioeconomic pathway (SSP) scenarios of low (SSP1−2.6), medium (SSP3−7.0), and high (SSP5−8.5) warming relative to 1985–2014. We employ a probabilistic approach, with risk defined as the expected productivity loss induced by the probability of hazardous droughts (determined by a precipitation-based index) and vulnerability (the response of rangeland productivity to hazardous droughts). Drought risk and vulnerability are projected to increase in magnitude and area across Eurasian rangelands, with greater increases in 2071–2100 under the medium and high warming scenarios than in 2031–2060. Increasing risk in West Asia is caused by longer and more intense droughts and vulnerability, whereas higher risk in Central and East Asia is mainly associated with increased vulnerability, indicating overall risk is higher where vulnerability increases. These findings suggest that future droughts may exacerbate livestock feed shortages and negatively impact pastoralism. The results have practical implications for rangeland management that should be adapted to the ecological and socioeconomic contexts of the different countries in the region. Existing traditional ecological knowledge can be promoted to adapt to drought risk ", "link": "https://doi.org/10.1038/s41612-024-00624-2", "authors": "Banzragch Nandintsetseg, Jinfeng Chang, Omer L. Sen, Christopher P. O. Reyer, Kaman Kong, Omer Yetemen", "source": "npj Climate and Atmospheric Science", "published": "2024-3-29", "first_seen": "2026-11-23T21:25:47+00:00", "score": 15, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/waf-d-25-0239.1", "title": "Application of ALADIN Model Outputs for Solid Precipitation Forecasting and Detection", "summary": "Abstract Meteorological services face a major challenge in providing reliable snowfall forecasts and detecting solid precipitation, as precise data are needed for weather warnings, damage assessments, hydrological modeling, and many other tasks. This study evaluates the skill of the Aire Limitée Adaptation Dynamique Développement International (ALADIN) numerical weather prediction model in solid precipitation forecasting at 126 stations of the Czech Hydrometeorological Institute (CHMI) between August 2019 and July 2025. Model performance was assessed against quality-controlled human present weather observations using common verification metrics, including the probability of detection (POD), false alarm ratio (FAR), critical success index (CSI), and Heidke skill score (HSS). Further, the ALADIN_SN weighted index of solid precipitation occurrence was assimilated from ALADIN snow forecasts in hourly intervals using two sets of empirical lead-time-dependent weights. During the snow season, ALADIN_SN showed a mean POD of 0.68, FAR of 0.48, and HSS of 0.53, with an overall accuracy exceeding 83% at all stations. Air temperature is the most important variable affecting the model performance, with better results at temperatures below approximately +2°C. The skill of ALADIN_SN also improved with increasing solid precipitation intensity and duration. Case studies demonstrated that ALADIN_SN successfully captured large-scale snowfall events associated with synoptic systems but struggled with localized or short-lived precipitation and phase transitions at temperatures above freezing, a", "link": "https://doi.org/10.1175/waf-d-25-0239.1", "authors": "Klára Čížková, Radim Tolasz, Radmila Brožková, David Tichopád, Veronika Šustková, Miroslav Řepka", "source": "Weather and Forecasting", "published": "2026-11", "first_seen": "2026-11-23T21:25:47+00:00", "score": 15, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.16255", "title": "HybridCT: ML Accelerated Tomography for Climate Relevant 3D Cloud Observations", "summary": "Low-level clouds are one of the largest sources of uncertainty in climate predictions, partly because we lack detailed three-dimensional (3D) measurements of their internal structure. Here, we present HybridCT, a cloud tomographic reconstruction scheme accelerated by machine learning (ML) that recovers 3D cloud extinction directly from passive multi-angle observations. An ML emulator maps radiances from multiple viewing angles to cloud optical thickness (COT), producing path-integrated projections, and a Simultaneous Algebraic Reconstruction Technique (SART) explicitly inverts these projections to retrieve 3D extinction. Training observations are generated from synthetic 3D cloud fields using radiative transfer simulations for nine viewing angles between $\\pm$70$^{\\circ}$. HybridCT reconstructs extinction with RMSE 13.3 km$^{-1}$ in 3.5 s, compared to 22.7 km$^{-1}$ in approx. 30 min for the state-of-the-art physics-based tomography framework AT3D, a speedup exceeding 500$\\times$. HybridCT thus provides a scalable route toward large-scale observations of 3D cloud structure relevant to radiative-budget interpretation and evaluation of high-resolution cloud simulations.", "link": "https://arxiv.org/abs/2611.16255", "authors": "Linda Forster, Nicholas J. LaHaye, Marcin J. Kurowski, Anna Jungbluth, Bernhard Mayer, Anthony B. Davis", "source": "arXiv", "published": "2026-11-12T03:57:26Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 14, "topics": ["Deep Learning"], "watch": [], "boosts": ["emulator", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ms003700", "title": "The Green's Function Model Intercomparison Project (GFMIP) Protocol", "summary": "Abstract The atmospheric Green's function method is a technique for modeling the response of the atmosphere to changes in the spatial field of surface temperature. While early studies applied this method to changes in atmospheric circulation, it has also become an important tool to understand changes in radiative feedbacks due to evolving patterns of warming, a phenomenon called the “pattern effect.” To better study this method, this paper presents a protocol for creating atmospheric Green's functions to serve as the basis for a model intercomparison project, GFMIP. The protocol has been developed using a series of sensitivity tests performed with the HadAM3 atmosphere‐only general circulation model, along with existing and new simulations from other models. Our preliminary results have uncovered nonlinearities in the response of the atmosphere to surface temperature changes, including an asymmetrical response to warming versus cooling patch perturbations, and a change in the dependence of the response on the magnitude and size of the patches. These nonlinearities suggest that the pattern effect may depend on the heterogeneity of warming as well as its location. These experiments have also revealed tradeoffs in experimental design between patch size, perturbation strength, and the length of control and patch simulations. The protocol chosen on the basis of these experiments balances scientific utility with the simulation time and setup required by the Green's function approach. Running these simulations will further our understanding of many aspects of atmospheric response,", "link": "https://doi.org/10.1029/2023ms003700", "authors": "Jonah Bloch‐Johnson, Maria A. A. Rugenstein, Marc J. Alessi, Cristian Proistosescu, Ming Zhao, Bosong Zhang", "source": "Journal of Advances in Modeling Earth Systems", "published": "2024-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 14, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2026jh001400", "title": "HiResCastNet: A 3D Deep Learning Model for Probabilistic Regional High‐Resolution Subseasonal Forecasting Through Downscaling", "summary": "High‐resolution subseasonal forecasts, spanning two to 6 weeks, play a vital role in bridging the gap between short‐range forecasts and seasonal predictions. They provide crucial information for decision‐making in disaster and hazard preparedness, early warning systems, water resource management, and renewable energy. However, generating subseasonal forecasts at high spatial and temporal resolutions remains a significant challenge. Global subseasonal forecasting systems such as European Center for Medium‐Range Weather Forecasts (ECMWF) typically provide outputs at a coarse spatial resolution of about 31 km and a temporal resolution of 12 hr, which limits their usefulness for regional‐scale planning and impact assessments. Our three‐dimensional (3D) high‐resolution regional subseasonal forecasts are generated by dynamically downscaling the ECMWF subseasonal forecasts using the Weather Research and Forecasting (WRF) model, producing outputs at a spatial resolution of 4 km and a temporal resolution of 3 hr. Yet, the dynamical downscaling model is computationally very demanding, especially when using multiple ensemble members. To address this limitation, we introduce HiResCastNet, a data‐driven, probabilistic downscaling framework combining Swin‐transformer and a diffusion model, which serves as an efficient surrogate for the traditional downscaling system. HiResCastNet takes spatio‐temporal coarse resolution forecasts from ECMWF subseasonal system as inputs, and generates 3D high‐resolution forecasts at 4 km spatial resolution and 3‐hourly intervals. Our results suggest that H", "link": "https://doi.org/10.1029/2026jh001400", "authors": "Sofien Resifi, Elissar Al Aawar, T. Luong, I. Hoteit", "source": "Journal of Geophysical Research", "published": "2026-10-31", "first_seen": "2026-11-23T21:44:54+00:00", "score": 97, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": ["diffusion model"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1029/2026jh001290", "title": "High‐Resolution Downscaling of a Lightweight Climate Emulator Using Diffusion‐Based Super‐Resolution", "summary": "High‐resolution climate fields are essential for the assessment of their regional and local effects. Current global climate models, along with being computationally expensive, are often too coarse for applications that depend on local extremes and orographic gradients. Machine learning offers a computationally efficient route for both climate emulation and super‐resolution from coarse simulations to finer spatial scales. Therefore, we develop a data‐driven downscaling framework for the Lightweight Uncoupled ClImate Emulator (LUCIE), a lightweight Spherical Fourier Neural Operator climate emulator introduced by Guan et al. (2025, https://doi.org/10.1029/2025ms005152 ). We compare deterministic super‐resolution baselines, including a U‐Net and Spherical Fourier Neural Operator (SFNO), with two probabilistic diffusion formulations: a conditional Elucidated Diffusion Model and a diffusion‐posterior‐sampling approach. The models are trained on 6‐hourly ERA5 reanalysis fields from 2000 to 2009 and evaluated on out‐of‐sample LUCIE predictions from 2010 to 2018, downscaling coarse emulator states to km resolution. Performance is assessed against ERA5 using latitude‐weighted root mean square error (RMSE), power spectra, probability density functions, and the leading Empirical Orthogonal Function of zonal wind. These diagnostics test whether deterministic and probabilistic super‐resolution models can recover fine‐scale climatological statistics, high‐wavenumber variability, and dominant modes with an imperfect coarse emulator. Our results characterize the strengths and limitations of", "link": "https://doi.org/10.1029/2026jh001290", "authors": "Hai-Wen Guan, Dibyajyoti Chakraborty, Moein Darman, Troy Arcomano, Ashesh Chattopadhyay, Romit Maulik", "source": "Journal of Geophysical Research", "published": "2026-10-01", "first_seen": "2026-11-23T21:44:54+00:00", "score": 97, "topics": ["Downscaling", "Deep Learning", "Climate Modelling"], "watch": [], "boosts": ["extreme", "diffusion model", "emulator"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1038/s41598-026-80185-x", "title": "Trade-offs in deep learning approaches for precipitation downscaling across weather regimes", "summary": "Accurate high-resolution precipitation information is critical for assessing hydrological extremes and climate change impacts in complex topographic regions. While machine learning-based downscaling provides a computationally efficient alternative to dynamical models, its performance can depend on regional climate characteristics and terrain complexity. In this study, we systematically benchmarked representative deep learning approaches for daily statistical downscaling over Japan, including quantile-based and stochastic CNN formulations, two- (2D) and three-dimensional (3D) U-Net variants, and a diffusion-based generative model, alongside conventional baselines. Model performance was evaluated using comprehensive statistical and spatial metrics under both climatological and typhoon-affected conditions, enabling us to assess model robustness under extreme precipitation regimes. We further developed a proof-of-concept forecasting configuration for 3D U-Net prediction of next-day precipitation from short predictor sequences, together with an extreme super-resolution experiment to assess scalability to very high target resolutions. The results revealed clear trade-offs: quantile mapping best reproduced distributional properties, deterministic CNNs performed particularly well for standard deterministic metrics, the stochastic CNN achieved the highest average neighborhood-scale skill, and the diffusion model best reproduced the spatial power spectrum, while U-Nets tended to smooth small scales. Nevertheless, the asymmetric-loss U-Net provided the most robust performance during t", "link": "https://doi.org/10.1038/s41598-026-80185-x", "authors": "Alessandro Damiani, N. Ishizaki, R. Cordero, S. Feron", "source": "Scientific Reports", "published": "2026-11-11", "first_seen": "2026-11-23T21:44:54+00:00", "score": 95, "topics": ["Downscaling", "Deep Learning"], "watch": [], "boosts": ["precipitation", "extreme", "diffusion model"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.1029/2026ea005059", "title": "Zero‐Shot Transferability of Deep Learning Models for Precipitation Super‐Resolution Across Diverse Climate Regimes", "summary": "High‐resolution precipitation fields are essential for characterizing climate extremes, assessing sectoral impacts, and improving early warning systems. However, the resolution of global Earth system models (ESMs) and numerical weather prediction (NWP) systems remains limited by computational constraints. This study assesses the zero‐shot transferability of deep learning (DL)‐based super‐resolution (SR) models for precipitation across diverse geographic domains, data sources, and temporal scales. A suite of DL‐based SR architectures, ranging from convolutional baselines to spatial‐attention‐based generative models, is trained on a limited regional observational record of satellite‐derived precipitation from three monsoon‐dominated regions of the Indian subcontinent during 2001–2014. DL model generalization is assessed through out‐of‐sample transfer across climatically diverse domains using observations (2015–2023), NWP forecasts (2018–2023), and a 150‐year ESM simulation spanning 1950–2100, all without retraining or fine‐tuning. Across tropical, subtropical, and mid‐latitude climate regimes, the models show strong zero‐shot transferability, achieving Kling‐Gupta efficiency (KGE) scores approximately 0.85 or higher. Skill gains are evident in fine‐scale spatial variability and extreme precipitation statistics that are poorly represented in the coarse‐resolution inputs. Cross‐source application to weather forecasts and long‐term climate simulations further demonstrates the applicability of SR models across differing forcing data and evolving climate conditions. While differen", "link": "https://doi.org/10.1029/2026ea005059", "authors": "Midhun Murukesh, Pankaj Kumar", "source": "Earth and Space Science", "published": "2026-10-01", "first_seen": "2026-11-23T21:44:54+00:00", "score": 92, "topics": ["Deep Learning", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["india", "monsoon", "precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "rec", "pick": null, "cites": null}, {"key": "doi:10.5194/gmd-19-9235-2026", "title": "China regional 3 km downscaling based on residual Corrective Diffusion model", "summary": "A fundamental challenge in numerical weather prediction is efficiently producing high-resolution forecasts. A widely adopted solution is to downscale coarser global model outputs. This study focuses on statistical downscaling, which uses historical data to learn mappings between low- and high-resolution meteorological fields. Deep learning has become a key tool for this, enabling powerful super-resolution models like diffusion models and Generative Adversarial Networks for downscaling applications. Herein, we leverage CorrDiff, a diffusion-based downscaling framework, with three key enhancements relative to its original implementation. First, the study domain is expanded to nearly 40 times the spatial extent of the original version. Second, the scope of target downscaling variables is extended beyond surface variables to incorporate upper-air variables across six pressure levels. Third, a global residual connection is integrated to further boost prediction accuracy. To produce 3 km resolution forecasts for the China region, the trained CorrDiff model is applied to 25 km global grid forecasts derived from two sources: a conventional global numerical weather prediction model and a deep learning-based weather model developed using Spherical Fourier Neural Operators. The China Meteorological Administration Mesoscale Model (CMA-MESO) is selected as the baseline for comparative evaluation. Experimental results demonstrate that the downscaled forecasts generated by our framework outperform the direct forecasts of CMA-MESO for almost all target variables, as quantified by the Mean ", "link": "https://doi.org/10.5194/gmd-19-9235-2026", "authors": "Hong-Lu Sun, Hao Jing, Zhi-Xiang Dai, Sa Xiao, Wei Xue, Jian Sun, Qi-Feng Lu", "source": "Geoscientific Model Development", "published": "2026-09-29", "first_seen": "2026-11-23T21:44:54+00:00", "score": 92, "topics": ["Downscaling", "Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts":
