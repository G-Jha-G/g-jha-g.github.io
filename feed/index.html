over the tropics and subtropics with simultaneous increases in 0–6 km wind shear (BS06). Conversely, rawinsonde observations paint a different picture across the mid-latitudes with increasing CAPE and significant decreases to BS06. Differing trends and disagreement between ERA5 and rawinsondes observed over some regions suggest that results should be interpreted with caution, especially for CAPE and CP across tropics where uncertainty is the highest and reliable long-term rawinsonde observations are missing.", "link": "https://doi.org/10.1038/s41612-021-00190-x", "authors": "Mateusz Taszarek, John T. Allen, Mattia Marchio, Harold E. Brooks", "source": "npj Climate and Atmospheric Science", "published": "2021-6-11", "first_seen": "2026-11-23T21:25:47+00:00", "score": 43, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme", "uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-7-65-2026", "title": "Storm Boris (2024) in the current and future climate: a dynamics-centered contextualization, and some lessons learnt", "summary": "The response of mean and extreme precipitation to anthropogenic global warming stems both from warming of the troposphere and dynamical changes in the large-scale circulation, especially upward motions. The interaction between these two components complicates future projections and makes the attribution of extreme precipitation events challenging, both using conditional (e.g., analog-based) and unconditional (e.g., extreme value theory-based) methods. In this study we reflect upon this problem and propose some possible solutions to tackle it starting from the case study of Storm Boris, that led to major floods over central Europe in mid-September 2024. The first step is the identification of key circulation features associated with the event, whose representation is deemed crucial to obtain realistic analogs: the presence of a slow-moving, upper-level potential vorticity (PV) cutoff, the peculiar track of the surface cyclone associated with Boris, and the presence of anomalously strong forcing for ascent. Circulation analogs of Boris are then identified in a large ensemble of present-day and future-climate simulations with the CESM1 model, to understand how “Boris-like” storms will change in an end-of-the-century high warming scenario. We find that the combined use of upper-level PV and of a surface cyclone identification algorithm substantially improves the quality of the analogs, both in terms of the large-scale flow pattern and the precipitation associated with the cyclone. Analogs of Boris restricted to the same season in a warmer climate feature on average less precipi", "link": "https://doi.org/10.5194/wcd-7-65-2026", "authors": "Jacopo Riboldi, Robin Noyelle, Ellina Agayar, Hanin Binder, Marc Federer, Katharina Hartmuth", "source": "Weather and Climate Dynamics", "published": "2026-1-12", "first_seen": "2026-11-23T21:25:47+00:00", "score": 43, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-2-129-2021", "title": "A global climatological perspective on the importance of Rossby wave breaking and intense moisture transport for extreme precipitation events", "summary": "Extreme precipitation events (EPEs) frequently cause flooding with dramatic socioeconomic impacts in many parts of the world. Previous studies considered two synoptic-scale processes, Rossby wave breaking and intense moisture transport, typically in isolation, and their linkage to such EPEs in several regions. This study presents for the first time a global and systematic climatological analysis of these two synoptic-scale processes, in tandem and in isolation, for the occurrence of EPEs. To this end, we use 40-year ERA-Interim reanalysis data (1979–2018) and apply object-based identification methods for (i) daily EPEs, (ii) stratospheric potential vorticity (PV) streamers as indicators of Rossby wave breaking, and (iii) structures of high vertically integrated horizontal water vapour transport (IVT). First, the importance of these two synoptic-scale processes is demonstrated by case studies of previously documented flood events that inflicted catastrophic impacts in different parts of the world. Next, a climatological quantification shows that Rossby wave breaking is associated with > 90 % of EPEs over central North America and the Mediterranean, whereas intense moisture transport is linked to > 95 % of EPEs over many coastal zones, consistent with findings of atmospheric river-related studies. Combined Rossby wave breaking and intense moisture transport contributes up to 70 % of EPEs in several subtropical and extratropical regions, including (semi)arid desert regions where tropical–extratropical interactions are of key importance for (heavy) rainfall. Odds ratios of EPEs", "link": "https://doi.org/10.5194/wcd-2-129-2021", "authors": "Andries Jan de Vries", "source": "Weather and Climate Dynamics", "published": "2021-3-9", "first_seen": "2026-11-23T21:25:47+00:00", "score": 43, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.4506", "title": "Extreme precipitation at Padang, Sumatra triggered by convectively coupled Kelvin waves", "summary": "Abstract Convectively coupled Kelvin waves (CCKWs) are tropical weather systems that travel eastward along the equatorial waveguide and have previously been linked to 90% of flooding events in Sumatra, Indonesia. Here, the processes through which CCKWs influence convection to produce extreme precipitation are investigated, with a focus on Padang, a city on the west coast of Sumatra. Extreme precipitation days at Padang, defined as days when the daily total precipitation exceeds the percentile, are found to be 59% more likely to occur given the presence of a CCKW. We find that CCKWs modulate the diurnal cycle to produce extreme precipitation. This is achieved firstly through providing low‐level moisture and convergence that acts to couple the Kelvin wave to the convection. Secondly, the CCKW acts to displace the convergence zone towards Padang, such that it experiences rainfall that persists throughout the night and peaks the following day in the early evening. We examine the case study of a CCKW that passed over Padang on August 21, 2017, bringing extreme precipitation that led to flooding in the West Sumatra region, recording a maximum daily accumulated rainfall of 137 mm. This case study showed remarkably similar characteristics in its propagation, structure, and precipitation patterns to composite studies of CCKWs. The performance of a suite of convection‐permitting configurations of the UK Met Office Unified Model (MetUM), embedded within a parameterised convection global model, in forecasting this CCKW is evaluated. In general, all configurations of the model capture t", "link": "https://doi.org/10.1002/qj.4506", "authors": "Natasha V. Senior, Adrian J. Matthews, Benjamin G. M. Webber, Stuart Webster, Richard W. Jones, Donaldi S. Permana", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2023-7", "first_seen": "2026-11-23T21:25:47+00:00", "score": 43, "topics": ["Climate Modelling"], "watch": [], "boosts": ["india", "precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2020ms002162", "title": "Unified Entrainment and Detrainment Closures for Extended Eddy‐Diffusivity Mass‐Flux Schemes", "summary": "Abstract We demonstrate that an extended eddy‐diffusivity mass‐flux (EDMF) scheme can be used as a unified parameterization of subgrid‐scale turbulence and convection across a range of dynamical regimes, from dry convective boundary layers, through shallow convection, to deep convection. Central to achieving this unified representation of subgrid‐scale motions are entrainment and detrainment closures. We model entrainment and detrainment rates as a combination of turbulent and dynamical processes. Turbulent entrainment/detrainment is represented as downgradient diffusion between plumes and their environment. Dynamical entrainment/detrainment is proportional to a ratio of a relative buoyancy of a plume and a vertical velocity scale, that is modulated by heuristic nondimensional functions which represent their relative magnitudes and the enhanced detrainment due to evaporation from clouds in drier environment. We first evaluate the closures offline against entrainment and detrainment rates diagnosed from large‐eddy simulations (LES) in which tracers are used to identify plumes, their turbulent environment, and mass and tracer exchanges between them. The LES are of canonical test cases of a dry convective boundary layer, shallow convection, and deep convection, thus spanning a broad range of regimes. We then compare the LES with the full EDMF scheme, including the new closures, in a single column model (SCM). The results show good agreement between the SCM and LES in quantities that are key for climate models, including thermodynamic profiles, cloud liquid water profiles, and ", "link": "https://doi.org/10.1029/2020ms002162", "authors": "Yair Cohen, Ignacio Lopez‐Gomez, Anna Jaruga, Jia He, Colleen M. Kaul, Tapio Schneider", "source": "Journal of Advances in Modeling Earth Systems", "published": "2020-9", "first_seen": "2026-11-23T21:25:47+00:00", "score": 42, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022ef002830", "title": "Projected Changes in Increased Drought Risks Over South Asia Under a Warmer Climate", "summary": "Abstract Every year, millions of people are at risk due to droughts in South Asia (SA). The likely impacts of droughts are projected to increase with global warming. This study uses the new ensemble mean of 23 global climate models from the Coupled Model Intercomparison Project phase 6 (CMIP6), population and gross domestic product (GDP) projections to quantify future changes in increasing drought risks and associated socioeconomic exposure across SA and its subregions under 1.5°C and 2°C of warming. We used two shared socioeconomic pathways (SSPs), SSP2‐4.5 and SSP5‐8.5. The most likely realization copula functions are used to model the joint distribution of drought severity and duration. Simultaneously, changes in the bivariate return period are calculated under a warming climate. The frequency of 50‐year historical droughts (under a bivariate framework) might double across 80% of the SA land area under 1.5°C of warming. Conversely, 12% of SA landmasses may suffer extreme droughts under 2°C of warming. The severe drought episode frequency is expected to increase under 1.5°C (40%–75%) and 2°C (60%–90%) of warming relative to the recent climate. The largest exposure increase is projected in R2 and R4, then R1. Additionally, 75% (65%) of the SA population (GDP) could suffer from increased drought risks under the 1.5°C warmer climate, whereas the additional 0.5°C warming will lead to an unbearable regional situation. Limiting global warming to 1.5°C compared with 2°C can significantly reduce the drought risk influence in SA. These findings can help disaster‐risk managers to a", "link": "https://doi.org/10.1029/2022ef002830", "authors": "Irfan Ullah, Xieyao Ma, Temesgen Gebremariam Asfaw, Jun Yin, Vedaste Iyakaremye, Farhan Saleem", "source": "Earth's Future", "published": "2022-10", "first_seen": "2026-11-23T21:25:47+00:00", "score": 42, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2022jd037097", "title": "Hydroclimatology and Hydrometeorology of Flooding Over the Eastern Tibetan Plateau", "summary": "Abstract The hydroclimatology and hydrometeorology of flooding over the Third Pole region is poorly understood, despite its societal and environmental significance. Here we examine extreme rainfall and flooding over the eastern Tibetan Plateau (TP) based on empirical analyses of long‐term, in‐situ rainfall and stream gaging observations as well as the ECMWF Reanalysis fields. We develop a flood catalog that consists of 168 extreme rainfall‐runoff floods over the eastern TP, and characterize the synoptic conditions for flood‐producing storms based on the principal component analysis. We show the transitional pattern form Asian summer monsoons to midlatitude systems as the most frequent synoptic conditions for flooding over the eastern TP. The interplay between complex terrains and moisture transport determines the contrasting flood characteristics (in terms of intensity and spatial pattern) under different synoptic environments. We carry out high‐resolution Weather Research and Forecasting modeling analysis for four flood‐producing storms over the eastern TP. We highlight the interaction of complex terrains and nocturnal low level jets as the key mesoscale ingredients in dictating a pronounced diurnal cycle of extreme rainfall over the southeastern portion of TP. Our results establish the link between large‐scale synoptic environment, mesoscale process, and regional flood hydrology over the eastern TP, and therefore contribute to improved flood risk management practices over the Third Pole region under a changing climate.", "link": "https://doi.org/10.1029/2022jd037097", "authors": "Long Yang, Jie Ma, Xianyan Wang, Fuqiang Tian", "source": "JGR: Atmospheres", "published": "2022-8-7", "first_seen": "2026-11-23T21:25:47+00:00", "score": 42, "topics": ["Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1038/s41612-023-00458-4", "title": "Drought characteristics in Mediterranean under future climate change", "summary": "Abstract The present work aims to address the physical properties of different drought types under near-future climates in the Mediterranean. To do so, we use a multi-model mean of the bias-adjusted and downscaled product of five Earth System Models participating in the Coupled Model Intercomparison Project—phase6 (CMIP6), provided by Inter-Sectoral Impact Model Intercomparison Project (ISIMIP), under four shared socioeconomic pathways (SSP1–2.6, SSP2–4.5, SSP3–7.0, and SSP5–8.5) for the period 2021–2060, to estimate the Standardized Precipitation Evapotranspiration Index (SPEI) at 1-, 6-, and 12-month time scales, and address the meteorological, agricultural, and hydrological drought, respectively. Additionally, SPEI is calculated from the bias-adjusted CMIP6 historical simulations and the reanalysis ‘WFDE5’ for 1980–2014 as a historical and reference period. The comparison of the CMIP6 with WFDE5 reveals a consistently increasing tendency for drought occurrences in the Mediterranean, particularly for agricultural and hydrological drought time scales. Nonetheless, an overestimation in historical trend magnitude is shown by the CMIP6 with respect to WFDE5. The projection results depict drought frequencies ranging between 12 and 25% of the studied period 2021–2060, varying with regions and climate scenarios. The tendency to increase the drought frequency is more pronounced in the southern than northern Mediterranean countries. Drought severity is remarkable in the aggregated time scales; consequently, more pressure is foreseen in the food and water sectors. Drought seasonali", "link": "https://doi.org/10.1038/s41612-023-00458-4", "authors": "Yassmin H. Essa, Martin Hirschi, Wim Thiery, Ahmed M. El-Kenawy, Chunxue Yang", "source": "npj Climate and Atmospheric Science", "published": "2023-9-7", "first_seen": "2026-11-23T21:25:47+00:00", "score": 42, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr3146.1", "title": "Object-Based Verification of Precipitation Forecasts. Part II: Application to Convective Rain Systems", "summary": "Abstract The authors develop and apply an algorithm to define coherent areas of precipitation, emphasizing mesoscale convection, and compare properties of these areas with observations obtained from NCEP stage-IV precipitation analyses (gauge and radar combined). In Part II, fully explicit 12–36-h forecasts of rainfall from the Weather Research and Forecasting model (WRF) are evaluated. These forecasts are integrated on a 4-km mesh without a cumulus parameterization. Rain areas are defined similarly to Part I, but emphasize more intense, smaller areas. Furthermore, a time-matching algorithm is devised to group spatially and temporally coherent areas into rain systems that approximate mesoscale convective systems. In general, the WRF model produces too many rain areas with length scales of 80 km or greater. Rain systems typically last too long, and are forecast to occur 1–2 h later than observed. The intensity distribution among rain systems in the 4-km forecasts is generally too broad, especially in the late afternoon, in sharp contrast to the intensity distribution obtained on a coarser grid with parameterized convection in Part I. The model exhibits the largest positive size and intensity bias associated with systems over the Midwest and Mississippi Valley regions, but little size bias over the High Plains, Ohio Valley, and the southeast United States. For rain systems lasting 6 h or more, the critical success index for matching forecast and observed rain systems agrees closely with that obtained in a related study using manually determined rain systems.", "link": "https://doi.org/10.1175/mwr3146.1", "authors": "Christopher Davis, Barbara Brown, Randy Bullock", "source": "Monthly Weather Review", "published": "2006-7-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 42, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-16-179-2023", "title": "The Euro-Mediterranean Center on Climate Change (CMCC) decadal prediction system", "summary": "Decadal climate predictions, obtained by constraining the initial condition of a dynamical model through a truthful estimate of the observed climate state, provide an accurate assessment of near-term climate change and are a useful tool to inform decision-makers on future climate-related risks. Here we present results from the CMIP6 (Coupled Model Intercomparison Project Phase 6) Decadal Climate Prediction Project (DCPP) decadal hindcasts produced with the operational CMCC (Euro-Mediterranean Center on Climate Change) decadal prediction system (DPS), based on the fully coupled CMCC-CM2-SR5 dynamical model. A 20-member suite of 10-year retrospective forecasts, initialized every year from 1960 to 2020, is performed using a full-field initialization strategy. The predictive skill for key variables is assessed and compared with the skill of an ensemble of non-initialized historical simulations so as to quantify the added value of the initialization. In particular, the CMCC DPS is able to skillfully reproduce past climate surface and subsurface temperature fluctuations over large parts of the globe. The North Atlantic Ocean is the region that benefits the most from initialization, with the largest skill enhancement occurring over the subpolar region compared to historical simulations. On the other hand, the predictive skill over the Pacific Ocean rapidly decays with forecast time, especially over the North Pacific. In terms of precipitation, the skill of the CMCC DPS is significantly higher than that of the historical simulations over a few specific regions, including the Sahel,", "link": "https://doi.org/10.5194/gmd-16-179-2023", "authors": "Dario Nicolì, Alessio Bellucci, Paolo Ruggieri, Panos J. Athanasiadis, Stefano Materia, Daniele Peano", "source": "Geoscientific Model Development", "published": "2023-1-5", "first_seen": "2026-11-23T21:25:47+00:00", "score": 41, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-22-0010.1", "title": "Modeling Spatial Distribution of Snow Water Equivalent by Combining Meteorological and Satellite Data with Lidar Maps", "summary": "Abstract An accurate characterization of the water content of snowpack, or snow water equivalent (SWE), is necessary to quantify water availability and constrain hydrologic and land surface models. Recently, airborne observations (e.g., lidar) have emerged as a promising method to accurately quantify SWE at high resolutions (scales of ∼100 m and finer). However, the frequency of these observations is very low, typically once or twice per season in the Rocky Mountains of Colorado. Here, we present a machine learning framework that is based on random forests to model temporally sparse lidar-derived SWE, enabling estimation of SWE at unmapped time points. We approximated the physical processes governing snow accumulation and melt as well as snow characteristics by obtaining 15 different variables from gridded estimates of precipitation, temperature, surface reflectance, elevation, and canopy. Results showed that, in the Rocky Mountains of Colorado, our framework is capable of modeling SWE with a higher accuracy when compared with estimates generated by the Snow Data Assimilation System (SNODAS). The mean value of the coefficient of determination R 2 using our approach was 0.57, and the root-mean-square error (RMSE) was 13 cm, which was a significant improvement over SNODAS (mean R 2 = 0.13; RMSE = 20 cm). We explored the relative importance of the input variables and observed that, at the spatial resolution of 800 m, meteorological variables are more important drivers of predictive accuracy than surface variables that characterize the properties of snow on the ground. This res", "link": "https://doi.org/10.1175/aies-d-22-0010.1", "authors": "Utkarsh Mital, Dipankar Dwivedi, Ilhan Özgen-Xian, James B. Brown, Carl I. Steefel", "source": "Artificial Intelligence for the Earth Systems", "published": "2022-10", "first_seen": "2026-11-23T21:25:47+00:00", "score": 41, "topics": ["Deep Learning"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-7-1525-2026", "title": "Multi-model high-resolution analysis of Tropical-Like Cyclone Daniel with WRF and ICON: peculiarities and sensitivity to convection schemes", "summary": "Medicane Daniel (September 2023) featured a multi-stage transition from a baroclinic disturbance to a compact tropical-like vortex, culminating in a rapid barotropic alignment on 9 September, challenging short-range prediction. This study delivers a side-by-side, high-resolution (∼ 2 km) assessment of Daniel using two state of the art weather forecasting models, WRF and ICON, configured to be as comparable as possible in terms of domain, forcing and vertical discretizations. Seven numerical simulations are compared assessing also sensitivity to the convection scheme: fully explicit, deep-cumulus parameterized and independent shallow-convection options (plus ICON's grayzone setting). Analysis methods include an objective cyclone tracker that combines mean sea-level pressure and lower tropospheric geopotential structure, intensity metrics (central pressure and 10 m wind) along the track, precipitation anomalies regridded against IMERG observations (Integrated Multi-satellitE Retrievals for GPM). Tropical characteristics are examined with Hart's Cyclone Phase Space and Temporal Annular Symmetric Mean (TASM) of equivalent potential temperature and wind to distill three-dimensional, time-mean storm structure during the peak warm-core phase. Both models reproduce Daniel's life cycle and produce realistic tracks. Intensity of the cyclone sharply varies from simulation to simulation, with different behavior of each model at changes in convection scheme. The study emphasizes the different responses of the two models both in reproducing such an extreme meteorological phenomenon and i", "link": "https://doi.org/10.5194/wcd-7-1525-2026", "authors": "Piero Serafini, Antonio Ricchi, Chiara Marsigli, Cristiano D'Amico, Matteo Nastasi, Renata Pelosini", "source": "Weather and Climate Dynamics", "published": "2026-8-26", "first_seen": "2026-11-23T21:25:47+00:00", "score": 41, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-020-05234-1", "title": "Storyline description of Southern Hemisphere midlatitude circulation and precipitation response to greenhouse gas forcing", "summary": "Abstract As evidence of climate change strengthens, knowledge of its regional implications becomes an urgent need for decision making. Current understanding of regional precipitation changes is substantially limited by our understanding of the atmospheric circulation response to climate change, which to a high degree remains uncertain. This uncertainty is reflected in the wide spread in atmospheric circulation changes projected in multimodel ensembles, which cannot be directly interpreted in a probabilistic sense. The uncertainty can instead be represented by studying a discrete set of physically plausible storylines of atmospheric circulation changes. By mining CMIP5 model output, here we take this broader perspective and develop storylines for Southern Hemisphere (SH) midlatitude circulation changes, conditioned on the degree of global-mean warming, based on the climate responses of two remote drivers: the enhanced warming of the tropical upper troposphere and the strengthening of the stratospheric polar vortex. For the three continental domains in the SH, we analyse the precipitation changes under each storyline. To allow comparison with previous studies, we also link both circulation and precipitation changes with those of the Southern Annular Mode. Our results show that the response to tropical warming leads to a strengthening of the midlatitude westerly winds, whilst the response to a delayed breakdown (for DJF) or strengthening (for JJA) of the stratospheric vortex leads to a poleward shift of the westerly winds and the storm tracks. However, the circulation response", "link": "https://doi.org/10.1007/s00382-020-05234-1", "authors": "Julia Mindlin, Theodore G. Shepherd, Carolina S. Vera, Marisol Osman, Giuseppe Zappa, Robert W. Lee", "source": "Climate Dynamics", "published": "2020-5", "first_seen": "2026-11-23T21:25:47+00:00", "score": 41, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "uncertainty"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr-d-20-0102.1", "title": "On the Consequences of PBL Scheme Diffusion on UTLS Wave and Turbulence Representation in High-Resolution NWP Models", "summary": "Abstract Mesoscale numerical weather prediction (NWP) models are routinely exercised at kilometer-scale horizontal grid spacings (Δ x ). Such fine grids will usually allow at least partial resolution of small-scale gravity waves and turbulence in the upper troposphere and lower stratosphere (UTLS). However, planetary boundary layer (PBL) parameterization schemes used with these NWP model simulations typically apply explicit subgrid-scale vertical diffusion throughout the entire vertical extent of the domain, an effect that cannot be ignored. By way of an example case of observed widespread turbulence over the U.S. Great Plains, we demonstrate that the PBL scheme’s mixing in NWP model simulations of Δ x = 1 km can have significant effects on the onset and characteristics of the modeled UTLS gravity waves. Qualitatively, PBL scheme diffusion is found to affect not only background conditions responsible for UTLS wave activity, but also to control the local vertical mixing that triggers or hinders the onset and propagation of these waves. Comparisons are made to a reference large-eddy simulation with Δ x = 250 m to statistically quantify these effects. A significant and systematic overestimation of resolved vertical velocities, wave-scale fluxes, and kinetic energy is uncovered in the 1-km simulations, both in clear-air and in-cloud conditions. These findings are especially relevant for upper-level gravity wave and turbulence simulations using high-resolution kilometer-scale NWP models.", "link": "https://doi.org/10.1175/mwr-d-20-0102.1", "authors": "Domingo Muñoz-Esparza, Robert D. Sharman, Stanley B. Trier", "source": "Monthly Weather Review", "published": "2020-10-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 41, "topics": ["Downscaling", "Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.4351", "title": "An evaluation of ERA5 precipitation for climate monitoring", "summary": "Abstract A key aim of climate monitoring is to place the current conditions of climate variables, such as surface air temperature and precipitation, in their historical context. In Europe, a leading provider of this information is the Copernicus Climate Change Service (C3S), which is implemented by the European Centre for Medium‐Range Weather Forecasts (ECMWF) on behalf of the European Commission. To undertake this activity in close‐to‐real time, C3S predominantly uses the ECMWF ERA5 reanalysis, and ERA5 precipitation is widely used as a proxy for observed precipitation for hydrological monitoring. However, for there to be confidence in the ERA5 data, it is essential to evaluate its ability to capture observed precipitation. In this study, we therefore evaluate ERA5 precipitation against observations globally to inform C3S monitoring activities and the broader climate science community. Using 24 hr precipitation observations at 5,637 stations from 2001 to 2020, results show that the smallest ERA5 random errors occur in the winter Extratropics and the largest ERA5 errors are in the Tropics. The errors grow in the summer Extratropics and the errors in the Tropics move with the intertropical convergence zone. These findings are mirrored in the stable equitable error in probability space (SEEPS) score, with the SEEPS signifying that ERA5 is more able to discriminate between different precipitation events in the Extratropics. In general, an ERA5 wet bias is also found. The assessment of annual maximum 1 day (RX1) precipitation accumulations and four extreme events shows that ERA", "link": "https://doi.org/10.1002/qj.4351", "authors": "David A. Lavers, Adrian Simmons, Freja Vamborg, Mark J. Rodwell", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2022-8-22", "first_seen": "2026-11-23T21:25:47+00:00", "score": 41, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023gl104037", "title": "A Pacific Tropical Decadal Variability Challenge for Climate Models", "summary": "Abstract Understanding and forecasting Tropical Pacific Decadal‐scale Variability (TPDV) strongly rely on climate model simulations. Using a Linear Inverse Modeling (LIM) diagnostic approach, we reveal Coupled Model Intercomparison Project Phase 6 models have significant challenges in reproducing the spatial structure and dominant mechanisms of TPDV. Specifically, while the models' ensemble mean pattern of TPDV resembles that of observations, the spread across models is very large and most models show significant differences from observations. In observations, removing the coupling between extratropics and tropics reduces TPDV by ∼60%–70%, and removing the tropical thermocline variability makes the central tropical Pacific a key center of action for TPDV and El Niño Southern Oscillation variability. These characteristics are only confirmed in a subset of models. Differences between observations and simulations are outside the range of natural internal TPDV noise and pose important questions regarding our ability to model the impacts of natural internal low‐frequency variability superimposed on long‐term climate change.", "link": "https://doi.org/10.1029/2023gl104037", "authors": "Yingying Zhao, Emanuele Di Lorenzo, Matthew Newman, Antonietta Capotondi, Samantha Stevenson", "source": "Geophysical Research Letters", "published": "2023-8-3", "first_seen": "2026-11-23T14:47:49+00:00", "score": 40, "topics": ["Climate Modelling"], "watch": [], "boosts": [], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1007/s00382-011-1032-2", "title": "Computing the distribution of return levels of extreme warm temperatures for future climate projections", "summary": "", "link": "https://doi.org/10.1007/s00382-011-1032-2", "authors": "M. Pausader, D. Bernie, S. Parey, M. Nogaj", "source": "Climate Dynamics", "published": "2011-3-4", "first_seen": "2026-11-23T14:47:49+00:00", "score": 40, "topics": ["Climate Modelling"], "watch": [], "boosts": ["extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ms004019", "title": "WeatherBench 2: A Benchmark for the Next Generation of Data‐Driven Global Weather Models", "summary": "Abstract WeatherBench 2 is an update to the global, medium‐range (1–14 days) weather forecasting benchmark proposed by (Rasp et al., 2020, https://doi.org/10.1029/2020ms002203 ), designed with the aim to accelerate progress in data‐driven weather modeling. WeatherBench 2 consists of an open‐source evaluation framework, publicly available training, ground truth and baseline data as well as a continuously updated website with the latest metrics and state‐of‐the‐art models: https://sites.research.google/weatherbench . This paper describes the design principles of the evaluation framework and presents results for current state‐of‐the‐art physical and data‐driven weather models. The metrics are based on established practices for evaluating weather forecasts at leading operational weather centers. We define a set of headline scores to provide an overview of model performance. In addition, we also discuss caveats in the current evaluation setup and challenges for the future of data‐driven weather forecasting.", "link": "https://doi.org/10.1029/2023ms004019", "authors": "Stephan Rasp, Stephan Hoyer, Alexander Merose, Ian Langmore, Peter Battaglia, Tyler Russell", "source": "Journal of Advances in Modeling Earth Systems", "published": "2024-6", "first_seen": "2026-11-23T21:25:47+00:00", "score": 40, "topics": ["Weather and S2S Forecasting"], "watch": ["Stephan Rasp"], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": true, "cites": null}, {"key": "doi:10.1029/2025ms005210", "title": "Simulating Hurricane Katrina in the Simple Cloud‐Resolving E3SM Atmosphere Model v1", "summary": "Abstract Climate models are important tools for advancing understanding and prediction of tropical cyclones (TCs). Traditional global climate models, however, do not have the ability to properly simulate TC intensity due to their coarse horizontal resolution. Regional models can be run at convection‐permitting resolutions, but these models are often strongly influenced by the data used in the lateral boundary forcing, and domain choice can have a large impact on the simulation. Cloud‐resolving global climate models have demonstrated great potential for realism in TC simulations, and in this study we focus specifically on the Simple Cloud‐Resolving Energy Exascale Earth System Model (E3SM) Atmosphere Model (SCREAM) v1 configuration. We evaluate SCREAMv1 against the observational record and the Weather Research and Forecasting (WRF) model run at a convection‐permitting resolution with Hurricane Katrina as our case study. We found that both models produced realistic simulations of Hurricane Katrina. SCREAMv1 demonstrated skill in simulating TC track, size, and intensity, while the model produced an excessive amount of precipitation. In comparison, WRF more accurately simulated TC precipitation and intensity, although the TC wind extent was smaller than the observations.", "link": "https://doi.org/10.1029/2025ms005210", "authors": "Emily Bercos‐Hickey, Naser Mahfouz, Noel D. Keen, Christina M. Patricola‐DiRosario, Walter M. Hannah, Hassan Beydoun", "source": "Journal of Advances in Modeling Earth Systems", "published": "2025-10", "first_seen": "2026-11-23T21:25:47+00:00", "score": 40, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2020jd033223", "title": "Atmospheric and Land Surface Contributions to Heatwaves: An Australian Perspective", "summary": "Abstract Heatwaves are associated with prolonged hot conditions that accompany a quasi‐stationary anticyclone. This is a consequence of different heat mechanisms including subsidence, horizontal heat advection, and sensible heating from the land surface. Understanding the relative contribution of each of these heat mechanisms is important for improving the predictability of heatwaves. However, the evolution of heatwaves can vary depending upon antecedent conditions, and therefore, it is necessary to examine the role of both atmospheric processes and land surface conditions together. Using a regional climate model, we simulate five heatwaves that occurred over different parts of Australia. Using Lagrangian back‐trajectories to inform the atmospheric flow preceding each of the heatwave events, we perturb the evaporative fraction where and when the flow enters the boundary layer. We aim to understand the role of land surface energy partitioning on two of the heat mechanisms and identify under what circumstances it has limited influence on a heatwave. We find that the sensitivity to changes in land surface energy partitioning varied considerably between the events. Advection was critical by either enhancing the accumulation of heat into the affected location or for dissipating the event by ventilating the region with cooler air. Convective precipitation was triggered when increasing the evaporative fraction due to a warm atmosphere and more moisture supplied by the land surface. Finally, the contribution of each of the heat mechanisms varied between the events due to atmospheri", "link": "https://doi.org/10.1029/2020jd033223", "authors": "Annette L. Hirsch, Malcolm J. King", "source": "JGR: Atmospheres", "published": "2020-9-2", "first_seen": "2026-11-23T21:25:47+00:00", "score": 40, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Latent diffusion emulator of kilometre-scale regional climate", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.4988", "title": "A radar‐based investigation of precipitation growth and decay in South Korea", "summary": "Abstract Understanding precipitation growth and decay (GD) is necessary to improve the predictability of precipitation. Investigating the precipitation GD has been mostly based on an Eulerian approach, which examines the physical characteristics in a fixed coordinate system. In contrast, a Lagrangian approach provides a way to monitor the temporal evolution following the motion of the precipitation system. In this study, we employ a semi‐Lagrangian advection framework to quantitatively retrieve radar‐based GD of precipitation in South Korea. Additionally, we explore the dependence of GD on the following factors: flow direction, flow speed, and relative geographical location to the topography and land–ocean boundary. Our findings reveal that the flow direction significantly influences the spatial distribution of GD. The growth generally tends to occur on the windward side of the mountain range and vice versa on the lee side. The flow speed affects the intensity of GD. Furthermore, we examine the diurnal variability of GD. Due to strong orographic forcing on the diurnal variation, the unique geographical features of South Korea created diurnal patterns near Seoul by land–ocean breeze circulation and on the windward side of the mountain ranges (inland) by solar heating. The GD in South Korea exhibits two diurnal peaks of growth: an early morning peak over the ocean and an afternoon peak on the land. A monthly variation is also observed, with the most intense growth taking place in August. The findings of this study will aid in improving nowcasting algorithms that account for g", "link": "https://doi.org/10.1002/qj.4988", "authors": "Kwonil Kim, Chia‐Lun Tsai, GyuWon Lee", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2025-4-14", "first_seen": "2026-11-23T21:25:47+00:00", "score": 40, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2024jd041822", "title": "Enhancing Short‐Term Wind Speed Prediction Capability of Numerical Weather Prediction Through Machine Learning Methods", "summary": "Abstract Accurate forecasting of wind speed is essential for daily life and social production. While numerical weather prediction products are widely used, they rely on global data and mathematical models to solve atmospheric dynamics' equations, often failing to capture localized micrometeorological phenomena accurately. Factors such as surface conditions, land‐sea differences, and topography, particularly in coastal areas, further impact the accuracy of wind speed forecasts. This study presents a new method to enhance short‐term wind speed forecasting along China's coast by incorporating local and neighborhood spatiotemporal information. The approach integrates meteorological data from adjacent grid points as new inputs in the LightGBM, CatBoost, and XGBoost algorithms. Stacking ensemble technique is then employed to effectively combine with the aforementioned foundational models. Two sets of experiments are conducted: Experiments 1 exclude surrounding information, while Experiments 2 include it. Each set consists of five experiment groups: annual, spring, summer, autumn, and winter. Within each group, four models are tested: XGBoost, LightGBM, CatBoost, and stacking. Results show that incorporating surrounding site information improves forecast accuracy. In all five groups with added surrounding site information, the stacking model performs best. Compared to ECMWF forecast data, the stacking model improves wind speed forecast accuracy from 53.3%, 50.9%, 55.2%, 53.0%, and 54.0% to 77.2%, 73.1%, 76.7%, 78.2%, and 77.1%, respectively. These findings demonstrate the potentia", "link": "https://doi.org/10.1029/2024jd041822", "authors": "Zhaoliang Zeng, Honglei Wu, Zhaohua Liu, Linna Zhao, Zhaoming Liang, Zhehao Liang", "source": "JGR: Atmospheres", "published": "2024-12-23", "first_seen": "2026-11-23T14:47:49+00:00", "score": 39, "topics": ["Deep Learning", "Weather and S2S Forecasting"], "watch": [], "boosts": [], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2611.25119", "title": "Auditing Learned Dynamics in Weather Models", "summary": "Learned weather models are experimentally accessible computational systems whose internal representations can be inspected and manipulated. Using sparse autoencoder features from GraphCast, DeepMind's autoregressive weather forecasting model, we test whether causal relevance requires physical semantics, a question that matters for auditing whether AI forecasters used in high-assurance settings rely on reliable mechanisms. We also look at whether physically associated latent directions can be steered to improve extreme-event forecasts, where interventions are applied to the model's internal activations during the rollout. We find that ablating a feature locked to GraphCast's computational mesh increases global geopotential height error despite lacking conventional physical semantics. Second, suppressing convection- and low-level-vorticity-associated features weakens predicted tropical-cyclone deepening (the fall in central pressure during intensification), while amplifying them reduces intensity error, with amplification of convection features through feature scaling achieving a median of 51\\% error reduction over seven storms. Together, these results separate interpretable, physical association from causal utility and establish sparse features as experimental coordinates for auditing and intervening on learned weather dynamics.", "link": "https://arxiv.org/abs/2611.25119", "authors": "Skylar Gu, Christina Last", "source": "arXiv", "published": "2026-11-18T19:58:01Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 39, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2606.03572", "title": "GeoVolDiff: Taming 3D Geological Volumes with Latent Diffusion", "summary": "Deep learning has become a prevailing paradigm across a wide range of geophysical applications. Yet most existing studies concentrate on methodological refinements -- novel network architectures, physics-informed constraints, or taskspecific loss functions -- while paying comparatively little attention to a more fundamental challenge of any data-driven approach: the availability and representativeness of high-quality training data. This limitation is especially pronounced in geophysics. Unlike computer vision, which benefits from large-scale, well-curated benchmarks such as ImageNet, comparably abundant and reliably labelled geophysical data are prohibitively expensive to acquire and, in most field settings, lack accessible ground-truth supervision. To alleviate this data deficiency, we propose GeoVolDiff, a generative framework for three-dimensional geological volumes. It comprises three coupled stages: (i) constructing a foundational training corpus through physics-based forward simulation; (ii) training a Latent Diffusion Model (LDM) to capture the statistical distribution of 3D geological structures; and (iii) synthesizing diverse, structurally plausible volumes at scale for downstream geophysical tasks. We examine the utility of the synthesized data on a representative downstream task, seismic impedance inversion. Without incorporating any additional physical or geological prior, inversion networks pre-trained exclusively on synthesized data attain competitive performance on both synthetic and field datasets, indicating that data synthesised by the generative model can", "link": "https://arxiv.org/abs/2606.03572", "authors": "Qi Pang, Hongling Chen, Jinghuai Gao", "source": "arXiv", "published": "2026-06-02T12:40:06Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 39, "topics": ["Deep Learning"], "watch": [], "boosts": ["diffusion model"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2025ea004876", "title": "Advancing Toward Gray Zone: Evaluation of Tropical Cyclones in Key Basins With the 12.5 km High Resolution CAS FGOALS‐f3 M , "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-2-489-2021", "title": "Seasonal climate influences on the timing of the Australian monsoon onset", "summary": "The timing of the first monsoon burst of the season, or the monsoon onset, can be a critical piece of information for agriculture, fire management, water management, and emergency response in monsoon regions. Why do some monsoon seasons start earlier or later than others? Previous research has investigated the impact of climate influences such as the El Niño–Southern Oscillation (ENSO) on monsoon variability, but most studies have considered only the impact on rainfall and not the timing of the onset. While this question could be applied to any monsoon system, this research presented in this paper has focused on the Australian monsoon. Even with the wealth of research available on the variability of the Australian monsoon season, the timing of the monsoon onset is one aspect of seasonal variability that still lacks skilful seasonal prediction. To help us better understand the influence of large-scale climate drivers on monsoon onset timing, we recreated 11 previously published Australian monsoon onset datasets and extended these to all cover the same period from the 1950/1951 through the 2020/2021 Australian wet seasons. The extended datasets were then tested for correlations with several standard climate indices to identify which climate drivers could be used as predictors for monsoon onset timing. The results show that many of the relationships between monsoon onset dates and ENSO that were previously published are not as strong when considering the extended datasets. Only a strong La Niña pattern usually has an impact on monsoon onset timing, while ENSO-neutral and El Ni", "link": "https://doi.org/10.5194/wcd-2-489-2021", "authors": "Joel Lisonbee, Joachim Ribbe", "source": "Weather and Climate Dynamics", "published": "2021-6-11", "first_seen": "2026-11-23T21:25:47+00:00", "score": 39, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["india", "monsoon"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-4-773-2023", "title": "Classification of large-scale environments that drive the formation of mesoscale convective systems over southern West Africa", "summary": "Mesoscale convective systems (MCSs) are frequently observed over southern West Africa (SWA) throughout most of the year. These MCS events are the dominant rain-bearing systems, contributing over 50 % of annual rainfall over SWA. However, it has not yet been identified what variations in typical large-scale environments of the seasonal cycle of the West African monsoon may favour MCS occurrence in this region. Here, nine distinct synoptic states are identified and are further associated with being a synoptic-circulation type of either a dry, transition, or monsoon season using self-organizing maps (SOMs) with inputs from reanalysis data. We identified a pronounced annual cycle of MCS numbers with frequency peaks in April and October that can be associated with the start of rainfall during the major rainy season and the maximum rainfall for the minor rainy season across SWA, respectively. Comparing daily MCS frequencies, MCSs are most likely to develop during transition conditions featuring a northward-displaced moisture anomaly (2.8 MCSs per day), which can be linked to strengthened low-level westerlies. Considering that these transition conditions occur predominantly during the pre- and post-monsoon period, these patterns may in some cases be representative of monsoon onset conditions or a delayed monsoon retreat. On the other hand, under monsoon conditions, we observe weakened low-level south-westerlies during MCS days, which reduce moisture content over the Sahel but introduce more moisture over the coast. Finally, we find a majority of MCS-day synoptic states exhibiting ", "link": "https://doi.org/10.5194/wcd-4-773-2023", "authors": "Francis Nkrumah, Cornelia Klein, Kwesi Akumenyi Quagraine, Rebecca Berkoh-Oforiwaa, Nana Ama Browne Klutse, Patrick Essien", "source": "Weather and Climate Dynamics", "published": "2023-9-6", "first_seen": "2026-11-23T21:25:47+00:00", "score": 39, "topics": ["Climate Modelling"], "watch": [], "boosts": ["monsoon"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr-d-15-0205.1", "title": "Clustering of Regional-Scale Extreme Precipitation Events in Southern Switzerland", "summary": "Abstract Temporal clustering of extreme precipitation events on subseasonal time scales is of crucial importance for the formation of large-scale flood events. Here, the temporal clustering of regional-scale extreme precipitation events in southern Switzerland is studied. These precipitation events are relevant for the flooding of lakes in southern Switzerland and northern Italy. This research determines whether temporal clustering is present and then identifies the dynamics that are responsible for the clustering. An observation-based gridded precipitation dataset of Swiss daily rainfall sums and ECMWF reanalysis datasets are used. Also used is a modified version of Ripley’s K function, which determines the average number of extreme events in a time period, to characterize temporal clustering on subseasonal time scales and to determine the statistical significance of the clustering. Significant clustering of regional-scale precipitation extremes is found on subseasonal time scales during the fall season. Four high-impact clustering episodes are then selected and the dynamics responsible for the clustering are examined. During the four clustering episodes, all heavy precipitation events were associated with an upper-level breaking Rossby wave over western Europe and in most cases strong diabatic processes upstream over the Atlantic played a role in the amplification of these breaking waves. Atmospheric blocking downstream over eastern Europe supported this wave breaking during two of the clustering episodes. During one of the clustering periods, several extratropical transi", "link": "https://doi.org/10.1175/mwr-d-15-0205.1", "authors": "Yannick Barton, Paraskevi Giannakaki, Harald von Waldow, Clément Chevalier, Stephan Pfahl, Olivia Martius", "source": "Monthly Weather Review", "published": "2016-1-1", "first_seen": "2026-11-23T21:25:47+00:00", "score": 39, "topics": ["Climate Modelling", "Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2020jd032874", "title": "Historical Evaluation and Future Projections of 100‐m Wind Energy Potentials Over CORDEX‐East Asia", "summary": "Abstract Countries in East Asia have set ambitious goals for the development of wind energy to meet the increasing energy demand and to mitigate anthropogenic climate change. However, few studies have investigated changes in wind energy over East Asia under future climatic conditions. In this study, we investigate future changes of 100‐m wind speed and wind energy potential over the CORDEX‐East Asia region under the Representative Concentration Pathway (RCP) 8.5 scenario, by using ensemble simulations from the regional climate model Consortium for small‐scale modeling in CLimate Mode (CCLM). A multivariate bias adjustment method based on the N ‐dimensional probability density function transform is used to correct raw simulated horizontal wind components. The comparison between future climate (2021–2050 and 2070–2099) and the present climate (1971–2000) shows decreases in wind speed, wind power density, and wind energy output over most of the CORDEX‐East Asia region, especially in the tropics. Projected increases are pronounced over the Himalayan regions, the Indo‐China Peninsula, the South China Sea, and the western Pacific Ocean in summer and over northeastern China, parts of Western China and the Indo‐China Peninsula in winter. Interannual and intra‐annual variability of wind power density are projected to intensify significantly for most of the CORDEX‐East Asia region. The occurrence of weak wind speeds (<3 m/s) is projected to increase, while strong wind speeds (>11 m/s) are projected to decrease over most of the ocean.", "link": "https://doi.org/10.1029/2020jd032874", "authors": "Delei Li, Jianlong Feng, Alessandro Dosio, Jifeng Qi, Zhenhua Xu, Baoshu Yin", "source": "JGR: Atmospheres", "published": "2020-7-29", "first_seen": "2026-11-23T21:25:47+00:00", "score": 38, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["himalaya"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/wcd-3-555-2022", "title": "Summertime changes in climate extremes over the peripheral Arctic regions after a sudden sea ice retreat", "summary": "The retreat of Arctic sea ice is frequently considered to be a possible driver of changes in climate extremes in the Arctic and possibly down to mid-latitudes. However, it remains unclear how the atmosphere will respond to a near-total retreat of summer Arctic sea ice, a reality that might occur in the foreseeable future. This study explores this question by conducting sensitivity experiments with two global coupled climate models run at two different horizontal resolutions to investigate the change in temperature and precipitation extremes during summer over peripheral Arctic regions following a sudden reduction in summer Arctic sea ice cover. An increase in frequency and persistence of maximum surface air temperature is found in all peripheral Arctic regions during the summer, when sea ice loss occurs. For each 1×10 6 km 2 of Arctic sea ice extent reduction, the absolute frequency of days exceeding the surface air temperature of the climatological 90th percentile increases by ∼ 4 % over the Svalbard area, and the duration of warm spells increases by ∼ 1 d per month over the same region. Furthermore, we find that the 10th percentile of surface daily air temperature increases more than the 90th percentile, leading to a weakened diurnal cycle of surface air temperature. Finally, an increase in extreme precipitation, which is less robust than the increase in extreme temperatures, is found in all regions in summer. These findings suggest that a sudden retreat of summer Arctic sea ice clearly impacts the extremes in maximum surface air temperature and precipitation over the per", "link": "https://doi.org/10.5194/wcd-3-555-2022", "authors": "Steve Delhaye, Thierry Fichefet, François Massonnet, David Docquier, Rym Msadek, Svenya Chripko", "source": "Weather and Climate Dynamics", "published": "2022-5-11", "first_seen": "2026-11-23T21:25:47+00:00", "score": 38, "topics": ["Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/mwr-d-16-0041.1", "title": "Impact of Warmer Eastern Tropical Pacific SST on the March 2015 Atacama Floods", "summary": "Abstract Northern Chile hosts the driest place on Earth in the Atacama Desert. Nonetheless, an extreme precipitation event affected the region on 24–26 March 2015 with 1-day accumulated precipitation exceeding 40 mm in several locations and hourly mean rainfall rates higher than 10 mm h −1 , producing floods and resulting in casualties and significant damage. The event is analyzed using ERA-Interim, surface station data, sounding observations, and satellite-based radar. Two main conditions favorable for precipitation were present at the time of the event: (i) a cutoff low (COL) off the coast of northern Chile and (ii) positive sea surface temperature (SST) anomalies over the eastern tropical Pacific. The circulation driven by the COL was strong but not extraordinary. Regional Climate Model, version 4 (RegCM4), is used to test the sensitivity of precipitation to SST anomalies by removing the warm SST anomaly in the eastern tropical Pacific. The cooler simulation produced very similar COL dry dynamics to that simulated in a control run (with observed SST), but suppressed the precipitation by 60%–80% over northern Chile and 100% in parts of the Atacama Desert due to the decreased availability of precipitable water. The results indicate that the warm SST anomaly over the eastern Pacific, favored by the onset of El Niño 2015/16, was instrumental to the extreme precipitation event by providing an anomalous source of water vapor transported to Atacama by the circulation ahead of the COL.", "link": "https://doi.org/10.1175/mwr-d-16-0041.1", "authors": "Deniz Bozkurt, Roberto Rondanelli, René Garreaud, Andrés Arriagada", "source": "Monthly Weather Review", "published": "2016-11", "first_seen": "2026-11-23T21:25:47+00:00", "score": 38, "topics": ["Downscaling", "Climate Modelling"], "watch": [], "boosts": ["precipitation", "extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.5194/gmd-13-2945-2020", "title": "Observations for Model Intercomparison Project (Obs4MIPs): status for CMIP6", "summary": "The Observations for Model Intercomparison Project (Obs4MIPs) was initiated in 2010 to facilitate the use of observations in climate model evaluation and research, with a particular target being the Coupled Model Intercomparison Project (CMIP), a major initiative of the World Climate Research Programme (WCRP). To this end, Obs4MIPs (1) targets observed variables that can be compared to CMIP model variables; (2) utilizes dataset formatting specifications and metadata requirements closely aligned with CMIP model output; (3) provides brief technical documentation for each dataset, designed for nonexperts and tailored towards relevance for model evaluation, including information on uncertainty, dataset merits, and limitations; and (4) disseminates the data through the Earth System Grid Federation (ESGF) platforms, making the observations searchable and accessible via the same portals as the model output. Taken together, these characteristics of the organization and structure of obs4MIPs should entice a more diverse community of researchers to engage in the comparison of model output with observations and to contribute to a more comprehensive evaluation of the climate models. At present, the number of obs4MIPs datasets has grown to about 80; many are undergoing updates, with another 20 or so in preparation, and more than 100 are proposed and under consideration. A partial list of current global satellite-based datasets includes humidity and temperature profiles; a wide range of cloud and aerosol observations; ocean surface wind, temperature, height, and sea ice fraction; surface", "link": "https://doi.org/10.5194/gmd-13-2945-2020", "authors": "Duane Waliser, Peter J. Gleckler, Robert Ferraro, Karl E. Taylor, Sasha Ames, James Biard", "source": "Geoscientific Model Development", "published": "2020-7-7", "first_seen": "2026-11-23T14:47:49+00:00", "score": 37, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "uncertainty"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1002/qj.70353", "title": "The impact of A eolus observations on extreme weather events in a mesoscale numerical weather prediction system", "summary": "Abstract The impact of assimilating horizontal line‐of‐sight wind observations from the Doppler wind lidar onboard the Aeolus satellite into a regional numerical weather prediction system for Japan and the surrounding region was evaluated using observing system experiments (OSEs). The OSEs were conducted using the Japan Meteorological Agency's mesoscale analysis and forecast system, with a particular focus on heavy rainfall events associated with quasi‐stationary convective bands and typhoons. The fit of the background fields to other wind and relative humidity observations was improved, particularly over the oceans. During the July 2020 heavy rainfall event, improved wind forecast accuracy in the surrounding environment 12 hr prior to the event contributed to a better representation of the humidity field, leading to an extended lead time for heavy rainfall prediction. In contrast, the impact on typhoons in 2020 was not robust, although improvements in track and intensity forecasts were found in some cases. The findings suggest that the positive impact on severe weather forecasts arises primarily from improvements in the surrounding environmental fields through cycled analyses, rather than from the direct assimilation impact along the satellite tracks.", "link": "https://doi.org/10.1002/qj.70353", "authors": "Izumi Okabe, Kozo Okamoto", "source": "Quarterly Journal of the Royal Meteorological Society", "published": "2026-11-23", "first_seen": "2026-11-23T14:47:49+00:00", "score": 37, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["extreme"], "why": {"title": "Resolution effects on climate impact indicators", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2610.23094", "title": "Graph-Learned Spring SST Evolution and Land-Ocean Synergy Improve Yangtze Summer Rainfall Prediction", "summary": "Seasonal prediction of Yangtze summer rainfall is challenged by nonstationary oceanic precursors. Here we demonstrate that accounting for the evolution of spring SST and state-dependent land surface information improves predictability. Graph total variation (GTV) is applied to March-May SST fields over the western Pacific, Niño3.4, and tropical Indian Ocean to identify spatially coherent, month-specific SST coefficients for each grid cell and month to form a scalar GTV index. The learned coefficient patterns capture April-to-May ENSO decay and an opposing Indian Ocean adjustment, consistent with coupled Indo-Pacific variability. During 2008-2022, the GTV index prediction outperforms Niño3.4-based and sparse-regression benchmarks. Further improvement is achieved by including interactions of May Indo-China Peninsula soil moisture with Indian Ocean SST, importantly also correcting several underestimated wet summers. Circulation diagnostics associate the learned index with a summer geopotential-height dipole and Yangtze moisture convergence, while dry-Indochina/warm-Indian-Ocean conditions coincide with stronger westward extension of the western Pacific subtropical high.", "link": "https://arxiv.org/abs/2610.23094", "authors": "Yifu Gao, Haishan Chen, Runze Li, Efi Foufoula-Georgiou, Jasper A. Vrugt", "source": "arXiv", "published": "2026-10-16T08:05:41Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 37, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["india"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2604.10890", "title": "Forecasting Return Time of Extreme Precipitation by Large Deviation Theory", "summary": "Forecasting extreme precipitation is essential yet challenging due to its rarity and complexity. We develop a large deviation framework to estimate the return times of extreme precipitation events. We first find that the Landau distribution, originally introduced in plasma physics, accurately captures extreme precipitation at approximately 93% of global locations, outperforming conventional extreme value distributions with 76% matched locations under the same accuracy criterion. Enriching rare event samples by the fitted Landau distribution, we obtain more accurate estimates of large deviation rate functions and return times, enabling forecasts beyond historically observed precipitation intensities. Mapping historical return times to future projections from the Coupled Model Intercomparison Project Phase 6 (CMIP6), we show that return time curves under different emission scenarios collapse onto a unified relation, revealing a sharply increased lifetime exposure to extreme precipitation for 21st-century birth cohorts under most future emission scenarios.", "link": "https://arxiv.org/abs/2604.10890", "authors": "Haotian Xie, Haoxian Liu, Jingfang Fan, Ying Tang", "source": "arXiv", "published": "2026-04-13T01:37:26Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 37, "topics": ["Climate Modelling"], "watch": [], "boosts": ["cmip6", "precipitation", "extreme"], "why": {"title": "Generative precipitation downscaling over India", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "arxiv:2602.06429", "title": "Reclaiming First Principles: A Differentiable Framework for Conceptual Hydrologic Models", "summary": "Conceptual hydrologic models remain the cornerstone of rainfall-runoff modeling, yet their calibration is often slow and numerically fragile. Most gradient-based parameter estimation methods rely on finite-difference approximations or automatic differentiation frameworks (e.g., JAX, PyTorch and TensorFlow), which are computationally demanding and introduce truncation errors, solver instabilities, and substantial overhead. These limitations are particularly acute for the ODE systems of conceptual watershed models. Here we introduce a fully analytic and computationally efficient framework for differentiable hydrologic modeling based on exact parameter sensitivities. By augmenting the governing ODE system with sensitivity equations, we jointly evolve the model states and the Jacobian matrix with respect to all parameters. This Jacobian then provides fully analytic gradient vectors for any differentiable loss function. These include classical objective functions such as the sum of absolute and squared residuals, widely used hydrologic performance metrics such as the Nash-Sutcliffe and Kling-Gupta efficiencies, robust loss functions that down-weight extreme events, and hydrograph-based functionals such as flow-duration and recession curves. The analytic sensitivities eliminate the step-size dependence and noise inherent to numerical differentiation, while avoiding the instability of adjoint methods and the overhead of modern machine-learning autodiff toolchains. The resulting gradients are deterministic, physically interpretable, and straightforward to embed in gradient-based op", "link": "https://arxiv.org/abs/2602.06429", "authors": "Jasper A. Vrugt, Jonathan M. Frame, Ethan Bollman", "source": "arXiv", "published": "2026-02-06T06:55:49Z", "first_seen": "2026-11-23T21:25:47+00:00", "score": 37, "topics": ["Deep Learning"], "watch": [], "boosts": ["extreme"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1175/aies-d-23-0087.1", "title": "Generative Algorithms for Fusion of Physics-Based Wildfire Spread Models with Satellite Data for Initializing Wildfire Forecasts", "summary": "Abstract Increases in wildfire activity and the resulting impacts have prompted the development of high-resolution wildfire behavior models for forecasting fire spread. Recent progress in using satellites to detect fire locations further provides the opportunity to use measurements toward improving fire spread forecasts from numerical models through data assimilation. This work develops a physics-informed approach for inferring the history of a wildfire from satellite measurements, providing the necessary information to initialize coupled atmosphere–wildfire models from a measured wildfire state. The fire arrival time, which is the time the fire reaches a given spatial location, acts as a succinct representation of the history of a wildfire. In this work, a conditional Wasserstein generative adversarial network (cWGAN), trained with WRF–SFIRE simulations, is used to infer the fire arrival time from satellite active fire data. The cWGAN is used to produce samples of likely fire arrival times from the conditional distribution of arrival times given satellite active fire detections. Samples produced by the cWGAN are further used to assess the uncertainty of predictions. The cWGAN is tested on four California wildfires occurring between 2020 and 2022, and predictions for fire extent are compared against high-resolution airborne infrared measurements. Further, the predicted ignition times are compared with reported ignition times. An average Sørensen’s coefficient of 0.81 for the fire perimeters and an average ignition time difference of 32 min suggest that the method is highly ", "link": "https://doi.org/10.1175/aies-d-23-0087.1", "authors": "Bryan Shaddy, Deep Ray, Angel Farguell, Valentina Calaza, Jan Mandel, James Haley", "source": "Artificial Intelligence for the Earth Systems", "published": "2024-7", "first_seen": "2026-11-23T21:25:47+00:00", "score": 37, "topics": ["Deep Learning"], "watch": [], "boosts": ["uncertainty"], "why": {"title": "Deep learning super-resolution for temperature data downscaling: a comprehensive study using residual networks", "src": "your paper"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2025ms005610", "title": "TOMO4D Operator for Assimilation of GNSS Tomography‐Derived Water Vapor Fields Into the WRFDA 4DVAR System to Improve Regional Rainfall Forecasting", "summary": "Abstract Accurate representation of atmospheric water vapor is crucial for improving numerical weather prediction, particularly over regions with complex topography and sparse observation networks. Although assimilation of Global Navigation Satellite System (GNSS)‐derived integrated products such as zenith total delay or precipitable water vapor can improve humidity analyses, these approaches are limited by their lack of vertical resolution. This study introduces TOMO4D, a new four‐dimensional (4D) observation operator developed to assimilate GNSS tomography‐derived voxel‐based wet refractivity ( N w ) fields directly into the WRFDA four‐dimensional variational (4DVAR) system. Performance is evaluated for two heavy rainfall events over northern and northwestern Iran (23–24 October 2022). Three experiments are conducted: CTRL (no assimilation), TOMO3DVAR (3DVAR tomography assimilation), and TOMO4D (4DVAR tomography assimilation). Radiosonde (RS) validation at Tehran and Tabriz shows that TOMO4D improves the thermodynamic structure of the troposphere, reducing relative humidity RMSE by up to 38% and temperature RMSE by 9%–11% compared to CTRL, while decreasing temperature bias to within ±0.3K. Verification against 16 SYNOP stations further indicates that TOMO4D reduces accumulated precipitation RMSE by ∼17% and increases correlation by 35.3%. TOMO3DVAR results consistently fall between CTRL and TOMO4D, confirming that voxel‐based tomography improves moisture initialization even in 3DVAR, while the additional TOMO4D gains arise from time‐consistent assimilation within the 4DVA", "link": "https://doi.org/10.1029/2025ms005610", "authors": "Arash Tayfehrostami, Yazdan Amerian, Saeed Izanlou, Majid Azadi", "source": "Journal of Advances in Modeling Earth Systems", "published": "2026-4", "first_seen": "2026-11-23T21:25:47+00:00", "score": 37, "topics": ["Weather and S2S Forecasting"], "watch": [], "boosts": ["precipitation"], "why": {"title": "Probabilistic hydrology with generative models", "src": "your interests"}, "kind": "paper", "pick": false, "cites": null}, {"key": "doi:10.1029/2023ms004106", "title": "Impacts of Vertical Convective Mixing Schemes and Freshwater Forcing on the 2016–2017 Maud Rise Polynya Openings in a Regional Ocean Simulation", "summary": "Abstract The correct representation of the Maud Rise open‐ocean polynya in the Weddell Sea remains a challenge for ocean models. Here we reproduce the most recent polynya openings in 2016–2017 using a regional configuration, and assess their dependencies on vertical convective mixing schemes and freshwater forcing, both separately and in combination. We test three vertical convective mixing schemes: the enhanced vertical diffusion (EVD), the Eddy‐Diffusivity Mass‐Flux (EDMF) parameterization, and a modified version of EDMF accounting for thermobaric effects. Using simulations for the period 2007–2017, we find that the modified EDMF reproduces the observed climatological evolution of the mixed layer depth better than the original EDMF and the EVD, but a polynya fails to open due to excessive freshwater forcing. We thus use the modified EDMF to perform sensitivity experiments with reduced precipitation during 2012–2017. The imposed freshwater forcing strongly affects the number of years with polynyas. The simulation with the best representation of the 2016–2017 polynyas is analyzed to evaluate the triggering mechanisms. The 2016 polynya was induced by the action of thermobaric instabilities on a weak ambient stratification. This opening preconditioned the water column for 2017, which produced a stronger polynya. By examining the impacts of the different convective mixing schemes, we show that the modified EDMF generates more realistic patterns of deep convection. Our results highlight the importance of surface freshwater forcing and thermobaricity in governing deep convection", "link": "https://doi.org/10.1029/2023ms004106", "authors": "Birte Gülk, Fabien Roquet, Alberto C. Naveira Garabato, Romain Bourdallé‐Badie, Gurvan Madec, He
