# Research feed settings. Edit this file on GitHub to change what the feed collects.
# The feed is rebuilt every day and published at https://g-jha-g.github.io/feed/

title: "Shailesh's research feed: downscaling, deep learning, climate modelling, weather and S2S"
site: "https://g-jha-g.github.io/feed/"
contact_email: "shaileshskj4@gmail.com"   # sent to Crossref as a polite contact, as their API asks

keep_days: 30        # how long an item stays in the feed after it first appears
max_items: 300       # paper limit (citations and jobs are extra)
min_score: 3         # items scoring below this are dropped (see scoring at the end of this file)

# Topics and the words that signal them. Matching ignores case. A word ending in * matches any ending,
# so "downscal*" matches downscaling, downscaled and downscale.
topics:
  Downscaling:
    - downscal*
    - super-resolution
    - super resolution
    - bias correction
    - bias-correction
    - regional climate model*
    - convection-permitting
    - kilometre-scale
    - kilometer-scale
    - km-scale
  Deep Learning:
    - deep learning
    - machine learning
    - neural network*
    - neural operator*
    - diffusion model*
    - score-based
    - flow matching
    - generative model*
    - generative adversarial
    - transformer*
    - u-net
    - unet
    - convolutional
    - graph neural
    - foundation model*
    - emulat*
    - artificial intelligence
    - data-driven
  Climate Modelling:
    - climate model*
    - earth system model*
    - cmip*
    - general circulation model*
    - climate projection*
    - climate simulation*
    - parameteri*
    - climate change scenario*
    - ssp*-*
    - reanalysis
  Weather and S2S Forecasting:
    - weather forecast*
    - weather prediction
    - numerical weather prediction
    - nwp
    - medium-range
    - subseasonal
    - sub-seasonal
    - s2s
    - seasonal forecast*
    - seasonal prediction
    - nowcast*
    - ensemble forecast*
    - post-processing
    - postprocessing
    - forecast skill

# Preprints from arXiv. Each entry is an arXiv API search query.
arxiv:
  - name: "arXiv: atmospheric and oceanic physics"
    query: "cat:physics.ao-ph"
  - name: "arXiv: machine learning applied to weather and climate"
    query: "(cat:cs.LG OR cat:stat.ML OR cat:cs.CV OR cat:physics.comp-ph) AND (abs:climate OR abs:weather OR abs:downscaling OR abs:precipitation OR abs:atmospheric OR abs:subseasonal)"
  - name: "arXiv: geophysics"
    query: "cat:physics.geo-ph AND (abs:\"deep learning\" OR abs:\"machine learning\" OR abs:downscaling OR abs:forecast)"

