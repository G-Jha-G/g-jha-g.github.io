# Google Scholar alerts. Scholar only sends alerts by email; turn them into a feed with
# https://kill-the-newsletter.com and paste the Atom feed link it gives you below.
# Scholar alert items are always kept (including citation alerts with no keyword) and rank higher.
scholar_feeds:
  # - "https://kill-the-newsletter.com/feeds/REPLACE-WITH-YOUR-ID.xml"

# Scoring: each topic word found in a title adds 3, in an abstract adds 1 (counted once per topic).
# An item that pairs Deep Learning with any other topic gets +3, because that pairing is the core
# of this feed. Scholar alert items get +5. Items need at least min_score to be kept.

# ---------- personal ranking ----------
# Each of these words found in a title or abstract adds 2 to the score (at most 4 in total).
boost:
  - india*
  - himalaya*
  - monsoon
  - cmip6
  - precipitation
  - extreme*
  - flow matching
  - diffusion model*
  - emulator*
  - uncertainty
# Any of these lowers the score by 3, to push out near-misses (for example ocean-only bias correction).
downweight:
  - ocean wave*
  - sea surface wave*
  - ocean surface wave*
  - significant wave height
  - wind turbine*
  - air quality
  - traffic

